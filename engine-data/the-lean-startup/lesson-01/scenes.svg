<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LEAN STARTUP · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why great plans build</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">unwanted products.</text>
<text class="b" x="120" y="600" font-size="32">Why following the plan perfectly can still lead to failure.</text>
<rect class="ink" x="1180" y="240" width="300" height="46" rx="6"/>
<rect class="s-ink" x="1200" y="286" width="260" height="280" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1220 510H1440" stroke-width="6" stroke-linecap="round"/>
<g id="tbox"><rect class="gain" x="1290" y="440" width="80" height="70" rx="6"/><path d="M1312 476l12 12 24-26" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ghosts"></g>
<g id="tnone"><text class="m" x="1330" y="740" font-size="20" text-anchor="middle" style="fill:var(--loss)">NOBODY WANTS IT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What is a startup?</text>
<text class="b" x="120" y="176" font-size="32">Eric Ries’s definition: something new, an unclear outcome.</text>
<g id="ries"><text class="m" x="260" y="540" font-size="20" text-anchor="middle">ERIC RIES</text></g>
<path id="rarc" class="s-muted" d="M340 400Q460 340 580 420" fill="none" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<g id="team"><rect class="gain" x="740" y="430" width="120" height="90" rx="12"/><text class="m" x="800" y="484" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">NEW</text><text class="m" x="800" y="720" font-size="20" text-anchor="middle">ANY TEAM MAKING SOMETHING NEW</text></g>
<g id="qms"></g>
<g id="quote"><text class="d" x="120" y="800" font-size="46">“Conditions of extreme uncertainty.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not just garages.</text>
<text class="b" x="120" y="176" font-size="32">Two founders, or a small team inside a giant company.</text>
<g id="gar"><path class="s-ink" d="M160 470L360 330L560 470" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-ink" x="190" y="470" width="340" height="290" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="230" y="540" width="260" height="220" fill="none" stroke-width="5"/><path class="s-line" d="M230 570h260M230 710h260" stroke-width="3"/><text class="m" x="360" y="800" font-size="20" text-anchor="middle">TWO FOUNDERS IN A GARAGE</text></g>
<g id="tow"><rect class="s-ink" x="1000" y="230" width="300" height="530" fill="var(--stage)" stroke-width="6"/><g id="tw"></g><text class="m" x="1150" y="800" font-size="20" text-anchor="middle">A TEAM IN A GIANT COMPANY</text></g>
<g id="floor"><rect class="gain" x="1015" y="580" width="270" height="50" rx="8"/><circle cx="1110" cy="605" r="12" fill="var(--on-gain)"/><circle cx="1150" cy="605" r="12" fill="var(--on-gain)"/><circle cx="1190" cy="605" r="12" fill="var(--on-gain)"/></g>
<g id="notsize"><text class="d" x="360" y="300" font-size="56" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d" x="780" y="520" font-size="120" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d" x="1400" y="300" font-size="56" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d" x="120" y="852" font-size="40">Not size: how little anyone knows.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why plans feel safe.</text>
<text class="b" x="120" y="176" font-size="32">Forecasts work when there’s history to predict from.</text>
<g id="pp0"><rect class="s-line" x="120" y="230" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="230" y="270" width="200" height="260" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M260 310h140M260 340h100" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M260 380V500H400" fill="none" stroke-width="4"/><polyline class="s-gain" points="270,490 310,470 350,430 395,390" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="330" y="640" font-size="20" text-anchor="middle">PLANS &amp; FORECASTS</text></g>
<g id="pp1"><rect class="s-line" x="590" y="230" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M640 520V420l70-40v40l70-40v40l70-40v40h30V320h40V520Z"/><g id="hist"></g><text class="m" x="800" y="640" font-size="20" text-anchor="middle">STEADY BUSINESS</text><text class="m" x="800" y="672" font-size="20" text-anchor="middle">YEARS OF HISTORY</text></g>
<g id="pp2"><rect class="s-line" x="1060" y="230" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M1200 560L1220 520H1320L1340 560Z"/><circle class="s-ink" cx="1270" cy="420" r="110" fill="var(--stage)" stroke-width="6"/><text id="ballq" class="d" x="1270" y="466" font-size="130" text-anchor="middle" style="fill:var(--loss)">?</text><text class="m" x="1270" y="640" font-size="20" text-anchor="middle">NO HISTORY</text><text class="m" x="1270" y="672" font-size="20" text-anchor="middle">GUESSES DRESSED AS FACTS</text></g>
<g id="fbot"><text class="d" x="120" y="800" font-size="44">Startup forecasts are mostly guesses.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Achieving failure.</text>
<text class="b" x="120" y="176" font-size="32">Executing perfectly on a plan that was wrong from the start.</text>
<g id="chk"><rect class="s-line" x="120" y="230" width="440" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">THE PLAN</text></g>
<g id="plant"><text class="m" x="950" y="670" font-size="20" text-anchor="middle">THE PLAN’S TARGET</text></g>
<g id="realt"><text class="m" x="1340" y="430" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT CUSTOMERS WANT</text></g>
<g id="arrow"><path class="s-ink" d="M-170 0H-14M-170 0l-20-14M-170 0l-20 14" fill="none" stroke-width="7" stroke-linecap="round"/><path class="ink" d="M0 0l-28-13v26z"/></g>
<g id="achv"><text class="d" x="120" y="800" font-size="56" style="fill:var(--loss)">“Achieving failure.”</text><text class="m" x="120" y="848" font-size="20">PERFECT EXECUTION · WRONG PLAN</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The IMVU add-on.</text>
<text class="b" x="120" y="176" font-size="32">Chat with 3D avatars, plugged into messengers people already used.</text>
<g id="wires"></g>
<g id="win"><rect class="s-ink" x="600" y="280" width="400" height="330" rx="16" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M616 280h368a16 16 0 0 1 16 16v28H600v-28a16 16 0 0 1 16-16z"/><text class="m" x="630" y="312" font-size="22" style="fill:var(--stage)">IMVU</text><text class="m" x="800" y="584" font-size="20" text-anchor="middle">3D AVATARS</text></g>
<g id="nets"></g>
<g id="code"><rect class="s-line" x="600" y="650" width="400" height="112" rx="12" fill="none" stroke-width="3"/><text class="m" x="580" y="712" font-size="20" text-anchor="end">ADD-ON CODE</text></g>
<g id="codel"><text class="d" x="120" y="840" font-size="40">Hard work to connect every network.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Customers said no.</text>
<text class="b" x="120" y="176" font-size="32">Real customers didn’t want to bring their friends along.</text>
<g id="cust"><text class="m" x="260" y="570" font-size="20" text-anchor="middle">REAL CUSTOMERS</text></g>
<g id="card"><text class="m" x="560" y="282" font-size="22" text-anchor="middle">INVITE FRIENDS?</text><rect class="s-ink" x="400" y="300" width="320" height="120" rx="14" fill="var(--stage)" stroke-width="5"/><g id="cfr"></g></g>
<g id="xno"><path class="s-loss" d="M470 322L650 404M650 322L470 404" stroke-width="5" stroke-linecap="round"/><text class="m" x="560" y="460" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO THANKS</text></g>
<g id="code6"><rect class="s-line" x="1220" y="240" width="250" height="160" rx="12" fill="var(--stage)" stroke-width="3"/><text class="m" x="1240" y="274" font-size="20">ADD-ON CODE</text></g>
<g id="bin"><path class="s-ink" d="M920 450L950 680H1130L1160 450Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1040" y="716" font-size="20" text-anchor="middle">MUCH OF THE CODE</text></g>
<g id="pile"></g>
<g id="lid"><g id="lidr"><rect class="ink" x="900" y="420" width="280" height="22" rx="6"/><rect class="ink" x="1010" y="406" width="60" height="16" rx="6"/></g></g>
<g id="ok1"><path class="s-gain" d="M128 764l12 12 24-28" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="180" y="780" font-size="40">The plan was followed carefully.</text></g>
<g id="ok2"><path class="s-loss" d="M130 816l28 28M158 816l-28 28" stroke-width="7" stroke-linecap="round"/><text class="d" x="180" y="845" font-size="40" style="fill:var(--loss)">It was aimed at the wrong target.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Treat plans as guesses.</text>
<text class="b" x="120" y="176" font-size="32">Keep planning, but check each guess with real people.</text>
<g id="bulb"><g id="rays"></g><circle class="gain" cx="240" cy="360" r="70"/><rect class="ink" x="210" y="435" width="60" height="40" rx="6"/><text class="m" x="240" y="540" font-size="20" text-anchor="middle">KEEP PLANNING</text></g>
<g id="plan"><rect class="s-line" x="440" y="240" width="460" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="470" y="290" font-size="22">YOUR PLAN</text></g>
<path id="arw2" class="s-gain" d="M920 470H1060m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="ppl"><text class="m" x="1260" y="610" font-size="20" text-anchor="middle">REAL PEOPLE</text></g>
<g id="checks"></g>
<g id="tbot"><text class="d" x="120" y="800" font-size="44">Test guesses before months of building.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">How could you check</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">one assumption with a</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">real person</tspan> this week?</text></g>
<g id="lbl8"><text class="m" x="143" y="700" font-size="26">WRITE DOWN ONE THING YOU ASSUME CUSTOMERS WANT</text></g>
<g id="sticky" transform="rotate(-4 1330 710)"><rect class="gain" x="1230" y="610" width="200" height="200" rx="6"/><text class="m" x="1250" y="650" font-size="20" style="fill:var(--on-gain)">I ASSUME…</text><g id="slines"></g></g>
</g>