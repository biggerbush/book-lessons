<g id="s0">
<text class="m" x="120" y="150" font-size="28">HIDDEN POTENTIAL · LESSON 1</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Potential is</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">distance traveled,</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">not starting point.</text>
<text class="b" x="120" y="620" font-size="32">Why where you start matters less than how far you go</text>
<polygon class="s-ink" points="1100,720 1300,300 1440,720" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<circle id="tA" class="loss" r="20"/><circle id="tB" class="gain" r="20"/>
<g id="tlab"><text class="m" x="1100" y="770" font-size="20" style="fill:var(--loss)">FAST STARTER</text><text class="m" x="1100" y="800" font-size="20" style="fill:var(--gain)">STEADY CLIMBER</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The snapshot trap.</text>
<text class="b" x="120" y="176" font-size="32">We judge potential at a single glance.</text>
<g id="rc"><rect class="s-ink" x="120" y="240" width="460" height="480" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="160" y="300" font-size="22">REPORT CARD</text></g>
<g id="rows"></g>
<g id="vf"><path class="s-ink" d="M700 300v-60h60M1420 240h60v60M1480 660v60h-60M760 720h-60v-60" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="kA"><g id="kAf"></g><g id="kAs"></g><rect class="gain" x="830" y="620" width="180" height="56" rx="28"/><text class="m" x="920" y="656" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">GIFTED</text></g>
<g id="kB"><g id="kBf"></g><g id="kBt"><rect x="1150" y="620" width="220" height="56" rx="28" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="1260" y="656" font-size="22" text-anchor="middle" style="fill:var(--loss)">WRITTEN OFF</text></g></g>
<g id="fool"><text class="d" x="120" y="820" font-size="46">The early snapshot fools us again and again.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start versus distance.</text>
<text class="b" x="120" y="176" font-size="32">Potential is a long trail.</text>
<g id="mt"><polygon class="s-ink" points="160,760 760,250 1460,760" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-line" d="M120 760h1360" stroke-width="5"/></g>
<g id="trail"></g>
<g id="camp"><path class="ink" d="M230 760l50-80 50 80z"/><text class="m" x="120" y="810" font-size="22">BASE CAMP · WHERE YOU BEGIN</text></g>
<g id="flag"><path class="s-ink" d="M760 250V190" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M762 190h70l-16 16 16 16h-70z"/><text class="m" x="860" y="214" font-size="22">HOW HIGH YOU CAN CLIMB</text></g>
<g id="dist"><text class="d" x="1480" y="330" font-size="42" text-anchor="end" style="fill:var(--gain)">Distance traveled,</text><text class="d5" x="1480" y="390" font-size="42" text-anchor="end">not starting point.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two climbers.</text>
<text class="b" x="120" y="176" font-size="32">Same mountain, different starting points.</text>
<polygon class="s-ink" points="220,760 700,240 1180,760" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-line" d="M120 760h1360" stroke-width="5"/>
<g id="dl"><path class="s-muted" d="M562 379H1180M908 404H1180" stroke-width="3" stroke-dasharray="6 8"/><text class="m" x="1196" y="411" font-size="20" style="fill:var(--gain)">ENDS A LITTLE LOWER</text>
<text class="m" x="120" y="390" font-size="22">A: SHORT CLIMB</text><text class="m" x="1240" y="560" font-size="22" style="fill:var(--gain)">B: LONG CLIMB</text></g>
<g id="gA"><line id="lA" class="s-ink" x1="449.7" y1="490.5" x2="449.7" y2="490.5" stroke-width="8" stroke-linecap="round"/><circle id="cA" class="ink" r="18"/><text class="m" x="120" y="470" font-size="22">CLIMBER A</text><text class="m" x="120" y="500" font-size="20">STARTS HALFWAY</text></g>
<g id="gB"><line id="lB" class="s-gain" x1="1190.3" y1="750.5" x2="1190.3" y2="750.5" stroke-width="8" stroke-linecap="round"/><circle id="cB" class="gain" r="18"/><text class="m" x="1240" y="640" font-size="22" style="fill:var(--gain)">CLIMBER B</text><text class="m" x="1240" y="670" font-size="20">STARTS AT THE BOTTOM</text></g>
<g id="clm"><text class="d" x="120" y="830" font-size="44">The climb, not the altitude, shows what you can do.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Bloom study.</text>
<g id="bl"><text class="b" x="120" y="176" font-size="32">Psychologist Benjamin Bloom studied world-class performers.</text></g>
<g id="cards"></g><g id="pols"></g>
<g id="grow"><text class="d" x="120" y="830" font-size="44">Great by growing, not by starting ahead.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why we miss it.</text>
<text class="b" x="120" y="176" font-size="32">Talent shows fast. Growth hides.</text>
<g id="sw"><circle class="s-ink" cx="320" cy="440" r="120" fill="var(--stage)" stroke-width="8"/><rect class="ink" x="300" y="292" width="40" height="26" rx="6"/>
