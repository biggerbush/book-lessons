<g id="s0">
<text class="m" x="120" y="150" font-size="28">RICH DAD POOR DAD · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Taxes and the power</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of corporations.</text>
<text class="b" x="120" y="600" font-size="32">Why the order of earning, spending and taxing changes everything.</text>
<g id="ord"><text class="m" x="120" y="690" font-size="24" style="fill:var(--gain)">THE ORDER IN WHICH MONEY MOVES MATTERS</text></g>
<g id="chk"><rect class="s-ink" x="1100" y="260" width="360" height="170" rx="10" fill="var(--stage)" stroke-width="6"/><text class="m" x="1240" y="306" font-size="22">PAYCHECK</text><path class="s-line" d="M1240 350h180M1240 390h120" stroke-width="6" stroke-linecap="round"/></g>
<g id="slice"><rect class="loss" x="1100" y="260" width="110" height="170" rx="10"/><text class="m" x="1155" y="355" font-size="26" text-anchor="middle" style="fill:var(--stage)">TAX</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two dads, two views.</text>
<text class="b" x="120" y="176" font-size="32">Robert’s two fathers saw taxes very differently.</text>
<g id="pA"><rect class="s-line" x="120" y="230" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">EDUCATED DAD</text></g>
<g id="pB"><rect class="s-line" x="840" y="230" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="22">RICH DAD</text></g>
<g id="pa"><g id="cst"></g><text class="m" x="260" y="610" font-size="18" text-anchor="middle">THE RICH</text>
<path class="s-ink" d="M350 470h110m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g id="smp"></g>
<text class="d5" x="150" y="680" font-size="34">The rich should pay more</text><text class="d5" x="150" y="724" font-size="34">to help those with less.</text></g>
<g id="pb"><rect class="s-ink" x="900" y="380" width="140" height="180" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M922 380v180" stroke-width="4"/><text class="m" x="980" y="476" font-size="20" text-anchor="middle">RULES</text>
<g id="pbp"></g><path class="s-gain" d="M1230 470V385m-16 16 16-16 16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-loss" d="M1390 385v85m-16-16 16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1180" y="525" font-size="18" text-anchor="middle" style="fill:var(--gain)">REWARDED</text><text class="m" x="1340" y="525" font-size="18" text-anchor="middle" style="fill:var(--loss)">PUNISHED</text>
<text class="d5" x="870" y="680" font-size="34">Taxes reward those who</text><text class="d5" x="870" y="724" font-size="34">know the rules.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Robin Hood idea.</text>
<text class="b" x="120" y="176" font-size="32">Income tax was sold to voters as a way to take from the rich.</text>
<g id="rch"></g><rect class="ink" x="198" y="252" width="44" height="38"/><rect class="ink" x="184" y="286" width="72" height="8"/>
<g id="bag"><circle class="gain" cx="380" cy="500" r="70"/><path class="s-gain" d="M350 425l30 14 30-14" fill="none" stroke-width="8" stroke-linecap="round"/><text class="d" x="380" y="522" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">$</text></g>
<g id="arw"><path class="s-loss" d="M0 0h220M0 0l22-14M0 0l22 14M200 0l20-14M200 0l20 14M180 0l20-14M180 0l20 14" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="20" y="-24" font-size="20" style="fill:var(--loss)">INCOME TAX</text></g>
<g id="cals"></g>
<g id="wk"></g>
<g id="wel"><text class="d5" x="860" y="760" font-size="40">Most workers welcomed it.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Taxes trickle down.</text>
<g id="gov"><polygon class="ink" points="160,330 360,250 560,330"/><rect class="ink" x="180" y="336" width="360" height="18"/><g id="cols"></g><rect class="ink" x="160" y="560" width="400" height="30"/></g>
<text class="m" x="360" y="640" font-size="22" text-anchor="middle">GOVERNMENT</text>
<g id="pipe"><path class="s-loss" d="M600 420H700M700 325V685" fill="none" stroke-width="6" stroke-dasharray="12 10"/><text class="m" x="650" y="404" font-size="22" text-anchor="middle" style="fill:var(--loss)">TAX</text></g>
<path id="br0" class="s-loss" d="M700 325H756" stroke-width="6"/><path id="br1" class="s-loss" d="M700 505H756" stroke-width="6"/><path id="br2" class="s-loss" d="M700 685H756" stroke-width="6"/>
<rect id="tr0" x="760" y="270" width="540" height="110" rx="14" fill="var(--loss)" fill-opacity="0" stroke="var(--line)" stroke-width="4"/>
<rect id="tr1" x="760" y="450" width="540" height="110" rx="14" fill="var(--loss)" fill-opacity="0" stroke="var(--line)" stroke-width="4"/>
<rect id="tr2" x="760" y="630" width="540" height="110" rx="14" fill="var(--loss)" fill-opacity="0" stroke="var(--line)" stroke-width="4"/>
<text class="m" x="790" y="332" font-size="22">THE RICH</text><text class="m" x="790" y="512" font-size="22">MIDDLE CLASS</text><text class="m" x="790" y="692" font-size="22">THE POOR</text>
<g id="tp"></g><g id="rpg"></g>
<g id="esc"><text class="d" x="120" y="820" font-size="46">The rich found a way to step aside.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The corporation shield.</text>
<text class="b" x="120" y="176" font-size="32">A legal entity that can own things, earn income and pay expenses.</text>
<g id="shd"><path class="s-gain" d="M480 240L760 320V520C760 650 620 730 480 770C340 730 200 650 200 520V320Z" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/><text class="m" x="480" y="380" font-size="24" text-anchor="middle">CORPORATION</text><g id="shp"></g></g>
<g id="chips"></g>
<g id="lawg"></g>
<g id="gr"><polygon id="gearP" class="gain"/><circle cx="1320" cy="640" r="20" fill="var(--stage)"/></g>
<g id="sys"><text class="m" x="860" y="820" font-size="22">HE LEARNED THE SYSTEM, THEN USED IT</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The employee order.</text>
<text class="b" x="120" y="176" font-size="32">Earn, then get taxed, then spend whatever is left.</text>
<text class="m" x="1480" y="236" font-size="22" text-anchor="end">SCHEMATIC</text>
<g id="f5"></g>
<g id="note5"><text class="m" x="800" y="830" font-size="22" text-anchor="middle" style="fill:var(--loss)">TAKEN BEFORE YOU SEE IT</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The corporate order.</text>
<text class="b" x="120" y="176" font-size="32">Earn, then pay expenses, then pay tax on what remains.</text>
<text class="m" x="1480" y="236" font-size="22" text-anchor="end">SCHEMATIC</text>
<g id="f6"></g>
<g id="same6"><text class="d" x="120" y="845" font-size="40">Same money. Different order. Very different result.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Financial intelligence.</text>
<text class="b" x="120" y="176" font-size="32">Four skills working together, with the law guarding the money.</text>
<rect id="frm" class="s-line" x="120" y="220" width="660" height="500" rx="24" fill="none" stroke-width="3" stroke-dasharray="10 10"/>
<g id="tiles"></g>
<g id="prot"><path class="s-gain" d="M930 240L1000 265V340C1000 380 970 405 930 420C890 405 860 380 860 340V265Z" fill="none" stroke-width="7" stroke-linejoin="round"/><circle class="gain" cx="930" cy="330" r="26"/>
<text class="d5" x="860" y="500" font-size="32">Knowing the law protects</text><text class="d5" x="860" y="545" font-size="32">your money and keeps it working.</text></g>
<g id="glb"><circle class="s-ink" cx="1000" cy="690" r="90" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M910 690h180M922 645h156M922 735h156" stroke-width="4"/>
<ellipse id="mer0" class="s-ink" cx="1000" cy="690" rx="40" ry="90" fill="none" stroke-width="4"/><ellipse id="mer1" class="s-ink" cx="1000" cy="690" rx="70" ry="90" fill="none" stroke-width="4"/>
<text class="m" x="1120" y="670" font-size="20">RULES DIFFER BY COUNTRY</text><text class="m" x="1120" y="702" font-size="20">AND CHANGE OVER TIME</text><text class="m" x="1120" y="742" font-size="20" style="fill:var(--gain)">DETAILS HERE ARE GENERAL</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which expense do you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">pay after tax that could</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">be handled <tspan style="fill:var(--gain)">differently?</tspan></text></g>
<g id="adv"><text class="m" x="143" y="700" font-size="26">FIRST, TALK TO A QUALIFIED TAX ADVISER</text></g>
<g id="rcpt"><path class="s-ink" d="M1300 600h140v190l-20-14-20 14-20-14-20 14-20-14-20 14-20-14z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-line" d="M1322 640h96M1322 680h96M1322 720h60" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="1440" cy="616" r="30"/><path d="M1426 616l10 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>