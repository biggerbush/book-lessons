<g id="ld5"><text class="m" x="1305" y="620" font-size="20" text-anchor="middle" style="fill:var(--loss)">DISAPPOINTED</text></g>
<g id="st5"><text class="d" x="120" y="780" font-size="44">Waiting for approval lets others steer.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then: let me.</text>
<text class="b" x="120" y="176" font-size="32">Your values pick the direction.</text>
