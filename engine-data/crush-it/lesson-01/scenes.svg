<g id="c_pills"></g>
<g id="c_cost"><text class="d" x="120" y="820" font-size="38">Almost free to make. It reached people no ad budget could.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s not just about wine.</text>
<text class="b" x="120" y="176" font-size="32">Whatever you love, there is an audience out there.</text>
<g id="a_t0"><rect class="s-line" x="120" y="220" width="240" height="200" rx="16" fill="var(--stage)" stroke-width="3"/><path class="s-ink" transform="translate(240 300)" d="M-30-45h60q0 60-30 66q-30-6-30-66zM0 21v30M-20 51h40" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="240" y="400" font-size="20" text-anchor="middle">WINE</text></g>
