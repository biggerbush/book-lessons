<g id="s0">
<text class="m" x="120" y="150" font-size="28">SURROUNDED BY IDIOTS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Green: the steady</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">team player.</text>
<text class="b" x="120" y="600" font-size="32">Why calm, loyal Greens need patience, warmth and early notice</text>
