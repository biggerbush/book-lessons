<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMPOUND EFFECT · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Small choices,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">huge results.</text>
<text class="b" x="120" y="600" font-size="32">Why tiny daily choices quietly decide your biggest results.</text>
<g id="cash">
<rect class="s-ink" x="1180" y="280" width="260" height="110" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="1170" y="268" width="260" height="110" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="1160" y="256" width="260" height="110" rx="10" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="1290" cy="311" r="30" fill="none" stroke-width="5"/>
<text class="d" x="1290" y="325" font-size="40" text-anchor="middle">$</text>
<text class="m" x="1290" y="430" font-size="22" text-anchor="middle">$3 MILLION CASH</text>
</g>
<g id="pick"><text class="m" x="1290" y="226" font-size="20" text-anchor="middle" style="fill:var(--gain)">MOST PEOPLE PICK THIS</text></g>
<g id="pen">
<text class="d5" x="1290" y="490" font-size="36" text-anchor="middle">or</text>
<g id="pg"><circle class="gain" cx="1290" cy="572" r="52"/><text class="d" x="1290" y="588" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">1¢</text></g>
<text class="m" x="1290" y="670" font-size="22" text-anchor="middle">DOUBLES EVERY DAY</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A slow start.</text>
<text class="b" x="120" y="176" font-size="32">Day 1 is a single penny. Watch it double.</text>
<g id="cal"></g>
<g id="g5"><text class="m" x="860" y="280" font-size="22">DAY 5</text><text id="v5" class="d" x="856" y="370" font-size="90">16¢</text></g>
<g id="g20"><text class="m" x="860" y="450" font-size="22">DAY 20</text><text id="v20" class="d" x="856" y="540" font-size="90">≈ $5,000</text></g>
<g id="bars">
<text class="m" x="860" y="620" font-size="20">CASH · $3 MILLION</text>
<rect class="ink" x="860" y="632" width="620" height="28"/>
<text class="m" x="860" y="700" font-size="20" style="fill:var(--gain)">PENNY · DAY 20</text>
<rect class="gain" x="860" y="712" width="4" height="28"/>
<text class="d" x="120" y="820" font-size="44">The cash still looks like the smart pick.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then the doubling roars.</text>
<text class="b" x="120" y="176" font-size="32">Most of the growth arrives in the final few days.</text>
<g id="fin"><rect class="gain" x="1117" y="260" width="183" height="500" fill-opacity=".15"/><text class="m" x="1268" y="232" font-size="20" text-anchor="end" style="fill:var(--gain)">FINAL FEW DAYS</text></g>
<path class="s-ink" d="M200 260V760H1330" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-muted" d="M200 620H1320" stroke-width="3" stroke-dasharray="10 10"/>
<text class="m" x="220" y="606" font-size="20">$3 MILLION CASH</text>
<text class="m" x="200" y="800" font-size="20" text-anchor="middle">DAY 1</text>
<text class="m" x="897" y="800" font-size="20" text-anchor="middle">DAY 20</text>
<text class="m" x="1300" y="800" font-size="20" text-anchor="middle">DAY 31</text>
<g id="qt"><path class="s-loss" d="M897 470V760" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="910" y="490" font-size="20" style="fill:var(--loss)">MOST QUIT HERE</text></g>
<path id="cv" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="tip" class="gain" r="12"/>
<g id="big"><text class="m" x="240" y="330" font-size="24">DAY 31</text><text class="d" x="236" y="420" font-size="80" style="fill:var(--gain)">Over $10 million</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three friends.</text>
<text class="b" x="120" y="176" font-size="32">Similar lives, similar incomes, similar weight.</text>
<g id="f0"></g><g id="f1"></g><g id="f2"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nothing seems to happen.</text>
<text class="b" x="120" y="176" font-size="32">Five months in, all three look exactly the same.</text>
<path class="s-line" d="M160 300V640H860" fill="none" stroke-width="4"/>
<text class="m" x="160" y="676" font-size="20">MONTH 0</text>
<text class="m" x="860" y="676" font-size="20" text-anchor="end">MONTH 5</text>
<g id="ln4"></g>
<g id="tags"><text class="m" x="180" y="400" font-size="20" style="fill:var(--gain)">SCOTT · SEEMS POINTLESS</text><text class="m" x="180" y="560" font-size="20" style="fill:var(--loss)">BRAD · SEEMS HARMLESS</text></g>
<g id="same"><text class="m" x="1200" y="266" font-size="22" text-anchor="middle">MONTH 5</text></g>
<g id="sign"><rect class="ink" x="1194" y="610" width="12" height="150"/><rect class="loss" x="1060" y="520" width="280" height="90" rx="10"/><text class="d" x="1200" y="580" font-size="44" text-anchor="middle" style="fill:var(--stage)">GIVE UP?</text></g>
<g id="nore"><text class="d" x="120" y="820" font-size="44">Small choices show no reward yet.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Month 31: then it shows.</text>
<text class="b" x="120" y="176" font-size="32">Change in weight after 31 months.</text>
<path class="s-line" d="M200 520H1140" stroke-width="4"/>
<rect id="bs" class="gain" x="330" y="520" width="140" height="0"/>
<rect id="bb" class="loss" x="930" y="520" width="140" height="0"/>
<g id="ls"><text class="d5" x="400" y="498" font-size="40" text-anchor="middle">Scott</text><text id="vs" class="d" x="400" y="768" font-size="48" text-anchor="middle" style="fill:var(--gain)">−33 lb</text></g>
<g id="lb"><text class="d5" x="1000" y="570" font-size="40" text-anchor="middle">Brad</text><text id="vb" class="d" x="1000" y="296" font-size="48" text-anchor="middle" style="fill:var(--loss)">+33 lb</text></g>
<g id="ll"><rect class="ink" x="630" y="514" width="140" height="12"/><text class="m" x="700" y="496" font-size="20" text-anchor="middle">NO CHANGE</text><text class="d5" x="700" y="570" font-size="40" text-anchor="middle">Larry</text></g>
<g id="gap">
<path class="s-muted" d="M480 718H1240M1080 322H1240" stroke-width="3" stroke-dasharray="8 8"/>
<path class="s-ink" d="M1240 330V710M1222 348l18-18 18 18M1222 692l18 18 18-18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text id="vg" class="d" x="1270" y="540" font-size="80">66 lb</text><text class="m" x="1274" y="580" font-size="24">GAP</text>
</g>
<g id="tiny5"><text class="d" x="120" y="840" font-size="40">Built from choices too small to notice.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">One simple formula.</text>
<text class="b" x="120" y="176" font-size="32">Small, smart choices + consistency + time = radical difference.</text>
<g id="f6"></g>
<g id="rev"><path class="s-loss" d="M1340 455V585M1322 567l18 18 18-18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1310" y="528" font-size="22" text-anchor="end" style="fill:var(--loss)">SAME MATH, IN REVERSE</text></g>
<g id="all6"><text class="d" x="120" y="840" font-size="40">Good or bad, every choice compounds.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why we miss it.</text>
<text class="b" x="120" y="176" font-size="32">In the moment, each choice feels too small to matter.</text>
<g id="mag">
<text class="m" x="120" y="460" font-size="22">ONE CHOICE:</text>
<text class="m" x="120" y="492" font-size="22">FEELS TINY</text>
