<g id="panR"><g id="chips"></g><path class="ink" d="M-130 0h260l-34 30h-192z"/><text class="m" x="0" y="72" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT YOU TRULY NEED</text></g>
</g>
<g id="hrt"><path id="hrti" class="gain" d="M0 30C-40 5-45-25-22-32C-10-36-2-28 0-20C2-28 10-36 22-32C45-25 40 5 0 30Z"/></g>
<g id="k1"><text class="d" x="120" y="760" font-size="46">Enough isn’t settling for too little.</text></g>
<g id="k2"><text class="b" x="120" y="816" font-size="32">It’s knowing when more would cost you what truly matters.</text></g>
</g>

