<circle class="gain" cx="1090" cy="640" r="20"/>
<text class="m" x="1090" y="730" font-size="22" text-anchor="middle">OR BUILD A MACHINE</text>
</g>
<g id="pack"><text class="d" x="120" y="810" font-size="44">Real value can’t be packaged into a course.</text></g>
</g>

<g id="s2" opacity="0">
