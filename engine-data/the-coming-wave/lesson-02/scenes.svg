<g id="dsg"><text class="m" x="800" y="250" font-size="24" text-anchor="middle">VAST DATA</text><g id="dsp"></g></g>
<g id="mog"><text class="m" x="800" y="790" font-size="24" text-anchor="middle" style="fill:var(--gain)">NEW PROTEINS · MEDICINES</text><g id="mop"></g></g>
<g id="fast5"><text class="d" x="120" y="852" font-size="40">Each engine speeds up the other.</text></g>
