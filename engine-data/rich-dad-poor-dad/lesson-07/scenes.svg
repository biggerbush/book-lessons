<g id="s0">
<text class="m" x="120" y="150" font-size="28">RICH DAD POOR DAD · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Overcoming the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">obstacles within.</text>
<text class="b" x="120" y="600" font-size="32">Four inner habits that quietly block wealth, and how to beat them</text>
<circle class="s-ink" cx="1300" cy="340" r="120" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1150 560v-30a150 70 0 0 1 300 0v30" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="tbr"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The walls are on the inside.</text>
<text class="b" x="120" y="176" font-size="32">Knowing about money is not the same as building assets.</text>
<g id="smart"><g id="smartP"></g><path class="ink" d="M200 362l60-26 60 26-60 26z"/><text class="m" x="260" y="660" font-size="20" text-anchor="middle">FINANCIALLY LITERATE</text></g>
<path id="ar1" class="s-muted" d="M340 476H610" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="wall"></g>
<g id="wlab"><text class="m" x="800" y="706" font-size="20" text-anchor="middle">FOUR INNER HABITS</text></g>
<g id="fixes"></g>
<path id="ar2" class="s-gain" d="M1036 476H1160m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="goal"><rect class="gain" x="1180" y="416" width="260" height="120" rx="16"/><text class="d" x="1310" y="490" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">ASSETS</text></g>
<g id="fix"><text class="d" x="120" y="800" font-size="44">Rich dad had a simple fix for each one.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cynicism: Chicken Little.</text>
<text class="b" x="120" y="176" font-size="32">Running and shouting that the sky is falling.</text>
<g id="henW"><g id="hen">
<path class="s-ink" d="M-20 60v60M30 60v60" stroke-width="7" stroke-linecap="round"/>
<ellipse class="s-ink" cx="0" cy="0" rx="90" ry="64" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M-30-10L-90-100L20-30" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="s-ink" cx="70" cy="-90" r="40" fill="var(--stage)" stroke-width="7"/>
<polygon class="loss" points="106,-100 146,-86 106,-72"/><circle class="ink" cx="82" cy="-98" r="6"/>
</g><text class="m" x="320" y="730" font-size="20" text-anchor="middle">CHICKEN LITTLE</text></g>
<g id="sky"><rect class="s-ink" x="140" y="250" width="420" height="90" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M410 340l-10 50 50-50" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="350" y="308" font-size="36" text-anchor="middle">The sky is falling!</text></g>
<g id="cl0"><rect class="loss" x="620" y="230" width="400" height="90" rx="45" fill-opacity=".15" stroke="var(--loss)" stroke-width="5"/><text class="m" x="820" y="282" font-size="20" text-anchor="middle" style="fill:var(--loss)">EVERY INVESTMENT IS A TRAP</text></g>
<g id="cl1"><rect class="loss" x="1060" y="280" width="400" height="90" rx="45" fill-opacity=".15" stroke="var(--loss)" stroke-width="5"/><text class="m" x="1260" y="332" font-size="20" text-anchor="middle" style="fill:var(--loss)">EVERY MARKET WILL CRASH</text></g>
<g id="door"><rect class="s-ink" x="1000" y="440" width="170" height="320" rx="6" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1145" cy="610" r="8"/><rect class="loss" x="1030" y="500" width="110" height="40" rx="6"/><text class="m" x="1085" y="527" font-size="18" text-anchor="middle" style="fill:var(--stage)">CLOSED</text></g>
