<circle id="br1" class="s-gain" cx="800" cy="460" r="70" fill="none" stroke-width="6"/>
<text class="d" x="800" y="700" font-size="48" text-anchor="middle">Breathe</text>
<text class="m" x="800" y="750" font-size="20" text-anchor="middle">NO LASHING OUT OR SULKING</text>
</g>
<g id="n2">
<path class="s-muted" d="M930 460h170m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
