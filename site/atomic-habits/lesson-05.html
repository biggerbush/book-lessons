<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atomic Habits Lesson Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays five scenes, with a transport bar beneath it. */
:root{
  --bg:#E9EEF2; --stage:#F6F8FA; --ink:#12233A; --muted:#5C6B7E; --line:#C5CFD9;
  --gain:#C97F00; --loss:#5562C4; --ice:#BFDDF0; --on-gain:#12233A;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:14px}
@keyframes wmmove{0%{transform:translate(0,0)}25%{transform:translate(-1330px,0)}50%{transform:translate(-1330px,-812px)}75%{transform:translate(0,-812px)}}
.wmc{animation:wmmove 80s step-end infinite}
@media (prefers-reduced-motion:reduce){.wmc{animation:none}}
#stageBox{background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
#stageBox:fullscreen{border:0;border-radius:0;aspect-ratio:auto;display:flex;align-items:center}
svg{display:block;width:100%;height:100%}
.d{font-family:var(--display);font-weight:800;fill:var(--ink)}
.d5{font-family:var(--display);font-weight:500;fill:var(--ink)}
.b{font-family:var(--body);fill:var(--muted)}
.m{font-family:var(--mono);fill:var(--muted);letter-spacing:.04em}
.ink{fill:var(--ink)} .gain{fill:var(--gain)} .loss{fill:var(--loss)}
.s-ink{stroke:var(--ink)} .s-line{stroke:var(--line)} .s-gain{stroke:var(--gain)} .s-loss{stroke:var(--loss)} .s-muted{stroke:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
#play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:86px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--gain)}
#clock{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font-weight:400;font-size:13px;padding:6px 10px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch;margin:4px 0 0}
</style>

<div class="wrap">
  <div id="stageBox">
    <svg viewBox="0 0 1600 900" role="img" aria-label="Animated summary of the fifth lesson of Atomic Habits: implementation intentions and habit stacking. Six scenes.">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.6" fill="var(--line)"/></pattern>
      </defs>
      <rect width="1600" height="900" fill="var(--stage)"/>
      <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>

      <!-- 1 Title -->
      <g id="s0">
        <text class="m" x="120" y="150" font-size="28">ATOMIC HABITS · CHAPTER 5</text>
        <text class="d" x="116" y="400" font-size="80" letter-spacing="-2">The best way to start</text>
        <text class="d" x="116" y="494" font-size="80" letter-spacing="-2">a new habit.</text>
        <text class="b" x="120" y="600" font-size="32">Lesson five: give every habit a time and a place. Press Play for sound.</text>
        <g transform="translate(1200 290)">
          <rect class="s-ink" x="0" y="0" width="250" height="250" rx="20" fill="var(--stage)" stroke-width="7"/>
          <path class="ink" d="M0 20a20 20 0 0 1 20-20h210a20 20 0 0 1 20 20v42H0z"/>
          <rect class="ink" x="54" y="-22" width="14" height="40" rx="7"/><rect class="ink" x="182" y="-22" width="14" height="40" rx="7"/>
          <g id="cal"></g>
          <rect id="calOn" class="gain" x="106" y="134" width="40" height="34" rx="6"/>
        </g>
        <g id="pin" transform="translate(1440 560)">
          <path class="ink" d="M0 0C-36-44-46-62-46-80a46 46 0 0 1 92 0C46-62 36-44 0 0z"/>
          <circle cx="0" cy="-80" r="17" fill="var(--stage)"/>
        </g>
      </g>

      <!-- 2 The study -->
      <g id="s1" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Who actually exercised?</text>
        <text class="b" x="120" y="176" font-size="32">A 2001 study in Britain, three groups.</text>
        <g id="grp0"><rect id="bo0" class="s-line" x="160" y="300" width="280" height="380" fill="none" stroke-width="3" stroke-dasharray="8 8"/>
          <text class="m" x="160" y="730" font-size="22">GROUP 1</text><text class="b" x="160" y="772" font-size="30">Tracked workouts</text></g>
        <g id="grp1"><rect id="bo1" class="s-line" x="560" y="300" width="280" height="380" fill="none" stroke-width="3" stroke-dasharray="8 8"/>
          <text class="m" x="560" y="730" font-size="22">GROUP 2</text><text class="b" x="560" y="772" font-size="30">+ Read the benefits</text></g>
        <g id="grp2"><rect id="bo2" class="s-line" x="960" y="300" width="280" height="380" fill="none" stroke-width="3" stroke-dasharray="8 8"/>
          <text class="m" x="960" y="730" font-size="22">GROUP 3</text><text class="b" x="960" y="772" font-size="30">+ Wrote when and where</text></g>
        <rect id="b0" x="160" width="280" fill="var(--muted)"/>
        <rect id="b1" x="560" width="280" fill="var(--muted)"/>
        <rect id="b2" class="gain" x="960" width="280"/>
        <text id="v0" class="d" x="160" font-size="64">35%</text>
        <text id="v1" class="d" x="560" font-size="64">38%</text>
        <text id="v2" class="d" x="960" font-size="64">91%</text>
        <path class="s-ink" d="M140 680h1340" fill="none" stroke-width="4"/>
        <g id="note" transform="rotate(4 1380 360)">
          <rect class="s-ink" x="1280" y="300" width="200" height="120" rx="10" fill="var(--stage)" stroke-width="4"/>
          <text class="m" x="1300" y="348" font-size="22">MON · 7:00</text>
          <text class="m" x="1300" y="388" font-size="22">THE GYM</text>
        </g>
        <text class="m" x="140" y="840" font-size="22">SHARE WHO EXERCISED AT LEAST ONCE A WEEK</text>
      </g>

      <!-- 3 Implementation intention -->
      <g id="s2" opacity="0">
        <text class="d" x="120" y="124" font-size="68">That plan has a name.</text>
        <text class="b" x="120" y="176" font-size="32">An implementation intention.</text>
        <text class="d5" x="120" y="420" font-size="72">I will</text>
        <rect id="c0" x="340" y="350" width="560" height="96" rx="16" stroke-width="4"/>
        <text id="t0" class="d" x="620" y="420" font-size="56" text-anchor="middle">meditate</text>
        <text class="m" x="340" y="490" font-size="22">BEHAVIOUR</text>
        <text class="d5" x="120" y="640" font-size="72">at</text>
        <rect id="c1" x="230" y="570" width="400" height="96" rx="16" stroke-width="4"/>
        <text id="t1" class="d" x="430" y="640" font-size="56" text-anchor="middle">7:00 am</text>
        <text class="m" x="230" y="710" font-size="22">TIME</text>
        <text class="d5" x="680" y="640" font-size="72">in</text>
        <rect id="c2" x="790" y="570" width="560" height="96" rx="16" stroke-width="4"/>
        <text id="t2" class="d" x="1070" y="640" font-size="56" text-anchor="middle">the kitchen</text>
        <text class="m" x="790" y="710" font-size="22">PLACE</text>
      </g>

      <!-- 4 Clarity -->
      <g id="s3" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Motivation isn’t the problem.</text>
        <text class="b" x="120" y="176" font-size="32">Most people think they lack motivation. They lack a plan.</text>
        <defs><filter id="fog" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="fogB" stdDeviation="9"/></filter></defs>
        <g filter="url(#fog)">
          <text id="vague" class="d5" x="120" y="360" font-size="64" fill-opacity=".55">“I’ll exercise more, someday.”</text>
          <text id="clear" class="d5" x="120" y="360" font-size="64" opacity="0">“Monday, 7:00, at the gym.”</text>
        </g>
        <g id="lk1"><text id="motT" class="d" x="120" y="590" font-size="84" fill-opacity=".45">Not motivation.</text></g>
        <line id="mst" class="s-ink" x1="112" y1="562" x2="112" y2="562" stroke-width="6" stroke-linecap="round"/>
        <g id="lk2"><text class="d" x="120" y="720" font-size="110" letter-spacing="-2">Clarity.</text><rect class="gain" x="124" y="748" width="120" height="12"/></g>
      </g>

      <!-- 5 Habit stacking -->
      <g id="s4" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Stack it on a habit you already have.</text>
        <text class="b" x="120" y="176" font-size="32">After [current habit], I will [new habit].</text>
        <text class="m" x="120" y="270" font-size="22">AFTER</text><text class="m" x="760" y="270" font-size="22">I WILL</text>
        <g id="r0a"><rect class="ink" x="120" y="290" width="540" height="100" rx="16"/><text class="d5" x="150" y="355" font-size="40" fill="var(--stage)" style="fill:var(--stage)">Pour my morning coffee</text></g>
        <g id="r0b"><path class="s-ink" d="M680 340h50m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect class="gain" x="760" y="290" width="720" height="100" rx="16"/><text class="d5" x="790" y="355" font-size="40" style="fill:var(--on-gain)">Meditate for one minute</text></g>
        <g id="r1a"><rect class="ink" x="120" y="420" width="540" height="100" rx="16"/><text class="d5" x="150" y="485" font-size="40" style="fill:var(--stage)">Sit down to dinner</text></g>
        <g id="r1b"><path class="s-ink" d="M680 470h50m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect class="gain" x="760" y="420" width="720" height="100" rx="16"/><text class="d5" x="790" y="485" font-size="40" style="fill:var(--on-gain)">Say one thing I’m grateful for</text></g>
        <path class="s-line" d="M160 660H1440" fill="none" stroke-width="4"/>
        <path id="chainL" class="s-gain" d="M160 660H1440" fill="none" stroke-width="6" stroke-dasharray="0 1280"/>
        <g id="chain"></g>
        <g id="cueNext"><text class="d" x="120" y="830" font-size="52">Each habit becomes the cue for the next.</text></g>
      </g>

      <!-- 6 Close -->
      <g id="s5" opacity="0">
        <g id="qa"><text class="d" x="136" y="330" font-size="120" letter-spacing="-3">What will you do?</text></g>
        <g id="qb"><text class="d" x="136" y="470" font-size="120" letter-spacing="-3">When?</text></g>
        <g id="qc"><text class="d" x="136" y="610" font-size="120" letter-spacing="-3">And where?</text></g>
        <text class="m" x="143" y="740" font-size="26">I WILL ____ AT ____ IN ____</text>
      </g>
      <g id="wm" aria-hidden="true" pointer-events="none">
        <defs><pattern id="wmtile" width="560" height="360" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="24" y="190" font-family="DM Mono,monospace" font-size="34" font-weight="500" fill="var(--ink)" opacity=".06">visualgrowth.app</text></pattern></defs>
        <rect width="1600" height="900" fill="url(#wmtile)"/>
        <g class="wmc"><text x="1564" y="868" text-anchor="end" font-family="DM Mono,monospace" font-size="30" font-weight="500" fill="var(--ink)" stroke="var(--stage)" stroke-width="6" paint-order="stroke" opacity=".62">visualgrowth.app</text></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="73" step="0.01" value="0" aria-label="Position in the animation">
    <span id="clock">0:00 / 1:13</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">A paraphrased summary of chapter 5 of James Clear's <em>Atomic Habits</em>. Study figures from Milne, Orbell and Sheeran (2001), as reported in the book. Narration is an AI voice generated with ElevenLabs.</p>
</div>

<audio id="vo" preload="auto" src="lesson-05.mp3"></audio>
<script>
(function(){
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b)=>ease(lin(t,a,b));
// K scales the scene timings to the narration length
const K=1, DUR=73, SC=[[0,5.4],[5.4,33.3],[33.3,41.9],[41.9,47.4],[47.4,66.6],[66.6,73]].map(a=>[a[0]*K,a[1]*K]);
const NAMES=['Start a habit','The study','When and where','Clarity','Habit stacking','The question'];
const TM={g1:12.6,g2:16.1,g3:19.0,wrote:21.6,r12:26.4,r3:30.4,beh:38.3,time:39.7,place:40.8,lack:42.5,clarity:46.2,ex1:55.8,ex1b:57.65,ex2:59.8,ex2b:61.4,chain:64.1,q:67.6,q2:68.9,q3:69.6};

for(let r=0;r<3;r++)for(let c=0;c<5;c++)if(!(r===1&&c===2))mk('rect',{x:18+c*44,y:82+r*52,width:40,height:34,rx:6,fill:'var(--line)'},$('cal'));
const CH=['WAKE UP','COFFEE','MEDITATE','DINNER','GRATEFUL'], chain=CH.map((s,i)=>{const x=160+i*320,g=mk('g',{},$('chain'));
  const c=mk('circle',{cx:x,cy:660,r:28,'stroke-width':5},g);
  const tx=mk('text',{x:x,y:730,'font-size':22,'text-anchor':i===0?'start':i===4?'end':'middle',style:'font-family:var(--mono);letter-spacing:.04em;fill:var(--muted)'},g);
  if(i===0)tx.setAttribute('x',x-28); if(i===4)tx.setAttribute('x',x+28); tx.textContent=s; return c});
const W={motT:640};
function measure(){for(const k in W){try{const v=$(k).getComputedTextLength();if(v>0)W[k]=v}catch(e){}}}
measure(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();render(t)});
const VAL=[35,38,91];

function vis(t,i){const[a,b]=SC[i],last=i===SC.length-1;
  if(t<a||(t>=b&&!last))return 0;
  return Math.min(i===0?1:lin(t,a,a+.6), last?1:1-lin(t,b-.5,b));}
function rise(el,k){el.setAttribute('opacity',k);el.setAttribute('transform','translate(0 '+((1-k)*22).toFixed(1)+')')}
function strike(id,w,k){$(id).setAttribute('x2',(+$(id).getAttribute('x1')+(w+16)*k).toFixed(1));$(id).setAttribute('opacity',k>0?1:0)}

function render(t){
  const u=t/K;
  for(let i=0;i<SC.length;i++)$('s'+i).setAttribute('opacity',vis(t,i).toFixed(3));

  // title: the chosen day pulses, the pin drops
  $('calOn').setAttribute('opacity',(.55+.45*Math.sin(t*3)).toFixed(2));
  const drop=p(t,.3,1.2); $('pin').setAttribute('transform','translate(1440 '+(560-120*(1-drop)).toFixed(1)+')'); $('pin').setAttribute('opacity',drop);

  // the study
  const G=[TM.g1,TM.g2,TM.g3];
  G.forEach((a,i)=>{rise($('grp'+i),p(u,a,a+.5));
    const at=i<2?TM.r12+i*.4:TM.r3, k=p(u,at,at+1.1), h=380*VAL[i]/100*k;
    $('b'+i).setAttribute('y',(680-h).toFixed(1));$('b'+i).setAttribute('height',h.toFixed(1));
    $('v'+i).setAttribute('y',(680-h-22).toFixed(1));$('v'+i).setAttribute('opacity',k>0?p(u,at+.6,at+1.1):0);
    $('v'+i).textContent=Math.round(VAL[i]*k)+'%'});
  rise($('note'),p(u,TM.wrote,TM.wrote+.5));
  $('note').setAttribute('transform','rotate(4 1380 360) '+$('note').getAttribute('transform'));

  // implementation intention
  [TM.beh,TM.time,TM.place].forEach((a,i)=>{const on=u>=a;
    $('c'+i).style.fill=on?'var(--gain)':'var(--stage)';$('c'+i).style.stroke=on?'var(--gain)':'var(--line)';
    $('c'+i).setAttribute('stroke-dasharray',on?'none':'10 10');
    $('t'+i).setAttribute('opacity',p(u,a,a+.4));$('t'+i).style.fill='var(--on-gain)'});

  // clarity: the vague plan sharpens
  const sh=p(u,TM.clarity,TM.clarity+1.2);
  $('fogB').setAttribute('stdDeviation',(9*(1-sh)).toFixed(2));
  $('vague').setAttribute('opacity',(1-sh).toFixed(3));$('clear').setAttribute('opacity',sh.toFixed(3));
  rise($('lk1'),p(u,TM.lack,TM.lack+.5)); strike('mst',W.motT,p(u,TM.clarity-.3,TM.clarity+.4));
  rise($('lk2'),p(u,TM.clarity,TM.clarity+.6));

  // habit stacking
  rise($('r0a'),p(u,TM.ex1,TM.ex1+.5)); rise($('r0b'),p(u,TM.ex1b,TM.ex1b+.5));
  rise($('r1a'),p(u,TM.ex2,TM.ex2+.5)); rise($('r1b'),p(u,TM.ex2b,TM.ex2b+.5));
  const ch=lin(u,TM.chain,TM.chain+2.4);
  $('chainL').setAttribute('stroke-dasharray',(1280*ch).toFixed(1)+' 1280');
  chain.forEach((c,i)=>{const on=ch>=i/4-.001&&u>=TM.chain;
    c.setAttribute('fill',on?'var(--gain)':'var(--stage)');c.setAttribute('stroke',on?'var(--gain)':'var(--ink)')});
  rise($('cueNext'),p(u,TM.chain,TM.chain+.6));

  // close
  rise($('qa'),p(u,TM.q,TM.q+.5)); rise($('qb'),p(u,TM.q2,TM.q2+.5)); rise($('qc'),p(u,TM.q3,TM.q3+.5));
}
// transport: the narration is the master clock while it is playing
const au=$('vo');
const alen=()=>isFinite(au.duration)&&au.duration>0?au.duration:70.27;
const chap=$('chapters'), cbtns=NAMES.map((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;
  b.addEventListener('click',()=>{t=SC[i][0]+(i?0.01:0);start()});chap.appendChild(b);return b});
let t=0, playing=false, prev=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function sync(){
  render(t); $('seek').value=t; $('clock').textContent=fmt(t)+' / '+fmt(DUR);
  $('play').textContent=playing?'Pause':(t>=DUR?'Replay':'Play');
  cbtns.forEach((b,i)=>b.setAttribute('aria-current',t>=SC[i][0]&&(t<SC[i][1]||i===SC.length-1)?'true':'false'));
}
function start(){
  if(t>=DUR)t=0; playing=true;
  if(t<alen()-.05){try{au.currentTime=t;const r=au.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  sync();
}
function stop(){playing=false;try{au.pause()}catch(e){} sync()}
function frame(now){
  if(playing&&prev!==null){
    if(!au.paused&&!au.ended&&au.readyState>2)t=au.currentTime; else t+=Math.min(.1,(now-prev)/1000);
    if(t>=DUR){t=DUR;playing=false;try{au.pause()}catch(e){}}
    sync();
  }
  prev=now; requestAnimationFrame(frame);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('seek').addEventListener('input',e=>{t=+e.target.value;stop()});
$('mute').addEventListener('click',e=>{au.muted=!au.muted;e.target.textContent=au.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',au.muted)});
$('full').addEventListener('click',()=>{const el=$('stageBox');
  try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}});
sync(); requestAnimationFrame(frame);
})();
</script>
</html>
