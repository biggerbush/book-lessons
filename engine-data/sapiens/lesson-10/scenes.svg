<text class="m" x="1200" y="780" font-size="20" text-anchor="middle">WHERE TO?</text>
</g>
<g id="g_txt"><text class="d" x="120" y="820" font-size="40">Powerful like gods, unsure where we’re heading.</text></g>
</g>

<g id="s8" opacity="0">
<g id="z_top"><text class="m" x="143" y="250" font-size="24">THINK OF ONE THING YOU ARE WORKING HARD TO GET</text></g>
<g id="z_a"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">Do you truly want it,</text></g>
