<g id="s0">
<text class="m" x="120" y="150" font-size="28">10X RULE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Treat success</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">as your duty.</text>
<text class="b" x="120" y="600" font-size="32">Why treating success as an obligation changes everything you do.</text>
