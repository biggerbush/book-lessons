<circle class="s-gain" cx="1150" cy="450" r="46" fill="none" stroke-width="5"/>
<circle class="ink" cx="1150" cy="450" r="32"/>
<text class="m" x="1150" y="690" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT THEY WANT: A HOLE</text>
</g>
<g id="dig">
<text class="d5" x="120" y="790" font-size="40">But Godin keeps digging.</text>
<path id="digA" class="s-gain" d="M1150 720v90M1126 786l24 24 24-24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beyond the hole.</text>
<text class="b" x="120" y="176" font-size="32">What they really want is a feeling.</text>
<g id="k0">
