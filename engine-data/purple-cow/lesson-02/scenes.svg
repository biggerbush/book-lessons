<g id="s0">
<text class="m" x="120" y="150" font-size="28">PURPLE COW · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why the old advertising</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">formula broke.</text>
<text class="b" x="120" y="600" font-size="32">Why buying attention with ads stopped working for ordinary products.</text>
<path class="s-ink" d="M1300 260l50 50 50-50" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="1220" y="310" width="260" height="190" rx="18" fill="var(--stage)" stroke-width="7"/>
<g id="tvscr"><rect class="gain" x="1244" y="334" width="212" height="142" rx="8"/><text id="adtxt" class="d" x="1350" y="425" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">AD</text></g>
<path class="s-ink" d="M1310 500l-20 40M1390 500l20 40" stroke-width="6" stroke-linecap="round"/>
<g id="qm"><text class="d" x="1350" y="445" font-size="96" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="remote"><rect class="s-ink" x="1300" y="650" width="70" height="180" rx="22" fill="var(--stage)" stroke-width="6"/><circle class="loss" cx="1335" cy="690" r="14"/><circle class="ink" cx="1320" cy="740" r="7"/><circle class="ink" cx="1350" cy="740" r="7"/><circle class="ink" cx="1320" cy="775" r="7"/><circle class="ink" cx="1350" cy="775" r="7"/></g>
<g id="sig"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A simple old recipe.</text>
<text class="b" x="120" y="176" font-size="32">For decades, companies followed one dependable formula.</text>
<g id="fac">
<g id="smoke"></g>
<rect class="ink" x="400" y="290" width="34" height="110"/>
<path class="s-ink" d="M140 600V420l80-50v50l80-50v50l80-50v50l80-50V600z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="ink" x="270" y="510" width="60" height="90"/>
<text class="m" x="300" y="660" font-size="22" text-anchor="middle">FACTORY</text>
</g>
<g id="avg">
<path class="s-muted" d="M480 500h90m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
