<text class="d" x="280" y="778" font-size="48">Being visible = being valuable.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A name for the habit.</text>
<text class="b" x="120" y="176" font-size="32">Visible activity as a rough stand-in for real accomplishment.</text>
