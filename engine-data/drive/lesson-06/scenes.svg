<g id="bpr"><rect class="ink" x="250" y="310" width="160" height="80" rx="10"/><text class="m" x="330" y="358" font-size="22" text-anchor="middle" style="fill:var(--stage)">PROFIT</text></g>
<text id="sl" class="m" x="440" y="790" font-size="22" text-anchor="middle">PROFIT IN FRONT</text>
</g>
