<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Confident humility:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the sweet spot.</text>
<text class="b" x="120" y="600" font-size="32">Why the best learners are both sure and unsure.</text>
<g id="gauge">
<path class="s-loss" d="M1150 470A150 150 0 0 1 1225 340.1" fill="none" stroke-width="24"/>
<path id="gmid" class="s-gain" d="M1225 340.1A150 150 0 0 1 1375 340.1" fill="none" stroke-width="24"/>
<path class="s-loss" d="M1375 340.1A150 150 0 0 1 1450 470" fill="none" stroke-width="24"/>
<g id="needle"><path class="s-ink" d="M1300 470V352" stroke-width="8" stroke-linecap="round"/></g>
<circle class="ink" cx="1300" cy="470" r="18"/>
<text class="m" x="1150" y="520" font-size="20">TOO UNSURE</text>
<text class="m" x="1450" y="520" font-size="20" text-anchor="end">TOO SURE</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two ditches, one road.</text>
<text class="b" x="120" y="176" font-size="32">Picture a road with a ditch on each side.</text>
<g id="road1">
<path class="loss" d="M200 560Q350 760 500 560Z" fill-opacity=".15"/>
<path class="loss" d="M1100 560Q1250 760 1400 560Z" fill-opacity=".15"/>
<path class="s-ink" d="M120 560H200Q350 760 500 560H1100Q1250 760 1400 560H1480" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="ink" x="540" y="542" width="520" height="18" rx="4"/>
<text class="m" x="800" y="604" font-size="20" text-anchor="middle">THE ROAD OF RETHINKING</text>
</g>
<g id="car"><path class="gain" d="M730 532v-24a8 8 0 0 1 8-8h22l16-26h48l16 26h22a8 8 0 0 1 8 8v24z"/><circle class="ink" cx="770" cy="534" r="13"/><circle class="ink" cx="830" cy="534" r="13"/></g>
<g id="qb">
<path class="s-ink" d="M315 652V590a12 12 0 0 1 24 0v26h22v-26a12 12 0 0 1 24 0v62" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<g id="qbp"></g>
<rect class="s-ink" x="180" y="436" width="150" height="62" rx="14" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M290 498l24 30" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="255" y="478" font-size="30" text-anchor="middle">I’d win!</text>
<text class="m" x="350" y="790" font-size="20" text-anchor="middle">ARMCHAIR QUARTERBACK</text>
<text class="m" x="350" y="822" font-size="20" text-anchor="middle">MORE CONFIDENCE THAN SKILL</text>
</g>
<g id="imp">
<g id="impp"></g>
<ellipse class="s-loss" cx="1350" cy="462" rx="90" ry="38" fill="var(--stage)" stroke-width="5"/>
<circle class="s-loss" cx="1290" cy="514" r="9" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="1350" y="473" font-size="30" text-anchor="middle">A fraud?</text>
<text class="m" x="1250" y="790" font-size="20" text-anchor="middle">IMPOSTOR</text>
<text class="m" x="1250" y="822" font-size="20" text-anchor="middle">SKILLED, BUT FEELS A FRAUD</text>
</g>
<g id="both"><text class="d" x="800" y="430" font-size="44" text-anchor="middle">Both ditches block rethinking.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The overconfident.</text>
<text class="b" x="120" y="176" font-size="32">David Dunning and Justin Kruger’s pattern on tests of skill.</text>
<g id="paper"><rect class="s-ink" x="140" y="240" width="300" height="380" rx="10" fill="var(--stage)" stroke-width="6"/><text class="m" x="170" y="290" font-size="20">TEST OF SKILL</text><g id="plines"></g></g>
<g id="leg">
<rect class="loss" x="600" y="248" width="20" height="20"/><text class="m" x="630" y="266" font-size="20">ACTUAL SCORE</text>
<rect x="860" y="248" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="5 3"/><text class="m" x="890" y="266" font-size="20">WHAT THEY GUESSED</text>
<text class="m" x="1440" y="266" font-size="18" text-anchor="end">SCHEMATIC, NOT DATA</text>
<path class="s-ink" d="M600 680H1440" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="bars"></g>
<g id="gap"><rect class="loss" x="645" y="380" width="70" height="220" fill-opacity=".12" stroke="var(--loss)" stroke-width="4" stroke-dasharray="8 6"/><text class="d" x="680" y="512" font-size="60" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="bs"><text class="d" x="120" y="790" font-size="46">When we know too little, we can’t see the gap.</text></g>
<g id="cwc"><text class="m" x="120" y="846" font-size="22" style="fill:var(--loss)">CONFIDENCE WITHOUT COMPETENCE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beware of Mount Stupid.</text>
<text class="b" x="120" y="176" font-size="32">A little knowledge can feel like expertise.</text>
<path class="s-ink" d="M160 240V760H1440" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="178" y="250" font-size="20">CONFIDENCE</text>
<text class="m" x="1440" y="800" font-size="20" text-anchor="end">KNOWLEDGE →</text>
<path id="mtf" class="loss" d="M160 760C260 760 300 300 420 300C540 300 560 680 700 680C900 680 1100 480 1440 420V760Z" fill-opacity=".1"/>
<path id="mt" class="s-ink" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M160 760C260 760 300 300 420 300C540 300 560 680 700 680C900 680 1100 480 1440 420" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="kl" class="s-gain" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M420 300C540 300 560 680 700 680C900 680 1100 480 1440 420" fill="none" stroke-width="8"/>
<g id="msl"><text class="m" x="380" y="290" font-size="22" text-anchor="end" style="fill:var(--loss)">MOUNT STUPID</text></g>
<g id="flag"><path class="s-ink" d="M444 300V236" stroke-width="5" stroke-linecap="round"/><path class="loss" d="M444 236l36 14-36 14z"/></g>
<g id="climw"><g id="clim"></g></g>
<g id="kll"><text class="m" x="980" y="470" font-size="22" style="fill:var(--gain)">KEEP LEARNING</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Halla Tómasdóttir.</text>
<text class="b" x="120" y="176" font-size="32">A businesswoman from Iceland who doubted herself.</text>
<g id="halla"><g id="hallap"></g><text class="m" x="340" y="680" font-size="22" text-anchor="middle">HALLA TÓMASDÓTTIR</text><text class="m" x="340" y="712" font-size="20" text-anchor="middle">ICELAND</text></g>
<g id="ballot"><g id="bp"><rect class="s-ink" x="720" y="350" width="80" height="100" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M738 400l14 16 30-34" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect class="s-ink" x="620" y="480" width="280" height="200" rx="12" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="700" y="474" width="120" height="12" rx="6"/>
<text class="d5" x="760" y="600" font-size="44" text-anchor="middle">2016</text><text class="m" x="760" y="720" font-size="20" text-anchor="middle">PRESIDENTIAL ELECTION</text></g>
<g id="cloud"><path id="cl" class="loss" fill-opacity=".2" d="M280 340a40 40 0 0 1-6-79a56 56 0 0 1 104-22a46 46 0 0 1 74 46a28 28 0 0 1-12 55z"/><circle class="loss" cx="384" cy="366" r="9" fill-opacity=".3"/><text class="m" x="360" y="300" font-size="20" text-anchor="middle">AM I QUALIFIED?</text></g>
<g id="fuel"><path class="s-gain" d="M470 290C640 220 840 240 990 305" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/></g>
<g id="f0"><rect class="gain" x="1000" y="260" width="440" height="90" rx="16"/><text class="d5" x="1040" y="320" font-size="40" style="fill:var(--on-gain)">Study</text></g>
<g id="f1"><rect class="gain" x="1000" y="380" width="440" height="90" rx="16"/><text class="d5" x="1040" y="440" font-size="40" style="fill:var(--on-gain)">Listen</text></g>
<g id="f2"><rect class="gain" x="1000" y="500" width="440" height="90" rx="16"/><text class="d5" x="1040" y="560" font-size="40" style="fill:var(--on-gain)">Prepare</text></g>
<g id="fl"><text class="m" x="1000" y="640" font-size="22" style="fill:var(--gain)">DOUBT BECOMES FUEL</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Barely noticed, then second.</text>
<text class="b" x="120" y="176" font-size="32">Her 2016 presidential race in the polls (schematic).</text>
<g id="chart"><path class="s-ink" d="M160 260V720H1100" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="178" y="270" font-size="20">SUPPORT</text><text class="m" x="1100" y="760" font-size="20" text-anchor="end">ELECTION DAY</text>
<g id="others"></g><text class="m" x="196" y="664" font-size="20" style="fill:var(--gain)">HALLA</text>
<path id="hl" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle id="hd" class="gain" cx="180" cy="690" r="14"/></g>
<g id="p2"><text class="d" x="1180" y="450" font-size="150" letter-spacing="-4" style="fill:var(--gain)">2nd</text><text class="m" x="1184" y="540" font-size="20">PLACE ON ELECTION DAY</text></g>
<g id="dw"><text class="m" x="1184" y="620" font-size="20">SHE DID NOT WIN, BUT</text><text class="m" x="1184" y="652" font-size="20">PROVED HER DOUBTERS,</text><text class="m" x="1184" y="684" font-size="20">AND HERSELF, WRONG</text></g>
<g id="hum"><text class="d" x="120" y="830" font-size="40">Humility kept her curious. Confidence kept her running.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Confident humility.</text>
<text class="b" x="120" y="176" font-size="32">Believe in yourself. Doubt your current answer.</text>
<g id="va"><circle id="vc1" class="s-ink" cx="540" cy="470" r="220" fill="none" stroke-width="6"/><text class="d" x="540" y="740" font-size="40" text-anchor="middle">Confidence</text><text class="m" x="540" y="780" font-size="20" text-anchor="middle">I CAN LEARN AND REACH MY GOAL</text></g>
<g id="vb"><circle id="vc2" class="s-ink" cx="1060" cy="470" r="220" fill="none" stroke-width="6"/><text class="d" x="1060" y="740" font-size="40" text-anchor="middle">Humility</text><text class="m" x="1060" y="780" font-size="20" text-anchor="middle">MY ANSWER MIGHT BE WRONG</text></g>
<g id="fut"><path class="s-ink" d="M460 500H600M580 480l20 20-20 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path class="s-ink" d="M650 520V400" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M650 400l50 20-50 20z"/></g>
<g id="qmk"><text class="d" x="1060" y="540" font-size="200" text-anchor="middle">?</text></g>
<g id="lens"><path class="gain" d="M800 309A220 220 0 0 1 800 631A220 220 0 0 1 800 309Z"/><text class="d" x="800" y="482" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">BOTH</text></g>
<g id="ptr"><path class="s-gain" d="M800 640V796" stroke-width="4"/><text class="m" x="800" y="832" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE SWEET SPOT</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Before your next big decision, write it down.</text>
<g id="nb"><rect class="s-ink" x="160" y="220" width="1280" height="580" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g>
<text class="m" x="240" y="290" font-size="22">WHAT I BELIEVE</text><g id="belg"></g>
<path class="s-line" d="M200 390H1400M800 410V770" stroke-width="4"/></g>
<g id="lc"><text class="m" x="240" y="450" font-size="22" style="fill:var(--gain)">I’M SURE I CAN LEARN</text><g id="lcl"></g></g>
<g id="rc"><text class="m" x="840" y="450" font-size="22" style="fill:var(--loss)">I MIGHT BE WRONG ABOUT</text><g id="rcl"></g></g>
<g id="hil"><rect x="820" y="612" width="440" height="56" rx="12" fill="none" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="840" y="730" font-size="22" style="fill:var(--gain)">TEST THIS FIRST</text></g>
<g id="magw"><g id="mag"><circle class="s-ink" cx="0" cy="0" r="60" fill="var(--stage)" fill-opacity=".3" stroke-width="10"/><path class="s-ink" d="M42 42L100 100" stroke-width="18" stroke-linecap="round"/></g></g>
</g>

<g id="s8" opacity="0">
<g id="w0"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Where in your life are</text></g>
<g id="w1"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">you sitting in a ditch?</text></g>
<g id="w2"><text class="d" x="136" y="540" font-size="80" letter-spacing="-2" style="fill:var(--gain)">Which way do you need</text></g>
<g id="w3"><text class="d" x="136" y="640" font-size="80" letter-spacing="-2" style="fill:var(--gain)">to steer?</text></g>
<g id="wh"><g id="wheel"><circle class="s-ink" cx="1340" cy="470" r="110" fill="none" stroke-width="16"/><path class="s-ink" d="M1232 470H1448M1340 470V580" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="1340" cy="470" r="28"/></g>
<path class="s-ink" d="M1190 640h25q30 50 60 0h120q30 50 60 0h25" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="m" x="143" y="760" font-size="26">STEER BACK TO THE ROAD</text>
</g>