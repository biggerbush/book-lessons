<path id="lq2" class="s-loss" fill="none" stroke-width="5" stroke-linecap="round"/>
</g></g>
<g id="lis">
<g id="lisP"></g>
<circle id="lring" class="s-gain" cx="1300" cy="470" r="70" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="1300" y="766" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE LISTENER</text>
</g>
<g id="you8"><text class="m" x="143" y="680" font-size="26">THERE IS SOMEONE LISTENING,</text><text class="m" x="143" y="718" font-size="26">AND THAT LISTENER IS YOU</text></g>
</g>