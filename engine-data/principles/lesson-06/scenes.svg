<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask, then listen.</text>
<text class="b" x="120" y="176" font-size="32">How you treat an opinion depends on who holds it.</text>
<g id="p0"><rect class="s-line" x="120" y="220" width="420" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
