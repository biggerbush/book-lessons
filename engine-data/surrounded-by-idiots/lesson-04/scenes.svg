<g id="n_link"><text class="m" x="1250" y="800" font-size="22" text-anchor="middle">HOW IT AFFECTS THEM</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask, don’t assume.</text>
<text class="b" x="120" y="176" font-size="32">Greens rarely volunteer opinions in a big meeting.</text>
<g id="a_meet"><ellipse class="s-ink" cx="370" cy="520" rx="170" ry="60" fill="var(--stage)" stroke-width="6"/><g id="a_heads"></g><text class="m" x="370" y="700" font-size="22" text-anchor="middle">BIG MEETING</text></g>
<g id="a_q"><text class="d" x="207" y="390" font-size="60" text-anchor="middle" style="fill:var(--muted)">?</text></g>
<g id="a_one"><text class="m" x="910" y="700" font-size="22" text-anchor="middle">ONE TO ONE, WHERE IT FEELS SAFE</text></g>
<g id="a_ask"><rect class="s-ink" x="730" y="320" width="100" height="70" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="780" y="372" font-size="44" text-anchor="middle">?</text></g>
<g id="a_ans"><rect class="s-gain" x="990" y="320" width="100" height="70" rx="18" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="1015" cy="355" r="7"/><circle class="gain" cx="1040" cy="355" r="7"/><circle class="gain" cx="1065" cy="355" r="7"/></g>
<g id="a_door"><rect class="s-ink" x="1270" y="340" width="170" height="300" fill="var(--gain)" fill-opacity=".25" stroke-width="6"/><polygon id="a_panel" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1355" y="700" font-size="22" text-anchor="middle">DOOR STAYS OPEN</text></g>
<g id="a_listen"><text class="d" x="120" y="800" font-size="40">Ask directly. Then really listen.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Warmth first.</text>
<text class="b" x="120" y="176" font-size="32">A friendly word before business. Then patience.</text>
<g id="w_cup"><g id="w_steam"></g><path class="s-ink" d="M410 450a40 40 0 0 1 0 80" fill="none" stroke-width="10"/><path class="gain" d="M250 420H410V510A80 80 0 0 1 250 510Z"/><path class="s-ink" d="M220 610H440" stroke-width="8" stroke-linecap="round"/><text class="d5" x="330" y="720" font-size="34" text-anchor="middle">A friendly word</text></g>
