<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Climbing out of debt</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">with determination.</text>
<text class="b" x="120" y="600" font-size="32">A runaway debtor finds a simple plan to pay everyone back.</text>
