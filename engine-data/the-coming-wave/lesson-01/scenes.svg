<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMING WAVE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Technology always</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">arrives in waves.</text>
<text class="b" x="120" y="600" font-size="32">Why powerful inventions always spread, and why they’re so hard to stop</text>
<g id="tw"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">General-purpose technologies.</text>
<text class="b" x="120" y="176" font-size="32">Inventions so useful they spread into almost every part of life.</text>
<g id="br"></g>
<g id="brx"></g>
<g id="hub"><circle class="gain" cx="300" cy="500" r="80"/><text class="m" x="300" y="496" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">GENERAL-</text><text class="m" x="300" y="522" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">PURPOSE</text></g>
<g id="wc1"><path id="wcf" fill="var(--gain)" fill-opacity=".12"/><path id="wcl" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round"/><g id="wcr"></g><text class="m" x="880" y="780" font-size="22">THEY ARRIVE IN CLUSTERS, LIKE A WAVE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1886: the first motor car.</text>
<text class="b" x="120" y="176" font-size="32">Carl Benz built a three-wheeled motor car in Germany.</text>
<path class="s-line" d="M120 700H1480" stroke-width="4"/>
<g id="car">
<g id="pf"></g>
<rect class="s-ink" x="470" y="460" width="90" height="50" rx="6" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="590" y="410" width="20" height="100" rx="6"/>
<rect class="ink" x="600" y="462" width="100" height="40" rx="8"/>
<path class="s-ink" d="M760 530L740 430M718 430h44M760 530L860 650" fill="none" stroke-width="7" stroke-linecap="round"/>
<rect class="gain" x="470" y="510" width="300" height="34" rx="10"/>
<circle class="s-ink" cx="560" cy="620" r="80" fill="none" stroke-width="7"/>
<circle class="s-ink" cx="860" cy="650" r="50" fill="none" stroke-width="6"/>
<g id="wr"></g><g id="wf"></g>
<text class="m" x="690" y="752" font-size="20" text-anchor="middle">BENZ MOTOR CAR · 1886</text>
</g>
<g id="crd"><text class="m" x="120" y="790" font-size="20">A NOISY CURIOSITY FEW COULD AFFORD</text></g>
<g id="hrs">
<rect class="s-ink" x="990" y="560" width="110" height="50" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="1045" cy="654" r="44" fill="none" stroke-width="5"/>
<path class="s-muted" d="M1100 600L1150 610" stroke-width="5"/>
<path class="s-ink" d="M1135 590q-30 10-30 50M1160 620v80M1185 625v75M1235 625v75M1260 620v80" fill="none" stroke-width="9" stroke-linecap="round"/>
<ellipse class="ink" cx="1210" cy="600" rx="75" ry="36"/>
<path class="ink" d="M1260 590L1300 520L1325 530L1290 610zM1296 512l50 14-6 20-46-10z"/>
<text class="m" x="1480" y="790" font-size="20" text-anchor="end">HORSES STILL RULED THE ROADS</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then it got cheaper every year.</text>
<text class="b" x="120" y="176" font-size="32">Henry Ford’s assembly line turned out the Model T in huge numbers.</text>
<g id="fl"><rect class="ink" x="420" y="214" width="80" height="34" rx="6"/><rect id="stamp" class="ink" x="450" y="248" width="20" height="22"/>
<rect class="ink" x="120" y="336" width="640" height="18" rx="9"/><g id="belt"></g>
<text class="m" x="120" y="395" font-size="20">MODEL T · ASSEMBLY LINE</text></g>
<g id="pd"><path class="s-ink" d="M160 450V760H720" fill="none" stroke-width="4"/>
<path id="pl" class="s-gain" d="M180 480H260V530H340V580H420V630H500V670H580V700H700" fill="none" stroke-width="7" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
<path id="bl" class="s-ink" d="M180 740L260 735L340 720L420 690L500 640L580 570L700 490" fill="none" stroke-width="6" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
<text class="m" x="712" y="705" font-size="20" style="fill:var(--gain)">PRICE</text><text class="m" x="712" y="495" font-size="20">BUYERS</text></g>
<g id="cyc"><circle class="s-line" cx="1170" cy="530" r="170" fill="none" stroke-width="6"/><g id="cyx"></g>
<text class="m" x="1170" y="790" font-size="22" text-anchor="middle">THE CYCLE KEEPS SPINNING</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then they were everywhere.</text>
<text class="b" x="120" y="176" font-size="32">Within a few decades, cars and engines filled streets across the world.</text>
<g id="ct"><text class="m" x="120" y="236" font-size="20">STREETS ACROSS THE WORLD</text><g id="bld"></g>
<path class="s-ink" d="M120 400H760M120 470H760" stroke-width="5"/><path class="s-muted" d="M120 435H760" stroke-width="3" stroke-dasharray="14 12"/><g id="cars"></g></g>
<g id="eng"><g id="engx"></g><g id="gear"></g><text class="m" x="1190" y="612" font-size="20" text-anchor="middle">THE ENGINE</text></g>
<g id="wm"><circle class="s-ink" cx="260" cy="650" r="120" fill="var(--stage)" stroke-width="5"/><ellipse class="s-line" cx="260" cy="650" rx="56" ry="120" fill="none" stroke-width="3"/>
<path class="s-line" d="M140 650h240M156 590h208M156 710h208" stroke-width="3"/><g id="gd"></g>
<text class="d5" x="420" y="630" font-size="40">A rare luxury became</text><text class="d5" x="420" y="684" font-size="40">part of daily life.</text>
<text class="m" x="420" y="740" font-size="22" style="fill:var(--gain)">ON EVERY CONTINENT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="64">The same story: the printing press.</text>
<text class="b" x="120" y="176" font-size="32">Gutenberg, in the fifteenth century.</text>
<g id="gp"><rect class="ink" x="180" y="280" width="22" height="440"/><rect class="ink" x="378" y="280" width="22" height="440"/>
<rect class="ink" x="160" y="250" width="260" height="40" rx="6"/>
<line id="scr" class="s-ink" x1="290" y1="290" x2="290" y2="410" stroke-width="10"/>
<line id="hdl" class="s-ink" x1="240" y1="340" x2="340" y2="340" stroke-width="8" stroke-linecap="round"/>
<rect id="plat" class="ink" x="230" y="410" width="120" height="26" rx="4"/>
<rect class="gain" x="240" y="500" width="100" height="14"/>
<rect class="s-ink" x="200" y="514" width="180" height="40" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="150" y="700" width="280" height="22" rx="6"/>
<text class="m" x="290" y="770" font-size="20" text-anchor="middle">GUTENBERG’S PRESS</text></g>
<g id="eu"><rect class="s-line" x="520" y="250" width="460" height="360" rx="24" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="550" y="292" font-size="20">PRESSES ACROSS EUROPE</text>
<path d="M560 520L600 470L650 470L670 430L700 400L740 380L790 370L820 340L850 370L900 360L950 380L950 560L900 580L870 560L860 595L840 565L815 530L830 590L815 600L780 545L745 510L700 520L670 505L645 525L640 580L590 595L560 570Z" fill="var(--line)" fill-opacity=".5" stroke="var(--muted)" stroke-width="3" stroke-linejoin="round"/>
<path d="M665 335L690 318L708 355L692 392L662 385Z" fill="var(--line)" fill-opacity=".5" stroke="var(--muted)" stroke-width="3" stroke-linejoin="round"/>
<path d="M830 335L855 312L920 312L900 335L870 350Z" fill="var(--line)" fill-opacity=".5" stroke="var(--muted)" stroke-width="3" stroke-linejoin="round"/>
<g id="eul"></g><g id="eud"></g></g>
<g id="pr"><text class="m" x="520" y="670" font-size="20">PRICE OF BOOKS</text>
<path id="pra" class="s-gain" d="M540 700C700 700 820 760 940 790" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<path id="prh" class="gain" d="M952 793L927 800L933 776z"/></g>
<g id="bk"><text class="m" x="1060" y="290" font-size="20">A FEW HANDWRITTEN COPIES</text>
<rect class="s-ink" x="1080" y="320" width="80" height="100" rx="6" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="1180" y="320" width="80" height="100" rx="6" fill="var(--stage)" stroke-width="5"/>
<path class="s-muted" d="M1094 345q10-6 20 0t20 0t18 0M1094 370q10-6 20 0t20 0t18 0M1094 395q10-6 20 0t20 0M1194 345q10-6 20 0t20 0t18 0M1194 370q10-6 20 0t20 0t18 0M1194 395q10-6 20 0t20 0" fill="none" stroke-width="3"/>
<path class="s-muted" d="M1220 440v60m-14-14 14 14 14-14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="bk2"><g id="bst"></g><g id="rdr"></g><text class="m" x="1060" y="770" font-size="20">NOW FOR ORDINARY READERS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The pattern repeats.</text>
<text class="b" x="120" y="176" font-size="32">Suleyman sums it up simply.</text>
<g id="qc6"><rect class="s-ink" x="120" y="230" width="640" height="250" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="170" y="284" font-size="20">MUSTAFA SULEYMAN</text>
<text class="d" x="166" y="370" font-size="64">“Proliferation</text><text class="d" x="166" y="446" font-size="64" style="fill:var(--gain)">is the default.”</text></g>
<g id="dem"><rect class="gain" x="120" y="560" width="200" height="60" rx="30"/><text class="m" x="220" y="597" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">USEFUL</text>
<rect class="gain" x="120" y="650" width="200" height="60" rx="30"/><text class="m" x="220" y="687" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CHEAP</text>
<path id="dar" class="s-ink" d="M350 635H520" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><path class="ink" d="M542 635l-26-15v30z"/>
<g id="ppl"></g><text class="m" x="120" y="790" font-size="22">PEOPLE FIND A WAY TO GET IT</text></g>
<g id="ban"><path class="s-line" d="M880 668H1480" stroke-width="4"/><g id="fl6"></g>
<rect class="ink" x="1172" y="470" width="16" height="110"/>
<circle cx="1180" cy="380" r="90" fill="var(--stage)" stroke="var(--loss)" stroke-width="14"/><path d="M1116 316l128 128" stroke="var(--loss)" stroke-width="14"/>
<text class="m" x="880" y="740" font-size="20">BANS MOSTLY DELAYED NEW TOOLS</text><text class="m" x="880" y="772" font-size="20">OR LEFT THE BANNERS BEHIND</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t ask if. Ask how.</text>
<text class="b" x="120" y="176" font-size="32">The real question is not whether a new technology will spread.</text>
<g id="ey"><text class="d5" x="120" y="320" font-size="52" fill-opacity=".55">Will it spread?</text>
<circle class="s-ink" cx="1360" cy="300" r="60" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1403 343l50 50" stroke-width="14" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1360" cy="300" rx="36" ry="20" fill="none" stroke-width="5"/><circle id="pup" class="gain" cx="1360" cy="300" r="11"/></g>
<line id="stk" class="s-ink" x1="112" y1="302" x2="112" y2="302" stroke-width="6" stroke-linecap="round"/>
<g id="ey2"><text class="d5" x="620" y="316" font-size="40" style="fill:var(--gain)">It will. So ask how.</text></g>
<g id="k0"><rect class="s-line" x="120" y="430" width="440" height="220" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-ink" cx="340" cy="510" r="50" fill="none" stroke-width="6"/><path id="hm" class="s-gain" d="M340 510V472" stroke-width="5" stroke-linecap="round"/><path id="hh" class="s-ink" d="M340 510h24" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="340" y="620" font-size="36" text-anchor="middle">How fast?</text></g>
<g id="k1"><rect class="s-line" x="580" y="430" width="440" height="220" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M740 480h80l30 30-30 30h-80z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="826" cy="510" r="7"/>
<path class="s-gain" d="M780 490v38m-12-12 12 12 12-12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="800" y="620" font-size="36" text-anchor="middle">How cheaply?</text></g>
<g id="k2"><rect class="s-line" x="1040" y="430" width="440" height="220" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="ink" cx="1230" cy="480" r="20"/><path class="ink" d="M1200 564v-26a30 30 0 0 1 60 0v26z"/><path class="gain" d="M1300 500l18 18-18 18-18-18z"/>
<text class="d5" x="1260" y="620" font-size="36" text-anchor="middle">Who holds it?</text></g>
<g id="chk"><rect class="s-line" x="120" y="690" width="1360" height="150" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="160" y="740" width="50" height="50" rx="8" fill="none" stroke-width="5"/>
<path id="tick" class="s-gain" d="M170 764l14 14 30-36" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
<text class="d5" x="250" y="752" font-size="36">When a tool clearly works,</text><text class="d" x="250" y="810" font-size="40" style="fill:var(--gain)">assume it will soon be everywhere.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="76" letter-spacing="-2">What tool do you use daily</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="76" letter-spacing="-2">that was rare five years ago?</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="76" letter-spacing="-2">Where will it be in <tspan style="fill:var(--gain)">five more?</tspan></text></g>
<g id="qlab"><text class="m" x="143" y="640" font-size="26">ASSUME IT WILL SOON BE EVERYWHERE</text></g>
<path id="qw" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/><circle id="qr" class="ink" r="16"/>
</g>