</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The internet changed the rules.</text>
<text class="b" x="120" y="176" font-size="32">Anyone could publish to the whole world, for little or no money.</text>
<g id="l_lap">
