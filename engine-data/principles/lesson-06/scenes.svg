<text class="m" x="1374" y="800" font-size="20" text-anchor="middle">LESS BELIEVABLE</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two tests of believability.</text>
<g id="c1">
<rect class="s-line" x="120" y="220" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="tro"></g>
<text class="m" x="160" y="460" font-size="22" style="fill:var(--gain)">1 · TRACK RECORD</text>
<text class="d5" x="160" y="525" font-size="36">Done it successfully,</text>
<text class="d5" x="160" y="575" font-size="36">at least three times.</text>
</g>
<g id="c2">
<rect class="s-line" x="840" y="220" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="880" y="300" font-size="20">CAUSE</text>
<text class="m" x="1420" y="300" font-size="20" text-anchor="end">EFFECT</text>
<g id="chn"></g>
<text class="m" x="880" y="460" font-size="22" style="fill:var(--gain)">2 · CLEAR REASONING</text>
<text class="d5" x="880" y="525" font-size="36">Explains the cause</text>
<text class="d5" x="880" y="575" font-size="36">and effect behind it.</text>
</g>
<g id="luck"><text class="m" x="120" y="700" font-size="22">RECORD, NO REASONING</text><text class="d" x="120" y="770" font-size="48" style="fill:var(--loss)">Maybe just luck.</text></g>
<g id="theo"><text class="m" x="840" y="700" font-size="22">REASONING, NO RECORD</text><text class="d" x="840" y="770" font-size="48" style="fill:var(--loss)">Just a theory.</text></g>
</g>

<g id="s4" opacity="0">
