<path id="rt1" d="M325 472Q480 560 630 560" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<circle class="s-ink" cx="660" cy="330" r="30" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="660" cy="560" r="30" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="660" y="385" font-size="18" text-anchor="middle">DOMINANCE</text>
<text class="m" x="660" y="615" font-size="18" text-anchor="middle">AFFILIATION</text>
<circle class="gain" cx="300" cy="450" r="22"/><path class="gain" d="M282 462L300 500L318 462z"/>
<text class="m" x="300" y="540" font-size="18" text-anchor="middle">YOUR AUDIENCE</text>
</g>
<g id="lockg">
<path id="shk" class="s-ink" d="M1110 420V350a80 80 0 0 1 160 0v70" fill="none" stroke-width="22"/>
<rect id="lbody" x="1060" y="420" width="260" height="220" rx="24" fill="var(--ink)"/>
<circle cx="1190" cy="510" r="18" fill="var(--stage)"/><rect x="1182" y="514" width="16" height="44" fill="var(--stage)"/>
</g>
<g id="key"><circle class="s-gain" cx="880" cy="530" r="30" fill="none" stroke-width="10"/><path class="s-gain" d="M910 530H1180M1130 530v26M1160 530v20" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<g id="kl0"><text class="m" x="1190" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">MORE RESPECTED</text></g>
<g id="kl1"><text class="m" x="1190" y="736" font-size="22" text-anchor="middle" style="fill:var(--gain)">MORE CONNECTED</text></g>
<g id="worth"><text class="d" x="120" y="820" font-size="48">That is when the gap feels worth crossing.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="140" y="250" font-size="26">THINK OF THE PEOPLE YOU SERVE</text></g>
<g id="q1"><text class="d" x="136" y="370" font-size="72" letter-spacing="-2">What gap could you</text></g>
<g id="q2"><text class="d" x="136" y="460" font-size="72" letter-spacing="-2">honestly open for them,</text></g>
<g id="q3"><text class="d" x="136" y="550" font-size="72" letter-spacing="-2">and how would crossing it</text></g>
<g id="q4"><text class="d" x="136" y="640" font-size="72" letter-spacing="-2">change how they see <tspan style="fill:var(--gain)">themselves?</tspan></text></g>
<g id="qg">
