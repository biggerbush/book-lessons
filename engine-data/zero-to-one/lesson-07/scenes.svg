<g id="s0">
<text class="m" x="120" y="150" font-size="28">ZERO TO ONE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Seven questions every</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">startup must answer.</text>
<text class="b" x="120" y="600" font-size="32">Seven tough tests that separate lasting companies from expensive failures.</text>
<rect class="s-ink" x="1200" y="220" width="260" height="340" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1290" y="204" width="80" height="32" rx="8"/>
<g id="cl"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The clean energy rush.</text>
<text class="b" x="120" y="176" font-size="32">In the mid 2000s, it looked like the next big thing.</text>
<g id="sol"><circle class="gain" cx="530" cy="262" r="34"/>
<rect class="s-ink" x="160" y="320" width="320" height="200" fill="var(--ice)" stroke-width="6"/>
<path class="s-ink" d="M240 320v200M320 320v200M400 320v200M160 387h320M160 453h320" stroke-width="3"/>
<path class="s-ink" d="M260 520v80M380 520v80M140 600h420" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="160" y="650" font-size="20">SOLAR · WIND · BATTERIES</text></g>
<g id="money"></g>
<g id="mlab"><text class="m" x="640" y="650" font-size="20">INVESTORS + GOVERNMENTS</text></g>
<g id="chart"><path class="s-ink" d="M1000 260V600H1460" fill="none" stroke-width="5" stroke-linecap="round"/>
<path id="cline" class="s-loss" d="M1020 560L1100 500L1180 420L1260 320L1300 300L1360 580L1440 590" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<text class="m" x="1360" y="640" font-size="20" text-anchor="middle">AROUND 2011</text></g>
<g id="ign"><text class="d" x="120" y="790" font-size="48">They ignored basic business questions.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Engineering. 2. Timing.</text>
<g id="q1"><rect class="s-line" x="120" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">QUESTION 1 · ENGINEERING</text>
<g id="gearR"></g><circle cx="260" cy="410" r="24" fill="var(--stage)"/>
<text class="d5" x="370" y="420" font-size="32">A real breakthrough?</text>
<text class="m" x="150" y="530" font-size="20">WHAT EXISTS</text><rect class="ink" x="150" y="545" width="50" height="30" rx="4"/>
<g id="tenx"><text class="m" x="150" y="620" font-size="20" style="fill:var(--gain)">AIM FOR ABOUT 10× BETTER</text><rect id="b10" class="gain" x="150" y="635" width="50" height="30" rx="4"/></g></g>
<g id="q2"><rect class="s-line" x="840" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22">QUESTION 2 · TIMING</text>
<circle class="s-ink" cx="1000" cy="410" r="80" fill="var(--stage)" stroke-width="7"/><g id="ctk"></g>
<line id="hh" class="s-ink" x1="1000" y1="410" x2="1000" y2="365" stroke-width="8" stroke-linecap="round"/>
<line id="hm" class="s-ink" x1="1000" y1="410" x2="1000" y2="346" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="1110" y="420" font-size="32">The right moment?</text></g>
<g id="rush"><g id="rushIn"></g><text class="m" x="870" y="690" font-size="20" style="fill:var(--loss)">RUSHING IN BECAUSE EVERYONE ELSE WAS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Monopoly. 4. People.</text>
<g id="q3"><text class="m" x="120" y="260" font-size="22">QUESTION 3 · MONOPOLY</text>
<circle cx="400" cy="470" r="130" fill="var(--stage)"/><path id="wedge" class="gain"/>
<circle class="s-ink" cx="400" cy="470" r="130" fill="none" stroke-width="6"/></g>
<g id="share"><text class="d5" x="400" y="670" font-size="40" text-anchor="middle" style="fill:var(--gain)">Big share</text>
<text class="m" x="400" y="710" font-size="22" text-anchor="middle">OF A SMALL MARKET</text></g>
<g id="q4"><text class="m" x="800" y="260" font-size="22">QUESTION 4 · THE RIGHT TEAM?</text><g id="crew"></g></g>
<g id="ties"></g>
<g id="tlab"><text class="m" x="800" y="610" font-size="22" style="fill:var(--loss)">POLISHED SALESPEOPLE IN SUITS,</text>
<text class="m" x="800" y="646" font-size="22" style="fill:var(--loss)">NOT TECHNICAL BUILDERS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">5. Distribution.</text>
<text class="b" x="120" y="176" font-size="32">Can you actually get your product to customers?</text>
