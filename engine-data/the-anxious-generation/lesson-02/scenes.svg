<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ANXIOUS GENERATION · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Children need free</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">play to grow.</text>
<text class="b" x="120" y="600" font-size="32">Why small risks and free play make kids stronger.</text>
