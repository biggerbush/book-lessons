<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Meet your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">two minds.</text>
<text class="b" x="120" y="600" font-size="32">Meet the fast, intuitive mind and the slow, lazy one.</text>
<path class="s-ink" d="M1150 720v-30a140 140 0 0 1 280 0v30z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<circle class="s-ink" cx="1290" cy="400" r="150" fill="var(--stage)" stroke-width="7"/>
<path id="split" class="s-line" d="M1290 262V538" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="h1"><polygon class="gain" points="1250,300 1190,410 1228,410 1200,500 1272,385 1234,385 1262,300"/><text class="m" x="1215" y="225" font-size="22" text-anchor="middle" style="fill:var(--gain)">FAST</text></g>
<g id="h2"><text id="zz" class="d" x="1316" y="430" font-size="72" style="fill:var(--loss)">Zz</text><text class="m" x="1365" y="225" font-size="22" text-anchor="middle">SLOW</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">System 1: fast and automatic.</text>
<text class="b" x="120" y="176" font-size="32">You know before you decide.</text>
<g id="face">
<rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="275" font-size="20">PHOTO</text>
<circle class="s-ink" cx="330" cy="480" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M255 430l55 25M405 430l-55 25M270 570q60-45 120 0" fill="none" stroke-width="9" stroke-linecap="round"/>
<circle class="ink" cx="295" cy="478" r="11"/><circle class="ink" cx="365" cy="478" r="11"/>
</g>
<polygon id="lt" class="gain" points="700,370 620,470 675,470 645,560 745,440 690,440 725,370"/>
<g id="kn">
<rect class="s-ink" x="820" y="240" width="660" height="300" rx="24" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="860" y="290" font-size="20">YOU ALREADY KNOW</text>
<text class="d" x="860" y="380" font-size="56">She’s upset.</text>
<text class="d5" x="860" y="450" font-size="38">She’s about to say</text>
<text class="d5" x="860" y="500" font-size="38">something harsh.</text>
</g>
<g id="s1tag"><rect class="gain" x="820" y="590" width="320" height="84" rx="42"/><text class="d" x="980" y="646" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">SYSTEM 1</text></g>
<g id="sw"><rect class="gain" x="1190" y="590" width="170" height="84" rx="42"/><circle cx="1318" cy="632" r="30" fill="var(--stage)"/><text class="m" x="1190" y="712" font-size="20">CAN’T SWITCH IT OFF</text></g>
<g id="auto"><text class="d" x="120" y="800" font-size="46">Instant. Effortless. Automatic.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">System 2: slow and effortful.</text>
<text class="b" x="120" y="176" font-size="32">Multiply 17 by 24 and feel the work.</text>
<rect class="s-line" x="120" y="220" width="620" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="mp"><text class="d" x="160" y="330" font-size="96">17 × 24</text></g>
<g id="st0"><text class="d5" x="160" y="440" font-size="44">17 × 20 = 340</text></g>
<g id="st1"><text class="d5" x="160" y="510" font-size="44">17 × 4 = 68</text><path class="s-ink" d="M160 545h400" stroke-width="4"/></g>
<g id="st2"><text class="d" x="160" y="620" font-size="52">340 + 68 = <tspan style="fill:var(--gain)">408</tspan></text></g>
<g id="mem"><text class="m" x="160" y="730" font-size="20">HOLDING NUMBERS IN MEMORY</text></g>
<g id="gr">
<path id="gA" class="s-ink" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path id="gB" class="s-ink" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<circle class="ink" cx="980" cy="420" r="26"/><circle class="ink" cx="1190" cy="515" r="18"/>
</g>
<g id="s2tag"><rect class="loss" x="860" y="700" width="300" height="84" rx="42"/><text class="d" x="1010" y="756" font-size="40" text-anchor="middle" style="fill:var(--stage)">SYSTEM 2</text><text class="m" x="860" y="830" font-size="20">SLOW · DELIBERATE · EFFORTFUL</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Effort has a cost.</text>
<text class="b" x="120" y="176" font-size="32">System 2 runs on a limited budget of attention.</text>
<g id="bat">
<rect class="s-ink" x="120" y="250" width="280" height="140" rx="14" fill="none" stroke-width="7"/>
<rect class="ink" x="400" y="290" width="22" height="60" rx="4"/>
<rect id="batf" x="136" y="266" width="248" height="108" rx="6"/>
<text class="m" x="120" y="430" font-size="20">ATTENTION BUDGET</text>
</g>
<g id="wkp">
<path class="s-line" d="M520 600h480" stroke-width="5" stroke-linecap="round"/>
<g id="wk"><circle class="ink" cx="0" cy="-170" r="26"/><rect class="ink" x="-30" y="-138" width="60" height="84" rx="26"/><path id="lg" class="s-ink" fill="none" stroke-width="12" stroke-linecap="round"/></g>
<text class="m" x="520" y="640" font-size="20">STOPS IN THEIR TRACKS</text>
</g>
<g id="thk"><rect class="s-ink" x="700" y="250" width="260" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d" x="830" y="310" font-size="40" text-anchor="middle">17 × 24?</text><circle class="ink" cx="812" cy="368" r="10"/><circle class="ink" cx="800" cy="394" r="6"/></g>
<g id="couch">
<rect x="1080" y="430" width="380" height="100" rx="22" fill="var(--line)"/>
<circle class="loss" cx="1160" cy="488" r="28"/><rect class="loss" x="1190" y="470" width="220" height="46" rx="23"/>
<rect class="ink" x="1080" y="520" width="380" height="70" rx="14"/>
<rect class="ink" x="1060" y="470" width="50" height="120" rx="20"/><rect class="ink" x="1430" y="470" width="50" height="120" rx="20"/>
<text id="zz2" class="d" x="1200" y="410" font-size="44" style="fill:var(--loss)">Zz</text>
<text class="m" x="1270" y="640" font-size="20" text-anchor="middle">LAZY SYSTEM 2</text>
</g>
<g id="cost"><text class="d" x="120" y="780" font-size="44">Hard thinking feels costly, so the mind avoids it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bat and the ball.</text>
<text class="b" x="120" y="176" font-size="32">A famous puzzle from the book.</text>
<g id="bb">
<path class="s-ink" d="M210 600L470 320" stroke-width="44" stroke-linecap="round"/>
<path class="s-ink" d="M150 665L215 595" stroke-width="16" stroke-linecap="round"/>
<circle class="s-ink" cx="620" cy="600" r="52" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M585 565q35 35 0 70M655 565q-35 35 0 70" fill="none" stroke-width="4"/>
</g>
<g id="tot"><path class="s-ink" d="M150 700v24h530v-24" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="d" x="415" y="800" font-size="52" text-anchor="middle">$1.10 together</text></g>
<g id="tag"><path class="s-ink" d="M820 260h580l60 70-60 70h-580z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="s-ink" cx="1400" cy="330" r="12" fill="none" stroke-width="4"/><text class="d" x="860" y="348" font-size="48">Bat = Ball + $1.00</text></g>
<g id="q4"><text class="d" x="860" y="520" font-size="80">Ball = ?</text></g>
<g id="ten"><polygon class="gain" points="905,600 860,670 890,670 872,730 935,650 905,650 925,600"/><text class="d" x="960" y="720" font-size="120" style="fill:var(--loss)">10¢</text><text class="m" x="860" y="790" font-size="20">SYSTEM 1’S INSTANT ANSWER</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">But check it.</text>
<text class="b" x="120" y="176" font-size="32">The fast answer doesn’t add up.</text>
<g id="w0"><rect class="s-line" x="120" y="220" width="620" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="270" font-size="22" style="fill:var(--loss)">IF THE BALL = 10¢</text></g>
<g id="r0"><text class="d5" x="150" y="350" font-size="40">Ball</text><text class="d" x="710" y="350" font-size="40" text-anchor="end">10¢</text></g>
<g id="r1"><text class="d5" x="150" y="420" font-size="40">Bat</text><text class="d" x="710" y="420" font-size="40" text-anchor="end">$1.10</text></g>
<g id="r2"><path class="s-ink" d="M150 450h560" stroke-width="4"/><text class="d5" x="150" y="520" font-size="40">Total</text><text class="d" x="710" y="520" font-size="40" text-anchor="end" style="fill:var(--loss)">$1.20</text><text class="m" x="150" y="585" font-size="20" style="fill:var(--loss)">SHOULD BE $1.10</text></g>
<g id="w1">
<rect class="s-line" x="860" y="220" width="620" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="890" y="270" font-size="22" style="fill:var(--gain)">THE BALL = 5¢</text>
<text class="d5" x="890" y="350" font-size="40">Ball</text><text class="d" x="1450" y="350" font-size="40" text-anchor="end" style="fill:var(--gain)">5¢</text>
<text class="d5" x="890" y="420" font-size="40">Bat</text><text class="d" x="1450" y="420" font-size="40" text-anchor="end">$1.05</text>
<path class="s-ink" d="M890 450h560" stroke-width="4"/>
<text class="d5" x="890" y="520" font-size="40">Total</text><text class="d" x="1450" y="520" font-size="40" text-anchor="end" style="fill:var(--gain)">$1.10</text>
<text class="m" x="890" y="585" font-size="20" style="fill:var(--gain)">IT ADDS UP</text>
</g>
<g id="stu"></g>
<g id="stl"><text class="m" x="120" y="820" font-size="20">MANY STUDENTS AT TOP UNIVERSITIES STILL GOT IT WRONG</text></g>
<g id="cb0"><text class="d5" x="860" y="730" font-size="34">System 2 could have caught it.</text></g>
<g id="cb1"><text class="d" x="860" y="800" font-size="44" style="fill:var(--loss)">It just didn’t bother.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who is really in charge?</text>
<text class="b" x="120" y="176" font-size="32">We picture ourselves as the careful, reasoning System 2.</text>
<g id="boss">
<circle class="loss" cx="1380" cy="420" r="38"/><path class="loss" d="M1320 560v-30a60 60 0 0 1 120 0v30z"/>
<rect class="ink" x="900" y="560" width="560" height="24" rx="4"/>
<rect class="ink" x="920" y="584" width="20" height="140"/><rect class="ink" x="1420" y="584" width="20" height="140"/>
<rect class="s-ink" x="1200" y="596" width="200" height="48" rx="6" fill="var(--stage)" stroke-width="4"/><text class="m" x="1300" y="628" font-size="20" text-anchor="middle">SYSTEM 2</text>
<rect class="s-ink" x="1000" y="550" width="80" height="10" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="1004" y="540" width="72" height="10" fill="var(--stage)" stroke-width="3"/>
</g>
<g id="adv"><circle class="gain" cx="220" cy="420" r="34"/><path class="gain" d="M160 540v-30a60 60 0 0 1 120 0v30z"/><text class="m" x="220" y="580" font-size="20" text-anchor="middle" style="fill:var(--gain)">SYSTEM 1</text><text class="m" x="220" y="612" font-size="20" text-anchor="middle">QUICK SUGGESTIONS</text></g>
<g id="trail">
<path class="s-muted" d="M300 470H985" fill="none" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
<path class="s-muted" d="M971 456l14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="flow" class="gain" cx="300" cy="470" r="7"/>
</g>
<g id="cards"></g>
<g id="lc"><rect x="0" y="0" width="60" height="40" rx="4" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><path d="M12 14h36M12 26h24" stroke="var(--gain)" stroke-width="4" stroke-linecap="round"/></g>
<g id="stp"><g id="stpi"><circle class="ink" cx="0" cy="-90" r="20"/><rect class="ink" x="-12" y="-74" width="24" height="40"/><rect class="loss" x="-40" y="-36" width="80" height="36" rx="6"/></g></g>
<g id="apv"><g transform="rotate(-8 1250 275)"><rect x="1100" y="230" width="300" height="90" rx="8" fill="none" stroke="var(--gain)" stroke-width="6"/><text class="d" x="1250" y="292" font-size="44" text-anchor="middle" style="fill:var(--gain)">APPROVED</text></g><text class="m" x="1110" y="374" font-size="20">WITHOUT CHECKING</text></g>
<g id="fine6"><text class="d" x="120" y="800" font-size="44">Often that works: many intuitions are good.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pause when it’s fast and easy.</text>
<text class="b" x="120" y="176" font-size="32">Not every hunch. Just the important ones.</text>
<path class="s-line" d="M120 540h760" stroke-width="5" stroke-linecap="round"/>
<g id="hn"></g>
<g id="hl"><text class="m" x="120" y="600" font-size="20">MOST HUNCHES PASS</text></g>
<g id="stp7"><path class="s-ink" d="M960 450V640" stroke-width="8" stroke-linecap="round"/><polygon class="loss" points="1034,349 1034,411 991,454 929,454 886,411 886,349 929,306 991,306"/><text class="d" x="960" y="393" font-size="36" text-anchor="middle" style="fill:var(--stage)">STOP</text></g>
<g id="imp"><path class="s-muted" d="M-20 -15h-50M-20 15h-70" stroke-width="5" stroke-linecap="round"/><rect x="0" y="-40" width="170" height="80" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="85" y="7" font-size="18" text-anchor="middle">IMPORTANT</text></g>
<g id="il"><text class="m" x="120" y="640" font-size="20" style="fill:var(--loss)">FAST, EASY AND IMPORTANT? STOP.</text></g>
<g id="sw7">
<rect class="ink" x="1235" y="290" width="50" height="30" rx="6"/>
<circle class="s-ink" cx="1260" cy="470" r="150" fill="var(--stage)" stroke-width="8"/>
<path id="arc" class="s-gain" fill="none" stroke-width="16" stroke-linecap="round"/>
<line id="hand" class="s-ink" x1="1260" y1="470" x2="1260" y2="360" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1260" cy="470" r="14"/>
<text id="cnt" class="d" x="1260" y="720" font-size="72" text-anchor="middle">0 s</text>
</g>
<g id="ver"><text class="d" x="120" y="800" font-size="44">Ask your slow mind to verify it.</text></g>
</g>

<g id="s8" opacity="0">
<g id="mg"><circle class="s-ink" cx="1360" cy="370" r="70" fill="var(--stage)" stroke-width="12"/><path class="s-ink" d="M1410 420l50 50" stroke-width="20" stroke-linecap="round"/><text class="d" x="1360" y="384" font-size="40" text-anchor="middle" style="fill:var(--loss)">10¢?</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Catch one quick answer</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">today, and check it.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Did <tspan style="fill:var(--gain)">System 1</tspan> get it right?</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">LET YOUR SLOW MIND VERIFY IT</text></g>
</g>