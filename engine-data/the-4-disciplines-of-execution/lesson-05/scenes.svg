<path class="s-loss" d="M902 700L1022 812" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1050" y="740" font-size="20">YOU CAN SKIP DESSERT TONIGHT</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Leaders stare at lag measures.</text>
<text class="b" x="120" y="176" font-size="32">Because that is what they get judged on.</text>
<g id="boss"><circle class="ink" cx="330" cy="420" r="40"/><path class="ink" d="M270 588v-52a60 60 0 0 1 120 0v52z"/>
<rect class="ink" x="160" y="588" width="400" height="22" rx="6"/>
<path class="s-ink" d="M200 610v80M520 610v80" stroke-width="8" stroke-linecap="round"/></g>
<g id="scr"><path class="s-line" d="M372 410L630 380" stroke-width="3" stroke-dasharray="6 8"/>
<rect class="s-ink" x="640" y="250" width="400" height="260" rx="12" fill="var(--stage)" stroke-width="6"/>
<polyline class="s-loss" points="680,300 770,340 860,330 940,420 1000,450" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="840" y="550" font-size="20" text-anchor="middle">LAG RESULTS</text></g>
<g id="clk"><circle class="s-ink" cx="1300" cy="390" r="120" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g>
<line id="hh" class="s-ink" x1="1300" y1="390" x2="1300" y2="330" stroke-width="10" stroke-linecap="round"/>
<line id="mh" class="s-loss" x1="1300" y1="390" x2="1300" y2="295" stroke-width="6" stroke-linecap="round"/></g>
<g id="late"><text class="d" x="1300" y="580" font-size="44" text-anchor="middle" style="fill:var(--loss)">Too late.</text></g>
<g id="worry"><text class="d5" x="120" y="800" font-size="40">Worrying about numbers it can’t touch.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lead data takes effort.</text>
<text class="b" x="120" y="176" font-size="32">Results get reported. Actions you often count yourself.</text>
<g id="clip"><rect class="s-ink" x="160" y="240" width="400" height="560" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="280" y="218" width="160" height="48" rx="12"/>
<text class="m" x="190" y="315" font-size="22">DAILY LOG</text><g id="days"></g></g>
<g id="tal"></g>
<g id="pen"><g id="penM"><path class="gain" d="M0 0l8-26 56-56 18 18-56 56z"/></g></g>
<g id="rep"><text class="m" x="840" y="236" font-size="22">REPORT</text>
<rect class="s-muted" x="840" y="250" width="300" height="320" rx="12" fill="var(--stage)" stroke-width="4" stroke-dasharray="12 10"/>
<path class="s-line" d="M870 320h240M870 380h240M870 440h180M870 500h210" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="840" y="620" font-size="22">NOBODY HANDS YOU THIS</text></g>
