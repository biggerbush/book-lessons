<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The boy who loved a challenge.</text>
<text class="b" x="120" y="176" font-size="32">Dweck gave children puzzles that grew harder and harder.</text>
<rect class="ink" x="120" y="632" width="800" height="12" rx="4"/>
