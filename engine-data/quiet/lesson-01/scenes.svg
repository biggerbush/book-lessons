<text class="m" x="120" y="150" font-size="28">QUIET · LESSON 1</text>
<g id="t0h"><text class="d" x="116" y="400" font-size="84" letter-spacing="-2">How loudness</text><text class="d" x="116" y="496" font-size="84" letter-spacing="-2">became a virtue.</text></g>
<g id="t0s"><text class="b" x="120" y="600" font-size="32">How America traded character for charisma, and why it matters.</text></g>
<g id="mega"><rect class="ink" x="1200" y="416" width="26" height="58" rx="6"/><polygon class="gain" points="1180,380 1240,380 1400,300 1400,500 1240,420 1180,420"/><g id="waves"></g></g>
