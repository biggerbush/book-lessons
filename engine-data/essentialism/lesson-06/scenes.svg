<text id="qm6" class="d" x="330" y="515" font-size="60" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">It gets easier with practice.</text>
<text class="b" x="120" y="176" font-size="32">A graceful no is a skill.</text>
<g id="st7"></g>
<g id="cl7"></g>
<g id="bx7"><rect class="s-line" x="1000" y="260" width="440" height="270" rx="18" fill="var(--stage)" stroke-width="3"/>
