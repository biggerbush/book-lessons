<g id="extra"><text class="d" x="120" y="820" font-size="40">Every extra priority weakens the one that counts.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Simple is not dumb.</text>
<text class="b" x="120" y="176" font-size="32">It is the core, packed tightly.</text>
