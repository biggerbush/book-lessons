<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">No perfect diet.</text>
<text class="b" x="120" y="176" font-size="32">Two people can eat the same meal and respond very differently.</text>
<g id="signs"></g>
<g id="ppl">
<path class="s-line" d="M410 430V580H650M950 430V580H1190" fill="none" stroke-width="3"/>
<path class="s-muted" d="M660 505H722M878 505H940" stroke-width="4" stroke-dasharray="8 8"/>
<circle class="s-ink" cx="800" cy="505" r="70" fill="var(--stage)" stroke-width="7"/>
<circle class="gain" cx="790" cy="495" r="30"/><circle cx="820" cy="525" r="18" fill="var(--line)"/>
<text class="m" x="800" y="610" font-size="20" text-anchor="middle">SAME MEAL</text>
<text class="m" x="290" y="600" font-size="20" text-anchor="middle">PERSON A</text>
<text class="m" x="1310" y="600" font-size="20" text-anchor="middle">PERSON B</text>
</g>
<g id="nosingle"><text class="d" x="120" y="720" font-size="48">No single plan wins for everyone.</text></g>
<g id="exper"><text class="m" x="120" y="790" font-size="22" style="fill:var(--gain)">TREAT FOOD LIKE AN EXPERIMENT, TESTED ON YOUR OWN BODY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three levers.</text>
<text class="b" x="120" y="176" font-size="32">Three main ways to change how you eat.</text>
<g id="lvf"></g>
<g id="ic0"><circle class="s-ink" cx="340" cy="420" r="100" fill="var(--stage)" stroke-width="7"/><circle id="por" class="gain" cx="340" cy="420" r="70"/></g>
<g id="ic1"><circle class="s-ink" cx="800" cy="420" r="100" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="760" cy="390" r="26"/><circle class="gain" cx="840" cy="390" r="26"/><circle class="loss" cx="800" cy="460" r="26"/><path id="x1" d="M776 436l48 48M824 436l-48 48" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/></g>
<g id="ic2"><circle class="s-ink" cx="1260" cy="420" r="100" fill="var(--stage)" stroke-width="7"/><path id="win" class="gain"/><path class="s-ink" d="M1260 420V350M1260 420H1305" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1260" cy="420" r="10"/></g>
<g id="mix"><text class="d" x="120" y="820" font-size="44">The best mix depends on your body and goals.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Measure, not guess.</text>
<text class="b" x="120" y="176" font-size="32">A small sensor on the arm shows how meals move blood sugar.</text>
