<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A share is a slice of a business.</text>
<text class="b" x="120" y="176" font-size="32">Picture a bakery on your street.</text>
<path class="s-ink" d="M140 760h680" stroke-width="6" stroke-linecap="round"/>
