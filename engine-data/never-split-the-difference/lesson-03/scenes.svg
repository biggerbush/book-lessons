<rect class="s-line" x="120" y="230" width="420" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="330" y="280" font-size="20" text-anchor="middle">BRAIN RESEARCH</text>
<ellipse class="s-ink" cx="330" cy="450" rx="140" ry="105" fill="none" stroke-width="6"/>
<path class="s-ink" d="M220 410q24 20 0 40q-24 20 0 40M440 410q-24 20 0 40q24 20 0 40" fill="none" stroke-width="5" stroke-linecap="round"/>
