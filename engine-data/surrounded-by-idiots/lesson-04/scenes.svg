<g id="h_th"><ellipse class="s-muted" cx="240" cy="300" rx="110" ry="62" fill="var(--stage)" stroke-width="4" stroke-dasharray="10 8"/><circle class="s-muted" cx="345" cy="375" r="12" fill="none" stroke-width="4"/><circle class="s-muted" cx="378" cy="405" r="7" fill="none" stroke-width="4"/><text class="d" x="240" y="320" font-size="56" text-anchor="middle" style="fill:var(--loss)">No.</text></g>
<g id="h_peace"><text class="m" x="120" y="700" font-size="22">NOT DISHONESTY: KEEPING THE PEACE</text></g>
<g id="h_track"><path class="s-line" d="M880 606H1460" stroke-width="4"/>
<g id="h_cart"><rect class="s-ink" x="0" y="510" width="140" height="70" rx="8" fill="var(--stage)" stroke-width="6"/><text class="m" x="70" y="552" font-size="20" text-anchor="middle">WORK</text><circle class="ink" cx="30" cy="592" r="12"/><circle class="ink" cx="110" cy="592" r="12"/></g></g>
<g id="h_q"><text class="d" x="1400" y="590" font-size="120" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="h_why"><text class="d" x="120" y="800" font-size="44">You never quite learn why.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">Sudden change unsettles Greens.</text>
<text class="b" x="120" y="176" font-size="32">Not against progress. They just need time to adjust.</text>
<g id="c_cal">
<rect class="s-ink" x="140" y="250" width="200" height="220" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="140" y="250" width="200" height="56" rx="12"/><text class="m" x="240" y="288" font-size="24" text-anchor="middle" style="fill:var(--stage)">FRI</text><text class="m" x="240" y="400" font-size="18" text-anchor="middle">OLD SYSTEM</text>
<rect class="s-ink" x="440" y="250" width="200" height="220" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="440" y="250" width="200" height="56" rx="12"/><text class="m" x="540" y="288" font-size="24" text-anchor="middle" style="fill:var(--stage)">MON</text><text class="m" x="540" y="400" font-size="18" text-anchor="middle" style="fill:var(--loss)">NEW SYSTEM</text>
<path id="c_arrow" d="M352 360h70m-18-18 18 18-18 18" fill="none" stroke="var(--muted)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="c_memo"><g transform="rotate(-3 390 640)"><rect class="s-ink" x="160" y="540" width="460" height="200" fill="var(--stage)" stroke-width="5"/><text class="m" x="190" y="590" font-size="20">MEMO · FRIDAY</text><text class="d" x="190" y="650" font-size="40">Switch systems</text><text class="d" x="190" y="705" font-size="40" style="fill:var(--loss)">by Monday!</text></g></g>
<g id="c_red"><path class="s-line" d="M800 640H1040" stroke-width="4"/><text class="m" x="920" y="700" font-size="22" text-anchor="middle">A RED MIGHT CHEER</text></g>
<g id="c_green"><path id="c_ground" class="s-line" fill="none" stroke-width="4"/><g id="c_gs"></g><text class="m" x="1260" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">A GREEN NEEDS TIME</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Give early notice.</text>
<text class="b" x="120" y="176" font-size="32">Explain what will change, step by step, and why it matters.</text>
<path class="s-ink" d="M160 330H1440" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="160" y="380" font-size="20">NOW</text>
<circle class="loss" cx="1420" cy="330" r="16"/><text class="m" x="1440" y="380" font-size="20" text-anchor="end" style="fill:var(--loss)">THE CHANGE</text>
<g id="n_flag"><path class="s-ink" d="M300 330V230" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M300 232L370 254L300 276z"/><text class="m" x="300" y="380" font-size="20" style="fill:var(--gain)">TELL THEM EARLY</text></g>
