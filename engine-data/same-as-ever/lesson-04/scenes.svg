<g id="arr"><text class="d5" x="120" y="800" font-size="40">Same facts. Arranged into something bigger.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Good ideas can lose.</text>
<text class="b" x="120" y="176" font-size="32">The right idea does not automatically win.</text>
