<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 2</text>
<g id="t0h"><text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Paradox</text><text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Success.</text></g>
<text class="b" x="120" y="600" font-size="32">Why the clarity that brings success can be lost to it.</text>
<g id="tA"></g><g id="tS"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Clarity comes first.</text>
<text class="b" x="120" y="176" font-size="32">One clear goal. One direction.</text>
<g id="p1"><text class="m" x="260" y="660" font-size="22" text-anchor="middle">ONE CLEAR GOAL</text></g>
<g id="tg1"><circle cx="1180" cy="520" r="90" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/><circle cx="1180" cy="520" r="58" fill="none" stroke="var(--ink)" stroke-width="7"/><circle class="gain" cx="1180" cy="520" r="26"/><text class="m" x="1180" y="660" font-size="22" text-anchor="middle">THE GOAL</text></g>
<path id="a1" fill="none" stroke="var(--gain)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<g id="ew1"><text class="m" x="720" y="455" font-size="22" text-anchor="middle">EXCELLENT WORK · GETS NOTICED</text><path class="s-gain" d="M200 370l-20-20M260 360v-28M320 370l20-20" stroke-width="6" stroke-linecap="round"/></g>
<g id="tr1"><path class="s-gain" d="M1345 420h-22v24a22 22 0 0 0 22 22M1435 420h22v24a22 22 0 0 1-22 22" fill="none" stroke-width="6"/><path class="gain" d="M1345 410h90v40a45 45 0 0 1-90 0z"/><rect class="gain" x="1382" y="492" width="16" height="36"/><rect class="gain" x="1352" y="528" width="76" height="18" rx="4"/><text class="m" x="1390" y="600" font-size="22" text-anchor="middle">SUCCESS</text></g>
<g id="cs1"><text class="d" x="120" y="790" font-size="52">Clarity of purpose leads to success.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Success brings options.</text>
<text class="b" x="120" y="176" font-size="32">Attention brings requests.</text>
<g id="p2"></g><g id="ev2"></g><g id="dr2"></g>
<g id="gd2"><text class="d" x="120" y="790" font-size="46">Known as the one who gets things done.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spread thin.</text>
<text class="b" x="120" y="176" font-size="32">Yes to most of it. A millimetre of progress in many directions.</text>
<g id="p3"></g>
<g id="tf3"><path d="M546 446h10M564 446h10M550 468q10-7 20 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/></g>
<g id="sc3"></g><g id="ys3"></g>
<g id="pg3"><text class="m" x="920" y="620" font-size="20">PROGRESS IN EACH DIRECTION</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cruel twist.</text>
<text class="b" x="120" y="176" font-size="32">Scattered effort clouds the very clarity that made her successful.</text>
<g id="ln4">
<circle cx="440" cy="500" r="110" fill="none" stroke="var(--gain)" stroke-width="8"/><circle cx="440" cy="500" r="70" fill="none" stroke="var(--gain)" stroke-width="8"/><circle class="gain" cx="440" cy="500" r="30"/>
<g id="fg4"><circle cx="380" cy="450" r="70" fill="var(--line)"/><circle cx="490" cy="430" r="60" fill="var(--line)"/><circle cx="450" cy="540" r="80" fill="var(--line)"/><circle cx="360" cy="560" r="55" fill="var(--line)"/><circle cx="520" cy="540" r="60" fill="var(--line)"/></g>
<circle cx="440" cy="500" r="170" fill="none" stroke="var(--ink)" stroke-width="14"/><path d="M560 620L660 720" stroke="var(--ink)" stroke-width="26" stroke-linecap="round"/>
<text class="m" x="440" y="800" font-size="22" text-anchor="middle">CLARITY</text>
</g>
<path class="s-line" d="M820 300V700H1450" fill="none" stroke-width="4"/>
<text class="m" x="830" y="288" font-size="20">SUCCESS</text>
<polyline id="cu4" points="840,660 960,580 1080,470 1180,380" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
<polyline id="cd4" points="1180,380 1280,460 1360,570 1440,650" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
<g id="bw4"><text class="m" x="1250" y="340" font-size="20" style="fill:var(--loss)">BEST WORK SLIPS</text></g>
<g id="fd4"><text class="d" x="820" y="800" font-size="44">The success starts to fade.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four phases in a loop.</text>
<text class="b" x="120" y="176" font-size="32">McKeown’s cycle behind the paradox of success.</text>
<ellipse id="el5" class="s-line" cx="800" cy="490" rx="300" ry="220" fill="none" stroke-width="3" stroke-dasharray="6 10"/>
<g id="ar5"></g>
<circle id="dt5" class="gain" r="12"/>
<g id="nd5"></g>
<g id="ct5"><text class="d" x="120" y="830" font-size="42">Success can become a catalyst for failure.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Companies fall the same way.</text>
<text class="b" x="120" y="176" font-size="32">Jim Collins studied why once-great companies fall.</text>
<g id="bk6"><rect class="ink" x="150" y="250" width="200" height="280" rx="8"/><rect class="gain" x="150" y="250" width="26" height="280"/><path d="M210 320h110M210 360h110M210 400h70" stroke="var(--stage)" stroke-width="8" stroke-linecap="round"/></g>
<g id="cl6"><text class="m" x="250" y="580" font-size="20" text-anchor="middle">JIM COLLINS</text><text class="m" x="250" y="612" font-size="18" text-anchor="middle">WHY GREAT FIRMS FALL</text></g>
<g id="pl6"></g>
<path class="s-line" d="M820 720H1440" stroke-width="5" stroke-linecap="round"/>
<g id="tw6"><g id="fl6"></g><g id="an6"><rect x="1200" y="464" width="70" height="64" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><rect x="930" y="336" width="70" height="64" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/></g></g>
<g id="ls6"><text class="m" x="1480" y="256" font-size="20" text-anchor="end" style="fill:var(--loss)">LOSE SIGHT OF WHAT MADE THEM GREAT</text></g>
<g id="qt6"><text class="d" x="120" y="800" font-size="46">“The undisciplined pursuit of more.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Break the cycle.</text>
<text class="b" x="120" y="176" font-size="32">Not by succeeding less, but by noticing what crowds your purpose.</text>
<g id="op7"></g>
<circle id="tc7" class="gain" cx="600" cy="500" r="34"/>
<path id="sh7" d="M600 370L700 410V500C700 570 650 610 600 640C550 610 500 570 500 500V410Z" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linejoin="round"/>
<g id="mg7"><circle cx="0" cy="0" r="130" fill="none" stroke="var(--ink)" stroke-width="12"/><path d="M92 92L170 170" stroke="var(--ink)" stroke-width="24" stroke-linecap="round"/></g>
<path id="ba7" d="M1360 720C1360 480 1080 300 834 412" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="bh7"></g>
<g id="q7"><text class="m" x="1080" y="790" font-size="24" style="fill:var(--gain)">WHAT MADE YOU GOOD?</text></g>
<g id="pr7"><text class="d" x="120" y="840" font-size="44">Protect that focus before you say yes.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="88" letter-spacing="-2">What first made you</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="88" letter-spacing="-2">successful?</text></g>
<g id="qc"><text class="d" x="136" y="530" font-size="88" letter-spacing="-2">Is it still getting</text></g>
<g id="qd"><text class="d" x="136" y="630" font-size="88" letter-spacing="-2">your <tspan style="fill:var(--gain)">best energy?</tspan></text></g>
<text class="m" x="143" y="760" font-size="26">PROTECT WHAT MADE YOU GOOD</text>
<g id="mr8">
<ellipse class="s-ink" cx="1330" cy="380" rx="110" ry="150" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1330 530v40M1270 572h120" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1330" y="620" font-size="20" text-anchor="middle">YOUR PURPOSE</text>
</g>
<g id="mi8"></g><g id="bu8"></g>
</g>