<g id="s0">
<text class="m" x="120" y="150" font-size="28">REWORK · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Build half a product,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a bad one.</text>
<text class="b" x="120" y="600" font-size="32">Do fewer things, do them brilliantly, and say no often.</text>
<rect class="s-ink" x="1170" y="230" width="300" height="370" rx="16" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1170 262h300" stroke-width="4"/>
<g id="t0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Half, not half-baked.</text>
<text class="b" x="120" y="176" font-size="32">Half a product is not the same as a bad product.</text>
<g id="b1f">
<rect class="s-line" x="120" y="230" width="620" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="860" y="230" width="620" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="160" y="286" font-size="22" style="fill:var(--gain)">HALF A PRODUCT</text>
<text class="m" x="900" y="286" font-size="22" style="fill:var(--loss)">BAD PRODUCT</text>
</g>
<g id="b1h">
<rect class="gain" x="190" y="330" width="120" height="240" rx="14"/>
<rect class="gain" x="350" y="330" width="120" height="240" rx="14"/>
<rect class="gain" x="510" y="330" width="120" height="240" rx="14"/>
<text class="d5" x="160" y="650" font-size="36">A few things, beautifully.</text>
</g>
<g id="b1b"><g id="jum"></g><text class="d5" x="900" y="650" font-size="36">Everything, badly.</text></g>
<g id="b1q"><text class="d" x="120" y="800" font-size="46">Limited time and money? Pick your half.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cut the merely good.</text>
<text class="b" x="120" y="176" font-size="32">Keep cutting until only the essential remains.</text>
<g id="rows"></g>
<g id="stk"></g>
<g id="sc"><g id="scm"></g></g>
<g id="gd1"><text class="m" x="900" y="310" font-size="22">GOOD, BUT NOT ESSENTIAL</text></g>
<g id="gd2"><text class="d" x="120" y="836" font-size="44">Great work means dropping the merely good.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hot dog comes first.</text>
<text class="b" x="120" y="176" font-size="32">Get the core right before anything else.</text>
<g id="st">
<path class="loss" d="M180 300L230 230H690L740 300z"/>
<path class="s-ink" d="M240 300V470M680 300V470" stroke-width="6" stroke-linecap="round"/>
<rect class="s-ink" x="200" y="470" width="520" height="170" rx="12" fill="var(--stage)" stroke-width="7"/>
<rect class="s-line" x="330" y="520" width="260" height="70" rx="8" fill="none" stroke-width="4"/>
<text class="m" x="460" y="564" font-size="24" text-anchor="middle">HOT DOGS</text>
<circle class="s-ink" cx="300" cy="680" r="40" fill="var(--stage)" stroke-width="7"/>
<circle class="s-ink" cx="620" cy="680" r="40" fill="var(--stage)" stroke-width="7"/>
</g>
<g id="chp"></g>
<g id="rg">
<circle class="s-gain" cx="1150" cy="525" r="160" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<circle class="s-gain" cx="1150" cy="525" r="210" fill="none" stroke-width="3" stroke-dasharray="6 12"/>
<text class="m" x="1150" y="455" font-size="20" text-anchor="middle" style="fill:var(--gain)">EPICENTER</text>
</g>
<g id="hd"><g id="hdi">
<rect class="ink" x="1035" y="495" width="230" height="64" rx="32"/>
<rect class="gain" x="1005" y="505" width="290" height="34" rx="17"/>
<path d="M1030 522q12-10 24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0t24 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
</g></g>
<g id="sd"><text class="d" x="120" y="836" font-size="44">Everything else is a side dish.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A simple rule.</text>
<text class="b" x="120" y="176" font-size="32">Every yes has a cost.</text>
<g id="ns"><g id="nsi">
<polygon class="gain" points="517,515 425,607 295,607 203,515 203,385 295,293 425,293 517,385"/>
<text class="d" x="360" y="503" font-size="140" text-anchor="middle" style="fill:var(--on-gain)">NO</text>
</g></g>
<g id="qt"><text class="m" x="120" y="670" font-size="22">IN THEIR WORDS</text><text class="d" x="120" y="740" font-size="56">“Say no by default.”</text></g>
<g id="yp"><text class="m" x="960" y="250" font-size="22" style="fill:var(--ink)">EVERY YES ADDS</text></g>
<g id="tw"></g>
<g id="fc"><text class="d" x="120" y="836" font-size="44">A no keeps the product focused and simple.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Forget the wish list.</text>
<text class="b" x="120" y="176" font-size="32">Listen, then let the requests go.</text>
<g id="wl">
<rect class="s-ink" x="120" y="230" width="400" height="500" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="150" y="270" font-size="22" style="fill:var(--ink)">WISH LIST</text>
<g id="slp"></g>
</g>
<g id="lg"><text class="m" x="150" y="712" font-size="22" style="fill:var(--loss)">LET GO</text></g>
<g id="cus"></g>
<g id="ag"><text class="d" x="120" y="836" font-size="44">The ones that matter keep coming back.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let some people go.</text>
<text class="b" x="120" y="176" font-size="32">Chasing power users bloats the product.</text>
<g id="lob"></g>
<rect class="gain" x="700" y="380" width="200" height="200" rx="24"/>
<text class="m" x="800" y="488" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">PRODUCT</text>
<g id="pu"><g id="pui"></g></g>
<g id="pul"><text class="m" x="260" y="600" font-size="20" text-anchor="middle">WANTS MORE FEATURES</text></g>
<g id="pa">
<path class="s-muted" d="M440 330H170m26-26-26 26 26 26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="305" y="300" font-size="20" text-anchor="middle">MOVES ON</text>
</g>
<g id="rq"></g>
<g id="blt"><text class="m" x="800" y="730" font-size="22" text-anchor="middle" style="fill:var(--loss)">BLOAT</text></g>
<g id="ss"><text class="m" x="800" y="630" font-size="22" text-anchor="middle" style="fill:var(--gain)">STAYS SIMPLE</text></g>
<g id="nw"></g>
<g id="mv"><text class="d" x="120" y="836" font-size="44">Stay simple, and let them move on.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find your own epicenter.</text>
<text class="b" x="120" y="176" font-size="32">List everything your project or role is trying to do.</text>
<rect class="s-line" x="120" y="220" width="760" height="560" rx="16" fill="var(--stage)" stroke-width="3"/>
<g id="ls"></g>
<g id="cir"></g>
<g id="sh">
<path class="gain" d="M1200 290L1330 340V450Q1330 560 1200 610Q1070 560 1070 450V340Z"/>
<path d="M1140 450l40 40 80-80" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="1200" y="690" font-size="40" text-anchor="middle">Protect these.</text>
<text class="b" x="1200" y="740" font-size="30" text-anchor="middle">Everything else is optional.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What’s one request or</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">feature you can say</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">no</tspan> to this week?</text></g>
<g id="q8n"><g id="q8i">
<polygon class="gain" points="1422,488 1368,542 1292,542 1238,488 1238,412 1292,358 1368,358 1422,412"/>
<text class="d" x="1330" y="478" font-size="80" text-anchor="middle" style="fill:var(--on-gain)">NO</text>
</g></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">SAY IT KINDLY. WATCH YOUR REAL WORK GET BETTER.</text></g>
</g>