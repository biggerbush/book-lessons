<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Don’t take anything</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">personally.</text>
<text class="b" x="120" y="600" font-size="32">Why other people's words say more about them than you.</text>
<path class="s-line" d="M1180 600h240" stroke-width="5" stroke-linecap="round"/>
<g id="ttl"></g>
<g id="hw" opacity="0"><rect x="1210" y="470" width="180" height="76" rx="16" fill="var(--stage)" class="s-loss" stroke-width="6"/><text class="d" x="1300" y="522" font-size="44" text-anchor="middle" style="fill:var(--loss)">#@!</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A stranger’s insult.</text>
<text class="b" x="120" y="176" font-size="32">Ruiz offers a simple picture.</text>
<path class="s-line" d="M120 760H1480" stroke-width="5" stroke-linecap="round"/>
<g id="you1"></g>
<g id="strw"><g id="str"></g></g>
<g id="bub1"><path d="M1070 404l25 60 20-60" fill="var(--stage)" class="s-loss" stroke-width="6" stroke-linejoin="round"/><rect x="860" y="300" width="500" height="110" rx="22" fill="var(--stage)" class="s-loss" stroke-width="6"/><text class="d5" x="1110" y="372" font-size="44" text-anchor="middle" style="fill:var(--loss)">You are so stupid.</text></g>
<g id="nev"><path class="s-muted" d="M500 610H1020" stroke-width="3" stroke-dasharray="6 10"/><text class="m" x="760" y="590" font-size="20" text-anchor="middle">HAS NEVER MET YOU</text></g>
<g id="stg"><path class="s-loss" d="M350 540l-30-30M420 520v-40M490 540l30-30" stroke-width="6" stroke-linecap="round"/></g>
<g id="qm"><text class="d" x="760" y="480" font-size="150" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="qtx"><text class="d" x="120" y="840" font-size="44">So who is that comment really about?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Their dream, not yours.</text>
<text class="b" x="120" y="176" font-size="32">Every person lives inside their own private dream.</text>
<g id="hc"><circle class="s-muted" cx="480" cy="480" r="220" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="480" y="750" font-size="22" text-anchor="middle">HIS DREAM</text></g>
<g id="his"></g>
<g id="cld"><path class="s-ink" d="M400 430a40 40 0 0 1 10-78a55 55 0 0 1 100-20a45 45 0 0 1 70 50a35 35 0 0 1-10 48z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-muted" d="M440 380h90M450 405h70" stroke-width="5" stroke-linecap="round"/><circle class="ink" cx="470" cy="452" r="8"/><circle class="ink" cx="476" cy="472" r="5"/></g>
<g id="yc"><circle class="s-gain" cx="1120" cy="480" r="220" fill="none" stroke-width="4" stroke-dasharray="12 10"/><g id="yo2"></g><text class="m" x="1120" y="750" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOUR DREAM</text></g>
<g id="wd"><text class="m" x="610" y="488" font-size="22" text-anchor="middle" style="fill:var(--loss)">“STUPID”</text></g>
<g id="blk"><path class="s-loss" d="M720 480H880" stroke-width="5" stroke-dasharray="10 8"/><path class="s-loss" d="M780 450l40 60M820 450l-40 60" stroke-width="7" stroke-linecap="round"/></g>
<g id="quo"><text class="d" x="120" y="830" font-size="40">“Nothing other people do is because of you.”</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The “me” trap.</text>
<text class="b" x="120" y="176" font-size="32">Taking things personally comes from personal importance.</text>
<g id="cone"><rect class="ink" x="770" y="200" width="60" height="26" rx="6"/><polygon class="gain" points="785,226 815,226 960,690 640,690" fill-opacity=".22"/><ellipse class="gain" cx="800" cy="690" rx="160" ry="24" fill-opacity=".35"/></g>
<g id="meS"></g>
<g id="meL" opacity="0"><text class="m" x="800" y="450" font-size="22" text-anchor="middle">EVERYTHING IS ABOUT ME</text></g>
<g id="crl" opacity="0"></g>
<g id="crd" opacity="0"></g>
<g id="thb"></g>
<g id="own"><text class="d" x="120" y="800" font-size="42">Their actions come from their own story.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Emotional poison.</text>
<text class="b" x="120" y="176" font-size="32">Taking harsh words personally means swallowing the poison.</text>
<g id="btl"><rect class="loss" x="295" y="340" width="60" height="70"/><rect class="ink" x="288" y="318" width="74" height="28" rx="6"/><rect class="loss" x="250" y="400" width="150" height="200" rx="24"/><path d="M295 460l60 60M355 460l-60 60" stroke="var(--stage)" stroke-width="10" stroke-linecap="round"/><text class="m" x="325" y="650" font-size="22" text-anchor="middle">POISON</text></g>
<g id="drp"></g>
<g id="yo4"></g>
<circle id="rg" cx="800" cy="420" r="64" fill="none" class="s-loss" stroke-width="5" opacity="0"/>
<g id="oth4"></g>
<g id="bagw"><g id="bag"><path class="ink" d="M1130 520c-50 40-40 110 0 120h80c40-10 50-80 0-120z"/><path class="s-ink" d="M1150 520l20-24 20 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1170" y="690" font-size="20" text-anchor="middle">GARBAGE</text></g></g>
<g id="wk"><text class="d" x="120" y="800" font-size="44">The poison works on you, not on them.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Praise counts too.</text>
<text class="b" x="120" y="176" font-size="32">Both are reflections of the speaker’s dream.</text>
<g id="sA"><g id="spA"></g><path d="M330 296L262 318L362 296z" fill="var(--stage)" class="s-gain" stroke-width="5" stroke-linejoin="round"/><rect x="300" y="220" width="380" height="80" rx="18" fill="var(--stage)" class="s-gain" stroke-width="5"/><text class="d5" x="490" y="272" font-size="34" text-anchor="middle" style="fill:var(--gain)">You’re wonderful.</text></g>
<g id="sB"><g id="spB"></g><path d="M1270 296L1340 318L1238 296z" fill="var(--stage)" class="s-loss" stroke-width="5" stroke-linejoin="round"/><rect x="920" y="220" width="380" height="80" rx="18" fill="var(--stage)" class="s-loss" stroke-width="5"/><text class="d5" x="1110" y="272" font-size="34" text-anchor="middle" style="fill:var(--loss)">You’re so stupid.</text></g>
<g id="lab5"><text class="m" x="490" y="342" font-size="20" text-anchor="middle">THEIR OPINION</text><text class="m" x="1110" y="342" font-size="20" text-anchor="middle">THEIR OPINION</text></g>
<g id="frm"><path class="s-ink" d="M800 470V760M680 760h240" stroke-width="10" stroke-linecap="round"/><g id="beam"><path class="s-ink" d="M520 470H1080" stroke-width="10" stroke-linecap="round"/></g><circle class="gain" cx="800" cy="470" r="14"/></g>
<g id="pL"><g id="pLs"><path class="s-ink" d="M450 620L520 470L590 620" fill="none" stroke-width="3"/><path class="ink" d="M440 620a80 44 0 0 0 160 0z"/></g><g id="star"></g></g>
<g id="pR"><g id="pRs"><path class="s-ink" d="M1010 620L1080 470L1150 620" fill="none" stroke-width="3"/><path class="ink" d="M1000 620a80 44 0 0 0 160 0z"/></g><g id="ins"><rect class="loss" x="1040" y="548" width="80" height="50" rx="12"/><text class="d" x="1080" y="585" font-size="34" text-anchor="middle" style="fill:var(--stage)">!</text></g></g>
<g id="bal"><text class="m" x="800" y="830" font-size="22" text-anchor="middle">NO NEED FOR PRAISE TO FEEL GOOD, OR INSULTS TO FEEL BAD</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Words lose their grip.</text>
<text class="b" x="120" y="176" font-size="32">Hear criticism, consider it calmly, keep what is useful.</text>
<g id="yo6"></g>
<g id="shd"><path class="gain" d="M580 380l110 36v80c0 70-50 110-110 134c-60-24-110-64-110-134v-80z"/></g>
<g id="chp"></g>
<g id="kp"><rect x="200" y="690" width="420" height="80" rx="16" fill="none" class="s-gain" stroke-width="5"/><text class="m" x="410" y="738" font-size="22" text-anchor="middle" style="fill:var(--gain)">KEEP WHAT IS USEFUL</text></g>
<g id="dor"><rect class="gain" x="1260" y="360" width="180" height="380" fill-opacity=".25"/><rect id="dr" class="ink" x="1260" y="360" width="180" height="380"/><rect class="s-ink" x="1260" y="360" width="180" height="380" fill="none" stroke-width="6"/></g>
<g id="fr"><text class="m" x="1350" y="790" font-size="20" text-anchor="middle">FREE TO STEP AWAY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Pause. Breathe. Label. Decide.</text>
<g id="cards"></g>
<g id="tg"><path class="gain" d="M260 690h900l80 50-80 50h-900z"/><circle cx="1180" cy="740" r="10" fill="var(--stage)"/><text class="d" x="700" y="753" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">This is their dream, not my truth.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Think of one remark</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">you’ve carried for years.</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2" style="fill:var(--gain)">Can you hand it back?</text></g>
<g id="fin"><text class="m" x="143" y="680" font-size="26">GIVE BACK WHAT ISN’T YOURS</text><rect id="hb" class="loss" x="0" y="590" width="70" height="44" rx="12"/></g>
</g>