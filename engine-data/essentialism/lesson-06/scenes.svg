<path class="ink" d="M-100 150h200l-30 30h-140z"/></g>
</g>
<text id="dp3" class="m" x="400" y="500" font-size="20" text-anchor="middle" style="fill:var(--loss)" opacity="0">BRIEF DISAPPOINTMENT</text>
<g id="hs3"><g id="hsp"></g><path class="s-gain" d="M1270 470L1330 490L1390 470" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1330" y="570" font-size="20" text-anchor="middle" style="fill:var(--gain)">TRUST</text></g>
<g id="yt3"><text class="d" x="120" y="800" font-size="48">A yes that truly means something.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four ways to say no.</text>
<text class="b" x="120" y="176" font-size="32">Kind, firm scripts you can use.</text>
<g id="cd4"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cut your losses.</text>
<text class="b" x="120" y="176" font-size="32">Saying no also applies to things you already said yes to.</text>
