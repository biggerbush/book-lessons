<g id="tk"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make senders do more work.</text>
<text class="b" x="120" y="176" font-size="32">Set expectations before anyone writes.</text>
<g id="web"><rect class="s-ink" x="120" y="230" width="640" height="530" rx="16" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M120 290H760" stroke-width="4"/>
