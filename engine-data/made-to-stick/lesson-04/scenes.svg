<g id="s0">
<text class="m" x="120" y="150" font-size="28">MADE TO STICK · LESSON 4</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Concrete: make it</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">something you</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">can picture.</text>
<text class="b" x="120" y="610" font-size="32">Why ideas you can picture stick, and fuzzy ones fade.</text>
<path class="s-ink" d="M1180 220q120 40 300 10" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="tgr" fill="var(--gain)"></g>
<path class="s-line" d="M1060 720h420" stroke-width="5" stroke-linecap="round"/>
<g id="tfox"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Abstract slips away.</text>
<text class="b" x="120" y="176" font-size="32">Fuzzy words give the mind nothing to hold.</text>
<g id="a0">
<rect class="s-line" x="120" y="230" width="620" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="276" font-size="22" style="fill:var(--loss)">ABSTRACT</text>
<g id="fog" opacity=".6"></g>
</g>
<text id="w0" class="d5" x="430" y="375" font-size="36" text-anchor="middle" style="fill:var(--muted)">quality</text>
<text id="w1" class="d5" x="430" y="425" font-size="36" text-anchor="middle" style="fill:var(--muted)">value</text>
<text id="w2" class="d5" x="430" y="475" font-size="36" text-anchor="middle" style="fill:var(--muted)">innovation</text>
<g id="ah">
<path class="s-ink" d="M310 570c0 70 50 100 120 100s120-30 120-100M310 570l-14-30M550 570l14-30" fill="none" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="430" y="712" font-size="20" text-anchor="middle">NOTHING TO GRAB</text>
</g>
<g id="a1">
<rect class="s-line" x="860" y="230" width="620" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="890" y="276" font-size="22" style="fill:var(--gain)">CONCRETE</text>
<path class="gain" d="M1170 330l100 50-100 50-100-50z"/>
<path class="gain" d="M1070 380l100 50v110l-100-50z" fill-opacity=".75"/>
<path class="gain" d="M1270 380l-100 50v110l100-50z" fill-opacity=".5"/>
<path class="s-ink" d="M1050 550c0 70 50 100 120 100s120-30 120-100M1050 550l-14-30M1290 550l14-30" fill="none" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="1170" y="712" font-size="20" text-anchor="middle">SOMETHING TO HOLD</text>
</g>
<g id="a2"><text class="d" x="120" y="820" font-size="52">The cure: make ideas concrete.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fox and the grapes.</text>
<text class="b" x="120" y="176" font-size="32">An old fable you can still see.</text>
<g id="vin">
<path class="s-ink" d="M140 230q200 40 520 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="fgr" fill="var(--gain)"></g>
<path class="s-line" d="M140 702h620" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="f2"><g id="f2m"><g id="f2i"></g></g></g>
<g id="sour"><text class="m" x="440" y="440" font-size="22" text-anchor="middle" style="fill:var(--loss)">“PROBABLY SOUR ANYWAY.”</text></g>
<g id="sc">
<rect class="s-ink" x="900" y="262" width="520" height="250" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="880" y="244" width="560" height="26" rx="13"/>
<rect class="ink" x="880" y="500" width="560" height="26" rx="13"/>
<text class="m" x="1160" y="318" font-size="22" text-anchor="middle">AESOP’S FABLE · ABOUT</text>
<text id="yrs" class="d" x="1160" y="428" font-size="92" text-anchor="middle" style="fill:var(--gain)">2,500</text>
<text class="m" x="1160" y="486" font-size="20" text-anchor="middle">YEARS</text>
</g>
<g id="bub">
<path class="s-ink" d="M970 720l-40 86 110-86z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="900" y="590" width="540" height="150" rx="40" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="1170" y="688" font-size="60" text-anchor="middle">“Sour grapes.”</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two space missions.</text>
<text class="b" x="120" y="176" font-size="32">One goal you can’t picture. One you can.</text>
<g id="lp">
<rect class="s-line" x="120" y="220" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
