<rect class="loss" x="1240" y="330" width="120" height="120" rx="18"/>
<circle cx="1270" cy="360" r="9" fill="var(--stage)"/><circle cx="1300" cy="390" r="9" fill="var(--stage)"/><circle cx="1330" cy="420" r="9" fill="var(--stage)"/>
<path class="s-muted" d="M1300 470v70m-18-18 18 18 18-18" fill="none" stroke-width="5" stroke-linecap="round"/>
