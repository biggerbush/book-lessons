<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The four disciplines</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">at a glance.</text>
<text class="b" x="120" y="600" font-size="32">Four connected habits that turn big plans into real progress.</text>
<g id="tgt"><circle class="s-ink" cx="1320" cy="330" r="110" fill="var(--stage)" stroke-width="8"/><circle class="s-ink" cx="1320" cy="330" r="70" fill="none" stroke-width="6"/><circle class="gain" cx="1320" cy="330" r="32"/></g>
<g id="arw"><path class="s-ink" d="M1320 330L1230 240M1230 240h-30M1230 240v-30" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="noise"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four disciplines, one chain.</text>
<text class="b" x="120" y="176" font-size="32">Like links in one chain, not items on a menu.</text>
<g id="arcs"></g>
<g id="chain1"></g>
<g id="menu"><rect class="s-line" x="120" y="590" width="440" height="250" rx="16" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="635" font-size="22">PICK YOUR FAVOURITE?</text><g id="mrows"></g><path class="s-gain" d="M155 665l8 8 14-16" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<path id="menuX" class="s-loss" d="M160 610L520 820M520 610L160 820" fill="none" stroke-width="10" stroke-linecap="round"/>
<g id="build"><text class="d" x="680" y="700" font-size="44">Each builds on the one before.</text><text class="m" x="680" y="750" font-size="22">EACH RESTS ON A SIMPLE PRINCIPLE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="64">1. Focus on the wildly important.</text>
<text class="b" x="120" y="176" font-size="32">Like an air traffic controller.</text>
<g id="radar"><circle class="s-ink" cx="480" cy="520" r="250" fill="var(--stage)" stroke-width="6"/><circle class="s-line" cx="480" cy="520" r="170" fill="none" stroke-width="3"/><circle class="s-line" cx="480" cy="520" r="90" fill="none" stroke-width="3"/><path class="s-line" d="M230 520H730M480 270V770" stroke-width="3"/><line id="sweep" class="s-gain" x1="480" y1="520" x2="480" y2="270" stroke-width="4" stroke-linecap="round"/><text class="m" x="480" y="820" font-size="20" text-anchor="middle">MANY PLANES IN THE AIR</text></g>
<g id="planes"></g>
<g id="lead"><g id="leadp"><path class="gain" d="M0-26L19 20L0 10L-19 20z"/></g></g>
<text id="land" class="m" x="700" y="330" font-size="20" style="fill:var(--gain)">LANDING NOW</text>
<g id="ctrl"><circle class="ink" cx="1000" cy="300" r="40"/><path class="ink" d="M940 468v-52a60 60 0 0 1 120 0v52z"/><path class="s-gain" d="M955 300a45 45 0 0 1 90 0M955 300q0 40 35 40" fill="none" stroke-width="7" stroke-linecap="round"/><text class="m" x="1000" y="510" font-size="20" text-anchor="middle">CONTROLLER</text></g>
<g id="wig"><text class="d" x="820" y="640" font-size="44">Pick one or two</text><text class="d" x="820" y="696" font-size="44" style="fill:var(--gain)">wildly important goals.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Act on the lead measures.</text>
<text class="b" x="120" y="176" font-size="32">Small actions you control move the big result.</text>
<path class="s-line" d="M160 740H1440" stroke-width="4" stroke-linecap="round"/>
<g id="lev"><polygon class="ink" points="1000,640 940,740 1060,740"/>
<g id="beam"><path class="s-ink" d="M200 640H1400" stroke-width="12" stroke-linecap="round"/>
<g id="rock"><circle class="loss" cx="1300" cy="554" r="80"/><path class="s-ink" d="M1300 474V380" stroke-width="5"/><path class="gain" d="M1300 380h70l-20 22 20 22h-70z"/></g>
<g id="blocks"></g></g></g>
<g id="lagt"><text class="m" x="1300" y="280" font-size="22" text-anchor="middle">RESULTS: SALES, PROFIT</text><text class="m" x="1300" y="312" font-size="20" text-anchor="middle" style="fill:var(--loss)">ARRIVE TOO LATE</text></g>
<g id="leadt"><text class="m" x="200" y="400" font-size="22" style="fill:var(--gain)">LEAD MEASURES</text><text class="m" x="200" y="432" font-size="20">SMALL ACTIONS YOU CONTROL</text></g>
<g id="follow"><text class="d" x="120" y="830" font-size="44">Push on these, and the big outcome follows.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">3. Keep a compelling scoreboard.</text>
<text class="b" x="120" y="176" font-size="32">Can anyone tell in seconds if the team is winning?</text>
<g id="board"><path class="s-ink" d="M500 580v40M1100 580v40" stroke-width="8"/><rect class="s-ink" x="400" y="230" width="800" height="350" rx="16" fill="var(--stage)" stroke-width="8"/><path class="s-line" d="M460 290V540H1140" fill="none" stroke-width="4"/><path class="s-muted" d="M460 470L1140 350" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="1140" y="390" font-size="20" text-anchor="end">TARGET</text><path id="act" class="s-gain" d="M460 520L600 460L740 400L880 340L1020 310L1140 300" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="win"><rect class="gain" x="480" y="300" width="200" height="50" rx="25"/><text class="m" x="580" y="333" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WINNING</text></g>
<g id="team"></g>
<g id="playt"><text class="d" x="120" y="830" font-size="44">When people see the score, they play to win.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Hold each other accountable.</text>
<text class="b" x="120" y="176" font-size="32">A short meeting, at the same time, every week.</text>
<g id="cal"><rect class="s-ink" x="120" y="240" width="520" height="390" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="120" y="240" width="520" height="60" rx="14"/><g id="calg"></g><g id="dots"></g><text class="m" x="120" y="680" font-size="20">SAME DAY, EVERY WEEK</text></g>
<g id="meet"><rect class="s-ink" x="960" y="230" width="280" height="120" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M990 320L1060 300L1130 280L1210 255" fill="none" stroke-width="5" stroke-linecap="round"/><g id="mppl"></g><ellipse class="s-ink" cx="1140" cy="600" rx="260" ry="55" fill="var(--stage)" stroke-width="6"/></g>
<g id="bubs"></g>
<g id="prom"><text class="d" x="120" y="790" font-size="40">Report on last week. Make one new commitment.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="60">Break any link, and the chain fails.</text>
<g id="chain6"></g>
<g id="panels"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Simple, not easy.</text>
<text class="b" x="120" y="176" font-size="32">The hard part is doing it every single week.</text>
<g id="paper"><rect class="s-ink" x="120" y="230" width="320" height="330" rx="8" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="280" font-size="20">THE PLAN</text><g id="prows"></g></g>
<g id="worker"><circle class="ink" cx="720" cy="380" r="40"/><path class="ink" d="M660 548v-52a60 60 0 0 1 120 0v52z"/><path class="gain" d="M676 372a44 44 0 0 1 88 0z"/><rect class="gain" x="664" y="366" width="112" height="12" rx="6"/></g>
<g id="urg"></g>
<g id="clk"><circle class="s-ink" cx="1320" cy="390" r="110" fill="var(--stage)" stroke-width="7"/><path class="gain" d="M1320 390L1320 280A110 110 0 0 1 1415.3 335Z"/><line id="hand" class="s-ink" x1="1320" y1="390" x2="1320" y2="310" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1320" cy="390" r="9"/></g>
<g id="weeks"><text class="m" x="120" y="610" font-size="20">EVERY WEEK</text></g>
<path id="warr" class="s-gain" d="M1330 658h120m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="prog"><text class="d" x="120" y="800" font-size="48">Strategy becomes progress you can see.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qlab"><text class="m" x="143" y="220" font-size="26">LOOK AT YOUR TEAM’S GOALS THIS WEEK</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which of the four links</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">is missing from your team?</text></g>
<g id="qchain"><rect class="s-ink" x="146" y="530" width="180" height="80" rx="40" fill="none" stroke-width="10"/><rect class="s-ink" x="306" y="530" width="180" height="80" rx="40" fill="none" stroke-width="10"/><rect id="miss" class="s-gain" x="466" y="530" width="180" height="80" rx="40" fill="none" stroke-width="8" stroke-dasharray="16 12"/><rect class="s-ink" x="626" y="530" width="180" height="80" rx="40" fill="none" stroke-width="10"/></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">WHAT IS ONE STEP YOU COULD TAKE TO ADD IT?</text></g>
</g>