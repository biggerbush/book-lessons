<text class="d5" x="780" y="540" font-size="32" text-anchor="middle" style="fill:var(--gain)">Superstars</text><text class="m" x="780" y="578" font-size="20" text-anchor="middle">PUSH THE TEAM</text><text class="m" x="780" y="606" font-size="20" text-anchor="middle">FORWARD</text></g>
