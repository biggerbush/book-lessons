<rect id="gp" class="s-loss" x="1000" y="370" width="280" height="90" rx="12" fill="none" stroke-width="6" stroke-dasharray="14 10"/>
<text class="d" x="1140" y="438" font-size="60" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="itc" opacity="0"></g>
<g id="sci"><g id="scp"></g><text class="m" x="280" y="600" font-size="22">ECONOMIST GEORGE LOEWENSTEIN</text><text class="d5" x="280" y="660" font-size="36">Curiosity appears when we notice a gap.</text></g>
<g id="itx"><text class="d" x="120" y="800" font-size="46">That gap feels like an itch we must scratch.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">What are Saturn’s rings made of?</text>
