<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Clear is kind.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2" style="fill:var(--muted)">Unclear is unkind.</text>
<text class="b" x="120" y="600" font-size="32">Why honest, clear words are the kindest thing a leader offers.</text>
<g id="tfog"></g>
<g id="tclr"><rect class="s-ink" x="1120" y="220" width="320" height="180" rx="28" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1190 400l-20 56l70-56" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-ink" d="M1170 280h220M1170 320h220" stroke-width="10" stroke-linecap="round"/><path class="s-gain" d="M1170 360h140" stroke-width="10" stroke-linecap="round"/></g>
<g id="tnk"><text class="m" x="1280" y="520" font-size="24" text-anchor="middle" style="fill:var(--loss)">NICE ISN’T ALWAYS KIND</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Her rule fits on a sticky note.</text>
<g id="note"><g transform="rotate(-2 340 430)"><rect class="gain" x="120" y="230" width="440" height="400" rx="6"/>
<text class="d" x="160" y="330" font-size="60" style="fill:var(--on-gain)">Clear</text><text class="d" x="160" y="400" font-size="60" style="fill:var(--on-gain)">is kind.</text>
<text class="d" x="160" y="500" font-size="60" style="fill:var(--on-gain)">Unclear is</text><text class="d" x="160" y="570" font-size="60" style="fill:var(--on-gain)">unkind.</text></g></g>
<g id="vb"><text class="m" x="640" y="240" font-size="20">VAGUE FEELS GENTLE</text><rect class="s-ink" x="640" y="260" width="380" height="150" rx="24" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M720 410l10 50l40-50" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="d5" x="830" y="348" font-size="36" text-anchor="middle">It’s fine… mostly?</text><g id="pv"></g></g>
<g id="fog"><g id="pl"></g><g id="fgc"></g></g>
<g id="gx"><text class="d" x="120" y="800" font-size="48">Guessing is exhausting.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One problem kept coming up.</text>
<text class="b" x="120" y="176" font-size="32">In Brené Brown’s research with leaders.</text>
<g id="log"><rect class="s-ink" x="120" y="230" width="400" height="480" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="150" y="280" font-size="20">RESEARCH LOG</text><g id="rows"></g></g>
