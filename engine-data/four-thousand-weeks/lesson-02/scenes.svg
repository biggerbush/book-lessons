<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Efficiency</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Trap.</text>
<text class="b" x="120" y="600" font-size="32">Why working faster rarely helps you finally catch up.</text>
<g id="t_wk"></g>
<path class="s-ink" d="M1140 640h340M1170 640v140M1450 640v140" stroke-width="7" stroke-linecap="round"/>
<g id="t_stack"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The big promise.</text>
<text class="b" x="120" y="176" font-size="32">Oliver Burkeman, a self-described productivity geek.</text>
<g id="b_me"><text class="m" x="260" y="630" font-size="20" text-anchor="middle">PRODUCTIVITY GEEK</text></g>
<g id="b_books"></g>
<g id="b_bl"><text class="m" x="400" y="640" font-size="20">SYSTEM AFTER SYSTEM</text></g>
<g id="b_road"><text class="m" x="660" y="450" font-size="20">GET EFFICIENT ENOUGH</text><path class="s-gain" d="M660 480h390" stroke-width="6" stroke-dasharray="14 12"/><path class="s-gain" d="M1040 460l24 20-24 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="b_beach"><path class="gain" d="M1210 560a80 80 0 0 1 160 0z"/><path class="s-ink" d="M1100 560h380" stroke-width="6" stroke-linecap="round"/><path class="s-line" d="M1130 596q20-12 40 0t40 0t40 0M1300 610q20-12 40 0t40 0t40 0" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="1290" y="660" font-size="20" text-anchor="middle" style="fill:var(--gain)">WORK ENDS. LIFE BEGINS.</text></g>
<g id="b_q"><text class="d5" x="120" y="790" font-size="40">“Get efficient enough, and one day it’s all done.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The inbox that refills.</text>
<text class="b" x="120" y="176" font-size="32">Answer everything fast, and watch what happens.</text>
<rect class="s-line" x="120" y="230" width="640" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="276" font-size="22">INBOX</text>
<g id="i_rows"></g>
<g id="i_me"><path class="s-ink" d="M980 640h400" stroke-width="7" stroke-linecap="round"/><path class="ink" d="M1110 636h140l-12-36h-116z"/></g>
<path id="i_typ" class="s-gain" d="M1270 500l40-14M1275 530h46M1270 560l40 14" stroke-width="5" stroke-linecap="round"/>
<g id="i_zero"><text class="d" x="900" y="320" font-size="72" style="fill:var(--gain)">Inbox zero.</text><path class="s-gain" d="M1360 290l26 26 50-56" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="i_back"><text class="m" x="900" y="760" font-size="22" style="fill:var(--loss)">THEN THE REPLIES TO YOUR REPLIES ARRIVE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Speed draws demand.</text>
<text class="b" x="120" y="176" font-size="32">Answer fast, and more comes back.</text>
<g id="d_out"></g><g id="d_ret"></g><g id="d_more"></g>
<circle class="gain" cx="400" cy="470" r="54"/>
<text class="m" x="400" y="478" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text>
<g id="d_badge"><rect class="gain" x="250" y="570" width="300" height="56" rx="28"/><text class="m" x="400" y="605" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">GETS THINGS DONE</text></g>
<g id="d_pile"></g>
<text class="m" x="1290" y="800" font-size="20" text-anchor="middle">THE PILE</text>
<g id="d_n1"><text class="d" x="120" y="770" font-size="44">It didn’t shrink the pile.</text></g>
<g id="d_n2"><text class="d" x="120" y="830" font-size="44" style="fill:var(--loss)">It made the pile grow.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">More work for mother.</text>
<text class="b" x="120" y="176" font-size="32">Historian Ruth Schwartz Cowan on household appliances.</text>
<g id="w_mach"><rect class="s-ink" x="140" y="250" width="280" height="340" rx="22" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M140 320h280" stroke-width="5"/><circle class="ink" cx="190" cy="285" r="12"/><circle class="ink" cx="236" cy="285" r="12"/><circle class="s-ink" cx="280" cy="455" r="95" fill="var(--stage)" stroke-width="7"/><path id="w_drum" class="s-loss" d="M220 455a60 60 0 0 1 60-60M340 455a60 60 0 0 1-60 60" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="280" y="640" font-size="20" text-anchor="middle">APPLIANCES</text></g>
<path class="s-line" d="M520 280Q760 320 1000 280" fill="none" stroke-width="4"/>
<g id="w_shirts"></g>
<g id="w_shl"><text class="m" x="760" y="440" font-size="20" text-anchor="middle">WASHED MORE OFTEN</text></g>
<g id="w_house"><path class="s-ink" d="M680 560L760 500L840 560V640H680Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="gain" d="M870 506l4 10 10 4-10 4-4 10-4-10-10-4 10-4zM646 576l4 10 10 4-10 4-4 10-4-10-10-4 10-4zM878 606l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><text class="m" x="760" y="690" font-size="20" text-anchor="middle">SPOTLESS HOMES</text></g>
<g id="w_clk"><circle class="s-ink" cx="1260" cy="420" r="140" fill="var(--stage)" stroke-width="8"/><path id="w_wedge" class="gain"/><g id="w_ticks"></g><path id="w_h" class="s-ink" d="M1260 420V340" stroke-width="10" stroke-linecap="round"/><path id="w_m" class="s-ink" d="M1260 420V310" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1260" cy="420" r="10"/></g>
<g id="w_l1"><text class="m" x="1260" y="610" font-size="20" text-anchor="middle" style="fill:var(--gain)">TIME SAVED?</text></g>
<g id="w_l2"><text class="m" x="1260" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOST TO NEW EXPECTATIONS</text></g>
<g id="w_note"><text class="d" x="120" y="800" font-size="44">The hours saved vanished into new expectations.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A bottomless bucket.</text>
<text class="b" x="120" y="176" font-size="32">The demands on your time are effectively unlimited.</text>
<g id="k_buck"><text class="m" x="1000" y="226" font-size="20">ENDLESS DEMANDS</text><path class="s-ink" d="M1180 250H800V290" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><polygon id="k_wat" class="loss" fill-opacity=".35"/><polygon class="s-ink" points="620,400 980,400 940,740 660,740" fill="none" stroke-width="8" stroke-linejoin="round"/></g>
<path id="k_str" class="s-loss" d="M800 300V470" stroke-width="12" stroke-dasharray="20 14"/>
<g id="k_sg"><g id="k_you"></g><path id="k_arm" class="s-ink" fill="none" stroke-width="8" stroke-linecap="round"/><g id="k_scp"><path class="s-ink" d="M-40 -30h80l-10 60h-60z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="loss" d="M-34 -6h68l-6 30h-56z" fill-opacity=".5"/></g><text class="m" x="260" y="630" font-size="20" text-anchor="middle">YOU, SCOOPING</text></g>
<g id="k_done"><rect class="s-muted" x="1150" y="470" width="110" height="110" rx="14" fill="none" stroke-width="6" stroke-dasharray="12 10"/><text class="m" x="1205" y="630" font-size="20" text-anchor="middle">ALL HANDLED</text><text class="d" x="1205" y="700" font-size="40" text-anchor="middle" style="fill:var(--loss)">Never arrives.</text></g>
<g id="k_note"><text class="d" x="120" y="820" font-size="44">Scooping faster never empties it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let go of “done”.</text>
<text class="b" x="120" y="176" font-size="32">You will never clear the decks. So stop waiting to.</text>
<g id="f_fl"><path class="s-ink" d="M200 620V260" stroke-width="8" stroke-linecap="round"/><path id="f_cloth" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="120" y="670" font-size="20">I’LL NEVER BE DONE</text></g>
<text class="m" x="690" y="360" font-size="20" text-anchor="middle">THE TRIVIAL STUFF</text>
<rect id="f_ghost" class="s-muted" x="576" y="376" width="226" height="338" rx="8" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<g id="f_wall"></g>
<text class="m" x="1230" y="296" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT MATTERS</text>
<rect class="gain" x="1120" y="320" width="220" height="400"/>
<rect id="f_pan" class="s-ink" x="1120" y="320" width="220" height="400" fill="var(--stage)" stroke-width="7"/>
<rect class="s-ink" x="1120" y="320" width="220" height="400" fill="none" stroke-width="7"/>
<g id="f_mg"><g id="f_me"></g></g>
<g id="f_note"><text class="d" x="120" y="800" font-size="40">You don’t have to finish the trivial stuff first.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pay yourself first.</text>
<text class="b" x="120" y="176" font-size="32">Give the first part of your day to what matters.</text>
<g id="p_tl">
<g id="p_A"><rect x="0" y="420" width="800" height="100" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="m" x="400" y="480" font-size="24" text-anchor="middle" style="fill:var(--ink)">INBOX AND SMALL STUFF</text></g>
<g id="p_B"><rect class="gain" x="0" y="420" width="560" height="100" rx="16"/><text class="d5" x="280" y="482" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">The work you care about</text></g>
<path class="gain" d="M118 566a22 22 0 0 1 44 0z"/><text class="m" x="176" y="566" font-size="20">MORNING</text>
<text class="m" x="1480" y="566" font-size="20" text-anchor="end">EVENING</text>
</g>
<g id="p_proj"><path class="s-ink" d="M180 780h420" stroke-width="7" stroke-linecap="round"/><rect class="gain" x="400" y="630" width="140" height="146" rx="8"/><path d="M424 670h92M424 700h92M424 730h60" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/><text class="m" x="120" y="840" font-size="20">BIG PROJECT FIRST</text></g>
<g id="p_mail"></g>
<g id="p_ml"><text class="m" x="900" y="750" font-size="20">IT WOULD HAVE REFILLED ANYWAY</text></g>
</g>

<g id="s8" opacity="0">
<g id="q1"><text class="d" x="136" y="330" font-size="80" letter-spacing="-2">What’s one meaningful task</text></g>
<g id="q2"><text class="d" x="136" y="430" font-size="80" letter-spacing="-2">you keep postponing until</text></g>
<g id="q3"><text class="d" x="136" y="530" font-size="80" letter-spacing="-2">you’re <tspan style="fill:var(--gain)">caught up</tspan>?</text></g>
<g id="q_g"><circle id="q_c" class="gain" cx="1320" cy="610" r="80"/><text class="d" x="1320" y="648" font-size="110" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="q_do"><text class="m" x="143" y="690" font-size="26">TOMORROW, TRY DOING IT FIRST</text></g>
</g>