<path class="s-ink" d="M1260 520h30" stroke-width="6" stroke-linecap="round"/>
<path id="hand" class="s-loss" d="M1260 520V472" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1260" y="616" font-size="20" text-anchor="middle">MORE HOURS</text>
</g>
<g id="how"><text class="d" x="120" y="790" font-size="46">What matters is <tspan style="fill:var(--gain)">how</tspan> the hours are spent.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The expert puzzle.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Anders Ericsson studied world-class performers.</text>
<g id="res"><g id="resP"></g>
<rect class="s-ink" x="300" y="400" width="66" height="86" rx="6" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M314 426h38M314 446h38M314 466h24" stroke-width="5"/>
<text class="m" x="260" y="540" font-size="20" text-anchor="middle">ERICSSON</text></g>
<path id="look" class="s-line" d="M320 330L600 350" stroke-width="4" stroke-dasharray="8 10"/>
<g id="vio"><g id="vioP"></g>
<g transform="rotate(-30 762 372)">
<ellipse class="gain" cx="762" cy="372" rx="42" ry="22"/>
<path class="s-ink" d="M802 372h62" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="870" cy="372" r="7"/>
</g>
<path class="s-ink" d="M744 316L812 432" stroke-width="4" stroke-linecap="round"/>
<circle class="ink" cx="815" cy="438" r="10"/>
<text class="m" x="680" y="540" font-size="20" text-anchor="middle">WORLD-CLASS PERFORMER</text></g>
<g id="parts"></g>
<g id="dp"><text class="d" x="120" y="790" font-size="50">He called it <tspan style="fill:var(--gain)">deliberate practice.</tspan></text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Pick a stretch goal.</text>
<text class="b" x="120" y="176" font-size="32">One small weakness, not the whole performance.</text>
<g id="tgt">
<circle class="s-ink" cx="300" cy="470" r="150" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="300" cy="470" r="105" fill="none" stroke-width="6"/>
<circle class="s-ink" cx="300" cy="470" r="60" fill="none" stroke-width="6"/>
<circle id="bull" cx="300" cy="470" r="26"/></g>
<g id="arw"><g id="arwF"><path class="s-ink" d="M480 290L316 454M316 454l8-26M316 454l26-8M480 290l-4 22M480 290l-22 4" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<text class="m" x="300" y="668" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE SMALL WEAKNESS</text></g>
<g id="pno"><text class="m" x="560" y="282" font-size="20">THE WHOLE PIECE</text><g id="keys"></g></g>
<g id="pass"><rect class="gain" x="760" y="300" width="160" height="220" fill-opacity=".4"/>
<path class="s-gain" d="M760 540v16h160v-16" fill="none" stroke-width="6"/>
<text class="m" x="840" y="596" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE TRICKY PASSAGE</text></g>
<g id="lad"><path class="s-ink" d="M1240 260V700M1400 260V700" stroke-width="7" stroke-linecap="round"/>
<path class="s-ink" d="M1240 680h160M1240 610h160M1240 540h160M1240 470h160M1240 400h160M1240 330h160" stroke-width="6"/>
<circle class="ink" cx="1320" cy="516" r="22"/>
<text class="m" x="1222" y="547" font-size="20" text-anchor="end">NOW</text></g>
<g id="gl"><path class="s-gain" d="M1240 470h160" stroke-width="12"/><circle class="gain" cx="1320" cy="444" r="18"/>
<text class="m" x="1222" y="477" font-size="20" text-anchor="end" style="fill:var(--gain)">GOAL</text></g>
<g id="beyond"><text class="d" x="120" y="800" font-size="46">Just beyond what you can do right now.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Full focus.</text>
<text class="b" x="120" y="176" font-size="32">Total concentration on that one goal.</text>
<g id="fcs"><circle id="ring" class="s-gain" cx="360" cy="380" r="92" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<g id="fP"></g>
<path class="s-ink" d="M298 384a62 62 0 0 1 124 0" fill="none" stroke-width="10"/>
<rect class="gain" x="284" y="368" width="24" height="44" rx="8"/><rect class="gain" x="412" y="368" width="24" height="44" rx="8"/>
<text class="m" x="360" y="660" font-size="20" text-anchor="middle">TOTAL CONCENTRATION</text></g>
<g id="d0"><rect class="s-ink" x="650" y="262" width="44" height="76" rx="8" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="672" cy="326" r="4"/><text class="m" x="750" y="308" font-size="24">NO PHONES</text></g>
<g id="d1"><circle class="s-ink" cx="676" cy="432" r="28" fill="none" stroke-width="5"/><circle class="ink" cx="642" cy="470" r="7"/><circle class="ink" cx="630" cy="486" r="4"/><text class="m" x="750" y="448" font-size="24">NO DAYDREAMING</text></g>
<g id="d2"><circle class="s-ink" cx="672" cy="580" r="26" fill="none" stroke-width="5" stroke-dasharray="120 44"/><path class="ink" d="M690 552l14 18-22 4z"/><text class="m" x="750" y="588" font-size="24">NO AUTOPILOT</text></g>
<path id="x0" class="s-loss" d="M628 256l92 88" stroke-width="7" stroke-linecap="round" pathLength="1"/>
<path id="x1" class="s-loss" d="M628 396l92 88" stroke-width="7" stroke-linecap="round" pathLength="1"/>
<path id="x2" class="s-loss" d="M628 536l92 88" stroke-width="7" stroke-linecap="round" pathLength="1"/>
<g id="hg"><path class="s-ink" d="M1180 270h200M1180 610h200" stroke-width="8" stroke-linecap="round"/>
<polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/>
<path id="trk" class="s-gain" d="M1280 440V590" stroke-width="3"/>
<path class="s-ink" d="M1200 280C1200 380 1280 410 1280 440C1280 470 1200 500 1200 600M1360 280C1360 380 1280 410 1280 440C1280 470 1360 500 1360 600" fill="none" stroke-width="6"/>
<text class="m" x="1280" y="660" font-size="20" text-anchor="middle">SESSIONS OF ABOUT AN HOUR</text></g>
<g id="rest"><text class="m" x="1280" y="696" font-size="20" text-anchor="middle" style="fill:var(--gain)">THEN REST</text></g>
<g id="tired"><text class="d" x="120" y="800" font-size="46">Deep focus is tiring. Work, then rest.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Get feedback.</text>
<text class="b" x="120" y="176" font-size="32">Fast, honest feedback shows exactly what went wrong.</text>
<g id="fb0"><rect class="s-line" x="120" y="230" width="420" height="270" rx="18" fill="var(--stage)" stroke-width="3"/><g id="cP"></g>
<rect class="gain" x="330" y="262" width="170" height="76" rx="16"/><path class="gain" d="M344 330l-24 26 42-16z"/>
<path d="M356 290h118M356 312h80" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="330" y="470" font-size="22" text-anchor="middle">A COACH</text></g>
<g id="fb1"><rect class="s-line" x="590" y="230" width="420" height="270" rx="18" fill="var(--stage)" stroke-width="3"/>
