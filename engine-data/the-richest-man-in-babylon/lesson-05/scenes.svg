<text class="m" x="1395" y="520" font-size="20" text-anchor="middle" style="fill:var(--loss)">1 AFTERNOON</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Arkad saved one tenth.</text>
