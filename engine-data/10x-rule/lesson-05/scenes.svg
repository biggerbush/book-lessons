<g id="s0">
<text class="m" x="120" y="150" font-size="28">10X RULE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Dominate,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">don’t compete.</text>
<text class="b" x="120" y="600" font-size="32">Stop chasing rivals and build a lead they cannot close.</text>
<g id="trk"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The trap of competing.</text>
<text class="b" x="120" y="176" font-size="32">They match prices, copy ideas, and try to be a little better.</text>
<g id="shops"></g>
<g id="eye"><path class="s-muted" d="M590 540H950" stroke-width="5" stroke-dasharray="12 10"/><path class="s-muted" d="M950 522l20 18-20 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="780" y="510" font-size="20" text-anchor="middle">WATCHING</text></g>
<g id="cpy"></g>
<text class="m" x="380" y="750" font-size="24" text-anchor="middle" style="fill:var(--gain)">YOU</text>
<text class="m" x="1180" y="750" font-size="24" text-anchor="middle">RIVAL</text>
<g id="ceil"><path class="s-loss" d="M160 280H1440" stroke-width="6" stroke-dasharray="16 12"/><text class="m" x="1440" y="262" font-size="20" text-anchor="end" style="fill:var(--loss)">THEIR LIMIT</text></g>
<path id="grow" class="s-gain" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g id="lim"><text class="d" x="120" y="830" font-size="44">Their limits quietly become your limits.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t keep up. Take over.</text>
<text class="b" x="120" y="176" font-size="32">A blunt warning from Grant Cardone.</text>
<g id="book">
<rect class="s-ink" x="160" y="250" width="320" height="420" rx="10" fill="var(--stage)" stroke-width="7"/>
<rect class="loss" x="164" y="254" width="34" height="412"/>
<text class="m" x="226" y="320" font-size="18">CHAPTER</text>
<text class="d" x="226" y="400" font-size="36">Competition</text>
<text class="d" x="226" y="450" font-size="36">Is for</text>
<text class="d" x="226" y="500" font-size="36" style="fill:var(--loss)">Sissies.</text>
<path class="s-line" d="M226 560h200M226 595h140" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="notig"><text class="m" x="160" y="730" font-size="20">THE POINT: NOT TO IGNORE</text><text class="m" x="160" y="762" font-size="20">THE MARKET</text></g>
<g id="ktop"><text class="m" x="680" y="280" font-size="22">FROM KEEPING UP</text><text class="m" x="680" y="312" font-size="22" style="fill:var(--gain)">TO TAKING OVER</text></g>
<g id="pie"><g id="pieS"></g><text class="m" x="860" y="720" font-size="20" text-anchor="middle">COMPETING: SHARE THE PIE</text></g>
<g id="fol"><path class="s-gain" d="M1040 650Q1160 590 1262 540" fill="none" stroke-width="4" stroke-dasharray="10 10"/><g id="fol2"></g><text class="m" x="1300" y="720" font-size="20" text-anchor="middle" style="fill:var(--gain)">DOMINATING: SET THE PACE</text></g>
<g id="lead"><circle class="gain" cx="1320" cy="430" r="34"/><path class="gain" d="M1269 573v-44a51 51 0 0 1 102 0v44z"/><g id="crn"><path class="gain" d="M1292 386l6-34 22 18 22-18 6 34z"/></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Do what your rivals skip.</text>
<text class="b" x="120" y="176" font-size="32">Small extra actions, repeated daily, create a gap.</text>
<g id="skh"><text class="m" x="120" y="270" font-size="22">WHAT RIVALS SKIP</text></g>
<g id="rows"></g>
<g id="rep"><text class="m" x="120" y="720" font-size="22" style="fill:var(--gain)">EXTRA ACTIONS, REPEATED DAILY</text></g>
<g id="chart"><path class="s-ink" d="M900 760H1480" stroke-width="5" stroke-linecap="round"/><text class="m" x="1050" y="800" font-size="22" text-anchor="middle">RIVAL</text><text class="m" x="1310" y="800" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU</text><g id="blkR"></g></g>
<g id="blkY"></g>
<g id="gap"><path class="s-gain" d="M1396 632h14V280h-14" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1418" y="462" font-size="22" style="fill:var(--gain)">GAP</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Expand in a storm.</text>
<text class="b" x="120" y="176" font-size="32">When others cut back, push harder.</text>
<g id="cloud"><circle cx="720" cy="300" r="50" fill="var(--muted)"/><circle cx="800" cy="270" r="70" fill="var(--muted)"/><circle cx="880" cy="300" r="50" fill="var(--muted)"/><rect x="680" y="300" width="240" height="50" rx="25" fill="var(--muted)"/><g id="rain"></g></g>
<path class="s-line" d="M120 780H1480" stroke-width="5"/>
<g id="riv"></g>
<g id="shut"><text class="m" x="160" y="830" font-size="20" style="fill:var(--loss)">CUT BACK · STOP MARKETING · WAIT</text></g>
<rect class="s-ink" x="1100" y="500" width="300" height="280" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1080" y="470" width="340" height="40" rx="8"/>
<rect class="s-ink" x="1130" y="550" width="240" height="60" fill="none" stroke-width="4"/>
<rect class="s-ink" x="1210" y="640" width="80" height="140" fill="none" stroke-width="5"/>
<rect id="door" class="ink" x="1210" y="640" width="80" height="140"/>
<g id="push"><path class="s-gain" d="M1250 450V370m-24 24 24-24 24 24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1250" y="830" font-size="20" text-anchor="middle" style="fill:var(--gain)">PUSH HARDER</text></g>
<g id="cus4"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The tables turn.</text>
<text class="b" x="120" y="176" font-size="32">Once you dominate, the whole dynamic flips.</text>
<polygon id="cone" class="gain" points="800,220 660,640 940,640" fill-opacity=".15"/>
<g id="meW"><g id="me"></g><text class="m" x="800" y="680" font-size="20" text-anchor="middle">THE NAME THEY SEE</text></g>
<g id="cusW"><g id="cus5"></g><text class="m" x="330" y="680" font-size="20" text-anchor="middle">CUSTOMERS COME FIRST</text></g>
<g id="folW"><g id="look5"></g><g id="fol5"></g><text class="m" x="1270" y="680" font-size="20" text-anchor="middle">RIVALS COPY YOUR MOVES</text></g>
<g id="t1"><text class="d" x="120" y="800" font-size="44">You stop chasing.</text></g>
<g id="t2"><text class="d" x="620" y="800" font-size="44" style="fill:var(--gain)">You become the one being chased.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pick one arena.</text>
<text class="b" x="120" y="176" font-size="32">Own one market, territory or skill, not everything.</text>
<g id="grid"></g>
<g id="flag"><path d="M690 360V402" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/><path d="M690 360l40 13-40 13z" fill="var(--on-gain)"/><text class="m" x="710" y="436" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOURS</text></g>
<g id="one"><text class="m" x="120" y="740" font-size="22">NOT EVERYTHING. ONE PLACE.</text></g>
<path id="link" class="s-gain" d="M790 400L1010 450" stroke-width="4" stroke-dasharray="10 10"/>
<g id="mag"><g id="magI"><circle class="s-ink" cx="1180" cy="450" r="170" fill="var(--stage)" stroke-width="14"/><path class="s-ink" d="M1302 572L1400 670" stroke-width="26" stroke-linecap="round"/><text class="m" x="1180" y="420" font-size="24" text-anchor="middle">WHAT YOUR</text><text class="m" x="1180" y="456" font-size="24" text-anchor="middle">RIVALS</text><text class="m" x="1180" y="492" font-size="24" text-anchor="middle" style="fill:var(--gain)">REFUSE TO DO</text></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your move.</text>
<text class="b" x="120" y="176" font-size="32">Three actions your competitors skip, every week.</text>
<g id="pad">
<rect class="s-ink" x="120" y="230" width="600" height="540" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="bind"></g>
<text class="m" x="160" y="310" font-size="22">THREE THINGS RIVALS SKIP</text>
<path class="s-line" d="M160 425h520M160 525h520M160 625h520" stroke-width="3"/>
</g>
<g id="n0"><text class="d5" x="160" y="405" font-size="34">1. A second follow-up call</text></g>
<g id="n1"><text class="d5" x="160" y="505" font-size="34">2. A faster reply</text></g>
<g id="n2"><text class="d5" x="160" y="605" font-size="34">3. A handwritten thank-you</text></g>
<g id="cal">
<rect class="s-ink" x="820" y="240" width="660" height="520" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="820" y="240" width="660" height="76" rx="16"/>
<text class="d" x="1150" y="292" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">EVERY WEEK</text>
<text class="m" x="1010" y="360" font-size="20" text-anchor="middle">CALL</text><text class="m" x="1180" y="360" font-size="20" text-anchor="middle">REPLY</text><text class="m" x="1350" y="360" font-size="20" text-anchor="middle">NOTE</text>
<g id="chk"></g>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where in your work are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">trying to keep up, when you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">could be <tspan style="fill:var(--gain)">pulling away</tspan>?</text></g>
<g id="fl">
<text class="m" x="143" y="700" font-size="26">BUILD A LEAD NO ONE CAN CLOSE</text>
<path class="s-line" d="M900 742H1430" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M1430 680V744" stroke-width="4"/>
<g id="flg"></g>
<circle id="ra" class="ink" cy="728" r="14"/><circle id="rb" class="ink" cy="728" r="14"/><circle id="rc" class="gain" cy="722" r="20"/>
</g>
