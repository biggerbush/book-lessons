<ellipse id="halo" class="gain" cx="800" cy="540" rx="400" ry="130" fill-opacity=".14"/>
<g id="tbl"><g id="ppl"></g><rect class="ink" x="480" y="578" width="640" height="18" rx="4"/><path class="s-ink" d="M520 596v100M1080 596v100" stroke-width="8" stroke-linecap="round"/><g id="plates"></g><rect id="phone" rx="6"/></g>
<g id="qs"><text class="d" x="120" y="790" font-size="46">Savouring the present is a quiet strength.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Grow from shocks.</text>
<text class="b" x="120" y="176" font-size="32">Antifragility: an idea from Nassim Taleb.</text>
