<g id="push"><g id="arw"></g><text class="m" x="1270" y="320" font-size="20" text-anchor="middle">ONE PROBLEM</text><rect id="blk" x="1180" y="340" width="180" height="140" rx="14"/><path id="chk" d="M1225 410l30 30 60-60" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
