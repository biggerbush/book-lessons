<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Claim an edge</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">nobody else owns.</text>
<text class="b" x="120" y="600" font-size="32">Stop fighting for the middle and own an empty corner.</text>
<path class="s-ink" d="M1110 430H1470M1290 250V610" stroke-width="6" stroke-linecap="round"/>
<g id="t_corner"><rect x="1350" y="262" width="110" height="100" rx="12" fill="var(--gain)" fill-opacity=".15" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 8"/></g>
<g id="t_crowd"></g>
<circle id="t_me" class="gain" cx="1290" cy="430" r="20"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The crowded middle.</text>
<text class="b" x="120" y="176" font-size="32">Each one promises a little better, a little cheaper.</text>
<rect class="s-ink" x="120" y="240" width="920" height="480" rx="10" fill="none" stroke-width="6"/>
<path class="s-ink" d="M120 470H1040" stroke-width="6"/>
<g id="c_boxes"></g>
<g id="c_shop">
<circle class="ink" cx="1250" cy="430" r="40"/>
<path class="ink" d="M1190 598v-52a60 60 0 0 1 120 0v52z"/>
<circle cx="1350" cy="320" r="46" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text class="d" x="1350" y="342" font-size="60" text-anchor="middle">?</text>
<text class="m" x="1250" y="660" font-size="22" text-anchor="middle">CAN’T TELL THEM APART</text>
</g>
<g id="c_blur"><text class="d" x="120" y="810" font-size="46">Nobody remembers a slightly better version.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Draw two lines.</text>
<text class="b" x="120" y="176" font-size="32">Each axis is a quality your audience genuinely cares about.</text>
<g id="x_map"></g>
<g id="x_fans"></g>
<g id="x_note"><text class="m" x="1000" y="680" font-size="22" style="fill:var(--gain)">EVERY END APPEALS</text><text class="m" x="1000" y="712" font-size="22" style="fill:var(--gain)">TO SOMEONE, NOT GOOD VS BAD</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pick your axes.</text>
<text class="b" x="120" y="176" font-size="32">Match the worldview of the people you serve.</text>
<rect class="s-line" x="120" y="230" width="520" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="160" y="285" font-size="22">GODIN’S MENU</text>
<g id="p_menu"></g>
<line id="p_strike" class="s-loss" x1="211" y1="423" x2="329" y2="423" stroke-width="6" stroke-linecap="round"/>
<g id="p_tag"><path d="M760 260H1080L1140 330L1080 400H760Z" fill="var(--stage)" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/><circle cx="1085" cy="330" r="12" fill="none" stroke="var(--loss)" stroke-width="5"/><text class="d" x="800" y="352" font-size="60">PRICE</text><text class="m" x="760" y="450" font-size="22" style="fill:var(--loss)">THE LAZIEST CHOICE</text></g>
<g id="p_bars"></g>
<g id="p_under"><path d="M860 510L1030 560L1200 610L1370 660" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="760" y="815" font-size="22">COMPETE ON CHEAP AND SOMEONE UNDERCUTS YOU</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plot your rivals.</text>
<text class="b" x="120" y="176" font-size="32">A small bakery: fast or slow, familiar or adventurous.</text>
<g id="r_map"></g>
<g id="r_bake">
