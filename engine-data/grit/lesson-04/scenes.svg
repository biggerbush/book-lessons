<path class="s-ink" d="M160 700q40-40 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" fill="none" stroke-width="5"/>
<circle id="m0" class="s-loss" cx="320" cy="700" r="34" fill="none" stroke-width="6"/>
<circle id="m1" class="s-loss" cx="560" cy="700" r="34" fill="none" stroke-width="6"/>
<circle id="m2" class="s-loss" cx="800" cy="700" r="34" fill="none" stroke-width="6"/></g>
<g id="lean"><text class="d" x="980" y="650" font-size="46">Lean toward</text><text class="d" x="980" y="710" font-size="46">your mistakes.</text>
<path class="s-gain" d="M1300 770H1000m22-18-22 18 22 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Repeat and refine.</text>
<text class="b" x="120" y="176" font-size="32">Adjust each time until the weakness is fixed.</text>
<g id="lp"><circle class="s-line" cx="400" cy="500" r="160" fill="none" stroke-width="8"/><g id="spin"></g>
<text class="d" x="400" y="516" font-size="48" text-anchor="middle">Repeat</text></g>
<g id="wk"><text id="wkl" class="m" x="760" y="290" font-size="22">THE WEAKNESS</text>
<rect class="s-line" x="760" y="310" width="680" height="50" rx="25" fill="none" stroke-width="4"/>
<rect id="wkb" class="loss" x="760" y="310" height="50" rx="20" width="680"/></g>
<g id="mir"><ellipse class="s-ink" cx="860" cy="560" rx="80" ry="110" fill="var(--stage)" stroke-width="6"/>
<g id="mP" opacity=".45"></g><path class="s-ink" d="M860 670v40M820 710h80" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="980" y="545" font-size="22">REFLECT ON</text><text class="m" x="980" y="580" font-size="22">WHAT CHANGED</text></g>
<g id="chk"><circle class="gain" cx="1370" cy="560" r="70"/><path d="M1338 562l22 22 44-48" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="again"><text class="d" x="120" y="800" font-size="44">Then pick a new weakness and begin again.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The spelling bee.</text>
<text class="b" x="120" y="176" font-size="32">Duckworth studied finalists in the National Spelling Bee.</text>
