<g id="dust"></g><text class="m" x="400" y="590" font-size="20" text-anchor="middle">TRUE, BUT EXPLAINED BADLY</text></g>
<g id="mega"><path class="ink" d="M720 400h40l160-80v200l-160-80h-40z"/><path class="s-ink" d="M770 440l12 50" stroke-width="12" stroke-linecap="round"/><g id="waves"></g><text class="m" x="1270" y="610" font-size="20" text-anchor="middle">A WEAKER IDEA, TOLD BEAUTIFULLY</text></g>
<g id="crowd2"></g>
<g id="half"><text class="d" x="120" y="710" font-size="48">Being right is only half the job.</text>
<rect class="gain" x="120" y="750" width="680" height="70" rx="12"/><text class="m" x="150" y="795" font-size="24" style="fill:var(--on-gain)">BEING RIGHT</text>
<rect class="s-gain" x="800" y="750" width="680" height="70" rx="12" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="830" y="795" font-size="24" style="fill:var(--gain)">TELLING IT WELL</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Use it yourself.</text>
<text class="b" x="120" y="176" font-size="32">Don’t just present the facts. Give them a story.</text>
<g id="nb"><rect class="s-ink" x="120" y="240" width="280" height="320" rx="12" fill="var(--stage)" stroke-width="6"/><text class="m" x="260" y="292" font-size="22" text-anchor="middle">FACTS</text><path class="s-line" d="M160 340h200M160 390h200M160 440h200M160 490h140" stroke-width="6" stroke-linecap="round"/><path class="s-muted" d="M415 400h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/></g>
