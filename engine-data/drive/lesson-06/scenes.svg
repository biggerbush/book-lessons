<circle class="s-line" cx="1180" cy="490" r="170" fill="none" stroke-width="5" stroke-dasharray="12 12"/>
<text class="d" x="1180" y="520" font-size="90" text-anchor="middle" style="fill:var(--muted)">?</text>
