<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Work at a</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">natural pace.</text>
<text class="b" x="120" y="600" font-size="32">Why the greatest work often unfolds over years, not days.</text>
<circle class="s-ink" cx="1330" cy="400" r="130" fill="var(--stage)" stroke-width="8"/>
<g id="ticks"></g>
<path id="arc0" class="s-gain" fill="none" stroke-width="14" stroke-linecap="round"/>
<line id="hand0" class="s-ink" x1="1330" y1="400" x2="1330" y2="320" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1330" cy="400" r="12"/>
<text class="m" x="1330" y="580" font-size="22" text-anchor="middle">YEARS, NOT DAYS</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A long look back.</text>
<text class="b" x="120" y="176" font-size="32">Nicolaus Copernicus, astronomer.</text>
<g id="cop"><g id="copf"></g><text class="m" x="280" y="620" font-size="22" text-anchor="middle">COPERNICUS</text></g>
<g id="sun"><ellipse class="s-line" cx="800" cy="480" rx="220" ry="150" fill="none" stroke-width="4" stroke-dasharray="10 10"/><g id="rays"></g><circle class="gain" cx="800" cy="480" r="50"/><circle id="earth" class="ink" r="20"/><text class="m" x="800" y="690" font-size="20" text-anchor="middle">THE EARTH CIRCLES THE SUN</text></g>
<g id="cal"><rect class="s-ink" x="1120" y="260" width="320" height="390" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1120" y="260" width="320" height="54" rx="14"/><text class="m" x="1280" y="295" font-size="20" text-anchor="middle" style="fill:var(--stage)">DECADES OF REFINING</text><g id="cells"></g></g>
<g id="pub"><text class="d5" x="120" y="790" font-size="40">Published only near the end of his life.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Great minds, slow clocks.</text>
<text class="b" x="120" y="176" font-size="32">Many great thinkers of the past worked to a similar rhythm.</text>
<g id="nm0"><text class="d5" x="120" y="312" font-size="36">Galileo</text></g>
<g id="nm1"><text class="d5" x="120" y="442" font-size="36">Newton</text></g>
<g id="nm2"><text class="d5" x="120" y="572" font-size="36">Marie Curie</text></g>
<g id="rhy"></g>
<g id="ax"><path class="s-ink" d="M420 640H1460M1440 626l20 14-20 14" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1460" y="680" font-size="20" text-anchor="end">YEARS</text></g>
<g id="lg0"><rect class="gain" x="120" y="696" width="28" height="28" rx="6"/><text class="m" x="162" y="718" font-size="20">INTENSE WORK</text></g>
<g id="lg1"><rect x="420" y="703" width="56" height="14" rx="7" fill="var(--muted)" fill-opacity=".5"/><text class="m" x="490" y="718" font-size="20">SLOWER THINKING</text></g>
<g id="big"><text class="d" x="120" y="810" font-size="50">Big ideas unfolded over years, not weeks.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The modern sprint.</text>
<text class="b" x="120" y="176" font-size="32">Every task is due now. Every day feels like a race.</text>
<g id="desk"><g id="wk"></g><rect class="ink" x="160" y="540" width="480" height="18" rx="4"/><rect class="ink" x="180" y="558" width="14" height="110"/><rect class="ink" x="606" y="558" width="14" height="110"/><rect class="s-ink" x="420" y="410" width="170" height="110" rx="8" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="495" y="520" width="20" height="20"/></g>
<g id="bat"><rect class="s-ink" x="200" y="280" width="110" height="50" rx="8" fill="none" stroke-width="5"/><rect class="ink" x="312" y="295" width="10" height="20"/><rect id="lvl" x="208" y="288" height="34" width="94" rx="4"/><text class="m" x="200" y="370" font-size="20" style="fill:var(--loss)">DRAINED</text></g>
<g id="sw"><rect class="ink" x="880" y="300" width="40" height="26" rx="6"/><circle class="s-ink" cx="900" cy="450" r="120" fill="var(--stage)" stroke-width="8"/><line id="swh" class="s-loss" x1="900" y1="450" x2="900" y2="352" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="900" cy="450" r="10"/><text class="m" x="900" y="620" font-size="24" text-anchor="middle" style="fill:var(--loss)">DUE NOW</text></g>
<g id="pile"></g>
<g id="card"><rect class="gain" x="1130" y="290" width="340" height="76" rx="12"/><text class="d" x="1300" y="338" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">Meaningful work</text></g>
<g id="slip"><text class="d" x="120" y="820" font-size="40">Busy days pile up. Meaningful work slips.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hamilton took years.</text>
<text class="b" x="120" y="176" font-size="32">Lin-Manuel Miranda, creator of the musical Hamilton.</text>
<g id="mir"><g id="mirf"></g><text class="m" x="120" y="630" font-size="20">LIN-MANUEL MIRANDA</text></g>
<g id="bks"><rect class="s-ink" x="440" y="484" width="200" height="34" rx="4" fill="var(--stage)" stroke-width="4"/><rect class="loss" x="422" y="518" width="230" height="34" rx="4"/><rect class="gain" x="446" y="552" width="190" height="34" rx="4"/><rect class="ink" x="430" y="586" width="220" height="34" rx="4"/><text class="m" x="540" y="660" font-size="20" text-anchor="middle">A BIOGRAPHY</text></g>
<g id="notes"><path class="s-muted" d="M680 600H890M872 586l18 14-18 14" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/></g>
<g id="stg"><rect class="s-ink" x="920" y="280" width="540" height="360" rx="6" fill="var(--stage)" stroke-width="7"/><polygon class="gain" points="1190,290 1110,600 1270,600" fill-opacity=".25"/><g id="perf"></g><rect class="ink" x="920" y="600" width="540" height="40"/><rect id="cL" class="loss" x="924" y="284" width="266" height="316"/><rect id="cR" class="loss" x="1190" y="284" width="266" height="316"/><text class="m" x="1190" y="680" font-size="22" text-anchor="middle">HAMILTON</text></g>
<g id="stars"></g>
<g id="yrs"><path class="s-line" d="M120 760H1460" stroke-width="8" stroke-linecap="round"/><line id="yb" class="s-gain" x1="120" y1="760" x2="120" y2="760" stroke-width="8" stroke-linecap="round"/><text class="m" x="120" y="810" font-size="22">YEARS OF SHAPING BEFORE IT BECAME A HIT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stretch the horizon.</text>
<text class="b" x="120" y="176" font-size="32">Judge your work on longer timelines.</text>
<g id="q1"><text class="m" x="120" y="270" font-size="26">WHAT DID I FINISH TODAY?</text></g>
<line id="qs" class="s-ink" x1="112" y1="261" x2="112" y2="261" stroke-width="5" stroke-linecap="round"/>
<g id="q2"><text class="m" x="120" y="316" font-size="26" style="fill:var(--gain)">WHAT DID I BUILD THIS YEAR?</text></g>
<g id="axis5"><path class="s-ink" d="M160 670H1000" stroke-width="4"/><text class="m" x="1000" y="710" font-size="20" text-anchor="end">THIS YEAR</text></g>
<g id="dots"></g>
<path id="trend" class="s-gain" d="M160 630L1000 390" stroke-width="8" stroke-linecap="round"/>
<g id="tree"><rect class="ink" x="1266" y="460" width="28" height="220"/><circle class="gain" cx="1210" cy="490" r="66"/><circle class="gain" cx="1350" cy="490" r="66"/><circle class="gain" cx="1280" cy="440" r="100"/></g>
<g id="treeL"><path class="s-ink" d="M1100 680H1460" stroke-width="5" stroke-linecap="round"/><text class="m" x="1280" y="730" font-size="20" text-anchor="middle">STEADY OVER YEARS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plan in years.</text>
<text class="b" x="120" y="176" font-size="32">Think on a horizon of around five years.</text>
<g id="cols"></g>
<g id="bars"></g>
<g id="grow"><path class="s-gain" d="M120 680H1450M1428 664l22 16-22 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="120" y="722" font-size="22">LONG ENOUGH FOR SOMETHING MEANINGFUL TO GROW</text></g>
<g id="care"><text class="d5" x="120" y="800" font-size="36">A few months of extra care on each one feels reasonable.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ease the daily pace.</text>
<text class="b" x="120" y="176" font-size="32">Remove the false urgency.</text>
<g id="week"></g>
<g id="dl"><text class="m" x="880" y="262" font-size="22">PROJECT DEADLINE</text><path class="s-ink" d="M880 460H1460" stroke-width="5" stroke-linecap="round"/><g id="dlt"></g><text class="m" x="880" y="510" font-size="20" style="fill:var(--loss)">FIRST ANXIOUS GUESS</text></g>
<g id="lr"><text class="m" x="1260" y="510" font-size="20" style="fill:var(--gain)">REALISTIC</text></g>
<g id="walk"><text class="m" x="120" y="850" font-size="22">A PACE YOU COULD KEEP UP FOR YEARS</text></g>
</g>

<g id="s8" opacity="0">
<g id="pick"><text class="m" x="143" y="260" font-size="28">PICK ONE PROJECT YOU ARE RUSHING RIGHT NOW</text></g>
<g id="qa"><text class="d" x="136" y="400" font-size="76" letter-spacing="-2">What would change</text></g>
<g id="qb"><text class="d" x="136" y="500" font-size="76" letter-spacing="-2">if you gave it <tspan style="fill:var(--gain)">twice the time</tspan></text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="76" letter-spacing="-2">and judged it in five years?</text></g>
<g id="hg"><path class="s-ink" d="M1300 552h120M1300 728h120" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M1310 560H1410L1365 640L1410 720H1310L1355 640Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/><text class="d" x="1270" y="712" font-size="56" text-anchor="end" style="fill:var(--gain)">2×</text></g>
<text class="m" x="143" y="720" font-size="26">GIVE IT TIME TO GROW</text>
</g>