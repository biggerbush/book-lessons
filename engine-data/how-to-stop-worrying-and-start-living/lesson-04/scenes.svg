<circle class="ink" cx="1120" cy="520" r="16"/>
<text class="m" x="880" y="570" font-size="20" text-anchor="middle">RARE</text><text class="m" x="1360" y="570" font-size="20" text-anchor="middle">LIKELY</text>
<text class="m" x="1120" y="620" font-size="22" text-anchor="middle">THE REAL ODDS</text>
</g>
<g id="wv"><text class="m" x="120" y="708" font-size="20" style="fill:var(--loss)">FEELINGS</text><path id="fw" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="120" y="818" font-size="20" style="fill:var(--gain)">THE RECORD</text><path id="rw" class="s-gain" fill="none" stroke-width="5"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Run your own odds.</text>
<text class="b" x="120" y="176" font-size="32">Write it down. Count. Be honest.</text>
<g id="card"><g transform="rotate(-3 330 400)">
