<text class="m" x="1340" y="518" font-size="22">SHALLOW</text>
</g>
<g id="ics"></g>
<g id="rule"><text class="d" x="120" y="830" font-size="44">Newport’s rule: shrink the shallow work on purpose.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Block every minute.</text>
<text class="b" x="120" y="176" font-size="32">Give every minute a job, grouped into blocks.</text>
