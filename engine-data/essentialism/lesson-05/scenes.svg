<rect id="hl6" class="gain" x="110" y="590" width="1370" height="100" rx="16" fill-opacity=".15"/>
<g id="rows6"></g>
<g id="sl6"><text class="d" x="120" y="800" font-size="44">A short list you genuinely want.</text></g>
</g>

<g id="s7" opacity="0">
