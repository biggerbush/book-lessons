</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old gatekeepers.</text>
<text class="b" x="120" y="176" font-size="32">A publisher, a network or a station had to say yes.</text>
<g id="g_you"></g>
