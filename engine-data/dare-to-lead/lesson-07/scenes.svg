<rect x="380" y="240" width="760" height="160" rx="24" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<g id="dots5"><circle class="gain" cx="700" cy="320" r="12"/><circle class="gain" cx="760" cy="320" r="12"/><circle class="gain" cx="820" cy="320" r="12"/></g>
