<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 4</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Defensive or</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">Enterprising:</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2" style="fill:var(--gain)">Pick your path.</text>
<text class="b" x="120" y="610" font-size="32">Your effort, not your appetite for risk, decides your path.</text>
<path class="s-line" d="M1100 600H1480" stroke-width="5" stroke-linecap="round"/>
<rect class="s-ink" x="1125" y="300" width="150" height="300" fill="var(--line)" stroke-width="7"/>
<rect class="s-ink" x="1315" y="300" width="150" height="300" fill="var(--line)" stroke-width="7"/>
<rect id="dp0" class="gain" x="1125" y="300" width="150" height="300"/>
<rect id="dp1" class="ink" x="1315" y="300" width="150" height="300"/>
<g id="sg0"><rect class="s-ink" x="1115" y="236" width="170" height="46" rx="8" fill="var(--stage)" stroke-width="4"/><text class="m" x="1200" y="266" font-size="18" text-anchor="middle">LESS EFFORT</text></g>
<g id="sg1"><rect class="s-ink" x="1305" y="236" width="170" height="46" rx="8" fill="var(--stage)" stroke-width="4"/><text class="m" x="1390" y="266" font-size="18" text-anchor="middle">MORE EFFORT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bigger risk, bigger reward?</text>
<text class="b" x="120" y="176" font-size="32">The picture most people carry in their heads.</text>
