<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">They knew.</text>
<text class="b" x="120" y="176" font-size="32">Facebook's own internal research on teen Instagram users, later leaked.</text>
<g id="slide"><rect class="s-ink" x="120" y="230" width="780" height="420" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="160" y="282" font-size="20">INTERNAL RESEARCH · TEEN INSTAGRAM USERS</text><g id="sfig"></g></g>
<g id="quo"><text class="d5" x="160" y="520" font-size="34">“We make body image issues</text><text class="d5" x="160" y="570" font-size="34">worse for one in three teen girls.”</text></g>
<g id="stamp"><g transform="rotate(-6 750 712)"><rect class="s-loss" x="640" y="680" width="220" height="64" rx="8" fill="none" stroke-width="5"/>
<text class="m" x="750" y="724" font-size="30" text-anchor="middle" style="fill:var(--loss)">LEAKED</text></g></g>
<g id="hq"><text class="m" x="1080" y="260" font-size="20">INSIDE THE COMPANY</text>
<rect class="s-ink" x="1080" y="280" width="340" height="460" fill="var(--stage)" stroke-width="6"/><g id="win"></g></g>
<rect id="hw" class="loss" x="1110" y="392" width="70" height="50" opacity="0"/>
