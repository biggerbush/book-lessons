<path class="ink" d="M120 620h560l-40 34H160z"/>
<g id="lines"></g>
</g>
<g id="cal">
<text class="m" x="780" y="300" font-size="22">A POST EVERY DAY, INSPIRED OR NOT</text>
<g id="cells"></g>
</g>
<g id="arrive"><text class="d" x="120" y="790" font-size="44">He keeps showing up, and the ideas arrive.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Choose it.</text>
<g id="s6sub"><text class="b" x="120" y="176" font-size="32">Creativity is a decision, not a birthright.</text></g>
<g id="post">
