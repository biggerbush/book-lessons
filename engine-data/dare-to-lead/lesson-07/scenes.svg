<text class="m" x="1130" y="682" font-size="22" style="fill:var(--gain)">FEELS LIKE A REWARD</text>
<text class="d5" x="1130" y="740" font-size="32">Even a wrong one.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Notice the feeling.</text>
<text class="b" x="120" y="176" font-size="32">When an emotion hooks you, slow down before you react.</text>
<g id="n0">
