<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Everyone is already</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">a creator.</text>
<text class="b" x="120" y="600" font-size="32">Why you have been creating all along, without noticing.</text>
<g id="hp"></g>
<g id="orb"></g>
</g>

<g id="s1" opacity="0">
<rect class="loss" x="0" y="200" width="1600" height="660" fill-opacity=".07"/>
<text class="d" x="120" y="124" font-size="68">The old myth.</text>
<text class="b" x="120" y="176" font-size="32">Creativity as a spotlight on a lucky few.</text>
<g id="spot"><polygon points="770,236 830,236 1060,720 540,720" fill="var(--gain)" fill-opacity=".2"/><ellipse cx="800" cy="720" rx="260" ry="28" fill="var(--gain)" fill-opacity=".35"/><rect class="ink" x="756" y="200" width="88" height="40" rx="8"/></g>
<g id="perf"></g>
<g id="crw"><g id="crwi" opacity=".45"></g><text class="m" x="120" y="790" font-size="20">EVERYONE ELSE, IN THE DARK</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rubin disagrees.</text>
<text class="b" x="120" y="176" font-size="32">Decades in studios with famous artists, yet he rejects that picture.</text>
<g id="rb"><g id="rbf"></g><path d="M262 392q38 80 76 0z" fill="var(--muted)"/>
<rect class="ink" x="140" y="560" width="320" height="70" rx="10"/>
<path d="M190 575v40M240 575v40M290 575v40M340 575v40M390 575v40" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/>
<g id="knb"></g>
<text class="m" x="300" y="680" font-size="20" text-anchor="middle">THE STUDIO</text></g>
<g id="qc"><rect class="s-line" x="620" y="240" width="860" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="670" y="360" font-size="60">“Creativity is not</text>
<text class="d" x="670" y="440" font-size="60">a <tspan style="fill:var(--gain)">rare ability.</tspan>”</text>
<text class="m" x="670" y="500" font-size="22">RICK RUBIN</text></g>
<g id="hu"><g id="hul"><text class="m" x="620" y="770" font-size="24" style="fill:var(--gain)">A FUNDAMENTAL PART OF BEING HUMAN</text></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">You make things every day.</text>
<text class="b" x="120" y="176" font-size="32">To create: bring something into being that wasn’t there before.</text>
<g id="pn"><rect class="s-line" x="120" y="240" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-line" x="590" y="240" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-line" x="1060" y="240" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/></g>
<g id="e0"><g id="e0f"></g><text class="d5" x="150" y="690" font-size="30">A conversation</text></g>
<g id="b0"><rect x="160" y="280" width="140" height="70" rx="22" fill="var(--stage)" class="s-ink" stroke-width="5"/><circle class="ink" cx="200" cy="315" r="7"/><circle class="ink" cx="230" cy="315" r="7"/><circle class="ink" cx="260" cy="315" r="7"/></g>
<g id="b1"><rect class="gain" x="360" y="300" width="140" height="70" rx="22"/><circle cx="400" cy="335" r="7" fill="var(--on-gain)"/><circle cx="430" cy="335" r="7" fill="var(--on-gain)"/><circle cx="460" cy="335" r="7" fill="var(--on-gain)"/></g>
<g id="e1"><rect class="s-muted" x="630" y="420" width="260" height="120" rx="14" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<path class="s-muted" d="M700 380h120m-18-16 18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-line" d="M610 560H990" stroke-width="4"/>
<g id="sofaI"><rect class="gain" x="650" y="420" width="220" height="70" rx="14"/><rect class="gain" x="630" y="470" width="260" height="70" rx="14"/><path d="M660 490H860" stroke="var(--stage)" stroke-width="4"/></g>
<text class="d5" x="620" y="690" font-size="30">Rearranged furniture</text></g>
<g id="e2"><path class="s-line" d="M1130 600V340H1370" fill="none" stroke-width="10" stroke-linejoin="round"/>
<rect class="loss" x="1170" y="328" width="36" height="24" rx="5"/><rect class="loss" x="1220" y="328" width="36" height="24" rx="5"/><rect class="loss" x="1270" y="328" width="36" height="24" rx="5"/>
<path id="rt" d="M1130 600H1310V420H1400V365" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
<path class="gain" d="M1370 360v-34l30-26 30 26v34z"/><circle class="ink" cx="1130" cy="600" r="14"/>
<text class="d5" x="1090" y="690" font-size="30">A new way home</text></g>
<g id="nw"><text class="d" x="120" y="815" font-size="44">Each one is something new.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Even seeing is creating.</text>
<text class="b" x="120" y="176" font-size="32">Your senses take in the world. Your mind builds its own version.</text>
<g id="wld"><rect class="s-line" x="120" y="240" width="280" height="280" rx="14" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="170" cy="290" r="24"/><polygon class="ink" points="140,500 230,360 320,500"/><rect class="ink" x="354" y="450" width="12" height="50"/><circle class="ink" cx="360" cy="430" r="22"/><text class="m" x="120" y="556" font-size="20">THE WORLD</text></g>
<path id="a0" class="s-muted" d="M420 380h60m-16-14 16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="eyeG"><path class="s-ink" d="M500 380Q580 316 660 380Q580 444 500 380Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle id="iris" class="ink" cx="580" cy="380" r="22"/></g>
<path id="a1" class="s-muted" d="M680 380h76m-16-14 16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="hdG"><circle class="s-ink" cx="880" cy="380" r="100" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="850" cy="360" r="30"/><circle class="gain" cx="900" cy="350" r="32"/><circle class="gain" cx="870" cy="400" r="30"/><circle class="gain" cx="915" cy="395" r="26"/></g>
<path id="a2" class="s-muted" d="M1000 380h76m-16-14 16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="vb"><rect class="s-line" x="1100" y="240" width="380" height="280" rx="14" fill="var(--stage)" stroke-width="3"/><text class="m" x="1100" y="556" font-size="20" style="fill:var(--gain)">YOUR VERSION</text></g>
<g id="ver"></g>
<g id="two"><g id="twof"></g>
<rect class="s-line" x="240" y="640" width="180" height="140" rx="10" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="275" cy="672" r="14"/><polygon class="ink" points="260,770 330,690 400,770"/>
<rect class="s-line" x="620" y="640" width="180" height="140" rx="10" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="770" cy="672" r="14"/><polygon class="ink" points="630,770 680,710 730,770"/><polygon class="ink" points="690,770 745,700 795,770"/></g>
<g id="twoc"><text class="d" x="880" y="700" font-size="44">Your view of reality</text><text class="d" x="880" y="760" font-size="44">is an <tspan style="fill:var(--gain)">original</tspan> work.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Notice, respond, leave a mark.</text>
<text class="b" x="120" y="176" font-size="32">Every choice shapes something, however small.</text>
<g id="inp"><text class="m" x="140" y="400" font-size="20">WHAT YOU NOTICE</text><path class="s-ink" d="M140 430H440m-22-20 22 20-22 20" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="p5"></g>
<g id="chs"></g>
<g id="chl"><text class="m" x="1100" y="437" font-size="20" style="fill:var(--gain)">EACH CHOICE LEAVES A MARK</text></g>
<g id="day"><path class="s-line" d="M140 700H1460" stroke-width="6" stroke-linecap="round"/><text class="m" x="140" y="750" font-size="20">MORNING</text><text class="m" x="1460" y="750" font-size="20" text-anchor="end">NIGHT</text><g id="dm"></g></g>
<g id="cc"><text class="d" x="120" y="830" font-size="44">Creating constantly, art or not.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">No audience needed.</text>
<text class="b" x="120" y="176" font-size="32">A work doesn’t need to be sold, recorded or hung to count.</text>
<g id="gf"><rect class="s-ink" x="140" y="240" width="340" height="260" fill="var(--stage)" stroke-width="10"/><rect x="170" y="270" width="280" height="200" fill="var(--line)"/><circle class="gain" cx="400" cy="320" r="20"/><polygon fill="var(--muted)" points="190,470 280,350 370,470"/>
<text class="m" x="140" y="560" font-size="22" style="fill:var(--loss)">NOT REQUIRED</text>
<text class="d5" x="140" y="615" font-size="32">Sold</text><text class="d5" x="140" y="665" font-size="32">Recorded</text><text class="d5" x="140" y="715" font-size="32">Hung in a gallery</text></g>
<line id="k0" x1="136" y1="604" x2="136" y2="604" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/>
<line id="k1" x1="136" y1="654" x2="136" y2="654" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/>
<line id="k2" x1="136" y1="704" x2="136" y2="704" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/>
<g id="bal"><path class="s-ink" d="M1000 360V700" stroke-width="8"/><path class="ink" d="M960 740L1000 700L1040 740z"/>
<g id="beamR"><path class="s-ink" d="M720 360H1280" stroke-width="8" stroke-linecap="round"/>
<path class="s-muted" d="M720 360L630 520M720 360L810 520M1280 360L1190 520M1280 360L1370 520" stroke-width="3"/>
<path class="ink" d="M630 520h180q-90 50-180 0z"/><path class="ink" d="M1190 520h180q-90 50-180 0z"/>
<g id="rec"><circle class="ink" cx="1280" cy="476" r="40"/><circle class="gain" cx="1280" cy="476" r="12"/></g>
<g id="note"><rect class="gain" x="680" y="455" width="80" height="62" rx="6"/><path d="M692 472h56M692 486h56M692 500h34" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/></g></g>
<circle class="ink" cx="1000" cy="360" r="12"/>
<text class="m" x="1280" y="640" font-size="20" text-anchor="middle">A HIT RECORD</text></g>
<g id="nl"><text class="m" x="720" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">A NOTE TO A FRIEND</text></g>
<g id="val"><text class="d" x="120" y="820" font-size="44">The value lies in the making itself.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Artist is a way of being.</text>
<text class="b" x="120" y="176" font-size="32">Less a job title, more a way of moving through the world.</text>
<g id="bd"><rect class="s-ink" x="120" y="240" width="380" height="200" rx="18" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="132" y="252" width="356" height="48" rx="10"/><text class="m" x="150" y="284" font-size="22" style="fill:var(--stage)">JOB TITLE</text><text class="d" x="150" y="400" font-size="64">Artist</text></g>
<line id="bs" x1="146" y1="276" x2="146" y2="276" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/>
<g id="wob"><text class="m" x="304" y="284" font-size="20" style="fill:var(--gain)">WAY OF BEING</text></g>
<g id="trk"><path class="s-gain" d="M160 700H700" stroke-width="6" stroke-linecap="round"/><path class="s-muted" d="M700 700H1190" stroke-width="4" stroke-dasharray="10 12"/><g id="tdots"></g><text class="m" x="160" y="745" font-size="20">ALREADY CREATING</text></g>
<g id="door"><rect class="gain" x="1200" y="300" width="220" height="400" fill-opacity=".3"/><rect id="dp" class="ink" x="1204" y="304" width="212" height="392"/>
<g id="lk"><rect class="loss" x="1355" y="490" width="34" height="28" rx="4"/><path class="s-loss" d="M1362 490v-10a10 10 0 0 1 20 0v10" fill="none" stroke-width="5"/></g>
<rect class="s-ink" x="1200" y="300" width="220" height="400" fill="none" stroke-width="8"/></g>
<g id="wk"><g id="wkI"></g></g>
<g id="zero"><text class="d" x="120" y="830" font-size="40">Not starting from zero. Simply continuing.</text></g>
</g>

<g id="s8" opacity="0">
<g id="ck"><text class="m" x="136" y="230" font-size="24">TONIGHT: THREE THINGS YOU MADE TODAY</text><g id="ckr"></g><path class="gain" d="M1180 440l200-200 34 34-200 200-46 12z"/></g>
<g id="qa"><text class="d" x="136" y="610" font-size="88" letter-spacing="-2">What might you make</text></g>
<g id="qb"><text class="d" x="136" y="720" font-size="88" letter-spacing="-2">if you did it <tspan style="fill:var(--gain)">on purpose?</tspan></text><text class="m" x="143" y="810" font-size="26">MAKE SOMETHING ON PURPOSE</text></g>
</g>