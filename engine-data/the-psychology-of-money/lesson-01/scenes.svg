<text class="d" x="660" y="710" font-size="46" style="fill:var(--on-gain)">Mostly shaped by that slice.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same market. Different decades.</text>
<text class="b" x="120" y="176" font-size="32">The US stock market after inflation, in each person’s teens and twenties.</text>
<g id="p0"></g><g id="p1"></g><g id="ln0"></g><g id="ln1"></g>
<g id="v0"><text class="d5" x="200" y="520" font-size="40" style="fill:var(--loss)">Almost nowhere</text></g>
<g id="v1"><text class="d5" x="900" y="470" font-size="40" style="fill:var(--gain)">Almost 10× over</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">Different years, different lessons.</text>
<g id="f0"><g id="f0i"><circle class="s-loss" r="110" fill="var(--stage)" stroke-width="8"/><circle class="ink" cx="-38" cy="-12" r="10"/><circle class="ink" cx="38" cy="-12" r="10"/>
<path class="s-loss" d="M-60-52L-20-38M60-52L20-38M-45 50q15-15 30 0t30 0t30 0" fill="none" stroke-width="7" stroke-linecap="round"/></g></g>
<g id="q0"><text class="d5" x="360" y="600" font-size="34" text-anchor="middle">“Stocks are a slow,</text><text class="d5" x="360" y="644" font-size="34" text-anchor="middle">frustrating gamble.”</text></g>
<g id="f1"><g id="f1i"><circle class="s-gain" r="110" fill="var(--stage)" stroke-width="8"/><circle class="ink" cx="-38" cy="-12" r="10"/><circle class="ink" cx="38" cy="-12" r="10"/>
<path class="s-gain" d="M-55 28q55 60 110 0" fill="none" stroke-width="8" stroke-linecap="round"/></g></g>
<g id="q1"><text class="d5" x="1240" y="600" font-size="34" text-anchor="middle">“Stocks are a reliable</text><text class="d5" x="1240" y="644" font-size="34" text-anchor="middle">way to build wealth.”</text></g>
<g id="crazy"><text class="d" x="800" y="420" font-size="56" text-anchor="middle">No one’s crazy.</text></g>
<g id="fool"><text class="d" x="120" y="780" font-size="48">Neither is foolish.</text></g>
<g id="rep"><text class="m" x="120" y="836" font-size="22">THEY ARE SIMPLY REPORTING WHAT THEY LIVED THROUGH</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">What the research found.</text>
<text class="b" x="120" y="176" font-size="32">Economists Ulrike Malmendier and Stefan Nagel.</text>
<g id="res"><text class="m" x="140" y="450" font-size="20">MALMENDIER &amp; NAGEL</text></g>
<g id="grid"></g>
<g id="dl"><text class="m" x="500" y="510" font-size="20">DECADES OF DATA ON HOW ORDINARY PEOPLE INVEST</text></g>
<g id="early"><text class="m" x="120" y="580" font-size="20">ONE INVESTOR’S LIFETIME</text>
<rect class="s-line" x="120" y="600" width="900" height="50" rx="25" fill="none" stroke-width="4"/>
<rect class="gain" x="300" y="600" width="240" height="50"/>
