<path class="gain" d="M1240 420L1252 378H1468L1480 420Z"/>
<rect class="s-ink" x="1280" y="450" width="40" height="40" fill="none" stroke-width="5"/>
<rect class="s-ink" x="1400" y="450" width="40" height="40" fill="none" stroke-width="5"/>
<rect class="ink" x="1335" y="520" width="50" height="90"/>
<text class="m" x="1360" y="650" font-size="20" text-anchor="middle">SMALL BAKERY</text>
</g>
<g id="r_crowd"><ellipse cx="780" cy="580" rx="130" ry="95" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="780" y="704" font-size="20" text-anchor="middle" style="fill:var(--loss)">CROWDED</text></g>
<g id="r_dots"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The empty corner.</text>
<text class="b" x="120" y="176" font-size="32">Look for the spot where no dots land.</text>
<g id="e_corner"><rect id="e_cr" x="264" y="264" width="352" height="252" rx="14" fill="var(--gain)" fill-opacity=".15" stroke="var(--gain)" stroke-width="4" stroke-dasharray="12 10"/></g>
<g id="e_map"></g>
<g id="e_loaf"></g>
<g id="e_prom"><text class="m" x="1120" y="300" font-size="22" style="fill:var(--gain)">THE PROMISE</text><text class="d" x="1120" y="362" font-size="40">A clear reason</text><text class="d" x="1120" y="414" font-size="40">to choose you.</text></g>
<g id="e_c0"><rect class="gain" x="1120" y="500" width="360" height="64" rx="32"/><text class="m" x="1300" y="540" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">EASY TO DESCRIBE</text></g>
<g id="e_c1"><rect class="gain" x="1120" y="590" width="360" height="64" rx="32"/><text class="m" x="1300" y="630" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">EASY TO RECOMMEND</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Built for someone.</text>
<text class="b" x="120" y="176" font-size="32">The edge needs a real group that wants exactly that extreme.</text>
<g id="f_loaf"></g>
<g id="f_fans"></g>
<g id="f_lab"><text class="m" x="420" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">WANTS EXACTLY THIS</text></g>
<path class="s-line" d="M860 600H1440" stroke-width="4" stroke-dasharray="8 10"/>
<g id="f_walk"></g>
<g id="f_shrug"><text class="m" x="860" y="660" font-size="20">SOME SHRUG AND WALK PAST. THAT’S FINE.</text></g>
<g id="f_fit"><text class="d" x="120" y="800" font-size="44">A perfect fit for a few beats acceptable to all.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Redraw the map.</text>
<text class="b" x="120" y="176" font-size="32">Corner crowded? Swap one axis and draw again.</text>
<g id="w_a"></g>
<line id="w_strike" class="s-loss" x1="316" y1="278" x2="484" y2="278" stroke-width="6" stroke-linecap="round"/>
<path class="s-muted" d="M700 500h110m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="w_open"><rect id="w_or" x="944" y="304" width="192" height="192" rx="12" fill="var(--gain)" fill-opacity=".15" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 8"/></g>
<g id="w_b"></g>
<g id="w_dots"></g>
<g id="w_flag"><path class="s-ink" d="M1010 480V340" stroke-width="6" stroke-linecap="round"/><polygon id="w_fl" class="gain" points="1010,340 1090,362 1010,388"/></g>
<g id="w_new"><text class="d" x="120" y="810" font-size="40">A new pair of qualities reveals open space.</text></g>
