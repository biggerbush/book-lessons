<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Don’t believe</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your own story.</text>
<text class="b" x="120" y="600" font-size="32">Why success stories make us arrogant, and what to do instead.</text>
<g id="tro"><g id="cup"><path class="gain" d="M1250 300h140v50a70 70 0 0 1-140 0z"/><path class="s-gain" d="M1250 316h-30a34 34 0 0 0 34 54M1390 316h30a34 34 0 0 1-34 54" fill="none" stroke-width="8" stroke-linecap="round"/><rect class="gain" x="1308" y="418" width="24" height="52"/><rect class="gain" x="1270" y="470" width="100" height="30" rx="4"/></g><rect class="ink" x="1180" y="500" width="280" height="14" rx="4"/></g>
<g id="bub"><rect id="bubr" x="1140" y="190" width="340" height="76" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><path d="M1300 264l10 24 14-24" fill="var(--stage)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><text class="m" x="1310" y="236" font-size="20" text-anchor="middle">“ALWAYS MEANT FOR THIS”</text></g>
<g id="ego"><text class="m" x="1320" y="560" font-size="22" text-anchor="middle" style="fill:var(--loss)">THAT VOICE IS EGO</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The neat story.</text>
<text class="b" x="120" y="176" font-size="32">After success, we tidy the past.</text>
<g id="book">
<path class="s-ink" d="M370 330c-60-30-160-30-220-10v250c60-20 160-20 220 10z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M370 330c60-30 160-30 220-10v250c-60-20-160-20-220 10z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M190 390h140M190 430h140M190 470h140M190 510h100M410 390h140M410 430h140M410 470h140M410 510h100" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="370" y="650" font-size="20" text-anchor="middle">OUR TIDY VERSION</text>
</g>
<g id="real">
<path id="messy" class="s-muted" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="ink" cx="760" cy="640" r="14"/>
<text class="m" x="760" y="690" font-size="20" text-anchor="middle">START</text>
<path class="s-ink" d="M1420 300V210" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1420 210l56 18-56 18z"/>
<text class="m" x="1405" y="196" font-size="20" text-anchor="end">GREATNESS</text>
<path class="s-muted" d="M1090 654h40" stroke-width="5"/><text class="m" x="1150" y="660" font-size="20">WHAT REALLY HAPPENED</text>
</g>
<path id="straight" class="s-gain" d="M760 640L1410 305" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-width="8" stroke-linecap="round"/>
<g id="lstory"><path class="s-gain" d="M1090 614h40" stroke-width="8"/><text class="m" x="1150" y="620" font-size="20" style="fill:var(--gain)">THE STORY WE TELL</text></g>
<g id="arro"><text class="d" x="120" y="810" font-size="44">It feels good, but it quietly makes us <tspan style="fill:var(--loss)">arrogant.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">When the story replaces the work.</text>
<text class="b" x="120" y="176" font-size="32">Believing in destiny changes how we act.</text>
<g id="steps"></g>
<text id="bor" class="m" x="140" y="806" font-size="20">THE BORING HABITS THAT GOT US THERE</text>
<g id="cr"><path id="crp" class="gain" d="M600 300l10-56 30 28 40-44 40 44 30-28 10 56z"/></g>
<g id="des"><text class="d5" x="860" y="300" font-size="34">“I was destined to win.”</text><text class="d5" x="860" y="350" font-size="34">“I deserve to keep winning.”</text></g>
<g id="birth"><text class="m" x="860" y="440" font-size="20">SUCCESS FEELS LIKE A</text><text class="d" x="860" y="510" font-size="60" style="fill:var(--loss)">birthright</text><text class="m" x="860" y="556" font-size="20">INSTEAD OF A RESULT</text></g>
<g id="rep"><text class="d" x="860" y="690" font-size="52">The story</text><text class="d" x="860" y="750" font-size="52">replaces the work.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Bill Walsh.</text>
<text class="b" x="120" y="176" font-size="32">Head coach of the San Francisco 49ers from 1979.</text>
<g id="wal"><g id="wfig"></g>
<rect class="s-ink" x="320" y="470" width="80" height="100" rx="8" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M336 500h48M336 524h48M336 548h30" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="140" y="660" font-size="44">Bill Walsh</text><text class="m" x="140" y="700" font-size="20">HEAD COACH · 1979</text></g>
<path class="s-line" d="M680 260V720H1460" fill="none" stroke-width="4"/>
<text class="m" x="662" y="286" font-size="20" text-anchor="end">TOP</text><text class="m" x="662" y="706" font-size="20" text-anchor="end">BOTTOM</text>
<g id="lose"><circle class="loss" cx="720" cy="660" r="16"/><text class="m" x="748" y="702" font-size="20" style="fill:var(--loss)">ONE OF THE WORST</text><text class="m" x="720" y="756" font-size="20" text-anchor="middle">1979</text></g>
<path id="climb" class="s-gain" d="M720 660L1380 390" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-width="8" stroke-linecap="round"/>
<g id="sb"><path class="gain" d="M1350 290h60v26a30 30 0 0 1-60 0z"/><rect class="gain" x="1374" y="344" width="12" height="26"/><rect class="gain" x="1360" y="370" width="40" height="10"/>
<text class="d" x="1380" y="252" font-size="36" text-anchor="middle">Super Bowl</text><text class="m" x="1460" y="756" font-size="20" text-anchor="end">WITHIN 3 SEASONS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">No grand master plan.</text>
<text class="b" x="120" y="176" font-size="32">It’s tempting to imagine one. Walsh didn’t work that way.</text>
<g id="cloud"><ellipse class="s-ink" cx="410" cy="360" rx="240" ry="120" fill="var(--stage)" stroke-width="6"/>
<text class="d5" x="410" y="350" font-size="44" text-anchor="middle">Master plan</text>
<path class="s-gain" d="M310 395h200m-18-14 18 14-18 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="410" y="444" font-size="20" text-anchor="middle">CHAMPIONSHIP</text>
<circle class="ink" cx="410" cy="515" r="16"/><circle class="ink" cx="420" cy="556" r="10"/></g>
<g id="think"></g>
<path id="x1" class="s-loss" d="M190 250L630 470" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-width="10" stroke-linecap="round"/>
<path id="x2" class="s-loss" d="M630 250L190 470" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-width="10" stroke-linecap="round"/>
<g id="rb"><rect class="ink" x="860" y="250" width="44" height="470" rx="8"/><rect class="gain" x="896" y="250" width="400" height="470" rx="8"/>
<text class="d" x="1096" y="420" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">STANDARD</text>
<text class="d" x="1096" y="470" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">OF</text>
<text class="d" x="1096" y="520" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">PERFORMANCE</text>
<path d="M976 570h240" stroke="var(--on-gain)" stroke-width="4"/>
<text class="m" x="1078" y="770" font-size="20" text-anchor="middle">WHAT HE FOCUSED ON</text></g>
<g id="nts"><text class="d" x="120" y="830" font-size="44">Not the trophy. The standard.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">High standards for small things.</text>
<text class="b" x="120" y="176" font-size="32">Walsh believed details shape how the whole team thinks.</text>
<g id="k0"><rect class="s-line" x="120" y="230" width="414" height="390" rx="18" fill="var(--stage)" stroke-width="3"/><g id="lock"></g>
<text class="d5" x="327" y="560" font-size="34" text-anchor="middle">Locker room</text><text class="m" x="327" y="598" font-size="20" text-anchor="middle">TIDY, DRESSED RIGHT</text></g>
<g id="k1"><rect class="s-line" x="593" y="230" width="414" height="390" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="785" y="276" width="30" height="24" rx="4"/><circle class="s-ink" cx="800" cy="400" r="95" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g>
<path id="hand" class="s-gain" d="M800 400V325" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="800" cy="400" r="9"/>
<text class="d5" x="800" y="560" font-size="34" text-anchor="middle">Practice</text><text class="m" x="800" y="598" font-size="20" text-anchor="middle">PLANNED TO THE DETAIL</text></g>
<g id="k2"><rect class="s-line" x="1066" y="230" width="414" height="390" rx="18" fill="var(--stage)" stroke-width="3"/><g id="stf"></g>
<rect class="ink" x="1163" y="463" width="220" height="16" rx="4"/><rect class="gain" x="1332" y="445" width="40" height="18"/>
<text class="d5" x="1273" y="560" font-size="34" text-anchor="middle">Staff</text><text class="m" x="1273" y="598" font-size="20" text-anchor="middle">EVERY JOB DONE WITH CARE</text></g>
<path id="con" class="s-gain" d="M327 620L620 690M800 620V690M1273 620L980 690" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="exc"><rect class="gain" x="480" y="690" width="640" height="96" rx="48"/><text class="d" x="800" y="752" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">A culture of excellence</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The score takes care of itself.</text>
<text class="b" x="120" y="176" font-size="32">Bill Walsh’s belief, quoted in the book.</text>
<g id="board6"><rect class="ink" x="980" y="540" width="20" height="70"/><rect class="ink" x="1360" y="540" width="20" height="70"/>
<rect class="ink" x="900" y="250" width="560" height="300" rx="16"/>
<text class="m" x="1180" y="340" font-size="28" text-anchor="middle" style="fill:var(--stage)">WINS</text><g id="pips"></g></g>
<g id="res"><path class="s-gain" d="M650 400h220m-20-16 20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="760" y="376" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE RESULT</text><text class="m" x="760" y="440" font-size="20" text-anchor="middle">NOT THE GOAL</text></g>
<g id="chk"><rect class="s-ink" x="140" y="240" width="460" height="500" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="180" y="292" font-size="20">EACH DAY, DONE WELL</text><g id="rows"></g></g>
<g id="eyes"><text class="d" x="120" y="820" font-size="44" style="fill:var(--ink)">Eyes on doing each day well.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">Write your habits, not your legend.</text>
<text class="b" x="120" y="176" font-size="32">Success is a reason to keep the standard, not drop it.</text>
<g id="mir"><ellipse class="s-ink" cx="300" cy="420" rx="130" ry="175" fill="var(--stage)" stroke-width="8"/><g id="mirp"></g>
<path class="gain" d="M270 362l6-30 18 14 6-20 6 20 18-14 6 30z"/>
<path class="s-ink" d="M300 595v50M240 650h120" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="300" y="710" font-size="32" text-anchor="middle">Not your legend</text></g>
<path id="mx" class="s-loss" d="M190 290L410 550" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-width="10" stroke-linecap="round"/>
<g id="nb"><rect class="s-ink" x="660" y="260" width="280" height="360" rx="12" fill="var(--stage)" stroke-width="6"/><g id="spir"></g><g id="nlines"></g>
<text class="d5" x="800" y="710" font-size="32" text-anchor="middle">Write the habits</text></g>
<g id="cal"><rect class="s-ink" x="1120" y="260" width="360" height="360" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1120" y="260" width="360" height="50" rx="12"/><g id="cells"></g>
<text class="d5" x="1300" y="710" font-size="32" text-anchor="middle">Keep doing them</text></g>
<g id="esp"><text class="m" x="120" y="800" font-size="22" style="fill:var(--gain)">ESPECIALLY WHEN IT FEELS LIKE YOU NO LONGER NEED TO</text></g>
</g>

<g id="s8" opacity="0">
<g id="ql"><text class="m" x="143" y="230" font-size="26">THINK OF YOUR LATEST WIN</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="80" letter-spacing="-2">What small standard</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="80" letter-spacing="-2">got you there, and are</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="80" letter-spacing="-2">you still keeping it</text></g>
<g id="qd"><text class="d" x="136" y="640" font-size="80" letter-spacing="-2" style="fill:var(--gain)">tomorrow?</text></g>
<g id="qm"><circle class="gain" cx="1360" cy="470" r="100"/><text class="d" x="1360" y="520" font-size="140" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<text class="m" x="143" y="740" font-size="26">KEEP THE STANDARD</text>
</g>