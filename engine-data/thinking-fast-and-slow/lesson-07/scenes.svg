<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Catching your mind</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">in the act.</text>
<text class="b" x="120" y="600" font-size="32">You can’t fix your intuition, but you can learn when to doubt it.</text>
<circle class="s-ink" cx="1270" cy="360" r="110" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M1190 565v-5a80 80 0 0 1 160 0v5z"/>
<path id="bolt" class="s-loss" d="M1290 290l-50 70h50l-40 70" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g id="alarm"><circle id="ring" cx="1420" cy="250" r="38" fill="none" stroke="var(--gain)" stroke-width="4"/><g id="bell"><circle class="gain" cx="1420" cy="250" r="38"/><text class="d" x="1420" y="268" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">!</text></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two lines. Which is longer?</text>
<text class="b" x="120" y="176" font-size="32">Picture two horizontal lines with arrow tips on their ends.</text>
<g id="la"><path class="s-ink" d="M420 340H1020" stroke-width="8" stroke-linecap="round"/></g>
<g id="lb"><path class="s-ink" d="M420 560H1020" stroke-width="8" stroke-linecap="round"/></g>
<g id="fa"></g><g id="fb"></g>
<g id="lookA"><text class="m" x="1120" y="350" font-size="22">LOOKS LONGER</text></g>
<g id="lookB"><text class="m" x="1120" y="570" font-size="22">LOOKS SHORTER</text></g>
<g id="guides"><path class="s-gain" d="M420 270V690M1020 270V690" stroke-width="4" stroke-dasharray="8 10"/></g>
<g id="rul"><g id="rulIn"><rect class="s-ink" x="420" y="690" width="600" height="56" rx="6" fill="var(--stage)" stroke-width="5"/><g id="rticks"></g></g></g>
<g id="eq"><text class="d" x="1090" y="734" font-size="44" style="fill:var(--gain)">Exactly equal.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Knowing is not seeing.</text>
<text class="b" x="120" y="176" font-size="32">Even after measuring, you still see one line as longer.</text>
<rect class="s-line" x="120" y="230" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">SYSTEM 1 · STILL SEES IT</text>
<g id="mini"></g>
<g id="eye"><g id="lid"><path class="s-ink" d="M320 390Q440 310 560 390Q440 470 320 390Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><circle class="ink" cx="440" cy="390" r="34"/><circle cx="452" cy="378" r="9" fill="var(--stage)"/></g></g>
<rect class="s-line" x="840" y="230" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">SYSTEM 2 · KNOWS BETTER</text>
<g id="note"><g transform="rotate(-3 1160 460)"><rect class="gain" x="930" y="340" width="460" height="240" rx="8"/><circle class="loss" cx="1160" cy="356" r="12"/><text class="d" x="960" y="450" font-size="52" style="fill:var(--on-gain)">Don’t believe</text><text class="d" x="960" y="520" font-size="52" style="fill:var(--on-gain)">this one.</text></g></g>
<g id="know"><text class="d" x="120" y="830" font-size="40">Knowing doesn’t switch the illusion off.</text></g>
</g>

<g id="s3" opacity="0">
<g id="auth"></g>
<path class="s-ink" d="M560 700H1460" stroke-width="5" stroke-linecap="round"/>
<g id="grp1">
<rect id="b0" x="650" y="700" width="100" height="0" fill="var(--line)"/><rect id="b1" x="780" y="700" width="100" height="0" fill="var(--muted)"/>
<text class="d" x="765" y="470" font-size="48" text-anchor="middle" style="fill:var(--muted)">=</text>
<text class="m" x="700" y="730" font-size="18" text-anchor="middle">BEFORE</text><text class="m" x="830" y="730" font-size="18" text-anchor="middle">AFTER</text>
<text class="m" x="765" y="775" font-size="22" text-anchor="middle">INTUITIONS</text>
</g>
<g id="grp2">
<rect id="b2" x="1090" y="500" width="100" height="200" fill="var(--line)"/><rect id="b3" class="gain" x="1220" y="500" width="100" height="200"/>
<text class="m" x="1140" y="730" font-size="18" text-anchor="middle">BEFORE</text><text class="m" x="1270" y="730" font-size="18" text-anchor="middle">AFTER</text>
<text class="m" x="1205" y="775" font-size="22" text-anchor="middle">SPOTTING RISKY MOMENTS</text>
</g>
<g id="warn"><polygon class="s-ink" points="1270,215 1310,285 1230,285" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1270" y="278" font-size="40" text-anchor="middle">!</text></g>
<text class="d" x="120" y="124" font-size="68">Kahneman is honest.</text>
<text class="b" x="120" y="176" font-size="32">After decades of study, his intuitions are not much better.</text>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spot the minefield.</text>
<text class="b" x="120" y="176" font-size="32">Then slow down and call on System 2 for backup.</text>
<rect class="s-line" x="120" y="240" width="1360" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="285" font-size="22">A COGNITIVE MINEFIELD</text>
<path class="s-line" d="M160 680H1440" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
<g id="mines"></g><g id="bigm"></g>
<g id="walker"><g id="wIn"></g></g>
<g id="sign"><rect class="ink" x="676" y="520" width="8" height="160"/><polygon class="gain" points="730,449 730,491 701,520 659,520 630,491 630,449 659,420 701,420"/><text class="d" x="680" y="480" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">SLOW</text></g>
<g id="pause"><text class="d" x="120" y="810" font-size="44">Those are moments to pause.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Easier to see in others.</text>
<text class="b" x="120" y="176" font-size="32">An observer is less busy, and more open, than the decider.</text>
<g id="dec"><g id="busy"></g></g>
<g id="obs"><circle id="halo" cx="1160" cy="470" r="66" fill="none" stroke="var(--gain)" stroke-width="4" stroke-dasharray="8 8"/></g>
<g id="sight"><path class="s-gain" d="M1110 450L670 310" stroke-width="4" stroke-dasharray="10 10" fill="none"/></g>
<g id="mark"><circle class="gain" cx="640" cy="300" r="26"/><text class="d" x="640" y="314" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">!</text></g>
<g id="lab1"><text class="m" x="440" y="720" font-size="22" text-anchor="middle">THE DECIDER</text><text class="m" x="440" y="752" font-size="22" text-anchor="middle" style="fill:var(--loss)">MENTALLY BUSY</text></g>
<g id="lab2"><text class="m" x="1160" y="720" font-size="22" text-anchor="middle">THE OBSERVER</text><text class="m" x="1160" y="752" font-size="22" text-anchor="middle" style="fill:var(--gain)">LESS BUSY · OPEN</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Organizations think slower.</text>
<text class="b" x="120" y="176" font-size="32">They can add orderly procedures before a decision is final.</text>
<g id="bld"><rect class="s-ink" x="160" y="300" width="340" height="420" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><g id="wins"></g><rect class="ink" x="300" y="660" width="60" height="60"/></g>
<g id="slowl"><text class="m" x="330" y="770" font-size="20" text-anchor="middle">THINKS MORE SLOWLY</text></g>
<g id="chk"><path class="s-muted" d="M530 510h80m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="650" y="260" width="400" height="500" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="680" y="310" font-size="22">CHECKLIST</text><g id="rows"></g></g>
<g id="ar2"><path class="s-muted" d="M1080 510h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="dbox" x="1180" y="440" width="280" height="140" rx="16" stroke="var(--gain)" stroke-width="5"/><text id="dtx" class="d" x="1320" y="526" font-size="44" text-anchor="middle">DECIDE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Give the error a name.</text>
<text class="b" x="120" y="176" font-size="32">Richer words for everyday gossip about judgment.</text>
<g id="tag"><path class="s-ink" d="M240 606L290 470" stroke-width="3" fill="none"/><circle class="loss" cx="240" cy="640" r="34"/><text class="d" x="240" y="654" font-size="38" text-anchor="middle" style="fill:var(--stage)">?</text>
<path class="s-ink" d="M180 400H430V470H180L150 435Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><circle class="s-ink" cx="178" cy="435" r="7" fill="none" stroke-width="3"/><text class="d5" x="200" y="446" font-size="30">ANCHORING</text></g>
<g id="cool"><path class="s-line" d="M480 660H1140" stroke-width="5" stroke-linecap="round"/><g id="p1"></g><g id="p2"></g></g>
<g id="chat"><rect class="s-ink" x="530" y="330" width="140" height="60" rx="18" fill="var(--stage)" stroke-width="4"/><text class="d" x="600" y="368" font-size="34" text-anchor="middle">...</text></g>
<g id="say"><rect x="900" y="210" width="560" height="150" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path d="M1000 358L1010 405L1040 358" fill="var(--stage)" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="930" y="272" font-size="34">“Wait, that first number</text><text class="d5" x="930" y="322" font-size="34">is <tspan style="fill:var(--gain)">anchoring</tspan> us.”</text></g>
<g id="namet"><text class="d" x="120" y="800" font-size="40">Name it, and you notice it next time.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Am I in a minefield</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">right now, and should</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">I <tspan style="fill:var(--gain)">slow down</tspan>?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">BEFORE YOUR NEXT BIG DECISION, ASK</text></g>
<g id="qsign"><g id="qsIn"><rect class="ink" x="1334" y="530" width="12" height="190"/><polygon class="gain" points="1423,416 1423,484 1374,533 1306,533 1257,484 1257,416 1306,367 1374,367"/><text class="d" x="1340" y="466" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">SLOW</text></g>
<circle class="loss" cx="1240" cy="700" r="14"/><circle class="loss" cx="1440" cy="690" r="14"/></g>
</g>