<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You only get</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">four thousand weeks.</text>
<text class="b" x="120" y="600" font-size="32">Why facing your limited time is the first step to using it well</text>
<g id="hg">
<rect class="ink" x="1220" y="256" width="240" height="20" rx="6"/>
<rect class="ink" x="1220" y="624" width="240" height="20" rx="6"/>
<path class="s-ink" d="M1250 276H1430L1352 450L1430 624H1250L1328 450Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<polygon id="sandT" class="gain"/>
<polygon id="sandB" class="gain"/>
<line id="stream" class="s-gain" x1="1340" y1="450" x2="1340" y2="616" stroke-width="4"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Do the math.</text>
<text class="b" x="120" y="176" font-size="32">Every week of an 80-year life, on one sheet of paper.</text>
<g id="cal">
<rect class="s-ink" x="120" y="250" width="150" height="140" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M120 290h150" stroke-width="6"/>
<path class="s-ink" d="M160 236v28M230 236v28" stroke-width="8" stroke-linecap="round"/>
<text class="d" x="195" y="366" font-size="56" text-anchor="middle">52</text>
</g>
<g id="e1"><text class="d" x="320" y="300" font-size="60">80 years</text></g>
<g id="e2"><text class="d" x="320" y="380" font-size="60">× 52 weeks</text><path class="s-ink" d="M320 410H800" stroke-width="5"/></g>
<g id="e3"><text class="m" x="320" y="460" font-size="22">COMES TO JUST OVER</text><text class="d" x="316" y="540" font-size="76" style="fill:var(--gain)">4,000 weeks</text></g>
<g id="gridlab">
<text class="m" x="1040" y="234" font-size="22">ONE BOX = ONE WEEK</text>
<text class="m" x="1022" y="262" font-size="22" text-anchor="end">AGE 0</text>
<text class="m" x="1022" y="538" font-size="22" text-anchor="end">40</text>
<text class="m" x="1022" y="812" font-size="22" text-anchor="end">80</text>
</g>
<g id="rows"></g>
<g id="pen"><g id="penm"><path class="gain" d="M0 0l8-26 62-62 18 18-62 62z"/><path class="ink" d="M0 0l8-26 18 18z"/></g></g>
<g id="half">
<text class="m" x="120" y="680" font-size="22">AT FORTY, ABOUT HALF</text>
<text class="m" x="120" y="712" font-size="22">ARE ALREADY SHADED IN</text>
<rect class="ink" x="120" y="760" width="28" height="28" rx="4"/><text class="m" x="160" y="782" font-size="20">WEEKS LIVED</text>
<rect x="400" y="760" width="28" height="28" rx="4" fill="var(--line)"/><text class="m" x="440" y="782" font-size="20">WEEKS AHEAD</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shockingly small.</text>
<text class="b" x="120" y="176" font-size="32">Oliver Burkeman: the number is startlingly small.</text>
<g id="auth">
<rect class="s-ink" x="300" y="250" width="300" height="80" rx="16" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M318 330l-34 30 60-30" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="450" y="303" font-size="38" text-anchor="middle">Only 4,000?</text>
</g>
<g id="sheet">
<text class="m" x="160" y="490" font-size="20">4,000 WEEKS</text>
<rect class="s-ink" x="160" y="505" width="220" height="300" fill="var(--stage)" stroke-width="5"/>
<g id="sheetg"></g>
</g>
<g id="same"><text class="m" x="160" y="840" font-size="20" style="fill:var(--gain)">STAYS THE SAME SIZE</text></g>
<g id="wl">
<path id="paper" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="730" y="280" font-size="22">EVERYTHING I HOPE TO DO</text>
<g id="items"></g>
</g>
<g id="more">
<text class="m" x="1220" y="600" font-size="22">KEEPS GOING</text>
<path class="s-loss" d="M1290 630v190m-30-30 30 30 30-30" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">We look away.</text>
<text class="b" x="120" y="176" font-size="32">We know life ends, but rarely let the number sink in.</text>
<g id="cardo"><g id="card">
<rect class="s-ink" x="120" y="260" width="260" height="180" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="250" y="360" font-size="72" text-anchor="middle">4,000</text>
<text class="m" x="250" y="410" font-size="20" text-anchor="middle">WEEKS</text>
</g></g>
<g id="shr">
<path class="s-ink" d="M552 444L490 420L470 370M648 444L710 420L730 370" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="680" y="320" font-size="64" style="fill:var(--muted)">?</text>
</g>
<g id="sign">
<path class="s-ink" d="M880 640H1480" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="1090" y="290" width="20" height="350"/>
<path class="s-loss" d="M960 300H1300L1340 340L1300 380H960Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="1130" y="356" font-size="44" text-anchor="middle">SOMEDAY</text>
<path class="s-loss" d="M960 400H1260L1300 435L1260 470H960Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1110" y="443" font-size="22" text-anchor="middle">MORE TIME LATER</text>
</g>
<g id="den0"><text class="m" x="120" y="720" font-size="22">THIS QUIET DENIAL SHAPES</text></g>
<g id="den1"><rect class="s-loss" x="120" y="745" width="380" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="d5" x="310" y="794" font-size="32" text-anchor="middle">How we plan</text></g>
<g id="den2"><rect class="s-loss" x="540" y="745" width="480" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="d5" x="780" y="794" font-size="32" text-anchor="middle">How anxious we feel</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">An old warning.</text>
<text class="b" x="120" y="176" font-size="32">Seneca, Roman philosopher, nearly two thousand years ago.</text>
<g id="scr">
<rect class="s-ink" x="150" y="260" width="440" height="340" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="120" y="236" width="500" height="36" rx="18"/>
<rect class="ink" x="120" y="588" width="500" height="36" rx="18"/>
<text class="m" x="190" y="330" font-size="22">SENECA</text>
<text class="d5" x="190" y="400" font-size="36">People waste</text>
<text class="d5" x="190" y="450" font-size="36">much of the life</text>
<text class="d5" x="190" y="500" font-size="36">they are given.</text>
</g>
<g id="mag"><g id="magm">
<text class="m" x="700" y="320" font-size="22">BURKEMAN GOES FURTHER</text>
<circle class="s-ink" cx="1300" cy="330" r="62" fill="var(--stage)" stroke-width="12"/>
<path class="s-ink" d="M1344 374l56 56" stroke-width="20" stroke-linecap="round"/>
</g></g>
<g id="b1"><text class="m" x="700" y="500" font-size="20">4,000 WEEKS, EVERY ONE USED PERFECTLY</text><rect class="gain" x="700" y="520" width="280" height="64" rx="8"/></g>
<g id="b2"><text class="m" x="700" y="640" font-size="20">EVERYTHING YOU WANT</text><rect id="b2r" class="loss" x="700" y="660" width="0" height="64" rx="8"/></g>
<g id="never"><text class="d" x="120" y="810" font-size="48">Four thousand would never cover it all.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">You are time.</text>
<text class="b" x="120" y="176" font-size="32">An idea from the philosopher Martin Heidegger.</text>
<g id="phil"><text class="m" x="220" y="470" font-size="20" text-anchor="middle">HEIDEGGER</text></g>
<g id="wal">
<circle class="gain" cx="600" cy="292" r="44"/>
<path d="M600 292v-28M600 292h20" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/>
<rect class="s-ink" x="420" y="300" width="280" height="160" rx="22" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M420 350h280" stroke-width="5"/>
<circle class="ink" cx="660" cy="350" r="10"/>
<text class="m" x="420" y="500" font-size="20">WE DON’T HAVE TIME</text>
<text class="m" x="420" y="530" font-size="20">LIKE MONEY IN A WALLET</text>
</g>
<g id="nox"><path class="s-loss" d="M430 262l260 210M690 262l-260 210" stroke-width="10" stroke-linecap="round"/></g>
<g id="made">
<path class="s-muted" d="M770 380h120m-26-26 26 26-26 26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="sq"></g>
<text class="m" x="1200" y="800" font-size="22" text-anchor="middle">A LIFE MADE OF WEEKS</text>
</g>
<g id="who"><text class="d" x="120" y="760" font-size="44">How you spend it is who you become.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The relief.</text>
<text class="b" x="120" y="176" font-size="32">Admit you can’t do it all, and each week becomes a choice.</text>
<g id="bp">
<path class="s-ink" d="M140 720H540" stroke-width="6" stroke-linecap="round"/>
<g id="car"></g>
<g id="bag"><rect class="loss" x="330" y="370" width="100" height="120" rx="18"/><text class="m" x="380" y="438" font-size="20" text-anchor="middle" style="fill:var(--stage)">ALL</text></g>
</g>
<g id="sp">
<path class="s-ink" d="M600 720H1200" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="890" y="300" width="20" height="420"/>
<path class="s-gain" d="M900 320H1160L1196 355L1160 390H900Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1040" y="364" font-size="24" text-anchor="middle">THIS</text>
<path class="s-ink" d="M900 430H660L624 465L660 500H900Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="770" y="474" font-size="24" text-anchor="middle">OR THAT</text>
</g>
<g id="spot">
<polygon id="cone" class="gain" points="1360,280 1400,280 1460,720 1260,720" fill-opacity=".22"/>
<path class="ink" d="M1340 240h80l-20 40h-40z"/>
<rect class="gain" x="1300" y="640" width="80" height="80" rx="8"/>
<text class="m" x="1340" y="760" font-size="20" text-anchor="middle">A CHOICE, EYES OPEN</text>
</g>
<g id="mean"><text class="d" x="120" y="830" font-size="40">More meaning than a choice made in denial.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not gloom. A starting point.</text>
<text class="b" x="120" y="176" font-size="32">Facing your limit honestly.</text>
<defs><clipPath id="sky"><rect x="120" y="190" width="1360" height="410"/></clipPath></defs>
<g clip-path="url(#sky)"><g id="sun"><circle class="gain" cx="800" cy="0" r="120"/><g id="rays"></g></g></g>
<path class="s-ink" d="M120 600H1480" stroke-width="6" stroke-linecap="round"/>
<g id="wk"></g>
<g id="st"><text class="m" x="140" y="770" font-size="22" style="fill:var(--gain)">START HERE</text></g>
<g id="purp"><text class="d" x="120" y="840" font-size="44">Spend your weeks on purpose.</text></g>
</g>

<g id="s8" opacity="0">
<g id="mini"><circle id="ring" class="s-gain" cx="1350" cy="286" r="12" fill="none" stroke-width="4"/><rect id="hot" x="1344" y="280" width="12" height="12" stroke="var(--gain)" stroke-width="3"/></g>
<g id="ptw"><text class="m" x="143" y="330" font-size="26">PICTURE THIS WEEK</text></g>
<g id="qa"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">One small box</text></g>
<g id="qb"><text class="d" x="136" y="570" font-size="88" letter-spacing="-2">out of four thousand.</text></g>
<g id="qc"><text class="d" x="136" y="720" font-size="88" letter-spacing="-2" style="fill:var(--gain)">What deserves to fill it?</text></g>
<g id="lab"><text class="m" x="143" y="810" font-size="26">ONE WEEK · ONE CHOICE</text></g>
</g>