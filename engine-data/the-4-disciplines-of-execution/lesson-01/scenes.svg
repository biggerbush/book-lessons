<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why great strategies</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">quietly die.</text>
<text class="b" x="120" y="600" font-size="32">Why big goals fade away while everyone stays busy.</text>
<path class="s-line" d="M1180 640h300" stroke-width="5"/>
<g id="tflag"><path class="s-ink" d="M1330 640V330" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M1338 334h110l-30 40 30 40h-110z"/></g>
<g id="tsw"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One exciting new goal.</text>
<text class="b" x="120" y="176" font-size="32">A leader, a kickoff, and real enthusiasm in the room.</text>
<g id="ldr"></g>
<g id="scr"><rect class="s-ink" x="420" y="250" width="600" height="330" rx="12" fill="var(--stage)" stroke-width="6"/>
<g id="scrin"><text class="m" x="450" y="300" font-size="22">NEW GOAL</text>
<path class="s-gain" d="M470 530L620 470L760 430L960 310M920 314l40-4-14 38" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="aud"></g>
<g id="spk"></g>
<g id="cal"><rect class="s-ink" x="1120" y="250" width="340" height="360" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1120" y="250" width="340" height="80" rx="14"/>
<text class="m" x="1290" y="302" font-size="28" text-anchor="middle" style="fill:var(--stage)">MONDAY</text>
<g id="cgrid"></g>
<text class="m" x="1120" y="660" font-size="22">BACK TO WORK</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then, silence.</text>
<text class="b" x="120" y="176" font-size="32">Everyone stays busy. The goal goes nowhere.</text>
<g id="env"></g>
<path class="s-ink" d="M140 720h420" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="120" y="780" font-size="22">EMAILS · CALLS · URGENT FIXES</text>
<g id="wk"></g>
<g id="flat"><path class="s-line" d="M715 620V700h750" fill="none" stroke-width="4"/><path class="s-loss" d="M725 680h730" stroke-width="6" stroke-linecap="round"/><text class="m" x="715" y="740" font-size="20">GOAL PROGRESS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the whirlwind.</text>
<text class="b" x="120" y="176" font-size="32">All the urgent work needed just to keep the day running.</text>
<g id="funnel"></g>
<g id="wwl"><text class="m" x="520" y="790" font-size="24" text-anchor="middle" style="fill:var(--loss)">THE WHIRLWIND</text></g>
<g id="gearw"><g id="gears"></g><text class="m" x="995" y="720" font-size="22" text-anchor="middle">URGENT DAILY WORK</text></g>
<g id="tok0"><g id="tm0"><rect class="gain" x="1200" y="280" width="240" height="70" rx="35"/><text class="d5" x="1320" y="327" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Time</text></g></g>
<g id="tok1"><g id="tm1"><rect class="gain" x="1200" y="380" width="240" height="70" rx="35"/><text class="d5" x="1320" y="427" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Energy</text></g></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Urgent beats important.</text>
<text class="b" x="120" y="176" font-size="32">Urgency acts on you. Importance waits for you to act.</text>
<g id="bellg"><g id="bellr"><circle class="loss" cx="400" cy="342" r="14"/><path class="loss" d="M340 520Q336 362 400 356Q464 362 460 520L486 548H314Z"/><circle class="loss" cx="400" cy="566" r="16"/></g>
<g id="bwv"><path class="s-loss" d="M290 380q-40 70 0 140M250 350q-60 100 0 200M510 380q40 70 0 140M550 350q60 100 0 200" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<text class="m" x="400" y="680" font-size="24" text-anchor="middle" style="fill:var(--loss)">URGENT</text>
<text class="m" x="400" y="720" font-size="20" text-anchor="middle">DEMANDS ACTION NOW</text></g>
<g id="vs"><text class="d" x="750" y="480" font-size="60" text-anchor="middle" style="fill:var(--muted)">vs</text></g>
<g id="seedg"><g id="seedi"><path class="s-gain" d="M1100 560V470" stroke-width="8" stroke-linecap="round" fill="none"/><path class="gain" d="M1100 500c-10-40-50-50-70-40 10 30 40 45 70 40zM1100 480c10-40 50-50 70-40-10 30-40 45-70 40z"/><path class="ink" d="M1046 560h108l-14 80h-80z"/></g>
<text class="m" x="1100" y="680" font-size="24" text-anchor="middle" style="fill:var(--gain)">IMPORTANT</text>
<text class="m" x="1100" y="720" font-size="20" text-anchor="middle">CAN WAIT UNTIL TOMORROW</text></g>
<g id="win"><text class="d" x="120" y="820" font-size="44">Head to head, the whirlwind almost always wins.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The whirlwind is not the enemy.</text>
<text class="b" x="120" y="176" font-size="32">It keeps customers served and the lights on.</text>
<g id="shop"><rect class="s-ink" x="160" y="320" width="420" height="360" fill="var(--stage)" stroke-width="6"/>
<path class="ink" d="M140 260h460l-20 60H160z"/>
<rect class="s-ink" x="200" y="500" width="110" height="180" fill="none" stroke-width="6"/>
<rect class="s-ink" x="370" y="480" width="170" height="110" fill="none" stroke-width="6"/>
<path class="s-ink" d="M455 320v50" stroke-width="4"/><circle id="bulb" class="gain" cx="455" cy="392" r="22"/>
