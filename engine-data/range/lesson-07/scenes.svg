</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The heavy load.</text>
<text class="b" x="120" y="176" font-size="32">Wildland firefighters fleeing fires they could have outrun.</text>
<path class="s-line" d="M120 700H1480" stroke-width="6"/>
