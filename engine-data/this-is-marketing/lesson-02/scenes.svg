<circle id="tring" cx="1315" cy="475" r="70" fill="none" class="s-gain" stroke-width="6" opacity="0"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shout at everyone.</text>
<text class="b" x="120" y="176" font-size="32">The old way: big ads, average products, the masses.</text>
