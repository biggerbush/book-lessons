<g id="s0">
<text class="m" x="120" y="150" font-size="28">DEEP WORK · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">A deep life</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is a good life.</text>
<text class="b" x="120" y="600" font-size="32">Why focusing deeply can make your whole life feel richer.</text>
