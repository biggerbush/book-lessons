<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 6</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Democracy and</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">dictatorship</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">as networks.</text>
<text class="b" x="120" y="620" font-size="32">Why who hears the bad news decides a nation’s fate.</text>
<g id="cty"><rect class="s-line" x="1000" y="290" width="220" height="260" rx="30" fill="var(--stage)" stroke-width="4"/><rect class="s-line" x="1260" y="290" width="220" height="260" rx="30" fill="var(--stage)" stroke-width="4"/></g>
<g id="flw"><g id="lA"></g><g id="lB"></g><text class="m" x="1110" y="600" font-size="22" text-anchor="middle">HUB</text><text class="m" x="1370" y="600" font-size="22" text-anchor="middle">WEB</text></g>
<g id="dots"></g>
<circle id="pA" class="gain" r="7"/><circle id="pB" class="gain" r="7"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two shapes of network.</text>
<text class="b" x="120" y="176" font-size="32">Harari: regimes are best understood as information networks.</text>
<g id="pan"><rect class="s-line" x="120" y="220" width="660" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-line" x="820" y="220" width="660" height="560" rx="18" fill="var(--stage)" stroke-width="3"/></g>
<g id="hubG"><g id="hubE"></g><g id="hubN"></g><circle class="loss" cx="450" cy="480" r="32"/><g id="hubP"></g><text class="m" x="450" y="750" font-size="22" text-anchor="middle">DICTATORSHIP · HUB</text></g>
<g id="webG"><g id="webE"></g><g id="webN"></g><g id="webP"></g><text class="m" x="1150" y="750" font-size="22" text-anchor="middle">DEMOCRACY · WEB</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hub: one center.</text>
<text class="b" x="120" y="176" font-size="32">In a dictatorship, every message flows to the ruler.</text>
<g id="pal"><g id="hl"></g><g id="hp"></g><path class="loss" d="M772 262l6-28 12 12 10-18 10 18 12-12 6 28z"/><g id="rul"></g>
<text class="m" x="120" y="300" font-size="22">REPORTS TRAVEL UP</text><text class="m" x="120" y="332" font-size="22" style="fill:var(--loss)">ORDERS TRAVEL DOWN</text><g id="hd"></g></g>
<g id="gt"><rect class="loss" x="730" y="426" width="140" height="16" rx="8"/><text class="m" x="1000" y="300" font-size="22">THE CENTER DECIDES WHAT IS TRUE</text><text class="m" x="1000" y="332" font-size="22">AND WHO GETS TO HEAR IT</text></g>
<g id="risk"><text class="d" x="120" y="800" font-size="46">Fast, but it assumes the center is never wrong.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The web: many centers.</text>
<text class="b" x="120" y="176" font-size="32">Much information never passes through the government at all.</text>
<g id="we3"></g><g id="wp3"></g><g id="wn3"></g>
<g id="byp"><text class="m" x="800" y="530" font-size="20" text-anchor="middle">MUCH INFO BYPASSES IT</text></g>
<g id="noisy"><text class="d" x="120" y="810" font-size="40">Slower and noisier, but no single point controls it all.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The applause.</text>
<text class="b" x="120" y="176" font-size="32">A Soviet party meeting under Stalin.</text>
<g id="ban"><rect class="s-ink" x="600" y="214" width="400" height="76" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d" x="800" y="266" font-size="40" text-anchor="middle">Stalin</text></g>
<g id="hallP"></g>
<g id="cage"></g>
<g id="dare"><text class="m" x="120" y="800" font-size="22">NOBODY DARED TO STOP FIRST</text></g>
<g id="arr"><text class="m" x="120" y="842" font-size="22" style="fill:var(--loss)">THAT NIGHT, THE DIRECTOR WAS ARRESTED</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Silence at the top.</text>
<text class="b" x="120" y="176" font-size="32">It is about what people learn to hide.</text>
<g id="lk5"></g><g id="pp5"></g><g id="ru5"></g>
<path class="loss" d="M752 270l6-26 12 12 10-18 10 18 12-12 6 26z"/>
<circle id="ring5" class="s-loss" cx="780" cy="350" r="100" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="msg5" class="loss" r="9"/>
<g id="lone"><text class="m" x="120" y="770" font-size="22">BAD NEWS STOPS TRAVELLING TO THE CENTER</text></g>
<g id="ch5"><text class="m" x="960" y="280" font-size="20">COLLECTIVIZATION</text>
<path class="s-muted" d="M960 300V700H1460" fill="none" stroke-width="4"/>
<path class="s-gain" d="M980 380H1440" stroke-width="6" stroke-dasharray="14 10"/>
<text class="m" x="980" y="360" font-size="18" style="fill:var(--gain)">WHAT THE CENTER HEARD</text>
<path id="real5" class="s-loss" d="M980 392C1150 400 1250 520 1440 670" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<text class="m" x="1440" y="740" font-size="18" text-anchor="end" style="fill:var(--loss)">WHAT WAS HAPPENING</text></g>
<g id="mil"><text class="d" x="120" y="840" font-size="40">The errors grew into a famine that killed millions.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">More than voting.</text>
<text class="b" x="120" y="176" font-size="32">Democracy is not simply majority rule.</text>
<g id="bal">
<text class="m" x="280" y="252" font-size="20" text-anchor="middle">MOST VOTES WIN</text>
<g id="tal6"></g>
<g id="bp"><rect class="s-ink" x="250" y="330" width="60" height="80" rx="4" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M264 372l10 10 22-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect class="s-ink" x="180" y="470" width="200" height="150" rx="10" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="240" y="464" width="80" height="12" rx="6"/>
<text class="m" x="280" y="664" font-size="22" text-anchor="middle">MAJORITY RULE</text></g>
<g id="net6"><g id="we6"></g><g id="cut6"></g><g id="sp6"></g><g id="nd6"></g>
<text id="lc6" class="m" x="820" y="467" font-size="20" text-anchor="end">COURTS</text><text id="lp6" class="m" x="1340" y="467" font-size="20">PRESS</text>
<g id="lead6"><circle class="loss" cx="1080" cy="460" r="36"/><path class="loss" d="M1058 418l6-26 12 12 10-18 10 18 12-12 6 26z"/></g></g>
<g id="sm6"><text class="m" x="760" y="730" font-size="20">ELECTED LEADER SILENCES COURTS AND PRESS</text><text class="m" x="760" y="762" font-size="20" style="fill:var(--loss)">THE WEB BECOMES A HUB</text></g>
<g id="sh6"><text class="d" x="120" y="830" font-size="40">Independent channels catch mistakes, even the majority’s.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Noise is a feature.</text>
<text class="b" x="120" y="176" font-size="32">The self-correcting system at work.</text>
<g id="rg7"></g>
<g id="er7"><circle id="ec7" class="loss" cx="800" cy="320" r="40"/><path id="ex7" d="M784 304l32 32m0-32l-32 32" stroke="var(--stage)" stroke-width="7" stroke-linecap="round"/><path id="ok7" d="M782 322l12 12 24-26" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="lk7"></g>
<g id="ar7"></g>
<g id="fx7"><text class="d" x="120" y="810" font-size="40">Arguing finds errors before they spread.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Does bad news flow freely</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">to the people in charge</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">where you <tspan style="fill:var(--gain)">work?</tspan></text></g>
<g id="g8"><path class="s-gain" d="M1090 540Q1220 440 1350 490" fill="none" stroke-width="5" stroke-dasharray="10 10"/><g id="em8"></g></g>
<g id="bm8"><circle class="gain" cx="0" cy="0" r="18"/><text class="d" x="0" y="9" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">!</text></g>
<g id="tk"><text class="m" x="143" y="680" font-size="26">THIS WEEK, THANK SOMEONE WHO TOLD YOU</text><text class="m" x="143" y="720" font-size="26">SOMETHING YOU DID NOT WANT TO HEAR</text></g>
</g>