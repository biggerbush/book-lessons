<g id="s0">
<text class="m" x="120" y="150" font-size="28">CAN'T HURT ME · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">From broken kid</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to Navy SEAL.</text>
<g id="sub0"><text class="b" x="120" y="600" font-size="32">Your past explains you. It doesn’t get to define you.</text></g>
<path id="brk" class="s-loss" d="M1100 240l50 70-24 40 70 80-20 50 30 70" fill="none" stroke-width="8" stroke-dasharray="34 14" stroke-linecap="round" stroke-linejoin="round"/>
<g id="start0"><path class="s-ink" d="M1080 700h400" stroke-width="6" stroke-linecap="round"/><rect class="gain" x="1236" y="640" width="10" height="70"/><text class="m" x="1241" y="750" font-size="20" text-anchor="middle">START</text><g id="f0"></g></g>
<path id="arw" class="s-gain" d="M1260 690C1340 690 1420 500 1440 290" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="arh" class="s-gain" d="M1418 312l22-26 22 26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A brutal childhood.</text>
<text class="b" x="120" y="176" font-size="32">His father ran a roller rink in Buffalo, New York.</text>
<g id="pa"><rect class="s-line" x="120" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M190 420L330 330L470 420" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="210" y="420" width="240" height="190" fill="none" stroke-width="6"/>
<text class="m" x="330" y="462" font-size="20" text-anchor="middle">ROLLER RINK</text>
<ellipse class="s-gain" cx="330" cy="545" rx="90" ry="34" fill="none" stroke-width="5"/><circle id="sk" class="gain" r="10"/>
<text class="m" x="330" y="690" font-size="20" text-anchor="middle">DAD’S ROLLER RINK</text></g>
<g id="pb"><rect class="s-line" x="590" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="fb"></g><path class="s-loss" d="M782 360l36-10M784 395l38 4M782 430l34 16" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="800" y="690" font-size="20" text-anchor="middle">A VIOLENT FATHER</text></g>
<g id="pc"><rect class="s-line" x="1060" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="gain" d="M1160 290a40 40 0 1 0 34 62a34 34 0 1 1-34-62z"/>
<circle class="s-ink" cx="1370" cy="340" r="56" fill="var(--stage)" stroke-width="6"/>
<line id="hh" class="s-ink" x1="1370" y1="340" x2="1370" y2="308" stroke-width="6" stroke-linecap="round"/>
<line id="mh" class="s-ink" x1="1370" y1="340" x2="1370" y2="296" stroke-width="4" stroke-linecap="round"/>
<g id="fc"></g><path class="s-ink" d="M1200 580h140" stroke-width="6" stroke-linecap="round"/>
<text id="z1" class="d5" x="1316" y="455" font-size="30">z</text><text id="z2" class="d5" x="1342" y="425" font-size="24">z</text>
<text class="m" x="1270" y="690" font-size="20" text-anchor="middle">LATE NIGHTS, THEN SCHOOL</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Escape wasn’t enough.</text>
<text class="b" x="120" y="176" font-size="32">His mother got them out, to a small town in Indiana.</text>
<circle class="ink" cx="200" cy="320" r="16"/><text class="m" x="200" y="380" font-size="20" text-anchor="middle">BUFFALO, NY</text>
<path id="rt" class="s-gain" d="M220 310C340 230 520 230 640 300" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="town"><g id="hs"></g><text class="m" x="760" y="380" font-size="20" text-anchor="middle">SMALL TOWN, INDIANA</text></g>
<g id="k2"></g><g id="bub2"></g>
<text class="m" x="1220" y="430" font-size="20" text-anchor="middle">THREATS AND SLURS</text>
<g id="card"><rect class="s-ink" x="160" y="480" width="400" height="330" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="190" y="530" font-size="20">REPORT CARD</text><g id="grd"></g></g>
<g id="cheat"><text class="d5" x="720" y="490" font-size="34">Cheating instead of learning.</text>
<rect class="s-ink" x="720" y="520" width="200" height="240" rx="10" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M750 570h140M750 610h140M750 650h100" stroke-width="5" stroke-linecap="round"/>
<rect class="s-gain" x="1180" y="520" width="200" height="240" rx="10" fill="var(--stage)" stroke-width="5"/>
<path class="s-gain" d="M1210 570h140M1210 610h140M1210 650h100" stroke-width="5" stroke-linecap="round"/>
<path id="cpl" class="s-loss" d="M1170 640H944" stroke-width="5" stroke-dasharray="10 10"/>
<path class="s-loss" d="M958 626l-16 14 16 14" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1055" y="620" font-size="20" text-anchor="middle">COPY</text>
<text class="m" x="820" y="800" font-size="20" text-anchor="middle">HIS PAPER</text>
<text class="m" x="1280" y="800" font-size="20" text-anchor="middle">NEIGHBOUR’S</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rock bottom.</text>
<text class="b" x="120" y="176" font-size="32">By his twenties.</text>
<g id="scl"><rect class="s-ink" x="220" y="380" width="220" height="260" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="200" y="640" width="260" height="40" rx="10"/>
<circle class="s-ink" cx="330" cy="480" r="80" fill="var(--stage)" stroke-width="5"/>
<line id="ndl" class="s-loss" x1="330" y1="480" x2="330" y2="415" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="330" cy="480" r="8"/>
<text id="lbs" class="d" x="330" y="615" font-size="40" text-anchor="middle">0</text>
<text class="m" x="330" y="740" font-size="20" text-anchor="middle">NEARLY 300 POUNDS</text></g>
<g id="tk"><rect x="640" y="420" width="100" height="200" rx="30" fill="var(--line)" stroke="var(--ink)" stroke-width="6"/>
<rect class="ink" x="670" y="400" width="40" height="20"/>
<path class="s-ink" d="M740 450C800 430 820 380 860 380L900 370" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="spr"></g>
<ellipse class="ink" cx="980" cy="600" rx="30" ry="18"/>
<path class="s-ink" d="M960 590l-14-14M980 586v-16M1000 590l14-14M962 612l-14 12M998 612l14 12" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="820" y="740" font-size="20" text-anchor="middle">SPRAYING FOR COCKROACHES</text></g>
<g id="jk"><path class="gain" d="M1150 470a80 60 0 0 1 160 0z"/><rect class="ink" x="1145" y="478" width="170" height="26" rx="13"/><rect class="gain" x="1150" y="512" width="160" height="30" rx="12"/>
<path class="s-gain" d="M1375 460v-46M1395 460v-54M1415 460v-48M1430 460v-40" stroke-width="10"/>
<path class="loss" d="M1360 460h80l-10 100h-60z"/>
<text class="m" x="1290" y="740" font-size="20" text-anchor="middle">JUNK FOOD</text></g>
<g id="bel"><text class="d" x="120" y="830" font-size="44" style="fill:var(--loss)">“My past has decided my future.”</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The turning point.</text>
<text class="b" x="120" y="176" font-size="32">One morning after work.</text>
<g id="tv"><path class="s-ink" d="M260 280l-50-60M380 280l50-60M220 540l-20 30M420 540l20 30" stroke-width="6" stroke-linecap="round"/>
<rect class="s-ink" x="140" y="280" width="360" height="260" rx="20" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="320" y="325" font-size="18" text-anchor="middle">NAVY SEAL TRAINING</text>
<circle class="gain" cx="320" cy="425" r="16"/><path id="wv4" class="s-gain" fill="none" stroke-width="5"/>
<text class="m" x="320" y="640" font-size="20" text-anchor="middle">A SHOW ABOUT SEAL TRAINING</text></g>
<g id="ph"><rect class="s-ink" x="740" y="260" width="120" height="220" rx="18" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="800" cy="450" r="10"/>
<path id="ringw" class="s-gain" d="M880 320a30 30 0 0 1 0 60M900 300a55 55 0 0 1 0 100" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="att"></g><text class="m" x="800" y="640" font-size="20" text-anchor="middle">CALLING RECRUITERS</text></g>
<g id="dl"><g id="tl"></g>
<text class="m" x="1080" y="400" font-size="22">LOSE OVER</text>
<text id="lose" class="d" x="1076" y="525" font-size="130" letter-spacing="-4" style="fill:var(--loss)">0</text>
<text class="d5" x="1320" y="525" font-size="50">lbs</text>
<text class="m" x="1080" y="640" font-size="20">IN ABOUT THREE MONTHS</text></g>
<g id="shot"><text class="d" x="120" y="790" font-size="44">One recruiter finally gave him a shot.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The climb.</text>
<g id="chp"></g>
<g id="hrs"><text class="m" x="760" y="245" font-size="20">HOURS EVERY DAY · BARELY EATING</text></g>
<g id="chart"><path class="s-muted" d="M160 320V760H1080" fill="none" stroke-width="4"/>
<text class="m" x="176" y="316" font-size="18">WEIGHT</text>
<path class="s-gain" d="M160 720H1080" stroke-width="3" stroke-dasharray="8 8"/>
<text class="m" x="180" y="706" font-size="18" style="fill:var(--gain)">TARGET WEIGHT</text>
<path id="wl" class="s-gain" d="M180 360L300 440L360 410L470 510L560 560L620 520L740 610L860 660L980 715L1060 735" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></g>
<g id="stb"></g>
<g id="seal"><path class="s-gain" d="M1320 300V700M1240 330v70q0 50 80 50q80 0 80-50v-70M1270 560h100" fill="none" stroke-width="14" stroke-linecap="round"/>
<path class="gain" d="M1226 344l14-36 14 36zM1306 314l14-36 14 36zM1386 344l14-36 14 36z"/>
<text class="d" x="1320" y="780" font-size="52" text-anchor="middle">Navy SEAL</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Explain, not excuse.</text>
<text class="b" x="120" y="176" font-size="32">Your past is real. It is not your destiny.</text>
<g id="past"><path class="s-loss" d="M160 480H700" stroke-width="12" stroke-linecap="round"/>
<circle class="ink" cx="720" cy="480" r="20"/><text class="m" x="720" y="540" font-size="20" text-anchor="middle">TODAY</text>
<text class="m" x="160" y="580" font-size="20">THE PAST EXPLAINS WHERE YOU ARE</text></g>
<g id="fut"><text class="m" x="800" y="250" font-size="20">IT DOESN’T DECIDE WHERE YOU GO NEXT</text></g>
<g id="tags"></g>
<path id="gp" class="s-gain" d="M742 480C1000 480 1200 300 1440 300" fill="none" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="pn"><path class="ink" d="M0 0l-12-30v-70h24v70z"/><rect class="gain" x="-12" y="-120" width="24" height="18" rx="4"/></g>
<g id="own"><text class="d" x="120" y="800" font-size="44">Nobody was coming. He owned his story.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your turn.</text>
<text class="b" x="120" y="176" font-size="32">Treat your pain as fuel, not as a reason to stop.</text>
<g id="who"><path class="s-ink" d="M560 560v90M600 560v90M500 470L540 476" stroke-width="10" stroke-linecap="round"/><g id="fg7"></g>
<rect id="bp" class="loss" x="380" y="440" width="120" height="200" rx="24"/>
<rect x="400" y="540" width="80" height="60" rx="10" fill="none" stroke="var(--stage)" stroke-width="5"/></g>
<g id="tags7"></g>
<g id="fl"><path id="flp" class="gain" d="M0 0c-34 0-50-30-36-60c6 14 16 18 18 4c4-26 10-40 28-50c-4 22 20 34 22 60c2 26-12 46-32 46z"/></g>
<g id="fuelt"><text class="m" x="440" y="710" font-size="20" text-anchor="middle" style="fill:var(--gain)">PAIN BECOMES FUEL</text></g>
<g id="stp7"></g>
<path id="dir7" class="s-gain" d="M800 540L1390 260" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="dh7" class="s-gain" d="M1371 289L1390 260L1355 257" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="780" y="760" font-size="20">SMALL CHOICES REWRITE YOUR DIRECTION</text>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">What part of your past</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">have you been using</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">as an <tspan style="fill:var(--gain)">excuse</tspan>?</text></g>
<g id="chal"><text class="m" x="143" y="680" font-size="26">TODAY: ONE SMALL STEP THE OLD YOU WOULD NEVER TAKE</text></g>
<g id="stp8"><rect x="1200" y="720" width="120" height="80" rx="6" fill="var(--line)"/><rect class="gain" x="1320" y="640" width="120" height="160" rx="6"/><circle id="dot8" class="ink" r="20"/></g>
</g>