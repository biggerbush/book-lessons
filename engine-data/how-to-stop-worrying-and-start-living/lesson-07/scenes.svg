<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO STOP WORRYING AND START LIVING · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Forget yourself</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">by helping others.</text>
<text class="b" x="120" y="600" font-size="32">The surest cure for worry is caring about someone else.</text>
<g id="tg"><g id="tcl"></g><path id="th" class="gain" d="M0 18C-30-2-32-22-15-26C-7-28-2-22 0-16C2-22 7-28 15-26C32-22 30-2 0 18Z"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Worry grows in a closed room.</text>
<text class="b" x="120" y="176" font-size="32">The longer we stare at our troubles, the bigger and darker they get.</text>
<g id="room">
<rect class="s-ink" x="140" y="240" width="540" height="560" rx="8" fill="none" stroke-width="7"/>
<rect class="s-line" x="560" y="620" width="80" height="180" fill="none" stroke-width="5"/>
<g id="rp"></g><g id="cloud"></g>
<text class="m" x="410" y="840" font-size="20" text-anchor="middle">A CLOSED ROOM</text>
</g>
<g id="spot">
<text class="m" x="800" y="260" font-size="20">WHERE THE SPOTLIGHT POINTS</text>
<polygon id="beam" points="0,0 -90,400 90,400" fill-opacity=".28"/>
<path id="lamp" class="ink" d="M-20-22h40l14 44h-68z"/>
<g id="sp"></g>
<text class="m" x="1040" y="790" font-size="20" text-anchor="middle">YOU</text>
<text class="m" x="1340" y="790" font-size="20" text-anchor="middle">OTHERS</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Adler’s 14-day prescription.</text>
<text class="b" x="120" y="176" font-size="32">Alfred Adler, a famous Austrian psychiatrist, had one daily rule.</text>
<g id="adl"><g id="doc"></g>
<path class="s-gain" d="M262 560q38 70 76 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="300" y="730" font-size="22" text-anchor="middle">ALFRED ADLER</text>
<text class="m" x="300" y="762" font-size="20" text-anchor="middle">PSYCHIATRIST</text></g>
<g id="pad">
<rect class="s-ink" x="620" y="230" width="860" height="570" rx="18" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="660" y="330" font-size="80" style="fill:var(--loss)">Rx</text>
<text class="m" x="800" y="318" font-size="20">ONE DAILY RULE · FOURTEEN DAYS</text>
<g id="days"></g>
<g id="rule"><text class="d5" x="660" y="620" font-size="36">Each morning, think how you could</text>
<text class="d5" x="660" y="668" font-size="36">bring some pleasure to someone else.</text></g>
<g id="easy"><text class="m" x="660" y="760" font-size="20" style="fill:var(--gain)">IT SOUNDS ALMOST TOO EASY</text></g>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Her world shrank to one bed.</text>
<text class="b" x="120" y="176" font-size="32">Margaret Tayler Yates, a naval officer’s wife in Hawaii.</text>
<g id="mg">
<rect class="s-ink" x="140" y="250" width="240" height="200" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M200 440q10-80 30-120" fill="none" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M230 320q-40-10-60 20M230 320q40-14 60 14M230 320q-10-30-40-40M230 320q20-30 50-30" fill="none" stroke-width="5" stroke-linecap="round"/>
<circle class="gain" cx="330" cy="300" r="24"/>
<text class="m" x="140" y="500" font-size="22">HAWAII</text>
</g>
<circle id="world" class="s-loss" cx="800" cy="540" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
<g id="bedg">
<rect class="ink" x="610" y="440" width="24" height="200" rx="6"/>
<rect class="s-ink" x="634" y="548" width="356" height="34" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="610" y="580" width="380" height="30"/>
<rect class="ink" x="960" y="600" width="24" height="40"/>
<ellipse class="s-line" cx="680" cy="532" rx="40" ry="18" fill="var(--stage)" stroke-width="4"/>
<circle class="ink" cx="690" cy="512" r="28"/>
<path class="loss" d="M716 548C740 500 940 504 984 548Z"/>
<text class="m" x="800" y="674" font-size="20" text-anchor="middle">HEART TROUBLE · IN BED</text>
</g>
<g id="fears"><text class="d5" x="1160" y="440" font-size="44" style="fill:var(--loss)">aches</text>
<text class="d5" x="1190" y="640" font-size="44" style="fill:var(--loss)">fears</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then came Pearl Harbor.</text>
<text class="b" x="120" y="176" font-size="32">A phone by her bed made her a contact point for frightened families.</text>
<g id="boom"><g id="bursts"></g>
<path class="s-line" d="M120 440h460" stroke-width="5"/>
<text class="m" x="350" y="490" font-size="20" text-anchor="middle">PEARL HARBOR</text></g>
<g id="ph">
<path class="ink" d="M690 520q110-50 220 0v20h-60v-14q-50-14-100 0v14h-60z"/>
<rect class="ink" x="700" y="540" width="200" height="110" rx="22"/>
<circle cx="800" cy="595" r="30" fill="var(--stage)"/>
<g id="ring"><path class="s-gain" d="M670 500q-30 40 0 80M650 480q-46 60 0 120M930 500q30 40 0 80M950 480q46 60 0 120" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<text class="m" x="800" y="700" font-size="20" text-anchor="middle">CONTACT POINT</text>
</g>
<g id="fam"><text class="m" x="1300" y="730" font-size="20" text-anchor="middle">MILITARY FAMILIES</text></g>
<g id="fdots"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">She forgot about herself.</text>
<text class="b" x="120" y="176" font-size="32">Comforting strangers got her out of bed.</text>
<g id="comf"><g id="cl5"></g><g id="hearts"></g>
<text class="m" x="360" y="680" font-size="20" text-anchor="middle">MARGARET</text>
<text class="m" x="670" y="790" font-size="20" text-anchor="middle">CALLERS</text></g>
<clipPath id="sky"><rect x="860" y="220" width="620" height="380"/></clipPath>
<g id="day">
<g clip-path="url(#sky)"><g id="sun"></g></g>
<path class="s-ink" d="M860 600h620" stroke-width="6" stroke-linecap="round"/>
<rect class="loss" x="860" y="670" width="620" height="60"/>
<rect id="outb" class="gain" x="860" y="670" height="60"/>
<text class="m" x="860" y="770" font-size="20" style="fill:var(--gain)">OUT OF BED</text>
<text class="m" x="1480" y="770" font-size="20" text-anchor="end" style="fill:var(--loss)">IN BED</text>
<text class="m" x="860" y="820" font-size="20">MORE TIME OUT OF BED THAN IN IT</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Helping others pulls together everything Carnegie teaches.</text>
<g id="gr"><path id="gear" class="gain"/><text class="m" x="300" y="690" font-size="22" text-anchor="middle">ONE KIND ACT</text></g>
<g id="k0"><path class="s-gain" d="M410 505L620 325" stroke-width="5" stroke-dasharray="8 8"/>
<rect class="s-line" x="620" y="250" width="860" height="150" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-ink" cx="700" cy="325" r="40" fill="var(--stage)" stroke-width="6"/>
<line id="hh" class="s-ink" x1="700" y1="325" stroke-width="6" stroke-linecap="round"/>
<line id="mh" class="s-gain" x1="700" y1="325" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="790" y="318" font-size="36">Keeps you in today.</text>
<text class="m" x="790" y="358" font-size="20">THE ONLY DAY YOU CAN ACTUALLY LIVE</text></g>
<g id="k1"><path class="s-gain" d="M410 505L620 505" stroke-width="5" stroke-dasharray="8 8"/>
<rect class="s-line" x="620" y="430" width="860" height="150" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="bx"><rect class="gain" x="678" y="470" width="44" height="36" rx="4"/></g>
<path class="s-ink" d="M650 500q50 40 100 0" fill="none" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="790" y="498" font-size="36">Fills hands and thoughts.</text>
<text class="m" x="790" y="538" font-size="20">LITTLE ROOM LEFT FOR BROODING</text></g>
<g id="k2"><path class="s-gain" d="M410 505L620 685" stroke-width="5" stroke-dasharray="8 8"/>
<rect class="s-line" x="620" y="610" width="860" height="150" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="ink" d="M700 672l-22 58h44z"/>
<g id="beam2"><path class="s-ink" d="M-50 0h100M-50 0v16M50 0v16" stroke-width="5" stroke-linecap="round"/><circle class="loss" cx="-50" cy="24" r="12"/><circle class="gain" cx="50" cy="24" r="12"/></g>
<text class="d5" x="790" y="678" font-size="36">Blessings easier to count.</text>
<text class="m" x="790" y="718" font-size="20">OTHERS’ STRUGGLES PUT YOURS IN VIEW</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small is enough.</text>
<text class="b" x="120" y="176" font-size="32">You do not need a crisis to try this.</text>
<g id="n0"><rect class="s-ink" x="130" y="275" width="100" height="70" rx="6" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M130 275l50 36 50-36" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="260" y="322" font-size="34">A thank-you note</text></g>
<g id="n1"><rect class="s-ink" x="130" y="430" width="100" height="70" rx="18" fill="var(--stage)" stroke-width="5"/>
<path class="gain" transform="translate(180 470)" d="M0 18C-30-2-32-22-15-26C-7-28-2-22 0-16C2-22 7-28 15-26C32-22 30-2 0 18Z"/>
<text class="d5" x="260" y="482" font-size="34">A sincere compliment</text></g>
<g id="n2"><rect class="s-ink" x="130" y="590" width="100" height="70" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="180" y="644" font-size="48" text-anchor="middle">?</text>
<text class="d5" x="260" y="642" font-size="34">A real question</text></g>
<g id="ripple"><g id="rings"></g><g id="ppl"></g><g id="rdots"></g></g>
<g id="ctr"><circle class="gain" cx="1110" cy="520" r="40"/><text class="m" x="1110" y="527" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Who could you make</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">a little <tspan style="fill:var(--gain)">happier</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">each morning?</text></g>
<g id="cal"><rect class="s-ink" x="1080" y="260" width="400" height="200" rx="14" fill="var(--stage)" stroke-width="5"/>
<rect class="gain" x="1080" y="260" width="400" height="40" rx="14"/>
<path class="s-ink" d="M1160 245v30M1400 245v30" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1280" y="288" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">14 DAYS</text>
<g id="cells"></g></g>
<g id="go"><text class="m" x="143" y="700" font-size="26">FOURTEEN DAYS · THEN GO DO IT AND WATCH YOUR WORRIES</text></g>
</g>