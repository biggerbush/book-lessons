<g id="hrt" transform="translate(1273 450)"><path class="gain" d="M0 90C-130 0-120-90-60-95C-30-98-8-78 0-58C8-78 30-98 60-95C120-90 130 0 0 90Z"/></g>
<text class="d5" x="1273" y="650" font-size="32" text-anchor="middle">A meaningful life</text></g>
<g id="big1"><text class="d" x="120" y="800" font-size="46">A focused life is also a meaningful one.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Attention shapes your days.</text>
<text class="b" x="120" y="176" font-size="32">Science writer Winifred Gallagher.</text>
<polygon id="beam" class="gain" points="0,0 960,-110 960,110" fill-opacity=".2" opacity="0"/>
