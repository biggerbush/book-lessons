<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">What is the one thing</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">your team must get right,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2">even if every plan</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2" style="fill:var(--gain)">falls apart?</text></g>
<g id="wr"><text class="m" x="143" y="720" font-size="26">WRITE THAT SENTENCE DOWN TODAY, AND SHARE IT.</text></g>
