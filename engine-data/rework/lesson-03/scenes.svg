</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be your own customer.</text>
<text class="b" x="120" y="176" font-size="32">Make something you want to use.</text>
<g id="desk"><g id="mk1"></g><rect class="ink" x="200" y="560" width="440" height="16" rx="4"/><path class="s-ink" d="M230 576v120M610 576v120" stroke-width="8" stroke-linecap="round"/><rect class="s-ink" x="440" y="474" width="130" height="80" rx="6" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="420" y="552" width="170" height="8" rx="3"/><text class="m" x="330" y="750" font-size="22" text-anchor="middle">MAKER</text></g>
<g id="bub1"><circle class="s-ink" cx="400" cy="318" r="8" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="428" cy="288" r="13" fill="var(--stage)" stroke-width="4"/><rect class="s-gain" x="450" y="210" width="340" height="100" rx="50" fill="var(--stage)" stroke-width="6"/><text class="m" x="620" y="268" font-size="22" text-anchor="middle" style="fill:var(--gain)">THIS BUGS ME</text></g>
<g id="mir"><text class="d" x="820" y="500" font-size="96" text-anchor="middle" style="fill:var(--muted)">=</text><rect class="s-ink" x="960" y="240" width="380" height="480" rx="24" fill="var(--stage)" stroke-width="7"/><path class="s-line" d="M990 320l70-50M990 370l110-80" stroke-width="6" stroke-linecap="round"/><g id="mk2"></g><text class="m" x="1150" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">CUSTOMER</text><text class="d" x="120" y="830" font-size="44">You already know exactly what’s missing.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">How Basecamp began.</text>
<text class="b" x="120" y="176" font-size="32">37signals started as a small web design firm.</text>
<g id="stu"><rect class="s-ink" x="140" y="380" width="260" height="300" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="140" y="330" width="260" height="56"/><text class="m" x="270" y="366" font-size="20" text-anchor="middle" style="fill:var(--stage)">37SIGNALS</text><g id="win"></g><rect class="ink" x="245" y="600" width="50" height="80"/><text class="m" x="270" y="730" font-size="20" text-anchor="middle">WEB DESIGN FIRM</text></g>
<g id="mailg"><g id="mail"></g><text class="m" x="700" y="730" font-size="20" text-anchor="middle" style="fill:var(--loss)">MESSY EMAIL · LOST FILES</text></g>
<g id="app"><path class="s-muted" d="M905 480h55m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="980" y="280" width="480" height="400" rx="16" fill="var(--stage)" stroke-width="7"/><rect class="gain" x="980" y="280" width="480" height="56" rx="16"/><rect class="gain" x="980" y="310" width="480" height="26"/><text class="m" x="1010" y="318" font-size="22" style="fill:var(--on-gain)">BASECAMP</text><g id="rows"></g>
<text id="own" class="m" x="1220" y="730" font-size="20" text-anchor="middle">JUST FOR THEMSELVES</text><text id="main" class="m" x="1220" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">THEIR MAIN PRODUCT</text></g>
<g id="ppl"></g>
<g id="cap2"><text class="d" x="120" y="830" font-size="40">Other people had the same headache.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Instant feedback.</text>
<text class="b" x="120" y="176" font-size="32">Build for yourself and you know right away if it works.</text>
<g id="ok3"><circle class="gain" cx="300" cy="420" r="120"/><path d="M240 424l42 42 82-92" fill="none" stroke="var(--on-gain)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ok3b"><text class="m" x="300" y="600" font-size="20" text-anchor="middle">WORKS? YOU KNOW AT ONCE</text></g>
<g id="gs3"><g id="ghost"></g><text class="d" x="740" y="320" font-size="64" text-anchor="middle" style="fill:var(--muted)">?</text><text class="m" x="740" y="610" font-size="20" text-anchor="middle">IMAGINARY CUSTOMER</text><path id="x3" class="s-loss" d="M660 360l160 200M820 360l-160 200" stroke-width="8" stroke-linecap="round"/></g>
<g id="lp3"><circle class="s-line" cx="1220" cy="430" r="160" fill="none" stroke-width="6"/><circle id="dot3" class="gain" r="16"/><g id="nodes"></g></g>
<g id="lp3c"><text class="d" x="120" y="800" font-size="40">You use it, feel what’s wrong, and fix it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The dusty vacuum.</text>
<text class="b" x="120" y="176" font-size="32">James Dyson’s vacuum cleaner kept losing suction.</text>
<g id="vac"><path class="s-ink" d="M330 290v260M300 290h60" fill="none" stroke-width="12" stroke-linecap="round"/><rect class="s-ink" x="270" y="540" width="120" height="160" rx="24" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="220" y="700" width="220" height="30" rx="10"/><g id="dust"></g><rect class="s-ink" x="520" y="300" width="44" height="400" rx="10" fill="none" stroke-width="5"/><rect id="suck" class="loss" x="528" width="28" rx="5"/><text class="m" x="542" y="770" font-size="20" text-anchor="middle">SUCTION</text></g>
<g id="ws"><g id="dys"></g><rect class="ink" x="820" y="620" width="620" height="18" rx="4"/><path class="s-ink" d="M850 638v120M1410 638v120" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M1200 470h140l-46 150h-48z"/><path d="M1214 510h112M1228 556h84" stroke="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1060 612l70-40" stroke-width="14" stroke-linecap="round"/><circle class="s-ink" cx="1138" cy="567" r="14" fill="none" stroke-width="7"/><text class="m" x="1130" y="700" font-size="20" text-anchor="middle">BUILD A BETTER ONE</text></g>
<g id="bulb"><circle class="gain" cx="960" cy="330" r="42"/><rect class="ink" x="946" y="374" width="28" height="22" rx="4"/><path class="s-gain" d="M960 262v-26M900 290l-20-16M1020 290l20-16M890 340h-26M1030 340h26" stroke-width="6" stroke-linecap="round"/></g>
<g id="cap4"><text class="d" x="120" y="840" font-size="40">Frustration gave him the idea and the motivation.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ideas are cheap.</text>
<text class="b" x="120" y="176" font-size="32">What matters is who actually starts making something.</text>
<g id="pile"></g>
<g id="tag"><rect class="s-loss" x="180" y="700" width="320" height="56" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="340" y="736" font-size="20" text-anchor="middle" style="fill:var(--loss)">WORTH VERY LITTLE</text></g>
<g id="crowd5"></g>
<g id="cr5l"><text class="m" x="815" y="760" font-size="20" text-anchor="middle">SAME BRILLIANT THOUGHT</text></g>
<g id="bld"><g id="bfig"></g><path class="s-line" d="M1120 600h350" stroke-width="5"/><g id="blocks"></g><g id="ham"><path class="s-ink" d="M0 0l60-60" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="40" y="-90" width="50" height="26" rx="4" transform="rotate(45 65 -77)"/></g><text class="m" x="1290" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE ONE WHO BUILDS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stop waiting for the right moment.</text>
<text class="b" x="120" y="176" font-size="32">Even a few hours a week, at night or on weekends, adds up.</text>
