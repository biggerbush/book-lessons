<rect x="840" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/>
<g id="disc">
<text class="m" x="160" y="284" font-size="22" style="fill:var(--gain)">DISCOVER MODE</text>
