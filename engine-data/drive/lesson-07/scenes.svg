<g id="s0">
<text class="m" x="120" y="150" font-size="28">DRIVE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Becoming a</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Type I person.</text>
<text class="b" x="120" y="600" font-size="32">Fair pay first, then build your life around inner drive.</text>
<g id="t0x"></g>
<g id="t0i"><circle id="t0r" class="s-gain" cx="1380" cy="400" r="80" fill="none" stroke-width="4"/></g>
<g id="t0a">
<text class="m" x="1220" y="530" font-size="20" text-anchor="middle">TYPE X</text>
<text class="m" x="1380" y="530" font-size="20" text-anchor="middle" style="fill:var(--gain)">TYPE I</text>
<path class="s-gain" d="M1250 580h100m-16-16 16 16-16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of behavior.</text>
<g id="x1"><rect class="s-line" x="120" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
