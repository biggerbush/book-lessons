<path class="s-ink" d="M1310 450l15-30l15 30l15-30l15 30" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="ink" x="1300" y="515" width="80" height="22" rx="6"/>
<rect class="ink" x="1310" y="545" width="60" height="18" rx="6"/>
</g>
<g id="cur"><text class="d" x="120" y="730" font-size="42">Stay curious, so both walk away knowing something new.</text></g>
<g id="prc"><text class="m" x="120" y="810" font-size="26" style="fill:var(--gain)">NOT A TALENT. IT IS PRACTICE.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Next real conversation:</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">try one step on purpose,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and <tspan style="fill:var(--gain)">notice what changes.</tspan></text></g>
