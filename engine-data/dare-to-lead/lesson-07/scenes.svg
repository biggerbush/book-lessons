<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Learning to rise</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">after falling.</text>
<text class="b" x="120" y="600" font-size="32">How daring leaders get back up after a fall.</text>
<path class="s-line" d="M940 700H1480" stroke-width="6" stroke-linecap="round"/>
