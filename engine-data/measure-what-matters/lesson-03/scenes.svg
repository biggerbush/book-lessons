<g id="s0">
<text class="m" x="120" y="150" font-size="28">MEASURE WHAT MATTERS · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Focus and commit</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to few priorities.</text>
<text class="b" x="120" y="600" font-size="32">Why fewer goals beat many, and how Intel proved it</text>
<path class="s-line" d="M1080 740h400" stroke-width="5" stroke-linecap="round"/>
<g id="jug"></g>
<path class="s-ink" d="M1250 650l-60-80M1330 650l60-80" stroke-width="8" stroke-linecap="round"/>
<g id="balls"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fewer goals, sharper focus.</text>
<text class="b" x="120" y="176" font-size="32">Most teams try to cover everything.</text>
<g id="lst"><rect class="s-line" x="120" y="230" width="420" height="580" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="270" font-size="20">OUR GOALS</text><g id="rows"></g></g>
<g id="spot">
<polygon class="gain" points="1010,250 1110,250 1380,700 740,700" fill-opacity=".14"/>
<ellipse class="gain" cx="1060" cy="700" rx="320" ry="40" fill-opacity=".25"/>
<rect class="ink" x="1000" y="216" width="120" height="44" rx="10"/>
<path class="s-muted" d="M580 520h130m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="blk"></g>
<g id="five"><text class="m" x="1060" y="790" font-size="22" text-anchor="middle" style="fill:var(--gain)">ABOUT 3 TO 5 OBJECTIVES PER CYCLE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Saying no is the point.</text>
<text class="b" x="120" y="176" font-size="32">Picking a few means crossing good ideas off the list.</text>
<g id="cards"></g>
<g id="hurt"><text class="m" x="120" y="790" font-size="24" style="fill:var(--loss)">IT HURTS. THAT IS THE POINT.</text></g>
<g id="scl">
<path class="s-ink" d="M1120 380V640" stroke-width="8"/>
<path class="ink" d="M1060 680h120l-60-40z"/>
<line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/>
<g id="panL"><path class="s-ink" d="M0 0L-80 120M0 0L80 120M-90 120h180" fill="none" stroke-width="5" stroke-linecap="round"/><rect class="gain" x="-50" y="62" width="100" height="56" rx="8"/><text class="d" x="0" y="100" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">YES</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-80 120M0 0L80 120M-90 120h180" fill="none" stroke-width="5" stroke-linecap="round"/><g id="nos"></g></g>
<circle class="ink" cx="1120" cy="380" r="12"/>
<text class="m" x="1120" y="760" font-size="24" text-anchor="middle">EVERY YES IS A QUIET NO</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Late 1979: Intel under threat.</text>
<text class="b" x="120" y="176" font-size="32">A rival chip, and customers slipping away.</text>
<g id="cal"><rect class="s-ink" x="120" y="240" width="240" height="240" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="123" y="243" width="234" height="60"/><text class="m" x="240" y="282" font-size="24" text-anchor="middle" style="fill:var(--stage)">LATE</text><text class="d" x="240" y="420" font-size="76" text-anchor="middle">1979</text></g>
<g id="ci"><text class="m" x="560" y="520" font-size="22" text-anchor="middle">INTEL 8086</text></g>
<g id="cm"><text class="d5" x="730" y="395" font-size="40" text-anchor="middle">vs</text><text class="m" x="900" y="530" font-size="22" text-anchor="middle">MOTOROLA</text></g>
<g id="tag"><text class="m" x="900" y="570" font-size="20" text-anchor="middle" style="fill:var(--loss)">SEEN AS FASTER, EASIER TO USE</text></g>
<g id="note"><rect x="1140" y="240" width="320" height="300" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><circle class="loss" cx="1300" cy="320" r="40"/><text class="d" x="1300" y="340" font-size="56" text-anchor="middle" style="fill:var(--stage)">!</text><text class="m" x="1300" y="410" font-size="22" text-anchor="middle" style="fill:var(--loss)">URGENT:</text><text class="m" x="1300" y="450" font-size="22" text-anchor="middle">INTEL IS LOSING</text><text class="m" x="1300" y="482" font-size="22" text-anchor="middle">CUSTOMERS</text></g>
<g id="cust"><text class="m" x="120" y="678" font-size="20">CUSTOMERS</text><g id="custIn"></g></g>
<g id="drift"><path class="s-loss" d="M500 740H990" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><path class="s-loss" d="M972 722l18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="lose"><text class="d" x="120" y="820" font-size="48">Customers were drifting to the rival.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Operation Crush.</text>
<text class="b" x="120" y="176" font-size="32">Intel’s leaders launched one bold campaign.</text>
<g id="meet"><g id="mp"></g><rect class="ink" x="150" y="440" width="300" height="36" rx="8"/><text class="m" x="300" y="540" font-size="20" text-anchor="middle">LEADERS MEET</text><text class="m" x="300" y="572" font-size="20" text-anchor="middle" style="fill:var(--gain)">WITHIN ABOUT A WEEK</text></g>
<g id="tg"><circle class="s-ink" cx="820" cy="450" r="180" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="820" cy="450" r="120" fill="none" stroke-width="6"/><circle class="gain" cx="820" cy="450" r="60"/></g>
<g id="dart"><path class="s-ink" d="M0 0L-90-90M-90-90l-24 4M-90-90l4-24" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="numg"><text id="num" class="d" x="820" y="720" font-size="64" text-anchor="middle">2,000</text><text class="m" x="820" y="762" font-size="20" text-anchor="middle">DESIGN WINS IN ONE YEAR</text></g>
<g id="gd"><g id="gc"></g><path class="s-muted" d="M1222 330h50m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="1290" y="260" width="170" height="130" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1280 404h190" stroke-width="8" stroke-linecap="round"/><rect id="dchip" class="gain" x="1355" y="305" width="40" height="40" rx="6"/></g>
<g id="gdl"><text class="m" x="1110" y="480" font-size="20" style="fill:var(--gain)">DESIGN WIN =</text><text class="m" x="1110" y="512" font-size="20">A CUSTOMER CHOOSES</text><text class="m" x="1110" y="544" font-size="20">YOUR CHIP FOR A</text><text class="m" x="1110" y="576" font-size="20">NEW PRODUCT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone pulls one way.</text>
<text class="b" x="120" y="176" font-size="32">Every department aimed at one target.</text>
<g id="arr"></g>
<g id="rowsT"></g>
<g id="tg5"><circle class="s-ink" cx="880" cy="460" r="80" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="880" cy="460" r="46" fill="none" stroke-width="6"/><circle class="gain" cx="880" cy="460" r="18"/></g>
<g id="team"><rect class="s-gain" x="120" y="330" width="400" height="260" rx="20" fill="none" stroke-width="5"/><text class="m" x="320" y="625" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE TEAM</text></g>
<g id="shd"><path class="s-gain" d="M1270 250l140 50v110c0 100-70 160-140 190c-70-30-140-90-140-190V300z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-gain" d="M1210 420l40 40 80-90" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="w0"><text class="d5" x="1270" y="660" font-size="30" text-anchor="middle">Support</text></g>
<g id="w1"><text class="d5" x="1270" y="705" font-size="30" text-anchor="middle">Reliability</text></g>
<g id="w2"><text class="d5" x="1270" y="750" font-size="30" text-anchor="middle">Long-term plans</text></g>
<g id="w3"><text class="m" x="1270" y="800" font-size="20" text-anchor="middle">NOT ONLY SPEED</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Target beaten.</text>
<text class="b" x="120" y="176" font-size="32">By the end of 1980.</text>
<path class="s-ink" d="M140 760h460" stroke-width="5" stroke-linecap="round"/>
<rect id="bar" class="gain" x="220" y="760" width="160" height="0"/>
<g id="tgl"><path class="s-muted" d="M160 360h240" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="410" y="372" font-size="20">TARGET 2,000</text></g>
<g id="cntg"><text id="cnt" class="d" x="410" y="290" font-size="64">~0</text><text class="m" x="410" y="326" font-size="20" style="fill:var(--gain)">ROUGHLY · DESIGN WINS</text></g>
<g id="pc"><rect class="s-ink" x="820" y="300" width="320" height="220" rx="14" fill="var(--stage)" stroke-width="6"/><rect x="845" y="325" width="270" height="170" fill="var(--muted)" fill-opacity=".16"/><rect class="gain" x="935" y="382" width="90" height="56" rx="6"/><text class="m" x="980" y="416" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">INTEL</text><path class="s-ink" d="M980 520v30M920 550h120" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="840" y="580" width="280" height="36" rx="8"/><text class="d" x="980" y="690" font-size="48" text-anchor="middle">IBM</text><text class="m" x="980" y="730" font-size="20" text-anchor="middle">PICKED INTEL FOR ITS FIRST PC</text></g>
<g id="rkt"><path id="rpath" d="M1220 720C1310 690 1400 540 1420 300" fill="none" stroke="none"/><polyline id="rtrail" class="s-gain" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><g id="rk"><path class="gain" d="M0-34c14 12 18 30 14 46h-28c-4-16 0-34 14-46z"/></g><text class="m" x="1460" y="770" font-size="20" text-anchor="end">SHAPED INTEL FOR DECADES</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">One fight, everything behind it.</text>
<g id="mg"><g id="mgd"></g><circle id="tdot" class="gain" cx="410" cy="450" r="14"/></g>
<g id="mgl"><circle class="s-ink" cx="0" cy="0" r="60" fill="none" stroke-width="8"/><path class="s-ink" d="M42 42l60 60" stroke-width="14" stroke-linecap="round"/></g>
<g id="mlab"><text class="m" x="120" y="620" font-size="22" style="fill:var(--gain)">ONE FIGHT</text></g>
<g id="res"></g>
<g id="fbl"><text class="m" x="980" y="580" font-size="22" style="fill:var(--gain)">A FEW CLEAR PRIORITIES</text></g>
<g id="dr"><g id="drp"></g><text class="d5" x="260" y="740" font-size="38">John Doerr, young Intel salesperson.</text><text class="m" x="260" y="790" font-size="22" style="fill:var(--gain)">HE NEVER FORGOT THE LESSON</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">Circle no more</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">than <tspan style="fill:var(--gain)">three</tspan> goals.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">What will you say <tspan style="fill:var(--loss)">no</tspan> to?</text></g>
<g id="l8"></g>
<g id="tl8"><text class="m" x="143" y="700" font-size="26">CIRCLE THREE. SAY NO TO THE REST.</text></g>
</g>