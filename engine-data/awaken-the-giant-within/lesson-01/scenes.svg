<g id="s0">
<text class="m" x="120" y="150" font-size="28">AWAKEN THE GIANT WITHIN · LESSON 1</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">One real decision</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">can change</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2" style="fill:var(--gain)">everything.</text>
<text class="b" x="120" y="620" font-size="32">Why a true decision, made once, can redirect your whole life</text>
<path class="s-line" d="M1340 600V440M1340 440C1340 360 1260 340 1220 260" fill="none" stroke-width="14" stroke-linecap="round"/>
<path id="t0b" class="s-gain" d="M1340 440C1340 360 1420 340 1460 260" fill="none" stroke-width="14" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="t0rays"></g>
<circle class="gain" cx="1340" cy="440" r="16"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where destiny turns.</text>
<text class="b" x="120" y="176" font-size="32">Your moments of decision shape your destiny.</text>
<g id="road">
<path d="M560 820V560M560 560C560 460 380 420 340 290M560 560C560 460 740 420 780 290" fill="none" stroke="var(--line)" stroke-width="44" stroke-linecap="round"/>
