<text class="b" x="120" y="176" font-size="32">Each cookie: something hard he already survived.</text>
<circle class="s-line" cx="420" cy="520" r="240" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
<text class="m" x="420" y="810" font-size="20" text-anchor="middle">HIS MIND</text>
