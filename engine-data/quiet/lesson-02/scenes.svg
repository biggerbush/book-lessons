<text class="m" x="370" y="660" font-size="20" text-anchor="middle">QUIET CUBICLE</text></g>
<g id="brd">
<rect class="s-ink" x="700" y="260" width="360" height="340" rx="12" fill="var(--stage)" stroke-width="5"/>
<g id="trc"></g><g id="chips"></g>
<text class="m" x="880" y="640" font-size="20" text-anchor="middle">SKETCHED AND WIRED, ALONE</text></g>
<g id="mon">
<rect class="s-ink" x="1140" y="260" width="320" height="230" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1165" y="285" width="270" height="180" rx="6"/>
