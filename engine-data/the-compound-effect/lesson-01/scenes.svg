<g id="leg"><rect x="160" y="812" width="20" height="20" rx="3" fill="none" stroke="var(--gain)" stroke-width="3"/><text class="m" x="196" y="830" font-size="20">SKIPPED GOOD CHOICE</text><rect class="loss" x="560" y="812" width="20" height="20" rx="3"/><text class="m" x="596" y="830" font-size="20">INDULGED BAD CHOICE</text></g>
<g id="blk"></g>
<g id="tot"><text class="m" x="890" y="345" font-size="22" text-anchor="middle">THE TOTAL</text></g>
<g id="fut"><path class="s-gain" d="M990 560H1100M1080 540l20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1190" y="670" font-size="22" text-anchor="middle" style="fill:var(--gain)">FUTURE YOU</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What small, smart choice</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">could you repeat every day,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">starting <tspan style="fill:var(--gain)">today</tspan>?</text></g>
