<path class="s-loss" d="M520 292v34m-12-12 12 12 12-12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="gov"><path class="ink" d="M760 330L830 290L900 330Z"/><rect class="ink" x="770" y="335" width="16" height="70"/><rect class="ink" x="800" y="335" width="16" height="70"/><rect class="ink" x="830" y="335" width="16" height="70"/><rect class="ink" x="860" y="335" width="16" height="70"/><rect class="ink" x="755" y="405" width="150" height="12"/>
<text class="m" x="830" y="450" font-size="18" text-anchor="middle">GOVERNMENTS</text></g>
<path id="arc" class="s-muted" d="M910 330C980 230 1080 230 1140 320" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<g id="flow"></g>
<g id="lap"><rect id="lscr" class="s-ink" x="1140" y="300" width="240" height="150" rx="10" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M1100 450H1420L1400 474H1120Z"/>
<text class="m" x="1260" y="510" font-size="18" text-anchor="middle">ORDINARY LAPTOP</text></g>
<g id="army"><text class="m" x="160" y="770" font-size="20">ONCE: AN ARMY</text></g>
<g id="eq"><text class="d" x="640" y="700" font-size="90" text-anchor="middle">=</text></g>
<g id="tiny"><g id="tinyp"></g><rect class="s-ink" x="1050" y="640" width="70" height="46" rx="4" fill="var(--stage)" stroke-width="4"/><rect class="ink" x="1040" y="686" width="90" height="8"/>
<text class="m" x="880" y="770" font-size="20" text-anchor="middle">NOW: A TINY GROUP</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A hospital goes dark.</text>
<text class="b" x="120" y="176" font-size="32">WannaCry ransomware hits Britain’s NHS, 2017.</text>
<g id="hosp"><path class="s-ink" d="M320 290v60M290 320h60" stroke-width="16"/><rect class="s-ink" x="160" y="360" width="320" height="320" fill="var(--stage)" stroke-width="6"/>
<g id="wins"></g><rect class="ink" x="290" y="630" width="60" height="50"/>
<text class="m" x="320" y="720" font-size="22" text-anchor="middle">NHS · BRITAIN</text></g>
<g id="scr"><rect class="s-ink" x="620" y="330" width="380" height="250" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M810 580v40M750 620h120" stroke-width="6" stroke-linecap="round"/>
<path class="s-loss" d="M780 440v-24a30 30 0 0 1 60 0v24" fill="none" stroke-width="10"/><rect class="loss" x="765" y="436" width="90" height="70" rx="8"/>
<text class="m" x="810" y="552" font-size="20" text-anchor="middle" style="fill:var(--loss)">PAY TO UNLOCK</text></g>
<g id="appt"><text class="m" x="810" y="670" font-size="20" text-anchor="middle">APPOINTMENTS CANCELLED</text></g>
<g id="file"><path class="s-ink" d="M1160 340h80l20 22h140v150H1160Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1280" y="445" font-size="22" text-anchor="middle">NSA TOOL</text>
<text class="m" x="1280" y="550" font-size="20" text-anchor="middle">BUILT BY THE NSA,</text><text class="m" x="1280" y="580" font-size="20" text-anchor="middle">THEN LEAKED</text></g>
<path id="back" class="s-loss" d="M1240 330C1100 200 520 200 370 300" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="turned"><text class="d" x="120" y="800" font-size="44">A weapon made by a state, turned against states.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pressure one: fragmentation.</text>
<text class="b" x="120" y="176" font-size="32">Power splinters into groups that act like mini-states.</text>
<g id="wedges"></g>
<g id="sh4w"><g id="sh4"><path class="s-ink" d="M560 440L600 455V490C600 515 585 530 560 540C535 530 520 515 520 490V455Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g></g>
<g id="chhead"><text class="m" x="1020" y="290" font-size="22">GAINING STATE-LIKE POWERS</text></g>
<g id="chips"></g>
<g id="shaky"><text class="d" x="120" y="820" font-size="44">The promise of security starts to look shaky.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pressure two: concentration.</text>
<text class="b" x="120" y="176" font-size="32">The same tools let governments watch whole populations.</text>
<g id="sight"></g>
<g id="tower"><path class="s-ink" d="M220 700L260 400H340L380 700Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="ink" d="M220 330L300 270L380 330Z"/>
<rect class="s-ink" x="230" y="330" width="140" height="70" fill="var(--stage)" stroke-width="6"/><ellipse class="s-ink" cx="300" cy="365" rx="40" ry="20" fill="var(--stage)" stroke-width="4"/><circle id="pupil" class="loss" cx="300" cy="365" r="11"/>
<text class="m" x="300" y="740" font-size="20" text-anchor="middle">THE STATE</text></g>
<g id="cams"></g>
<g id="pop"></g>
<g id="cn"><rect class="s-loss" x="580" y="320" width="860" height="320" rx="60" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="600" y="690" font-size="22">CHINA · A VAST SURVEILLANCE SYSTEM</text></g>
<g id="conc"><text class="d" x="120" y="830" font-size="44">Power can concentrate as easily as it scatters.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pulled two ways at once.</text>
<text class="b" x="120" y="176" font-size="32">Fragility amplifiers stress already weakened institutions.</text>
<path id="rope" class="s-muted" d="M270 380H1350" stroke-width="6" stroke-linecap="round"/>
<g id="tugL"><text class="m" x="120" y="460" font-size="20">MANY SMALL ACTORS</text></g>
<g id="tugR"><text class="m" x="1480" y="490" font-size="20" text-anchor="end">A FEW GIANTS</text></g>
<g id="tugSw"><g id="tugS"><path class="ink" d="M745 340L800 310L855 340Z"/><rect class="s-ink" x="750" y="340" width="100" height="70" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="800" y="445" font-size="20" text-anchor="middle">STATE</text></g></g>
<g id="bridge"><text class="m" x="800" y="575" font-size="22" text-anchor="middle">FRAGILITY AMPLIFIERS</text>
<g id="brw"><rect class="ink" x="260" y="600" width="1080" height="24"/><rect class="ink" x="480" y="624" width="60" height="136"/><rect class="ink" x="1060" y="624" width="60" height="136"/>
<path id="ck0" d="M500 630l18 30-16 28 20 30-14 34" fill="none" stroke="var(--stage)" stroke-width="5" pathLength="1" stroke-dasharray="1 1"/>
<path id="ck1" d="M1084 630l-16 34 20 26-18 32 14 30" fill="none" stroke="var(--stage)" stroke-width="5" pathLength="1" stroke-dasharray="1 1"/></g>
<text class="m" x="510" y="795" font-size="20" text-anchor="middle">DISTRUST</text><text class="m" x="1090" y="795" font-size="20" text-anchor="middle">INEQUALITY</text></g>
<g id="both"><text class="d" x="120" y="852" font-size="38">Not one outcome, but a system wobbling under both.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask one simple question.</text>
<text class="b" x="120" y="176" font-size="32">Who does this powerful new tool hand power to?</text>
<g id="qm"><circle class="s-ink" cx="300" cy="440" r="140" fill="var(--stage)" stroke-width="8"/><text class="d" x="300" y="515" font-size="220" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="scale"><rect class="ink" x="814" y="300" width="12" height="340"/><path class="s-ink" d="M720 640H920" stroke-width="10" stroke-linecap="round"/>
<line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="820" cy="300" r="14"/><g id="pans"></g></g>
<g id="plab"><text class="m" x="600" y="520" font-size="20" text-anchor="middle">A FEW GIANTS</text><text class="m" x="1040" y="520" font-size="20" text-anchor="middle">ANYONE WITH BAD INTENT</text></g>
<g id="ballot"><rect id="paper" class="gain" x="1330" y="300" width="60" height="70"/><rect class="s-ink" x="1260" y="420" width="200" height="160" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1320 420h80" stroke-width="10" stroke-linecap="round"/><path id="chk" class="s-gain" d="M1330 500l20 20 40-40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="blab"><text class="m" x="1360" y="630" font-size="20" text-anchor="middle">BACK LEADERS WHO</text><text class="m" x="1360" y="660" font-size="20" text-anchor="middle">TAKE IT SERIOUSLY</text></g>
<g id="ask"><text class="d" x="120" y="800" font-size="40">A few giants, or anyone with bad intentions?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which promise from your</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">state would you most</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">hate to <tspan style="fill:var(--gain)">lose?</tspan></text></g>
<g id="q2"><text class="m" x="143" y="700" font-size="26">AND WHAT WOULD YOU DO TO PROTECT IT?</text></g>
<g id="face"><circle class="s-ink" cx="1340" cy="720" r="64" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1318" cy="708" r="6"/><circle class="ink" cx="1362" cy="708" r="6"/>
