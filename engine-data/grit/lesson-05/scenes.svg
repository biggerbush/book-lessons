<text class="m" x="480" y="744" font-size="20" text-anchor="middle">MORE GRIT →</text>
<text class="m" x="170" y="480" font-size="18" text-anchor="middle" transform="rotate(-90 170 480)">DRIVE FOR A MEANINGFUL, OTHER-FOCUSED LIFE</text>
<text class="m" x="750" y="680" font-size="18" text-anchor="end">ILLUSTRATION</text></g>
