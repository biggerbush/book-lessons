<g id="nb"><rect x="620" y="270" width="420" height="400" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="rings"></g><text class="m" x="660" y="340" font-size="20">1. NAME THE INCENTIVE</text><path id="l7a" class="s-gain" d="M660 400q42-14 85 0t85 0t85 0t85 0" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="400"/><text class="m" x="660" y="480" font-size="20">2. WHAT IF IT WINS?</text><path id="l7b" class="s-loss" d="M660 540q42-14 85 0t85 0t85 0t85 0" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="400"/><text class="m" x="830" y="750" font-size="22" text-anchor="middle">NAME IT, ASK</text></g>
<g id="eye7"><g id="eyi"><path d="M1120 470q150-130 300 0q-150 130-300 0z" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle class="gain" cx="1270" cy="470" r="46"/><circle class="ink" cx="1270" cy="470" r="16"/></g><text class="m" x="1270" y="750" font-size="22" text-anchor="middle">CLEAR EYES</text></g>
<g id="clr7"><text class="d" x="120" y="825" font-size="38">Clear eyes are not doom. They are the start of control.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="76" letter-spacing="-2">Where in your own work are</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="76" letter-spacing="-2">incentives quietly pushing</text></g>
<g id="qc"><text class="d" x="136" y="480" font-size="76" letter-spacing="-2">you past risks you would</text></g>
<g id="qd"><text class="d" x="136" y="570" font-size="76" letter-spacing="-2" style="fill:var(--gain)">rather not think about?</text></g>
<g id="lab8"><text class="m" x="143" y="700" font-size="26">NAME THE INCENTIVE. FACE THE RISK.</text><g id="g8"></g></g>
