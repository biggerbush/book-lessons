<rect class="s-line" x="550" y="660" width="360" height="14" rx="7" fill="none" stroke-width="3"/><rect id="vbar" class="gain" x="550" y="660" width="0" height="14" rx="7"/><text class="m" x="550" y="710" font-size="20">ONE MINUTE</text></g>
<g id="vr0"><path class="s-loss" d="M558 368l24 24m0-24-24 24" stroke-width="7" stroke-linecap="round"/><rect x="610" y="372" width="280" height="16" rx="8" fill="var(--line)"/></g>
<g id="vr1"><path class="s-loss" d="M558 448l24 24m0-24-24 24" stroke-width="7" stroke-linecap="round"/><rect x="610" y="452" width="250" height="16" rx="8" fill="var(--line)"/></g>
<g id="vr2"><path class="s-loss" d="M558 528l24 24m0-24-24 24" stroke-width="7" stroke-linecap="round"/><rect x="610" y="532" width="270" height="16" rx="8" fill="var(--line)"/></g>
<g id="cm0"><rect class="s-ink" x="1030" y="280" width="450" height="90" rx="22" fill="var(--stage)" stroke-width="4"/><text class="m" x="1255" y="332" font-size="20" text-anchor="middle">I CAN USE THIS TODAY</text></g>
<g id="cm1"><rect class="gain" x="1030" y="420" width="450" height="90" rx="22"/><text class="m" x="1255" y="472" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">WHAT WOULD COACHING DO?</text></g>
<g id="viewers"><text class="m" x="1255" y="760" font-size="20" text-anchor="middle">VIEWERS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start on one platform.</text>
<text class="b" x="120" y="176" font-size="32">Post more, then post better, and only then expand.</text>
<g id="plat"><circle class="gain" cx="300" cy="420" r="120"/><text class="d" x="300" y="434" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">ONE</text><text class="m" x="300" y="590" font-size="22" text-anchor="middle">ONE PLATFORM</text></g>
<g id="ghosts"><circle cx="160" cy="680" r="40" fill="none" stroke-width="4" stroke-dasharray="8 8"/><circle cx="300" cy="700" r="40" fill="none" stroke-width="4" stroke-dasharray="8 8"/><circle cx="440" cy="680" r="40" fill="none" stroke-width="4" stroke-dasharray="8 8"/></g>
<g id="st0"><rect class="s-ink" x="680" y="250" width="250" height="160" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="700" y="296" font-size="20">1 · POST MORE</text><g id="sqs"></g></g>
<g id="st1"><rect class="s-ink" x="950" y="250" width="250" height="160" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="970" y="296" font-size="20">2 · POST BETTER</text><rect class="s-line" x="970" y="330" width="210" height="36" rx="8" fill="none" stroke-width="3"/><rect id="qbar" class="gain" x="970" y="330" width="0" height="36" rx="8"/></g>
<g id="st2"><rect class="s-ink" x="1220" y="250" width="250" height="160" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="1240" y="296" font-size="20">3 · EXPAND</text><g id="exps"></g></g>
<g id="months"></g>
<text id="calL" class="m" x="680" y="790" font-size="22">CONSISTENCY OVER MONTHS, NOT A FEW VIRAL POSTS</text>
</g>

