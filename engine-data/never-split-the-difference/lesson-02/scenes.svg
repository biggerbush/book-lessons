<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Mirror them</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and slow down.</text>
<text class="b" x="120" y="600" font-size="32">Repeat their last words, slow down, and let them talk.</text>
<g id="t0p"></g>
<g id="t0a"><path class="s-ink" d="M1100 284l12 40 24-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-ink" x="1000" y="210" width="230" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="m" x="1115" y="257" font-size="20" text-anchor="middle">…LAST 3 WORDS</text></g>
