<text class="m" x="230" y="590" font-size="22" text-anchor="middle">FOOD</text>
<text class="m" x="450" y="590" font-size="22" text-anchor="middle">SLEEP</text>
<text class="m" x="670" y="590" font-size="22" text-anchor="middle">HEALTH</text>
</g>
<g id="imp">
<rect class="s-gain" x="900" y="240" width="200" height="300" rx="14" fill="none" stroke-width="6"/>
<rect id="f3" class="gain" x="910" y="530" width="180" height="0" rx="6"/>
<text class="m" x="1000" y="590" font-size="22" text-anchor="middle">TO FEEL IMPORTANT</text>
<text class="m" x="1000" y="622" font-size="20" text-anchor="middle" style="fill:var(--gain)">ALMOST NEVER SATISFIED</text>
<path class="gain" d="M1230 290h160v70a80 80 0 0 1-160 0z"/>
<path class="s-gain" d="M1230 310h-36v24a40 40 0 0 0 40 40M1390 310h36v24a40 40 0 0 1-40 40" fill="none" stroke-width="8" stroke-linecap="round"/>
<rect class="gain" x="1295" y="436" width="30" height="40"/>
<rect class="gain" x="1250" y="474" width="120" height="24" rx="6"/>
</g>
<g id="jq">
<text class="d5" x="120" y="700" font-size="42">“The deepest principle in human nature</text>
<text class="d5" x="120" y="754" font-size="42">is the <tspan style="fill:var(--gain)">craving to be appreciated</tspan>.”</text>
<text class="m" x="120" y="808" font-size="22">WILLIAM JAMES</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Twenty years. Not one word.</text>
<text class="b" x="120" y="176" font-size="32">A farm woman, her family, and a pile of hay.</text>
