<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Do fewer things,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and do them well.</text>
<text class="b" x="120" y="600" font-size="32">Why taking on less helps you accomplish more</text>
<path class="s-line" d="M1080 768h360" stroke-width="5" stroke-linecap="round"/>
<g id="stack"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Austen myth.</text>
<text class="b" x="120" y="176" font-size="32">Writing in secret, in a busy family sitting room.</text>
<path class="s-line" d="M120 700H1480" stroke-width="4"/>
<g id="aus"><g id="ausP"></g>
<rect class="ink" x="480" y="566" width="300" height="18" rx="4"/>
<path class="s-ink" d="M500 584V700M760 584V700" stroke-width="7" stroke-linecap="round"/>
<rect class="s-ink" x="662" y="476" width="80" height="90" fill="var(--stage)" stroke-width="4"/>
<path class="s-line" d="M676 500h52M676 520h52M676 540h36" stroke-width="4" stroke-linecap="round"/></g>
<g id="fam"><g id="famP"></g><rect x="870" y="589" width="340" height="50" rx="14" fill="var(--line)"/><text class="m" x="1040" y="740" font-size="18" text-anchor="middle">FAMILY</text></g>
<g id="bub"></g>
<g id="door"><rect class="s-ink" x="1290" y="420" width="150" height="280" fill="none" stroke-width="6"/><g id="visP"></g><text class="m" x="1365" y="740" font-size="18" text-anchor="middle">VISITOR</text></g>
<g id="hide"><rect class="ink" x="654" y="468" width="96" height="98" rx="6"/><text class="m" x="702" y="740" font-size="18" text-anchor="middle">PAGES HIDDEN</text></g>
<g id="m1"><text class="d" x="120" y="800" font-size="46">Great work can squeeze into any crowded day?</text></g>
<g id="m2"><text class="m" x="120" y="850" font-size="22" style="fill:var(--loss)">BUT THE STORY LEAVES SOMETHING OUT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A quieter cottage.</text>
<text class="b" x="120" y="176" font-size="32">Chawton: the same genius, a lighter load.</text>
<g id="cot">
<rect class="s-ink" x="180" y="430" width="280" height="210" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M160 430L320 300L480 430Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="ink" x="295" y="540" width="50" height="100"/>
<rect class="s-ink" x="205" y="465" width="70" height="60" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="365" y="465" width="70" height="60" fill="var(--stage)" stroke-width="5"/>
<circle class="gain" cx="240" cy="497" r="16"/>
<text class="m" x="320" y="680" font-size="20" text-anchor="middle">CHAWTON</text></g>
<g id="ch0"><rect x="540" y="330" width="320" height="60" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="700" y="367" font-size="20" text-anchor="middle" style="fill:var(--loss)">HOUSEHOLD DUTIES</text></g>
<g id="ch1"><rect x="540" y="430" width="320" height="60" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="700" y="467" font-size="20" text-anchor="middle" style="fill:var(--loss)">SOCIAL OBLIGATIONS</text></g>
<g id="free"><rect class="gain" x="540" y="540" width="320" height="60" rx="30"/><text class="m" x="700" y="577" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">TIME TO WRITE</text></g>
<path class="s-ink" d="M900 640H1450" stroke-width="7" stroke-linecap="round"/>
<g id="books"></g>
<text class="m" x="900" y="680" font-size="20">NOVELS, IN QUICK SUCCESSION</text>
<g id="g1"><text class="d" x="120" y="790" font-size="46">Her genius did not change.</text></g>
<g id="g2"><text class="d" x="820" y="790" font-size="46" style="fill:var(--gain)">Her load did.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The overhead tax.</text>
<text class="b" x="120" y="176" font-size="32">Every commitment carries a hidden cost.</text>
<g id="gauge">
<path class="s-line" d="M170 560A160 160 0 0 1 490 560" fill="none" stroke-width="22" stroke-linecap="round"/>
<path id="garc" class="s-loss" d="M170 560A160 160 0 0 1 490 560" fill="none" stroke-width="22"/>
<line id="ndl" class="s-ink" x1="330" y1="560" x2="200" y2="560" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="330" cy="560" r="16"/>
<text class="m" x="330" y="620" font-size="22" text-anchor="middle">OVERHEAD TAX</text></g>
<g id="proj"><rect class="gain" x="760" y="410" width="300" height="120" rx="16"/><text class="m" x="910" y="478" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THE PROJECT</text></g>
<g id="ovh"></g>
<g id="notp"><path class="s-muted" d="M1110 670h330" stroke-width="4" stroke-linecap="round"/><text class="m" x="1110" y="710" font-size="20">NOT THE PROJECT ITSELF</text></g>
<g id="price"><text class="d" x="120" y="810" font-size="46">It’s the price of keeping the project alive.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">When taxes stack up.</text>
<text class="b" x="120" y="176" font-size="32">Coordination grows with every project you add.</text>
<text class="m" x="120" y="270" font-size="20">PROJECTS</text>
<g id="pj"></g>
<g id="bar">
<text class="m" x="120" y="440" font-size="20">YOUR WORKDAY</text>
<rect id="ov" class="loss" x="120" y="460" width="0" height="120"/>
<rect id="rw" class="gain" x="120" y="460" width="1060" height="120"/>
<rect class="s-ink" x="120" y="460" width="1060" height="120" fill="none" stroke-width="5"/>
<rect class="gain" x="120" y="618" width="28" height="28"/><text class="m" x="162" y="640" font-size="20">REAL WORK</text>
<rect class="loss" x="360" y="618" width="28" height="28"/><text class="m" x="402" y="640" font-size="20">OVERHEAD</text></g>
<g id="evg"><text class="m" x="1220" y="440" font-size="20">EVENINGS</text>
<rect id="ev" class="gain" x="1220" y="460" width="0" height="120" fill-opacity=".7"/>
<rect class="s-muted" x="1220" y="460" width="260" height="120" fill="none" stroke-width="4" stroke-dasharray="10 10"/></g>
<g id="push"><text class="d" x="120" y="790" font-size="46">The real work gets pushed into evenings.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The overload trap.</text>
<text class="b" x="120" y="176" font-size="32">Slow projects linger while new requests keep arriving.</text>
<ellipse class="s-ink" cx="800" cy="710" rx="240" ry="36" fill="var(--stage)" stroke-width="6"/>
<g id="pile"></g>
<g id="nreq"><text class="m" x="960" y="290" font-size="20" style="fill:var(--loss)">NEW REQUESTS</text><path class="s-loss" d="M1000 304c-40 0-70 16-92 46M908 350l2-22M908 350l20-8" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="snw"><g id="snail">
<rect class="ink" x="-80" y="26" width="150" height="18" rx="9"/>
<path class="s-ink" d="M60 30l14-30M66 32l24-24" fill="none" stroke-width="4" stroke-linecap="round"/>
<circle class="s-ink" cx="-10" cy="0" r="36" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M-28 0a18 18 0 1 1 18 18" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<text class="m" x="120" y="800" font-size="20">EVERY PROJECT MOVES SLOWLY</text></g>
<g id="stress"><g id="strP"></g>
<circle cx="1262" cy="430" r="6" fill="var(--stage)"/><circle cx="1298" cy="430" r="6" fill="var(--stage)"/>
<path d="M1260 470q20-16 40 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/>
<path id="drop" class="loss" d="M1350 380q12 16 0 24q-12-8 0-24z"/></g>
<g id="exh"><text class="m" x="1280" y="700" font-size="20" text-anchor="middle">CAPABLE, AND EXHAUSTED</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fewer, faster, better.</text>
<text class="b" x="120" y="176" font-size="32">Less overhead, more attention on the work itself.</text>
<g id="shr"><text class="m" x="340" y="240" font-size="20" style="fill:var(--loss)">OVERHEAD SHRINKS</text></g>
<g id="lanes"></g>
<g id="gem">
<polygon class="gain" points="1230,400 1260,360 1340,360 1370,400 1300,500"/>
<path d="M1230 400h140M1280 360l-10 40 30 100 30-100-10-40" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linejoin="round"/>
<text class="m" x="1300" y="560" font-size="20" text-anchor="middle">REAL THOUGHT</text></g>
<g id="soon"><text class="d" x="120" y="760" font-size="44">Finish sooner: as much, or more, over a year.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">Count the cost before you say yes.</text>
<text class="b" x="120" y="176" font-size="32">Picture the meetings and messages, not just the work.</text>
<g id="req"><rect class="s-ink" x="120" y="250" width="360" height="230" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="150" y="300" font-size="22">NEW REQUEST</text>
<path class="s-line" d="M150 350h280M150 395h280M150 440h180" stroke-width="8" stroke-linecap="round"/></g>
<g id="tag"><g id="tagS"><path class="s-ink" d="M440 480q12 26 6 50" fill="none" stroke-width="3"/>
<path d="M420 530l30-26h170v52h-170z" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<circle class="loss" cx="446" cy="530" r="6"/>
<text class="m" x="470" y="537" font-size="20" style="fill:var(--loss)">OVERHEAD?</text></g></g>
<g id="cal"><rect class="s-ink" x="700" y="240" width="780" height="420" rx="16" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M700 300H1480" stroke-width="4"/><g id="days"></g><g id="blk"></g></g>
<g id="leg"><text class="m" x="700" y="700" font-size="20" style="fill:var(--loss)">MEETINGS + MESSAGES</text><text class="m" x="1150" y="700" font-size="20" style="fill:var(--gain)">THE WORK ITSELF</text></g>
<g id="no"><rect class="gain" x="120" y="600" width="420" height="96" rx="48"/>
<text class="d" x="330" y="663" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">A polite no.</text>
<text class="m" x="120" y="745" font-size="20">PROTECTS EVERYTHING ELSE</text><text class="m" x="120" y="777" font-size="20">YOU CARE ABOUT</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What’s one commitment</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you could finish, hand off,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">or <tspan style="fill:var(--gain)">drop</tspan> this week?</text></g>
<g id="lab1"><text class="m" x="143" y="700" font-size="26">PICK ONE: FINISH · HAND OFF · DROP</text></g>
<g id="lab2"><text class="m" x="143" y="760" font-size="22" style="fill:var(--gain)">THEN NOTICE HOW MUCH LIGHTER THE REST FEELS</text></g>
<g id="list"><rect class="s-ink" x="1060" y="580" width="380" height="200" rx="16" fill="var(--stage)" stroke-width="5"/><g id="lines"></g></g>
<g id="scw"><g id="sc">
<circle class="s-ink" cx="0" cy="-14" r="12" fill="none" stroke-width="5"/><circle class="s-ink" cx="0" cy="14" r="12" fill="none" stroke-width="5"/>
<path id="sb1" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/><path id="sb2" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/></g></g>
</g>