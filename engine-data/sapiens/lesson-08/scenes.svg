<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 8</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Discovery</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Ignorance.</text>
<text class="b" x="120" y="600" font-size="32">How saying we do not know launched the modern world.</text>
<rect class="s-ink" x="1080" y="230" width="380" height="330" rx="10" fill="var(--stage)" stroke-width="6"/>
<path id="t_land" d="M1086 236H1190C1220 300 1170 340 1200 400C1230 460 1180 500 1210 554H1086Z" fill="var(--line)" class="s-ink" stroke-width="5" stroke-linejoin="round"/>
<g id="t_blank"><rect class="s-muted" x="1250" y="256" width="186" height="280" rx="8" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text id="t_q" class="d" x="1343" y="450" font-size="150" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="t_words"><text class="m" x="1270" y="620" font-size="28" text-anchor="middle" style="fill:var(--gain)">WE DO NOT KNOW.</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everything was already known.</text>
<text class="b" x="120" y="176" font-size="32">Answers lived in sacred texts and the words of ancient sages.</text>
<g id="scr">
<rect class="s-ink" x="160" y="260" width="340" height="300" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="140" y="240" width="380" height="32" rx="16"/><rect class="ink" x="140" y="548" width="380" height="32" rx="16"/>
<g id="scrl"></g>
<text class="m" x="330" y="620" font-size="20" text-anchor="middle">SACRED TEXTS</text>
</g>
<g id="silent"><text class="m" x="140" y="680" font-size="20" style="fill:var(--loss)">IF THE TEXTS WERE SILENT,</text><text class="m" x="140" y="712" font-size="20" style="fill:var(--loss)">THE QUESTION DIDN’T MATTER</text></g>
<g id="sage"><g id="sagep"></g><path class="s-ink" d="M910 300V560" stroke-width="7" stroke-linecap="round"/><text class="m" x="820" y="600" font-size="20" text-anchor="middle">PRIEST · SCHOLAR</text></g>
<g id="vill"><g id="villp"></g><circle class="s-ink" cx="1316" cy="314" r="36" fill="var(--stage)" stroke-width="5"/><text id="vq" class="d" x="1316" y="330" font-size="44" text-anchor="middle">?</text><text class="m" x="1240" y="600" font-size="20" text-anchor="middle">VILLAGER</text></g>
<g id="varr"><path class="s-muted" d="M1190 640Q1030 740 870 640" fill="none" stroke-width="5" stroke-dasharray="10 10"/><path class="s-muted" d="M894 636L870 640L882 662" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1030" y="740" font-size="20" text-anchor="middle">ASKS</text></g>
<g id="flask"><g transform="translate(-60 -80)"><path class="s-ink" d="M1385 700v40l-30 60h90l-30-60v-40z" fill="none" stroke-width="5" stroke-linejoin="round"/><path class="s-loss" d="M1345 705L1455 815M1455 705L1345 815" stroke-width="7" stroke-linecap="round"/><text class="m" x="1480" y="850" font-size="20" text-anchor="end">NO EXPERIMENT</text></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Science starts the other way.</text>
<text class="b" x="120" y="176" font-size="32">It admits we do not know the most important things.</text>
<g id="nb"><rect class="s-ink" x="140" y="260" width="480" height="340" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M380 260v340" stroke-width="5"/><g id="nbl"></g><text class="m" x="140" y="640" font-size="20">MODERN SCIENCE</text></g>
<g id="nbw"><text class="d" x="404" y="400" font-size="40" style="fill:var(--gain)">We do</text><text class="d" x="404" y="450" font-size="40" style="fill:var(--gain)">not know.</text></g>
<g id="qmw"><text id="qmt" class="d" x="800" y="580" font-size="300" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="thy"><rect class="s-ink" x="980" y="270" width="460" height="170" rx="16" fill="var(--stage)" stroke-width="5" stroke-dasharray="14 10"/><text class="m" x="1010" y="330" font-size="22">FAVOURITE THEORY</text><text class="d5" x="1010" y="400" font-size="40">Open to challenge</text></g>
<g id="evd"><path class="s-gain" d="M1210 560V460m-18 18 18-18 18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1210" y="600" font-size="20" text-anchor="middle">NEW EVIDENCE</text></g>
<g id="emb"><text class="d5" x="140" y="770" font-size="44" style="fill:var(--loss)">Embarrassment</text></g>
<line id="embS" class="s-ink" x1="130" y1="755" x2="130" y2="755" stroke-width="5" stroke-linecap="round"/>
<g id="inv"><path class="s-muted" d="M500 755h80m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="620" y="775" font-size="56" style="fill:var(--gain)">Invitation.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Old maps were never empty.</text>
<text class="b" x="120" y="176" font-size="32">Harari shows the shift through maps.</text>
<g id="m3"><rect class="s-ink" x="160" y="220" width="1280" height="480" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M680 380C740 320 880 330 920 390C960 450 900 560 820 570C720 580 640 450 680 380Z" fill="var(--line)" stroke-width="5"/>
<text class="m" x="800" y="472" font-size="24" text-anchor="middle" style="fill:var(--ink)">KNOWN</text></g>
<g id="l3a"><path class="loss" d="M190 560c60-30 120 0 140 60l-10 60H190z" fill-opacity=".35"/><path class="loss" d="M1300 240h120v120c-40 10-90-20-110-60z" fill-opacity=".35"/><path class="loss" d="M560 690c20-50 120-60 160 0z" fill-opacity=".35"/></g>
<g id="mons3"></g>
<g id="cap3"><text class="m" x="120" y="790" font-size="22">WHERE KNOWLEDGE RAN OUT, THEY FILLED THE EDGES</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then came the blank spaces.</text>
<text class="b" x="120" y="176" font-size="32">From the 15th century, European mapmakers left areas empty.</text>
<rect class="s-ink" x="160" y="220" width="1280" height="500" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M166 226H520C560 320 480 400 540 480C600 560 520 640 560 714H166Z" fill="var(--line)" stroke-width="5" stroke-linejoin="round"/>
<g id="blank4"><rect class="s-muted" x="760" y="260" width="640" height="420" rx="10" fill="none" stroke-width="4" stroke-dasharray="12 12"/></g>
<g id="conf4"><text class="m" x="1080" y="400" font-size="24" text-anchor="middle">WE HAVE NOT</text><text class="m" x="1080" y="436" font-size="24" text-anchor="middle">BEEN THERE YET</text></g>
<path id="wake" class="s-gain" fill="none" stroke-width="4" stroke-dasharray="8 10"/>
<g id="ship4"></g>
<g id="beg4"><text class="d" x="120" y="800" font-size="44">An empty space begs to be filled.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Columbus got it wrong.</text>
<text class="b" x="120" y="176" font-size="32">In 1492 he crossed the Atlantic and believed he had reached Asia.</text>
<rect class="loss" x="160" y="300" width="1280" height="300" fill-opacity=".12"/>
<path class="s-ink" d="M160 300h150c30 60-20 100 20 160s-10 100 10 140H160z" fill="var(--line)" stroke-width="5"/>
<path class="s-ink" d="M1440 300h-160c-40 60 20 120-30 170s40 90 20 130h170z" fill="var(--line)" stroke-width="5"/>
<text class="m" x="180" y="462" font-size="22" style="fill:var(--ink)">EUROPE</text>
<g id="route5"><path class="s-gain" d="M330 450Q800 300 1260 450" fill="none" stroke-width="5" stroke-dasharray="10 10"/><text class="d" x="800" y="560" font-size="40" text-anchor="middle">1492</text></g>
<g id="ship5"></g>
<g id="asia"><text class="d" x="1360" y="272" font-size="40" text-anchor="middle" style="fill:var(--gain)">“Asia”</text></g>
<g id="lock5"><rect class="ink" x="1218" y="246" width="44" height="34" rx="6"/><path class="s-ink" d="M1228 248v-12a12 12 0 0 1 24 0v12" fill="none" stroke-width="6"/><text class="m" x="1440" y="640" font-size="20" text-anchor="end">FOR THE REST OF HIS LIFE</text></g>
<g id="room5"><text class="d" x="120" y="740" font-size="40">No room for a continent</text><text class="d" x="120" y="795" font-size="40">nobody had predicted.</text>
<rect class="s-ink" x="1060" y="664" width="380" height="126" rx="10" fill="var(--stage)" stroke-width="5"/>
<path class="ink" d="M1066 670h64c-10 36 10 64 0 114h-64z"/><path class="ink" d="M1434 670h-64c10 36-10 64 0 114h64z"/>
<text class="m" x="1250" y="734" font-size="20" text-anchor="middle" style="fill:var(--ink)">HIS MENTAL MAP</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Named for a doubter.</text>
<text class="b" x="120" y="176" font-size="32">Amerigo Vespucci suggested an entirely unknown continent.</text>
<g id="vesp"><g id="vespp"></g><text class="m" x="260" y="600" font-size="20" text-anchor="middle">AMERIGO VESPUCCI</text></g>
<g id="bub6"><rect class="s-ink" x="380" y="240" width="340" height="90" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M410 330l-40 40 70-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="550" y="278" font-size="22" text-anchor="middle">AN UNKNOWN</text><text class="m" x="550" y="310" font-size="22" text-anchor="middle">CONTINENT?</text></g>
<g id="map6"><rect class="s-ink" x="800" y="240" width="640" height="420" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1180 600q30-14 60 0t60 0M1260 300q30-14 60 0t60 0" fill="none" stroke-width="4"/></g>
<g id="amer"><path class="gain" d="M900 300L1080 290L1110 360L1020 450L990 480L950 430L880 360Z"/><path class="gain" d="M1020 500L1090 520L1110 580L1060 640L1040 640L1010 560Z"/></g>
<g id="lab6"><text class="d" x="1180" y="460" font-size="44">America</text><text class="m" x="1180" y="505" font-size="24">1507</text></g>
<g id="hon6"><text class="d" x="120" y="760" font-size="44">A whole continent honours a man</text><text class="d" x="120" y="815" font-size="44">who admitted, <tspan style="fill:var(--gain)">we did not know.</tspan></text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then they paid to find out.</text>
<text class="b" x="120" y="176" font-size="32">Rulers, merchants and scholars hoped new knowledge meant new power.</text>
<g id="st1"><path class="s-ink" d="M280 420L230 560M280 420L330 560M280 420V560" stroke-width="6" stroke-linecap="round"/><g transform="rotate(-25 280 400)"><rect class="ink" x="200" y="380" width="170" height="40" rx="8"/><rect class="ink" x="180" y="388" width="24" height="24" rx="4"/></g><text class="m" x="280" y="620" font-size="20" text-anchor="middle">ADMIT IGNORANCE</text></g>
<g id="st2"><path class="s-muted" d="M420 440h120m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="gain" d="M760 330h80l-20 30c70 30 90 160 30 190h-100c-60-30-40-160 30-190z"/><g id="coins"></g><g id="fund"></g></g>
<g id="st3"><path class="s-muted" d="M1000 440h120m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-ink" d="M1280 400v-30h80v30" fill="none" stroke-width="8" stroke-linejoin="round"/><rect class="ink" x="1220" y="400" width="200" height="130" rx="10"/><rect class="gain" x="1300" y="440" width="40" height="24" rx="4"/><g id="sp7"></g><text class="m" x="1320" y="620" font-size="20" text-anchor="middle">NEW ABILITIES</text></g>
<g id="ask7"><text class="d5" x="120" y="770" font-size="40" style="fill:var(--muted)">What is true?</text><path class="s-muted" d="M420 757h70m-18-18 18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="530" y="772" font-size="48" style="fill:var(--gain)">What can discovery unlock?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="88" letter-spacing="-2">Where are you filling</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">the blank edges with</text></g>
<g id="qc"><text class="d" x="136" y="550" font-size="88" letter-spacing="-2">confident <tspan style="fill:var(--loss)">monsters</tspan>?</text></g>
<g id="go8"><text class="m" x="143" y="660" font-size="26">THIS WEEK: SAY “I DO NOT KNOW” OUT LOUD,</text><text class="m" x="143" y="700" font-size="26" style="fill:var(--gain)">THEN GO AND FIND OUT.</text></g>
<g id="fo8"><g transform="translate(0 -70)"><rect class="s-ink" x="1100" y="600" width="360" height="240" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1106 606h90c-20 60 20 140-10 228h-80z" fill="var(--line)" stroke-width="4"/><rect class="s-muted" x="1240" y="620" width="200" height="200" rx="8" fill="none" stroke-width="4" stroke-dasharray="10 10"/><g id="mon8"></g><text id="q8" class="d" x="1340" y="770" font-size="120" text-anchor="middle" style="fill:var(--gain)">?</text></g></g>
</g>