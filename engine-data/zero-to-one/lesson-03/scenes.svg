<g id="s0">
<text class="m" x="120" y="150" font-size="28">ZERO TO ONE · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Plan a definite</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">future.</text>
<text class="b" x="120" y="600" font-size="32">Why the future rewards people who plan, not people who wait.</text>
<g id="tk"><rect x="1000" y="210" width="280" height="160" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><path class="s-loss" d="M1070 220V360" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="1090" y="250" font-size="20">LOTTERY</text><text class="d" x="1200" y="348" font-size="96" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="bp"><rect x="1160" y="400" width="320" height="200" rx="10" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/><g id="bpg"></g><text class="m" x="1180" y="438" font-size="18" style="fill:var(--gain)">BLUEPRINT</text><path class="s-gain" d="M1220 572V466h110v38h90v68z" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The lottery mindset.</text>
<text class="b" x="120" y="176" font-size="32">Success is luck, so why plan?</text>
<g id="lt"><rect class="s-ink" x="120" y="240" width="480" height="260" rx="16" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M260 250V490" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="290" y="300" font-size="22">LOTTERY</text><g id="lts"></g></g>
<g id="lk"><text class="m" x="120" y="560" font-size="22">SUCCESS = MOSTLY LUCK</text><rect class="s-ink" x="120" y="600" width="300" height="200" rx="12" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M160 650h200M160 700h220M160 750h150" stroke-width="6" stroke-linecap="round"/><path class="s-loss" d="M150 620l240 160M390 620l-240 160" stroke-width="10" stroke-linecap="round"/><text class="m" x="460" y="690" font-size="20">PLANNING</text><text class="m" x="460" y="722" font-size="20">SEEMS POINTLESS</text></g>
<g id="drs"></g>
<g id="pw"><text id="qm" class="d" x="1175" y="600" font-size="44" style="fill:var(--loss)">?</text><text class="m" x="780" y="830" font-size="20">KEEP EVERY OPTION OPEN · WAIT AND SEE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two big questions.</text>
<text class="b" x="120" y="176" font-size="32">How Thiel sorts attitudes about the future.</text>
<g id="q2"></g>
<g id="sc2"><circle class="ink" cx="700" cy="242" r="18" fill-opacity=".45"/><circle class="ink" cx="724" cy="230" r="22" fill-opacity=".45"/><circle class="ink" cx="748" cy="242" r="18" fill-opacity=".45"/><text class="m" x="790" y="252" font-size="22">WORSE</text><circle class="gain" cx="1140" cy="236" r="18"/><g id="sun"></g><text class="m" x="1190" y="252" font-size="22">BETTER</text></g>
<g id="bpa"><rect x="140" y="340" width="150" height="110" rx="8" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path class="s-gain" d="M170 425V370h50v25h40v30z" fill="none" stroke-width="4"/><text class="m" x="320" y="390" font-size="22" style="fill:var(--gain)">DEFINITE</text><text class="m" x="320" y="422" font-size="18">CAN BE PLANNED</text></g>
<g id="bpb"><g id="fz"></g><text class="m" x="320" y="650" font-size="22">INDEFINITE</text><text class="m" x="320" y="682" font-size="18">BLURRY, UNKNOWABLE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four mindsets.</text>
<text class="b" x="120" y="176" font-size="32">Where Thiel places the big powers.</text>
<g id="q3"></g>
<g id="lab3"><text class="m" x="800" y="256" font-size="22" text-anchor="middle">PESSIMISTIC</text><text class="m" x="1200" y="256" font-size="22" text-anchor="middle">OPTIMISTIC</text><text class="m" x="580" y="418" font-size="20" text-anchor="end">DEFINITE</text><text class="m" x="580" y="678" font-size="20" text-anchor="end">INDEFINITE</text></g>
<g id="cn"><path class="s-ink" d="M640 320V500" stroke-width="6" stroke-linecap="round"/><rect class="loss" x="640" y="320" width="120" height="80"/><text class="d5" x="790" y="390" font-size="40">China</text><text class="m" x="790" y="430" font-size="18">PLANS HARD,</text><text class="m" x="790" y="458" font-size="18">FEARS FUTURE</text></g>
<g id="eu"><path class="loss s-loss" d="M650 640c20-30 60-30 80-10s40 0 50 30-10 50-40 60-60 10-80-10-30-50-10-70z" fill-opacity=".45" stroke-width="5"/><text class="d5" x="790" y="650" font-size="40">Europe</text><text class="m" x="790" y="690" font-size="18">DRIFTING,</text><text class="m" x="790" y="718" font-size="18">EXPECTS DECLINE</text></g>
<g id="us"><path class="s-ink" d="M1040 580V760" stroke-width="6" stroke-linecap="round"/><rect class="s-ink" x="1040" y="580" width="120" height="80" fill="var(--stage)" stroke-width="4"/><g id="usf"></g><rect class="ink" x="1040" y="580" width="48" height="40"/><text class="d5" x="1190" y="650" font-size="40">America</text><text class="m" x="1190" y="690" font-size="18">HOPEFUL,</text><text class="m" x="1190" y="718" font-size="18">NO PLAN</text></g>
<g id="dfo"><rect class="gain" x="1003" y="283" width="394" height="254" fill-opacity=".2"/><g id="dfs"></g><text class="d5" x="1190" y="380" font-size="40">Definite</text><text class="d5" x="1190" y="426" font-size="40">optimism</text><text class="m" x="1190" y="470" font-size="18">THE ONE HE</text><text class="m" x="1190" y="496" font-size="18">WANTS BACK</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">America used to plan.</text>
<text class="b" x="120" y="176" font-size="32">Mid twentieth century: definite optimism.</text>
<g id="br4"><path class="s-gain" d="M160 272v-16h840v16" fill="none" stroke-width="5"/><text class="m" x="580" y="240" font-size="20" text-anchor="middle" style="fill:var(--gain)">DEFINITELY OPTIMISTIC</text></g>
<path class="s-line" d="M120 720H1480" stroke-width="5"/>
<g id="rk"><g id="rkb"><path id="fl" class="gain" d="M280 640q20 70 40 0z"/><path class="s-ink" d="M300 320c40 40 50 100 40 170v150h-80V490c-10-70 0-130 40-170z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="300" cy="440" r="18"/><path class="ink" d="M260 560l-40 80h40zM340 560l40 80h-40z"/></g><rect class="ink" x="220" y="706" width="160" height="14"/><text class="m" x="300" y="780" font-size="20" text-anchor="middle">APOLLO PROGRAM</text></g>
<g id="hw"><polygon points="600,720 960,720 800,420 760,420" fill="var(--line)"/><path class="s-ink" d="M600 720L760 420M960 720L800 420" stroke-width="5" stroke-linecap="round"/><line id="hwd" x1="780" y1="715" x2="780" y2="715" stroke="var(--gain)" stroke-width="6" stroke-dasharray="24 18"/><text class="m" x="780" y="780" font-size="20" text-anchor="middle">INTERSTATE HIGHWAYS</text><text class="m" x="780" y="810" font-size="18" text-anchor="middle">BUILT OVER DECADES</text></g>
<g id="bk"><path class="s-muted" d="M1060 300V760" stroke-width="3" stroke-dasharray="8 10"/><text class="m" x="1080" y="320" font-size="20">LATER</text><path class="ink" d="M1160 420L1300 350L1440 420z"/><rect class="ink" x="1160" y="420" width="280" height="20"/><g id="cols"></g><rect class="ink" x="1150" y="690" width="300" height="30"/><g id="coins"></g><text class="m" x="1300" y="780" font-size="20" text-anchor="middle" style="fill:var(--loss)">FINANCE</text><text class="m" x="1300" y="810" font-size="18" text-anchor="middle">MONEY MOVES AROUND</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The well-rounded trap.</text>
<text class="b" x="120" y="176" font-size="32">Collecting options instead of mastering anything.</text>
<g id="rs"><rect class="s-ink" x="120" y="230" width="400" height="590" rx="16" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="180" cy="296" r="26"/><text class="m" x="230" y="290" font-size="22">WELL ROUNDED</text><path class="s-line" d="M230 316h220" stroke-width="6" stroke-linecap="round"/><g id="rsr"></g></g>
<g id="sc5"><path class="s-ink" d="M620 380H1020" stroke-width="5"/><g id="pits"></g><circle class="loss" cx="820" cy="300" r="8"/><g id="arr"></g><text class="m" x="620" y="480" font-size="20">MANY SHALLOW SKILLS</text><text class="m" x="620" y="512" font-size="20" style="fill:var(--loss)">NO CLEAR DIRECTION</text></g>
<g id="dw"><path class="s-ink" d="M1100 380H1480" stroke-width="5"/><rect id="shaft" class="gain" x="1260" y="380" width="60" height="0"/><text class="m" x="1340" y="520" font-size="20" style="fill:var(--gain)">ONE PATH,</text><text class="m" x="1340" y="552" font-size="20" style="fill:var(--gain)">GO DEEP</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Planners who won.</text>
<text class="b" x="120" y="176" font-size="32">Two founders with a definite vision.</text>
<g id="jb"><path class="ink" d="M250 320c-30-20-80-10-80 40 0 50 40 90 60 90 10 0 15-6 20-6s10 6 20 6c20 0 60-40 60-90 0-50-50-60-80-40z"/><path class="gain" d="M252 316c0-24 14-36 34-38 0 22-14 36-34 38z"/><text class="d5" x="360" y="370" font-size="40">Steve Jobs</text><text class="m" x="360" y="410" font-size="18">PLANNED PRODUCTS</text><text class="m" x="360" y="436" font-size="18">YEARS AHEAD</text></g>
<g id="tl6"><path class="s-ink" d="M160 620H720m-20-14 20 14-20 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="160" y="670" font-size="18">NOW</text><text class="m" x="720" y="670" font-size="18" text-anchor="end">YEARS AHEAD</text></g>
<g id="pb"></g>
<g id="ck"><rect class="s-ink" x="860" y="240" width="600" height="220" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="890" y="290" font-size="20">PAY TO: FACEBOOK</text><text class="d" x="890" y="388" font-size="60">$1 billion</text><path class="s-line" d="M1180 440h240" stroke-width="4"/><text class="m" x="1180" y="430" font-size="20">FROM: YAHOO</text></g>
<g id="st"><g transform="rotate(-12 1360 330)"><rect x="1250" y="300" width="220" height="60" rx="10" fill="none" stroke="var(--loss)" stroke-width="6"/><text class="d" x="1360" y="343" font-size="34" text-anchor="middle" style="fill:var(--loss)">DECLINED</text></g></g>
<g id="zk"><circle class="gain" cx="995" cy="570" r="6"/><circle class="gain" cx="1022" cy="552" r="9"/><rect x="1050" y="500" width="410" height="260" rx="20" fill="none" stroke="var(--gain)" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="1070" y="540" font-size="20" style="fill:var(--gain)">A DEFINITE VISION</text><g id="zb"></g><text class="m" x="1060" y="800" font-size="18">WHAT FACEBOOK COULD BECOME</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make your plan.</text>
<g id="qc7"><rect class="gain" x="120" y="172" width="1000" height="140" rx="16"/><text class="m" x="150" y="212" font-size="20" style="fill:var(--on-gain)">A CHAPTER TITLE</text><text class="d" x="150" y="282" font-size="52" style="fill:var(--on-gain)">“You are not a lottery ticket.”</text></g>
<g id="mp"><rect class="s-line" x="120" y="360" width="1360" height="420" rx="16" fill="var(--stage)" stroke-width="3"/><path id="route" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/><g id="ms"></g><text class="m" x="220" y="600" font-size="20" text-anchor="middle">NOW</text>
<g id="fg"><path class="s-ink" d="M1300 540V450" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1303 450L1365 468L1303 486z"/><text class="m" x="1270" y="470" font-size="20" text-anchor="end" style="fill:var(--gain)">WHAT YOU WANT TO BUILD</text></g></g>
<g id="wk"><text class="m" x="160" y="750" font-size="20">WORK ON IT EVERY WEEK</text></g>
<g id="ad"><text class="m" x="1440" y="750" font-size="20" text-anchor="end">ADJUST AS YOU LEARN</text></g>
<g id="hm"><rect x="-6" y="-70" width="12" height="80" rx="4" class="ink"/><rect x="-28" y="-92" width="56" height="28" rx="6" class="gain"/></g>
<g id="bd"><text class="d" x="120" y="838" font-size="40">Even a bad plan beats no plan at all.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What would you build</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">over ten years if luck</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">played <tspan style="fill:var(--gain)">no part?</tspan></text></g>
<g id="np"><text class="m" x="143" y="700" font-size="26">WRITE DOWN THE FIRST STEP TODAY</text><rect class="s-ink" x="1180" y="600" width="260" height="220" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="1210" y="650" font-size="20" style="fill:var(--gain)">STEP 1</text><line id="wl" x1="1210" y1="700" x2="1210" y2="700" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><path class="s-line" d="M1210 750h190M1210 790h130" stroke-width="6" stroke-linecap="round"/><g id="pn"><path class="gain" d="M0 0l6-22 44-44 16 16-44 44z"/></g></g>
</g>