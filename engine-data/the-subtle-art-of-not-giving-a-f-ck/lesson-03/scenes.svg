<g id="wtg"><g id="wt"><rect class="loss" x="1090" y="380" width="220" height="100" rx="14"/><text class="m" x="1200" y="440" font-size="24" text-anchor="middle" style="fill:var(--stage)">PROVE IT</text></g></g>
<g id="np"><text class="m" x="1200" y="710" font-size="22" text-anchor="middle" style="fill:var(--gain)">NO PRESSURE</text></g>
<g id="gr"><text class="d" x="120" y="800" font-size="44">Greatness starts with “not good enough yet.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Real self-worth.</text>
<text class="b" x="120" y="176" font-size="32">Judge it by your weaknesses, not your strengths.</text>
<g id="scl">
