<ellipse class="s-line" cx="560" cy="600" rx="440" ry="150" fill="none" stroke-width="5"/>
<ellipse class="s-ink" cx="560" cy="640" rx="340" ry="90" fill="var(--stage)" stroke-width="6"/>
<g id="kneel"></g>
<text class="m" x="560" y="800" font-size="22" text-anchor="middle">THE ARENA</text>
</g>
<g id="bruise"><circle class="loss" cx="596" cy="612" r="14"/></g>
<text id="tagl" class="m" x="140" y="244" font-size="20">THE PRICE OF COURAGE</text>
<g id="tags"></g>
<g id="ladder">
<path class="s-gain" d="M660 520Q900 340 1160 380" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path class="s-gain" d="M1180 240V760M1320 240V760M1180 300h140M1180 380h140M1180 460h140M1180 540h140M1180 620h140M1180 700h140" fill="none" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1250" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">RISE AGAIN</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The lake swim.</text>
<text class="b" x="120" y="176" font-size="32">Brené and her husband, Steve, swimming across a lake.</text>
