<g id="s0">
<text class="m" x="120" y="150" font-size="28">TINY HABITS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Make it</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2" style="fill:var(--gain)">tiny.</text>
<g id="t0sub"><text class="b" x="120" y="600" font-size="32">Shrink your habit until even your worst day can’t stop it.</text></g>
<rect class="s-line" x="1140" y="230" width="300" height="300" rx="14" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<rect class="s-line" x="1195" y="285" width="190" height="190" rx="12" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<rect class="s-line" x="1240" y="330" width="100" height="100" rx="10" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<rect id="sq0" rx="12" stroke-width="8"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The big plan trap.</text>
<text class="b" x="120" y="176" font-size="32">One hour of exercise, every single day.</text>
<path class="s-line" d="M160 680H920" stroke-width="5" stroke-linecap="round"/>
<g id="bp"></g>
<g id="blkR"><g id="blk"><rect class="loss" x="240" y="260" width="240" height="210" rx="14"/></g>
<g id="blkT" transform="translate(360 365)"><text class="d" x="0" y="-6" font-size="40" text-anchor="middle" style="fill:var(--stage)">1 HOUR</text><text class="m" x="0" y="34" font-size="22" text-anchor="middle" style="fill:var(--stage)">EVERY DAY</text></g></g>
<g id="cd0"></g><g id="cd1"></g>
<g id="flaw"><text class="d" x="120" y="780" font-size="46">It was not a character flaw.</text></g>
<g id="toobig"><text class="d5" x="120" y="836" font-size="34">The plan was simply too big for a hard day.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Floss just one tooth.</text>
<text class="b" x="120" y="176" font-size="32">Fogg tried this on himself.</text>
<rect class="loss" x="220" y="330" width="1090" height="70" rx="35" fill-opacity=".25"/>
<g id="teeth"></g>
<g id="fbox"><rect x="1330" y="380" width="150" height="160" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle cx="1405" cy="422" r="12" fill="none" stroke="var(--ink)" stroke-width="5"/><text class="m" x="1405" y="500" font-size="28" text-anchor="middle">FLOSS</text></g>
<path id="floss" class="s-gain" d="M640 300V550H760V300" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="sec"><text class="m" x="700" y="620" font-size="24" text-anchor="middle" style="fill:var(--gain)">ONE TOOTH · A FEW SECONDS</text></g>
<g id="more"><text class="d" x="120" y="780" font-size="46">On many days, he happily flossed the rest.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Motivation rises and falls.</text>
<text class="b" x="120" y="176" font-size="32">A tiny habit sits so low that even weak motivation can carry it.</text>
<g id="ax"><path class="s-muted" d="M160 240V700H1240" fill="none" stroke-width="4"/><text class="m" x="180" y="250" font-size="20">MOTIVATION</text><text class="m" x="1240" y="735" font-size="20" text-anchor="end">TIME</text></g>
<g id="bigL"><path class="s-loss" d="M160 360H1240" stroke-width="5" stroke-dasharray="14 12"/><text class="m" x="1270" y="368" font-size="22" style="fill:var(--loss)">BIG HABIT</text></g>
<g id="tinyL"><path class="s-gain" d="M160 650H1240" stroke-width="8" stroke-linecap="round"/><text class="m" x="1270" y="658" font-size="22" style="fill:var(--gain)">TINY HABIT</text></g>
<path id="wave" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="dots"></g>
<g id="rep"><text class="d" x="120" y="810" font-size="48">Repetition builds the routine.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find the weakest link.</text>
<text class="b" x="120" y="176" font-size="32">Fogg asks: what makes this behavior hard?</text>
<g id="chain"></g>
<g id="shr"><text class="d" x="120" y="760" font-size="48">Whatever the weakest link is, shrink it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Take a starter step.</text>
<text class="b" x="120" y="176" font-size="32">The very first move of the habit.</text>
<g id="cap1"><text class="m" x="160" y="290" font-size="22">WANT TO GO RUNNING? JUST PUT ON YOUR SHOES.</text></g>
<g id="cap2"><text class="m" x="160" y="330" font-size="22">THEN A WALK FEELS FAR MORE LIKELY.</text></g>
<g id="stairs"></g>
<g id="st1"><text class="m" x="253" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">STARTER STEP</text></g>
<g id="shoes"></g>
<rect id="dlight" class="gain" x="1180" y="260" width="160" height="220"/>
<rect id="door" x="1180" y="260" width="160" height="220" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<rect class="s-ink" x="1180" y="260" width="160" height="220" fill="none" stroke-width="6"/>
<g id="walker"></g>
<g id="opn"><text class="d" x="120" y="810" font-size="46">A small start often opens the door to more.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Scale it back.</text>
<text class="b" x="120" y="176" font-size="32">Shrink the behavior itself.</text>
<g id="pa"><rect class="s-line" x="120" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">WANT TO READ MORE?</text><g id="stack"></g>
<g id="page"><rect x="370" y="360" width="140" height="240" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-gain" d="M390 400h100M390 422h100M390 444h70" stroke-width="8" stroke-linecap="round"/><path class="s-line" d="M390 490h100M390 512h100M390 534h100M390 556h60" stroke-width="6" stroke-linecap="round"/><text class="m" x="440" y="672" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE PARAGRAPH</text></g></g>
<g id="pb"><rect class="s-line" x="840" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="22">WANT TO GET STRONGER?</text>
<path class="s-line" d="M900 600H1420" stroke-width="5" stroke-linecap="round"/>
<g id="pu"><circle class="ink" cx="1000" cy="515" r="22"/><path class="s-ink" d="M1025 530L1320 590M1060 538V598" stroke-width="12" stroke-linecap="round"/></g>
<text class="d" x="1390" y="470" font-size="80" text-anchor="middle" style="fill:var(--gain)">×1</text>
<text class="m" x="1160" y="672" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE PUSH-UP</text></g>
<g id="ck0"><circle class="gain" cx="700" cy="290" r="28"/><path d="M686 290l10 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ck1"><circle class="gain" cx="1420" cy="290" r="28"/><path d="M1406 290l10 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="bonus"><text class="d" x="120" y="790" font-size="44">Doing more is a bonus. Tiny always counts.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Picture your worst day.</text>
<text class="b" x="120" y="176" font-size="32">No time. No energy.</text>
<g id="cloud"><circle class="loss" cx="320" cy="320" r="50"/><circle class="loss" cx="400" cy="290" r="66"/><circle class="loss" cx="480" cy="320" r="50"/><rect class="loss" x="270" y="320" width="260" height="50" rx="25"/></g>
<g id="rain"></g>
<g id="wp"></g>
<path class="s-line" d="M160 690H760M880 690H1440" stroke-width="5" stroke-linecap="round"/>
<g id="tags"></g>
<g id="qq"><text class="d" x="880" y="300" font-size="44">Could you still do it?</text></g>
<g id="cap"><path class="s-muted" d="M880 600H1440" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="880" y="586" font-size="20">WORST-DAY CAPACITY</text></g>
<g id="hb"><rect id="hbr" x="1180" width="220" rx="12"/><text id="hbt" class="m" x="1290" y="670" font-size="20" text-anchor="middle">HABIT</text></g>
<g id="yes"><circle class="gain" cx="1290" cy="530" r="36"/><path d="M1272 530l12 12 22-24" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s8" opacity="0">
<g id="ya"><text class="m" x="143" y="250" font-size="28">PICK ONE HABIT YOU’VE BEEN PUTTING OFF</text></g>
<g id="qa"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">What’s the tiniest version</text></g>
<g id="qb"><text class="d" x="136" y="510" font-size="88" letter-spacing="-2">you could do today, even</text></g>
<g id="qc"><text class="d" x="136" y="620" font-size="88" letter-spacing="-2">on your <tspan style="fill:var(--gain)">worst day</tspan>?</text></g>
<rect class="s-line" x="1270" y="570" width="140" height="140" rx="12" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<rect id="tz" class="gain" rx="8"/>
<text class="m" x="143" y="760" font-size="26">MAKE IT TINY</text>
</g>