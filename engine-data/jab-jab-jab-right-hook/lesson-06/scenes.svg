<rect class="gain" x="980" y="520" width="220" height="80" rx="40"/><text class="d" x="1090" y="574" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">SAVE</text>
<rect class="s-loss" x="1260" y="520" width="200" height="80" rx="12" fill="none" stroke-width="5"/><text class="d" x="1360" y="574" font-size="36" text-anchor="middle" style="fill:var(--loss)">AD</text>
<path class="s-loss" d="M1270 600L1450 520" stroke-width="6" stroke-linecap="round"/></g>
<g id="svtx"><text class="d5" x="980" y="700" font-size="40">Worth saving,</text><text class="d5" x="980" y="752" font-size="40">not an advert.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A pin can link to your site.</text>
<text class="b" x="120" y="176" font-size="32">That makes Pinterest a natural place for a right hook.</text>
<g id="pin3"><rect class="s-ink" x="160" y="230" width="260" height="300" rx="14" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="180" y="250" width="220" height="200" rx="8"/><text class="m" x="290" y="500" font-size="20" text-anchor="middle">YOUR PIN</text></g>
<line id="lk3" class="s-gain" x1="430" y1="380" x2="430" y2="380" stroke-width="8" stroke-linecap="round"/>
<g id="ch3"><rect class="s-gain" x="655" y="360" width="60" height="40" rx="20" fill="var(--stage)" stroke-width="7"/><rect class="s-gain" x="695" y="360" width="60" height="40" rx="20" fill="none" stroke-width="7"/></g>
<g id="web3"><rect class="s-ink" x="990" y="230" width="470" height="300" rx="14" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M990 280h470" stroke-width="4"/><circle class="ink" cx="1015" cy="255" r="7"/><circle class="ink" cx="1040" cy="255" r="7"/><circle class="ink" cx="1065" cy="255" r="7"/><text class="m" x="1100" y="263" font-size="20">YOURSITE.COM</text></g>
<g id="bag3">
<path class="gain" d="M1064 372H1182L1166 426H1078Z"/>
<path class="s-ink" d="M1030 345h26l22 85h90l18-62H1062" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="ink" cx="1094" cy="452" r="11"/><circle class="ink" cx="1154" cy="452" r="11"/>
<rect class="gain" x="1230" y="365" width="190" height="70" rx="35"/>
<text class="d" x="1325" y="413" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">BUY</text>
<text class="m" x="1225" y="505" font-size="20" text-anchor="middle" style="fill:var(--gain)">RIGHT HOOK</text></g>
<g id="brk3"><rect class="s-ink" x="160" y="620" width="200" height="200" rx="12" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="178" y="638" width="164" height="164" rx="6" fill-opacity=".5"/>
<path class="s-loss" d="M370 720H560M640 720H820M585 705l30 30M615 705l-30 30" stroke-width="7" stroke-linecap="round"/>
<text class="d5" x="880" y="710" font-size="40">Lovely pin, no link.</text><text class="m" x="880" y="760" font-size="22" style="fill:var(--loss)">NO CLEAR PATH TO BUY</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Instagram is a gallery.</text>
<text class="b" x="120" y="176" font-size="32">Artful photos and filters, as good as a talented friend’s.</text>
<g id="cam4"><rect class="ink" x="220" y="260" width="100" height="34" rx="8"/><rect class="s-ink" x="160" y="290" width="360" height="220" rx="30" fill="var(--stage)" stroke-width="7"/><circle class="s-ink" cx="340" cy="400" r="78" fill="var(--stage)" stroke-width="10"/><circle class="gain" cx="340" cy="400" r="40"/><circle class="ink" cx="470" cy="330" r="12"/><text class="m" x="160" y="560" font-size="20">ARTFUL PHOTOS + FILTERS</text></g>
<circle id="fl4" class="s-gain" cx="340" cy="400" r="80" fill="none" stroke-width="6" opacity="0"/>
<g id="ph4"><rect class="s-ink" x="600" y="240" width="320" height="320" rx="6" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="620" y="260" width="280" height="230"/><circle cx="840" cy="310" r="28" fill="var(--stage)"/><path class="ink" d="M620 490l90-100 70 60 50-40 70 80z"/></g>
<g id="flt4"><text class="m" x="600" y="680" font-size="20">AS GOOD AS A</text><text class="m" x="600" y="710" font-size="20">TALENTED FRIEND’S PHOTO</text></g>
<g id="cap4"><rect class="s-ink" x="1000" y="240" width="460" height="220" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="1030" y="290" font-size="20">CAPTION</text><path class="s-line" d="M1030 330h380M1030 365h300" stroke-width="8" stroke-linecap="round"/>
<text class="b" x="1030" y="410" font-size="26" style="fill:var(--loss)">yoursite.com/shop</text><path class="s-loss" d="M1026 402h240" stroke-width="4"/><text class="m" x="1030" y="446" font-size="18" style="fill:var(--loss)">NOT CLICKABLE</text></g>
<g id="ring4"><rect class="ink" x="1020" y="520" width="12" height="160"/><rect class="ink" x="1428" y="520" width="12" height="160"/><path class="s-line" d="M1032 552h396M1032 592h396M1032 632h396" stroke-width="5"/><rect class="ink" x="1010" y="680" width="440" height="14"/><g id="hearts4"></g>
<text class="m" x="1020" y="736" font-size="20">A JABBING RING:</text><text class="m" x="1020" y="766" font-size="20" style="fill:var(--gain)">BUILD AFFECTION, DON’T SELL</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hashtags open the door.</text>
<text class="b" x="120" y="176" font-size="32">They’re how strangers discover you on Instagram.</text>
<g id="hs5"><path class="s-gain" d="M240 260l-30 280M340 260l-30 280M170 360h220M160 450h220" stroke-width="26" stroke-linecap="round"/><text class="m" x="160" y="600" font-size="20">HOW STRANGERS FIND YOU</text></g>
<g id="sb5"><rect class="s-ink" x="620" y="240" width="840" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="670" cy="278" r="16" fill="none" stroke-width="5"/><path class="s-ink" d="M682 290l14 14" stroke-width="5" stroke-linecap="round"/><text id="q5" class="d5" x="720" y="292" font-size="34"></text></g>
<g id="res5"></g>
<g id="gal5"><path class="ink" d="M160 680l200-50 200 50z"/><rect class="s-ink" x="180" y="680" width="360" height="150" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M230 690v130M490 690v130" stroke-width="10"/><rect class="s-loss" x="320" y="730" width="80" height="100" fill="none" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="360" y="718" font-size="18" text-anchor="middle" style="fill:var(--loss)">NO DOOR</text></g>
<g id="gtx5"><text class="d5" x="640" y="720" font-size="40">Great photo, no hashtags:</text><text class="d" x="640" y="780" font-size="44">a gallery with no door.</text></g>
<g id="ppl5"><g id="ppl5i"></g></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tumblr loves to remix.</text>
<text class="b" x="120" y="176" font-size="32">A young, creative community of GIFs and art.</text>
<g id="gif6"><rect class="s-ink" x="160" y="230" width="360" height="300" rx="14" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M180 500h320" stroke-width="4"/><circle id="ball6" class="gain" cx="340" cy="470" r="30"/><rect class="ink" x="180" y="248" width="80" height="36" rx="8"/><text class="m" x="220" y="273" font-size="20" text-anchor="middle" style="fill:var(--stage)">GIF</text><g id="dots6"></g></g>
<g id="arcs6"></g>
<g id="fans6"><text class="m" x="680" y="550" font-size="20">REBLOGGED FROM FAN TO FAN</text></g>
<rect id="card6" class="gain" x="0" y="0" width="36" height="36" rx="6"/>
<g id="mg6"><path class="ink" d="M180 710h50l120-50v160l-120-50h-50z"/><path class="s-line" d="M370 700l30-14M375 740h34M370 780l30 14" stroke-width="5" stroke-linecap="round"/></g>
<path id="mx6" class="s-loss" d="M170 650L380 830M380 650L170 830" stroke-width="12" stroke-linecap="round"/>
<g id="mtx6"><text class="d5" x="640" y="700" font-size="40">Corporate polish feels</text><text class="d5" x="640" y="752" font-size="40">out of place there.</text><text class="m" x="640" y="820" font-size="22" style="fill:var(--gain)">BRANDS MUST PLAY AND CREATE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">One product, three rings.</text>
<text class="b" x="120" y="176" font-size="32">Each platform has its own rules for links, hashtags and tone.</text>
<g id="ph7"></g>
<g id="rl7"></g>
<g id="wel7"><text class="d" x="120" y="820" font-size="46">Respect the rules: welcomed, not ignored.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="280" font-size="80" letter-spacing="-2">Pick one image you’ll post.</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="80" letter-spacing="-2">How would you reshape it</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">for Pinterest, Instagram</text></g>
<g id="qd"><text class="d" x="136" y="610" font-size="80" letter-spacing="-2">and <tspan style="fill:var(--gain)">Tumblr</tspan>?</text></g>
<text class="m" x="143" y="760" font-size="26">MAKE IT NATIVE ON EVERY PLATFORM</text>
