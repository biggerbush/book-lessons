<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">People like us do</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">things like this.</text>
<text class="b" x="120" y="600" font-size="32">Why belonging shapes our choices, and how to shift a norm.</text>
<g id="tCrowd"></g>
<g id="tLone"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The quiet question.</text>
<text class="b" x="120" y="176" font-size="32">Before most choices, we silently ask one question.</text>
<g id="qPw"><g id="qP"></g></g>
<g id="qBub">
<circle class="ink" cx="316" cy="420" r="8"/><circle class="ink" cx="342" cy="390" r="12"/>
<rect class="s-ink" x="360" y="230" width="470" height="140" rx="60" fill="var(--stage)" stroke-width="5"/>
</g>
<g id="qQ"><text class="d5" x="404" y="292" font-size="38">Is this what</text><text class="d5" x="404" y="340" font-size="38">people like me do?</text></g>
<g id="qCard">
<rect class="s-line" x="880" y="230" width="600" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="910" y="290" font-size="20">SETH GODIN</text>
<text class="d" x="910" y="370" font-size="42">“People like us</text>
<text class="d" x="910" y="428" font-size="42">do things like this.”</text>
<rect class="gain" x="912" y="450" width="120" height="8"/>
</g>
<g id="qY"><circle class="gain" cx="560" cy="600" r="32"/><path d="M544 600l12 12 22-24" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="616" y="616" font-size="44">Yes: we lean in.</text></g>
<g id="qN"><circle class="loss" cx="560" cy="720" r="32"/><path d="M547 707l26 26M573 707l-26 26" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/><text class="d" x="616" y="736" font-size="44" style="fill:var(--loss)">No: we walk away.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Culture is invisible.</text>
<text class="b" x="120" y="176" font-size="32">One of the strongest forces in our lives.</text>
<rect class="loss" x="120" y="380" width="680" height="440" fill-opacity=".1"/>
<path class="s-loss" d="M120 380H800" stroke-width="4"/>
<g id="cTip"><polygon class="s-ink" points="400,380 440,300 500,288 540,380" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="470" y="268" font-size="20" text-anchor="middle">WHAT WE SAY</text></g>
<g id="cBase"><polygon class="s-ink" points="300,380 640,380 720,560 620,760 340,760 240,560" fill="var(--stage)" fill-opacity=".75" stroke-width="6" stroke-linejoin="round" stroke-dasharray="14 10"/><text class="d5" x="480" y="560" font-size="36" text-anchor="middle">Unspoken rules</text><text class="m" x="480" y="606" font-size="20" text-anchor="middle">WHAT WE ACTUALLY DO</text></g>
<g id="cLinks"></g>
<g id="cCards"></g>
<g id="cCap"><text class="d" x="900" y="760" font-size="36">Rarely noticed.</text><text class="d" x="900" y="810" font-size="36" style="fill:var(--gain)">Almost always followed.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who is “us”?</text>
<text class="b" x="120" y="176" font-size="32">Every culture has a boundary, an inside and an outside.</text>
<circle id="wA" class="s-ink" cx="420" cy="490" r="200" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="wAin"><text class="m" x="420" y="440" font-size="20" text-anchor="middle">INSIDE</text><text class="d" x="420" y="512" font-size="64" text-anchor="middle">US</text></g>
<g id="wOut"><text class="m" x="640" y="246" font-size="20">OUTSIDE</text></g>
<g id="wB"><circle class="s-ink" cx="1140" cy="490" r="200" fill="none" stroke-width="6"/><text class="d" x="1140" y="510" font-size="56" text-anchor="middle">THEM</text></g>
<g id="wNorm"><text class="d5" x="420" y="756" font-size="40" text-anchor="middle" style="fill:var(--gain)">Feels normal</text><text class="d5" x="1140" y="756" font-size="40" text-anchor="middle" style="fill:var(--loss)">Feels strange</text></g>
<g id="wNot"><text class="m" x="120" y="812" font-size="24">NOT: WHAT DOES EVERYONE DO?</text><line id="wNotS" class="s-ink" x1="116" y1="804" x2="116" y2="804" stroke-width="4"/></g>
<g id="wThis"><text class="m" x="1140" y="812" font-size="24" text-anchor="middle" style="fill:var(--gain)">BUT: WHAT DOES THIS GROUP DO?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Change the norm.</text>
<text class="b" x="120" y="176" font-size="32">Lasting change rarely comes one person at a time.</text>
<g id="nPost"><rect class="ink" x="290" y="320" width="20" height="430" rx="6"/><path class="s-ink" d="M200 750h200" stroke-width="8" stroke-linecap="round"/></g>
<g id="nOldW"><g id="nOld"><polygon id="nOldP" class="s-ink" points="160,360 420,360 420,440 160,440 120,400" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text id="nOldT" class="m" x="280" y="409" font-size="22" text-anchor="middle">OLD NORMAL</text></g></g>
<g id="nNew"><polygon class="gain" points="180,480 440,480 480,520 440,560 180,560"/><text class="m" x="320" y="529" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">NEW NORMAL</text><text class="m" x="300" y="800" font-size="20" text-anchor="middle">WHEN A GROUP SHIFTS</text></g>
<g id="nGrp"><ellipse class="s-line" cx="1040" cy="500" rx="400" ry="230" fill="none" stroke-width="4"/><text class="m" x="1040" y="780" font-size="20" text-anchor="middle">THE GROUP</text></g>
<g id="nRings"></g>
<g id="nDots"></g>
<g id="nSync"><text class="m" x="1040" y="830" font-size="22" text-anchor="middle" style="fill:var(--gain)">OTHERS FOLLOW TO STAY IN SYNC</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Imagine a street.</text>
<text class="b" x="120" y="176" font-size="32">Where nobody composts.</text>
<g id="hHouses"></g>
<path class="s-ink" d="M120 620H1480" stroke-width="6" stroke-linecap="round"/>
<g id="hBins"></g>
<g id="hTalk"><rect class="s-ink" x="690" y="214" width="220" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M780 278l-10 24 30-24" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/><text class="m" x="800" y="253" font-size="20" text-anchor="middle">IT’S EASY!</text></g>
<g id="hCap"><text class="d" x="120" y="810" font-size="40">Nobody was lectured. The norm changed.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lead the “we”.</text>
<text class="b" x="120" y="176" font-size="32">For a marketer, this changes the job.</text>
<g id="lBox"><polygon class="s-ink" points="180,380 230,330 430,330 380,380" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><polygon class="s-ink" points="380,380 430,330 430,490 380,540" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/><rect class="s-ink" x="180" y="380" width="200" height="160" fill="var(--stage)" stroke-width="6"/><path class="s-muted" d="M280 380v160" stroke-width="5"/><text class="m" x="300" y="600" font-size="20" text-anchor="middle">JUST A PRODUCT</text></g>
<path id="lArr" class="s-muted" d="M450 460h90m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="lFlag"><path class="s-ink" d="M560 700H980" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="752" y="250" width="12" height="450"/><path id="lCloth" class="gain"/></g>
<g id="lPeople"><text class="m" x="770" y="760" font-size="20" text-anchor="middle">A NEW WAY TO SEE THEMSELVES</text></g>
<g id="lBadge"><path class="ink" d="M1190 580l-40 180 45-25 35 45 20-180z"/><path class="ink" d="M1330 580l40 180-45-25-35 45-20-180z"/><circle class="gain" cx="1260" cy="440" r="170"/><circle cx="1260" cy="440" r="145" fill="none" stroke="var(--on-gain)" stroke-width="3"/><text class="m" x="1260" y="395" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">PEOPLE LIKE US</text><text class="d" x="1260" y="465" font-size="54" text-anchor="middle" style="fill:var(--on-gain)">DO THIS</text><text class="m" x="1260" y="515" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">NOW</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it.</text>
<text class="b" x="120" y="176" font-size="32">Two short notes, then one natural next step.</text>
<rect class="s-ink" x="220" y="220" width="1240" height="610" rx="18" fill="var(--stage)" stroke-width="5"/>
<g id="kRings"></g>
<g id="k0"><text class="m" x="300" y="320" font-size="22">1 · THE GROUP YOU SERVE</text><rect id="kL0" class="ink" x="300" y="372" width="0" height="6"/><rect id="kS0" class="ink" x="1150" y="640" width="60" height="80"/></g>
<g id="k1"><text class="m" x="300" y="470" font-size="22">2 · ONE THING ALREADY NORMAL TO THEM</text><rect id="kL1" class="ink" x="300" y="522" width="0" height="6"/><rect class="ink" x="1210" y="580" width="60" height="140"/></g>
<g id="k2"><text class="m" x="300" y="620" font-size="22" style="fill:var(--gain)">3 · YOUR OFFER, THE NATURAL NEXT STEP</text><rect id="kL2" class="gain" x="300" y="672" width="0" height="6"/><rect class="gain" x="1270" y="520" width="60" height="200"/></g>
</g>

<g id="s8" opacity="0">
<g id="eMir"><ellipse class="s-ink" cx="1360" cy="250" rx="80" ry="110" fill="var(--stage)" stroke-width="8"/><g id="eRef"></g><path class="s-line" d="M1312 210q4-40 30-56" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M1360 360v20M1310 386h100" stroke-width="8" stroke-linecap="round"/></g>
<g id="eA"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Who is your <tspan style="fill:var(--gain)">us</tspan>?</text></g>
<g id="eB"><text class="d" x="136" y="420" font-size="80" letter-spacing="-2">And what new habit could</text></g>
<g id="eC"><text class="d" x="136" y="530" font-size="80" letter-spacing="-2">you help them make feel</text></g>
<g id="eD"><text class="d" x="136" y="640" font-size="80" letter-spacing="-2">completely <tspan style="fill:var(--gain)">normal?</tspan></text></g>
<g id="eLab"><text class="m" x="143" y="750" font-size="26">PEOPLE LIKE US DO THINGS LIKE THIS</text></g>
</g>