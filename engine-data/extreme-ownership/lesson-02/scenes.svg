<text class="m" x="750" y="360" font-size="20" text-anchor="middle">STANDARD I ACCEPT</text>
<g id="rows"></g>
<text class="d" x="750" y="660" font-size="80" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="stp"><path class="s-ink" d="M980 720V600H1140V480H1300V360H1460V720Z" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/></g>
