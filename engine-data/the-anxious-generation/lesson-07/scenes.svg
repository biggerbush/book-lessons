<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ANXIOUS GENERATION · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Four norms to reclaim</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">childhood.</text>
<text class="b" x="120" y="600" font-size="32">Four shared rules that give kids their childhood back.</text>
<circle id="ring" class="s-gain" cx="1330" cy="470" r="110" fill="none" stroke-width="6" stroke-dasharray="692" stroke-dashoffset="692"/>
<g id="homes"></g>
<g id="tkid"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The only one without a phone.</text>
<text class="b" x="120" y="176" font-size="32">A collective action problem.</text>
<g id="kids"></g>
<g id="lone"><text class="m" x="1110" y="320" font-size="22">THE ONLY ONE WITHOUT</text><text class="m" x="1110" y="352" font-size="22">A SMARTPHONE</text></g>
<g id="givein"><text class="m" x="1110" y="410" font-size="22" style="fill:var(--loss)">SO HER PARENTS GIVE IN</text></g>
<g id="alltog"><text class="m" x="1110" y="320" font-size="22" style="fill:var(--gain)">EVERYONE WAITS TOGETHER</text><text class="m" x="1110" y="352" font-size="22" style="fill:var(--gain)">NO ONE IS LEFT OUT</text></g>
<g id="dom"></g>
<g id="link"><path class="s-gain" d="M200 590H660" stroke-width="8" stroke-linecap="round"/><path id="railmid" class="s-gain" d="M660 590H850" stroke-width="8"/><path class="s-gain" d="M850 590H1330" stroke-width="8" stroke-linecap="round"/></g>
<g id="opn"><text class="m" x="755" y="540" font-size="20" text-anchor="middle" style="fill:var(--gain)">OPEN</text></g>
<g id="dcap"><text class="m" x="120" y="760" font-size="22">EACH FAMILY’S CHOICE DEPENDS ON EVERYONE ELSE’S</text></g>
<g id="gcap"><text class="d" x="120" y="834" font-size="44">Change the rules together, and the trap loosens.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="58">1. No smartphones before high school.</text>
<text class="b" x="120" y="176" font-size="32">Around age fourteen. A basic phone is fine.</text>
<g id="smart"><rect class="s-ink" x="180" y="260" width="160" height="290" rx="22" fill="var(--stage)" stroke-width="7"/><rect class="loss" x="200" y="290" width="120" height="210" fill-opacity=".25"/><path class="s-loss" d="M170 250L350 560M350 250L170 560" stroke-width="10" stroke-linecap="round"/><text class="m" x="260" y="610" font-size="20" text-anchor="middle">SMARTPHONE</text></g>
<g id="flip"><rect class="s-gain" x="450" y="290" width="120" height="120" rx="16" fill="var(--stage)" stroke-width="7"/><rect class="gain" x="470" y="310" width="80" height="60" rx="6"/><rect class="s-gain" x="450" y="420" width="120" height="130" rx="16" fill="var(--stage)" stroke-width="7"/><g id="keys"></g><text class="m" x="510" y="610" font-size="20" text-anchor="middle">BASIC PHONE</text><text class="m" x="510" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">CALLS + TEXTS</text></g>
<g id="age14"><text class="m" x="120" y="720" font-size="22">WAIT UNTIL HIGH SCHOOL · AROUND 14</text></g>
<g id="sheet"><rect class="s-ink" x="860" y="230" width="560" height="560" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="900" y="282" font-size="20">PARENT PLEDGE</text><text class="d" x="900" y="340" font-size="44">Wait Until 8th</text><text class="b" x="900" y="384" font-size="24">Families in one class hold off together.</text></g>
<g id="sigs"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. No social media until 16.</text>
<text class="b" x="120" y="176" font-size="32">Time to get through early puberty first.</text>
<g id="pub"><rect class="loss" x="313" y="450" width="460" height="180" fill-opacity=".14"/><text class="m" x="543" y="482" font-size="20" text-anchor="middle" style="fill:var(--loss)">EARLY PUBERTY</text></g>
<path class="s-ink" d="M160 640H1080" stroke-width="6" stroke-linecap="round"/>
<g id="ticks"></g>
<g id="kid3"></g>
<g id="cal"><rect class="s-ink" x="1000" y="250" width="160" height="170" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="1003" y="253" width="154" height="40" rx="11"/><text class="d" x="1080" y="395" font-size="84" text-anchor="middle">16</text></g>
<g id="idc"><rect class="s-ink" x="1220" y="470" width="240" height="160" rx="16" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1280" cy="530" r="24"/><path class="ink" d="M1250 600a30 30 0 0 1 60 0z"/><path class="s-line" d="M1330 520h100M1330 555h80M1330 590h60" stroke-width="8" stroke-linecap="round"/><circle class="gain" cx="1440" cy="636" r="30"/><path d="M1426 636l10 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1330" y="700" font-size="20" text-anchor="middle">AGE VERIFIED</text></g>
<g id="wait"><text class="d" x="120" y="800" font-size="44">Platforms built to grab attention can wait.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Phone-free schools.</text>
<text class="b" x="120" y="176" font-size="32">From the first bell to the last.</text>
<g id="phs"></g>
<g id="lockers"></g>
<g id="lkcap"><text class="m" x="120" y="820" font-size="22">PHONES LOCKED AWAY ALL DAY</text></g>
<g id="lunch"><g id="studs"></g><rect class="ink" x="840" y="560" width="620" height="34" rx="8"/><path class="s-ink" d="M890 594v110M1410 594v110" stroke-width="8" stroke-linecap="round"/></g>
<g id="bubs"></g>
<g id="nosc"><rect class="s-loss" x="1130" y="620" width="40" height="70" rx="8" fill="none" stroke-width="5"/><path class="s-loss" d="M1115 615L1185 695" stroke-width="6" stroke-linecap="round"/></g>
<g id="lucap"><text class="d" x="800" y="820" font-size="44">Talking, not scrolling.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="64">4. More independence and free play.</text>
<text class="b" x="120" y="176" font-size="32">Taking away screens is only half the fix.</text>
<g id="half1"><rect class="s-loss" x="120" y="240" width="420" height="460" rx="20" fill="none" stroke-width="4" stroke-dasharray="12 10"/><rect class="s-muted" x="270" y="330" width="120" height="210" rx="18" fill="none" stroke-width="7"/><path class="s-loss" d="M250 310L410 560M410 310L250 560" stroke-width="9" stroke-linecap="round"/><text class="m" x="330" y="620" font-size="22" text-anchor="middle">FEWER SCREENS</text></g>
<text id="plus5" class="d" x="580" y="500" font-size="72" text-anchor="middle" style="fill:var(--muted)">+</text>
<g id="half2"><rect class="s-gain" x="620" y="240" width="860" height="460" rx="20" fill="none" stroke-width="4"/><circle class="gain" cx="1390" cy="320" r="36"/><path class="s-line" d="M640 600H1460" stroke-width="5"/><path class="s-ink" d="M660 600V500M700 600V500M740 600V500M780 600V500M820 600V500M860 600V500M660 530H895" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="1300" y="500" width="20" height="100"/><circle class="gain" cx="1310" cy="470" r="50"/><text class="m" x="650" y="672" font-size="20">INDEPENDENCE · FREE PLAY · RESPONSIBILITY</text></g>
<g id="kid5"></g>
<g id="gateW"><rect class="ink" x="895" y="470" width="14" height="130"/><rect class="ink" x="1065" y="470" width="14" height="130"/><g id="gate"><rect class="s-ink" x="909" y="500" width="156" height="80" fill="none" stroke-width="6"/><path class="s-ink" d="M948 500v80M987 500v80M1026 500v80" stroke-width="5"/></g></g>
<g id="toys"><path class="s-muted" d="M1120 360Q1170 450 1222 520" fill="none" stroke-width="3"/><path class="gain" d="M1120 300l26 30-26 30-26-30z"/><circle id="ball" class="gain" cx="1265" cy="585" r="14"/></g>
<g id="hf"><text class="m" x="150" y="284" font-size="20" style="fill:var(--loss)">HALF OF THE FIX</text><text class="m" x="650" y="284" font-size="20" style="fill:var(--gain)">THE OTHER HALF</text></g>
<g id="rich"><text class="d" x="120" y="800" font-size="44">Screens out only works if real life comes in.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Let Grow Project.</text>
<text class="b" x="120" y="176" font-size="32">Kids do something new, on their own, without an adult.</text>
<g id="t0"><rect class="s-line" x="120" y="230" width="300" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M150 490H390" stroke-width="4"/><circle class="ink" cx="200" cy="330" r="20"/><path class="ink" d="M170 414v-26a30 30 0 0 1 60 0v26z"/><path class="s-ink" d="M190 414v76M210 414v76" stroke-width="8"/><path class="s-gain" d="M228 392Q270 450 305 440" fill="none" stroke-width="4"/><path id="tail" class="s-ink" d="M300 440l-22-18" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="300" y="430" width="70" height="30" rx="14"/><circle class="ink" cx="382" cy="424" r="16"/><path class="s-ink" d="M312 460v30M358 460v30" stroke-width="7"/><text class="d5" x="150" y="540" font-size="32">Walk the dog</text></g>
<g id="t1"><rect class="s-line" x="450" y="230" width="300" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-muted" d="M560 335q12-16 0-32M590 335q12-16 0-32M620 335q12-16 0-32" fill="none" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M650 420h65" stroke-width="14" stroke-linecap="round"/><circle class="s-ink" cx="590" cy="420" r="62" fill="var(--stage)" stroke-width="8"/><circle class="gain" cx="590" cy="420" r="24"/><text class="d5" x="480" y="540" font-size="32">Cook a meal</text></g>
<g id="t2"><rect class="s-line" x="780" y="230" width="300" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="gain" x="950" y="290" width="28" height="110" rx="14" transform="rotate(15 964 345)"/><path class="s-ink" d="M890 360v-24a40 40 0 0 1 80 0v24" fill="none" stroke-width="7"/><rect class="s-ink" x="860" y="360" width="140" height="130" rx="12" fill="var(--stage)" stroke-width="7"/><text class="d5" x="810" y="540" font-size="32">Run an errand</text></g>
<g id="exp"><text class="m" x="120" y="626" font-size="20">WHAT PARENTS EXPECTED</text><rect class="s-muted" x="120" y="640" width="380" height="44" rx="10" fill="none" stroke-width="4"/></g>
<g id="can"><text class="m" x="120" y="736" font-size="20" style="fill:var(--gain)">WHAT KIDS CAN HANDLE</text><rect id="canb" class="gain" x="120" y="750" width="0" height="44" rx="10"/></g>
<g id="proud"><circle class="gain" cx="1310" cy="380" r="50"/><circle cx="1292" cy="372" r="5" fill="var(--on-gain)"/><circle cx="1328" cy="372" r="5" fill="var(--on-gain)"/><path d="M1288 392q22 22 44 0" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M1235 590v-65a75 75 0 0 1 150 0v65z"/><g id="stars"></g><text class="m" x="1310" y="640" font-size="22" text-anchor="middle">PROUD</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Better together.</text>
<text class="b" x="120" y="176" font-size="32">Each norm is easier when neighbours do it too.</text>
<rect x="120" y="470" width="1360" height="60" rx="30" fill="var(--line)"/>
<path class="s-muted" d="M160 500H1440" stroke-width="4" stroke-dasharray="20 20"/>
<g id="hs7"></g>
<g id="park"><rect class="s-gain" x="820" y="570" width="320" height="190" rx="20" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="980" y="606" font-size="20" text-anchor="middle" style="fill:var(--gain)">PARK</text><path class="s-ink" d="M880 740L910 640H1000L1030 740M935 640v50M975 640v50M925 690h60M1060 740L1100 650V740" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="kd7"></g>
<g id="pcap"><text class="d" x="120" y="834" font-size="44">Friends outside, not just online.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which parent could you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">call this week to try</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">one norm</tspan> together?</text></g>
<text class="m" x="143" y="700" font-size="26">ONE CALL · ONE NORM · TOGETHER</text>
<g id="call"><rect class="s-ink" x="1290" y="620" width="90" height="160" rx="16" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="1335" cy="700" r="22"/><g id="waves"></g></g>
</g>