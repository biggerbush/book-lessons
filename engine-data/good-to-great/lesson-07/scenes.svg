<g id="s0">
<text class="m" x="120" y="150" font-size="28">GOOD TO GREAT · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Turn the flywheel,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">avoid the doom loop.</text>
<text class="b" x="120" y="600" font-size="32">Why lasting success comes from steady pushes, not dramatic leaps.</text>
<g id="w0g"></g>
<path class="s-line" d="M120 660V840H620" fill="none" stroke-width="4"/>
<g id="my0"><path class="s-loss" d="M130 830H400V680H610" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linejoin="round"/><text class="m" x="680" y="730" font-size="22" style="fill:var(--loss)">LOOKS LIKE: OVERNIGHT</text></g>
<g id="re0"><path id="rc0" class="s-gain" d="M130 830C360 826 480 790 610 670" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><text class="m" x="680" y="800" font-size="22" style="fill:var(--gain)">REALLY: SLOW AND QUIET</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Picture a giant flywheel.</text>
<text class="b" x="120" y="176" font-size="32">Heavy as a truck. You push, and it barely moves.</text>
<path class="s-line" d="M420 800H1440" stroke-width="5" stroke-linecap="round"/>
<g id="w1g"></g>
<g id="pu1"><circle class="ink" cx="600" cy="452" r="32"/><path class="s-ink" d="M585 495L525 625M525 625L455 790M525 625L575 790M582 505L681 505M572 530L681 545" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pan1"><text class="m" x="1220" y="380" font-size="22">FULL TURNS</text><text id="tc1" class="d" x="1214" y="540" font-size="160">0</text><text id="st1" class="m" x="1220" y="600" font-size="22" style="fill:var(--gain)">BARELY ONE INCH</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Turn by turn, it speeds up.</text>
<text class="b" x="120" y="176" font-size="32">Two turns, then four, then eight.</text>
<g id="sp2"></g>
<g id="w2g"></g>
<text class="m" x="760" y="300" font-size="22">TURNS</text>
<path class="s-line" d="M760 680H1460" stroke-width="4"/>
<g id="br2"></g>
<g id="pd2"></g>
<g id="np2"><text class="m" x="660" y="772" font-size="22">NO SINGLE PUSH MADE THE DIFFERENCE</text></g>
<g id="bt2"><text class="d" x="120" y="846" font-size="44">Buildup leads to <tspan style="fill:var(--gain)">breakthrough.</tspan></text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No single magic moment.</text>
<text class="b" x="120" y="176" font-size="32">Leaders could not name the day it happened.</text>
<g id="mic3"><rect class="s-ink" x="140" y="230" width="440" height="84" rx="18" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M350 314l20 40 20-40" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/><text class="m" x="360" y="282" font-size="24" text-anchor="middle">WHEN DID IT HAPPEN?</text>
<rect class="ink" x="360" y="400" width="40" height="70" rx="20"/><path class="s-ink" d="M380 470V640M330 640h100" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="ld3"></g>
<g id="sh3"><path class="s-ink" d="M592 500L545 455M688 500L735 455" fill="none" stroke-width="12" stroke-linecap="round"/><text class="d" x="640" y="350" font-size="90" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="640" y="650" font-size="20" text-anchor="middle">CAN’T POINT TO ONE</text></g>
<g id="cal3"><rect class="s-ink" x="860" y="250" width="580" height="430" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="860" y="250" width="580" height="64" rx="14"/><g id="cc3"></g></g>
<g id="cn3"><text class="m" x="860" y="730" font-size="22">NO NAME. NO SLOGAN.</text></g>
<g id="lt3"><text class="m" x="860" y="770" font-size="22" style="fill:var(--gain)">THE SIZE OF THE CHANGE WAS SEEN LATER</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let results do the talking.</text>
<text class="b" x="120" y="176" font-size="32">No hype. Real wins, even small ones.</text>
<g id="mg4"><polygon class="ink" points="160,290 360,230 360,390 160,340"/><rect class="ink" x="130" y="292" width="30" height="52" rx="6"/><text class="m" x="120" y="440" font-size="22">NO HYPE, NO SELLING</text></g>
<path id="st4" class="s-loss" d="M130 220L390 400" stroke-width="10" stroke-linecap="round"/>
<g id="ch4"><path class="s-line" d="M140 500V740H600" fill="none" stroke-width="4"/><g id="cb4"></g><text class="m" x="120" y="790" font-size="22" style="fill:var(--gain)">REAL RESULTS, EVEN SMALL</text></g>
<g id="w4g"></g>
<g id="tm4"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The doom loop.</text>
<text class="b" x="120" y="176" font-size="32">The comparison companies lurched instead of pushing.</text>
<g id="co5"><rect class="loss" x="140" y="360" width="160" height="280"/><text class="m" x="140" y="680" font-size="20">COMPARISON CO.</text></g>
<path id="zz5" class="s-loss" d="M360 600L480 320L600 600L720 340L840 620L960 330" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="zl5"></g>
<g id="mg5"><rect id="ma5" class="loss" x="1080" y="440" width="120" height="200"/><rect id="mb5" class="s-loss" x="1360" y="440" width="120" height="200" fill="var(--stage)" stroke-width="6"/><text id="pl5" class="d" x="1280" y="560" font-size="60" text-anchor="middle">+</text>
<path id="bs5" class="s-loss" d="M1270 410v-34M1220 420l-24-26M1320 420l24-26" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1280" y="690" font-size="22" text-anchor="middle">BUY MOMENTUM?</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every restart stops the wheel.</text>
<text class="b" x="120" y="176" font-size="32">New leaders scrapped the past and started over.</text>
<g id="w6g"></g>
<text class="m" x="220" y="722" font-size="20">EFFORT SO FAR</text>
<rect class="s-line" x="220" y="740" width="400" height="28" fill="none" stroke-width="3"/>
<rect id="pf6" class="gain" x="220" y="740" width="0" height="28"/>
<g id="nb6"></g>
<circle id="rg6" class="s-loss" cx="1180" cy="480" r="190" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="dt6" class="loss" r="12"/>
<g id="nd6"></g>
<g id="dl6"><text class="d" x="1180" y="470" font-size="40" text-anchor="middle" style="fill:var(--loss)">DOOM</text><text class="d" x="1180" y="516" font-size="40" text-anchor="middle" style="fill:var(--loss)">LOOP</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">Pick one direction. Keep pushing.</text>
<text class="b" x="120" y="176" font-size="32">Rooted in your hedgehog concept.</text>
<g id="ar7"><circle class="gain" cx="180" cy="380" r="26"/><path id="ln7" class="s-gain" d="M210 380H1280" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><text class="m" x="120" y="450" font-size="22">HEDGEHOG CONCEPT</text></g>
<path id="hd7" class="gain" d="M1270 345L1320 380L1270 415z"/>
<g id="w7g"></g>
<g id="fl7"></g>
<g id="sw7"><text class="m" x="400" y="250" font-size="22" style="fill:var(--gain)">SMALL, VISIBLE WINS</text></g>
<g id="st7"><text class="d" x="260" y="676" font-size="44" text-anchor="middle" style="fill:var(--stage)">STOP</text></g>
<g id="rb7"><rect class="s-muted" x="420" y="620" width="300" height="80" rx="40" fill="none" stroke-width="5"/><text class="m" x="570" y="668" font-size="22" text-anchor="middle">START OVER</text></g>
<path id="rx7" class="s-loss" d="M430 705L710 615" stroke-width="8" stroke-linecap="round"/>
<g id="rs7"><text class="d5" x="790" y="650" font-size="40">Resist the urge to start over</text><text class="b" x="790" y="700" font-size="30">whenever progress feels slow.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="d" x="136" y="300" font-size="84" letter-spacing="-2">What is one small push</text></g>
<g id="q1"><text class="d" x="136" y="400" font-size="84" letter-spacing="-2">you could make today,</text></g>
<g id="q2"><text class="d" x="136" y="500" font-size="84" letter-spacing="-2">in the same direction</text></g>
<g id="q3"><text class="d" x="136" y="600" font-size="84" letter-spacing="-2">as <tspan style="fill:var(--gain)">yesterday?</tspan></text></g>
<g id="w8g"></g>
<path class="s-gain" d="M1218 576A130 130 0 0 1 1340 490M1325 474L1345 490L1325 506" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="lb8"><text class="m" x="143" y="740" font-size="26">ONE DIRECTION. EVERY DAY.</text></g>
</g>