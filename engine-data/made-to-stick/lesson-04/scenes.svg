<text class="m" x="1096" y="740" font-size="20">ONE PICTURE FOR EVERYONE</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Boeing 727.</text>
<text class="b" x="120" y="176" font-size="32">Three targets every engineer could picture.</text>
<g id="pl"><g id="plm">
