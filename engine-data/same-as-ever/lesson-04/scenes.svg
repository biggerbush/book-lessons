<g id="quote"><text class="d" x="120" y="790" font-size="56">“The best story wins.”</text><rect class="gain" x="124" y="816" width="160" height="10"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why stories stick.</text>
<text class="b" x="120" y="176" font-size="32">Our brains are not built to weigh data calmly.</text>
<g id="brainG">
<text class="m" x="1180" y="262" font-size="22" text-anchor="middle">YOUR BRAIN</text>
<ellipse class="s-ink" cx="1180" cy="440" rx="220" ry="160" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M1180 290v300M1030 380q40-30 80 0M1250 380q40-30 80 0M1040 500q40 30 80 0M1250 500q40 30 80 0" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="fire">
<g id="ppl"></g>
