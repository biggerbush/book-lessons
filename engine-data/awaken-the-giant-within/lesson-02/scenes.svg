<g id="s0">
<text class="m" x="120" y="150" font-size="28">AWAKEN THE GIANT WITHIN · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Pain and pleasure</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">run your life.</text>
<text class="b" x="120" y="600" font-size="32">The two hidden forces behind every habit you keep.</text>
<g id="tsc"><path class="s-ink" d="M1270 320V680M1190 680h160" stroke-width="8" stroke-linecap="round"/><g id="tscB"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two forces drive you.</text>
<text class="b" x="120" y="176" font-size="32">Almost everything you do comes from one of two needs.</text>
<g id="cl">
<circle class="loss" cx="300" cy="440" r="55"/><circle class="loss" cx="370" cy="405" r="72"/><circle class="loss" cx="445" cy="440" r="55"/><rect class="loss" x="300" y="440" width="145" height="55"/>
<path class="s-loss" d="M300 525l-12 34M370 525l-12 34M440 525l-12 34" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="370" y="640" font-size="24" text-anchor="middle" style="fill:var(--loss)">AVOID PAIN</text>
</g>
<g id="sn"><circle class="gain" cx="1240" cy="440" r="70"/><g id="rays"></g>
<text class="m" x="1240" y="640" font-size="24" text-anchor="middle" style="fill:var(--gain)">GAIN PLEASURE</text></g>
<g id="pr"></g>
<g id="pa">
<path class="s-loss" d="M745 540L560 470" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/><circle class="loss" cx="560" cy="470" r="10"/>
<path class="s-gain" d="M855 540L1040 470" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/><circle class="gain" cx="1040" cy="470" r="10"/>
</g>
<g id="ev"><text class="d" x="120" y="790" font-size="46">Every habit is linked to one of these.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pain usually wins.</text>
<text class="b" x="120" y="176" font-size="32">We do far more to avoid pain than to chase pleasure.</text>
<path class="s-muted" d="M800 390V630" stroke-width="3" stroke-dasharray="6 8"/>
<g id="tw"><g id="twm">
<path class="s-ink" d="M460 520H1140" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M800 520V466" stroke-width="5"/><path class="ink" d="M800 466l44 14-44 14z"/>
<g id="twl"></g><g id="twr"></g>
<text class="m" x="370" y="650" font-size="24" text-anchor="middle" style="fill:var(--loss)">PAIN</text>
<text class="m" x="1230" y="650" font-size="24" text-anchor="middle" style="fill:var(--gain)">PLEASURE</text>
</g></g>
<g id="shG"><text class="m" x="160" y="740" font-size="22">A GOOD PLAN</text><line id="shA" class="s-ink" x1="160" y1="770" x2="160" y2="770" stroke-width="6" stroke-linecap="round"/></g>
<g id="shS"><path class="loss" d="M720 690l70 22v50c0 40-30 62-70 78-40-16-70-38-70-78v-50z"/></g>
<g id="shT"><text class="d" x="840" y="784" font-size="44">Fear of failing stops it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s the pain you link to it.</text>
<text class="b" x="120" y="176" font-size="32">Not the actual pain, but the pain your mind connects to an action.</text>
<g id="br">
<path class="s-ink" d="M340 350c-70-20-140 20-140 90 0 40 20 70 50 85 10 40 60 50 90 30 30 20 80 10 90-30 30-15 50-45 50-85 0-70-70-110-140-90z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M340 350v180M260 420c20-20 40 0 50-20M380 430c20 10 40-10 60 5M270 480c20 10 40 0 50 15M370 490c20-10 40 5 55-10" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="340" y="610" font-size="22" text-anchor="middle">YOUR MIND</text>
</g>
<g id="ab">
<path class="s-muted" d="M495 450H590" stroke-width="4" stroke-dasharray="8 8"/>
<rect class="s-ink" x="600" y="410" width="220" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="710" y="458" font-size="24" text-anchor="middle">ACTION</text>
<rect class="s-loss" x="1100" y="410" width="260" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1230" y="458" font-size="24" text-anchor="middle" style="fill:var(--loss)">LINKED PAIN</text>
</g>
<g id="chn"></g>
<g id="na"><text class="d" x="120" y="710" font-size="60" style="fill:var(--gain)">Neuro-associations:</text>
<text class="b" x="120" y="768" font-size="32" style="fill:var(--ink)">connections your nervous system has learned</text>
<text class="b" x="120" y="812" font-size="32" style="fill:var(--ink)">between actions and feelings.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Quick pleasure, slow pain.</text>
<text class="b" x="120" y="176" font-size="32">A second trap is timing.</text>
<g id="tl"><path class="s-ink" d="M160 620H1420M1400 604l20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="300" y="660" font-size="20" text-anchor="middle">TODAY</text></g>
<g id="ck">
<path class="s-ink" d="M176 448H414" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M200 432L390 432L390 342Z"/>
<path d="M276 396H390" stroke="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M200 432L390 432L390 342Z" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path class="s-loss" d="M198 432L392 340" stroke-width="16" stroke-linecap="round"/>
<path class="loss" d="M262 398v14a6 6 0 0 0 12 0v-20zM322 370v20a6 6 0 0 0 12 0v-26z"/>
<path class="s-ink" d="M378 308q4-16 18-20" fill="none" stroke-width="4" stroke-linecap="round"/>
<circle class="loss" cx="376" cy="318" r="14"/>
</g>
<rect id="plb" class="gain" x="270" y="620" width="60" height="0"/>
<g id="pln"><text class="m" x="350" y="560" font-size="20" style="fill:var(--gain)">PLEASURE NOW</text></g>
<g id="cal"><rect class="s-ink" x="1180" y="330" width="140" height="140" rx="10" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="1180" y="330" width="140" height="32" rx="6"/><g id="calg"></g>
<text class="m" x="1250" y="520" font-size="20" text-anchor="middle">MONTHS LATER</text></g>
<rect id="pnb" class="loss" x="1220" y="620" width="60" height="0"/>
<g id="pnl"><text class="m" x="1200" y="700" font-size="20" text-anchor="end" style="fill:var(--loss)">PAIN LATER</text></g>
<circle id="td" class="gain" cx="300" cy="620" r="14"/>
<g id="kw"><text class="d" x="120" y="840" font-size="46">So the habit keeps winning.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why we procrastinate.</text>
<text class="b" x="120" y="176" font-size="32">Starting feels more painful than waiting, until it doesn’t.</text>
<g id="clk"><circle id="clf" cx="400" cy="300" r="64" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<path class="s-ink" d="M400 300v-30" stroke-width="7" stroke-linecap="round"/>
<line id="clh" class="s-ink" x1="400" y1="300" x2="400" y2="254" stroke-width="5" stroke-linecap="round"/></g>
<g id="dsk"><path class="s-ink" d="M170 560H640M210 560V770M600 560V770" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M300 552h160l40-28H340z" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/></g>
<g id="pcw"><g id="pcl"><path class="gain" d="M0 0l80-46 12 20-80 46z"/><path class="ink" d="M0 0l-14 26 26-6z"/></g></g>
<g id="bars"><path class="s-line" d="M840 760H1300" stroke-width="4"/>
<rect id="b0" x="860" y="500" width="140" height="260" rx="6" fill="var(--loss)"/>
<rect id="b1" class="loss" x="1140" y="670" width="140" height="90" rx="6"/>
<text class="m" x="930" y="800" font-size="20" text-anchor="middle">PAIN OF STARTING</text>
<text class="m" x="1210" y="800" font-size="20" text-anchor="middle">PAIN OF WAITING</text></g>
<g id="flp"><text class="m" x="1070" y="360" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE LINKS FLIP · YOU ACT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Flip the links on purpose.</text>
<text class="b" x="120" y="176" font-size="32">Get leverage: feel what the old habit is really costing you.</text>
<g id="mir"><ellipse class="s-ink" cx="440" cy="480" rx="100" ry="150" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M440 630V760M380 760h120" stroke-width="7" stroke-linecap="round"/>
<g id="mp"></g><g id="rf"></g></g>
<g id="wts"></g>
<g id="mt"><rect class="s-ink" x="1300" y="380" width="60" height="380" rx="8" fill="none" stroke-width="5"/>
<rect id="mf" class="loss" x="1300" y="760" width="60" height="0" rx="8"/></g>
<g id="ef"><text class="m" x="1330" y="350" font-size="20" text-anchor="middle" style="fill:var(--loss)">ENOUGH IS ENOUGH</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Link pleasure to the new.</text>
<text class="b" x="120" y="176" font-size="32">Picture, in vivid detail, how it will feel to have changed.</text>
<path id="pthB" class="s-line" d="M200 760C460 760 200 600 420 580S640 520 640 450" fill="none" stroke-width="8" stroke-dasharray="4 14" stroke-linecap="round"/>
<path id="pthG" class="s-gain" d="M200 760C460 760 200 600 420 580S640 520 640 450" fill="none" stroke-width="8" stroke-linecap="round"/>
<circle id="wk" class="ink" r="16"/>
<g id="tro"><path class="gain" d="M580 250h120v40a60 60 0 0 1-120 0z"/>
<path class="s-gain" d="M580 270h-26v20a26 26 0 0 0 30 24M700 270h26v20a26 26 0 0 1-30 24" fill="none" stroke-width="7"/>
<rect class="gain" x="630" y="350" width="20" height="30"/><rect class="gain" x="596" y="380" width="88" height="20" rx="4"/><g id="spk"></g></g>
<g id="bal"><path class="s-ink" d="M1160 400V760M1060 760h200" stroke-width="8" stroke-linecap="round"/><g id="balB"></g></g>
<g id="fg"><text class="d" x="120" y="840" font-size="46">Change stops being a fight.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What will one habit</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">cost you if you never</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">change?</text></g>
<g id="nl"><text class="m" x="143" y="700" font-size="26">THEN WRITE HOW GOOD LIFE FEELS WHEN YOU DO</text></g>
<g id="nb"><rect class="s-ink" x="1200" y="580" width="220" height="240" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1240 566v28M1310 566v28M1380 566v28" stroke-width="6" stroke-linecap="round"/><g id="nbl"></g></g>
</g>