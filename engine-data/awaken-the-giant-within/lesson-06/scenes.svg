<g id="s0">
<text class="m" x="120" y="150" font-size="28">AWAKEN THE GIANT WITHIN · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Values and rules steer</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">every choice.</text>
<text class="b" x="120" y="600" font-size="32">Your happiness follows rules you wrote, so rewrite them.</text>
<g id="tc"></g>
<g id="ttag"><text class="m" x="1330" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU CAN REWRITE THEM</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your inner compass.</text>
<text class="b" x="120" y="176" font-size="32">Every choice you make is steered by your values.</text>
<g id="c1"></g>
<g id="tow"><text class="m" x="760" y="290" font-size="22" style="fill:var(--gain)">FEELINGS YOU MOST WANT</text></g>
<g id="pv"></g>
<g id="awy"><text class="m" x="760" y="580" font-size="22" style="fill:var(--loss)">FEELINGS YOU WANT TO AVOID</text>
<path class="s-loss" d="M1360 600L1430 720H1290z" fill="none" stroke-width="7" stroke-linejoin="round"/>
<path class="s-loss" d="M1360 640v40M1360 702v2" stroke-width="8" stroke-linecap="round"/></g>
<g id="pa"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The ranking matters.</text>
<text class="b" x="120" y="176" font-size="32">What decides your choices is the order of your values.</text>
<g id="lad"></g>
<g id="offer"><rect class="s-ink" x="620" y="250" width="360" height="190" rx="18" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M782 300v-14h36v14" fill="none" stroke-width="6"/><rect class="ink" x="755" y="300" width="90" height="64" rx="10"/>
<text class="m" x="800" y="410" font-size="22" text-anchor="middle">RISKY JOB ABROAD</text></g>
<g id="pp"></g>
<g id="dec0"><text class="d" x="350" y="810" font-size="48" text-anchor="middle" style="fill:var(--gain)">Yes.</text></g>
<g id="dec1"><text class="d" x="1250" y="810" font-size="48" text-anchor="middle">Stays.</text></g>
<g id="same"><text class="d" x="800" y="610" font-size="38" text-anchor="middle">Same offer,</text><text class="d" x="800" y="660" font-size="38" text-anchor="middle">different ladder,</text><text class="d" x="800" y="710" font-size="38" text-anchor="middle" style="fill:var(--gain)">opposite decisions.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Under every value, a rule.</text>
<text class="b" x="120" y="176" font-size="32">What has to happen for you to feel it.</text>
<g id="rb"><rect class="gain" x="250" y="226" width="300" height="64" rx="32"/>
<text class="m" x="400" y="267" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">A VALUE YOU WANT</text>
<path class="s-muted" d="M400 300v30" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M400 360c-60-24-160-24-230 0v260c70-24 170-24 230 0 60-24 160-24 230 0V360c-70-24-170-24-230 0zM400 360v260" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="285" y="420" font-size="20" text-anchor="middle">THE RULE</text>
<path class="s-line" d="M210 460h150M210 500h150M210 540h110" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="515" y="420" font-size="20" text-anchor="middle">THEN I FEEL IT</text>
<path class="s-gain" d="M470 500l30 30 55-60" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="400" y="680" font-size="20" text-anchor="middle">WHAT HAS TO HAPPEN FOR YOU TO FEEL IT</text></g>
<g id="sb"><path class="s-muted" d="M660 480h110m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="ink" x="820" y="300" width="640" height="320" rx="20"/>
<text class="m" x="1140" y="350" font-size="22" text-anchor="middle" style="fill:var(--stage)">SCOREBOARD</text>
<text class="m" x="980" y="420" font-size="20" text-anchor="middle" style="fill:var(--stage)">RULE MET?</text>
<text id="met" class="d" x="980" y="530" font-size="80" text-anchor="middle" style="fill:var(--stage)">NO</text>
<text class="m" x="1300" y="420" font-size="20" text-anchor="middle" style="fill:var(--stage)">FEEL GOOD</text>
<circle id="lamp" cx="1300" cy="505" r="55" fill="var(--muted)"/></g>
<g id="sbt"><text class="d" x="120" y="790" font-size="44">Your rules decide when you may feel good.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rigged scoreboards.</text>
<text class="b" x="120" y="176" font-size="32">Robbins asks: what has to happen for you to feel successful?</text>
<g id="mic"><rect class="ink" x="220" y="290" width="90" height="150" rx="45"/>
<path class="s-ink" d="M190 400a75 75 0 0 0 150 0M265 475v110M210 590h110" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="w0" class="s-gain" d="M360 320a70 70 0 0 1 0 100" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="w1" class="s-gain" d="M390 295a100 100 0 0 1 0 150" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="aud"></g></g>
<g id="rlab"><text class="m" x="520" y="240" font-size="22">THEIR RULE FOR SUCCESS</text></g>
<g id="rows"></g>
<g id="allc"><path class="s-ink" d="M1010 268h20v442h-20" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1050" y="340" font-size="22">ALL AT ONCE</text></g>
<g id="res"><text class="m" x="1050" y="560" font-size="22">SO THEY FEEL SUCCESSFUL</text><text class="d" x="1050" y="670" font-size="96" style="fill:var(--loss)">Rarely.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every upset is a broken rule.</text>
<text class="b" x="120" y="176" font-size="32">Hurt often means someone broke a rule they never knew you had.</text>
<g id="tab"><g id="h0"><polygon id="hp0" fill="var(--loss)" points="640,230 800,230 780,270 815,305 785,345 800,380 640,380"/><text class="d" x="715" y="320" font-size="40" text-anchor="middle" style="fill:var(--stage)">MY</text></g>
<g id="h1"><polygon id="hp1" fill="var(--loss)" points="800,230 960,230 960,380 800,380 785,345 815,305 780,270"/><text class="d" x="885" y="320" font-size="40" text-anchor="middle" style="fill:var(--stage)">RULE</text></g></g>
<g id="cp"><g id="ca"></g><rect class="s-ink" x="300" y="400" width="240" height="80" rx="16" fill="var(--stage)" stroke-width="4" stroke-dasharray="10 8"/>
<text class="m" x="420" y="447" font-size="20" text-anchor="middle">UNSPOKEN RULE</text><circle class="ink" cx="430" cy="505" r="7"/>
<text id="qm" class="d" x="1180" y="500" font-size="72" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="sh"><path class="s-gain" d="M510 650H1080m-24-24 24 24-24 24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="795" y="625" font-size="22" text-anchor="middle" style="fill:var(--gain)">SHARE YOUR RULES</text></g>
<g id="bcard"><rect class="gain" x="1060" y="400" width="240" height="80" rx="16"/><text class="m" x="1180" y="447" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">SHARED RULE</text></g>
<g id="sht"><text class="d" x="120" y="800" font-size="44">Share your rules with the people you love.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rewrite your rules.</text>
<text class="b" x="120" y="176" font-size="32">Make them easy to meet.</text>
<g id="rc"><rect class="s-line" x="120" y="230" width="420" height="330" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="272" font-size="20">OLD RULE</text>
<path class="s-line" d="M150 303h330M150 333h290M150 363h310M150 393h190" stroke-width="14" stroke-linecap="round"/>
<line id="stk" class="s-loss" x1="140" y1="348" x2="140" y2="348" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="150" y="452" font-size="20" style="fill:var(--gain)">NEW RULE</text>
<rect id="nb" class="gain" x="150" y="478" width="0" height="16" rx="8"/><g id="pn1"></g></g>
<g id="dg"><text class="m" x="620" y="260" font-size="22" style="fill:var(--gain)">MANY WAYS TO FEEL GOOD</text><g id="drs"></g></g>
<g id="db"><text class="m" x="620" y="460" font-size="22" style="fill:var(--loss)">ONLY A FEW WAYS TO FEEL BAD</text><rect class="loss" x="620" y="480" width="70" height="90" fill-opacity=".3"/><rect x="620" y="480" width="70" height="90" fill="none" stroke="var(--loss)" stroke-width="5"/></g>
<g id="sr"><g id="sun"><path class="gain" d="M170 780a70 70 0 0 1 140 0z"/></g><path class="s-ink" d="M120 780H360" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="420" y="670" font-size="22">FOR EXAMPLE, FEEL SUCCESSFUL ANY TIME YOU</text></g>
<g id="ex0"><text class="d" x="420" y="740" font-size="46">learn something,</text></g>
<g id="ex1"><text class="d" x="420" y="808" font-size="46" style="fill:var(--gain)">or take one step toward a goal.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write rules you control.</text>
<text class="b" x="120" y="176" font-size="32">Base them on your own actions, not on luck or other people.</text>
<g id="wh"><g id="whr"><circle class="s-gain" cx="340" cy="430" r="140" fill="none" stroke-width="18"/><path class="s-gain" d="M340 430V290M340 430L219 500M340 430L461 500" stroke-width="14" stroke-linecap="round"/><circle class="gain" cx="340" cy="430" r="34"/></g>
<text class="m" x="340" y="630" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOUR OWN ACTIONS</text></g>
<g id="ext"><rect class="s-ink" x="820" y="320" width="120" height="120" rx="20" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="850" cy="350" r="9"/><circle class="ink" cx="910" cy="350" r="9"/><circle class="ink" cx="880" cy="380" r="9"/><circle class="ink" cx="850" cy="410" r="9"/><circle class="ink" cx="910" cy="410" r="9"/>
<text class="m" x="880" y="490" font-size="22" text-anchor="middle">LUCK</text><g id="oth"></g>
<text class="m" x="1180" y="490" font-size="22" text-anchor="middle">OTHER PEOPLE</text></g>
<path id="sl" class="s-loss" d="M790 300L1290 460" stroke-width="8" stroke-linecap="round"/>
<g id="wk"><text class="m" x="120" y="676" font-size="22">FEEL YOUR VALUES EVERY SINGLE DAY</text><g id="week"></g></g>
<g id="pf"><rect x="900" y="590" width="580" height="190" rx="18" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="930" y="640" font-size="22" style="fill:var(--loss)">IF YOUR RULE NEEDS A PERFECT DAY,</text>
<text class="d" x="930" y="700" font-size="40">you’ve handed your</text><text class="d" x="930" y="752" font-size="40">happiness away.</text></g>
</g>

<g id="s8" opacity="0">
<g id="pk"><text class="m" x="143" y="240" font-size="26">PICK ONE VALUE YOU RARELY FEEL · WRITE DOWN ITS RULE</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Now rewrite that rule</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">so you could meet it</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">before <tspan style="fill:var(--gain)">tonight</tspan>.</text></g>
<g id="ez"><text class="m" x="143" y="700" font-size="26">MAKE IT EASY TO MEET</text></g>
<g id="bp"><rect class="s-ink" x="1200" y="500" width="220" height="250" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1235 560h150M1235 600h150M1235 640h100" stroke-width="6" stroke-linecap="round"/>
<rect id="nl" class="gain" x="1235" y="688" width="0" height="14" rx="7"/><g id="pn2"></g></g>
</g>