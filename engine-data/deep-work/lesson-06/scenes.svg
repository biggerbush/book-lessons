<path class="s-ink" d="M600 300H1440" stroke-width="5"/>
<path class="s-ink" d="M600 360L1440 760" stroke-width="6" stroke-linecap="round"/>
</g>
<circle id="c1" class="loss" cx="720" cy="270" r="22"/>
<circle id="c2" class="gain" cx="1300" cy="270" r="22"/>
