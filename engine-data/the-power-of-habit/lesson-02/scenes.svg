<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF HABIT · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The habit loop:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">cue, routine, reward.</text>
<text class="b" x="120" y="600" font-size="32">How your brain turns repeated actions into automatic loops.</text>
<circle id="glow0" cx="1325" cy="385" r="125" class="gain" opacity="0"/>
<g id="br0"></g>
<g id="lp0"><circle cx="1325" cy="385" r="150" class="s-line" fill="none" stroke-width="5" stroke-dasharray="12 12"/><g id="dots0"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A rat in a T-shaped maze.</text>
<text class="b" x="120" y="176" font-size="32">An experiment by researchers at MIT.</text>
<g id="mz1"></g>
<g id="ch1"><text class="m" x="310" y="440" font-size="20">CHOCOLATE</text></g>
<g id="rt1"><path d="M650 660H750" class="s-loss" stroke-width="8" stroke-linecap="round"/><text class="m" x="700" y="830" font-size="20" text-anchor="middle">START</text></g>
<g id="sn1"><path d="M760 700L1180 470" class="s-line" stroke-width="4" stroke-dasharray="8 10"/><rect x="1180" y="300" width="300" height="220" rx="16" class="s-ink" fill="var(--stage)" stroke-width="5"/><text class="m" x="1206" y="345" font-size="20">BRAIN SENSORS</text><polyline id="wv1" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">First runs: the brain works hard.</text>
<text class="b" x="120" y="176" font-size="32">A click, and the partition slides open.</text>
<g transform="translate(-105 5) scale(.75)"><g id="mz2"></g><path id="pt2" d="M650 660H750" class="s-loss" stroke-width="8" stroke-linecap="round"/><polyline id="tr2" class="s-muted" fill="none" stroke-width="4" stroke-dasharray="6 8"/><circle id="ring2" cx="360" cy="350" r="44" class="s-gain" fill="none" stroke-width="6"/><g id="ch2"></g><g id="rt2"></g><g id="ck2"><text class="d" x="790" y="650" font-size="44" style="fill:var(--loss)">CLICK!</text></g></g>
<g id="ch2c"><text class="m" x="820" y="262" font-size="20">BRAIN ACTIVITY</text><path d="M830 280V600H1470" class="s-ink" fill="none" stroke-width="4"/><text class="m" x="1470" y="630" font-size="18" text-anchor="end">TIME</text><polyline id="ln2" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
<g id="cp2a"><text class="d5" x="120" y="720" font-size="40">Processing every smell and every turn.</text></g>
<g id="cp2b"><text class="m" x="120" y="790" font-size="22" style="fill:var(--gain)">EVENTUALLY, IT FINDS THE CHOCOLATE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">After many runs: autopilot.</text>
<text class="b" x="120" y="176" font-size="32">The rat races straight to the treat.</text>
<g transform="translate(-105 5) scale(.75)"><g id="mz3"></g><g id="tr3"><path d="M700 720V350H360" class="s-gain" fill="none" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/></g><g id="ch3"></g><g id="rt3"></g></g>
<g id="cc3"><text class="m" x="820" y="262" font-size="20">BRAIN ACTIVITY</text><text id="bf3" class="m" x="1470" y="272" font-size="18" text-anchor="end">BEFORE</text><path d="M830 280V600H1470" class="s-ink" fill="none" stroke-width="4"/><text class="m" x="1470" y="630" font-size="18" text-anchor="end">TIME</text><polyline id="gh3" class="s-muted" fill="none" stroke-width="3" stroke-dasharray="6 6"/><polyline id="ln3" class="s-gain" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="sl3"><text class="m" x="880" y="300" font-size="20" text-anchor="middle">CLICK</text><text class="m" x="1420" y="300" font-size="20" text-anchor="middle">CHOCOLATE</text></g>
<g id="cp3a"><text class="d5" x="120" y="720" font-size="40">The route goes automatic. Activity drops.</text></g>
<g id="cp3b"><text class="m" x="120" y="790" font-size="22" style="fill:var(--gain)">SPIKES ONLY AT THE START AND AT THE END</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chunking.</text>
<text class="b" x="120" y="176" font-size="32">The brain bundles a sequence of actions into one routine.</text>
<g id="lb4"><text class="m" x="120" y="240" font-size="20">SEPARATE STEPS</text></g>
<g id="st4"></g>
<g id="ck4"><rect x="120" y="385" width="720" height="90" rx="14" class="gain"/><text class="m" x="480" y="440" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">ONE AUTOMATIC CHUNK</text></g>
<g id="bg4"><g id="br4"></g><circle id="sp4" cx="440" cy="650" r="26" class="gain"/><text class="m" x="440" y="800" font-size="22" text-anchor="middle">BASAL GANGLIA</text></g>
<rect id="mini4" class="gain" width="80" height="34" rx="8"/>
<g id="bt4"><path d="M700 630H950m-18-18 18 18-18 18" class="s-muted" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1000" y="560" width="340" height="140" rx="16" class="s-ink" fill="var(--stage)" stroke-width="7"/><rect x="1340" y="605" width="24" height="50" rx="4" class="ink"/><rect id="bf4" x="1016" y="576" height="108" rx="8" class="gain" width="0"/><text class="m" x="1000" y="760" font-size="22">MENTAL ENERGY FREED</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every habit is a loop.</text>
<g id="lp5"><circle id="ci5" cx="800" cy="520" r="230" class="s-line" fill="none" stroke-width="8" stroke-dasharray="1446" transform="rotate(150 800 520)"/><g id="br5"></g></g>
<g id="ah5"></g>
<circle id="dot5" class="gain" r="14"/>
<g id="n50"><circle cx="601" cy="635" r="80" class="s-ink" fill="var(--stage)" stroke-width="7"/><text class="d" x="601" y="647" font-size="34" text-anchor="middle">Cue</text><text class="m" x="500" y="624" font-size="20" text-anchor="end">A TRIGGER THAT</text><text class="m" x="500" y="654" font-size="20" text-anchor="end">PICKS THE ROUTINE</text></g>
<g id="n51"><circle cx="800" cy="290" r="80" class="s-ink" fill="var(--stage)" stroke-width="7"/><text class="d" x="800" y="302" font-size="34" text-anchor="middle">Routine</text><text class="m" x="960" y="270" font-size="20">THE BEHAVIOUR ITSELF:</text><text class="m" x="960" y="300" font-size="20">PHYSICAL, MENTAL</text><text class="m" x="960" y="330" font-size="20">OR EMOTIONAL</text></g>
<g id="n52"><circle cx="999" cy="635" r="80" class="gain"/><text class="d" x="999" y="647" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Reward</text><text class="m" x="1100" y="610" font-size="20">TELLS YOUR BRAIN</text><text class="m" x="1100" y="640" font-size="20">THIS LOOP IS WORTH</text><text class="m" x="1100" y="670" font-size="20">REMEMBERING</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Each loop makes it more automatic.</text>
<g id="cy6"><g id="rot6"><path d="M330 310a100 100 0 1 1 -86.6 50" class="s-ink" fill="none" stroke-width="10" stroke-linecap="round"/><path d="M-16 -14L16 0L-16 14Z" class="ink" transform="translate(243 360) rotate(300)"/></g><rect x="200" y="540" width="260" height="26" rx="13" class="s-ink" fill="none" stroke-width="4"/><rect id="mf6" x="200" y="540" height="26" rx="13" class="gain" width="0"/><text class="m" x="330" y="606" font-size="20" text-anchor="middle">AUTOMATIC</text></g>
<g id="bl6"><circle id="gl6" cx="800" cy="380" r="80" class="gain"/><circle cx="800" cy="380" r="80" class="s-ink" fill="none" stroke-width="7"/><rect x="770" y="468" width="60" height="40" rx="6" class="ink"/><path d="M780 522h40" class="s-ink" stroke-width="7" stroke-linecap="round"/><text class="m" x="800" y="606" font-size="20" text-anchor="middle">DECISION MAKING</text></g>
<g id="zz6"><text class="d" x="890" y="300" font-size="40" style="fill:var(--muted)">z</text><text class="d" x="924" y="262" font-size="30" style="fill:var(--muted)">z</text></g>
<g id="mg6"><circle cx="1240" cy="390" r="56" class="s-line" fill="none" stroke-width="5"/><circle cx="1240" cy="334" r="12" class="ink"/><circle cx="1288" cy="418" r="12" class="ink"/><circle cx="1192" cy="418" r="12" class="gain"/><g id="lens6"><circle cx="1240" cy="390" r="96" class="s-ink" fill="none" stroke-width="14"/><path d="M1308 458l70 70" class="s-ink" stroke-width="24" stroke-linecap="round"/></g><text class="m" x="1260" y="606" font-size="20" text-anchor="middle">SEE THE LOOP</text></g>
<g id="pa6"><rect x="120" y="660" width="640" height="100" rx="50" class="gain"/><text class="d5" x="440" y="721" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">Helps: backing out of the driveway</text></g>
<g id="pb6"><rect x="840" y="660" width="640" height="100" rx="50" class="s-loss" fill="var(--stage)" stroke-width="6"/><text class="d5" x="1160" y="721" font-size="30" text-anchor="middle" style="fill:var(--loss)">Hurts: habits you’d rather drop</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spot your own loop.</text>
<text class="b" x="120" y="176" font-size="32">Take a habit like checking your phone.</text>
<g id="ph7"><g id="phg7"><rect x="190" y="280" width="190" height="360" rx="28" class="s-ink" fill="var(--stage)" stroke-width="7"/><path d="M225 340h120M225 380h120M225 420h80" class="s-line" stroke-width="10" stroke-linecap="round"/><circle cx="285" cy="600" r="12" class="ink"/></g><g id="bz7"><path d="M165 390q-16 30 0 60M145 375q-24 45 0 90M405 390q16 30 0 60M425 375q24 45 0 90" class="s-loss" fill="none" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="cd7"></g>
<g id="lp7"><path d="M1310 572C1310 690 630 690 630 572" class="s-gain" fill="none" stroke-width="5" stroke-dasharray="10 10"/><path d="M614 592L630 570L646 592" class="s-gain" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="970" y="730" font-size="22" text-anchor="middle">THE LOOP REPEATS</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa8"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">Pick one habit you did</text></g>
<g id="qb8"><text class="d" x="136" y="420" font-size="88" letter-spacing="-2">today without thinking.</text></g>
<g id="qc8"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Can you name its <tspan style="fill:var(--gain)">cue</tspan>,</text></g>
<g id="qd8"><text class="d" x="136" y="660" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">routine</tspan> and <tspan style="fill:var(--gain)">reward</tspan>?</text></g>
<text class="m" x="143" y="780" font-size="26">CUE · ROUTINE · REWARD</text>
<g id="qm8"><circle id="rg8" cx="1380" cy="360" r="80" class="s-gain" fill="none" stroke-width="6" stroke-dasharray="14 12"/><text class="d" x="1380" y="398" font-size="110" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>