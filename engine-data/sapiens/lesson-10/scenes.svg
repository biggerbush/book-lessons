<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rising expectations.</text>
<text class="b" x="120" y="176" font-size="32">Happiness: does reality match what we expect?</text>
<path class="s-line" d="M200 740H960" stroke-width="4"/>
