<g id="lbl1"><text class="d" x="1030" y="470" font-size="64">1 share</text><text class="m" x="1030" y="512" font-size="22">A SMALL SLICE OF THE BAKERY</text></g>
<g id="q1"><text class="d" x="1030" y="640" font-size="46">Would you want</text><text class="d" x="1030" y="696" font-size="46">to own this</text><text class="d" x="1030" y="752" font-size="46" style="fill:var(--gain)">business?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Think like an owner.</text>
<text class="b" x="120" y="176" font-size="32">Graham’s checklist for careful investors.</text>
<g id="quote">
<rect class="s-line" x="120" y="240" width="680" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="150" y="380" font-size="160" style="fill:var(--gain)">“</text>
<text class="d5" x="160" y="430" font-size="42">Investment is most</text>
<text class="d5" x="160" y="486" font-size="42">intelligent when it is</text>
<text class="d5" x="160" y="542" font-size="42">most businesslike.</text>
<text class="m" x="160" y="604" font-size="22">— BENJAMIN GRAHAM</text>
</g>
<g id="board2">
<rect class="s-ink" x="900" y="250" width="520" height="560" rx="18" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1080" y="228" width="160" height="44" rx="10"/>
</g>
<g id="cks"></g>
