<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Life is asking</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you a question.</text>
<text class="b" x="120" y="600" font-size="32">Frankl's invitation to stop asking and start answering.</text>
<text class="d" x="1290" y="400" font-size="180" text-anchor="middle" style="fill:var(--gain)">?</text>
<g id="tArr"><path id="tArrP" d="M1290 515V440M1268 462l22-22 22 22" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="tMe"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What do I want from life?</text>
<text class="b" x="120" y="176" font-size="32">The usual way of looking at life.</text>
<g id="wMe"></g>
<g id="wPanel"><rect class="s-line" x="520" y="240" width="480" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="560" y="296" font-size="22">WHAT I WANT FROM LIFE</text></g>
<g id="wItems"></g>
<g id="wStorm"><circle class="loss" cx="1200" cy="360" r="60"/><circle class="loss" cx="1290" cy="320" r="75"/><circle class="loss" cx="1380" cy="360" r="60"/><rect class="loss" x="1140" y="360" width="300" height="60" rx="30"/><g id="rain"></g></g>
<g id="wLost"><text class="d" x="120" y="790" font-size="48">When life fails to deliver, we feel cheated.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Turn the question around.</text>
<text class="b" x="120" y="176" font-size="32">Life expects something from us.</text>
<g id="spotG"><polygon points="340,250 420,250 540,680 220,680" class="gain" fill-opacity=".18"/><rect class="ink" x="345" y="222" width="70" height="32" rx="6"/></g>
<g id="aMe"></g>
<g id="aLife"><circle class="s-ink" cx="1200" cy="470" r="130" fill="var(--stage)" stroke-width="6"/><text class="d" x="1200" y="490" font-size="56" text-anchor="middle">LIFE</text></g>
<g id="aArrG"><path id="aArr" d="M540 470H1040M1012 444l28 26-28 26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text id="aL0" class="m" x="790" y="430" font-size="22" text-anchor="middle">WHAT WE WANT FROM LIFE</text>
<text id="aL1" class="m" x="790" y="430" font-size="22" text-anchor="middle" style="fill:var(--gain)">WHAT LIFE ASKS OF US</text></g>
<g id="sp1"><text class="d5" x="120" y="770" font-size="40">We are not the ones asking.</text></g>
<g id="sp2"><text class="d" x="120" y="840" font-size="52">We are the ones <tspan style="fill:var(--gain)">being asked</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Answer with how you live.</text>
<text class="b" x="120" y="176" font-size="32">Not with clever words, but with what you do.</text>
<g id="cWords"><path class="s-ink" d="M140 260h300a20 20 0 0 1 20 20v140a20 20 0 0 1-20 20H240l-40 40v-40h-60a20 20 0 0 1-20-20V280a20 20 0 0 1 20-20z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-line" d="M170 310h240M170 350h200M170 390h230" stroke-width="8" stroke-linecap="round"/><text class="m" x="120" y="540" font-size="22">CLEVER WORDS</text></g>
<path id="cX" class="s-loss" d="M170 290L410 420M410 290L170 420" stroke-width="8" stroke-linecap="round"/>
<g id="cDo"><g id="cSteps"></g><text class="m" x="586" y="540" font-size="22" style="fill:var(--gain)">WHAT YOU ACTUALLY DO</text></g>
<g id="cResp"><text class="d" x="120" y="630" font-size="44">To live is to take responsibility for the answer.</text></g>
<g id="cRow"></g>
<g id="cAgain"><text class="m" x="120" y="830" font-size="22">NOT ONCE IN THEORY, BUT AGAIN AND AGAIN, IN EACH SITUATION</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">There is no best move.</text>
<text class="b" x="120" y="176" font-size="32">Frankl's chess champion.</text>
<g id="bBoard"><text class="m" x="160" y="655" font-size="22">BEST MOVE IN THE WORLD?</text></g>
<path id="bMove" d="M272 498L352 418M322 418h32v32" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="bChamp"><g id="bChampP"></g><path class="gain" d="M770 322l6-32 24 18 24-18 6 32z"/><rect class="s-ink" x="680" y="580" width="240" height="70" rx="20" fill="var(--stage)" stroke-width="5"/><text class="m" x="800" y="623" font-size="22" text-anchor="middle">NO SUCH THING</text></g>
<g id="bTags"></g>
<g id="bEnd"><text class="d" x="120" y="790" font-size="44">The best move depends on the situation.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">What is this moment asking?</text>
<text class="b" x="120" y="176" font-size="32">Meaning differs from person to person, hour to hour.</text>
<g id="kClock"><circle class="s-ink" cx="340" cy="470" r="150" fill="var(--stage)" stroke-width="8"/><g id="kTicks"></g><path id="kH" class="s-ink" stroke-width="10" stroke-linecap="round"/><path id="kM" class="s-gain" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="340" cy="470" r="12"/><text class="m" x="340" y="680" font-size="22" text-anchor="middle">EVERY HOUR</text></g>
<g id="kPpl"><circle class="gain" cx="760" cy="310" r="22"/><path class="gain" d="M960 286l24 24-24 24-24-24z"/><text class="m" x="860" y="680" font-size="22" text-anchor="middle">EVERY PERSON</text></g>
<g id="kQ"><text id="kQt" class="d" x="1300" y="560" font-size="280" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="1300" y="680" font-size="22" text-anchor="middle">THIS MOMENT</text></g>
<g id="kEnd"><text class="d" x="120" y="800" font-size="48">What is this moment asking of you?</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A doctor crushed by grief.</text>
<text class="b" x="120" y="176" font-size="32">An elderly doctor comes to Frankl.</text>
<path class="s-line" d="M160 620H860" stroke-width="5"/>
<g id="gDoc"><path class="s-ink" d="M440 500L470 620" stroke-width="7" stroke-linecap="round"/></g>
<g id="gChair"><path class="s-ink" d="M640 400V620M640 520H780V620" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="710" y="670" font-size="20" text-anchor="middle">HIS WIFE DIED TWO YEARS EARLIER</text></g>
<g id="gPhoto"><rect class="s-ink" x="1060" y="250" width="300" height="340" rx="8" fill="var(--stage)" stroke-width="8"/><g id="gWife"></g><text class="m" x="1210" y="630" font-size="20" text-anchor="middle">HIS WIFE</text></g>
<g id="gQ1"><text class="m" x="120" y="700" font-size="20">FRANKL ASKED</text><text class="d5" x="120" y="750" font-size="40">“What if you had died first?”</text></g>
<g id="gQ2"><text class="d5" x="120" y="820" font-size="40">“She would have suffered terribly.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pain with a purpose.</text>
<g id="hSh"><g id="hWife"></g><path class="gain" d="M450 320h120v140c0 70-30 100-60 120c-30-20-60-50-60-120z" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="120" y="640" font-size="22">HE SPARED HER THAT SUFFERING</text></g>
<g id="hDrops"></g>
<g id="hPrice"><text class="m" x="120" y="700" font-size="22" style="fill:var(--loss)">THE PRICE: TO SURVIVE AND MOURN HER</text></g>
<g id="hHand">
<text class="m" x="860" y="340" font-size="20">HE SHOOK FRANKL'S HAND AND LEFT</text>
<path class="s-line" d="M880 452H1480" stroke-width="4" stroke-linecap="round"/>
<g id="hFr"></g>
<text class="m" x="960" y="496" font-size="18" text-anchor="middle" style="fill:var(--gain)">FRANKL</text>
<line id="hArmF" x1="982" y1="422" x2="982" y2="425" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/>
<g id="hDocG">
<g id="hMot"><path class="s-muted" d="M1086 386h-40M1080 410h-56M1086 434h-40" stroke-width="5" stroke-linecap="round"/></g>
<g id="hDocP"></g>
<line id="hArmD" x1="1118" y1="422" x2="1118" y2="425" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1140" y="496" font-size="18" text-anchor="middle">DOCTOR</text>
</g>
<circle id="hClasp" cx="1050" cy="425" r="10" class="ink"/>
</g>
<g id="hLoss"><text class="d5" x="860" y="560" font-size="40">His loss had not changed,</text><text class="d" x="860" y="616" font-size="40">but now it had a <tspan style="fill:var(--gain)">meaning</tspan>.</text></g>
<g id="hEnd"><text class="d" x="120" y="790" font-size="44">Suffering stops being mere suffering</text><text class="d" x="120" y="846" font-size="44">once it finds a <tspan style="fill:var(--gain)">meaning</tspan>.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="120" y="230" font-size="64" letter-spacing="-1">Don't ask what you want from today.</text></g>
<g id="qb"><text class="d" x="120" y="310" font-size="64" letter-spacing="-1">Ask what today is <tspan style="fill:var(--gain)">asking of you</tspan>.</text></g>
<g id="qOld">
<rect class="s-ink" x="120" y="400" width="500" height="200" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="152" y="448" font-size="20">OLD QUESTION</text>
<text class="d5" x="152" y="532" font-size="46" fill-opacity=".7">What do I want?</text>
</g>
<line id="qStrike" x1="146" y1="516" x2="146" y2="516" stroke="var(--loss)" stroke-width="7" stroke-linecap="round"/>
<path id="qCurve" d="M640 470Q752 300 862 462" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="qHead" d="M838 452L864 466L868 436" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="qNew">
<rect class="gain" x="880" y="400" width="600" height="200" rx="18"/>
<text class="m" x="912" y="448" font-size="20" style="fill:var(--on-gain)">NEW QUESTION</text>
<text class="d" x="912" y="512" font-size="44" style="fill:var(--on-gain)">What is today</text>
<text class="d" x="912" y="566" font-size="44" style="fill:var(--on-gain)">asking of me?</text>
</g>
<g id="qLbl"><text class="m" x="120" y="700" font-size="26">TONIGHT, SWAP ONE QUESTION FOR ANOTHER</text></g>
</g>