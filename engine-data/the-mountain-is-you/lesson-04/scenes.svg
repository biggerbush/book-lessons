<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Feelings are</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">messengers, not facts.</text>
<text class="b" x="120" y="600" font-size="32">Learn to read your emotions without letting them drive.</text>
<g id="env0"><g id="bob0">
<path d="M1180 220L1320 140L1460 220" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<g id="ltr0"><rect class="s-ink" x="1230" y="236" width="180" height="130" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M1256 270h128M1256 298h128M1256 326h80" stroke-width="6" stroke-linecap="round"/></g>
<g id="envb0"></g></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feel it. Don’t follow it.</text>
<text class="b" x="120" y="176" font-size="32">Emotional intelligence: let feelings move through you.</text>
<g id="wv1"><g id="pp1"></g><path id="wvp" class="s-loss" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="160" y="650" font-size="22">FEELINGS MOVE THROUGH YOU</text></g>
<g id="wv1b"><text class="m" x="160" y="690" font-size="22" style="fill:var(--gain)">FELT FULLY, NOT PUSHED AWAY</text></g>
<g id="sw1"><g id="whl1">
<circle class="s-ink" cx="1200" cy="450" r="130" fill="none" stroke-width="16"/>
<path class="s-ink" d="M1070 450h100M1230 450h100M1200 480v100" stroke-width="12" stroke-linecap="round"/>
<circle class="gain" cx="1200" cy="450" r="38"/>
<text class="m" x="1200" y="457" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
<text class="m" x="1200" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU KEEP THE WHEEL</text></g>
<g id="st1">
<rect class="s-ink" x="120" y="740" width="520" height="90" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="160" y="798" font-size="40">1  Feel it</text>
<path class="s-muted" d="M660 785h280" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="800" y="768" font-size="20" text-anchor="middle" style="fill:var(--gain)">A CHOICE</text>
<rect class="s-ink" x="960" y="740" width="520" height="90" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="1000" y="798" font-size="40">2  Act on it</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two ways to get stuck.</text>
<text class="b" x="120" y="176" font-size="32">Burying a feeling and obeying it both cost you control.</text>
<g id="bx2">
<rect class="s-line" x="120" y="210" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="260" font-size="22">SUPPRESS IT</text>
<g id="lk2"></g>
<rect class="s-ink" x="320" y="400" width="240" height="170" fill="var(--stage)" stroke-width="7"/>
<rect class="s-ink" x="305" y="370" width="270" height="40" rx="6" fill="var(--stage)" stroke-width="7"/>
<path class="s-loss" d="M424 450v-14a16 16 0 0 1 32 0v14" fill="none" stroke-width="7"/>
<rect class="loss" x="412" y="450" width="56" height="46" rx="6"/>
<g id="lkt2"><text class="m" x="150" y="680" font-size="22" style="fill:var(--loss)">IT LEAKS OUT LATER</text></g></g>
<g id="cl2">
<rect class="s-line" x="840" y="210" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="260" font-size="22">OBEY EVERY FEELING</text>
<circle class="loss" cx="1100" cy="350" r="50"/><circle class="loss" cx="1170" cy="320" r="66"/><circle class="loss" cx="1240" cy="350" r="50"/>
<rect class="loss" x="1100" y="340" width="140" height="60"/>
<path class="s-loss" d="M1120 412l-10 30M1170 412l-10 30M1220 412l-10 30" stroke-width="5" stroke-linecap="round"/>
<g id="mv2"></g>
<text class="m" x="870" y="680" font-size="22">PUSHED AROUND BY MOODS</text></g>
<g id="bt2"><text class="d" x="120" y="800" font-size="52">Both paths leave us out of control.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Anger has a message.</text>
<text class="b" x="120" y="176" font-size="32">It often signals that a boundary has been crossed.</text>
<g id="bd3">
<text class="m" x="480" y="250" font-size="22" text-anchor="middle">YOUR BOUNDARY</text>
<circle class="s-ink" cx="480" cy="480" r="200" fill="none" stroke-width="5"/>
<g id="po3"></g>
<path id="ar3" class="s-loss" fill="none" stroke-width="8" stroke-linecap="round"/>
<circle id="ar3h" class="loss" r="14"/>
<g id="bu3"></g></g>
<g id="ht3"><path class="gain" transform="translate(480 470) scale(.8)" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/>
<text class="m" x="480" y="740" font-size="22" text-anchor="middle" style="fill:var(--gain)">WHAT YOU CARE ABOUT PROTECTING</text></g>
<g id="hd3">
<g id="henv3"></g>
<g id="fg3"></g>
<rect class="s-ink" x="1275" y="510" width="30" height="100" rx="15" fill="var(--stage)" stroke-width="5" transform="rotate(40 1290 600)"/>
<rect class="s-ink" x="1140" y="490" width="160" height="140" rx="36" fill="var(--stage)" stroke-width="5"/>
<g id="ms3"><text class="m" x="980" y="700" font-size="24" style="fill:var(--gain)">THE MESSAGE IS USEFUL</text>
<text class="m" x="980" y="755" font-size="24">YELLING IS NOT</text>
<g id="nb3">
<rect class="s-ink" x="1232" y="724" width="72" height="44" rx="12" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1252 768l-8 14 22-14" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<path class="s-ink" d="M1250 746h36" stroke-width="5" stroke-linecap="round"/>
<line id="sk3" class="s-loss" x1="1222" y1="786" x2="1222" y2="786" stroke-width="6" stroke-linecap="round"/></g></g></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sadness and guilt.</text>
<text class="b" x="120" y="176" font-size="32">Two feelings that point somewhere.</text>
<g id="c4a">
<rect class="s-line" x="120" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">SADNESS</text>
<g id="dr4"><path class="loss" d="M300 320C300 320 210 430 210 490a90 90 0 0 0 180 0C390 430 300 320 300 320Z"/>
<path id="hh4" class="gain" transform="translate(300 495) scale(.35)" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/></g>
<g id="v4a"><text class="m" x="430" y="430" font-size="22">SHOWS WHAT</text><text class="m" x="430" y="466" font-size="22">YOU VALUE, OR WHAT</text><text class="m" x="430" y="502" font-size="22">YOU NEED TO GRIEVE</text></g></g>
<g id="c4b">
<rect class="s-line" x="840" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">GUILT</text>
<path class="gain" d="M988 340l12-20 12 20z"/>
<circle class="s-ink" cx="1000" cy="470" r="110" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="1000" y="385" font-size="20" text-anchor="middle">N</text>
<g id="nd4"><path class="gain" d="M1000 400L1016 470H984Z"/><path class="ink" d="M1000 540L1016 470H984Z"/></g>
<circle class="ink" cx="1000" cy="470" r="8"/>
<g id="v4b"><text class="m" x="1150" y="430" font-size="22">SHOWS WHERE YOU</text><text class="m" x="1150" y="466" font-size="22">DRIFTED FROM WHO</text><text class="m" x="1150" y="502" font-size="22" style="fill:var(--gain)">YOU WANT TO BE</text></g></g>
<g id="dv4"><text class="d" x="120" y="800" font-size="44">Each feeling carries <tspan style="fill:var(--gain)">directions</tspan>, not verdicts.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Intuition or fear?</text>
<text class="b" x="120" y="176" font-size="32">Learn to tell the two voices apart.</text>
<g id="bb5">
<rect x="310" y="230" width="280" height="70" rx="35" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<text class="m" x="450" y="274" font-size="24" text-anchor="middle" style="fill:var(--gain)">INTUITION</text>
<rect x="1010" y="230" width="280" height="70" rx="35" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="1150" y="274" font-size="24" text-anchor="middle" style="fill:var(--loss)">FEAR</text></g>
<g id="pd5">
<ellipse class="gain" cx="450" cy="470" rx="220" ry="70" fill-opacity=".2"/>
<g id="rp5"></g>
<text class="m" x="450" y="620" font-size="24" text-anchor="middle" style="fill:var(--gain)">QUIET · CALM · STEADY</text></g>
<g id="bl5">
<g id="bli5"><path class="loss" d="M1070 560h160l-20-30v-80a60 60 0 0 0-120 0v80z"/><circle class="loss" cx="1150" cy="382" r="12"/><circle class="loss" cx="1150" cy="574" r="16"/></g>
<path class="s-loss" d="M1050 420q-30 50 0 100M1015 400q-48 70 0 140M1250 420q30 50 0 100M1285 400q48 70 0 140" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1150" y="620" font-size="24" text-anchor="middle" style="fill:var(--loss)">LOUD · URGENT · FRANTIC</text>
<g id="ar5"><text class="d" x="1150" y="690" font-size="40" text-anchor="middle" style="fill:var(--loss)">“Act right now!”</text></g></g>
<g id="pn5"><text class="d" x="120" y="800" font-size="52">Panic is rarely the voice to follow.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A friend cancels plans.</text>
<text class="b" x="120" y="176" font-size="32">A simple example.</text>
<g id="ph6">
<rect class="s-ink" x="140" y="230" width="220" height="400" rx="30" fill="var(--stage)" stroke-width="7"/>
<rect class="s-loss" x="165" y="300" width="170" height="80" rx="14" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="180" y="334" font-size="18">SORRY, CAN’T</text><text class="m" x="180" y="362" font-size="18">MAKE IT</text>
<path class="s-line" d="M220 600h60" stroke-width="6" stroke-linecap="round"/>
<g id="pp6"></g></g>
<g id="st6"></g>
<g id="tb6">
<circle class="s-ink" cx="605" cy="425" r="8" fill="var(--stage)" stroke-width="4"/>
<circle class="s-ink" cx="640" cy="392" r="12" fill="var(--stage)" stroke-width="4"/>
<ellipse class="s-ink" cx="810" cy="300" rx="220" ry="80" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="810" y="312" font-size="30" text-anchor="middle">“Nobody cares about me.”</text></g>
<g id="sp6"><g transform="rotate(-5 810 470)"><rect x="620" y="435" width="380" height="70" rx="8" fill="none" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="810" y="480" font-size="26" text-anchor="middle" style="fill:var(--loss)">A STORY, NOT A FACT</text></g></g>
<g id="nb6">
<rect class="s-ink" x="1080" y="230" width="400" height="430" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="spr6"></g>
<text class="m" x="1120" y="300" font-size="20">THE MESSAGE</text>
<text class="d5" x="1120" y="380" font-size="36">I need more</text>
<text class="d" x="1120" y="428" font-size="36" style="fill:var(--gain)">connection</text>
<text class="d5" x="1120" y="476" font-size="36">this week.</text>
<g id="as6"><rect class="gain" x="1110" y="540" width="340" height="84" rx="42"/><text class="d" x="1280" y="594" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Ask for it.</text></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pause. Name. Choose.</text>
<text class="b" x="120" y="176" font-size="32">What to do when a big feeling arrives.</text>
<g id="k70">
<rect class="s-line" x="120" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle id="pz7" class="gain" cx="327" cy="400" r="90"/>
<rect x="297" y="360" width="20" height="80" rx="4" fill="var(--on-gain)"/><rect x="337" y="360" width="20" height="80" rx="4" fill="var(--on-gain)"/>
<text class="d" x="156" y="600" font-size="46">1 · Pause</text><text class="m" x="156" y="650" font-size="20">BEFORE YOU REACT</text></g>
<g id="k71">
<rect class="s-line" x="593" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="650" y="310" width="300" height="180" rx="18" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="650" y="310" width="300" height="56" rx="18"/>
<text class="m" x="800" y="345" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">HELLO, THIS IS</text>
<text id="nm7" class="d" x="800" y="450" font-size="52" text-anchor="middle">anger.</text>
<text class="d" x="629" y="600" font-size="46">2 · Name</text><text class="m" x="629" y="650" font-size="20">SAY IT PLAINLY</text></g>
<g id="k72">
<rect class="s-line" x="1066" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="1265" y="300" width="16" height="210"/>
<path id="sg7" d="M1273 320h130l30 28-30 28h-130z" fill="var(--line)"/>
<path d="M1273 400h-130l-30 28 30 28h130z" fill="var(--line)"/>
<path class="s-ink" d="M1213 510h120" stroke-width="8" stroke-linecap="round"/>
<text class="d" x="1102" y="600" font-size="46">3 · Choose</text><text class="m" x="1102" y="650" font-size="20">ASK WHERE IT POINTS</text></g>
<g id="dc7"><text class="d" x="120" y="800" font-size="44">Then decide what you <tspan style="fill:var(--gain)">actually</tspan> want to do.</text></g>
</g>

<g id="s8" opacity="0">
<text class="m" x="143" y="250" font-size="26">NEXT TIME A STRONG FEELING SHOWS UP</text>
<g id="ec8"><g id="envc8"></g></g>
<g id="qa"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">Write its message</text></g>
<g id="qb"><text class="d" x="136" y="480" font-size="88" letter-spacing="-2">in one sentence.</text></g>
<g id="qc"><text class="d" x="136" y="640" font-size="88" letter-spacing="-2">What would I choose</text></g>
<g id="qd"><text class="d" x="136" y="740" font-size="88" letter-spacing="-2">if I were <tspan style="fill:var(--gain)">calm</tspan>?</text></g>
</g>