<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why nobody wants</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to slow down.</text>
<text class="b" x="120" y="600" font-size="32">The forces that keep the wave racing ahead, and why we look away.</text>
