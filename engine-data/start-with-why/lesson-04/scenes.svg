<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">It’s biology,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not soft talk.</text>
<text class="b" x="120" y="600" font-size="32">Why a clear purpose speaks to the brain’s decision maker.</text>
<path class="ink" d="M1200 600v-50a120 120 0 0 1 240 0v50z"/>
<circle class="s-ink" cx="1320" cy="360" r="110" fill="var(--stage)" stroke-width="7"/>
<circle class="s-line" cx="1320" cy="355" r="80" fill="none" stroke-width="5"/>
<circle id="tBr" class="loss" cx="1320" cy="355" r="50"/>
<g id="tChk"><circle class="gain" cx="1440" cy="240" r="40"/><path d="M1420 240l14 14 26-28" stroke="var(--on-gain)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two brains in one.</text>
<text class="b" x="120" y="176" font-size="32">A slice of the human brain, seen from above.</text>
<g id="b1"></g>
<g id="ncL"><circle cx="874" cy="282" r="10" fill="var(--line)" stroke="var(--ink)" stroke-width="3"/><text class="m" x="896" y="290" font-size="22">NEOCORTEX · THE NEWEST PART</text></g>
<g id="ncP"></g>
<g id="lbL"><circle class="loss" cx="874" cy="552" r="10"/><text class="m" x="896" y="560" font-size="22">LIMBIC BRAIN · THE OLDER PART</text></g>
<g id="lbP"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Circle fits the brain.</text>
<text class="b" x="120" y="176" font-size="32">Lay the Golden Circle over the brain slice.</text>
<g id="b2"></g>
<g id="gc">
<circle id="gcW" cx="500" cy="530" r="245" fill="none" stroke="var(--ink)" stroke-width="6"/>
<circle cx="500" cy="530" r="140" fill="none" stroke="var(--ink)" stroke-width="6"/>
<circle class="gain" cx="500" cy="530" r="62"/>
<text class="m" x="500" y="318" font-size="24" text-anchor="middle" style="fill:var(--ink)">WHAT</text>
<text class="m" x="500" y="430" font-size="24" text-anchor="middle" style="fill:var(--ink)">HOW</text>
<text class="m" x="500" y="539" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">WHY</text>
</g>
<g id="wR"><path class="s-muted" d="M720 360H880" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="900" y="380" font-size="56">WHAT</text><text class="m" x="900" y="420" font-size="22">= NEOCORTEX · REASON</text></g>
<g id="iR"><path class="s-muted" d="M650 560H880" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="900" y="580" font-size="56" style="fill:var(--gain)">WHY + HOW</text><text class="m" x="900" y="620" font-size="22">= LIMBIC BRAIN · FEELING</text></g>
<g id="bio"><text class="d" x="900" y="740" font-size="48">The model follows</text><text class="d" x="900" y="800" font-size="48">our biology.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No words inside.</text>
<text class="b" x="120" y="176" font-size="32">The limbic brain has no capacity for language.</text>
<circle class="loss" cx="360" cy="520" r="140"/>
<circle cx="315" cy="490" r="12" fill="var(--stage)"/><circle cx="405" cy="490" r="12" fill="var(--stage)"/>
<path d="M310 570H410M330 556v28M360 556v28M390 556v28" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="360" y="710" font-size="22" text-anchor="middle">LIMBIC BRAIN</text>
<g id="bub3"><path d="M600 358l-30 52 70-52" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><rect x="540" y="230" width="280" height="130" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="680" y="312" font-size="44" text-anchor="middle">Words?</text>
<path id="x3" class="s-loss" d="M600 250L760 340M760 250L600 340" stroke-width="10" stroke-linecap="round"/></g>
<g id="st3"><path class="s-gain" d="M520 560C620 560 700 520 860 520m-26-24 26 24-26 24" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="560" y="620" font-size="22">STEERS THE CHOICE</text></g>
<g id="per3"></g>
<circle id="g3r" cx="1100" cy="510" r="28" fill="none" stroke="var(--gain)" stroke-width="5"/>
<circle id="g3" class="gain" cx="1100" cy="510" r="28"/>
<g id="gl3"><text class="m" x="1100" y="660" font-size="26" text-anchor="middle" style="fill:var(--gain)">GUT DECISION</text><text class="d5" x="1100" y="720" font-size="36" text-anchor="middle">It feels right.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why do you love them?</text>
<text class="b" x="120" y="176" font-size="32">Sinek’s familiar example.</text>
<g id="cp"></g>
<g id="ask4"><text class="m" x="150" y="610" font-size="22">ASK WHY THEY LOVE THEM</text></g>
<g id="tr4"></g>
<g id="cr4"></g>
<g id="crl"><text class="m" x="780" y="640" font-size="22">PLENTY ARE SMART, FUNNY AND KIND</text></g>
<g id="fe4"><g id="h4g"></g><text class="d" x="300" y="780" font-size="44">The real reason is a feeling.</text><text class="m" x="300" y="826" font-size="22">ONE THEY STRUGGLE TO DESCRIBE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Facts alone fall flat.</text>
<text class="b" x="120" y="176" font-size="32">Features, prices and specs reach the neocortex.</text>
<g id="sp"><rect x="140" y="240" width="320" height="440" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="spr"></g></g>
<g id="ar5"><path class="s-ink" d="M490 460H640m-22-22 22 22-22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="b5"></g>
<g id="und5"><text class="m" x="880" y="720" font-size="22" text-anchor="middle">UNDERSTOOD BY THE NEOCORTEX</text></g>
<g id="sh5"><path class="s-ink" d="M1240 500l-40-30l-10-30M1360 500l40-30l10-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g id="shp"></g><text class="d" x="1300" y="340" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d5" x="1300" y="640" font-size="34" text-anchor="middle">No action.</text></g>
<g id="da5"><circle id="dr5" cx="880" cy="460" r="125" fill="none" stroke="var(--loss)" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="880" y="468" font-size="20" text-anchor="middle" style="fill:var(--stage)">DECIDES HERE</text></g>
<g id="dt5"><text class="d" x="120" y="800" font-size="44">The real decision is made deeper down.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feeling first, then reasons.</text>
<text class="b" x="120" y="176" font-size="32">Start with why to reach the decision maker.</text>
<g id="b6"></g>
<line id="beam" x1="236" y1="500" x2="236" y2="500" stroke="var(--gain)" stroke-width="14" stroke-linecap="round"/>
<g id="ws"><circle class="gain" cx="180" cy="500" r="56"/><text class="m" x="180" y="509" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g>
<path id="ck6" d="M510 500l35 35 70-75" fill="none" stroke="var(--on-gain)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<g id="ar6"><path class="s-muted" d="M810 470H880m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="900" y="300" font-size="22">THEN THE REASONS</text></g>
<g id="rw6"></g>
<g id="loy6"><text class="d" x="120" y="800" font-size="40">Loyal customers feel it before they can explain it.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it yourself.</text>
<text class="b" x="120" y="176" font-size="32">Open with what you believe.</text>
<g id="pr7"></g>
<g id="bel"><rect class="gain" x="360" y="250" width="660" height="170" rx="20"/><text class="m" x="390" y="300" font-size="22" style="fill:var(--on-gain)">OPEN WITH YOUR WHY</text><text class="d" x="390" y="380" font-size="52" style="fill:var(--on-gain)">“We believe…”</text></g>
<g id="cd7"></g>
<g id="ord7"><circle class="gain" cx="1280" cy="320" r="80"/><text class="m" x="1280" y="328" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">FEELING</text>
<path class="s-muted" d="M1280 412V500m-20-20 20 20 20-20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1280" cy="590" r="80" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="m" x="1280" y="598" font-size="22" text-anchor="middle" style="fill:var(--ink)">REASONS</text></g>
<g id="fl7"><text class="d" x="120" y="790" font-size="44">Let the feeling land first. Reasons follow.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Think of a gut choice.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">What belief behind it</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">can you put into <tspan style="fill:var(--gain)">words</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">PUT THE FEELING INTO WORDS</text>
