<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Everyone craves</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">feeling important.</text>
<text class="b" x="120" y="600" font-size="32">Why sincere appreciation is the most powerful gift you can give.</text>
<path class="s-ink" d="M1086 360v40a14 14 0 0 0 28 0v-40M1100 360v40M1100 414v120" fill="none" stroke-width="6" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1290" cy="470" rx="170" ry="52" fill="var(--stage)" stroke-width="6"/>
<ellipse class="s-line" cx="1290" cy="470" rx="120" ry="34" fill="none" stroke-width="4"/>
