<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">People don’t want</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">what you want.</text>
<text class="b" x="120" y="600" font-size="32">Empathy means telling stories that fit what people already believe.</text>
<g id="tg"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">They don’t know what you know.</text>
<text class="b" x="120" y="176" font-size="32">Godin’s first step: admit a simple truth.</text>
<g id="mir">
<ellipse class="s-ink" cx="380" cy="520" rx="170" ry="220" fill="var(--ice)" stroke-width="7"/>
<path class="s-ink" d="M380 740V790M320 790h120" stroke-width="7" stroke-linecap="round"/>
<g id="you1"></g>
<text class="m" x="380" y="670" font-size="22" text-anchor="middle">YOU</text>
</g>
<g id="them"><text class="m" x="1260" y="670" font-size="22" text-anchor="middle">THEM</text></g>
<g id="cl1"><ellipse class="s-ink" cx="680" cy="360" rx="110" ry="70" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="560" cy="412" r="10" fill="var(--stage)" stroke-width="4"/><g id="cy"></g></g>
<g id="cl2"><ellipse class="s-ink" cx="1000" cy="360" rx="110" ry="70" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="1140" cy="412" r="10" fill="var(--stage)" stroke-width="4"/><g id="ct"></g></g>
<g id="gap">
<path class="s-muted" d="M610 590H1090M630 574l-20 16 20 16M1070 574l20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="850" y="566" font-size="22" text-anchor="middle">THE EMPATHY GAP</text>
</g>
<g id="n1"><text class="d5" x="850" y="690" font-size="40" text-anchor="middle">Not a flaw to fix.</text></g>
<g id="n2"><text class="d" x="850" y="770" font-size="52" text-anchor="middle" style="fill:var(--gain)">It’s the starting point.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody wants a drill.</text>
<text class="b" x="120" y="176" font-size="32">A classic marketing lesson, retold by Godin.</text>
<path class="s-line" d="M120 640H1480" stroke-width="4"/>
<g id="shop">
<path class="s-ink" d="M140 300L180 240H700L740 300Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="440" y="282" font-size="22" text-anchor="middle">HARDWARE</text>
<g id="seller"></g>
<rect class="ink" x="140" y="560" width="600" height="70" rx="6"/>
</g>
<g id="drl"></g>
<g id="chips2"></g>
<path id="dx" class="s-loss" d="M370 400L670 560M670 400L370 560" stroke-width="6" stroke-linecap="round"/>
<g id="cust"></g>
<g id="hb">
<ellipse class="s-ink" cx="1200" cy="270" rx="120" ry="70" fill="var(--stage)" stroke-width="4"/>
<circle class="s-ink" cx="1180" cy="374" r="8" fill="var(--stage)" stroke-width="4"/>
<rect x="1120" y="232" width="160" height="76" fill="var(--line)"/>
<circle id="holeC" class="ink" cx="1200" cy="270" r="22"/>
</g>
<g id="cap2"><text class="d" x="120" y="770" font-size="56">They wanted a <tspan style="fill:var(--gain)">hole</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Dig deeper.</text>
<text class="b" x="120" y="176" font-size="32">Under every want sits a deeper want.</text>
<g id="rows"></g>
<path id="shaft" class="s-ink" stroke-width="6" stroke-linecap="round" fill="none"/>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone wears glasses.</text>
<text class="b" x="120" y="176" font-size="32">Godin calls this lens a worldview.</text>
<g id="gl">
<circle class="s-ink" cx="690" cy="330" r="70" fill="var(--ice)" stroke-width="8"/>
<circle class="s-ink" cx="910" cy="330" r="70" fill="var(--ice)" stroke-width="8"/>
<path class="s-ink" d="M760 322q40-24 80 0M620 312l-60-24M980 312l60-24" fill="none" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="wc"></g>
<g id="pitchG"><rect class="ink" x="700" y="600" width="200" height="80" rx="14"/><text class="d5" x="800" y="650" font-size="30" text-anchor="middle" style="fill:var(--stage)">PITCH</text></g>
<g id="pa"></g>
<g id="pb"></g>
<g id="bA"><ellipse class="s-gain" cx="280" cy="470" rx="98" ry="36" fill="var(--stage)" stroke-width="4"/><text class="m" x="280" y="478" font-size="22" text-anchor="middle" style="fill:var(--gain)">STORY A</text></g>
<g id="bB"><ellipse class="s-loss" cx="1320" cy="470" rx="98" ry="36" fill="var(--stage)" stroke-width="4"/><text class="m" x="1320" y="478" font-size="22" text-anchor="middle" style="fill:var(--loss)">STORY B</text></g>
<g id="dots"></g>
<path id="wallL" class="s-loss" d="M1220 570V700" stroke-width="8" stroke-linecap="round"/>
<g id="fcap"><text class="d5" x="800" y="800" font-size="36" text-anchor="middle">Whatever doesn’t fit their lens bounces off.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t argue. Match.</text>
<text class="b" x="120" y="176" font-size="32">Find people whose worldview already leans your way.</text>
<g id="lp">
<rect class="s-line" x="120" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">ARGUE</text>
<g id="lpp"></g>
<path class="s-loss" d="M350 460h170m-20-16 20 16-20 16M530 510H360m20-16-20 16 20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="nox">
<path class="s-loss" d="M360 400L520 580M520 400L360 580" stroke-width="12" stroke-linecap="round"/>
<text class="d5" x="150" y="720" font-size="36">Almost never works.</text>
</g>
<g id="rp">
<rect class="s-line" x="840" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">MATCH</text>
<path class="ink" d="M940 440H1100V520H1130A30 30 0 0 0 1190 520H1220V440H1380V640H940Z"/>
<text class="m" x="1160" y="612" font-size="22" text-anchor="middle" style="fill:var(--stage)">THEIR WORLDVIEW</text>
<g id="pmove"><path class="gain" d="M1100 380H1220V520H1190A30 30 0 0 1 1130 520H1100Z"/><text class="m" x="1160" y="462" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">STORY</text></g>
</g>
<g id="mcap"><text class="d5" x="870" y="720" font-size="36">It fits what they believe.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same drill, new story.</text>
<text class="b" x="120" y="176" font-size="32">One product, two people, two different worries.</text>
<g id="drl6"></g>
<g id="rent"></g>
<g id="home"></g>
<path id="arr6" class="s-muted" d="M670 370H340m20-16-20 16 20 16M910 370H1260m-20-16 20 16-20 16" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="cR">
<rect class="s-line" x="120" y="500" width="600" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="560" font-size="22">THE RENTER</text>
<text class="b" x="150" y="612" font-size="28">Worried about the walls.</text>
<rect class="s-ink" x="580" y="520" width="100" height="64" fill="none" stroke-width="5"/>
<path class="s-loss" d="M615 520l14 18-12 14 16 14-6 18" fill="none" stroke-width="5" stroke-linejoin="round"/>
</g>
<g id="sR"><text class="d5" x="150" y="690" font-size="40">Small, clean holes,</text><text class="d5" x="150" y="745" font-size="40" style="fill:var(--gain)">easy to patch.</text></g>
<g id="cH">
<rect class="s-line" x="880" y="500" width="600" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="910" y="560" font-size="22">THE NEW HOMEOWNER</text>
<text class="b" x="910" y="612" font-size="28">Wants it to feel theirs.</text>
<path class="gain" d="M1350 584V548L1390 516L1430 548V584Z"/>
</g>
<g id="sH"><text class="d5" x="910" y="690" font-size="40">Finally, your own</text><text class="d5" x="910" y="745" font-size="40" style="fill:var(--gain)">stamp on the place.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen first.</text>
<text class="b" x="120" y="176" font-size="32">Study the people you hope to serve, before you write a word.</text>
<g id="nb">
<rect class="s-ink" x="160" y="260" width="400" height="500" rx="14" fill="var(--stage)" stroke-width="7"/>
<g id="nlines"></g><g id="rings"></g>
</g>
<g id="ys"><text class="d" x="360" y="350" font-size="40" text-anchor="middle" style="fill:var(--gain)">YOUR STORY</text></g>
<g id="lis"></g>
<g id="qm"><text class="d" x="1380" y="400" font-size="180" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="qch"></g>
<g id="qlinks"></g>
<g id="cap7"><text class="d5" x="120" y="830" font-size="40">Their answers become your story.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Name three things</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">your customer believes</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">that <tspan style="fill:var(--gain)">you don’t</tspan>.</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">START YOUR PITCH FROM THEIR BELIEFS</text></g>
<g id="crdG">
<rect id="crdR" x="1080" y="550" width="380" height="240" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text class="m" x="1110" y="600" font-size="20">THEY BELIEVE</text>
<g id="crd"></g>
</g>
</g>