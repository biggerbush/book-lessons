<rect class="s-ink" x="920" y="300" width="110" height="90" fill="none" stroke-width="5"/>
<path class="s-ink" d="M975 300v90M920 345h110" stroke-width="4"/>
<rect class="ink" x="880" y="420" width="160" height="40" rx="14" fill-opacity=".6"/>
<rect class="ink" x="870" y="452" width="180" height="48" rx="14"/>
<rect class="ink" x="1070" y="478" width="30" height="40" rx="4"/><circle class="gain" cx="1085" cy="462" r="20"/>
<path class="s-line" d="M840 520h270" stroke-width="4"/>
<text class="m" x="975" y="590" font-size="20" text-anchor="middle">A CALM, TIDY ROOM</text>
