<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Anchor yourself in</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your inner body.</text>
<text class="b" x="120" y="600" font-size="32">Your body is always here, so let it bring you home.</text>
<ellipse id="aura0" class="gain" cx="1300" cy="480" rx="150" ry="230" opacity="0"/>
<g id="dots0"></g><g id="fg0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lost in the head.</text>
<text class="b" x="120" y="176" font-size="32">Most of us live almost entirely in our heads.</text>
<g id="cl1">
<path class="s-loss" d="M250 410a50 50 0 0 1 10-90a70 70 0 0 1 120-30a60 60 0 0 1 110 40a45 45 0 0 1-10 80z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-loss" d="M285 350q20-20 40 0t40 0t40 0M305 385q15-15 30 0t30 0t30 0" fill="none" stroke-width="4" stroke-linecap="round"/>
<circle class="loss" cx="372" cy="432" r="10"/><circle class="loss" cx="380" cy="454" r="6"/>
</g>
<g id="wk1"></g>
<g id="st1"><path class="s-ink" d="M120 806H760" stroke-width="5" stroke-linecap="round"/><text class="m" x="760" y="846" font-size="20" text-anchor="end">FEET ON THE GROUND, BARELY NOTICED</text></g>
<g id="out1"><text class="m" x="380" y="228" font-size="20" text-anchor="middle" style="fill:var(--loss)">OUT OF THE PRESENT</text></g>
<g id="bo1"><path class="s-gain" d="M600 420H1000M976 400l24 20-24 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse id="au1" class="gain" cx="1190" cy="560" rx="140" ry="200" opacity="0"/><g id="bo1f"></g>
<text class="d5" x="1190" y="810" font-size="34" text-anchor="middle">Feel the life inside your body.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feel it from the inside.</text>
<text class="b" x="120" y="176" font-size="32">The inner body is sensed, not looked at or thought about.</text>
<g id="c2a"><rect class="s-line" x="120" y="240" width="440" height="180" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M156 330q44-38 88 0q-44 38-88 0z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="200" cy="330" r="12"/>
<text class="m" x="276" y="339" font-size="24" style="fill:var(--ink)">LOOKING AT IT</text>
<path id="k21" d="M158 290L242 370M242 290L158 370" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="c2b"><rect class="s-line" x="120" y="460" width="440" height="180" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M180 548a18 18 0 0 1 0-34a24 24 0 0 1 42-10a20 20 0 0 1 20 28a14 14 0 0 1-10 16z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="ink" cx="184" cy="568" r="7"/><circle class="ink" cx="170" cy="586" r="5"/>
<text class="m" x="276" y="559" font-size="24" style="fill:var(--ink)">THINKING ABOUT IT</text>
<path id="k22" d="M158 498L248 590M248 498L158 590" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="fg2"></g>
<text id="in2" class="m" x="1000" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">FROM THE INSIDE</text>
<g id="dr2"><path class="gain" d="M1270 340L1370 380V700L1270 740z" fill-opacity=".3"/><rect class="s-gain" x="1270" y="340" width="170" height="400" fill="none" stroke-width="6"/>
<text class="m" x="1440" y="800" font-size="20" text-anchor="end">A DOORWAY TO STILLNESS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your body is always here.</text>
<text class="b" x="120" y="176" font-size="32">Thoughts drift to yesterday or tomorrow. The body stays now.</text>
<g id="clk3"><circle class="s-ink" cx="330" cy="420" r="120" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M330 312v18M330 510v18M222 420h18M420 420h18" stroke-width="5" stroke-linecap="round"/>
<line id="hh3" class="s-ink" x1="330" y1="420" x2="330" y2="360" stroke-width="10" stroke-linecap="round"/>
<line id="mh3" class="s-loss" x1="330" y1="420" x2="330" y2="330" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="330" cy="420" r="10"/>
<text class="m" x="330" y="586" font-size="20" text-anchor="middle">THOUGHTS WANDER</text></g>
<g id="tl3"><path class="s-line" d="M160 720H1440M260 708v24M800 708v24M1340 708v24" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="260" y="772" font-size="22" text-anchor="middle">YESTERDAY</text>
<text id="nl3" class="m" x="800" y="772" font-size="22" text-anchor="middle">NOW</text>
<text class="m" x="1340" y="772" font-size="22" text-anchor="middle">TOMORROW</text></g>
<g id="th3" opacity="0"><circle class="loss" r="22"/><circle class="loss" cx="0" cy="34" r="7"/></g>
<g id="fg3"></g>
<polyline id="ecg3" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0"/>
<g id="now3"><path class="s-gain" d="M800 612V690" stroke-width="5" stroke-dasharray="8 8"/><circle class="s-gain" cx="800" cy="720" r="26" fill="none" stroke-width="6"/></g>
<g id="bk3"><text class="d" x="120" y="840" font-size="44">Feel it, and you are back in the now.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with your hands.</text>
<text class="b" x="120" y="176" font-size="32">Close your eyes. Rest your attention gently on your hands.</text>
<g id="lb4"><text class="m" x="120" y="260" font-size="22">THE PRACTICE</text></g>
<circle class="s-ink" cx="380" cy="450" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M230 790v-50a150 120 0 0 1 300 0v50z"/>
<ellipse id="e41" class="ink" cx="330" cy="440" rx="18" ry="14"/><ellipse id="e42" class="ink" cx="430" cy="440" rx="18" ry="14"/>
<path class="s-ink" d="M350 520q30 18 60 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="bm4" opacity="0"><path id="bp4" class="s-gain" d="M540 450C680 410 800 410 890 450" fill="none" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
<path class="s-gain" d="M864 428l26 22-30 10" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="bz4" opacity="0"><text class="m" x="1190" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">FAINT WARMTH · BUZZING</text></g>
<g id="hd4"></g>
<g id="q4"><text class="d5" x="760" y="800" font-size="38">Can you feel the life inside them?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spread the feeling.</text>
<ellipse id="au5" class="gain" cx="560" cy="490" rx="230" ry="320" opacity="0"/>
<g id="fg5"></g>
<path id="sq5" class="s-loss" d="M760 230q15-15 30 0t30 0t30 0M770 270q15-15 30 0t30 0" fill="none" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="960" y="240" font-size="22">MOVE YOUR ATTENTION</text>
<g id="ls5"></g>
<g id="qt5"><text class="d" x="960" y="780" font-size="44">The mind grows quiet.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Attention can’t be fully in two places at once.</text>
<g id="bm6">
<path id="bt6" class="s-loss" d="M270 440C420 440 450 300 600 300" fill="none" stroke-linecap="round"/>
<path id="bb6" class="s-gain" d="M270 440C420 440 450 580 600 580" fill="none" stroke-linecap="round"/>
<circle class="gain" cx="220" cy="440" r="56"/>
<text class="m" x="220" y="540" font-size="22" text-anchor="middle">ATTENTION</text>
<rect class="s-loss" x="600" y="260" width="200" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="700" y="308" font-size="22" text-anchor="middle">THOUGHTS</text>
<rect class="s-gain" x="600" y="540" width="200" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="700" y="588" font-size="22" text-anchor="middle">BODY</text></g>
<g id="ls6"><text class="m" x="120" y="690" font-size="22">MORE TO THE BODY, LESS LEFT FOR THOUGHTS</text></g>
<g id="fg6"><path class="s-ink" d="M940 640H1440" stroke-width="5" stroke-linecap="round"/></g>
<g id="rt6"></g>
<g id="cf6" opacity="0"><path class="s-ink" d="M1166 328q6 5 12 0M1182 328q6 5 12 0M1170 342q10 8 20 0" fill="none" stroke-width="3" stroke-linecap="round"/></g>
<g id="cd6" opacity="0"></g>
<g id="rw6"><text class="m" x="1360" y="610" font-size="22" text-anchor="middle" style="fill:var(--gain)">ROOTED WITHIN</text></g>
<g id="tx6"><text class="d" x="120" y="820" font-size="44">Thoughts come, but don’t drag you away.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">In everyday life.</text>
<text class="b" x="120" y="176" font-size="32">Tolle’s practice for ordinary moments.</text>
<g id="k70"><rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">IN CONVERSATION</text><g id="pp7a"></g>
<g id="lw7"><path class="s-muted" d="M330 400q-12 20 0 40M350 388q-20 32 0 64" fill="none" stroke-width="4" stroke-linecap="round"/><circle id="gl7" class="gain" cx="250" cy="530" r="12"/></g>
<text class="d5" x="150" y="650" font-size="34">Listen and feel.</text></g>
<g id="k71"><rect class="s-line" x="590" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="620" y="280" font-size="22">IN A QUEUE</text><g id="pp7b"></g>
<path class="s-line" d="M620 540H980" stroke-width="4" stroke-linecap="round"/>
<text class="d5" x="620" y="650" font-size="34">Wait and feel.</text></g>
<g id="k72"><rect class="s-line" x="1060" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1090" y="280" font-size="22">WHEN UPSET</text>
<g id="st7">
<path class="s-loss" d="M1216 372a24 24 0 0 1 6-46a36 36 0 0 1 62-16a30 30 0 0 1 52 24a20 20 0 0 1-8 38z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<polyline id="sp7" class="s-loss" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-loss" d="M1272 382l-16 24h18l-12 22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="pp7c"></g>
<g id="ia7"><path class="s-gain" d="M1170 540h40M1196 526l14 14-14 14M1370 540h-40M1344 526l-14 14 14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="1270" cy="550" r="10"/></g>
<text class="d5" x="1090" y="650" font-size="34">Turn inward first.</text></g>
<g id="bt7"><text class="d" x="120" y="800" font-size="40">Keep some attention in your body.</text></g>
</g>

<g id="s8" opacity="0">
<circle id="rg8" class="s-gain" cx="1310" cy="510" r="150" fill="none" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
<g id="pm8"></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Can you stay rooted</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">in your hands for</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">just <tspan style="fill:var(--gain)">one breath</tspan>?</text></g>
<g id="lb8"><text class="m" x="143" y="700" font-size="26">PICK ONE ORDINARY MOMENT TODAY</text></g>
</g>