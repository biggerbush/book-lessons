<text class="d" x="1260" y="700" font-size="48" text-anchor="middle">Get curious</text>
<text class="m" x="1260" y="750" font-size="20" text-anchor="middle">WHAT AM I FEELING, AND WHY?</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Question the story.</text>
<text class="b" x="120" y="176" font-size="32">Back on shore, she told Steve what was going on inside.</text>
<path class="s-line" d="M120 700H1480" stroke-width="6" stroke-linecap="round"/>
<g id="ppl5"></g>
<g id="bb5">
