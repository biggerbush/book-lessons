</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The punch he didn’t brace for.</text>
<text class="b" x="120" y="176" font-size="32">As the book tells it, a student visited him backstage.</text>
<path class="s-line" d="M400 705h1000" stroke-width="4"/>
