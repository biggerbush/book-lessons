<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 4</text>
<text class="d" x="116" y="530" font-size="84" letter-spacing="-2">Their feelings are theirs.</text>
<text class="d" x="116" y="626" font-size="84" letter-spacing="-2">Yours are yours.</text>
<text class="b" x="120" y="720" font-size="32">Let others have their feelings, and take charge of yours.</text>
<g id="tthem"></g>
<g id="tcl"></g>
<path id="tbolt" class="s-gain" d="M1196 236l-16 28h20l-14 28" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ttug" class="s-gain" d="M1340 380Q1260 340 1180 380" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
<g id="tyou"><g id="tyin"></g></g>
<text id="tq" class="d" x="1260" y="300" font-size="72" text-anchor="middle" style="fill:var(--gain)">?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The urge to fix.</text>
<text class="b" x="120" y="176" font-size="32">A friend goes quiet and sulky after you change plans.</text>
<g id="fr"><g id="frb"></g><path d="M404 466q16-12 32 0" stroke="var(--stage)" stroke-width="5" fill="none" stroke-linecap="round"/></g>
<g id="frd"><rect class="s-ink" x="476" y="330" width="96" height="50" rx="25" fill="var(--stage)" stroke-width="4"/><circle class="ink" cx="502" cy="355" r="6"/><circle class="ink" cx="524" cy="355" r="6"/><circle class="ink" cx="546" cy="355" r="6"/></g>
<g id="rp">
<path class="s-muted" d="M680 420A100 100 0 0 1 880 420" fill="none" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="680" y="456" font-size="20" text-anchor="middle">SAD</text>
<text class="m" x="880" y="456" font-size="20" text-anchor="middle">HAPPY</text>
<line id="ndl" class="s-ink" x1="780" y1="420" x2="780" y2="340" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="780" cy="420" r="12"/>
<path id="rope" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="yo"><g id="yi"><g id="yob"></g><path id="knot" class="s-loss" d="M1120 560c10-20 30 10 20 20s-30-10-10-20 30 0 20 10" fill="none" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="wds"></g>
<g id="ctl"><text class="d" x="120" y="790" font-size="48">It feels caring, but it’s control.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Adults have tantrums too.</text>
<text class="b" x="120" y="176" font-size="32">Just quieter ones than a toddler’s.</text>
<g id="tod"><g id="todb"></g><path id="zz" class="s-loss" d="M206 488l-20-16M274 488l20-16M240 482v-24" stroke-width="5" stroke-linecap="round"/><text class="m" x="240" y="680" font-size="20" text-anchor="middle">TODDLER</text></g>
<g id="ad"><g id="adb"></g><text class="m" x="500" y="680" font-size="20" text-anchor="middle">ADULT · QUIETER</text></g>
<g id="k0"><rect class="s-line" x="720" y="240" width="380" height="100" rx="16" fill="var(--stage)" stroke-width="3"/><path class="s-muted" d="M745 300q15-20 30 0t30 0" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d5" x="830" y="302" font-size="34">A sigh</text></g>
<g id="k1"><rect class="s-line" x="720" y="370" width="380" height="100" rx="16" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="745" y="395" width="60" height="40" rx="8" fill="none" stroke-width="4"/><path class="s-ink" d="M760 435l-6 14 18-14" fill="none" stroke-width="4" stroke-linejoin="round"/><text class="d5" x="830" y="432" font-size="34">A cold reply</text></g>
<g id="k2"><rect class="s-line" x="720" y="500" width="380" height="100" rx="16" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="757" y="515" width="40" height="70" rx="3" fill="none" stroke-width="4"/><circle class="ink" cx="788" cy="552" r="4"/><text class="d5" x="830" y="562" font-size="34">A slammed door</text></g>
<g id="dl">
<text class="m" x="1290" y="340" font-size="20" text-anchor="middle">DISCOMFORT</text>
<path class="s-line" d="M1150 520A140 140 0 0 1 1430 520" fill="none" stroke-width="16" stroke-linecap="round"/>
<path id="parc" class="s-loss" d="M1150 520A140 140 0 0 1 1430 520" fill="none" stroke-width="16" stroke-dasharray="440" stroke-dashoffset="440"/>
<line id="pnd" class="s-ink" x1="1290" y1="520" x2="1290" y2="410" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="1290" cy="520" r="14"/>
</g>
<g id="gin"><text class="d" x="1290" y="600" font-size="44" text-anchor="middle" style="fill:var(--loss)">Give in</text></g>
<g id="gv"><text class="d" x="120" y="800" font-size="46">We give in, just to make the discomfort stop.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let them feel it.</text>
<g id="sgn"><rect class="gain" x="620" y="200" width="360" height="80" rx="40"/><text class="d" x="800" y="256" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">LET THEM</text></g>
<g id="bub">
<circle class="s-loss" cx="460" cy="540" r="190" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
<circle class="s-gain" cx="1140" cy="540" r="190" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
<text class="m" x="460" y="334" font-size="22" text-anchor="middle">THEIRS</text>
<text class="m" x="1140" y="334" font-size="22" text-anchor="middle">YOURS</text>
</g>
<g id="th"><g id="thb"></g></g>
<g id="tcdo"><g id="tcd"></g></g>
<g id="me3"></g>
<g id="wd3"></g>
<g id="psn"><text class="d5" x="120" y="852" font-size="34">Their mood can pass on its own, without you rescuing it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A boundary, kept kindly.</text>
<g id="cal">
<rect class="s-ink" x="120" y="250" width="320" height="290" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="120" y="250" width="320" height="56" rx="14"/>
<text class="m" x="280" y="287" font-size="20" text-anchor="middle" style="fill:var(--stage)">HOLIDAYS</text>
<g id="calg"></g>
<text class="m" x="280" y="586" font-size="20" text-anchor="middle">NOT TRAVELLING HOME</text>
</g>
<g id="phn">
<rect class="s-ink" x="640" y="270" width="150" height="260" rx="24" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="715" cy="500" r="10"/>
<circle class="loss" cx="715" cy="380" r="34"/>
<path d="M700 396q15-10 30 0" stroke="var(--stage)" stroke-width="4" fill="none" stroke-linecap="round"/>
<text class="m" x="715" y="586" font-size="20" text-anchor="middle">HURT</text>
<g id="pwv"></g>
</g>
<g id="y4a"></g>
<g id="y4b" opacity="0"></g>
<g id="gcl" opacity="0"><g id="gclc"></g><text class="m" x="1200" y="282" font-size="20" text-anchor="middle" style="fill:var(--stage)">CAVE IN</text></g>
<circle id="rg" class="s-gain" cx="1200" cy="480" r="150" fill="none" stroke-width="6" opacity="0"/>
<g id="kpt"><text class="m" x="1200" y="680" font-size="20" text-anchor="middle" style="fill:var(--gain)">DECISION KEPT, KINDLY</text></g>
<g id="nwr"><text class="d" x="120" y="800" font-size="44">Disappointing someone isn’t doing something wrong.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Now, let me.</text>
<text class="b" x="120" y="176" font-size="32">The second half points back at you.</text>
<g id="mir"><ellipse class="s-ink" cx="340" cy="510" rx="160" ry="220" fill="var(--stage)" stroke-width="8"/><g id="mirb"></g></g>
<path id="mar" class="s-gain" d="M600 380C600 280 540 260 490 300M490 300l28-2M490 300l6 26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
<g id="hrt"><g id="hrtb" transform="translate(800 450)"><path class="loss" transform="scale(.8)" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/></g><text class="m" x="800" y="640" font-size="22" text-anchor="middle">GUILT · ANGER · ANXIETY</text></g>
<g id="hl1"><text class="m" x="800" y="684" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOURS TO HANDLE</text></g>
<g id="brg"><circle id="brc" class="s-gain" cx="1220" cy="470" r="100" fill="var(--gain)" fill-opacity=".15" stroke-width="6"/><text class="d5" x="1220" y="480" font-size="30" text-anchor="middle">breathe</text><text class="m" x="1220" y="680" font-size="20" text-anchor="middle">NOTICE · BREATHE · RESPOND</text></g>
<g id="cnt"><text class="d" x="120" y="810" font-size="46">That part you can actually control.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Calm is a choice.</text>
<g id="c6y"></g>
<path id="pA" class="s-loss" d="M250 470L330 420L380 470L440 360L500 420L560 300L620 360L700 270L760 300" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<path id="pB" class="s-gain" d="M250 490C450 500 560 570 760 560" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<circle id="dA" class="loss" r="14" opacity="0"/>
<circle id="dB" class="gain" r="14" opacity="0"/>
<g id="la"><text class="d5" x="790" y="300" font-size="38" style="fill:var(--loss)">Snap back</text><text class="m" x="790" y="340" font-size="22">OR SCRAMBLE TO PLEASE</text></g>
<g id="lb"><text class="d5" x="790" y="570" font-size="40" style="fill:var(--gain)">A calm, deliberate reply</text><text class="m" x="790" y="610" font-size="22">CHOSEN ON PURPOSE</text></g>
<g id="qt"><rect class="s-ink" x="120" y="650" width="1000" height="170" rx="24" fill="var(--stage)" stroke-width="5"/><text class="d" x="160" y="722" font-size="42">“I can see you’re upset,</text><text class="d" x="160" y="782" font-size="42">and I still mean what I said.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<g id="b1"><rect class="s-ink" x="160" y="270" width="300" height="130" rx="16" fill="none" stroke-width="7"/><rect class="ink" x="466" y="310" width="18" height="50" rx="4"/><rect id="bf1" class="loss" x="174" y="284" width="272" height="102" rx="8"/><text class="m" x="160" y="440" font-size="20">MANAGING EVERYONE’S MOODS</text></g>
<g id="b2"><rect class="s-ink" x="160" y="510" width="300" height="130" rx="16" fill="none" stroke-width="7"/><rect class="ink" x="466" y="550" width="18" height="50" rx="4"/><rect id="bf2" class="gain" x="174" y="524" width="0" height="102" rx="8"/><text class="m" x="160" y="680" font-size="20">MANAGING ONLY YOUR OWN</text></g>
<g id="kd"><text class="m" x="160" y="716" font-size="20" style="fill:var(--gain)">ENERGY LEFT FOR REAL KINDNESS</text></g>
<g id="ads"><g id="adsb"></g><path class="s-gain" d="M1010 430h180" stroke-width="5" stroke-dasharray="10 8"/><text class="m" x="1100" y="410" font-size="20" text-anchor="middle">EQUAL</text><text class="m" x="1100" y="656" font-size="22" text-anchor="middle">TWO CAPABLE ADULTS</text></g>
<g id="emg"><text class="d" x="120" y="810" font-size="40">Someone else’s bad mood isn’t an emergency.</text>
<path class="loss" d="M1070 740v-34a30 30 0 0 1 60 0v34z"/><rect class="ink" x="1060" y="740" width="80" height="12" rx="4"/>
<line id="nsl" class="s-ink" x1="1056" y1="682" x2="1056" y2="682" stroke-width="7" stroke-linecap="round"/></g>
</g>

<g id="s8" opacity="0">
<text class="m" x="143" y="220" font-size="26">YOUR CHALLENGE</text>
<g id="qa"><text class="d" x="136" y="330" font-size="72" letter-spacing="-2">Next time someone is upset,</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="72" letter-spacing="-2">say “<tspan style="fill:var(--gain)">let them</tspan>.” Then “<tspan style="fill:var(--gain)">let me</tspan>.”</text></g>
<g id="qc"><text class="d" x="136" y="510" font-size="72" letter-spacing="-2">Then take one slow breath.</text></g>
<g id="st1"><g id="st1f"></g><text class="m" x="300" y="810" font-size="22" text-anchor="middle">1 · LET THEM</text></g>
<g id="sa1"><path class="s-muted" d="M410 700h170m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="st2"><g id="st2f"></g><text class="m" x="720" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">2 · LET ME</text></g>
<g id="sa2"><path class="s-muted" d="M830 700h170m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="st3"><circle id="cbr" class="s-gain" cx="1140" cy="695" r="65" fill="var(--gain)" fill-opacity=".2" stroke-width="6"/><text class="d5" x="1140" y="705" font-size="28" text-anchor="middle">breathe</text><text class="m" x="1140" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">3 · BREATHE</text></g>
</g>