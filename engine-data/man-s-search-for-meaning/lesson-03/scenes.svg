<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The last</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">human freedom.</text>
<text class="b" x="120" y="600" font-size="32">When everything is taken, your attitude still belongs to you.</text>
<rect class="s-ink" x="1180" y="250" width="280" height="330" rx="6" fill="var(--stage)" stroke-width="7"/>
<circle id="halo" cx="1320" cy="370" r="72" fill="none" stroke="var(--gain)" stroke-width="5" opacity="0"/>
<g id="inner"></g>
<g id="bars"></g>
<g id="lock"><path class="s-ink" d="M1296 480v-20a24 24 0 0 1 48 0v20" fill="none" stroke-width="8"/><rect class="ink" x="1284" y="476" width="72" height="58" rx="8"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everything was taken.</text>
<text class="b" x="120" y="176" font-size="32">In the camps, prisoners lost almost every outside freedom.</text>
<g id="pr"><text class="m" x="300" y="550" font-size="20" text-anchor="middle">PRISONER</text></g>
<g id="tag"><rect x="270" y="440" width="60" height="30" rx="4" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><path d="M280 455h40" stroke="var(--loss)" stroke-width="4" stroke-dasharray="6 5"/></g>
<g id="chips"></g>
<g id="clk">
<circle class="s-ink" cx="870" cy="390" r="120" fill="var(--stage)" stroke-width="7"/>
<g id="ticks"></g>
<line id="hh" class="s-ink" x1="870" y1="390" x2="870" y2="330" stroke-width="9" stroke-linecap="round"/>
<line id="mh" class="s-ink" x1="870" y1="390" x2="870" y2="300" stroke-width="6" stroke-linecap="round"/>
<circle class="loss" cx="870" cy="390" r="10"/>
<g id="clkl"></g>
<text class="m" x="870" y="600" font-size="20" text-anchor="middle" style="fill:var(--loss)">GUARDS DECIDED</text>
</g>
<g id="lst">
<rect class="s-ink" x="1120" y="240" width="340" height="360" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1240" y="226" width="100" height="28" rx="6"/>
<g id="rows"></g>
<text class="m" x="1290" y="640" font-size="20" text-anchor="middle">A NUMBER ON A LIST</text>
</g>
<g id="nof"><text class="d" x="120" y="740" font-size="52">It looked like no freedom was left.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A light in the huts.</text>
<text class="b" x="120" y="176" font-size="32">Men who walked through the huts, comforting others.</text>
<g id="hut">
<path class="s-ink" d="M180 300L800 214L1420 300" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="loss" x="220" y="300" width="1160" height="400" fill-opacity=".12" stroke="var(--ink)" stroke-width="6"/>
<path class="s-ink" d="M220 450H1380" stroke-width="6"/>
<g id="ups"></g>
<g id="hutf"></g>
</g>
<g id="walk"></g>
<ellipse id="bread" class="gain" cx="1190" cy="640" rx="20" ry="11" opacity="0"/>
<g id="few"><text class="m" x="120" y="760" font-size="22">THERE MAY HAVE BEEN FEW OF THEM</text></g>
<g id="prf"><text class="d" x="120" y="830" font-size="48">Proof that something could not be taken.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">One thing remains.</text>
<text class="b" x="120" y="176" font-size="32">Frankl: “the last of the human freedoms.”</text>
<g id="hand">
<rect class="ink" x="484" y="600" width="72" height="140" rx="12"/>
<path class="s-ink" d="M400 540Q520 680 640 540M400 540l-14-30M640 540l14-30" fill="none" stroke-width="16" stroke-linecap="round"/>
<g id="orb"><circle class="gain" cx="520" cy="490" r="70"/><text id="att" class="m" x="520" y="497" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">ATTITUDE</text></g>
</g>
<g id="press"></g>
<g id="fork">
<path class="s-gain" d="M1240 740V560" stroke-width="8" stroke-linecap="round"/>
<path id="br0" d="M1240 560Q1240 460 1080 340" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="br1" d="M1240 560Q1240 460 1400 340" fill="none" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1080" cy="340" r="14"/><circle class="ink" cx="1400" cy="340" r="14"/>
<circle class="gain" cx="1240" cy="560" r="18"/>
<text class="m" x="1240" y="290" font-size="22" text-anchor="middle">CHOOSE YOUR OWN WAY</text>
</g>
<g id="nfd"><text class="d" x="120" y="820" font-size="44">But they did not fully decide the response.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same hut. Different people.</text>
<text class="b" x="120" y="176" font-size="32">Frankl watched how people in the same place reacted.</text>
<path class="s-line" d="M240 330L620 236L1000 330M240 620H1000" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="620" y="300" font-size="20" text-anchor="middle">SAME HUT</text>
<g id="fa"></g><g id="fb"></g>
<circle id="lr" cx="780" cy="540" r="22" fill="none" stroke="var(--gain)" stroke-width="4" opacity="0"/>
<circle id="lt" class="gain" cx="780" cy="540" r="13" opacity="0"/>
<g id="la"><text class="m" x="460" y="670" font-size="20" text-anchor="middle" style="fill:var(--loss)">CRUEL · GAVE UP</text></g>
<g id="lb"><text class="m" x="780" y="670" font-size="20" text-anchor="middle" style="fill:var(--gain)">DECENT · KIND · DIGNIFIED</text></g>
<g id="hd">
<circle class="s-ink" cx="1280" cy="400" r="120" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="1200" y="375" width="160" height="50" rx="25" fill="none" stroke-width="5"/>
<circle id="knob" cx="1225" cy="400" r="19" class="loss"/>
<text class="m" x="1280" y="580" font-size="22" text-anchor="middle">AN INNER DECISION</text>
</g>
<g id="cmp"><text class="d" x="120" y="790" font-size="48">It was not simply the camp’s doing.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Possibility, not judgment.</text>
<text class="b" x="120" y="176" font-size="32">This does not mean suffering is easy.</text>
<g id="sc">
<path class="s-ink" d="M460 300V700" stroke-width="8"/>
<rect class="ink" x="380" y="700" width="160" height="16" rx="4"/>
<line id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="460" cy="300" r="12"/>
<g id="panL"><path class="s-ink" d="M0 0L-70 110M0 0L70 110" stroke-width="4"/><rect class="loss" x="-50" y="52" width="100" height="58" rx="6"/><path class="ink" d="M-90 110Q0 160 90 110Z"/><text class="m" x="0" y="200" font-size="20" text-anchor="middle" style="fill:var(--loss)">SUFFERING</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-70 110M0 0L70 110" stroke-width="4"/><path class="ink" d="M-90 110Q0 160 90 110Z"/></g>
</g>
<g id="crs"><text class="m" x="460" y="770" font-size="20" text-anchor="middle" style="fill:var(--loss)">MANY WERE CRUSHED BY IT</text></g>
<rect id="bx0" class="s-line" x="900" y="220" width="500" height="500" rx="8" fill="none" stroke-width="4" stroke-dasharray="12 10" opacity="0"/>
<g id="bxg">
<rect id="bx" fill="none" stroke="var(--loss)" stroke-width="16" rx="8"/>
<text id="bxl" class="m" x="1150" y="200" font-size="20" text-anchor="middle" style="fill:var(--loss)">OUTER CHOICES</text>
</g>
<g id="sd">
<rect x="1080" y="400" width="140" height="140" rx="10" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<path class="s-ink" d="M1110 520h80" stroke-width="5" stroke-linecap="round"/>
<path id="stem" class="s-gain" stroke-width="7" stroke-linecap="round"/>
<path id="lv" class="gain" d="M1150 458q-40-6-50-36q40 0 50 36zM1150 458q40-6 50-36q-40 0-50 36z"/>
<text class="m" x="1150" y="572" font-size="20" text-anchor="middle" style="fill:var(--gain)">INNER CHOICE</text>
</g>
<g id="spc"><text class="d" x="120" y="845" font-size="40">A small space for inner choice remains.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your everyday camp.</text>
<text class="b" x="120" y="176" font-size="32">Your challenges are far smaller, but the same freedom applies.</text>
<g id="cards"></g>
<g id="cc"><text class="m" x="120" y="680" font-size="20" style="fill:var(--loss)">YOU CAN’T CHOOSE THESE</text></g>
<g id="pz">
<path class="s-muted" d="M560 435h62M608 421l14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="gain" cx="720" cy="435" r="80"/>
<rect x="690" y="395" width="20" height="80" rx="4" style="fill:var(--on-gain)"/><rect x="730" y="395" width="20" height="80" rx="4" style="fill:var(--on-gain)"/>
<text class="m" x="720" y="560" font-size="22" text-anchor="middle">PAUSE · DECIDE</text>
</g>
<g id="rsp">
<path class="s-gain" d="M820 435H1068M1054 421l14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="944" y="410" font-size="20" text-anchor="middle">HOW YOU MEET IT</text>
</g>
<g id="mir">
<ellipse class="s-ink" cx="1220" cy="440" rx="130" ry="180" fill="var(--stage)" stroke-width="7"/>
<g id="mf"></g>
<path class="s-line" d="M1140 340q10-50 50-70" fill="none" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M1220 620V660M1160 660H1280" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1220" y="710" font-size="20" text-anchor="middle">WOULD I BE PROUD OF THIS LATER?</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Practice the pause.</text>
<text class="b" x="120" y="176" font-size="32">Try it tonight.</text>
<g id="nb">
<rect class="s-ink" x="120" y="230" width="820" height="560" rx="14" fill="var(--stage)" stroke-width="6"/>
<g id="spi"></g>
</g>
<g id="r0"><text class="m" x="200" y="310" font-size="20">SOMETHING I COULD NOT CONTROL</text></g>
<g id="r1"><text class="m" x="200" y="470" font-size="20">THE ATTITUDE I CHOSE</text></g>
<g id="r2"><text class="m" x="200" y="630" font-size="20" style="fill:var(--gain)">THE ATTITUDE I WISH I HAD CHOSEN</text></g>
<g id="scr"></g>
