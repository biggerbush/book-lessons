<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Cover and move.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Win as one team.</text>
<text class="b" x="120" y="600" font-size="32">Why teams that support each other beat teams that compete</text>
<path class="s-line" d="M1100 610h360" stroke-width="5" stroke-linecap="round"/>
<path id="tArc" class="s-gain" d="M1180 440Q1280 330 1380 440" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
<g id="tA"></g><g id="tB"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two soldiers, open ground.</text>
<text class="b" x="120" y="176" font-size="32">One covers while the other moves. Then they switch.</text>
<rect class="s-line" x="120" y="300" width="1360" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-gain" x="1250" y="320" width="210" height="400" rx="14" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
<text class="m" x="1355" y="775" font-size="22" text-anchor="middle" style="fill:var(--gain)">SAFE</text>
<path id="cone" d="M0 0L320 -70V70Z" fill="var(--gain)" fill-opacity=".15" stroke="var(--gain)" stroke-width="3" stroke-dasharray="8 8"/>
<g id="sold"></g>
<text id="lA" class="m" y="352" font-size="20" text-anchor="middle"></text>
<text id="lB" class="m" y="552" font-size="20" text-anchor="middle"></text>
<g id="tac"><text class="d" x="120" y="835" font-size="46">The SEALs call it cover and move.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ramadi: two squads head home.</text>
<text class="b" x="120" y="176" font-size="32">After an overwatch mission, Leif Babin’s unit splits up.</text>
<g id="blocks"></g>
<g id="op"><rect class="s-ink" x="150" y="420" width="80" height="120" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M140 420h100" stroke-width="8" stroke-linecap="round"/><text class="m" x="190" y="398" font-size="18" text-anchor="middle">OVERWATCH</text></g>
<g id="base"><rect class="s-gain" x="1260" y="420" width="140" height="120" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1330 420v-80" stroke-width="5"/><path class="gain" d="M1330 340h50l-12 16 12 16h-50z"/><text class="m" x="1330" y="580" font-size="20" text-anchor="middle">BASE</text></g>
<g id="routes"></g><g id="squads"></g>
<g id="own"><text class="m" x="120" y="820" font-size="24">OWN ROUTE · OWN PROBLEMS · OWN PACE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The gap.</text>
<text class="b" x="120" y="176" font-size="32">The squads drifted out of reach of each other.</text>
<circle id="rg0" cx="640" cy="480" r="180" fill="none" stroke="var(--line)" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="rg1" cx="960" cy="480" r="180" fill="none" stroke="var(--line)" stroke-width="5" stroke-dasharray="12 10"/>
<g id="q0"></g><g id="q1"></g>
<g id="gapL"><path class="s-muted" d="M560 560h480M560 560l18-14M560 560l18 14M1040 560l-18-14M1040 560l-18 14" fill="none" stroke-width="4" stroke-linecap="round"/><text class="m" x="800" y="540" font-size="22" text-anchor="middle">OUT OF REACH</text></g>
<g id="forgot"><text class="d5" x="120" y="765" font-size="38">Leif realized: they forgot the tactic they trained on endlessly.</text></g>
<g id="fix"><text class="d" x="120" y="835" font-size="40" style="fill:var(--gain)">The fix: reconnect, and cover each other again.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tunnel vision.</text>
<text class="b" x="120" y="176" font-size="32">Under stress, every team zooms in on its own task.</text>
<g id="mag"><g id="magm"><circle class="s-ink" cx="270" cy="430" r="90" fill="var(--stage)" stroke-width="14"/><rect class="gain" x="250" y="410" width="40" height="40" rx="6"/><path class="s-ink" d="M335 495l65 65" stroke-width="24" stroke-linecap="round"/></g><text class="m" x="270" y="640" font-size="20" text-anchor="middle">ZOOMED IN</text></g>
<g id="big"><rect class="s-muted" x="490" y="230" width="940" height="500" rx="24" fill="none" stroke-width="4" stroke-dasharray="14 12"/><text class="m" x="960" y="780" font-size="22" text-anchor="middle">PART OF SOMETHING BIGGER</text></g>
<g id="silos"></g>
<g id="obst"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The same pattern, in an office.</text>
<text class="b" x="120" y="176" font-size="32">A company the authors advised.</text>
<g id="goal"><path class="s-gain" d="M530 340L770 270M1070 340L830 270" fill="none" stroke-width="4" stroke-dasharray="8 8"/><circle class="s-gain" cx="800" cy="265" r="40" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="800" cy="265" r="16"/><text class="m" x="860" y="250" font-size="22" style="fill:var(--gain)">SAME MISSION</text></g>
<g id="bld"><rect class="s-ink" x="260" y="340" width="1080" height="420" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path id="wall5" class="s-ink" d="M800 340v420" stroke-width="10"/><text class="m" x="290" y="385" font-size="20">DEPT A</text><text class="m" x="830" y="385" font-size="20">DEPT B</text></g>
<g id="ppl"></g>
<g id="bub"><rect class="s-loss" x="460" y="415" width="280" height="70" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="600" y="460" font-size="24" text-anchor="middle" style="fill:var(--loss)">THEIR FAULT!</text><path class="s-loss" d="M745 450h130m-18-16 18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="same5"><text class="d" x="120" y="825" font-size="44">Both groups served the same mission.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">One mission.</text>
<text class="b" x="120" y="176" font-size="32">The real competition is outside the building, not down the hall.</text>
<g id="co"><rect class="s-ink" x="160" y="250" width="820" height="470" fill="var(--stage)" stroke-width="7"/><text class="m" x="190" y="295" font-size="20">YOUR COMPANY</text><g id="teams6"></g></g>
<g id="walls"><path class="s-ink" d="M435 270v430M705 270v430" stroke-width="10"/></g>
<g id="brg"><rect class="gain" x="400" y="508" width="70" height="24"/><rect class="gain" x="670" y="508" width="70" height="24"/></g>
<g id="help"><path class="s-gain" d="M300 430Q435 330 570 430M570 430Q705 330 840 430" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="foe"><path class="s-gain" d="M1000 480h170m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1085" y="455" font-size="18" text-anchor="middle">FACE OUT</text><circle class="loss" cx="1270" cy="400" r="36"/><path class="loss" d="M1216 551v-46.8a54 54 0 0 1 108 0v46.8z"/><text class="m" x="1270" y="610" font-size="20" text-anchor="middle">THE REAL COMPETITION</text></g>
<g id="alone"><text class="d" x="120" y="800" font-size="52">No team succeeds alone.</text><text class="m" x="120" y="850" font-size="22">IN A FIREFIGHT OR IN A BOARDROOM</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make it real.</text>
<text class="b" x="120" y="176" font-size="32">Start with the team you usually complain about.</text>
<g id="k0"><g transform="translate(120 240)"><rect class="s-line" width="325" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="122" y="80" width="80" height="140" rx="16" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M147 195h30" stroke-width="6" stroke-linecap="round"/><path id="wav" class="s-gain" d="M222 120a40 40 0 0 1 0 60M240 100a66 66 0 0 1 0 100" fill="none" stroke-width="6" stroke-linecap="round"/><text class="d5" x="162" y="320" font-size="30" text-anchor="middle">Call them</text><text class="m" x="162" y="370" font-size="18" text-anchor="middle">THE TEAM YOU BLAME</text></g></g>
<g id="k1"><g transform="translate(465 240)"><rect class="s-line" width="325" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><circle class="s-ink" cx="162" cy="150" r="70" fill="var(--stage)" stroke-width="7"/><text class="d" x="162" y="185" font-size="100" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="162" y="320" font-size="30" text-anchor="middle">Ask what they need</text><text class="m" x="162" y="370" font-size="18" text-anchor="middle">TO SUCCEED</text></g></g>
<g id="k2"><g transform="translate(810 240)"><rect class="s-line" width="325" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="gain" x="102" y="120" width="120" height="90" rx="6"/><rect class="gain" x="92" y="92" width="140" height="26" rx="6"/><path d="M162 92v118" stroke="var(--stage)" stroke-width="10"/><text class="d5" x="162" y="320" font-size="30" text-anchor="middle">Help them get it</text><text class="m" x="162" y="370" font-size="18" text-anchor="middle">BEFORE THEY ASK</text></g></g>
<g id="k3"><g transform="translate(1155 240)"><rect class="s-line" width="325" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><polygon class="gain" points="162,70 172,96.2 200,97.6 178.2,115.3 185.5,142.4 162,127 138.5,142.4 145.8,115.3 124,97.6 152,96.2"/><circle class="ink" cx="92" cy="170" r="16"/><path class="ink" d="M68 237v-21a24 24 0 0 1 48 0v21z"/><circle class="ink" cx="232" cy="170" r="16"/><path class="ink" d="M208 237v-21a24 24 0 0 1 48 0v21z"/><text class="d5" x="162" y="320" font-size="30" text-anchor="middle">Share the credit</text><text class="m" x="162" y="370" font-size="18" text-anchor="middle">WHEN IT WORKS</text></g></g>
<rect class="s-line" x="120" y="720" width="1360" height="12" rx="6" fill="var(--line)"/>
<rect id="prog" class="gain" x="120" y="720" width="0" height="12" rx="6"/>
<g id="credit"><text class="d" x="120" y="825" font-size="44">Share credit freely when the joint effort works.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">Which team in your world</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">are you treating</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="88" letter-spacing="-2">like a <tspan style="fill:var(--loss)">rival</tspan>?</text></g>
<g id="qd"><text class="m" x="143" y="660" font-size="26">THIS WEEK, COVER THEM, AND WATCH HOW FAST YOU BOTH MOVE</text></g>
<path class="s-line" d="M1000 780h460" stroke-width="5" stroke-linecap="round"/>
<circle id="fa" class="gain" cy="750" r="22"/><circle id="fb" class="ink" cy="750" r="22"/>
</g>