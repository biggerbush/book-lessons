<g id="kind"><text class="d" x="120" y="820" font-size="46">Often the answer is simple, and kind.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Choose like them.</text>
<text class="b" x="120" y="176" font-size="32">The real power comes after you open your eyes.</text>
