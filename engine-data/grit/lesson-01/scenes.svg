<g id="s0">
<text class="m" x="120" y="150" font-size="28">GRIT · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why talent isn’t</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the whole story.</text>
<text class="b" x="120" y="600" font-size="32">Why a simple grit score beat West Point's admissions numbers</text>
<g id="crowd"></g>
<g id="who"><text class="m" x="1318" y="600" font-size="24" text-anchor="middle" style="fill:var(--gain)">WHO STAYS?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">West Point.</text>
<text class="b" x="120" y="176" font-size="32">The United States Military Academy. Getting in is incredibly hard.</text>
<g id="gate">
<rect class="ink" x="160" y="300" width="70" height="400"/><rect class="ink" x="480" y="300" width="70" height="400"/>
<rect class="ink" x="150" y="280" width="90" height="24"/><rect class="ink" x="470" y="280" width="90" height="24"/>
<path class="s-ink" d="M230 380Q355 260 480 380" fill="none" stroke-width="10"/>
<path class="s-ink" d="M268 380V700M306 352V700M344 342V700M382 342V700M420 352V700M458 380V700" stroke-width="5"/>
<path class="s-ink" d="M140 700H580" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="355" y="750" font-size="22" text-anchor="middle">WEST POINT</text>
<text class="m" x="355" y="782" font-size="18" text-anchor="middle">HARD TO GET IN</text>
</g>
<g id="links"></g>
<g id="cards"></g>
<g id="wcs">
<rect class="s-ink" x="1060" y="340" width="420" height="240" rx="18" fill="var(--stage)" stroke-width="6"/>
<text class="d5" x="1090" y="420" font-size="40">Whole Candidate</text>
<text class="d5" x="1090" y="470" font-size="40">Score</text>
<rect x="1090" y="510" width="360" height="24" rx="12" fill="var(--line)"/>
<rect id="wbar" x="1090" y="510" width="0" height="24" rx="12" fill="var(--ink)"/>
<text class="m" x="1060" y="620" font-size="20">ALL OF IT IN ONE NUMBER</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beast Barracks.</text>
<text class="b" x="120" y="176" font-size="32">A brutal summer of training, before classes even begin.</text>
<g id="clk">
<circle class="ink" cx="250" cy="340" r="32"/><circle class="ink" cx="390" cy="340" r="32"/>
<path class="s-ink" d="M265 515l-30 45M375 515l30 45" stroke-width="8" stroke-linecap="round"/>
<circle class="s-ink" cx="320" cy="430" r="100" fill="var(--stage)" stroke-width="8"/>
<line id="hH" class="s-ink" x1="320" y1="430" x2="320" y2="380" stroke-width="8" stroke-linecap="round"/>
<line id="hM" class="s-loss" x1="320" y1="430" x2="320" y2="350" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="320" y="600" font-size="22" text-anchor="middle">BEFORE DAWN</text>
</g>
<g id="pills"></g>
<g id="door">
<rect x="1200" y="280" width="170" height="340" fill="var(--loss)" fill-opacity=".3" stroke="var(--ink)" stroke-width="6"/>
<path class="s-ink" d="M1200 280L1150 300V600L1200 620Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1285" y="660" font-size="20" text-anchor="middle">SOME DROP OUT</text>
</g>
<g id="row"></g>
<g id="drop"><text class="d5" x="120" y="810" font-size="38">The admissions score couldn’t reliably say who.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A different idea.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Angela Duckworth’s Grit Scale.</text>
<g id="duck">
<circle class="ink" cx="260" cy="360" r="50"/><path class="ink" d="M185 570v-65a75 75 0 0 1 150 0v65z"/>
<rect class="gain" x="310" y="470" width="60" height="80" rx="6"/>
<text class="m" x="260" y="620" font-size="20" text-anchor="middle">ANGELA DUCKWORTH</text>
<text class="m" x="260" y="650" font-size="18" text-anchor="middle">PSYCHOLOGIST</text>
</g>
<g id="sheet">
<rect class="s-ink" x="520" y="230" width="920" height="550" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="570" y="310" font-size="48">Grit Scale</text>
<text class="m" x="880" y="300" font-size="20">HOW WELL DOES THIS DESCRIBE YOU?</text>
</g>
<g id="it0">
<text class="d5" x="570" y="410" font-size="34">“I finish whatever I begin.”</text>
<g id="dt0"></g>
<text class="m" x="584" y="522" font-size="20">NOT LIKE ME</text><text class="m" x="1176" y="522" font-size="20" text-anchor="end">VERY MUCH LIKE ME</text>
</g>
<g id="it1">
<text class="d5" x="570" y="580" font-size="34">“Setbacks don’t discourage me.”</text>
<g id="dt1"></g>
<text class="m" x="584" y="692" font-size="20">NOT LIKE ME</text><text class="m" x="1176" y="692" font-size="20" text-anchor="end">VERY MUCH LIKE ME</text>
</g>
<g id="more"><path class="s-line" d="M570 740h560M1160 740h120" stroke-width="6" stroke-linecap="round"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Grit = passion + perseverance.</text>
<text class="b" x="120" y="176" font-size="32">For long-term goals.</text>
<g id="p0">
<rect class="s-line" x="120" y="220" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="160" y="690" font-size="52">Passion</text>
<text class="m" x="160" y="740" font-size="20">STAYING POINTED ONE WAY OVER TIME</text>
</g>
<g id="p1">
<rect class="s-line" x="840" y="220" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="880" y="690" font-size="52" style="fill:var(--gain)">Perseverance</text>
<text class="m" x="880" y="740" font-size="20">CONTINUING TO CLIMB WHEN IT GETS HARD</text>
</g>
<g id="cmp">
<circle class="s-ink" cx="440" cy="440" r="140" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="440" y="326" font-size="22" text-anchor="middle">N</text>
<g id="ndl"><polygon class="gain" points="440,345 460,440 420,440"/><polygon class="ink" points="440,535 460,440 420,440"/><circle class="ink" cx="440" cy="440" r="10"/></g>
</g>
<g id="mtn">
<polygon points="880,620 1160,290 1440,620" fill="var(--line)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M930 610L1300 520L1060 440L1200 360L1160 295" fill="none" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
<path class="s-ink" d="M1160 290V232" stroke-width="5"/><path class="gain" d="M1160 232h50l-14 15 14 15h-50z"/>
<circle id="clb" class="gain" r="14" cx="930" cy="610"/>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The surprise.</text>
<text class="b" x="120" y="176" font-size="32">Both numbers, compared with who actually made it through.</text>
<g id="ax">
<path class="s-ink" d="M180 260V680H760M860 260V680H1440" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="180" y="245" font-size="20">MADE IT THROUGH ↑</text><text class="m" x="860" y="245" font-size="20">MADE IT THROUGH ↑</text>
<text class="m" x="180" y="715" font-size="20">ADMISSIONS SCORE →</text><text class="m" x="860" y="715" font-size="20">GRIT SCORE →</text>
<text class="m" x="1440" y="715" font-size="18" text-anchor="end">ILLUSTRATION</text>
</g>
<path id="ln0" class="s-loss" d="M200 470C380 450 560 490 740 465" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="ln1" class="s-gain" d="M880 640C1060 600 1250 430 1420 290" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="cap0"><text class="d5" x="180" y="790" font-size="36" style="fill:var(--loss)">Did not predict finishing</text></g>
<g id="cap1"><text class="d5" x="860" y="790" font-size="36" style="fill:var(--gain)">Predicted it remarkably well</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Talent is where you start.</text>
<text class="b" x="120" y="176" font-size="32">Not whether you keep going.</text>
<g id="bag">
<path class="ink" d="M210 450Q280 420 350 450L330 475Q420 540 400 640Q390 690 280 690Q170 690 160 640Q140 540 230 475Z"/>
<text class="m" x="280" y="600" font-size="22" text-anchor="middle" style="fill:var(--stage)">TALENT</text>
<text class="m" x="280" y="730" font-size="20" text-anchor="middle">TALENT ISN’T USELESS</text>
</g>
<g id="lad">
<path class="s-ink" d="M590 250V780M690 250V780" stroke-width="7" stroke-linecap="round"/>
<path class="s-ink" d="M590 300h100M590 350h100M590 400h100M590 450h100M590 500h100M590 550h100M590 600h100M590 650h100M590 700h100M590 750h100" stroke-width="5"/>
<circle class="gain" cx="640" cy="628" r="18"/>
</g>
<g id="st">
<path class="s-muted" d="M405 590Q500 600 568 642M548 628l20 14-24 4" fill="none" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<text class="m" x="710" y="636" font-size="18">START</text>
<text class="m" x="280" y="770" font-size="18" text-anchor="middle">IT SETS WHERE YOU START</text>
</g>
<g id="fork">
<path class="s-line" d="M820 660L1060 520L1440 260M1060 520L1440 680" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M1080 528L1430 676" stroke-width="4" stroke-dasharray="10 10"/>
<text class="d" x="1250" y="262" font-size="44" style="fill:var(--gain)">STAY</text>
<text class="d" x="1300" y="750" font-size="44" style="fill:var(--muted)">QUIT</text>
<circle id="fdot" class="gain" r="20" cx="820" cy="660"/>
</g>
<g id="fl"><text class="m" x="1130" y="808" font-size="20" text-anchor="middle">WHAT DECIDES IT: THE WILLINGNESS TO STAY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">A label is a snapshot.</text>
<text class="b" x="120" y="176" font-size="32">Of the starting line, not the whole road.</text>
<g id="mir">
<ellipse class="s-ink" cx="280" cy="400" rx="130" ry="170" fill="var(--stage)" stroke-width="8"/>
<circle class="ink" cx="280" cy="360" r="34"/><path class="ink" d="M229 503v-44a51 51 0 0 1 102 0v44z"/>
<text class="m" x="280" y="605" font-size="20" text-anchor="middle">NATURALLY GIFTED?</text>
</g>
<g id="snap"><g transform="rotate(-4 780 400)">
<rect class="s-ink" x="600" y="250" width="360" height="300" fill="var(--stage)" stroke-width="6"/>
<rect class="s-line" x="620" y="270" width="320" height="210" fill="none" stroke-width="3"/>
<path class="s-ink" d="M700 290V460" stroke-width="6" stroke-dasharray="12 8"/>
<circle class="ink" cx="740" cy="360" r="16"/><path class="ink" d="M716 427v-21a24 24 0 0 1 48 0v21z"/>
<text class="m" x="780" y="525" font-size="18" text-anchor="middle">THE STARTING LINE</text>
</g></g>
<g id="road">
<path class="s-ink" d="M120 630H1480M120 790H1480" stroke-width="5"/>
<path class="s-line" d="M120 760H1480" stroke-width="4" stroke-dasharray="30 24"/>
<path class="s-ink" d="M220 630V790" stroke-width="6"/>
<path class="s-ink" d="M1440 790V560" stroke-width="5"/><path class="gain" d="M1440 560h44l-12 14 12 14h-44z"/>
<g id="walk"></g>
<text class="m" x="120" y="830" font-size="20">THE LONG ROAD</text>
</g>
<g id="lrt">
<text class="d5" x="1060" y="330" font-size="36">The long road</text>
<text class="d5" x="1060" y="380" font-size="36">is won by those</text>
<text class="d" x="1060" y="430" font-size="36" style="fill:var(--gain)">who keep walking.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which goal did you nearly</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">give up on because you felt</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">you weren’t <tspan style="fill:var(--gain)">talented enough</tspan>?</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">THIS WEEK: ONE SMALL STEP BACK. STAYING IS A SKILL.</text></g>
<g id="stp">
<path class="s-ink" d="M1100 790h100v-50h100v-50h100v-50" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
