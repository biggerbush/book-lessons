<g id="ms1"><rect class="s-ink" x="780" y="365" width="56" height="50" fill="none" stroke-width="5"/><path class="s-ink" d="M836 390h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="820" cy="480" r="16"/><text class="m" x="820" y="560" font-size="20" text-anchor="middle">SOLD THE ORIGINAL</text><text class="m" x="820" y="588" font-size="20" text-anchor="middle">SERVICES BUSINESS</text></g>
<g id="ms2"><rect class="s-gain" x="1060" y="355" width="80" height="64" rx="8" fill="none" stroke-width="5"/><path class="s-gain" d="M1060 375h80M1074 393h50M1074 405h30" stroke-width="5"/><circle class="gain" cx="1100" cy="480" r="16"/><text class="m" x="1100" y="560" font-size="20" text-anchor="middle">REBUILT AS</text><text class="m" x="1100" y="588" font-size="20" text-anchor="middle">OPSWARE</text></g>
<g id="ms3"><circle class="gain" cx="1380" cy="385" r="34"/><path d="M1364 386l11 11 20-22" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="1380" cy="480" r="16"/><text class="m" x="1380" y="560" font-size="20" text-anchor="middle">SOLD TO</text><text class="m" x="1380" y="588" font-size="20" text-anchor="middle">HEWLETT-PACKARD</text></g>
<g id="nomap"><text class="d" x="120" y="760" font-size="44">No textbook covered any of these turns.</text></g>
