</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why pictures win.</text>
<text class="b" x="120" y="176" font-size="32">People scroll fast and judge in a blink.</text>
<rect class="s-ink" x="160" y="230" width="340" height="600" rx="36" fill="var(--stage)" stroke-width="7"/>
<g id="feed"></g>
<g id="s1arr"><path class="s-muted" d="M550 600V420m-18 18 18-18 18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="550" y="640" font-size="18" text-anchor="middle">FAST</text></g>
<g id="stk"><g id="stkIn">
<rect x="620" y="260" width="360" height="300" rx="14" fill="var(--line)"/>
<circle cx="740" cy="320" r="28" fill="var(--muted)"/><path d="M698 438v-36a42 42 0 0 1 84 0v36z" fill="var(--muted)"/>
<circle cx="860" cy="320" r="28" fill="var(--muted)"/><path d="M818 438v-36a42 42 0 0 1 84 0v36z" fill="var(--muted)"/>
<text class="m" x="800" y="520" font-size="20" text-anchor="middle" style="fill:var(--ink)">GENERIC STOCK PHOTO</text></g></g>
<g id="skip"><path class="s-loss" d="M690 285L910 455M910 285L690 455" stroke-width="12" stroke-linecap="round"/><text class="m" x="800" y="610" font-size="22" text-anchor="middle" style="fill:var(--loss)">SKIPPED</text></g>
