<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What does enough</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">look like for you,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">in <tspan style="fill:var(--gain)">real numbers</tspan>?</text></g>
