<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Choose what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to neglect.</text>
<text class="b" x="120" y="600" font-size="32">Doing well with limited time means choosing where to fail.</text>
<g id="tl"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too many good things.</text>
<text class="b" x="120" y="176" font-size="32">Every worthy thing you could do, on one enormous wall.</text>
<rect class="s-line" x="120" y="210" width="1360" height="410" rx="14" fill="var(--stage)" stroke-width="4"/>
<g id="notes"></g>
<g id="me"><text class="m" x="1320" y="720" font-size="20" text-anchor="end">ONLY SO MANY WEEKS</text></g>
<g id="n1a"><text class="d" x="120" y="790" font-size="44">You will never get to all of it.</text></g>
<g id="n1b"><text class="m" x="120" y="846" font-size="22">NEGLECT IS GUARANTEED · CHOOSE IT, OR LET IT HAPPEN</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Deciding means cutting.</text>
<text class="b" x="120" y="176" font-size="32">“Decide” comes from a Latin root meaning “to cut off”.</text>
<g id="br"></g>
<g id="root"><circle class="ink" cx="220" cy="480" r="22"/><text class="m" x="220" y="540" font-size="20" text-anchor="middle">YOU</text></g>
<g id="sc">
<g id="bA"><circle class="s-ink" cx="1250" cy="300" r="26" fill="none" stroke-width="7"/><path class="s-ink" d="M1272 312L1450 372" stroke-width="8" stroke-linecap="round"/></g>
<g id="bB"><circle class="s-ink" cx="1250" cy="380" r="26" fill="none" stroke-width="7"/><path class="s-ink" d="M1272 368L1450 308" stroke-width="8" stroke-linecap="round"/></g>
<circle class="ink" cx="1361" cy="340" r="7"/>
<text class="m" x="1340" y="450" font-size="20" text-anchor="middle">“TO CUT OFF”</text>
</g>
<g id="n2a"><text class="d" x="120" y="800" font-size="44">That loss doesn’t mean you chose badly.</text></g>
<g id="n2b"><text class="m" x="120" y="850" font-size="22">IT IS SIMPLY WHAT CHOOSING FEELS LIKE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The two lists story.</text>
<text class="b" x="120" y="176" font-size="32">Burkeman retells a tale of Warren Buffett and his pilot.</text>
<g id="plane"><g id="planeM">
<path class="ink" d="M420 293l-36-50h22l46 50zM420 293l-36 50h22l46-50zM344 293l-14-28h18l16 28z"/>
<rect class="ink" x="330" y="282" width="160" height="22" rx="11"/>
</g></g>
<g id="pplw"><g id="ppl"></g>
<rect class="loss" x="468" y="384" width="64" height="16" rx="6"/>
<text class="m" x="300" y="600" font-size="20" text-anchor="middle">BUFFETT</text>
<text class="m" x="500" y="600" font-size="20" text-anchor="middle">PILOT</text></g>
<g id="pad">
<rect class="s-line" x="720" y="220" width="760" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="760" y="274" font-size="22">CAREER GOALS</text>
<text id="cnt" class="d" x="1440" y="282" font-size="48" text-anchor="end">0</text>
<g id="lst"></g><g id="rings"></g>
</g>
<g id="myth"><text class="d5" x="120" y="840" font-size="36">Probably made up. But the lesson holds.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The dangerous middle.</text>
<text class="b" x="120" y="176" font-size="32">What should the pilot do with the other twenty?</text>
<g id="top5"><text class="m" x="120" y="260" font-size="20" style="fill:var(--gain)">TOP 5</text></g>
<g id="m20"></g>
<g id="mlab"><text class="m" x="420" y="260" font-size="20">THE OTHER 20</text><text class="m" x="420" y="660" font-size="20">“WHENEVER I HAVE SPARE TIME”</text></g>
<g id="stop"><g id="oct"></g><text class="d" x="675" y="464" font-size="48" text-anchor="middle" style="fill:var(--stage)">AVOID</text></g>
<g id="bad"><text class="m" x="1090" y="260" font-size="20">BAD IDEAS</text>
<path d="M1110 480h200l-20 140h-160z" fill="var(--stage)"/>
<g id="fall"></g>
<path class="s-ink" d="M1110 480h200l-20 140h-160z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1090" y="660" font-size="20">EASY TO DROP</text></g>
<g id="wkg"><text class="m" x="120" y="700" font-size="20">YOUR WEEKS</text><g id="wk"></g></g>
<g id="mid"><text class="d" x="120" y="830" font-size="44">The real threat: good, but not great.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fail on purpose.</text>
<text class="b" x="120" y="176" font-size="32">Decide in advance which areas you will let slide, for now.</text>
<g id="k0">
<rect class="s-line" x="120" y="240" width="440" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M240 410L340 320L440 410" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="260" y="400" width="160" height="140" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="320" y="480" width="40" height="60"/>
<g id="mess"><rect class="loss" x="200" y="580" width="50" height="24" transform="rotate(-15 225 592)"/><circle class="loss" cx="300" cy="596" r="14"/>
<path class="s-loss" d="M350 606q15-20 30 0t30 0" fill="none" stroke-width="6" stroke-linecap="round"/><rect class="loss" x="440" y="574" width="40" height="30" transform="rotate(20 460 589)"/></g>
<text class="d5" x="150" y="670" font-size="34">The house</text>
</g>
<g id="k1">
<rect class="s-line" x="580" y="240" width="440" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="720" y="340" width="160" height="210" rx="8" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="720" y="340" width="26" height="210"/>
<path class="s-line" d="M770 400h80M770 440h80M770 480h50" stroke-width="6" stroke-linecap="round"/>
<g id="pz"><circle cx="880" cy="540" r="40" fill="var(--muted)"/><path d="M868 522v36M892 522v36" stroke="var(--stage)" stroke-width="9" stroke-linecap="round"/></g>
<text class="d5" x="610" y="670" font-size="34">The novel</text>
</g>
<g id="tg0"><text class="m" x="150" y="286" font-size="22" style="fill:var(--muted)">LET SLIDE · FOR NOW</text></g>
<g id="tg1"><text class="m" x="610" y="286" font-size="22" style="fill:var(--muted)">LET SLIDE · FOR NOW</text></g>
<g id="k2">
<rect id="kr2" x="1040" y="240" width="440" height="460" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/>
<polygon id="cone" class="gain" points="1225,250 1295,250 1460,690 1060,690" fill-opacity=".18"/>
<circle class="ink" cx="1260" cy="430" r="38"/>
<ellipse class="gain" cx="1260" cy="530" rx="80" ry="46"/>
<text class="d5" x="1070" y="670" font-size="34">A new baby</text>
<g id="tg2"><text class="m" x="1070" y="286" font-size="22" style="fill:var(--gain)">CHOSEN</text></g>
</g>
<g id="frees"><text class="d" x="120" y="790" font-size="44">Underachieve there on purpose.</text>
<text class="m" x="120" y="842" font-size="22" style="fill:var(--gain)">FREES REAL ENERGY FOR WHAT YOU CHOSE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Limit what’s open.</text>
<text class="b" x="120" y="176" font-size="32">Cap how many projects you have open at the same time.</text>
<g id="que"><text class="m" x="140" y="470" font-size="20">WAITING IN LINE</text>
<path class="s-muted" d="M810 380h60m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="slots"></g>
<path id="chk" d="M958 366l16 16 32-32" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="fin"><text class="d" x="120" y="770" font-size="44">Finish things. Don’t nudge dozens an inch.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make peace with it.</text>
<text class="b" x="120" y="176" font-size="32">Some good things will go undone, and that’s okay.</text>
<g id="chair">
<circle class="s-muted" cx="345" cy="478" r="26" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<path class="s-ink" d="M280 380v260M400 540v100M280 540h120" fill="none" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="340" y="690" font-size="20" text-anchor="middle">MISSING OUT</text>
</g>
<g id="fl"></g>
<g id="rg"></g>
<g id="hands">
<circle class="gain" cx="800" cy="486" r="34"/>
<path class="ink" d="M680 520Q690 600 800 600V560Q740 560 720 520ZM920 520Q910 600 800 600V560Q860 560 880 520Z"/>
<text class="m" x="800" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT YOU PICKED</text>
</g>
<g id="setl"><text class="d" x="120" y="800" font-size="44">Your attention settles on what you picked.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which good thing</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">will you <tspan style="fill:var(--gain)">neglect</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">this month?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">CIRCLE THE FEW · NEGLECT ONE ON PURPOSE</text></g>
<g id="yl"></g>
</g>