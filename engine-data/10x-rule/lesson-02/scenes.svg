<g id="s0">
<text class="m" x="120" y="150" font-size="28">10X RULE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Set targets ten times</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">bigger.</text>
<text class="b" x="120" y="600" font-size="32">Why aiming ten times higher changes everything, even when you miss</text>
