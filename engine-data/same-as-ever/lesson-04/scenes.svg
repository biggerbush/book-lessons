<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAME AS EVER · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The best story</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">wins.</text>
<text class="b" x="120" y="600" font-size="32">Why a gripping story so often beats the plain facts</text>
<path class="s-ink" d="M1400 140v58" stroke-width="5" stroke-linecap="round"/>
<polygon id="cone" points="1380,236 1420,236 1450,660 1150,660" fill="var(--gain)" fill-opacity=".22"/>
