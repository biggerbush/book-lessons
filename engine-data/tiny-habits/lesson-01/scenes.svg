<g id="s0">
<text class="m" x="120" y="150" font-size="28">TINY HABITS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">It’s not you.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">It’s the <tspan style="fill:var(--gain)">design</tspan>.</text>
<text class="b" x="120" y="600" font-size="32">Why failed habits are a design problem, not a character flaw.</text>
<rect class="s-ink" x="1120" y="200" width="320" height="340" rx="18" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="1220" y="180" width="120" height="40" rx="10"/>
<g id="tl"></g>
<g id="tag"><rect class="gain" x="1160" y="460" width="240" height="48" rx="24"/><text class="m" x="1280" y="491" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">FIX THE DESIGN</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The blame loop.</text>
<text class="b" x="120" y="176" font-size="32">Big goal, busy life, harsh self-talk. Then repeat.</text>
<g id="b0"><rect class="s-line" x="140" y="240" width="360" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<polygon class="s-ink" points="190,540 320,320 450,540" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M320 320V260" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M320 260l54 16-54 16z"/>
<text class="m" x="320" y="630" font-size="22" text-anchor="middle">BIG GOAL</text></g>
<path id="a0" class="s-muted" d="M510 410h90m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="b1"><rect class="s-line" x="620" y="240" width="360" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M670 300V540H940" fill="none" stroke-width="4"/>
<polyline id="slp" class="s-loss" points="680,310 750,330 820,410 900,520" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="340"/>
<text class="m" x="800" y="630" font-size="22" text-anchor="middle">LIFE GETS BUSY</text></g>
<path id="a1" class="s-muted" d="M990 410h90m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="b2"><rect class="s-line" x="1100" y="240" width="360" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<ellipse class="s-ink" cx="1280" cy="390" rx="100" ry="120" fill="var(--stage)" stroke-width="7"/>
<g id="mirP"></g>
<text class="d" x="1280" y="562" font-size="38" text-anchor="middle" style="fill:var(--loss)">“Lazy.”</text>
<text class="m" x="1280" y="630" font-size="22" text-anchor="middle">THE MIRROR</text></g>
<g id="ret"><path class="s-loss" d="M1280 660C1280 800 320 800 320 660" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path class="s-loss" d="M298 684L320 660L342 684" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="840" font-size="22" text-anchor="middle">EACH LOOP MAKES THE NEXT TRY HARDER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Willpower is a weak plan.</text>
<text class="b" x="120" y="176" font-size="32">Motivation rises and falls like a wave.</text>
<g id="sci"><g id="sciP"></g>
<text class="d5" x="140" y="590" font-size="40">BJ Fogg</text>
<text class="m" x="140" y="630" font-size="20">STANFORD UNIVERSITY</text>
<text class="m" x="140" y="660" font-size="20">STUDIES HUMAN BEHAVIOR</text></g>
<path class="s-line" d="M540 280V660H1460" fill="none" stroke-width="4"/>
<text class="m" x="560" y="300" font-size="20">MOTIVATION</text>
<path id="wv" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="hi"><text class="m" x="1460" y="300" font-size="22" text-anchor="end" style="fill:var(--gain)">FIRED UP</text></g>
<g id="lo"><text class="m" x="1460" y="700" font-size="22" text-anchor="end" style="fill:var(--loss)">NOTHING AT ALL</text></g>
<g id="weak"><text class="d" x="120" y="800" font-size="48">Relying on willpower is a weak plan.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Knowing isn’t doing.</text>
<text class="b" x="120" y="176" font-size="32">Information alone rarely changes what we do.</text>
<g id="kn"><g id="knP"></g>
<g id="bub"><circle class="s-ink" cx="325" cy="430" r="9" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="355" cy="400" r="14" fill="var(--stage)" stroke-width="4"/>
<ellipse class="s-ink" cx="560" cy="320" rx="230" ry="110" fill="var(--stage)" stroke-width="5"/>
<polygon class="gain" points="487,262 513,238 548,304"/>
<path d="M502 262l10-6M512 276l9-6M522 290l8-5" stroke="var(--on-gain)" stroke-width="3" stroke-linecap="round"/>
<path class="s-ink" d="M500 250L478 228M500 250L492 224M500 250L470 242" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-muted" d="M585 304V266M640 304V276" fill="none" stroke-width="12" stroke-linecap="round"/>
<circle class="ink" cx="570" cy="262" r="15"/><circle class="ink" cx="586" cy="248" r="16"/><circle class="ink" cx="602" cy="262" r="15"/>
<circle class="ink" cx="627" cy="272" r="13"/><circle class="ink" cx="641" cy="261" r="14"/><circle class="ink" cx="655" cy="272" r="13"/>
<path class="ink" d="M470 300h180a90 64 0 0 1-180 0z"/>
<text class="m" x="560" y="478" font-size="22" text-anchor="middle" style="fill:var(--ink)">WE KNOW: VEGETABLES ARE HEALTHY</text></g></g>
<g id="fr"><path class="s-muted" d="M800 330C960 330 1040 380 1080 440" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path class="s-loss" d="M935 335l30 30M965 335l-30 30" stroke-width="7" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1180" cy="600" rx="200" ry="56" fill="var(--stage)" stroke-width="6"/>
<g id="fz"></g><path class="ink" d="M1105 460h150l-18 130h-114z"/>
<text class="m" x="1180" y="710" font-size="22" text-anchor="middle">WHAT LANDS ON THE PLATE</text></g>
<g id="fade"><text class="d" x="120" y="810" font-size="44">Knowledge without good design usually fades.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Blame the plan, not yourself.</text>
<text class="b" x="120" y="176" font-size="32">A door that sticks needs fixing, not stronger arms.</text>
<g id="dr"><path class="s-line" d="M380 730H1060" stroke-width="4"/>
<rect id="dp" y="258" height="468" stroke="var(--ink)" stroke-width="5"/>
<circle id="dk" class="ink" cy="490" r="10"/>
<path class="s-ink" d="M700 730V250H940V730" fill="none" stroke-width="8" stroke-linejoin="round"/>
<path id="jam" class="s-loss" d="M688 300l-22-12M688 330h-26M688 360l-22 12" stroke-width="5" stroke-linecap="round"/>
<g id="pu"></g></g>
<g id="na"><text class="m" x="480" y="620" font-size="22" text-anchor="middle" style="fill:var(--loss)">DON’T BLAME YOUR ARMS</text></g>
<g id="tb"><path class="s-ink" d="M1210 590v-30h100v30" fill="none" stroke-width="8" stroke-linejoin="round"/>
<rect class="gain" x="1120" y="590" width="280" height="140" rx="14"/><rect x="1245" y="620" width="30" height="24" rx="4" fill="var(--on-gain)"/>
<text class="m" x="1260" y="780" font-size="22" text-anchor="middle" style="fill:var(--gain)">FIX THE DOOR</text></g>
<g id="same"><text class="d" x="120" y="840" font-size="48">Treat habits the same way.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fogg’s two push-ups.</text>
<text class="b" x="120" y="176" font-size="32">Big workout plans never stuck. So he redesigned the habit.</text>
<g id="pl"><rect class="s-ink" x="150" y="260" width="220" height="260" rx="14" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M190 320h140M190 370h140M190 420h140M190 470h90" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="260" y="572" font-size="22" text-anchor="middle">BIG WORKOUT PLAN</text></g>
<path id="plx" class="s-loss" d="M160 270l200 240M360 270l-200 240" stroke-width="10" stroke-linecap="round"/>
<g id="ba"><rect class="s-ink" x="600" y="320" width="52" height="100" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M480 420h180q0 90-90 90q-90 0-90-90z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M550 508l-10 22h70l-10-22" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="570" y="572" font-size="22" text-anchor="middle">AFTER THE BATHROOM</text></g>
<path id="ar1" class="s-muted" d="M690 440h60m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pf"><path class="s-line" d="M770 526H1020" stroke-width="4"/><text class="m" x="895" y="572" font-size="22" text-anchor="middle">TWO PUSH-UPS</text></g>
<g id="ch"><path class="s-line" d="M1090 522H1470" stroke-width="4"/><text id="two" class="d" x="1122" y="490" font-size="28" text-anchor="middle">2</text></g>
<g id="dzl"><text class="m" x="1280" y="572" font-size="22" text-anchor="middle" style="fill:var(--gain)">DOZENS A DAY</text></g>
<g id="dz"><text class="d" x="120" y="720" font-size="48">Design did it, not a burst of willpower.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Kindness beats shame.</text>
<text class="b" x="120" y="176" font-size="32">Feeling good about small wins builds momentum.</text>
<g id="sh"><text class="m" x="120" y="270" font-size="22" style="fill:var(--loss)">SHAME DOESN’T HELP</text></g>
<g id="fc"><circle class="s-ink" cx="340" cy="470" r="140" fill="var(--stage)" stroke-width="7"/>
<circle class="ink" cx="290" cy="430" r="14"/><circle class="ink" cx="390" cy="430" r="14"/>
<path id="mo" fill="none" stroke-width="8" stroke-linecap="round"/>
<text id="fl" class="m" x="340" y="670" font-size="24" text-anchor="middle">JUDGING</text></g>
<g id="st"></g>
<g id="hr"><path id="hp" class="gain" d="M0 40C-60 0-60-50-25-50C-10-50 0-40 0-30C0-40 10-50 25-50C60-50 60 0 0 40Z"/></g>
<g id="cf"><text class="d" x="120" y="830" font-size="44">Each small win makes the next change easier.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Become a habit designer.</text>
<text class="b" x="120" y="176" font-size="32">Treat a stalled habit as a design problem to solve.</text>
<g id="bp"><rect class="s-ink" x="120" y="230" width="760" height="520" rx="16" fill="var(--stage)" stroke-width="5"/>
<g id="gr"></g>
<rect id="gb" x="170" y="290" height="130" rx="12" stroke-width="6"/>
<text id="gt" class="d" x="200" y="372" font-size="40">GOAL</text>
<circle class="s-ink" cx="740" cy="355" r="70" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M740 355V305M740 355h36" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="740" y="462" font-size="22" text-anchor="middle" style="fill:var(--ink)">TIMING</text>
<g id="tg"><path class="s-gain" d="M360 620A60 60 0 1 1 300 560" fill="none" stroke-width="7" stroke-linecap="round"/>
<path class="s-gain" d="M285 545l15 15-15 15" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="390" y="628" font-size="22" style="fill:var(--gain)">TRY AGAIN</text></g></g>
<g id="ann"><text id="tbig" class="m" x="170" y="270" font-size="22">TOO BIG?</text>
<text class="m" x="740" y="268" font-size="22" text-anchor="middle" style="fill:var(--loss)">WRONG TIME?</text></g>
<g id="pen"><path id="pn" class="gain" d="M0 0l-10 30-80 80-20-20 80-80z"/></g>
<g id="qq"><text class="m" x="960" y="290" font-size="22">ASK</text>
<text id="wq" class="d5" x="960" y="370" font-size="40">What’s wrong with me?</text>
<line id="wqs" class="s-loss" x1="952" y1="357" x2="952" y2="357" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="960" y="450" font-size="44" style="fill:var(--gain)">What made it hard?</text></g>
<g id="adj"><text class="d" x="960" y="600" font-size="44">Adjust one piece.</text><text class="d" x="960" y="660" font-size="44">Then try again.</text></g>
</g>

<g id="s8" opacity="0">
<g id="z0"><text class="m" x="143" y="250" font-size="26">THINK OF ONE HABIT YOU GAVE UP ON RECENTLY</text></g>
<g id="qa"><text class="d" x="136" y="350" font-size="88" letter-spacing="-2">Write down one</text></g>
<g id="qb"><text class="d" x="136" y="460" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">design flaw</tspan>,</text></g>
<g id="qc"><text class="d" x="136" y="570" font-size="88" letter-spacing="-2">not one personal flaw.</text></g>
<g id="pp"><rect class="s-ink" x="1200" y="240" width="240" height="230" rx="10" fill="var(--stage)" stroke-width="6"/>
<path id="w0" class="s-ink" d="M1240 310h160" stroke-width="8" stroke-linecap="round" stroke-dasharray="160"/>
<path id="w1" class="s-ink" d="M1240 360h160" stroke-width="8" stroke-linecap="round" stroke-dasharray="160"/>
<path id="w2" class="s-gain" d="M1240 410h100" stroke-width="8" stroke-linecap="round" stroke-dasharray="160"/></g>
<text class="m" x="143" y="700" font-size="26">IT’S NOT YOU. IT’S THE DESIGN.</text>
</g>