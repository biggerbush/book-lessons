<g id="lr"><text class="d" x="1160" y="620" font-size="48" text-anchor="middle" style="fill:var(--gain)">Appreciation</text><text class="m" x="1160" y="660" font-size="20" text-anchor="middle">UNSELFISH · FROM THE HEART</text></g>
<g id="fk"><text class="d" x="120" y="800" font-size="44">Counterfeit money.</text><text class="m" x="120" y="844" font-size="22" style="fill:var(--loss)">SOONER OR LATER, PEOPLE SPOT THE FAKE</text></g>
