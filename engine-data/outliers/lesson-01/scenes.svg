<g id="same"><path class="s-ink" d="M220 750v14h1160v-14" fill="none" stroke-width="4" stroke-linejoin="round"/><text class="m" x="800" y="800" font-size="22" text-anchor="middle">SAME COUNTRYSIDE · SAME MEDICAL CARE</text></g>
<g id="concl"><text class="d" x="120" y="852" font-size="40">So it was not geography either.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then he saw it.</text>
<text class="b" x="120" y="176" font-size="32">Wolf walked the streets of Roseto.</text>
