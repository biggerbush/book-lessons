<circle id="ship" class="gain" r="12"/>
</g>
<g id="why"><text class="d5" x="120" y="760" font-size="44">Why were Roseto's hearts so healthy?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">They broke every rule.</text>
<g id="sub2"><text class="b" x="120" y="176" font-size="32">Wolf and his team studied the town closely.</text></g>
<g id="chart">
<text class="m" x="120" y="270" font-size="22">HEART DEATHS UNDER 55 (SCHEMATIC)</text>
<path class="s-ink" d="M200 320V680H700" fill="none" stroke-width="5" stroke-linecap="round"/>
<rect id="barA" class="loss" x="240" y="680" width="140" height="0"/><rect id="barB" class="gain" x="480" y="680" width="140" height="0"/>
<text class="m" x="310" y="720" font-size="20" text-anchor="middle">ELSEWHERE</text><text class="m" x="550" y="720" font-size="20" text-anchor="middle" style="fill:var(--gain)">ROSETO</text>
</g>
<text class="m" x="880" y="270" font-size="22">HOW THEY LIVED</text>
<g id="risk0"><circle class="s-ink" cx="950" cy="400" r="60" fill="var(--stage)" stroke-width="8"/><ellipse cx="950" cy="400" rx="30" ry="18" fill="var(--line)"/><path class="s-ink" d="M1014 400H1070" stroke-width="14" stroke-linecap="round"/><text class="m" x="970" y="520" font-size="22" text-anchor="middle">LARD</text></g>
