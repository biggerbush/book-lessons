<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Four Degrees</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Action.</text>
<text class="b" x="120" y="600" font-size="32">Four ways to respond to any goal, and only one works.</text>
