<text class="m" x="940" y="320" font-size="24" style="fill:var(--gain)">INNER SCORECARD</text>
<g id="ic"><text class="m" x="940" y="370" font-size="20">DID I LIVE UP TO MY STANDARDS?</text></g>
<g id="most"><rect class="gain" x="1000" y="630" width="340" height="60" rx="30"/><text class="m" x="1170" y="668" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">MATTERS MOST</text></g>
</g>
<g id="buf"><text class="m" x="800" y="560" font-size="18" text-anchor="middle">BUFFETT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What goes on your card.</text>
<text class="b" x="120" y="176" font-size="32">Only things you can actually control.</text>
