<g id="q2"><text class="d" x="136" y="540" font-size="84" letter-spacing="-2">Set <tspan style="fill:var(--gain)">no rules.</tspan></text></g>
<g id="q3"><text class="d" x="136" y="640" font-size="84" letter-spacing="-2">Solve <tspan style="fill:var(--gain)">no problems.</tspan></text></g>
