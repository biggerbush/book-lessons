<path id="blk" class="s-loss" d="M1342 302l36 36M1378 302l-36 36" stroke-width="9" stroke-linecap="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two barriers to good decisions.</text>
<g id="inv"><text class="b" x="120" y="176" font-size="32">Both are invisible to the person who has them.</text></g>
<g id="road"><path class="s-line" d="M160 720H1440" stroke-width="6" stroke-linecap="round"/><g id="walker"></g>
<path class="s-ink" d="M1340 720V460" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M1344 462l100 36-100 36z"/>
<text class="m" x="1340" y="770" font-size="20" text-anchor="middle">GOOD DECISION</text></g>
<g id="w0"><rect id="wr0" class="loss" x="600" y="380" width="70" height="340" rx="6" stroke="var(--loss)" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="635" y="770" font-size="20" text-anchor="middle">1 · EGO</text></g>
<g id="w1"><rect id="wr1" class="loss" x="960" y="380" width="70" height="340" rx="6" stroke="var(--loss)" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="995" y="770" font-size="20" text-anchor="middle">2 · BLIND SPOTS</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The ego barrier.</text>
<text class="b" x="120" y="176" font-size="32">Two parts of you compete when someone disagrees.</text>
<g id="halves">
<path id="lhp" d="M800 320a150 150 0 0 0 0 300z" fill="var(--stage)" stroke="var(--loss)" stroke-width="7" stroke-linejoin="round"/>
<path id="rhp" d="M800 320a150 150 0 0 1 0 300z" fill="var(--stage)" stroke="var(--gain)" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="780" y="680" font-size="20" text-anchor="end">FAST · EMOTIONAL</text>
<text class="m" x="820" y="680" font-size="20">SLOW · THOUGHTFUL</text>
</g>
<g id="atk"><rect class="s-ink" x="140" y="380" width="280" height="70" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="280" y="423" font-size="22" text-anchor="middle">YOU’RE WRONG.</text><path class="s-loss" d="M430 415h60m-16-14 16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<path id="shld" class="loss" d="M510 400h100v50q0 60-50 80q-50-20-50-80z"/>
<g id="thk"><circle class="gain" cx="985" cy="430" r="9"/><circle class="gain" cx="1020" cy="412" r="13"/><rect class="s-gain" x="1060" y="380" width="300" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="1210" y="423" font-size="22" text-anchor="middle">WHAT’S TRUE?</text></g>
<g id="win"><text class="d" x="120" y="790" font-size="44">When emotion wins, you guard your pride.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The blind spot barrier.</text>
<text class="b" x="120" y="176" font-size="32">Things your mind simply cannot see.</text>
<g id="eye">
<path d="M310 480L900 300V660z" fill="var(--loss)" fill-opacity=".12"/>
<path d="M310 480L900 430V530z" fill="var(--stage)" stroke="var(--loss)" stroke-width="4" stroke-dasharray="10 8"/>
<path class="s-ink" d="M170 480Q240 410 310 480Q240 550 170 480z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="240" cy="480" r="22"/>
<text class="m" x="240" y="590" font-size="20" text-anchor="middle">YOU</text>
<text class="m" x="920" y="488" font-size="20" style="fill:var(--loss)">BLIND SPOT</text>
</g>
<g id="dots"></g>
<g id="wheel"><g id="segs"></g><text id="wq" class="d" x="1260" y="510" font-size="90" text-anchor="middle">?</text><text class="m" x="1260" y="660" font-size="20" text-anchor="middle">DESCRIBE THE COLOURS?</text></g>
<g id="miss"><text class="d" x="120" y="790" font-size="44">You can’t fix what you don’t know is missing.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Dalio’s own gaps.</text>
<text class="b" x="120" y="176" font-size="32">Strong at big connections, weak at details.</text>
