<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Restraint</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">under pressure.</text>
<text class="b" x="120" y="600" font-size="32">Why the punch you don’t throw can be your strongest move</text>
<g id="fistg">
<circle class="s-gain" cx="1300" cy="440" r="160" fill="none" stroke-width="6" stroke-dasharray="14 12"/>
