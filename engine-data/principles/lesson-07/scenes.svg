<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Build an idea</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">meritocracy.</text>
<text class="b" x="120" y="600" font-size="32">Let the best idea win, no matter who says it.</text>
<g id="tcrowd"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Usually, the boss wins.</text>
<text class="b" x="120" y="176" font-size="32">In most companies, rank decides, not the quality of the idea.</text>
<g id="boss">
<circle class="ink" cx="400" cy="330" r="44"/><path class="ink" d="M334 515v-57a66 66 0 0 1 132 0v57z"/>
<rect class="ink" x="230" y="480" width="340" height="36" rx="6"/>
<path class="s-ink" d="M262 516V640M538 516V640" stroke-width="8" stroke-linecap="round"/>
<path d="M500 290l-24 34 44-34" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<rect x="480" y="220" width="240" height="76" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="d" x="600" y="271" font-size="36" text-anchor="middle" style="fill:var(--loss)">MY CALL.</text>
<text class="m" x="400" y="690" font-size="22" text-anchor="middle">BOSS</text>
</g>
<g id="team"></g><g id="bangs"></g>
<g id="merit"><text class="d" x="120" y="800" font-size="46">Dalio wanted ideas to compete on merit.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Radical truth.</text>
<text class="b" x="120" y="176" font-size="32">Blunt honesty, even about the boss.</text>
<g id="mail">
<rect class="s-ink" x="120" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M120 300h640" stroke-width="4"/>
<text class="m" x="150" y="276" font-size="22">RE: TODAY’S CLIENT MEETING</text>
<g id="mbars"></g>
<g id="mgr"><text class="m" x="150" y="620" font-size="24" style="fill:var(--loss)">RAMBLING · UNPREPARED · D−</text></g>
</g>
<g id="grade">
<circle cx="1010" cy="430" r="150" fill="var(--stage)" stroke="var(--loss)" stroke-width="8"/>
<text class="d" x="1010" y="490" font-size="170" text-anchor="middle" style="fill:var(--loss)">D−</text>
<text class="m" x="1010" y="630" font-size="22" text-anchor="middle">THE BOSS’S GRADE</text>
</g>
<g id="nopun"><text class="m" x="1010" y="670" font-size="22" text-anchor="middle" style="fill:var(--gain)">NO PUNISHMENT</text></g>
<g id="thumb"><g id="thIn">
<rect class="gain" x="1300" y="420" width="120" height="120" rx="22"/>
<rect class="gain" x="1312" y="320" width="44" height="130" rx="22"/>
<rect class="ink" x="1260" y="430" width="34" height="116" rx="8"/>
<path d="M1340 460h66M1340 490h66M1340 520h56" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/>
</g><text class="m" x="1350" y="630" font-size="22" text-anchor="middle">PRAISED</text></g>
<g id="more"><text class="d" x="120" y="790" font-size="44">He wanted more honesty, not less.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Radical transparency.</text>
<text class="b" x="120" y="176" font-size="32">At Bridgewater, almost every meeting is recorded.</text>
<g id="rec">
<circle id="recdot" class="loss" cx="140" cy="266" r="12"/><text class="m" x="162" y="274" font-size="22">REC</text>
<rect class="s-ink" x="120" y="300" width="380" height="220" rx="20" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M220 470h180" stroke-width="5"/>
<g id="reels"></g>
<text class="m" x="120" y="570" font-size="22">EVERY MEETING</text>
</g>
<g id="shelf"><path class="s-ink" d="M600 400h400M600 520h400M600 640h400" stroke-width="7" stroke-linecap="round"/><g id="tapes"></g></g>
<g id="shlab"><text class="m" x="800" y="690" font-size="22" text-anchor="middle">ANYONE CAN REVIEW THEM</text></g>
<g id="door">
<rect x="1120" y="280" width="260" height="380" fill="var(--gain)" fill-opacity=".25"/>
<circle class="gain" cx="1250" cy="430" r="30"/><path class="gain" d="M1205 556v-39a45 45 0 0 1 90 0v39z"/>
<rect id="dpan" x="1120" y="280" width="260" height="380" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<circle id="knob" class="ink" cx="1350" cy="480" r="12"/>
<rect class="s-ink" x="1120" y="280" width="260" height="380" fill="none" stroke-width="8"/>
<text class="m" x="1250" y="700" font-size="22" text-anchor="middle">NO CLOSED DOORS</text>
</g>
<g id="honest"><text class="d" x="120" y="800" font-size="40">Openness keeps people honest and lets everyone learn.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Weighing the votes.</text>
<text class="b" x="120" y="176" font-size="32">Rate the thinking, then let proven views count for more.</text>
<g id="phone">
<rect class="s-ink" x="140" y="240" width="240" height="440" rx="30" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="230" y="252" width="60" height="8" rx="4"/>
<text class="m" x="260" y="290" font-size="18" text-anchor="middle" style="fill:var(--gain)">LIVE RATINGS</text>
<g id="dots"></g>
<text class="m" x="260" y="720" font-size="22" text-anchor="middle">DOT COLLECTOR</text>
</g>
<g id="plink"><path class="s-gain" d="M388 440H466" fill="none" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round"/><g id="pkts"></g></g>
<g id="grid"><g id="cells"></g><text class="m" x="720" y="660" font-size="22" text-anchor="middle">WHO IS STRONG AT WHAT</text></g>
<g id="scl">
<path class="s-ink" d="M1250 330V640M1170 640h160" stroke-width="8" stroke-linecap="round"/>
<line id="beam" class="s-ink" x1="1100" y1="330" x2="1400" y2="330" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1250" cy="330" r="14"/>
<g id="panL"><path class="s-ink" d="M0 0L-62 110M0 0L62 110" stroke-width="4"/><path class="ink" d="M-70 110h140a70 34 0 0 1 -140 0z"/><circle class="gain" cx="0" cy="80" r="28"/></g>
<g id="panR"><path class="s-ink" d="M0 0L-62 110M0 0L62 110" stroke-width="4"/><path class="ink" d="M-70 110h140a70 34 0 0 1 -140 0z"/><circle cx="-30" cy="95" r="13" fill="var(--muted)"/><circle cx="0" cy="95" r="13" fill="var(--muted)"/><circle cx="30" cy="95" r="13" fill="var(--muted)"/></g>
<text class="m" x="1250" y="700" font-size="22" text-anchor="middle">PROVEN VIEWS WEIGH MORE</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The machine.</text>
<text class="b" x="120" y="176" font-size="32">A company made of people and culture.</text>
<g id="gears"></g>
<g id="glab">
<text class="m" x="320" y="700" font-size="22" text-anchor="middle">PEOPLE</text>
<text class="m" x="510" y="290" font-size="22" text-anchor="middle">CULTURE</text>
<text class="m" x="660" y="700" font-size="22" text-anchor="middle">ONE PART</text>
</g>
<g id="wr"><rect class="ink" x="-11" y="0" width="22" height="120" rx="11"/><circle class="ink" cx="0" cy="-12" r="32"/><rect x="-12" y="-50" width="24" height="38" fill="var(--stage)"/></g>
<g id="log">
<rect class="s-ink" x="900" y="250" width="560" height="450" rx="18" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1120" y="232" width="120" height="40" rx="10"/>
<text class="m" x="940" y="330" font-size="24">ISSUE LOG</text>
<path class="s-line" d="M940 350h480" stroke-width="3"/>
<g id="rows"></g>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it gets better.</text>
<text class="b" x="120" y="176" font-size="32">Three habits feed one learning loop.</text>
<g id="loopg"><circle class="s-line" cx="440" cy="500" r="200" fill="none" stroke-width="6" stroke-dasharray="14 12"/></g>
<circle id="ldot" class="gain" r="16"/>
<g id="pills"></g>
<g id="chart">
<path class="s-ink" d="M880 250V700H1440" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="stair" class="s-gain" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="900"/>
<circle id="sdot" class="gain" r="14"/>
<text class="m" x="900" y="270" font-size="20">SMARTER</text>
<text class="m" x="1440" y="740" font-size="20" text-anchor="end">EACH TURN OF THE LOOP</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start small.</text>
<text class="b" x="120" y="176" font-size="32">You don’t need a hedge fund to try this.</text>
<g id="tbl"><circle cx="300" cy="470" r="90" fill="var(--line)"/><g id="tppl"></g><text class="m" x="300" y="700" font-size="22" text-anchor="middle">YOUR TEAM</text></g>
<g id="k0">
<rect class="s-line" x="500" y="240" width="300" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="524" y="286" font-size="20">STEP 1</text>
<rect class="s-ink" x="590" y="320" width="120" height="160" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="650" y="435" font-size="90" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d5" x="524" y="600" font-size="28">Ask for an</text><text class="d5" x="524" y="640" font-size="28">honest grade.</text>
</g>
<g id="k1">
<rect class="s-line" x="820" y="240" width="300" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="844" y="286" font-size="20">STEP 2</text>
<rect class="s-ink" x="900" y="320" width="140" height="170" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M886 345h22M886 375h22M886 405h22M886 435h22M886 465h22" stroke-width="5" stroke-linecap="round"/>
<path class="s-line" d="M925 360h90M925 395h90M925 430h60" stroke-width="6" stroke-linecap="round"/>
<circle cx="1040" cy="470" r="30" fill="var(--stage)" stroke="var(--gain)" stroke-width="7"/>
<path d="M1061 491l28 28" stroke="var(--gain)" stroke-width="9" stroke-linecap="round"/>
<text class="d5" x="844" y="600" font-size="28">Find the cause,</text><text class="d5" x="844" y="640" font-size="28">not the culprit.</text>
</g>
<g id="k2">
<rect class="s-line" x="1140" y="240" width="300" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1164" y="286" font-size="20">STEP 3</text>
<g id="rays"></g>
<circle class="gain" cx="1290" cy="400" r="58"/>
<rect class="ink" x="1268" y="452" width="44" height="40" rx="6"/>
<text class="d5" x="1164" y="600" font-size="28">Let the best</text><text class="d5" x="1164" y="640" font-size="28">answer win.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="76" letter-spacing="-2">Who on your team sees a</text></g>
<g id="qb"><text class="d" x="136" y="380" font-size="76" letter-spacing="-2">problem but isn’t saying it?</text></g>
<g id="qc"><text class="d" x="136" y="510" font-size="76" letter-spacing="-2">What would it take for them</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="76" letter-spacing="-2">to tell you <tspan style="fill:var(--gain)">this week?</tspan></text></g>
<text class="m" x="143" y="720" font-size="26">MAKE IT SAFE TO SPEAK UP</text>
<g transform="translate(-40 -80)">
<g id="mic">
<rect class="gain" x="1328" y="650" width="64" height="120" rx="32"/>
<path class="s-ink" d="M1308 730a52 52 0 0 0 104 0M1360 782V830M1320 830h80" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="wv"><path class="s-gain" d="M1424 668a60 60 0 0 1 0 84M1444 648a90 90 0 0 1 0 124M1296 668a60 60 0 0 0 0 84M1276 648a90 90 0 0 0 0 124" fill="none" stroke-width="6" stroke-linecap="round"/></g>
</g>
</g>