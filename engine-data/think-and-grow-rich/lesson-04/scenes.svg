<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 4</text>
<text class="d" x="116" y="360" font-size="84" letter-spacing="-2">Knowledge only</text>
<text class="d" x="116" y="456" font-size="84" letter-spacing="-2">matters when</text>
<text class="d" x="116" y="552" font-size="84" letter-spacing="-2" style="fill:var(--gain)">put to work.</text>
<text class="b" x="120" y="660" font-size="32">Why knowing facts matters less than knowing how to use them.</text>
