<g id="emp"><text class="d" x="120" y="810" font-size="40">Any employee can make that call.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Say less.</text>
<text class="b" x="120" y="176" font-size="32">1992: James Carville kept Clinton’s whole team focused on the economy.</text>
<g id="pod"><polygon class="ink" points="230,440 390,440 370,640 250,640"/><rect class="gain" x="150" y="680" width="320" height="64" rx="32"/><text class="m" x="310" y="720" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">THE ECONOMY</text></g>
<g id="jug"><path class="s-line" d="M610 640H970" stroke-width="4"/><g id="juggler"></g><g id="balls"></g><text class="m" x="790" y="690" font-size="20" text-anchor="middle">THREE MESSAGES</text></g>
<g id="none6"><text class="m" x="790" y="730" font-size="22" text-anchor="middle" style="fill:var(--loss)">LANDS NONE</text></g>
<g id="tgt"><circle cx="1270" cy="430" r="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle cx="1270" cy="430" r="100" fill="none" stroke="var(--ink)" stroke-width="6"/><circle class="gain" cx="1270" cy="430" r="50"/><text class="m" x="1270" y="690" font-size="20" text-anchor="middle">ONE PRIORITY</text></g>
