<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Awareness is the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">real practice.</text>
<text class="b" x="120" y="600" font-size="32">Creative work begins with how closely you pay attention.</text>
<path d="M1300 280h40l40 280h-120z" fill="var(--line)" fill-opacity=".6"/>
<path class="s-line" d="M1160 280h320" stroke-width="4" stroke-linecap="round"/>
<path d="M1320 300v250" stroke="var(--stage)" stroke-width="5" stroke-dasharray="16 14"/>
<g id="tdet"></g>
<g id="walker"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Noticing comes first.</text>
<text class="b" x="120" y="176" font-size="32">Making things starts long before you pick up a tool.</text>
<g id="build"><rect class="s-ink" x="200" y="330" width="620" height="90" rx="10" fill="var(--stage)" stroke-width="6"/><text class="d5" x="510" y="390" font-size="40" text-anchor="middle">The work</text></g>
<g id="slab"><rect class="gain" x="200" y="650" width="620" height="90" rx="10"/><text class="m" x="510" y="706" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">AWARENESS</text><text class="m" x="510" y="790" font-size="20" text-anchor="middle">THE FOUNDATION EVERYTHING RESTS ON</text></g>
<g id="eye1"><text class="m" x="1150" y="240" font-size="22" text-anchor="middle">HOW CLOSELY YOU PAY ATTENTION</text><path class="s-ink" d="M990 330Q1150 210 1310 330Q1150 450 990 330Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><circle class="ink" cx="1150" cy="330" r="44"/><circle id="pup1" class="gain" cx="1150" cy="330" r="18"/></g>
<g id="mat"><rect id="pile" class="gain" x="1002" y="736" width="296" height="0"/><g id="flow"></g><path class="s-ink" d="M990 580v160h320v-160" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1150" y="790" font-size="22" text-anchor="middle">RAW MATERIAL</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A bigger world.</text>
<text class="b" x="120" y="176" font-size="32">“The universe is only as large as our perception of it.”</text>
<g id="gB"><g id="gbig"></g></g>
<g id="gS"><g id="gsml"></g></g>
<g id="lb0"><text class="m" x="560" y="800" font-size="22" text-anchor="middle" style="fill:var(--gain)">NOTICE MORE · A RICHER WORLD</text></g>
<g id="lb1"><text class="m" x="1140" y="800" font-size="22" text-anchor="middle" style="fill:var(--loss)">NOTICE LESS · SUPPLY SHRINKS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Relaxed, not forced.</text>
<text class="b" x="120" y="176" font-size="32">Awareness is not straining or hunting for ideas.</text>
<g id="h0">
<rect class="s-line" x="120" y="230" width="620" height="600" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">STRAINING</text>
<polygon id="cn0" class="loss" fill-opacity=".3"/>
<rect class="loss" x="190" y="460" width="120" height="120" rx="28"/>
<path d="M220 460v45M250 460v45M280 460v45" stroke="var(--stage)" stroke-width="4"/>
<rect class="loss" x="180" y="515" width="90" height="30" rx="15" stroke="var(--stage)" stroke-width="4"/>
</g>
<g id="h1">
<rect class="s-line" x="860" y="230" width="620" height="600" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="890" y="280" font-size="22">RELAXED OPENNESS</text>
<polygon id="cn1" class="gain" fill-opacity=".25"/>
<g id="idots"></g>
<rect class="gain" x="920" y="500" width="120" height="110" rx="26"/>
<rect class="gain" x="924" y="420" width="24" height="100" rx="12"/><rect class="gain" x="954" y="410" width="24" height="110" rx="12"/><rect class="gain" x="984" y="414" width="24" height="106" rx="12"/><rect class="gain" x="1014" y="428" width="24" height="92" rx="12"/>
<path class="s-gain" d="M926 570l-40-40" stroke-width="24" stroke-linecap="round"/>
</g>
<g id="e0"><text class="d5" x="150" y="790" font-size="36">Effort narrows your gaze.</text></g>
<g id="e1"><text class="d5" x="890" y="790" font-size="36">Ease widens it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Drop the labels.</text>
<text class="b" x="120" y="176" font-size="32">Naming things too quickly can stop us truly seeing them.</text>
<g id="treeg">
<path class="s-line" d="M300 780h360" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="455" y="500" width="50" height="280"/>
