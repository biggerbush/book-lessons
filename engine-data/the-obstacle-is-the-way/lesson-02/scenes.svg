<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">See the problem</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">clearly and calmly.</text>
<text class="b" x="120" y="600" font-size="32">Calm, clear eyes turn panic into opportunity.</text>
<g class="loss"><circle cx="1230" cy="290" r="50"/><circle cx="1300" cy="255" r="65"/><circle cx="1370" cy="290" r="50"/><rect x="1230" y="280" width="140" height="50"/></g>
<g id="rain"></g>
<path class="s-line" d="M1120 612h360" stroke-width="5" stroke-linecap="round"/>
<g id="pan"><g id="panF"></g><text class="d" x="1150" y="455" font-size="40" style="fill:var(--loss)">!</text><text class="d" x="1240" y="455" font-size="40" style="fill:var(--loss)">!</text></g>
<g id="calm"><g id="calmF"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="64">The first discipline: perception.</text>
<text class="b" x="120" y="176" font-size="32">It is how you see what happens to you.</text>
<g id="glass"><circle class="s-ink" cx="250" cy="480" r="80" fill="var(--stage)" stroke-width="8"/><circle class="s-ink" cx="450" cy="480" r="80" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M330 470q20-20 40 0" fill="none" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="270" cy="480" r="14"/><circle class="ink" cx="470" cy="480" r="14"/><text class="m" x="350" y="610" font-size="22" text-anchor="middle">PERCEPTION</text></g>
<path id="sight" class="s-gain" d="M550 480H700" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="evt"><rect class="s-ink" x="720" y="400" width="280" height="160" rx="12" fill="var(--stage)" stroke-width="7"/><text class="d5" x="860" y="495" font-size="40" text-anchor="middle">Event</text><text class="m" x="860" y="610" font-size="22" text-anchor="middle">JUST AN EVENT</text></g>
<g id="stl"><text class="m" x="1230" y="310" font-size="22" text-anchor="middle" style="fill:var(--loss)">STORIES WE ADD</text></g>
<g id="pills"></g>
<g id="epi"><text class="d" x="120" y="710" font-size="42">We are upset not by things,</text><text class="d" x="120" y="762" font-size="42">but by our <tspan style="fill:var(--gain)">judgments</tspan> about them.</text><text class="m" x="120" y="816" font-size="22">EPICTETUS · STOIC TEACHER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Young Rockefeller.</text>
<text class="b" x="120" y="176" font-size="32">A bookkeeper in Cleveland when panic struck.</text>
<g id="rk"><text class="d" x="160" y="310" font-size="90" letter-spacing="-2">1857</text><g id="rkF"></g>
<rect class="ink" x="160" y="570" width="480" height="16" rx="4"/><path class="s-ink" d="M190 586v54M610 586v54" stroke-width="7" stroke-linecap="round"/>
<rect class="s-ink" x="420" y="524" width="180" height="44" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M510 524v44M436 540h60M436 554h50M524 540h60M524 554h44" stroke-width="3"/>
<text class="m" x="160" y="690" font-size="22">BOOKKEEPER · CLEVELAND</text></g>
<g id="crash"><path class="s-ink" d="M820 240V620H1460" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="850" y="270" font-size="22" style="fill:var(--loss)">FINANCIAL PANIC</text><polyline id="crl" class="s-loss" points="840,520 940,470 1040,430 1140,390 1210,360 1260,560 1330,590 1440,600" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></g>
<path id="look" class="s-gain" d="M345 410L800 390" stroke-width="4" stroke-dasharray="8 10" fill="none"/>
<g id="froze"><g id="crowd2"></g><text class="m" x="860" y="830" font-size="20" style="fill:var(--loss)">MANY FROZE WITH FEAR</text></g>
<g id="cool"><text class="m" x="160" y="740" font-size="22" style="fill:var(--gain)">STAYED COOL · WATCHED CLOSELY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chaos became his classroom.</text>
<text class="b" x="120" y="176" font-size="32">Study, save, wait, then act.</text>
<g id="pA"><rect class="s-line" x="120" y="240" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><polyline class="s-loss" points="160,360 240,340 320,320 360,520 420,540 500,550" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g id="mag"><circle class="s-ink" cx="0" cy="0" r="56" fill="none" stroke-width="8"/><path class="s-ink" d="M40 40l50 50" stroke-width="14" stroke-linecap="round"/></g><text class="m" x="150" y="650" font-size="20">STUDY HOW MARKETS FAIL</text></g>
<g id="pB"><rect class="s-line" x="590" y="240" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M730 340h140v30q30 20 30 60v150q0 20-20 20H720q-20 0-20-20V430q0-40 30-60z" fill="none" stroke-width="7" stroke-linejoin="round"/><g id="coins"></g><text class="m" x="620" y="650" font-size="20" style="fill:var(--gain)">SAVE · BE PATIENT</text><text class="m" x="620" y="682" font-size="20">WHILE OTHERS GAMBLED</text></g>
<g id="pC"><rect class="s-line" x="1060" y="240" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1090" y="290" font-size="20">YEARS LATER</text><g id="riv"></g><path id="bold" class="s-gain" d="M1240 600L1320 470L1370 500L1440 320" fill="none" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/><path id="bhd" class="s-gain" d="M1414 344L1440 320L1442 355" fill="none" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1090" y="650" font-size="20" style="fill:var(--gain)">ACT BOLDLY</text><text class="m" x="1090" y="682" font-size="20">WHILE RIVALS PANIC</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Steady your nerves.</text>
<text class="b" x="120" y="176" font-size="32">Holiday points to how astronauts are trained.</text>
<g id="astr"><circle class="s-ink" cx="300" cy="400" r="80" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="250" y="370" width="100" height="50" rx="24"/><rect class="s-ink" x="220" y="492" width="160" height="148" rx="34" fill="var(--stage)" stroke-width="7"/><rect class="gain" x="270" y="530" width="60" height="36" rx="6"/><text class="m" x="300" y="690" font-size="20" text-anchor="middle">ASTRONAUT</text></g>
<g id="sim"><rect class="s-ink" x="520" y="240" width="480" height="360" rx="18" fill="var(--stage)" stroke-width="6"/><g id="lamps"></g><text id="simT" class="d" x="760" y="450" font-size="44" text-anchor="middle">SYSTEM FAILURE</text><path class="s-line" d="M580 520h360M580 560h240" stroke-width="6" stroke-linecap="round"/><g id="reps"></g><text class="m" x="520" y="720" font-size="20">REHEARSE AGAIN AND AGAIN</text></g>
<g id="fm"><text class="m" x="1080" y="300" font-size="22" style="fill:var(--loss)">FEAR · STILL THERE</text><rect class="s-line" x="1080" y="320" width="380" height="40" rx="20" fill="none" stroke-width="3"/><rect id="fearB" class="loss" x="1080" y="320" width="150" height="40" rx="20"/></g>
<g id="dm"><text class="m" x="1080" y="460" font-size="22" style="fill:var(--gain)">DECISIONS · NOT MADE BY FEAR</text><rect class="gain" x="1080" y="480" width="380" height="40" rx="20"/></g>
<g id="nf"><text class="d5" x="120" y="790" font-size="40">The goal is not to feel nothing.</text></g>
<g id="kf"><text class="d" x="120" y="846" font-size="44">It is to keep fear from making your decisions.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Strip it down.</text>
<text class="b" x="120" y="176" font-size="32">Marcus Aurelius saw things as they really are.</text>
<g id="emp"><g id="empF"></g><path class="s-gain" d="M215 330q0-50 45-60M305 330q0-50-45-60" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="260" y="550" font-size="20" text-anchor="middle">MARCUS AURELIUS</text></g>
<g id="wn"><path class="s-ink" d="M520 300h80q0 76-40 80v50M530 430h60" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="loss" d="M526 330h68q-6 44-34 46q-28-2-34-46z"/><text class="d5" x="640" y="390" font-size="40">Fine wine</text></g>
<line id="ws" class="s-ink" x1="632" y1="376" x2="632" y2="376" stroke-width="5" stroke-linecap="round"/>
<g id="w2"><path class="s-muted" d="M880 376h80m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="1000" y="390" font-size="40" style="fill:var(--gain)">Old grape juice</text></g>
<g id="rb"><path class="loss" d="M540 480h80l40 20-10 120H550l-10-120z"/><text class="d5" x="640" y="570" font-size="40">Royal robe</text></g>
<line id="rs" class="s-ink" x1="632" y1="556" x2="632" y2="556" stroke-width="5" stroke-linecap="round"/>
<g id="r2"><path class="s-muted" d="M880 556h80m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="1000" y="550" font-size="36" style="fill:var(--gain)">Sheep’s wool dyed</text><text class="d" x="1000" y="596" font-size="36" style="fill:var(--gain)">with shellfish blood</text></g>
<g id="lab"><text class="d" x="120" y="740" font-size="44">Do the same with problems.</text><text class="m" x="120" y="796" font-size="22">REMOVE THE LABELS THAT MAKE THEM FEEL HUGE</text>
<g id="prb"></g><text class="m" x="1000" y="856" font-size="20" text-anchor="middle">THE PROBLEM</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it yourself.</text>
<text class="b" x="120" y="176" font-size="32">Imagine an angry email from your boss.</text>
<g id="mail"><rect class="s-ink" x="120" y="240" width="560" height="380" rx="16" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M120 300v-44q0-16 16-16h528q16 0 16 16v44z"/><text class="m" x="150" y="280" font-size="22" style="fill:var(--stage)">FROM: BOSS</text><g id="mlines"></g><text class="d" x="596" y="590" font-size="64" style="fill:var(--loss)">!!</text></g>
<path id="flow" class="s-gain" d="M690 600Q700 660 760 660H1300V616" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="flowH" class="s-gain" d="M1284 628l16-16 16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="tags"></g>
<g id="facts"><rect class="s-gain" x="1120" y="280" width="360" height="320" rx="18" fill="var(--stage)" stroke-width="6"/><text class="m" x="1150" y="330" font-size="22" style="fill:var(--gain)">PLAIN FACTS</text><text class="d5" x="1150" y="420" font-size="34">A few sentences</text><text class="d5" x="1150" y="470" font-size="34">asking for</text><text class="d5" x="1150" y="520" font-size="34">a change.</text></g>
<g id="resp"><text class="d" x="120" y="770" font-size="56">Respond instead of react.</text><rect class="gain" x="124" y="796" width="160" height="10"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pause first.</text>
<text class="b" x="120" y="176" font-size="32">Before you react to a problem.</text>
<path class="s-line" d="M270 420H1330" stroke-width="5"/>
<g id="nP"><circle class="loss" cx="220" cy="420" r="50"/><text class="m" x="220" y="510" font-size="22" text-anchor="middle">PROBLEM</text></g>
<g id="nR"><circle class="gain" cx="1380" cy="420" r="50"/><text class="m" x="1380" y="510" font-size="22" text-anchor="middle">RESPONSE</text></g>
<path id="brL" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="brR" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pz"><circle class="s-ink" cx="800" cy="420" r="80" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="770" y="385" width="20" height="70" rx="6"/><rect class="ink" x="810" y="385" width="20" height="70" rx="6"/></g>
<g id="qm"><text class="d" x="800" y="310" font-size="80" text-anchor="middle" style="fill:var(--gain)">?</text>
<rect class="gain" x="360" y="570" width="400" height="120" rx="16"/><text class="m" x="390" y="615" font-size="22" style="fill:var(--on-gain)">WHAT ACTUALLY HAPPENED</text><text class="d5" x="390" y="666" font-size="34" style="fill:var(--on-gain)">Facts</text>
<rect class="s-muted" x="840" y="570" width="400" height="120" rx="16" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="870" y="615" font-size="22">HOW I FEEL ABOUT IT</text><text class="d5" x="870" y="666" font-size="34" style="fill:var(--muted)">Feelings, set aside</text></g>
<g id="gapL"><text class="m" x="800" y="545" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE GAP</text></g>
<g id="clr"><text class="d" x="120" y="800" font-size="44">That small gap is where clear thinking begins.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What problem in your life</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">right now have you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">dressed up in <tspan style="fill:var(--loss)">drama</tspan>?</text></g>
<g id="chal"><text class="m" x="143" y="700" font-size="26">DESCRIBE IT IN PLAIN, BORING FACTS</text></g>
<g id="mir"><ellipse class="s-ink" cx="1360" cy="660" rx="74" ry="90" fill="var(--stage)" stroke-width="8"/><g id="mirF"></g><path class="s-ink" d="M1360 750v20M1322 772h76" stroke-width="7" stroke-linecap="round"/></g>
<g id="dt"><g id="dtI"><rect class="s-loss" x="1130" y="610" width="140" height="44" rx="22" fill="var(--stage)" stroke-width="4"/><text class="m" x="1200" y="639" font-size="20" text-anchor="middle" style="fill:var(--loss)">DRAMA</text></g></g>
</g>