<text class="m" x="1102" y="650" font-size="20">A MANAGER FIXING</text>
<text class="m" x="1102" y="680" font-size="20">A BROKEN PROCESS</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A daily post.</text>
<g id="s5sub"><text class="b" x="120" y="176" font-size="32">Godin points to his own habit as an example.</text></g>
<g id="ideas"></g>
<g id="lap">
