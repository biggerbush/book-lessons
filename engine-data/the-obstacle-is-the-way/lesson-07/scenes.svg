<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 7</text>
<text class="d" x="116" y="320" font-size="84" letter-spacing="-2">Persevere,</text>
<text class="d" x="116" y="416" font-size="84" letter-spacing="-2">and be ready to</text>
<text class="d" x="116" y="512" font-size="84" letter-spacing="-2">begin again.</text>
<text class="b" x="120" y="620" font-size="32">Every obstacle you overcome prepares you for the next one.</text>
<path id="road0" class="s-ink" d="M960 560C1100 560 1160 360 1300 360S1440 440 1480 440" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="w0"></g>
<circle id="walk0" class="gain" r="22"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">There is no final finish line.</text>
<text class="b" x="120" y="176" font-size="32">Beat one problem, and the next one steps forward.</text>
<path class="s-ink" d="M140 640H1460" stroke-width="6" stroke-linecap="round"/>
<g id="fin1"><g id="fin1i"><path class="s-ink" d="M1000 640V400" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="1000" y="400" width="180" height="60" rx="6"/><text class="m" x="1090" y="438" font-size="22" text-anchor="middle" style="fill:var(--stage)">FINISH</text></g></g>
<g id="walls1"></g>
<g id="rn1"><rect id="pk1" class="gain" x="246" y="576" width="32" height="48" rx="8" stroke="var(--ink)" stroke-width="4"/><g id="run1"></g></g>
<g id="pack1"><text class="d5" x="120" y="790" font-size="40">What do you carry into the next one?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The long way home.</text>
<text class="b" x="120" y="176" font-size="32">Homer’s Odysseus: ten years at war, then ten more at sea.</text>
<g id="troy2"><rect class="ink" x="130" y="470" width="110" height="110"/><path class="ink" d="M130 470v-22h22v22h22v-22h22v22h22v-22h22v22z"/><text class="m" x="185" y="622" font-size="22" text-anchor="middle">TROY</text></g>
<path id="rt2" class="s-line" d="M300 540C450 400 600 640 760 520S1050 400 1120 540S1180 590 1210 570" fill="none" stroke-width="5" stroke-dasharray="12 12"/>
<g id="ith2"><ellipse class="ink" cx="1380" cy="592" rx="100" ry="26"/><path class="gain" d="M1350 570v-36l30-24 30 24v36z"/><text class="m" x="1380" y="652" font-size="22" text-anchor="middle">ITHACA</text></g>
<g id="storm2"></g>
<g id="ship2w"><g id="ship2"><path class="ink" d="M-42 -6h84l-16 24h-52z"/><path class="s-ink" d="M0 -6V-56" stroke-width="5"/><path class="gain" d="M4 -54l32 40h-32z"/><text class="m" x="0" y="-80" font-size="22" text-anchor="middle">ODYSSEUS</text></g></g>
<g id="tl0g"><rect class="loss" x="120" y="690" width="650" height="36" rx="18"/><text class="m" x="120" y="766" font-size="20">10 YEARS OF WAR AT TROY</text></g>
<g id="tl1g"><rect class="s-line" x="830" y="690" width="650" height="36" rx="18" fill="none" stroke-width="3"/><rect id="tl1" class="gain" x="830" y="690" width="0" height="36" rx="18"/><text class="m" x="830" y="766" font-size="20">10 MORE YEARS TO SAIL HOME</text></g>
<g id="fin2"><text class="d" x="120" y="840" font-size="44">His victory: refusing to quit for a decade.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Persist, then persevere.</text>
<text class="b" x="120" y="176" font-size="32">One fight, hit again and again. Versus the long game.</text>
<g id="L3"><rect class="s-line" x="120" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">PERSISTENCE</text><text class="b" x="150" y="318" font-size="26">Hit one problem until it cracks.</text>
<polygon class="s-ink" points="320,620 340,500 420,460 520,470 570,540 560,620" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path id="ck3" class="s-ink" d="M470 466L482 520L452 560L476 618" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="hm3"><path class="s-ink" d="M0 0V-200" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="-50" y="-240" width="100" height="48" rx="8"/></g></g>
<g id="R3"><rect class="s-line" x="840" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">PERSEVERANCE</text><text class="b" x="870" y="318" font-size="26">The long game, measured in years.</text>
<g id="cal3"></g><g id="yd3"></g></g>
<g id="tg3"><text class="d" x="150" y="772" font-size="44">= action</text><text class="d" x="870" y="772" font-size="44" style="fill:var(--gain)">= will</text></g>
<g id="f3"><text class="d5" x="120" y="845" font-size="34">You need both. Perseverance keeps you on the road.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three tools, one system.</text>
<text class="b" x="120" y="176" font-size="32">Perception, action and will hold each other up.</text>
<g id="lk4"></g>
<g id="t40"><circle class="s-line" cx="800" cy="330" r="110" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M720 330Q800 270 880 330Q800 390 720 330Z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="800" cy="330" r="22"/><text class="m" x="940" y="320" font-size="24">PERCEPTION</text><text class="b" x="940" y="358" font-size="26">See without panic</text></g>
<g id="t41"><circle class="s-line" cx="560" cy="640" r="110" fill="var(--stage)" stroke-width="4"/><rect class="ink" x="525" y="625" width="70" height="62" rx="16"/><path class="s-ink" d="M535 630v-50M553 628v-62M571 628v-58M588 632v-42M528 662l-24-26" stroke-width="13" stroke-linecap="round"/><text class="m" x="430" y="630" font-size="24" text-anchor="end">ACTION</text><text class="b" x="430" y="668" font-size="26" text-anchor="end">Work step by step</text></g>
<g id="t42"><circle class="s-line" cx="1040" cy="640" r="110" fill="var(--stage)" stroke-width="4"/><path id="hr4" class="gain" d="M1040 690C980 650 970 600 1005 590C1025 585 1037 598 1040 612C1043 598 1055 585 1075 590C1110 600 1100 650 1040 690Z"/><text class="m" x="1170" y="630" font-size="24">WILL</text><text class="b" x="1170" y="668" font-size="26">Stay steady</text></g>
<g id="os4"><text class="m" x="800" y="548" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE SYSTEM</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Each hurdle trains you.</text>
<text class="b" x="120" y="176" font-size="32">Every obstacle you get through leaves you a little stronger.</text>
<g id="db5"><g id="db5i"><path class="s-ink" d="M190 520H410" stroke-width="12" stroke-linecap="round"/><rect class="ink" x="214" y="470" width="28" height="100" rx="6"/><rect class="ink" x="358" y="470" width="28" height="100" rx="6"/><rect class="ink" x="190" y="490" width="20" height="60" rx="5"/><rect class="ink" x="390" y="490" width="20" height="60" rx="5"/></g><text class="m" x="300" y="640" font-size="20" text-anchor="middle">A LITTLE STRONGER</text></g>
<path class="s-ink" d="M440 760H1440" stroke-width="6" stroke-linecap="round"/>
<g id="st5"></g><g id="cl5"></g>
<g id="fn5"><text class="d" x="120" y="840" font-size="44">It didn’t just block you. It prepared you.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ready to begin again.</text>
<text class="b" x="120" y="176" font-size="32">Sometimes you lose what you built.</text>
<defs><clipPath id="sky6"><rect x="120" y="190" width="1360" height="450"/></clipPath></defs>
<g clip-path="url(#sky6)"><g id="sun6"><circle class="gain" cx="900" cy="760" r="90"/><g id="rays6"></g></g></g>
<path class="s-ink" d="M120 640H1480" stroke-width="6" stroke-linecap="round"/>
<g id="blk6"></g>
<ellipse id="sd6" class="ink" cx="680" cy="632" rx="13" ry="8"/>
<line id="stem6" class="s-gain" x1="680" y1="630" x2="680" y2="630" stroke-width="7" stroke-linecap="round"/>
<g id="lv6"><path class="gain" d="M680 580q-40-10-50-40q40 0 50 40z"/><path class="gain" d="M680 570q40-10 50-40q-40 0-50 40z"/></g>
<g id="acc6"><text class="m" x="120" y="710" font-size="22">ACCEPT IT CALMLY · EVEN EXPECT IT</text></g>
<g id="sr6"><text class="m" x="900" y="360" font-size="22" text-anchor="middle">NOT FAILURE · THE NEXT ROUND</text></g>
<g id="dr6"><rect class="gain" x="1200" y="380" width="170" height="260"/><rect id="dp6" class="ink" x="1200" y="380" width="170" height="260"/><rect class="s-ink" x="1200" y="380" width="170" height="260" fill="none" stroke-width="6"/></g>
<path id="pth6" class="s-gain" d="M960 690Q1120 712 1285 650" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="cp6"><text class="d5" x="120" y="800" font-size="36">The path through one obstacle becomes the doorway to the next.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your next move.</text>
<text class="b" x="120" y="176" font-size="32">Three lines, written today.</text>
<g id="nb7"><rect class="s-ink" x="260" y="220" width="1080" height="600" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rg7"></g></g>
<g id="r70"><text class="m" x="340" y="310" font-size="22">THE LAST OBSTACLE I OVERCAME</text></g>
<g id="r71"><text class="m" x="340" y="470" font-size="22">ONE SKILL OR STRENGTH IT GAVE ME</text></g>
<g id="r72"><text class="m" x="340" y="630" font-size="22" style="fill:var(--gain)">THE OBSTACLE NOW · HOW THAT SKILL APPLIES</text></g>
<path id="ar7" class="s-gain" d="M1180 530C1250 560 1250 650 1180 680M1180 680l26-4M1180 680l14 22" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="pn7"><g id="pn7i"><polygon class="gain" points="0,0 8,-26 72,-90 90,-72 26,-8" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></g></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What obstacle are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">facing right now?</text></g>
<g id="qc"><text class="d5" x="140" y="610" font-size="52">Can you see it as the next step,</text></g>
<g id="qd"><text class="d5" x="140" y="680" font-size="52">not the <tspan style="fill:var(--gain)">end of the road</tspan>?</text></g>
<g id="gr8"><path class="s-ink" d="M1160 780h80v-70h80v-70h80v-70h80" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle id="dt8" class="gain" r="18"/></g>
<text class="m" x="143" y="800" font-size="26">BEGIN AGAIN</text>
</g>