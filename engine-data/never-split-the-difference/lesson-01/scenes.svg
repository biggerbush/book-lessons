<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 1</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Negotiation is</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2" style="fill:var(--gain)">emotional,</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">not rational.</text>
<text class="b" x="120" y="620" font-size="32">Why feelings, not facts, drive every deal you make.</text>
<circle class="s-ink" cx="1250" cy="400" r="130" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M1100 790v-70a150 150 0 0 1 300 0v70z"/>
<g id="hb0"></g>
<g id="arg0"><rect class="s-ink" x="950" y="190" width="200" height="100" rx="22" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1110 290l20 34 4-34" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-muted" d="M980 225h140M980 255h100" stroke-width="6" stroke-linecap="round"/></g>
<g id="fbi0"><rect class="gain" x="1200" y="650" width="100" height="50" rx="10"/><text class="m" x="1250" y="683" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">FBI</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old rulebook.</text>
<text class="b" x="120" y="176" font-size="32">For decades, negotiation was taught as a rational problem.</text>
<g id="bk1"><rect class="s-ink" x="140" y="240" width="260" height="340" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="140" y="240" width="36" height="340" rx="8"/><text class="m" x="270" y="640" font-size="20" text-anchor="middle">HARVARD APPROACH</text></g>
<g id="gty"><text class="d5" x="200" y="340" font-size="34">Getting</text><text class="d5" x="200" y="384" font-size="34">to Yes</text><rect class="gain" x="200" y="410" width="120" height="10"/></g>
<g id="sep"><path class="s-muted" d="M750 260V600" stroke-width="4" stroke-dasharray="10 10"/><g id="sepP"></g>
<g id="sepQ"><rect class="loss" x="820" y="390" width="120" height="120" rx="14"/><path d="M845 450c20-40 50 40 70 0s-50-30-40 10" stroke="var(--stage)" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<text class="m" x="750" y="640" font-size="20" text-anchor="middle">SEPARATE THE PEOPLE FROM THE PROBLEM</text></g>
<g id="calc"><text class="m" x="1280" y="640" font-size="18" text-anchor="middle">BOTH SIDES AS CALM CALCULATORS</text></g>
<g id="miss1"><text class="d" x="120" y="780" font-size="52" style="fill:var(--loss)">But people aren’t calculators.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two systems, one mind.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Daniel Kahneman’s two ways of thinking.</text>
<g id="k2"><rect class="s-line" x="120" y="220" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-line" x="840" y="220" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/></g>
<g id="f2"><path class="s-muted" d="M150 330h30M140 380h40M150 430h30" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M250 280l-60 110h50l-30 100 90-130h-55l35-80z"/>
<text class="d" x="340" y="360" font-size="64">System 1</text><text class="m" x="340" y="410" font-size="20">FAST · INSTINCTIVE · EMOTIONAL</text></g>
<g id="s2r"><g id="thk"></g><circle class="ink" cx="1000" cy="290" r="6"/><circle class="ink" cx="1018" cy="266" r="9"/><circle class="ink" cx="1040" cy="238" r="12"/>
<text class="d" x="1060" y="360" font-size="64">System 2</text><text class="m" x="1060" y="410" font-size="20">SLOW · CAREFUL · LOGICAL</text></g>
<g id="bl2"><rect x="160" y="520" width="560" height="20" rx="10" fill="var(--line)"/><rect id="bar1" class="gain" x="160" y="520" height="20" rx="10"/><text class="m" x="160" y="580" font-size="18">REACTS FIRST</text>
<rect x="880" y="520" width="560" height="20" rx="10" fill="var(--line)"/><rect id="bar2" class="ink" x="880" y="520" height="20" rx="10"/><text class="m" x="880" y="580" font-size="18">EXPLAINS AFTERWARD</text></g>
<g id="sum2"><text class="d" x="120" y="760" font-size="44">System 1 reacts. System 2 explains afterward.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No emotion, no choice.</text>
<text class="b" x="120" y="176" font-size="32">Neuroscientist Antonio Damasio’s patients.</text>
<g id="scan3"><circle class="s-ink" cx="320" cy="420" r="140" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M230 440c-30-50 10-110 60-100 20-40 90-40 110 0 50 0 70 60 40 100 10 40-40 70-80 50-30 30-100 20-110-20-30 0-40-20-20-30z" fill="none" stroke-width="5" stroke-linejoin="round"/><path class="s-ink" d="M320 345c-14 30 14 50 0 80s14 50 0 70M265 400c20 0 30 15 30 30M380 395c-20 5-28 20-26 36" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="spot3"><path class="s-muted" d="M440 480L490 505" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
<path d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z" transform="translate(540 538) scale(.3)" fill="var(--line)" stroke="var(--muted)" stroke-width="10"/>
<circle class="s-loss" cx="540" cy="540" r="64" fill="none" stroke-width="7"/><path class="s-loss" d="M495 495L585 585" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="320" y="700" font-size="20" text-anchor="middle">CAN’T FEEL EMOTIONS</text></g>
<g id="stk3"><g id="stkP"></g></g>
<g id="ch3"><rect class="s-ink" x="610" y="260" width="90" height="90" rx="12" fill="var(--stage)" stroke-width="5"/><text class="d" x="655" y="322" font-size="50" text-anchor="middle">A</text>
<rect class="s-ink" x="840" y="260" width="90" height="90" rx="12" fill="var(--stage)" stroke-width="5"/><text class="d" x="885" y="322" font-size="50" text-anchor="middle">B</text>
<text class="d" x="770" y="398" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text><text class="m" x="770" y="700" font-size="20" text-anchor="middle">CAN REASON, CAN’T CHOOSE</text></g>
<g id="sc3"><path class="s-ink" d="M1250 330V640M1170 640h160" stroke-width="8" stroke-linecap="round"/><line id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1250" cy="330" r="12"/>
<g id="panL"><path class="s-ink" d="M-50 90L0 0L50 90" fill="none" stroke-width="3"/><path class="ink" d="M-60 90h120a60 26 0 0 1-120 0z"/><g id="ht3"></g></g>
<g id="panR"><path class="s-ink" d="M-50 90L0 0L50 90" fill="none" stroke-width="3"/><path class="ink" d="M-60 90h120a60 26 0 0 1-120 0z"/><rect class="ink" x="-32" y="50" width="64" height="38" rx="4"/><text class="m" x="0" y="76" font-size="18" text-anchor="middle" style="fill:var(--stage)">FACTS</text></g>
<text class="m" x="1250" y="700" font-size="20" text-anchor="middle">FEELINGS TIP THE SCALES</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Harvard showdown.</text>
<text class="b" x="120" y="176" font-size="32">Voss joined a negotiation course at Harvard Law School.</text>
<g id="cls4"><rect class="ink" x="520" y="215" width="560" height="140" rx="10"/><text class="m" x="800" y="275" font-size="22" text-anchor="middle" style="fill:var(--stage)">NEGOTIATION COURSE</text><text class="m" x="800" y="315" font-size="20" text-anchor="middle" style="fill:var(--stage)">HARVARD LAW SCHOOL</text></g>
<g id="stu4"><rect class="s-ink" x="150" y="395" width="150" height="46" rx="23" fill="var(--stage)" stroke-width="4"/><text class="m" x="225" y="425" font-size="20" text-anchor="middle">LOGIC</text>
<rect class="s-ink" x="330" y="395" width="180" height="46" rx="23" fill="var(--stage)" stroke-width="4"/><text class="m" x="420" y="425" font-size="20" text-anchor="middle">TACTICS</text><g id="stuP"></g>
<text class="m" x="330" y="660" font-size="20" text-anchor="middle">SHARP STUDENTS</text></g>
<g id="vos4"><g id="vosP"></g><rect class="gain" x="1080" y="385" width="340" height="50" rx="25"/><text class="m" x="1250" y="417" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">WHAT DO THEY FEEL?</text>
<text class="m" x="1250" y="660" font-size="20" text-anchor="middle">VOSS · CRISIS TRAINING</text></g>
<g id="win4"><path class="s-line" d="M620 620h360" stroke-width="4"/><g id="bars4"></g><text class="m" x="800" y="660" font-size="20" text-anchor="middle">AGAIN AND AGAIN</text></g>
<g id="sum4"><text class="d" x="120" y="790" font-size="48">Curiosity beat clever logic.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen, don’t argue.</text>
<text class="b" x="120" y="176" font-size="32">Facts make people dig in. Listening lowers their guard.</text>
<g id="you5"><g id="youP"></g><text class="m" x="220" y="650" font-size="20" text-anchor="middle">YOU</text></g>
<g id="them5"><g id="themP"></g><text class="m" x="1100" y="650" font-size="20" text-anchor="middle">THEM</text></g>
<g id="arw5"></g>
<rect id="wall5" class="loss" x="780" width="40" rx="6"/>
<g id="ear5"><path class="s-gain" d="M500 430a45 50 0 1 1 80 30c-20 14-14 50-44 54M520 440a18 18 0 1 1 32 10" fill="none" stroke-width="10" stroke-linecap="round"/><path class="s-gain" d="M1000 400q-40 50 0 100M955 380q-50 70 0 140" fill="none" stroke-width="5" stroke-dasharray="8 8"/><text class="m" x="540" y="580" font-size="20" text-anchor="middle" style="fill:var(--gain)">LISTEN</text></g>
<g id="tb5"><circle class="s-ink" cx="1140" cy="390" r="8" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="1170" cy="358" r="12" fill="var(--stage)" stroke-width="4"/><ellipse class="s-ink" cx="1270" cy="270" rx="200" ry="75" fill="var(--stage)" stroke-width="5"/>
<rect class="s-loss" x="1110" y="245" width="150" height="50" rx="25" fill="none" stroke-width="4"/><text class="m" x="1185" y="277" font-size="20" text-anchor="middle" style="fill:var(--loss)">FEARS</text>
<rect class="gain" x="1280" y="245" width="150" height="50" rx="25"/><text class="m" x="1355" y="277" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">HOPES</text></g>
<g id="sum5"><text class="d" x="120" y="790" font-size="40">Know their fears and hopes, and you know what moves them.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tactical empathy.</text>
<text class="b" x="120" y="176" font-size="32">Understand their feelings, and show them you understand.</text>
<g id="ppl6"><path class="s-muted" d="M190 450V620M190 560H330M320 560V620M790 450V620M790 560H650M660 560V620" fill="none" stroke-width="8" stroke-linecap="round"/><g id="pplP"></g></g>
<g id="und6"><path class="s-gain" d="M290 390Q490 250 705 480" fill="none" stroke-width="5" stroke-dasharray="10 8"/><g id="bh6"></g><text class="m" x="490" y="300" font-size="20" text-anchor="middle" style="fill:var(--gain)">UNDERSTAND</text></g>
<g id="shw6"><rect class="s-ink" x="380" y="600" width="220" height="70" rx="22" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M455 635l20 18 40-36" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="490" y="710" font-size="20" text-anchor="middle">SHOW YOU UNDERSTAND</text></g>
<g id="not6"><text class="m" x="980" y="225" font-size="20">IT IS NOT:</text>
<rect class="s-muted" x="980" y="240" width="500" height="64" rx="32" fill="none" stroke-width="4"/><text class="m" x="1230" y="281" font-size="24" text-anchor="middle" style="fill:var(--ink)">AGREEING</text>
<rect class="s-muted" x="980" y="324" width="500" height="64" rx="32" fill="none" stroke-width="4"/><text class="m" x="1230" y="365" font-size="24" text-anchor="middle" style="fill:var(--ink)">BEING SOFT</text>
<line id="st0" class="s-loss" x1="1010" y1="273" x2="1010" y2="273" stroke-width="2" stroke-opacity=".6" stroke-linecap="round"/><line id="st1" class="s-loss" x1="1010" y1="357" x2="1010" y2="357" stroke-width="2" stroke-opacity=".6" stroke-linecap="round"/></g>
<g id="key6"><path id="shk6" class="s-ink" d="M1180 560v-50a50 50 0 0 1 100 0v50" fill="none" stroke-width="16"/><rect class="ink" x="1140" y="550" width="180" height="140" rx="16"/><circle cx="1230" cy="605" r="14" fill="var(--stage)"/><rect x="1224" y="610" width="12" height="34" fill="var(--stage)"/>
<g id="kg6"><circle class="gain" cx="0" cy="0" r="28"/><circle cx="0" cy="0" r="10" fill="var(--stage)"/><rect class="gain" x="20" y="-7" width="110" height="14"/><rect class="gain" x="100" y="7" width="12" height="16"/><rect class="gain" x="118" y="7" width="12" height="12"/></g></g>
<g id="yes6"><text class="d" x="1350" y="640" font-size="60" style="fill:var(--gain)">YES</text></g>
<g id="sum6"><text class="d" x="120" y="800" font-size="40">People say yes to those who make them feel understood.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it this week.</text>
<text class="b" x="120" y="176" font-size="32">Before your next tough conversation, set your arguments aside.</text>
<g id="cal7"><rect class="s-ink" x="120" y="240" width="400" height="400" rx="16" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="120" y="240" width="400" height="70" rx="16"/><rect class="gain" x="120" y="280" width="400" height="30"/><text class="m" x="320" y="284" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">THIS WEEK</text><g id="grid7"></g></g>
<g id="args7"><g id="argsI"><rect class="s-ink" x="580" y="270" width="240" height="140" rx="12" fill="var(--stage)" stroke-width="4"/><rect class="s-ink" x="590" y="280" width="240" height="140" rx="12" fill="var(--stage)" stroke-width="4"/><rect class="s-ink" x="600" y="290" width="240" height="140" rx="12" fill="var(--stage)" stroke-width="4"/><text class="m" x="720" y="369" font-size="24" text-anchor="middle" font-weight="700" style="fill:var(--muted)">ARGUMENTS</text></g></g>
<g id="note7"><rect class="s-ink" x="880" y="240" width="600" height="420" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="920" y="320" font-size="22">WHAT MIGHT THEY BE FEELING?</text>
<path id="sq0" class="s-ink" d="M920 380q20-20 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></g>
<g id="nt2"><text class="m" x="920" y="470" font-size="22">WHAT MIGHT THEY FEAR LOSING?</text><path id="sq1" class="s-ink" d="M920 530q20-20 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></g>
<g id="go7"><rect class="gain" x="1180" y="580" width="260" height="54" rx="27"/><text class="m" x="1310" y="615" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">START THERE</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">In your next disagreement,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">will you win the argument,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">or <tspan style="fill:var(--gain)">understand the person</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">FEELINGS FIRST, FACTS SECOND</text>
<g id="hb8"></g>
</g>