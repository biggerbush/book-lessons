<g id="en7"><text class="d5" x="120" y="720" font-size="36">More energy for the work and people that matter.</text></g>
<g id="nm7"><text class="d" x="120" y="810" font-size="40">Being judged is normal, not a reason to stop.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What have you delayed</text></g>
