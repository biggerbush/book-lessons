</g>
<g id="sx"><text class="d" x="120" y="830" font-size="44">Every engineer knew what success looked like.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Memory is like Velcro.</text>
<text class="b" x="120" y="176" font-size="32">Concrete ideas have hooks. Abstract ones don’t.</text>
<g id="vp">
<rect x="760" y="220" width="90" height="560" fill="var(--line)"/>
<g id="loops"></g>
<text class="m" x="805" y="824" font-size="20" text-anchor="middle">VELCRO · YOUR MIND</text>
</g>
<g id="abl">
<text class="m" x="360" y="552" font-size="20" text-anchor="middle" style="fill:var(--loss)">NO HOOKS</text>
</g>
<g id="abs">
<path class="s-muted" d="M680 430V600" fill="none" stroke-width="5" stroke-dasharray="10 12" stroke-linecap="round"/>
<path class="s-muted" d="M540 470v190m-22-22 22 22 22-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="510" y="560" font-size="20" text-anchor="end" style="fill:var(--loss)">SLIDES OFF</text>
</g>
<g id="abw"><g id="abm">
<circle r="80" fill="var(--line)"/>
