<rect class="s-ink" x="1370" y="730" width="60" height="100" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="loss" x="1386" y="778" width="28" height="22" rx="4"/>
<path class="s-loss" d="M1392 778v-8a8 8 0 0 1 16 0v8" fill="none" stroke-width="4"/>
