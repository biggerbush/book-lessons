<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Reach into the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">cookie jar.</text>
<text class="b" x="120" y="600" font-size="32">Your past victories are fuel for today's hardest moments.</text>
<g id="tjar"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The moment you crack.</text>
<text class="b" x="120" y="176" font-size="32">Deep in a hard challenge, your mind starts to whisper.</text>
