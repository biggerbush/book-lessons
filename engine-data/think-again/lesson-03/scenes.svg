<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Finding joy in</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">being wrong.</text>
<text class="b" x="120" y="600" font-size="32">Why discovering your mistakes can feel like a small victory.</text>
<g id="rays"></g>
<circle id="fc" cx="1310" cy="380" r="110" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/>
<circle class="ink" cx="1270" cy="350" r="10"/><circle class="ink" cx="1350" cy="350" r="10"/>
<path id="mth" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
<g id="xb"><circle class="loss" cx="1420" cy="270" r="36"/><path d="M1405 255l30 30M1435 255l-30 30" stroke="var(--stage)" stroke-width="7" stroke-linecap="round"/></g>
<g id="cb"><circle class="gain" cx="1420" cy="270" r="36"/><path d="M1403 270l12 12 22-26" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why being wrong stings.</text>
<text class="b" x="120" y="176" font-size="32">We carry our opinions like a shield.</text>
<g id="w1"><circle class="ink" cx="300" cy="420" r="44"/><path class="ink" d="M234 605v-57a66 66 0 0 1 132 0v57z"/></g>
<g id="shd"><path id="shp" d="M400 380h150v110c0 70-40 110-75 130c-35-20-75-60-75-130z" fill="var(--stage)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="475" y="460" font-size="18" text-anchor="middle">MY</text><text class="m" x="475" y="488" font-size="18" text-anchor="middle">OPINION</text></g>
<g id="atk"></g>
<g id="atl"><text class="m" x="120" y="700" font-size="20" style="fill:var(--loss)">IT FEELS LIKE AN ATTACK ON WHO WE ARE</text></g>
<g id="weld">
<g id="blf"><rect x="900" y="410" width="200" height="100" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="m" x="972" y="468" font-size="22" text-anchor="middle">BELIEF</text>
<path id="crk1" d="M1074 410l-14 30 20 20-14 30 8 20" fill="none" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/></g>
<path class="s-gain" d="M1100 460l12-14 12 28 12-28 12 28 12-28 12 28 12-28 12 28 12-14" fill="none" stroke-width="6" stroke-linejoin="round"/>
<g id="hrtg"><path id="hrt" transform="translate(1300 470) scale(1.2)" d="M0 60C-90 0-90-70-40-75C-15-78 0-60 0-45C0-60 15-78 40-75C90-70 90 0 0 60Z" fill="var(--ink)"/>
<path id="crk2" d="M1300 418l-12 32 18 20-14 30 8 20" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<text class="m" x="1300" y="590" font-size="22" text-anchor="middle">IDENTITY</text>
<text class="m" x="1150" y="400" font-size="18" text-anchor="middle" style="fill:var(--gain)">WELDED</text>
</g>
<g id="brk"><text class="d" x="120" y="800" font-size="44">If the belief breaks, it feels like we break too.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The delighted expert.</text>
<text class="b" x="120" y="176" font-size="32">Grant shared findings that contradicted Daniel Kahneman’s work.</text>
<g id="gr"><circle class="ink" cx="260" cy="400" r="44"/><path class="ink" d="M194 585v-57a66 66 0 0 1 132 0v57z"/><text class="m" x="260" y="650" font-size="20" text-anchor="middle">ADAM GRANT</text></g>
<g id="paper"><rect x="-32" y="-42" width="64" height="84" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M-18-22h36M-18-8h36M-18 6h20" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/><path d="M4 18l14 14M18 18l-14 14" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/></g>
<g id="kg"><g id="krays"></g><path class="ink" d="M570 600v-60a70 70 0 0 1 140 0v60z"/>
<circle id="kh" cx="640" cy="400" r="62" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<circle id="ke0" class="ink" cx="618" cy="390"/><circle id="ke1" class="ink" cx="662" cy="390"/>
<path id="km" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="640" y="650" font-size="20" text-anchor="middle">DANIEL KAHNEMAN</text><text class="m" x="640" y="680" font-size="18" text-anchor="middle">NOBEL PRIZE WINNER</text></g>
<g id="qc"><rect x="880" y="250" width="600" height="370" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="d" x="910" y="360" font-size="120" style="fill:var(--gain)">“</text>
<text class="d5" x="920" y="410" font-size="40">Being wrong is the only</text><text class="d5" x="920" y="462" font-size="40">way I feel sure I’ve</text><text class="d5" x="920" y="514" font-size="40">learned anything.”</text>
<text class="m" x="920" y="580" font-size="20" style="fill:var(--gain)">DANIEL KAHNEMAN</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Detach from your past self.</text>
<text class="b" x="120" y="176" font-size="32">First of two detachments: your present self is not your past self.</text>
<g id="ps"><circle cx="450" cy="430" r="40" fill="var(--muted)"/><path d="M390 598v-52a60 60 0 0 1 120 0v52z" fill="var(--muted)"/></g>
<g id="ph"><rect x="320" y="300" width="260" height="340" rx="6" fill="none" stroke="var(--ink)" stroke-width="6" transform="rotate(-4 450 470)"/><text class="m" x="450" y="700" font-size="20" text-anchor="middle">WHAT I BELIEVED A YEAR AGO</text></g>
<g id="lk"><line id="l0" x1="600" y1="470" y2="470" class="s-ink" stroke-width="6" stroke-linecap="round"/><line id="l1" x2="960" y1="470" y2="470" class="s-ink" stroke-width="6" stroke-linecap="round"/></g>
<g id="prw"><g id="pr"><circle class="gain" cx="1050" cy="430" r="40"/><path class="gain" d="M990 598v-52a60 60 0 0 1 120 0v52z"/>
<path id="cr" d="M1104 404l20-8M1106 428h22M1104 452l20 8" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g></g>
<g id="crl"><text class="m" x="1050" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">CRINGE? GOOD SIGN.</text></g>
<g id="gw"><path class="s-gain" d="M1250 600V350m-20 24 20-24 20 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1280" y="480" font-size="22" style="fill:var(--gain)">GROWN</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Detach from your opinions.</text>
<text class="b" x="120" y="176" font-size="32">Define yourself by your values, not by your beliefs.</text>
<g id="bod"><circle class="ink" cx="500" cy="330" r="60"/><path class="ink" d="M320 700v-120a180 180 0 0 1 360 0v120z"/><path class="s-ink" d="M650 600L800 540" stroke-width="14" stroke-linecap="round"/></g>
<g id="vb0"><rect class="gain" x="380" y="495" width="240" height="56" rx="28"/><text class="m" x="500" y="531" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CURIOSITY</text></g>
<g id="vb1"><rect class="gain" x="380" y="571" width="240" height="56" rx="28"/><text class="m" x="500" y="607" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">HONESTY</text></g>
<g id="vbl"><text class="m" x="500" y="750" font-size="20" text-anchor="middle">WHO YOU ARE: YOUR VALUES</text></g>
<g id="tgw"><g id="tg"><path d="M800 540L850 510" stroke="var(--ink)" stroke-width="3"/><rect x="850" y="470" width="240" height="80" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="970" y="518" font-size="22" text-anchor="middle" style="fill:var(--loss)">AN OPINION</text></g></g>
<g id="hold"><text class="m" x="860" y="640" font-size="22">SOMETHING YOU HOLD,</text><text class="m" x="860" y="676" font-size="22">NOT SOMETHING YOU ARE.</text></g>
<g id="lg"><text class="d" x="120" y="830" font-size="40">Letting it go no longer feels like losing yourself.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The planet that wasn’t there.</text>
<text class="b" x="120" y="176" font-size="32">Astronomer Andrew Lyne announced a planet circling a distant star.</text>
<g id="tel"><path class="s-ink" d="M330 560L250 780M330 560L410 780M330 560V780" stroke-width="7" stroke-linecap="round"/><line class="s-ink" x1="220" y1="640" x2="510" y2="456" stroke-width="40" stroke-linecap="round"/><line class="s-ink" x1="200" y1="660" x2="180" y2="690" stroke-width="12" stroke-linecap="round"/></g>
<line id="sight" class="s-muted" x1="560" y1="430" x2="880" y2="440" stroke-width="3" stroke-dasharray="8 10"/>
<g id="star"><ellipse id="orb" cx="1100" cy="440" rx="200" ry="70" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="8 8"/>
<circle class="ink" cx="1100" cy="440" r="30"/>
<path class="s-ink" d="M1142 440h14M1044 440h14M1100 482v14M1100 384v14M1130 470l10 10M1060 400l10 10M1130 410l10-10M1060 480l10-10" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1100" y="352" font-size="18" text-anchor="middle">DISTANT STAR</text></g>
<circle id="pl" class="ink" r="18"/>
<g id="ghost"><circle r="18" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="6 6"/><path d="M-30-30L30 30M30-30L-30 30" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/></g>
<g id="nw"><rect class="gain" x="1260" y="230" width="220" height="60" rx="30"/><text class="m" x="1370" y="268" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">BIG NEWS</text></g>
<g id="sh"><rect x="620" y="560" width="260" height="240" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-line" d="M650 600h190M650 640h150M650 680h200M650 720h120M650 760h170" stroke-width="6" stroke-linecap="round"/>
<ellipse id="err" cx="752" cy="680" rx="116" ry="22" fill="none" stroke="var(--loss)" stroke-width="5"/><text class="m" x="750" y="840" font-size="20" text-anchor="middle" style="fill:var(--loss)">A MISTAKE IN THE MATH</text></g>
<g id="nop"><text class="d" x="1100" y="600" font-size="44" text-anchor="middle" style="fill:var(--loss)">No planet.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A standing ovation.</text>
<text class="b" x="120" y="176" font-size="32">Lyne admitted his mistake in front of his colleagues.</text>
<g id="lyne"><path class="s-ink" d="M520 470H1080" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="800" cy="280" r="28"/><path class="ink" d="M755 370v-10a45 45 0 0 1 90 0v10z"/><rect x="750" y="360" width="100" height="110" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/></g>
<g id="bub"><rect x="460" y="220" width="250" height="64" rx="32" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><path d="M706 262l34 14" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><text class="m" x="585" y="259" font-size="20" text-anchor="middle">I GOT IT WRONG.</text></g>
<g id="aud"></g>
<g id="hon"><text class="d" x="120" y="848" font-size="44">His honesty earned <tspan style="fill:var(--gain)">respect</tspan>, not shame.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make it a habit.</text>
<text class="b" x="120" y="176" font-size="32">When you’re proven wrong, ask yourself one question.</text>
<g id="nb"><rect x="120" y="240" width="480" height="420" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-line" d="M170 250V650M200 380h360M200 470h360M200 530h360" stroke-width="3"/></g>
<g id="nq"><text class="d" x="200" y="360" font-size="46" style="fill:var(--gain)">Interesting.</text><text class="d5" x="200" y="456" font-size="40">What did I</text><text class="d5" x="200" y="516" font-size="40">just learn?</text></g>
<g id="ar"><path class="s-muted" d="M650 450h220m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="jar"><path class="s-ink" d="M1020 300h260M1040 300v320a40 40 0 0 0 40 40h140a40 40 0 0 0 40-40V300" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1150" y="710" font-size="20" text-anchor="middle" style="fill:var(--gain)">BANK OF KNOWLEDGE</text><text class="m" x="1150" y="742" font-size="20" text-anchor="middle">NOT A DENT IN YOUR PRIDE</text></g>
<g id="coins"></g>
<g id="pg"><text class="d" x="120" y="830" font-size="44">Over time, being wrong feels like progress.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">What’s one belief you</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">held five years ago that</text></g>
<g id="qc8"><text class="d" x="136" y="540" font-size="88" letter-spacing="-2">you’ve since <tspan style="fill:var(--gain)">changed</tspan>?</text></g>
<g id="ch8"><text class="m" x="143" y="690" font-size="26">THIS WEEK: ADMIT ONE THING YOU WERE WRONG ABOUT</text><text class="m" x="143" y="736" font-size="26">OUT LOUD, AND NOTICE HOW FREEING IT FEELS</text></g>
<g id="mr"><ellipse cx="1320" cy="600" rx="70" ry="95" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><path class="s-ink" d="M1320 695v45M1280 745h80" stroke-width="8" stroke-linecap="round"/></g>
<path id="mck" d="M1290 600l22 22 40-44" fill="none" stroke="var(--gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>