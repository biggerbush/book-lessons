<g id="lL"><text class="m" x="380" y="650" font-size="22" text-anchor="middle" style="fill:var(--loss)">ACCEPT THE BRUTAL FACTS</text><text class="m" x="380" y="690" font-size="20" text-anchor="middle">IT COULD TAKE A VERY LONG TIME</text></g>
<g id="lR"><text class="m" x="1220" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">NEVER LOSE FAITH</text><text class="m" x="1220" y="690" font-size="20" text-anchor="middle">YOU WILL PREVAIL IN THE END</text></g>
<g id="parad"><text class="d" x="120" y="800" font-size="56">This is the <tspan style="fill:var(--gain)">Stockdale Paradox.</tspan></text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let the truth be heard.</text>
<text class="b" x="120" y="176" font-size="32">Great leaders made it easy for anyone to bring bad news.</text>
