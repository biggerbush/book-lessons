<rect x="1245" y="440" width="34" height="56" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<rect id="tog" class="ink" x="1254" y="472" width="16" height="18" rx="3"/>
<text class="m" x="1065" y="670" font-size="18" text-anchor="middle">UNLOCKING THE DOOR</text>
<text class="m" x="1340" y="670" font-size="18" text-anchor="middle">SWITCHING ON THE LIGHTS</text>
<g id="key"><circle class="gain" cx="-34" cy="0" r="16"/><rect class="gain" x="-20" y="-5" width="36" height="10"/><rect class="gain" x="6" y="5" width="7" height="12"/></g>
</g>
<g id="kw"><text class="d5" x="900" y="800" font-size="38">Small memories kept him warm.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Come and see the sunset.</text>
<text class="b" x="120" y="176" font-size="32">Even in the camp, the world could still be beautiful.</text>
<g id="hut"><path class="s-ink" d="M130 300L380 210L630 300" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-ink" x="140" y="300" width="480" height="340" fill="var(--stage)" stroke-width="7"/><rect id="door6" x="540" y="460" width="70" height="180" fill="var(--line)" stroke="var(--ink)" stroke-width="5"/><g id="sit"></g><g id="msg"></g></g>
<g id="sky"><g id="sung"><g id="srays"></g><circle class="gain" cx="0" cy="0" r="80"/></g><rect x="700" y="643" width="780" height="120" fill="var(--stage)"/><path class="s-ink" d="M700 640H1480" stroke-width="5" stroke-linecap="round"/><g id="cl"></g></g>
<g id="arw"><path class="s-gain" d="M620 520C680 500 700 470 756 446m-26-4 26 4-10 24" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/></g>
<g id="wat"></g>
<g id="quo"><text class="d5" x="720" y="820" font-size="40">“How beautiful the world could be.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">What you have lived is yours.</text>
<text class="b" x="120" y="176" font-size="32">Some delicate prisoners endured better than sturdier ones.</text>
<g id="inner"><circle class="s-gain" cx="520" cy="440" r="90" fill="var(--gain)" fill-opacity=".15" stroke-width="5"/><circle id="ring2" class="s-gain" cx="520" cy="440" r="120" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="520" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">A RICH INNER WORLD</text></g>
<g id="fg7"><text class="m" x="260" y="600" font-size="20" text-anchor="middle">STURDY</text><text class="m" x="520" y="600" font-size="20" text-anchor="middle">DELICATE</text></g>
<g id="chest">
<polygon points="900,440 950,330 1310,330 1360,440" fill="var(--line)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<g id="mom"></g>
<rect class="s-ink" x="900" y="440" width="460" height="260" rx="10" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M900 520H1360" stroke-width="5"/>
<rect class="gain" x="1110" y="500" width="40" height="50" rx="6"/>
<text class="m" x="1130" y="630" font-size="24" text-anchor="middle">LIVED · LOVED · THOUGHT</text>
<text class="m" x="1130" y="740" font-size="22" text-anchor="middle" style="fill:var(--gain)">INNER TREASURE</text>
</g>
<g id="own"><text class="d" x="120" y="810" font-size="46">What you have truly lived belongs to you.</text></g>
<g id="sav"><text class="m" x="120" y="852" font-size="22" style="fill:var(--gain)">THE MOMENTS YOU SAVOR TODAY BECOME A LASTING INNER TREASURE</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What lives in your</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">inner room that no one</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">could ever <tspan style="fill:var(--gain)">take?</tspan></text></g>
<g id="nb"><rect class="s-ink" x="1200" y="480" width="130" height="170" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="1330" y="480" width="130" height="170" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1222 520h86M1222 550h86M1222 580h86M1222 610h50" stroke-width="5" stroke-linecap="round"/><circle id="drop" class="gain" cx="1395" cy="380" r="18"/></g>
<g id="tip"><text class="m" x="143" y="720" font-size="26">TAKE FIVE MINUTES TO STORE ONE MOMENT WORTH KEEPING</text></g>
</g>