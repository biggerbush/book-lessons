<g id="s0">
<text class="m" x="120" y="150" font-size="28">INFLUENCE: THE PSYCHOLOGY OF PERSUASION · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">We say yes to</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">people we like.</text>
<text class="b" x="120" y="600" font-size="32">Why we say yes to friends, and how persuaders use that.</text>
<g id="ppl0"></g>
<path id="heart0" class="gain" d="M0 14C-22 0-22-16-11-18C-5-19-1-15 0-11C1-15 5-19 11-18C22-16 22 0 0 14Z"/>
