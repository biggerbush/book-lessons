</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Closed mind vs open mind.</text>
<g id="cl"><rect class="s-line" x="120" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22" style="fill:var(--loss)">CLOSED</text>
<path class="s-loss" d="M270 300l15-20 15 20 15-20 15 20 15-20 15 20" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="loss" x="260" y="320" width="100" height="100" rx="8"/><path class="loss" d="M230 560v-40a80 80 0 0 1 160 0v40z"/>
<rect class="s-loss" x="430" y="330" width="280" height="70" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="570" y="374" font-size="24" text-anchor="middle">I’M RIGHT.</text>
<rect class="s-loss" x="430" y="430" width="280" height="70" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="570" y="474" font-size="24" text-anchor="middle">THAT’S WRONG.</text>
<text class="d5" x="150" y="650" font-size="30">Makes statements. Gets angry.</text></g>
<g id="op"><rect class="s-line" x="840" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22" style="fill:var(--gain)">OPEN</text>
