<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Balancing stocks</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and bonds.</text>
<text class="b" x="120" y="600" font-size="32">A simple split between stocks and bonds keeps you steady.</text>
<g id="tsc"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two buckets.</text>
<text class="b" x="120" y="176" font-size="32">Stocks are pieces of companies. Bonds are loans.</text>
<path class="s-line" d="M160 640H1440" stroke-width="6" stroke-linecap="round"/>
<g id="bk0">
<path class="s-ink" d="M330 400L630 400L590 640L370 640Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<text class="d" x="480" y="700" font-size="44" text-anchor="middle">Stocks</text>
<text class="m" x="480" y="736" font-size="20" text-anchor="middle">PIECES OF COMPANIES</text>
</g>
<g id="stk"></g>
<g id="bk1">
<path class="s-ink" d="M970 400L1270 400L1230 640L1010 640Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<text class="d" x="1120" y="700" font-size="44" text-anchor="middle">Bonds</text>
<text class="m" x="1120" y="736" font-size="20" text-anchor="middle">LOANS THAT PAY STEADY INTEREST</text>
</g>
<g id="bnd"></g>
<g id="sw0">
<polyline class="s-gain" points="330,320 360,263 390,306 420,249 450,292 480,235 510,278 540,221 570,264 600,207 630,250" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="480" y="365" font-size="20" text-anchor="middle" style="fill:var(--gain)">GROWS MORE, BUT SWINGS</text>
</g>
<g id="sw1">
<path class="s-ink" d="M970 320L1270 270" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1120" y="365" font-size="20" text-anchor="middle">GROWS SLOWLY, HOLDS STEADY</text>
</g>
</g>

<g id="s2" opacity="0">
<defs><clipPath id="barClip"><rect x="160" y="400" width="1280" height="120" rx="14"/></clipPath></defs>
<text class="d" x="120" y="124" font-size="68">Keep 25% to 75% in stocks.</text>
<g id="rbb"><text class="b" x="120" y="176" font-size="32">Whatever is left goes into bonds.</text>
<text class="m" x="1440" y="382" font-size="24" text-anchor="end" style="fill:var(--loss)">BONDS</text></g>
<g id="rb">
<rect x="160" y="400" width="1280" height="120" rx="14" fill="var(--stage)"/>
<g clip-path="url(#barClip)">
<rect id="bR" x="800" y="400" width="640" height="120" class="loss"/>
<rect id="sR" x="160" y="400" width="640" height="120" class="gain"/>
</g>
<rect x="160" y="400" width="1280" height="120" rx="14" fill="none" class="s-ink" stroke-width="6"/>
<g id="tk"></g>
</g>
<g id="brk"><path class="s-gain" d="M480 382V360H1120V382" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="800" y="340" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE SAFE RANGE</text></g>
<g id="nz">
<path class="s-loss" d="M166 616H474M1126 616H1434" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
<text class="m" x="320" y="656" font-size="22" text-anchor="middle" style="fill:var(--loss)">NEVER 0% STOCKS</text>
<text class="m" x="1280" y="656" font-size="22" text-anchor="middle" style="fill:var(--loss)">NEVER 100% STOCKS</text></g>
<g id="rbs"><text class="m" x="190" y="470" font-size="24" style="fill:var(--on-gain)">STOCKS</text></g>
<g id="nall"><text class="d" x="120" y="790" font-size="52">Never all in. Never all out.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start at fifty-fifty.</text>
<text class="b" x="120" y="176" font-size="32">Half in stocks, half in bonds.</text>
<g id="sc3"></g>
<g id="cb"><circle class="s-ink" cx="1160" cy="420" r="110" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M1090 560L1110 528H1210L1230 560Z"/>
<text class="d" x="1160" y="465" font-size="130" text-anchor="middle" style="fill:var(--muted)">?</text></g>
<g id="nocb"><circle class="s-loss" cx="1160" cy="420" r="150" fill="none" stroke-width="10"/>
<path class="s-loss" d="M1054 314L1266 526" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="1160" y="650" font-size="24" text-anchor="middle">NO GUESSING THE MARKET</text></g>
<g id="dflt"><text class="d" x="120" y="800" font-size="48">A sensible default for most people.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">When stocks run up, trim.</text>
<text id="pS" class="d" x="400" y="250" font-size="56" text-anchor="middle" style="fill:var(--gain)">50%</text>
<text id="pB" class="d" x="720" y="250" font-size="56" text-anchor="middle">50%</text>
<rect class="gain" x="300" y="320" width="200" height="400"/>
<rect id="bM" class="ink" x="620" y="320" width="200" height="400"/>
<rect id="sl" class="gain" x="300" y="320" width="200" height="0" stroke-width="5" stroke-dasharray="10 8"/>
<path class="s-ink" d="M260 720H860" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="400" y="770" font-size="24" text-anchor="middle">STOCKS</text>
<text class="m" x="720" y="770" font-size="24" text-anchor="middle">BONDS</text>
<g id="ra"><path class="s-gain" d="M220 620V330M198 352L220 330L242 352" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="r1"><text class="m" x="980" y="310" font-size="24">SELL ABOUT</text>
<text class="d" x="972" y="440" font-size="130" style="fill:var(--gain)">1/11</text>
<text class="m" x="980" y="530" font-size="24">OF YOUR STOCKS</text></g>
<g id="r2"><text class="d" x="980" y="640" font-size="64">55% → 50%</text></g>
<g id="r3"><text class="d5" x="980" y="720" font-size="40">Back to fifty-fifty.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">When stocks fall, buy more.</text>
<path class="s-line" d="M160 260V680H900" fill="none" stroke-width="5" stroke-linecap="round"/>
<path id="pl" class="s-loss" d="M180 300L260 340L320 310L400 400L470 370L560 470L630 440L720 540L780 520L860 610" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="tg"><path class="s-ink" d="M860 600V440" stroke-width="3"/>
<polygon class="gain" points="660,380 860,380 885,410 860,440 660,440"/>
<text class="m" x="760" y="418" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">LOWER PRICES</text></g>
<rect id="bnd5" class="ink" x="1060" y="300" width="200" height="200"/>
<rect id="stk5" class="gain" x="1060" y="500" width="200" height="200"/>
<path class="s-muted" d="M1030 500H1290" stroke-width="3" stroke-dasharray="8 8"/>
<text class="m" x="1300" y="340" font-size="22">BONDS</text>
<text class="m" x="1300" y="507" font-size="20">HALF</text>
<text class="m" x="1300" y="690" font-size="22">STOCKS</text>
<g id="sh5"><path class="s-gain" d="M1040 360C980 420 980 560 1040 620M1014 614L1040 620L1036 594" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="auto5"><text class="d" x="120" y="800" font-size="46">Buying low, almost automatically.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">Lean a little, inside the limits.</text>
<g id="dial">
<path class="s-line" d="M460 640A340 340 0 0 1 1140 640" fill="none" stroke-width="30"/>
<text class="m" x="460" y="700" font-size="22" text-anchor="middle">25%</text>
<text class="m" x="800" y="262" font-size="22" text-anchor="middle">50%</text>
<text class="m" x="1140" y="700" font-size="22" text-anchor="middle">75%</text>
<g id="nd"><path class="s-ink" d="M800 640V380" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="800" cy="640" r="26"/></g>
</g>
<g id="lh"><text class="m" x="120" y="420" font-size="22" style="fill:var(--loss)">PRICES LOOK</text>
<text class="m" x="120" y="452" font-size="22" style="fill:var(--loss)">DANGEROUSLY HIGH</text>
<text class="m" x="120" y="494" font-size="22">LEAN TOWARD 25%</text></g>
<g id="rb6"><text class="m" x="1480" y="420" font-size="22" text-anchor="end" style="fill:var(--gain)">GENUINE</text>
<text class="m" x="1480" y="452" font-size="22" text-anchor="end" style="fill:var(--gain)">BARGAINS</text>
<text class="m" x="1480" y="494" font-size="22" text-anchor="end">LEAN TOWARD 75%</text></g>
<g id="stp"><path class="s-loss" d="M420 652H500M1100 652H1180" stroke-width="14" stroke-linecap="round"/></g>
<g id="nob"><text class="d" x="120" y="800" font-size="44">Nobody predicts the market reliably.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Peace of mind, either way.</text>
<g id="fc"><circle class="s-ink" cx="800" cy="400" r="80" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M760 392q12 10 24 0M816 392q12 10 24 0M768 428q32 26 64 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M680 660v-40a120 120 0 0 1 240 0v40z"/></g>
<g id="c7a"><rect class="s-line" x="120" y="240" width="500" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="22">STOCKS SOAR</text>
<polyline class="s-gain" points="160,560 230,510 290,530 360,450 420,470 490,380 580,330" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="d5" x="150" y="630" font-size="34">Glad you own some.</text></g>
<g id="c7b"><rect class="s-line" x="980" y="240" width="500" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1010" y="290" font-size="22">STOCKS CRASH</text>
<g id="rain"></g>
<path class="gain" d="M1110 450a120 110 0 0 1 240 0z"/>
<path class="s-ink" d="M1230 450V566a14 14 0 0 1-28 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="1130" y="520" width="60" height="60" rx="6"/><rect class="ink" x="1260" y="520" width="60" height="60" rx="6"/>
<text class="d5" x="1010" y="630" font-size="34">Bonds still standing.</text></g>
<g id="job"><text class="d" x="120" y="800" font-size="46">A clear job to do, instead of panic.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What share of your</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">savings is in stocks?</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="80" letter-spacing="-2">What one move</text></g>
<g id="qd"><text class="d" x="136" y="640" font-size="80" letter-spacing="-2">would bring it <tspan style="fill:var(--gain)">back?</tspan></text></g>
<g id="pie"><circle class="ink" cx="1300" cy="460" r="140" fill-opacity=".2"/>
<path id="wd" class="gain"/>
<circle class="s-ink" cx="1300" cy="460" r="140" fill="none" stroke-width="5"/>
<path class="s-ink" d="M1300 320V600" stroke-width="4" stroke-dasharray="10 8"/>
<text class="m" x="1300" y="650" font-size="20" text-anchor="middle">YOUR TARGET</text></g>
<text class="m" x="143" y="760" font-size="26">REBALANCE TOWARD YOUR TARGET</text>
</g>