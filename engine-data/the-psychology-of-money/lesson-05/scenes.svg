<text class="m" x="720" y="800" font-size="20" text-anchor="middle">VALET</text>
</g>
<g id="keys"></g>
<g id="vcars"></g>
<g id="clab"><text class="m" x="820" y="800" font-size="20">FERRARIS · LAMBORGHINIS</text></g>
