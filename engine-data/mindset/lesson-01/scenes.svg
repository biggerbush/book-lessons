<g id="refl"></g>
<path class="s-ink" d="M1360 410v30M1320 440h80" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="qa"><text class="d" x="136" y="520" font-size="76" letter-spacing="-2">Is it a <tspan style="fill:var(--loss)">verdict</tspan> on you,</text></g>
<g id="qb"><text class="d" x="136" y="625" font-size="76" letter-spacing="-2">or a <tspan style="fill:var(--gain)">problem you can work on</tspan>?</text></g>
<g id="ctag"><text class="m" x="143" y="740" font-size="26">SAME EVENTS. YOUR STORY CHOOSES THE WORLD.</text></g>
</g>