<text class="d" x="420" y="788" font-size="40">It follows her home, every hour.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feelings spread.</text>
<text class="b" x="120" y="176" font-size="32">Shared openly between friends, then amplified across huge networks.</text>
<g id="rip"><g id="rf"></g><g id="rings"></g><text class="m" x="310" y="600" font-size="20" text-anchor="middle">SHARED OPENLY</text></g>
<g id="net"></g>
<g id="netl"><text class="m" x="840" y="790" font-size="20" text-anchor="middle" style="fill:var(--loss)">ANXIETY SPREADS ACROSS THE NETWORK</text></g>
<g id="str"><g id="sf"></g><text class="m" x="1320" y="680" font-size="20" text-anchor="middle">UNWANTED MESSAGES</text>
<text class="m" x="1320" y="712" font-size="20" text-anchor="middle">FROM STRANGERS</text></g>
<g id="env"></g>
</g>

