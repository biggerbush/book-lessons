<g id="s0">
<text class="m" x="120" y="150" font-size="28">GRIT · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Growing grit from</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the outside in.</text>
<text class="b" x="120" y="600" font-size="32">How families, coaches and teams help grit take root</text>
<path class="s-line" d="M1120 710h360" stroke-width="5" stroke-linecap="round"/>
<line id="stem" class="s-gain" x1="1300" y1="620" x2="1300" y2="620" stroke-width="10" stroke-linecap="round"/>
<g id="leaves"><path class="gain" d="M1300 540q-60-10-70-60q60 0 70 60z"/><path class="gain" d="M1300 500q60-10 70-60q-60 0-70 60z"/></g>
<circle id="bud" class="gain" cx="1300" cy="600" r="0"/>
<path class="ink" d="M1220 620h160l-20 90h-120z"/>
<g id="helpers"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Warm and firm, at the same time.</text>
<text class="b" x="120" y="176" font-size="32">The parents who build the most grit do two things at once.</text>
<g id="hrt"><g id="hrtb" transform="translate(400 440)"><path class="gain" d="M0 100C-130 10-130-90-60-100C-30-104-8-84 0-60C8-84 30-104 60-100C130-90 130 10 0 100Z"/></g>
<text class="m" x="400" y="600" font-size="20" text-anchor="middle">WARM · SUPPORTIVE</text></g>
<g id="par"></g>
<g id="barg"><path class="s-ink" d="M1120 600V280M1380 600V280" stroke-width="8" stroke-linecap="round"/>
<line id="bar" class="s-gain" x1="1100" y1="560" x2="1400" y2="560" stroke-width="12" stroke-linecap="round"/>
<text class="m" x="1250" y="650" font-size="20" text-anchor="middle">HIGH EXPECTATIONS · CLEAR LIMITS</text></g>
<g id="wise"><text class="d" x="120" y="780" font-size="52">Duckworth calls it wise parenting.</text>
<text class="m" x="120" y="830" font-size="22">PSYCHOLOGISTS CALL IT AUTHORITATIVE PARENTING</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four kinds of parents.</text>
<text class="b" x="120" y="176" font-size="32">Support on one side, demands on the other.</text>
<g id="cw"><rect class="gain" x="764" y="234" width="292" height="252"/>
<text class="d" x="910" y="372" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">Wise</text>
<text class="m" x="910" y="412" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">WARM AND DEMANDING</text></g>
<g id="grd"><rect class="s-ink" x="460" y="230" width="600" height="520" fill="none" stroke-width="5"/>
<path class="s-ink" d="M760 230V750M460 490H1060" stroke-width="4"/>
<path class="s-muted" d="M420 740V250m-14 20 14-20 14 20M470 790H1050m-20-14 20 14-20 14" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="390" y="490" font-size="22" text-anchor="middle" transform="rotate(-90 390 490)">MORE DEMANDS</text>
<text class="m" x="760" y="836" font-size="22" text-anchor="middle">MORE SUPPORT</text></g>
<g id="cn"><text class="d5" x="610" y="632" font-size="36" text-anchor="middle">Neglectful</text><text class="m" x="610" y="672" font-size="18" text-anchor="middle">LOW ON BOTH</text></g>
<g id="ca"><text class="d5" x="610" y="372" font-size="36" text-anchor="middle" style="fill:var(--loss)">Authoritarian</text><text class="m" x="610" y="412" font-size="18" text-anchor="middle">DEMANDING, NOT WARM</text></g>
<g id="cp"><text class="d5" x="910" y="632" font-size="36" text-anchor="middle" style="fill:var(--loss)">Permissive</text><text class="m" x="910" y="672" font-size="18" text-anchor="middle">WARM, NOT DEMANDING</text></g>
<g id="kid2"><path class="s-gain" d="M1070 360H1220m-18-16 18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1300" y="510" font-size="22" text-anchor="middle">GROWS</text><text class="m" x="1300" y="542" font-size="22" text-anchor="middle" style="fill:var(--gain)">PERSISTENT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Activities are training grounds.</text>
<text class="b" x="120" y="176" font-size="32">A demanding coach, a clear goal, and plenty of encouragement.</text>
<g id="fld"><rect class="s-line" x="200" y="240" width="960" height="420" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M680 240V660" stroke-width="4"/><circle class="s-line" cx="680" cy="450" r="70" fill="none" stroke-width="4"/>
<path class="s-ink" d="M1160 370h70v160h-70" fill="none" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="1300" y="460" font-size="20">CLEAR GOAL</text></g>
<g id="coachg"><path class="s-ink" d="M420 330l40-20M420 352h46" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="360" y="520" font-size="20" text-anchor="middle">DEMANDING COACH</text></g>
<circle id="ball" class="gain" cx="560" cy="560" r="22"/>
<g id="teamg"></g>
<g id="teamt"><text class="m" x="120" y="830" font-size="20">ENCOURAGEMENT FROM TEAMMATES AND ADULTS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">Stick with it, and keep advancing.</text>
<text class="b" x="120" y="176" font-size="32">A study tracked what students did outside class.</text>
<g id="clip"><rect class="s-ink" x="140" y="250" width="260" height="360" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="220" y="232" width="100" height="40" rx="10"/><g id="clipr"></g>
<text class="m" x="270" y="650" font-size="20" text-anchor="middle">OUTSIDE CLASS</text></g>
<g id="cal"><text class="m" x="520" y="330" font-size="20">TRIES, MOVES ON</text>
<rect class="loss" x="520" y="350" width="140" height="26" rx="8"/><rect class="loss" x="840" y="350" width="90" height="26" rx="8"/><rect class="loss" x="1160" y="350" width="110" height="26" rx="8"/>
<text class="m" x="520" y="440" font-size="20" style="fill:var(--gain)">STICKS WITH IT</text>
<text class="m" x="520" y="470" font-size="20" style="fill:var(--gain)">KEEPS ADVANCING</text>
<path id="stair" class="s-gain" d="M520 600H820V560H1140V520H1440V480" fill="none" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="endl"><text class="m" x="1440" y="418" font-size="18" text-anchor="end">DID ESPECIALLY</text><text class="m" x="1440" y="446" font-size="18" text-anchor="end">WELL LATER</text></g>
<g id="ft"><rect class="gain" x="500" y="680" width="520" height="110" rx="55"/>
<text class="d" x="760" y="753" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">Follow-through</text>
<text class="m" x="1060" y="745" font-size="20">WHAT RESEARCHERS CALLED IT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Hard Thing Rule.</text>
<text class="b" x="120" y="176" font-size="32">A family rule in Duckworth’s own home.</text>
<g id="house"><path class="s-ink" d="M150 420L410 250L670 420" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="190" y="420" width="440" height="320" fill="var(--stage)" stroke-width="7"/><g id="fam"></g></g>
<g id="r1"><rect class="s-line" x="760" y="230" width="720" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="790" y="340" font-size="80" style="fill:var(--gain)">1</text>
<text class="m" x="870" y="310" font-size="22">EVERYONE, PARENTS INCLUDED,</text><text class="m" x="870" y="344" font-size="22">DOES SOMETHING HARD WITH</text><text class="m" x="870" y="378" font-size="22">DAILY DELIBERATE PRACTICE</text>
<rect class="s-ink" x="1320" y="276" width="130" height="164" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="1320" y="276" width="130" height="34" rx="8"/>
<path class="s-ink" d="M1350 262v26M1420 262v26" stroke-width="8" stroke-linecap="round"/>
<g id="calck"></g></g>
<g id="r2"><rect class="s-line" x="760" y="520" width="720" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="790" y="630" font-size="80" style="fill:var(--gain)">2</text>
<text class="m" x="870" y="600" font-size="22">YOU CAN QUIT, BUT ONLY AT</text><text class="m" x="870" y="634" font-size="22">A NATURAL STOPPING POINT,</text><text class="m" x="870" y="668" font-size="22">LIKE THE END OF A SEASON</text>
<g id="stopo"></g><text class="d" x="1380" y="656" font-size="30" text-anchor="middle" style="fill:var(--stage)">STOP</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">You choose. Then you commit.</text>
<text class="b" x="120" y="176" font-size="32">Rule three: nobody picks your hard thing for you.</text>
<g id="menu"></g>
<path id="mchk" d="M530 415l16 18 30-38" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
<g id="hg"><polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/>
<path class="s-ink" d="M800 250H1000M800 650H1000" stroke-width="10" stroke-linecap="round"/>
<path class="s-ink" d="M820 260L900 450L820 640M980 260L900 450L980 640" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="r4"><text class="m" x="1060" y="300" font-size="22">RULE 4 · HIGH SCHOOL</text></g>
<g id="two"><text class="m" x="1060" y="360" font-size="22">AT LEAST</text>
<text id="yrs2" class="d" x="1060" y="460" font-size="96" style="fill:var(--gain)">2 years</text>
<rect class="s-ink" x="1060" y="500" width="190" height="60" rx="10" fill="var(--stage)" stroke-width="4"/><rect class="s-ink" x="1270" y="500" width="190" height="60" rx="10" fill="var(--stage)" stroke-width="4"/>
<rect id="yf0" class="gain" x="1060" y="500" width="0" height="60" rx="10"/><rect id="yf1" class="gain" x="1270" y="500" width="0" height="60" rx="10"/>
<text class="m" x="1060" y="610" font-size="20">ONE ACTIVITY, COMMITTED</text></g>
<g id="ck1"><text class="d" x="120" y="740" font-size="40">Choice keeps interest alive.</text></g>
<g id="ck2"><text class="d" x="120" y="800" font-size="40">Commitment builds the habit of <tspan style="fill:var(--gain)">finishing</tspan>.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Join a gritty group.</text>
<text class="b" x="120" y="176" font-size="32">Culture works the same way on adults.</text>
<g id="flg"><path class="s-ink" d="M180 640V240" stroke-width="8" stroke-linecap="round"/><path id="flagP" class="gain"/>
<text class="m" x="300" y="400" font-size="20">EVERYONE WORKS HARD AND KEEPS GOING</text></g>
<g id="grp"></g>
<g id="youw"><g id="youm"><text class="m" x="1100" y="610" font-size="20" text-anchor="middle">YOU</text></g></g>
<g id="mir"><ellipse class="s-ink" cx="1350" cy="440" rx="100" ry="160" fill="var(--stage)" stroke-width="7"/><g id="refl"></g>
<text class="m" x="1350" y="650" font-size="20" text-anchor="middle">THE GROUP’S GRIT</text><text class="m" x="1350" y="680" font-size="20" text-anchor="middle" style="fill:var(--gain)">BECOMES YOUR OWN</text></g>
<g id="quo"><text class="d" x="120" y="790" font-size="52">“Persisting is what people like us do.”</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What’s your hard thing</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">this week, and where’s</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">your natural <tspan style="fill:var(--gain)">stopping point</tspan>?</text></g>
<text class="m" x="143" y="620" font-size="26">PICK ONE HARD THING FOR YOURSELF</text>
<g id="inv"><text class="m" x="143" y="680" font-size="26" style="fill:var(--gain)">THEN INVITE SOMEONE YOU LOVE TO CHOOSE ONE TOO</text></g>
<line id="ul" class="s-gain" x1="860" y1="790" x2="860" y2="790" stroke-width="8" stroke-linecap="round"/>
<g id="penw"><g id="pen"><path class="ink" d="M0 0L8-26L118-136L136-118L26-8Z"/><path class="gain" d="M0 0L8-26L26-8Z"/></g></g>
</g>