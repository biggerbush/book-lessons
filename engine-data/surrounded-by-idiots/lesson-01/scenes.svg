<g id="s0">
<text class="m" x="120" y="150" font-size="28">SURROUNDED BY IDIOTS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Maybe they’re not</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">actually idiots.</text>
<text class="b" x="120" y="600" font-size="32">Why difficult people may simply speak a different language.</text>
<g id="tcrowd"></g>
<g id="tbub"><g id="tbubi"><rect x="1360" y="196" width="110" height="76" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M1376 272l-18 24 36-24" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/><path d="M1380 272h12" stroke="var(--stage)" stroke-width="7"/><text class="d" x="1415" y="250" font-size="44" text-anchor="middle" style="fill:var(--loss)">?!</text></g></g>
<g id="tlens"><g id="tlensi"><circle cx="1300" cy="431" r="112" fill="none" stroke="var(--gain)" stroke-width="10"/><path d="M1300 549V648" stroke="var(--gain)" stroke-width="18" stroke-linecap="round"/></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">He was surrounded by idiots.</text>
<text class="b" x="120" y="176" font-size="32">Erikson meets a deeply frustrated business owner.</text>
<g id="boss1w"><g id="boss1"></g><path class="gain" d="M300 512l-14 22 14 70 14-70z"/><text class="m" x="300" y="700" font-size="22" text-anchor="middle">THE BUSINESS OWNER</text></g>
<g id="bub1"><path d="M520 368L380 420L600 368" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><rect x="460" y="240" width="680" height="130" rx="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M524 368h70" stroke="var(--stage)" stroke-width="8"/><text class="d5" x="500" y="322" font-size="38">“I’m surrounded by idiots!”</text></g>
<g id="desk1"><text class="m" x="1040" y="690" font-size="22" text-anchor="middle">EVERYONE ELSE</text></g>
<g id="blame1"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Maybe the common factor is him.</text>
<text class="b" x="120" y="176" font-size="32">Erikson saw it differently.</text>
<g id="q2"><text class="d" x="160" y="620" font-size="260" style="fill:var(--gain)">?</text></g>
<g id="arr2"></g>
<g id="ring2"></g>
<g id="man2"></g>
<g id="nst2"><text class="d" x="1110" y="440" font-size="44">Not stupid.</text></g>
<g id="dif2"><text class="d" x="1110" y="540" font-size="36" style="fill:var(--gain)">Just different</text><text class="d" x="1110" y="588" font-size="36" style="fill:var(--gain)">ways of thinking.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">One email. Two reactions.</text>
<text class="b" x="120" y="176" font-size="32">Picture two colleagues reading the same short email.</text>
<g id="mail3"><rect x="700" y="230" width="200" height="130" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path d="M704 238L800 300L896 238" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="800" y="394" font-size="20" text-anchor="middle">SAME EMAIL</text><g id="mail3a"></g></g>
<g id="p3"></g>
<g id="b3a"><circle class="gain" cx="300" cy="646" r="8"/><circle class="gain" cx="312" cy="666" r="5"/><rect x="120" y="680" width="560" height="140" rx="24" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text class="d5" x="150" y="738" font-size="34">“Finally, someone who</text><text class="d5" x="150" y="790" font-size="34">gets to the point.”</text></g>
<g id="b3b"><circle class="loss" cx="1300" cy="646" r="8"/><circle class="loss" cx="1288" cy="666" r="5"/><rect x="920" y="680" width="560" height="140" rx="24" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="950" y="738" font-size="34">“Why is this person</text><text class="d5" x="950" y="790" font-size="34">so cold and rude?”</text></g>
<g id="nw3a"><text class="d" x="800" y="560" font-size="46" text-anchor="middle">Neither is wrong.</text></g>
<g id="nw3b"><text class="m" x="800" y="610" font-size="20" text-anchor="middle">THEY WANT DIFFERENT THINGS FROM A MESSAGE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">What they heard is what counts.</text>
<text class="b" x="120" y="176" font-size="32">The listener decides what your message means.</text>
<g id="mega4"><polygon class="ink" points="220,400 290,400 410,330 410,550 290,480 220,480"/><rect class="ink" x="270" y="480" width="24" height="60" rx="6"/><text class="m" x="315" y="640" font-size="22" text-anchor="middle">WHAT YOU MEANT</text></g>
<g id="wav4"></g>
<g id="ear4"><path d="M1250 520c-20-70 0-170 70-170 60 0 90 50 80 100-10 40-50 50-50 90 0 40-50 60-80 30" fill="none" stroke="var(--gain)" stroke-width="12" stroke-linecap="round"/><path d="M1290 470c0-40 50-50 60-20" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/><text class="m" x="1310" y="640" font-size="22" text-anchor="middle" style="fill:var(--gain)">WHAT THEY HEARD</text></g>
<g id="tgt4"><circle cx="420" cy="760" r="80" fill="none" stroke="var(--ink)" stroke-width="6"/><circle cx="420" cy="760" r="52" fill="none" stroke="var(--ink)" stroke-width="6"/><circle class="ink" cx="420" cy="760" r="22"/><g id="tgt4a"></g></g>
<g id="txt4"><text class="d" x="640" y="750" font-size="44">If it never lands,</text><text class="d" x="640" y="806" font-size="44">clever doesn’t matter.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">People are not random.</text>
<text class="b" x="120" y="176" font-size="32">Behaviour falls into a few recognisable patterns.</text>
<g id="disc5"><text class="m" x="120" y="240" font-size="20">DISC MODEL · FOUR STYLES</text></g>
<g id="dots5"></g>
<g id="lab5"></g>
<g id="note5"><text class="m" x="120" y="800" font-size="20">COLOUR NAMES ARE THE BOOK’S · SHADES HERE ARE ONLY TOKENS</text></g>
<g id="blend5"><g id="blend5i" transform="translate(1200 500)"></g></g>
<g id="bl5t"><text class="m" x="1200" y="730" font-size="22" text-anchor="middle">MOST OF US ARE A MIX</text><text class="m" x="1200" y="764" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE OR TWO STAND OUT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A lens, not a label.</text>
<g id="sub6"><text class="b" x="120" y="176" font-size="32">A simplified model, not a scientific diagnosis.</text></g>
<g id="box6"><rect x="220" y="300" width="380" height="320" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="box6p"></g><rect class="ink" x="340" y="530" width="140" height="56" rx="10"/><text class="m" x="410" y="566" font-size="24" text-anchor="middle" style="fill:var(--stage)">RED</text><text class="m" x="410" y="680" font-size="22" text-anchor="middle">NOT A BOX</text></g>
<g id="x6"><path d="M240 320L580 600M580 320L240 600" stroke="var(--loss)" stroke-width="12" stroke-linecap="round"/></g>
<g id="mag6"><g id="mag6i"><circle cx="1100" cy="450" r="140" fill="var(--stage)" stroke="var(--ink)" stroke-width="14"/><g id="in6"></g><path d="M1200 550L1290 640" stroke="var(--ink)" stroke-width="26" stroke-linecap="round"/></g></g>
<g id="cap6b"><text class="m" x="1100" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">A LENS</text></g>
<g id="lens6"><text class="d5" x="120" y="800" font-size="36">It helps you see why someone reacts the way they do.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">From blame to curiosity.</text>
<text class="b" x="120" y="176" font-size="32">Calling someone an idiot ends the conversation.</text>
<g id="l7"><rect x="120" y="220" width="640" height="310" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><g id="l7p"></g><rect class="loss" x="430" y="290" width="20" height="150" rx="4"/><text class="m" x="640" y="290" font-size="20" text-anchor="middle" style="fill:var(--loss)">“IDIOT”</text><text class="m" x="150" y="500" font-size="20">THE CONVERSATION STOPS</text></g>
<g id="r7"><rect x="840" y="220" width="640" height="310" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><g id="r7p"></g><text class="d5" x="1160" y="300" font-size="26" text-anchor="middle">How do you see it?</text><text class="m" x="870" y="500" font-size="20" style="fill:var(--gain)">WE CAN START ADJUSTING</text></g>
<g id="br7"><path d="M160 790V660h320v130z" fill="var(--line)"/><path d="M1120 790V660h320v130z" fill="var(--line)"/><g id="br7p"></g><path id="brp" d="M480 660Q800 580 1120 660" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-dasharray="700"/><text class="m" x="800" y="750" font-size="22" text-anchor="middle">CLASH → CONVERSATION</text></g>
</g>

<g id="s8" opacity="0">
<g id="one8"><text class="m" x="143" y="240" font-size="26">THINK OF ONE PERSON YOU FIND IMPOSSIBLE</text></g>
<g id="g8"><text class="d" x="1360" y="200" font-size="40" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="qa"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">Don’t ask what’s wrong</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">with them. Ask how they</text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2">might see it <tspan style="fill:var(--gain)">differently.</tspan></text></g>
<g id="m8"><text class="m" x="143" y="720" font-size="26">THIS WEEK: SWAP BLAME FOR CURIOSITY</text></g>
</g>