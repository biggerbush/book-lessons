<g id="s0">
<text class="m" x="120" y="150" font-size="28">CRUSH IT! · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your passion can</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">pay the bills.</text>
<text class="b" x="120" y="600" font-size="32">How the internet turned one man’s love of wine into a career.</text>
