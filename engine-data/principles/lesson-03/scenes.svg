</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t run from it.</text>
<g id="sub3"><text class="b" x="120" y="176" font-size="32">Turn toward the pain instead. That’s where the lesson hides.</text></g>
<g id="l0"><text class="d5" x="120" y="290" font-size="34" style="fill:var(--loss)">Hurry away</text></g>
<g id="l1"><text class="d5" x="120" y="350" font-size="34" style="fill:var(--loss)">Blame someone else</text></g>
<g id="l2"><text class="d5" x="120" y="410" font-size="34" style="fill:var(--loss)">Try to forget</text></g>
<g id="painc"><circle class="loss" cx="1300" cy="520" r="90" fill-opacity=".2"/><circle class="s-loss" cx="1300" cy="520" r="90" fill="none" stroke-width="6"/><text class="m" x="1300" y="410" font-size="22" text-anchor="middle">PAIN</text></g>
<g id="les"><polygon class="gain" points="1270,505 1285,485 1315,485 1330,505 1300,550"/><text class="m" x="1300" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE LESSON</text></g>
<path class="s-line" d="M120 700H1480" stroke-width="4"/>
<g id="rp"></g>
