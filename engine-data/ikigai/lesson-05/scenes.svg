<text class="d5" x="880" y="310" font-size="36">He who has a <tspan style="fill:var(--gain)">why</tspan> to live for</text>
<text class="d5" x="880" y="362" font-size="36">can bear almost any <tspan style="fill:var(--gain)">how</tspan>.</text>
