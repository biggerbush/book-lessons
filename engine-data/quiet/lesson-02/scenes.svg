<rect class="s-ink" x="120" y="240" width="500" height="190" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="156" y="345" font-size="56">“Work alone.”</text>
<text class="m" x="160" y="398" font-size="20">STEVE WOZNIAK</text></g></g>
<g id="nota"><text class="b" x="120" y="500" font-size="30">Cain is not against teamwork.</text></g>
<g id="scl">
