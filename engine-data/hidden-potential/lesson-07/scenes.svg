<g id="s0">
<text class="m" x="120" y="150" font-size="28">HIDDEN POTENTIAL · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Build systems that</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">lift everyone.</text>
<text class="b" x="120" y="600" font-size="32">How schools, teams and hiring can help everyone climb higher</text>
<path class="s-line" d="M1170 820h300" stroke-width="5" stroke-linecap="round"/>
<rect id="lcol" class="ink" x="1300" y="820" width="40" height="0"/>
<g id="lift"><rect class="gain" x="1180" y="560" width="280" height="20" rx="6"/><g id="liftp"></g></g>
<g id="larr"><path class="s-gain" d="M1140 460V310m-22 22 22-22 22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A surprising climb.</text>
<text class="b" x="120" y="176" font-size="32">Finland’s schools, as Adam Grant tells it.</text>
<g id="fmap"><path id="fmapP" class="s-ink" d="M300 250L340 280L330 360L390 420L410 540L380 640L300 710L210 690L180 610L220 520L210 420L250 360L230 300Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/><text class="m" x="295" y="745" font-size="22" text-anchor="middle">FINLAND</text></g>
<g id="bars"><path class="s-ink" d="M580 700H1460" stroke-width="4" stroke-linecap="round"/><text class="m" x="600" y="740" font-size="20">INTERNATIONAL TESTS</text><text class="m" x="1075" y="740" font-size="20" text-anchor="middle" style="fill:var(--gain)">FINLAND</text></g>
<g id="trophy"><path class="gain" d="M1045 212h60v24a30 30 0 0 1-60 0z"/><rect class="gain" x="1068" y="264" width="14" height="16"/><rect class="gain" x="1052" y="280" width="46" height="10" rx="3"/><path class="s-gain" d="M1045 222h-14v10a14 14 0 0 0 14 14M1105 222h14v10a14 14 0 0 1-14 14" fill="none" stroke-width="5"/></g>
<g id="f1"><text class="d5" x="120" y="800" font-size="38">The secret was not finding gifted kids.</text></g>
<g id="f2"><text class="d" x="120" y="852" font-size="42" style="fill:var(--gain)">It was believing every child could grow.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">No early sorting.</text>
<text class="b" x="120" y="176" font-size="32">Keep children learning together for longer.</text>
<g id="fork"><text class="m" x="140" y="270" font-size="22">MANY COUNTRIES</text><path class="s-muted" d="M160 500H380L700 330M380 500L700 670" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="716" y="338" font-size="22">FAST</text><text class="m" x="716" y="678" font-size="22" style="fill:var(--loss)">SLOW</text></g>
<g id="forkk"></g>
<g id="room"><text class="m" x="880" y="270" font-size="22" style="fill:var(--gain)">FINLAND</text><rect class="s-gain" x="860" y="290" width="600" height="410" rx="18" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="960" y="320" width="400" height="50" rx="6"/></g>
<g id="roomk"></g>
<g id="ms1"><text class="m" x="120" y="780" font-size="22">THE MESSAGE TO EVERY STUDENT</text></g>
<g id="ms2"><text class="d" x="120" y="842" font-size="46">Your starting point does not decide your future.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Teachers who matter.</text>
<text class="b" x="120" y="176" font-size="32">In Finland, teaching is respected and selective.</text>
<g id="fun"><g id="fdots"></g><path class="s-ink" d="M140 300H500L360 460V520H280V460Z" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="tch"><g id="tchf"></g><rect class="ink" x="200" y="640" width="240" height="18" rx="4"/><path class="s-ink" d="M220 658v40M420 658v40" stroke-width="6" stroke-linecap="round"/><text class="m" x="320" y="740" font-size="20" text-anchor="middle">RESPECTED · SELECTIVE</text></g>
<g id="dip"><rect class="s-ink" x="600" y="330" width="380" height="260" rx="10" fill="var(--stage)" stroke-width="6"/><text class="m" x="790" y="400" font-size="24" text-anchor="middle">MASTER’S DEGREE</text><path class="s-line" d="M650 450h280M650 490h280M650 530h180" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="920" cy="570" r="30"/><text class="m" x="790" y="640" font-size="20" text-anchor="middle">DEEP TRAINING</text></g>
<g id="prog"><text class="m" x="1220" y="740" font-size="20" text-anchor="middle">EACH CHILD PROGRESSES</text></g>
<g id="tr3"><text class="d" x="120" y="820" font-size="38">Helping each child progress, not just covering material.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The same teacher.</text>
<text class="b" x="120" y="176" font-size="32">Looping: one teacher stays with a class for several years.</text>
<g id="cal"></g>
<g id="loop"></g>
<g id="lpl"><text class="m" x="440" y="575" font-size="20" style="fill:var(--gain)">SAME TEACHER, SEVERAL YEARS</text></g>
<g id="chart"><path class="s-line" d="M160 760H1440" stroke-width="4" stroke-linecap="round"/><path id="gl" class="s-gain" d="M160 740C400 720 520 690 700 672S1100 640 1440 625" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><text class="m" x="1440" y="598" font-size="20" text-anchor="end" style="fill:var(--gain)">GROWTH OVER TIME</text></g>
<g id="snap"><rect class="s-muted" x="670" y="642" width="60" height="60" fill="none" stroke-width="3" stroke-dasharray="6 6"/><circle class="ink" cx="700" cy="672" r="12"/><text class="m" x="700" y="626" font-size="20" text-anchor="middle">ONE SNAPSHOT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Help comes early.</text>
<text class="b" x="120" y="176" font-size="32">Getting help is a normal step on the climb.</text>
<path class="s-line" d="M160 820H760" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="360" y="380" width="340" height="14" rx="4"/>
<path class="s-ink" d="M420 394V820M540 394V820M420 440h120M420 500h120M420 560h120M420 620h120M420 680h120M420 740h120M420 800h120" stroke-width="8" stroke-linecap="round"/>
<g id="helper"></g>
<path id="arm" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="strug"></g>
<g id="h0"><text class="d5" x="780" y="360" font-size="40">Support arrives quickly</text></g>
<g id="h1"><text class="d5" x="780" y="470" font-size="40">No stigma</text></g>
<g id="h2"><text class="d5" x="780" y="580" font-size="40">Help is a normal step</text></g>
<g id="h3"><text class="d" x="720" y="730" font-size="52" style="fill:var(--gain)">Nobody is written off.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fairer hiring.</text>
<text class="b" x="120" y="176" font-size="32">Weigh the degree of difficulty, the way judges score a dive.</text>
<g id="p1"><rect class="s-line" x="120" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="170" y="270" width="120" height="150" rx="8" fill="none" stroke-width="5"/><rect class="s-ink" x="370" y="270" width="120" height="150" rx="8" fill="none" stroke-width="5"/><path class="s-line" d="M190 310h80M190 340h80M190 370h50M390 310h80M390 340h80M390 370h50" stroke-width="6" stroke-linecap="round"/><g id="iv"></g><rect class="ink" x="170" y="560" width="320" height="18" rx="4"/><text class="m" x="330" y="700" font-size="20" text-anchor="middle">WHO HAS MORE POTENTIAL?</text></g>
<g id="p2"><rect class="s-line" x="590" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><rect x="610" y="620" width="380" height="40" fill="var(--ice)" stroke="var(--line)" stroke-width="3"/><rect class="ink" x="630" y="330" width="30" height="290"/><rect class="gain" x="630" y="318" width="130" height="10" rx="3"/><rect x="930" y="560" width="20" height="60" fill="var(--muted)"/><rect x="870" y="552" width="80" height="8" rx="3" fill="var(--muted)"/><path class="s-gain" d="M760 318Q800 210 790 620" fill="none" stroke-width="5" stroke-dasharray="8 8"/><path class="s-muted" d="M870 550Q860 520 850 615" fill="none" stroke-width="4" stroke-dasharray="6 6"/><circle id="diver" class="gain" r="12"/><text class="m" x="610" y="298" font-size="20" style="fill:var(--gain)">HARD DIVE</text><text class="m" x="990" y="500" font-size="20" text-anchor="end">EASY DIVE</text><text class="m" x="800" y="700" font-size="20" text-anchor="middle">DEGREE OF DIFFICULTY</text></g>
<g id="p3"><rect class="s-line" x="1060" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-muted" d="M1080 340H1470" stroke-width="3" stroke-dasharray="6 8"/><path class="s-gain" d="M1080 660L1130 560L1160 590L1210 440L1240 470L1270 340" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path class="s-muted" d="M1300 660h27v-53h27v-53h27v-53h27v-53h27v-54h25v-54" fill="none" stroke-width="5" stroke-linejoin="round"/><circle class="gain" cx="1270" cy="320" r="16"/><circle class="ink" cx="1450" cy="322" r="16"/><text class="m" x="1170" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">HARDSHIP</text><text class="m" x="1380" y="700" font-size="20" text-anchor="middle">ADVANTAGE</text></g>
<g id="grow"><path class="s-gain" d="M1270 296V246m-14 14 14-14 14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1290" y="272" font-size="20" style="fill:var(--gain)">ROOM TO GROW</text></g>
<g id="hb"><text class="d" x="120" y="810" font-size="38">Judge how far someone climbed, not just where they ended.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build your own system.</text>
<text class="b" x="120" y="176" font-size="32">Borrow these ideas wherever you lead.</text>
<g id="tbl"><circle class="s-ink" cx="450" cy="500" r="140" fill="var(--line)" stroke-width="6"/><text class="m" x="450" y="507" font-size="20" text-anchor="middle" style="fill:var(--ink)">YOUR TEAM</text><path id="pl" class="s-gain" d="M632 605L450 710" stroke-width="5" stroke-dasharray="8 8"/><g id="seats"></g></g>
<circle id="nwc" class="s-ink" cx="450" r="28" fill="var(--stage)" stroke-width="6"/>
<g id="k0"></g><g id="k1"></g><g id="k2"></g>
<g id="yb"><text class="d" x="120" y="820" font-size="36">Offer help early. Judge how far people have climbed.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Who on your team,</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">or in your family,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">has been <tspan style="fill:var(--gain)">overlooked?</tspan></text></g>
<g id="qd"><text class="m" x="143" y="660" font-size="26">THIS WEEK: GIVE ONE PERSON A REAL CHANCE TO GROW</text></g>
<g transform="translate(-60 -80)">
