<rect class="s-line" x="840" y="220" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="h41"><text class="m" x="150" y="270" font-size="22">WORKS FOR ANYONE</text></g>
<g id="dz1"></g>
<g id="cards"></g>
<g id="price"><text class="d5" x="150" y="690" font-size="36">Compared on price.</text><text class="m" x="150" y="740" font-size="20">LOOKS LIKE EVERYONE ELSE</text></g>
