<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE HARD THING ABOUT HARD THINGS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Lay people off</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the right way.</text>
<g id="sub0"><text class="b" x="120" y="600" font-size="32">How you let people go shapes everyone who stays.</text></g>
<g id="desks"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Loudcloud shrinks.</text>
<text class="b" x="120" y="176" font-size="32">The dot-com bubble bursts, and customers vanish.</text>
<rect class="s-line" x="120" y="230" width="520" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="276" font-size="20">CUSTOMERS</text>
<path class="s-muted" d="M170 630H610M170 630V300" fill="none" stroke-width="4" stroke-linecap="round"/>
<path id="cline" class="s-ink" d="M180 580L260 540L340 490L420 400L470 360L520 540L600 610" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="bub" class="s-gain" cx="470" cy="320" r="26" fill="none" stroke-width="5"/>
<g id="staff"></g>
<g id="benl"><text class="m" x="920" y="700" font-size="22">BEN HOROWITZ CUTS JOBS TO SURVIVE</text></g>
<g id="judge"><text class="d" x="120" y="800" font-size="40">People who stay judge you by how you treat those who leave.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Get your own head right.</text>
<text class="b" x="120" y="176" font-size="32">Don’t rush past the pain. Stay present.</text>
<ellipse class="s-ink" cx="380" cy="430" rx="150" ry="200" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M380 630V680M300 680H460" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="refl"></g>
<text class="m" x="380" y="730" font-size="20" text-anchor="middle">LOOK AT YOURSELF FIRST</text>
<g id="rush">
<text class="m" x="890" y="280" font-size="20" text-anchor="middle">RUSH PAST THE PAIN?</text>
<path class="s-muted" d="M600 330H1190" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<path class="s-muted" d="M1170 312l20 18-20 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="sun"><circle class="gain" cx="1300" cy="330" r="46"/><g id="rays"></g><text class="m" x="1300" y="440" font-size="20" text-anchor="middle">BRIGHT FUTURE</text></g>
</g>
<path id="nox" class="s-loss" d="M860 300l60 60M920 300l-60 60" stroke-width="9" stroke-linecap="round"/>
<g id="hrt">
<g id="hb" transform="translate(820 560)"><path class="gain" d="M0 60C-75 10-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 10 0 60Z"/></g>
<g id="hurt"></g>
<text class="m" x="1150" y="680" font-size="20" text-anchor="middle">THE PEOPLE YOU ARE ABOUT TO HURT</text>
</g>
<g id="pres"><text class="d" x="120" y="820" font-size="40">Stay fully present for the people you will hurt.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Move fast.</text>
<text class="b" x="120" y="176" font-size="32">Once you decide, act quickly.</text>
<rect class="ink" x="120" y="240" width="500" height="50" rx="10"/>
<g id="cal"></g>
<g id="go"><text class="m" x="120" y="620" font-size="22" style="fill:var(--gain)">ACT QUICKLY</text></g>
<g id="wait"><text class="m" x="120" y="655" font-size="22" style="fill:var(--loss)">EVERY DAY OF WAITING</text></g>
<g id="bld">
<rect class="s-ink" x="760" y="290" width="260" height="300" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="820" y="390" width="140" height="90" rx="6" fill="none" stroke-width="5"/>
<path class="s-ink" d="M820 390l70 50 70-50" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path class="s-loss" d="M860 590l15-24 15 24" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="890" y="750" font-size="20" text-anchor="middle">NEWS LEAKS</text>
</g>
<g id="drops"></g>
