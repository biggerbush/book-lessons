<g id="s0">
<text class="m" x="120" y="150" font-size="28">JAB, JAB, JAB, RIGHT HOOK · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Jab, jab, jab,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">then the right hook.</text>
<text class="b" x="120" y="600" font-size="32">Give, give, give, and only then ask for something.</text>
<g id="tgt"><circle class="s-line" cx="1340" cy="330" r="80" fill="none" stroke-width="6"/><circle class="s-line" cx="1340" cy="330" r="44" fill="none" stroke-width="6"/><circle class="gain" cx="1340" cy="330" r="14"/></g>
<g id="tg"></g>
<g id="tmiss"><text class="m" x="1340" y="480" font-size="24" text-anchor="middle" style="fill:var(--loss)">MOST OF THEM MISS</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Social media is a boxing match.</text>
<text class="b" x="120" y="176" font-size="32">The prize is your audience’s attention.</text>
<g id="ring">
<path class="s-line" d="M200 380H1000M200 460H1000M200 540H1000" stroke-width="5"/>
<rect class="ink" x="186" y="300" width="28" height="340" rx="6"/><rect class="ink" x="986" y="300" width="28" height="340" rx="6"/>
<rect class="ink" x="160" y="640" width="880" height="24" rx="4"/>
</g>
<g id="prize"><path class="s-ink" d="M1140 420Q1270 300 1400 420Q1270 540 1140 420Z" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="1270" cy="420" r="44"/><circle class="ink" cx="1270" cy="420" r="18"/><text class="m" x="1270" y="560" font-size="22" text-anchor="middle">THE PRIZE: ATTENTION</text></g>
<g id="bxr"></g>
<g id="jab"></g>
<g id="jl0"><text class="m" x="560" y="260" font-size="22" style="fill:var(--gain)">JAB</text></g>
<g id="jl1"><text class="m" x="650" y="260" font-size="22" style="fill:var(--gain)">JAB</text></g>
<g id="jl2"><text class="m" x="740" y="260" font-size="22" style="fill:var(--gain)">JAB</text></g>
<g id="setup"><text class="d" x="120" y="780" font-size="46">Light jabs set up something bigger.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A jab gives without asking.</text>
<text class="b" x="120" y="176" font-size="32">A small piece of content made for your audience.</text>
<g id="phone"><rect class="s-ink" x="160" y="230" width="300" height="560" rx="36" fill="var(--stage)" stroke-width="7"/><g id="feed"></g></g>
<g id="fc"><circle class="s-ink" cx="700" cy="420" r="90" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M660 400q12-16 24 0M716 400q12-16 24 0" fill="none" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M650 440q50 60 100 0z"/><text class="m" x="700" y="580" font-size="20" text-anchor="middle">MAKE THEM LAUGH</text></g>
<g id="lb"><path class="s-ink" d="M1000 306v-26M926 336l-18-18M1074 336l18-18" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="1000" cy="400" r="70"/><rect class="ink" x="976" y="470" width="48" height="36" rx="6"/><text class="m" x="1000" y="580" font-size="20" text-anchor="middle">TEACH SOMETHING</text></g>
<g id="sn"><circle class="gain" cx="1300" cy="420" r="50"/><text class="m" x="1300" y="580" font-size="20" text-anchor="middle">BRIGHTEN THEIR DAY</text></g>
<g id="nostr"><text class="d" x="600" y="740" font-size="48">No sale. No link. No strings.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The right hook: you finally ask.</text>
<text class="b" x="120" y="176" font-size="32">The punch that turns attention into results.</text>
<path id="arc" class="s-gain" d="M220 660Q240 380 600 400" fill="none" stroke-width="6" stroke-dasharray="12 12"/>
<g id="hk"></g>
<g id="att"><rect class="s-ink" x="700" y="340" width="300" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="850" y="408" font-size="24" text-anchor="middle">ATTENTION</text></g>
<g id="res"><path class="s-muted" d="M1010 400h70m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-line" d="M1100 560H1440" stroke-width="4"/><text class="m" x="1270" y="600" font-size="22" text-anchor="middle" style="fill:var(--gain)">RESULTS</text></g>
<g id="bars"></g>
<g id="ch0"><rect class="gain" x="700" y="640" width="240" height="64" rx="32"/><text class="m" x="820" y="680" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">BUY THIS</text></g>
<g id="ch1"><rect class="gain" x="960" y="640" width="240" height="64" rx="32"/><text class="m" x="1080" y="680" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">SIGN UP HERE</text></g>
<g id="ch2"><rect class="gain" x="1220" y="640" width="240" height="64" rx="32"/><text class="m" x="1340" y="680" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">VISIT OUR STORE</text></g>
<g id="nohook"><text class="d" x="120" y="800" font-size="44">Without it, goodwill never becomes business.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most brands throw hooks nonstop.</text>
<text class="b" x="120" y="176" font-size="32">Every post is a discount, a launch, a demand.</text>
<g id="mega"><path class="loss" d="M170 430L330 360V580L170 510Z"/><rect class="loss" x="140" y="430" width="40" height="80" rx="8"/><rect class="loss" x="230" y="540" width="26" height="60" rx="6"/><path class="s-loss" d="M360 420q30 50 0 100M395 395q45 75 0 150" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="posts"></g>
<g id="price"><text class="m" x="460" y="640" font-size="22">LIKE A SALESPERSON WHO ONLY TALKS PRICE</text></g>
<g id="crowd4"></g>
<g id="chev"></g>
<g id="nob"><text class="m" x="1265" y="660" font-size="22" text-anchor="middle" style="fill:var(--loss)">NOBODY RESPONDS</text></g>
<g id="why"><text class="d" x="120" y="790" font-size="48">People scroll right past.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Gifts build goodwill.</text>
<text class="b" x="120" y="176" font-size="32">Each jab is a small gift.</text>
<g id="gifts"></g>
<g id="meter"><rect class="s-ink" x="160" y="460" width="840" height="64" rx="32" fill="var(--stage)" stroke-width="5"/><rect id="mfill" class="gain" x="166" y="466" width="0" height="52" rx="26"/></g>
<g id="l0"><text class="m" x="440" y="580" font-size="22" text-anchor="middle">LIKE</text></g>
<g id="l1"><text class="m" x="720" y="580" font-size="22" text-anchor="middle">TRUST</text></g>
<g id="l2"><text class="m" x="1000" y="580" font-size="22" text-anchor="end" style="fill:var(--gain)">LOOK FORWARD</text></g>
<g id="env"><rect class="gain" x="1120" y="300" width="320" height="200" rx="12"/><path d="M1120 300L1280 420L1440 300" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1280" y="560" font-size="22" text-anchor="middle" style="fill:var(--gain)">INVITATION</text></g>
<g id="intr"><text class="m" x="1280" y="610" font-size="22" text-anchor="middle">INTERRUPTION</text><line class="s-loss" x1="1185" y1="603" x2="1375" y2="603" stroke-width="4"/></g>
<g id="inv"><text class="d" x="120" y="780" font-size="48">Your hook feels like an invitation.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Picture a small bakery.</text>
<text class="b" x="120" y="176" font-size="32">An illustration: weeks of jabs, then one offer.</text>
<g id="bak"><rect class="s-ink" x="160" y="340" width="340" height="360" fill="var(--stage)" stroke-width="6"/><g id="awn"></g><text class="m" x="330" y="385" font-size="22" text-anchor="middle">BAKERY</text><rect class="s-ink" x="190" y="400" width="140" height="120" fill="none" stroke-width="5"/><rect class="ink" x="360" y="520" width="100" height="180"/></g>
<g id="k0"><rect class="s-ink" x="600" y="300" width="190" height="230" rx="14" fill="var(--stage)" stroke-width="4"/><path class="s-gain" d="M645 450Q695 370 745 450" fill="none" stroke-width="26" stroke-linecap="round"/><path d="M672 405l8 16M695 392v20M718 405l-8 16" stroke="var(--stage)" stroke-width="4"/><text class="m" x="695" y="500" font-size="18" text-anchor="middle">CROISSANT TIP</text></g>
<g id="k1"><rect class="s-ink" x="820" y="300" width="190" height="230" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d" x="915" y="470" font-size="110" text-anchor="middle">!</text><circle class="loss" cx="870" cy="450" r="8"/><circle class="loss" cx="960" cy="420" r="6"/><text class="m" x="915" y="500" font-size="18" text-anchor="middle">KITCHEN MISHAP</text></g>
<g id="k2"><rect class="s-ink" x="1040" y="300" width="190" height="230" rx="14" fill="var(--stage)" stroke-width="4"/><path class="gain" d="M1090 450a45 45 0 0 1 90 0z"/><path class="s-ink" d="M1070 450h130" stroke-width="5" stroke-linecap="round"/><text class="m" x="1135" y="500" font-size="18" text-anchor="middle">MORNING VIEW</text></g>
<g id="k3"><rect class="gain" x="1260" y="300" width="190" height="230" rx="14"/><rect x="1285" y="380" width="140" height="80" rx="8" fill="none" stroke="var(--on-gain)" stroke-width="3" stroke-dasharray="8 6"/><text class="d" x="1355" y="432" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">OFFER</text><text class="m" x="1355" y="500" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">WEEKEND OFFER</text><text class="m" x="1355" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE ASK</text></g>
<g id="tl"><path class="s-line" d="M600 570H1450" stroke-width="4"/><text class="m" x="915" y="600" font-size="20" text-anchor="middle">WEEKS OF JABS</text></g>
<g id="fol"></g>
<g id="yes"><text class="d" x="120" y="830" font-size="40">Followers who enjoyed the jabs say yes.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Give more than you ask.</text>
<text class="b" x="120" y="176" font-size="32">Jab, jab, jab, then the hook. Giving clearly outweighs asking.</text>
<path class="s-ink" d="M460 320V600M380 600h160" stroke-width="8" stroke-linecap="round"/>
<g id="scl"></g>
<line id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="460" cy="320" r="12"/>
<g id="gl"><text class="m" x="220" y="560" font-size="22" text-anchor="middle" style="fill:var(--gain)">GIVE</text></g>
<g id="al"><text class="m" x="700" y="560" font-size="22" text-anchor="middle" style="fill:var(--loss)">ASK</text></g>
<g id="cal"><rect class="s-ink" x="870" y="230" width="580" height="340" rx="14" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="870" y="230" width="580" height="44" rx="14"/><g id="cells"></g><text class="m" x="870" y="606" font-size="20">STEADY, WEEK AFTER WEEK</text></g>
<g id="nb"><rect class="s-ink" x="120" y="640" width="1360" height="176" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="170" y="700" font-size="22">BEFORE YOU POST, ASK</text><text class="d" x="170" y="776" font-size="52">What does my audience <tspan style="fill:var(--gain)">get</tspan> from this?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Post three jabs</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">that give something real</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">before you <tspan style="fill:var(--gain)">ask</tspan>.</text></g>
<text class="m" x="143" y="700" font-size="26">THIS WEEK: JAB, JAB, JAB, THEN THE HOOK</text>
