</g>
<g id="lis"></g><g id="lisq"></g><g id="qx"></g>
<g id="lect"><text class="d" x="120" y="840" font-size="44">We stop listening and start lecturing.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. The prosecutor.</text>
<text class="b" x="120" y="176" font-size="32">We line up arguments to prove someone else wrong.</text>
<g id="rl2"></g>
