<g id="book"><path class="s-ink" d="M440 320c-60-20-180-20-240 0v220c60-20 180-20 240 0zM440 320c60-20 180-20 240 0v220c-60-20-180-20-240 0z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
