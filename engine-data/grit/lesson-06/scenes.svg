<g id="qa"><text class="d" x="136" y="300" font-size="84" letter-spacing="-2">What story do you tell</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="84" letter-spacing="-2">yourself when things</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="84" letter-spacing="-2" style="fill:var(--gain)">go wrong?</text></g>
