<g id="gh"><circle cx="1270" cy="470" r="38" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 7"/>
<path d="M1213 640v-50a57 57 0 0 1 114 0v50" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 7"/></g>
</g>
<g id="b71"></g><g id="b72"></g>
<g id="lov7"><text class="d" x="120" y="820" font-size="40">Their love does not stop working because they are absent.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What would you say</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">to them, and what</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">would <tspan style="fill:var(--gain)">they</tspan> answer?</text></g>
<g id="lbl8"><text class="m" x="143" y="700" font-size="26">PICTURE SOMEONE YOU LOVE</text></g>
<g id="q81"></g><g id="q82"></g>
</g>