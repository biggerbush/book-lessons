<g id="s0">
<text class="m" x="120" y="150" font-size="28">DEEP WORK · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Choose your depth</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">philosophy.</text>
<text class="b" x="120" y="600" font-size="32">Find the focus schedule that actually fits your life.</text>
<g id="tdesk"><path class="s-ink" d="M1100 660h380M1140 660v120M1440 660v120" stroke-width="8" stroke-linecap="round"/><g id="tfig"></g><rect class="ink" x="1232" y="596" width="116" height="64" rx="6"/><circle class="gain" cx="1290" cy="628" r="8"/></g>
<g id="tfocus"><circle id="ring" class="s-gain" cx="1290" cy="560" r="150" fill="none" stroke-width="6" stroke-dasharray="14 12"/><text class="m" x="1290" y="380" font-size="24" text-anchor="middle" style="fill:var(--gain)">FOCUS TIME</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pick a philosophy.</text>
<text class="b" x="120" y="176" font-size="32">Four ways to schedule deep work. Which door is yours?</text>
<g id="doors"></g>
<g id="pills"></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. The monastic.</text>
<text class="b" x="120" y="176" font-size="32">Cut out almost all shallow work.</text>
<g id="envs"></g>
<g id="monk"><circle class="s-ink" cx="460" cy="520" r="200" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M380 620h160" stroke-width="7" stroke-linecap="round"/><text class="m" x="460" y="670" font-size="20" text-anchor="middle">NO SHALLOW WORK</text></g>
<g id="knuth"><text class="m" x="900" y="290" font-size="22">COMPUTER SCIENTIST</text><text class="d5" x="900" y="350" font-size="48">Donald Knuth</text>
<rect class="s-ink" x="900" y="400" width="120" height="80" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M900 400l60 44 60-44" fill="none" stroke-width="5"/><path class="s-loss" d="M890 390l140 100M1030 390l-140 100" stroke-width="8" stroke-linecap="round"/>
<text class="d" x="1050" y="440" font-size="40">Gave up email</text><text class="b" x="1050" y="482" font-size="30">to focus on his books.</text></g>
<g id="goal"><circle class="s-ink" cx="960" cy="660" r="60" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="960" cy="660" r="36" fill="none" stroke-width="6"/><circle class="gain" cx="960" cy="660" r="16"/><text class="m" x="1050" y="614" font-size="20" style="fill:var(--gain)">BEST FIT</text><text class="d" x="1050" y="664" font-size="36">One big, clear goal.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. The bimodal.</text>
<text class="b" x="120" y="176" font-size="32">Deep stretches, and everything else.</text>
<g id="city"><rect class="s-ink" x="140" y="380" width="90" height="200" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="250" y="320" width="110" height="260" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="380" y="410" width="80" height="170" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="480" y="350" width="100" height="230" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M185 400v160M305 340v220M420 430v130M530 370v190" stroke-width="14" stroke-dasharray="14 14"/>
<text class="m" x="120" y="620" font-size="20">BUSY PRACTICE, ZURICH</text><text class="m" x="620" y="280" font-size="20">CARL JUNG, PSYCHOLOGIST</text>
<path class="s-line" d="M620 580h480" stroke-width="4" stroke-dasharray="8 10"/></g>
<g id="jung"></g>
<g id="tower"><path class="s-line" d="M1000 580h460" stroke-width="4"/><rect class="s-ink" x="1120" y="300" width="140" height="280" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="1120" y="274" width="26" height="30"/><rect class="ink" x="1177" y="274" width="26" height="30"/><rect class="ink" x="1234" y="274" width="26" height="30"/>
<path class="s-line" d="M1124 380h132M1124 450h132M1124 520h132" stroke-width="3"/><rect class="ink" x="1176" y="320" width="28" height="44" rx="14"/>
<circle class="gain" cx="1350" cy="520" r="30"/><circle class="gain" cx="1420" cy="535" r="24"/><path class="s-ink" d="M1350 550v30M1420 559v21" stroke-width="6"/>
<text class="m" x="1190" y="620" font-size="20" text-anchor="middle">STONE TOWER</text></g>
<text class="m" x="120" y="664" font-size="20">YOUR WEEK</text>
<g id="cells"></g>
<g id="full"><path class="s-gain" d="M896 756v12h374v-12" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="120" y="830" font-size="40">Each deep stretch: at least a full day.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. The rhythmic.</text>
<text class="b" x="120" y="176" font-size="32">Deep work at the same time, every day.</text>
<g id="clk"><circle class="s-ink" cx="300" cy="400" r="140" fill="var(--stage)" stroke-width="7"/><path id="wedge" class="gain" d="M300 400L331 516A120 120 0 0 1 215 485Z" fill-opacity=".85"/><g id="ticks"></g>
<path id="hh" class="s-ink" d="M300 400V330" stroke-width="9" stroke-linecap="round"/><path id="mh" class="s-ink" d="M300 400V290" stroke-width="5" stroke-linecap="round"/><circle class="ink" cx="300" cy="400" r="10"/>
<path class="s-ink" d="M140 610h340" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M370 610a46 46 0 0 1 92 0z"/></g>
<g id="chap"><text class="m" x="120" y="680" font-size="20">BRIAN CHAPPELL · WORKING FATHER, DOCTORATE</text><text class="d" x="120" y="750" font-size="52">5:30–7:30 am, every weekday</text></g>
<g id="calg"><rect class="ink" x="770" y="240" width="700" height="52" rx="8"/><text class="m" x="790" y="274" font-size="22" style="fill:var(--stage)">DON’T BREAK THE CHAIN</text><g id="cal"></g><g id="xs"></g></g>
<g id="habit"><text class="d" x="120" y="830" font-size="44">Habit replaces the daily decision.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. The journalistic.</text>
<text class="b" x="120" y="176" font-size="32">Switch into deep work whenever a free gap appears.</text>
<text class="m" x="120" y="280" font-size="20">YOUR DAY</text>
<g id="day"></g>
<g id="isa"><text class="m" x="120" y="480" font-size="20">WALTER ISAACSON</text><text class="d5" x="120" y="540" font-size="44">Wrote a major biography</text><text class="d5" x="120" y="596" font-size="44">in spare hours.</text>
<rect class="s-ink" x="1240" y="440" width="200" height="220" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1270 440v220" stroke-width="6"/><g id="pg"></g></g>
<g id="warn"><rect class="gain" x="120" y="700" width="600" height="80" rx="40"/><text class="m" x="420" y="749" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">EXPERIENCED DEEP WORKERS</text>
<rect class="s-loss" x="780" y="700" width="340" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="m" x="950" y="749" font-size="24" text-anchor="middle" style="fill:var(--loss)">BEGINNERS</text><path class="s-loss" d="M820 740h260" stroke-width="5"/></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build your rituals.</text>
<text class="b" x="120" y="176" font-size="32">Whatever style you choose, remove the decisions.</text>
<g id="rit"><rect class="s-ink" x="180" y="300" width="200" height="260" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="240" y="284" width="80" height="30" rx="8"/><g id="rows"></g><text class="m" x="120" y="620" font-size="20">RITUALS REMOVE DECISIONS</text></g>
<g id="qs"></g>
<g id="cw"><rect class="s-line" x="500" y="240" width="460" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="530" y="290" font-size="22">WHERE</text>
<rect class="s-ink" x="540" y="340" width="160" height="220" fill="none" stroke-width="6"/><path class="s-ink" d="M540 413h160M540 486h160" stroke-width="5"/><g id="sp"></g>
<path class="s-ink" d="M730 600h200M750 600v60M910 600v60M880 600v-90" stroke-width="7" stroke-linecap="round"/><circle class="gain" cx="860" cy="500" r="20"/>
<text class="d5" x="530" y="720" font-size="34">A quiet room or</text><text class="d5" x="530" y="764" font-size="34">a library corner</text></g>
<g id="ct"><rect class="s-line" x="1020" y="240" width="460" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1050" y="290" font-size="22">WHEN · HOW LONG</text>
<rect class="ink" x="1232" y="322" width="36" height="24" rx="4"/><circle class="s-ink" cx="1250" cy="480" r="130" fill="var(--stage)" stroke-width="7"/><path id="arc" class="gain" fill-opacity=".85" d="M0 0"/><path id="swh" class="s-ink" d="M1250 480V370" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1250" cy="480" r="10"/>
<text class="d5" x="1050" y="720" font-size="34">Set your start time</text><text class="d5" x="1050" y="764" font-size="34">and how long you last.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">How, and what fuels you.</text>
<text class="b" x="120" y="176" font-size="32">Set rules for the session, then plan your support.</text>
<g id="rules"><rect class="s-line" x="120" y="240" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">RULES</text>
<path class="s-ink" d="M200 452a70 70 0 0 1 100 0M222 474a40 40 0 0 1 56 0" fill="none" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="250" cy="496" r="9"/><path class="s-loss" d="M196 410L304 520" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="360" y="478" font-size="34">No internet</text>
<rect class="s-ink" x="222" y="548" width="70" height="90" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="212" y="558" width="70" height="90" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="202" y="568" width="70" height="90" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M216 596h42M216 616h42M216 636h26" stroke-width="5"/>
<text class="d5" x="360" y="616" font-size="32">Target: pages written</text></g>
<rect class="s-line" x="840" y="240" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="290" font-size="22">SUPPORT</text>
<g id="f0"><g id="steam"><path class="s-muted" d="M935 400q-14-20 0-40M985 400q-14-20 0-40" fill="none" stroke-width="5" stroke-linecap="round"/></g><path class="ink" d="M900 420h120v100a40 40 0 0 1-40 40h-40a40 40 0 0 1-40-40z"/><path class="s-ink" d="M1020 450h14a24 24 0 0 1 0 48h-14" fill="none" stroke-width="8"/><text class="m" x="960" y="620" font-size="22" text-anchor="middle">COFFEE READY</text></g>
<g id="f1"><circle class="gain" cx="1160" cy="500" r="52"/><path class="s-ink" d="M1160 450v-24" stroke-width="6" stroke-linecap="round"/><text class="m" x="1160" y="620" font-size="22" text-anchor="middle">FOOD NEARBY</text></g>
<g id="f2"><g id="walker"></g><path class="s-gain" d="M1290 560q70-30 140 0" fill="none" stroke-width="5" stroke-dasharray="8 8"/><text class="m" x="1360" y="620" font-size="22" text-anchor="middle">A WALK</text></g>
<g id="tell"><text class="d" x="120" y="800" font-size="46">Small rituals tell your brain: go deep.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="88" letter-spacing="-2">Which of the four styles</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">truly fits <tspan style="fill:var(--gain)">your week?</tspan></text></g>
<g id="wr"><text class="m" x="143" y="600" font-size="26">WRITE IT DOWN NOW</text><text class="m" x="143" y="644" font-size="26">WHERE · WHEN · HOW</text></g>
<g id="note"><g transform="rotate(-4 1270 680)"><rect class="gain" x="1100" y="540" width="340" height="280" rx="6"/><text class="m" x="1130" y="612" font-size="22" style="fill:var(--on-gain)">WHERE</text><text class="m" x="1130" y="682" font-size="22" style="fill:var(--on-gain)">WHEN</text><text class="m" x="1130" y="752" font-size="22" style="fill:var(--on-gain)">HOW</text><g id="scr"></g></g></g>
</g>