</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hooked on numbers.</text>
<text class="b" x="120" y="176" font-size="32">Before Challenger, NASA’s habit: arguments need hard numbers.</text>
