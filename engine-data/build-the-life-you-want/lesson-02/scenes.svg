<g id="s0">
<text class="m" x="120" y="150" font-size="28">BUILD THE LIFE YOU WANT · LESSON 2</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">The three</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">macronutrients</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">of happiness.</text>
<text class="b" x="120" y="640" font-size="32">Enjoyment, satisfaction, and purpose: the balanced diet of a happy life.</text>
<path class="s-ink" d="M1040 250q26 50 0 130v130" fill="none" stroke-width="7" stroke-linecap="round"/>
<path class="s-ink" d="M1424 250v50q16 30 32 0v-50M1440 250v260" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="plate0"></g>
<g id="hungry"><text class="m" x="1240" y="588" font-size="22" text-anchor="middle" style="fill:var(--loss)">STILL HUNGRY</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three macronutrients.</text>
<text class="b" x="120" y="176" font-size="32">Happiness needs all three, in balance.</text>
<g id="bowls"></g>
<g id="bal"><g id="beam"><path class="s-ink" d="M280 720H1320" stroke-width="8" stroke-linecap="round"/><circle class="gain" cx="380" cy="700" r="20"/><circle class="gain" cx="800" cy="700" r="20"/><circle class="gain" cx="1220" cy="700" r="20"/></g>
<path class="ink" d="M800 724L770 774H830z"/><text class="m" x="800" y="820" font-size="20" text-anchor="middle">ALL THREE, IN BALANCE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Enjoyment is not pleasure.</text>
<text class="b" x="120" y="176" font-size="32">Pleasure is a quick reward. Enjoyment adds people and memory.</text>
<g id="left2"><rect class="s-line" x="120" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22" style="fill:var(--loss)">PLEASURE</text><g id="lone"></g>
<path class="ink" d="M240 600h120a60 40 0 0 1 -120 0z"/><circle class="gain" cx="270" cy="588" r="10"/><circle class="gain" cx="300" cy="584" r="10"/><circle class="gain" cx="330" cy="588" r="10"/>
<rect class="s-ink" x="480" y="340" width="220" height="140" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M510 380h120M510 420h80" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M590 480v50M550 530h80" stroke-width="6" stroke-linecap="round"/>
<g id="burst"><path class="s-gain" d="M390 330l20-20M400 360h28M390 390l20 20" stroke-width="6" stroke-linecap="round"/></g></g>
<g id="gone"><text class="d5" x="150" y="740" font-size="34">Alone, then gone.</text></g>
<g id="right2"><rect class="s-line" x="840" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22" style="fill:var(--gain)">ENJOYMENT</text><g id="ppl"></g>
<rect class="ink" x="960" y="556" width="420" height="18" rx="9"/><path class="gain" d="M1120 522h100a50 34 0 0 1 -100 0z"/>
<text class="m" x="870" y="640" font-size="22" style="fill:var(--gain)">+ PEOPLE   + MEMORY</text></g>
<g id="memory"><ellipse class="s-ink" cx="1300" cy="290" rx="80" ry="46" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="1262" cy="352" r="7" fill="var(--stage)" stroke-width="4"/>
<path class="gain" d="M1300 312c-40-26-40-50-20-56c10-3 18 4 20 10c2-6 10-13 20-10c20 6 20 30-20 56z"/>
<text class="d5" x="870" y="740" font-size="34">Shared, then remembered.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Satisfaction takes work.</text>
<text class="b" x="120" y="176" font-size="32">The glow after struggling toward something and getting it.</text>
<g id="mtn"><polygon class="s-ink" points="560,800 1000,300 1460,800" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<polyline id="trail" class="s-muted" points="640,790 900,700 780,610 1000,520 920,430 1000,320" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="120" y="560" font-size="20">THE GLOW COMES AFTER THE CLIMB</text></g>
<g id="rings"></g>
<g id="flag3"><path class="s-ink" d="M1000 300V220" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M1000 220h56l-14 16 14 16h-56z"/></g>
<circle id="climber" class="gain" r="18" stroke="var(--ink)" stroke-width="4"/>
<g id="noeff"><text class="d" x="120" y="420" font-size="46">No effort,</text><text class="d" x="120" y="480" font-size="46" style="fill:var(--gain)">no satisfaction.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why satisfaction fades.</text>
<text class="b" x="120" y="176" font-size="32">Hit the goal, feel great, and soon the feeling slips away.</text>
<g id="chart"><path class="s-ink" d="M160 280V620H760" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="176" y="270" font-size="20">SATISFACTION</text><text class="m" x="760" y="652" font-size="20" text-anchor="end">TIME</text>
<path id="curve" class="s-gain" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="fg"><text class="m" x="272" y="316" font-size="18" style="fill:var(--gain)">FEEL GREAT</text></g>
<g id="sa"><text class="m" x="290" y="606" font-size="18">SLIPS AWAY</text></g>
<g id="mill"><g id="runner"></g><path id="leg0" class="s-gain" stroke-width="10" stroke-linecap="round"/><path id="leg1" class="s-gain" stroke-width="10" stroke-linecap="round"/>
<rect class="s-ink" x="880" y="690" width="520" height="30" rx="15" fill="var(--stage)" stroke-width="6"/>
<path id="belt" class="s-muted" d="M905 705H1375" stroke-width="4" stroke-dasharray="16 16"/>
<path class="s-ink" d="M1360 690L1400 480H1310" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="goal4w"><g id="goal4"><path class="s-ink" d="M0 0V-110" stroke-width="5"/><path class="gain" d="M0 -110h50l-12 16 12 16h-50z"/><text class="m" x="0" y="-124" font-size="20" text-anchor="middle">NEXT GOAL</text></g></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The happiness fraction.</text>
<text class="b" x="120" y="176" font-size="32">Satisfaction equals what you have, divided by what you want.</text>
<g id="frac"><text class="d" x="120" y="530" font-size="64">Satisfaction =</text><path class="s-ink" d="M720 510H1460" stroke-width="8" stroke-linecap="round"/></g>
<g id="hw"><text class="d5" x="740" y="470" font-size="48" style="fill:var(--gain)">Have</text><text class="d5" x="740" y="600" font-size="48" style="fill:var(--loss)">Want</text></g>
<g id="haves"></g><g id="wants"></g>
<g id="fast"><text class="d" x="120" y="810" font-size="44">But the wants keep growing just as fast.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shrink the bottom number.</text>
<text class="b" x="120" y="176" font-size="32">Want less, and the same life feels like more.</text>
<g id="f6"><text class="m" x="160" y="380" font-size="20" style="fill:var(--gain)">HAVE</text><g id="h6"></g>
<path class="s-ink" d="M160 470H640" stroke-width="8" stroke-linecap="round"/><g id="ghost"></g><g id="w6"></g><g id="cut"></g>
<path id="cutln" class="s-ink" d="M395 478V552" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<text class="m" x="160" y="572" font-size="20" style="fill:var(--loss)">WANT</text>
<g id="sc" transform="translate(712 515)">
<g id="bl0"><path class="ink" d="M0 -6L-52 0L0 6z"/><path class="s-ink" d="M0 0L22 14" stroke-width="6" stroke-linecap="round"/><circle class="s-ink" cx="34" cy="21" r="13" fill="var(--stage)" stroke-width="6"/></g>
<g id="bl1"><path class="ink" d="M0 6L-52 0L0 -6z"/><path class="s-ink" d="M0 0L22 -14" stroke-width="6" stroke-linecap="round"/><circle class="s-ink" cx="34" cy="-21" r="13" fill="var(--stage)" stroke-width="6"/></g>
<circle class="gain" cx="0" cy="0" r="5"/>
</g>
<text class="m" x="160" y="690" font-size="20">SATISFACTION</text>
<rect class="s-line" x="160" y="706" width="480" height="26" rx="13" fill="none" stroke-width="3"/><rect id="meter" class="gain" x="160" y="706" height="26" rx="13"/></g>
<g id="list"><text class="m" x="820" y="270" font-size="20">MY WANTS</text></g>
<g id="beats"><text class="d" x="120" y="810" font-size="46">Managing wants beats adding haves.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Purpose holds it together.</text>
<text class="b" x="120" y="176" font-size="32">The feeling that your life makes sense and matters.</text>
<g id="cmp"><circle class="s-ink" cx="400" cy="450" r="150" fill="var(--stage)" stroke-width="7"/><text class="m" x="400" y="336" font-size="22" text-anchor="middle">N</text>
<g id="needle"><path class="gain" d="M400 350L422 450H378z"/><path class="ink" d="M400 550L422 450H378z"/></g><circle class="ink" cx="400" cy="450" r="10"/></g>
<g id="sense"><text class="m" x="400" y="660" font-size="20" text-anchor="middle">YOUR LIFE MAKES SENSE AND MATTERS</text></g>
<path id="story" class="s-ink" d="M700 560C820 420 900 640 1020 500S1220 380 1300 440S1420 330 1440 300" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="setb"></g>
<g id="lbl7"><text class="m" x="700" y="650" font-size="20">SETBACKS FIT A LARGER STORY</text></g>
<g id="mix"><text class="d" x="120" y="800" font-size="44">A happy life mixes all three.</text><g id="plate7"></g></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Write down one thing</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you could simply</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">stop wanting.</text></g>
