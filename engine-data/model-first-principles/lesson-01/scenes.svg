<g id="foll"><path class="s-muted" d="M380 440h70m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="540" y="540" font-size="20" text-anchor="middle">YOU</text></g>
<g id="map">
<rect class="s-ink" x="760" y="240" width="560" height="340" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M947 240V580M1133 240V580" stroke-width="3"/>
