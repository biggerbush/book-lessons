<text id="bubT" class="m" x="330" y="448" font-size="22" text-anchor="middle">DOT-COM</text>
<g id="shards"></g>
<text class="m" x="330" y="680" font-size="20" text-anchor="middle">DOT-COM BUBBLE</text>
<g id="boxes"></g>
<text class="m" x="800" y="680" font-size="20" text-anchor="middle">INTERNET-COMPANY CUSTOMERS</text>
