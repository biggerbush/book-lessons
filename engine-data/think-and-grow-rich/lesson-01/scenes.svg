<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Every fortune starts</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">as a burning desire.</text>
<text class="b" x="120" y="600" font-size="32">How one fierce, specific want can change a whole life.</text>
<g id="rays"></g>
<g id="bulb"><circle class="s-ink" cx="1320" cy="360" r="110" fill="var(--stage)" stroke-width="8"/><path id="tf" class="gain"/><path class="s-ink" d="M1270 456L1280 500H1360L1370 456" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="1284" y="508" width="72" height="16" rx="6"/><rect class="ink" x="1292" y="532" width="56" height="16" rx="6"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wishing is not enough.</text>
<text class="b" x="120" y="176" font-size="32">Most of us wish for things all the time.</text>
<g id="dreamer"></g>
<g id="bubs"></g>
<g id="cloud"><g id="cloudIn">
<rect class="s-ink" x="500" y="260" width="500" height="210" rx="100" fill="var(--stage)" stroke-width="5"/>
<g id="w0"><path class="s-ink" d="M560 400V350L600 315L640 350V400Z" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="600" y="440" font-size="20" text-anchor="middle">HOUSE</text></g>
<g id="w1"><rect class="s-ink" x="700" y="340" width="90" height="60" rx="8" fill="none" stroke-width="5"/><path class="s-ink" d="M727 340v-14h36v14" fill="none" stroke-width="5"/><text class="m" x="745" y="440" font-size="20" text-anchor="middle">JOB</text></g>
<g id="w2"><path class="s-ink" d="M860 370q20-24 40 0q20-24 40 0" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="900" y="440" font-size="20" text-anchor="middle">FREEDOM</text></g>
</g></g>
<g id="nothing"><text class="m" x="750" y="520" font-size="22" text-anchor="middle" style="fill:var(--loss)">WISHING ALONE CHANGES NOTHING</text></g>
<g id="flameG"><path id="f1" class="gain"/><path id="f1i" fill="var(--stage)"/><text class="m" x="1250" y="690" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE SPECIFIC GOAL</text></g>
<g id="desire"><text class="d" x="120" y="800" font-size="46">A burning desire for one specific goal.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Edwin Barnes.</text>
<text class="b" x="120" y="176" font-size="32">One young man, one exact goal.</text>
<g id="bar"><text class="m" x="300" y="690" font-size="22" text-anchor="middle">EDWIN BARNES</text></g>
<g id="edi"><circle class="gain" cx="1300" cy="300" r="24"/><rect class="ink" x="1290" y="326" width="20" height="10"/><text class="m" x="1300" y="690" font-size="22" text-anchor="middle">THOMAS EDISON</text></g>
<g id="o0"><rect class="s-ink" x="560" y="330" width="480" height="84" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="800" y="386" font-size="38" text-anchor="middle">Work near him</text></g>
<line id="k0" class="s-loss" x1="590" y1="372" x2="590" y2="372" stroke-width="6" stroke-linecap="round"/>
<g id="o1"><rect class="s-ink" x="560" y="450" width="480" height="84" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="800" y="506" font-size="38" text-anchor="middle">Admire him</text></g>
<line id="k1" class="s-loss" x1="590" y1="492" x2="590" y2="492" stroke-width="6" stroke-linecap="round"/>
<g id="lk"><path class="s-gain" d="M375 612H560M1040 612H1225" stroke-width="6" stroke-dasharray="10 8"/></g>
<g id="o2"><rect class="gain" x="560" y="570" width="480" height="84" rx="14"/><text class="d" x="800" y="626" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Partner with him</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No money, no plan B.</text>
<text class="b" x="120" y="176" font-size="32">He rode a freight train to reach Edison.</text>
<g id="wal"><rect class="s-ink" x="120" y="230" width="220" height="140" rx="18" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M120 280H340" stroke-width="5"/><text class="m" x="230" y="335" font-size="20" text-anchor="middle">EMPTY</text>
<text class="m" x="380" y="290" font-size="22" style="fill:var(--loss)">NO MONEY</text><text class="m" x="380" y="330" font-size="22" style="fill:var(--loss)">NO CONNECTIONS</text></g>
<path class="s-line" d="M120 668H1480" stroke-width="6" stroke-linecap="round"/>
<g id="train"><g id="trm"></g></g>
<g id="tl1"><text class="m" x="120" y="720" font-size="20">NO TICKET · A FREIGHT TRAIN</text></g>
<g id="door"><rect class="s-ink" x="1260" y="400" width="170" height="266" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1290" cy="540" r="8"/><rect class="gain" x="1275" y="420" width="140" height="40" rx="6"/><text class="m" x="1345" y="447" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">EDISON</text></g>
<g id="tramp"></g>
<g id="tl2"><text class="m" x="1480" y="720" font-size="20" text-anchor="end">ARRIVED LOOKING LIKE A TRAMP</text></g>
<g id="bub"><rect class="s-ink" x="800" y="220" width="680" height="130" rx="20" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M1150 348L1175 400L1192 348" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/>
<text class="d5" x="830" y="275" font-size="34">“I’ve come to go into business</text><text class="d5" x="830" y="325" font-size="34">with Edison.”</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A humble start.</text>
<text class="b" x="120" y="176" font-size="32">Edison gave him an ordinary job instead.</text>
<g id="bar4"></g>
<g id="pz"><text id="pzt" class="m" x="430" y="572" font-size="26">PARTNER</text><path class="s-muted" d="M368 600L408 630M396 632l12-2-2-12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<line id="pzk" class="s-loss" x1="424" y1="563" x2="424" y2="563" stroke-width="6" stroke-linecap="round"/>
<g id="job"><rect class="s-ink" x="420" y="610" width="260" height="80" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="550" y="658" font-size="22" text-anchor="middle">ORDINARY JOB</text></g>
<g id="glad"><path class="s-gain" d="M700 650l20 20l40-44" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="420" y="730" font-size="20" style="fill:var(--gain)">TAKEN GLADLY</text></g>
<g id="cal"><text class="m" x="780" y="236" font-size="22">MONTHS, THEN YEARS</text><rect class="s-ink" x="780" y="256" width="320" height="214" rx="12" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="780" y="256" width="320" height="40" rx="6"/><g id="cells"></g></g>
<path id="sight" class="s-gain" d="M345 425L1210 620" stroke-width="4" stroke-dasharray="10 10"/>
<g id="tgt"><circle class="s-ink" cx="1300" cy="630" r="90" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1300" cy="630" r="56" fill="none" stroke-width="6"/><circle class="gain" cx="1300" cy="630" r="22"/><text class="m" x="1300" y="760" font-size="20" text-anchor="middle">ONE TARGET</text></g>
<g id="cool"><text class="d" x="120" y="820" font-size="46">His desire never cooled.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The opening arrives.</text>
<text class="b" x="120" y="176" font-size="32">Edison’s own salesmen doubted his new machine.</text>
<g id="mach"><rect class="s-ink" x="140" y="380" width="260" height="70" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="180" y="330" width="180" height="50" rx="25"/><polygon class="s-ink" points="350,345 430,240 480,300" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="140" y="490" font-size="20">NEW DICTATING MACHINE</text></g>
<g id="sal"><text class="m" x="560" y="490" font-size="20">HIS OWN SALESMEN DOUBTED IT</text></g>
<g id="bar5"><path id="arm" class="s-gain" stroke-width="12" stroke-linecap="round"/><text class="m" x="1040" y="490" font-size="20" text-anchor="middle">BARNES</text></g>
<g id="say"><text class="d" x="1140" y="330" font-size="40">I can sell it.</text></g>
<g id="con"><rect class="s-ink" x="120" y="540" width="220" height="250" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M150 590h160M150 630h160M150 670h120" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M150 745q20-30 40 0t40 0" fill="none" stroke-width="4"/><circle class="gain" cx="300" cy="740" r="22"/><text class="m" x="120" y="830" font-size="20">PARTNER IN THAT BUSINESS</text></g>
<g id="cty"><path class="s-gain" d="M350 660H405M390 645l15 15-15 15" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-muted" x="420" y="560" width="620" height="220" rx="24" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="450" y="595" font-size="20">ACROSS THE COUNTRY</text>
<path class="s-ink" d="M470 650Q500 612 600 622L760 612Q880 602 962 624Q1012 642 1006 692Q1000 742 950 756L800 766Q700 774 620 762L520 764Q468 752 464 700Z" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="routes"></g><g id="dots"></g><rect class="ink" x="748" y="683" width="24" height="24" rx="4"/></g>
<g id="bag"><g id="bagIn"><path class="gain" d="M1220 604L1200 560H1320L1300 604Z"/><circle class="gain" cx="1260" cy="690" r="90"/><path class="s-ink" d="M1222 604h76" stroke-width="6"/><text class="d" x="1260" y="718" font-size="80" text-anchor="middle" style="fill:var(--on-gain)">$</text></g><text class="m" x="1260" y="830" font-size="20" text-anchor="middle">THE DEAL MADE HIM RICH</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it worked.</text>
<text class="b" x="120" y="176" font-size="32">Barnes wasn’t smarter or richer. His desire was different.</text>
<g id="c1"><g id="eq"></g><text class="d" x="320" y="720" font-size="48" text-anchor="middle">No advantage</text><text class="m" x="320" y="770" font-size="20" text-anchor="middle">NOT SMARTER</text><text class="m" x="320" y="800" font-size="20" text-anchor="middle">NOT RICHER</text></g>
<g id="c2"><circle class="s-ink" cx="800" cy="440" r="120" fill="none" stroke-width="6"/><circle class="s-ink" cx="800" cy="440" r="80" fill="none" stroke-width="6"/><circle class="s-ink" cx="800" cy="440" r="40" fill="none" stroke-width="6"/><circle id="bull" class="ink" cx="800" cy="440" r="14"/>
<g id="mag"><circle class="s-ink" cx="800" cy="440" r="54" fill="none" stroke-width="12"/><path class="s-ink" d="M838 478L900 540" stroke-width="16" stroke-linecap="round"/></g>
<text class="d" x="800" y="720" font-size="48" text-anchor="middle" style="fill:var(--gain)">Definite</text><text class="m" x="800" y="770" font-size="20" text-anchor="middle">KNEW EXACTLY</text><text class="m" x="800" y="800" font-size="20" text-anchor="middle">WHAT HE WANTED</text></g>
<g id="c3"><path class="s-line" d="M1080 650h400" stroke-width="4"/><path class="s-ink" d="M1160 536V640M1280 536V640M1400 536V640" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="1100" y="520" width="360" height="16" rx="4"/><g id="fires"></g>
<text class="d" x="1280" y="720" font-size="48" text-anchor="middle" style="fill:var(--gain)">Intense</text><text class="m" x="1280" y="770" font-size="20" text-anchor="middle">NO ROAD BACK</text><text class="m" x="1280" y="800" font-size="20" text-anchor="middle">TO AN EASIER LIFE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find your desire.</text>
<text class="b" x="120" y="176" font-size="32">Ask what you truly want, in one clear sentence.</text>
<g id="nb"><rect class="s-ink" x="360" y="220" width="880" height="560" rx="16" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M450 260V760" stroke-width="3"/><g id="rings"></g><text class="m" x="480" y="300" font-size="22">WHAT DO I TRULY WANT?</text></g>
<g id="w1x"><text class="d5" x="480" y="400" font-size="44">More money</text></g>
<line id="x1" class="s-loss" x1="472" y1="386" x2="472" y2="386" stroke-width="6" stroke-linecap="round"/>
<g id="w2x"><text class="d5" x="480" y="500" font-size="44">A better life someday</text></g>
<line id="x2" class="s-loss" x1="472" y1="486" x2="472" y2="486" stroke-width="6" stroke-linecap="round"/>
<g id="goal"><g id="spk"></g><path id="starP" class="gain"/><text class="d" x="582" y="642" font-size="48">My one clear goal.</text><rect class="gain" x="582" y="662" width="480" height="8" rx="4"/></g>
</g>

<g id="s8" opacity="0">
<g id="ml"><text class="m" x="143" y="260" font-size="26">TONIGHT, NAME THE ONE THING YOU WANT</text><text class="m" x="143" y="300" font-size="26">SO BADLY YOU WOULD RIDE A FREIGHT TRAIN</text></g>
<g id="qa"><text class="d" x="136" y="460" font-size="88" letter-spacing="-2">What is your</text></g>
<g id="qb"><text class="d" x="136" y="570" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Edison?</text></g>
<g id="ft"><text class="m" x="143" y="700" font-size="26">FIND YOUR BURNING DESIRE</text></g>
<g id="mir"><ellipse class="s-ink" cx="1260" cy="470" rx="120" ry="170" fill="var(--stage)" stroke-width="8"/><path id="mf" class="gain"/><path class="s-line" d="M1190 400q10-50 50-80" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M1260 640V740M1190 740h140" stroke-width="8" stroke-linecap="round"/></g>
</g>