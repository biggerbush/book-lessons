<text class="d5" x="310" y="360" font-size="32">Preserved the union</text>
<text class="d5" x="310" y="405" font-size="32">and freed the slaves.</text></g>
<g id="bc"><rect class="s-line" x="840" y="220" width="640" height="240" rx="18" fill="var(--stage)" stroke-width="3"/>
