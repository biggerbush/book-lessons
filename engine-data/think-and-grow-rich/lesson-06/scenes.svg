<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Decide fast,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">persist longer.</text>
<text class="b" x="120" y="600" font-size="32">Why quitting too soon may cost you the gold you were after.</text>
<rect x="1180" y="300" width="300" height="460" fill="var(--line)"/>
<path class="gain" d="M1180 700L1480 660V710L1180 750z"/>
<rect id="shaft" x="1290" y="300" width="60" height="0" fill="var(--stage)"/>
<path class="s-ink" d="M1160 300H1480" stroke-width="6" stroke-linecap="round"/>
<g id="tf0"><path class="s-loss" d="M1362 604h24M1374 604v52M1362 656h24" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="1396" y="640" font-size="26" style="fill:var(--loss)">3 FT</text></g>
<g id="pick"><path class="s-ink" d="M0 0L50-70" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M10-95Q55-95 85-45" fill="none" stroke-width="10" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Gold fever.</text>
<text class="b" x="120" y="176" font-size="32">During the gold rush, Darby’s uncle heads west to dig.</text>
<rect x="120" y="640" width="1360" height="200" fill="var(--line)"/>
<path class="s-line" d="M1250 640L1365 410L1480 640" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect id="hole" x="840" y="640" width="80" height="0" fill="var(--stage)"/>
<path class="s-ink" d="M120 640H1480" stroke-width="6"/>
<g id="west"><text class="m" x="120" y="270" font-size="22">HEADING WEST</text><path class="s-muted" d="M120 300h300m-20-16 20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="unc"></g>
<g id="claim"><path class="s-ink" d="M880 640V500" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M880 500h70l-14 20 14 20h-70z"/><text class="m" x="880" y="480" font-size="20" text-anchor="middle">CLAIM</text></g>
<g id="ore"><circle class="gain" cx="858" cy="768" r="13"/><circle class="gain" cx="884" cy="776" r="11"/><circle class="gain" cx="904" cy="762" r="9"/><text class="m" x="940" y="776" font-size="20" style="fill:var(--gain)">SHINING GOLD ORE</text></g>
<g id="mach"><path class="s-ink" d="M1040 640L1120 440L1200 640M1120 440V590" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linejoin="round"/><rect class="s-ink" x="1090" y="590" width="60" height="40" fill="var(--stage)" stroke-width="5" stroke-dasharray="8 8"/><text class="m" x="1120" y="410" font-size="20" text-anchor="middle">NEEDS MACHINERY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Going all in.</text>
<text class="b" x="120" y="176" font-size="32">He covers the mine and heads home to Maryland.</text>
<g id="home"><path class="s-ink" d="M140 400L260 300L380 400" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-ink" x="165" y="400" width="190" height="140" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="240" y="470" width="40" height="70"/><text class="m" x="260" y="590" font-size="22" text-anchor="middle">MARYLAND</text></g>
<g id="nb"></g>
<g id="bag"><path class="gain" d="M790 430h60l-10 20c40 20 50 60 40 80h-120c-10-20 0-60 40-80z"/><text class="d" x="820" y="515" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">$</text><text class="m" x="820" y="580" font-size="20" text-anchor="middle">RAISED THE MONEY</text></g>
<g id="coins"></g>
<path class="s-ink" d="M1300 700V560a80 80 0 0 1 160 0V700" fill="var(--stage)" stroke-width="6"/>
<g id="planks"><path class="s-loss" d="M1300 580l160 50M1300 660l160-50" stroke-width="12" stroke-linecap="round"/></g>
<path class="s-ink" d="M940 700H1480" stroke-width="6"/>
<g id="pair"><text class="m" x="1070" y="538" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOUNG DARBY</text></g>
<g id="cart"><path class="s-ink" d="M-70-60h140l-16 50h-108z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="-36" cy="-70" r="14"/><circle class="gain" cx="-4" cy="-76" r="16"/><circle class="gain" cx="30" cy="-70" r="14"/><circle class="ink" cx="-36" cy="0" r="10"/><circle class="ink" cx="36" cy="0" r="10"/></g>
<g id="rich"><text class="m" x="940" y="780" font-size="22" style="fill:var(--gain)">ONE OF THE RICHEST MINES IN COLORADO</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The vein vanishes.</text>
<text class="b" x="120" y="176" font-size="32">Then something terrible happened.</text>
<rect x="120" y="220" width="1360" height="420" fill="var(--line)"/>
<rect class="gain" x="120" y="470" width="520" height="30"/>
<rect id="tun" x="120" y="400" width="480" height="60" fill="var(--stage)"/>
<path id="drill" class="ink" d="M0-24L40 0L0 24z"/>
<g id="gone"><path class="s-ink" d="M660 240L640 630" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="680" y="280" font-size="22" style="fill:var(--loss)">THE VEIN DISAPPEARED</text></g>
<g id="bare"><text class="m" x="880" y="540" font-size="22" text-anchor="middle">ONLY BARE ROCK</text></g>
<g id="quit"><circle class="loss" cx="1220" cy="430" r="34"/><path d="M1206 416l28 28M1234 416l-28 28" stroke="var(--stage)" stroke-width="7" stroke-linecap="round"/><text class="d" x="1220" y="360" font-size="40" text-anchor="middle" style="fill:var(--loss)">They quit.</text></g>
<g id="mc"><rect class="s-ink" x="-60" y="-60" width="120" height="50" rx="6" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="0" cy="-35" r="14" fill="none" stroke-width="5"/><circle class="ink" cx="-36" cy="0" r="12"/><circle class="ink" cx="36" cy="0" r="12"/></g>
<g id="jm"></g>
<g id="sold"><text class="m" x="900" y="760" font-size="22">SOLD TO A JUNK MAN</text><text class="m" x="900" y="796" font-size="22" style="fill:var(--loss)">FOR A FEW HUNDRED DOLLARS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Just three feet.</text>
<rect x="120" y="300" width="1360" height="360" fill="var(--line)"/>
<path class="s-ink" d="M120 300H1480" stroke-width="6"/>
<rect class="gain" x="120" y="490" width="440" height="30"/>
<rect x="120" y="420" width="720" height="60" fill="var(--stage)"/>
<g id="eng"><text class="m" x="1240" y="210" font-size="20">MINING ENGINEER</text></g>
<g id="flt"><path class="s-ink" d="M600 310L560 650" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="586" y="350" font-size="20" text-anchor="end">FAULT LINE</text></g>
<path id="shf" class="s-gain" d="M570 535C700 640 870 600 925 490" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="tf"><rect class="gain" x="920" y="425" width="540" height="50"/><path class="s-loss" d="M840 396v-20M840 386h80M920 396v-20" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="880" y="360" font-size="32" text-anchor="middle" style="fill:var(--loss)">3 feet</text></g>
<g id="mil"><text class="m" x="120" y="730" font-size="22">THE JUNK MAN TOOK</text><text class="d" x="120" y="820" font-size="76" style="fill:var(--gain)">Millions in ore.</text></g>
<g id="stk"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Darby’s comeback.</text>
<text class="b" x="120" y="176" font-size="32">He never forgot the three feet.</text>
<path class="s-ink" d="M120 600H1000" stroke-width="6"/>
<g id="dby"></g>
<g id="th"><circle class="s-gain" cx="236" cy="370" r="6" fill="none" stroke-width="4"/><circle class="s-gain" cx="226" cy="342" r="9" fill="none" stroke-width="4"/><rect class="s-gain" x="170" y="260" width="140" height="64" rx="32" fill="var(--stage)" stroke-width="5"/><text class="m" x="240" y="300" font-size="22" text-anchor="middle" style="fill:var(--gain)">3 FEET</text></g>
<g id="pol"><rect class="s-ink" x="380" y="400" width="130" height="170" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M404 450h82M404 490h82M404 530h50" stroke-width="6" stroke-linecap="round"/><text class="m" x="445" y="644" font-size="22" text-anchor="middle">LIFE INSURANCE</text></g>
<g id="cus"></g>
<line id="goL" class="s-gain" x1="960" y1="480" x2="960" y2="480" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
<path id="goH" class="s-gain" d="M1184 464l20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="goT"><text class="m" x="1080" y="450" font-size="20" text-anchor="middle" style="fill:var(--gain)">KEPT GOING</text></g>
<g id="every"><text class="b" x="120" y="760" font-size="32">Every “no” reminded him of the three feet.</text></g>
<g id="tro"><path class="gain" d="M1200 300h180v60a90 90 0 0 1-180 0z"/><path class="s-gain" d="M1200 320h-30a40 40 0 0 0 40 60M1380 320h30a40 40 0 0 1-40 60" fill="none" stroke-width="8"/><rect class="gain" x="1275" y="448" width="30" height="52"/><rect class="gain" x="1225" y="500" width="130" height="24" rx="6"/><text class="m" x="1290" y="580" font-size="22" text-anchor="middle">OVER A MILLION DOLLARS</text><text class="m" x="1290" y="614" font-size="22" text-anchor="middle">OF INSURANCE A YEAR</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">One step beyond.</text>
<text class="b" x="120" y="176" font-size="32">Defeat is often temporary, even when it feels permanent.</text>
<path d="M160 780H340V700H520V620H700V540H880V460H1060V380H1240V300H1440V780z" fill="var(--line)"/>
<path class="s-ink" d="M160 780H340V700H520V620H700V540H880V460H1060V380H1240V300H1440" fill="none" stroke-width="6" stroke-linejoin="round"/>
<g id="bar"><path class="s-loss" d="M1060 460V320" stroke-width="10" stroke-linecap="round"/><text class="m" x="1044" y="344" font-size="22" text-anchor="end" style="fill:var(--loss)">DEFEAT</text></g>
<g id="win"><path class="gain" transform="translate(1150 300) scale(1.2)" d="M0-30l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z"/><text class="m" x="1150" y="240" font-size="22" text-anchor="middle" style="fill:var(--gain)">GREATEST WIN</text></g>
<g id="dots"></g>
<g id="most"><text class="d" x="120" y="850" font-size="44">Most people quit right at that step.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Decide fast. Change slowly.</text>
<text class="b" x="120" y="176" font-size="32">Hill pairs persistence with decision.</text>
<g id="sw"><circle class="s-ink" cx="260" cy="430" r="100" fill="var(--stage)" stroke-width="8"/><rect class="ink" x="240" y="300" width="40" height="22" rx="4"/><path id="hand" class="s-gain" d="M260 430V355" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="260" cy="430" r="10"/></g>
<g id="rA"><text class="m" x="480" y="300" font-size="22" style="fill:var(--gain)">SUCCESSFUL PEOPLE</text></g>
<g id="rB"><text class="m" x="480" y="470" font-size="22" style="fill:var(--loss)">PEOPLE WHO FAIL</text></g>
<g id="bars"></g>
<g id="anc"><circle class="s-ink" cx="1320" cy="330" r="20" fill="none" stroke-width="8"/><path class="s-ink" d="M1320 350V560M1270 390h100M1230 490q20 70 90 70t90-70" fill="none" stroke-width="10" stroke-linecap="round"/><text class="m" x="1320" y="620" font-size="22" text-anchor="middle" style="fill:var(--gain)">FIRM DECISION</text></g>
<g id="firm"><text class="d" x="120" y="740" font-size="46">A firm decision keeps you drilling</text><text class="d" x="120" y="800" font-size="46">when the rock looks bare.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which goal are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">close to giving up on?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Dig three more feet.</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">FIRST, ASK SOMEONE WITH EXPERTISE</text></g>
<rect x="1240" y="600" width="220" height="200" fill="var(--line)"/>
<rect id="hl8" x="1320" y="600" width="60" height="40" fill="var(--stage)"/>
<path class="s-ink" d="M1240 600H1460" stroke-width="6"/>
<circle id="nug" class="gain" cx="1350" cy="750" r="20"/>
<g id="shv"><path class="s-ink" d="M1400 420L1350 560" stroke-width="8" stroke-linecap="round"/><path class="ink" d="M1330 550l40 14-12 40-38-6z"/></g>
</g>