<rect class="s-ink" x="880" y="380" width="240" height="90" rx="14" fill="none" stroke-width="5"/>
<text class="d" x="1000" y="447" font-size="56" text-anchor="middle">LOSS</text>
<text class="m" x="880" y="540" font-size="22">OWN STANDARD</text>
<rect class="s-line" x="880" y="560" width="560" height="44" rx="22" fill="none" stroke-width="4"/>
<rect id="barR" class="gain" x="880" y="560" width="0" height="44" rx="22"/>
<text class="d5" x="880" y="700" font-size="36">A success by your measure.</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Inner vs outer scorecard.</text>
<text class="b" x="120" y="176" font-size="32">An idea from investor Warren Buffett.</text>
<g id="outerW"><g id="outer">
<rect class="s-ink" x="160" y="260" width="540" height="460" rx="20" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="200" y="320" font-size="24" style="fill:var(--muted)">OUTER SCORECARD</text>
<g id="oc"><text class="m" x="200" y="370" font-size="22" style="fill:var(--muted)">WHAT THE WORLD THINKS</text></g>
</g></g>
<g id="inner">
