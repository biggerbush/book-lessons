<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAME AS EVER · LESSON 3</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Happiness is</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">results minus</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">expectations.</text>
<text class="b" x="120" y="630" font-size="32">Why feeling rich depends on where you set the bar.</text>
<g id="raisebox">
<rect class="s-ink" x="1160" y="530" width="220" height="170" fill="var(--stage)" stroke-width="7"/>
<rect class="s-ink" x="1140" y="480" width="260" height="50" fill="var(--stage)" stroke-width="7"/>
<rect class="gain" x="1255" y="480" width="30" height="220"/>
<text class="m" x="1270" y="745" font-size="22" text-anchor="middle">RAISE</text>
</g>
<g id="texp"><path class="s-loss" d="M1100 0H1440" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text class="m" x="1440" y="-16" font-size="20" text-anchor="end" style="fill:var(--loss)">EXPECTED</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">It works like a balance.</text>
<text class="b" x="120" y="176" font-size="32">Morgan Housel’s simple formula for happiness.</text>
<g id="scl"><path class="s-ink" d="M800 330V720M690 720H910" stroke-width="10" stroke-linecap="round" fill="none"/><g id="beam"></g><g id="panL"></g><g id="panR"></g><circle class="ink" cx="800" cy="330" r="18"/></g>
<g id="fml"><text class="d" x="120" y="820" font-size="56">Happiness = <tspan style="fill:var(--gain)">results</tspan> − <tspan style="fill:var(--loss)">expectations</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two friends, one bonus.</text>
<text class="b" x="120" y="176" font-size="32">The same modest bonus lands in both accounts.</text>
<g id="fr">
<g id="f1"></g><g id="f2"></g>
<rect class="gain" x="480" y="450" width="80" height="200" rx="6"/>
<rect class="gain" x="1080" y="450" width="80" height="200" rx="6"/>
<text class="m" x="520" y="690" font-size="20" text-anchor="middle">BONUS</text>
<text class="m" x="1120" y="690" font-size="20" text-anchor="middle">BONUS</text>
</g>
<g id="lo">
<path class="s-loss" d="M460 640H640" stroke-width="5" stroke-dasharray="12 8"/>
<text class="m" x="650" y="646" font-size="20" style="fill:var(--loss)">EXPECTED NOTHING</text>
<path class="s-gain" d="M610 628V466M592 486l18-20 18 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="632" y="545" font-size="20" style="fill:var(--gain)">DELIGHTED</text>
<path d="M324 486q16 16 32 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="hi">
<path class="s-loss" d="M1060 250H1240" stroke-width="5" stroke-dasharray="12 8"/>
<text class="m" x="1250" y="256" font-size="20" style="fill:var(--loss)">EXPECTED DOUBLE</text>
<path class="s-loss" d="M1200 440V268M1182 288l18-20 18 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1222" y="360" font-size="20" style="fill:var(--loss)">CHEATED</text>
<path d="M944 498q16-16 32 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="moods"><text class="d" x="120" y="800" font-size="52">Same bank balance. Opposite moods.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">America after World War Two.</text>
<text class="b" x="120" y="176" font-size="32">Smaller homes and smaller paychecks than today.</text>
<g id="h50"><text class="m" x="390" y="770" font-size="22" text-anchor="middle">1950s</text></g>
<g id="today"><text class="m" x="1040" y="770" font-size="22" text-anchor="middle">TODAY</text></g>
<g id="modest"><text class="m" x="390" y="810" font-size="20" text-anchor="middle">MODEST BY TODAY’S STANDARDS</text></g>
<g id="well"><circle class="gain" cx="390" cy="340" r="46"/><path d="M370 348q20 22 40 0" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/><text class="m" x="460" y="348" font-size="22" style="fill:var(--gain)">DOING WELL</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone lived about the same.</text>
<text class="b" x="120" y="176" font-size="32">Similar houses, similar incomes, similar hopes.</text>
<g id="street"></g>
<g id="eqs"></g>
<g id="sim"><text class="m" x="800" y="650" font-size="22" text-anchor="middle">SIMILAR HOUSE · SIMILAR INCOME · MODEST FEELS NORMAL</text></g>
<g id="gapg">
<text class="m" x="120" y="736" font-size="20">RESULTS</text>
<text class="m" x="120" y="796" font-size="20">EXPECTED</text>
<rect id="rb" class="gain" x="300" y="712" width="0" height="32" rx="6"/>
<rect id="eb" class="loss" x="300" y="772" width="0" height="32" rx="6"/>
<text class="m" x="1230" y="796" font-size="22" style="fill:var(--gain)">SMALL GAP</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The goalposts moved.</text>
<text class="b" x="120" y="176" font-size="32">Incomes split apart, and screens showed the very top.</text>
<path class="s-ink" d="M220 260V760H1340" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="236" y="280" font-size="20">INCOME</text>
<text class="m" x="1340" y="790" font-size="20" text-anchor="end">DECADES →</text>
<g id="lines5"></g>
<text id="lb0" class="m" x="1355" y="266" font-size="20">TOP</text>
<text id="lb1" class="m" x="1355" y="566" font-size="20" style="fill:var(--gain)">TYPICAL</text>
<text id="lb2" class="m" x="1355" y="376" font-size="20" style="fill:var(--loss)">EXPECTED</text>
<g id="tv"><path class="s-ink" d="M650 262l-30-38M710 262l30-38" stroke-width="5" stroke-linecap="round"/><rect class="s-ink" x="560" y="260" width="240" height="160" rx="14" fill="var(--stage)" stroke-width="6"/><g id="tvh"></g></g>
<g id="behind"><text class="d" x="120" y="845" font-size="40">Richer than their grandparents, yet feeling behind.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two dials, not one.</text>
<text class="b" x="120" y="176" font-size="32">Happiness = results − expectations. Most of us only turn one.</text>
<g id="dls">
<g id="dials"></g>
<text class="m" x="480" y="625" font-size="22" text-anchor="middle" style="fill:var(--gain)">RESULTS</text>
<text class="m" x="1120" y="625" font-size="22" text-anchor="middle" style="fill:var(--loss)">EXPECTATIONS</text>
<text class="m" x="120" y="730" font-size="22">HAPPINESS</text>
<rect class="s-line" x="330" y="705" width="1000" height="36" rx="18" fill="none" stroke-width="3"/>
<rect id="hbar" class="gain" x="330" y="705" width="0" height="36" rx="18"/>
</g>
<g id="wh"><text class="m" x="480" y="360" font-size="20" text-anchor="middle">WORK HARDER</text></g>
<g id="lb"><text class="m" x="1120" y="360" font-size="20" text-anchor="middle" style="fill:var(--gain)">LOWER THE BAR</text></g>
<g id="strive"><text class="d" x="120" y="830" font-size="40">Keep striving. Just watch where your goalposts sit.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try this.</text>
<text class="b" x="120" y="176" font-size="32">Two checks before your next big purchase or promotion.</text>
<g id="nb">
<rect class="s-ink" x="160" y="280" width="500" height="440" rx="12" fill="var(--stage)" stroke-width="7"/>
<g id="spir"></g>
<text class="m" x="200" y="350" font-size="22">WHAT I EXPECT TO FEEL</text>
<g id="nlines"></g>
</g>
<g id="mir">
<text class="m" x="1100" y="252" font-size="22" text-anchor="middle">WHO AM I COMPARING TO?</text>
<ellipse class="s-ink" cx="1100" cy="490" rx="170" ry="210" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1100 700V770M1000 770H1200" stroke-width="8" stroke-linecap="round"/>
<g id="refl"></g>
</g>
<g id="phone"><rect class="s-loss" x="1020" y="360" width="160" height="260" rx="18" fill="var(--stage)" stroke-width="6"/><text class="m" x="1100" y="580" font-size="18" text-anchor="middle">HIGHLIGHTS</text></g>
<g id="reel"><text class="d" x="120" y="840" font-size="36">Is your bar being set by someone else’s highlight reel?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="400" font-size="76" letter-spacing="-2">Where in your life are</text></g>
<g id="qb"><text class="d" x="136" y="500" font-size="76" letter-spacing="-2">your results good, but your</text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="76" letter-spacing="-2"><tspan style="fill:var(--loss)">expectations</tspan> ran ahead?</text></g>
<g id="qm"><circle class="gain" cx="1370" cy="230" r="70"/><text class="d" x="1370" y="262" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="nudge">
