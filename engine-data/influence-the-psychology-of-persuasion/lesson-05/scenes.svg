<g id="tx1"><text class="d" x="120" y="720" font-size="42">Bad news sticks to the messenger.</text></g>
<g id="tx2"><text class="d" x="120" y="800" font-size="42">Stars lend their glow to the product.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your defence.</text>
<text class="b" x="120" y="176" font-size="32">Don’t block every source of liking. Notice it, then separate.</text>
