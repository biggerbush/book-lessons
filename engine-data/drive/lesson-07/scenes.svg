</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then build the rest.</text>
<text class="b" x="120" y="176" font-size="32">Once pay is settled, build on three blocks.</text>
<g id="slab"><rect class="ink" x="120" y="720" width="680" height="70" rx="8"/><text class="m" x="460" y="764" font-size="22" text-anchor="middle" style="fill:var(--stage)">FAIR PAY</text></g>
<g id="b0"><rect class="gain" x="140" y="440" width="200" height="270" rx="10"/><text class="m" x="240" y="590" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">AUTONOMY</text></g>
<g id="b1"><rect class="gain" x="360" y="440" width="200" height="270" rx="10"/><text class="m" x="460" y="590" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">MASTERY</text></g>
<g id="b2"><rect class="gain" x="580" y="440" width="200" height="270" rx="10"/><text class="m" x="680" y="590" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">PURPOSE</text></g>
