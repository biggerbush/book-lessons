<rect x="680" y="220" width="700" height="190" rx="95" fill="var(--loss)" fill-opacity=".12" stroke="var(--loss)" stroke-width="5"/>
<text class="d5" x="1030" y="315" font-size="52" text-anchor="middle" style="fill:var(--loss)">“You should quit.”</text>
