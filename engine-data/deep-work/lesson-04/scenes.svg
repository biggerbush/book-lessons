<g id="s0">
<text class="m" x="120" y="150" font-size="28">DEEP WORK · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Train your brain to</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">embrace boredom.</text>
<text class="b" x="120" y="600" font-size="32">Why resisting your phone in idle moments sharpens your focus.</text>
<g id="t0fig"></g>
<path id="t0arm" class="s-ink" fill="none" stroke-width="16" stroke-linecap="round"/>
<rect id="t0ph" x="1398" y="600" width="44" height="76" rx="8" class="ink"/>
<circle id="t0glow" class="s-loss" cx="1420" cy="638" r="60" fill="none" stroke-width="4" opacity="0"/>
<rect class="ink" x="1150" y="700" width="330" height="8" rx="4"/>
<text class="m" x="1150" y="740" font-size="20">CHECKOUT LINE</text>
<g id="t0foc"><text class="m" x="1180" y="232" font-size="20">FOCUS</text><rect x="1180" y="250" width="300" height="24" rx="12" fill="none" class="s-ink" stroke-width="4"/><rect id="t0bar" class="gain" x="1180" y="250" width="300" height="24" rx="12"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Focus is a skill, not a trait.</text>
<text class="b" x="120" y="176" font-size="32">It grows with practice and fades with neglect.</text>
<g id="b1brain"></g>
<g id="b1trait"><text class="m" x="300" y="650" font-size="24" text-anchor="middle">A FIXED TRAIT?</text></g>
<line id="b1strike" class="s-loss" x1="180" y1="642" x2="180" y2="642" stroke-width="5" stroke-linecap="round"/>
<g id="b1db"><path class="s-ink" d="M220 740H380" stroke-width="10" stroke-linecap="round"/><rect class="gain" x="200" y="705" width="20" height="70" rx="4"/><rect class="gain" x="380" y="705" width="20" height="70" rx="4"/><rect class="ink" x="186" y="718" width="14" height="44" rx="4"/><rect class="ink" x="400" y="718" width="14" height="44" rx="4"/><text class="d5" x="300" y="830" font-size="34" text-anchor="middle">It’s a skill.</text></g>
<g id="b1paths"><path class="s-gain" d="M490 450H700L1120 300" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-loss" d="M700 450L1120 600" fill="none" stroke-width="6" stroke-linecap="round"/><rect class="gain" x="1140" y="260" width="340" height="80" rx="40"/><text class="d5" x="1310" y="313" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Focus</text><rect x="1140" y="560" width="340" height="80" rx="40" fill="var(--stage)" class="s-loss" stroke-width="5"/><text class="d5" x="1310" y="613" font-size="36" text-anchor="middle" style="fill:var(--loss)">Distraction</text><text class="m" x="1310" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">THE WRONG DIRECTION</text><circle id="b1dot" class="loss" r="14"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Nass findings.</text>
<text class="b" x="120" y="176" font-size="32">Stanford researcher Clifford Nass studied constant multitaskers.</text>
<g id="n2res"><g id="n2fig"></g><rect class="s-ink" x="300" y="400" width="70" height="90" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M315 425h40M315 445h40M315 465h26" stroke-width="5" stroke-linecap="round"/><text class="m" x="120" y="560" font-size="20">CLIFFORD NASS · STANFORD</text><text class="m" x="120" y="592" font-size="20">CONSTANT MULTITASKERS</text></g>
<g id="n2fun"><g id="n2dots"></g><path class="s-ink" d="M560 420H960L800 560V620M560 420L720 560V620" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="760" y="830" font-size="20" text-anchor="middle">CAN’T FILTER OUT THE IRRELEVANT</text></g>
<g id="n2brain"><g id="n2b"></g><g id="n2spk"></g><text class="d5" x="1250" y="660" font-size="34" text-anchor="middle">Hard to calm.</text><text class="m" x="1250" y="700" font-size="20" text-anchor="middle">WIRED FOR CONSTANT NOVELTY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every idle moment, filled.</text>
<text class="b" x="120" y="176" font-size="32">Your brain learns that boredom is never allowed.</text>
<g id="i3clock"><circle cx="260" cy="380" r="100" fill="var(--stage)" class="s-ink" stroke-width="7"/><g id="i3ticks"></g><line id="i3hand" x1="260" y1="380" x2="260" y2="300" class="s-loss" stroke-width="7" stroke-linecap="round"/><line x1="260" y1="380" x2="310" y2="380" class="s-ink" stroke-width="7" stroke-linecap="round"/><circle cx="260" cy="380" r="9" class="ink"/></g>
<g id="i3slots"><text class="m" x="470" y="300" font-size="20">IDLE MOMENTS EACH DAY</text><g id="i3sl"></g></g>
<g id="i3glow"><text class="m" x="470" y="480" font-size="20" style="fill:var(--loss)">EVERY GAP FILLED WITH A SCREEN</text></g>
<g id="i3door"><text class="d5" x="120" y="640" font-size="38">Hard task ahead?</text><text class="d5" x="120" y="690" font-size="38">Your mind looks for escape.</text><rect x="900" y="520" width="160" height="300" rx="6" fill="var(--stage)" class="s-ink" stroke-width="6"/><text class="m" x="980" y="570" font-size="18" text-anchor="middle">HARD TASK</text><path class="s-ink" d="M1012 662v-14a13 13 0 0 1 26 0v14" fill="none" stroke-width="5"/><rect class="loss" x="1004" y="660" width="42" height="36" rx="6"/><g id="i3mind"></g><path id="i3hit" class="s-loss" d="M884 548l-22-18M880 572h-28" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Flip the breaks.</text>
<text class="b" x="120" y="176" font-size="32">Take breaks from focus, not breaks from distraction.</text>
<g id="f4top"><text class="m" x="120" y="270" font-size="22">DON’T: BREAKS FROM DISTRACTION TO FOCUS</text><rect class="loss" x="120" y="300" width="1360" height="80" rx="16"/><rect class="gain" x="400" y="300" width="80" height="80"/><rect class="gain" x="800" y="300" width="80" height="80"/><rect class="gain" x="1200" y="300" width="80" height="80"/></g>
<line id="f4x" class="s-ink" x1="110" y1="340" x2="110" y2="340" stroke-width="8" stroke-linecap="round"/>
<g id="f4bot"><text class="m" x="120" y="480" font-size="22" style="fill:var(--gain)">DO: BREAKS FROM FOCUS TO USE DISTRACTION</text><rect class="gain" x="120" y="510" width="1360" height="80" rx="16"/><g id="f4blk"></g></g>
<g id="f4cal"><g id="f4tk"></g><text class="m" x="490" y="645" font-size="18" text-anchor="middle" style="fill:var(--loss)">ONLINE</text><text class="m" x="930" y="645" font-size="18" text-anchor="middle" style="fill:var(--loss)">ONLINE</text><text class="m" x="1330" y="645" font-size="18" text-anchor="middle" style="fill:var(--loss)">ONLINE</text><text class="d5" x="120" y="730" font-size="40">Schedule internet time in advance.</text><text class="m" x="120" y="780" font-size="22">STAY OFFLINE OUTSIDE THOSE BLOCKS</text><rect x="1000" y="670" width="160" height="150" rx="10" fill="var(--stage)" class="s-ink" stroke-width="6"/><rect class="ink" x="1000" y="670" width="160" height="32" rx="8"/><g id="f4cells"></g></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The notepad rule.</text>
<text class="b" x="120" y="176" font-size="32">Write down when your next internet block begins.</text>
<g id="n5pad"><rect x="140" y="250" width="360" height="470" rx="14" fill="var(--stage)" class="s-ink" stroke-width="6"/><rect class="gain" x="143" y="253" width="354" height="38" rx="11"/><text class="m" x="170" y="340" font-size="20">NEXT INTERNET BLOCK</text><circle cx="220" cy="410" r="36" fill="none" class="s-ink" stroke-width="5"/><path class="s-ink" d="M220 410v-22M220 410h16" stroke-width="5" stroke-linecap="round"/><path class="s-gain" d="M280 425h190" stroke-width="5" stroke-linecap="round"/></g>
<g id="n5list"><text class="m" x="170" y="510" font-size="20">LOOK IT UP LATER</text><path id="n5l0" class="s-ink" d="M170 560h250" stroke-width="5" stroke-linecap="round"/><path id="n5l1" class="s-ink" d="M170 610h200" stroke-width="5" stroke-linecap="round"/><path id="n5l2" class="s-ink" d="M170 660h230" stroke-width="5" stroke-linecap="round"/></g>
<g id="n5hg"><polygon id="n5st" class="gain"/><polygon id="n5sb" class="gain"/><line id="n5sr" class="s-gain" x1="740" y1="450" x2="740" y2="610" stroke-width="4"/><path class="s-ink" d="M670 290L810 290L750 450L810 610L670 610L730 450Z" fill="none" stroke-width="6" stroke-linejoin="round"/><rect class="ink" x="650" y="276" width="180" height="14" rx="5"/><rect class="ink" x="650" y="610" width="180" height="14" rx="5"/><text class="d5" x="740" y="700" font-size="34" text-anchor="middle">Need to look it up? Wait.</text><text class="m" x="740" y="745" font-size="20" text-anchor="middle">UNTIL YOUR NEXT BLOCK</text></g>
<g id="n5home"><path d="M1040 470L1240 310L1440 470V720H1040Z" fill="var(--stage)" class="s-ink" stroke-width="6" stroke-linejoin="round"/><rect x="1300" y="480" width="90" height="64" fill="none" class="s-ink" stroke-width="5"/><circle cx="1345" cy="512" r="18" class="gain"/><circle cx="1355" cy="505" r="15" fill="var(--stage)"/><rect class="gain" x="1100" y="560" width="200" height="50" rx="12"/><rect class="gain" x="1080" y="600" width="240" height="70" rx="14"/><g id="n5fig"></g><text class="m" x="1240" y="780" font-size="20" text-anchor="middle">AT HOME, IN THE EVENINGS TOO</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Productive meditation.</text>
<text class="b" x="120" y="176" font-size="32">Think about one problem while you move.</text>
<g id="w6path"><path d="M120 760C500 640 900 820 1480 700" fill="none" class="s-line" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/><g id="w6walk"></g></g>
<g id="w6l0"><text class="m" x="120" y="300" font-size="22">A WALK</text></g>
<g id="w6l1"><text class="m" x="120" y="340" font-size="22">A JOG</text></g>
<g id="w6l2"><text class="m" x="120" y="380" font-size="22">A COMMUTE</text></g>
<g id="w6bulb"><path class="s-gain" d="M800 250v-40M720 290l-28-22M880 290l28-22M690 370h-36M910 370h36" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="800" cy="350" r="70"/><rect class="ink" x="772" y="424" width="56" height="18" rx="4"/><rect class="ink" x="780" y="446" width="40" height="14" rx="4"/><text class="m" x="800" y="510" font-size="22" text-anchor="middle">ONE WELL-DEFINED PROBLEM</text></g>
<g id="w6back"><path class="s-gain" d="M1160 290Q1060 420 890 370" fill="none" stroke-width="5" stroke-dasharray="10 8"/><path class="s-gain" d="M914 350l-24 20 28 8" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1180" y="470" font-size="20">MENTAL REPS</text><g id="w6reps"></g></g>
<circle id="w6dot" class="loss" r="14"/>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Roosevelt dash.</text>
<text class="b" x="120" y="176" font-size="32">Short, fiercely focused bursts of work.</text>
<g id="r7ted"><g id="r7fig"></g><rect class="gain" x="220" y="420" width="80" height="50" rx="5"/><path d="M260 420v50" stroke="var(--stage)" stroke-width="4"/><text class="m" x="120" y="550" font-size="20">T. ROOSEVELT · HARVARD</text><g id="r7bursts"></g><text class="m" x="120" y="720" font-size="20">SHORT, FIERCE BURSTS</text></g>
<g id="r7sw"><rect class="ink" x="780" y="262" width="40" height="20" rx="4"/><rect class="ink" x="792" y="280" width="16" height="12"/><circle cx="800" cy="430" r="140" fill="var(--stage)"/><path class="gain" fill-opacity=".35" d="M800 430V300A130 130 0 0 1 930 430Z"/><circle cx="800" cy="430" r="140" fill="none" class="s-ink" stroke-width="8"/><line id="r7hand" x1="800" y1="430" x2="800" y2="315" class="s-loss" stroke-width="8" stroke-linecap="round"/><circle cx="800" cy="430" r="10" class="ink"/><text class="m" x="800" y="620" font-size="20" text-anchor="middle">SET A TIGHT DEADLINE</text></g>
<g id="r7race"><path class="s-line" d="M1000 470H1400" stroke-width="5" stroke-dasharray="12 10"/><circle id="r7run" class="gain" cx="1010" cy="450" r="16"/><text class="d5" x="1200" y="540" font-size="36" text-anchor="middle">Race it.</text></g>
<g id="r7flag"><path class="s-ink" d="M1400 470V290" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1400 290h70v50h-70z"/></g>
<g id="r7end"><text class="d" x="120" y="800" font-size="44">Each dash makes your focus stronger.</text><rect id="r7bar" class="gain" x="124" y="822" width="0" height="12" rx="6"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Next time you wait</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">in line, leave your</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">phone</tspan> in your pocket.</text></g>
<rect id="c8ph" class="ink" x="1300" y="220" width="80" height="140" rx="12"/>
<path d="M1230 410h220v130q-110 80-220 0z" fill="var(--stage)" class="s-ink" stroke-width="7" stroke-linejoin="round"/>
<path class="s-gain" d="M1244 430h192" stroke-width="4" stroke-dasharray="10 8"/>
<g id="c8tag"><text class="m" x="143" y="700" font-size="26">STAND THERE, A LITTLE BORED. LET FOCUS GROW.</text><rect id="c8bar" class="gain" x="143" y="730" width="0" height="14" rx="7"/></g>
</g>