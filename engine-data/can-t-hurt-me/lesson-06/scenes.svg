<g id="notend"><text class="d" x="680" y="720" font-size="56" style="fill:var(--gain)">Pain, but not the end.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The military habit.</text>
<text class="b" x="120" y="176" font-size="32">Teams review every mission afterward, win or lose.</text>
<g id="sold"></g>
<g id="wl"><text class="m" x="120" y="620" font-size="22">EVERY MISSION · WIN OR LOSE</text></g>
<g id="rep">
