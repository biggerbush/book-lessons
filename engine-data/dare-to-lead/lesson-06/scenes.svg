<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Braving trust,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">behavior by behavior.</text>
<text class="b" x="120" y="600" font-size="32">Turn one big, scary word into seven behaviors teams can discuss.</text>
<rect class="s-ink" x="1250" y="250" width="160" height="34" rx="8" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="1180" y="290" width="300" height="260" rx="40" fill="var(--stage)" stroke-width="7"/>
