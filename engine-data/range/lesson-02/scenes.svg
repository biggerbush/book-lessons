<g id="s0">
<text class="m" x="120" y="150" font-size="28">RANGE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Kind Worlds and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Wicked Worlds.</text>
<text class="b" x="120" y="600" font-size="32">Why practice pays off in some places and misleads in others</text>
<g id="tBoard"><g id="tSq"></g><text class="m" x="1128" y="510" font-size="20" text-anchor="middle" style="fill:var(--gain)">KIND</text></g>
<g id="tStorm"><g id="tRain"></g><circle class="loss" cx="1310" cy="320" r="40"/><circle class="loss" cx="1370" cy="300" r="50"/><circle class="loss" cx="1428" cy="326" r="34"/><rect class="loss" x="1300" y="320" width="140" height="40" rx="20"/><text class="m" x="1370" y="510" font-size="20" text-anchor="middle" style="fill:var(--loss)">WICKED</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of world.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Robin Hogarth gave them names.</text>
<path class="s-line" d="M160 720H1440" stroke-width="5" stroke-linecap="round"/>
<g id="hog"><text class="m" x="800" y="570" font-size="22" text-anchor="middle">ROBIN HOGARTH</text><text class="m" x="800" y="602" font-size="18" text-anchor="middle">PSYCHOLOGIST</text></g>
<g id="kSign"><rect class="ink" x="392" y="490" width="16" height="230"/><rect class="gain" x="220" y="380" width="360" height="110" rx="12"/><circle cx="280" cy="435" r="20" fill="none" stroke="var(--on-gain)" stroke-width="5"/><path d="M280 400v-6M280 470v6M245 435h-6M315 435h6" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/><text class="d" x="334" y="452" font-size="48" style="fill:var(--on-gain)">KIND</text><text class="m" x="400" y="770" font-size="20" text-anchor="middle">SAME RULES · FAST FEEDBACK</text></g>
<g id="wSign"><rect class="ink" x="1192" y="490" width="16" height="230"/><rect class="loss" x="1020" y="380" width="360" height="110" rx="12"/><path d="M1046 450l12-30 12 30 12-30 12 30 12-30 12 30" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1136" y="452" font-size="48" style="fill:var(--stage)">WICKED</text><text class="m" x="1200" y="770" font-size="20" text-anchor="middle">SHIFTING RULES · LATE FEEDBACK</text></g>
<g id="sum1"><text class="d" x="120" y="842" font-size="44">It’s all about rules and feedback.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Golf and chess are kind.</text>
<text class="b" x="120" y="176" font-size="32">Same rules. Quick, honest feedback.</text>
<g id="golfP"><rect class="s-line" x="120" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">GOLF</text>
<path class="s-line" d="M160 600H720" stroke-width="6" stroke-linecap="round"/><path class="ink" d="M214 600v-10h12v10z"/><ellipse class="ink" cx="640" cy="602" rx="18" ry="5"/>
<path class="s-ink" d="M640 600V420" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M640 420l60 25-60 25z"/>
<circle id="gBall" class="ink" cx="220" cy="588" r="10"/></g>
<g id="gRule"><text class="m" x="150" y="664" font-size="20">THE RULES STAY THE SAME</text></g>
<g id="gSee"><text class="m" x="150" y="702" font-size="20" style="fill:var(--gain)">YOU SEE THE RESULT RIGHT AWAY</text></g>
<g id="chessP"><rect class="s-line" x="840" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="22">CHESS</text><g id="cBoard"></g><text class="m" x="1160" y="690" font-size="20" text-anchor="middle">CLEAR RULES · HONEST FEEDBACK</text></g>
<g id="kPay"><text class="d" x="120" y="820" font-size="46">Here, early practice and repetition pay off.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Masters see patterns.</text>
<text class="b" x="120" y="176" font-size="32">Their memory works best on positions that really happen.</text>
<g id="gm"><g id="gmP"></g><path class="s-muted" d="M272 372L530 410" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="240" y="590" font-size="20" text-anchor="middle">CHESS MASTER</text></g>
<g id="rgB"><g id="rgS"></g><text class="m" x="540" y="604" font-size="20">REAL GAME</text><rect class="s-line" x="540" y="616" width="288" height="28" rx="6" fill="none" stroke-width="3"/><rect id="rb0" class="gain" x="540" y="616" width="0" height="28" rx="6"/></g>
<g id="rl0"><text class="m" x="540" y="690" font-size="20" style="fill:var(--gain)">RECALLED REMARKABLY WELL</text></g>
<g id="rdB"><g id="rdS"></g><text class="m" x="1060" y="604" font-size="20">RANDOM PIECES</text><rect class="s-line" x="1060" y="616" width="288" height="28" rx="6" fill="none" stroke-width="3"/><rect id="rb1" class="loss" x="1060" y="616" width="0" height="28" rx="6"/></g>
<g id="rl1"><text class="m" x="1060" y="690" font-size="20" style="fill:var(--loss)">ADVANTAGE MOSTLY DISAPPEARS</text></g>
<g id="pat"><text class="d" x="120" y="800" font-size="46">Kind worlds repeat their patterns constantly.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wicked worlds are different.</text>
<text class="b" x="120" y="176" font-size="32">Unclear, shifting rules. Late or wrong feedback.</text>
<g id="mz"><path class="s-ink" d="M240 240H640V640M640 720H160V240M240 320H480M560 240V400M160 400H320V560M400 400V640H560M480 480H640M240 640H320" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="200" cy="280" r="14"/></g>
<path id="mw" class="s-loss" d="M480 560h80" stroke-width="10" stroke-linecap="round" opacity="0"/>
<g id="ruleL"><text class="m" x="400" y="768" font-size="22" text-anchor="middle" style="fill:var(--loss)">RULES KEEP CHANGING</text></g>
<g id="clk"><circle class="s-ink" cx="1000" cy="440" r="110" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g><path id="hand" class="s-loss" d="M1000 440V350" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1000" cy="440" r="9"/><text class="m" x="1000" y="600" font-size="22" text-anchor="middle">FEEDBACK ARRIVES…</text></g>
<g id="f0"><text class="d5" x="1180" y="390" font-size="52">Late.</text></g>
<g id="f1"><text class="d5" x="1180" y="460" font-size="52">Wrong.</text></g>
<g id="f2"><text class="d5" x="1180" y="530" font-size="52" style="fill:var(--loss)">Never.</text></g>
<g id="most"><text class="d" x="760" y="720" font-size="46">Most of work and life</text><text class="d" x="760" y="776" font-size="46">looks like this.</text><text class="m" x="760" y="826" font-size="20">FROM MEDICINE TO BUSINESS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The tongue doctor.</text>
<text class="b" x="120" y="176" font-size="32">Early 1900s New York: a doctor famous for spotting typhoid.</text>
<g id="doc"><g id="docP"></g><circle cx="280" cy="388" r="11" fill="var(--stage)" class="s-ink" stroke-width="4"/><text class="m" x="280" y="590" font-size="20" text-anchor="middle">THE DOCTOR</text></g>
<g id="pts"><text class="m" x="1000" y="590" font-size="20" text-anchor="middle">PATIENTS</text></g>
<g id="germs"><path class="s-loss" d="M640 372q90-100 180 0q90-100 180 0q90-100 180 0q90-100 180 0" fill="none" stroke-width="3" stroke-dasharray="6 8"/></g>
<g id="hnd" opacity="0"><rect class="ink" x="-13" y="-4" width="26" height="28" rx="8"/><path class="s-ink" d="M-8 -2v-16M0 -4v-20M8 -2v-16M12 8l10-10" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="bub"><rect class="s-ink" x="130" y="206" width="380" height="92" rx="16" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M266 298l14 36 20-36" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/><path d="M270 296h26" stroke="var(--stage)" stroke-width="6"/><text class="m" x="320" y="262" font-size="26" text-anchor="middle" style="fill:var(--ink)">MY METHOD WORKS!</text></g>
<g id="bubX" opacity="0"><path class="s-loss" d="M538 226l52 52M590 226l-52 52" stroke-width="10" stroke-linecap="round"/></g>
<g id="gTxt"><text class="d" x="120" y="790" font-size="46">His unwashed hands spread the disease.</text><text class="m" x="120" y="838" font-size="20" style="fill:var(--loss)">FROM PATIENT TO PATIENT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">When practice misleads.</text>
<text class="b" x="120" y="176" font-size="32">Plenty of practice, plenty of feedback, the wrong lesson.</text>
<g id="b0"><rect class="s-ink" x="120" y="240" width="300" height="100" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="270" y="300" font-size="26" text-anchor="middle" style="fill:var(--ink)">PRACTICE</text></g>
<g id="b1"><path class="s-muted" d="M430 290h110m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="560" y="240" width="300" height="100" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="710" y="300" font-size="26" text-anchor="middle" style="fill:var(--ink)">FEEDBACK</text></g>
<g id="b2"><path id="ar2" d="M870 290h110m-18-18 18 18-18 18" fill="none" stroke="var(--muted)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect id="lb" x="1000" y="240" width="340" height="100" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text id="lt" class="m" x="1170" y="300" font-size="26" text-anchor="middle">LESSON</text></g>
<g id="loop1"><path class="s-muted" d="M1170 345C1170 430 270 430 270 345" fill="none" stroke-width="4" stroke-dasharray="10 10"/><path class="s-muted" d="M256 362l14-17 14 17" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="chart"><path class="s-ink" d="M160 480V740H900" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="900" y="776" font-size="20" text-anchor="end">REPETITIONS</text>
<path id="cf" class="s-loss" d="M160 720C400 700 600 560 900 500" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<path id="sk" class="s-muted" d="M160 720C400 712 600 706 900 704" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<text class="m" x="920" y="508" font-size="22" style="fill:var(--loss)">CONFIDENCE</text><text class="m" x="920" y="712" font-size="22">SKILL</text></g>
<g id="face"><circle class="s-ink" cx="1300" cy="600" r="80" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1272" cy="582" r="8"/><circle class="ink" cx="1328" cy="582" r="8"/><path class="s-ink" d="M1260 620q40 40 80 0" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="old"><text class="d" x="120" y="842" font-size="40">Old patterns feel trustworthy, even when things change.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Know your world.</text>
<text class="b" x="120" y="176" font-size="32">Before you double down on drills, ask which world you are in.</text>
<g id="qm"><text class="d" x="300" y="600" font-size="300" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="chk"><text class="m" x="520" y="320" font-size="22">ASK FIRST</text>
<rect class="s-ink" x="520" y="360" width="60" height="60" rx="10" fill="var(--stage)" stroke-width="5"/><text class="d" x="550" y="404" font-size="40" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="610" y="404" font-size="38">Rules stable?</text>
<rect class="s-ink" x="520" y="480" width="60" height="60" rx="10" fill="var(--stage)" stroke-width="5"/><text class="d" x="550" y="524" font-size="40" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="610" y="524" font-size="38">Fast, accurate feedback?</text></g>
<g id="lens"><polygon id="cone" class="gain" fill-opacity=".2"/><path class="s-ink" d="M1140 470q60-46 120 0q-60 46-120 0z" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1200" cy="470" r="14"/><g id="dots"></g><text class="m" x="1300" y="720" font-size="20" text-anchor="middle">YOUR VIEW</text></g>
<g id="wide"><text class="d5" x="120" y="810" font-size="36">If not: slow down, test assumptions, look beyond your usual cases.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qL"><text class="m" x="143" y="280" font-size="26">THINK OF ONE DECISION YOU MAKE OFTEN AT WORK</text></g>
<g id="qa"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">Is it <tspan style="fill:var(--gain)">golf</tspan>,</text></g>
<g id="qb"><text class="d" x="136" y="550" font-size="88" letter-spacing="-2">or is it a <tspan style="fill:var(--loss)">maze</tspan>?</text></g>
<g id="qK"><text class="m" x="143" y="690" font-size="26">KIND WORLD OR WICKED WORLD?</text></g>
<g id="mir"><g id="mirI"><ellipse class="s-ink" cx="1300" cy="420" rx="130" ry="170" fill="var(--stage)" stroke-width="8"/><rect class="ink" x="1286" y="590" width="28" height="150" rx="10"/>
<path class="s-ink" d="M1240 340V500M1215 500h50" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1240 340l50 20-50 20z"/>
<path class="s-loss" d="M1310 400h80v80h-80v-50M1330 420h40v40h-20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</g>