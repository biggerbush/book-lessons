<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Humble, helpful,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">immediate, in person.</text>
<text class="b" x="120" y="600" font-size="32">Four qualities that make feedback land, and where to give it.</text>
<g id="face">
<circle class="s-ink" cx="1300" cy="330" r="120" fill="var(--stage)" stroke-width="8"/>
<circle class="ink" cx="1258" cy="295" r="12"/><circle class="ink" cx="1342" cy="295" r="12"/>
<rect class="s-ink" x="1240" y="345" width="120" height="44" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1270 345v44M1300 345v44M1330 345v44" stroke-width="4"/>
<path id="spin0" class="loss" d="M1274 349h22v14l-6 8-6-6-10 4z"/>
</g>
<g id="qb0"><circle class="s-ink" cx="1440" cy="190" r="40" fill="var(--stage)" stroke-width="5"/><text class="d" x="1440" y="208" font-size="50" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The simplest candor.</text>
<text class="b" x="120" y="176" font-size="32">Pull them aside, tell them now, help them fix it.</text>
<path class="s-line" d="M160 600H1460" stroke-width="4"/>
<rect class="s-ink" x="1140" y="270" width="240" height="330" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="1350" cy="440" r="8"/>
<text class="m" x="1260" y="320" font-size="20" text-anchor="middle">MEETING</text>
<g id="col"></g>
<g id="you1"></g>
<g id="wb"><rect x="540" y="270" width="300" height="70" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><path class="gain" d="M660 338l8 26 20-26z"/><text class="m" x="690" y="313" font-size="22" text-anchor="middle" style="fill:var(--ink)">PSST · SPINACH</text></g>
<path id="ok1" class="s-gain" d="M890 350l16 16 30-34" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="120" y="670" font-size="22">FOUR QUALITIES</text>
<g id="q4"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Be humble.</text>
<g id="hb2"><text class="b" x="120" y="176" font-size="32">You might be wrong about what you saw.</text></g>
<g id="magw"><g id="mag">
<path class="s-ink" d="M465 555L560 650" stroke-width="26" stroke-linecap="round"/>
<circle class="s-ink" cx="380" cy="470" r="120" fill="var(--stage)" stroke-width="14"/>
<circle cx="350" cy="450" r="30" fill="var(--muted)" fill-opacity=".4"/><circle cx="412" cy="492" r="22" fill="var(--muted)" fill-opacity=".4"/><circle cx="366" cy="515" r="14" fill="var(--muted)" fill-opacity=".4"/>
</g></g>
<text id="qm" class="d" x="600" y="400" font-size="120" style="fill:var(--loss)">?</text>
<g id="bub2">
<rect class="s-ink" x="760" y="260" width="720" height="260" rx="28" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M890 517L880 588L950 517" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d5" x="800" y="370" font-size="40">“Here’s what I noticed.”</text>
<text class="d5" x="800" y="440" font-size="40">“Am I missing something?”</text>
<text class="m" x="800" y="490" font-size="20" style="fill:var(--gain)">MY VIEW, NOT THE TRUTH</text>
</g>
<g id="ppl2"></g>
<g id="corr"><path class="s-gain" d="M1290 755Q1090 805 902 757" fill="none" stroke-width="5" stroke-dasharray="10 9"/><path class="s-gain" d="M920 741L896 757L922 771" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1090" y="820" font-size="20" text-anchor="middle">INVITE THEM TO CORRECT YOU</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Be helpful.</text>
<text class="b" x="120" y="176" font-size="32">Feedback is a tool for them, not for you.</text>
<g id="tb">
<path class="s-ink" d="M280 330v-40h160v40" fill="none" stroke-width="10" stroke-linejoin="round"/>
<rect class="gain" x="160" y="330" width="400" height="190" rx="14"/>
<path d="M160 390h400" stroke="var(--stage)" stroke-width="6"/>
<rect class="ink" x="335" y="375" width="50" height="30" rx="6"/>
</g>
<g id="nf">
<text class="m" x="120" y="610" font-size="22">NOT FOR:</text>
<text class="d5" x="120" y="670" font-size="40">Venting</text>
<text class="d5" x="120" y="740" font-size="40">Proving you’re smart</text>
<line id="k3a" x1="112" y1="656" x2="290" y2="656" stroke="var(--loss)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<line id="k3b" x1="112" y1="726" x2="555" y2="726" stroke="var(--loss)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>
<g id="tg">
<circle class="s-ink" cx="1080" cy="470" r="180" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="1080" cy="470" r="120" fill="none" stroke-width="6"/>
<circle class="gain" cx="1080" cy="470" r="60"/>
<text class="m" x="1080" y="710" font-size="22" text-anchor="middle">AIM AT WHAT THEY CAN CHANGE</text>
</g>
<g id="arr" opacity="0"><path class="s-ink" d="M0 0L180-115" stroke-width="8" stroke-linecap="round"/><path class="ink" d="M0 0L35-8L22-28z"/><path class="s-gain" d="M160-102l22 22M174-112l22 22" stroke-width="6" stroke-linecap="round"/></g>
<g id="bo"><text class="d" x="1080" y="790" font-size="44" text-anchor="middle">They leave better off.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Be immediate.</text>
<text class="b" x="120" y="176" font-size="32">Talk while the moment is still fresh.</text>
<path class="s-line" d="M160 640H1460" stroke-width="6" stroke-linecap="round"/>
<g id="clk">
<circle class="s-ink" cx="260" cy="420" r="100" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g>
<line id="h1" class="s-ink" x1="260" y1="420" x2="260" y2="362" stroke-width="7" stroke-linecap="round"/>
<line id="h2" class="s-ink" x1="260" y1="420" x2="304" y2="420" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M260 625v30" stroke-width="6"/><text class="m" x="260" y="690" font-size="20" text-anchor="middle">IT HAPPENS</text>
</g>
<path id="arcL" d="M260 600Q780 460 1300 600" fill="none" stroke="var(--loss)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<path id="arcG" d="M260 600Q410 560 560 600" fill="none" stroke="var(--gain)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="cal">
<rect x="1180" y="300" width="240" height="240" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/>
<rect class="loss" x="1180" y="300" width="240" height="56" rx="14"/>
<path class="s-ink" d="M1230 286v30M1370 286v30" stroke-width="8" stroke-linecap="round"/>
<g id="calg"></g>
<path d="M1300 625v30" stroke="var(--loss)" stroke-width="6"/>
<text class="m" x="1300" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">ANNUAL REVIEW</text>
</g>
<g id="gone"><text class="m" x="960" y="490" font-size="20" text-anchor="middle" style="fill:var(--loss)">MONTHS LATER, THE MOMENT IS GONE</text></g>
<g id="sw">
<rect class="gain" x="548" y="318" width="24" height="22" rx="4"/>
<circle cx="560" cy="430" r="90" fill="var(--stage)" stroke="var(--gain)" stroke-width="8"/>
<line id="swh" class="s-ink" x1="560" y1="430" x2="560" y2="366" stroke-width="6" stroke-linecap="round"/>
<path d="M560 625v30" stroke="var(--gain)" stroke-width="6"/>
<text class="m" x="560" y="690" font-size="20" text-anchor="middle" style="fill:var(--gain)">2–3 MINUTES</text>
<text class="m" x="560" y="718" font-size="20" text-anchor="middle">RIGHT AFTER</text>
</g>
<g id="fast"><text class="d" x="120" y="810" font-size="44">Quick talks, right after it happens.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Be in person.</text>
<text class="b" x="120" y="176" font-size="32">Let them see your face and hear your tone.</text>
<g id="lap">
<rect class="s-ink" x="200" y="260" width="360" height="230" rx="12" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M150 490h460l-30 36H180z"/>
<text class="d5" x="240" y="350" font-size="40">Fix this.</text>
<path class="s-line" d="M240 395h260M240 435h180" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="bl"><text class="m" x="380" y="575" font-size="22" text-anchor="middle" style="fill:var(--loss)">TONE GETS LOST</text></g>
<g id="fc"><text class="m" x="1160" y="530" font-size="20" text-anchor="middle">YOU SEE HOW IT LANDS, AND ADJUST</text></g>
<g id="rk"><text class="m" x="120" y="625" font-size="22">BEST TO WORST</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">Private criticism. Public praise.</text>
<g id="pr">
<rect class="s-line" x="120" y="220" width="640" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M140 540H740" stroke-width="4"/>
<rect class="s-ink" x="580" y="290" width="130" height="250" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="600" cy="420" r="8"/>
<g id="pr6p"></g>
<text class="m" x="120" y="600" font-size="22">CRITICISM: USUALLY IN PRIVATE</text>
</g>
<g id="pu">
<rect class="s-line" x="840" y="220" width="640" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<polygon id="cone" class="gain" points="1160,244 1050,530 1270,530" fill-opacity=".25"/>
<rect class="ink" x="1138" y="228" width="44" height="22" rx="6"/>
<g id="pu6p"></g>
<text class="m" x="840" y="600" font-size="22">PRAISE: OFTEN IN PUBLIC</text>
</g>
<g id="r6o0"><text class="m" x="120" y="660" font-size="20" style="fill:var(--gain)">MAKE PRAISE SPECIFIC</text><text class="d5" x="120" y="708" font-size="36" style="fill:var(--muted)">“Great job.”</text>
<line id="k60" x1="112" y1="696" x2="370" y2="696" stroke="var(--ink)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="r6n0"><path class="s-muted" d="M520 696h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="620" y="708" font-size="36">“Your demo answered every question.”</text></g>
<g id="r6o1"><text class="m" x="120" y="760" font-size="20" style="fill:var(--gain)">DESCRIBE THE WORK, NOT THE PERSON</text><text class="d5" x="120" y="808" font-size="36" style="fill:var(--muted)">“You’re careless.”</text>
<line id="k61" x1="112" y1="796" x2="490" y2="796" stroke="var(--ink)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="r6n1"><path class="s-muted" d="M520 796h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="620" y="808" font-size="36">“This report has errors.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small, frequent, normal.</text>
<text class="b" x="120" y="176" font-size="32">Feedback becomes part of everyday work.</text>
<g id="big">
<rect class="loss" x="120" y="260" width="280" height="240" rx="16"/>
<text class="d" x="260" y="425" font-size="140" text-anchor="middle" style="fill:var(--stage)">!</text>
<text class="m" x="260" y="540" font-size="20" text-anchor="middle">ONE BIG EVENT</text>
<path id="bx" d="M140 280L380 480M380 280L140 480" stroke="var(--ink)" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>
<g id="notes"></g>
<g id="nlab"><path class="s-line" d="M480 448H1430" stroke-width="4"/><text class="m" x="480" y="485" font-size="20">MANY SMALL TALKS · EVERY DAY</text></g>
<g id="tm">
<path class="s-line" d="M950 780A150 150 0 0 1 1250 780" fill="none" stroke-width="18"/>
<path id="tarc" d="M950 780A150 150 0 0 1 1250 780" fill="none" stroke="var(--gain)" stroke-width="18" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<line id="ndl" class="s-ink" x1="1100" y1="780" x2="1100" y2="665" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1100" cy="780" r="14"/>
<text class="m" x="950" y="822" font-size="20" text-anchor="middle" style="fill:var(--loss)">DREAD</text>
<text class="m" x="1250" y="822" font-size="20" text-anchor="middle" style="fill:var(--gain)">TRUST</text>
</g>
<g id="tt"><text class="d" x="120" y="740" font-size="44">Quick and kind</text><text class="d" x="120" y="800" font-size="44">becomes trusted.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What will you tell</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">a teammate within</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">the hour, <tspan style="fill:var(--gain)">face to face</tspan>?</text></g>
<g id="gfx">
<rect class="gain" x="1358" y="198" width="24" height="22" rx="4"/>
<circle cx="1370" cy="300" r="80" fill="var(--stage)" stroke="var(--gain)" stroke-width="8"/>
<line id="gh" class="s-ink" x1="1370" y1="300" x2="1370" y2="242" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1370" y="420" font-size="22" text-anchor="middle" style="fill:var(--gain)">3 MIN</text>
</g>
<g id="qlab"><text class="m" x="143" y="700" font-size="26">THEN ASK HOW IT LANDED</text></g>
</g>