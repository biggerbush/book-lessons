<text class="m" x="670" y="480" font-size="20">FORECAST</text>
</g>
<g id="bl"><text class="m" x="1460" y="280" font-size="20" text-anchor="end" style="fill:var(--loss)">BLANK SPACES</text></g>
<g id="qm"></g>
<g id="easy"><text class="d" x="120" y="790" font-size="36">Easy-to-see dangers get prepared for, so they do less harm.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Prepare. Don’t predict.</text>
<text class="b" x="120" y="176" font-size="32">Could you cope with something you never saw coming?</text>
