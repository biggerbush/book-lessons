<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIVE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Eat and sleep</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">with purpose.</text>
<text class="b" x="120" y="600" font-size="32">Personalize your plate, protect your muscle, and guard your sleep.</text>
<g id="t_plate">
<path class="s-ink" d="M895 280v50M925 280v50M895 330h30M910 330v110M1210 280q30 40 0 90v70" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
