<path class="loss" d="M330 620l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z"/>
</g>
<g id="doubt"><ellipse class="s-ink" cx="200" cy="340" rx="70" ry="44" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="272" cy="390" r="8" fill="var(--stage)" stroke-width="3"/><circle class="s-ink" cx="288" cy="404" r="5" fill="var(--stage)" stroke-width="3"/><text class="d" x="200" y="358" font-size="54" text-anchor="middle" style="fill:var(--loss)">?</text></g>
