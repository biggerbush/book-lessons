<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PRACTICE · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Fear is the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">real block.</text>
<text class="b" x="120" y="600" font-size="32">Creative block is fear in disguise, and output is the cure.</text>
<g id="pg0"><rect class="s-ink" x="1180" y="240" width="240" height="320" rx="8" fill="var(--stage)" stroke-width="6"/><rect id="cur0" class="ink" x="1216" y="282" width="6" height="40"/></g>
<g id="ideas0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The blank page.</text>
<text class="b" x="120" y="176" font-size="32">An hour passes, and the screen stays empty.</text>
<g id="desk1"><g id="wr1"></g>
<path class="s-ink" d="M180 620H900M220 620V780M860 620V780M660 590V620" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="500" y="390" width="320" height="200" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect id="cur1" class="ink" x="540" y="430" width="6" height="40"/></g>
<g id="clk"><circle class="s-ink" cx="680" cy="290" r="56" fill="var(--stage)" stroke-width="6"/><path id="hand1" class="s-ink" d="M680 290V250" stroke-width="6" stroke-linecap="round"/><text class="m" x="760" y="298" font-size="22">1 HOUR</text></g>
<g id="wall1"></g>
<g id="lbl1"><text class="m" x="1000" y="756" font-size="22">“CREATIVE BLOCK”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fear in disguise.</text>
<text class="b" x="120" y="176" font-size="32">That wall is not what it seems.</text>
<g id="wq2"><text class="m" x="880" y="262" font-size="22" text-anchor="middle">A WALL?</text></g>
<g id="fig2"><g id="fig2i"></g></g>
<g id="wall2"></g>
<g id="flab2"><text class="m" x="960" y="770" font-size="20" text-anchor="middle" style="fill:var(--loss)">FEAR OF MAKING SOMETHING BAD</text></g>
<g id="bulbs2"></g>
<g id="leg2"><circle cx="160" cy="694" r="10" class="gain"/><text class="m" x="180" y="701" font-size="20">STRONG IDEAS</text><circle cx="400" cy="694" r="10" fill="var(--muted)"/><text class="m" x="420" y="701" font-size="20">WEAK IDEAS</text></g>
<g id="ex2"><path id="exl2" class="s-ink" d="M510 440H776" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M758 420l20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="520" y="410" font-size="20">OUT INTO THE WORLD</text></g>
<g id="gd2"><path class="s-loss" d="M800 396V484" stroke-width="10" stroke-linecap="round"/><text class="m" x="520" y="500" font-size="20" style="fill:var(--loss)">ALL BLOCKED,</text><text class="m" x="520" y="528" font-size="20" style="fill:var(--loss)">JUST TO BE SAFE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody gets talker’s block.</text>
<text class="b" x="120" y="176" font-size="32">We talk all day, and plenty of it is clumsy.</text>
<g id="fr3"></g>
<g id="bub3"></g>
<g id="card3"><rect class="s-line" x="860" y="250" width="620" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="900" y="306" font-size="20">WHAT WE SAY ALL DAY</text><g id="grid3"></g></g>
<g id="no3"><text class="d" x="120" y="800" font-size="44">Yet we never freeze until it’s perfect.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why talking flows.</text>
<text class="b" x="120" y="176" font-size="32">We accept that some sentences will be ordinary.</text>
<g id="per4"><path class="s-ink" d="M172 525L128 550L118 498M268 525L312 550L322 498" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="flow4"></g>
<g id="ord4"><rect x="380" y="510" width="50" height="30" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="m" x="446" y="532" font-size="20">SOME WILL BE ORDINARY</text></g>
<g id="gl4"><rect class="gain" x="820" y="510" width="50" height="30" rx="12"/><text class="m" x="886" y="532" font-size="20" style="fill:var(--gain)">GOOD LINES SHOW UP IN THE FLOW</text></g>
<g id="same4"><text class="d" x="120" y="800" font-size="46">Creative work can flow the same way.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bad leads to good.</text>
<g id="sub5"><text class="b" x="120" y="176" font-size="32">Produce more, not less.</text></g>
<g id="pages5"></g>
<g id="trash5"><g id="balls5"></g>
<path class="s-ink" d="M1000 470H1200M1080 470V452H1120V470" fill="none" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M1020 490L1040 700H1160L1180 490Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M1070 520L1076 670M1100 520V670M1130 520L1124 670" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1100" y="750" font-size="20" text-anchor="middle">NOT GOOD YET</text></g>
<g id="gem5"><polygon class="gain" points="1320,440 1345,410 1395,410 1420,440 1370,510"/><text class="m" x="1370" y="560" font-size="20" text-anchor="middle" style="fill:var(--gain)">WORTH KEEPING</text></g>
<g id="more5"><text class="d" x="120" y="800" font-size="44">More attempts, more chances to find a keeper.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fear comes along.</text>
<text class="b" x="120" y="176" font-size="32">Feel afraid, and keep working anyway.</text>
<path class="s-line" d="M120 626H1480" stroke-width="7" stroke-linecap="round"/>
<g id="st6"></g>
<g id="stl6"><text class="m" x="1440" y="690" font-size="22" text-anchor="end">EACH FINISHED PIECE</text></g>
<g id="fear6"><g id="fear6i"><g id="fear6s"></g><text id="fl6" class="m" x="0" y="-90" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEAR COMES ALONG</text></g></g>
<g id="you6"><g id="you6i"></g><g id="ylab6"><text class="m" x="0" y="-90" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU LEAD</text></g></g>
<g id="keep6"><text class="d" x="120" y="830" font-size="44">Afraid, and working anyway.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">A daily habit.</text>
<text class="b" x="120" y="176" font-size="32">Produce on a schedule, not when inspiration strikes.</text>
<g id="cal7"><rect class="s-line" x="120" y="240" width="600" height="330" rx="16" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="20">EVERY DAY</text><g id="cells7"></g></g>
<g id="nw7"><text class="m" x="120" y="620" font-size="20">NOT WAITING FOR INSPIRATION</text></g>
<g id="dr7"></g>
<g id="xs7"></g>
<g id="arr7"><path class="s-gain" d="M840 470L1300 250M1270 250h30v28" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="rl7"><text class="m" x="820" y="740" font-size="20">ROUGH DRAFTS, MOST THROWN AWAY</text></g>
<g id="nb7"><text class="d" x="120" y="820" font-size="44">Each weak page is a step toward a stronger one.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Set a 10-minute timer.</text></g>
<g id="q1"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Make something</text></g>
<g id="q2"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">deliberately imperfect.</text></g>
<g id="tm8"><rect class="ink" x="1344" y="574" width="32" height="18" rx="4"/><circle class="s-line" cx="1360" cy="690" r="90" fill="none" stroke-width="10"/><path id="arc8" class="s-gain" fill="none" stroke-width="12" stroke-linecap="round"/><text class="m" x="1360" y="698" font-size="22" text-anchor="middle">10 MIN</text></g>
<g id="nx8"><text class="m" x="143" y="700" font-size="26">THEN NOTICE HOW EASY THE NEXT 10 MINUTES FEEL</text></g>
</g>