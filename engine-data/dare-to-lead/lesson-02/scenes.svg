<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Vulnerability is</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not weakness.</text>
<text class="b" x="120" y="600" font-size="32">Why every brave act starts with feeling exposed</text>
<g id="t_rays"></g>
<g id="t_me"></g>
<path id="t_heart" class="gain"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What vulnerability really is.</text>
<text class="b" x="120" y="176" font-size="32">What we feel in moments of uncertainty, risk and emotional exposure.</text>
<g id="s1c"></g><g id="s1b"></g><g id="s1o"></g>
<g id="s1m"><text class="m" x="120" y="745" font-size="22">IN EACH MOMENT, YOU CANNOT CONTROL THE OUTCOME</text></g>
<g id="s1s"><text class="d" x="120" y="822" font-size="44">That shaky feeling is vulnerability.</text><path id="s1w" class="s-gain" fill="none" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The soldier test.</text>
<text class="b" x="120" y="176" font-size="32">Brown’s question to a group of special forces soldiers.</text>
<g id="s2sol"></g>
<line id="s2arm" class="s-gain" x1="545" y1="590" x2="545" y2="590" stroke-width="10" stroke-linecap="round"/>
<g id="s2q"><text class="m" x="180" y="700" font-size="22">THE ROOM WENT QUIET · · ·</text></g>
<g id="s2bub"><path d="M630 376L590 430L680 376z" fill="var(--stage)" stroke="var(--gain)" stroke-width="4" stroke-linejoin="round"/><rect x="600" y="300" width="320" height="80" rx="16" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><text class="d5" x="760" y="350" font-size="28" text-anchor="middle">“Not a single one.”</text></g>
<g id="s2card"><rect class="s-ink" x="940" y="230" width="540" height="260" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="975" y="280" font-size="20">THE QUESTION</text><text class="d5" x="975" y="350" font-size="34">Name an act of courage</text><text class="d5" x="975" y="400" font-size="34">that did not involve</text><text class="d5" x="975" y="450" font-size="34" style="fill:var(--loss)">vulnerability.</text></g>
<g id="s2zero"><rect class="s-line" x="940" y="540" width="540" height="230" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="985" y="720" font-size="150" style="fill:var(--gain)">0</text><text class="m" x="1100" y="610" font-size="22">EXAMPLES OFFERED</text><text class="m" x="1100" y="644" font-size="22">ACROSS YEARS OF</text><text class="m" x="1100" y="678" font-size="22">ASKING AUDIENCES</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Myth 1: It’s weakness.</text>
<text class="b" x="120" y="176" font-size="32">If courage always needs vulnerability, it can’t be weakness.</text>
<g id="s3sc">
<rect class="ink" x="360" y="700" width="160" height="16" rx="6"/>
<path class="s-ink" d="M440 700V340" stroke-width="8" stroke-linecap="round"/>
<path id="s3beam" class="s-ink" d="M220 340H660" stroke-width="10" stroke-linecap="round"/>
<circle class="ink" cx="440" cy="340" r="14"/>
<g id="s3pL"><path class="s-ink" d="M0 0L-80 110M0 0L80 110" stroke-width="4"/><path class="s-ink" d="M-95 110h190a95 46 0 0 1-190 0z" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="-50" y="66" width="100" height="44" rx="8"/><text class="m" x="0" y="196" font-size="22" text-anchor="middle">COURAGE</text></g>
<g id="s3pR"><path class="s-ink" d="M0 0L-80 110M0 0L80 110" stroke-width="4"/><path class="s-ink" d="M-95 110h190a95 46 0 0 1-190 0z" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="-50" y="66" width="100" height="44" rx="8"/><text class="m" x="0" y="196" font-size="22" text-anchor="middle">VULNERABILITY</text></g>
</g>
<g id="s3w"><text class="m" x="120" y="745" font-size="22">VULNERABILITY IS NOT</text><text class="d" x="120" y="822" font-size="64" style="fill:var(--loss)">weakness</text></g>
<line id="s3ws" class="s-ink" x1="112" y1="800" x2="112" y2="800" stroke-width="7" stroke-linecap="round"/>
<g id="s3m">
<polygon class="s-ink" points="880,720 1180,250 1460,720" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="gain" d="M1180 250V180l50 18-50 18z"/>
<path class="s-ink" d="M1180 250V180" stroke-width="5"/>
<path id="s3tr" class="s-gain" d="M1180 640L1120 530L1220 430L1160 340L1180 262" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path class="s-gain" d="M1120 720V630h120V720" fill="none" stroke-width="8" stroke-linejoin="round"/>
<circle id="s3cl" class="ink" r="14"/>
<text class="m" x="1180" y="762" font-size="22" text-anchor="middle">THE PRICE OF ENTRY</text>
<text class="m" x="1180" y="794" font-size="22" text-anchor="middle">FOR EVERY BRAVE ACT</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Myth: Opting out, going alone.</text>
<text class="b" x="120" y="176" font-size="32">Two ways people try to dodge vulnerability.</text>
<g id="s4L"><rect class="s-line" x="120" y="220" width="640" height="540" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="270" font-size="22">“I DON’T DO VULNERABILITY”</text><g id="s4me"></g><path class="s-ink" d="M420 420h110v80q0 70-55 100q-55-30-55-100z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="s4rain"></g>
<g id="s4u"><text class="d5" x="150" y="695" font-size="30">Uncertainty comes for everyone.</text></g>
<g id="s4c"><text class="m" x="150" y="738" font-size="20">THE ONLY CHOICE: FACE IT ON PURPOSE</text></g>
<g id="s4R"><rect class="s-line" x="840" y="220" width="640" height="540" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="270" font-size="22">“I CAN GO IT ALONE”</text><rect x="1100" y="432" width="120" height="248" fill="var(--line)"/><g id="s4cl"></g></g>
<g id="s4rope"></g><g id="s4sup"></g>
<g id="s4w"><text class="d5" x="870" y="725" font-size="30">Wired for connection. Leaders too.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="64">Myth: Engineer out the discomfort.</text>
<text class="b" x="120" y="176" font-size="32">And its cousin: you need trust first.</text>
<g id="s5bp"><rect x="120" y="230" width="600" height="400" rx="12" fill="var(--loss)" fill-opacity=".08" stroke="var(--loss)" stroke-width="3"/><g id="s5grid"></g><text class="m" x="150" y="270" font-size="20">THE PLAN</text><circle class="loss" cx="420" cy="430" r="56"/><text class="m" x="420" y="530" font-size="20" text-anchor="middle">DISCOMFORT</text>
<g id="s5er"><rect x="-55" y="-25" width="110" height="50" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><rect class="ink" x="-55" y="-25" width="34" height="50" rx="8"/></g></g>
<g id="s5no"><rect x="470" y="560" width="220" height="52" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="580" y="594" font-size="22" text-anchor="middle" style="fill:var(--loss)">YOU CANNOT.</text></g>
<g id="s5d"><text class="d5" x="120" y="700" font-size="32">Feeling exposed is part of the deal.</text></g>
<g id="s5r"><text class="m" x="860" y="270" font-size="20">TRUST AND VULNERABILITY GROW TOGETHER</text>
<g id="s5bars"></g>
<path class="s-ink" d="M860 660H1440" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="880" y="684" width="20" height="20" rx="4"/><text class="m" x="912" y="702" font-size="20">TRUST</text>
<rect class="gain" x="1040" y="684" width="20" height="20" rx="4"/><text class="m" x="1072" y="702" font-size="20">VULNERABILITY</text></g>
<g id="s5a"><text class="d5" x="860" y="770" font-size="30">A little at a time.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Myth: It means oversharing.</text>
<text class="b" x="120" y="176" font-size="32">Vulnerability is not disclosure.</text>
<g id="s6L"><path class="s-ink" d="M430 300c-60-30-160-30-220-10v200c60-20 160-20 220 10c60-30 160-30 220-10V290c-60-20-160-20-220 10z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M430 300v200" stroke-width="4"/><path class="s-line" d="M250 340h140M250 380h140M250 420h110M470 340h140M470 380h140M470 420h110" stroke-width="5" stroke-linecap="round"/><g id="s6sp"></g></g>
<g id="s6x"><path class="s-loss" d="M320 540L540 660M540 540L320 660" stroke-width="10" stroke-linecap="round"/></g>
<g id="s6t"><text class="d5" x="120" y="730" font-size="32">Spilling every feeling</text><text class="d5" x="120" y="775" font-size="32">at work isn’t courage.</text></g>
<g id="s6R"><rect x="900" y="270" width="540" height="340" rx="20" fill="none" stroke="var(--line)" stroke-width="4"/><rect x="900" y="270" width="540" height="340" rx="20" fill="none" stroke="var(--ink)" stroke-width="16" stroke-dasharray="8 24"/><g id="s6pp"></g><path class="gain" d="M1170 476C1135 452 1132 428 1150 422C1160 419 1167 425 1170 432C1173 425 1180 419 1190 422C1208 428 1205 452 1170 476Z"/><text class="m" x="1170" y="580" font-size="20" text-anchor="middle">BOUNDARIES</text></g>
<g id="s6p"><rect class="gain" x="900" y="660" width="250" height="60" rx="30"/><text class="m" x="1025" y="698" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">PURPOSE</text><rect class="gain" x="1190" y="660" width="250" height="60" rx="30"/><text class="m" x="1315" y="698" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">RELATIONSHIP</text><text class="m" x="900" y="770" font-size="20">NOT DUMPING</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">What it looks like at work.</text>
<text class="b" x="120" y="176" font-size="32">Small moments of brave leadership.</text>
<g id="s7tab"><ellipse class="s-ink" cx="460" cy="500" rx="230" ry="140" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M380 470h60M480 520h60M400 560h40" stroke-width="6" stroke-linecap="round"/></g>
<circle id="s7ring" cx="460" cy="290" r="42" fill="none" stroke="var(--gain)" stroke-width="5"/>
<g id="s7ppl"></g>
<g id="s7c0"><rect class="s-line" x="860" y="230" width="620" height="140" rx="16" fill="var(--stage)" stroke-width="3"/><text class="d5" x="900" y="290" font-size="32">“I don’t know yet,</text><text class="d5" x="900" y="340" font-size="32">but I will find out.”</text></g>
<g id="s7c1"><rect class="s-line" x="860" y="400" width="620" height="140" rx="16" fill="var(--stage)" stroke-width="3"/><text class="d5" x="900" y="482" font-size="32">“Can you help me with this?”</text></g>
<g id="s7c2"><rect class="s-line" x="860" y="570" width="620" height="140" rx="16" fill="var(--stage)" stroke-width="3"/><text class="d5" x="900" y="652" font-size="32">“Poke holes in my idea.”</text><rect class="s-ink" x="1380" y="598" width="60" height="84" fill="none" stroke-width="5"/><polygon id="s7door" class="gain"/></g>
<g id="s7s"><text class="d" x="120" y="830" font-size="52">Small. Risky. <tspan style="fill:var(--gain)">Real.</tspan></text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">This week, where will you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">stop playing it safe</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and <tspan style="fill:var(--gain)">show up anyway?</tspan></text></g>
<g id="s8m"><text class="m" x="143" y="700" font-size="26">NAME THE UNCERTAINTY. SHOW UP ANYWAY.</text></g>
<g id="s8cal"><rect class="s-ink" x="1180" y="620" width="260" height="200" rx="14" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="1180" y="620" width="260" height="46" rx="14"/><g id="s8dots"></g></g>
<circle id="s8ring" cx="1310" cy="740" r="20" fill="none" stroke="var(--gain)" stroke-width="6"/>
</g>