<rect id="cb0" class="loss" x="-74" y="60" width="70" height="28" rx="4"/><rect id="cb1" class="loss" x="4" y="60" width="70" height="28" rx="4"/><rect id="cb2" class="loss" x="-35" y="30" width="70" height="28" rx="4"/></g>
