<text class="m" x="1180" y="730" font-size="20" text-anchor="middle">FREEDOM + SKILL, NOWHERE TO GO</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What has my work meant?</text>
<text class="b" x="120" y="176" font-size="32">As large generations grow older, many people look back.</text>
