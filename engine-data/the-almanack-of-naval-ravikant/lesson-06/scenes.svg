<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ALMANACK OF NAVAL RAVIKANT · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Happiness is a skill</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you can train.</text>
<text class="b" x="120" y="600" font-size="32">Why every desire quietly costs you a little peace.</text>
<g id="t_fig">
<g id="t_db"><rect class="ink" x="1240" y="254" width="200" height="12" rx="6"/><rect class="gain" x="1222" y="220" width="30" height="80" rx="8"/><rect class="gain" x="1428" y="220" width="30" height="80" rx="8"/></g>
<circle class="s-ink" cx="1340" cy="420" r="70" fill="var(--stage)" stroke-width="7"/>
<circle class="ink" cx="1315" cy="405" r="7"/><circle class="ink" cx="1365" cy="405" r="7"/>
<path class="s-gain" d="M1305 440q35 30 70 0" fill="none" stroke-width="7" stroke-linecap="round"/>
<path class="ink" d="M1230 660v-50a110 110 0 0 1 220 0v50z"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Happiness is a skill.</text>
<text class="b" x="120" y="176" font-size="32">Naval treats it the way he treats getting rich.</text>
<g id="a_nav">
<g id="a_p"></g>
<circle class="s-ink" cx="420" cy="350" r="60" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="420" y="372" font-size="64" text-anchor="middle" style="fill:var(--gain)">$</text>
<text class="d" x="520" y="370" font-size="56" text-anchor="middle" style="fill:var(--muted)">=</text>
<circle class="gain" cx="620" cy="350" r="60"/>
<circle cx="600" cy="335" r="6" fill="var(--on-gain)"/><circle cx="640" cy="335" r="6" fill="var(--on-gain)"/>
<path d="M592 365q28 24 56 0" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="420" y="450" font-size="20" text-anchor="middle">GETTING RICH</text>
<text class="m" x="620" y="450" font-size="20" text-anchor="middle">HAPPINESS</text>
</g>
<g id="a_gym">
<rect class="ink" x="790" y="344" width="220" height="12" rx="6"/>
<rect class="gain" x="800" y="305" width="30" height="90" rx="6"/><rect class="gain" x="970" y="305" width="30" height="90" rx="6"/>
<rect class="gain" x="776" y="320" width="22" height="60" rx="6"/><rect class="gain" x="1002" y="320" width="22" height="60" rx="6"/>
<text class="m" x="900" y="450" font-size="20" text-anchor="middle">PRACTICE, LIKE FITNESS</text>
</g>
<g id="a_yrs">
<g id="a_bars"></g>
<path class="s-ink" d="M140 790H900" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="120" y="840" font-size="20">WORKED ON IT FOR YEARS · STEADILY HAPPIER</text>
</g>
<g id="a_sign">
<rect class="ink" x="1272" y="300" width="16" height="390"/>
<path class="s-ink" d="M1190 690h180" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M1180 340h220l40 35-40 35h-220z"/>
<text class="d" x="1290" y="388" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">HAPPY</text>
<path class="s-ink" d="M1400 450h-220l-40 35 40 35h220z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1290" y="493" font-size="22" text-anchor="middle">UNHAPPY</text>
<g id="a_days"></g>
<text class="m" x="1120" y="790" font-size="20">CHOSEN AGAIN EACH DAY</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Happiness is mostly peace.</text>
<text class="b" x="120" y="176" font-size="32">Not a thrill. A quiet state where nothing feels missing.</text>
<g id="b_fw"><g id="b_fwi">
<rect class="s-line" x="120" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="20">WHAT WE PICTURE</text>
<g id="b_bursts"></g>
<text class="m" x="150" y="640" font-size="20">EXCITEMENT · BIG WINS</text>
</g></g>
<g id="b_lake">
<rect class="s-line" x="840" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="20">WHAT NAVAL MEANS</text>
<path class="gain" d="M1090 520a70 70 0 0 1 140 0z"/>
<path class="s-ink" d="M870 520H1450" stroke-width="5" stroke-linecap="round"/>
<path id="b_wv" class="s-muted" d="M930 570h140M1230 570h160M1020 610h200" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="870" y="650" font-size="20">PEACE · NOTHING MISSING</text>
</g>
<g id="b_hole"><circle id="b_hc" class="s-loss" cx="1330" cy="390" r="56" fill="none" stroke-width="5" stroke-dasharray="10 8"/><text id="b_ht" class="m" x="1330" y="397" font-size="20" text-anchor="middle" style="fill:var(--loss)">LACK</text></g>
<g id="b_cap"><text class="d" x="120" y="790" font-size="46">When the lack goes, happiness remains.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every desire is a contract.</text>
<text class="b" x="120" y="176" font-size="32">One you sign with yourself.</text>
<g id="c_who"><g id="c_ppl"></g>
<text class="m" x="270" y="600" font-size="22" text-anchor="middle">YOU</text>
<text class="m" x="1330" y="600" font-size="22" text-anchor="middle">ALSO YOU</text></g>
<g id="c_doc">
<rect class="s-ink" x="480" y="220" width="640" height="580" rx="12" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="800" y="300" font-size="52" text-anchor="middle">CONTRACT</text>
<g id="c_par"><text class="m" x="800" y="352" font-size="22" text-anchor="middle">BETWEEN YOU AND YOU</text></g>
<g id="c_terms">
<text class="d5" x="540" y="450" font-size="38">I agree to be <tspan style="fill:var(--loss)">unhappy</tspan></text>
<text class="d5" x="540" y="505" font-size="38">until I get what I want.</text>
<path class="s-line" d="M540 570h520M540 610h380" stroke-width="5" stroke-linecap="round"/>
</g>
<path class="s-ink" d="M540 720h400" stroke-width="4"/>
<text class="m" x="540" y="760" font-size="22">SIGNATURE</text>
<path id="c_sig" class="s-ink" d="M560 700c20-40 30-40 20 0s10-30 30-10 20 20 40-10 30 30 50 0 40-20 60 0 30-10 60-6" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="c_cap"><text class="d5" x="800" y="852" font-size="34" text-anchor="middle">You may not even notice you signed it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A simple picture.</text>
<text class="b" x="120" y="176" font-size="32">Imagine you suddenly want the newest phone.</text>
<g id="d_who"><g id="d_p"></g></g>
<g id="d_old"><rect class="s-ink" x="240" y="560" width="56" height="96" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="268" y="694" font-size="22" text-anchor="middle">OLD PHONE</text></g>
<text id="d_st" class="m" x="420" y="740" font-size="24" text-anchor="middle">CALM</text>
<g id="d_cl">
<rect class="loss" x="346" y="310" width="154" height="44" rx="22" fill-opacity=".55"/><circle class="loss" cx="385" cy="315" r="34" fill-opacity=".55"/><circle class="loss" cx="425" cy="300" r="44" fill-opacity=".55"/><circle class="loss" cx="465" cy="318" r="32" fill-opacity=".55"/>
<path class="s-loss" d="M390 372v18M425 372v18M460 372v18" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M506 318h22" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="538" y="325" font-size="20" style="fill:var(--loss)">SOMETHING MISSING</text>
</g>
<g id="d_arr"><path class="s-gain" d="M560 470H1040" stroke-width="5" stroke-dasharray="14 10" fill="none"/><path class="s-gain" d="M1020 450l20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="800" y="440" font-size="20" text-anchor="middle">I WANT IT</text></g>
<g id="d_ph"><rect class="s-gain" x="1080" y="300" width="170" height="300" rx="24" fill="var(--stage)" stroke-width="7"/><rect class="gain" x="1100" y="330" width="130" height="230" rx="8" fill-opacity=".3"/>
<path class="s-gain" d="M1290 290v40M1270 310h40M1060 260v24M1048 272h24" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1165" y="650" font-size="20" text-anchor="middle">THE NEWEST PHONE</text></g>
<g id="d_bag"><path class="s-gain" d="M590 600v-20a25 25 0 0 1 50 0v20" fill="none" stroke-width="6"/><rect class="gain" x="560" y="595" width="110" height="100" rx="8"/></g>
<g id="d_rel"><path class="s-gain" d="M684 645h30" stroke-width="5" stroke-linecap="round"/><text class="m" x="726" y="653" font-size="24" style="fill:var(--gain)">RELIEF, BRIEFLY</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A new desire takes its place.</text>
<text class="b" x="120" y="176" font-size="32">So the peace keeps slipping ahead of you.</text>
<g id="e_qw"><text class="m" x="120" y="232" font-size="20">ONE WANT REPLACES THE LAST</text><g id="e_q"></g></g>
<g id="e_tm">
<rect class="s-ink" x="300" y="650" width="600" height="40" rx="20" fill="none" stroke-width="6"/>
<path id="e_belt" class="s-muted" d="M330 670H870" stroke-width="4" stroke-dasharray="20 20"/>
<path class="s-ink" d="M860 650L890 540h40" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="e_l1" class="s-ink" stroke-width="8" stroke-linecap="round"/><path id="e_l2" class="s-ink" stroke-width="8" stroke-linecap="round"/>
<g id="e_rb"><circle class="ink" cx="600" cy="470" r="30"/><path class="ink" d="M555 600v-30a45 45 0 0 1 90 0v30z"/></g>
<g id="e_pc"><path class="s-gain" d="M660 500H1120" stroke-width="4" stroke-dasharray="10 10"/><circle class="gain" cx="1180" cy="500" r="50"/>
<text class="m" x="1180" y="507" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">PEACE</text>
<text class="m" x="1180" y="590" font-size="20" text-anchor="middle">ALWAYS AHEAD</text></g>
</g>
<g id="e_t1"><text class="d5" x="120" y="780" font-size="40">Wanting things isn’t wrong.</text></g>
<g id="e_t2"><text class="d" x="120" y="840" font-size="44">Each want has a hidden cost in calm.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be picky about desires.</text>
<text class="b" x="120" y="176" font-size="32">Choose one big thing. Let the smaller cravings go.</text>
<g id="f_you"><g id="f_yp"></g><text class="m" x="220" y="660" font-size="22" text-anchor="middle">YOU</text></g>
<g id="f_tg"><circle class="s-ink" cx="1300" cy="470" r="130" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1300" cy="470" r="85" fill="none" stroke-width="6"/><circle class="gain" cx="1300" cy="470" r="40"/></g>
<g id="f_one"><text class="m" x="1300" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE BIG THING</text></g>
<g id="f_crl"><text class="m" x="440" y="266" font-size="20">SMALL CRAVINGS</text></g>
<g id="f_lgl"><text class="m" x="1140" y="266" font-size="20" text-anchor="end" style="fill:var(--loss)">LET GO</text></g>
<g id="f_cr"></g>
<path id="f_path" class="s-gain" d="M290 470H1160" stroke-width="8" stroke-linecap="round" fill="none"/>
<g id="f_fc"><text class="m" x="725" y="520" font-size="22" text-anchor="middle">FEWER CONTRACTS</text></g>
<g id="f_cap"><text class="d" x="120" y="800" font-size="44">Still pursue goals. Sign far fewer contracts.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Catch the contract.</text>
<text class="b" x="120" y="176" font-size="32">Notice the unsettled feeling. Look underneath.</text>
<g id="h_un"><text class="m" x="160" y="222" font-size="20" style="fill:var(--loss)">UNSETTLED</text>
<polyline id="h_jag" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="h_card">
<g id="h_L"><path id="h_Lp" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="240" y="500" font-size="32">DESIRE</text><path class="s-line" d="M240 560h140M240 610h120" stroke-width="5" stroke-linecap="round"/></g>
<g id="h_R"><path id="h_Rp" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="440" y="500" font-size="32">CONTRACT</text><path class="s-line" d="M445 560h150M445 610h110" stroke-width="5" stroke-linecap="round"/></g>
</g>
<g id="h_mag"><circle class="s-ink" cx="0" cy="0" r="60" fill="var(--stage)" fill-opacity=".5" stroke-width="10"/><path class="s-ink" d="M42 42l50 50" stroke-width="16" stroke-linecap="round"/></g>
<g id="h_sc">
<path class="s-ink" d="M1160 330V760M1060 760h200" stroke-width="8" stroke-linecap="round"/>
<path id="h_beam" class="s-ink" d="M920 330H1400" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1160" cy="330" r="14"/>
<g id="h_p0"><path class="s-muted" d="M-80 120L0 0L80 120" fill="none" stroke-width="3"/><path class="loss" d="M-90 120h180l-25 40h-130z"/><text class="m" x="0" y="200" font-size="20" text-anchor="middle" style="fill:var(--loss)">THE WANT</text></g>
<g id="h_p1"><path class="s-muted" d="M-80 120L0 0L80 120" fill="none" stroke-width="3"/><path class="gain" d="M-90 120h180l-25 40h-130z"/><text class="m" x="0" y="200" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOUR PEACE</text></g>
</g>
<g id="h_cap"><text class="d" x="120" y="830" font-size="44">Often it isn’t worth it. Tear it up.</text></g>
</g>

<g id="s8" opacity="0">
<g id="n_a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which desire is quietly</text></g>
<g id="n_b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">stealing your calm?</text></g>
<g id="n_c"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Is it worth the <tspan style="fill:var(--gain)">price</tspan>?</text></g>
<g id="n_m"><text class="m" x="143" y="700" font-size="26" style="fill:var(--gain)">IF NOT, LET IT GO</text></g>
<g id="n_nb">
<rect class="s-ink" x="1270" y="520" width="190" height="240" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1270" y="520" width="190" height="26" rx="8"/>
<path class="s-line" d="M1300 590h130M1300 630h130M1300 670h90" stroke-width="5" stroke-linecap="round"/>
<rect class="s-gain" x="1300" y="696" width="34" height="34" rx="4" fill="none" stroke-width="4"/>
<path id="n_tick" class="s-gain" d="M1306 712l10 10 22-26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>