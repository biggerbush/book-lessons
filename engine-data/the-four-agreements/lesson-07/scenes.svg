<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 7</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Breaking old</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">agreements,</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">one day at a time.</text>
<text class="b" x="120" y="610" font-size="32">Freedom grows from small daily choices, not one giant leap.</text>
