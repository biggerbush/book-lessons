<g id="lab7"><text class="m" x="140" y="580" font-size="20">A PROVERB: FEW WORDS, DEEP WISDOM</text></g>
<g id="card"><g transform="rotate(-3 870 410)"><rect x="640" y="260" width="460" height="300" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="m" x="670" y="310" font-size="20">YOUR CORE MESSAGE</text><rect class="gain" x="670" y="352" width="380" height="16" rx="8"/><g id="cardx"></g></g></g>
