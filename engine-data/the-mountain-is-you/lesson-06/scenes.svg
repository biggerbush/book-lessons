<g id="arrR"><path class="s-gain" d="M820 540L1010 366M972 356H1020V404" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1040" y="300" font-size="22" text-anchor="middle" style="fill:var(--gain)">FUTURE SELF</text></g>
<g id="ask3"><text class="d5" x="1080" y="600" font-size="36">What would</text><text class="d5" x="1080" y="646" font-size="36">future you choose?</text></g>
