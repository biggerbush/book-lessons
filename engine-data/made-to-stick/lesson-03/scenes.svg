<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Surprise with a point.</text>
<text class="b" x="120" y="176" font-size="32">A surprise must point back to your core message.</text>
<g id="lp"><rect class="s-line" x="120" y="230" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="rays"></g><circle class="gain" cx="260" cy="420" r="70"/><rect class="ink" x="235" y="490" width="50" height="40" rx="6"/>
<text class="d5" x="150" y="700" font-size="36">Surprise with a point</text></g>
