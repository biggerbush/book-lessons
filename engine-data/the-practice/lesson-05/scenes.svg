<path class="s-ink" d="M160 630h300" stroke-width="5"/>
<g id="df7"><rect class="ink" x="466" y="496" width="20" height="120" rx="4"/><path class="s-ink" d="M486 556h20" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="510" cy="556" r="9"/></g>
<rect class="ink" x="466" y="640" width="20" height="124" rx="4"/><path class="s-ink" d="M486 702h20" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="510" cy="702" r="9"/>
<g id="path7"><path class="s-gain" d="M600 478C700 380 900 420 910 650M1120 705Q1340 705 1340 548" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><path class="s-gain" d="M1324 560l16-18 16 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="snd7"><g id="sndi"><rect class="gain" x="700" y="660" width="420" height="90" rx="45"/><text class="d" x="910" y="718" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Send it as a gift</text></g></g>
<g id="card7"><g id="cr7"><rect class="s-ink" x="-45" y="-55" width="90" height="110" rx="8" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M-25-25h50M-25 0h50M-25 25h30" stroke-width="6" stroke-linecap="round"/></g><g id="cg7"></g></g>
<g id="wh7"><g id="who7"></g><text class="m" x="1340" y="316" font-size="20" text-anchor="middle">WHO MIGHT BE HELPED?</text></g>
<g id="nt7"><text class="d" x="120" y="845" font-size="40">A gift, not a test of your worth.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What’s one thing you’ve made</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">that someone else might need?</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="60" style="fill:var(--gain)">Who will you give it to</text></g>
<g id="qd"><text class="d" x="136" y="620" font-size="60" style="fill:var(--gain)">before this week ends?</text></g>
<g id="ql"><text class="m" x="143" y="760" font-size="26">SHARE IT AS A GIFT</text></g>
<g id="g8"></g>
</g>