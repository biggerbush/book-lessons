<circle class="ink" cx="980" cy="240" r="12"/><circle class="ink" cx="1080" cy="240" r="12"/><circle class="ink" cx="1180" cy="240" r="12"/><circle class="ink" cx="1280" cy="240" r="12"/>
<text class="m" x="940" y="320" font-size="22">3 MINIMUM CRITERIA</text>
