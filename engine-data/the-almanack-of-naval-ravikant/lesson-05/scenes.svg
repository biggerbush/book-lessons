<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ALMANACK OF NAVAL RAVIKANT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Play long-term games</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">with long-term people.</text>
<text class="b" x="120" y="600" font-size="32">Why the biggest rewards come from staying with the right people.</text>
