<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Clarity, discipline</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and consistency.</text>
<text class="b" x="120" y="600" font-size="32">How a clear purpose turns into choices people can trust.</text>
<circle id="tr2" cx="1300" cy="400" r="0" fill="none" stroke="var(--line)" stroke-width="6"/>
<circle id="tr1" cx="1300" cy="400" r="0" fill="none" stroke="var(--ink)" stroke-width="6"/>
<circle id="tr0" class="gain" cx="1300" cy="400" r="0"/>
<g id="trl"><text class="m" x="1300" y="408" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">WHY</text><text class="m" x="1300" y="321" font-size="20" text-anchor="middle">HOW</text><text class="m" x="1300" y="266" font-size="20" text-anchor="middle">WHAT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three rings, three jobs.</text>
<text class="b" x="120" y="176" font-size="32">Each part of the Golden Circle needs something different.</text>
<g id="rg2"><circle id="k2" cx="400" cy="500" r="250" fill="none" stroke="var(--line)" stroke-width="6"/><text class="m" x="400" y="298" font-size="22" text-anchor="middle">WHAT</text></g>
<g id="rg1"><circle id="k1" cx="400" cy="500" r="170" fill="none" stroke="var(--line)" stroke-width="6"/><text class="m" x="400" y="378" font-size="22" text-anchor="middle">HOW</text></g>
<g id="rg0"><circle class="gain" cx="400" cy="500" r="90"/><text class="d" x="400" y="513" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g>
<g id="jb0"><path id="ld0" d="M485 530H760" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 8"/><text class="d5" x="780" y="545" font-size="44">Why needs <tspan style="fill:var(--gain)">clarity</tspan></text><circle class="s-ink" cx="1270" cy="528" r="22" fill="none" stroke-width="6"/><path class="s-ink" d="M1286 544l18 18" stroke-width="8" stroke-linecap="round"/></g>
<g id="jb1"><path id="ld1" d="M555 430H760" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 8"/><text class="d5" x="780" y="445" font-size="44">How needs <tspan style="fill:var(--gain)">discipline</tspan></text></g>
<g id="jb2"><path id="ld2" d="M583 330H760" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 8"/><text class="d5" x="780" y="345" font-size="44">What needs <tspan style="fill:var(--gain)">consistency</tspan></text></g>
<g id="hs"><path class="s-ink" d="M780 780l60-34 60 34" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="840" cy="746" r="20"/><text class="d" x="930" y="772" font-size="38">Aligned, they earn trust.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Clarity: a why you can see.</text>
<text class="b" x="120" y="176" font-size="32">A fuzzy purpose is a sign lost in fog. Nobody can follow it.</text>
<g id="sign"><path class="s-line" d="M140 780h420" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="330" y="400" width="16" height="380"/><path id="board" d="M180 300h300l40 50-40 50h-300z" fill="var(--stage)" stroke="var(--muted)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="smg"></g>
<g id="stxt"><text class="m" x="200" y="342" font-size="22" style="fill:var(--ink)">CHAMPION OF THE</text><text class="m" x="200" y="378" font-size="22" style="fill:var(--ink)">COMMON MAN</text></g>
<g id="walker"><g id="wk"></g><text id="qm" class="d" x="200" y="660" font-size="44" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="fog"></g>
<g id="plane"><rect x="820" y="330" width="520" height="70" rx="35" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="gain" x="860" y="355" width="420" height="12"/><path class="ink" d="M1060 365l-90 110h50l120-110z"/><path class="ink" d="M840 330l-20-70h40l50 70z"/></g>
<g id="ptx"><text class="m" x="760" y="540" font-size="22">SOUTHWEST AIRLINES · HERB KELLEHER</text><text class="d" x="760" y="620" font-size="48">Champion of the</text><text class="d" x="760" y="680" font-size="48" style="fill:var(--gain)">common man.</text></g>
<g id="pst2"><text class="b" x="760" y="770" font-size="32">Everyone knew what it stood for.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="60">Discipline: hows that guide choices.</text>
<text class="b" x="120" y="176" font-size="32">Southwest held to three hows.</text>
<g id="hc0"><rect class="s-line" x="120" y="220" width="420" height="250" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M270 290h80l40 30-40 30h-80z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="295" cy="320" r="9"/><text class="d" x="330" y="440" font-size="40" text-anchor="middle">Keep it cheap</text></g>
<g id="hc1"><rect class="s-line" x="590" y="220" width="420" height="250" rx="18" fill="var(--stage)" stroke-width="3"/><circle class="s-ink" cx="800" cy="320" r="50" fill="none" stroke-width="6"/><circle class="ink" cx="782" cy="305" r="6"/><circle class="ink" cx="818" cy="305" r="6"/><path class="s-gain" d="M775 335q25 22 50 0" fill="none" stroke-width="6" stroke-linecap="round"/><text class="d" x="800" y="440" font-size="40" text-anchor="middle">Keep it fun</text></g>
<g id="hc2"><rect class="s-line" x="1060" y="220" width="420" height="250" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M1210 320h120" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="1270" cy="320" r="14"/><text class="d" x="1270" y="440" font-size="40" text-anchor="middle">Keep it simple</text></g>
<g id="slog"><text class="m" x="120" y="530" font-size="22">NOT SLOGANS ON A WALL: FILTERS FOR REAL CHOICES</text></g>
<g id="gate"><text class="m" x="800" y="590" font-size="20" text-anchor="middle" style="fill:var(--gain)">CHEAP · FUN · SIMPLE</text><path class="s-gain" d="M800 605V800" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/></g>
<g id="toks"></g>
<g id="tlab"><text class="m" x="1110" y="780" font-size="20" text-anchor="middle" style="fill:var(--gain)">FITS THE HOW</text><text class="m" x="740" y="830" font-size="20" text-anchor="middle" style="fill:var(--loss)">TEMPTING</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">Write values as verbs, not nouns.</text>
<text class="b" x="120" y="176" font-size="32">A word on a poster, or an action you can take.</text>
<g id="pst"><text class="m" x="120" y="250" font-size="22">NOUN</text><rect class="s-ink" x="120" y="270" width="540" height="300" rx="10" fill="var(--stage)" stroke-width="6"/></g>
<g id="intg"><text class="d" x="390" y="450" font-size="88" text-anchor="middle">Integrity</text></g>
<line id="strk" x1="160" y1="425" x2="160" y2="425" stroke="var(--loss)" stroke-width="10" stroke-linecap="round"/>
<g id="hard"><text class="m" x="120" y="620" font-size="22" style="fill:var(--loss)">HARD TO ACT ON</text></g>
<g id="stk"><text class="m" x="860" y="250" font-size="22">VERB</text><rect class="gain" x="860" y="270" width="520" height="300" transform="rotate(-2 1120 420)"/></g>
<g id="stkt"><text class="d" x="900" y="390" font-size="48" style="fill:var(--on-gain)">Always do the</text><text class="d" x="900" y="455" font-size="48" style="fill:var(--on-gain)">right thing.</text></g>
<g id="mon"><path class="s-ink" d="M1120 590V662m-16-16 16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="860" y="680" width="520" height="120" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d5" x="900" y="755" font-size="38">Monday morning</text><path class="s-gain" d="M1290 740l18 18 34-36" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everything you make is proof.</text>
<text class="b" x="120" y="176" font-size="32">Products, ads and stores all point back to one belief.</text>
<g id="blf"><rect class="gain" x="500" y="220" width="600" height="90" rx="45"/><text class="m" x="800" y="274" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">BELIEF: CHALLENGE THE STATUS QUO</text></g>
<path id="ar0" class="s-gain" d="M330 550L650 318" stroke-width="5" stroke-dasharray="10 8"/>
<path id="ar1" class="s-gain" d="M800 550V318" stroke-width="5" stroke-dasharray="10 8"/>
<path id="ar2" class="s-gain" d="M1270 550L950 318" stroke-width="5" stroke-dasharray="10 8"/>
