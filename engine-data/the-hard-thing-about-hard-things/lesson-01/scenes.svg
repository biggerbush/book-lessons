<g id="stories"><text class="d" x="120" y="800" font-size="44">His hard-won stories: a compass, not a map.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Act anyway.</text>
<text class="b" x="120" y="176" font-size="32">Stop hunting for the perfect formula.</text>
<g id="st0"><rect x="120" y="240" width="310" height="240" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><rect class="s-ink" x="235" y="280" width="80" height="120" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="255" y="270" width="40" height="20" rx="5"/><path class="s-line" d="M250 320h50M250 345h50M250 370h30" stroke-width="5" stroke-linecap="round"/><text class="m" x="275" y="450" font-size="20" text-anchor="middle">GATHER THE FACTS</text></g>
<g id="st1"><rect x="470" y="240" width="310" height="240" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><path class="gain" d="M575 300h80l30 30-30 30h-80z"/><rect class="ink" x="587" y="360" width="10" height="50"/><text class="m" x="625" y="450" font-size="20" text-anchor="middle">MAKE THE BEST CALL</text></g>
<g id="st2"><rect x="820" y="240" width="310" height="240" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><g id="owner"></g><text class="m" x="975" y="450" font-size="20" text-anchor="middle">OWN THE DECISION</text></g>
<g id="st3"><rect x="1170" y="240" width="310" height="240" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><g id="adj"><path class="s-gain" d="M1325 295a50 50 0 1 1-50 50" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M1261 352L1275 332L1289 352" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="m" x="1325" y="450" font-size="20" text-anchor="middle">ADJUST AS YOU LEARN</text></g>
<g id="tracks"><text class="m" x="120" y="647" font-size="20">MOVING, IMPERFECTLY</text><path class="s-line" d="M420 640H1460" stroke-width="3" stroke-dasharray="4 10"/><path id="trail" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round"/><circle id="gdot" class="gain" r="18"/><text class="m" x="120" y="737" font-size="20">FROZEN, WAITING</text><path class="s-line" d="M420 730H1460" stroke-width="3" stroke-dasharray="4 10"/><circle id="fdot" class="loss" cx="440" cy="730" r="18"/></g>
<g id="beats"><text class="d" x="120" y="820" font-size="36">Moving forward imperfectly beats freezing for certainty.</text></g>
