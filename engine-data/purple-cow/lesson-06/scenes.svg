<text class="m" x="800" y="770" font-size="20" text-anchor="middle">THE MAJORITY</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most aim at the big middle.</text>
<text class="b" x="120" y="176" font-size="32">Because that is where the money seems to be.</text>
