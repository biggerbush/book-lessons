<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Let them,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">then <tspan style="fill:var(--gain)">let me.</tspan></text>
<text class="b" x="120" y="600" font-size="32">Letting go is step one. Choosing your response is the power.</text>
<g id="hc0"><path class="s-ink" d="M1260 250A150 150 0 0 0 1260 550Z" fill="none" stroke-width="6" stroke-dasharray="14 12" stroke-linejoin="round"/><text class="m" x="1185" y="408" font-size="22" text-anchor="middle">LET THEM</text></g>
<g id="hc1"><path class="gain" d="M1260 250A150 150 0 0 1 1260 550Z"/><text class="m" x="1335" y="408" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">LET ME</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two simple phrases.</text>
<text class="b" x="120" y="176" font-size="32">One to let go. One to act.</text>
<g id="c1a"><rect class="s-line" x="120" y="230" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="160" y="310" font-size="60">Let them.</text>
<g id="pup"><path class="s-ink" d="M300 420h280" stroke-width="10" stroke-linecap="round"/><path class="s-muted" d="M340 420L400 540M440 420V470M540 420L480 540" fill="none" stroke-width="4"/></g>
<g id="pp1"></g><text class="m" x="160" y="650" font-size="20">STOP CONTROLLING OTHER PEOPLE</text></g>
<text id="plus" class="d" x="800" y="480" font-size="80" text-anchor="middle" style="fill:var(--muted)">+</text>
<g id="c1b"><rect class="s-line" x="840" y="230" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="880" y="310" font-size="60" style="fill:var(--gain)">Let me.</text><g id="pm1"></g>
<path id="ar1" class="s-gain" d="M1080 560H1380M1352 532l28 28-28 28" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000"/>
<text class="m" x="880" y="650" font-size="20">TAKE CHARGE OF WHAT YOU DO NEXT</text></g>
<g id="stuck"><text class="d" x="120" y="790" font-size="44">Letting go without acting can leave you stuck.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Left out of the plans.</text>
<text class="b" x="120" y="176" font-size="32">Your friends made weekend plans without you.</text>
<g id="fr"><rect class="s-ink" x="200" y="240" width="300" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="m" x="350" y="286" font-size="22" text-anchor="middle">WEEKEND PLANS!</text><g id="frp"></g><text class="m" x="350" y="590" font-size="20" text-anchor="middle">THE GROUP</text></g>
<g id="ph"><rect class="s-ink" x="760" y="220" width="280" height="520" rx="36" fill="var(--stage)" stroke-width="7"/><g id="tiles"></g><path class="s-line" d="M860 700h80" stroke-width="6" stroke-linecap="round"/></g>
<g id="yo2"><g id="me2"></g><text class="m" x="1260" y="620" font-size="20" text-anchor="middle">YOU</text></g>
<g id="dr2"><path class="s-loss" d="M1420 380V600M1394 574l26 26 26-26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1460" y="660" font-size="20" text-anchor="end" style="fill:var(--loss)">STOMACH DROPS</text></g>
<g id="mom2"><text class="d" x="120" y="800" font-size="44">Moments like this show how the method works.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old reactions.</text>
<text class="b" x="120" y="176" font-size="32">Chase them, or sulk about it.</text>
<g id="pa3"><rect class="s-line" x="120" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">1 · CHASE</text>
<g id="bb3"><rect class="s-ink" x="230" y="320" width="400" height="64" rx="32" fill="var(--stage)" stroke-width="5"/><text class="m" x="430" y="359" font-size="20" text-anchor="middle">WHY WASN’T I INVITED?</text></g>
<g id="grp3"></g><g id="you3"></g>
<path id="ar3" class="s-loss" d="M290 540H510M488 518l22 22-22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000"/></g>
<g id="pb3"><rect class="s-line" x="840" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="22">2 · SULK</text>
<g id="cloud"><circle class="loss" cx="1110" cy="350" r="38"/><circle class="loss" cx="1160" cy="330" r="50"/><circle class="loss" cx="1210" cy="352" r="38"/><rect class="loss" x="1110" y="350" width="100" height="40"/></g>
<g id="rain"></g><g id="p3b"></g><text class="m" x="1160" y="660" font-size="20" text-anchor="middle">REPLAYING THE SLIGHT</text></g>
<g id="lock3"><text class="d" x="120" y="790" font-size="44">Both keep your attention locked on them.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let them. Then let me.</text>
<text class="b" x="120" y="176" font-size="32">First let go, then choose your move.</text>
<g id="g4"><text class="m" x="120" y="250" font-size="22">1 · LET THEM</text><g id="g4m"></g></g>
<g id="free4"><rect class="s-gain" x="140" y="284" width="240" height="136" rx="22" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="120" y="460" font-size="20">FREE TO PLAN WHATEVER THEY WANT</text></g>
<g id="q4"><text class="m" x="120" y="540" font-size="22">2 · LET ME</text><text class="d" x="140" y="770" font-size="220" style="fill:var(--gain)">?</text><text class="m" x="300" y="680" font-size="22">WHAT DO I ACTUALLY WANT?</text></g>
<path id="arA" class="s-gain" d="M712 672C820 672 930 690 930 622" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path id="arB" class="s-gain" d="M712 672C1000 720 1310 720 1310 622" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="cal4"><rect class="s-line" x="760" y="230" width="340" height="380" rx="18" fill="var(--stage)" stroke-width="3"/><g id="calg"></g><rect class="s-ink" x="800" y="280" width="260" height="218" fill="none" stroke-width="6"/><rect class="gain" x="800" y="280" width="260" height="44"/><circle id="cal4c" class="s-gain" cx="1027" cy="411" r="24" fill="none" stroke-width="6"/>
<text class="m" x="930" y="550" font-size="20" text-anchor="middle">INVITE SOMEONE OVER</text><text class="m" x="930" y="585" font-size="20" text-anchor="middle">MAKE YOUR OWN PLANS</text></g>
<g id="mir4"><rect class="s-line" x="1140" y="230" width="340" height="380" rx="18" fill="var(--stage)" stroke-width="3"/><ellipse class="s-ink" cx="1310" cy="390" rx="90" ry="115" fill="var(--stage)" stroke-width="7"/><g id="mp4"></g>
<text class="m" x="1310" y="550" font-size="20" text-anchor="middle">REACH OUT FIRST</text><text class="m" x="1310" y="585" font-size="20" text-anchor="middle">AND YOU START</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not revenge. Not control.</text>
<text class="b" x="120" y="176" font-size="32">Let me is about you, not them.</text>
<g id="no5"><g id="p5"></g><circle class="s-loss" cx="400" cy="470" r="170" fill="none" stroke-width="16"/><path id="sl5" class="s-loss" d="M280 350L520 590" stroke-width="16" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000"/><text class="m" x="400" y="690" font-size="20" text-anchor="middle">NOT PUNISHING · NOT PROVING A POINT</text></g>
<g id="n5b"><text class="m" x="400" y="730" font-size="20" text-anchor="middle">NOT A WAY TO MAKE THEM CHANGE</text></g>
<g id="cmp5"><circle class="s-ink" cx="1140" cy="470" r="170" fill="var(--stage)" stroke-width="7"/><g id="tk5"></g><g id="ndl"><path class="gain" d="M1140 340l22 130h-44z"/><path class="ink" d="M1118 470h44l-22 130z"/></g><circle class="ink" cx="1140" cy="470" r="12"/>
<text id="cv0" class="m" x="1140" y="280" font-size="22" text-anchor="middle">CHOICES</text><text id="cv1" class="m" x="1330" y="478" font-size="22">VALUES</text><text id="cv2" class="m" x="1140" y="680" font-size="22" text-anchor="middle">NEXT STEP</text></g>
<g id="bk5"><text class="d" x="120" y="820" font-size="44">It points you back to your own choices.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where power really is.</text>
<text class="b" x="120" y="176" font-size="32">Two sides of every situation.</text>
<g id="sc6"><path class="s-ink" d="M800 300V680" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="690" y="680" width="220" height="18" rx="9"/><g id="beam"><path class="s-ink" d="M380 300H1220" stroke-width="10" stroke-linecap="round"/></g><circle class="gain" cx="800" cy="300" r="16"/>
<g id="panL"><path class="s-ink" d="M0 0L-100 120M0 0L100 120" fill="none" stroke-width="4"/><path class="ink" d="M-120 120Q0 180 120 120Z"/><g id="oth6"><g id="oth6p"></g><text class="m" x="0" y="214" font-size="20" text-anchor="middle">WHAT OTHERS DO</text><text class="m" x="0" y="244" font-size="20" text-anchor="middle">YOU CAN’T STEER IT</text></g></g>
<g id="panR"><path class="s-ink" d="M0 0L-100 120M0 0L100 120" fill="none" stroke-width="4"/><path class="ink" d="M-120 120Q0 180 120 120Z"/><g id="hand6"><g id="hand6p"></g><text class="m" x="0" y="214" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOUR RESPONSE</text><text class="m" x="0" y="244" font-size="20" text-anchor="middle">ALWAYS YOURS</text></g>
<g id="pow6"><rect class="gain" x="-120" y="256" width="240" height="44" rx="22"/><text class="m" x="0" y="285" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">THE REAL POWER</text></g></g></g>
<g id="e6a"><text class="d" x="120" y="770" font-size="40"><tspan style="fill:var(--muted)">Let them</tspan> stops the wasted energy.</text></g>
<g id="e6b"><text class="d" x="120" y="830" font-size="40"><tspan style="fill:var(--gain)">Let me</tspan> puts that energy to work.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">One situation. One small action.</text>
<g id="nt7"><rect class="s-ink" x="200" y="210" width="860" height="600" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="250" y="270" font-size="22">SOMEONE ISN’T DOING WHAT YOU HOPED</text><path class="s-line" d="M250 345H1010" stroke-width="3" stroke-dasharray="8 8"/><path id="sc7a" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000"/></g>
<g id="lt7"><text class="d" x="250" y="450" font-size="56">Let them.</text></g>
<g id="lm7"><text class="d" x="250" y="560" font-size="56" style="fill:var(--gain)">Let me</text><path class="s-line" d="M480 570H1010" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="480" y="606" font-size="20">ONE SMALL ACTION</text></g>
<path id="sc7b" class="s-gain" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000"/>
<g id="ck7"><rect class="s-ink" x="250" y="660" width="70" height="70" rx="10" fill="none" stroke-width="6"/><text class="d" x="350" y="712" font-size="44">Do it today.</text></g>
<path id="ckm" class="s-gain" d="M264 694l20 20 40-46" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000"/>
<g id="pen7"><path class="gain" d="M0 0L-9-26H9Z"/><rect class="ink" x="-10" y="-170" width="20" height="144" rx="6"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Who are you trying</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">to control right now?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">What will you let</text></g>
<g id="qd"><text class="d" x="136" y="660" font-size="88" letter-spacing="-2" style="fill:var(--gain)">yourself do instead?</text></g>
<path id="hc8a" class="s-ink" d="M1390 410A70 70 0 0 0 1390 550Z" fill="none" stroke-width="5" stroke-dasharray="10 8"/>
<path id="hc8b" class="gain" d="M1390 410A70 70 0 0 1 1390 550Z"/>
<g id="ql8"><text class="m" x="143" y="780" font-size="26">LET THEM. THEN LET ME.</text></g>
</g>