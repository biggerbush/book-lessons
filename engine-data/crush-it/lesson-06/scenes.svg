<g id="s0">
<text class="m" x="120" y="150" font-size="28">CRUSH IT! · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Care about</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your community.</text>
<text class="b" x="120" y="600" font-size="32">Why replying to people matters more than posting more</text>
<g id="tpost"><rect class="s-ink" x="1150" y="230" width="300" height="180" rx="16" fill="var(--stage)" stroke-width="6"/><path class="gain" d="M1280 285l50 35-50 35z"/><text class="m" x="1300" y="452" font-size="20" text-anchor="middle">PUBLISHED</text></g>
<g id="tbub"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The comment box.</text>
<text class="b" x="120" y="176" font-size="32">A new episode of Wine Library TV goes live.</text>
<g id="vid"><rect class="s-ink" x="120" y="230" width="640" height="360" rx="18" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="150" y="256" width="90" height="36" rx="8"/><text class="m" x="195" y="281" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">LIVE</text>
<rect class="ink" x="425" y="280" width="30" height="64" rx="6"/><rect class="ink" x="400" y="336" width="80" height="190" rx="18"/><rect class="gain" x="412" y="400" width="56" height="60" rx="6"/>
<line class="s-line" x1="150" y1="560" x2="730" y2="560" stroke-width="8" stroke-linecap="round"/><line id="vprog" class="s-gain" x1="150" y1="560" x2="150" y2="560" stroke-width="8" stroke-linecap="round"/></g>
<g id="rows"></g>
<g id="glance"><text class="m" x="840" y="840" font-size="20">MOST CREATORS GLANCE AND MOVE ON</text></g>
<g id="gary"><g id="garyp"></g><rect class="ink" x="270" y="700" width="150" height="95" rx="8"/><rect class="ink" x="250" y="795" width="190" height="12" rx="4"/><circle class="gain" cx="345" cy="747" r="12"/></g>
<g id="ans1"><text class="d5" x="470" y="760" font-size="32">He answered them.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every single one.</text>
<text class="b" x="120" y="176" font-size="32">Comments and emails, answered one by one, personally.</text>
<g id="msgs"></g>
<g id="clk"><circle class="s-ink" cx="1150" cy="420" r="160" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g>
<line id="hh" class="s-ink" x1="1150" y1="420" x2="1150" y2="335" stroke-width="12" stroke-linecap="round"/>
<line id="mh" class="s-gain" x1="1150" y1="420" x2="1150" y2="295" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="1150" cy="420" r="12"/><text class="m" x="1150" y="636" font-size="20" text-anchor="middle">LONG HOURS, LATE INTO THE NIGHT</text></g>
<g id="moon"><path class="gain" d="M1410 220a40 40 0 1 0 34 66a32 32 0 1 1-34-66z"/></g>
<g id="inef"><text class="d" x="120" y="730" font-size="52" style="fill:var(--loss)">It sounds inefficient.</text></g>
<g id="oppo"><text class="d" x="120" y="810" font-size="52" style="fill:var(--gain)">Gary argues it’s the opposite.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Imagine the host actually writes back.</text>
<g id="vw"></g>
<rect class="s-ink" x="640" y="300" width="320" height="240" rx="16" fill="var(--stage)" stroke-width="6"/><g id="host"></g>
<text class="m" x="800" y="580" font-size="20" text-anchor="middle">THE HOST</text>
<g id="cb"><rect class="s-ink" x="400" y="320" width="200" height="64" rx="14" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M424 344h150M424 364h100" stroke-width="6" stroke-linecap="round"/><path class="s-muted" d="M606 352h26m-12-12 12 12-12 12" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="rb"><rect class="gain" x="400" y="420" width="200" height="64" rx="14"/><path d="M424 444h150M424 464h100" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/><path class="s-gain" d="M634 452H608m12-12-12 12 12 12" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="hrtg"><g id="hrt" transform="translate(300 330)"><path class="gain" d="M0 40C-60 0-60-45-30-50C-15-52-4-42 0-32C4-42 15-52 30-50C60-45 60 0 0 40Z"/></g></g>
<g id="seen"><text class="m" x="300" y="258" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU FEEL SEEN</text></g>
