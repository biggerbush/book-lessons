<g id="s0">
<text class="m" x="120" y="150" font-size="28">PURPLE COW · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Design for</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the sneezers.</text>
<text class="b" x="120" y="600" font-size="32">Win the eager few, and they will win everyone else.</text>
