<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ANXIOUS GENERATION · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Overprotected offline,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">underprotected online.</text>
<text class="b" x="120" y="600" font-size="32">Why kids got too much protection outdoors and too little online.</text>
<g id="t_off">
<rect class="s-ink" x="820" y="650" width="240" height="130" fill="none" stroke-width="6" stroke-dasharray="6 14"/>
<g id="t_kid"></g>
<rect class="loss" x="925" y="638" width="30" height="24" rx="4"/>
<path class="s-loss" d="M930 638v-8a10 10 0 0 1 20 0v8" fill="none" stroke-width="5"/>
<text class="m" x="940" y="816" font-size="20" text-anchor="middle">OFFLINE</text>
</g>
<g id="t_on">
<rect class="s-ink" x="1250" y="615" width="100" height="130" rx="14" fill="var(--stage)" stroke-width="7"/>
<g id="t_pkid"></g>
<g id="t_dots"></g>
<text class="m" x="1300" y="816" font-size="20" text-anchor="middle">ONLINE</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fear spread. Crime fell.</text>
<text class="b" x="120" y="176" font-size="32">In the 1980s and 1990s, scary news reached American parents.</text>
<g id="tv">
<path class="s-ink" d="M260 260L220 210M380 260L420 210M260 540l-20 40M380 540l20 40" stroke-width="6" stroke-linecap="round"/>
<rect class="s-ink" x="120" y="260" width="400" height="280" rx="20" fill="var(--stage)" stroke-width="7"/>
<rect class="loss" x="150" y="290" width="340" height="220" fill-opacity=".15"/>
<g id="tvfig"></g>
<g id="tvbar"><rect class="loss" x="150" y="460" width="340" height="50"/><text class="m" x="320" y="492" font-size="20" text-anchor="middle" style="fill:var(--stage)">MISSING CHILD</text></g>
<text class="m" x="320" y="680" font-size="20" text-anchor="middle">TV NEWS</text>
</g>
<g id="milk">
<rect class="s-ink" x="670" y="230" width="120" height="30" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M620 330L670 260H790L840 330V620H620Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="730" y="385" font-size="22" text-anchor="middle" style="fill:var(--loss)">MISSING</text>
<rect class="s-ink" x="680" y="405" width="100" height="120" fill="none" stroke-width="5"/>
<g id="mcfig"></g>
<path class="s-line" d="M660 560h140M660 590h100" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="730" y="680" font-size="20" text-anchor="middle">MILK CARTONS</text>
</g>
<g id="chart">
<text class="m" x="980" y="262" font-size="20">US CRIME</text>
<path class="s-ink" d="M970 280V640H1460" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-muted" d="M1170 300V640" stroke-width="3" stroke-dasharray="6 8"/>
<path id="cr_up" class="s-ink" d="M990 560L1080 500L1170 380" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="cr_dn" class="s-gain" d="M1170 380L1260 440L1350 520L1440 590" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<text class="m" x="1170" y="676" font-size="20" text-anchor="middle">EARLY 1990s</text>
</g>
<g id="fearmsg"><text class="d" x="120" y="800" font-size="44">The fear grew while real danger shrank.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Kids were pulled indoors.</text>
<text class="b" x="120" y="176" font-size="32">Parents kept children close and constantly supervised.</text>
<rect class="s-ink" x="160" y="380" width="320" height="300" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M140 390L320 250L500 390" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g id="kids_in"><text class="m" x="320" y="724" font-size="20" text-anchor="middle">INDOORS, SUPERVISED</text></g>
<g id="acts"></g>
<g id="stamp">
<rect class="s-loss" x="600" y="610" width="880" height="150" rx="18" fill="none" stroke-width="6"/>
<text class="d" x="640" y="694" font-size="64" style="fill:var(--loss)">Safetyism</text>
<text class="m" x="644" y="738" font-size="20">ALMOST ANY RISK TREATED AS UNACCEPTABLE</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A new world in their pockets.</text>
<text class="b" x="120" y="176" font-size="32">Smartphones opened a door with almost no lock.</text>
<g id="phone3">
<rect class="s-ink" x="220" y="230" width="300" height="570" rx="40" fill="var(--stage)" stroke-width="8"/>
<rect class="s-line" x="250" y="290" width="240" height="440" rx="10" fill="none" stroke-width="3"/>
<rect class="loss" x="300" y="400" width="140" height="260" fill-opacity=".35"/>
<polygon id="door3" class="s-ink" points="300,400 440,400 440,660 300,660" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<circle class="s-ink" cx="370" cy="765" r="14" fill="none" stroke-width="4"/>
</g>
<g id="threats"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">An age with no gate.</text>
<text class="b" x="120" y="176" font-size="32">Minimum ages offline. An unchecked box online.</text>
<rect class="s-line" x="120" y="230" width="620" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">REAL WORLD · MINIMUM AGES</text>
<g id="agerows"></g>
<rect class="s-line" x="820" y="230" width="660" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="850" y="280" font-size="22">ONLINE</text>
<g id="online13">
<text class="d" x="850" y="450" font-size="160" letter-spacing="-4">13</text>
<text class="m" x="856" y="545" font-size="20">SET BY A US PRIVACY LAW, 1998</text>
<rect class="ink" x="1290" y="360" width="18" height="120"/>
<rect id="bar13" class="loss" x="1299" y="365" width="140" height="14" rx="4"/>
</g>
<g id="nocheck"><text class="m" x="1370" y="520" font-size="20" text-anchor="middle" style="fill:var(--loss)">NO AGE CHECK</text></g>
<g id="chk">
<rect class="s-ink" x="856" y="640" width="60" height="60" rx="8" fill="var(--stage)" stroke-width="5"/>
<path id="tick" class="s-gain" d="M868 670l14 14l26-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<text class="d5" x="940" y="684" font-size="36">I am 13 or older</text>
<text class="m" x="856" y="750" font-size="20">A TEN-YEAR-OLD TICKS THE BOX</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not built for children.</text>
<text class="b" x="120" y="176" font-size="32">Would you send your child to grow up on Mars?</text>
<g id="mars0">
<circle class="loss" cx="380" cy="510" r="160" fill-opacity=".3"/>
<circle class="s-loss" cx="380" cy="510" r="160" fill="none" stroke-width="6"/>
<circle class="s-loss" cx="320" cy="470" r="26" fill="none" stroke-width="5"/>
<circle class="s-loss" cx="440" cy="580" r="18" fill="none" stroke-width="5"/>
<circle class="s-loss" cx="430" cy="440" r="10" fill="none" stroke-width="4"/>
<text class="m" x="380" y="740" font-size="22" text-anchor="middle">A THOUGHT EXPERIMENT</text>
</g>
<g id="mkid"></g>
<path id="rocket" class="ink" d="M0-26C14-10 14 14 8 22H-8C-14 14-14-10 0-26Z"/>
<g id="notest"><text class="m" x="380" y="790" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO TESTING ON CHILDREN</text></g>
<g id="admach">
<path class="s-line" d="M820 556H1000M1260 556H1480" stroke-width="4"/>
<g id="ad_in"></g><g id="ad_out"></g>
<rect class="s-ink" x="1000" y="380" width="260" height="200" rx="18" fill="var(--stage)" stroke-width="6"/>
<circle id="gear" class="s-ink" cx="1130" cy="460" r="44" fill="none" stroke-width="10" stroke-dasharray="12 10"/>
<text class="m" x="1130" y="550" font-size="20" text-anchor="middle">SOCIAL MEDIA</text>
<text class="m" x="910" y="620" font-size="20" text-anchor="middle">ATTENTION</text>
<text class="m" x="1370" y="620" font-size="20" text-anchor="middle" style="fill:var(--gain)">ADS SOLD</text>
</g>
<g id="adcap"><text class="d" x="820" y="720" font-size="38">Built to capture attention,</text><text class="d" x="820" y="770" font-size="38">not to protect young minds.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Protection, upside down.</text>
<text class="b" x="120" y="176" font-size="32">Shielded from small risks, alone with big ones.</text>
<path class="s-line" d="M280 680H1320" stroke-width="4"/>
<path id="beam" class="s-ink" d="M350 600H1250" stroke-width="10" stroke-linecap="round"/>
<polygon class="ink" points="800,600 765,680 835,680"/>
<g id="lp"></g><g id="rp"></g>
<g id="cap1"><text class="d" x="120" y="790" font-size="40">Too <tspan style="fill:var(--gain)">much</tspan> protection in the real world.</text></g>
<g id="cap2"><text class="d" x="120" y="840" font-size="40">Too <tspan style="fill:var(--loss)">little</tspan> in the virtual one.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rebalance.</text>
<text class="b" x="120" y="176" font-size="32">More freedom offline. More limits online.</text>
<g id="gauges">
<rect class="s-line" x="230" y="260" width="60" height="400" rx="30" fill="none" stroke-width="4"/>
<rect id="gf1" class="gain" x="238" width="44" rx="22"/>
<text class="m" x="260" y="700" font-size="20" text-anchor="middle">FREEDOM OFFLINE</text>
<rect class="s-line" x="510" y="260" width="60" height="400" rx="30" fill="none" stroke-width="4"/>
<rect id="gf2" class="gain" x="518" width="44" rx="22"/>
<text class="m" x="540" y="700" font-size="20" text-anchor="middle">LIMITS ONLINE</text>
</g>
<g id="kidout">
<path class="s-ink" d="M780 700H1460" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="852" y="600" width="16" height="100"/>
<circle class="gain" cx="860" cy="570" r="50"/>
<path class="s-ink" d="M1200 700q12-30 26-20q10-22 26 0" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="kid7"></g>
<text class="m" x="800" y="750" font-size="20">SMALL REAL-WORLD RISKS</text>
</g>
<g id="later">
<rect class="s-ink" x="1310" y="560" width="90" height="140" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1335" y="625" width="40" height="32" rx="5"/>
<path class="s-gain" d="M1343 625v-10a12 12 0 0 1 24 0v10" fill="none" stroke-width="5"/>
<text class="m" x="1355" y="750" font-size="20" text-anchor="middle">DELAY ONLINE</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where can you loosen</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">your grip outdoors, and</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">tighten</tspan> it on screens?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">THINK OF A CHILD IN YOUR LIFE</text></g>
<g id="qg">
