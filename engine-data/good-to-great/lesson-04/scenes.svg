<text class="m" x="1270" y="770" font-size="20" text-anchor="end">SHOPPERS WANT BIGGER STORES, MORE CHOICE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A&amp;P looked away.</text>
<text class="b" x="120" y="176" font-size="32">It ran an experiment, heard a painful truth, and shut it down.</text>
<g id="gk"><g id="gkb"><path class="s-line" d="M140 620H580" stroke-width="4"/></g>
<circle cx="610" cy="300" r="22" fill="none" stroke="var(--gain)" stroke-width="8"/><path d="M632 300h70M682 300v18M698 300v14" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/></g>
<g id="insight"><rect x="160" y="660" width="400" height="70" rx="12" fill="none" stroke="var(--loss)" stroke-width="4"/><text class="m" x="360" y="703" font-size="20" text-anchor="middle" style="fill:var(--loss)">OLD MODEL IS FALLING BEHIND</text></g>
<g id="closed"><g id="closedS"><path d="M310 450L360 420L410 450" fill="none" stroke="var(--ink)" stroke-width="3"/><rect class="loss" x="290" y="450" width="140" height="56" rx="6"/><text class="d" x="360" y="489" font-size="30" text-anchor="middle" style="fill:var(--stage)">CLOSED</text></g></g>
