<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 8</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Know what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is <tspan style="fill:var(--gain)">enough</tspan>.</text>
<text class="b" x="120" y="600" font-size="32">Why knowing what matters beats always wanting more.</text>
<g id="mansion">
<path class="s-line" d="M970 600H1480" stroke-width="5"/>
<polygon class="s-ink" points="990,360 1180,240 1370,360" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="s-ink" x="1020" y="360" width="320" height="240" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1060 390h60v50h-60zM1150 390h60v50h-60zM1240 390h60v50h-60z" fill="none" stroke-width="5"/>
<g id="owner"></g>
<g id="coins"></g>
</g>
<g id="guest"><circle id="glow" class="s-gain" cx="1430" cy="525" r="46" fill="none" stroke-width="4"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two writers at a rich man’s party.</text>
<text class="b" x="120" y="176" font-size="32">Kurt Vonnegut and Joseph Heller.</text>
<g id="party"><path class="s-line" d="M140 250Q800 330 1460 250" fill="none" stroke-width="4"/><g id="bulbs"></g></g>
<g id="writers"><text class="m" x="260" y="600" font-size="20" text-anchor="middle">VONNEGUT</text><text class="m" x="440" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">HELLER</text></g>
<g id="host"><text class="m" x="1200" y="620" font-size="20" text-anchor="middle">THE HOST</text></g>
<g id="bars">
<text class="m" x="120" y="714" font-size="22">CATCH-22, EVER</text>
<rect class="ink" x="480" y="684" width="240" height="44" rx="8"/>
<text class="m" x="120" y="804" font-size="22">HOST, ONE DAY</text>
<rect id="bar2" class="loss" x="480" y="774" width="10" height="44" rx="8"/>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One word.</text>
<text class="b" x="120" y="176" font-size="32">Heller had something the rich man never would.</text>
<g id="heller"><text class="m" x="300" y="690" font-size="22" text-anchor="middle" style="fill:var(--gain)">HELLER</text></g>
<g id="host2"><text class="m" x="1360" y="640" font-size="20" text-anchor="middle">THE HOST</text></g>
<g id="bub">
<path class="s-ink" d="M520 430L430 470L520 500z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="500" y="260" width="680" height="280" rx="30" fill="var(--stage)" stroke-width="6"/>
<path d="M506 436v58" stroke="var(--stage)" stroke-width="10"/>
<g id="dots"><circle class="ink" cx="1080" cy="500" r="10"/><circle class="ink" cx="1110" cy="500" r="10"/><circle class="ink" cx="1140" cy="500" r="10"/></g>
<g id="btxt"><text class="d5" x="540" y="380" font-size="46">“I’ve got something</text><text class="d5" x="540" y="460" font-size="46">he can never have.”</text></g>
</g>
<g id="sign"><rect class="gain" x="500" y="600" width="680" height="180" rx="20"/><text class="d" x="840" y="730" font-size="110" text-anchor="middle" style="fill:var(--on-gain)">Enough.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The top keeps moving.</text>
<text class="b" x="120" y="176" font-size="32">With no clear sense of what matters, every win points to the next.</text>
<g id="lad"><path class="s-ink" d="M700 830V230M820 830V230" stroke-width="8" stroke-linecap="round"/></g>
<g id="rungs"></g>
<g id="flag"><path class="s-ink" d="M840 0v-100" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M840 -100l90 25-90 25z"/><text class="m" x="680" y="-60" font-size="22" text-anchor="end" style="fill:var(--gain)">THE TOP</text></g>
<g id="climb"></g>
<g id="w0"><text class="d" x="980" y="360" font-size="52">More money.</text></g>
<g id="w1"><text class="d" x="980" y="450" font-size="52">More status.</text></g>
<g id="w2"><text class="d" x="980" y="540" font-size="52">More praise.</text></g>
<g id="restless"><text class="m" x="980" y="640" font-size="22" style="fill:var(--loss)">THE RESTLESS FEELING STAYS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Watching other people.</text>
<text class="b" x="120" y="176" font-size="32">Their bigger title or nicer house makes ours feel small.</text>
<g id="you4"><text class="m" x="160" y="780" font-size="22" text-anchor="middle">YOU</text></g>
<g id="them4"><text class="m" x="1430" y="780" font-size="22" text-anchor="middle">THEM</text></g>
<path id="eye" class="s-muted" d="M200 600Q800 420 1400 600" fill="none" stroke-width="4" stroke-dasharray="8 10"/>
<g id="scl">
<path class="s-ink" d="M800 300V760" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="700" y="760" width="200" height="20" rx="8"/>
<g id="beam"><path class="s-ink" d="M-360 0H360" stroke-width="8" stroke-linecap="round"/><circle class="ink" r="14"/></g>
<g id="panL"><path class="s-muted" d="M0 0L-110 140M0 0L110 140" stroke-width="3"/><path class="ink" d="M-120 140a120 34 0 0 0 240 0z"/><path class="ink" d="M-28 115L0 95L28 115zM-22 115h44v25h-44z"/><text class="m" x="0" y="200" font-size="22" text-anchor="middle">YOURS</text></g>
<g id="panR"><path class="s-muted" d="M0 0L-110 140M0 0L110 140" stroke-width="3"/><path class="ink" d="M-120 140a120 34 0 0 0 240 0z"/><path class="loss" d="M-55 90L0 55L55 90zM-45 90h90v50h-90z"/><text class="m" x="0" y="200" font-size="22" text-anchor="middle" style="fill:var(--loss)">THEIRS</text></g>
</g>
<g id="goals"><text class="d" x="120" y="840" font-size="44">Ego treats their goals as if they were ours.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Seneca’s word.</text>
<text class="b" x="120" y="176" font-size="32">Holiday turns to the Stoic philosopher for a better aim.</text>
<g id="sen"><text class="m" x="260" y="660" font-size="22" text-anchor="middle">SENECA</text><text class="m" x="260" y="692" font-size="20" text-anchor="middle">STOIC PHILOSOPHER</text></g>
<g id="word"><text class="d" x="520" y="390" font-size="110" letter-spacing="-2" style="fill:var(--gain)">euthymia</text></g>
<g id="wsub"><text class="m" x="524" y="460" font-size="20">A CALM SENSE OF BEING ON YOUR OWN PATH</text></g>
<g id="roads"></g>
<g id="racers"></g>
<g id="comp">
<circle class="s-ink" cx="1260" cy="500" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M1260 375v20M1260 605v20M1135 500h20M1365 500h20" stroke-width="5" stroke-linecap="round"/>
<g id="needle"><path class="gain" d="M0 -110L18 0H-18z"/><path class="ink" d="M0 110L18 0H-18z"/><circle class="ink" r="10"/></g>
</g>
<g id="own"><text class="m" x="1260" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOUR OWN DIRECTION</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Name what matters.</text>
<text class="b" x="120" y="176" font-size="32">Know it, then say no to the prizes that don’t serve it.</text>
<g id="book">
<rect class="s-ink" x="120" y="230" width="520" height="550" rx="16" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M160 425h440M160 525h440M160 625h440" stroke-width="3"/>
<text class="m" x="160" y="290" font-size="22">WHAT MATTERS TO ME</text>
</g>
<g id="vals"></g>
<g id="ph"><text class="m" x="760" y="290" font-size="22" style="fill:var(--loss)">PRIZES OTHERS CHASE</text></g>
<g id="prz"></g>
<g id="no6"><text class="d" x="760" y="720" font-size="40" style="fill:var(--gain)">Say no to what doesn’t serve it.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Enough is a choice.</text>
<text class="b" x="120" y="176" font-size="32">Not a number someone hands you. You decide it.</text>
<g id="track">
<path class="s-ink" d="M120 600H900" stroke-width="8" stroke-linecap="round"/>
<path class="s-muted" d="M920 600H1450M1430 586l20 14-20 14" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<text class="m" x="960" y="660" font-size="20">THE HOST’S ROAD: MORE</text>
</g>
<g id="fin"><g id="chk"></g><path class="s-ink" d="M900 560V420" stroke-width="6" stroke-linecap="round"/><rect class="gain" x="900" y="420" width="160" height="50"/><text class="m" x="980" y="453" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">ENOUGH</text></g>
<g id="walker"></g>
<g id="faceg">
<circle class="gain" cx="1250" cy="360" r="90"/>
<path class="s-ink" d="M1210 345q15 12 30 0M1260 345q15 12 30 0M1215 390q35 30 70 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1250" y="500" font-size="22" text-anchor="middle">PEACE, NOT HUNGER</text>
</g>
<g id="s7t"><text class="d" x="120" y="800" font-size="44">His own aims, not his host’s bank balance.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Write one sentence:</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">what does <tspan style="fill:var(--gain)">enough</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">look like for you?</text></g>
<g id="page"><rect class="s-ink" x="1180" y="260" width="240" height="320" rx="12" fill="var(--stage)" stroke-width="6"/><g id="plines"></g><path class="gain" d="M1440 470l26 14-70 120-30 14 4-34z"/></g>
<g id="rd"><text class="m" x="143" y="700" font-size="26">READ IT BEFORE YOU CHASE MORE</text></g>
</g>