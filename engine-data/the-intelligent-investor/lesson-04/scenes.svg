<g id="map"><text class="m" x="840" y="236" font-size="20">DIGGING MOST PEOPLE WON’T DO</text>
<rect class="s-ink" x="840" y="260" width="620" height="440" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1047 260V700M1253 260V700" stroke-width="3" stroke-dasharray="10 8"/>
