<text class="m" x="1270" y="646" font-size="24" text-anchor="middle" style="fill:var(--loss)">2011</text></g></g>
<g id="score"></g>
<g id="fail"><text class="d" x="120" y="730" font-size="44">It failed nearly every one of the seven.</text></g>
