<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atomic Habits Lesson Three</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays five scenes, with a transport bar beneath it. */
:root{
  --bg:#E9EEF2; --stage:#F6F8FA; --ink:#12233A; --muted:#5C6B7E; --line:#C5CFD9;
  --gain:#C97F00; --loss:#5562C4; --ice:#BFDDF0; --on-gain:#12233A;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:14px}
@keyframes wmmove{0%{transform:translate(0,0)}25%{transform:translate(-1330px,0)}50%{transform:translate(-1330px,-812px)}75%{transform:translate(0,-812px)}}
.wmc{animation:wmmove 80s step-end infinite}
@media (prefers-reduced-motion:reduce){.wmc{animation:none}}
#stageBox{background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
#stageBox:fullscreen{border:0;border-radius:0;aspect-ratio:auto;display:flex;align-items:center}
svg{display:block;width:100%;height:100%}
.d{font-family:var(--display);font-weight:800;fill:var(--ink)}
.d5{font-family:var(--display);font-weight:500;fill:var(--ink)}
.b{font-family:var(--body);fill:var(--muted)}
.m{font-family:var(--mono);fill:var(--muted);letter-spacing:.04em}
.ink{fill:var(--ink)} .gain{fill:var(--gain)} .loss{fill:var(--loss)}
.s-ink{stroke:var(--ink)} .s-line{stroke:var(--line)} .s-gain{stroke:var(--gain)} .s-loss{stroke:var(--loss)} .s-muted{stroke:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
#play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:86px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--gain)}
#clock{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font-weight:400;font-size:13px;padding:6px 10px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch;margin:4px 0 0}
</style>

<div class="wrap">
  <div id="stageBox">
    <svg viewBox="0 0 1600 900" role="img" aria-label="Animated summary of the third lesson of Atomic Habits: the four-step habit loop and the four laws of behaviour change. Six scenes.">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.6" fill="var(--line)"/></pattern>
      </defs>
      <rect width="1600" height="900" fill="var(--stage)"/>
      <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>

      <!-- 1 Title -->
      <g id="s0">
        <text class="m" x="120" y="150" font-size="28">ATOMIC HABITS · CHAPTER 3</text>
        <text class="d" x="104" y="540" font-size="380" letter-spacing="-12">4</text>
        <text class="d5" x="120" y="660" font-size="84">steps behind every habit.</text>
        <text class="b" x="120" y="740" font-size="32">Lesson three: how habits form, and how to build them. Press Play for sound.</text>
        <g transform="translate(1250 400)" fill="none" stroke-width="3">
          <ellipse class="s-line" rx="240" ry="84"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(60)"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(120)"/>
          <circle class="gain" r="36" stroke="none"/>
          <circle id="e0" class="ink" r="13" stroke="none"/><circle id="e1" class="ink" r="13" stroke="none"/><circle id="e2" class="ink" r="13" stroke="none"/>
        </g>
      </g>

      <!-- 2 Thorndike -->
      <g id="s1" opacity="0">
        <text class="d" x="120" y="124" font-size="68">A cat in a puzzle box, 1898.</text>
        <text class="b" x="120" y="176" font-size="32">Edward Thorndike timed every escape.</text>
        <g id="cat">
          <path class="s-ink" d="M208 596q-52-22-30-84" fill="none" stroke-width="14" stroke-linecap="round"/>
          <ellipse class="ink" cx="300" cy="594" rx="95" ry="58"/>
          <circle class="ink" cx="385" cy="524" r="44"/>
          <polygon class="ink" points="350,498 358,456 384,484"/><polygon class="ink" points="392,484 416,456 422,500"/>
          <circle cx="402" cy="518" r="5" fill="var(--stage)"/>
        </g>
        <g class="s-line" stroke-width="4"><path d="M180 300v360M240 300v360M300 300v360M360 300v360M420 300v360M480 300v360M540 300v360" fill="none"/></g>
        <path class="s-ink" d="M600 300H120v360h480" fill="none" stroke-width="6" stroke-linejoin="round"/>
        <rect id="lever" class="gain" x="500" y="350" width="64" height="14" rx="7"/>
        <line id="door" class="s-gain" x1="600" y1="300" x2="600" y2="660" stroke-width="10" stroke-linecap="round"/>
        <path class="gain" d="M640 640h90a45 28 0 0 1-90 0z"/>
        <text class="m" x="640" y="700" font-size="22">FOOD</text>
        <text class="m" x="860" y="300" font-size="24">TIME TO ESCAPE (SKETCH)</text>
        <path class="s-line" d="M860 330v290h580" fill="none" stroke-width="3"/>
        <polyline id="learn" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="learnHead" class="gain" r="11" cx="860" cy="620" opacity="0"/>
        <text class="m" x="860" y="660" font-size="24">TRY 1</text>
        <text class="m" x="1440" y="660" font-size="24" text-anchor="end">TRY 30</text>
        <text id="lblMin" class="d5" x="900" y="372" font-size="36">over a minute</text>
        <text id="lblSec" class="d5" x="1440" y="560" font-size="36" text-anchor="end">a few seconds</text>
        <g id="rewarded"><text class="d" x="120" y="800" font-size="56">Whatever gets rewarded gets repeated.</text></g>
      </g>

      <!-- 3 The loop -->
      <g id="s2" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Every habit runs the same loop.</text>
        <text class="b" x="120" y="176" font-size="32">Four steps, always in this order.</text>
        <circle class="s-line" cx="430" cy="545" r="200" fill="none" stroke-width="6"/>
        <circle id="loopArc" class="s-gain" cx="430" cy="545" r="200" fill="none" stroke-width="8" stroke-linecap="round" transform="rotate(-90 430 545)" stroke-dasharray="0 1257"/>
        <circle id="loopDot" class="ink" r="15" cx="430" cy="345" opacity="0"/>
        <g id="nodes"></g>
        <g id="lr0"><text class="d" x="820" y="320" font-size="52">Cue</text><text class="b" x="820" y="364" font-size="32">Your phone buzzes.</text></g>
        <g id="lr1"><text class="d" x="820" y="440" font-size="52">Craving</text><text class="b" x="820" y="484" font-size="32">You want to know who it is.</text></g>
        <g id="lr2"><text class="d" x="820" y="560" font-size="52">Response</text><text class="b" x="820" y="604" font-size="32">You pick it up.</text></g>
        <g id="lr3"><text class="d" x="820" y="680" font-size="52">Reward</text><text class="b" x="820" y="724" font-size="32">You find out.</text></g>
        <g id="loopStatus"><text class="d5" x="820" y="806" font-size="40">Repeat it enough and it runs by itself.</text></g>
      </g>

      <!-- 4 Four laws -->
      <g id="s3" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Four laws for a good habit.</text>
        <text class="b" x="120" y="176" font-size="32">One lever for each step of the loop.</text>
        <g id="law0"><text class="m" x="120" y="344" font-size="28">CUE</text><text class="d" x="420" y="350" font-size="76">Make it obvious.</text></g>
        <g id="law1"><text class="m" x="120" y="464" font-size="28">CRAVING</text><text class="d" x="420" y="470" font-size="76">Make it attractive.</text></g>
        <g id="law2"><text class="m" x="120" y="584" font-size="28">RESPONSE</text><text class="d" x="420" y="590" font-size="76">Make it easy.</text></g>
        <g id="law3"><text class="m" x="120" y="704" font-size="28">REWARD</text><text class="d" x="420" y="710" font-size="76">Make it satisfying.</text></g>
      </g>

      <!-- 5 Inverse -->
      <g id="s4" opacity="0">
        <text class="d" x="120" y="124" font-size="68">To break a bad one, flip them.</text>
        <text class="b" x="120" y="176" font-size="32">The same four levers, pulled the other way.</text>
        <g id="olds">
          <text id="w0" class="d5" x="120" y="350" font-size="56" fill-opacity=".6">obvious</text>
          <text id="w1" class="d5" x="120" y="470" font-size="56" fill-opacity=".6">attractive</text>
          <text id="w2" class="d5" x="120" y="590" font-size="56" fill-opacity=".6">easy</text>
          <text id="w3" class="d5" x="120" y="710" font-size="56" fill-opacity=".6">satisfying</text>
        </g>
        <line id="sk0" class="s-ink" x1="112" y1="332" x2="112" y2="332" stroke-width="5" stroke-linecap="round"/>
        <line id="sk1" class="s-ink" x1="112" y1="452" x2="112" y2="452" stroke-width="5" stroke-linecap="round"/>
        <line id="sk2" class="s-ink" x1="112" y1="572" x2="112" y2="572" stroke-width="5" stroke-linecap="round"/>
        <line id="sk3" class="s-ink" x1="112" y1="692" x2="112" y2="692" stroke-width="5" stroke-linecap="round"/>
        <g id="inv0"><rect class="loss" x="560" y="322" width="34" height="8"/><text class="d" x="620" y="350" font-size="76">Make it invisible.</text></g>
        <g id="inv1"><rect class="loss" x="560" y="442" width="34" height="8"/><text class="d" x="620" y="470" font-size="76">Make it unattractive.</text></g>
        <g id="inv2"><rect class="loss" x="560" y="562" width="34" height="8"/><text class="d" x="620" y="590" font-size="76">Make it difficult.</text></g>
        <g id="inv3"><rect class="loss" x="560" y="682" width="34" height="8"/><text class="d" x="620" y="710" font-size="76">Make it unsatisfying.</text></g>
      </g>

      <!-- 6 Close -->
      <g id="s5" opacity="0">
        <g id="q1"><text id="q1t" class="d5" x="140" y="220" font-size="60" fill-opacity=".6">Not enough willpower?</text></g>
        <line id="st2" class="s-ink" x1="132" y1="200" x2="132" y2="200" stroke-width="5" stroke-linecap="round"/>
        <g id="q2a"><text class="d" x="136" y="420" font-size="136" letter-spacing="-3">Which step</text></g>
        <g id="q2b"><text class="d" x="136" y="560" font-size="136" letter-spacing="-3">is missing?</text></g>
        <text class="m" x="143" y="720" font-size="26">CUE · CRAVING · RESPONSE · REWARD</text>
      </g>
      <g id="wm" aria-hidden="true" pointer-events="none">
        <defs><pattern id="wmtile" width="560" height="360" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="24" y="190" font-family="DM Mono,monospace" font-size="34" font-weight="500" fill="var(--ink)" opacity=".06">visualgrowth.app</text></pattern></defs>
        <rect width="1600" height="900" fill="url(#wmtile)"/>
        <g class="wmc"><text x="1564" y="868" text-anchor="end" font-family="DM Mono,monospace" font-size="30" font-weight="500" fill="var(--ink)" stroke="var(--stage)" stroke-width="6" paint-order="stroke" opacity=".62">visualgrowth.app</text></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="85" step="0.01" value="0" aria-label="Position in the animation">
    <span id="clock">0:00 / 1:25</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">A paraphrased summary of chapter 3 of James Clear's <em>Atomic Habits</em>. The escape-time curve is a sketch of the pattern, not Thorndike's data. Narration is an AI voice generated with ElevenLabs.</p>
</div>

<audio id="vo" preload="auto" src="lesson-03.mp3"></audio>
<script>
(function(){
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b)=>ease(lin(t,a,b));
// K scales the scene timings to the narration length
const K=1, DUR=85, SC=[[0,5.6],[5.6,31.3],[31.3,52.8],[52.8,65.7],[65.7,73.05],[73.05,85]].map(a=>[a[0]*K,a[1]*K]);
const NAMES=['Four steps','The cat in the box','The loop','Four laws','Breaking a habit','The question'];
const TM={lever:12.31,door:13.4,first:16.09,minute:18.8,secondsEnd:23.6,seconds:22.6,rewarded:28.64,cue:35.21,craving:37.57,response:40.47,reward:42.85,repeat:45.39,laws:[60.23,61.51,62.92,64.21],flip:66.2,inv:[68.39,69.65,70.76,71.57],q1:73.7,qstrike:75.9,q2:77.68};

// loop nodes: top, right, bottom, left
const NP=[[430,345],[630,545],[430,745],[230,545]], NL=['CUE','CRAVING','RESPONSE','REWARD'];
const nodes=NP.map((q,i)=>{const g=mk('g',{},$('nodes'));
  const c=mk('circle',{cx:q[0],cy:q[1],r:64,'stroke-width':5},g);
  const tx=mk('text',{x:q[0],y:q[1]+8,'font-size':21,'text-anchor':'middle',style:'font-family:var(--mono);letter-spacing:.04em'},g);tx.textContent=NL[i];return [c,tx]});
const LT=[TM.cue,TM.craving,TM.response,TM.reward];
const W={w0:200,w1:250,w2:120,w3:260,q1t:620};
function measure(){for(const k in W){try{const v=$(k).getComputedTextLength();if(v>0)W[k]=v}catch(e){}}}
measure(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();render(t)});
// learning curve: a sketch of escape time falling over 30 tries (0-100 scale)
const LY=n=>8+84*Math.exp(-n/5)+7*Math.sin(n*2.3)*Math.exp(-n/9);
const LX=n=>860+n/29*580, LYp=v=>620-v*2.75;

function vis(t,i){const[a,b]=SC[i],last=i===SC.length-1;
  if(t<a||(t>=b&&!last))return 0;
  return Math.min(i===0?1:lin(t,a,a+.6), last?1:1-lin(t,b-.5,b));}
function rise(el,k){el.setAttribute('opacity',k);el.setAttribute('transform','translate(0 '+((1-k)*22).toFixed(1)+')')}
function strike(id,w,k){$(id).setAttribute('x2',(+$(id).getAttribute('x1')+(w+16)*k).toFixed(1));$(id).setAttribute('opacity',k>0?1:0)}

function render(t){
  const u=t/K;
  for(let i=0;i<SC.length;i++)$('s'+i).setAttribute('opacity',vis(t,i).toFixed(3));

  // title: electrons
  for(let i=0;i<3;i++){const a=t*1.5+i*2.1, th=i*Math.PI/3, x=240*Math.cos(a), y=84*Math.sin(a);
    $('e'+i).setAttribute('cx',(x*Math.cos(th)-y*Math.sin(th)).toFixed(1));
    $('e'+i).setAttribute('cy',(x*Math.sin(th)+y*Math.cos(th)).toFixed(1));}

  // the cat in the box
  const press=p(u,TM.lever,TM.lever+.5), open=p(u,TM.door,TM.door+.8), walk=p(u,TM.door+.6,TM.door+2);
  $('lever').setAttribute('transform','rotate('+(22*press).toFixed(1)+' 564 357)');
  $('door').setAttribute('y2',(660-330*open).toFixed(1));
  $('cat').setAttribute('transform','translate('+(150*walk).toFixed(1)+' 0)');
  const N=29*lin(u,TM.first,TM.secondsEnd); let pts='';
  for(let n=0;n<N;n+=.5)pts+=LX(n).toFixed(1)+','+LYp(LY(n)).toFixed(1)+' ';
  pts+=LX(N).toFixed(1)+','+LYp(LY(N)).toFixed(1);
  $('learn').setAttribute('points',pts);
  $('learnHead').setAttribute('cx',LX(N));$('learnHead').setAttribute('cy',LYp(LY(N)));$('learnHead').setAttribute('opacity',u>=TM.first?1:0);
  $('lblMin').setAttribute('opacity',p(u,TM.minute,TM.minute+.5)); $('lblSec').setAttribute('opacity',p(u,TM.seconds,TM.seconds+.5));
  rise($('rewarded'),p(u,TM.rewarded,TM.rewarded+.6));

  // the loop
  const s=Math.max(0,u-TM.repeat);
  const prog=.25*p(u,TM.craving-.5,TM.craving+.1)+.25*p(u,TM.response-.5,TM.response+.1)+.25*p(u,TM.reward-.5,TM.reward+.1)+.25*p(u,TM.repeat-.4,TM.repeat+.2)+.3*s+.06*s*s;
  const ang=-Math.PI/2+2*Math.PI*prog;
  $('loopDot').setAttribute('cx',(430+200*Math.cos(ang)).toFixed(1));$('loopDot').setAttribute('cy',(545+200*Math.sin(ang)).toFixed(1));
  $('loopDot').setAttribute('opacity',p(u,TM.cue,TM.cue+.4));
  $('loopArc').setAttribute('stroke-dasharray',(1256.6*Math.min(1,prog)).toFixed(1)+' 1257');
  nodes.forEach((n,i)=>{const on=u>=LT[i];
    n[0].setAttribute('fill',on?'var(--gain)':'var(--stage)');n[0].setAttribute('stroke',on?'var(--gain)':'var(--ink)');
    n[1].style.fill=on?'var(--on-gain)':'var(--muted)'; rise($('lr'+i),p(u,LT[i],LT[i]+.5))});
  rise($('loopStatus'),p(u,TM.repeat,TM.repeat+.6));

  // four laws and their inverse
  TM.laws.forEach((a,i)=>rise($('law'+i),p(u,a,a+.5)));
  $('olds').setAttribute('opacity',p(u,TM.flip,TM.flip+.6));
  TM.inv.forEach((a,i)=>{strike('sk'+i,W['w'+i],p(u,a-.3,a+.3));rise($('inv'+i),p(u,a,a+.5))});

  // close
  rise($('q1'),p(u,TM.q1,TM.q1+.5)); strike('st2',W.q1t,p(u,TM.qstrike,TM.qstrike+.7));
  rise($('q2a'),p(u,TM.q2,TM.q2+.6)); rise($('q2b'),p(u,TM.q2+.3,TM.q2+.9));
}

// transport: the narration is the master clock while it is playing
const au=$('vo');
const alen=()=>isFinite(au.duration)&&au.duration>0?au.duration:81.71;
const chap=$('chapters'), cbtns=NAMES.map((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;
  b.addEventListener('click',()=>{t=SC[i][0]+(i?0.01:0);start()});chap.appendChild(b);return b});
let t=0, playing=false, prev=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function sync(){
  render(t); $('seek').value=t; $('clock').textContent=fmt(t)+' / '+fmt(DUR);
  $('play').textContent=playing?'Pause':(t>=DUR?'Replay':'Play');
  cbtns.forEach((b,i)=>b.setAttribute('aria-current',t>=SC[i][0]&&(t<SC[i][1]||i===SC.length-1)?'true':'false'));
}
function start(){
  if(t>=DUR)t=0; playing=true;
  if(t<alen()-.05){try{au.currentTime=t;const r=au.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  sync();
}
function stop(){playing=false;try{au.pause()}catch(e){} sync()}
function frame(now){
  if(playing&&prev!==null){
    if(!au.paused&&!au.ended&&au.readyState>2)t=au.currentTime; else t+=Math.min(.1,(now-prev)/1000);
    if(t>=DUR){t=DUR;playing=false;try{au.pause()}catch(e){}}
    sync();
  }
  prev=now; requestAnimationFrame(frame);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('seek').addEventListener('input',e=>{t=+e.target.value;stop()});
$('mute').addEventListener('click',e=>{au.muted=!au.muted;e.target.textContent=au.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',au.muted)});
$('full').addEventListener('click',()=>{const el=$('stageBox');
  try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}});
sync(); requestAnimationFrame(frame);
})();
</script>
</html>
