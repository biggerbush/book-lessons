<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You are living a dream</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you didn’t choose.</text>
<text class="b" x="120" y="600" font-size="32">How childhood rules quietly became the story you live by</text>
<rect class="s-ink" x="1150" y="720" width="320" height="24" rx="6" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1166 744v36M1454 744v36" stroke-width="8" stroke-linecap="round"/>
<ellipse class="s-line" cx="1196" cy="702" rx="42" ry="14" fill="var(--stage)" stroke-width="5"/>
<circle class="ink" cx="1200" cy="676" r="28"/>
<path class="ink" d="M1240 720v-30a30 30 0 0 1 30-30h160a30 30 0 0 1 30 30v30z"/>
<g id="zz"><text class="d" x="1140" y="630" font-size="34" style="fill:var(--gain)">z</text><text class="d" x="1112" y="596" font-size="24" style="fill:var(--gain)">z</text></g>
<g id="cloud0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Born without beliefs.</text>
<text class="b" x="120" y="176" font-size="32">A newborn has no opinions about who she is or how the world works.</text>
<g id="baby"><text class="m" x="800" y="780" font-size="20" text-anchor="middle">NO OPINIONS YET</text></g>
<g id="mind"><circle class="s-muted" cx="800" cy="390" r="100" fill="none" stroke-width="4" stroke-dasharray="10 10"/><path class="s-muted" d="M800 556V500" stroke-width="4" stroke-dasharray="4 8"/><g id="dots"></g></g>
<g id="ad"></g>
<g id="bubs"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">We never chose language.</text>
<text class="b" x="120" y="176" font-size="32">Nobody asked you whether a tree should be called a tree.</text>
<g id="tree">
<path class="s-line" d="M180 700H540" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="330" y="480" width="40" height="220"/>
<circle cx="280" cy="450" r="70" fill="var(--line)" class="s-ink" stroke-width="6"/>
<circle cx="420" cy="450" r="70" fill="var(--line)" class="s-ink" stroke-width="6"/>
<circle cx="350" cy="400" r="100" fill="var(--line)" class="s-ink" stroke-width="6"/>
</g>
<g id="card">
<path class="s-muted" d="M510 425H590m-18-16 18 16-18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="600" y="380" width="300" height="90" rx="14" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="750" y="447" font-size="64" text-anchor="middle">tree</text>
</g>
<g id="who"><text class="m" x="750" y="520" font-size="20" text-anchor="middle">WHO DECIDED THIS?</text></g>
<g id="ppl">
<text class="m" x="1220" y="552" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text>
<text class="m" x="1220" y="600" font-size="20" text-anchor="middle">EVERYONE CALLS IT A TREE</text>
</g>
<g id="says"></g>
<g id="agree"><text class="d" x="120" y="800" font-size="50">That acceptance is an <tspan style="fill:var(--gain)">agreement.</tspan></text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trained like a pet.</text>
<text class="b" x="120" y="176" font-size="32">Rewards and punishments shape what we do.</text>
<g id="dog">
<path class="s-ink" d="M220 560v70M260 560v70M320 560v70M360 560v70M190 505q-34-20-22-62" fill="none" stroke-width="10" stroke-linecap="round"/>
<ellipse class="ink" cx="290" cy="520" rx="110" ry="48"/>
<circle class="ink" cx="410" cy="455" r="40"/>
<path class="ink" d="M384 430l-6-40 30 22z"/>
<circle cx="424" cy="446" r="5" fill="var(--stage)"/>
<g id="bone"><rect class="gain" x="-22" y="-6" width="44" height="12"/><circle class="gain" cx="-24" cy="-7" r="8"/><circle class="gain" cx="-24" cy="7" r="8"/><circle class="gain" cx="24" cy="-7" r="8"/><circle class="gain" cx="24" cy="7" r="8"/></g>
<text class="m" x="300" y="690" font-size="20" text-anchor="middle">A DOG</text>
</g>
<g id="child">
<text class="d" x="610" y="560" font-size="80" text-anchor="middle" style="fill:var(--muted)">≈</text>
<circle class="ink" cx="800" cy="420" r="30"/><path class="ink" d="M755 546v-39a45 45 0 0 1 90 0v39z"/>
<text class="m" x="800" y="690" font-size="20" text-anchor="middle">A CHILD</text>
</g>
<g id="good">
<path class="s-gain" d="M860 470L1050 340" stroke-width="6" stroke-linecap="round"/>
<path id="star" class="gain"/>
<text class="m" x="1170" y="312" font-size="22" style="fill:var(--gain)">“GOOD GIRL!”</text>
<text class="m" x="1170" y="344" font-size="22" style="fill:var(--gain)">“GOOD BOY!”</text>
</g>
<g id="frown">
<path class="s-loss" d="M860 520L1050 605" stroke-width="6" stroke-linecap="round"/>
<circle class="s-loss" cx="1110" cy="620" r="38" fill="none" stroke-width="6"/>
<circle class="loss" cx="1097" cy="608" r="5"/><circle class="loss" cx="1123" cy="608" r="5"/>
<path class="s-loss" d="M1092 642q18-16 36 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1170" y="616" font-size="22">A FROWN OR</text>
<text class="m" x="1170" y="648" font-size="22">PUNISHMENT</text>
</g>
<g id="dom"><text class="d" x="120" y="800" font-size="56">He calls it <tspan style="fill:var(--gain)">domestication.</tspan></text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pretending to please.</text>
<text class="b" x="120" y="176" font-size="32">We learn to act in ways that earn approval.</text>
<g id="ticks"></g>
<g id="real"></g>
<g id="maskg">
<path class="s-ink" d="M600 470L660 600" stroke-width="8" stroke-linecap="round"/>
<ellipse class="gain" cx="560" cy="400" rx="64" ry="78"/>
<ellipse cx="536" cy="384" rx="12" ry="8" fill="var(--stage)"/><ellipse cx="584" cy="384" rx="12" ry="8" fill="var(--stage)"/>
<path d="M528 422q32 30 64 0" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="mlabel"><text class="m" x="560" y="680" font-size="20" text-anchor="middle">THE MASK THAT EARNS APPROVAL</text></g>
<g id="tcloud"></g>
<g id="fear"><text class="d" x="120" y="800" font-size="48">A quiet fear: <tspan style="fill:var(--loss)">“I’m not good enough.”</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Book of Law inside.</text>
<text class="b" x="120" y="176" font-size="32">Thousands of agreements pile up in the mind.</text>
<g id="pile"></g>
<text class="m" x="330" y="770" font-size="20" text-anchor="middle">AGREEMENTS</text>
<g id="arrow5"><path class="s-muted" d="M560 500H630m-18-16 18 16-18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="book">
<text class="m" x="1060" y="270" font-size="22" text-anchor="middle">BOOK OF LAW</text>
<rect class="s-ink" x="680" y="300" width="370" height="400" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="1070" y="300" width="370" height="400" rx="10" fill="var(--stage)" stroke-width="6"/>
<g id="words"></g>
</g>
<g id="lock5">
<path class="s-loss" d="M1030 690v-30a30 30 0 0 1 60 0v30" fill="none" stroke-width="10"/>
<rect class="loss" x="1010" y="690" width="100" height="80" rx="10"/>
<circle cx="1060" cy="724" r="10" fill="var(--stage)"/>
</g>
<g id="follow"><text class="d" x="120" y="840" font-size="40">We follow it without question, even when it hurts.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The dream of the planet.</text>
<text class="b" x="120" y="176" font-size="32">Each family, school and country shares rules that shape it.</text>
<g id="r2"><circle class="s-muted" cx="420" cy="510" r="230" fill="none" stroke-width="5"/><text class="m" x="420" y="306" font-size="20" text-anchor="middle">COUNTRY</text></g>
<g id="r1"><circle class="s-ink" cx="420" cy="510" r="165" fill="none" stroke-width="5"/><text class="m" x="420" y="376" font-size="20" text-anchor="middle">SCHOOL</text></g>
<g id="r0"><circle class="s-gain" cx="420" cy="510" r="100" fill="none" stroke-width="5"/><text class="m" x="420" y="480" font-size="20" text-anchor="middle">FAMILY</text><circle class="ink" cx="420" cy="516" r="12"/><path class="ink" d="M402 566v-16a18 18 0 0 1 36 0v16z"/></g>
<g id="arr6"><path class="s-muted" d="M670 510H790m-18-16 18 16-18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="globe6">
<circle class="s-ink" cx="1150" cy="500" r="180" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M1016 380H1284M980 440H1320M970 500H1330M980 560H1320M1016 620H1284" stroke-width="4"/>
<ellipse class="s-ink" cx="1150" cy="500" rx="120" ry="180" fill="none" stroke-width="5"/>
<ellipse class="s-ink" cx="1150" cy="500" rx="56" ry="180" fill="none" stroke-width="5"/>
<path class="s-ink" d="M1150 320V680" stroke-width="5"/>
</g>
<g id="dring"><circle class="s-gain" cx="1150" cy="500" r="270" fill="none" stroke-width="4" stroke-dasharray="10 12"/></g>
<g id="crowd"></g>
<g id="notice"><text class="d" x="120" y="830" font-size="44">Most of us never notice we are dreaming.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Agreements can change.</text>
<text class="b" x="120" y="176" font-size="32">If you agreed to a belief, you can also disagree with it.</text>
<g id="lock7">
<path id="shk" class="s-ink" d="M350 490V420a50 50 0 0 1 100 0V490" fill="none" stroke-width="14"/>
<rect id="lbody" x="320" y="470" width="160" height="140" rx="14" style="fill:var(--loss)"/>
<circle cx="400" cy="525" r="14" fill="var(--stage)"/><rect x="394" y="530" width="12" height="34" fill="var(--stage)"/>
<g id="keyg"><circle cx="-110" cy="0" r="24" fill="none" stroke="var(--gain)" stroke-width="10"/><path d="M-86 0H-8M-36 0v20M-18 0v14" fill="none" stroke="var(--gain)" stroke-width="10" stroke-linecap="round"/></g>
</g>
<g id="undo"><text class="m" x="400" y="670" font-size="22" text-anchor="middle">WHAT YOU AGREED TO,</text><text class="m" x="400" y="702" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU CAN UNDO</text></g>
<g id="paper">
<rect class="s-ink" x="760" y="250" width="480" height="400" rx="12" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="790" y="305" font-size="20">WHICH AGREEMENTS DO I LIVE BY?</text>
<g id="rows"></g>
<g id="pen"><path class="gain" d="M0 0l8-34 80-138 24 14-80 138z"/></g>
</g>
<g id="aware"><text class="d" x="120" y="800" font-size="42">Awareness turns an invisible rule into a <tspan style="fill:var(--gain)">choice.</tspan></text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="143" y="260" font-size="26">THINK OF ONE BELIEF THAT STARTS WITH “I AM NOT”</text></g>
<g id="q1"><text class="d" x="136" y="420" font-size="88" letter-spacing="-2">Did I choose this,</text></g>
<g id="q2"><text class="d" x="136" y="530" font-size="88" letter-spacing="-2">or was I <tspan style="fill:var(--gain)">taught</tspan> it?</text></g>
<g id="q3"><text class="m" x="143" y="680" font-size="26">ASK YOURSELF TODAY</text></g>
<g id="mir">
<path class="s-ink" d="M1320 610V720M1260 720H1380" stroke-width="8" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1320" cy="460" rx="110" ry="150" fill="var(--stage)" stroke-width="10"/>
<g id="mref"></g>
<path id="shine" class="s-line" d="M1250 400l36-60M1270 430l20-34" stroke-width="6" stroke-linecap="round"/>
</g>
</g>