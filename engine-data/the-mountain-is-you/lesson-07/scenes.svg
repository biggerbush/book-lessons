<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">From self-sabotage</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to self-mastery.</text>
<text class="b" x="120" y="600" font-size="32">Self-mastery means steady self-understanding, not never slipping.</text>
<polygon class="s-ink" points="1100,550 1290,250 1480,550" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-muted" d="M1160 530L1250 400L1230 360L1285 270" fill="none" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
<g id="clim"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The summit myth.</text>
<text class="b" x="120" y="176" font-size="32">We picture arriving one day, fixed and flawless.</text>
<polygon class="s-ink" points="160,790 520,330 880,790" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<g id="flag"><path class="s-ink" d="M520 330V240" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M520 240h80l-20 22 20 22h-80z"/><text class="m" x="620" y="272" font-size="22">“FINALLY ARRIVED”</text></g>
<g id="perf">
<rect class="s-ink" x="980" y="250" width="500" height="320" rx="30" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<g id="pf"></g>
<g id="pl0"><text class="m" x="1170" y="360" font-size="22">NEVER ANXIOUS</text></g>
<g id="pl1"><text class="m" x="1170" y="410" font-size="22">NEVER ANGRY</text></g>
<g id="pl2"><text class="m" x="1170" y="460" font-size="22">NEVER QUITS</text></g>
<text class="m" x="1010" y="540" font-size="20">THE FUTURE ‘PERFECT’ YOU</text>
</g>
<g id="stuck"><g id="stk"></g><text class="m" x="1120" y="720" font-size="22">STILL WAITING…</text></g>
<g id="stuckT"><text class="d" x="120" y="852" font-size="44">Waiting for flawless only keeps you stuck.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Calm, and in charge.</text>
<text class="b" x="120" y="176" font-size="32">Feelings still come. They just don’t drive.</text>
<g id="mt2"><polygon class="s-ink" points="160,770 460,330 760,770" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="cloud" opacity="0"><circle class="loss" cx="-60" cy="10" r="40"/><circle class="loss" cx="0" cy="-15" r="55"/><circle class="loss" cx="60" cy="10" r="40"/><rect class="loss" x="-100" y="10" width="200" height="40" rx="20"/></g>
<g id="feel"><text class="m" x="160" y="820" font-size="22">YOU STILL FEEL EVERYTHING</text></g>
<g id="calm"><g id="cf"></g><text class="m" x="1180" y="280" font-size="22" text-anchor="middle">CALM · IN CHARGE</text></g>
<g id="wheelw"><g id="wheel"><circle class="s-gain" r="110" fill="none" stroke-width="14"/><path class="s-gain" d="M0 0L0 110M0 0L-95 -55M0 0L95 -55" stroke-width="10" stroke-linecap="round"/><circle class="gain" r="20"/></g></g>
<g id="grab"><text class="m" x="1180" y="790" font-size="22" text-anchor="middle">FEELINGS NO LONGER GRAB THE WHEEL</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">React, or respond.</text>
<text class="b" x="120" y="176" font-size="32">A rush of hurt, and a harsh message ready to send.</text>
<g id="phone">
<rect class="s-ink" x="160" y="240" width="260" height="480" rx="30" fill="var(--stage)" stroke-width="6"/>
<rect class="loss" x="190" y="300" width="200" height="100" rx="16"/>
<path d="M215 335h150M215 365h100" stroke="var(--stage)" stroke-width="8" stroke-linecap="round"/>
<text class="d" x="290" y="500" font-size="60" text-anchor="middle" style="fill:var(--loss)">!!</text>
<rect class="s-ink" x="190" y="640" width="200" height="50" rx="25" fill="none" stroke-width="4"/>
<text class="m" x="290" y="672" font-size="20" text-anchor="middle">SEND</text>
</g>
<g id="old">
<text class="m" x="460" y="320" font-size="22">OLD PATTERN</text>
<path class="s-loss" d="M460 350H770m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="460" y="392" font-size="20">SENT INSTANTLY</text>
</g>
<g id="burst"><text class="m" x="940" y="358" font-size="22" style="fill:var(--loss)">FALLOUT</text></g>
<g id="pz">
<text class="m" x="460" y="560" font-size="22" style="fill:var(--gain)">MASTERY</text>
<path class="s-muted" d="M460 610H600m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="gain" cx="670" cy="610" r="52"/>
<rect x="650" y="585" width="12" height="50" fill="var(--on-gain)"/><rect x="678" y="585" width="12" height="50" fill="var(--on-gain)"/>
<text class="m" x="670" y="700" font-size="20" text-anchor="middle">NOTICE</text>
</g>
<g id="wave"><text class="m" x="925" y="700" font-size="20" text-anchor="middle">LET IT SETTLE</text></g>
<g id="choose"><rect class="gain" x="1140" y="570" width="300" height="80" rx="40"/><text class="d" x="1290" y="623" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Choose</text></g>
<g id="rr"><text class="d" x="120" y="810" font-size="40">Notice it. Let it settle. Then choose.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Know your needs.</text>
<text class="b" x="120" y="176" font-size="32">Rest, connection, safety and meaning don’t vanish when ignored.</text>
<g id="plants"></g>
<g id="can"></g>
<g id="leak"><text class="d" x="120" y="830" font-size="38">Met on purpose, needs stop leaking out as sabotage.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Setbacks are part of the climb.</text>
<text class="b" x="120" y="176" font-size="32">Not proof that you have failed.</text>
<g id="grid" opacity="0"></g>
<path id="trail" class="s-ink" d="M160 720L400 640L640 520L760 620L900 560L1120 420L1440 270" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="dipl"><text class="m" x="760" y="460" font-size="22" text-anchor="middle" style="fill:var(--gain)">PART OF THE CLIMB</text></g>
<g id="info"><circle class="s-loss" cx="760" cy="620" r="32" fill="none" stroke-width="5"/><text class="m" x="760" y="690" font-size="20" text-anchor="middle">INFORMATION:</text><text class="m" x="760" y="718" font-size="20" text-anchor="middle">WHERE YOU STILL NEED CARE</text></g>
<g id="steps"></g>
<circle id="walker" class="gain" r="18"/>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A practice, not a trophy.</text>
<text class="b" x="120" y="176" font-size="32">Like brushing your teeth: the same steady check-in, again.</text>
<g id="troph">
<path class="s-muted" d="M260 270h160v60a80 80 0 0 1-160 0zM260 290h-30v30a30 30 0 0 0 30 30M420 290h30v30a30 30 0 0 1-30 30M340 410v40" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-muted" x="290" y="450" width="100" height="22" fill="none" stroke-width="6"/>
<text class="m" x="340" y="520" font-size="22" text-anchor="middle">NOT A TROPHY</text>
</g>
<g id="tx"><path class="s-loss" d="M240 260L440 480" stroke-width="8" stroke-linecap="round"/></g>
<g id="brushw"><g id="brush">
<rect class="gain" x="180" y="610" width="250" height="24" rx="12"/><rect class="gain" x="430" y="600" width="80" height="44" rx="10"/>
<path class="s-ink" d="M445 598v-26M463 598v-26M481 598v-26M499 598v-26" stroke-width="6" stroke-linecap="round"/>
</g><text class="m" x="340" y="700" font-size="22" text-anchor="middle">A DAILY CHECK-IN</text></g>
<g id="calw"><text class="m" x="680" y="232" font-size="22">MONTHS OF CHECK-INS</text><g id="cal"></g></g>
<g id="trust"><g id="tf"></g><text class="d" x="820" y="745" font-size="38">Someone who trusts themselves.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The mountain is you.</text>
<text class="b" x="120" y="176" font-size="32">The climb isn’t about stopping at the top.</text>
<g id="peak2"><polygon class="s-line" points="960,800 1220,520 1480,800" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/></g>
<g id="m7"><polygon class="s-ink" points="220,800 640,360 1060,800" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/></g>
<circle id="mhead" class="gain" cx="640" cy="296" r="56"/>
<g id="youl"><text class="m" x="640" y="720" font-size="26" text-anchor="middle">YOU</text></g>
<g id="nfl"><text class="m" x="200" y="420" font-size="22">NOT A FINISH LINE</text></g>
<g id="feet"></g>
<g id="keep"><text class="d" x="120" y="852" font-size="38">Keep climbing calmly, wherever the path leads.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qw"><g id="qwi"><circle class="s-gain" r="60" fill="none" stroke-width="10"/><path class="s-gain" d="M0 0L0 60M0 0L-52 -30M0 0L52 -30" stroke-width="7" stroke-linecap="round"/><circle class="gain" r="12"/></g></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">When did a feeling</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">nearly grab the wheel?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">What would <tspan style="fill:var(--gain)">calm you</tspan> choose?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">TONIGHT’S CHECK-IN</text></g>
</g>