<g id="rt"><text class="m" x="540" y="620" font-size="22">SAME, SAME, SAME · SAFETY TALK, FLIGHT 100</text></g>
<g id="snap"><text class="d" x="120" y="790" font-size="52">Break the pattern. Attention snaps back.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Surprise is an alarm.</text>
<text class="b" x="120" y="176" font-size="32">When a pattern breaks, we stop to figure out what we got wrong.</text>
<circle class="s-ink" cx="480" cy="500" r="190" fill="var(--stage)" stroke-width="7"/>
<path id="br0" class="s-ink" d="M370 410q40-24 80 0" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="br1" class="s-ink" d="M510 410q40-24 80 0" fill="none" stroke-width="8" stroke-linecap="round"/>
<circle id="ey0" class="ink" cx="410" cy="470" r="14"/><circle id="ey1" class="ink" cx="550" cy="470" r="14"/>
<circle id="mo" class="s-ink" cx="480" cy="590" r="12" fill="none" stroke-width="7"/>
<g id="qm"><text class="d" x="800" y="560" font-size="240" text-anchor="middle" style="fill:var(--gain)">?</text><g id="qr"></g></g>
