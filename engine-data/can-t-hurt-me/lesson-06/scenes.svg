<g id="crw"></g>
<g id="gave"><text class="m" x="120" y="840" font-size="22" style="fill:var(--loss)">ARMS GAVE OUT · FAR SHORT OF THE GOAL</text></g>
</g>

<g id="s2" opacity="0">
