<g id="s0">
<text class="m" x="120" y="150" font-size="28">JAB, JAB, JAB, RIGHT HOOK · LESSON 6</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Speak in pictures:</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">Pinterest, Instagram,</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">Tumblr.</text>
<text class="b" x="120" y="620" font-size="32">On visual platforms, your image has to do the talking.</text>
<rect class="s-ink" x="1200" y="220" width="260" height="480" rx="32" fill="var(--stage)" stroke-width="7"/>
<g id="t_img"><rect class="gain" x="1226" y="270" width="208" height="240" rx="10"/><circle cx="1380" cy="320" r="26" fill="var(--stage)"/><path class="ink" d="M1226 510l70-110 50 70 30-40 58 80z"/></g>
<path id="t_words" class="s-line" d="M1236 545h188M1236 575h150M1236 605h170" stroke-width="10" stroke-linecap="round"/>
