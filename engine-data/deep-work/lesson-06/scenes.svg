<rect class="s-ink" x="400" y="300" width="140" height="90" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M450 388l8 20 14-18" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text id="bq" class="d" x="470" y="364" font-size="52" text-anchor="middle">?</text></g>
<g id="pie">
<circle cx="900" cy="500" r="220" fill="var(--stage)"/>
<path id="rest" class="gain"/>
<path id="w2" fill="var(--loss)" fill-opacity=".3" stroke="var(--loss)" stroke-width="4" stroke-dasharray="10 8"/>
<path id="w1" class="loss"/>
<circle class="s-ink" cx="900" cy="500" r="220" fill="none" stroke-width="6"/>
<text id="sl" class="m" x="1000" y="430" font-size="20" text-anchor="middle" style="fill:var(--stage)">SHALLOW</text>
</g>
<g id="pl"><text class="m" x="1170" y="400" font-size="22">SHALLOW SHARE</text><text id="pv" class="d" x="1166" y="490" font-size="80" style="fill:var(--loss)">30–50%</text><text class="m" x="1170" y="540" font-size="20">MOST PEOPLE, SAYS NEWPORT</text></g>
<g id="pr"><text class="m" x="780" y="510" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">DEEP</text><text class="m" x="1170" y="640" font-size="24" style="fill:var(--gain)">PROTECT THE REST</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A fixed end time.</text>
<g id="clk"><circle class="s-ink" cx="360" cy="470" r="170" fill="var(--stage)" stroke-width="8"/><g id="tks"></g>
<line id="hh" class="s-ink" x1="360" y1="470" x2="360" y2="380" stroke-width="10" stroke-linecap="round"/>
<line id="mh" class="s-gain" x1="360" y1="470" x2="360" y2="335" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="360" cy="470" r="12"/>
<text class="d" x="360" y="730" font-size="64" text-anchor="middle">5:30 PM</text></g>
