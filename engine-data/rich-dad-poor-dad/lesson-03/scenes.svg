<g id="s0">
<text class="m" x="120" y="150" font-size="28">RICH DAD POOR DAD · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Mind your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">own business.</text>
<text class="b" x="120" y="600" font-size="32">Your job pays you, but your assets build your wealth.</text>
<g id="brief"><rect class="s-ink" x="1060" y="640" width="120" height="80" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1095 640v-16h50v16" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1120" y="770" font-size="20" text-anchor="middle">JOB</text></g>
<g id="tcol"></g>
<path id="troof" class="gain" d="M1220 342L1330 252L1440 342z"/>
<text class="m" x="1330" y="770" font-size="20" text-anchor="middle" style="fill:var(--gain)">ASSETS</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What do you do for a living?</text>
<text class="b" x="120" y="176" font-size="32">A banker asks. Most of us answer with our job title.</text>
<g id="bk"><g id="bkf"></g>
<rect class="s-ink" x="380" y="220" width="380" height="80" rx="16" fill="var(--stage)" stroke-width="5"/>
<path class="ink" d="M400 296l-44 36 76-36z"/>
<text class="m" x="570" y="268" font-size="24" text-anchor="middle">WHAT DO YOU DO?</text>
<text class="m" x="300" y="540" font-size="20" text-anchor="middle">BANKER</text></g>
<g id="yu"><g id="yuf"></g>
<rect id="tagr" x="1020" y="420" width="160" height="52" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text id="tagt" class="m" x="1100" y="454" font-size="22" text-anchor="middle">NURSE</text>
<text class="m" x="1100" y="552" font-size="20" text-anchor="middle">YOU</text></g>
<g id="sg0"><rect class="ink" x="794" y="570" width="12" height="270"/>
<polygon class="s-ink" points="380,625 410,590 790,590 790,660 410,660" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="600" y="633" font-size="22" text-anchor="middle">PROFESSION = INCOME</text></g>
<g id="sg1"><polygon class="gain" points="810,690 1230,690 1260,725 1230,760 810,760"/>
<text class="m" x="1030" y="733" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">BUSINESS = WHAT YOU OWN</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="64">Whose business are you building?</text>
<text class="b" x="120" y="176" font-size="32">When you go to work, you grow your employer’s business.</text>
<g id="twr"></g>
<text id="twl" class="m" x="300" y="300" font-size="20" text-anchor="middle">EMPLOYER</text>
<g id="yo2"><g id="yo2f"></g><path class="s-ink" d="M530 650L450 590m0 0v22m0-22h22" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="560" y="838" font-size="20" text-anchor="middle">YOU</text></g>
<g id="own"><g id="ownf"></g><text class="m" x="860" y="510" font-size="20" text-anchor="middle">OWNER</text><text class="m" x="1000" y="520" font-size="20">OWNER’S ASSETS</text></g>
<g id="bars"></g>
<g id="pay"><text class="m" x="760" y="590" font-size="20">YOUR PAYCHECK</text><path id="payl" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="stp"><text class="m" x="1120" y="796" font-size="20" style="fill:var(--loss)">STOPS WHEN YOU STOP</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">“What business am I in?”</text>
<text class="b" x="120" y="176" font-size="32">Ray Kroc of McDonald’s, speaking to business students.</text>
<g id="brd"><rect class="s-ink" x="140" y="220" width="420" height="180" rx="10" fill="var(--stage)" stroke-width="6"/></g>
<text id="qm" class="d" x="350" y="372" font-size="150" text-anchor="middle" style="fill:var(--gain)">?</text>
<g id="kr"><g id="krf"></g><rect class="ink" x="210" y="560" width="120" height="160" rx="6"/><text class="m" x="270" y="760" font-size="20" text-anchor="middle">RAY KROC</text></g>
<g id="stu"></g>
<g id="bur"><path class="gain" d="M980 330a120 90 0 0 1 240 0z"/><path class="s-gain" d="M975 340q22 14 44 0t44 0 44 0 44 0 44 0" fill="none" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="970" y="348" width="260" height="36" rx="18"/><rect class="gain" x="980" y="390" width="240" height="34" rx="14"/></g>
<g id="ans"><text class="d5" x="760" y="830" font-size="38">“Hamburgers, of course!”</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">“My business is real estate.”</text>
<text class="b" x="120" y="176" font-size="32">Burgers bring in cash. The land under them builds wealth.</text>
<g id="map"></g>
<g id="cars"></g>
<g id="lots"></g>
<g id="cd0"><rect class="s-line" x="1060" y="250" width="420" height="230" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1096" y="306" font-size="22">PROFESSION</text><text class="d" x="1096" y="376" font-size="52">Burgers</text><text class="m" x="1096" y="434" font-size="20">BRING IN CASH</text></g>
<g id="cd1"><rect class="gain" x="1060" y="520" width="420" height="230" rx="18"/><text class="m" x="1096" y="576" font-size="22" style="fill:var(--on-gain)">BUSINESS</text><text class="d" x="1096" y="646" font-size="52" style="fill:var(--on-gain)">The land</text><text class="m" x="1096" y="704" font-size="20" style="fill:var(--on-gain)">BUILDS THE WEALTH</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="64">Don’t quit. Keep your day job.</text>
<text class="b" x="120" y="176" font-size="32">Then build your own column of assets on the side.</text>
<g id="dsk"><g id="dskf"></g>
<rect class="ink" x="400" y="500" width="120" height="80" rx="6"/><rect id="scr" x="410" y="510" width="100" height="60" fill="var(--gain)" fill-opacity="0"/>
<rect class="ink" x="160" y="580" width="420" height="16"/><path class="s-ink" d="M190 596v180M550 596v180" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="160" y="810" font-size="22">PROFESSION</text></g>
<g id="keep"><text class="m" x="160" y="846" font-size="22" style="fill:var(--gain)">KEEP IT · WORK HARD</text></g>
<path id="side" class="s-gain" d="M600 520Q745 420 890 520" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="acol"><text class="m" x="745" y="440" font-size="20" text-anchor="middle">ON THE SIDE</text><text class="m" x="1050" y="262" font-size="24" text-anchor="middle">MY ASSETS</text><rect class="s-line" x="900" y="280" width="300" height="520" rx="10" fill="none" stroke-width="4"/></g>
<g id="ablk"></g>
<g id="moon"><circle class="gain" cx="1360" cy="330" r="46"/><circle cx="1384" cy="312" r="40" fill="var(--stage)"/><text class="m" x="1360" y="430" font-size="20" text-anchor="middle">WHILE YOU SLEEP</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What counts as a real asset?</text>
<text class="b" x="120" y="176" font-size="32">Things you own that keep earning for you.</text>
<g id="c6a"><rect class="s-line" x="120" y="240" width="310" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="195" y="330" width="160" height="110" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="185" y="290" width="180" height="40" rx="6"/><rect class="ink" x="255" y="370" width="40" height="70"/><text class="d5" x="144" y="496" font-size="30">Business</text><text class="m" x="144" y="536" font-size="21">RUNS WITHOUT YOU</text></g>
<g id="c6b"><rect class="s-line" x="470" y="240" width="310" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M520 290v160h220" fill="none" stroke-width="5" stroke-linecap="round"/><polyline class="s-muted" points="530,440 730,400" fill="none" stroke-width="5" stroke-linecap="round"/><polyline class="s-gain" points="530,430 580,400 620,415 670,350 730,310" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="494" y="514" font-size="30">Stocks &amp; bonds</text></g>
<g id="c6c"><rect class="s-line" x="820" y="240" width="310" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M885 360L975 290L1065 360z"/><rect class="s-ink" x="905" y="360" width="140" height="100" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="1060" cy="296" r="26"/><text class="d" x="1060" y="307" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">$</text><text class="d5" x="844" y="514" font-size="30">Rental property</text></g>
<g id="c6d"><rect class="s-line" x="1170" y="240" width="310" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="1215" y="310" width="90" height="120" rx="6" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1235 345h50M1235 375h50M1235 405h30" stroke-width="5" stroke-linecap="round"/><circle class="ink" cx="1380" cy="420" r="18"/><path class="s-ink" d="M1396 420V312l40 14" fill="none" stroke-width="6" stroke-linecap="round"/><text class="d5" x="1194" y="514" font-size="30">Royalties</text></g>
<g id="rule"><text class="d" x="120" y="700" font-size="38">Once a dollar enters the</text><text class="d" x="120" y="752" font-size="38">asset column, it should never leave.</text>
<path class="s-ink" d="M960 640V816H1260V640" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1110" y="852" font-size="22" text-anchor="middle">ASSETS</text>
<path class="s-loss" d="M1280 740h150m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-ink" d="M1335 715l40 50m0-50l-40 50" stroke-width="6" stroke-linecap="round"/></g>
<g id="cns"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The rich buy luxuries last.</text>
<text class="b" x="120" y="176" font-size="32">First build assets. Then let their income pay for the treats.</text>
<g id="car"><text class="m" x="1220" y="400" font-size="22" text-anchor="middle">LUXURY · LAST</text><path id="carb" class="s-ink" d="M1000 570v-50q0-20 20-20h80l60-60h160l60 60h40q20 0 20 20v50z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="1090" cy="570" r="40"/><circle class="ink" cx="1350" cy="570" r="40"/><circle cx="1090" cy="570" r="14" fill="var(--stage)"/><circle cx="1350" cy="570" r="14" fill="var(--stage)"/></g>
<g id="stk"></g>
<g id="lbA"><text class="m" x="340" y="800" font-size="22" text-anchor="middle">1 · ASSETS FIRST</text></g>
<g id="flow"><path class="s-gain" d="M540 540Q780 300 1010 510" fill="none" stroke-width="4" stroke-dasharray="8 10"/><text class="m" x="780" y="355" font-size="22" text-anchor="middle">2 · INCOME FROM ASSETS</text></g>
<g id="fcn"></g>
<g id="rwd"><text class="d" x="1220" y="710" font-size="56" text-anchor="middle" style="fill:var(--gain)">A reward</text><text class="m" x="1220" y="758" font-size="22" text-anchor="middle">NOT A DEBT</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What business</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">am I <tspan style="fill:var(--gain)">really</tspan> in?</text></g>
<g id="mir"><ellipse class="s-ink" cx="1300" cy="400" rx="120" ry="160" fill="var(--stage)" stroke-width="8"/><g id="mirf"></g><path class="s-ink" d="M1300 560v80M1240 640h120" stroke-width="8" stroke-linecap="round"/></g>
<g id="nxt"><text class="m" x="143" y="600" font-size="26">CHOOSE ONE SMALL ASSET TO START THIS MONTH</text><rect class="gain" x="143" y="640" width="120" height="64" rx="10"/><text class="d" x="203" y="685" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">+1</text></g>
</g>