<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Be impeccable</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">with your word.</text>
<text class="b" x="120" y="600" font-size="32">Why every sentence you speak plants a seed that grows.</text>
<g id="ag0"><g id="agd"></g><text class="m" x="320" y="697" font-size="20">AGREEMENT 1 OF 4</text></g>
<g id="bub0"><rect class="s-ink" x="1210" y="250" width="240" height="120" rx="28" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1250 296h160M1250 330h100" stroke-width="10" stroke-linecap="round"/></g>
<path class="ink" d="M1180 680Q1330 620 1480 680Z"/>
<ellipse id="seed0" class="gain" cx="1330" cy="390" rx="12" ry="16"/>
<g id="spr0"><path class="s-gain" d="M0 0V-110" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M0-55q-40-5-54-40q40 0 54 40zM0-80q40-5 54-40q-40 0-54 40z"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="60">Your word is your most powerful tool.</text>
<text class="b" x="120" y="176" font-size="32">Don Miguel Ruiz: it can create, or it can destroy.</text>
<rect class="s-line" x="120" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="600" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="1060" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="285" font-size="20">YOUR WORD</text>
<text class="m" x="630" y="285" font-size="20">EVERY TIME YOU SPEAK</text>
<g id="wnd"><path class="s-ink" d="M210 620L390 400" stroke-width="14" stroke-linecap="round"/><polygon id="star" class="gain"/></g>
<g id="w2"><rect class="gain" x="160" y="670" width="110" height="10"/><text class="m" x="160" y="720" font-size="22" style="fill:var(--gain)">CREATE</text><rect class="loss" x="340" y="670" width="130" height="10"/><text class="m" x="340" y="720" font-size="22" style="fill:var(--loss)">DESTROY</text></g>
<g id="spk"><text class="m" x="810" y="710" font-size="20" text-anchor="middle">ENERGY OUT INTO THE WORLD</text></g>
<g id="mind"><text class="m" x="1090" y="285" font-size="20">THE HUMAN MIND</text><path class="ink" d="M1120 470A150 150 0 0 0 1420 470Z"/><circle class="s-ink" cx="1270" cy="470" r="150" fill="none" stroke-width="6"/><g id="mseeds"></g><text class="m" x="1270" y="710" font-size="20" text-anchor="middle">FERTILE GROUND</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What “impeccable” means.</text>
<g id="dic"><rect class="s-line" x="120" y="230" width="620" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="160" y="290" font-size="22">FROM LATIN</text><text class="d5" x="160" y="380" font-size="56">Impeccable</text><text class="d" x="160" y="480" font-size="60" style="fill:var(--gain)">= without sin</text></g>
<g id="nrel"><text class="m" x="120" y="640" font-size="24">SIN: NOT RELIGION, NOT PUNISHMENT</text></g>
<line id="nrs" class="s-loss" x1="112" y1="632" x2="112" y2="632" stroke-width="4" stroke-linecap="round"/>
<g id="sinl"><text class="m" x="880" y="260" font-size="22">SIN = GOING AGAINST YOURSELF</text></g>
<g id="meg"></g>
<path id="boom" class="s-loss" d="M1210 600C1470 560 1470 300 1220 320C1090 330 1110 500 1140 566" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<polygon id="ah" class="loss" points="1142,584 1120,570 1146,558" opacity="0"/>
<g id="nev"><text class="d" x="120" y="820" font-size="44">Never use your word against yourself or anyone else.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A careless sentence.</text>
<text class="b" x="120" y="176" font-size="32">Ruiz tells of a tired mother and her singing daughter.</text>
<path class="s-line" d="M200 670h1200" stroke-width="5"/>
<g id="mom"><text class="m" x="420" y="720" font-size="22" text-anchor="middle">MOTHER</text></g>
<path id="ache" class="s-loss" d="M360 380l15-22 15 22 15-22 15 22 15-22 15 22 15-22 15 22" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="kid"><text class="m" x="1100" y="720" font-size="22" text-anchor="middle">DAUGHTER</text></g>
<g id="notes"></g>
<g id="ugly"><rect class="s-loss" x="520" y="250" width="480" height="110" rx="24" fill="var(--stage)" stroke-width="6"/><polygon class="loss" points="560,358 610,358 470,420"/><text class="d5" x="760" y="320" font-size="38" text-anchor="middle" style="fill:var(--loss)">“Your voice is ugly.”</text></g>
<g id="blv"><text class="d" x="120" y="800" font-size="44">She believes it, and stops singing.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">How a seed grows.</text>
<text class="b" x="120" y="176" font-size="32">The mother forgets. The daughter does not.</text>
<g id="fb"><rect class="s-loss" x="140" y="260" width="360" height="100" rx="24" fill="var(--stage)" stroke-width="5"/><text class="d5" x="320" y="322" font-size="28" text-anchor="middle" style="fill:var(--loss)">“Your voice is ugly.”</text></g>
<g id="forg"><text class="m" x="140" y="410" font-size="20">MOTHER: FORGOTTEN IN MINUTES</text></g>
<g id="rts"></g>
<path class="s-line" d="M580 432h400" stroke-width="5"/>
<ellipse class="gain" cx="780" cy="425" rx="12" ry="16"/>
<g id="agr"><text class="m" x="780" y="770" font-size="20" text-anchor="middle">AN AGREEMENT TAKES ROOT</text></g>
<g id="wom"><g id="womg"></g><ellipse class="ink" cx="1390" cy="400" rx="18" ry="13"/><path class="s-ink" d="M1406 398V320l22 12" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-loss" d="M1350 300L1450 440" stroke-width="7" stroke-linecap="round"/><text class="m" x="1080" y="700" font-size="20">YEARS LATER: SHE NEVER SINGS</text></g>
<g id="once"><text class="d" x="120" y="840" font-size="44">One careless sentence shaped a part of her life.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Gossip is a virus.</text>
<text class="b" x="120" y="176" font-size="32">Ruiz compares gossip to a computer virus.</text>
<g id="pc"><rect class="s-ink" x="120" y="250" width="280" height="190" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M260 440v40M200 486h120" stroke-width="8" stroke-linecap="round"/><g id="vir"></g><text class="m" x="260" y="530" font-size="20" text-anchor="middle">COMPUTER VIRUS</text></g>
<g id="lnk"></g>
<g id="ppl"></g>
<g id="stp"><polygon class="gain" points="1135,253 1157,275 1157,305 1135,327 1105,327 1083,305 1083,275 1105,253"/><rect x="1100" y="284" width="40" height="12" fill="var(--on-gain)"/><path class="s-gain" d="M1195 340V520" stroke-width="8" stroke-linecap="round"/><text class="m" x="1120" y="560" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU</text></g>
<g id="harm"><text class="d5" x="120" y="660" font-size="36">Passing it along feels harmless, but it spreads poison.</text></g>
<g id="gst"><text class="d" x="120" y="770" font-size="52" style="fill:var(--gain)">Let gossip stop with you.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The words you use inside.</text>
<text class="b" x="120" y="176" font-size="32">The harshest words are often the ones we say to ourselves.</text>
<g id="mir"><ellipse class="s-ink" cx="360" cy="470" rx="160" ry="230" fill="var(--stage)" stroke-width="8"/><g id="mfig"></g><path class="s-ink" d="M360 700v60M280 770h160" stroke-width="8" stroke-linecap="round"/></g>
<g id="ib0"><rect class="s-loss" x="620" y="240" width="460" height="96" rx="24" fill="var(--stage)" stroke-width="5"/><polygon class="loss" points="650,310 650,336 540,380"/><text class="d5" x="850" y="302" font-size="38" text-anchor="middle" style="fill:var(--loss)">“I’m so stupid.”</text></g>
<g id="ib1"><rect class="s-loss" x="620" y="360" width="460" height="96" rx="24" fill="var(--stage)" stroke-width="5"/><polygon class="loss" points="650,430 650,456 540,470"/><text class="d5" x="850" y="422" font-size="38" text-anchor="middle" style="fill:var(--loss)">“I always fail.”</text></g>
<g id="weeds"></g>
<path class="s-line" d="M620 700h860" stroke-width="5"/>
<g id="wl"><text class="m" x="620" y="760" font-size="22">REPEATED ENOUGH, THEY GROW INTO BELIEFS</text><text class="d5" x="620" y="830" font-size="40">…about who you are.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Speak in truth and love.</text>
<g id="sub7"><text class="b" x="120" y="176" font-size="32">Say only what you mean, and speak with integrity.</text></g>
<g id="can"><g id="cant"><path d="M300 345Q380 270 460 345" fill="none" stroke="var(--gain)" stroke-width="12" stroke-linecap="round"/><path d="M495 400L630 330" stroke="var(--gain)" stroke-width="18" stroke-linecap="round"/><rect class="gain" x="260" y="340" width="240" height="150" rx="20"/><text class="m" x="380" y="425" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">TRUTH + LOVE</text></g></g>
<g id="drops"></g>
<path class="s-line" d="M520 680h440" stroke-width="5"/>
<g id="fl"><path class="s-gain" d="M0 0V-200" stroke-width="7"/><path class="gain" d="M0-90q50-5 60-50q-50 0-60 50z"/><g id="pet"></g><circle class="ink" cx="0" cy="-220" r="18"/></g>
<g id="cf"><text class="d" x="1020" y="420" font-size="64" style="fill:var(--gain)">Confidence</text></g>
<g id="tr"><text class="d" x="1020" y="510" font-size="64" style="fill:var(--gain)">Trust</text></g>
<g id="io"><text class="m" x="1024" y="580" font-size="22">IN OTHERS, AND IN YOU</text></g>
</g>

<g id="s8" opacity="0">
<g id="ch0"><text class="m" x="143" y="230" font-size="26">FOR ONE DAY, NOTICE EVERY WORD YOU AIM</text><text class="m" x="143" y="270" font-size="26">AT YOURSELF OR AT OTHERS</text></g>
<g id="qp"><text class="d5" x="140" y="390" font-size="48">Before you speak, ask:</text></g>
<g id="qa"><text class="d" x="136" y="510" font-size="88" letter-spacing="-2">Is this a seed</text></g>
<g id="qb"><text class="d" x="136" y="620" font-size="88" letter-spacing="-2">I want to <tspan style="fill:var(--gain)">grow?</tspan></text></g>
<g id="nb"><rect class="s-ink" x="1180" y="300" width="260" height="320" rx="14" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1210 420h200M1210 520h200" stroke-width="3"/><g id="tal"></g></g>
<path class="ink" d="M1220 760Q1310 720 1400 760Z"/><g id="sp8"></g>
<text class="m" x="143" y="760" font-size="26">BE IMPECCABLE WITH YOUR WORD</text>
</g>