<g id="g_t2"><circle class="gain" cx="920" cy="768" r="10"/><text class="d5" x="950" y="782" font-size="40">The glue of the team</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What Greens value.</text>
