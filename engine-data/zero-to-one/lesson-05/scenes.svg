<g id="s0">
<text class="m" x="120" y="150" font-size="28">ZERO TO ONE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">How to build</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">a monopoly.</text>
<text class="b" x="120" y="600" font-size="32">Why lasting monopolies start by owning a very tiny market.</text>
<text class="m" x="1160" y="278" font-size="20">THE MARKET</text>
<g id="mapg"></g>
<g id="seed"><circle id="seedr" class="s-gain" cx="1190" cy="586" r="14" fill="none" stroke-width="4"/><circle class="gain" cx="1190" cy="586" r="14"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Far better technology.</text>
<text class="b" x="120" y="176" font-size="32">Proprietary technology: something hard for others to copy.</text>
<g id="gearg"><path id="gear" class="ink"/><circle cx="300" cy="400" r="34" fill="var(--stage)"/><text class="m" x="300" y="550" font-size="20" text-anchor="middle">HARD TO COPY</text></g>
<g id="bars"><text class="m" x="600" y="296" font-size="20">CLOSEST ALTERNATIVE</text><rect class="ink" x="600" y="310" width="80" height="56" rx="6" fill-opacity=".45"/><text class="m" x="600" y="416" font-size="20" style="fill:var(--gain)">PROPRIETARY TECHNOLOGY</text><rect id="bar10" class="gain" x="600" y="430" width="80" height="56" rx="6"/></g>
<g id="badge"><circle class="gain" cx="1330" cy="320" r="62"/><text class="d" x="1330" y="340" font-size="54" text-anchor="middle" style="fill:var(--on-gain)">10×</text></g>
<g id="srch"><rect class="s-ink" x="120" y="600" width="760" height="84" rx="42" fill="var(--stage)" stroke-width="6"/><circle class="s-gain" cx="176" cy="638" r="16" fill="none" stroke-width="6"/><path class="s-gain" d="M188 650l14 14" stroke-width="6" stroke-linecap="round"/><text id="stxt" class="d5" x="230" y="655" font-size="36"></text></g>
<g id="rivals"><text class="m" x="940" y="590" font-size="20">RIVALS</text></g>
<g id="small"><text class="d" x="120" y="800" font-size="40">A small improvement won’t make customers switch.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Network effects.</text>
<text class="b" x="120" y="176" font-size="32">A product grows more useful as more people join.</text>
<g id="gate"><path class="s-ink" d="M200 720V430M460 720V430M180 430h300M200 430Q330 300 460 430" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="330" y="414" font-size="22" text-anchor="middle">HARVARD</text><g id="studs"></g><text class="m" x="330" y="762" font-size="20" text-anchor="middle">ONE UNIVERSITY</text></g>
<g id="links2"></g>
<g id="nodes2"></g>
<rect class="s-ink" x="1320" y="300" width="50" height="404" rx="10" fill="none" stroke-width="5"/>
<rect id="meter" class="gain" x="1328" y="696" width="34" height="0" rx="4"/>
<text class="m" x="1345" y="744" font-size="20" text-anchor="middle">USEFULNESS</text>
<g id="startsm"><circle class="s-gain" cx="980" cy="500" r="122" fill="none" stroke-width="5" stroke-dasharray="12 10"/><text class="d" x="120" y="830" font-size="40">Start small: a nearly empty network is worthless.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Economies of scale.</text>
<text class="b" x="120" y="176" font-size="32">Software costs almost nothing to copy.</text>
<g id="mon"><rect class="s-ink" x="120" y="240" width="380" height="250" rx="14" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M310 490v40M240 534h140" stroke-width="8" stroke-linecap="round"/><g id="code"></g></g>
<g id="fixed"><text class="m" x="120" y="630" font-size="20">BIG FIXED COSTS</text><rect class="gain" x="120" y="650" width="380" height="70" rx="8"/><g id="slices"></g><text class="m" x="120" y="760" font-size="20">SPREAD ACROSS MORE PEOPLE</text></g>
<g id="chart"><path class="s-ink" d="M640 260V700H1460" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="660" y="262" font-size="20">COST PER CUSTOMER</text><text class="m" x="1460" y="790" font-size="20" text-anchor="end">MORE CUSTOMERS →</text><polyline id="curve" class="s-gain" fill="none" stroke-width="7" pathLength="1" stroke-dasharray="1 1" stroke-linecap="round"/><circle id="cdot" class="gain" r="14"/><g id="custs"></g></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A strong brand.</text>
<text class="b" x="120" y="176" font-size="32">Like Apple. But a brand only lasts with real substance underneath.</text>
<g id="berg"><rect class="loss" x="120" y="520" width="1360" height="340" fill-opacity=".1"/><path id="wave4" class="s-loss" fill="none" stroke-width="4"/><polygon class="s-ink" points="560,520 1040,520 1100,680 960,830 640,830 500,680" fill="var(--stage)" fill-opacity=".75" stroke-width="6" stroke-linejoin="round" stroke-dasharray="14 10"/><text class="m" x="800" y="690" font-size="26" text-anchor="middle">REAL SUBSTANCE</text><text class="m" x="140" y="690" font-size="22">WHAT MAKES IT LAST</text></g>
<g id="brand"><polygon class="s-ink" points="700,520 760,430 840,430 900,520" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><g transform="translate(800 372)"><path class="gain" d="M0 -30C-20 -50 -60 -45 -60 0C-60 40 -30 60 0 50C30 60 60 40 60 0C60 -45 20 -50 0 -30Z"/><path class="gain" d="M0 -34C2 -54 18 -64 30 -62C28 -46 14 -36 0 -34Z"/></g><text class="m" x="140" y="380" font-size="22">WHAT PEOPLE SEE</text></g>
<g id="hollow"><text class="m" x="1300" y="378" font-size="20" text-anchor="middle">BRAND ONLY</text><g id="hollowA"><path class="loss" d="M0 -30C-20 -50 -60 -45 -60 0C-60 40 -30 60 0 50C30 60 60 40 60 0C60 -45 20 -50 0 -30Z"/><path class="loss" d="M0 -34C2 -54 18 -64 30 -62C28 -46 14 -36 0 -34Z"/></g><text class="m" x="1300" y="620" font-size="20" text-anchor="middle">NOTHING UNDERNEATH</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Dominate a tiny market first.</text>
<text class="b" x="120" y="176" font-size="32">PayPal focused on a few thousand power sellers on eBay.</text>
<g id="pp"><rect class="gain" x="140" y="236" width="230" height="76" rx="38"/><text class="d" x="255" y="288" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">PayPal</text></g>
<g id="sell"><circle class="s-gain" cx="440" cy="520" r="150" fill="none" stroke-width="5" stroke-dasharray="12 10"/><g id="sellers"></g><text class="m" x="440" y="712" font-size="20" text-anchor="middle">A FEW THOUSAND EBAY POWER SELLERS</text></g>
<g id="need"><path class="s-gain" d="M420 366Q390 330 336 318m14-14-14 14 18 6" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="440" y="750" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEEDED EASY ONLINE PAYMENTS</text></g>
<g id="crowd"><rect class="s-line" x="840" y="236" width="640" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="20">A HUGE MARKET FIRST</text><g id="rivs"></g><text class="m" x="1160" y="770" font-size="20" text-anchor="middle">FIGHTING EVERYONE AT ONCE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then expand, step by step.</text>
<text class="b" x="120" y="176" font-size="32">Each victory becomes a launchpad into a bigger, related market.</text>
<g id="rings"></g>
<g id="shelf"><g id="spines6"></g><path class="s-ink" d="M470 545h100" stroke-width="6" stroke-linecap="round"/><text class="m" x="520" y="578" font-size="18" text-anchor="middle">BOOKS</text></g>
<g id="every"><rect x="390" y="192" width="260" height="32" rx="16" fill="var(--stage)"/><text class="m" x="520" y="214" font-size="20" text-anchor="middle">ALMOST EVERYTHING</text></g>
<g id="race"><text class="m" x="900" y="330" font-size="22">THE REAL PRIZE</text><path class="s-muted" d="M900 500H1460m-20-16 20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1460" y="610" font-size="20" text-anchor="end">TIME</text><circle id="first" class="loss" cx="940" cy="500" r="22"/><text class="m" x="940" y="560" font-size="20" text-anchor="middle">FIRST MOVER</text><rect id="ybar" class="gain" x="1100" y="490" height="20" width="0"/><circle class="gain" cx="1100" cy="500" r="26"/><text class="m" x="1100" y="560" font-size="20" text-anchor="middle" style="fill:var(--gain)">LAST MOVER</text></g>
<g id="years"><text class="m" x="1270" y="450" font-size="20" text-anchor="middle" style="fill:var(--gain)">STILL ON TOP, YEARS LATER</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find your tiny market.</text>
<text class="b" x="120" y="176" font-size="32">The smallest group that urgently needs what you offer.</text>
<g id="nb"><rect class="s-ink" x="140" y="240" width="480" height="540" rx="14" fill="var(--stage)" stroke-width="6"/><g id="nbl"></g><text class="m" x="190" y="310" font-size="22">SMALLEST GROUP</text><text class="m" x="190" y="342" font-size="22">WITH AN URGENT NEED</text></g>
<g id="tgt"><circle class="s-ink" cx="1080" cy="500" r="240" fill="var(--stage)" stroke-width="6"/><circle class="s-line" cx="1080" cy="500" r="170" fill="none" stroke-width="5"/><circle class="s-ink" cx="1080" cy="500" r="100" fill="none" stroke-width="5"/><circle class="gain" cx="1080" cy="500" r="36"/><g id="tdots"></g></g>
<g id="arrow"><path class="s-ink" d="M1080 500L1300 280" stroke-width="7" stroke-linecap="round"/><path class="s-ink" d="M1300 280l-6-34M1300 280l34 6M1284 296l-6-34M1284 296l34 6" stroke-width="5" stroke-linecap="round"/></g>
<g id="tlab"><text class="m" x="1080" y="790" font-size="20" text-anchor="middle">SERVE NEARLY EVERY ONE, BETTER THAN ANYONE</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which tiny market</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">could you <tspan style="fill:var(--gain)">own</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">completely this year?</text></g>
<g id="qg"><circle class="s-line" cx="1340" cy="420" r="110" fill="none" stroke-width="4"/><circle class="s-line" cx="1340" cy="420" r="62" fill="none" stroke-width="4"/><circle id="qdot" class="gain" cx="1340" cy="420" r="26"/></g>
<g id="qd"><text class="m" x="143" y="680" font-size="26">AND WHICH OF THE FOUR INGREDIENTS COULD MAKE THAT LEAD LAST?</text></g>
<g id="chips8"></g>
</g>