</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most owners blame the product.</text>
<text class="b" x="120" y="176" font-size="32">So they polish it again and again, while the shop stays empty.</text>
<g id="owner" fill="var(--ink)"></g>
<g id="prod"><rect class="s-ink" x="480" y="340" width="300" height="250" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="630" y="570" font-size="20" text-anchor="middle">PRODUCT</text></g>
<g id="spark"></g>
<g id="tools"></g>
<g id="door0"><rect class="s-ink" x="1100" y="330" width="240" height="260" rx="6" fill="none" stroke-width="6" stroke-dasharray="14 10"/><text class="d" x="1220" y="510" font-size="140" text-anchor="middle" style="fill:var(--loss)">0</text><text class="m" x="1220" y="625" font-size="20" text-anchor="middle">CUSTOMERS WALKING IN</text></g>
<g id="rare"><text class="d" x="120" y="800" font-size="46">The product is rarely what’s broken.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too few people know you exist.</text>
<text class="b" x="120" y="176" font-size="32">Even the best offer can’t sell to people who never see it.</text>
<g id="crowd"></g>
<g id="spot"><rect class="ink" x="770" y="238" width="60" height="26" rx="6"/><polygon points="800,260 640,720 960,720" class="gain" fill-opacity=".18"/><ellipse cx="800" cy="720" rx="160" ry="28" class="gain" fill-opacity=".3"/><rect class="gain" x="750" y="620" width="100" height="90" rx="10"/><g id="offstar"></g><text class="m" x="800" y="780" font-size="20" text-anchor="middle">BEST OFFER</text></g>
<g id="fixtxt"><text class="d" x="120" y="845" font-size="44">The fix: get more people <tspan style="fill:var(--gain)">interested</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">A lead is a person you can contact.</text>
<text class="b" x="120" y="176" font-size="32">A name, a phone number, or an email address on a list.</text>
<g id="card"><rect class="s-ink" x="120" y="250" width="560" height="330" rx="20" fill="var(--stage)" stroke-width="5"/><g fill="var(--ink)"><circle cx="210" cy="330" r="40"/><path d="M150 498v-52a60 60 0 0 1 120 0v52z"/></g><text class="m" x="300" y="347" font-size="20">NAME</text><path class="s-line" d="M420 340h220" stroke-width="10" stroke-linecap="round"/></g>
<g id="ph"><text class="m" x="300" y="427" font-size="20">PHONE</text><path class="s-line" d="M420 420h180" stroke-width="10" stroke-linecap="round"/></g>
<g id="em"><text class="m" x="300" y="507" font-size="20">EMAIL</text><path class="s-line" d="M420 500h220" stroke-width="10" stroke-linecap="round"/></g>
<g id="board3"><rect class="s-ink" x="820" y="240" width="380" height="460" rx="16" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="940" y="224" width="140" height="36" rx="8"/><text class="m" x="1010" y="740" font-size="20" text-anchor="middle">YOUR LIST</text></g>
<g id="list"></g>
<g id="nobuy"><circle cx="1340" cy="470" r="70" fill="none" class="s-muted" stroke-width="6"/><text class="d" x="1340" y="498" font-size="80" text-anchor="middle" style="fill:var(--muted)">$</text><path class="s-loss" d="M1290 420l100 100" stroke-width="10" stroke-linecap="round"/></g>
<g id="nob2"><text class="d" x="120" y="810" font-size="46">A name on a list doesn’t buy anything.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">You want engaged leads.</text>
<text class="b" x="120" y="176" font-size="32">Someone who shows interest: they reply, ask, or book a call.</text>
<g id="row"></g>
<g id="arms"></g>
<g id="englab"></g>
<g id="bub"></g>
<g id="eng2"><text class="d" x="120" y="800" font-size="46">Raised hands become customers.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">More in, more out.</text>
<text class="b" x="120" y="176" font-size="32">Only some engaged leads drip out the bottom as buyers.</text>
<g id="fun"></g>
<g id="flow"></g>
<g id="mir"><text class="d" x="120" y="850" font-size="40">You don’t need a miracle. You need more going in.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fix this first.</text>
<text class="b" x="120" y="176" font-size="32">More customers bring more money, which helps fix almost everything else.</text>
<g id="cust" fill="var(--gain)"></g>
<g id="mon"><path class="s-muted" d="M370 560h70m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="240" y="700" font-size="20" text-anchor="middle">CUSTOMERS</text><text class="m" x="540" y="700" font-size="20" text-anchor="middle">MONEY</text></g>
<g id="coins"></g>
<g id="todo"><rect class="s-ink" x="820" y="220" width="660" height="480" rx="20" fill="var(--stage)" stroke-width="5"/><text class="m" x="860" y="266" font-size="20">TO DO</text></g>
<g id="list2"></g>
<g id="lead1"><text class="d" x="120" y="800" font-size="44">Before you perfect anything, get hands raised.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your next step.</text>
<text class="b" x="120" y="176" font-size="32">Count last week’s engaged leads. Write the number down. Grow it.</text>
<g id="note"><rect class="gain" x="120" y="250" width="440" height="400" rx="10"/><text class="m" x="150" y="300" font-size="22" style="fill:var(--on-gain)">LAST WEEK’S ENGAGED LEADS</text></g>
<g id="tally"></g>
<g id="pin"><circle class="loss" cx="340" cy="250" r="16"/><text class="m" x="120" y="700" font-size="20">PUT IT WHERE YOU’LL SEE IT DAILY</text></g>
<g id="chart"><path class="s-ink" d="M720 300V650H1460" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="720" y="700" font-size="20">ENGAGED LEADS PER WEEK</text></g>
