<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Collect seeds before</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">choosing one.</text>
<text class="b" x="120" y="600" font-size="32">Gather many rough ideas before deciding which ones deserve to grow.</text>
<path class="s-line" d="M1150 518h340" stroke-width="5" stroke-linecap="round"/>
<circle id="glow" cx="1266" cy="480" r="24" fill="none" stroke="var(--gain)" stroke-width="4"/>
<g id="pile"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Planting time.</text>
<text class="b" x="120" y="176" font-size="32">Rubin: the start of any project is a garden at planting time.</text>
<g id="bed"><text class="m" x="120" y="470" font-size="20">THE PROJECT</text><rect x="120" y="500" width="760" height="200" rx="20" fill="var(--line)"/><path class="s-muted" d="M160 560h680M160 610h680M160 660h680" stroke-width="3" stroke-dasharray="6 10"/></g>
<g id="bedseeds"></g>
<g id="packet"><rect class="s-ink" x="1000" y="230" width="260" height="300" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1000 280h260" stroke-width="4" stroke-dasharray="10 8"/><ellipse class="gain" cx="1130" cy="370" rx="40" ry="26" transform="rotate(-20 1130 370)"/><text class="m" x="1130" y="448" font-size="28" text-anchor="middle">SEEDS</text><text class="m" x="1130" y="492" font-size="22" text-anchor="middle">ROUGH IDEAS</text></g>
<g id="chips1"></g>
<g id="collect"><text class="d" x="120" y="800" font-size="48">Your only job is to collect.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Anything can be a seed.</text>
<text class="b" x="120" y="176" font-size="32">A scrap of melody, a phrase, a shape, a feeling, a question, a theme.</text>
<g id="icons"></g>
<g id="cseed"><ellipse cx="800" cy="470" rx="70" ry="44" fill="var(--muted)" transform="rotate(-15 800 470)"/><text class="m" x="800" y="560" font-size="20" text-anchor="middle">A SEED</text></g>
<g id="plain"><text class="d" x="120" y="820" font-size="48">Seeds often look unimpressive at first.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t judge too early.</text>
<g id="sq3"><text class="b" x="120" y="176" font-size="32">Ranking ideas the moment they appear squeezes the life out of them.</text></g>
<rect class="s-line" x="120" y="230" width="620" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="cards"></g>
<g id="rts"><text class="m" x="430" y="705" font-size="20" text-anchor="middle" style="fill:var(--loss)">RANKED TOO SOON</text></g>
<g id="pen"><g transform="rotate(30)"><rect class="loss" x="-10" y="-110" width="20" height="88" rx="6"/><path class="loss" d="M-10-22h20L0 0z"/></g></g>
<path class="s-ink" d="M860 700h600" stroke-width="6" stroke-linecap="round"/>
<g id="plants"></g>
<g id="later"><text class="d" x="120" y="820" font-size="48">Judgment has its place, but later.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">You can’t tell by staring.</text>
<text class="b" x="120" y="176" font-size="32">Rubin’s point is humble and freeing.</text>
<rect x="160" y="640" width="1000" height="40" rx="10" fill="var(--line)"/>
<g id="sprouts"></g>
<g id="qs"></g>
<g id="eye"><path class="s-line" d="M1250 578L1172 632" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/><ellipse class="s-ink" cx="1330" cy="560" rx="80" ry="44" fill="var(--stage)" stroke-width="6"/><circle id="pupil" class="ink" cx="1330" cy="560" r="22"/><text class="m" x="1330" y="650" font-size="20" text-anchor="middle">STARING WON’T TELL</text></g>
<g id="can"><g id="canb"><g transform="rotate(28)"><path class="s-ink" d="M-50-40H45L48-18L104-58L116-44L52 12L55 40H-50Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M-50-24q-38 0-38 28t38 28" fill="none" stroke-width="7" stroke-linecap="round"/><path class="s-gain" d="M-36 18h70" stroke-width="6" stroke-linecap="round"/></g><g id="drops"></g></g></g>
<g id="only"><text class="d" x="120" y="800" font-size="46">The only way to know: time and attention.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Catch everything.</text>
<text class="b" x="120" y="176" font-size="32">Keep a notebook, or voice memos on your phone.</text>
<g id="nb"><rect class="s-ink" x="160" y="260" width="240" height="320" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M200 330h160M200 380h160M200 430h160M200 480h110" stroke-width="6" stroke-linecap="round"/><rect class="s-ink" x="460" y="300" width="150" height="280" rx="22" fill="var(--stage)" stroke-width="6"/><path class="s-gain" d="M495 440v0M515 420v40M535 400v80M555 425v30M575 435v10" stroke-width="10" stroke-linecap="round"/><text class="m" x="280" y="620" font-size="20" text-anchor="middle">NOTEBOOK</text><text class="m" x="535" y="620" font-size="20" text-anchor="middle">VOICE MEMOS</text></g>
<path id="arr5" class="s-muted" d="M650 460h150m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="jar"><path class="s-ink" d="M920 290h180v40q50 10 50 60v290q0 40-40 40H910q-40 0-40-40V390q0-50 50-60z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="jarseeds"></g>
<line id="jstem" x1="1010" y1="330" x2="1010" y2="330" stroke="var(--gain)" stroke-width="7" stroke-linecap="round"/>
<g id="jleaf"><ellipse class="gain" cx="988" cy="240" rx="22" ry="10"/><ellipse class="gain" cx="1032" cy="240" rx="22" ry="10"/></g>
<g id="qq"><text class="d" x="1200" y="430" font-size="48" style="fill:var(--gain)">QUANTITY</text><text class="m" x="1200" y="480" font-size="22">OVER</text><text class="d5" x="1200" y="540" font-size="40" style="fill:var(--muted)">quality</text></g>
<g id="more"><text class="d" x="120" y="800" font-size="44">The more seeds, the more chances to take root.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Some seeds wait their season.</text>
<text class="b" x="120" y="176" font-size="32">An idea that goes nowhere today can be revisited months later.</text>
<g id="cal"><rect class="s-ink" x="160" y="260" width="380" height="360" rx="14" fill="var(--stage)" stroke-width="6"/><rect id="calh" x="160" y="260" width="380" height="72" rx="14" fill="var(--ink)"/><text id="calt" class="m" x="350" y="306" font-size="24" text-anchor="middle" style="fill:var(--stage)">TODAY</text><g id="days"></g></g>
<g id="shelfg"><rect class="ink" x="700" y="600" width="760" height="16" rx="4"/><path class="s-ink" d="M760 616v40M1400 616v40" stroke-width="8" stroke-linecap="round"/><g id="jars"></g><text class="m" x="1080" y="700" font-size="20" text-anchor="middle">SET ASIDE, REVISIT LATER</text></g>
<g id="mseed"><ellipse class="ink" cx="0" cy="0" rx="17" ry="11"/></g>
<line id="wstem" x1="1080" y1="570" x2="1080" y2="570" stroke="var(--gain)" stroke-width="7" stroke-linecap="round"/>
<g id="wleaf"><ellipse class="gain" cx="1056" cy="320" rx="24" ry="11"/><ellipse class="gain" cx="1104" cy="320" rx="24" ry="11"/></g>
<g id="season"><text class="d" x="120" y="800" font-size="48">Its season may not have come yet.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try this today.</text>
<text class="b" x="120" y="176" font-size="32">Ten minutes. Write down every idea that comes, however rough.</text>
<g id="tmr"><circle cx="360" cy="480" r="150" fill="none" stroke="var(--line)" stroke-width="16"/><circle id="arc" cx="360" cy="480" r="150" fill="none" stroke="var(--gain)" stroke-width="16" stroke-linecap="round" stroke-dasharray="942" transform="rotate(-90 360 480)"/><rect class="ink" x="340" y="294" width="40" height="20" rx="6"/><text class="d" x="360" y="510" font-size="96" text-anchor="middle">10</text><text class="m" x="360" y="560" font-size="22" text-anchor="middle">MINUTES</text></g>
<rect class="s-ink" x="640" y="230" width="520" height="540" rx="14" fill="var(--stage)" stroke-width="5"/>
<g id="lines7"></g>
<circle id="pick7" class="gain" cx="665" cy="590" r="10"/>
<g id="tags"><text class="m" x="1130" y="477" font-size="20" text-anchor="end" style="fill:var(--gain)">SILLY</text><text class="m" x="1130" y="597" font-size="20" text-anchor="end" style="fill:var(--gain)">STRANGE</text></g>
<g id="nox"><circle class="s-loss" cx="1340" cy="380" r="80" fill="none" stroke-width="8"/><rect class="ink" x="1290" y="372" width="100" height="16" rx="8"/><path class="s-loss" d="M1280 380h120" stroke-width="4"/><path class="s-loss" d="M1283 323l114 114" stroke-width="8" stroke-linecap="round"/><text class="m" x="1340" y="500" font-size="20" text-anchor="middle">CROSS NOTHING OUT</text></g>
<g id="wait"><g id="dots7"></g><text class="m" x="1340" y="670" font-size="18" text-anchor="middle">LET IT SIT A FEW DAYS</text><text class="m" x="1340" y="720" font-size="18" text-anchor="middle" style="fill:var(--gain)">THEN PICK ONE</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which idea have you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">dismissed too <tspan style="fill:var(--gain)">quickly?</tspan></text></g>
<g id="plant8"><text class="m" x="143" y="600" font-size="26">PLANT IT BACK IN THE PILE THIS WEEK.</text><text class="m" x="143" y="644" font-size="26">SEE WHAT GROWS.</text></g>
<g id="hand">
<rect class="ink" x="1390" y="500" width="90" height="64" rx="10"/>
<path class="s-ink" d="M1390 504h-80q-34 0-34 28q0 28 34 28h80z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1300 514h-36M1298 532h-44M1300 550h-36" fill="none" stroke-width="10" stroke-linecap="round"/>
</g>
<path d="M1170 720q120-110 240 0z" fill="var(--line)"/>
<path class="s-ink" d="M1140 720h300" stroke-width="6" stroke-linecap="round"/>
<line id="tstem" x1="1290" y1="668" x2="1290" y2="668" stroke="var(--gain)" stroke-width="7" stroke-linecap="round"/>
<g id="tleaf"><ellipse class="gain" cx="1267" cy="590" rx="22" ry="10"/><ellipse class="gain" cx="1313" cy="590" rx="22" ry="10"/></g>
<g id="tseed"><ellipse class="gain" cx="0" cy="0" rx="16" ry="10"/></g>
</g>