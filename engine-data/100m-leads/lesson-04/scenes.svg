<g id="s0">
<text class="m" x="120" y="150" font-size="28">$100M LEADS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Post free content</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">that earns trust.</text>
<text class="b" x="120" y="600" font-size="32">Hook them, hold them, reward them, then ask.</text>
<rect class="s-ink" x="1180" y="220" width="240" height="480" rx="32" fill="var(--stage)" stroke-width="7"/>
<g id="feed"></g>
<rect class="ink" x="1260" y="234" width="80" height="10" rx="5"/>
<g id="stranger"></g>
<text id="qm" class="d" x="1040" y="612" font-size="48" text-anchor="middle" style="fill:var(--gain)">?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One post reaches many.</text>
<text class="b" x="120" y="176" font-size="32">Each useful post builds a little trust with everyone who sees it.</text>
<g id="ph1"><rect class="s-ink" x="170" y="260" width="180" height="340" rx="24" fill="var(--stage)" stroke-width="7"/><path class="gain" d="M230 380v100l80-50z"/><text class="m" x="260" y="650" font-size="22" text-anchor="middle">ONE POST</text></g>
<g id="rays"></g><g id="aud"></g>
<text id="audl" class="m" x="780" y="700" font-size="22" text-anchor="middle">MANY PEOPLE AT ONCE</text>
<g id="meter"><rect class="s-ink" x="1220" y="260" width="120" height="380" rx="16" fill="none" stroke-width="6"/><rect id="mfill" class="gain" x="1232" y="632" width="96" height="0" rx="8"/><text class="m" x="1280" y="690" font-size="22" text-anchor="middle">TRUST</text></g>
<g id="tm"><text class="d" x="120" y="800" font-size="44">Trust grows with real value, again and again.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 1: hook them.</text>
<text class="b" x="120" y="176" font-size="32">Choose topics they care about, then make them feel new or urgent.</text>
<path id="hook" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="hcard"><rect class="s-ink" x="520" y="220" width="580" height="280" rx="18" fill="var(--stage)" stroke-width="5"/><rect x="548" y="246" width="524" height="130" rx="10" fill="var(--line)"/><circle class="gain" cx="610" cy="300" r="28"/><path class="ink" d="M690 376l100-80 80 60 60-36 130 56z"/><rect class="gain" x="548" y="396" width="420" height="34" rx="8"/><rect x="548" y="448" width="300" height="20" rx="6" fill="var(--muted)"/></g>
<g id="hlab"><text class="m" x="1130" y="318" font-size="22">IMAGE</text><text class="m" x="1130" y="422" font-size="22">TITLE</text><text class="m" x="1130" y="466" font-size="22">LINE</text></g>
<text id="tlab" class="m" x="120" y="576" font-size="20">PICK A TOPIC, THEN FRAME IT</text>
<g id="tc0"><rect class="s-ink" x="120" y="600" width="420" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="330" y="668" font-size="22" text-anchor="middle">A TOPIC THEY CARE ABOUT</text><path class="s-muted" d="M550 660h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="tc1"><rect class="s-gain" x="600" y="600" width="420" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="810" y="668" font-size="22" text-anchor="middle">FRAME IT AS NEW</text></g>
<g id="tc2"><text class="m" x="1040" y="668" font-size="20" text-anchor="middle">OR</text><rect class="gain" x="1060" y="600" width="420" height="120" rx="16"/><text class="m" x="1270" y="668" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">FRAME IT AS URGENT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 2: hold them.</text>
<text class="b" x="120" y="176" font-size="32">Give the viewer a reason to see what comes next.</text>
<g id="hg"><polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/><path id="sandS" class="s-gain" d="M290 430V612" stroke-width="4"/>
<path class="s-ink" d="M200 240C200 360 280 380 280 430C280 480 200 500 200 620M380 240C380 360 300 380 300 430C300 480 380 500 380 620" fill="none" stroke-width="6"/>
<path class="s-ink" d="M180 240h220M180 620h220" stroke-width="10" stroke-linecap="round"/></g>
<g id="nl0"><circle class="gain" cx="540" cy="300" r="34"/><text class="d" x="540" y="313" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">1</text><text class="d5" x="600" y="314" font-size="40">Lists</text></g>
<g id="nl1"><circle class="gain" cx="540" cy="420" r="34"/><text class="d" x="540" y="433" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">2</text><text class="d5" x="600" y="434" font-size="40">Step by step</text></g>
<g id="nl2"><circle class="gain" cx="540" cy="540" r="34"/><text class="d" x="540" y="553" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">3</text><text class="d5" x="600" y="554" font-size="40">Stories</text></g>
<g id="viewer"><rect class="s-ink" x="1150" y="220" width="300" height="80" rx="20" fill="var(--stage)" stroke-width="4"/><text class="m" x="1300" y="268" font-size="22" text-anchor="middle">WHAT’S NEXT?</text><path class="s-muted" d="M900 420h280m-18-16 18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g id="vfig"></g></g>
<rect class="s-line" x="500" y="660" width="960" height="20" rx="10" fill="none" stroke-width="3"/>
<rect id="pbar" class="gain" x="500" y="660" width="0" height="20" rx="10"/>
<text id="plab" class="m" x="500" y="720" font-size="22">THEY STAY TO SEE WHAT COMES NEXT</text>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 3: reward them.</text>
<text class="b" x="120" y="176" font-size="32">Deliver on what the hook promised.</text>
<g id="gift"><rect class="s-ink" x="180" y="380" width="220" height="160" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="275" y="383" width="30" height="154"/>
<path id="glow" class="s-gain" d="M230 370l-20-30M290 370v-36M350 370l20-30" stroke-width="6" stroke-linecap="round"/>
<g id="lid"><rect class="s-ink" x="165" y="340" width="250" height="44" rx="6" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="275" y="343" width="30" height="38"/><path class="gain" d="M290 340c-30-36-70-10-40 0zM290 340c30-36 70-10 40 0z"/></g></g>
<g id="cmp"><rect class="s-ink" x="520" y="330" width="280" height="100" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="660" y="392" font-size="36" text-anchor="middle">Promised</text><text class="d" x="860" y="402" font-size="64" text-anchor="middle">=</text><rect class="s-gain" x="920" y="330" width="280" height="100" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1060" y="392" font-size="36" text-anchor="middle">Delivered</text></g>
<g id="chk"><circle class="gain" cx="1330" cy="380" r="56"/><path d="M1302 382l20 20 34-40" fill="none" stroke="var(--on-gain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<path id="ret" class="s-gain" d="M1330 450C1330 640 300 660 290 556" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="retl"><path class="s-gain" d="M272 578l18-22 18 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="810" y="680" font-size="22" text-anchor="middle">TIME WELL SPENT · THEY COME BACK</text></g>
<g id="crowd"></g>
<text id="loyl" class="m" x="730" y="828" font-size="22" text-anchor="middle" style="fill:var(--gain)">LOYAL AUDIENCE</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Give far more than you ask.</text>
<text class="b" x="120" y="176" font-size="32">Post value again and again. Ask only now and then.</text>
<g id="scl">
<path class="s-ink" d="M800 300V700M690 700h220" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M420 300h760" stroke-width="10" stroke-linecap="round"/></g>
<circle class="ink" cx="800" cy="300" r="14"/>
<g id="panL"><path class="s-muted" d="M0 0L-110 140M0 0L110 140" stroke-width="3"/><path class="s-ink" d="M-120 140h240" stroke-width="8" stroke-linecap="round"/><g id="gives"></g><text class="m" x="0" y="184" font-size="20" text-anchor="middle">GIVE: VALUE, AGAIN AND AGAIN</text></g>
<g id="panR"><path class="s-muted" d="M0 0L-110 140M0 0L110 140" stroke-width="3"/><path class="s-ink" d="M-120 140h240" stroke-width="8" stroke-linecap="round"/><g id="askb"><rect class="loss" x="-26" y="106" width="52" height="30" rx="4"/><text class="m" x="0" y="184" font-size="20" text-anchor="middle">ASK: A CALL OR SIGN UP</text></g></g>
</g>
<g id="fair"><text class="d" x="120" y="800" font-size="44">Because you helped first, the ask feels fair.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Example: a gym owner.</text>
<text class="b" x="120" y="176" font-size="32">One short video: three mistakes beginners make with squats.</text>
