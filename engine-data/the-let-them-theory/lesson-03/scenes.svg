<g id="mm0"><text class="m" x="1280" y="400" font-size="22" text-anchor="middle">MOODS</text></g>
<g id="mm1"><text class="m" x="1280" y="460" font-size="22" text-anchor="middle">HISTORY</text></g>
<g id="mm2"><text class="m" x="1280" y="520" font-size="22" text-anchor="middle">INSECURITIES</text></g>
<text class="m" x="1280" y="750" font-size="20" text-anchor="middle">THEIR VIEW, NOT THE FULL TRUTH</text>
</g>
<g id="wx"><text class="d" x="120" y="820" font-size="44">You can't control it, like the weather.</text>
<circle cx="170" cy="690" r="24" fill="var(--muted)"/><circle cx="210" cy="675" r="32" fill="var(--muted)"/><circle cx="252" cy="692" r="22" fill="var(--muted)"/><rect x="170" y="686" width="82" height="28" fill="var(--muted)"/>
<g id="rn3"></g></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Say two words.</text>
<text class="b" x="120" y="176" font-size="32">When the worry shows up, let them.</text>
<path class="s-line" d="M120 722H1480" stroke-width="4"/>
