<text class="d5" x="1300" y="836" font-size="36" text-anchor="middle">trouble.</text></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The defensive investor.</text>
<text class="b" x="120" y="176" font-size="32">Safety first, and freedom from effort.</text>
<circle id="shd" class="s-gain" cx="370" cy="520" r="200" fill="none" stroke-width="6" stroke-dasharray="14 10"/>
<g id="chr"><rect class="s-ink" x="270" y="400" width="200" height="170" rx="30" fill="var(--stage)" stroke-width="7"/><g id="sitP"></g>
<rect class="s-ink" x="250" y="550" width="240" height="60" rx="14" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="226" y="500" width="48" height="120" rx="20"/><rect class="ink" x="466" y="500" width="48" height="120" rx="20"/>
<path class="s-ink" d="M270 610v50M470 610v50" stroke-width="8" stroke-linecap="round"/></g>
<g id="thr"><text class="m" x="620" y="420" font-size="20">SERIOUS MISTAKES</text><text class="m" x="620" y="600" font-size="20">LOSSES</text>
<path class="s-loss" d="M800 450H600m24-20-24 20 24 20M800 630H600m24-20-24 20 24 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cal"><rect class="s-ink" x="920" y="300" width="460" height="340" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="920" y="300" width="460" height="56"/><g id="cgrid"></g>
<text class="m" x="920" y="690" font-size="18">FREEDOM FROM EFFORT, WORRY AND DECISIONS</text></g>
<g id="ns0"><text class="d" x="120" y="770" font-size="44">Not a weaker choice.</text></g>
<g id="ns1"><text class="d" x="120" y="836" font-size="44">A <tspan style="fill:var(--gain)">sensible</tspan> one for busy people.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A simple recipe.</text>
<text class="b" x="120" y="176" font-size="32">Solid companies or funds, then the same sum every month.</text>
<g id="bk"></g>
<g id="bsk"><path class="s-ink" d="M140 470H460L430 620H170Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-line" d="M152 520H448M162 570H438" stroke-width="4"/>
<text class="m" x="120" y="670" font-size="18">LARGE, ESTABLISHED</text><text class="m" x="120" y="700" font-size="18">COMPANIES OR FUNDS</text></g>
<g id="coinG"><text class="m" x="490" y="540" font-size="18">SAME SUM</text></g>
<g id="plG"><text class="m" x="490" y="360" font-size="18">PRICE</text><path id="pl" class="s-ink" pathLength="1" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="barG"><text class="m" x="490" y="740" font-size="18">SHARES</text></g>
<g id="udL"><text class="m" x="640" y="830" font-size="20" style="fill:var(--gain)">LOWER PRICE → MORE SHARES FOR THE SAME SUM</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The enterprising investor.</text>
<text class="b" x="120" y="176" font-size="32">Real time and care, close to running a business.</text>
<g id="cards"></g>
<g id="mag"><circle class="s-ink" r="60" fill="none" stroke-width="10"/><path class="s-ink" d="M44 44L95 95" stroke-width="16" stroke-linecap="round"/></g>
<g id="gl"><text class="m" x="760" y="680" font-size="20" style="fill:var(--gain)">SOUND · MORE ATTRACTIVE THAN AVERAGE</text></g>
<g id="desk"><g id="dskP"></g><rect class="ink" x="420" y="520" width="140" height="80" rx="6"/><circle class="gain" cx="490" cy="560" r="10"/>
<rect class="s-ink" x="170" y="570" width="80" height="30" fill="var(--stage)" stroke-width="4"/>
<rect class="ink" x="140" y="600" width="460" height="18"/><path class="s-ink" d="M170 618V740M570 618V740" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="120" y="790" font-size="20">CLOSE TO RUNNING A BUSINESS</text></g>
<g id="fin"><text class="d" x="120" y="850" font-size="40">Better results, but only through skill and work.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hunting bargains.</text>
<text class="b" x="120" y="176" font-size="32">Bargain issues: priced below current assets minus all debts.</text>
<path class="s-line" d="M140 700H680" stroke-width="4"/>
<g id="b0"><rect class="ink" x="160" y="320" width="120" height="380"/><text class="m" x="220" y="740" font-size="18" text-anchor="middle">ASSETS</text></g>
<g id="b1"><rect class="loss" x="160" y="320" width="120" height="120"/><text class="m" x="220" y="388" font-size="18" text-anchor="middle" style="fill:var(--stage)">DEBTS</text></g>
<g id="b2"><rect class="s-gain" x="340" y="440" width="120" height="260" fill="none" stroke-width="6" stroke-dasharray="12 8"/><text class="m" x="400" y="740" font-size="18" text-anchor="middle">MINUS DEBTS</text>
<rect class="gain" x="520" y="580" width="120" height="120"/><text class="m" x="580" y="740" font-size="18" text-anchor="middle">PRICE</text>
<path class="s-gain" d="M490 446V574M476 560l14 14 14-14M476 460l14-14 14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
