<rect class="s-ink" x="448" y="278" width="200" height="130" rx="10" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="548" y="355" font-size="40" text-anchor="middle">w·o·r·d</text>
<text class="m" x="534" y="450" font-size="20" text-anchor="middle">ALONE</text></g>
<g id="br"><text class="m" x="700" y="262" font-size="20">STUDYING WORDS ALONE</text>
<rect id="b0" class="gain" x="700" y="280" height="44" rx="8" width="0"/>
<text class="m" x="700" y="372" font-size="20">MOSTLY QUIZZED OR READ FOR FUN</text>
<rect id="b1" x="700" y="390" height="44" rx="8" width="0" fill="var(--muted)"/>
<text class="m" x="1400" y="470" font-size="18" text-anchor="end">HOW FAR THEY ADVANCED · ILLUSTRATION</text></g>
<g id="gr"><text class="m" x="700" y="522" font-size="22" style="fill:var(--gain)">GRITTIER SPELLERS DID MORE OF THIS</text></g>
<g id="frn"><circle class="s-ink" cx="230" cy="680" r="60" fill="var(--stage)" stroke-width="6"/>
