<g id="s0">
<text class="m" x="120" y="150" font-size="28">$100M LEADS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your real problem is</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not enough leads.</text>
<text class="b" x="120" y="600" font-size="32">Why more interested people beats a better product, almost every time.</text>
<g id="shop">
<path class="s-line" d="M1120 540h360" stroke-width="5" stroke-linecap="round"/>
<rect class="s-ink" x="1160" y="330" width="280" height="210" fill="var(--stage)" stroke-width="6"/>
