<path class="s-gain" d="M1210 440h190" stroke-width="12" stroke-linecap="round"/><g id="rings"></g></g>
<g id="steps"></g>
<text class="m" x="143" y="800" font-size="26">ONE WEAKNESS · FULL FOCUS · FEEDBACK · REPEAT</text>
</g>