<g id="res"><text class="d" x="120" y="740" font-size="48">Loyalty can turn into <tspan style="fill:var(--loss)">resentment.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Behavior is data.</text>
<text class="b" x="120" y="176" font-size="32">Watch what people do, not what they say.</text>
