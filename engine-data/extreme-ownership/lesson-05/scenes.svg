<g id="pw"><text class="d" x="120" y="830" font-size="44">Say it in plain, simple words.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Solve it. Then execute.</text>
<text class="b" x="120" y="176" font-size="32">Ask the team for input where time allows.</text>
