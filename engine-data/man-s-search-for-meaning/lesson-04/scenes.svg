<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The march at dawn.</text>
<text class="b" x="120" y="176" font-size="32">Prisoners stumble through darkness to a work site.</text>
<g id="sky"></g>
<path class="s-ink" d="M120 640H1480" stroke-width="6" stroke-linecap="round"/>
<g id="ice"><text class="m" x="120" y="800" font-size="20">STONES AND ICY PUDDLES</text></g>
<g id="pris"></g>
<g id="grd"></g>
<g id="shout"></g>
<g id="snow"></g>
<g id="lab2"><text class="m" x="1480" y="800" font-size="20" text-anchor="end">SORE FEET · THIN CLOTHES · CUTTING COLD</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A whispered line.</text>
<text class="b" x="120" y="176" font-size="32">The man beside Frankl hides his mouth behind his collar.</text>
<g id="frk"><text class="m" x="520" y="730" font-size="22" text-anchor="middle">FRANKL</text></g>
<g id="nbr"><text class="m" x="780" y="730" font-size="22" text-anchor="middle">NEIGHBOUR</text></g>
<g id="wsp"></g>
<g id="wbub">
<rect x="900" y="440" width="580" height="150" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<path d="M902 488l-50 12 50 18" fill="var(--stage)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
<text class="m" x="930" y="505" font-size="22">HE HOPES THEIR WIVES ARE BETTER OFF</text>
<text class="m" x="930" y="545" font-size="22">AND CANNOT SEE THEM NOW</text>
</g>
<g id="tcl">
<ellipse cx="430" cy="290" rx="140" ry="85" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<circle cx="470" cy="392" r="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<circle cx="492" cy="414" r="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="3"/>
<g id="tclW"></g>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Talking with her.</text>
<text class="b" x="120" y="176" font-size="32">In his mind, her face appears with startling clarity.</text>
<path class="s-ink" d="M120 740H1480" stroke-width="6" stroke-linecap="round"/>
<path class="s-muted" d="M1350 740a50 50 0 0 1 100 0" fill="none" stroke-width="6"/>
<text class="m" x="1400" y="788" font-size="22" text-anchor="middle">RISING SUN</text>
<g id="frk3"></g>
<g id="rays3"></g>
<g id="por">
<circle cx="1060" cy="440" r="190" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<circle class="gain" cx="1060" cy="400" r="62"/>
<path class="gain" d="M975 590a85 75 0 0 1 170 0z"/>
<circle cx="1040" cy="392" r="6" fill="var(--on-gain)"/><circle cx="1080" cy="392" r="6" fill="var(--on-gain)"/>
<path id="smi" d="M1034 416q26 22 52 0" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1060" y="718" font-size="22" text-anchor="middle">HER FACE</text>
</g>
<g id="cb1"></g><g id="cb2"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A sudden truth.</text>
<text class="b" x="120" y="176" font-size="32">In that moment, something becomes clear.</text>
<clipPath id="skyc"><rect x="120" y="190" width="1360" height="290"/></clipPath>
<g clip-path="url(#skyc)"><g id="sunR"></g><circle id="sun" class="gain" cx="800" cy="600" r="90"/></g>
<path class="s-ink" d="M120 480H1480" stroke-width="6" stroke-linecap="round"/>
<g id="tru">
<text class="d" x="800" y="590" font-size="56" text-anchor="middle"><tspan style="fill:var(--gain)">Love</tspan> is the highest goal</text>
<text class="d" x="800" y="660" font-size="56" text-anchor="middle">a human being can reach for.</text>
</g>
<g id="qt">
<rect x="120" y="710" width="1360" height="100" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/>
<text class="d5" x="160" y="772" font-size="36">“The salvation of man is through love and in love.”</text>
<text class="m" x="1450" y="772" font-size="20" text-anchor="end">VIKTOR FRANKL</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Joy with nothing.</text>
<text class="b" x="120" y="176" font-size="32">Starved, exhausted, owning nothing, yet still able to feel joy.</text>
<g id="fgr">
<circle class="ink" cx="500" cy="380" r="46"/>
<path class="ink" d="M440 660V500a60 60 0 0 1 120 0V660z"/>
<path class="s-ink" d="M455 470L360 545M545 470L640 545M475 660V770M525 660V770" stroke-width="12" stroke-linecap="round"/>
<path class="s-ink" d="M325 545q35 28 70 0M605 545q35 28 70 0" fill="none" stroke-width="7" stroke-linecap="round"/>
</g>
<g id="gr5"></g>
<g id="hrtW"></g>
<g id="own">
<text class="m" x="860" y="360" font-size="22">WHAT HE OWNS</text>
<rect class="s-line" x="860" y="380" width="560" height="50" rx="25" fill="none" stroke-width="4"/>
<text class="m" x="890" y="413" font-size="20">NOTHING</text>
</g>
<g id="feel">
<text class="m" x="860" y="520" font-size="22">WHAT HE CAN STILL FEEL</text>
<rect class="s-line" x="860" y="540" width="560" height="50" rx="25" fill="none" stroke-width="4"/>
<rect id="joyF" class="gain" x="860" y="540" width="50" height="50" rx="25"/>
<text id="joyT" class="m" x="890" y="573" font-size="20" style="fill:var(--on-gain)">DEEP JOY</text>
</g>
<g id="jy3"><text class="d" x="120" y="840" font-size="44">That joy comes from holding a loved one in mind.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Alive or not.</text>
<text class="b" x="120" y="176" font-size="32">He has no idea whether his wife is still alive.</text>
<g id="frk6"><text class="m" x="260" y="660" font-size="22" text-anchor="middle">FRANKL</text></g>
<g id="wf"><text class="m" x="1240" y="660" font-size="22" text-anchor="middle">HIS WIFE</text></g>
<circle id="core" class="gain" cx="1240" cy="535" r="0"/>
<g id="inl"><text class="m" x="1240" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">INNER PERSON</text></g>
<g id="qmG"><text id="qm" class="d" x="1240" y="350" font-size="170" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<path id="cn" class="s-gain" d="M340 500H1160" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
<g id="mvW"></g>
<g id="same6"><text class="m" x="800" y="570" font-size="22" text-anchor="middle">WHAT HE FEELS DOES NOT CHANGE</text></g>
<g id="dth"><text class="d" x="800" y="800" font-size="44" text-anchor="middle">Real across distance, and even across death.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">What it means.</text>
<text class="b" x="120" y="176" font-size="32">You do not need a camp to use this.</text>
<g id="phn">
<rect x="220" y="250" width="200" height="380" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/>
<rect x="244" y="290" width="152" height="270" rx="8" fill="var(--line)"/>
