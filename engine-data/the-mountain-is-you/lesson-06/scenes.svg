<text class="m" x="462" y="306" font-size="24" style="fill:var(--loss)">WORRY</text>
<g id="cloudS"><circle class="loss" cx="222" cy="320" r="56"/><circle class="loss" cx="300" cy="282" r="70"/><circle class="loss" cx="384" cy="322" r="52"/><rect class="loss" x="170" y="300" width="260" height="80" rx="40"/>
