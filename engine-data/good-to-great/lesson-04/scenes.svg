<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two grocers, one big shift.</text>
<text class="b" x="120" y="176" font-size="32">A&amp;P was a giant. Kroger was a far less famous rival.</text>
<path class="s-line" d="M120 640H1480" stroke-width="4"/>
<g id="ghost"><rect x="880" y="330" width="560" height="310" rx="10" fill="none" stroke="var(--gain)" stroke-width="5" stroke-dasharray="14 10"/><text class="m" x="1420" y="364" font-size="20" text-anchor="end" style="fill:var(--gain)">BIGGER, MODERN STORES</text></g>
<g id="ap"><text class="m" x="160" y="684" font-size="20">ONE OF THE BIGGEST RETAILERS IN THE WORLD</text></g>
<g id="kp"><text class="m" x="900" y="684" font-size="20">A RIVAL, FAR LESS FAMOUS</text></g>
