<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fruit shipper.</text>
<text class="b" x="120" y="176" font-size="32">Jim Grant shipped oranges and grapefruit by the trainload.</text>
<g id="jim"><text class="m" x="220" y="650" font-size="22" text-anchor="middle">JIM GRANT</text></g>
<path class="s-ink" d="M360 630H1480" stroke-width="6" stroke-linecap="round"/>
<g id="train"></g>
<g id="wrk">
<circle class="ink" cx="290" cy="410" r="6" fill-opacity=".5"/><circle class="ink" cx="340" cy="388" r="9" fill-opacity=".5"/><circle class="ink" cx="400" cy="366" r="12" fill-opacity=".5"/>
<rect class="s-loss" x="640" y="210" width="560" height="230" rx="30" fill="var(--stage)" stroke-width="4" stroke-dasharray="12 10"/>
<g id="wcar"><rect class="s-loss" x="790" y="290" width="220" height="90" rx="8" fill="var(--stage)" stroke-width="6"/><circle class="loss" cx="840" cy="392" r="13"/><circle class="loss" cx="960" cy="392" r="13"/></g>
<circle class="gain" cx="1060" cy="412" r="14"/><circle class="gain" cx="1100" cy="398" r="14"/><circle class="gain" cx="1140" cy="416" r="14"/><circle class="gain" cx="1030" cy="380" r="12"/>
</g>
<g id="down"><text class="d" x="120" y="780" font-size="46">The worry was wearing him down.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Count the cars.</text>
<text class="b" x="120" y="176" font-size="32">Grant asked himself a simple question.</text>
<g id="pad">
<rect class="s-ink" x="120" y="230" width="560" height="560" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="rings"></g>
<text class="m" x="160" y="300" font-size="24">HOW MANY CARS?</text>
<path class="s-line" d="M160 322h480" stroke-width="3"/>
</g>
<g id="r1"><text class="m" x="160" y="380" font-size="22">SHIPPED OVER THE YEARS</text><text id="n25" class="d" x="156" y="500" font-size="110" letter-spacing="-3">25,000</text></g>
<g id="r2"><text class="m" x="160" y="580" font-size="22">WRECKED</text><text id="n5" class="d" x="156" y="700" font-size="110" style="fill:var(--loss)">5</text></g>
<g id="grid"></g>
<g id="g1"><text class="m" x="830" y="660" font-size="22">ABOUT 25,000 SHIPPED</text><text class="m" x="830" y="760" font-size="18">SCHEMATIC · NOT TO SCALE</text></g>
<g id="g2"><text class="m" x="830" y="700" font-size="22" style="fill:var(--loss)">MAYBE 5 WRECKED</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One wreck in 5,000 cars.</text>
<text class="b" x="120" y="176" font-size="32">Roughly, by Grant’s own count.</text>
<g id="rat"><text class="d" x="116" y="340" font-size="110" letter-spacing="-3"><tspan style="fill:var(--loss)">1</tspan> in 5,000</text><text class="m" x="120" y="390" font-size="22">ROUGHLY ONE WRECK PER 5,000 CARS</text></g>
<g id="grip"><text class="d5" x="900" y="300" font-size="36">Once he saw that, the worry</text><text class="d5" x="900" y="346" font-size="36">began to lose its grip.</text></g>
<g id="scl"><g transform="translate(0 -60)">
<path class="ink" d="M800 560L740 700H860z"/><rect class="ink" x="700" y="700" width="200" height="16" rx="4"/>
<g id="pl"><path class="s-muted" d="M0 0L-100 150M0 0L100 150" stroke-width="3"/><path class="s-ink" d="M-110 150q110 50 220 0z" fill="var(--stage)" stroke-width="6"/><circle id="fearDot" class="loss" cx="0" cy="134" r="14"/><text class="m" x="0" y="225" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEAR</text></g>
<g id="pr"><path class="s-muted" d="M0 0L-100 150M0 0L100 150" stroke-width="3"/><g id="blk"></g><path class="s-ink" d="M-110 150q110 50 220 0z" fill="var(--stage)" stroke-width="6"/><text class="m" x="0" y="225" font-size="22" text-anchor="middle" style="fill:var(--gain)">FACTS</text></g>
<line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/>
<circle class="ink" cx="800" cy="560" r="12"/>
</g></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bet like an insurer.</text>
<text class="b" x="120" y="176" font-size="32">Lloyd’s of London and the law of averages.</text>
<g id="bld">
<path class="s-ink" d="M140 400L350 300L560 400z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="ink" x="150" y="400" width="400" height="20"/><g id="cols"></g><rect class="ink" x="140" y="660" width="420" height="24"/>
<text class="m" x="350" y="730" font-size="22" text-anchor="middle">LLOYD’S OF LONDON</text>
</g>
<g id="coins"></g>
<g id="cl"><text class="m" x="700" y="740" font-size="20">BETTING DISASTERS RARELY HAPPEN</text></g>
<g id="dc">
<g transform="rotate(-12 1240 340)"><rect class="s-ink" x="1180" y="280" width="120" height="120" rx="18" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1210" cy="310" r="10"/><circle class="ink" cx="1240" cy="340" r="10"/><circle class="ink" cx="1270" cy="370" r="10"/></g>
<g transform="rotate(10 1390 370)"><rect class="s-ink" x="1330" y="310" width="120" height="120" rx="18" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1360" cy="340" r="10"/><circle class="ink" cx="1420" cy="340" r="10"/><circle class="ink" cx="1390" cy="370" r="10"/><circle class="ink" cx="1360" cy="400" r="10"/><circle class="ink" cx="1420" cy="400" r="10"/></g>
</g>
<g id="gam"><text class="d" x="1120" y="560" font-size="52" style="fill:var(--loss)">Gambling</text></g>
<line id="gs" class="s-ink" x1="1112" y1="542" x2="1112" y2="542" stroke-width="6" stroke-linecap="round"/>
<g id="ins"><text class="d" x="1120" y="640" font-size="52" style="fill:var(--gain)">Insurance</text><text class="m" x="1120" y="690" font-size="20">THE LAW OF AVERAGES</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Swap the movie for a number.</text>
<text class="b" x="120" y="176" font-size="32">Feelings shout. The record of what usually happens speaks calmly.</text>
<g id="scr">
<rect class="s-ink" x="120" y="230" width="520" height="330" rx="12" fill="var(--stage)" stroke-width="6"/>
<g id="spr"></g>
<g id="mcar"><rect class="s-loss" x="300" y="360" width="160" height="70" rx="8" fill="var(--stage)" stroke-width="6"/><circle class="loss" cx="335" cy="440" r="12"/><circle class="loss" cx="425" cy="440" r="12"/></g>
<path class="s-muted" d="M586 480a26 26 0 1 1-8-19m0 0l2-14m-2 14l-14-2" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="120" y="600" font-size="20">WORST CASE · ON REPEAT</text>
</g>
<g id="met">
<path class="s-gain" d="M880 520A240 240 0 0 1 1120 280" fill="none" stroke-width="22"/>
<path class="s-loss" d="M1120 280A240 240 0 0 1 1360 520" fill="none" stroke-width="22"/>
