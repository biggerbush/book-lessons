<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMING WAVE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">AI and synthetic biology</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">lead the wave.</text>
<text class="b" x="120" y="590" font-size="32">Two technologies, learning machines and editable life,</text>
<text class="b" x="120" y="634" font-size="32">are speeding each other up.</text>
<path id="wv0" class="s-line" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="gA"></g><g id="gB"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the two engines.</text>
<text class="b" x="120" y="176" font-size="32">Learning software and the code of life.</text>
<g id="orbg"><ellipse id="orb" class="s-line" cx="800" cy="520" rx="640" ry="310" fill="none" stroke-width="4" stroke-dasharray="14 12"/></g>
<g id="ai1">
<rect class="s-ink" x="370" y="370" width="220" height="220" rx="20" fill="var(--stage)" stroke-width="7"/>
<g id="chip"></g>
<text class="m" x="480" y="650" font-size="22" text-anchor="middle" style="fill:var(--ink)">ARTIFICIAL INTELLIGENCE</text>
<text class="m" x="480" y="682" font-size="18" text-anchor="middle">SOFTWARE THAT LEARNS FROM DATA</text>
</g>
<g id="dna1">
<g id="helix"></g>
<text class="m" x="1120" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">SYNTHETIC BIOLOGY</text>
<text class="m" x="1120" y="682" font-size="18" text-anchor="middle">READ · EDIT · WRITE LIFE</text>
</g>
<g id="satg">
<g id="sat0"><rect class="ink" x="-20" y="-16" width="40" height="32" rx="6"/><circle cx="-8" cy="-2" r="4" fill="var(--stage)"/><circle cx="8" cy="-2" r="4" fill="var(--stage)"/><path class="s-ink" d="M0-16v-10" stroke-width="4" stroke-linecap="round"/><text class="m" x="34" y="8" font-size="22">ROBOTICS</text></g>
<g id="sat1"><circle class="gain" r="8"/><ellipse class="s-gain" rx="24" ry="9" fill="none" stroke-width="4" transform="rotate(60)"/><ellipse class="s-gain" rx="24" ry="9" fill="none" stroke-width="4" transform="rotate(-60)"/><text class="m" x="34" y="8" font-size="22">QUANTUM COMPUTING</text></g>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Machines that learn.</text>
<text class="b" x="120" y="176" font-size="32">DeepMind’s AlphaGo beat a world champion at Go.</text>
<g id="brd2"><rect class="s-ink" x="160" y="240" width="460" height="460" rx="10" fill="var(--stage)" stroke-width="6"/><g id="grid2"></g><g id="stones"></g></g>
<g id="supg"><circle id="supr" class="s-gain" cx="540" cy="470" r="24" fill="none" stroke-width="5"/><circle class="gain" cx="540" cy="470" r="21"/></g>
<g id="exp1"><text class="m" x="720" y="300" font-size="24">EXPERTS AT FIRST</text><text class="d" x="720" y="370" font-size="56" style="fill:var(--loss)">“A mistake?”</text></g>
<g id="exp2"><text class="m" x="720" y="460" font-size="24">THEN THEY REALISED</text><text class="d" x="720" y="530" font-size="56" style="fill:var(--gain)">Brilliant.</text></g>
<g id="bulb"><g id="rays"></g><circle id="bulbc" class="s-ink" cx="1300" cy="400" r="90" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1265 500h70M1270 530h60M1282 560h36" stroke-width="10" stroke-linecap="round"/></g>
<g id="disc2"><text class="d" x="120" y="800" font-size="44">AI could discover new things, not just copy us.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Life is becoming code.</text>
<text class="b" x="120" y="176" font-size="32">Read it. Edit it. Write it.</text>
<g id="p3a"><rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">1 · READ</text><g id="rd3"></g><rect id="scan" class="gain" x="160" y="380" width="8" height="80"/><text id="lets" class="m" x="330" y="560" font-size="34" text-anchor="middle" style="fill:var(--ink)"></text><text class="d5" x="150" y="660" font-size="30">Faster and cheaper.</text></g>
<g id="p3b"><rect class="s-line" x="590" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="620" y="280" font-size="22">2 · EDIT · CRISPR</text><g id="ed3"></g><path id="edc" class="s-gain" d="M772 448H828M772 492H828M786 448V492M814 448V492" stroke-width="8" stroke-linecap="round"/><g id="sci"><g id="scii"><path class="s-ink" d="M785 440L818 358M815 440L782 358" stroke-width="7" stroke-linecap="round"/><circle class="s-ink" cx="776" cy="344" r="16" fill="none" stroke-width="6"/><circle class="s-ink" cx="824" cy="344" r="16" fill="none" stroke-width="6"/></g></g><text class="d5" x="620" y="660" font-size="30">Precise gene edits.</text></g>
<g id="p3c"><rect class="s-line" x="1060" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1090" y="280" font-size="22">3 · WRITE</text><rect class="s-ink" x="1120" y="320" width="300" height="110" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="1146" y="384" font-size="22" style="fill:var(--ink)">DNA PRINTER</text><circle class="gain" cx="1388" cy="356" r="11"/><path class="s-ink" d="M1220 430h100" stroke-width="10" stroke-linecap="round"/><g id="wr3"></g><path id="w1" class="s-ink" stroke-width="6" stroke-linecap="round"/><path id="w2" class="s-ink" stroke-width="6" stroke-linecap="round"/><text class="d5" x="1090" y="660" font-size="30">Print custom DNA.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where the engines meet.</text>
<text class="b" x="120" y="176" font-size="32">Proteins: the tiny machines inside every cell.</text>
<g id="pr4"><polyline id="chain4" class="s-ink" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g id="beads"></g></g>
<g id="shp4"><text class="m" x="140" y="700" font-size="22">SHAPE DECIDES WHAT IT DOES</text></g>
<g id="sci4"><rect class="s-ink" x="760" y="290" width="200" height="150" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="760" y="290" width="200" height="40" rx="10"/><text class="d" x="860" y="410" font-size="44" text-anchor="middle">YEARS</text><g id="sct4"></g><text class="m" x="860" y="700" font-size="22" text-anchor="middle">PER PROTEIN SHAPE</text></g>
<g id="af4"><rect class="gain" x="1060" y="250" width="420" height="90" rx="16"/><text class="d" x="1270" y="310" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">AlphaFold</text><g id="afg"></g></g>
<g id="rel4"><text class="m" x="1060" y="700" font-size="22">PREDICTIONS RELEASED FOR</text><text class="m" x="1060" y="732" font-size="22" style="fill:var(--gain)">ALMOST EVERY KNOWN PROTEIN</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A feedback loop.</text>
<text class="b" x="120" y="176" font-size="32">Biology feeds AI. AI feeds biology.</text>
<g id="lp5">
