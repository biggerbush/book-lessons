<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Let your work</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">have seasons.</text>
<text class="b" x="120" y="600" font-size="32">Why good work rises and falls, like a farmer’s year.</text>
<circle id="sun0" class="gain" cx="1380" cy="270" r="44"/>
<g id="field"></g>
<g id="t0q"><text class="m" x="1000" y="690" font-size="22">HARVEST EVERY SINGLE DAY?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Always on.</text>
<text class="b" x="120" y="176" font-size="32">Picture your workload as a line across the calendar.</text>
<path class="s-ink" d="M200 260V640H1000" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="214" y="262" font-size="20">WORKLOAD</text>
<g id="mo1"></g>
<rect id="flatA" class="loss" x="200" y="330" width="0" height="310" fill-opacity=".12"/>
<path id="flatL" class="s-loss" d="M200 330H1000" pathLength="1" stroke-width="8" stroke-linecap="round" fill="none"/>
<g id="flatT"><text class="m" x="990" y="312" font-size="20" text-anchor="end" style="fill:var(--loss)">FLAT AND HIGH, ALL YEAR</text></g>
<g id="wk">
<text class="m" x="1260" y="320" font-size="20" text-anchor="middle">SAME FULL INTENSITY, EVERY WEEK</text>
<path class="ink" d="M1180 560v-50a80 80 0 0 1 160 0v50z"/>
<circle id="wkH" class="ink" cx="1260" cy="380" r="40"/>
<rect class="s-ink" x="1170" y="600" width="180" height="64" rx="10" fill="none" stroke-width="5"/>
<rect class="ink" x="1350" y="616" width="12" height="32" rx="3"/>
<rect id="batF" x="1180" y="610" width="160" height="44" rx="5"/>
<text class="m" x="1260" y="700" font-size="20" text-anchor="middle">ENERGY</text>
</g>
<g id="wear"><text class="d" x="120" y="800" font-size="44">This constant pace slowly wears people down.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The farmer’s rhythm.</text>
<text class="b" x="120" y="176" font-size="32">For most of human history, work followed the seasons.</text>
<g id="pl"><path class="s-ink" d="M220 480Q360 440 500 480" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="360" y="540" font-size="20" text-anchor="middle">PLANTING: PUSH HARD</text></g>
<g id="hv"><path class="s-ink" d="M680 490H920" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="800" y="540" font-size="20" text-anchor="middle">HARVEST: PUSH HARD</text></g>
<g id="wi"><g id="flk"></g>
<path class="s-ink" d="M1130 400L1240 300L1350 400" fill="var(--stage)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="1155" y="395" width="170" height="95" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1220" y="430" width="40" height="60"/>
<text class="m" x="1240" y="540" font-size="20" text-anchor="middle">WINTER: REST, REPAIR TOOLS</text></g>
<path class="s-line" d="M160 770H1440" stroke-width="4"/>
<path id="eff" class="s-gain" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="effL"><text class="m" x="1440" y="625" font-size="20" text-anchor="end" style="fill:var(--gain)">EFFORT ROSE AND FELL</text></g>
<g id="fm"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A recent habit.</text>
<text class="b" x="120" y="176" font-size="32">Flat, year-round intensity is the odd one out in human history.</text>
<g id="tl"><path id="tlW" class="s-ink" pathLength="1" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="160" y="480" font-size="20">MOST OF HUMAN HISTORY: SEASONAL</text></g>
<g id="tlF"><path class="s-muted" d="M1180 260V450" stroke-width="3" stroke-dasharray="6 8"/>
<path class="s-loss" d="M1180 380L1200 300H1440" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1440" y="480" font-size="20" text-anchor="end" style="fill:var(--loss)">RECENT: FLAT</text></g>
<g id="fc"><path class="ink" d="M200 760V650l80-45v45l80-45v45l80-45V760z"/><rect class="ink" x="412" y="570" width="28" height="60"/>
<text class="m" x="320" y="795" font-size="20" text-anchor="middle">FACTORY: FIXED HOURS</text></g>
<path id="a1" class="s-muted" d="M490 690h120m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="of"><rect class="s-ink" x="660" y="560" width="180" height="200" fill="var(--stage)" stroke-width="6"/><g id="ofw"></g>
<text class="m" x="750" y="795" font-size="20" text-anchor="middle">OFFICE</text></g>
<path id="a2" class="s-muted" d="M870 690h120m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="ck"><circle class="s-ink" cx="1200" cy="660" r="95" fill="var(--stage)" stroke-width="7"/><g id="ckt"></g>
<path id="ckM" class="s-ink" d="M1200 660V590" stroke-width="7" stroke-linecap="round"/>
<path id="ckH" class="s-loss" d="M1200 660h45" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1200" y="795" font-size="20" text-anchor="middle">THE SAME STEADY DRUMBEAT</text></g>
<g id="mind"><text class="d" x="120" y="850" font-size="40">But our minds were never built to sprint every week.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The academic year.</text>
<text class="b" x="120" y="176" font-size="32">A professor’s calendar has busy seasons and lighter ones.</text>
<g id="acI"><path class="ink" d="M1390 120L1470 150L1390 180L1310 150Z"/><path class="ink" d="M1345 165v30q45 20 90 0v-30z"/>
<path class="s-gain" d="M1460 154v40" stroke-width="5" stroke-linecap="round"/></g>
<g id="acB"><g id="acM"></g>
<rect id="fall" x="120" y="310" width="453" height="90" stroke="var(--ink)" stroke-width="4"/>
<rect id="spr" x="573" y="310" width="567" height="90" stroke="var(--ink)" stroke-width="4"/>
<rect id="sum" x="1140" y="310" width="340" height="90" stroke="var(--ink)" stroke-width="4"/></g>
<g id="semL"><text class="m" x="347" y="440" font-size="20" text-anchor="middle" style="fill:var(--loss)">FALL SEMESTER · BUSY</text>
<text class="m" x="857" y="440" font-size="20" text-anchor="middle" style="fill:var(--loss)">SPRING SEMESTER · BUSY</text>
<text class="m" x="347" y="470" font-size="18" text-anchor="middle">TEACHING, DEADLINES</text>
<text class="m" x="857" y="470" font-size="18" text-anchor="middle">TEACHING, DEADLINES</text></g>
<g id="sumL"><text class="m" x="1310" y="440" font-size="20" text-anchor="middle" style="fill:var(--gain)">SUMMER · LIGHTER</text>
<text class="m" x="1310" y="470" font-size="18" text-anchor="middle">REFLECTION, DEEP PROJECTS</text></g>
<g id="barsL"><text class="m" x="120" y="520" font-size="20">INTENSITY</text></g>
<g id="bars"></g>
<g id="sunA"><g id="sunR"></g><circle class="gain" cx="1310" cy="590" r="28"/></g>
<g id="vary"><text class="d" x="120" y="830" font-size="44">Productive precisely because the pace varies.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plan a slow season.</text>
<text class="b" x="120" y="176" font-size="32">Borrow the rhythm, even in a regular job.</text>
<g id="cal"></g>
<rect id="ring5" class="s-gain" x="482" y="356" width="190" height="140" rx="20" pathLength="1" fill="none" stroke-width="7"/>
<g id="rt5"><text class="m" x="940" y="260" font-size="22" style="fill:var(--gain)">IN THE SLOW SEASON</text>
<text class="m" x="940" y="320" font-size="20">FEWER NEW COMMITMENTS</text>
<text class="m" x="940" y="470" font-size="20">FEWER MEETINGS</text><g id="sq5"></g></g>
<g id="prot"><text class="d" x="120" y="740" font-size="48">Pick a lighter stretch, and protect it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Seasons can be small, too.</text>
<text class="b" x="120" y="176" font-size="32">Lighter weeks, and lighter days.</text>
<g id="wkB"><text class="m" x="120" y="240" font-size="20">WEEKS</text></g>
<g id="flg"><path class="s-ink" d="M660 270V200" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M660 200h50l-12 14 12 14h-50z"/>
<text class="m" x="724" y="222" font-size="20">DEADLINE</text></g>
<g id="lwL"><text class="m" x="890" y="512" font-size="20" text-anchor="middle" style="fill:var(--gain)">LIGHTER WEEK</text></g>
<g id="days"><text class="m" x="120" y="580" font-size="20">A MONTH OF WORKDAYS</text></g>
<g id="edL"><text class="m" x="938" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">EASY DAY: THINK, CATCH UP</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Peaks and valleys.</text>
<text class="b" x="120" y="176" font-size="32">Redraw your workload line as a gentle wave.</text>
<g id="oldL"><path class="s-muted" d="M160 320H1440" stroke-width="3" stroke-dasharray="8 10"/>
<text class="m" x="1440" y="300" font-size="20" text-anchor="end">THE OLD FLAT LINE</text></g>
<path id="wv7" class="s-gain" pathLength="1" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pkL"><g id="pd"></g><text class="m" x="267" y="272" font-size="20" text-anchor="middle">PEAK: INTENSE PUSH</text></g>
<g id="vlL"><g id="vd"></g><text class="m" x="480" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">VALLEY: RECOVERY</text></g>
<g id="vw"><text class="d" x="120" y="760" font-size="48">The valleys are not wasted time.</text></g>
<g id="vp"><text class="d" x="120" y="830" font-size="48" style="fill:var(--gain)">They make the peaks possible.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Where could you circle</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">one <tspan style="fill:var(--gain)">lighter season</tspan>,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">and protect it?</text></g>
<g id="yr"><text class="m" x="143" y="625" font-size="22">THE NEXT 12 MONTHS</text></g>
<ellipse id="ring8" class="s-gain" cx="682" cy="675" rx="46" ry="40" pathLength="1" fill="none" stroke-width="6"/>
<g id="ptx"><text class="m" x="682" y="760" font-size="22" text-anchor="middle" style="fill:var(--gain)">PROTECT IT</text></g>
</g>