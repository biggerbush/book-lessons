<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMING WAVE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Walking the narrow path</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to containment.</text>
<text class="b" x="120" y="600" font-size="32">Many imperfect safeguards, layered together,</text>
<text class="b" x="120" y="644" font-size="32">can keep powerful technology in check.</text>
<g id="rope0">
<path class="s-ink" d="M1200 300V720M1460 300V720" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M1200 330Q1330 400 1460 330" fill="none" stroke-width="5"/>
<text class="m" x="1180" y="770" font-size="20" style="fill:var(--loss)">CATASTROPHE</text>
<text class="m" x="1480" y="770" font-size="20" text-anchor="end" style="fill:var(--loss)">DYSTOPIA</text>
</g>
<g id="walker"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">No silver bullet.</text>
<text class="b" x="120" y="176" font-size="32">No single law, invention or treaty will contain the wave.</text>
<g id="wand">
<path class="s-ink" d="M200 560L420 340" stroke-width="16" stroke-linecap="round"/>
<path class="gain" d="M440 270l12 26 28 3-21 19 6 28-25-14-25 14 6-28-21-19 28-3z"/>
<text class="m" x="120" y="650" font-size="22">ONE LAW?</text>
<text class="m" x="120" y="690" font-size="22">ONE INVENTION?</text>
<text class="m" x="120" y="730" font-size="22">ONE TREATY?</text>
</g>
<path id="wandx" class="s-loss" d="M180 260L520 600M520 260L180 600" stroke-width="10" stroke-linecap="round" fill="none" opacity="0"/>
<g id="rings"></g>
<g id="core"><circle class="gain" cx="1120" cy="480" r="52"/><text class="m" x="1120" y="488" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">TECH</text></g>
<g id="hold"><text class="d5" x="120" y="820" font-size="40">Each ring imperfect. Together, they hold.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start in the lab.</text>
<text class="b" x="120" y="176" font-size="32">The innermost ring: technical safety, built into the code.</text>
<g id="lab">
<circle class="ink" cx="180" cy="430" r="30"/><path class="ink" d="M135 560v-40a45 45 0 0 1 90 0v40z"/>
<rect class="s-ink" x="260" y="270" width="300" height="200" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M410 470v60M350 530h120M130 560h460" stroke-width="6" stroke-linecap="round"/>
<path class="s-line" d="M290 310h110M290 350h150M290 390h80M290 430h130" stroke-width="8" stroke-linecap="round"/>
</g>
<path id="shield" class="gain" d="M510 300l36 14v34c0 28-18 44-36 52-18-8-36-24-36-52v-34z"/>
<g id="safe"><text class="d5" x="120" y="650" font-size="36">Safety built in,</text><text class="d5" x="120" y="696" font-size="36">not an afterthought.</text></g>
<g id="bars">
<text class="m" x="680" y="260" font-size="20">SAFETY RESEARCH</text>
<path class="s-ink" d="M670 700h320" stroke-width="5"/>
<rect class="ink" x="690" y="660" width="110" height="40"/>
<text class="m" x="745" y="735" font-size="20" text-anchor="middle">TODAY</text>
<text class="m" x="915" y="735" font-size="20" text-anchor="middle" style="fill:var(--gain)">APOLLO-STYLE</text>
</g>
<rect id="bigbar" class="gain" x="860" y="700" width="110" height="0"/>
<g id="audit">
<text class="m" x="1080" y="300" font-size="22" style="fill:var(--gain)">AUDITS</text>
<text class="m" x="1080" y="336" font-size="20">OUTSIDERS CHECK WHAT</text>
<text class="m" x="1080" y="366" font-size="20">POWERFUL SYSTEMS CAN DO</text>
<rect class="s-ink" x="1100" y="420" width="360" height="240" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="cells"></g>
<text class="m" x="1280" y="700" font-size="20" text-anchor="middle">POWERFUL SYSTEM</text>
<g id="lens"><circle class="s-ink" r="56" fill="none" stroke-width="12"/><path class="s-ink" d="M40 40l50 50" stroke-width="16" stroke-linecap="round"/></g>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Squeeze the choke points.</text>
<text class="b" x="120" y="176" font-size="32">A few hard-to-make parts that a whole technology depends on.</text>
<g id="chip"><g id="pins"></g><rect class="ink" x="200" y="330" width="180" height="180" rx="14"/><rect x="240" y="370" width="100" height="100" rx="6" fill="var(--stage)"/><rect class="gain" x="265" y="395" width="50" height="50" rx="4"/>
<text class="m" x="290" y="600" font-size="20" text-anchor="middle">ADVANCED CHIPS</text></g>
<path id="ar1" class="s-muted" d="M420 420h110m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="fabs"></g>
<g id="fabT"><text class="m" x="740" y="600" font-size="20" text-anchor="middle">ONLY A HANDFUL CAN MAKE THEM</text></g>
<path id="ar2" class="s-muted" d="M1010 470h120m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="hg">
<polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/><path id="sandS" class="s-gain" stroke-width="4"/>
<path class="s-ink" d="M1200 300L1300 460L1200 620M1400 300L1300 460L1400 620" fill="none" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1180 300h240M1180 620h240" stroke-width="12" stroke-linecap="round"/>
<text class="m" x="1300" y="680" font-size="20" text-anchor="middle">CONTROL THE CHOKE POINT</text>
<text class="m" x="1300" y="712" font-size="20" text-anchor="middle" style="fill:var(--gain)">BUY PRECIOUS TIME</text>
</g>
<g id="exp"><text class="d5" x="120" y="800" font-size="36">Like US chip export limits on China.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build it, and build it right.</text>
<text class="b" x="120" y="176" font-size="32">Worried makers should build. Companies must balance profit and purpose.</text>
<path class="s-line" d="M120 700h580" stroke-width="5"/>
<g id="blk"></g><g id="bld"></g>
<g id="bcap"><text class="m" x="120" y="760" font-size="22">HELP BUILD IT, NOT JUST CRITICISE IT</text></g>
<g id="scale"><path class="s-ink" d="M1120 360V700M1030 700h180" stroke-width="8" stroke-linecap="round"/><line id="beam" class="s-ink" x1="960" y1="360" x2="1280" y2="360" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1120" cy="360" r="14"/></g>
<g id="bcap2"><text class="d5" x="120" y="830" font-size="36">Balance profit with purpose, not growth alone.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Laws, alliances and treaties.</text>
<text class="b" x="120" y="176" font-size="32">Governments must understand the tools. Nations must agree.</text>
<g id="cap"><path class="s-ink" d="M310 370v-40" stroke-width="5"/><path class="ink" d="M240 444a70 70 0 0 1 140 0z"/><path class="ink" d="M170 484L310 444L450 484z"/><path class="s-ink" d="M192 496v90M240 496v90M288 496v90M332 496v90M380 496v90M428 496v90" stroke-width="14"/><rect class="ink" x="166" y="590" width="288" height="24" rx="4"/>
<text class="m" x="310" y="680" font-size="20" text-anchor="middle">UNDERSTAND THE TOOLS,</text><text class="m" x="310" y="710" font-size="20" text-anchor="middle">BUILD SKILLS TO REGULATE</text></g>
<g id="ally"><text class="m" x="790" y="250" font-size="20" text-anchor="middle">THE WAVE CROSSES BORDERS</text><path class="s-muted" d="M790 280V640" stroke-width="4" stroke-dasharray="10 12"/><path class="s-ink" d="M620 600V320M960 600V320" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="626" y="322" width="84" height="56"/><rect class="ink" x="870" y="322" width="84" height="56" fill-opacity=".45"/><path id="wave5" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="790" y="680" font-size="20" text-anchor="middle">ALLIANCES &amp; TREATIES</text></g>
<g id="shake"><path class="s-gain" d="M626 570Q700 548 776 552" fill="none" stroke-width="16" stroke-linecap="round"/><path class="s-ink" d="M954 570Q880 548 804 552" fill="none" stroke-width="16" stroke-linecap="round"/><circle class="gain" cx="790" cy="552" r="20"/></g>
<g id="nuke"><path class="ink" d="M1280 300q30 30 30 80h-60q0-50 30-80z"/><rect class="ink" x="1250" y="380" width="60" height="190"/><path class="ink" d="M1250 510l-32 70h32zM1310 510l32 70h-32z"/>
<text class="m" x="1280" y="680" font-size="20" text-anchor="middle">NUCLEAR ARMS CONTROL</text><text class="m" x="1280" y="712" font-size="20" text-anchor="middle" style="fill:var(--gain)">RIVALS CAN AGREE TO LIMITS</text></g>
<g id="lock"><path class="s-gain" d="M1230 440h100M1230 530h100" stroke-width="12" stroke-linecap="round"/><path class="s-gain" d="M1264 470v-12a16 16 0 0 1 32 0v12" fill="none" stroke-width="7"/><rect class="gain" x="1254" y="468" width="52" height="40" rx="6"/></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Learn from every failure.</text>
<text class="b" x="120" y="176" font-size="32">Aviation studies what went wrong, and shares the lessons widely.</text>
<g id="plane"></g>
<g id="bbox"><rect class="gain" x="250" y="440" width="160" height="100" rx="10"/><text class="m" x="330" y="498" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">BLACK BOX</text><text class="m" x="330" y="580" font-size="20" text-anchor="middle">STUDY WHAT WENT WRONG</text></g>
<g id="share"><text class="m" x="350" y="790" font-size="20" text-anchor="middle">SHARED WIDELY</text></g>
<g id="chart"><path class="s-ink" d="M760 300V640H1100" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="776" y="316" font-size="18">SAFETY</text><text class="m" x="930" y="690" font-size="20" text-anchor="middle">FLYING GOT SAFER</text></g>
<path id="curve6" class="s-gain" d="M780 610C880 600 920 430 1090 330" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" opacity="0"/>
<g id="admit"><path class="s-muted" d="M1110 430h50m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="1180" y="300" width="280" height="240" rx="16" fill="var(--stage)" stroke-width="6"/><text class="d" x="1320" y="430" font-size="72" text-anchor="middle">&lt;/&gt;</text><text class="m" x="1320" y="500" font-size="20" text-anchor="middle">TECH BUILDERS</text><text class="m" x="1320" y="600" font-size="22" text-anchor="middle" style="fill:var(--gain)">ADMIT FAILURES</text><text class="m" x="1320" y="634" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE SAME WAY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">People power.</text>
<text class="b" x="120" y="176" font-size="32">Ordinary citizens demanding safer technology.</text>
<g id="crowd"></g>
<g id="ccap"><text class="m" x="380" y="760" font-size="20" text-anchor="middle">THE OUTERMOST RING</text></g>
<g id="stk"><text class="m" x="760" y="260" font-size="20">ALL THE RINGS, STACKED</text></g>
<g id="slabs"></g><g id="threats"></g>
<g id="miss"><text class="d5" x="120" y="830" font-size="36">Each layer catches what the others miss.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">Which ring could</text></g>
<g id="qb"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">you strengthen?</text></g>
<g id="qc"><text class="m" x="143" y="590" font-size="26">AT WORK · IN YOUR VOTE · IN A CONVERSATION</text></g>
<g id="qd"><text class="d5" x="140" y="700" font-size="44" style="fill:var(--gain)">Pick one, and start this week.</text></g>
<g id="qr"></g>
</g>