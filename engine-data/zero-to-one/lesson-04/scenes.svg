</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of business.</text>
<text class="b" x="120" y="176" font-size="32">Thiel sorts every business into one of two kinds.</text>
<g id="p0"><rect class="s-line" x="120" y="220" width="640" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><g id="crowd1"></g><g id="door0"></g></g>
