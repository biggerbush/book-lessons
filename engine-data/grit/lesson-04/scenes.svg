<path id="ndl" class="s-ink" d="M1270 410V340" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1270" cy="410" r="10"/>
<text class="m" x="1270" y="470" font-size="22" text-anchor="middle">A SCORE</text></g>
<g id="mk"><rect class="s-line" x="120" y="560" width="800" height="240" rx="14" fill="var(--stage)" stroke-width="3"/>
