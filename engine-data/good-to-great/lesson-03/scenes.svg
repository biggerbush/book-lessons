<g id="s0">
<text class="m" x="120" y="150" font-size="28">GOOD TO GREAT · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">First who,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">then what.</text>
<text class="b" x="120" y="600" font-size="32">Choose the right people before you choose the direction.</text>
<path class="s-line" d="M1070 520H1480" stroke-width="5" stroke-linecap="round"/>
<g id="tsign"><rect class="gain" x="1120" y="226" width="320" height="64" rx="12"/><text class="m" x="1280" y="267" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WHO FIRST, THEN WHAT</text></g>
<g id="tbus"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bus comes first.</text>
<text class="b" x="120" y="176" font-size="32">Get the right people on, then choose the route.</text>
<path class="s-line" d="M160 696H1480" stroke-width="5" stroke-linecap="round"/>
<g id="bsign"><path class="s-ink" d="M1400 300V696" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M1250 236H1440L1470 268L1440 300H1250Z"/><text class="m" x="1350" y="276" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">THEN: ROUTE</text></g>
<g id="bbus"></g>
<g id="byou"><text class="m" x="1092" y="284" font-size="20" text-anchor="middle">YOU DRIVE</text></g>
<g id="blab"><text class="m" x="408" y="760" font-size="20" style="fill:var(--gain)">RIGHT PEOPLE IN THE SEATS</text></g>
<g id="olab"><text class="m" x="1210" y="740" font-size="20" text-anchor="middle" style="fill:var(--loss)">OFF THE BUS</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">People outlast plans.</text>
<text class="b" x="120" y="176" font-size="32">The road may change. The right people adapt.</text>
<path class="s-ink" d="M140 470H620" stroke-width="14" stroke-linecap="round"/>
<path class="s-line" d="M620 470H1060" stroke-width="14" stroke-linecap="round"/>
<g id="block"><path class="s-loss" d="M1050 440l60 60M1110 440l-60 60" stroke-width="10" stroke-linecap="round"/><text class="m" x="840" y="520" font-size="20" text-anchor="middle">PLANNED ROAD CLOSES</text></g>
<g id="nroad"><path id="newR" class="s-gain" d="M620 470C760 470 760 300 900 300H1440" fill="none" stroke-width="14" stroke-linecap="round"/><text class="m" x="1360" y="346" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEW ROAD</text></g>
<g id="rbus"></g>
<g id="pA"><rect class="s-line" x="120" y="560" width="640" height="260" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="604" font-size="20">JOINED FOR THE DESTINATION</text><g id="pAf"></g><text class="d5" x="150" y="792" font-size="32">They balk at every turn.</text></g>
<g id="pB"><rect class="s-line" x="840" y="560" width="640" height="260" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="604" font-size="20">JOINED FOR WHO ELSE IS ABOARD</text><g id="pBf"></g><path class="s-gain" d="M1360 760V640m-24 24 24-24 24 24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="870" y="792" font-size="32">They adapt and self-start.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wells Fargo bet on people.</text>
<text class="b" x="120" y="176" font-size="32">1970s: Dick Cooley sensed banking was about to change.</text>
<g id="wbank"><path class="ink" d="M140 330L310 250L480 330Z"/><rect class="ink" x="175" y="345" width="30" height="240"/><rect class="ink" x="255" y="345" width="30" height="240"/><rect class="ink" x="335" y="345" width="30" height="240"/><rect class="ink" x="415" y="345" width="30" height="240"/><rect class="ink" x="140" y="590" width="340" height="24"/><text class="m" x="310" y="660" font-size="20" text-anchor="middle">WELLS FARGO</text></g>
<g id="wball"><circle class="s-ink" cx="720" cy="420" r="110" fill="var(--stage)" stroke-width="7"/><path id="swirl" class="s-muted" d="M650 420a70 40 0 0 1 140 0M680 465a40 20 0 0 0 80 0" fill="none" stroke-width="4" stroke-linecap="round"/><text class="d" x="720" y="462" font-size="120" text-anchor="middle" style="fill:var(--loss)">?</text><path class="ink" d="M640 540H800L780 580H660Z"/><text class="m" x="720" y="630" font-size="20" text-anchor="middle">HOW? UNKNOWN</text></g>
<g id="wph"><text class="m" x="940" y="290" font-size="20">HIRE GREAT PEOPLE WHEN YOU FIND THEM</text></g>
<g id="wfig"></g>
<g id="wnote"><text class="d5" x="120" y="790" font-size="40">Often without a specific job in mind.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then the storm hit.</text>
<text class="b" x="120" y="176" font-size="32">Banking deregulation arrived in the 1980s.</text>
<g id="scloud"><circle class="loss" cx="300" cy="320" r="60"/><circle class="loss" cx="390" cy="290" r="75"/><circle class="loss" cx="480" cy="320" r="60"/><rect class="loss" x="240" y="320" width="300" height="50" rx="25"/><path class="ink" d="M385 380L360 430H380L362 470L410 415H390L405 380Z"/><g id="rain"></g><g id="sbanks"></g><text class="m" x="120" y="610" font-size="20">MANY BANKS STRUGGLED</text></g>
<g id="steam"><g id="steamf"></g><rect class="ink" x="140" y="756" width="600" height="14" rx="4"/><text class="m" x="120" y="812" font-size="20" style="fill:var(--gain)">WELLS FARGO: A DEEP BENCH</text></g>
<g id="schart"><path class="s-ink" d="M860 260V760H1460" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path id="lb" class="s-loss" d="M860 700C1000 690 1200 640 1440 600" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="lw" class="s-gain" d="M860 700C1000 680 1100 520 1440 320" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="clab"><text class="m" x="1440" y="296" font-size="20" text-anchor="end" style="fill:var(--gain)">WELLS FARGO</text><text class="m" x="1440" y="576" font-size="20" text-anchor="end" style="fill:var(--loss)">BANK OF AMERICA</text></g>
<text class="m" x="860" y="800" font-size="18">ADAPTING TO CHANGE · SCHEMATIC</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rigorous, not ruthless.</text>
<text class="b" x="120" y="176" font-size="32">High standards for every seat, applied fairly.</text>
<g id="sc"><path class="s-ink" d="M410 300V640M320 640H500" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M230 300H590" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M230 300L180 420M230 300L280 420M590 300L540 420M590 300L640 420" stroke-width="3"/>
<path class="loss" d="M170 420H290A60 34 0 0 1 170 420Z"/><path class="gain" d="M530 420H650A60 34 0 0 1 530 420Z"/>
<text class="m" x="230" y="494" font-size="22" text-anchor="middle" style="fill:var(--loss)">RUTHLESS</text><text class="m" x="590" y="494" font-size="22" text-anchor="middle" style="fill:var(--gain)">RIGOROUS</text>
<path id="rstrike" class="s-ink" d="M170 486H290" stroke-width="5" stroke-linecap="round"/></g>
<circle class="ink" cx="410" cy="300" r="12"/>
<text class="m" x="410" y="700" font-size="20" text-anchor="middle">NOT FIRING PEOPLE CASUALLY</text></g>
<g id="hbl"><text class="m" x="800" y="360" font-size="20" style="fill:var(--gain)">HIGH BAR FOR EVERY SEAT</text></g>
<line id="hbar" class="s-gain" x1="800" y1="390" x2="800" y2="390" stroke-width="8" stroke-linecap="round"/>
<g id="seatf"></g>
<g id="marks"></g>
<g id="ttf"><text class="m" x="860" y="644" font-size="20" text-anchor="middle" style="fill:var(--gain)">TOP TEAM FIRST</text></g>
<g id="cc"><text class="d" x="120" y="790" font-size="44">Don’t let a poor fit linger for years.</text><text class="m" x="120" y="840" font-size="22" style="fill:var(--loss)">UNFAIR TO EVERYONE INVOLVED</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hire with care.</text>
<text class="b" x="120" y="176" font-size="32">Practical rules from the book.</text>
<g id="hbook"><rect class="ink" x="140" y="330" width="160" height="210" rx="10"/><rect class="gain" x="140" y="330" width="26" height="210"/><path d="M190 380H280M190 410H260" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/><text class="m" x="232" y="500" font-size="20" text-anchor="middle" style="fill:var(--stage)">RULES</text></g>
<g id="h1"><rect class="s-line" x="400" y="240" width="520" height="580" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="430" y="290" font-size="22">RULE 1</text><g id="cands"></g>
<g id="lens"><circle class="s-ink" cx="0" cy="0" r="54" fill="none" stroke-width="10"/><path class="s-ink" d="M38 38L80 80" stroke-width="18" stroke-linecap="round"/></g>
<text class="d5" x="430" y="650" font-size="40">When in doubt,</text><text class="d5" x="430" y="700" font-size="40">don’t hire.</text>
<g id="keep"><text class="m" x="430" y="770" font-size="20" style="fill:var(--gain)">KEEP LOOKING FOR THE RIGHT PERSON</text></g></g>
<g id="h2"><rect class="s-line" x="960" y="240" width="520" height="580" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="990" y="290" font-size="22">RULE 2</text>
<circle class="s-ink" cx="1220" cy="450" r="110" fill="var(--stage)" stroke-width="10"/><g id="ticks"></g>
<path id="hm" class="s-loss" d="M1220 450V362" stroke-width="8" stroke-linecap="round"/><path id="hh" class="s-ink" d="M1220 450V392" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="1220" cy="450" r="10"/>
<text class="d5" x="990" y="650" font-size="40">Act now. Don’t wait</text><text class="d5" x="990" y="700" font-size="40">and hope.</text>
<text class="m" x="990" y="770" font-size="20">WHEN A PEOPLE CHANGE IS NEEDED</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="60">Best people, biggest opportunities.</text>
<text class="b" x="120" y="176" font-size="32">Not your biggest problems.</text>
<path class="ink" d="M770 210H830L850 240H750Z"/>
<polygon id="cone" class="gain" points="760,240 840,240 940,420 660,420" fill-opacity=".22"/>
<g id="stars"></g>
<path id="aP" class="s-muted" d="M690 420C600 470 450 480 400 556" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="aO"><path class="s-gain" d="M910 420C1010 470 1070 560 1086 764" fill="none" stroke-width="7" stroke-linecap="round"/><circle class="gain" cx="1086" cy="770" r="10"/></g>
<g id="pbox"><rect class="loss" x="160" y="560" width="360" height="200" rx="14" fill-opacity=".15"/><rect class="s-loss" x="160" y="560" width="360" height="200" rx="14" fill="none" stroke-width="5"/><text class="m" x="340" y="668" font-size="20" text-anchor="middle">BIGGEST PROBLEMS</text><text class="d" x="340" y="836" font-size="56" text-anchor="middle" style="fill:var(--muted)">Good.</text></g>
<path id="trail" class="s-gain" fill="none" stroke-width="6" stroke-dasharray="4 12" stroke-linecap="round"/>
<path class="s-line" d="M1080 770H1280" stroke-width="6" stroke-linecap="round"/>
<g id="rkt"><path id="flame" class="loss"/><path class="ink" d="M-22 20L-46 60H-20ZM22 20L46 60H20Z"/><path class="gain" d="M0-70C30-40 32 20 22 50H-22C-32 20-30-40 0-70Z"/><circle class="s-ink" cx="0" cy="-20" r="10" fill="var(--stage)" stroke-width="4"/></g>
<g id="olabel"><text class="m" x="1180" y="812" font-size="20" text-anchor="middle" style="fill:var(--gain)">BIGGEST OPPORTUNITIES</text></g>
<g id="great"><text class="d" x="1290" y="400" font-size="56" style="fill:var(--gain)">Great.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">If you were hiring today,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">would you hire each</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">person again?</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">LOOK AT YOUR TEAM</text><g id="ebus"></g></g>
<g id="echk"></g>
</g>