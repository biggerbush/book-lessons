<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Stop living</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">for the future.</text>
<text class="b" x="120" y="600" font-size="32">Why life keeps waiting, and how to start living it now</text>
