<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 7 HABITS OF HIGHLY EFFECTIVE PEOPLE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Change the lens,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">change the life.</text>
<text class="b" x="120" y="600" font-size="32">Why lasting change starts with how you see things.</text>
<g id="specs">
<circle cx="1210" cy="400" r="80" fill="var(--loss)" fill-opacity=".15"/>
