<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The incentive engine.</text>
<text class="b" x="120" y="176" font-size="32">Human motivations push technology forward.</text>
<g id="lab1"><text class="m" x="120" y="260" font-size="22">ENGINE OF HUMAN MOTIVATION</text></g>
