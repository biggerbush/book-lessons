<rect x="822" y="600" width="656" height="150" fill="var(--loss)" fill-opacity=".14"/>
<text class="m" x="850" y="280" font-size="24" style="fill:var(--loss)">WARTIME</text>
<text class="m" x="850" y="320" font-size="20">A THREAT THAT COULD KILL IT</text>
<circle class="ink" cx="1160" cy="410" r="36"/><circle class="ink" cx="1220" cy="395" r="46"/><circle class="ink" cx="1280" cy="412" r="34"/>
