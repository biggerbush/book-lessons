<circle class="gain" cx="1360" cy="330" r="70"/>
<circle cx="1335" cy="310" r="14" fill="var(--on-gain)" fill-opacity=".2"/><circle cx="1385" cy="355" r="10" fill="var(--on-gain)" fill-opacity=".2"/>
<circle class="s-ink" cx="930" cy="640" r="48" fill="var(--ice)" stroke-width="5"/>
<path id="rt" pathLength="1" class="s-gain" d="M960 600C1020 420 1180 300 1290 330" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="rt2" pathLength="1" class="s-gain" d="M1320 400C1240 560 1080 660 980 650" fill="none" stroke-width="6" stroke-linecap="round"/>
