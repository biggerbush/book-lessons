<text class="d5" x="950" y="598" font-size="36">Designing a plan</text></g>
<g id="mn7"><text class="d" x="120" y="790" font-size="40">Meaning comes from how deeply you work,</text><text class="d" x="120" y="842" font-size="40" style="fill:var(--gain)">not from what the work is.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Tomorrow, pick one task</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">and treat it the way</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">a <tspan style="fill:var(--gain)">craftsman</tspan> would.</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">GIVE IT YOUR FULL ATTENTION. NOTICE HOW THE DAY FEELS.</text></g>
<g id="qg"></g>
</g>