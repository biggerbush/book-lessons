<text class="d" x="170" y="320" font-size="52">“First, arouse in the other person</text>
<text class="d" x="170" y="390" font-size="52">an <tspan style="fill:var(--gain)">eager want</tspan>.”</text>
<text class="m" x="1440" y="420" font-size="20" text-anchor="end">HARRY OVERSTREET</text>
</g>
<g id="cw0"><circle class="gain" cx="380" cy="650" r="120"/><text class="d" x="380" y="640" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">What they</text><text class="d" x="380" y="685" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">already want</text></g>
