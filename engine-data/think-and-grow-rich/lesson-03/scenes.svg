<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Faith and autosuggestion</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">reprogram your mind.</text>
<text class="b" x="120" y="600" font-size="32">Plant a belief on purpose, and let it drive you.</text>
<path class="s-ink" d="M1040 800H1470" stroke-width="6" stroke-linecap="round"/>
<g id="pl0"></g><g id="pl2"></g><g id="pl1"></g>
<circle id="seed0" class="gain" cx="1240" cy="640" r="10" opacity="0"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Faith is the head chemist.</text>
<text class="b" x="120" y="176" font-size="32">Belief turns a plain wish into a force that drives you.</text>
<g id="flask">
<path class="s-ink" d="M370 300V420L240 610Q228 640 260 640H540Q572 640 560 610L430 420V300" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
