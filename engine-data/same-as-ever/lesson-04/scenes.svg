<text class="m" x="120" y="740" font-size="22">AROUND THE FIRE: STORIES, NOT TABLES</text>
</g>
<g id="tokS"><rect class="gain" x="-70" y="-28" width="140" height="56" rx="12"/><text class="m" x="0" y="8" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">STORY</text></g>
<g id="tokF"><rect class="loss" x="-70" y="-28" width="140" height="56" rx="12"/><text class="m" x="0" y="8" font-size="22" text-anchor="middle" style="fill:var(--stage)">FACT</text></g>
<g id="wired"><text class="d" x="120" y="830" font-size="48">Not a flaw to fix. It’s how we’re wired.</text></g>
</g>

<g id="s3" opacity="0">
