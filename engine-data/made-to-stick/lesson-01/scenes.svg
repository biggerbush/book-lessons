<g id="s0">
<text class="m" x="120" y="150" font-size="28">MADE TO STICK · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Curse</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Knowledge.</text>
<text class="b" x="120" y="600" font-size="32">Why knowing too much makes you explain things badly.</text>
<g id="t0n"></g>
<g id="t0g"></g>
<g id="t0q"><text class="d" x="1390" y="410" font-size="80" text-anchor="middle" style="fill:var(--loss)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A simple game.</text>
<g id="s1sub"><text class="b" x="120" y="176" font-size="32">Elizabeth Newton, Stanford graduate student, 1990.</text></g>
<g id="s1p">
<rect class="s-line" x="120" y="240" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="240" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="22">TAPPER</text>
<text class="m" x="870" y="290" font-size="22">LISTENER</text>
</g>
<g id="s1a"></g>
<g id="s1b"></g>
<g id="s1song">
<rect class="gain" x="420" y="330" width="300" height="70" rx="35"/>
<text class="m" x="570" y="374" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">HAPPY BIRTHDAY</text>
<text class="d5" x="150" y="710" font-size="34">Knocks out the rhythm.</text>
</g>
<g id="s1k"></g>
<g id="s1q">
<rect class="s-loss" x="1240" y="280" width="200" height="100" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-loss" d="M1260 380l-30 34 60-34" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d" x="1340" y="354" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="d5" x="870" y="710" font-size="34">Names the song.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Expectation vs. reality.</text>
<text class="b" x="120" y="176" font-size="32">How often listeners named the song.</text>
<rect id="s2bp" class="s-ink" x="300" y="740" width="220" height="0" fill="var(--stage)" stroke-width="5"/>
<rect id="s2ba" class="loss" x="640" y="740" width="220" height="0"/>
<path class="s-ink" d="M260 740H900" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="410" y="780" font-size="22" text-anchor="middle">PREDICTED</text>
<text class="m" x="750" y="780" font-size="22" text-anchor="middle">ACTUAL</text>
<g id="s2pl"><text class="m" x="410" y="470" font-size="24" text-anchor="middle">ABOUT HALF</text></g>
<g id="s2al"><text class="d" x="750" y="705" font-size="44" text-anchor="middle" style="fill:var(--loss)">2.5 of 120</text></g>
<g id="s2r1"><text class="m" x="980" y="320" font-size="22">ROUGHLY</text><text class="d" x="980" y="420" font-size="96" style="fill:var(--loss)">1 in 40</text></g>
<g id="s2gap">
<path class="s-muted" d="M520 490H900M860 730H900" stroke-width="3" stroke-dasharray="6 8"/>
<path class="s-gain" d="M900 500V722M884 518l16-18 16 18M884 704l16 18 16-18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text id="s2x" class="d" x="980" y="640" font-size="140" style="fill:var(--gain)">20×</text>
<text class="m" x="980" y="690" font-size="20">MORE SUCCESS EXPECTED THAN REAL</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The melody is only in your head.</text>
<g id="s3a"><text class="m" x="380" y="785" font-size="20" text-anchor="middle">TAPPER HEARS A MELODY</text></g>
<g id="s3dots"></g>
<g id="s3b"><text class="m" x="1220" y="785" font-size="20" text-anchor="middle">LISTENER HEARS KNOCKS</text></g>
<g id="s3c">
<text class="d" x="462" y="600" font-size="80" style="fill:var(--loss)">?!</text>
<text class="d" x="120" y="845" font-size="44">“How could anyone miss this tune?”</text>
</g>
</g>

<g id="s4" opacity="0">
<g id="s4h">
<text class="d" x="120" y="124" font-size="68">The Curse of Knowledge.</text>
<text class="b" x="120" y="176" font-size="32">Named by Chip and Dan Heath.</text>
</g>
<g id="s4r">
<rect class="s-muted" x="160" y="260" width="520" height="380" rx="18" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="190" y="310" font-size="22">NOT KNOWING</text>
<g id="s4g"></g>
<rect class="s-ink" x="920" y="260" width="520" height="380" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="950" y="310" font-size="22" style="fill:var(--gain)">KNOWING</text>
<g id="s4k"></g>
</g>
<g id="s4f"><path class="s-gain" d="M700 400H896M876 382l20 18-20 18" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="s4l">
<path class="s-loss" d="M900 530H704M724 512l-20 18 20 18" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M786 520v-12a14 14 0 0 1 28 0v12" fill="none" stroke-width="6"/>
<rect class="loss" x="774" y="518" width="52" height="42" rx="6"/>
</g>
<g id="s4cap"><text class="d" x="120" y="740" font-size="44">Once you know it, you can’t un-know it.</text></g>
<g id="s4m"><text class="m" x="120" y="800" font-size="22">WE CAN NO LONGER RECREATE THE LISTENER’S STATE OF MIND</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same curse, every expert.</text>
<g id="s5c"></g>
<g id="s5a"><text class="d5" x="470" y="400" font-size="34">“Maximize shareholder value.”</text></g>
<g id="s5s"></g>
<g id="s5q"></g>
<g id="s5j"></g>
<g id="s5cap"><text class="d" x="120" y="840" font-size="36">Abstract expert language: knocks without the tune.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two ways to beat the curse.</text>
<g id="s6d0"><rect class="s-ink" x="160" y="220" width="150" height="250" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="290" cy="350" r="7"/></g>
<g id="s6x">
<path class="s-loss" d="M150 210L320 480M320 210L150 480" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="340" y="320" font-size="34">Never learn anything.</text>
<text class="m" x="340" y="365" font-size="22" style="fill:var(--loss)">HELPS NOBODY</text>
</g>
<g id="s6d1"><rect class="s-ink" x="820" y="220" width="150" height="250" fill="var(--stage)" stroke-width="6"/></g>
<g id="s6o">
<path class="gain" d="M820 220L900 250V500L820 470z"/>
<text class="d5" x="1010" y="320" font-size="34">Transform your ideas</text>
<text class="d5" x="1010" y="365" font-size="34">so outsiders grasp them.</text>
</g>
<g id="s6t"></g>
<g id="s6s"><text class="d" x="1330" y="660" font-size="64" style="fill:var(--gain)">s</text></g>
<g id="s6cap"><text class="d" x="120" y="810" font-size="40">Six principles that make ideas stick.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hear the knocks.</text>
<text class="b" x="120" y="176" font-size="32">Catch the curse before it reaches your listener.</text>
<g id="s7c0">
<rect class="s-line" x="120" y="230" width="440" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">1 · CATCH YOURSELF</text>
<ellipse class="s-ink" cx="340" cy="430" rx="90" ry="115" fill="var(--stage)" stroke-width="6"/>
<path class="s-gain" d="M340 545v40M300 585h80" stroke-width="7" stroke-linecap="round"/>
<g id="s7me"></g>
<text class="d5" x="150" y="650" font-size="34">Pause mid-tap.</text>
</g>
<g id="s7c1">
<rect class="s-line" x="580" y="230" width="440" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="610" y="280" font-size="22">2 · ASK WHAT THEY HEAR</text>
<g id="s7n"></g>
<path class="s-loss" d="M700 380L790 470" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="830" cy="440" r="9"/><circle class="ink" cx="860" cy="440" r="9"/><circle class="ink" cx="905" cy="440" r="9"/><circle class="ink" cx="935" cy="440" r="9"/>
<text class="d5" x="610" y="650" font-size="34">Knocks, not music.</text>
</g>
<g id="s7c2">
<rect class="s-line" x="1040" y="230" width="440" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1070" y="280" font-size="22">3 · TEST ON SOMEONE NEW</text>
<circle class="s-ink" cx="1260" cy="430" r="100" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="1225" cy="410" r="10"/><circle class="ink" cx="1295" cy="410" r="10"/>
<path id="s7m" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="d5" x="1070" y="650" font-size="34">Watch their face.</text>
</g>
<g id="s7cap"><text class="d" x="120" y="800" font-size="40">Hear what they hear, not the music in your head.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">One idea you explained</text></g>
<g id="qb"><text class="d" x="136" y="395" font-size="80" letter-spacing="-2">this week fell flat.</text></g>
<g id="qc"><text class="d" x="136" y="530" font-size="80" letter-spacing="-2" style="fill:var(--gain)">Were you hearing a melody</text></g>
<g id="qd"><text class="d" x="136" y="625" font-size="80" letter-spacing="-2">your listener never heard?</text></g>
<g id="s8g"><text class="m" x="143" y="770" font-size="24">HEAR THE KNOCKS, NOT THE MELODY</text><g id="s8n"></g>
<circle class="ink" cx="1200" cy="760" r="10"/><circle class="ink" cx="1240" cy="760" r="10"/><circle class="ink" cx="1300" cy="760" r="10"/></g>
</g>