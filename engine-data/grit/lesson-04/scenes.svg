<circle cx="270" cy="560" r="34" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/>
<circle cx="470" cy="560" r="34" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/>
<text class="m" x="120" y="690" font-size="20">EVERY DAY, FOR YEARS</text>
</g>
