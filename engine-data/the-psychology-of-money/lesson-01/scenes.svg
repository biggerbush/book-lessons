<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">No one is crazy</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">about money.</text>
<text class="b" x="120" y="600" font-size="32">Why everyone’s money choices make sense to them.</text>
<g id="coins"></g>
<g id="wallet"><rect class="s-ink" x="1120" y="420" width="320" height="210" rx="26" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1440 490h-90a35 35 0 0 0 0 70h90" fill="var(--stage)" stroke-width="8"/><circle class="gain" cx="1360" cy="525" r="12"/></g>
