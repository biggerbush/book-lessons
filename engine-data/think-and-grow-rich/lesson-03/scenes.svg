<g id="lpP"></g><g id="chips2"></g>
</g>
<g id="nz"><text class="d5" x="120" y="820" font-size="40">Replace the noise with a message you chose.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Words need feeling.</text>
<text class="b" x="120" y="176" font-size="32">Read your goal as if your life depended on it.</text>
