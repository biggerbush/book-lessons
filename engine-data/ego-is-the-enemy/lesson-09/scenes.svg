<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 9</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Alive time,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not dead time.</text>
<text class="b" x="120" y="600" font-size="32">Every setback leaves you time. Waste it, or grow with it.</text>
<g id="sw">
<rect class="ink" x="1222" y="250" width="56" height="26" rx="6"/>
<rect class="ink" x="1240" y="274" width="20" height="18"/>
<circle cx="1250" cy="430" r="140" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/>
<path id="swArc" class="gain" fill-opacity=".35"/>
<path id="swHand" d="M1250 430V320" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1250" cy="430" r="12"/>
</g>
<g id="s0b"><text class="m" x="1250" y="650" font-size="22" text-anchor="middle">WHO WILL YOU BECOME?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stuck in the waiting room.</text>
<text class="b" x="120" y="176" font-size="32">Failure parks us somewhere we did not choose.</text>
<g id="room">
<path class="s-ink" d="M160 720H1440" stroke-width="6" stroke-linecap="round"/>
<g id="chairs"></g>
<g id="wc"></g>
</g>
<g id="door">
<rect x="1180" y="340" width="200" height="380" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<g id="lock"><path d="M1325 520v-18a15 15 0 0 1 30 0v18" fill="none" stroke="var(--loss)" stroke-width="6"/><rect class="loss" x="1318" y="518" width="44" height="36" rx="6"/></g>
</g>
<g id="noex"><text class="m" x="1280" y="318" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO WAY OUT, NO FAST-FORWARD</text></g>
<g id="runL"><text class="m" x="760" y="450" font-size="20" text-anchor="middle">THE CLOCK KEEPS RUNNING</text></g>
<g id="tags"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of time.</text>
<g id="rg"><text class="b" x="120" y="176" font-size="32">An idea Holiday borrows from the author Robert Greene.</text></g>
<g id="dead"><g id="dc"></g>
<text class="d" x="440" y="670" font-size="56" text-anchor="middle" style="fill:var(--muted)">Dead time</text>
<text class="m" x="440" y="720" font-size="22" text-anchor="middle">SIT · WAIT · LET IT HAPPEN</text></g>
<g id="alive"><g id="ac"></g>
<text class="d" x="1160" y="670" font-size="56" text-anchor="middle" style="fill:var(--gain)">Alive time</text>
<text class="m" x="1160" y="720" font-size="22" text-anchor="middle">LEARN · ACT · GROW</text></g>
<g id="eq"><text class="d" x="800" y="470" font-size="120" text-anchor="middle" style="fill:var(--muted)">=</text></g>
<g id="same"><text class="d" x="800" y="820" font-size="44" text-anchor="middle">Same hours. Only the choice differs.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ego picks dead time.</text>
<text class="b" x="120" y="176" font-size="32">A setback feels like a personal insult.</text>
<g id="face">
<circle cx="360" cy="450" r="140" fill="var(--stage)" stroke="var(--loss)" stroke-width="8"/>
<circle class="ink" cx="310" cy="432" r="12"/><circle class="ink" cx="410" cy="432" r="12"/>
<path d="M280 392L335 408M440 392L385 408M300 530Q360 490 420 530" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="blame"></g>
<g id="months"></g>
<g id="moL"><text class="m" x="120" y="800" font-size="22" style="fill:var(--loss)">MONTHS WE NEVER GET BACK</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A cell becomes a classroom.</text>
<text class="b" x="120" y="176" font-size="32">Malcolm X, sent to prison for burglary as a young man.</text>
<rect x="400" y="240" width="800" height="540" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<g id="clsrm"><g id="shelf"></g></g>
<g id="mx">
<g id="mxf"></g>
<path d="M779 598a9 9 0 1 0 0.1 0M803 598a9 9 0 1 0 0.1 0M788 598h6" fill="none" stroke="var(--stage)" stroke-width="3"/>
</g>
<g id="hb"><rect class="gain" x="764" y="664" width="72" height="48" rx="4"/><path d="M800 664v48" stroke="var(--stage)" stroke-width="4"/></g>
<g id="bars" stroke="var(--ink)"></g>
<g id="cntL"><text class="m" x="120" y="380" font-size="20" style="fill:var(--muted)">COUNTING THE DAYS</text></g>
<g id="tally"></g>
<g id="clsL"><text class="m" x="1220" y="380" font-size="20" style="fill:var(--gain)">A CLASSROOM</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Page after page.</text>
<text class="b" x="120" y="176" font-size="32">He copied out a dictionary by hand, then read constantly.</text>
<g id="dict">
<rect x="120" y="260" width="260" height="340" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<rect x="380" y="260" width="260" height="340" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<g id="dl"></g>
<g id="pen"><path class="ink" d="M0 0l6-20l64-64l14 14l-64 64z"/></g>
<text class="m" x="120" y="650" font-size="20">COPYING THE DICTIONARY</text>
</g>
<g id="stack"><text class="m" x="900" y="650" font-size="20" text-anchor="middle">THE PRISON LIBRARY</text></g>
<g id="voice"><g id="vf"></g><g id="va"></g>
<text class="m" x="1300" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">A MIND AND A VOICE</text></g>
<g id="wbw"><text class="d" x="120" y="790" font-size="44">Word by word, a new mind and voice.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What can this time teach me?</text>
<text class="b" x="120" y="176" font-size="32">Your situation may differ. The question is the same.</text>
<g id="box">
<rect x="180" y="460" width="240" height="180" fill="var(--stage)" stroke="var(--loss)" stroke-width="7"/>
<path d="M180 460l-30-50M420 460l30-50" stroke="var(--loss)" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="300" y="690" font-size="20" text-anchor="middle">YOUR SETBACK</text>
</g>
<g id="qm"><text class="d" x="560" y="650" font-size="240" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="nb">
<rect x="700" y="260" width="480" height="440" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<g id="rings"></g>
<text class="m" x="730" y="330" font-size="20">THIS TIME CAN TEACH ME</text>
<g id="items"></g>
</g>
<g id="seed">
<path class="ink" d="M1220 700q110-60 220 0z"/>
<path id="stem" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/>
<path id="lf1" class="gain" d="M1330 580q-70-10-90-60q60 0 90 60z"/>
<path id="lf2" class="gain" d="M1330 530q70-10 90-60q-60 0-90 60z"/>
<text class="m" x="1330" y="760" font-size="20" text-anchor="middle">PLANT, DON’T WAIT</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Control the use, not the event.</text>
<text class="b" x="120" y="176" font-size="32">We rarely control events. We always control the time they leave.</text>
<g id="pl">
<rect x="120" y="210" width="640" height="340" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="m" x="150" y="256" font-size="20">WHAT HAPPENS TO US</text>
<g id="cloud"><circle class="loss" cx="400" cy="330" r="40"/><circle class="loss" cx="452" cy="308" r="50"/><circle class="loss" cx="502" cy="334" r="38"/><rect class="loss" x="400" y="320" width="102" height="52"/>
<path d="M455 380l-18 30h24l-16 30" fill="none" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/></g>
<text class="m" x="440" y="510" font-size="20" text-anchor="middle" style="fill:var(--loss)">RARELY IN OUR CONTROL</text>
</g>
<g id="pr">
<rect x="840" y="210" width="640" height="340" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="m" x="870" y="256" font-size="20" style="fill:var(--gain)">HOW WE USE THE TIME</text>
<path d="M1120 300h80l-80 140h80z" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linejoin="round"/>
<path class="gain" d="M1134 316h52l-26 46z"/><path class="gain" d="M1160 412l20 22h-40z"/>
<text class="m" x="1160" y="510" font-size="20" text-anchor="middle" style="fill:var(--gain)">ALWAYS IN OUR CONTROL</text>
</g>
<g id="stu">
<text class="m" x="120" y="610" font-size="20" style="fill:var(--gain)">HUMILITY · A STUDENT OF SETBACKS</text>
<g id="sf"></g>
<rect class="ink" x="255" y="792" width="90" height="12"/>
<rect class="ink" x="360" y="760" width="300" height="12"/>
<path d="M380 772V840M640 772V840M300 804V840" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
<path d="M440 756l60-14l60 14" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linejoin="round"/>
</g>
<g id="ego">
<text class="m" x="840" y="610" font-size="20" style="fill:var(--loss)">EGO · JUST WANTS THE WAITING TO END</text>
<g id="ef"></g>
<path id="stare" d="M995 676L1228 712" stroke="var(--loss)" stroke-width="3" stroke-dasharray="8 8"/>
<g id="ec"></g>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="78" letter-spacing="-2">Where are you stuck waiting?</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="78" letter-spacing="-2">What could you learn this week</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="78" letter-spacing="-2">to make it <tspan style="fill:var(--gain)">alive time</tspan>?</text></g>
<g id="fl"><text class="m" x="143" y="700" font-size="26">TURN DEAD TIME INTO ALIVE TIME</text><g id="fc"></g></g>
</g>