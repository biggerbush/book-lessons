<path class="ink" d="M1280 640h140l-20 90h-100z"/>
<path id="stem" class="s-gain" d="M1350 640C1350 570 1340 500 1350 420" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="lv0"><path class="gain" d="M1348 530c-50-10-70-50-60-70 40 0 60 30 60 70z"/></g>
<g id="lv1"><path class="gain" d="M1352 470c50-10 70-50 60-70-40 0-60 30-60 70z"/></g>
