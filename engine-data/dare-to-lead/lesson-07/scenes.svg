<circle cx="440" cy="292" r="15" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<circle cx="490" cy="266" r="20" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<rect x="520" y="230" width="940" height="300" rx="100" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="600" y="310" font-size="20" style="fill:var(--loss)">THE STORY SHE TOLD HERSELF</text>
</g>
<g id="story">
<text class="d5" x="600" y="390" font-size="40">“He’s looking at me in my swimsuit</text>
<text class="d5" x="600" y="450" font-size="40">and feeling let down.”</text>
</g>
<g id="pz">
<path class="ink" d="M620 620h200v45a25 25 0 0 0 0 50v45h-200z"/>
<g id="pzR"><path class="gain" d="M840 620h200v140h-200v-45a25 25 0 0 1 0-50z"/></g>
</g>
