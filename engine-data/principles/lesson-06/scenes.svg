<rect class="ink" x="320" y="514" width="80" height="10" rx="4"/>
<text class="m" x="360" y="610" font-size="22" text-anchor="middle">ONE PERSON,</text>
<text class="m" x="360" y="642" font-size="22" text-anchor="middle">ONE VOTE</text>
</g>
<g id="ign">
<text class="m" x="480" y="250" font-size="24" text-anchor="middle" style="fill:var(--gain)">KNOWS</text>
<text class="m" x="120" y="790" font-size="22" style="fill:var(--loss)">IGNORES WHO ACTUALLY KNOWS</text>
</g>
