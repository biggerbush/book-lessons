<g id="fzt"><text class="d" x="120" y="820" font-size="44">Fix everything at once, and the team stalls.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Relax. Look around. Make a call.</text>
<text class="b" x="120" y="176" font-size="32">A saying combat leaders lean on.</text>
<g id="mc0"><rect class="s-line" x="120" y="230" width="414" height="310" rx="18" fill="var(--stage)" stroke-width="3"/><circle id="brth" class="s-gain" cx="327" cy="335" r="55" fill="none" stroke-width="8"/><text class="d5" x="156" y="455" font-size="44">Relax</text><g id="trt"><text class="m" x="156" y="500" font-size="22">A SKILL, NOT A TRAIT</text></g></g>
<g id="mc1"><rect class="s-line" x="593" y="230" width="414" height="310" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M720 335Q800 275 880 335Q800 395 720 335Z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle id="pup" class="ink" cx="800" cy="335" r="18"/><text class="d5" x="629" y="455" font-size="44">Look around</text></g>
