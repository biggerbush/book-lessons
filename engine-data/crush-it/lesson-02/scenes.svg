<g id="s0">
<text class="m" x="120" y="150" font-size="28">CRUSH IT! · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Family, hustle,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">passion.</text>
<text class="b" x="120" y="600" font-size="32">Three priorities, ranked in the right order, power everything else.</text>
<path class="s-line" d="M1030 540h440" stroke-width="5" stroke-linecap="round"/>
<g id="pod"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One line sums it all up.</text>
<text class="b" x="120" y="176" font-size="32">Gary’s whole philosophy, in three parts.</text>
<g id="cards"></g>
<g id="qban"><rect x="120" y="580" width="1360" height="110" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<text class="d5" x="150" y="650" font-size="42">“Love your family, work superhard, live your passion.”</text></g>
<g id="ordr"><text class="d" x="120" y="800" font-size="50">In that order. <tspan style="fill:var(--gain)">The order matters.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Family comes first.</text>
<text class="b" x="120" y="176" font-size="32">Above money, and above ambition.</text>
<g id="fr0"><rect class="gain" x="120" y="250" width="520" height="80" rx="14"/><text class="d" x="150" y="304" font-size="40" style="fill:var(--on-gain)">1  Family</text></g>
<g id="fr1"><rect x="120" y="350" width="440" height="70" rx="14" fill="none" stroke="var(--line)" stroke-width="4"/><text class="m" x="150" y="395" font-size="24">2  MONEY</text></g>
<g id="fr2"><rect x="120" y="440" width="440" height="70" rx="14" fill="none" stroke="var(--line)" stroke-width="4"/><text class="m" x="150" y="485" font-size="24">3  AMBITION</text></g>
<g id="fcost"><text class="m" x="120" y="580" font-size="22">A BUSINESS MEANS NOTHING</text><text class="m" x="120" y="614" font-size="22">IF IT COSTS YOU THE PEOPLE YOU LOVE</text></g>
<g id="fshop"><path class="s-ink" d="M130 660v160M130 680h340" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M190 680v30M450 680v30" stroke-width="3"/>
<rect class="gain" x="150" y="710" width="340" height="90" rx="10"/><text class="d5" x="175" y="768" font-size="32" style="fill:var(--on-gain)">FAMILY BUSINESS</text></g>
<g id="fhouse"><path class="s-ink" d="M800 390L1060 230L1320 390" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="850" y="390" width="420" height="290" fill="var(--stage)" stroke-width="7"/><g id="fppl"></g></g>
<g id="fshd"><path d="M1405 420l65 25v70c0 50-30 80-65 95-35-15-65-45-65-95v-70z" fill="var(--stage)" stroke="var(--gain)" stroke-width="6" stroke-linejoin="round"/><g id="fshh"></g></g>
<g id="frsn"><text class="d5" x="850" y="760" font-size="34">The reason for the work,</text><text class="d5" x="850" y="806" font-size="34">not an obstacle to it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Hustle is required.</text>
<text class="b" x="120" y="176" font-size="32">Gary does not soften this part.</text>
<g id="tbx"><path class="s-ink" d="M240 330v-30h100v30" fill="none" stroke-width="8" stroke-linejoin="round"/>
<rect class="ink" x="160" y="330" width="260" height="170" rx="12"/><rect class="gain" x="270" y="380" width="40" height="30" rx="4"/>
<text class="m" x="290" y="620" font-size="20" text-anchor="middle">HARD WORK</text></g>
<g id="clk"><circle class="s-ink" cx="800" cy="420" r="140" fill="var(--stage)" stroke-width="7"/><path id="cswp" class="gain" fill-opacity=".25"/><g id="ctk"></g>
<line id="chand" class="s-gain" x1="800" y1="420" x2="800" y2="310" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="800" cy="420" r="10"/>
<text class="m" x="800" y="620" font-size="20" text-anchor="middle">LONG, FOCUSED HOURS</text></g>
<g id="tv"><rect class="s-ink" x="1140" y="300" width="300" height="200" rx="16" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1290 500v40M1240 540h100" stroke-width="7" stroke-linecap="round"/>
<path id="tvp" class="loss" d="M1265 365l60 35-60 35z"/><g id="tvh"></g>
<text class="m" x="1290" y="620" font-size="20" text-anchor="middle">IDLE TIME → BUILDING TIME</text></g>
<g id="nos"><text class="d" x="120" y="780" font-size="56">No shortcuts.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Gary’s own hustle.</text>
<text class="b" x="120" y="176" font-size="32">Long days in the store, and then some.</text>
<g id="ls"><rect class="s-ink" x="170" y="420" width="260" height="180" fill="var(--stage)" stroke-width="6"/><path class="gain" d="M160 420h280l-20-40h-240z"/>
<text class="m" x="300" y="470" font-size="22" text-anchor="middle">LIQUOR</text><rect class="ink" x="320" y="500" width="60" height="100"/><rect class="s-ink" x="200" y="500" width="70" height="50" fill="none" stroke-width="4"/>
<text class="m" x="300" y="670" font-size="20" text-anchor="middle">DAD’S LIQUOR STORE, NJ</text></g>
<path id="ar1" class="s-muted" d="M460 520h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="wl"><rect class="s-ink" x="560" y="320" width="440" height="280" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M580 455h400M580 575h400" stroke-width="5"/><g id="wlb"></g>
<rect class="gain" x="620" y="280" width="320" height="60" rx="10"/><text class="d5" x="780" y="321" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">WINE LIBRARY</text>
<text class="m" x="780" y="670" font-size="20" text-anchor="middle">A MUCH BIGGER WINE BUSINESS</text></g>
<path id="ar2" class="s-muted" d="M1020 520h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="cam"><path class="s-ink" d="M1260 510L1200 620M1260 510L1320 620M1260 510V620" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="1160" y="380" width="200" height="130" rx="14"/><circle class="s-ink" cx="1400" cy="445" r="44" fill="var(--stage)" stroke-width="8"/>
<circle id="rec" class="loss" cx="1192" cy="410" r="10"/>
<text class="m" x="1300" y="670" font-size="20" text-anchor="middle">WINE LIBRARY TV</text><g id="wk"></g>
<text class="m" x="1300" y="790" font-size="18" text-anchor="middle">ALMOST EVERY WEEKDAY</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Passion is the fuel.</text>
<text class="b" x="120" y="176" font-size="32">It is what makes the hustle bearable.</text>
<g id="flm"><g id="flp"></g><text class="m" x="330" y="680" font-size="22" text-anchor="middle">FUEL</text></g>
<g id="ps0"><text class="m" x="600" y="330" font-size="22">WHEN YOU LOVE YOUR SUBJECT</text></g>
<g id="pst"><text class="d5" x="600" y="430" font-size="56" fill-opacity=".55">Sacrifice</text></g>
<line id="pss" class="s-ink" x1="592" y1="412" x2="592" y2="412" stroke-width="6" stroke-linecap="round"/>
<g id="ps2"><text class="d" x="600" y="540" font-size="80" style="fill:var(--gain)">Play.</text></g>
<g id="bulb"><g id="blr"></g><circle id="blc" cx="1260" cy="410" r="100" fill="var(--stage)" stroke-width="7"/>
<path id="blf" d="M1230 470l10-40 10 30 10-30 10 30 10-30 10 40" fill="none" stroke-width="5" stroke-linejoin="round"/>
<rect class="ink" x="1215" y="505" width="90" height="70" rx="8"/>
<path id="blk" class="s-loss" d="M1200 345l30 30-20 22M1315 340l-22 40 18 14" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1260" y="680" font-size="20" text-anchor="middle">NO CARE → BURNOUT</text></g>
<g id="pb"><text class="d" x="120" y="790" font-size="46">Love the work, and the long hours feel lighter.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why the order matters.</text>
<text class="b" x="120" y="176" font-size="32">The ranking is a tiebreaker when priorities collide.</text>
<g id="scl"><path class="ink" d="M440 650l20-30h80l20 30z"/><path class="s-ink" d="M500 300V620" stroke-width="10" stroke-linecap="round"/>
<line id="beam" class="s-ink" x1="240" y1="300" x2="760" y2="300" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="500" cy="300" r="14"/>
<g id="pl"></g><g id="pr"></g></g>
<g id="sw"><text class="d" x="120" y="770" font-size="50">A clash? <tspan style="fill:var(--gain)">Family wins.</tspan></text></g>
<text id="stl" class="m" x="980" y="330" font-size="20">EACH SERVES THE ONE ABOVE</text>
<g id="st0"><rect class="s-ink" x="980" y="620" width="500" height="100" fill="var(--stage)" stroke-width="6"/><text class="d5" x="1000" y="685" font-size="36">Passion</text></g>
<g id="st1"><rect class="ink" x="1140" y="520" width="340" height="100"/><text class="d5" x="1160" y="585" font-size="36" style="fill:var(--stage)">Hustle</text></g>
<g id="st2"><rect class="gain" x="1300" y="420" width="180" height="100"/><text class="d" x="1320" y="485" font-size="36" style="fill:var(--on-gain)">Family</text><g id="sth"></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Each part needs the others.</text>
<g id="venn"><circle id="vc0" cx="560" cy="420" r="160" fill="var(--gain)" fill-opacity="0" stroke="var(--ink)" stroke-width="6"/>
<circle id="vc1" cx="740" cy="420" r="160" fill="var(--gain)" fill-opacity="0" stroke="var(--ink)" stroke-width="6"/>
<circle id="vc2" cx="650" cy="575" r="160" fill="var(--gain)" fill-opacity="0" stroke="var(--ink)" stroke-width="6"/>
<text class="d5" x="480" y="400" font-size="34" text-anchor="middle">Passion</text><text class="d5" x="820" y="400" font-size="34" text-anchor="middle">Hustle</text>
<text class="d5" x="650" y="680" font-size="34" text-anchor="middle">Family</text><g id="vh"></g></g>
<g id="vt0"><text class="d5" x="980" y="330" font-size="40">Passion, no hustle</text><text class="m" x="980" y="372" font-size="22">→ STAYS A HOBBY</text></g>
<g id="vt1"><text class="d5" x="980" y="470" font-size="40">Hustle, no passion</text><text class="m" x="980" y="512" font-size="22">→ BECOMES A GRIND</text></g>
<g id="vt2"><g id="vtp"></g><text class="d5" x="1080" y="630" font-size="40">Both, no family</text><text class="m" x="1080" y="672" font-size="22" style="fill:var(--loss)">→ SUCCESSFUL BUT ALONE</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What are your three</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">priorities, <tspan style="fill:var(--gain)">in order?</tspan></text></g>
<g id="qm1"><text class="m" x="143" y="580" font-size="26">WRITE THEM ON A CARD</text></g>
<g id="qm2"><text class="m" x="143" y="640" font-size="26" style="fill:var(--gain)">THIS WEEK: CATCH ONE MISMATCH, AND FIX IT</text></g>
