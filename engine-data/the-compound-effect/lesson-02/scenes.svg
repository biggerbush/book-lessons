<g id="cap0"><text class="d5" x="120" y="790" font-size="38">Blame feels comfortable: nothing is our fault.</text></g>
<g id="cap1"><text class="d" x="120" y="850" font-size="38" style="fill:var(--loss)">But nothing is in our power, either.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Life is the sum of your choices.</text>
<text class="b" x="120" y="176" font-size="32">Every small decision adds up to where you are now.</text>
