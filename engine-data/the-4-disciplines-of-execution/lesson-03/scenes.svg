<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Focus on the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">wildly important.</text>
<text class="b" x="120" y="600" font-size="32">Why chasing fewer goals helps your team achieve far more.</text>
<g id="stack"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The long list.</text>
<text class="b" x="120" y="176" font-size="32">Ten goals, all marked important, all due this year.</text>
<g id="wb"><rect class="s-ink" x="120" y="220" width="760" height="520" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="268" font-size="20">PRIORITIES · ALL DUE THIS YEAR</text></g>
<g id="gl"></g>
<g id="thr"></g>
<g id="team"><text class="m" x="1215" y="600" font-size="20" text-anchor="middle">THE TEAM</text></g>
<g id="ye"><text class="d" x="120" y="820" font-size="48">Most goals have barely moved.</text><text class="m" x="960" y="820" font-size="22">BY YEAR END</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Diminishing returns.</text>
<text class="b" x="120" y="176" font-size="32">The authors argue it happens in a predictable way.</text>
<g id="ax">
<path class="s-ink" d="M260 250V740H1100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="120" y="300" font-size="20">GOALS</text><text class="m" x="120" y="326" font-size="20">ACHIEVED</text>
<text class="m" x="1100" y="840" font-size="20" text-anchor="end">GOALS ATTEMPTED</text>
<text class="d5" x="420" y="786" font-size="32" text-anchor="middle">2–3</text>
<text class="d5" x="700" y="786" font-size="32" text-anchor="middle">4–10</text>
<text class="d5" x="980" y="786" font-size="32" text-anchor="middle">11–20</text>
<rect x="1160" y="582" width="40" height="22" rx="3" fill="var(--stage)" stroke="var(--ink)" stroke-width="3"/><text class="m" x="1216" y="601" font-size="20">ATTEMPTED</text>
<rect x="1160" y="626" width="40" height="22" rx="3" fill="var(--gain)" stroke="var(--ink)" stroke-width="3"/><text class="m" x="1216" y="645" font-size="20">ACHIEVED</text>
</g>
<g id="stk"></g>
<g id="r0"><text class="d" x="420" y="650" font-size="40" text-anchor="middle" style="fill:var(--gain)">ALL</text></g>
<g id="r1"><text class="d" x="700" y="496" font-size="40" text-anchor="middle">1–2</text></g>
<g id="r2"><text class="d" x="980" y="276" font-size="40" text-anchor="middle" style="fill:var(--loss)">NONE</text></g>
<g id="dr"><text class="d" x="1160" y="420" font-size="46">More goals,</text><text class="d" x="1160" y="480" font-size="46" style="fill:var(--loss)">fewer wins.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Land one plane at a time.</text>
<text class="b" x="120" y="176" font-size="32">A leader is like an air traffic controller.</text>
<g id="sky"></g>
<rect class="ink" x="560" y="760" width="900" height="40" rx="6"/>
<path d="M580 780H1440" stroke="var(--stage)" stroke-width="4" stroke-dasharray="24 20"/>
<g id="twr">
<text class="m" x="275" y="280" font-size="20" text-anchor="middle">CONTROLLER</text>
<rect class="ink" x="210" y="310" width="130" height="20" rx="4"/>
<path class="s-ink" d="M200 330h150l-20 90h-110z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect x="216" y="348" width="118" height="28" fill="var(--ice)"/>
<rect class="ink" x="250" y="420" width="50" height="360"/>
<rect class="ink" x="200" y="780" width="150" height="16" rx="4"/>
</g>
<line id="beam" x1="330" y1="365" x2="330" y2="365" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 10"/>
<path id="lp" class="gain" d="M-36-6H22Q38-6 40 0Q38 6 22 6H-36ZM-4-6L-18-30H-6L14-6ZM-4 6L-18 30H-6L14 6ZM-36-6L-44-20H-34L-24-6Z"/>
<g id="landnow"><text class="d" x="120" y="852" font-size="40">Your wildly important goal is the plane that must land now.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too many good ideas.</text>
<text class="b" x="120" y="176" font-size="32">So why is focusing so hard?</text>
<g id="bulbs"></g>
<g id="qt">
<rect class="s-line" x="120" y="520" width="1360" height="220" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="150" y="680" font-size="140" style="fill:var(--gain)">“</text>
<text class="d5" x="270" y="608" font-size="40">There will always be more good ideas</text>
<text class="d5" x="270" y="664" font-size="40">than there is capacity to execute.”</text>
<text class="m" x="270" y="712" font-size="20">THE AUTHORS</text>
</g>
<g id="sayno"><text class="d" x="120" y="820" font-size="40">Saying no to a good idea is the price of focus.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find the one.</text>
<text class="b" x="120" y="176" font-size="32">A sharp question to help find your goal.</text>
<g id="qm"><text class="d" x="250" y="500" font-size="300" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="qtx">
<text class="d5" x="460" y="300" font-size="44">If everything else stayed</text>
<text class="d5" x="460" y="360" font-size="44">at its current level, where</text>
<text class="d5" x="460" y="420" font-size="44">would change make the</text>
<text class="d" x="460" y="480" font-size="44">biggest difference?</text>
</g>
<g id="tiles"></g>
<g id="cnd"><text class="m" x="680" y="548" font-size="22" text-anchor="middle" style="fill:var(--gain)">CANDIDATE</text></g>
<g id="urg"><text class="m" x="1140" y="548" font-size="22" text-anchor="middle" style="fill:var(--loss)">URGENT ≠ IMPORTANT</text></g>
<g id="mag"><circle class="s-ink" cx="0" cy="0" r="72" fill="var(--stage)" fill-opacity=".15" stroke-width="12"/><path class="s-ink" d="M52 52L110 110" stroke-width="22" stroke-linecap="round"/></g>
<g id="noturg"><text class="d" x="120" y="830" font-size="40">Not simply whatever feels most urgent.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two at most.</text>
<text class="b" x="120" y="176" font-size="32">No team should chase more than two wildly important goals at once.</text>
<path class="s-line" d="M140 700H640" stroke-width="5" stroke-linecap="round"/>
<g id="f0"><path class="s-ink" d="M200 700V330" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M204 336h120l-26 40 26 40h-120z"/></g>
<g id="f1"><path class="s-ink" d="M360 700V330" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M364 336h120l-26 40 26 40h-120z"/></g>
<g id="f2"><path class="s-line" d="M520 700V330" stroke-width="7" stroke-linecap="round"/><path fill="var(--line)" d="M524 336h120l-26 40 26 40h-120z"/></g>
<g id="fx"><path class="s-loss" d="M500 330l150 150M650 330l-150 150" stroke-width="10" stroke-linecap="round"/></g>
<g id="fl"><text class="m" x="140" y="760" font-size="22">NO MORE THAN TWO AT ONCE</text></g>
<g id="pt">
<text class="m" x="1150" y="236" font-size="20" text-anchor="middle">LEADERS FOCUS ON ONE</text>
<rect class="gain" x="960" y="260" width="380" height="80" rx="14"/>
<text class="m" x="1150" y="309" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THE WAR · ONE WIG</text>
</g>
<g id="bat"></g>
<g id="batl"><text class="m" x="1150" y="720" font-size="20" text-anchor="middle">TEAMS PICK BATTLES THAT WIN THE WAR</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The rest still runs.</text>
<text class="b" x="120" y="176" font-size="32">Focus does not mean ignoring everything else.</text>
<g id="gr"></g>
<g id="ops"><text class="m" x="120" y="790" font-size="20">DAILY OPERATIONS STILL NEED CARE</text></g>
<g id="cone" opacity="0"><polygon class="gain" points="1400,272 1452,248 1210,720 890,720" fill-opacity=".2"/><ellipse class="gain" cx="1050" cy="720" rx="160" ry="22" fill-opacity=".35"/></g>
<path class="s-ink" d="M1410 120V210" stroke-width="6"/>
<polygon class="ink" points="1370,215 1440,195 1460,250 1395,280"/>
<circle class="s-ink" cx="1050" cy="620" r="80" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="1050" cy="620" r="50" fill="var(--stage)" stroke-width="6"/>
<circle id="tgc" cx="1050" cy="620" r="22" fill="var(--line)"/>
<g id="spl"><text class="m" x="1050" y="790" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE GOAL · EXTRA EFFORT</text></g>
<g id="rest"><text class="d" x="120" y="850" font-size="36">The rest keeps running. Breakthrough goes in the spotlight.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which one goal</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">deserves your</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">attention</tspan> first?</text></g>
<g id="wk"><text class="m" x="143" y="700" font-size="26">WRITE YOUR GOALS · CIRCLE ONE · START THIS WEEK</text></g>
