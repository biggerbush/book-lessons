<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE HARD THING ABOUT HARD THINGS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">There is no recipe</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">for hard things.</text>
<text class="b" x="120" y="600" font-size="32">Why the toughest leadership problems never come with instructions.</text>
<g id="book">
<text class="m" x="1260" y="236" font-size="20" text-anchor="middle">CRISIS COOKBOOK</text>
<rect class="s-ink" x="1050" y="260" width="420" height="270" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1260 260v270" stroke-width="6"/>
