<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tools become identity.</text>
<text class="b" x="120" y="176" font-size="32">Karl Weick, organizational psychologist, studied these tragedies.</text>
<g id="xlp"><g id="xlpp"></g><path class="s-ink" d="M335 520L420 330" stroke-width="10" stroke-linecap="round"/><path class="ink" d="M405 318q42-6 52 30l-40 10z"/><text class="m" x="300" y="590" font-size="20" text-anchor="middle">FIREFIGHTER</text></g>
<g id="xnoteq"><text class="m" x="120" y="660" font-size="22">NOT JUST EQUIPMENT</text></g>
<g id="xbadge"><path class="s-gain" d="M440 450h36m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="490" y="300" width="220" height="320" rx="18" fill="var(--stage)" stroke-width="6"/><rect x="570" y="318" width="60" height="12" rx="6" fill="var(--line)"/><g id="xbp"></g><text class="d" x="600" y="560" font-size="34" text-anchor="middle">IDENTITY</text><text class="m" x="600" y="596" font-size="18" text-anchor="middle">WHO I AM</text></g>
<g id="xgiveup"><text class="d" x="120" y="800" font-size="44">Dropping them feels like giving up.</text></g>
