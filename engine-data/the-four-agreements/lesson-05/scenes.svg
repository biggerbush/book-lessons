<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Don’t Make</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Assumptions.</text>
<text class="b" x="120" y="600" font-size="32">Why the stories we invent hurt us, and the simple cure.</text>
<g id="tFig"></g>
<g id="tCloud">
<circle class="s-ink" cx="1290" cy="545" r="10" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="1268" cy="503" r="16" fill="var(--stage)" stroke-width="5"/>
<ellipse class="s-ink" cx="1300" cy="360" rx="160" ry="110" fill="var(--stage)" stroke-width="6"/>
<text id="tq0" class="d" x="1230" y="390" font-size="80" text-anchor="middle" style="fill:var(--loss)">?</text>
<text id="tq1" class="d" x="1300" y="390" font-size="80" text-anchor="middle" style="fill:var(--loss)">?</text>
<text id="tq2" class="d" x="1370" y="390" font-size="80" text-anchor="middle" style="fill:var(--loss)">?</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The mind fills the gap.</text>
<text class="b" x="120" y="176" font-size="32">When information is missing, it quickly makes a guess.</text>
<g id="pz"></g>
<g id="guess"><rect class="loss" x="580" y="270" width="210" height="190" rx="16"/><circle class="loss" cx="685" cy="270" r="24"/><text class="m" x="685" y="324" font-size="24" text-anchor="middle" style="fill:var(--stage)">GUESS</text></g>
<g id="mind"><circle class="s-ink" cx="1290" cy="360" r="110" fill="var(--stage)" stroke-width="6"/><text id="mindQ" class="d" x="1290" y="402" font-size="120" text-anchor="middle">?</text><text class="m" x="1290" y="510" font-size="20" text-anchor="middle">THE MIND</text></g>
<g id="sb"></g>
<g id="stamp"><g transform="rotate(-10 685 402)"><rect x="545" y="362" width="280" height="80" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="7"/><text class="d" x="685" y="421" font-size="52" text-anchor="middle" style="fill:var(--loss)">FACT</text></g></g>
<g id="forgot"><text class="d" x="120" y="800" font-size="48">Then we forget it was only a guess.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One smile. A whole romance.</text>
<text class="b" x="120" y="176" font-size="32">Ruiz’s simple example at the mall.</text>
<g id="mall"><rect class="s-line" x="140" y="240" width="620" height="260" rx="8" fill="var(--stage)" stroke-width="4"/><g id="winM"></g><text class="m" x="450" y="480" font-size="20" text-anchor="middle">THE MALL</text><path class="s-line" d="M120 700H800" stroke-width="4"/><g id="youF"></g><text class="m" x="640" y="735" font-size="20" text-anchor="middle">YOU</text></g>
<g id="stranger"><g id="strF"></g><path id="smile" d="M246 566q14 14 28 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/><text class="m" x="260" y="735" font-size="20" text-anchor="middle">STRANGER</text></g>
<path id="spark" class="s-gain" d="M305 556H595" stroke-width="4" stroke-dasharray="8 10"/>
<g id="cloud2">
<circle class="s-ink" cx="740" cy="515" r="12" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="785" cy="480" r="16" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="835" cy="450" r="22" fill="var(--stage)" stroke-width="5"/>
<ellipse id="cl2" cx="1170" cy="430" rx="290" ry="200" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<path class="gain" transform="translate(1170 300) scale(.8)" d="M0 30C-50 0-50-40-20-40C-8-40 0-30 0-22C0-30 8-40 20-40C50-40 50 0 0 30Z"/>
<g id="ri0"><text class="d5" x="1170" y="390" font-size="40" text-anchor="middle">Dates</text></g>
<g id="ri1"><text class="d5" x="1170" y="460" font-size="40" text-anchor="middle">A future</text></g>
<g id="ri2"><text class="d5" x="1170" y="530" font-size="40" text-anchor="middle">A relationship</text></g>
</g>
<g id="none"><text class="d" x="120" y="820" font-size="50" style="fill:var(--loss)">None of it has happened.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">When the story breaks.</text>
<text class="b" x="120" y="176" font-size="32">Sooner or later, reality doesn’t match the story.</text>
<g id="heartW">
<g id="hL"><path id="hLp" d="M0 -60C-20 -110 -130 -110 -130 -20C-130 40 -60 80 0 110L15 70L-15 30L15 -10L-10 -40Z"/></g>
<g id="hR"><path id="hRp" d="M0 -60C20 -110 130 -110 130 -20C130 40 60 80 0 110L15 70L-15 30L15 -10L-10 -40Z"/></g>
</g>
<g id="betray"><text class="m" x="400" y="720" font-size="24" text-anchor="middle">HURT, AS IF BETRAYED</text></g>
<g id="blame"><g id="blameF"></g><path class="s-ink" d="M985 525L1180 470" stroke-width="12" stroke-linecap="round"/><circle class="ink" cx="1180" cy="470" r="12"/><text class="m" x="950" y="640" font-size="20" text-anchor="middle">YOU</text><text class="m" x="1320" y="640" font-size="20" text-anchor="middle">THEM</text></g>
<g id="bolts"><path class="s-loss" d="M1272 320l-14 26h18l-14 26M1322 306l-14 26h18l-14 26M1372 320l-14 26h18l-14 26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pills"></g>
<g id="suffer"><text class="d" x="120" y="830" font-size="48">This is how assumptions become suffering.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mind reading at home.</text>
<text class="b" x="120" y="176" font-size="32">We expect a partner to know without being told.</text>
<g id="sofa"><rect x="160" y="520" width="640" height="110" rx="30" fill="var(--line)"/><g id="cA"></g><g id="cB"></g><rect x="150" y="610" width="660" height="80" rx="20" fill="var(--line)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="120" y="560" width="50" height="130" rx="22"/><rect class="ink" x="790" y="560" width="50" height="130" rx="22"/><path class="s-ink" d="M190 690v22M770 690v22" stroke-width="8" stroke-linecap="round"/></g>
<g id="wishA"><circle class="s-ink" cx="350" cy="428" r="7" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="332" cy="408" r="10" fill="var(--stage)" stroke-width="4"/><ellipse class="s-ink" cx="300" cy="300" rx="175" ry="92" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="272" y="250" width="56" height="44" rx="4"/><path d="M300 250v44" stroke="var(--on-gain)" stroke-width="4"/><path class="s-gain" d="M300 250q-14-16-20 0M300 250q14-16 20 0" fill="none" stroke-width="4"/><text class="m" x="300" y="350" font-size="22" text-anchor="middle">WHAT I WANT</text></g>
<g id="dreamB"><circle class="s-ink" cx="615" cy="428" r="7" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="638" cy="408" r="10" fill="var(--stage)" stroke-width="4"/><ellipse class="s-ink" cx="720" cy="300" rx="175" ry="92" fill="var(--stage)" stroke-width="5"/><g id="starB"></g><text class="m" x="720" y="350" font-size="22" text-anchor="middle">THEIR OWN DREAM</text></g>
<g id="never"><rect x="440" y="410" width="80" height="56" rx="12" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path class="s-loss" d="M466 424l28 28M494 424l-28 28" stroke-width="6" stroke-linecap="round"/><text class="m" x="480" y="770" font-size="20" text-anchor="middle" style="fill:var(--loss)">NEVER TOLD</text></g>
<g id="door"><rect class="s-ink" x="1060" y="280" width="260" height="440" fill="none" stroke-width="7"/><rect id="panel" x="1064" y="284" width="40" height="432" fill="var(--loss)" fill-opacity=".3" stroke="var(--loss)" stroke-width="5"/><circle id="knob" class="loss" cx="1080" cy="500" r="12"/><path class="s-ink" d="M1020 720H1360" stroke-width="6"/></g>
<g id="upset"><text class="m" x="1190" y="770" font-size="22" text-anchor="middle" style="fill:var(--loss)">UNLOVED · UPSET</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Guessing about yourself.</text>
<text class="b" x="120" y="176" font-size="32">We make assumptions about ourselves, too.</text>
<g id="mirrorG"><g id="self"></g><text class="m" x="330" y="600" font-size="20" text-anchor="middle">YOU</text><ellipse class="s-ink" cx="640" cy="460" rx="140" ry="200" fill="var(--stage)" stroke-width="8"/><g id="refl"></g><path class="s-ink" d="M640 660V740M570 740H710" stroke-width="8" stroke-linecap="round"/><text class="m" x="640" y="790" font-size="20" text-anchor="middle">THE PICTURE YOU HOLD</text></g>
<g id="gauge"><path class="s-ink" d="M890 620A260 260 0 0 1 1410 620" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M1150 360v30" stroke-width="8" stroke-linecap="round"/><text class="m" x="1150" y="330" font-size="22" text-anchor="middle" style="fill:var(--gain)">TRUE</text><text class="m" x="890" y="670" font-size="22" text-anchor="middle">UNDER</text><text class="m" x="1410" y="670" font-size="22" text-anchor="middle">OVER</text><line id="needle" x1="1150" y1="620" x2="1150" y2="420" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1150" cy="620" r="16"/></g>
<g id="falsep"><text class="d" x="860" y="740" font-size="44">Either way, we suffer.</text><text class="m" x="860" y="786" font-size="24">ACTING ON A PICTURE THAT ISN’T TRUE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cure: ask questions.</text>
<text class="b" x="120" y="176" font-size="32">Ask until things are clear, even when it feels awkward.</text>
<g id="qmark"><text class="d" x="290" y="500" font-size="280" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="asks"></g>
<g id="askL"><text class="m" x="140" y="665" font-size="22">ASK UNTIL IT’S CLEAR</text></g>
<g id="badge"><path class="gain" d="M640 490L615 590L645 575L668 600L680 500ZM720 490L745 590L715 575L692 600L680 500Z"/><circle class="gain" cx="680" cy="420" r="90"/><g id="badgeStar"></g><text class="m" x="680" y="640" font-size="22" text-anchor="middle">COURAGE</text></g>
<g id="safer"><text class="d5" x="120" y="745" font-size="38">Guessing feels safer</text><text class="d5" x="120" y="795" font-size="38">than hearing the truth.</text></g>
<g id="storm"></g>
<g id="sun"><g id="rays"></g><circle class="gain" cx="1180" cy="430" r="70"/></g>
<g id="dissolve"><text class="d" x="900" y="745" font-size="44">One honest question can</text><text class="d" x="900" y="800" font-size="44">dissolve the storm.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Say what you want.</text>
<text class="b" x="120" y="176" font-size="32">Tell people what you want and need, plainly and kindly.</text>
<g id="qs"></g>
<path id="arms" class="s-gain" fill="none" stroke-width="10" stroke-linecap="round"/>
<g id="pA"><g id="pAf"></g><g id="bA"></g></g>
<g id="pB"><g id="pBf"></g><g id="bB"></g></g>
<circle id="clasp" class="gain" r="18"/>
<g id="change"><text class="d" x="120" y="820" font-size="48">Relationships can change completely.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="80" letter-spacing="-2">This week, catch one story</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="80" letter-spacing="-2">you tell about someone.</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="80" letter-spacing="-2">Then ask <tspan style="fill:var(--gain)">one clear question.</tspan></text></g>
<g id="qlab"><text class="m" x="143" y="680" font-size="26">ONE STORY · ONE QUESTION</text></g>
<g id="cal"></g>
</g>