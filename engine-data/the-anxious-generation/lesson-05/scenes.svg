<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ANXIOUS GENERATION · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why social media</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">hits girls hardest.</text>
<text class="b" x="120" y="600" font-size="32">How image-based feeds turn girls' need to belong against them</text>
<g id="tgirl"></g>
<g id="tphone"><rect class="s-ink" x="1260" y="230" width="180" height="340" rx="26" fill="var(--stage)" stroke-width="7"/><path class="s-line" d="M1325 256h50" stroke-width="5" stroke-linecap="round"/></g>
<g id="tgrid"></g>
<g id="thearts"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A wider gap.</text>
<text class="b" x="120" y="176" font-size="32">After 2012, depression and anxiety rose for both. Girls rose faster.</text>
