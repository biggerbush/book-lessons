<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Letting go</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of the past.</text>
<text class="b" x="120" y="600" font-size="32">Why old stories keep us stuck, and how to set them down</text>
<path class="s-ink" d="M1060 780L1180 560H1260L1340 300L1480 780Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-ink" d="M1030 780H1480" stroke-width="7" stroke-linecap="round"/>
<path class="gain" d="M1340 300v-60l44 15-44 15z"/>
<path class="s-ink" d="M1340 300v-60" stroke-width="5" stroke-linecap="round"/>
<g id="clim"><rect class="s-ink" x="1128" y="466" width="58" height="84" rx="12" fill="var(--stage)" stroke-width="6"/><g id="rocks"></g></g>
<g id="rk"><text class="m" x="1096" y="420" font-size="20" text-anchor="end" style="fill:var(--loss)">EACH ROCK: AN OLD STORY</text>
<path class="s-loss" d="M1100 428L1136 462" fill="none" stroke-width="4" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old story.</text>
<text class="b" x="120" y="176" font-size="32">We all keep a story about who we used to be.</text>
<g id="photo"><rect class="s-ink" x="160" y="240" width="340" height="420" rx="8" fill="var(--stage)" stroke-width="6"/><rect x="190" y="270" width="280" height="290" fill="var(--line)"/><g id="phP"></g><text class="m" x="330" y="620" font-size="20" text-anchor="middle">WHO I USED TO BE</text></g>
<g id="tags"></g>
<g id="loop"><g id="spin"><circle id="ring" cx="1250" cy="450" r="160" fill="none" stroke="var(--ink)" stroke-width="6" stroke-dasharray="18 14"/><path class="s-ink" d="M1235 275l18 15-18 15M1265 595l-18 15 18 15" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="d5" x="1250" y="440" font-size="40" text-anchor="middle">“That’s just</text><text class="d5" x="1250" y="492" font-size="40" text-anchor="middle">who I am.”</text>
<text class="m" x="1250" y="680" font-size="20" text-anchor="middle">REPEATED UNTIL IT FEELS LIKE A FACT</text></g>
<g id="steer"><text class="d" x="120" y="800" font-size="48">The past keeps steering the present.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why we hold on.</text>
<text class="b" x="120" y="176" font-size="32">The old story hurts, but at least it is familiar.</text>
<path class="s-line" d="M160 760H1440" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="230" y="440" width="40" height="320" rx="6"/>
<text class="m" x="250" y="410" font-size="22" text-anchor="middle">FAMILIAR</text>
<g id="hold"><path id="rope" class="s-muted" fill="none" stroke-width="6" stroke-linecap="round"/><g id="lean"></g></g>
<g id="fam"><text class="m" x="160" y="810" font-size="22" style="fill:var(--loss)">PAINFUL, BUT FAMILIAR</text></g>
<g id="door"><rect class="gain" x="1120" y="400" width="200" height="360" fill-opacity=".25"/><rect class="s-ink" x="1120" y="400" width="200" height="360" fill="none" stroke-width="6"/><path class="ink" d="M1120 400l70 30v300l-70 30z"/><text class="m" x="1220" y="380" font-size="22" text-anchor="middle">UNKNOWN</text></g>
<g id="fwd"><path class="s-gain" d="M720 720H1080M1060 704l20 16-20 16" fill="none" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/></g>
<g id="rsst"><text class="m" x="900" y="810" font-size="22" text-anchor="middle" style="fill:var(--loss)">PART OF US RESISTS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Grieve the plan, too.</text>
<text class="b" x="120" y="176" font-size="32">An example in the spirit of the book.</text>
<rect class="s-line" x="120" y="220" width="580" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">WHAT HAPPENED</text>
<rect class="s-line" x="780" y="220" width="700" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="810" y="270" font-size="22">THE FUTURE THEY PLANNED</text>
<g id="cpl"><text class="m" x="410" y="620" font-size="20" text-anchor="middle">THE RELATIONSHIP ENDED</text></g>
<path id="crk" class="s-loss" d="M410 330l-14 40 28 30-28 40 28 30-14 40" fill="none" stroke-width="6" stroke-linejoin="round"/>
<g id="house"><g id="hs"><circle cx="715" cy="430" r="6" fill="var(--muted)"/><circle cx="740" cy="420" r="9" fill="var(--muted)"/><circle cx="768" cy="408" r="12" fill="var(--muted)"/>
<path class="s-gain" d="M960 620V450L1130 330L1300 450V620z" fill="none" stroke-width="6" stroke-dasharray="14 10" stroke-linejoin="round"/>
<rect class="s-gain" x="1100" y="520" width="60" height="100" fill="none" stroke-width="5"/><rect class="s-gain" x="1000" y="480" width="60" height="50" fill="none" stroke-width="5"/><rect class="s-gain" x="1200" y="480" width="60" height="50" fill="none" stroke-width="5"/>
<path class="s-line" d="M900 620H1360" stroke-width="4"/></g></g>
<g id="nc"><text class="m" x="1130" y="670" font-size="20" text-anchor="middle">A FUTURE THAT NEVER CAME</text></g>
<g id="grv"><text class="d" x="120" y="800" font-size="44">Grieve the imagined life, not only what happened.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stop arguing with reality.</text>
<text class="b" x="120" y="176" font-size="32">Acceptance is not approval.</text>
<g id="cal"><rect class="s-ink" x="160" y="240" width="260" height="280" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="160" y="240" width="260" height="60" rx="14"/><text class="m" x="290" y="280" font-size="20" text-anchor="middle" style="fill:var(--stage)">THE PAST</text><g id="days"></g></g>
<g id="n0"><text class="m" x="470" y="320" font-size="22">NOT: I LIKED WHAT HAPPENED</text></g>
<g id="n1"><text class="m" x="470" y="370" font-size="22">NOT: IT WAS FAIR</text></g>
<g id="acc"><text class="d5" x="470" y="460" font-size="40" style="fill:var(--gain)">Just: it happened.</text></g>
<g id="scl"><text class="m" x="1210" y="300" font-size="20" text-anchor="middle">WHERE YOUR ENERGY GOES</text>
<path class="s-ink" d="M1210 520V730" stroke-width="8"/><rect class="ink" x="1150" y="730" width="120" height="14" rx="4"/>
<path id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/><circle class="gain" cx="1210" cy="520" r="10"/>
<g id="pans"></g><g id="balls"></g>
<text class="m" x="960" y="780" font-size="20" style="fill:var(--loss)">RESISTING THE PAST</text>
<text class="m" x="1480" y="780" font-size="20" text-anchor="end" style="fill:var(--gain)">BUILDING THE FUTURE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Closure is yours to give.</text>
<text class="b" x="120" y="176" font-size="32">You don’t need their permission.</text>
<g id="ph"><rect class="s-ink" x="200" y="240" width="240" height="440" rx="32" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M290 270h60" stroke-width="6" stroke-linecap="round"/>
<rect x="230" y="330" width="140" height="60" rx="24" fill="var(--line)"/><circle id="dt0" cx="265" cy="360" r="8" fill="var(--muted)"/><circle id="dt1" cx="300" cy="360" r="8" fill="var(--muted)"/><circle id="dt2" cx="335" cy="360" r="8" fill="var(--muted)"/>
<rect class="gain" x="270" y="420" width="140" height="50" rx="22"/><rect class="gain" x="290" y="490" width="120" height="50" rx="22"/>
<text class="m" x="320" y="730" font-size="20" text-anchor="middle">WAITING FOR AN APOLOGY</text></g>
<g id="gv"><text class="d5" x="520" y="440" font-size="40">Closure is something</text><text class="d5" x="520" y="494" font-size="40">you give yourself.</text></g>
<g id="bk"><rect class="s-ink" x="1060" y="300" width="360" height="300" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1040" y="300" width="30" height="300" rx="6"/><text class="m" x="1240" y="360" font-size="22" text-anchor="middle">OLD CHAPTER</text>
<path class="s-ink" d="M1215 460v-30a25 25 0 0 1 50 0v30" fill="none" stroke-width="8"/><rect id="lockB" x="1200" y="460" width="80" height="70" rx="10" fill="var(--ink)"/></g>
<g id="keyW"><g id="keyG"><circle class="s-gain" cx="1332" cy="495" r="22" fill="none" stroke-width="8"/><path class="s-gain" d="M1240 495h70M1250 495v16M1266 495v12" fill="none" stroke-width="8" stroke-linecap="round"/></g></g>
<g id="done"><text class="m" x="1240" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">CHAPTER FINISHED</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not one moment. Many choices.</text>
<text class="b" x="120" y="176" font-size="32">Old feelings return, like waves reaching the shore.</text>
<g id="seaG"><path id="sea" fill="var(--loss)" fill-opacity=".15"/><path id="crest" class="s-loss" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="wl"><text class="m" x="160" y="830" font-size="22" style="fill:var(--loss)">OLD FEELINGS RETURN</text></g>
<g id="fp"></g>
<g id="wk"></g>
<g id="ch"><text class="m" x="200" y="440" font-size="22" style="fill:var(--gain)">EACH TIME, CHOOSE AGAIN</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">You have changed.</text>
<text class="b" x="120" y="176" font-size="32">You are not the person who lived through those events.</text>
<g id="then"><text class="m" x="300" y="790" font-size="22" text-anchor="middle">THEN</text></g>
<g id="mir"><ellipse class="s-ink" cx="640" cy="470" rx="150" ry="220" fill="var(--stage)" stroke-width="8"/><g id="mirP"></g><path class="s-ink" d="M640 690V740M580 740H700" stroke-width="8" stroke-linecap="round"/><text class="m" x="640" y="790" font-size="22" text-anchor="middle" style="fill:var(--gain)">NOW</text></g>
<g id="spr"><path class="s-ink" d="M960 640h240l-30 140h-180z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path id="stem" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1230" y="720" font-size="20">WHO YOU WERE</text></g>
<g id="lf0"><ellipse class="gain" cx="1045" cy="470" rx="40" ry="16" transform="rotate(-25 1045 470)"/></g>
<g id="lf1"><ellipse class="gain" cx="1115" cy="410" rx="40" ry="16" transform="rotate(25 1115 410)"/></g>
<g id="bud"><circle class="gain" cx="1080" cy="352" r="14"/></g>
<g id="grow"><text class="m" x="1230" y="380" font-size="20" style="fill:var(--gain)">ROOM TO GROW</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What is one old story</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">about yourself you keep</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">repeating?</text></g>
<g id="lab"><text class="m" x="143" y="700" font-size="26">THIS WEEK: WRITE IT DOWN, THEN WHAT IS TRUE NOW</text></g>
<g id="pad"><rect class="s-ink" x="1180" y="560" width="280" height="220" rx="12" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="1210" y="596" font-size="18">OLD STORY</text><rect x="1210" y="610" width="200" height="12" rx="6" fill="var(--muted)"/>
<line id="strk" x1="1200" y1="616" x2="1200" y2="616" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="1210" y="666" font-size="18" style="fill:var(--gain)">TRUE NOW</text>
<rect id="nb" class="gain" x="1210" y="682" width="0" height="14" rx="7"/><rect id="nb2" class="gain" x="1210" y="712" width="0" height="14" rx="7"/></g>
</g>