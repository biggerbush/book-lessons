<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAME AS EVER · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Calm plants the seeds</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of crazy.</text>
<text class="b" x="120" y="600" font-size="32">Why long stretches of safety quietly build the next crisis.</text>
<g id="tg">
<rect class="loss" x="1200" y="470" width="280" height="300" fill-opacity=".1"/>
<path id="sea" class="s-loss" fill="none" stroke-width="5"/>
<path id="root" class="s-loss" d="M1340 700l-14-40 22-30-18-40 16-36-8-34" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<ellipse class="gain" cx="1340" cy="712" rx="22" ry="14"/>
<g id="boat"><path class="ink" d="M1280 462h120l-20 26h-80z"/><path class="s-ink" d="M1340 462v-110" stroke-width="5"/><path class="gain" d="M1346 360l50 90h-50z"/></g>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hyman Minsky’s big idea.</text>
<text class="b" x="120" y="176" font-size="32">Why do financial crises keep happening, even in modern economies?</text>
<g id="mk1"><g id="ec"></g><text class="m" x="250" y="580" font-size="22" text-anchor="middle">HYMAN MINSKY</text></g>
<g id="ch1"><path class="s-ink" d="M400 300V540H720" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="400" y="590" font-size="18">CRISES KEEP RETURNING</text></g>
<path id="cy" class="s-loss" d="M400 510L470 430L482 525L560 420L572 525L650 410L662 525L710 470" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="qcard">
<rect class="s-line" x="780" y="240" width="700" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="820" y="390" font-size="160" style="fill:var(--gain)">“</text>
<text class="d" x="830" y="470" font-size="64">Stability is</text>
<text class="d" x="830" y="550" font-size="64" style="fill:var(--gain)">destabilizing.</text>
<text class="m" x="830" y="620" font-size="20">MINSKY’S CORE INSIGHT, AS HOUSEL TELLS IT</text>
</g>
<g id="bk"><text class="d5" x="120" y="780" font-size="40">Sounds backwards. But every era repeats it.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Good years breed bigger bets.</text>
<text class="b" x="120" y="176" font-size="32">How a long calm quietly changes behaviour.</text>
<g id="yrs"></g>
<g id="yl"><text class="m" x="120" y="400" font-size="22">STEADY JOBS · RISING PRICES · NOTHING BREAKS</text></g>
<g id="rw"></g>
<g id="bb"><text class="d" x="120" y="800" font-size="44">The calm feels permanent, so the bets grow.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small bets, one tall tower.</text>
<text class="b" x="120" y="176" font-size="32">How a long calm turns into a crisis.</text>
<path class="s-ink" d="M680 760H1480" stroke-width="6" stroke-linecap="round"/>
<g id="tw"></g>
<circle id="shk" class="loss" cy="725" r="18"/>
<g id="t31"><text class="d5" x="120" y="330" font-size="40">Each bet makes sense</text><text class="d5" x="120" y="380" font-size="40">on its own.</text></g>
<g id="t32"><text class="d5" x="120" y="480" font-size="40">Together they stack</text><text class="d5" x="120" y="530" font-size="40">into a tower of risk.</text></g>
<g id="t33"><text class="d5" x="120" y="630" font-size="40" style="fill:var(--loss)">A small shock,</text><text class="d5" x="120" y="680" font-size="40" style="fill:var(--loss)">and it all falls.</text></g>
<g id="t34"><text class="d" x="120" y="830" font-size="44">The calm helped cause the crisis.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Great Moderation.</text>
<text class="b" x="120" y="176" font-size="32">Housel points to the years before 2008.</text>
<g id="mk4"><path class="s-ink" d="M160 560H1440" stroke-width="5" stroke-linecap="round"/><path class="s-muted" d="M1360 280V560" stroke-width="4" stroke-dasharray="8 8"/><text class="d5" x="1360" y="612" font-size="36" text-anchor="middle">2008</text><text class="m" x="160" y="600" font-size="20">GROWTH</text></g>
<polyline id="gl" class="s-ink" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="br4"><path class="s-gain" d="M560 290v-20H1300v20" fill="none" stroke-width="5"/><text class="m" x="930" y="250" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE GREAT MODERATION</text></g>
<g id="pt4"><text class="m" x="930" y="350" font-size="20" text-anchor="middle">BIG RECESSIONS: A THING OF THE PAST?</text></g>
<g id="hs"></g>
<g id="hl"><text class="m" x="120" y="790" font-size="22">EASY LENDING · RISKY HOME LOANS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then the crash.</text>
<text class="b" x="120" y="176" font-size="32">Calm was not the opposite of the crash. It was the soil.</text>
<path class="s-ink" d="M140 460H840" stroke-width="5" stroke-linecap="round"/>
<g id="bars"></g>
<rect id="fb" x="730" width="64"/>
<g id="cl5"><text class="m" x="762" y="740" font-size="18" text-anchor="middle">FINANCIAL CRISIS</text><text class="m" x="762" y="766" font-size="18" text-anchor="middle">DEEP RECESSION</text></g>
<g id="bt5"><text class="d" x="120" y="840" font-size="40">The belief that things were safe made them unsafe.</text></g>
<g id="soil"><rect x="900" y="620" width="580" height="140" rx="14" fill="var(--line)"/><ellipse class="gain" cx="1190" cy="660" rx="26" ry="16"/><text class="m" x="1190" y="730" font-size="22" text-anchor="middle" style="fill:var(--ink)">CALM</text></g>
<path id="plant" class="s-loss" d="M1190 646L1168 570L1214 510L1164 440L1208 370L1186 310M1214 510l60-30M1164 440l-56-24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="cr5"><text class="d" x="1190" y="280" font-size="48" text-anchor="middle" style="fill:var(--loss)">CRASH</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not stupidity. Human nature.</text>
<text class="b" x="120" y="176" font-size="32">When risk feels gone, taking more risk feels rational.</text>
<g id="hd">
<circle class="s-ink" cx="380" cy="420" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="s-gain" d="M320 420l40 40 80-90" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="380" y="520" font-size="20" text-anchor="middle">RATIONAL?</text>
<path class="ink" d="M250 650v-20a130 60 0 0 1 260 0v20z"/>
<text class="m" x="380" y="700" font-size="22" text-anchor="middle">NOT STUPIDITY · HUMAN NATURE</text>
</g>
<g id="pd">
<path class="s-ink" d="M1000 240H1200" stroke-width="8" stroke-linecap="round"/>
<path class="s-line" d="M907 470A300 300 0 0 0 1293 470" fill="none" stroke-width="4" stroke-dasharray="8 10"/>
<text class="d" x="880" y="570" font-size="40" text-anchor="end" style="fill:var(--gain)">BOOM</text>
<text class="d" x="1320" y="570" font-size="40" style="fill:var(--loss)">BUST</text>
<line id="arm" class="s-ink" x1="1100" y1="240" stroke-width="6" stroke-linecap="round"/>
<circle id="bob" r="36"/>
</g>
<g id="gn"></g>
<g id="gl6"><text class="m" x="700" y="770" font-size="20">EACH GENERATION LEARNS THE LESSON, THEN FORGETS IT</text></g>
<g id="bt6"><text class="d" x="120" y="840" font-size="44">Booms and busts keep returning.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Calm is a warning light.</text>
<text class="b" x="120" y="176" font-size="32">The same pattern shows up in your own money and habits.</text>
<g id="wl"><rect class="s-ink" x="140" y="320" width="260" height="180" rx="22" fill="var(--stage)" stroke-width="7"/><rect class="s-ink" x="300" y="380" width="120" height="64" rx="14" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="340" cy="412" r="14"/><text class="m" x="270" y="560" font-size="22" text-anchor="middle">MONEY &amp; HABITS</text></g>
<g id="ckf"><rect class="s-line" x="500" y="260" width="540" height="340" rx="18" fill="var(--stage)" stroke-width="3"/></g>
<g id="ck"></g>
<g id="al"><g id="rays"></g><circle id="lamp" class="loss" cx="1270" cy="420" r="80"/><circle class="s-ink" cx="1270" cy="420" r="80" fill="none" stroke-width="7"/><path class="s-ink" d="M1230 520h80v30h-80z" fill="var(--stage)" stroke-width="6"/><text class="m" x="1270" y="620" font-size="22" text-anchor="middle">A WARNING LIGHT,</text><text class="m" x="1270" y="652" font-size="22" text-anchor="middle">NOT A GREEN LIGHT</text></g>
<g id="mg"><text class="d" x="120" y="790" font-size="40">The longer it goes well, check your margins more.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="143" y="230" font-size="26">THINK OF ONE AREA THAT HAS FELT CALM FOR YEARS</text></g>
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">What risk have you</text></g>
<g id="qb"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">quietly added because</text></g>
<g id="qc"><text class="d" x="136" y="580" font-size="88" letter-spacing="-2">nothing has gone <tspan style="fill:var(--gain)">wrong?</tspan></text></g>
<g id="qg"><path class="s-line" d="M1180 770q40-12 80 0t80 0t80 0" fill="none" stroke-width="6" stroke-linecap="round"/><rect class="loss" x="1290" y="726" width="100" height="30" rx="4"/><rect class="loss" x="1302" y="694" width="100" height="30" rx="4"/><rect class="loss" x="1284" y="662" width="100" height="30" rx="4"/></g>
</g>