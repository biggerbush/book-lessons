<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE RICHEST MAN IN BABYLON · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Five Laws</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Gold.</text>
<text class="b" x="120" y="600" font-size="32">Why a tablet of wisdom beats a bag of gold</text>
<g id="t0bag"><text class="m" x="1110" y="660" font-size="22" text-anchor="middle">GOLD</text></g>
<text id="t0or" class="d" x="1242" y="490" font-size="40" text-anchor="middle" style="fill:var(--muted)">or</text>
<g id="t0tab"><text class="m" x="1385" y="660" font-size="22" text-anchor="middle">WISDOM</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A story by the campfire.</text>
<text class="b" x="120" y="176" font-size="32">A desert camp at night.</text>
<g id="camp"><g id="stars"></g><path class="s-line" d="M120 720H1480" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M500 715L620 688M500 688L620 715" stroke-width="12" stroke-linecap="round"/><g id="fire"></g><g id="trav"></g><text class="m" x="560" y="780" font-size="20" text-anchor="middle">TRAVELERS AROUND THE FIRE</text></g>
<g id="kal"><path class="s-ink" d="M988 626V716M1012 626V716" stroke-width="12" stroke-linecap="round"/><text class="m" x="1000" y="780" font-size="20" text-anchor="middle">KALABAB</text></g>
<g id="story"><path d="M1080 500L1032 474L1124 500" fill="var(--stage)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><rect x="1060" y="230" width="400" height="270" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="m" x="1090" y="272" font-size="20">THE STORY</text><text class="m" x="1170" y="478" font-size="18" text-anchor="middle">ARKAD</text>
<g id="nomS"><path class="s-gain" d="M1240 446H1440" stroke-width="4" stroke-dasharray="8 10"/><text class="m" x="1370" y="478" font-size="18" text-anchor="middle" style="fill:var(--gain)">NOMASIR</text></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The father’s test.</text>
<text class="b" x="120" y="176" font-size="32">Two gifts, and ten years to prove himself.</text>
<g id="ark2"><text class="m" x="260" y="580" font-size="22" text-anchor="middle">ARKAD</text></g>
<g id="gift1"><text class="m" x="600" y="660" font-size="22" text-anchor="middle">A BAG OF GOLD</text></g>
<g id="gift2"><text class="m" x="920" y="660" font-size="22" text-anchor="middle">FIVE LAWS IN CLAY</text></g>
<g id="estate"><path class="ink" d="M1140 440L1290 330L1440 440Z"/><rect x="1170" y="440" width="240" height="180" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="gain" x="1262" y="530" width="56" height="90"/><text class="m" x="1290" y="660" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE ESTATE</text></g>
<g id="tl"><text class="m" x="120" y="725" font-size="20">GO OUT FOR TEN YEARS</text><text class="m" x="1360" y="725" font-size="20" text-anchor="end">RETURN</text><path class="s-line" d="M140 770H1340" stroke-width="5"/></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Losing it fast.</text>
<text class="b" x="120" y="176" font-size="32">Two mistakes in a new city.</text>
<g id="pa"><rect class="s-line" x="120" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="265" font-size="20">A RIGGED BET ON HORSE RACES</text><path class="s-line" d="M160 330H720M160 395H720M160 460H720" stroke-width="3"/><path class="s-ink" d="M690 320V470" stroke-width="4" stroke-dasharray="8 8"/><g id="race"></g><g id="trk"><text class="m" x="370" y="628" font-size="18" text-anchor="middle">FRIENDLY STRANGERS</text></g></g>
<g id="pb"><rect class="s-line" x="840" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="265" font-size="20">A BUSINESS HE DOES NOT UNDERSTAND</text><g id="prt"></g><rect x="1080" y="340" width="180" height="160" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="d" x="1170" y="455" font-size="100" text-anchor="middle" style="fill:var(--loss)">?</text><text class="m" x="960" y="600" font-size="20" text-anchor="middle">PARTNER</text><text class="m" x="1360" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">NOMASIR</text></g>
<text class="m" x="120" y="700" font-size="20">HIS FATHER’S GOLD</text>
<g id="slots"></g>
<g id="purse"></g>
<g id="gone"><text class="d" x="880" y="770" font-size="52" style="fill:var(--loss)">Every coin is gone.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Laws one and two.</text>
<text class="b" x="120" y="176" font-size="32">Nomasir finally reads the tablet.</text>
<g id="tab4"></g>
<g id="l1"><text class="m" x="520" y="270" font-size="22">LAW 1 · SAVE AT LEAST ONE TENTH OF EARNINGS</text><path class="s-ink" d="M1390 320v80a10 10 0 0 0 10 10h60a10 10 0 0 0 10-10v-80" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="1430" y="440" font-size="18" text-anchor="middle">KEEP</text><g id="c10"></g></g>
<g id="l2"><text class="m" x="520" y="520" font-size="22">LAW 2 · PUT GOLD TO PROFITABLE USE</text><g id="flk"></g><text class="m" x="520" y="790" font-size="20" style="fill:var(--gain)">MULTIPLYING LIKE A FLOCK</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Law three: ask the wise.</text>
<text class="b" x="120" y="176" font-size="32">Gold stays with the cautious owner who takes good advice.</text>
<g id="own"><text class="m" x="300" y="640" font-size="22" text-anchor="middle" style="fill:var(--gain)">NOMASIR</text></g>
<g id="adv"><rect x="800" y="250" width="160" height="80" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><path class="s-gain" d="M846 292l20 20 44-40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="880" y="640" font-size="22" text-anchor="middle">PEOPLE WISE WITH GOLD</text></g>
<g id="stk"><text class="m" x="1320" y="640" font-size="22" text-anchor="middle">PLACED WITH CARE</text></g>
<g id="wg"><text class="m" x="120" y="300" font-size="20">SMALL WAGES</text></g>
<g id="fly"></g>
<g id="wtxt"><text class="d" x="120" y="790" font-size="40">Save, then ask experienced people where each coin goes.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Laws four and five.</text>
<text class="b" x="120" y="176" font-size="32">Where gold slips away, and where it flees.</text>
<g id="p4"><rect class="s-line" x="120" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="265" font-size="20">LAW 4 · VENTURES YOU DO NOT UNDERSTAND</text><path class="loss" d="M280 360h300l-20-50H300z"/><rect x="300" y="360" width="260" height="200" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect x="390" y="440" width="80" height="120" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="430" y="525" font-size="70" text-anchor="middle" style="fill:var(--loss)">?</text><g id="drip"></g></g>
<g id="p5"><rect class="s-line" x="840" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="265" font-size="20">LAW 5 · IMPOSSIBLE RETURNS, TEMPTING TIPS</text><rect x="1060" y="330" width="380" height="100" rx="12" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="d" x="1250" y="392" font-size="30" text-anchor="middle" style="fill:var(--loss)">IMPOSSIBLE RETURNS!</text><g id="flee"></g></g>
<g id="rl0"><text class="d5" x="440" y="740" font-size="32" text-anchor="middle">= His partner’s business</text></g>
<g id="rl1"><text class="d5" x="1160" y="740" font-size="32" text-anchor="middle">= The rigged bet</text></g>
<g id="rl2"><text class="d" x="120" y="820" font-size="40">His two disasters broke exactly these two laws.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ten years later.</text>
<text class="b" x="120" y="176" font-size="32">Nomasir comes home.</text>
<g id="lft"><text class="m" x="240" y="620" font-size="22" text-anchor="middle">LEFT WITH</text></g>
<g id="hom"><text class="m" x="480" y="620" font-size="22" text-anchor="middle" style="fill:var(--gain)">CAME HOME WITH</text></g>
<g id="scl"><rect class="ink" x="1100" y="360" width="20" height="340"/><rect class="ink" x="1020" y="690" width="180" height="20" rx="6"/><line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="1110" cy="360" r="14"/></g>
<g id="fin"><text class="d" x="120" y="800" font-size="38">Gold without wisdom vanishes. Wisdom keeps bringing it back.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="m" x="143" y="220" font-size="26">BEFORE YOUR NEXT INVESTMENT, ASK</text></g>
<g id="qb"><rect x="136" y="282" width="60" height="60" rx="10" fill="none" stroke="var(--ink)" stroke-width="6"/><path id="ck1" class="s-gain" d="M148 312l14 14 26-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="230" y="340" font-size="76" letter-spacing="-2">Do you understand it?</text></g>
<g id="qc"><rect x="136" y="402" width="60" height="60" rx="10" fill="none" stroke="var(--ink)" stroke-width="6"/><path id="ck2" class="s-gain" d="M148 432l14 14 26-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="230" y="460" font-size="76" letter-spacing="-2">Does a true expert approve?</text></g>
<g id="safe"><text class="d5" x="136" y="640" font-size="44">If either answer is no, keep your gold safe.</text><g id="lockbag"></g></g>
<text class="m" x="143" y="760" font-size="26">THE FIVE LAWS OF GOLD</text>
</g>