<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Ask how and what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">questions.</text>
<text class="b" x="120" y="600" font-size="32">Let them feel in control while you steer the conversation.</text>
<g id="wheelg"><g id="wheel">
<circle cx="1290" cy="380" r="130" fill="none" class="s-ink" stroke-width="18"/>
<path class="s-ink" d="M1290 380v130M1290 380l-113-65M1290 380l113-65" stroke-width="14" stroke-linecap="round"/>
<circle class="ink" cx="1290" cy="380" r="34"/>
<g id="hands"><circle class="gain" cx="1168" cy="336" r="24"/><circle class="gain" cx="1412" cy="336" r="24"/></g>
</g></g>
<g id="feel"><text class="m" x="1290" y="600" font-size="24" text-anchor="middle">OR SO THEY FEEL</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The illusion of control.</text>
<text class="b" x="120" y="176" font-size="32">People dig in when they feel cornered or pushed.</text>
<rect id="wall" class="loss" x="1180" y="380" width="22" height="300" rx="6"/>
<g id="pp"></g>
<g id="push"><path class="s-loss" d="M540 560h360m-30-30 30 30-30 30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="720" y="520" font-size="22" text-anchor="middle" style="fill:var(--loss)">PUSHED</text></g>
<g id="crown"><path class="gain" d="M1010 425l10-60 25 30 15-40 15 40 25-30 10 60z"/><text class="m" x="1060" y="720" font-size="22" text-anchor="middle" style="fill:var(--gain)">FEELS IN CHARGE</text></g>
<g id="qm"><path class="s-ink" d="M400 378l20 40 20-40" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><rect class="s-ink" x="320" y="230" width="200" height="150" rx="24" fill="var(--stage)" stroke-width="6"/><text class="d" x="420" y="345" font-size="110" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="550" y="300" font-size="22">CALIBRATED QUESTION</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with how or what.</text>
<text class="b" x="120" y="176" font-size="32">Questions that can’t be answered with yes or no.</text>
<g id="hw"><rect class="gain" x="120" y="240" width="320" height="100" rx="18"/><text class="d" x="150" y="312" font-size="60" style="fill:var(--on-gain)">How…?</text><rect class="gain" x="120" y="370" width="320" height="100" rx="18"/><text class="d" x="150" y="442" font-size="60" style="fill:var(--on-gain)">What…?</text></g>
<g id="yn"><rect class="s-ink" x="540" y="250" width="150" height="100" rx="14" fill="none" stroke-width="5"/><text class="d5" x="615" y="315" font-size="40" text-anchor="middle">YES</text><rect class="s-ink" x="730" y="250" width="150" height="100" rx="14" fill="none" stroke-width="5"/><text class="d5" x="805" y="315" font-size="40" text-anchor="middle">NO</text><text class="m" x="540" y="420" font-size="20">NO SIMPLE YES OR NO</text></g>
<line id="ynx" class="s-loss" x1="530" y1="370" x2="530" y2="370" stroke-width="8" stroke-linecap="round"/>
<g id="cloud"><g fill="var(--line)"><circle cx="1140" cy="330" r="50"/><circle cx="1210" cy="295" r="60"/><circle cx="1280" cy="330" r="50"/><circle cx="1210" cy="365" r="45"/><circle cx="1185" cy="425" r="12"/><circle cx="1195" cy="452" r="7"/></g>
<circle id="td0" class="ink" cx="1170" cy="335" r="10"/><circle id="td1" class="ink" cx="1210" cy="335" r="10"/><circle id="td2" class="ink" cx="1250" cy="335" r="10"/>
<text class="m" x="1210" y="700" font-size="20" text-anchor="middle">STOP · THINK · EXPLAIN</text></g>
<g id="tc"></g>
<g id="cards"></g>
<g id="info"><text class="m" x="120" y="770" font-size="22">EVERY EXPLANATION HANDS YOU NEW INFORMATION</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Skip the why.</text>
<text class="b" x="120" y="176" font-size="32">“Why” makes people defend themselves.</text>
<g id="why"><rect class="s-loss" x="120" y="250" width="380" height="170" rx="30" fill="none" stroke-width="7"/><text class="d" x="310" y="375" font-size="100" text-anchor="middle" style="fill:var(--loss)">Why?</text><rect class="ink" x="540" y="450" width="110" height="100" rx="24"/><rect class="ink" x="620" y="465" width="170" height="34" rx="17"/></g>
<g id="acc"><text class="m" x="120" y="650" font-size="22">TO MOST PEOPLE, WHY SOUNDS LIKE</text><text class="d5" x="120" y="715" font-size="50" style="fill:var(--loss)">an accusation.</text></g>
<g id="dm"></g>
<g id="def"><path d="M1150 568l100 26M1150 594l100-26" stroke="var(--stage)" stroke-width="10" stroke-linecap="round"/><path class="s-loss" d="M1050 400q-80 130 0 260" fill="none" stroke-width="10" stroke-linecap="round"/><path class="s-loss" d="M830 482h120" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="1200" y="720" font-size="22" text-anchor="middle">DEFENSIVE, NOT OPEN</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The ransom demand.</text>
<text class="b" x="120" y="176" font-size="32">A kidnapper calls with a huge demand.</text>
<g id="kgrp"><rect class="s-loss" x="140" y="230" width="240" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d" x="260" y="302" font-size="60" text-anchor="middle" style="fill:var(--loss)">$$$</text><g id="kid"></g><rect class="ink" x="304" y="395" width="18" height="44" rx="5"/><text class="m" x="260" y="660" font-size="22" text-anchor="middle">KIDNAPPER</text></g>
<g id="nocard"><rect class="s-loss" x="520" y="240" width="320" height="240" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="550" y="370" font-size="80">No</text><g id="af"><circle class="loss" cx="750" cy="345" r="52"/><path d="M722 325l18 8M778 325l-18 8M728 375q22-16 44 0" stroke="var(--stage)" stroke-width="6" fill="none" stroke-linecap="round"/></g><text class="m" x="550" y="450" font-size="20">ANGERS HIM</text></g>
<g id="yescard"><rect class="s-loss" x="520" y="520" width="320" height="240" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="550" y="650" font-size="80">Yes</text><rect id="bar0" class="loss" x="730" y="660" width="70" height="28" rx="6"/><rect id="bar1" class="loss" x="730" y="622" width="70" height="28" rx="6"/><rect id="bar2" class="loss" x="730" y="584" width="70" height="28" rx="6"/><text class="m" x="550" y="735" font-size="20">MORE DEMANDS</text></g>
<g id="reply"><rect class="gain" x="920" y="240" width="560" height="200" rx="24"/><path class="gain" d="M1160 438l40 40 10-40z"/><text class="d" x="955" y="322" font-size="50" style="fill:var(--on-gain)">How am I supposed</text><text class="d" x="955" y="398" font-size="50" style="fill:var(--on-gain)">to do that?</text><g id="vos"></g><rect class="ink" x="1238" y="505" width="16" height="40" rx="5"/><text class="m" x="1200" y="730" font-size="22" text-anchor="middle">VOSS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Now it’s their problem.</text>
<text class="b" x="120" y="176" font-size="32">A question hands them a puzzle to solve.</text>
<g id="kid2"></g>
<g id="pc"><g id="piece"><path class="gain" d="M-50 -50h35a15 15 0 0 1 30 0h35v35a15 15 0 0 1 0 30v35h-100z"/><text class="m" x="0" y="100" font-size="20" text-anchor="middle">YOUR PROBLEM</text></g></g>
<g id="gears"><text class="m" x="880" y="360" font-size="20">YOUR OBSTACLES</text></g>
<g id="bulb"><g id="rays"></g><circle class="gain" cx="1200" cy="390" r="70"/><rect class="ink" x="1172" y="466" width="56" height="40" rx="8"/></g>
<g id="emp"><text class="m" x="120" y="760" font-size="24" style="fill:var(--gain)">VOSS CALLS THIS FORCING EMPATHY</text></g>
<g id="own"><text class="d" x="120" y="830" font-size="44">He works on your problem as if it were his own.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyday versions.</text>
<text class="b" x="120" y="176" font-size="32">Use it with a boss, a client, or a landlord.</text>
<g id="trio"></g>
<g id="sb0"><rect class="s-gain" x="120" y="470" width="880" height="100" rx="24" fill="var(--stage)" stroke-width="5"/><text class="d5" x="150" y="533" font-size="40">“What about this is important to you?”</text></g>
<g id="sb1"><rect class="s-gain" x="120" y="610" width="880" height="100" rx="24" fill="var(--stage)" stroke-width="5"/><text class="d5" x="150" y="673" font-size="40">“How can we solve this problem?”</text></g>
<g id="comp"><circle class="s-ink" cx="1260" cy="620" r="110" fill="var(--stage)" stroke-width="6"/><text class="m" x="1260" y="540" font-size="20" text-anchor="middle">N</text>
<g id="needle"><polygon class="gain" points="1260,555 1274,620 1246,620"/><polygon class="ink" points="1246,620 1274,620 1260,685"/><circle class="ink" cx="1260" cy="620" r="8"/></g>
<text class="m" x="1260" y="790" font-size="22" text-anchor="middle">YOU QUIETLY STEER</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stay calm and curious.</text>
<text class="b" x="120" y="176" font-size="32">Gentle tone. Real curiosity. Then silence.</text>
<g id="face"><circle class="s-ink" cx="340" cy="450" r="120" fill="none" stroke-width="7"/><path class="s-ink" d="M285 420q15 12 30 0M365 420q15 12 30 0" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-gain" d="M280 490q60 40 120 0" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="340" y="640" font-size="22" text-anchor="middle">GENTLE AND CURIOUS</text></g>
<g id="clk"><circle class="s-ink" cx="800" cy="450" r="120" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g><line id="hand" class="s-gain" x1="800" y1="450" x2="800" y2="360" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="800" cy="450" r="10"/><text class="m" x="800" y="640" font-size="22" text-anchor="middle">ASK, THEN PAUSE</text></g>
<g id="room"><rect class="s-line" x="1090" y="390" width="300" height="120" rx="60" fill="none" stroke-width="5"/><circle id="rd0" class="gain" cx="1180" cy="450" r="14"/><circle id="rd1" class="gain" cx="1240" cy="450" r="14"/><circle id="rd2" class="gain" cx="1300" cy="450" r="14"/><text class="m" x="1240" y="640" font-size="22" text-anchor="middle">ROOM TO ANSWER</text></g>
<g id="guide"><text class="d" x="120" y="780" font-size="44">The one asking the questions <tspan style="fill:var(--gain)">guides the talk.</tspan></text></g>
</g>

<g id="s8" opacity="0">
<g id="qcirc"><circle class="gain" cx="1340" cy="250" r="70"/><text class="d" x="1340" y="282" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Skip the yes or no.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Ask: <tspan style="fill:var(--gain)">“How am I supposed</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">to do that?”</text></g>
<g id="listen"><text class="m" x="143" y="700" font-size="26">THEN LISTEN CLOSELY TO WHAT COMES BACK</text><path class="s-gain" d="M1424 220q22 30 0 60M1446 200q36 50 0 100" fill="none" stroke-width="6" stroke-linecap="round"/></g>
</g>