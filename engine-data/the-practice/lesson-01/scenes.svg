<circle class="ink" cx="480" cy="480" r="36"/>
<path class="ink" d="M420 600v-30a60 60 0 0 1 120 0v30z"/>
<rect class="s-ink" x="640" y="410" width="200" height="190" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="740" y="660" font-size="20" text-anchor="middle">A BLANK PAGE</text>
</g>
<g id="cloud"><circle class="loss" cx="450" cy="280" r="45" fill-opacity=".3"/><circle class="loss" cx="510" cy="260" r="55" fill-opacity=".3"/><circle class="loss" cx="575" cy="285" r="42" fill-opacity=".3"/></g>
<path id="bolt" class="gain" d="M525 318L485 384H515L492 436L545 368H515L540 318Z"/>
<g id="born">
<g id="bornF"></g>
<circle cx="1350" cy="414" r="24" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="6 6"/>
<text class="m" x="1150" y="670" font-size="20" text-anchor="middle">BORN WITH IT</text>
<text class="m" x="1350" y="670" font-size="20" text-anchor="middle">BORN WITHOUT</text>
</g>
<g id="either"><text class="d" x="120" y="810" font-size="44">Either you have the spark, or you don't.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A comfortable excuse.</text>
<g id="s2sub"><text class="b" x="120" y="176" font-size="32">Seth Godin: this belief is a story we tell ourselves.</text></g>
<g id="shieldG">
<path class="loss s-loss" d="M400 260L570 310V470C570 590 490 670 400 710C310 670 230 590 230 470V310Z" fill-opacity=".15" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="400" y="470" font-size="22" text-anchor="middle">I'M JUST NOT</text>
<text class="m" x="400" y="504" font-size="22" text-anchor="middle">CREATIVE</text>
<text class="m" x="400" y="760" font-size="20" text-anchor="middle">IT LETS US OFF THE HOOK</text>
</g>
<g id="sofaG">
<rect x="820" y="440" width="560" height="150" rx="30" fill="var(--line)"/>
<rect class="s-ink" x="800" y="570" width="600" height="80" rx="20" fill="var(--stage)" stroke-width="6"/>
<g id="sofaP"></g>
<rect class="ink" x="780" y="520" width="60" height="130" rx="20"/><rect class="ink" x="1360" y="520" width="60" height="130" rx="20"/>
<path class="s-ink" d="M830 650v36M1370 650v36" stroke-width="8" stroke-linecap="round"/>
<g id="zz"><text class="d5" x="1160" y="420" font-size="36" style="fill:var(--muted)">z z</text></g>
<text class="m" x="1100" y="740" font-size="20" text-anchor="middle">NEVER HAVE TO TRY</text>
</g>
<g id="nofail"><text class="d" x="120" y="830" font-size="46">And if we never try, we can never fail.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Skill beats talent.</text>
<g id="s3sub"><text class="b" x="120" y="176" font-size="32">Godin draws a clear line between talent and skill.</text></g>
<path class="s-line" d="M800 240V760" stroke-width="4" stroke-dasharray="10 10"/>
<g id="talG">
<text class="m" x="160" y="270" font-size="24">TALENT</text>
<rect x="340" y="380" width="240" height="40" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="12 10"/>
<rect x="360" y="420" width="200" height="160" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="12 10"/>
<path d="M460 380v200M460 380c-40-50-80-10-40 0M460 380c40-50 80-10 40 0" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="460" y="650" font-size="20" text-anchor="middle">WHAT YOU SUPPOSEDLY</text>
<text class="m" x="460" y="680" font-size="20" text-anchor="middle">START WITH</text>
</g>
<g id="ladG">
<text class="m" x="860" y="270" font-size="24" style="fill:var(--gain)">SKILL</text>
<path class="s-ink" d="M1060 760V300M1200 760V300" stroke-width="8" stroke-linecap="round"/>
<g id="rungs"></g>
<g id="climbW"></g>
</g>
<g id="any3"><g id="crowd3"></g><text class="d" x="120" y="830" font-size="42">Skill is open to anyone willing to practice.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not just for artists.</text>
<g id="s4sub"><text class="b" x="120" y="176" font-size="32">Creativity is bringing something new into the world to make things better.</text></g>
<g id="card0">
<rect class="s-line" x="120" y="230" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<ellipse class="s-ink" cx="310" cy="410" rx="130" ry="95" fill="var(--stage)" stroke-width="6"/>
<circle class="gain" cx="250" cy="370" r="16"/><circle class="loss" cx="310" cy="350" r="16"/><circle class="ink" cx="370" cy="370" r="16"/><circle cx="240" cy="440" r="16" fill="var(--muted)"/>
<circle class="s-ink" cx="330" cy="455" r="18" fill="var(--stage)" stroke-width="4"/>
