<rect class="ink" x="240" y="320" width="480" height="40" rx="12"/>
<text class="m" x="270" y="690" font-size="22" text-anchor="middle">AUTONOMY</text>
<text class="m" x="480" y="690" font-size="22" text-anchor="middle">MASTERY</text>
</g></g>
<g id="cmp"><circle class="s-ink" cx="480" cy="250" r="44" fill="var(--stage)" stroke-width="6"/><path id="ndl" class="gain" d="M480 214l12 36-12 36-12-36z"/></g>
