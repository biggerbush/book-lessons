<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Oreo blackout.</text>
<text class="b" x="120" y="176" font-size="32">Super Bowl, 2013: mid-game, the stadium lights went out.</text>
<g id="std"><path class="s-ink" d="M150 500Q410 420 670 500L620 660Q410 710 200 660Z" fill="none" stroke-width="6" stroke-linejoin="round"/><ellipse id="field" cx="410" cy="570" rx="170" ry="45" fill="var(--gain)" stroke="var(--ink)" stroke-width="4"/><g id="tow"></g></g>
<g id="lo"><text class="m" x="410" y="740" font-size="24" text-anchor="middle" style="fill:var(--loss)">LIGHTS OUT</text></g>
<g id="tw"><rect class="s-ink" x="780" y="240" width="420" height="400" rx="20" fill="var(--stage)" stroke-width="4"/><circle class="ink" cx="830" cy="290" r="22"/><rect class="ink" x="866" y="278" width="160" height="14" rx="7"/><rect x="866" y="300" width="100" height="10" rx="5" fill="var(--line)"/>
<circle class="ink" cx="990" cy="450" r="95"/><path d="M990 355a95 95 0 0 0 0 190z" fill="var(--stage)" fill-opacity=".55"/>
<text class="m" x="990" y="600" font-size="20" text-anchor="middle">DUNKING IN THE DARK</text></g>
<g id="rt"></g>
<g id="mil"><text class="d" x="120" y="800" font-size="40">It joined a moment millions were already talking about.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be fast. Be fitting.</text>
<text class="b" x="120" y="176" font-size="32">A conversation that is hot now is cold tomorrow.</text>
