<g id="s0">
<text class="m" x="120" y="150" font-size="28">JAB, JAB, JAB, RIGHT HOOK · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Facebook: earn your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">place in the feed.</text>
<text class="b" x="120" y="600" font-size="32">Why every Facebook post has to earn its spot.</text>
<g id="ph0"><rect class="s-ink" x="1180" y="220" width="260" height="520" rx="36" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="1270" y="234" width="80" height="10" rx="5"/><g id="ph0c"></g></g>
<g id="nope"><path class="s-loss" d="M1270 380L1350 460M1350 380L1270 460" stroke-width="9" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The algorithm is the gatekeeper.</text>
<text class="b" x="120" y="176" font-size="32">More posts wait than anyone could scroll through.</text>
<g id="stkL"><text class="m" x="140" y="250" font-size="22">YOUR BRAND</text></g>
<g id="gate"><text class="m" x="800" y="244" font-size="22" text-anchor="middle">ALGORITHM</text><rect class="loss" x="780" y="260" width="40" height="200" rx="6"/><rect class="loss" x="780" y="560" width="40" height="200" rx="6"/><path class="s-loss" d="M770 510Q800 485 830 510Q800 535 770 510Z" fill="none" stroke-width="4"/><circle class="loss" cx="800" cy="510" r="8"/></g>
<g id="fans1"><text class="m" x="1220" y="360" font-size="22">YOUR FANS</text></g>
<g id="stk"></g>
<g id="hide1"><text class="d" x="120" y="830" font-size="40">Only a few get through. The rest stay hidden.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">EdgeRank weighed three things.</text>
<text class="b" x="120" y="176" font-size="32">Facebook’s filter when Gary wrote the book.</text>
<g id="pf0"><rect class="s-line" x="120" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="20">01</text><text class="d5" x="150" y="350" font-size="44">Affinity</text></g>
<g id="pf1"><rect class="s-line" x="580" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="610" y="290" font-size="20">02</text><text class="d5" x="610" y="350" font-size="44">Type</text></g>
<g id="pf2"><rect class="s-line" x="1040" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1070" y="290" font-size="20">03</text><text class="d5" x="1070" y="350" font-size="44">Time</text></g>
<g id="pd0"><circle class="gain" cx="230" cy="520" r="50"/><text class="m" x="230" y="529" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">YOU</text><g id="aff"></g><text class="m" x="150" y="700" font-size="20">HOW OFTEN THEY</text><text class="m" x="150" y="730" font-size="20">INTERACT WITH YOU</text></g>
<g id="pd1"><path class="ink" d="M800 520L770 610H830Z"/><g id="scl"></g><text class="m" x="610" y="700" font-size="20">COMMENTS AND SHARES</text><text class="m" x="610" y="730" font-size="20">COUNT MORE THAN LIKES</text></g>
<g id="pd2"><circle class="s-ink" cx="1260" cy="500" r="100" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g><line id="hh" class="s-ink" x1="1260" y1="500" x2="1260" y2="450" stroke-width="8" stroke-linecap="round"/><line id="hm" class="s-gain" x1="1260" y1="500" x2="1260" y2="420" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1260" cy="500" r="9"/><text class="m" x="1070" y="700" font-size="20">FRESH POSTS</text><text class="m" x="1070" y="730" font-size="20">BEAT STALE ONES</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Engagement snowballs.</text>
<text class="b" x="120" y="176" font-size="32">Each post affects the reach of the next one.</text>
<g id="sbTl"><text class="m" x="120" y="270" font-size="22" style="fill:var(--gain)">PEOPLE LIKE, COMMENT, SHARE</text><path class="s-line" d="M220 400H1160" stroke-width="4" stroke-dasharray="10 10"/></g>
<g id="sbT"></g>
<g id="sbTr"><text class="m" x="1260" y="410" font-size="22" style="fill:var(--gain)">MORE REACH</text></g>
<g id="sbBl"><text class="m" x="120" y="560" font-size="22" style="fill:var(--loss)">PEOPLE IGNORE YOU</text><path class="s-line" d="M220 680H1160" stroke-width="4" stroke-dasharray="10 10"/></g>
<g id="sbB"></g>
<g id="sbBr"><text class="m" x="1260" y="690" font-size="22" style="fill:var(--loss)">LESS REACH</text></g>
<g id="behind"><text class="d" x="120" y="830" font-size="40">Your next post starts from behind.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The feed is not a billboard.</text>
<text class="b" x="120" y="176" font-size="32">Nonstop sales pitches get scrolled right past.</text>
<g id="bb"><path class="s-ink" d="M240 500V640M540 500V640" stroke-width="8" stroke-linecap="round"/><rect class="s-loss" x="140" y="250" width="500" height="250" rx="8" fill="var(--stage)" stroke-width="8"/><text class="d" x="390" y="400" font-size="80" text-anchor="middle" style="fill:var(--loss)">BUY NOW!</text><text class="m" x="390" y="452" font-size="22" text-anchor="middle">SALE · SALE · SALE</text></g>
<g id="ph4"><rect class="s-ink" x="760" y="230" width="260" height="470" rx="32" fill="var(--stage)" stroke-width="7"/><g id="feed4"></g></g>
<g id="swipe"><path class="s-muted" d="M1060 560V380m-18 18 18-18 18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ch4"><text class="m" x="1140" y="285" font-size="20">YOUR REACH</text><path class="s-ink" d="M1120 300V640H1460" fill="none" stroke-width="5" stroke-linecap="round"/><path id="rch" class="s-loss" d="M1130 340C1250 360 1320 520 1450 610" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="bad"><text class="d" x="120" y="790" font-size="48">A bad post is not neutral.</text></g>
<g id="cost"><text class="m" x="120" y="845" font-size="24" style="fill:var(--loss)">IT COSTS YOU TOMORROW’S AUDIENCE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Earn your place in the feed.</text>
<text class="b" x="120" y="176" font-size="32">Would it feel at home next to a friend’s photo?</text>
<g id="fc"><rect class="s-line" x="140" y="230" width="560" height="280" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="ink" cx="190" cy="272" r="20"/><text class="m" x="226" y="279" font-size="20">A FRIEND</text><rect x="170" y="305" width="500" height="180" rx="8" fill="var(--muted)" fill-opacity=".18"/><path class="ink" d="M190 485L330 360L420 440L500 380L650 485Z" fill-opacity=".6"/><circle class="gain" cx="600" cy="345" r="22"/></g>
<g id="yc"><rect class="s-gain" x="140" y="540" width="560" height="300" rx="16" fill="var(--stage)" stroke-width="4"/><circle class="gain" cx="190" cy="582" r="20"/><text class="m" x="226" y="589" font-size="20">YOUR BRAND</text><rect x="170" y="612" width="500" height="150" rx="8" fill="var(--muted)" fill-opacity=".18"/>
<g id="lf"><circle class="gain" cx="420" cy="687" r="52"/><path d="M392 676q8-12 16 0M432 676q8-12 16 0" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/><path d="M392 696q28 34 56 0z" fill="var(--on-gain)"/></g>
<rect id="tb1" class="ink" x="170" y="782" width="500" height="14" rx="7"/><rect id="tb2" x="170" y="808" width="420" height="14" rx="7" fill="var(--line)"/></g>
<text class="m" x="820" y="280" font-size="22">BEFORE YOU POST</text>
<g id="ck0"><circle class="gain" cx="840" cy="349" r="22"/><path d="M829 349l8 8 14-15" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="880" y="360" font-size="32">Their interests, not your pitch.</text></g>
<g id="ck1"><circle class="gain" cx="840" cy="489" r="22"/><path d="M829 489l8 8 14-15" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="880" y="500" font-size="32">Funny, useful or surprising.</text></g>
<g id="ck2"><circle class="gain" cx="840" cy="629" r="22"/><path d="M829 629l8 8 14-15" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="880" y="640" font-size="32">Short words, strong image.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pay to amplify what works.</text>
<text class="b" x="120" y="176" font-size="32">Money is a megaphone, not a fix.</text>
