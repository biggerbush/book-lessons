</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Vague versus written.</text>
<g id="bf"><rect x="120" y="230" width="620" height="500" rx="18" fill="var(--stage)" class="s-line" stroke-width="3"/>
<text class="m" x="160" y="290" font-size="22">VAGUE UNHAPPINESS</text><g id="fog"></g>
<text class="d" x="430" y="500" font-size="90" text-anchor="middle" style="fill:var(--muted)">?</text>
<text class="d5" x="160" y="690" font-size="40" style="fill:var(--muted)">Easy to ignore.</text></g>
<g id="pp"><rect x="860" y="230" width="620" height="500" rx="18" fill="var(--stage)" class="s-line" stroke-width="3"/>
<text class="m" x="900" y="290" font-size="22" style="fill:var(--gain)">A WRITTEN TRUTH</text>
<rect class="gain" x="1020" y="330" width="300" height="260" rx="8"/><g id="pl"></g>
<g id="pen"><path class="ink" d="M0 0l-9-22v-90h18v90z"/></g>
<text class="d5" x="900" y="690" font-size="40">Hard to dodge.</text></g>
<g id="mor"><text class="d" x="120" y="815" font-size="44">Put it where you see it every morning.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build your own mirror.</text>
<text class="b" x="120" y="176" font-size="32">This week: name it, want it, step toward it.</text>
<g id="ym"><rect x="140" y="220" width="1320" height="600" rx="24" fill="var(--ice)" class="s-ink" stroke-width="7"/></g>
