<g id="tag"><g id="tagr"><path class="s-ink" d="M970 320L930 370M970 320L1010 370" stroke-width="3"/><rect class="ink" x="900" y="370" width="140" height="50" rx="8"/><text class="m" x="970" y="403" font-size="22" text-anchor="middle" style="fill:var(--stage)">POLITE</text></g><circle class="ink" cx="970" cy="320" r="6"/></g>
<g id="cc"><text class="d" x="120" y="810" font-size="48">They chose comfort over clarity.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hidden cost of hints.</text>
<text class="b" x="120" y="176" font-size="32">Picture a colleague whose work keeps missing the mark.</text>
