<text class="m" x="1090" y="705" font-size="20">HELPING · LEARNING · GROWING</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A surprising result.</text>
<text class="b" x="120" y="176" font-size="32">What happened when the graduates reached their goals.</text>
