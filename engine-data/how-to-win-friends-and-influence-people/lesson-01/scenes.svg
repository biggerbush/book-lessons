<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Don’t criticize,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">condemn or complain.</text>
<text class="b" x="120" y="600" font-size="32">Why criticism backfires, and what works better instead.</text>
<g id="tb"><rect x="1200" y="260" width="260" height="140" rx="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path d="M1262 398l-6 52 54-52" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><path class="s-loss" d="M1230 350l30-40 30 40 30-40 30 40 30-40 30 40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="tp"></g>
<g id="tc"><rect x="1400" y="460" width="80" height="60" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d" x="1440" y="503" font-size="34" text-anchor="middle" style="fill:var(--loss)">!?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The urge to scold.</text>
<text class="b" x="120" y="176" font-size="32">Someone lets you down. Your instinct: point out what they did wrong.</text>
<g id="you1"></g>
<text class="m" x="380" y="670" font-size="20" text-anchor="middle">YOU</text>
<g id="cw"><g id="cwf"></g><g transform="rotate(12 1330 605)"><rect x="1290" y="560" width="80" height="90" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-loss" d="M1310 585l40 40M1350 585l-40 40" stroke-width="7" stroke-linecap="round"/></g><text class="m" x="1180" y="670" font-size="20" text-anchor="middle">COWORKER</text></g>
<g id="pt"><path id="arm" class="s-ink" fill="none" stroke-width="16" stroke-linecap="round"/><circle id="hand" class="ink" r="20" cy="560"/></g>
<g id="fs"><text class="m" x="200" y="730" font-size="22">IT FEELS FAIR</text><text class="m" x="200" y="770" font-size="22" style="fill:var(--gain)">IT FEELS SATISFYING</text></g>
<g id="qm"><text class="d" x="760" y="420" font-size="220" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="qq"><text class="d" x="120" y="840" font-size="46">Does it ever actually work?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody feels guilty.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie’s story of Two Gun Crowley, a cornered killer.</text>
<g id="k0"><rect class="s-line" x="120" y="220" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><rect x="237" y="320" width="180" height="340" fill="none" stroke="var(--ink)" stroke-width="6"/><g id="win"></g><circle id="sr0" cx="190" cy="690" r="13"/><circle id="sr1" cx="464" cy="690" r="13"/><text class="m" x="327" y="770" font-size="20" text-anchor="middle">CORNERED IN NEW YORK</text></g>
<g id="k1"><rect class="s-line" x="593" y="220" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><rect x="690" y="270" width="220" height="370" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="hw"></g><path class="gain" d="M800 610c-60-40-60-80-30-85c15-3 25 7 30 17c5-10 15-20 30-17c30 5 30 45-30 85z"/><text class="m" x="800" y="770" font-size="20" text-anchor="middle">“A KIND HEART”</text></g>
<g id="k2"><rect class="s-line" x="1066" y="220" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><g id="crw"></g><g id="bars"></g><path class="s-ink" d="M1120 270h306M1120 640h306" stroke-width="10" stroke-linecap="round"/><text class="m" x="1273" y="770" font-size="20" text-anchor="middle">“ONLY DEFENDING MYSELF”</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why criticism backfires.</text>
<text class="b" x="120" y="176" font-size="32">It almost never changes behaviour.</text>
<g id="vic"></g>
<g id="hrt" transform="translate(900 562)"><path id="hrtP" d="M0 30c-36-24-36-50-18-53c9-2 15 4 18 10c5-6 9-12 18-10c18 3 18 29-18 53z" fill="var(--gain)"/><path id="crk" d="M0 -13l-8 12 10 9-8 10 6 12" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cldw"><g id="cld"><circle class="loss" cx="860" cy="300" r="40"/><circle class="loss" cx="910" cy="280" r="50"/><circle class="loss" cx="960" cy="305" r="36"/><rect class="loss" x="840" y="300" width="140" height="40" rx="20"/><path class="s-gain" d="M915 336l-14 18h16l-12 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="sh"><path class="gain" d="M720 430q50-20 100 0v90q0 70-50 110q-50-40-50-110z"/></g>
<g id="arw"><path class="s-loss" d="M-200 0H0m-26-20 26 20-26 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="l0"><text class="d5" x="1060" y="420" font-size="40">Defensive</text></g>
<g id="l1"><text class="d5" x="1060" y="510" font-size="40">Wounded pride</text></g>
<g id="l2"><text class="d5" x="1060" y="600" font-size="40" style="fill:var(--loss)">Lasting resentment</text></g>
<g id="dig"><path class="s-ink" d="M640 640H1000" stroke-width="6" stroke-linecap="round"/><text class="d" x="120" y="800" font-size="46">So people dig in and justify themselves.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lincoln’s angry letter.</text>
<text class="b" x="120" y="176" font-size="32">After Gettysburg, Lee’s army was retreating south.</text>
<rect class="s-line" x="120" y="220" width="780" height="580" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="260" font-size="20">GETTYSBURG</text>
<g id="riv"><path class="s-loss" d="M120 620q100-30 195 0t195 0t195 0t195 0" fill="none" stroke-width="44" stroke-opacity=".35"/><text class="m" x="560" y="690" font-size="20">FLOODED RIVER</text></g>
<g id="lee"><g id="leeS"></g><text class="m" x="0" y="-34" font-size="20" text-anchor="middle">LEE</text></g>
<g id="mea"><g transform="translate(700 330)"><g id="meaS"></g><text class="m" x="0" y="-34" font-size="20" text-anchor="middle">MEADE</text></g></g>
<g id="mq"><text class="d" x="770" y="350" font-size="64" style="fill:var(--loss)">?</text></g>
<g id="lin"></g>
<g id="ord"><path class="s-ink" d="M1060 440L780 340" fill="none" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="930" y="260" font-size="20">ATTACK AT ONCE</text></g>
<g id="ltr"><rect x="1240" y="440" width="200" height="240" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-loss" d="M1265 490l20-10 20 10 20-10 20 10 20-10 20 10 20-10M1265 540l20-10 20 10 20-10 20 10 20-10 20 10 20-10M1265 590l20-10 20 10 20-10 20 10 20-10M1265 640l20-10 20 10 20-10" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1240" y="730" font-size="20">A BITTER LETTER</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The letter never sent.</text>
<g id="lt5"><rect x="430" y="380" width="140" height="100" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-loss" d="M450 410h100M450 435h100M450 460h60" stroke-width="5" stroke-linecap="round"/></g>
<rect class="ink" x="160" y="560" width="540" height="24" rx="6"/>
<rect class="ink" x="180" y="584" width="20" height="176"/><rect class="ink" x="660" y="584" width="20" height="176"/>
<rect x="380" y="584" width="240" height="66" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<g id="ns"><text class="m" x="500" y="624" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEVER SENT</text></g>
<g id="lin5"></g>
<g id="fnd"><text class="m" x="160" y="810" font-size="20">FOUND AMONG HIS PAPERS AFTER HIS DEATH</text></g>
<g id="tcl"><circle class="s-ink" cx="850" cy="372" r="8" fill="none" stroke-width="4"/><circle class="s-ink" cx="878" cy="338" r="13" fill="none" stroke-width="4"/><ellipse class="s-ink" cx="1170" cy="400" rx="270" ry="160" fill="var(--stage)" stroke-width="6"/><text class="m" x="1170" y="340" font-size="24" text-anchor="middle">IN MEADE’S PLACE</text><path class="s-line" d="M970 490H1370" stroke-width="5"/><g id="crs"></g></g>
<g id="too"><text class="d" x="760" y="680" font-size="44">Perhaps he would have</text><text class="d" x="760" y="740" font-size="44" style="fill:var(--gain)">hesitated too.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Understand instead.</text>
<text class="b" x="120" y="176" font-size="32">Understanding people does far more good than condemning them.</text>
<g id="scl"><path class="s-ink" d="M520 280V640" stroke-width="10"/><rect class="ink" x="400" y="636" width="240" height="22" rx="6"/><path id="beam" class="s-ink" d="M260 280H780" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="520" cy="280" r="14"/>
<g id="panL"><path class="s-ink" d="M0 0L-70 140M0 0L70 140" stroke-width="4"/><rect class="loss" x="-20" y="110" width="40" height="30" rx="4"/><path class="ink" d="M-90 140a90 36 0 0 0 180 0z"/><text class="m" x="0" y="210" font-size="18" text-anchor="middle" style="fill:var(--loss)">CONDEMN</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-70 140M0 0L70 140" stroke-width="4"/><rect class="gain" x="-45" y="80" width="90" height="60" rx="6"/><path class="ink" d="M-90 140a90 36 0 0 0 180 0z"/><text class="m" x="0" y="210" font-size="18" text-anchor="middle" style="fill:var(--gain)">UNDERSTAND</text></g></g>
<g id="oh"><rect x="960" y="250" width="280" height="100" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="1100" y="320" font-size="56" text-anchor="middle">Why?</text><path class="s-ink" d="M940 520q60 70 140 30M1260 520q-60 70-140 30" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<g id="rsn"></g>
<g id="rl"><text class="m" x="900" y="640" font-size="20">REASONS THAT MAKE SENSE TO THEM</text></g>
<g id="qt"><rect class="gain" x="120" y="680" width="1360" height="130" rx="18"/><text class="d" x="160" y="735" font-size="38" style="fill:var(--on-gain)">“Any fool can criticize, condemn and complain,</text><text class="d" x="160" y="788" font-size="38" style="fill:var(--on-gain)">and most fools do.”</text><text class="m" x="1440" y="786" font-size="20" text-anchor="end" style="fill:var(--on-gain)">DALE CARNEGIE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write your own unsent letter.</text>
<text class="b" x="120" y="176" font-size="32">Next time you feel the urge to criticize.</text>
<g id="q0"><rect class="s-line" x="120" y="230" width="414" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="327" cy="420" r="100"/><rect x="300" y="375" width="22" height="90" rx="4" fill="var(--on-gain)"/><rect x="332" y="375" width="22" height="90" rx="4" fill="var(--on-gain)"/><text class="d5" x="156" y="610" font-size="44">Pause</text><text class="m" x="156" y="660" font-size="20">BEFORE YOU SPEAK</text></g>
<g id="q1"><rect class="s-line" x="593" y="230" width="414" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><rect x="700" y="310" width="200" height="220" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="nbl"></g><g id="stp"><rect x="740" y="470" width="120" height="40" fill="none" stroke="var(--loss)" stroke-width="4"/><text class="m" x="800" y="497" font-size="20" text-anchor="middle" style="fill:var(--loss)">UNSENT</text></g><text class="d5" x="629" y="610" font-size="44">Write it down</text><text class="m" x="629" y="660" font-size="20">JUST AS LINCOLN DID</text></g>
<g id="q2"><rect class="s-line" x="1066" y="230" width="414" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><circle class="s-ink" cx="1273" cy="420" r="100" fill="none" stroke-width="7"/><text class="d" x="1273" y="462" font-size="120" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="1102" y="610" font-size="44">Ask why</text><text class="m" x="1102" y="660" font-size="20">WHAT LED THEM TO IT?</text></g>
</g>

<g id="s8" opacity="0">
<g id="cal"><rect x="1255" y="200" width="220" height="175" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><rect class="gain" x="1255" y="200" width="220" height="44" rx="12"/><text class="m" x="1365" y="230" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">ONE WEEK</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">For one week,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">catch every criticism.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Ask one honest question.</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">ABOUT THE OTHER PERSON’S SIDE</text></g>
</g>