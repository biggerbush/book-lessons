<g id="concl"><text class="m" x="470" y="320" font-size="22">SAME SHIFT.</text><text class="m" x="470" y="352" font-size="22">SAME UNCOMFORTABLE</text><text class="m" x="470" y="384" font-size="22" style="fill:var(--loss)">CONCLUSION.</text></g>
