<text class="d" x="850" y="430" font-size="60" text-anchor="middle">$</text>
<rect class="s-ink" x="600" y="500" width="300" height="140" rx="12" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="630" y="542" font-size="22">TITLE</text>
