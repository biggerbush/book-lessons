<g id="s0">
<text class="m" x="120" y="150" font-size="28">INFLUENCE: THE PSYCHOLOGY OF PERSUASION · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Commitment and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">consistency.</text>
<text class="b" x="120" y="600" font-size="32">How one small yes can quietly lead to a much bigger one.</text>
<path class="s-ink" d="M990 540H1480" stroke-width="6" stroke-linecap="round"/>
<path class="ink" d="M1285 420L1375 340L1465 420Z"/>
<rect class="s-ink" x="1300" y="420" width="150" height="120" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1355" y="480" width="40" height="60"/>
<g id="tbill"><path class="s-ink" d="M1040 490v50M1160 490v50" stroke-width="8" stroke-linecap="round"/><rect class="s-ink" x="1000" y="340" width="200" height="150" rx="6" fill="var(--stage)" stroke-width="6"/><text class="d" x="1020" y="405" font-size="40" transform="rotate(-5 1020 405)" style="fill:var(--loss)">DRIVE</text><text class="d" x="1018" y="462" font-size="26" transform="rotate(3 1018 462)" style="fill:var(--loss)">CAREFULLY</text></g>
<g id="tsmall"><g id="tsb"><path class="s-ink" d="M1255 540v-18" stroke-width="5"/><rect class="gain" x="1235" y="500" width="40" height="24" rx="4"/></g><text class="m" x="1255" y="574" font-size="20" text-anchor="middle" style="fill:var(--gain)">YES</text><path id="tarc" class="s-gain" d="M1258 492Q1275 330 1180 326" fill="none" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bet first, then feel sure.</text>
<text class="b" x="120" y="176" font-size="32">Bettors at a horse race, right after placing their bets.</text>
<g id="trk"><ellipse class="s-ink" cx="420" cy="480" rx="280" ry="160" fill="none" stroke-width="7"/><ellipse class="s-line" cx="420" cy="480" rx="200" ry="90" fill="none" stroke-width="5"/><text class="m" x="420" y="488" font-size="20" text-anchor="middle">RACETRACK</text><circle id="horse" class="gain" r="22"/></g>
<g id="tkt"><rect class="s-ink" x="780" y="300" width="300" height="140" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-muted" d="M860 312v116" stroke-width="3" stroke-dasharray="6 6"/><text class="m" x="820" y="378" font-size="22" text-anchor="middle">BET</text><text class="d5" x="880" y="365" font-size="34">My horse</text><text class="m" x="880" y="405" font-size="20" style="fill:var(--gain)">TO WIN</text></g>
<g id="bars"><text class="m" x="1160" y="300" font-size="20">HOW SURE THEY FELT</text><rect x="1160" y="550" width="110" height="150" fill="var(--line)"/><rect id="ba" class="gain" x="1330" width="110"/><path class="s-ink" d="M1140 700H1460" stroke-width="5"/><text class="m" x="1215" y="740" font-size="20" text-anchor="middle">BEFORE</text><text class="m" x="1385" y="740" font-size="20" text-anchor="middle" style="fill:var(--gain)">AFTER</text></g>
<g id="n1"><text class="d" x="120" y="810" font-size="48">Same horse.</text></g>
<g id="n2"><text class="d" x="480" y="810" font-size="48" style="fill:var(--gain)">Only the commitment changed.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Consistency is a shortcut.</text>
<text class="b" x="120" y="176" font-size="32">We admire people whose words match their actions.</text>
<g id="wm"><rect class="s-ink" x="120" y="250" width="240" height="90" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="240" y="304" font-size="24" text-anchor="middle">WORDS</text><text class="d" x="410" y="318" font-size="64" text-anchor="middle" style="fill:var(--gain)">=</text><rect class="s-ink" x="460" y="250" width="240" height="90" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="580" y="304" font-size="24" text-anchor="middle">ACTIONS</text><g id="adm"></g><text class="m" x="410" y="620" font-size="20" text-anchor="middle">WE ADMIRE THIS</text></g>
<g id="ap"><path class="s-line" d="M860 480L1440 360M860 480L1440 600" stroke-width="5" stroke-dasharray="12 10" fill="none"/><path class="s-gain" d="M860 480H1440" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="860" cy="480" r="20"/><text class="m" x="860" y="540" font-size="20" text-anchor="middle">DECIDE</text><circle id="run" class="ink" cy="480" r="15" stroke="var(--stage)" stroke-width="4"/><text class="m" x="1300" y="516" font-size="20" text-anchor="middle" style="fill:var(--gain)">AUTOPILOT</text><g id="thk"><rect class="s-line" x="1060" y="240" width="260" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="1190" y="283" font-size="22" text-anchor="middle">THINKING</text></g><g id="thks"><path class="s-loss" d="M1346 255l40 40M1386 255l-40 40" fill="none" stroke-width="7" stroke-linecap="round"/></g></g>
<g id="stop"><text class="d" x="120" y="810" font-size="44">Once we decide, we stop thinking.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two groups, one big ask.</text>
<text class="b" x="120" y="176" font-size="32">A study in a residential neighborhood.</text>
<g id="nb"><g id="hs"></g><g id="res"></g></g>
<g id="bill"><text class="m" x="1000" y="232" font-size="20">THE BIG ASK</text><path class="s-ink" d="M1080 430v40M1400 430v40M980 470H1480" stroke-width="7" stroke-linecap="round"/><rect class="s-ink" x="1000" y="250" width="480" height="180" rx="6" fill="var(--stage)" stroke-width="6"/><text class="d" x="1030" y="335" font-size="54" transform="rotate(-4 1030 335)" style="fill:var(--loss)">DRIVE</text><text class="d" x="1100" y="405" font-size="46" transform="rotate(3 1100 405)" style="fill:var(--loss)">CAREFULLY</text></g>
<g id="pa"><circle cx="300" cy="650" r="110" fill="var(--line)"/><path id="sl17" class="gain"/><text id="v17" class="d" x="450" y="680" font-size="96">17%</text><text class="m" x="456" y="725" font-size="20" style="fill:var(--gain)">AGREED</text><text class="m" x="456" y="760" font-size="20">MOST REFUSED</text></g>
<g id="ss"><text class="m" x="1000" y="560" font-size="20">ANOTHER GROUP, FIRST:</text><path class="s-ink" d="M1150 680v80M1040 760H1260" stroke-width="6" stroke-linecap="round"/><rect class="gain" x="1070" y="600" width="160" height="80" rx="6"/><text class="m" x="1150" y="634" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">BE A SAFE</text><text class="m" x="1150" y="660" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">DRIVER</text><text class="m" x="1260" y="650" font-size="20" style="fill:var(--gain)">3-INCH SIGN</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then came the big yes.</text>
<text class="b" x="120" y="176" font-size="32">Two weeks later, the same giant billboard.</text>
<g id="pb"><circle cx="230" cy="470" r="80" fill="var(--line)"/><path id="sl17s" class="gain"/><text class="d" x="230" y="600" font-size="40" text-anchor="middle">17%</text><text class="m" x="230" y="632" font-size="18" text-anchor="middle">NO SMALL SIGN</text><circle cx="520" cy="460" r="150" fill="var(--line)"/><path id="sl76" class="gain"/><text id="v76" class="d" x="520" y="700" font-size="72" text-anchor="middle" style="fill:var(--gain)">76%</text><text class="m" x="520" y="740" font-size="18" text-anchor="middle">SMALL SIGN FIRST</text></g>
<g id="mir"><text class="m" x="1240" y="228" font-size="18" text-anchor="middle">HOW THEY SAW THEMSELVES</text><ellipse class="s-ink" cx="1240" cy="430" rx="130" ry="180" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1240 610v50M1180 660H1300" stroke-width="8" stroke-linecap="round"/><g id="ref0"></g><g id="ref1"></g><g id="vw"></g></g>
<g id="cit"><text class="m" x="1240" y="706" font-size="20" text-anchor="middle" style="fill:var(--gain)">A CITIZEN WHO CARES</text><text class="m" x="1240" y="736" font-size="20" text-anchor="middle" style="fill:var(--gain)">ABOUT SAFE DRIVING</text></g>
<g id="yes"><rect class="gain" x="880" y="300" width="120" height="70" rx="20"/><path class="gain" d="M920 368l10 22 16-22z"/><text class="d" x="940" y="350" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">YES</text></g>
<g id="like"><text class="d" x="120" y="830" font-size="44">People like that say yes.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write it down.</text>
<g id="chips"></g>
<g id="paper"><rect class="s-ink" x="160" y="300" width="360" height="460" rx="8" fill="var(--stage)" stroke-width="6"/><g id="wl"></g><path id="sig" d="M200 690c20-40 40 30 60-10s30-30 40 10 30 10 50-20 40 20 60 0 30-10 40 0" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/><g id="stamp"><g transform="rotate(-8 430 614)"><rect x="360" y="586" width="140" height="56" rx="8" fill="none" stroke="var(--gain)" stroke-width="5"/><text class="m" x="430" y="622" font-size="22" text-anchor="middle" style="fill:var(--gain)">SIGNED</text></g></g><path id="pen" class="gain" d="M0 0l8-26 70-70 18 18-70 70z"/></g>
<g id="proof"><text class="m" x="160" y="810" font-size="22" style="fill:var(--gain)">VISIBLE PROOF OF WHERE WE STAND</text></g>
<g id="ord"><text class="m" x="760" y="380" font-size="22">SOME SALES COMPANIES:</text><g id="slp"></g><text class="m" x="860" y="650" font-size="18" text-anchor="middle">NOT THE SALESPERSON</text><rect class="s-ink" x="1040" y="440" width="180" height="220" rx="8" fill="var(--stage)" stroke-width="5"/><path id="fl" class="s-ink" d="M1070 500h120M1070 540h120M1070 580h80M1080 625l14 14 26-30" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/><g id="cus"></g><path class="s-gain" d="M1340 570L1215 600" stroke-width="7" stroke-linecap="round"/><text class="m" x="1380" y="650" font-size="18" text-anchor="middle" style="fill:var(--gain)">THE CUSTOMER</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The lowball.</text>
<text class="b" x="120" y="176" font-size="32">A car dealer’s tactic.</text>
<g id="car"><path class="s-line" d="M120 620H820" stroke-width="5"/><path class="ink" d="M240 480L300 400H460L530 480Z"/><path d="M300 470L330 420H440L480 470Z" fill="var(--stage)"/><rect class="ink" x="160" y="480" width="440" height="90" rx="24"/><circle class="ink" cx="260" cy="570" r="38" stroke="var(--stage)" stroke-width="8"/><circle class="ink" cx="500" cy="570" r="38" stroke="var(--stage)" stroke-width="8"/></g>
<g id="tag"><path class="s-muted" d="M470 400Q540 320 600 340" fill="none" stroke-width="3"/><path id="tagp" d="M620 300h200v80h-200l-24-40z" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><circle cx="612" cy="340" r="6" fill="var(--ink)"/><text class="d5" x="640" y="350" font-size="28">Great price</text><path id="tags" class="s-loss" d="M634 340h176" stroke-width="5" opacity="0"/></g>
<g id="err"><text class="m" x="620" y="430" font-size="20" style="fill:var(--loss)">“A CALCULATION MISTAKE”</text></g>
<g id="dec"><path class="s-ink" d="M920 700H1480" stroke-width="5"/>
<g id="lb0"><rect x="1135" y="440" width="130" height="260" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="1200" y="560" font-size="18" text-anchor="middle" style="fill:var(--loss)">THE</text><text class="m" x="1200" y="588" font-size="18" text-anchor="middle" style="fill:var(--loss)">BARGAIN</text><text class="m" x="1200" y="628" font-size="18" text-anchor="middle" style="fill:var(--loss)">REMOVED</text></g>
<g id="pc"><rect class="gain" x="1135" y="440" width="130" height="260"/><text class="m" x="1200" y="560" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">THE</text><text class="m" x="1200" y="588" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">BARGAIN</text></g>
<g id="slab"><rect class="ink" x="940" y="360" width="520" height="80" rx="10"/><text class="d" x="1200" y="412" font-size="36" text-anchor="middle" style="fill:var(--stage)">DECISION: BUY</text></g></g>
<g id="p0"><rect class="ink" x="960" y="440" width="110" height="260"/><text class="m" x="1015" y="560" font-size="18" text-anchor="middle" style="fill:var(--stage)">NEW</text><text class="m" x="1015" y="588" font-size="18" text-anchor="middle" style="fill:var(--stage)">REASON</text></g>
<g id="p1"><rect class="ink" x="1330" y="440" width="110" height="260"/><text class="m" x="1385" y="560" font-size="18" text-anchor="middle" style="fill:var(--stage)">NEW</text><text class="m" x="1385" y="588" font-size="18" text-anchor="middle" style="fill:var(--stage)">REASON</text></g>
<g id="lb1"><text class="m" x="1200" y="750" font-size="20" text-anchor="middle" style="fill:var(--gain)">STILL STANDING ON NEW REASONS</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two warning signals.</text>
<g id="w1"><circle class="ink" cx="340" cy="300" r="56"/><path class="ink" d="M200 660V540a140 140 0 0 1 280 0V660z"/><g id="knotw"><g id="knot"><path d="M290 528c30-40 70 40 100 0M290 552c30 40 70-40 100 0" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round"/><circle cx="340" cy="540" r="16" fill="none" stroke="var(--loss)" stroke-width="8"/></g></g></g>
<g id="w1l"><text class="d5" x="120" y="730" font-size="36">A knot in your stomach</text><text class="m" x="120" y="775" font-size="20" style="fill:var(--loss)">WHEN YOU FEEL TRAPPED INTO YES</text></g>
<g id="w2"><g id="hrt" transform="translate(1160 370)"><path class="gain" d="M0 110C-140 20-150-80-75-100C-35-110-10-85 0-62C10-85 35-110 75-100C150-80 140 20 0 110Z"/><text class="d" x="0" y="30" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g><text class="d5" x="860" y="560" font-size="36">Ask your heart of hearts</text></g>
<g id="q2a"><text class="d" x="860" y="630" font-size="34" style="fill:var(--gain)">“Knowing what I know now,</text></g>
<g id="q2b"><text class="d" x="860" y="675" font-size="34" style="fill:var(--gain)">would I make the</text></g>
<g id="q2c"><text class="d" x="860" y="720" font-size="34" style="fill:var(--gain)">same choice again?”</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which yes do you keep</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">only because you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">once</tspan> said it?</text></g>
<g id="cl"><rect class="s-ink" x="1200" y="230" width="240" height="280" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rows"></g><text id="qm" class="d" x="1252" y="385" font-size="34" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="ask"><text class="m" x="143" y="700" font-size="26">ASK THE HEART OF HEARTS QUESTION</text></g>
</g>