<g id="mag"><g id="magI"><circle class="s-ink" cx="0" cy="0" r="70" fill="var(--stage)" fill-opacity=".35" stroke-width="12"/><path class="s-ink" d="M50 50L104 104" stroke-width="20" stroke-linecap="round"/></g></g>
<g id="em"><text class="d5" x="120" y="690" font-size="40">“Everyone we meet is our superior in some way.”</text><text class="m" x="120" y="736" font-size="22">EMERSON’S IDEA</text></g>
<g id="gs"><text class="m" x="120" y="820" font-size="22" style="fill:var(--gain)">THERE IS ALWAYS SOMETHING TRUE AND SPECIFIC TO ADMIRE</text></g>
