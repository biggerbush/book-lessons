<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Pause, let them,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">let me.</text>
<text class="b" x="120" y="600" font-size="32">A four step routine for any moment that stings.</text>
<circle class="s-line" cx="1290" cy="420" r="140" fill="none" stroke-width="18"/>
<circle id="ring" class="s-gain" cx="1290" cy="420" r="140" fill="none" stroke-width="18" stroke-dasharray="880" stroke-dashoffset="880" stroke-linecap="round" transform="rotate(-90 1290 420)"/>
<g id="tdots"></g>
<text class="d" x="1290" y="452" font-size="96" text-anchor="middle">10s</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The moment it stings.</text>
<text class="b" x="120" y="176" font-size="32">Your friends at brunch, without you.</text>
<g id="phoneG">
<rect class="s-ink" x="200" y="230" width="300" height="560" rx="36" fill="var(--stage)" stroke-width="7"/>
<rect class="s-line" x="230" y="290" width="240" height="160" fill="none" stroke-width="3"/>
<g id="brunch"></g>
<circle class="s-muted" cx="440" cy="330" r="14" fill="none" stroke-width="3" stroke-dasharray="5 5"/>
<rect class="ink" x="245" y="396" width="210" height="12"/>
<rect x="230" y="478" width="200" height="14" fill="var(--line)"/>
<rect x="230" y="506" width="150" height="14" fill="var(--line)"/>
<rect x="230" y="560" width="240" height="120" fill="var(--line)" fill-opacity=".5"/>
<rect class="ink" x="310" y="756" width="80" height="8" rx="4"/>
</g>
<g id="tag"><rect class="s-loss" x="560" y="280" width="300" height="56" rx="28" fill="none" stroke-width="4"/><text class="m" x="710" y="316" font-size="22" text-anchor="middle" style="fill:var(--loss)">LET THEM MOMENT</text></g>
<g id="youG"><g id="you"></g></g>
<g id="squeeze"><path class="s-loss" d="M945 590l15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14M880 590h30m-12-12 12 12-12 12M1120 590h-30m12-12-12 12 12 12" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="draft"><rect class="s-ink" x="1120" y="260" width="340" height="110" rx="24" fill="var(--stage)" stroke-width="5"/><text class="m" x="1122" y="418" font-size="24" letter-spacing="2">DRAFTING A MESSAGE…</text></g>
<g id="kick"><text class="d" x="120" y="840" font-size="48">This is exactly when the routine kicks in.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step one: pause.</text>
<text class="b" x="120" y="176" font-size="32">Before you react, make a small gap.</text>
<g id="pauseG"><circle class="gain" cx="400" cy="470" r="170"/><rect x="335" y="390" width="44" height="160" rx="10" style="fill:var(--on-gain)"/><rect x="421" y="390" width="44" height="160" rx="10" style="fill:var(--on-gain)"/></g>
<g id="x0"><text class="d5" x="720" y="320" font-size="48">Text</text><line id="k0" class="s-loss" x1="712" y1="304" x2="712" y2="304" stroke-width="6" stroke-linecap="round"/></g>
<g id="x1"><text class="d5" x="720" y="400" font-size="48">Vent</text><line id="k1" class="s-loss" x1="712" y1="384" x2="712" y2="384" stroke-width="6" stroke-linecap="round"/></g>
<g id="x2"><text class="d5" x="720" y="480" font-size="48">Decide</text><line id="k2" class="s-loss" x1="712" y1="464" x2="712" y2="464" stroke-width="6" stroke-linecap="round"/></g>
<g id="breathG"><circle id="breath" class="s-gain" cx="1250" cy="390" r="80" fill="var(--gain)" fill-opacity=".2" stroke-width="6"/><text class="m" x="1250" y="570" font-size="22" text-anchor="middle">ONE SLOW BREATH</text></g>
<g id="gapG">
<rect class="s-loss" x="720" y="670" width="240" height="80" rx="16" fill="none" stroke-width="5"/><text class="m" x="840" y="718" font-size="22" text-anchor="middle">IMPULSE</text>
<rect class="gain" x="1240" y="670" width="240" height="80" rx="16"/><text class="m" x="1360" y="718" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CHOICE</text>
<path class="s-gain" d="M980 690v20h240v-20" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="1100" y="760" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE GAP</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step two: say “let them.”</text>
<g id="spk"></g>
<g id="bub"><polygon class="s-ink" points="470,440 540,440 320,510" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><rect class="s-ink" x="420" y="240" width="640" height="220" rx="40" fill="var(--stage)" stroke-width="6"/><text class="d" x="470" y="385" font-size="96">Let them.</text></g>
<g id="l1"><text class="d5" x="420" y="570" font-size="40">Let them have brunch.</text></g>
<g id="l2"><text class="d5" x="420" y="640" font-size="40">Let them make plans without you.</text></g>
<g id="handG">
<g id="float"></g>
<path class="s-ink" d="M1255 570V470M1290 570V455M1325 570V460M1360 570V480M1245 630l-45-60" stroke-width="30" stroke-linecap="round"/>
<rect class="ink" x="1236" y="555" width="144" height="145" rx="36"/>
<text class="d5" x="1308" y="748" font-size="32" text-anchor="middle" style="fill:var(--loss)">It can still hurt.</text>
</g>
<g id="ctrl"><text class="d" x="120" y="830" font-size="44">Their choices were never yours to control.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step three: draw a line.</text>
<text class="b" x="120" y="176" font-size="32">Theirs on one side. Yours on the other.</text>
<rect class="s-line" x="120" y="220" width="1360" height="560" rx="40" fill="var(--stage)" stroke-width="4"/>
<line id="mline" class="s-ink" x1="800" y1="240" x2="800" y2="760" stroke-width="8" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520"/>
<g id="lb0"><text class="m" x="440" y="290" font-size="24" text-anchor="middle" style="fill:var(--loss)">THEIRS · LET THEM</text></g>
<g id="lb1"><text class="m" x="1160" y="290" font-size="24" text-anchor="middle" style="fill:var(--gain)">YOURS · LET ME</text></g>
<g id="side0"></g><g id="side1"></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step four: say “let me.”</text>
<g id="sign"><rect class="gain" x="120" y="200" width="330" height="100" rx="50"/><text class="d" x="160" y="268" font-size="56" style="fill:var(--on-gain)">Let me…</text><text class="m" x="490" y="262" font-size="22">PICK ONE ACTION FROM YOUR SIDE</text></g>
<g id="c0"><rect class="s-line" x="120" y="350" width="414" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="400" font-size="20">OPTION 1</text>
<rect class="s-ink" x="247" y="430" width="80" height="170" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="300" y="450" width="110" height="60" rx="20"/>
<circle cx="330" cy="480" r="7" style="fill:var(--on-gain)"/><circle cx="355" cy="480" r="7" style="fill:var(--on-gain)"/><circle cx="380" cy="480" r="7" style="fill:var(--on-gain)"/>
<text class="d5" x="150" y="690" font-size="32">Text one friend,</text><text class="d5" x="150" y="732" font-size="32">suggest coffee.</text></g>
<g id="c1"><rect class="s-line" x="593" y="350" width="414" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="623" y="400" font-size="20">OPTION 2</text>
<rect class="s-ink" x="720" y="430" width="160" height="170" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="720" y="430" width="160" height="36"/><g id="cal"></g>
<text class="d5" x="623" y="690" font-size="32">Plan a Saturday</text><text class="d5" x="623" y="732" font-size="32">you’ll enjoy.</text></g>
<g id="c2"><rect class="s-line" x="1066" y="350" width="414" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1096" y="400" font-size="20">OPTION 3</text>
<g id="ppl"></g><path class="s-gain" d="M1200 570q73 40 146 0m-14-18 14 18-22 6" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="1096" y="690" font-size="32">Notice who</text><text class="d5" x="1096" y="732" font-size="32">reaches out.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Each step is tiny. Together they create a gap.</text>
<g id="hap"><rect class="s-loss" x="120" y="300" width="240" height="100" rx="16" fill="none" stroke-width="5"/><text class="m" x="240" y="358" font-size="20" text-anchor="middle">WHAT HAPPENS</text></g>
<g id="steps"></g>
<g id="doG"><rect class="gain" x="1220" y="300" width="260" height="100" rx="16"/><text class="m" x="1350" y="358" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">WHAT YOU DO</text></g>
<g id="gapB"><path class="s-gain" d="M400 276v-14h780v14" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="790" y="240" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE GAP</text></g>
<g id="wheel"><g id="wheelR"><circle class="s-ink" cx="800" cy="610" r="110" fill="none" stroke-width="14"/><circle class="ink" cx="800" cy="610" r="24"/><path class="s-ink" d="M800 610V500M800 610l-95 55M800 610l95 55" stroke-width="12" stroke-linecap="round"/></g>
<text class="m" x="960" y="600" font-size="24">STOP REACTING.</text><text class="m" x="960" y="640" font-size="24" style="fill:var(--gain)">START CHOOSING.</text></g>
<g id="peace"><text class="d" x="120" y="820" font-size="44">Your peace stops depending on what others decide.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Use it anywhere.</text>
<g id="any"><text class="b" x="120" y="176" font-size="32">The same routine works for any sting.</text></g>
<g id="w0"><rect class="s-line" x="120" y="230" width="414" height="380" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-ink" cx="327" cy="390" r="100" fill="var(--stage)" stroke-width="8"/>
<line id="hH" class="s-ink" x1="327" y1="390" x2="327" y2="340" stroke-width="10" stroke-linecap="round"/><line id="hM" class="s-loss" x1="327" y1="390" x2="327" y2="310" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="327" cy="390" r="9"/>
<text class="d5" x="150" y="570" font-size="32">Partner running late</text></g>
<g id="w1"><rect class="s-line" x="593" y="230" width="414" height="380" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="740" y="290" width="120" height="200" rx="6" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M760 330h80M760 370h80M760 440h80" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M758 405q20-22 40 0t40 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="pen"><path class="s-loss" d="M905 300l-70 120" stroke-width="16" stroke-linecap="round"/></g>
<text class="d5" x="623" y="570" font-size="32">Sharp comment on work</text></g>
<g id="w2"><rect class="s-line" x="1066" y="230" width="414" height="380" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="gain" d="M1213 300h120v50a60 60 0 0 1-120 0z"/><path class="s-gain" d="M1213 320h-30v20a30 30 0 0 0 30 30M1333 320h30v20a30 30 0 0 1-30 30" fill="none" stroke-width="8"/>
<rect class="gain" x="1263" y="405" width="20" height="45"/><rect class="gain" x="1233" y="450" width="80" height="24" rx="4"/>
<text class="d5" x="1096" y="570" font-size="32">A friend’s big win</text></g>
<g id="rt"></g>
</g>

<g id="s8" opacity="0">
<g id="q1"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Next time something stings,</text></g>
<g id="q2"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">pause and say “let them.”</text></g>
<g id="q3"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">Then finish: “<tspan style="fill:var(--gain)">let me</tspan>…”</text></g>
<g id="qm"><text class="m" x="143" y="630" font-size="26">ONE SMALL ACTION YOU’LL TAKE RIGHT AWAY</text></g>
<g id="qp0"><rect class="s-ink" x="120" y="690" width="400" height="100" rx="50" fill="var(--stage)" stroke-width="6"/>
<g id="qbars"><rect class="ink" x="190" y="715" width="16" height="50" rx="5"/><rect class="ink" x="218" y="715" width="16" height="50" rx="5"/></g>
<text class="m" x="360" y="750" font-size="28" text-anchor="middle">PAUSE</text>
<path class="s-muted" d="M534 740h50m-14-14 14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="qp1"><rect class="s-loss" x="600" y="690" width="400" height="100" rx="50" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="800" y="750" font-size="28" text-anchor="middle" style="fill:var(--loss)">LET THEM</text>
<path class="s-muted" d="M1014 740h50m-14-14 14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="qp2"><rect id="qmeR" class="gain" x="1080" y="690" width="400" height="100" rx="50"/>
<text class="m" x="1280" y="750" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">LET ME…</text></g>
</g>