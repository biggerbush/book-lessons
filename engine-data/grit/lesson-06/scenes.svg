</g>
<g id="sL">
<rect x="120" y="450" width="600" height="160" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<circle cx="430" cy="621" r="6" fill="var(--loss)"/>
<g id="sLc"></g>
<path class="loss" d="M205 548l-10 24h10l-8 24 22-32h-10l8-16z"/>
<text class="d5" x="290" y="520" font-size="30">“I’m stupid.</text>
<text class="d5" x="290" y="568" font-size="30">I’ll never get this.”</text>
</g>
<g id="sR">
<rect x="880" y="450" width="600" height="160" rx="30" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/>
