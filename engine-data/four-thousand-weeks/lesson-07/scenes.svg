<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Embrace your cosmic</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">insignificance.</text>
<text class="b" x="120" y="600" font-size="32">Why feeling small can set you free to live well</text>
<g id="stars"></g>
<path class="s-line" d="M1140 740H1460" stroke-width="5" stroke-linecap="round"/>
<circle id="halo" class="s-gain" cx="1300" cy="718" r="14" fill="none" stroke-width="4" opacity="0"/>
<g id="speck"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A very big universe.</text>
<text class="b" x="120" y="176" font-size="32">And one very short human life inside it.</text>
<g id="age"><text class="m" x="120" y="236" font-size="22">THE UNIVERSE IS ROUGHLY</text><text id="agev" class="d" x="120" y="330" font-size="80" letter-spacing="-2">13.8 billion years</text></g>
<path class="s-line" d="M120 420H1100" stroke-width="16" stroke-linecap="round"/>
<rect id="bar" class="ink" x="120" y="412" width="0" height="16" rx="8"/>
<path id="more" class="s-ink" d="M1124 420H1480" stroke-width="6" stroke-dasharray="6 14" stroke-linecap="round" opacity="0"/>
<g id="barl"><text class="m" x="120" y="390" font-size="20">BIG BANG</text><text class="m" x="1100" y="390" font-size="20" text-anchor="middle">NOW</text><text class="m" x="1480" y="390" font-size="20" text-anchor="end">BILLIONS MORE</text></g>
<g id="life">
<circle class="gain" cx="1100" cy="420" r="11"/>
<path class="s-gain" d="M1100 436V540" stroke-width="4" stroke-dasharray="6 6"/>
<circle class="s-gain" cx="1100" cy="660" r="120" fill="var(--stage)" stroke-width="5"/>
<circle id="flick" class="gain" cx="1100" cy="660" r="6"/>
<text class="m" x="1100" y="740" font-size="18" text-anchor="middle">ONE LIFE</text>
<text class="d5" x="120" y="640" font-size="44">A human life: four</text>
<text class="d5" x="120" y="700" font-size="44">thousand weeks.</text>
</g>
<g id="sink"><text class="m" x="120" y="820" font-size="22" style="fill:var(--gain)">BARELY A FLICKER · LET THAT FACT SINK IN</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The center of history?</text>
<text class="b" x="120" y="176" font-size="32">Most of us assume our own moment matters most.</text>
<g id="mir"><path class="s-line" d="M160 680H780" stroke-width="5" stroke-linecap="round"/><rect class="s-ink" x="460" y="300" width="260" height="360" rx="130" fill="var(--stage)" stroke-width="7"/><g id="mirp"></g></g>
<g id="bias"><text class="d5" x="120" y="770" font-size="44">A kind of egocentricity bias.</text></g>
<g id="road"><path class="s-line" d="M840 600H1370" stroke-width="10" stroke-linecap="round"/><text class="m" x="840" y="650" font-size="20">HISTORY</text><g id="rdots"></g></g>
<g id="you"><g id="youf"></g><text class="m" x="1420" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make a dent in the universe?</text>
<text class="b" x="120" y="176" font-size="32">The heavy expectation that a life must be remarkable.</text>
<g id="dent"><circle class="s-ink" cx="380" cy="500" r="170" fill="var(--stage)" stroke-width="6"/><path class="s-loss" d="M330 338Q380 384 430 338" fill="none" stroke-width="7" stroke-linecap="round"/><path class="s-muted" d="M380 240V300M356 276l24 24 24-24" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="210" y="720" font-size="20">THE URGE TO MAKE A DENT</text></g>
<path class="s-ink" d="M760 560H1460" stroke-width="8" stroke-linecap="round"/>
<g id="troph"></g>
<g id="days"></g>
<g id="wasted"><text class="d5" x="800" y="808" font-size="36">Ordinary days start to feel wasted.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cosmic insignificance therapy.</text>
<text class="b" x="120" y="176" font-size="32">Accept you will never matter on a cosmic scale.</text>
<path class="s-line" d="M200 712H600" stroke-width="5" stroke-linecap="round"/>
<g id="tiny"></g>
<g id="wt"><g id="wti"><rect class="s-loss" x="250" y="330" width="300" height="140" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="400" y="392" font-size="22" text-anchor="middle" style="fill:var(--loss)">MATTER ON A</text><text class="m" x="400" y="426" font-size="22" text-anchor="middle" style="fill:var(--loss)">COSMIC SCALE</text></g></g>
<g id="hj">
<text class="m" x="900" y="250" font-size="20">THE BAR FOR A MEANINGFUL LIFE</text>
<path class="s-ink" d="M900 280V730M1400 280V730M860 730H1440" stroke-width="8" stroke-linecap="round"/>
<path id="hb" d="M900 320H1400" stroke-width="10" stroke-linecap="round"/>
<text id="hbl" class="m" x="1150" y="298" font-size="22" text-anchor="middle">IMPOSSIBLE</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Modest things matter.</text>
<text class="b" x="120" y="176" font-size="32">Small to the cosmos, but real to the people around you.</text>
<g id="pn0"><rect class="s-line" x="120" y="240" width="414" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M160 480H494" stroke-width="4"/><path class="s-ink" d="M321 440L372 452" stroke-width="6" stroke-linecap="round"/><g id="pf0"></g><text class="d5" x="150" y="610" font-size="34">Raising a child</text></g>
<g id="pn1"><rect class="s-line" x="593" y="240" width="414" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M633 480H967" stroke-width="4"/><g id="pf1"></g><path class="gain" d="M805 318c-34-22-40-50-20-58 10-4 18 2 20 10 2-8 10-14 20-10 20 8 14 36-20 58z"/><text class="d5" x="623" y="610" font-size="34">Helping a friend</text></g>
<g id="pn2"><rect class="s-line" x="1066" y="240" width="414" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M1106 482H1440" stroke-width="4"/><rect class="ink" x="1213" y="370" width="110" height="110" rx="14"/><path class="s-ink" d="M1323 398a26 26 0 0 1 0 56" fill="none" stroke-width="10"/><path id="steam" class="s-muted" d="M1245 350q-14-20 0-40t0-40M1268 350q-14-20 0-40t0-40M1291 350q-14-20 0-40t0-40" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d5" x="1096" y="610" font-size="34">Daily work, with care</text></g>
<g id="rip"></g>
<g id="near"><text class="d" x="120" y="770" font-size="44">Not across galaxies. To the people around you.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Soviet calendar.</text>
<text class="b" x="120" y="176" font-size="32">Around 1929: different days off, so factories never stopped.</text>
<g id="fac"><g transform="translate(0 30)"><g id="smoke"></g><rect class="ink" x="120" y="380" width="360" height="140"/><path class="ink" d="M120 380l60-50v50l60-50v50l60-50v50l60-50v50z"/><rect class="ink" x="400" y="270" width="44" height="110"/><g id="fwin"></g><text class="m" x="120" y="560" font-size="20">THE FACTORY NEVER STOPS</text></g></g>
<g id="cal"><text class="m" x="620" y="245" font-size="20">WHO HAS THE DAY OFF</text><g id="cells"></g></g>
<g id="tbl"><g id="seats"></g><rect class="ink" x="760" y="712" width="560" height="16" rx="6"/><path class="s-ink" d="M800 728V820M1280 728V820" stroke-width="8" stroke-linecap="round"/></g>
<g id="mis"><text class="d5" x="120" y="700" font-size="36">Rarely a shared free day.</text><text class="m" x="120" y="750" font-size="22" style="fill:var(--loss)">PEOPLE WERE MISERABLE</text></g>
<g id="stamp"><g transform="rotate(-8 1040 394)"><rect class="s-loss" x="830" y="344" width="420" height="100" rx="10" fill="var(--stage)" stroke-width="6"/><text class="d" x="1040" y="414" font-size="56" text-anchor="middle" style="fill:var(--loss)">ABANDONED</text></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Time is shared.</text>
<text class="b" x="120" y="176" font-size="32">It gains much of its value when we spend it alongside others.</text>
<g id="clk">
<circle class="s-ink" cx="330" cy="420" r="120" fill="var(--stage)" stroke-width="7"/><circle class="s-ink" cx="630" cy="420" r="120" fill="var(--stage)" stroke-width="7"/>
<g id="ticks"></g>
<path id="link" class="s-gain" d="M450 420H510" stroke-width="8" stroke-linecap="round"/>
<line id="h0" stroke-width="8" stroke-linecap="round"/><line id="h1" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="330" cy="420" r="10"/><circle class="ink" cx="630" cy="420" r="10"/>
<text class="m" x="480" y="610" font-size="20" text-anchor="middle">LINE UP OUR HOURS</text>
</g>
<g id="cards"></g>
<g id="ctrl"><text class="d" x="120" y="800" font-size="44">Give up a little control. Gain a richer life.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one modest,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">meaningful act and</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">share it <tspan style="fill:var(--gain)">with someone.</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">IT DOESN’T NEED TO BE IMPRESSIVE</text>
<g id="hands">
<g id="pair"></g>
<path class="s-ink" d="M1292 722L1326 730M1408 722L1374 730" stroke-width="8" stroke-linecap="round"/>
<path class="s-line" d="M1210 756H1490" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="1328" y="708" width="44" height="46" rx="8"/>
<g transform="translate(1350 690)"><g id="seed"><path class="gain" d="M0 0c-34-22-40-50-20-58 10-4 18 2 20 10 2-8 10-14 20-10 20 8 14 36-20 58z"/></g></g>
</g>
</g>