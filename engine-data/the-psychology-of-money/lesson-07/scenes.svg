<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Money’s greatest gift</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is freedom.</text>
<text class="b" x="120" y="600" font-size="32">Why the best thing money buys is control of your time.</text>
<g id="hg">
<rect class="ink" x="1230" y="240" width="220" height="22" rx="8"/>
<rect class="ink" x="1230" y="678" width="220" height="22" rx="8"/>
<polygon id="sandT" class="gain"/>
<polygon id="sandB" class="gain"/>
<path id="stream" class="s-gain" stroke-width="4"/>
<path class="s-ink" d="M1260 262H1420C1420 380 1360 430 1350 470C1360 510 1420 560 1420 678H1260C1260 560 1320 510 1330 470C1320 430 1260 380 1260 262Z" fill="none" stroke-width="7" stroke-linejoin="round"/>
</g>
<g id="ytime"><text class="m" x="1340" y="760" font-size="24" text-anchor="middle" style="fill:var(--gain)">YOUR OWN TIME</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hidden dividend.</text>
<text class="b" x="120" y="176" font-size="32">Money pays a dividend most people never notice.</text>
<g id="coin"><circle class="gain" cx="280" cy="400" r="100"/><circle cx="280" cy="400" r="76" fill="none" stroke="var(--on-gain)" stroke-width="4"/><text class="d" x="280" y="438" font-size="110" text-anchor="middle" style="fill:var(--on-gain)">$</text></g>
<g id="divclk"><path class="s-muted" d="M400 400h100m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="s-ink" cx="620" cy="400" r="80" fill="var(--stage)" stroke-width="7"/><path id="h1" class="s-gain" d="M620 400V345" stroke-width="7" stroke-linecap="round"/><path class="s-ink" d="M620 400h38" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="620" y="530" font-size="22" text-anchor="middle">YOUR TIME</text></g>
<g id="quote"><text class="d5" x="120" y="650" font-size="40">“Controlling your time is the highest</text><text class="d5" x="120" y="700" font-size="40">dividend money pays.”</text><text class="m" x="120" y="740" font-size="20">MORGAN HOUSEL</text></g>
<g id="cal"><rect class="s-ink" x="940" y="260" width="540" height="320" rx="16" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="940" y="260" width="540" height="62" rx="16"/><text class="m" x="970" y="301" font-size="22" style="fill:var(--stage)">YOUR DAY, YOUR CHOICE</text><g id="cells"></g></g>
<g id="quiet"><text class="d" x="120" y="830" font-size="46">That control is a quiet kind of wealth.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Control makes us happy.</text>
<text class="b" x="120" y="176" font-size="32">Research by psychologist Angus Campbell.</text>
<g id="res"><g id="resp"></g><rect class="s-ink" x="296" y="410" width="76" height="96" rx="8" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M310 440h48M310 462h48M310 484h30" stroke-width="5" stroke-linecap="round"/><text class="m" x="260" y="560" font-size="20" text-anchor="middle">ANGUS CAMPBELL</text></g>
<g id="chart"><text class="m" x="520" y="250" font-size="20">STRONGEST PREDICTOR OF HAPPINESS</text><path class="s-ink" d="M520 640H1080" stroke-width="5" stroke-linecap="round"/>
<rect x="560" y="520" width="120" height="120" fill="var(--line)"/><rect x="740" y="540" width="120" height="100" fill="var(--line)"/>
<text class="m" x="620" y="680" font-size="20" text-anchor="middle">INCOME</text><text class="m" x="800" y="680" font-size="20" text-anchor="middle">STATUS</text></g>
<g id="ctl"><rect id="b2" class="gain" x="920" y="640" width="120" height="0"/><text class="m" x="980" y="680" font-size="20" text-anchor="middle" style="fill:var(--gain)">CONTROL</text></g>
<g id="wheel"><g id="whl"><circle class="s-gain" cx="1300" cy="440" r="120" fill="none" stroke-width="18"/><circle class="gain" cx="1300" cy="440" r="28"/><path class="s-gain" d="M1182 440H1418M1300 440V560" stroke-width="14" stroke-linecap="round"/></g>
<text class="d5" x="1300" y="640" font-size="34" text-anchor="middle">Money hands you</text><text class="d5" x="1300" y="684" font-size="34" text-anchor="middle">the wheel.</text></g>
<g id="pred"><text class="d" x="120" y="800" font-size="42">The key: feeling in control of your own life.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A small cushion, big choices.</text>
<text class="b" x="120" y="176" font-size="32">You don’t need a fortune to feel this.</text>
<g id="jar"><rect id="jfill" class="gain" x="170" y="616" width="220" height="20" rx="18"/><path class="s-ink" d="M190 300h180v30q30 20 30 60v220q0 30-30 30H190q-30 0-30-30V390q0-40 30-60z" fill="none" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="180" y="276" width="200" height="24" rx="8"/><text class="m" x="280" y="700" font-size="22" text-anchor="middle">MODEST SAVINGS</text></g>
<g id="cA"><path class="s-muted" d="M412 440L548 365" stroke-width="5" stroke-dasharray="8 8"/><rect class="s-line" x="560" y="240" width="920" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="600" y="290" width="16" height="150" rx="6"/><rect class="ink" x="600" y="400" width="260" height="18" rx="6"/><rect class="ink" x="844" y="400" width="16" height="40" rx="6"/>
<rect class="s-line" x="626" y="356" width="56" height="30" rx="12" fill="var(--stage)" stroke-width="4"/><circle class="gain" cx="660" cy="350" r="24"/><rect x="684" y="360" width="166" height="40" rx="14" fill="var(--muted)"/>
<text class="d5" x="900" y="350" font-size="40">Take sick days</text><text class="b" x="900" y="400" font-size="28">without panic.</text></g>
<g id="cB"><path class="s-muted" d="M412 520L548 655" stroke-width="5" stroke-dasharray="8 8"/><rect class="s-line" x="560" y="530" width="920" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-loss" x="610" y="572" width="90" height="136" fill="none" stroke-width="5"/><text class="m" x="655" y="746" font-size="20" text-anchor="middle">FIRST</text>
<rect class="gain" x="740" y="560" width="110" height="150" rx="4"/><circle cx="830" cy="638" r="7" fill="var(--on-gain)"/><text class="m" x="795" y="746" font-size="20" text-anchor="middle" style="fill:var(--gain)">BETTER</text>
<text class="d5" x="900" y="640" font-size="40">Wait for a better job</text><text class="b" x="900" y="690" font-size="28">instead of grabbing the first one.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Richer, but busier.</text>
<text class="b" x="120" y="176" font-size="32">We out-earn our grandparents, yet feel less in control of our days.</text>
<path class="s-ink" d="M130 640H660" stroke-width="5" stroke-linecap="round"/>
<g id="inc"><rect x="160" y="500" width="80" height="140" fill="var(--line)"/><rect class="gain" x="260" y="340" width="80" height="300"/><text class="m" x="200" y="486" font-size="18" text-anchor="middle">THEN</text><text class="m" x="300" y="326" font-size="18" text-anchor="middle" style="fill:var(--gain)">NOW</text><text class="m" x="250" y="680" font-size="20" text-anchor="middle">INCOME</text></g>
<g id="ctr"><rect x="440" y="360" width="80" height="280" fill="var(--line)"/><rect class="loss" x="540" y="520" width="80" height="120"/><text class="m" x="480" y="346" font-size="18" text-anchor="middle">THEN</text><text class="m" x="580" y="506" font-size="18" text-anchor="middle" style="fill:var(--loss)">NOW</text><text class="m" x="530" y="680" font-size="20" text-anchor="middle">CONTROL</text></g>
<g id="home"><path class="s-ink" d="M880 430L1150 270L1420 430" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="920" y="420" width="460" height="240" fill="var(--stage)" stroke-width="7"/>
<circle class="gain" cx="1400" cy="240" r="30"/><circle cx="1414" cy="230" r="26" fill="var(--stage)"/>
<g id="homep"></g>
<rect class="ink" x="1110" y="560" width="100" height="62" rx="6"/><rect class="gain" x="1120" y="570" width="80" height="42"/><rect class="ink" x="1096" y="622" width="128" height="10" rx="4"/>
<g id="bub"><circle class="s-loss" cx="1076" cy="460" r="6" fill="none" stroke-width="4"/><circle class="s-loss" cx="1104" cy="444" r="10" fill="none" stroke-width="4"/><ellipse class="s-loss" cx="1250" cy="460" rx="90" ry="34" fill="var(--stage)" stroke-width="5"/><text class="m" x="1250" y="468" font-size="20" text-anchor="middle" style="fill:var(--loss)">WORK, WORK</text></g>
<text class="m" x="920" y="700" font-size="20">NIGHTS · WEEKENDS · ALWAYS ON</text></g>
<g id="heads4"><text class="d" x="120" y="790" font-size="44">Modern work lives in our heads.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Advice from the old.</text>
<text class="b" x="120" y="176" font-size="32">Karl Pillemer interviewed about a thousand older Americans.</text>
<g id="crowd5"></g><g id="crl"><text class="m" x="120" y="620" font-size="20">ABOUT 1,000 OLDER AMERICANS</text></g>
<g id="shelf"><path class="s-ink" d="M700 520H1060" stroke-width="8" stroke-linecap="round"/>
<path class="ink" d="M730 400h70v20a35 35 0 0 1 -70 0z"/><rect class="ink" x="757" y="452" width="16" height="40"/><rect class="ink" x="740" y="490" width="50" height="14" rx="4"/>
<rect class="ink" x="830" y="450" width="120" height="40" rx="12"/><path class="ink" d="M855 450l15-30h45l15 30z"/><circle class="ink" cx="860" cy="496" r="14"/><circle class="ink" cx="920" cy="496" r="14"/>
<path class="ink" d="M980 440h60l14 20-44 50-44-50z"/>
<text class="m" x="880" y="620" font-size="20" text-anchor="middle">NICER THINGS</text></g>
<g id="nox"><path class="s-loss" d="M720 330L1040 560M1040 330L720 560" stroke-width="10" stroke-linecap="round"/></g>
<g id="table"><g id="fam"></g><ellipse class="s-ink" cx="1300" cy="450" rx="130" ry="50" fill="var(--stage)" stroke-width="6"/><text class="m" x="1300" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">FRIENDS, FAMILY,</text><text class="m" x="1300" y="678" font-size="20" text-anchor="middle" style="fill:var(--gain)">UNSTRUCTURED TIME</text></g>
<g id="fam5"><text class="d" x="120" y="800" font-size="44">They talked about people, and time.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where the book comes together.</text>
<text class="b" x="120" y="176" font-size="32">Saving, patience and room for error are tools, not goals.</text>
<g id="blocks"></g>
<g id="key6"><g id="keyM"><circle class="s-gain" cx="640" cy="440" r="44" fill="none" stroke-width="14"/><path class="s-gain" d="M684 440H900M860 440v36M822 440v26" fill="none" stroke-width="14" stroke-linecap="round"/></g></g>
<g id="lock6"><circle class="s-ink" cx="1200" cy="440" r="120" fill="var(--stage)" stroke-width="8"/><path id="h6" class="s-gain" d="M1200 440V360" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M1200 440h50" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1200" cy="440" r="10"/><text class="m" x="1200" y="600" font-size="20" text-anchor="middle">CONTROL OF YOUR HOURS</text></g>
<g id="mrowg"><g id="mrow"></g><text class="m" x="120" y="790" font-size="20">EACH EXTRA MONTH OF SAVINGS = ONE MORE MONTH YOU CHOOSE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Count months, not dollars.</text>
<text class="b" x="120" y="176" font-size="32">Measure your savings in months of freedom.</text>
<g id="dol"><text class="d" x="150" y="380" font-size="160" style="fill:var(--muted)">$</text></g>
<line id="dstr" class="s-loss" x1="140" y1="370" x2="140" y2="370" stroke-width="10" stroke-linecap="round"/>
<g id="rwg"><path class="s-muted" d="M300 320h100m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="440" y="250" font-size="22" style="fill:var(--gain)">MONTHS OF FREEDOM</text><g id="rw"></g></g>
<g id="fund"><g transform="translate(0 160)"><g id="fl"></g><path class="s-ink" d="M190 300h180v30q30 20 30 60v220q0 30-30 30H190q-30 0-30-30V390q0-40 30-60z" fill="none" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="180" y="276" width="200" height="24" rx="8"/><rect class="gain" x="176" y="400" width="208" height="46" rx="8"/><text class="m" x="280" y="430" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">FREEDOM FUND</text></g></g>
<g id="ft0"><text class="d5" x="500" y="560" font-size="40">Give the account a name:</text></g>
<g id="ft1"><text class="d" x="500" y="650" font-size="72" style="fill:var(--gain)">Freedom fund</text></g>
<g id="ft2"><text class="m" x="500" y="720" font-size="22">WATCH THE MONTHS ADD UP</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="260" font-size="88" letter-spacing="-2">If you had six months</text></g>
<g id="qb"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">of freedom saved, what</text></g>
<g id="qc"><text class="d" x="136" y="460" font-size="88" letter-spacing="-2">would you do differently</text></g>
<g id="qd"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">with your <tspan style="fill:var(--gain)">time?</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">YOUR TIME IS THE DIVIDEND</text>
<g id="ring"></g>
<circle class="s-ink" cx="1300" cy="700" r="62" fill="var(--stage)" stroke-width="7"/><path id="h8" class="s-gain" d="M1300 700V654" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1300" cy="700" r="8"/>
</g>