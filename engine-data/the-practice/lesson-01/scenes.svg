<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PRACTICE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Creativity is a choice,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a gift.</text>
<text class="b" x="120" y="600" font-size="32">Creative work is a practice you choose, not a gift you're born with.</text>
<g id="rays"></g>
<circle id="bulb" cx="1340" cy="330" r="80" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path class="s-ink" d="M1310 412v40h60v-40M1316 474h48" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Waiting for lightning.</text>
<g id="s1sub"><text class="b" x="120" y="176" font-size="32">Many of us believe creativity works like this.</text></g>
<g id="desk">
<rect class="ink" x="300" y="600" width="620" height="16" rx="4"/>
