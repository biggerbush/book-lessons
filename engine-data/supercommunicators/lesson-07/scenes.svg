<circle id="tdot" class="gain" r="12"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not a match to win.</text>
<text class="b" x="120" y="176" font-size="32">Duhigg suggests a different goal: a learning conversation.</text>
