</g><g id="fkids"></g></g>
<g id="nor"><text class="m" x="1250" y="730" font-size="20" text-anchor="middle">LET IT WOBBLE · NO RESCUE</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="d" x="136" y="340" font-size="84" letter-spacing="-2">This week, give a child</text></g>
