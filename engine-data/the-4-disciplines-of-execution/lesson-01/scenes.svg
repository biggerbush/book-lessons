<g id="tag1"><rect class="s-loss" x="1040" y="400" width="380" height="70" rx="35" fill="var(--stage)" stroke-width="5"/><text id="lt1" class="m" x="1240" y="444" font-size="24" text-anchor="middle" style="fill:var(--loss)">WEAK PLAN?</text></g>
