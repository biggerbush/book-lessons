<g id="col"><g id="pc"></g><text class="m" x="600" y="600" font-size="20" text-anchor="middle">COLLEAGUE</text></g>
<g id="pair"><g id="py"></g><text class="m" x="1000" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text><text class="m" x="1300" y="600" font-size="20" text-anchor="middle">SOMEONE ELSE</text></g>
<g id="chat"><path class="s-muted" d="M960 330Q800 230 650 330" fill="none" stroke-width="4" stroke-dasharray="6 10"/></g>
<g id="conf"><text class="d" x="600" y="340" font-size="90" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="us"><text class="d" x="120" y="770" font-size="48">That’s not kindness. It’s comfort,</text><text class="d" x="120" y="830" font-size="48" style="fill:var(--loss)">mostly for us.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Half truths don’t help.</text>
<text class="b" x="120" y="176" font-size="32">Reassurance that doesn’t match reality.</text>
<g id="sbub"><rect class="s-ink" x="120" y="240" width="420" height="150" rx="28" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M200 390l-10 50l50-50" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="d" x="330" y="334" font-size="56" text-anchor="middle">It’s great!</text></g>
<g id="trust"><text class="m" x="120" y="540" font-size="20">TRUST</text><rect class="s-line" x="120" y="560" width="440" height="36" rx="18" fill="none" stroke-width="3"/><rect id="trb" class="gain" x="120" y="560" width="440" height="36" rx="18"/></g>
