</g>
<g id="swim"><g id="swB"></g><g id="swS"></g></g>
<g id="bb2">
<polygon points="600,312 660,372 640,312" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/>
<rect x="240" y="220" width="560" height="100" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<text class="d5" x="270" y="282" font-size="28">“I feel really connected to you.”</text>
</g>
