<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your ego and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your blind spots.</text>
<text class="b" x="120" y="600" font-size="32">Why your own mind gets in the way, and the fix.</text>
<circle class="s-ink" cx="1300" cy="380" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1190 720v-50a110 110 0 0 1 220 0v50" fill="none" stroke-width="7" stroke-linecap="round"/>
