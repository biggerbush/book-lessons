<g id="s0">
<text class="m" x="120" y="150" font-size="28">TINY HABITS · LESSON 2</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">The behavior formula:</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">Motivation, Ability,</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2" style="fill:var(--gain)">Prompt.</text>
<text class="b" x="120" y="610" font-size="32">Three ingredients have to meet before any behavior happens.</text>
<g id="t0g"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">B = MAP.</text>
<text class="b" x="120" y="176" font-size="32">BJ Fogg studied what makes people act, at Stanford.</text>
<g id="lab">
<path class="s-ink" d="M130 340L270 260L410 340Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<g id="cols"></g>
<rect class="ink" x="130" y="520" width="280" height="20"/>
<text class="m" x="270" y="580" font-size="20" text-anchor="middle">STANFORD</text>
</g>
<g id="fcard">
<rect class="s-line" x="520" y="230" width="960" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
<text id="bB" class="d" x="620" y="420" font-size="150" text-anchor="middle" style="fill:var(--gain)">B</text>
<text class="d" x="790" y="420" font-size="150" text-anchor="middle">=</text>
<text class="d" x="960" y="420" font-size="150" text-anchor="middle">M</text>
<text class="d" x="1130" y="420" font-size="150" text-anchor="middle">A</text>
<text class="d" x="1300" y="420" font-size="150" text-anchor="middle">P</text>
</g>
<g id="ic1"></g>
<g id="miss1">
<path class="s-loss" d="M1255 595l90 90M1345 595l-90 90" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="120" y="840" font-size="22" style="fill:var(--loss)">MISSING ONE? NOTHING HAPPENS.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A phone rings.</text>
<text class="b" x="120" y="176" font-size="32">Three things line up at the same moment.</text>
<g id="per2"></g>
<g id="face"><circle cx="243" cy="392" r="6" fill="var(--stage)"/><circle cx="277" cy="392" r="6" fill="var(--stage)"/><path d="M240 412q20 18 40 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<path class="s-ink" d="M120 640h820M180 640v120M880 640v120" stroke-width="8" stroke-linecap="round"/>
<path id="arm" class="s-ink" fill="none" stroke-width="16" stroke-linecap="round"/>
<g id="phW"><g id="ph"><rect class="ink" x="520" y="440" width="110" height="200" rx="18"/><rect x="532" y="462" width="86" height="140" rx="6" fill="var(--stage)"/></g></g>
<g id="waves" fill="none" stroke-width="6" stroke-linecap="round"><path d="M660 490q30 50 0 100"/><path d="M690 470q48 70 0 140"/><path d="M720 450q66 90 0 180"/></g>
<g id="rows2"></g>
<g id="pick"><text class="d" x="120" y="830" font-size="48">All three line up, so you pick it up.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The action line.</text>
<text class="b" x="120" y="176" font-size="32">Motivation goes up. Ability goes across.</text>
<g id="axes3">
<path class="s-ink" d="M240 240V760H1100M228 256l12-16 12 16M1084 748l16 12-16 12" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="200" y="500" font-size="20" text-anchor="middle" transform="rotate(-90 200 500)">MOTIVATION</text>
<text class="m" x="250" y="800" font-size="20">HARD</text>
<text class="m" x="670" y="800" font-size="20" text-anchor="middle">ABILITY</text>
<text class="m" x="1100" y="800" font-size="20" text-anchor="end">EASY</text>
</g>
<path id="curve" class="s-gain" d="M300 280Q380 690 1080 720" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="alab"><text class="m" x="1100" y="676" font-size="20" text-anchor="end" style="fill:var(--gain)">ACTION LINE</text></g>
<g id="dA"><circle id="rA" cx="760" cy="400" fill="none" stroke="var(--gain)" stroke-width="4"/><circle class="gain" cx="760" cy="400" r="22"/><text class="m" x="800" y="392" font-size="20" style="fill:var(--gain)">ACTION</text></g>
<g id="dB"><circle cx="500" cy="700" r="22" fill="var(--muted)"/><text class="m" x="540" y="708" font-size="20">IGNORED</text></g>
<g id="pA"><text class="d5" x="1180" y="400" font-size="36">Above the line:</text><text class="b" x="1180" y="446" font-size="30">the prompt works.</text></g>
<g id="pB"><text class="d5" x="1180" y="620" font-size="36">Below the line:</text><text class="b" x="1180" y="666" font-size="30">prompt ignored.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A trade-off.</text>
<text class="b" x="120" y="176" font-size="32">Motivation and ability balance each other.</text>
<g id="ss">
<path class="s-line" d="M300 700h1000" stroke-width="5" stroke-linecap="round"/>
<path class="ink" d="M800 600L740 700H860Z"/>
<g id="plank"><rect class="ink" x="380" y="588" width="840" height="24" rx="12"/>
<circle class="s-ink" cx="420" cy="560" r="40" fill="var(--stage)" stroke-width="6"/><text class="d" x="420" y="575" font-size="40" text-anchor="middle">M</text>
<circle class="s-ink" cx="1180" cy="560" r="40" fill="var(--stage)" stroke-width="6"/><text class="d" x="1180" y="575" font-size="40" text-anchor="middle">A</text></g>
<text class="m" x="800" y="790" font-size="20" text-anchor="middle">MOTIVATION AND ABILITY TRADE OFF</text>
</g>
<g id="hard"><text class="d" x="120" y="270" font-size="44">Hard task</text><text class="m" x="120" y="305" font-size="20" style="fill:var(--loss)">NEEDS SKY-HIGH MOTIVATION</text>
<path class="s-line" d="M124 452h256" stroke-width="5" stroke-linecap="round"/>
<path class="loss" d="M140 450L230 330L270 380L300 350L360 450Z"/>
<path d="M213 353L230 330L247 352L238 346L230 356L222 346Z" fill="var(--stage)"/></g>
<g id="easy"><text class="d" x="1480" y="270" font-size="44" text-anchor="end">Easy task</text><text class="m" x="1480" y="305" font-size="20" text-anchor="end" style="fill:var(--gain)">HAPPENS EVEN WHEN YOU BARELY CARE</text>
<path class="s-line" d="M1224 452h256" stroke-width="5" stroke-linecap="round"/>
<path class="gain" d="M1310 450V424a6 6 0 0 1 6-6H1394a6 6 0 0 1 6 6V450Z"/>
<path id="hop" class="s-gain" d="M1250 440Q1355 360 1460 440" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<path class="s-gain" d="M1440 420l20 20-26 6" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1355" y="490" font-size="18" text-anchor="middle">ONE SMALL STEP</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">No prompt, no action.</text>
<text class="b" x="120" y="176" font-size="32">Motivation and ability are not enough on their own.</text>
<g id="bars5">
<rect class="s-ink" x="160" y="280" width="70" height="300" rx="8" fill="none" stroke-width="5"/><rect id="fM" class="gain" x="166" width="58" rx="4"/>
<rect class="s-ink" x="290" y="280" width="70" height="300" rx="8" fill="none" stroke-width="5"/><rect id="fA" class="gain" x="296" width="58" rx="4"/>
<text class="d" x="195" y="630" font-size="40" text-anchor="middle">M</text><text class="d" x="325" y="630" font-size="40" text-anchor="middle">A</text>
</g>
<g id="bell5"><text id="zz" class="m" x="505" y="340" font-size="26">Z z z</text><text class="m" x="470" y="630" font-size="20" text-anchor="middle">PROMPT?</text></g>
<g id="stW">
<rect x="670" y="300" width="260" height="260" rx="8" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="14 12"/>
<text class="d" x="800" y="420" font-size="48" text-anchor="middle" style="fill:var(--line)">DO IT</text>
<text class="d" x="800" y="486" font-size="48" text-anchor="middle" style="fill:var(--line)">NOW</text>
<text class="m" x="800" y="630" font-size="20" text-anchor="middle" style="fill:var(--loss)">NO CUE</text>
</g>
<path id="cueX" class="s-loss" d="M690 320L910 540M910 320L690 540" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="closet">
<rect class="s-ink" x="1060" y="260" width="380" height="500" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1060 420h380M1250 260v160" stroke-width="5"/>
<rect class="loss" x="1350" y="486" width="70" height="260"/>
<ellipse class="loss" cx="1385" cy="746" rx="35" ry="12"/>
<path d="M1350 576q35 14 70 0M1350 656q35 14 70 0" fill="none" stroke="var(--stage)" stroke-width="5"/>
<ellipse cx="1385" cy="486" rx="35" ry="13" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<path transform="translate(1385 486) scale(1 .4)" d="M0 0a4 4 0 0 1 8 0a8 8 0 0 1-16 0a12 12 0 0 1 24 0a16 16 0 0 1-32 0a20 20 0 0 1 40 0a26 26 0 0 1-52 0" fill="none" stroke="var(--loss)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<path class="s-muted" d="M1300 600H1340" stroke-width="3" stroke-linecap="round"/>
<text class="m" x="1292" y="606" font-size="18" text-anchor="end">YOGA MAT</text>
<text class="m" x="1250" y="800" font-size="20" text-anchor="middle">INTENTION, NO PROMPT</text>
</g>
<g id="nb5"><text class="d5" x="120" y="830" font-size="36">Without a prompt, nothing happens.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Debug in this order.</text>
<text class="b" x="120" y="176" font-size="32">When a behavior isn’t happening, check these three.</text>
<g id="cards6"></g>
<g id="lensW"><g id="lens6"><circle class="s-ink" cx="0" cy="0" r="46" fill="var(--stage)" stroke-width="10"/><path class="s-ink" d="M33 33l40 40" stroke-width="16" stroke-linecap="round"/></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Pick one habit you keep meaning to start.</text>
<g id="hcard"><rect class="s-line" x="120" y="240" width="380" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">YOUR HABIT</text><path class="s-line" d="M150 360h190M150 420h190M150 480h190" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M380 520l70-120 22 12-70 120-30 14z"/></g>
<g id="rows7"></g>
<g id="chain7"><rect class="s-ink" x="120" y="680" width="240" height="70" rx="35" fill="none" stroke-width="8"/><rect id="lk" x="320" y="680" width="240" height="70" rx="35" fill="none" stroke-width="8"/><rect class="s-ink" x="520" y="680" width="240" height="70" rx="35" fill="none" stroke-width="8"/>
<text class="m" x="240" y="723" font-size="24" text-anchor="middle">M</text><text class="m" x="440" y="723" font-size="24" text-anchor="middle">A</text><text class="m" x="640" y="723" font-size="24" text-anchor="middle">P</text>
<text class="d" x="820" y="730" font-size="44">Fix the weakest link.</text><text class="m" x="820" y="780" font-size="20" style="fill:var(--gain)">THE BEHAVIOR OFTEN APPEARS</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Something you did today</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">without effort:</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">can you spot <tspan style="fill:var(--gain)">M, A and P</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">MOTIVATION · ABILITY · PROMPT</text>
<g id="end3"></g>
</g>