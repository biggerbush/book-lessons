<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE ALMANACK OF NAVAL RAVIKANT · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Find your specific</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">knowledge.</text>
<text class="b" x="120" y="600" font-size="32">Your real edge is the knowledge no classroom can teach.</text>
<g id="hd0"></g>
