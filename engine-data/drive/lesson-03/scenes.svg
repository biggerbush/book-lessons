<path class="s-line" d="M370 470L490 360M370 500L490 640" stroke-width="4" stroke-dasharray="8 8" fill="none"/></g>
<g id="gA"><rect class="s-line" x="500" y="220" width="980" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
