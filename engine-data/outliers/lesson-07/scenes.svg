<g id="refl"><text class="d" x="120" y="800" font-size="44">They never herded sheep. The reflex stayed.</text><g id="ghost" opacity=".5"></g><path class="s-loss" d="M1340 812L1430 756" stroke-width="6" stroke-linecap="round"/></g>
