<g id="lkR"><rect class="s-ink" x="850" y="398" width="150" height="64" rx="32" fill="none" stroke-width="12"/><rect class="s-ink" x="800" y="410" width="100" height="40" rx="20" fill="none" stroke-width="12"/></g>
