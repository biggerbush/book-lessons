<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your triggers</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">are signposts.</text>
<text class="b" x="120" y="600" font-size="32">Why your strongest reactions point to what needs healing</text>
<path class="s-line" d="M1120 780h360" stroke-width="5" stroke-linecap="round"/>
<g id="flare"><g id="frays"></g><circle class="loss" cx="1180" cy="640" r="34"/></g>
<g id="sign0">
<path class="s-gain" d="M1180 590Q1170 500 1220 440" fill="none" stroke-width="5" stroke-dasharray="8 10" stroke-linecap="round"/>
<path class="s-ink" d="M1300 300V780" stroke-width="10" stroke-linecap="round"/>
<polygon class="gain" points="1140,330 1420,330 1470,380 1420,430 1140,430"/>
<text class="m" x="1290" y="389" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THIS WAY</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small moment. Big reaction.</text>
<text class="b" x="120" y="176" font-size="32">A friend’s short text, or a passing comment at work.</text>
<g id="phone">
<rect class="s-ink" x="160" y="240" width="280" height="480" rx="36" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M260 690h80" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="300" y="770" font-size="20" text-anchor="middle">A SHORT TEXT</text>
</g>
<g id="bub"><rect x="200" y="320" width="150" height="70" rx="24" fill="var(--line)"/><text class="d" x="228" y="368" font-size="36">ok.</text></g>
<g id="thermo">
<rect class="s-ink" x="620" y="240" width="60" height="500" rx="30" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="650" cy="770" r="54" fill="var(--stage)" stroke-width="6"/>
<circle class="loss" cx="650" cy="770" r="38"/>
<rect id="merc" class="loss" x="636" y="640" width="28" height="130" rx="14"/>
</g>
<g id="lvl0"><path class="s-ink" d="M700 640h40" stroke-width="5" stroke-linecap="round"/><text class="m" x="760" y="647" font-size="20">THE MOMENT</text></g>
<g id="lvl1"><path class="s-loss" d="M700 290h40" stroke-width="5" stroke-linecap="round"/><text class="m" x="760" y="297" font-size="20" style="fill:var(--loss)">YOUR REACTION</text></g>
<g id="gap">
<path class="s-gain" d="M1090 300h20v330h-20" fill="none" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="1130" y="420" font-size="48" style="fill:var(--gain)">The gap</text>
<text class="d" x="1130" y="480" font-size="48">is the clue.</text>
</g>
<g id="older"><text class="m" x="1130" y="570" font-size="20">SOMETHING OLDER</text><text class="m" x="1130" y="602" font-size="20">THAN THIS MOMENT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">An old wound.</text>
<text class="b" x="120" y="176" font-size="32">The same light tap, on two different arms.</text>
<g id="a0">
<rect class="s-ink" x="160" y="480" width="560" height="120" rx="60" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="160" y="650" font-size="22">HEALTHY SKIN</text>
<rect id="fing0" class="ink" x="418" y="260" width="44" height="140" rx="22"/>
</g>
<g id="a1">
<rect class="s-ink" x="880" y="480" width="560" height="120" rx="60" fill="var(--stage)" stroke-width="6"/>
<ellipse id="bruise" class="loss" cx="1140" cy="540" rx="60" ry="40" fill-opacity=".75"/>
<text class="m" x="880" y="650" font-size="22">BRUISE</text>
<rect id="fing1" class="ink" x="1118" y="260" width="44" height="140" rx="22"/>
</g>
<g id="same"><text class="m" x="800" y="420" font-size="22" text-anchor="middle">SAME</text><text class="m" x="800" y="450" font-size="22" text-anchor="middle">TAP</text></g>
<g id="r0"><text class="d5" x="160" y="710" font-size="36">Barely hurts.</text></g>
<g id="r1"><g id="wr"></g><text class="d5" x="880" y="710" font-size="36" style="fill:var(--loss)">Wince.</text></g>
<g id="cap0"><text class="d" x="120" y="790" font-size="40">The tap isn’t the real problem.</text></g>
<g id="cap1"><text class="b" x="120" y="845" font-size="30">Triggers press on pain that never fully healed.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">It stings where you already doubt.</text>
<text class="b" x="120" y="176" font-size="32">If you felt secure, the comment would slide right off.</text>
<g id="pl"><circle id="fear" cx="450" cy="540" r="24" fill="var(--loss)" stroke="var(--stage)" stroke-width="4"/></g>
<g id="lab0"><text class="m" x="450" y="730" font-size="22" text-anchor="middle">PART OF YOU BELIEVES IT</text></g>
<g id="secure"><g id="pr"></g><circle class="s-gain" cx="1150" cy="490" r="170" fill="none" stroke-width="6"/><text class="m" x="1150" y="730" font-size="22" text-anchor="middle" style="fill:var(--gain)">SECURE ABOUT IT</text></g>
<path id="trail1" class="s-muted" d="M1015 329A210 210 0 0 1 1347 562" fill="none" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
<g id="c0"></g><g id="c1"></g>
<g id="fearL"><text class="m" x="450" y="772" font-size="22" text-anchor="middle" style="fill:var(--loss)">A FEAR YOU’RE STILL CARRYING</text></g>
<g id="nw"><text class="d" x="120" y="845" font-size="44">Not a weakness. Useful information.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Envy is a signpost too.</text>
<text class="b" x="120" y="176" font-size="32">Their life lights up something you want.</text>
<g id="ppl"><g id="py"></g><g id="pt"></g>
<text class="m" x="300" y="650" font-size="22" text-anchor="middle">YOU</text>
<text class="m" x="680" y="650" font-size="22" text-anchor="middle">THEIR LIFE</text></g>
<g id="envy"><path class="s-loss" d="M384 520H596" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><text class="m" x="490" y="500" font-size="22" text-anchor="middle" style="fill:var(--loss)">ENVY</text></g>
<g id="spot"><polygon class="gain" points="1150,236 1190,236 1300,690 1040,690" fill-opacity=".2"/><rect class="ink" x="1140" y="210" width="60" height="26" rx="6"/>
<text class="m" x="1170" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">A DESIRE YOU’VE BEEN HIDING</text></g>
<g id="door"><rect class="gain" x="1060" y="300" width="220" height="380"/>
<polygon id="dpan" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round" points="1060,300 1280,300 1280,680 1060,680"/>
<rect class="s-ink" x="1060" y="300" width="220" height="380" fill="none" stroke-width="7"/>
<text class="m" x="1170" y="720" font-size="22" text-anchor="middle">SOMETHING YOU WANT</text></g>
<g id="dir"><path class="s-gain" d="M300 690Q680 800 1040 620" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><path class="s-gain" d="M1004 624l36-4-14 34" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="120" y="845" font-size="44">Instead of shame, you get directions.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t bury it.</text>
<text class="b" x="120" y="176" font-size="32">A pressed lid only makes the pot boil over later.</text>
<g id="flm"></g>
<rect class="ink" x="300" y="500" width="40" height="20" rx="6"/><rect class="ink" x="760" y="500" width="40" height="20" rx="6"/>
<rect class="ink" x="340" y="470" width="420" height="250" rx="30"/>
<g id="lid"><rect class="ink" x="320" y="440" width="460" height="26" rx="13"/><rect class="ink" x="525" y="418" width="50" height="22" rx="8"/></g>
<g id="push"><path class="s-loss" d="M550 240V400M520 370l30 30 30-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="600" y="300" font-size="22" style="fill:var(--loss)">PUSH IT DOWN</text></g>
<g id="boil"><path class="s-muted" d="M330 420q-14-20 0-40t0-40M770 420q14-20 0-40t0-40" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M345 480v70M755 480v100M400 470v40" fill="none" stroke-width="9" stroke-linecap="round"/>
<text class="m" x="550" y="845" font-size="22" text-anchor="middle" style="fill:var(--loss)">LATER, IT BOILS OVER</text></g>
<g id="hid"><text class="m" x="920" y="340" font-size="22">PUSHED DOWN, IT STAYS HIDDEN</text>
<text class="d" x="920" y="420" font-size="40">The wound stays hidden,</text>
<text class="d" x="920" y="476" font-size="40">so it keeps getting hit.</text>
<text class="m" x="920" y="670" font-size="22">AGAIN AND AGAIN</text></g>
<g id="hits"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A signpost, not an enemy.</text>
<text class="b" x="120" y="176" font-size="32">Get curious instead of fighting the feeling.</text>
<g id="post"><path class="s-ink" d="M360 270V800M280 800h160" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="360" cy="262" r="14"/>
<polygon class="ink" points="150,320 190,280 520,280 520,360 190,360"/>
<polygon class="gain" points="200,410 530,410 570,450 530,490 200,490"/></g>
<g id="al"><text class="m" x="350" y="328" font-size="22" text-anchor="middle" style="fill:var(--stage)">BACK THEN</text><text class="m" x="380" y="458" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">NOW</text></g>
<rect class="s-line" x="680" y="230" width="800" height="580" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="q1"><text class="m" x="760" y="330" font-size="22" style="fill:var(--gain)">01</text><circle cx="722" cy="367" r="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d5" x="760" y="380" font-size="38">What does this moment remind me of?</text><path class="s-line" d="M760 410h660" stroke-width="3"/></g>
<g id="q2"><text class="m" x="760" y="490" font-size="22" style="fill:var(--gain)">02</text><circle cx="722" cy="527" r="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d5" x="760" y="540" font-size="38">What did I need back then?</text><path class="s-line" d="M760 570h660" stroke-width="3"/></g>
<g id="q3"><text class="m" x="760" y="650" font-size="22" style="fill:var(--gain)">03</text><circle cx="722" cy="687" r="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d5" x="760" y="700" font-size="38">What do I need now?</text><path class="s-line" d="M760 730h660" stroke-width="3"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tend the wound.</text>
<text class="b" x="120" y="176" font-size="32">Care for it directly, and the alarm quiets.</text>
<g id="arm7"><rect class="s-ink" x="160" y="260" width="520" height="110" rx="55" fill="var(--stage)" stroke-width="6"/><ellipse class="loss" cx="420" cy="315" rx="60" ry="36" fill-opacity=".75"/></g>
<g id="band"><rect class="gain" x="300" y="290" width="240" height="50" rx="25"/><path d="M400 305v20M420 305v20M440 305v20" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/></g>
<g id="chips7"></g>
<g id="bell"><g id="bellB"><path id="bellP" d="M890 520q10-150 70-150q60 0 70 150l20 18h-180z" fill="var(--loss)"/><circle class="ink" cx="960" cy="362" r="12"/><circle class="ink" cx="960" cy="552" r="16"/></g><g id="ring"></g>
<text class="m" x="960" y="640" font-size="22" text-anchor="middle">THE ALARM</text></g>
<g id="face"><circle class="s-ink" cx="1280" cy="450" r="100" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1245" cy="425" r="10"/><circle class="ink" cx="1315" cy="425" r="10"/>
<path id="mouth" class="s-ink" d="M1235 500Q1280 465 1325 500" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1280" y="640" font-size="22" text-anchor="middle">SAME MOMENTS,</text><text class="m" x="1280" y="672" font-size="22" text-anchor="middle" style="fill:var(--gain)">LESS GRIP</text></g>
<g id="heal"><text class="d" x="120" y="800" font-size="44">Healing the wound quiets the alarm.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">When something sets</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you off, pause and ask:</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">where is it pointing?</text></g>
<text class="m" x="143" y="700" font-size="26">GET CURIOUS · FOLLOW THE SIGN</text>
<path class="s-ink" d="M1380 640V800M1320 800h120" stroke-width="9" stroke-linecap="round"/>
<g id="sign8"><polygon class="gain" points="1260,620 1430,620 1470,650 1430,680 1260,680"/></g>
</g>