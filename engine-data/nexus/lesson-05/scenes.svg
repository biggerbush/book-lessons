<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Self-correction</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is what saves us.</text>
<text class="b" x="120" y="600" font-size="32">Why networks that admit mistakes beat networks that hide them</text>
<g id="cdl">
<circle id="glow" class="gain" cx="1320" cy="370" r="90" fill-opacity=".15"/>
<path id="flame" class="gain" d="M1320 330c-30 40-30 76 0 76s30-36 0-76z"/>
<path class="s-ink" d="M1320 430v-24" stroke-width="5" stroke-linecap="round"/>
<rect class="s-ink" x="1280" y="430" width="80" height="220" rx="8" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1240" y="650" width="160" height="16" rx="6"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The printing press spreads.</text>
<text class="b" x="120" y="176" font-size="32">Europe, late 1400s: many hoped it would spread truth and wisdom.</text>
<g id="prs">
<g id="plat"><path class="s-ink" d="M352 260v120" stroke-width="10"/><rect class="s-ink" x="262" y="380" width="180" height="40" rx="4" fill="var(--stage)" stroke-width="6"/></g>
<path class="s-ink" d="M352 226v34M312 232h80" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="180" y="260" width="344" height="36" rx="6"/>
<rect class="ink" x="190" y="296" width="24" height="410"/><rect class="ink" x="490" y="296" width="24" height="410"/>
<rect x="270" y="462" width="164" height="8" fill="var(--ice)"/>
<rect class="s-ink" x="230" y="470" width="244" height="30" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M260 600h184M260 625h184M260 650h184" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="160" y="700" width="384" height="20" rx="6"/>
<text class="m" x="352" y="770" font-size="20" text-anchor="middle">PRINTING PRESS</text>
</g>
<g id="hope">
<rect class="s-gain" x="590" y="340" width="150" height="190" fill="var(--stage)" stroke-width="5"/>
<rect class="s-gain" x="630" y="370" width="150" height="190" fill="var(--stage)" stroke-width="5"/>
<rect class="s-gain" x="670" y="400" width="150" height="190" fill="var(--stage)" stroke-width="5"/>
<path class="s-gain" d="M695 440h100M695 480h100M695 520h70" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="705" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">HOPE: TRUTH</text>
<text class="m" x="705" y="670" font-size="20" text-anchor="middle" style="fill:var(--gain)">&amp; WISDOM</text>
</g>
<g id="wb">
<rect class="loss" x="890" y="300" width="260" height="360" rx="8"/>
<rect x="890" y="300" width="26" height="360" fill="var(--ink)" fill-opacity=".25"/>
<text class="d" x="1030" y="430" font-size="32" text-anchor="middle" style="fill:var(--stage)">HAMMER</text>
<text class="d" x="1030" y="472" font-size="32" text-anchor="middle" style="fill:var(--stage)">OF THE</text>
<text class="d" x="1030" y="514" font-size="32" text-anchor="middle" style="fill:var(--stage)">WITCHES</text>
<text class="m" x="1020" y="700" font-size="20" text-anchor="middle">AN EARLY BESTSELLER</text>
</g>
<g id="kr">
<g id="krp"></g>
<rect class="s-ink" x="1200" y="250" width="280" height="140" rx="16" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1320 390l20 34 10-34" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1340" y="302" font-size="20" text-anchor="middle" style="fill:var(--loss)">A VAST</text>
<text class="m" x="1340" y="332" font-size="20" text-anchor="middle" style="fill:var(--loss)">CONSPIRACY</text>
<text class="m" x="1340" y="362" font-size="20" text-anchor="middle" style="fill:var(--loss)">OF WITCHES</text>
<text class="m" x="1340" y="640" font-size="20" text-anchor="middle">HEINRICH KRAMER</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A machine for making errors.</text>
<text class="b" x="120" y="176" font-size="32">Torture produced confessions. Confessions produced names.</text>
<g id="webE"></g>
<g id="acc">
<circle class="loss" cx="220" cy="520" r="34"/>
<path class="s-loss" d="M160 470l14 12-12 10 14 12M280 470l-14 12 12 10-14 12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="120" y="610" font-size="20">ACCUSED</text>
<text class="m" x="120" y="640" font-size="20">UNDER TORTURE</text>
</g>
<g id="conf">
<rect class="s-ink" x="130" y="320" width="200" height="64" rx="14" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M200 384l10 30 20-30" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="230" y="360" font-size="20" text-anchor="middle">NAMES…</text>
</g>
<g id="webN"></g>
<g id="webL"><text class="m" x="120" y="800" font-size="20">EACH NAME: A NEW ARREST, A NEW CONFESSION</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No way to say stop.</text>
<text class="b" x="120" y="176" font-size="32">Every confession seemed to prove the conspiracy was real.</text>
<g id="lp">
<circle class="s-loss" cx="440" cy="480" r="170" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="lpD" class="loss" r="12"/>
<g id="lpP"></g>
</g>
<g id="jd">
<path class="ink" d="M940 262c-24-14-56-14-80-6v56c24-8 56-8 80 6 24-14 56-14 80-6v-56c-24-8-56-8-80 6z"/>
<g id="jdP"></g>
<text class="m" x="810" y="560" font-size="18" text-anchor="middle">JUDGE</text>
<text class="m" x="940" y="560" font-size="18" text-anchor="middle">PREACHER</text>
<text class="m" x="1070" y="560" font-size="18" text-anchor="middle">SCHOLAR</text>
<text class="m" x="940" y="600" font-size="20" text-anchor="middle">SAME BOOKS, SAME ASSUMPTIONS</text>
</g>
<g id="ld">
<rect class="s-ink" x="1230" y="250" width="180" height="280" rx="6" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="1390" cy="390" r="8"/>
<path class="s-loss" d="M1290 400v-24a30 30 0 0 1 60 0v24" fill="none" stroke-width="10"/>
<rect class="loss" x="1278" y="398" width="84" height="64" rx="8"/>
<text class="m" x="1320" y="575" font-size="20" text-anchor="middle">NO REWARD FOR ASKING:</text>
<text class="m" x="1320" y="603" font-size="20" text-anchor="middle" style="fill:var(--loss)">“IS THIS A MISTAKE?”</text>
</g>
<g id="dgP"></g>
<g id="dgL"><text class="m" x="1116" y="812" font-size="20" text-anchor="middle">MANY THOUSANDS OF INNOCENT PEOPLE DIED</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Science works differently.</text>
<text class="b" x="120" y="176" font-size="32">Its institutions are built to test claims and expose flaws.</text>
<g id="sci">
<path class="s-line" d="M190 440H370" stroke-width="4"/>
<g id="sciP"></g>
<text class="m" x="120" y="600" font-size="20">A NETWORK OF PEOPLE</text>
</g>
<line id="arwL" class="s-gain" x1="418" y1="450" x2="418" y2="450" stroke-width="7" stroke-linecap="round"/>
<path id="arwH" class="s-gain" d="M526 432l18 18-18 18" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="jr">
<rect class="s-ink" x="560" y="320" width="300" height="260" rx="16" fill="var(--stage)" stroke-width="6"/>
<text class="d5" x="710" y="430" font-size="36" text-anchor="middle">Journals</text>
<text class="d5" x="710" y="476" font-size="36" text-anchor="middle">&amp; academies</text>
<text class="m" x="710" y="530" font-size="18" text-anchor="middle">TEST · CHECK · REPEAT</text>
</g>
<g id="rs">
<path class="s-gain" d="M960 360l14 14 26-30M960 450l14 14 26-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M962 522l36 36M998 522l-36 36" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1020" y="547" font-size="18" style="fill:var(--loss)">FLAW EXPOSED</text>
</g>
<g id="tr">
<rect class="s-ink" x="1205" y="226" width="230" height="56" rx="8" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="1320" y="262" font-size="22" text-anchor="middle">FAMOUS IDEA</text>
<line id="fstk" class="s-loss" x1="1222" y1="255" x2="1222" y2="255" stroke-width="3" stroke-linecap="round"/>
<path class="gain" d="M1250 330h140v60a70 70 0 0 1-140 0z"/>
<path class="s-gain" d="M1250 350h-30a30 30 0 0 0 30 40M1390 350h30a30 30 0 0 1-30 40" fill="none" stroke-width="8"/>
<rect class="gain" x="1308" y="458" width="24" height="50"/><rect class="gain" x="1270" y="508" width="100" height="20" rx="4"/>
<text class="m" x="1320" y="590" font-size="20" text-anchor="middle">FAME FOR PROVING</text>
<text class="m" x="1320" y="618" font-size="20" text-anchor="middle">A FAMOUS IDEA WRONG</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Expecting to be wrong.</text>
<text class="b" x="120" y="176" font-size="32">Scientists are not smarter or more honest than anyone else.</text>
<g id="eq">
<g id="eqP"></g>
<text class="d" x="320" y="470" font-size="80" text-anchor="middle" style="fill:var(--muted)">=</text>
<text class="m" x="200" y="556" font-size="22" text-anchor="middle">SCIENTIST</text>
<text class="m" x="440" y="556" font-size="22" text-anchor="middle">ANYONE ELSE</text>
</g>
<rect class="s-ink" x="640" y="240" width="460" height="560" rx="10" fill="var(--stage)" stroke-width="5"/>
<g id="ppL"></g><g id="errs"></g><g id="rings"></g>
<g id="mag"><circle class="s-ink" r="50" fill="var(--stage)" fill-opacity=".3" stroke-width="10"/><path class="s-ink" d="M36 36L80 80" stroke-width="14" stroke-linecap="round"/></g>
<g id="st0"><rect class="s-ink" x="1160" y="300" width="320" height="84" rx="16" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1190" y="354" font-size="34">Expect errors</text></g>
<g id="st1"><rect class="s-ink" x="1160" y="420" width="320" height="84" rx="16" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1190" y="474" font-size="34">Search for them</text></g>
<g id="st2"><rect class="gain" x="1160" y="540" width="320" height="84" rx="16"/><text class="d5" x="1190" y="594" font-size="34" style="fill:var(--on-gain)">Admit publicly</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why self-correction wins.</text>
<text class="b" x="120" y="176" font-size="32">Over time, the two kinds of networks drift apart.</text>
<g id="tp">
<path class="s-gain" d="M214 514L300 480" stroke-width="8" stroke-linecap="round"/>
<path class="s-loss" d="M212 534L518 544" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>
<circle class="ink" cx="200" cy="520" r="14"/>
<text class="m" x="196" y="486" font-size="22" text-anchor="middle">START</text>
</g>
<g id="stp"></g>
<circle id="clb" class="gain" r="16"/>
<g id="pl"></g>
<g id="plL"><text class="m" x="720" y="760" font-size="20" style="fill:var(--loss)">CAN’T CORRECT ITSELF</text><text class="m" x="720" y="792" font-size="20">MISTAKE PILED ON MISTAKE</text></g>
<g id="stL"><text class="m" x="1480" y="390" font-size="20" text-anchor="end" style="fill:var(--gain)">CAN CORRECT ITSELF</text><text class="m" x="1480" y="420" font-size="20" text-anchor="end">CLIMBS TOWARD BETTER ANSWERS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your own network.</text>
<text class="b" x="120" y="176" font-size="32">Your family, team or company is an information network too.</text>
<g id="tm">
<g id="tmP"></g>
<ellipse cx="560" cy="540" rx="280" ry="50" fill="var(--line)" stroke="var(--ink)" stroke-width="6"/>
<text class="m" x="560" y="640" font-size="20" text-anchor="middle">AN INFORMATION NETWORK</text>
</g>
<g id="hnd"><path class="s-gain" d="M790 500L830 372" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="832" cy="362" r="14"/></g>
<g id="q7">
<text class="m" x="960" y="330" font-size="22">IS ANYONE REWARDED FOR</text>
<text class="m" x="960" y="362" font-size="22">POINTING OUT A MISTAKE?</text>
<text class="d" x="1380" y="380" font-size="120" text-anchor="middle" style="fill:var(--gain)">?</text>
</g>
<g id="gx0"><path class="s-loss" d="M988 568l24 24m0-24l-24 24" stroke-width="6" stroke-linecap="round"/></g>
<g id="gc0"><path class="s-muted" d="M1042 568l12 12-12 12" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="gx1"><path class="s-loss" d="M1084 554l52 52m0-52l-52 52" stroke-width="8" stroke-linecap="round"/></g>
<g id="gc1"><path class="s-muted" d="M1166 568l12 12-12 12" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="gx2"><path id="bigx" class="s-loss" d="M1214 532l96 96m0-96l-96 96" stroke-width="12" stroke-linecap="round"/></g>
<g id="gface">
<path class="ink" d="M1370 650v-30a50 50 0 0 1 100 0v30z"/>
<circle class="s-ink" cx="1420" cy="530" r="34" fill="var(--stage)" stroke-width="5"/>
<circle class="ink" cx="1408" cy="520" r="4"/><circle class="ink" cx="1432" cy="520" r="4"/>
<rect class="loss" x="1394" y="538" width="52" height="20" rx="10"/>
</g>
<g id="gr">
<text class="m" x="960" y="760" font-size="20">IF NOT, SMALL ERRORS QUIETLY GROW</text>
<text class="m" x="960" y="790" font-size="20">BECAUSE NO ONE DARES TO NAME THEM</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Who is truly allowed</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">to tell you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">that you are <tspan style="fill:var(--gain)">wrong?</tspan></text></g>
<g id="tk">
<text class="m" x="143" y="700" font-size="26">THIS WEEK: THANK SOMEONE FOR CATCHING A MISTAKE</text>
<rect class="gain" x="1180" y="640" width="290" height="100" rx="50"/>
<path class="gain" d="M1240 730l-20 50 60-44z"/>
<text class="m" x="1325" y="700" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THANK YOU</text>
</g>
</g>