<path class="s-muted" d="M350 422l30 56M400 422l30 56M450 422l30 56M500 422l30 56" stroke-width="5"/>
<text class="m" x="160" y="560" font-size="22" style="fill:var(--muted)">A QUARTER INCH DRILL BIT</text>
</g>
</g>
<g id="bX"><path class="s-loss" d="M690 420l60 60M750 420l-60 60" fill="none" stroke-width="9" stroke-linecap="round"/></g>
<g id="wall">
