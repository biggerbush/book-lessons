<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A label names the emotion.</text>
<text class="b" x="120" y="176" font-size="32">Spot a feeling in the other person. Say it out loud.</text>
<g id="you1"></g><text class="m" x="320" y="790" font-size="22" text-anchor="middle">YOU</text>
<g id="th1"></g><text class="m" x="1260" y="790" font-size="22" text-anchor="middle">THEM</text>
<g id="tag1"><rect class="gain" x="1160" y="440" width="200" height="56" rx="12"/><text class="m" x="1260" y="476" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">FRUSTRATED</text></g>
<g id="spot"><path id="spotL" class="s-muted" d="M380 560H1200" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="790" y="604" font-size="20" text-anchor="middle">SPOT IT</text></g>
<g id="bb1"></g><g id="bb2"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three ways to start a label.</text>
<text class="b" x="120" y="176" font-size="32">Soft openers, no “I”, then silence.</text>
<g id="ph0"><rect class="gain" x="120" y="230" width="600" height="90" rx="16"/><text class="d5" x="150" y="290" font-size="42" style="fill:var(--on-gain)">It sounds like…</text></g>
<g id="ph1"><rect class="gain" x="120" y="340" width="600" height="90" rx="16"/><text class="d5" x="150" y="400" font-size="42" style="fill:var(--on-gain)">It seems like…</text></g>
<g id="ph2"><rect class="gain" x="120" y="450" width="600" height="90" rx="16"/><text class="d5" x="150" y="510" font-size="42" style="fill:var(--on-gain)">It looks like…</text></g>
<g id="noI">
<text class="d" x="1250" y="392" font-size="150" text-anchor="middle">I</text>
<circle class="s-loss" cx="1250" cy="340" r="110" fill="none" stroke-width="12"/>
<path class="s-loss" d="M1172 262L1328 418" stroke-width="12" stroke-linecap="round"/>
<text class="m" x="1250" y="500" font-size="22" text-anchor="middle">AVOID STARTING WITH “I”</text>
<text class="m" x="1250" y="534" font-size="22" text-anchor="middle">IT TURNS THE MOMENT TO YOU</text>
</g>
<g id="clk">
<rect class="ink" x="285" y="600" width="30" height="16" rx="4"/>
<circle class="s-ink" cx="300" cy="700" r="80" fill="var(--stage)" stroke-width="7"/>
<path id="hand" class="s-gain" d="M300 700V640" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="300" cy="700" r="8"/>
<text class="d" x="440" y="690" font-size="52">Then stop talking.</text>
<text class="m" x="440" y="740" font-size="22">LET THE SILENCE DO ITS WORK</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Harlem door.</text>
<text class="b" x="120" y="176" font-size="32">Hours of calm labels, spoken through a closed door.</text>
<g id="voss"></g><text class="m" x="220" y="790" font-size="22" text-anchor="middle">VOSS</text>
