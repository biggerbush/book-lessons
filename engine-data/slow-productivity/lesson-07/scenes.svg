<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Obsess over</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">quality.</text>
<text class="b" x="120" y="600" font-size="32">Excellent work is your ticket to a calmer pace.</text>
<ellipse class="s-line" cx="1300" cy="650" rx="130" ry="14" fill="none" stroke-width="4"/>
<g id="tgem"></g><g id="tspk"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The keystone idea.</text>
<text class="b" x="120" y="176" font-size="32">Quality is what holds the other two principles together.</text>
<rect class="ink" x="300" y="740" width="1000" height="26" rx="6"/>
<g id="pils">
<g id="pl0"><rect class="s-ink" x="340" y="420" width="200" height="320" fill="var(--stage)" stroke-width="6"/><text class="m" x="440" y="570" font-size="22" text-anchor="middle">DO FEWER</text><text class="m" x="440" y="602" font-size="22" text-anchor="middle">THINGS</text></g>
<g id="pl1"><rect class="s-ink" x="1060" y="420" width="200" height="320" fill="var(--stage)" stroke-width="6"/><text class="m" x="1160" y="570" font-size="22" text-anchor="middle">NATURAL</text><text class="m" x="1160" y="602" font-size="22" text-anchor="middle">PACE</text></g>
<g id="arc"><polygon class="s-ink" points="340,420 540,420 720,390 690,280" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><polygon class="s-ink" points="1260,420 1060,420 880,390 910,280" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
</g>
<g id="kst"><text class="m" x="800" y="250" font-size="20" text-anchor="middle" style="fill:var(--gain)">OBSESS OVER QUALITY</text><polygon class="gain" points="690,280 910,280 880,390 720,390"/><text class="d" x="800" y="348" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">QUALITY</text></g>
<g id="kcap"><text class="d5" x="120" y="840" font-size="36">Excellent work: the reason to slow down, and the way to do it.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A singer in a coffee shop.</text>
<text class="b" x="120" y="176" font-size="32">Newport tells the story of Jewel, early in her career.</text>
<rect class="s-line" x="120" y="230" width="780" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">COFFEE SHOP</text>
<rect class="ink" x="150" y="600" width="320" height="18" rx="4"/>
<g id="jw"></g><g id="notes"></g><g id="crowd2"></g><g id="lbls"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">She chose the smaller offer.</text>
<text class="b" x="120" y="176" font-size="32">Less pressure bought her time to grow.</text>
<g id="bc"><rect class="s-ink" x="120" y="240" width="520" height="170" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="150" y="290" font-size="22">HUGE SIGNING BONUS</text><text class="d" x="150" y="375" font-size="64">$$$$$$</text></g>
<line id="bcs" class="s-loss" x1="130" y1="400" x2="130" y2="400" stroke-width="8" stroke-linecap="round"/>
<g id="sc"><rect class="s-gain" x="120" y="450" width="380" height="130" rx="12" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="495" font-size="22">SMALLER DEAL</text><text class="d" x="150" y="560" font-size="56" style="fill:var(--gain)">$$</text><circle class="gain" cx="560" cy="515" r="34"/><path d="M544 516l11 11 21-22" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="tg"><text class="m" x="120" y="650" font-size="22">TIME TO GROW</text><rect class="s-line" x="120" y="670" width="520" height="24" rx="12" fill="none" stroke-width="3"/><rect id="tgf" class="gain" x="120" y="670" width="0" height="24" rx="12"/></g>
<g id="ch3"><path class="s-muted" d="M760 260V720H1460" fill="none" stroke-width="4"/><text class="m" x="770" y="250" font-size="20">SUCCESS</text><text class="m" x="1460" y="756" font-size="20" text-anchor="end">TIME</text><text class="m" x="770" y="756" font-size="20">DEBUT ALBUM</text></g>
<path id="crv" class="s-gain" d="M780 700C1100 690 1250 640 1300 520S1400 300 1430 280" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
