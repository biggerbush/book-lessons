<text class="d5" x="150" y="650" font-size="38">Drawn to similar</text>
<g id="w0t"><text class="m" x="150" y="700" font-size="20">YOUR OWN WORDS FEEL</text><text class="m" x="150" y="730" font-size="20">LIKE BEING UNDERSTOOD</text></g></g>
