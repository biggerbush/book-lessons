<g id="hlt"><text class="d" x="120" y="780" font-size="44">A healthy team needs both kinds of growth.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The classic mistake.</text>
<text class="b" x="120" y="176" font-size="32">Rewarding a great rock star with a management job.</text>
