<g id="qb"><text class="d" x="136" y="668" font-size="88" letter-spacing="-2">or just a <tspan style="fill:var(--loss)">ticker</tspan>?</text></g>
<g id="qn"><text class="m" x="143" y="770" font-size="26">BUY THE BUSINESS, NOT THE TICKER</text></g>
</g>