<g id="fp0"><g id="fpb0" transform="translate(1140 380) scale(.85)"><path d="M-40 -70h80l-20 30c70 30 90 140 30 160h-100c-60-20-40-130 30-160z" fill="var(--gain)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><path d="M-26 -40h52" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/></g>
