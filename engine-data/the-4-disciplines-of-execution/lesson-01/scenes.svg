<g id="cul"><text class="m" x="1040" y="540" font-size="22" style="fill:var(--gain)">REAL CULPRIT: THE WHIRLWIND</text></g>
<g id="mag"><g id="magi"><circle class="s-gain" cx="0" cy="0" r="80" fill="none" stroke-width="12"/><path class="s-gain" d="M57 57l60 60" stroke-width="22" stroke-linecap="round"/></g></g>
<g id="seetx"><text class="d" x="120" y="830" font-size="44">Once you see it, you can protect your goal.</text></g>
</g>

<g id="s8" opacity="0">
<g id="sw"><circle class="s-ink" cx="1340" cy="230" r="70" fill="var(--stage)" stroke-width="7"/><path id="swedge" class="loss" fill-opacity=".8"/><path id="shand" class="s-ink" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="1326" y="138" width="28" height="16" rx="4"/></g>
<g id="q0"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">How much of your day</text></g>
<g id="q1"><text class="d" x="136" y="510" font-size="88" letter-spacing="-2">does the whirlwind take?</text></g>
