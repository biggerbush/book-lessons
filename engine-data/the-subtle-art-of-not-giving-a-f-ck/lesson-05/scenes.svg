<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE SUBTLE ART OF NOT GIVING A F*CK · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Responsibility is not</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the same as fault.</text>
<text class="b" x="120" y="600" font-size="32">It may not be your fault, but it’s yours to handle.</text>
<g transform="translate(-30 -30)">
<g id="mug"><rect class="s-ink" x="1220" y="660" width="180" height="180" rx="18" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1400 700c70 0 70 100 0 100" fill="none" stroke-width="7"/></g>
<path id="crack" class="s-loss" d="M1300 660l22 40-26 34 24 38-16 40" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="tape"><rect class="gain" x="1240" y="728" width="140" height="34" rx="6" transform="rotate(-12 1310 745)"/></g>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A baby at your door.</text>
<text class="b" x="120" y="176" font-size="32">Mark Manson’s thought experiment.</text>
<path class="s-line" d="M120 780H1480" stroke-width="5"/>
<rect class="s-ink" x="180" y="250" width="300" height="530" fill="var(--stage)" stroke-width="8"/>
<rect id="panel" class="s-ink" x="190" y="260" width="280" height="520" fill="var(--line)" stroke-width="5"/>
<circle id="knob" class="gain" cx="440" cy="530" r="12"/>
<g id="basket"><path class="s-ink" d="M580 700a80 80 0 0 1 160 0" fill="none" stroke-width="7"/><circle class="s-ink" cx="660" cy="690" r="30" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M555 700h210l-24 76H579z"/><path d="M575 728h170M585 752h150" stroke="var(--stage)" stroke-width="4"/></g>
<g id="nf"><text class="m" x="660" y="836" font-size="22" text-anchor="middle">NOT YOUR FAULT</text></g>
<g id="ch0"><path class="s-ink" d="M720 620C800 420 840 355 920 355m-22-16 22 16-22 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="940" y="300" width="540" height="110" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d5" x="980" y="370" font-size="40">Care for it</text></g>
<g id="ch1"><path class="s-ink" d="M745 650C820 600 860 555 920 555m-22-16 22 16-22 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="940" y="500" width="540" height="110" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d5" x="980" y="570" font-size="40">Call for help</text></g>
<g id="resp"><rect class="gain" x="940" y="680" width="540" height="80" rx="40"/><text class="m" x="1210" y="729" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">EITHER WAY, YOU ARE RESPONSIBLE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two different words.</text>
<text class="b" x="120" y="176" font-size="32">Fault and responsibility are not the same thing.</text>
<g id="scale"><path class="s-ink" d="M800 280V540M720 540h160" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M440 280H1160" stroke-width="8" stroke-linecap="round"/><path class="s-muted" d="M440 280L280 400M440 280L600 400M1160 280L1000 400M1160 280L1320 400" stroke-width="3"/><path class="s-ink" d="M280 400q160 50 320 0M1000 400q160 50 320 0" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="d" x="440" y="490" font-size="48" text-anchor="middle" style="fill:var(--loss)">Fault</text><text class="d" x="1160" y="490" font-size="48" text-anchor="middle" style="fill:var(--gain)">Responsibility</text></g></g>
<g id="fp"><rect class="ink" x="330" y="540" width="90" height="80" rx="26"/><rect class="ink" x="400" y="548" width="130" height="26" rx="13"/><text class="m" x="440" y="730" font-size="24" text-anchor="middle">WHO CAUSED IT · THEN</text></g>
<g id="oh"><circle class="loss" cx="1160" cy="560" r="26"/><path class="gain" d="M1040 560q120 130 240 0q-120 50-240 0z"/><text class="m" x="1160" y="730" font-size="24" text-anchor="middle" style="fill:var(--gain)">WHO HANDLES IT · NOW</text></g>
<g id="blame"><text class="d" x="120" y="830" font-size="40">Taking responsibility is not admitting blame.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Past tense, present tense.</text>
<text class="b" x="120" y="176" font-size="32">Fault looks back. Responsibility starts now.</text>
<path class="s-line" d="M160 560H1440" stroke-width="6"/>
<g id="cal"><rect class="s-ink" x="260" y="290" width="200" height="200" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="260" y="290" width="200" height="50"/><path class="s-ink" d="M310 275v30M410 275v30" stroke-width="8" stroke-linecap="round"/><text class="d" x="360" y="440" font-size="52" text-anchor="middle" style="fill:var(--muted)">THEN</text></g>
<g id="clk"><circle class="s-ink" cx="900" cy="400" r="90" fill="var(--stage)" stroke-width="7"/><line id="hh" class="s-ink" x1="900" y1="400" x2="900" y2="350" stroke-width="8" stroke-linecap="round"/><line id="hm" class="s-gain" x1="900" y1="400" x2="900" y2="330" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M900 520V600" stroke-width="6" stroke-linecap="round"/><text class="m" x="900" y="640" font-size="24" text-anchor="middle">NOW</text></g>
<g id="past"><path class="s-loss" d="M160 560H880" stroke-width="10"/><text class="m" x="160" y="630" font-size="22" style="fill:var(--loss)">FAULT: ALREADY HAPPENED</text></g>
<g id="fut"><path class="s-gain" d="M920 560H1420m-26-22 26 22-26 22" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="960" y="630" font-size="22" style="fill:var(--gain)">RESPONSIBILITY: YOUR MOVE</text></g>
<g id="t1"><text class="d" x="120" y="760" font-size="46">You can’t change what happened.</text></g>
<g id="t2"><text class="d" x="120" y="830" font-size="46" style="fill:var(--gain)">You can choose what you do next.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Play the hand you’re dealt.</text>
<text class="b" x="120" y="176" font-size="32">Life is like a game of poker.</text>
<g id="tbl"><ellipse cx="800" cy="500" rx="600" ry="220" fill="var(--loss)" fill-opacity=".14" stroke="var(--ink)" stroke-width="7"/><ellipse class="s-line" cx="800" cy="500" rx="540" ry="180" fill="none" stroke-width="3" stroke-dasharray="10 10"/></g>
<g id="cards"></g>
<g id="chips4"></g>
<g id="lb0"><text class="m" x="120" y="800" font-size="24">YOU DON’T PICK THE CARDS</text></g>
<g id="lb1"><text class="m" x="1480" y="800" font-size="24" text-anchor="end" style="fill:var(--gain)">YOU CHOOSE HOW TO PLAY THEM</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A struggling young man.</text>
<text class="b" x="120" y="176" font-size="32">The story of William James.</text>
<g id="jm"><text class="m" x="410" y="700" font-size="22" text-anchor="middle">WILLIAM JAMES</text></g>
<g id="bed"><rect class="s-ink" x="200" y="540" width="420" height="70" rx="14" fill="var(--line)" stroke-width="5"/><rect class="ink" x="186" y="470" width="20" height="180" rx="6"/><path class="s-ink" d="M230 610v40M590 610v40" stroke-width="8" stroke-linecap="round"/></g>
<g id="cloud"><circle class="loss" cx="360" cy="245" r="30"/><circle class="loss" cx="410" cy="232" r="38"/><circle class="loss" cx="460" cy="245" r="30"/><rect class="loss" x="360" y="240" width="100" height="35"/><path class="s-loss" d="M370 288l-8 20M410 288l-8 20M450 288l-8 20" stroke-width="5" stroke-linecap="round"/></g>
<g id="pr0"><rect x="760" y="260" width="720" height="100" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="800" y="324" font-size="36">Sickly</text></g>
<g id="pr1"><rect x="760" y="390" width="720" height="100" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="800" y="454" font-size="36">Failing at career after career</text></g>
<g id="pr2"><rect x="760" y="520" width="720" height="100" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="800" y="584" font-size="36">Felt he was letting his father down</text></g>
<g id="desp"><text class="d" x="120" y="800" font-size="56" style="fill:var(--loss)">He sank into deep despair.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A one-year experiment.</text>
<text class="b" x="120" y="176" font-size="32">William James tries something new.</text>
<g id="nb"><rect class="s-ink" x="140" y="240" width="380" height="400" rx="14" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M140 300H520M170 420H490M170 480H490M170 550H490" stroke-width="3"/><text class="m" x="170" y="282" font-size="24">FOR ONE YEAR</text></g>
<g id="vow"><text class="d5" x="170" y="405" font-size="32">Act as if I am</text><text class="d5" x="170" y="465" font-size="32">responsible for</text><text class="d" x="170" y="535" font-size="40" style="fill:var(--gain)">everything.</text><path class="s-gain" d="M180 590l20 20 40-40" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="path6"><path class="s-ink" d="M620 700H784V630H948V560H1112V490H1276V420H1440" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="ff"><text class="m" x="1480" y="250" font-size="22" text-anchor="end" style="fill:var(--gain)">FOUNDING FIGURE OF</text><text class="m" x="1480" y="282" font-size="22" text-anchor="end" style="fill:var(--gain)">AMERICAN PSYCHOLOGY</text></g>
<g id="rocks"></g>
<g id="climb"></g>
<g id="nv"><text class="d" x="120" y="790" font-size="40">His problems did not vanish.</text></g>
<g id="mt"><text class="d" x="120" y="850" font-size="40" style="fill:var(--gain)">What changed was how he chose to meet them.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">You are always choosing.</text>
<text class="b" x="120" y="176" font-size="32">Whatever happens, the response is yours.</text>
<g id="sits"></g>
<g id="me7"></g>
<g id="bl">
<path class="s-loss" d="M780 560Q620 590 486 626" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
<rect class="loss" x="380" y="540" width="96" height="150" rx="4"/>
<path d="M380 577.5h96M380 615h96M380 652.5h96M428 540v37.5M404 577.5v37.5M452 577.5v37.5M428 615v37.5M404 652.5v37.5M452 652.5v37.5" stroke="var(--stage)" stroke-width="4"/>
<text class="m" x="428" y="740" font-size="22" text-anchor="middle" style="fill:var(--loss)">BLAME · STAY STUCK</text>
</g>
<g id="ow"><path class="s-gain" d="M820 560Q1000 600 1160 560T1400 470M1372 466L1400 470L1386 494" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1160" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">OWN IT · MOVE</text></g>
<g id="pen7"><path class="gain" d="M1342 676l80-80 22 22-80 80-30 8z"/><path d="M1352 686l12 12" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/></g>
<g id="pw"><text class="d" x="120" y="830" font-size="48">Ownership hands the power back to you.</text></g>
</g>

<g id="s8" opacity="0">
<g id="ql"><text class="m" x="143" y="260" font-size="26">THINK OF ONE PROBLEM THAT ISN’T YOUR FAULT</text></g>
<g id="qa"><text class="d" x="136" y="400" font-size="84" letter-spacing="-2">What’s one small way you</text></g>
<g id="qb"><text class="d" x="136" y="500" font-size="84" letter-spacing="-2">could take <tspan style="fill:var(--gain)">responsibility</tspan></text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="84" letter-spacing="-2">for it today?</text></g>
<text class="m" x="143" y="720" font-size="26">NOT YOUR FAULT. STILL YOURS TO HANDLE.</text>
<g id="qm"><circle class="gain" cx="1360" cy="720" r="70"/><text class="d" x="1360" y="752" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
</g>