<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The reverse question.</text>
<text class="b" x="120" y="176" font-size="32">A simple test for any existing commitment.</text>
<g id="cl6"><g id="cls6"></g>
<text id="qa6" class="d5" x="780" y="360" font-size="34" text-anchor="middle">If I weren’t already doing this,</text>
<text id="qb6" class="d5" x="780" y="404" font-size="34" text-anchor="middle">how hard would I work</text>
<text id="qc6" class="d5" x="780" y="448" font-size="34" text-anchor="middle" style="fill:var(--gain)">to get into it?</text></g>
<g id="dr6"><rect class="s-ink" x="1240" y="420" width="160" height="340" fill="var(--stage)" stroke-width="7"/>
<rect id="gl6" class="gain" x="1247" y="427" width="146" height="333"/>
<polygon id="dp6" class="s-ink" fill="var(--line)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1320" y="800" font-size="20" text-anchor="middle">EXIT</text></g>
<g id="ex6"><text class="m" x="1320" y="395" font-size="20" text-anchor="middle" style="fill:var(--gain)">NOT MUCH? WALK AWAY</text></g>
