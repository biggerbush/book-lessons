<rect x="1130" y="290" width="180" height="36" rx="18" fill="var(--line)"/><rect x="1230" y="340" width="160" height="36" rx="18" fill="var(--line)"/><rect x="1130" y="390" width="200" height="36" rx="18" fill="var(--line)"/>
<rect class="s-ink" x="1130" y="450" width="260" height="160" rx="10" fill="none" stroke-width="4"/><g id="pf"></g>
<text class="m" x="1130" y="670" font-size="20" style="fill:var(--loss)">YOU WEREN'T IN IT</text></g>
<g id="home"><path class="s-ink" d="M160 770L210 720L260 770V830H160Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
