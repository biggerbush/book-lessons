<g id="obl"><text class="d5" x="170" y="356" font-size="36" style="fill:var(--gain)">OBLIGATION</text></g>
<g id="q2"><text class="d5" x="600" y="290" font-size="40">“Success is your duty,</text><text class="d5" x="600" y="342" font-size="40">obligation, and</text><text class="d5" x="600" y="394" font-size="40">responsibility.”</text><text class="m" x="600" y="440" font-size="20">GRANT CARDONE</text></g>
