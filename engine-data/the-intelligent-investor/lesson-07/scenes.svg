<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Margin</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Safety.</text>
<text class="b" x="120" y="600" font-size="32">Why the gap between price and value protects you.</text>
<path class="s-line" d="M1100 720h380" stroke-width="5" stroke-linecap="round"/>
<rect id="cush" class="gain" x="1130" y="640" width="320" height="80" rx="36"/>
<rect id="box0" class="ink" x="1230" y="260" width="120" height="120" rx="8"/>
<g id="cl0"><text class="m" x="1290" y="770" font-size="20" text-anchor="middle">YOUR CUSHION</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three words.</text>
<text class="b" x="120" y="176" font-size="32">Graham summed up sound investing in a single motto.</text>
<path class="s-line" d="M140 720h1320" stroke-width="5" stroke-linecap="round"/>
<g id="gra"></g>
<path id="say" class="s-muted" d="M370 460L520 400" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
<g id="sign">
<path class="s-ink" d="M720 520v200M1240 520v200" stroke-width="10" stroke-linecap="round"/>
<rect class="s-ink" x="540" y="280" width="880" height="240" rx="18" fill="var(--stage)" stroke-width="8"/>
<text class="m" x="980" y="330" font-size="20" text-anchor="middle">THE MOTTO</text>
</g>
<text id="w0" class="d" x="625" y="450" font-size="84">Margin</text>
<text id="w1" class="d" x="900" y="450" font-size="84">of</text>
<text id="w2" class="d" x="1000" y="450" font-size="84" style="fill:var(--gain)">Safety.</text>
<g id="pts"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Price versus value.</text>
<text class="b" x="120" y="176" font-size="32">The gap between them is your margin of safety.</text>
<path class="s-line" d="M300 780h700" stroke-width="5" stroke-linecap="round"/>
<rect id="vb" class="ink" x="360" y="780" width="220" height="0" rx="6"/>
<rect id="pb" class="loss" x="700" y="780" width="220" height="0" rx="6"/>
<g id="vl"><text class="m" x="470" y="822" font-size="22" text-anchor="middle">TRUE VALUE</text></g>
<g id="pl"><text class="m" x="810" y="822" font-size="22" text-anchor="middle">PRICE YOU PAY</text></g>
<g id="gp">
<path class="s-muted" d="M580 280h420" stroke-width="3" stroke-dasharray="8 8"/>
<path id="pgl" class="s-muted" stroke-width="3" stroke-dasharray="8 8"/>
<path id="ga" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1030" y="330" font-size="24" style="fill:var(--gain)">MARGIN OF SAFETY</text>
</g>
<g id="wd">
<text class="d5" x="1030" y="440" font-size="36">The wider the gap,</text>
<text class="d5" x="1030" y="490" font-size="36">the more room for</text>
<text class="d5" x="1030" y="540" font-size="36">mistakes and bad luck.</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bond test.</text>
<text class="b" x="120" y="176" font-size="32">Past earnings several times larger than the interest bill.</text>
<g id="bp">
<rect class="s-ink" x="140" y="280" width="320" height="400" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="s-line" x="160" y="300" width="280" height="360" rx="6" fill="none" stroke-width="3" stroke-dasharray="8 6"/>
<text class="d" x="300" y="410" font-size="56" text-anchor="middle">BOND</text>
<path class="s-line" d="M200 470h200M200 510h200M200 550h140" stroke-width="6" stroke-linecap="round"/>
<circle class="gain" cx="300" cy="610" r="36"/>
</g>
<path class="s-line" d="M560 760h760" stroke-width="5" stroke-linecap="round"/>
<g id="ep"></g>
<g id="ib"><rect class="loss" x="1100" y="704" width="180" height="56" rx="6"/><text class="m" x="1190" y="806" font-size="20" text-anchor="middle">INTEREST BILL</text></g>
<g id="il">
<path class="s-loss" d="M570 704H1310" stroke-width="3" stroke-dasharray="8 8"/>
<text class="m" x="1310" y="690" font-size="20" text-anchor="end" style="fill:var(--loss)">INTEREST LEVEL</text>
</g>
<g id="fl"><g id="fam">
<path class="s-loss" d="M690 -150V-4M668 -28l22 24 22-24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="718" y="-92" font-size="20" style="fill:var(--loss)">PROFITS</text>
<text class="m" x="718" y="-62" font-size="20" style="fill:var(--loss)">FALL SHARPLY</text>
</g></g>
<g id="ok">
<path class="s-gain" d="M808 652l20 20 38-44" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="884" y="672" font-size="36">Still paid.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The stock test.</text>
<text class="b" x="120" y="176" font-size="32">9% on the price you pay, versus 4% from good bonds.</text>
<g id="sc">
<rect class="s-ink" x="120" y="240" width="280" height="180" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="d5" x="260" y="320" font-size="36" text-anchor="middle">STOCK</text>
<path class="s-line" d="M170 360h180M170 390h120" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="n9"><rect id="r9" class="gain" x="480" y="260" width="720" height="70" rx="8"/><text class="m" x="500" y="304" font-size="20" style="fill:var(--on-gain)">COMPANY EARNS ON YOUR PRICE</text><text class="d" x="1220" y="318" font-size="60">9%</text></g>
<g id="n4"><rect class="s-ink" x="480" y="360" width="320" height="70" rx="8" fill="var(--stage)" stroke-width="5"/><text class="m" x="500" y="404" font-size="20">GOOD BONDS</text><text class="d" x="785" y="412" font-size="44" text-anchor="end">4%</text></g>
<g id="x5"><rect class="s-gain" x="810" y="360" width="390" height="70" rx="8" fill="none" stroke-width="5" stroke-dasharray="12 8"/><text class="d" x="1005" y="410" font-size="44" text-anchor="middle" style="fill:var(--gain)">+5% a year</text></g>
<g id="ty"><text class="m" x="120" y="560" font-size="22">OVER TEN YEARS</text><rect class="s-ink" x="120" y="590" width="1200" height="100" rx="8" fill="none" stroke-width="5"/><text class="m" x="1320" y="730" font-size="20" text-anchor="end">PRICE YOU PAID</text></g>
<g id="tc"><text class="d5" x="1320" y="562" font-size="36" text-anchor="end">10 × 5% = <tspan style="fill:var(--gain)">50%</tspan></text></g>
<g id="chk"></g>
<g id="hf"><path class="s-gain" d="M720 570v150" stroke-width="4" stroke-dasharray="6 6"/><text class="d" x="120" y="800" font-size="48" style="fill:var(--gain)">≈ half the price you paid</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The real danger.</text>
<text class="b" x="120" y="176" font-size="32">Paying too much when times feel good.</text>
<g id="shp">
<rect class="s-ink" x="200" y="360" width="260" height="360" rx="6" fill="var(--stage)" stroke-width="6"/>
<g id="win"></g>
<rect class="ink" x="305" y="650" width="50" height="70"/>
<g id="spk"></g>
<text class="m" x="330" y="760" font-size="20" text-anchor="middle">GREAT COMPANY</text>
</g>
<g id="ng"><g transform="rotate(-12 330 520)"><rect x="210" y="480" width="240" height="80" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="d" x="330" y="536" font-size="44" text-anchor="middle" style="fill:var(--loss)">NO GAP</text></g></g>
<path class="s-line" d="M700 720h600" stroke-width="5" stroke-linecap="round"/>
<g id="vv"><rect class="ink" x="760" y="400" width="180" height="320" rx="6"/><text class="m" x="850" y="760" font-size="20" text-anchor="middle">VALUE</text></g>
<g id="hpg"><rect id="hp" class="loss" x="1040" y="420" width="180" height="300" rx="6"/><text class="m" x="1130" y="760" font-size="20" text-anchor="middle">PRICE</text></g>
<g id="ov"><path class="s-muted" d="M940 400H1260" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="1240" y="360" font-size="22" style="fill:var(--loss)">OVERPAID</text></g>
<g id="dp"><text class="d" x="120" y="845" font-size="40">The margin of safety always depends on the price.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spread the odds.</text>
<text class="b" x="120" y="176" font-size="32">Not every purchase works out. Many together can.</text>
<text class="m" x="160" y="262" font-size="20">EACH COIN = ONE HOLDING</text>
<g id="cn"></g>
<g id="scl">
<path class="s-ink" d="M1150 380V740" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="1050" y="740" width="200" height="20" rx="6"/>
<path id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/>
<g id="pnL"></g><g id="pnR"></g>
<circle class="gain" cx="1150" cy="380" r="14"/>
</g>
<g id="dv"><text class="d" x="120" y="830" font-size="44">Margin of safety <tspan style="fill:var(--gain)">+ diversification</tspan></text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Before your next purchase.</text>
<text class="b" x="120" y="176" font-size="32">Write down the value. Then compare the price.</text>
<g id="np">
<rect class="s-ink" x="160" y="240" width="360" height="460" rx="14" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="200" y="320" font-size="22">TRUE VALUE</text>
<path id="sv" class="s-gain" d="M200 400q30-36 60 0t60 0t60 0t60 0t60 0" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="520"/>
<path class="s-line" d="M200 480h280M200 540h280M200 600h280M200 660h200" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="pt0">
<text class="m" x="610" y="470" font-size="26" text-anchor="middle">VS</text>
<path class="s-ink" d="M700 450L780 340H1080V560H780Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="s-ink" cx="760" cy="450" r="14" fill="none" stroke-width="5"/>
<text class="m" x="820" y="420" font-size="22">PRICE</text>
<path id="sp" class="s-loss" d="M820 490q25-30 50 0t50 0t50 0t50 0" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="420"/>
</g>
<g id="wa">
<path class="s-gain" d="M1180 560h240m-20-18 20 18-20 18" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<g id="wk"></g>
<circle class="s-ink" cx="1300" cy="640" r="44" fill="var(--stage)" stroke-width="6"/>
<path id="hand" class="s-ink" d="M1300 640v-30" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1300" y="740" font-size="20" text-anchor="middle">WAIT FOR A BETTER PRICE</text>
</g>
<g id="wt"><text class="d" x="120" y="820" font-size="48">Thin gap? <tspan style="fill:var(--gain)">Walk away and wait.</tspan></text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Look at something you own.</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="80" letter-spacing="-2">If you were wrong about it,</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="80" letter-spacing="-2">how big is your <tspan style="fill:var(--gain)">cushion?</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">CHECK YOUR MARGIN OF SAFETY</text>
<g id="gq"><rect class="gain" x="1200" y="740" width="240" height="60" rx="28"/><rect id="qbox" class="ink" x="1270" y="640" width="100" height="100" rx="8"/></g>
</g>