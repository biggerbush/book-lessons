<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Six steps to turn</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">wishes into goals.</text>
<text class="b" x="120" y="600" font-size="32">Napoleon Hill's six-step formula for turning wishes into definite goals.</text>
<g id="sheet"><rect class="s-ink" x="1180" y="290" width="240" height="250" rx="8" fill="var(--stage)" stroke-width="6"/><g id="slines"></g></g>
<g id="star"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A wish has no edges.</text>
<text class="b" x="120" y="176" font-size="32">Simply wanting plenty of money gets you nowhere.</text>
<g id="fogw"><g id="fog"></g><text class="d" x="380" y="512" font-size="90" text-anchor="middle" style="fill:var(--muted)" opacity=".5">$</text><text class="m" x="380" y="660" font-size="20" text-anchor="middle">A WISH</text></g>
<g id="noedge"><text class="m" x="380" y="700" font-size="20" text-anchor="middle" style="fill:var(--loss)">NO EDGES</text></g>
<g id="carn"><path class="s-line" d="M570 480h150m-20-18 20 18-20 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g id="cperson"></g><text class="m" x="800" y="640" font-size="20" text-anchor="middle">ANDREW CARNEGIE</text></g>
<g id="cardw"><g id="card"><rect class="gain" x="0" y="-30" width="130" height="60" rx="8"/><text class="m" x="65" y="7" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">FORMULA</text></g></g>
<g id="hexw"><g id="hex"></g><g id="goalt"><text class="d" x="1260" y="498" font-size="52" text-anchor="middle" style="fill:var(--gain)">GOAL</text></g><text class="m" x="1260" y="690" font-size="20" text-anchor="middle">SIX STEPS, SIX HARD EDGES</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Name the exact number.</text>
<text class="b" x="120" y="176" font-size="32">Fix in your mind the exact amount you want.</text>
<g id="tag"><path class="s-ink" d="M170 270h230v140h-230l-40-70z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="s-ink" cx="172" cy="340" r="10" fill="none" stroke-width="4"/><text class="d" x="200" y="362" font-size="64">$</text><rect class="gain" x="250" y="356" width="120" height="8"/><text class="m" x="130" y="450" font-size="18">AN EXACT AMOUNT</text></g>
<g id="chk"><rect class="s-ink" x="480" y="240" width="640" height="220" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="510" y="290" font-size="20">PAY TO THE ORDER OF</text><text class="d5" x="790" y="292" font-size="34">Me</text><path class="s-line" d="M780 304h310M510 430h300" stroke-width="3"/><rect class="s-gain" x="900" y="340" width="190" height="64" rx="8" fill="none" stroke-width="5"/><text class="d" x="920" y="386" font-size="40">$</text><text class="m" x="510" y="380" font-size="20">A PRECISE FIGURE</text></g>
<g id="vague"><g id="varr"></g><text class="m" x="300" y="850" font-size="20" text-anchor="middle" style="fill:var(--loss)">VAGUE AMOUNT, VAGUE EFFORT</text></g>
<g id="tgt"><circle class="s-ink" cx="1080" cy="640" r="130" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1080" cy="640" r="86" fill="none" stroke-width="6"/><circle class="gain" cx="1080" cy="640" r="42"/><g id="tarr"></g><text class="m" x="1080" y="806" font-size="20" text-anchor="middle" style="fill:var(--gain)">SPECIFIC NUMBER, CLEAR TARGET</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Decide what you will give.</text>
<text class="b" x="120" y="176" font-size="32">There is no such thing as something for nothing.</text>
<g id="scl">
<path class="s-ink" d="M800 560V740" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="720" y="740" width="160" height="20" rx="6"/>
<line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/><g id="sposts"></g><circle class="ink" cx="800" cy="560" r="16"/>
<g id="panL"><path class="s-ink" d="M-130 0h260l-20 22h-220z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="0" cy="-44" r="40"/><text class="d" x="0" y="-28" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">$</text></g>
<g id="panR"><path class="s-ink" d="M-130 0h260l-20 22h-220z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><g id="nfn"><text class="m" x="0" y="-40" font-size="20" text-anchor="middle" style="fill:var(--loss)">NOTHING FOR NOTHING?</text></g></g>
<g id="chips"></g>
<text class="m" x="465" y="700" font-size="20" text-anchor="middle">YOUR GOAL</text><text class="m" x="1135" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOUR OFFER</text>
</g>
<g id="price"><text class="d" x="120" y="830" font-size="44">Your offer is the price you agree to pay.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Set a definite date.</text>
<text class="b" x="120" y="176" font-size="32">Pick an actual day you could circle on the calendar.</text>
<g id="cal"><rect class="s-ink" x="160" y="240" width="600" height="520" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="160" y="240" width="600" height="70" rx="10"/><circle cx="260" cy="275" r="10" fill="var(--stage)"/><circle cx="660" cy="275" r="10" fill="var(--stage)"/><g id="cgrid"></g></g>
<g id="watch"><rect class="ink" x="1140" y="298" width="40" height="22" rx="4"/><path class="s-ink" d="M1160 320v12" stroke-width="8"/><circle class="s-ink" cx="1160" cy="500" r="170" fill="var(--stage)" stroke-width="8"/><g id="wticks"></g><path id="wedge" class="gain" fill-opacity=".35"/><text class="m" x="1160" y="610" font-size="20" text-anchor="middle">COUNTDOWN</text><line id="hand" class="s-ink" x1="1160" y1="500" x2="1160" y2="370" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1160" cy="500" r="12"/></g>
<g id="dl"><text class="d" x="120" y="830" font-size="44">A deadline turns <tspan style="fill:var(--loss)">someday</tspan> into a <tspan style="fill:var(--gain)">countdown</tspan>.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Make a plan. Start at once.</text>
<text class="b" x="120" y="176" font-size="32">Don't wait for the perfect moment.</text>
<path id="route" class="s-gain" d="M200 700C450 700 450 520 700 540S1000 420 1300 320" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1"/>
<g id="wps"><circle class="ink" cx="200" cy="700" r="14"/><text class="m" x="200" y="760" font-size="20" text-anchor="middle">START</text></g>
<g id="plan"><text class="m" x="560" y="470" font-size="20">A DEFINITE PLAN</text></g>
<g id="flag"><path class="s-ink" d="M1300 320V210" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1300 210l70 22-70 22z"/><text class="m" x="1385" y="240" font-size="20">GOAL</text></g>
<g id="runr"><circle class="ink" cx="0" cy="-92" r="16"/><path class="s-ink" d="M0 -74L6 -36" stroke-width="8" stroke-linecap="round"/><path id="legs" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="wait"><rect class="s-loss" x="1040" y="620" width="420" height="200" rx="16" fill="var(--stage)" stroke-width="4" stroke-dasharray="10 8"/><path class="s-ink" d="M1090 670h60l-60 100h60z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1206" y="705" font-size="20">WAITING FOR THE</text><text class="m" x="1206" y="735" font-size="20">PERFECT MOMENT</text><path id="wx" class="s-loss" d="M1068 652L1172 788M1172 652L1068 788" stroke-width="7" stroke-linecap="round" pathLength="1"/></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">5. Write it down.</text>
<text class="b" x="120" y="176" font-size="32">A clear, short statement of your goal.</text>
<g id="pad"><rect id="pg" x="560" y="220" width="480" height="600" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="rings"></g><text class="d" x="600" y="300" font-size="40">My goal</text><g id="rows"></g></g>
<g id="pen"><path class="gain" d="M0 0l8-24 56-56 16 16-56 56z"/></g>
<g id="onep"><path class="s-gain" d="M1080 220h24v600h-24" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="d" x="1140" y="520" font-size="56" style="fill:var(--gain)">One page.</text><text class="m" x="1144" y="562" font-size="20">YOU CAN HOLD IT</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">6. Read it aloud, twice a day.</text>
<text class="b" x="120" y="176" font-size="32">Every night before sleep, and every morning when you wake.</text>
<g id="rdr"><g id="rp"></g><rect class="s-ink" x="750" y="600" width="100" height="76" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M766 624h68M766 648h48" stroke-width="5" stroke-linecap="round"/><path id="waves" class="s-gain" d="M850 500q14 20 0 40M872 486q24 34 0 68" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="moon"><circle class="ink" cx="300" cy="400" r="64"/><circle cx="328" cy="382" r="56" fill="var(--stage)"/><text class="m" x="300" y="520" font-size="22" text-anchor="middle">EVERY NIGHT</text></g>
<g id="sun"><circle class="gain" cx="1300" cy="400" r="50"/><g id="rays"></g><text class="m" x="1300" y="520" font-size="22" text-anchor="middle">EVERY MORNING</text></g>
<g id="bub"><circle class="s-ink" cx="800" cy="330" r="70" fill="var(--stage)" stroke-width="5"/><text class="d" x="800" y="356" font-size="72" text-anchor="middle" style="fill:var(--gain)">$</text><circle class="ink" cx="790" cy="436" r="9"/><circle class="ink" cx="782" cy="462" r="6"/></g>
<g id="loop"><path class="s-gain" d="M300 580Q800 860 1300 580" fill="none" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="800" y="790" font-size="22" text-anchor="middle" style="fill:var(--gain)">MORNING AND NIGHT</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Tonight, run one wish</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">through all six steps</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">on a <tspan style="fill:var(--gain)">single page</tspan>.</text></g>
<g id="rl"><text class="m" x="143" y="700" font-size="26">READ IT ALOUD · NIGHT AND MORNING</text></g>
<g id="np"><rect class="s-ink" x="1220" y="520" width="200" height="240" rx="8" fill="var(--stage)" stroke-width="6"/><g id="nticks"></g></g>
</g>