<text class="m" x="128" y="8" font-size="20">SOUNDS</text>
<text class="m" y="150" font-size="20" text-anchor="middle">FEELINGS</text>
</g>
</g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make it concrete.</text>
<text class="b" x="120" y="176" font-size="32">Before you speak, ask what it would look like on camera.</text>
<g id="cam">
<rect class="ink" x="190" y="240" width="60" height="24" rx="6"/>
<rect class="ink" x="160" y="260" width="200" height="130" rx="16"/>
<circle cx="260" cy="325" r="40" fill="var(--stage)"/><circle class="gain" cx="260" cy="325" r="22"/>
</g>
