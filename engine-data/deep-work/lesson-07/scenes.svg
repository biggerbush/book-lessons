<g id="flw"><text class="d" x="1120" y="440" font-size="120" style="fill:var(--gain)">Flow</text><path id="wv" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="dwt"><text class="d" x="120" y="830" font-size="40">Deep work demands exactly that kind of stretch.</text></g>
</g>

<g id="s6" opacity="0">
