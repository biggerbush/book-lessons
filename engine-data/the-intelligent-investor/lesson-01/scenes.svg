<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Investing is</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not speculating.</text>
<text class="b" x="120" y="600" font-size="32">Graham’s simple test for telling an investment from a bet.</text>
<ellipse cx="1300" cy="560" rx="100" ry="14" fill="var(--line)"/>
<g id="coinW"><g id="coin"><circle id="coinF" r="110" class="gain"/><circle r="84" fill="none" stroke="var(--stage)" stroke-width="6"/><text id="coinT" class="d" y="34" font-size="96" text-anchor="middle">$</text></g></g>
<g id="coinL"><text class="m" x="1300" y="640" font-size="22" text-anchor="middle">INVESTOR OR GAMBLER?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Graham’s test.</text>
<text class="b" x="120" y="176" font-size="32">Investing has a strict definition with three parts.</text>
<g id="gr"></g>
<g id="cards"></g>
<g id="ic0"><g id="mag"><circle class="s-ink" cx="590" cy="420" r="58" fill="none" stroke-width="10"/><path class="s-ink" d="M632 462l50 50" stroke-width="16" stroke-linecap="round"/></g></g>
<g id="ic1"><path class="gain" d="M960 340l90 34v60c0 70-44 104-90 126c-46-22-90-56-90-126v-60z"/><path d="M920 440l28 28 54-58" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ic2"><g id="coinsS"></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tick all three boxes.</text>
<text class="b" x="120" y="176" font-size="32">Graham’s checklist for an investment.</text>
<g id="clip"><rect class="s-ink" x="120" y="230" width="560" height="500" rx="20" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="320" y="212" width="160" height="40" rx="10"/><g id="rows"></g></g>
<path id="arr2" class="s-muted" d="M710 480h90m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="verd"><text id="vlab" class="m" x="1140" y="390" font-size="22" text-anchor="middle">ALL THREE TICKED</text><rect id="vbox" x="840" y="410" width="600" height="150" rx="20" fill="none" stroke-width="8"/><text id="vtxt" class="d" x="1140" y="508" font-size="68" text-anchor="middle">Investment</text></g>
<g id="quote"><text class="d5" x="120" y="806" font-size="40">“Safety of principal and an adequate return.”</text><text class="m" x="120" y="848" font-size="20">BENJAMIN GRAHAM</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same stock, two moves.</text>
<text class="b" x="120" y="176" font-size="32">The label depends on you, not on the stock.</text>
<g id="cert"><rect class="s-ink" x="640" y="220" width="320" height="190" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="s-line" x="660" y="240" width="280" height="150" rx="6" fill="none" stroke-width="3" stroke-dasharray="8 6"/><text class="d" x="800" y="322" font-size="52" text-anchor="middle">SHARE</text><text class="m" x="800" y="364" font-size="18" text-anchor="middle">ONE COMPANY</text></g>
<path id="ar3a" d="M700 410C620 450 420 420 370 452" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/>
<path id="ar3b" d="M900 410C980 450 1180 420 1220 452" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/>
<g id="a3"></g>
<g id="c3"><g id="crowd3" opacity=".45"></g><g id="bb"></g></g>
<g id="v3a"><text class="d" x="360" y="780" font-size="52" text-anchor="middle" style="fill:var(--gain)">Investing.</text></g>
<g id="v3b"><text class="d" x="1290" y="780" font-size="52" text-anchor="middle" style="fill:var(--loss)">Speculating.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The late 1920s.</text>
<text class="b" x="120" y="176" font-size="32">Crowds called themselves investors.</text>
<g id="cal"><rect class="s-ink" x="120" y="240" width="280" height="240" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="120" y="240" width="280" height="60" rx="14"/><text class="d" x="260" y="420" font-size="84" text-anchor="middle">1929</text></g>
<g id="cash"><rect class="gain" x="120" y="540" width="280" height="130" rx="12"/><circle cx="260" cy="605" r="44" fill="none" stroke="var(--on-gain)" stroke-width="4"/><text class="d" x="260" y="628" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">$</text><text class="m" x="260" y="712" font-size="20" text-anchor="middle">BORROWED MONEY</text></g>
<path id="axes" class="s-line" d="M520 250V740H1470" fill="none" stroke-width="4"/>
<path id="rp" d="M540 700L640 650L720 670L820 580L900 600L1000 480L1080 500L1180 330" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2"/>
<path id="cp" d="M1180 330L1240 520L1280 480L1340 690L1460 720" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2"/>
<g id="crl"><text class="m" x="1200" y="300" font-size="22" style="fill:var(--loss)">1929 CRASH</text></g>
<g id="sav"><text class="d" x="120" y="820" font-size="44">Savings collapsed along with them.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Speculating isn’t wicked.</text>
<g id="sub5"><text class="b" x="120" y="176" font-size="32">But it turns dangerous in three situations.</text></g>
<g id="bal"><path class="s-ink" d="M330 300V600M250 600h160" stroke-width="8" stroke-linecap="round" fill="none"/>
<g id="beam"><path class="s-ink" d="M190 300h280M190 300l-40 110M190 300l40 110M470 300l-40 110M470 300l40 110" stroke-width="5" fill="none" stroke-linecap="round"/><path class="gain" d="M140 410h100a50 50 0 0 1-100 0z"/><path class="loss" d="M420 410h100a50 50 0 0 1-100 0z"/></g>
<circle class="ink" cx="330" cy="300" r="14"/><text class="m" x="190" y="500" font-size="20" text-anchor="middle">INVEST</text><text class="m" x="470" y="500" font-size="20" text-anchor="middle">SPECULATE</text><text class="m" x="330" y="680" font-size="22" text-anchor="middle">BOTH ARE ALLOWED</text></g>
<g id="dang"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep two separate pots.</text>
<text class="b" x="120" y="176" font-size="32">Speculation lives in its own small pot. Everything else is tested.</text>
<g id="jars">
<g id="sj"><rect id="sf" class="loss" x="172" y="748" width="136" height="0" rx="8"/><rect class="s-ink" x="160" y="560" width="160" height="200" rx="18" fill="none" stroke-width="7"/><rect class="ink" x="180" y="530" width="120" height="26" rx="6"/></g>
<rect id="bf" class="gain" x="454" y="748" width="332" height="0" rx="12"/><rect class="s-ink" x="440" y="300" width="360" height="460" rx="26" fill="none" stroke-width="7"/><rect class="ink" x="480" y="268" width="280" height="28" rx="6"/>
</g>
<g id="lab6a"><text class="m" x="240" y="806" font-size="20" text-anchor="middle">SPECULATION</text><text class="m" x="240" y="836" font-size="20" text-anchor="middle" style="fill:var(--loss)">KEEP IT SMALL</text></g>
<g id="lab6b"><text class="m" x="620" y="806" font-size="20" text-anchor="middle">INVESTMENTS</text><text class="m" x="620" y="836" font-size="20" text-anchor="middle" style="fill:var(--gain)">HELD TO THE TEST</text></g>
<g id="t6"><text class="d" x="900" y="460" font-size="42">A bad bet can sting,</text><text class="d" x="900" y="520" font-size="42">but it cannot sink you.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask before you buy.</text>
<text class="b" x="120" y="176" font-size="32">Three questions, every single time.</text>
<g id="card7"><rect class="s-ink" x="120" y="220" width="960" height="500" rx="20" fill="var(--stage)" stroke-width="6"/><text class="m" x="160" y="284" font-size="22">BEFORE ANY PURCHASE</text></g>
<g id="qs"></g>
<g id="ver7a"><text class="m" x="1140" y="370" font-size="22">THREE YESES</text><text class="d" x="1140" y="444" font-size="56" style="fill:var(--gain)">Investing.</text></g>
<g id="ver7b"><text class="m" x="1140" y="570" font-size="22">ANYTHING LESS</text><text class="d" x="1140" y="644" font-size="56" style="fill:var(--loss)">A bet.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Look at one thing you own.</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">Does it pass the test,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">or is it secretly <tspan style="fill:var(--loss)">a bet?</tspan></text></g>
<g id="qg"><g id="qbx"></g><text class="m" x="143" y="760" font-size="24">ANALYSIS · SAFETY · RETURN</text></g>
</g>