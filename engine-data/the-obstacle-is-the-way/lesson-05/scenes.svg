<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Go around, or use it</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">against itself.</text>
