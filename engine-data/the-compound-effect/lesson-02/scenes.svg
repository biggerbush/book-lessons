<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMPOUND EFFECT · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You are fully</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">responsible.</text>
<text class="b" x="120" y="600" font-size="32">Your results begin and end with the choices you own.</text>
