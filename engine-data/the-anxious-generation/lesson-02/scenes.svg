<rect class="s-line" x="840" y="230" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="cup">
<text class="m" x="160" y="284" font-size="22">KNOCK IT</text>
<path class="s-ink" d="M330 380h200v70a100 90 0 0 1-200 0z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M530 400a36 36 0 0 1 0 72" fill="none" stroke-width="7"/>
<path class="s-ink" d="M300 560h260" stroke-width="7" stroke-linecap="round"/>
