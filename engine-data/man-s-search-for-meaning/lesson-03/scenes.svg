<text class="m" x="1240" y="620" font-size="22" text-anchor="middle" style="fill:var(--gain)">TOMORROW</text>
<text class="d5" x="1240" y="680" font-size="34" text-anchor="middle">Practice the second one.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="80" letter-spacing="-2">When something hard happens</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="80" letter-spacing="-2">this week, what attitude</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">will you <tspan style="fill:var(--gain)">choose</tspan>?</text></g>
<g id="qm"><circle class="gain" cx="1340" cy="540" r="70"/><text class="d" x="1340" y="572" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<text class="m" x="143" y="700" font-size="26">THE LAST HUMAN FREEDOM IS YOURS</text>
</g>