<text class="d" x="330" y="330" font-size="34" style="fill:var(--loss)">To himself: 0</text>
</g>
<g id="fast"><text class="d" x="120" y="800" font-size="44">His money left as fast as it arrived.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">One coin in ten.</text>
<text class="b" x="120" y="176" font-size="32">Keep at least one tenth of everything you earn.</text>
