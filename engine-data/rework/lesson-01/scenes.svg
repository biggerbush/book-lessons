<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which real-world rule</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">have you been obeying</text></g>
<g id="qc2"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">without <tspan style="fill:var(--gain)">questioning</tspan> it?</text></g>
