<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Admit it first,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">let them save face.</text>
<text class="b" x="120" y="600" font-size="32">Own your mistakes fast, and let others keep their dignity.</text>
<path class="s-line" d="M1150 523H1480" stroke-width="5"/>
<g id="t0"></g>
<g id="tb"><rect x="1140" y="210" width="220" height="76" rx="16" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path d="M1230 284l14 40 22-40" fill="var(--stage)" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1250" y="258" font-size="24" text-anchor="middle" style="fill:var(--gain)">MY FAULT.</text></g>
<path id="tbolt" class="loss" d="M1432 222l-34 52h26l-20 44 44-60h-26l20-36z"/>
<path id="theart" class="gain" d="M1420 300c-40-26-44-52-24-60c12-5 22 2 24 10c2-8 12-15 24-10c20 8 16 34-24 60z"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bulldog in the park.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie and his little Boston bulldog, Rex.</text>
<path class="s-line" d="M120 720H1480" stroke-width="5"/>
<path class="s-line" d="M180 720V560M960 720V530" stroke-width="10" stroke-linecap="round"/>
<circle class="s-line" cx="180" cy="520" r="50" fill="var(--stage)" stroke-width="5"/>
<circle class="s-line" cx="960" cy="480" r="60" fill="var(--stage)" stroke-width="5"/>
<g id="carn1"><text class="m" x="340" y="760" font-size="20" text-anchor="middle">CARNEGIE</text></g>
<path id="leash" class="s-ink" d="M385 630Q460 700 525 665" fill="none" stroke-width="4" stroke-linecap="round"/>
<g id="dog1"></g>
<g id="tag1"><rect x="480" y="290" width="360" height="56" rx="28" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="660" y="326" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO LEASH · NO MUZZLE</text></g>
<g id="cop1"></g>
<g id="warn1"><rect x="980" y="300" width="260" height="70" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M1200 368l50 36-14-36" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1110" y="343" font-size="20" text-anchor="middle" style="fill:var(--loss)">STERN WARNING</text></g>
<g id="prom1"><rect x="220" y="380" width="240" height="64" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M320 442l14 30 18-30" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="340" y="420" font-size="22" text-anchor="middle">I’LL OBEY.</text></g>
<g id="slip1"><text class="d5" x="120" y="830" font-size="36">…then he slowly slipped back into his old habit.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Caught again.</text>
<text class="b" x="120" y="176" font-size="32">Same hill. Same officer. This time, he spoke first.</text>
<path class="s-line" d="M120 780H1480" stroke-width="5"/>
<g id="pair2"></g>
<path class="s-line" d="M120 780C300 520 640 520 820 780Z" fill="var(--line)" stroke-width="5"/>
<g id="cop2"></g>
<g id="conf2"><rect x="620" y="230" width="420" height="240" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/><path d="M650 466L505 440L720 466" fill="var(--stage)" stroke="var(--gain)" stroke-width="6" stroke-linejoin="round"/>
<g id="cl0"><text class="d" x="660" y="310" font-size="44">I’m caught.</text></g>
<g id="cl1"><text class="d" x="660" y="370" font-size="44">I’m guilty.</text></g>
<g id="cl2"><text class="d" x="660" y="430" font-size="44" style="fill:var(--gain)">No excuse.</text></g></g>
<g id="wait2"><text class="m" x="120" y="850" font-size="22">HE DIDN’T WAIT FOR THE LECTURE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The officer softens.</text>
<text class="b" x="120" y="176" font-size="32">His whole manner changed.</text>
<g id="face3"><circle cx="400" cy="470" r="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path class="loss" d="M262 384Q400 334 538 384L518 326Q400 250 282 326Z"/>
<circle class="ink" cx="345" cy="455" r="12"/><circle class="ink" cx="455" cy="455" r="12"/>
<path id="brow3" class="s-ink" d="M310 392L380 420M420 420L490 392" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="mouth3" class="s-ink" d="M335 545Q400 515 465 545" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="q3"><text class="m" x="700" y="300" font-size="22">HE SAID</text><text class="d" x="700" y="360" font-size="44">“A small dog like that</text><text class="d" x="700" y="420" font-size="44">is hardly dangerous.”</text></g>
<path class="s-line" d="M820 760Q1100 520 1380 760Z" fill="var(--line)" stroke-width="5"/>
<path class="s-line" d="M120 760H1480" stroke-width="5"/>
<g id="arr3"><path class="s-gain" d="M740 670Q1080 290 1380 640" fill="none" stroke-width="5" stroke-dasharray="10 10"/><path class="s-gain" d="M1352 632L1380 640L1376 612" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1100" y="712" font-size="22" text-anchor="middle">OUT OF SIGHT</text></g>
<g id="dog3"></g>
<g id="rex3"><text class="m" x="700" y="796" font-size="20" text-anchor="middle">REX</text></g>
<g id="fight3"><text class="d" x="120" y="846" font-size="38">The confession left him nothing to fight against.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Accusation triggers defence. Self-criticism invites generosity.</text>
<g id="L4"><rect class="s-line" x="120" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">THEY ACCUSE US</text><g id="arr4"></g><g id="p4a"></g>
<path id="sh4" class="loss" d="M380 380h80v50q0 50-40 75q-40-25-40-75z"/>
<text class="m" x="520" y="600" font-size="20" text-anchor="middle" style="fill:var(--loss)">WE DEFEND OURSELVES</text></g>
<g id="R4"><rect class="s-line" x="840" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22">WE CRITICISE OURSELVES FIRST</text>
<rect x="900" y="300" width="180" height="54" rx="14" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><text class="m" x="990" y="335" font-size="22" text-anchor="middle" style="fill:var(--gain)">MY FAULT.</text>
<g id="p4b"></g><g id="p4c"></g>
<g id="hands4"><path class="s-gain" d="M1278 528L1240 452M1362 528L1400 452" stroke-width="8" stroke-linecap="round"/><circle class="gain" cx="1240" cy="448" r="11"/><circle class="gain" cx="1400" cy="448" r="11"/>
<text class="m" x="1320" y="610" font-size="20" text-anchor="middle" style="fill:var(--gain)">THEY FEEL GENEROUS</text></g></g>
<g id="sw4"><rect class="ink" x="208" y="700" width="24" height="12" rx="3"/><circle cx="220" cy="770" r="56" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path id="hand4" class="s-gain" d="M220 770V728" stroke-width="7" stroke-linecap="round"/>
<text class="d" x="320" y="762" font-size="42">Admit it quickly and emphatically,</text>
<text class="m" x="320" y="810" font-size="22">BEFORE ANYONE ELSE CAN RAISE IT</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let others save face.</text>
<text class="b" x="120" y="176" font-size="32">When someone else slipped, protect their pride.</text>
<g id="flip5"><text class="m" x="1320" y="158" font-size="20" text-anchor="end">IN REVERSE</text>
<g id="flipr"><path class="s-gain" d="M1340 150a40 40 0 0 1 80 0M1408 138l12 14 12-14M1420 150a40 40 0 0 1-80 0M1328 162l12-14 12 14" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="P5a"><rect class="s-line" x="120" y="240" width="640" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">CORRECTED IN FRONT OF OTHERS</text><g id="p5a"></g></g>
<g id="crowd5"></g>
<g id="dig5"><text class="m" x="440" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">PRIDE WOUNDED, SO THEY DIG IN</text></g>
<g id="P5b"><rect class="s-line" x="840" y="240" width="640" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="290" font-size="22">ALLOWED TO KEEP THEIR DIGNITY</text><g id="p5b"></g></g>
<path id="crown5" class="gain" d="M1090 436l6-38 18 18 6-26 6 26 18-18 6 38z"/>
<path id="up5" class="s-gain" d="M1360 640V400m-24 24 24-24 24 24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="acc5"><text class="m" x="1120" y="690" font-size="20" text-anchor="middle" style="fill:var(--gain)">CHANGE IS EASIER TO ACCEPT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A graceful new title.</text>
<text class="b" x="120" y="176" font-size="32">General Electric and Charles Steinmetz.</text>
<g id="st6"><text class="m" x="420" y="340" font-size="22" text-anchor="middle">CHARLES STEINMETZ</text><g id="st6f"></g>
<path id="bolt6" class="gain" d="M580 370l-40 70h30l-24 60 56-80h-30l24-50z"/></g>
<g id="desk6"><rect class="ink" x="240" y="600" width="360" height="22"/><path class="s-ink" d="M270 622V720M570 622V720" stroke-width="8" stroke-linecap="round"/>
<rect id="plate6" x="270" y="540" width="300" height="56" rx="8" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text id="pt6" class="m" x="420" y="575" font-size="18" text-anchor="middle" style="fill:var(--loss)">DEPARTMENT HEAD</text>
<text id="fit6" class="m" x="420" y="770" font-size="22" text-anchor="middle" style="fill:var(--loss)">A POOR FIT</text></g>
<g id="dept6"><rect class="s-line" x="900" y="300" width="520" height="380" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="930" y="350" font-size="22">THE DEPARTMENT</text><g id="tm6"></g></g>
<g id="mgr6"></g>
<g id="end6"><path class="gain" d="M132 790l8 17 19 2-14 13 4 19-17-10-17 10 4-19-14-13 19-2z"/>
<text class="d" x="180" y="830" font-size="40">Steinmetz was pleased. The company kept its star.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<g id="c7a"><rect class="s-line" x="120" y="220" width="640" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">WHEN YOU GET IT WRONG</text><g id="p7"></g>
<text class="m" x="150" y="730" font-size="20">SAY IT PLAINLY, BEFORE ANYONE ELSE DOES</text></g>
<g id="b7"><rect x="380" y="320" width="330" height="110" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path d="M420 428L345 468L470 428" fill="var(--stage)" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="410" y="392" font-size="40">I was wrong.</text></g>
<g id="c7b"><rect class="s-line" x="840" y="220" width="640" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22">WHEN SOMEONE ELSE GETS IT WRONG</text>
<rect class="gain" x="1220" y="330" width="170" height="330"/>
<polygon id="leaf7" points="1390,330 1220,330 1220,660 1390,660" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="1220" y="330" width="170" height="330" fill="none" stroke-width="7"/>
<path class="s-line" d="M880 660H1450" stroke-width="5"/><g id="w7"></g>
<text class="m" x="870" y="730" font-size="20">A GRACEFUL WAY OUT, IDEALLY IN PRIVATE</text></g>
</g>

<g id="s8" opacity="0">
<g id="q8a"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">What small mistake</text></g>
<g id="q8b"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">could you <tspan style="fill:var(--gain)">own</tspan> today,</text></g>
<g id="q8c"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2">before anyone else</text></g>
<g id="q8d"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2">points it out?</text></g>
<g id="lab8"><text class="m" x="143" y="720" font-size="26">ADMIT IT FIRST · LET OTHERS SAVE FACE</text></g>
<g id="mir8"><path class="s-ink" d="M1340 570V650M1280 650H1400" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="1340" cy="420" rx="100" ry="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/>
<g id="ref8"></g><path class="s-line" d="M1270 340q14-40 50-54" fill="none" stroke-width="6" stroke-linecap="round"/></g>
</g>