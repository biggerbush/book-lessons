<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Ask for criticism</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">before giving it.</text>
<text class="b" x="120" y="600" font-size="32">Earn the right to criticize by inviting criticism first.</text>
<g id="t_ppl"></g>
<circle id="t_ring" class="s-gain" cx="1180" cy="455" r="110" fill="none" stroke-width="5" opacity="0"/>
<path id="t_arc" class="s-gain" d="M1400 330Q1290 220 1180 330" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="t_head" class="s-gain" d="M1184 300L1180 330L1210 326" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
<g id="t_lab"><text class="m" x="1290" y="240" font-size="20" text-anchor="middle">ASK FOR IT FIRST</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why start with you?</text>
<text class="b" x="120" y="176" font-size="32">A new boss hands out criticism on day one.</text>
<g id="w_kim"><text class="m" x="120" y="240" font-size="22">KIM SCOTT · MANAGED TEAMS AT GOOGLE AND APPLE</text></g>
<rect class="ink" x="120" y="600" width="340" height="160" rx="6"/>
<rect class="ink" x="1000" y="600" width="480" height="160" rx="6"/>
<g id="w_boss"></g><g id="w_team"></g><g id="w_bub"></g>
<g id="w_nt"><text class="m" x="730" y="720" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO TRUST YET</text></g>
<g id="w_br">
<path class="s-gain" d="M460 604Q730 660 1000 604" fill="none" stroke-width="24" stroke-dasharray="8 22"/>
<path class="s-gain" d="M460 604Q730 660 1000 604M460 570Q730 626 1000 570" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="w_ask"><text class="m" x="730" y="720" font-size="22" text-anchor="middle" style="fill:var(--gain)">ASK FOR CRITICISM FIRST</text></g>
<g id="w_take"><text class="d" x="120" y="830" font-size="44">Show you can take what you plan to dish out.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feel the sting yourself.</text>
<text class="b" x="120" y="176" font-size="32">Hearing criticism stings, even when you asked for it.</text>
<g id="h_heart" transform="translate(330 470)">
<path id="h_hp" d="M0 90C-120 10-130-80-60-95C-25-102-5-80 0-60C5-80 25-102 60-95C130-80 120 10 0 90Z"/>
<path id="h_crack" d="M-6-62l26 44-28 26 24 40" fill="none" stroke="var(--stage)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="h_land">
<text class="m" x="600" y="300" font-size="22">FEEL IT, AND YOU LEARN</text>
<text class="d5" x="600" y="370" font-size="44">how your words will land</text>
<text class="d5" x="600" y="424" font-size="44">on others.</text>
</g>
<g id="h_road">
<rect class="ink" x="600" y="500" width="880" height="180" rx="10"/>
<path d="M630 590H1450" stroke="var(--stage)" stroke-width="6" stroke-dasharray="30 24"/>
<path d="M1420 525l30 20-30 20" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M660 615l-30 20 30 20" fill="none" stroke="var(--gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="h_c0" cy="545" r="14" fill="var(--stage)"/>
<circle id="h_c1" cy="635" r="14" class="gain"/>
<text class="m" x="600" y="720" font-size="20">YOU TO THE TEAM · THE TEAM TO YOU</text>
</g>
<g id="h_st"><text class="d" x="120" y="820" font-size="44">A two-way street, not a one-way order.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Have one go-to question.</text>
<text class="b" x="120" y="176" font-size="32">Phrase it in your own words.</text>
<g id="q_boss"></g>
<g id="q_bub">
<rect class="s-ink" x="120" y="220" width="940" height="160" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="ink" d="M1060 320l60 24-60 10z"/>
</g>
<g id="q_txt">
<text class="d5" x="160" y="285" font-size="36">“What could I do, or stop doing, that would</text>
<text class="d5" x="160" y="340" font-size="36">make working with me <tspan style="fill:var(--gain)">easier</tspan>?”</text>
</g>
<g id="q_cd">
<rect class="ink" x="200" y="450" width="180" height="310" rx="6"/>
<circle cx="350" cy="610" r="10" fill="var(--stage)"/>
<text class="d5" x="420" y="560" font-size="34">“Any feedback for me?”</text>
<text class="b" x="420" y="610" font-size="28">A polite nothing.</text>
</g>
<g id="q_od">
<polygon class="gain" points="880,760 1060,760 1120,820 820,820" fill-opacity=".2"/>
<rect class="gain" x="880" y="450" width="180" height="310" fill-opacity=".35"/>
<rect class="s-ink" x="880" y="450" width="180" height="310" fill="none" stroke-width="6"/>
<path class="ink" d="M880 450l70 24v262l-70 24z"/>
<text class="d5" x="1100" y="560" font-size="32">A specific question</text>
<text class="b" x="1100" y="610" font-size="28">An honest answer.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Count to six.</text>
<text class="b" x="120" y="176" font-size="32">Expect silence. Sit with it before you speak.</text>
<g id="c_room">
<rect x="300" y="560" width="620" height="24" rx="6" fill="var(--line)"/>
<path class="s-ink" d="M340 584v110M880 584v110" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="c_idea"><rect class="gain" x="596" y="290" width="88" height="56" rx="16"/><text class="d" x="640" y="333" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">!</text></g>
<g id="c_dial">
<g id="c_segs"></g>
<text id="c_num" class="d" x="1240" y="492" font-size="120" text-anchor="middle">0</text>
<text class="m" x="1240" y="660" font-size="22" text-anchor="middle">COUNT SLOWLY</text>
</g>
<g id="c_fear"><text class="m" x="120" y="770" font-size="22" style="fill:var(--loss)">CRITICIZING THE BOSS FEELS RISKY</text></g>
<g id="c_real"><text class="d" x="120" y="840" font-size="44">Often someone says something real.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen, don’t defend.</text>
<text class="b" x="120" y="176" font-size="32">Listen to understand, not to argue.</text>
<ellipse class="ink" cx="260" cy="480" rx="24" ry="40"/><ellipse class="ink" cx="540" cy="480" rx="24" ry="40"/>
<circle class="s-ink" cx="400" cy="480" r="140" fill="var(--stage)" stroke-width="7"/>
<circle class="ink" cx="350" cy="440" r="11"/><circle class="ink" cx="450" cy="440" r="11"/>
<path id="l_mouth" class="s-ink" d="M350 545q50 26 100 0" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="l_zip">
<path class="s-ink" d="M340 550h112M355 540v20M375 540v20M395 540v20M415 540v20M435 540v20" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M462 548v-8a8 8 0 0 1 16 0v8" fill="none" stroke-width="5"/>
<rect class="loss" x="455" y="548" width="30" height="26" rx="4"/>
</g>
<g id="l_waves"></g>
<text class="m" x="720" y="300" font-size="22">WHEN CRITICISM COMES</text>
<g id="l_und"><text class="d" x="720" y="370" font-size="52">Listen to <tspan style="fill:var(--gain)">understand</tspan>.</text></g>
<g id="l_d0"><text id="l_t0" class="d5" x="720" y="480" font-size="40" style="fill:var(--muted)">Explain yourself</text></g>
<line id="l_s0" class="s-loss" x1="714" y1="468" x2="714" y2="468" stroke-width="6" stroke-linecap="round" opacity="0"/>
<g id="l_d1"><text id="l_t1" class="d5" x="720" y="550" font-size="40" style="fill:var(--muted)">Criticize the criticism</text></g>
<line id="l_s1" class="s-loss" x1="714" y1="538" x2="714" y2="538" stroke-width="6" stroke-linecap="round" opacity="0"/>
<g id="l_quiet"><text class="d" x="120" y="800" font-size="40">A defensive reply teaches everyone to stay quiet.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Reward the candor.</text>
<text class="b" x="120" y="176" font-size="32">Show people that speaking up was worth it.</text>
<g id="f0">
<rect class="s-line" x="120" y="230" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="190" y="330" width="274" height="120" rx="20"/><path class="gain" d="M240 448l-10 40 50-40z"/>
<text class="d" x="327" y="405" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">Thank you</text>
<text class="d5" x="156" y="600" font-size="46">Thank them.</text>
<text class="m" x="156" y="650" font-size="20">AND MEAN IT</text>
</g>
<g id="f1">
<rect class="s-line" x="593" y="230" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="f_gear"></g>
<text class="d5" x="629" y="600" font-size="46">Act on it.</text>
<text class="m" x="629" y="650" font-size="20">LET PEOPLE SEE</text><text class="m" x="629" y="682" font-size="20">THE CHANGE</text>
</g>
<g id="f2">
<rect class="s-line" x="1066" y="230" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="1163" y="290" width="220" height="220" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="1187" y="342" font-size="24" style="fill:var(--gain)">BECAUSE…</text>
<path class="s-line" d="M1187 390h172M1187 430h172M1187 470h110" stroke-width="7" stroke-linecap="round"/>
<text class="d5" x="1102" y="600" font-size="46">Explain why.</text>
<text class="m" x="1102" y="650" font-size="20">IF YOU CAN’T FIX IT,</text><text class="m" x="1102" y="682" font-size="20">SHOW YOU TOOK IT SERIOUSLY</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then give it.</text>
<text class="b" x="120" y="176" font-size="32">Repeat until asking and answering feel normal.</text>
<polygon class="ink" points="270,680 430,680 410,750 290,750"/>
<path id="g_stem" class="s-gain" d="M350 680V340" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="g_lv"></g>
<circle id="g_fl" class="gain" cx="350" cy="322" r="24"/>
<g id="g_ppl"></g>
<g id="g_hs">
<path class="s-gain" d="M950 485Q1020 520 1090 500" fill="none" stroke-width="14" stroke-linecap="round"/>
<path class="s-ink" d="M1250 485Q1180 520 1110 500" fill="none" stroke-width="14" stroke-linecap="round"/>
<circle class="gain" cx="1100" cy="500" r="20"/>
</g>
<path id="g_arc" class="s-gain" d="M900 330Q1100 230 1300 330" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="g_bel"><path class="s-gain" d="M1272 304L1300 330L1264 334" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1100" y="250" font-size="22" text-anchor="middle">THEY BELIEVE YOU MEAN WELL</text></g>
<g id="g_trust"><text class="d" x="120" y="830" font-size="44">Your criticism arrives with trust built in.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">This week, ask one person</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">your <tspan style="fill:var(--gain)">go-to question</tspan>.</text></g>
<g id="k0"><text class="m" x="143" y="600" font-size="26"><tspan style="fill:var(--gain)">1</tspan>  COUNT TO SIX</text></g>
<g id="k1"><text class="m" x="143" y="650" font-size="26"><tspan style="fill:var(--gain)">2</tspan>  LISTEN</text></g>
<g id="k2"><text class="m" x="143" y="700" font-size="26"><tspan style="fill:var(--gain)">3</tspan>  CHANGE ONE THING</text></g>
<g id="k_cal">
<rect class="s-ink" x="1240" y="580" width="200" height="210" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1243" y="583" width="194" height="47" rx="9"/>
<rect class="ink" x="1280" y="562" width="12" height="36" rx="6"/><rect class="ink" x="1388" y="562" width="12" height="36" rx="6"/>
<g id="k_grid"></g>
<path id="k_chk" d="M1312 705l7 8 13-15" fill="none" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
</g>
</g>