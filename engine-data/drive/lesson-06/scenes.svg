</g></g>
<g id="outl"><text class="m" x="1180" y="700" font-size="22" text-anchor="middle" style="fill:var(--loss)">OUTSIDER: SOMEONE ELSE’S GOAL</text></g>
</g>

<g id="s7" opacity="0">
