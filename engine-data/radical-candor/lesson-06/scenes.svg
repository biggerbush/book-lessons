<g id="perf"><text class="d" x="120" y="820" font-size="40">Gradual growth does not mean low performance.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask, don’t guess.</text>
<text class="b" x="120" y="176" font-size="32">The only way to know someone’s path is to ask, and listen.</text>
