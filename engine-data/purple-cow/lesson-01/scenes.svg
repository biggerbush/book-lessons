<text class="m" x="160" y="690" font-size="22" style="fill:var(--gain)">PICK ONE</text>
</g>
<g id="cards"></g>
<g id="str">
<path class="s-muted" d="M1050 608L975 560" stroke-width="4" stroke-dasharray="6 8"/>
<text class="m" x="1120" y="680" font-size="20">AFTER 20 MINUTES</text>
<text class="m" x="1120" y="710" font-size="20">OF SIMILAR OPTIONS</text>
</g>
<g id="wq"><text class="d" x="120" y="830" font-size="44">Would they look up, or would it blend in?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="80" letter-spacing="-2">What one change would</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="80" letter-spacing="-2">make your work look</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="80" letter-spacing="-2"><tspan style="fill:var(--loss)">purple</tspan> in a field of brown?</text></g>
<g id="ql"><text class="m" x="143" y="630" font-size="26">BE THE PURPLE COW</text></g>
