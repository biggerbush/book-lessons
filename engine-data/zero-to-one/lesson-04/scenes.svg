<text class="m" x="340" y="552" font-size="20">PROFIT PER</text><text class="m" x="340" y="582" font-size="20">PASSENGER TRIP</text></g>
<g id="barA"><text class="m" x="340" y="662" font-size="18">REVENUE · SCHEMATIC</text><text class="m" x="120" y="712" font-size="22">AIRLINES</text>
