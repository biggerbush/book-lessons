<g id="pills"></g>
<g id="fan"><text class="d" x="120" y="790" font-size="48">One reply can turn a stranger into a fan.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Go where they are.</text>
<text class="b" x="120" y="176" font-size="32">Caring doesn’t stop at your own page.</text>
<g id="page"><rect class="s-ink" x="680" y="380" width="240" height="140" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="800" y="458" font-size="22" text-anchor="middle">YOUR PAGE</text></g>
<path id="l1" class="s-gain" d="M676 450H548" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path id="l2" class="s-gain" d="M924 450H1130" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="fb"><rect class="s-ink" x="120" y="240" width="420" height="380" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="140" y="285" font-size="20">WINE FORUMS &amp; BLOGS</text><g id="frows"></g></g>
<g id="gl"><circle class="s-ink" cx="1250" cy="400" r="110" fill="var(--stage)" stroke-width="14"/><path class="s-ink" d="M1330 480l88 88" stroke-width="24" stroke-linecap="round"/><text class="d" x="1250" y="415" font-size="44" text-anchor="middle">wine</text><text class="m" x="1180" y="650" font-size="20" text-anchor="middle">TWITTER SEARCH</text></g>
<g id="tw"></g>
<g id="nsg"><text id="ns" class="d5" x="120" y="780" font-size="48" fill-opacity=".55">Not selling.</text></g>
<line id="nsl" class="s-ink" x1="112" y1="764" x2="112" y2="764" stroke-width="6" stroke-linecap="round"/>
<g id="bu"><text class="d" x="520" y="780" font-size="56" style="fill:var(--gain)">Being useful.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Give first.</text>
<text class="b" x="120" y="176" font-size="32">Every reply is a small gift, with no strings attached.</text>
<g id="gifts"></g>
<g id="garr"><path class="s-muted" d="M850 450h260m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect id="tf" class="gain" x="1158" y="642" width="104" height="0"/>
<rect class="s-ink" x="1150" y="250" width="120" height="400" rx="20" fill="none" stroke-width="6"/>
<text class="m" x="1210" y="692" font-size="22" text-anchor="middle">TRUST</text>
<g id="back"><g id="backp"></g><text class="m" x="1385" y="640" font-size="18" text-anchor="middle">THEY COME BACK</text></g>
<g id="offer"><text class="d5" x="120" y="800" font-size="38">Trust brings people back when you have something to offer.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Does it scale?</text>
<text class="b" x="120" y="176" font-size="32">At first, it doesn’t need to.</text>
<g id="skp"></g>
<g id="skb"><rect class="s-loss" x="310" y="250" width="290" height="80" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-loss" d="M340 330l-36 36 70-36" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="455" y="298" font-size="22" text-anchor="middle" style="fill:var(--loss)">THIS CAN’T SCALE</text></g>
<g id="ans"><text class="d5" x="120" y="690" font-size="34" style="fill:var(--gain)">It doesn’t need to,</text><text class="d5" x="120" y="736" font-size="34" style="fill:var(--gain)">at first.</text></g>
<g id="outer"><circle class="s-line" cx="1020" cy="500" r="260" fill="none" stroke-width="3" stroke-dasharray="6 10"/><g id="odots"></g></g>
<g id="near"><g id="nl"></g><circle class="gain" cx="1020" cy="500" r="58"/><text class="m" x="1020" y="509" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
<g id="grow"><text class="m" x="120" y="830" font-size="22">THE PERSONAL TOUCH IS WHAT MAKES IT GROW</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Audience vs community.</text>
<text class="b" x="120" y="176" font-size="32">One watches. The other talks back.</text>
<g id="aud"><circle class="gain" cx="440" cy="280" r="34"/><g id="crw"></g><text class="m" x="440" y="700" font-size="24" text-anchor="middle">AN AUDIENCE WATCHES</text></g>
<g id="com"><g id="rl"></g><g id="rn"></g><text class="m" x="1120" y="700" font-size="24" text-anchor="middle" style="fill:var(--gain)">A COMMUNITY TALKS</text></g>
<g id="diff"><text class="d" x="120" y="784" font-size="44">The difference is caring, one person at a time.</text></g>
<g id="built"><rect class="gain" x="120" y="828" width="10" height="28" rx="3"/><text class="m" x="146" y="852" font-size="26">GARY BUILT HIS FOLLOWING EXACTLY THIS WAY</text></g>
</g>

<g id="s8" opacity="0">
<g id="cg"><rect class="s-ink" x="1270" y="180" width="120" height="70" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="1340" y="230" width="120" height="70" rx="16"/><path d="M1370 265h60" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round"/></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">This week, reply to</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">every comment you get.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Then join one conversation</text></g>
<g id="qd"><text class="d" x="136" y="670" font-size="88" letter-spacing="-2" style="fill:var(--gain)">beyond your own page.</text></g>
