<g id="r4s"><text class="d5" x="680" y="650" font-size="44">“Let’s work this out.”</text></g>
<g id="r4k"><text class="d" x="120" y="800" font-size="44">You’re in control. Nobody needs to panic.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A pushy boss.</text>
<text class="b" x="120" y="176" font-size="32">An office worker, and a boss who loves sudden demands.</text>
