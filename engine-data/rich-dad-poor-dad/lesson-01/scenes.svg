<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make money work for you.</text>
<g id="rQcard"><rect class="s-line" x="120" y="200" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d5" x="160" y="280" font-size="40">“The poor and the</text><text class="d5" x="160" y="330" font-size="40">middle class</text><text class="d5" x="160" y="380" font-size="40" style="fill:var(--loss)">work for money.”</text>
