<g id="lv"><text class="m" x="1140" y="660" font-size="22" style="fill:var(--loss)">VERDICT?</text></g>
<g id="lm"><text class="m" x="1420" y="660" font-size="22" text-anchor="end" style="fill:var(--gain)">OR A MAP?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same grade. Two different events.</text>
<text class="b" x="120" y="176" font-size="32">What each one believes about ability changes everything.</text>
