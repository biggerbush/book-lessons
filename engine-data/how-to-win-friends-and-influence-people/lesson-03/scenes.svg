<g id="r1"><rect class="s-gain" x="1180" y="570" width="300" height="210" rx="12" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1204" y="640" font-size="28">Thank you for</text><text class="d5" x="1204" y="680" font-size="26">your kind letter…</text></g>
