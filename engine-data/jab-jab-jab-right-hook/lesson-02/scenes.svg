<g id="s0">
<text class="m" x="120" y="150" font-size="28">JAB, JAB, JAB, RIGHT HOOK · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Content is king.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Context is <tspan style="fill:var(--gain)">God.</tspan></text>
<text class="b" x="120" y="600" font-size="32">Great content flops when it ignores where it lives.</text>
<g id="card0"><rect id="card0r" class="s-ink" x="1100" y="250" width="340" height="220" rx="16" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1150" cy="300" r="22"/><path class="s-line" d="M1190 300h170M1140 360h260M1140 400h260M1140 440h160" stroke-width="10" stroke-linecap="round"/></g>
<g id="chirp"></g>
<g id="pin0"><path class="loss" d="M1440 250c-22-26-34-42-34-58a34 34 0 0 1 68 0c0 16-12 32-34 58z"/><circle cx="1440" cy="192" r="12" fill="var(--stage)"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One line sums it up.</text>
<text class="b" x="120" y="176" font-size="32">Gary Vaynerchuk’s big idea about content.</text>
<g id="gary"><path class="s-gain" d="M352 344l26-14M358 368h30M352 392l26 14" stroke-width="6" stroke-linecap="round"/><text class="m" x="280" y="630" font-size="22" text-anchor="middle">GARY VAYNERCHUK</text></g>
<g id="q1"><text class="d" x="560" y="400" font-size="72">“Content is king,</text><path class="gain" d="M1300 400v-62l30 30 30-44 30 44 30-30v62z"/></g>
<g id="q2"><text class="d" x="560" y="510" font-size="72">but context is <tspan style="fill:var(--gain)">God.”</tspan></text></g>
<g id="frame1"><rect class="s-muted" x="560" y="610" width="520" height="190" rx="16" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="580" y="644" font-size="20">CONTEXT</text>
<g id="fitB"><rect class="gain" x="700" y="670" width="240" height="90" rx="12"/><text class="m" x="820" y="723" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CONTENT</text></g></g>
<g id="fitT"><text class="d5" x="1120" y="700" font-size="36">It works only</text><text class="d5" x="1120" y="750" font-size="36">when it fits.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A tale of two rooms.</text>
<text class="b" x="120" y="176" font-size="32">Two good stories, told in the wrong places.</text>
<g id="roomL"><rect id="pLr" class="s-line" x="120" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="150" y="270" font-size="22">LOUD PARTY</text>
<rect class="s-ink" x="180" y="300" width="300" height="150" rx="14" fill="var(--stage)" stroke-width="4"/>
<path class="s-line" d="M205 330h250M205 355h250M205 380h250M205 405h250M205 430h160" stroke-width="6" stroke-linecap="round"/>
<g id="spk0"></g><g id="crowd0"></g><g id="notes"></g>
<text class="d5" x="150" y="690" font-size="34">A long story at a loud party.</text></g>
<g id="roomR"><rect id="pRr" class="s-line" x="840" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="870" y="270" font-size="22">HUSHED LIBRARY</text>
<rect class="s-ink" x="900" y="310" width="280" height="130" rx="14" fill="var(--stage)" stroke-width="4"/>
<text class="d" x="1040" y="392" font-size="44" text-anchor="middle" style="fill:var(--loss)">HA HA HA!</text>
<rect class="s-ink" x="1220" y="290" width="230" height="160" fill="none" stroke-width="5"/><path class="s-ink" d="M1220 370h230" stroke-width="5"/><g id="spines1"></g>
<g id="spk1"></g><g id="rd1"></g>
<text class="d" x="1335" y="505" font-size="28" text-anchor="middle" style="fill:var(--muted)">SHH!</text>
<text class="d5" x="870" y="690" font-size="32">A loud joke in a hushed library.</text></g>
<g id="bx0"><circle class="loss" cx="720" cy="262" r="24"/><path d="M710 252l20 20M730 252l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="bx1"><circle class="loss" cx="1440" cy="262" r="24"/><path d="M1430 252l20 20M1450 252l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="wr"><text class="d" x="120" y="830" font-size="52">Good story. Wrong room.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every platform is a room.</text>
<text class="b" x="120" y="176" font-size="32">Each one has its own culture.</text>
<g id="houses"></g>
<g id="e0"><text class="b" x="340" y="712" font-size="26" text-anchor="middle">To catch up with</text><text class="b" x="340" y="746" font-size="26" text-anchor="middle">friends and family</text></g>
<g id="e2"><text class="b" x="1260" y="712" font-size="26" text-anchor="middle">To collect ideas and</text><text class="b" x="1260" y="746" font-size="26" text-anchor="middle">plan things to do</text></g>
<g id="mk0"><circle class="gain" cx="340" cy="236" r="24"/><path d="M329 236l8 8 14-16" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="mk2"><circle class="loss" cx="1260" cy="236" r="24"/><path d="M1250 226l20 20M1270 226l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="same3"><text class="d" x="120" y="830" font-size="40">Same post: welcome here, out of place there.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The copy-paste trap.</text>
<text class="b" x="120" y="176" font-size="32">One post, copied onto every platform.</text>
<g id="cps"></g>
<g id="src4"><rect class="s-ink" x="120" y="240" width="440" height="260" rx="16" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="168" cy="286" r="20"/>
<path class="s-line" d="M150 340h370M150 370h370M150 400h370M150 430h370M150 460h220" stroke-width="8" stroke-linecap="round"/></g>
<g id="btn"><rect class="gain" x="120" y="600" width="300" height="70" rx="35"/><text class="m" x="270" y="643" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">COPY TO ALL</text></g>
<g id="arr4"><path class="s-muted" d="M630 400h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="tw"><rect class="s-ink" x="740" y="240" width="740" height="320" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="770" y="282" font-size="20">TWITTER</text>
<text class="b" x="770" y="340" font-size="30" style="fill:var(--ink)">So excited to share some big news with</text>
<text class="b" x="770" y="385" font-size="30" style="fill:var(--ink)">all of you today, because we have bee…</text></g>
<g id="cut"><text class="m" x="770" y="450" font-size="24" style="fill:var(--loss)">HTTPS://FB.ME/…</text><path class="s-loss" d="M760 492h700" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="1460" y="532" font-size="20" text-anchor="end" style="fill:var(--loss)">CUT OFF</text></g>
<g id="rdr"><text class="d" x="1400" y="616" font-size="44" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="lazy"><text class="d" x="120" y="820" font-size="44">Looks lazy, like it was meant for someone else.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Go native.</text>
<text class="b" x="120" y="176" font-size="32">Make it look like it belongs there.</text>
<g id="bg5"><rect class="loss" x="120" y="240" width="320" height="320" fill-opacity=".16"/><rect class="gain" x="440" y="240" width="320" height="320" fill-opacity=".28"/>
<path class="s-ink" d="M140 500h600" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="280" y="604" font-size="20" text-anchor="middle">PLATFORM A</text><text class="m" x="600" y="604" font-size="20" text-anchor="middle">PLATFORM B</text></g>
<g id="cham"></g>
<g id="tags"></g>
<g id="phone"><rect class="s-ink" x="1060" y="360" width="300" height="410" rx="30" fill="var(--stage)" stroke-width="6"/>
<rect x="1085" y="400" width="250" height="100" rx="10" fill="var(--line)"/><rect id="np" x="1085" y="520" width="250" height="100" rx="10" fill="var(--line)"/><rect x="1085" y="640" width="250" height="100" rx="10" fill="var(--line)"/></g>
<g id="nat"><text class="m" x="1030" y="560" font-size="22" text-anchor="end" style="fill:var(--gain)">CONTENT</text><text class="m" x="1030" y="604" font-size="22" text-anchor="end">NOT AN AD</text><path class="s-loss" d="M896 597h138" stroke-width="4" stroke-linecap="round"/></g>
<g id="treat"><text class="d" x="120" y="832" font-size="40">People treat it like content, not like an ad.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">One story, many shapes.</text>
<text class="b" x="120" y="176" font-size="32">The core stays the same. The shape changes.</text>
<g id="core"><circle class="s-gain" cx="400" cy="520" r="140" fill="none" stroke-width="4" stroke-dasharray="10 10"/><circle id="coreC" class="gain" cx="400" cy="520" r="100"/><text class="d" x="400" y="536" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">STORY</text></g>
<g id="l1"><path class="s-gain" d="M510 460C640 400 680 330 800 330" fill="none" stroke-width="5" stroke-dasharray="10 8"/></g>
<g id="l2"><path class="s-gain" d="M510 580C640 640 680 620 800 620" fill="none" stroke-width="5" stroke-dasharray="10 8"/></g>
