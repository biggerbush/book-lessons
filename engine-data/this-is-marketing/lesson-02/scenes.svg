<g id="k0"><text class="d5" x="760" y="310" font-size="40">Know what they want.</text></g>
<g id="k1"><text class="d5" x="760" y="380" font-size="40">Know what they fear.</text></g>
<g id="k2"><text class="d5" x="760" y="470" font-size="40">Shape the work around them,</text></g>
<g id="k3"><text class="b" x="760" y="520" font-size="30">not around an imaginary average.</text></g>
