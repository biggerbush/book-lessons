</g>
<g id="c_txt"><text class="d" x="120" y="820" font-size="40">Measured by suffering, success looks far less impressive.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Letting go of craving.</text>
<text class="b" x="120" y="176" font-size="32">A Buddhist view of where suffering comes from.</text>
<circle id="m_halo" class="s-gain" cx="800" cy="500" r="215" fill="none" stroke-width="5" stroke-dasharray="14 12"/>
<g id="m_fe"></g>
<g id="m_monk"><circle class="ink" cx="800" cy="400" r="44"/><path class="ink" d="M690 620Q700 480 800 460Q900 480 910 620z"/><rect class="ink" x="680" y="600" width="240" height="40" rx="20"/></g>
<g id="m_hands"><path class="s-gain" d="M720 596q40-40 70-10M880 596q-40-40-70-10" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="m_crave"><text class="d" x="120" y="500" font-size="52" style="fill:var(--loss)">Craving</text><text class="m" x="120" y="545" font-size="20">CHASING GOOD FEELINGS</text></g>
<g id="m_let"><text class="d" x="1480" y="500" font-size="52" text-anchor="end" style="fill:var(--gain)">Letting go</text><text class="m" x="1480" y="545" font-size="20" text-anchor="end">UNDERSTAND, THEN RELEASE</text></g>
<g id="m_txt"><text class="d" x="120" y="820" font-size="44">No one yet knows which view is right.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Redesigning ourselves.</text>
<text class="b" x="120" y="176" font-size="32">Biotechnology could reshape our bodies and minds.</text>
