<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One big idea.</text>
<text class="b" x="120" y="176" font-size="32">Philip Tetlock tracked thousands of expert predictions.</text>
<g id="xdots"></g>
<g id="xdotl"><text class="m" x="120" y="600" font-size="20">THOUSANDS OF PREDICTIONS</text></g>
