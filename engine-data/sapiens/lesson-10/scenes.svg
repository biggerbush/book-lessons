<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 10</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">More power.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">But are we happier?</text>
<text class="b" x="120" y="600" font-size="32">Our species gained enormous power, but did it make us happier?</text>
<g id="t_art" transform="translate(1305 480) scale(1.3) translate(-1330 -398)">
<g id="t_tool"><path class="ink" d="M1200 330l40-90 40 90-40 30z"/><text class="m" x="1240" y="402" font-size="20" text-anchor="middle">STONE</text></g>
