<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Defeat the ghosts</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of fear.</text>
<text class="b" x="120" y="600" font-size="32">Name the six fears that quietly hold you back.</text>
<g id="tperson"></g><g id="tghosts"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Six basic fears.</text>
<text class="b" x="120" y="176" font-size="32">Hill believed they hold most people back.</text>
<g id="cards"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fear lives in the mind.</text>
<text class="b" x="120" y="176" font-size="32">Not in the world.</text>
<circle class="ink" cx="300" cy="500" r="60"/><path class="ink" d="M210 752v-78a90 90 0 0 1 180 0v78z"/>
<g id="cloud"><circle cx="340" cy="330" r="60" fill="var(--line)"/><circle cx="420" cy="290" r="70" fill="var(--line)"/><circle cx="500" cy="330" r="60" fill="var(--line)"/><circle cx="420" cy="365" r="55" fill="var(--line)"/><circle cx="372" cy="425" r="13" fill="var(--line)"/><circle cx="352" cy="452" r="8" fill="var(--line)"/><g id="cg"></g></g>
<g id="quote"><rect class="s-ink" x="680" y="240" width="800" height="220" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="720" y="290" font-size="20">IN HIS WORDS</text><text class="d" x="720" y="360" font-size="48">“Fears are nothing more</text><text class="d" x="720" y="420" font-size="48">than states of mind.”</text></g>
<g id="dial"><path d="M860 720A140 140 0 0 1 1000 580" fill="none" stroke="var(--loss)" stroke-width="18" stroke-linecap="round"/><path d="M1000 580A140 140 0 0 1 1140 720" fill="none" stroke="var(--gain)" stroke-width="18" stroke-linecap="round"/><line id="needle" class="s-ink" x1="1000" y1="720" x2="1000" y2="610" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1000" cy="720" r="16"/><text class="m" x="860" y="770" font-size="22" text-anchor="middle">FEAR</text><text class="m" x="1140" y="770" font-size="22" text-anchor="middle">DIRECTED</text></g>
<g id="habit"><text class="d" x="120" y="840" font-size="40">Fear can be managed, like any habit of thinking.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The poverty ghost.</text>
<text class="b" x="120" y="176" font-size="32">The most destructive of the six.</text>
<g id="wallet"><g id="wg"></g><rect class="s-ink" x="160" y="380" width="300" height="200" rx="20" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M160 440h300" stroke-width="5"/><rect class="s-ink" x="400" y="455" width="60" height="50" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="310" y="630" font-size="20" text-anchor="middle">FEAR OF POVERTY</text></g>
<g id="tags"></g><g id="snail" opacity="0"></g>
<g id="door"><rect class="s-ink" x="1120" y="240" width="200" height="320" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1290" cy="400" r="8"/><path d="M1206 390v-14a14 14 0 0 1 28 0v14" fill="none" stroke="var(--loss)" stroke-width="6"/><rect class="loss" x="1196" y="390" width="48" height="40" rx="6"/><text class="m" x="1220" y="604" font-size="20" text-anchor="middle">WAITING FOR</text><text class="m" x="1220" y="632" font-size="20" text-anchor="middle">PERFECT CONDITIONS</text></g>
<g id="envs"><text class="m" x="1260" y="750" font-size="20" text-anchor="middle">OPPORTUNITIES PASS BY</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The critic ghost.</text>
<text class="b" x="120" y="176" font-size="32">Fear of criticism works more quietly.</text>
<g id="hand"><g id="handj"><rect class="ink" x="140" y="400" width="50" height="110" rx="8"/><rect class="loss" x="182" y="405" width="120" height="100" rx="30"/><rect class="loss" x="280" y="410" width="160" height="34" rx="17"/><path d="M220 462h70M220 486h70" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="victim"><g id="vbody"></g><rect id="vbadge" x="585" y="555" width="30" height="18" rx="4" fill="var(--stage)" opacity="0"/></g>
<g id="bulb"><rect class="ink" x="584" y="372" width="32" height="24" rx="4"/><circle id="bulbC" cx="600" cy="340" r="36" style="fill:var(--gain)"/><rect id="lid" class="loss" x="550" y="220" width="100" height="14" rx="4"/></g>
<g id="copies"><g id="cpl"></g><text class="m" x="820" y="680" font-size="20">SHY · SELF-CONSCIOUS · COPYING OTHERS</text></g>
<g id="crd"><text class="d" x="120" y="820" font-size="44">Bold ideas never leave their heads.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where fear comes from.</text>
<text class="b" x="120" y="176" font-size="32">It grows from two earlier habits.</text>
<path class="s-ink" d="M120 640H1480" stroke-width="6" stroke-linecap="round"/>
<path id="root" d="M330 676C450 790 680 700 800 676C920 790 1150 700 1270 676" fill="none" stroke="var(--loss)" stroke-width="4" stroke-linecap="round"/>
<g id="seeds"><ellipse class="ink" cx="330" cy="666" rx="18" ry="11"/><ellipse class="ink" cx="800" cy="666" rx="18" ry="11"/><ellipse class="ink" cx="1270" cy="666" rx="18" ry="11"/><text class="m" x="330" y="520" font-size="22" text-anchor="middle">INDECISION</text><text class="m" x="800" y="390" font-size="22" text-anchor="middle">DOUBT</text><text class="m" x="1270" y="320" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEAR</text></g>
<g id="pl0"><path d="M330 640V560" stroke="var(--muted)" stroke-width="6" stroke-linecap="round"/><path d="M330 590q-30-10-40-34q30 4 40 34zM330 575q30-8 38-32q-28 4-38 32z" fill="var(--muted)"/></g>
<g id="pl1"><path class="s-ink" d="M800 640V430" stroke-width="10" stroke-linecap="round"/><path class="s-ink" d="M800 600l-26-20M800 540l26-20M800 480l-26-20" stroke-width="6" stroke-linecap="round"/></g>
<g id="pl2"><path class="s-loss" d="M1270 640V455" stroke-width="10"/><g id="pg"></g></g>
<path id="ar0" class="s-muted" d="M410 580H720m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ar1" class="s-muted" d="M880 580H1190m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="grad"><text class="m" x="120" y="840" font-size="22">SO GRADUAL THAT PEOPLE RARELY NOTICE IT GROWING</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your principles are armor.</text>
<text class="b" x="120" y="176" font-size="32">Here Hill ties the whole book together.</text>
<g id="armp"></g>
<g id="shield"><path class="gain" d="M360 430h130v90q0 90-65 125q-65-35-65-125z"/><path d="M425 470v130M380 520h90" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/></g>
<g id="atk" opacity="0"></g><g id="tiles"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Name your ghost.</text>
<text class="b" x="120" y="176" font-size="32">Look honestly for these fears in yourself.</text>
<g id="mir"><ellipse class="s-ink" cx="300" cy="500" rx="140" ry="200" fill="var(--stage)" stroke-width="8"/><g id="mg"></g><g id="mp"></g><path class="s-ink" d="M300 700v60M230 760h140" stroke-width="8" stroke-linecap="round"/></g>
<g id="nb"><rect class="s-ink" x="560" y="260" width="400" height="380" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><text class="m" x="590" y="330" font-size="20">WHICH GHOST VISITS MOST?</text><path id="sc0" d="M590 380q20-16 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="var(--gain)" stroke-width="5" stroke-linecap="round"/><text class="m" x="590" y="450" font-size="20">WHAT DOES IT STOP?</text><path id="sc1" d="M590 500q20-16 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="var(--gain)" stroke-width="5" stroke-linecap="round"/></g>
<g id="stp"><path class="s-ink" d="M1040 760h90v-80h90v-80h90v-80h90v-80h80" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text id="stlA" class="m" x="1470" y="712" font-size="22" text-anchor="end">ONE DECISION,</text><text id="stlB" class="m" x="1470" y="744" font-size="22" text-anchor="end">ONE SMALL STEP</text><circle id="clb" class="gain" r="20" cx="1085" cy="738"/></g>
<g id="g7" opacity="0"></g>
<g id="grip"><text class="d" x="120" y="840" font-size="40">Named and met with action, fear loses its grip.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Which of the six ghosts</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">has been quietly steering</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">your <tspan style="fill:var(--gain)">choices?</tspan></text></g>
<g id="qd"><text class="m" x="143" y="680" font-size="26">WHAT WILL YOU DO THIS WEEK TO SEND IT AWAY?</text></g>
<g id="qg" opacity="0"></g>
</g>