<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF HABIT · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your life runs</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">on autopilot.</text>
<text class="b" x="120" y="600" font-size="32">Most of what you do each day, you never decided.</text>
<rect class="ink" x="1200" y="540" width="100" height="100"/>
<circle class="s-ink" cx="1250" cy="400" r="160" fill="var(--stage)" stroke-width="8"/>
<path class="s-line" d="M1140 380c0-70 60-100 110-100s110 30 110 100c0 50-40 80-110 80s-110-30-110-80zM1200 300v40M1300 300v40" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="rings"></g>
<circle id="glow" class="gain" cx="1250" cy="400" r="0"/>
<text id="apl" class="m" x="1250" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">AUTOPILOT</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Eugene Pauly.</text>
<text class="b" x="120" y="176" font-size="32">Retired, living in California with his wife, Beverly.</text>
<g id="fam"><g id="ppl"></g>
<text class="m" x="300" y="620" font-size="22" text-anchor="middle">EUGENE</text>
<text class="m" x="470" y="620" font-size="22" text-anchor="middle">BEVERLY</text>
<text class="m" x="385" y="670" font-size="20" text-anchor="middle">CALIFORNIA</text></g>
<text id="yr" class="d" x="560" y="280" font-size="72" style="fill:var(--loss)">1992</text>
<circle id="hit" class="s-loss" cx="300" cy="400" r="58" fill="none" stroke-width="6" stroke-dasharray="10 8"/>
<g id="virus"></g>
<g id="slate"><rect class="s-line" x="860" y="240" width="620" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="900" y="290" font-size="22">NEW FACTS</text><g id="facts"></g>
<text class="d5" x="900" y="720" font-size="34">Gone within moments.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">He couldn’t draw his own house.</text>
<text class="b" x="120" y="176" font-size="32">A new home after the illness.</text>
<g id="hs"><path class="s-ink" d="M160 420L310 300L460 420V560H160Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="ink" x="285" y="480" width="50" height="80"/>
<text class="m" x="310" y="610" font-size="20" text-anchor="middle">NEW HOUSE</text></g>
<g id="sketch"><rect class="s-ink" x="560" y="260" width="300" height="340" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="710" y="500" font-size="160" text-anchor="middle" style="fill:var(--muted)">?</text>
<text class="m" x="710" y="640" font-size="20" text-anchor="middle">HIS SKETCH</text></g>
<g id="plan"><rect class="s-ink" x="960" y="260" width="520" height="420" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1223" y="263" width="254" height="204" fill-opacity=".2"/>
<path class="s-ink" d="M1220 260V390M960 470H1150M1250 470H1480" stroke-width="6"/>
<rect x="1400" y="320" width="60" height="120" fill="var(--line)"/><circle class="gain" cx="1430" cy="350" r="12"/>
<rect x="1060" y="420" width="40" height="40" fill="var(--line)"/>
<text class="m" x="990" y="300" font-size="20">LIVING</text><text class="m" x="1250" y="300" font-size="20">KITCHEN</text><text class="m" x="990" y="650" font-size="20">BEDROOM</text>
<path id="kpath" class="s-gain" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="eat" class="gain" r="16" stroke="var(--stage)" stroke-width="4"/></g>
<text id="kt" class="d" x="120" y="800" font-size="44">No map in his head. He still got there.</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every day, a walk.</text>
<text class="b" x="120" y="176" font-size="32">A walk around the neighborhood.</text>
<g id="grid"></g>
<path id="home" class="s-ink" d="M600 250L635 215L670 250V290H600Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="635" y="320" font-size="20" text-anchor="middle">HOME</text>
<path id="route" class="s-gain" fill="none" stroke-width="8" stroke-linejoin="round"/>
<circle id="walker" class="gain" r="16" stroke="var(--stage)" stroke-width="4"/>
<g id="bev"><g id="bvp"></g>
<circle class="s-loss" cx="440" cy="290" r="60" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="440" y="316" font-size="70" text-anchor="middle" style="fill:var(--loss)">?</text>
<circle class="loss" cx="380" cy="370" r="10"/><circle class="loss" cx="352" cy="394" r="6"/>
<text class="m" x="300" y="650" font-size="22" text-anchor="middle">BEVERLY</text></g>
<text id="ht" class="d" x="120" y="810" font-size="40">Home every time, with no idea how.</text>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The object test.</text>
<text class="b" x="120" y="176" font-size="32">Designed by memory researcher Larry Squire.</text>
<g id="sci"><g id="scp"></g><text class="m" x="220" y="600" font-size="20" text-anchor="middle">LARRY SQUIRE</text></g>
<g id="pair"><rect class="s-line" x="420" y="260" width="480" height="320" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect id="mk1" class="gain" x="525" y="500" width="70" height="24" rx="6"/>
<circle id="lid" class="ink" cx="560" cy="430" r="60"/>
<rect class="ink" x="700" y="370" width="120" height="120" rx="8"/>
<text class="m" x="440" y="620" font-size="20">ONE IS MARKED UNDERNEATH</text></g>
<g id="chart"><path class="s-ink" d="M1000 260V640H1460" fill="none" stroke-width="5"/>
<text class="m" x="1020" y="280" font-size="20">RIGHT PICKS</text><text class="m" x="1460" y="680" font-size="20" text-anchor="end">WEEKS</text>
<g id="bars"></g></g>
<path id="chk" class="s-gain" d="M1404 270l16 16 30-34" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text id="pt" class="d" x="120" y="790" font-size="40">Better and better, with no memory of it.</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Habits live deeper in the brain.</text>
<text class="b" x="120" y="176" font-size="32">The basal ganglia, spared by Eugene’s illness.</text>
<g id="brn"><path class="ink" d="M410 650L430 760H480L485 650Z"/>
<ellipse class="s-ink" cx="420" cy="470" rx="250" ry="190" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M260 340q40-30 80 0M420 330q40-30 80 0M560 400q30 30 0 60" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="mem"><circle class="loss" cx="300" cy="470" r="46" fill-opacity=".35"/>
<path class="s-loss" d="M276 446l48 48M324 446l-48 48" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="300" y="400" font-size="20" text-anchor="middle" style="fill:var(--loss)">MEMORY</text></g>
<g id="bgg"><circle id="bgc" class="gain" cx="500" cy="500" r="50"/>
<text class="m" x="500" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">BASAL GANGLIA</text></g>
<g id="trk"><text class="m" x="820" y="340" font-size="22" style="fill:var(--loss)">MEMORY</text>
<path class="s-loss" d="M820 380H1080M1200 380H1460" stroke-width="8" stroke-dasharray="16 12"/>
<path class="s-loss" d="M1120 360l40 40M1160 360l-40 40" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="820" y="520" font-size="22" style="fill:var(--gain)">HABIT</text>
<path class="s-gain" d="M820 560H1460" stroke-width="10" stroke-linecap="round"/>
<circle id="hdot" class="ink" cx="840" cy="560" r="18"/></g>
<text id="aut" class="d" x="820" y="700" font-size="40">Works with no idea why.</text>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">It isn’t just Eugene.</text>
<text class="b" x="120" y="176" font-size="32">A 2006 Duke University study, cited by Duhigg.</text>
<g id="pie"><circle cx="360" cy="470" r="180" fill="var(--line)"/><path id="wedge" class="gain"/></g>
<g id="pg"><text id="pct" class="d" x="640" y="420" font-size="120" style="fill:var(--gain)">40%+</text>
<text class="m" x="646" y="470" font-size="22">OF DAILY ACTIONS ARE HABITS,</text><text class="m" x="646" y="502" font-size="22">NOT DECISIONS</text></g>
<g id="ic0"><rect id="ib0" class="s-line" x="640" y="560" width="240" height="170" rx="16" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="670" y="650" width="150" height="18" rx="9"/><rect class="ink" x="800" y="636" width="50" height="32" rx="8"/><rect class="gain" x="806" y="612" width="38" height="24"/>
<text class="m" x="760" y="770" font-size="20" text-anchor="middle">BRUSHING</text></g>
<g id="ic1"><rect id="ib1" class="s-line" x="920" y="560" width="240" height="170" rx="16" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="990" y="596" width="100" height="44" rx="12"/><rect class="ink" x="960" y="630" width="160" height="50" rx="12"/>
<circle cx="995" cy="684" r="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle cx="1085" cy="684" r="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<text class="m" x="1040" y="770" font-size="20" text-anchor="middle">THE DRIVE</text></g>
<g id="ic2"><rect id="ib2" class="s-line" x="1200" y="560" width="240" height="170" rx="16" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="1285" y="585" width="70" height="124" rx="12"/><rect x="1295" y="600" width="50" height="84" fill="var(--stage)"/><circle class="gain" cx="1320" cy="697" r="5"/>
<text class="m" x="1320" y="770" font-size="20" text-anchor="middle">YOUR PHONE</text></g>
<text id="yt" class="d" x="120" y="840" font-size="40">You do them. You don’t choose them.</text>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Unsettling. But good news.</text>
<text class="b" x="120" y="176" font-size="32">So much of life runs on autopilot.</text>
<g id="sun"><g id="rays"></g><circle class="gain" cx="300" cy="440" r="70"/>
<text class="m" x="300" y="640" font-size="22" text-anchor="middle" style="fill:var(--gain)">GOOD NEWS</text></g>
<g id="wheel"><circle class="s-ink" cx="800" cy="470" r="170" fill="none" stroke-width="20"/>
<path class="s-ink" d="M630 470H970M800 470V640" stroke-width="16"/><circle class="ink" cx="800" cy="470" r="40"/></g>
<g id="road"><path class="s-line" d="M1100 740C1260 620 1180 420 1440 270" fill="none" stroke-width="60" stroke-linecap="round"/>
<path class="s-gain" d="M1100 740C1260 620 1180 420 1440 270" fill="none" stroke-width="6" stroke-dasharray="20 18"/></g>
<text id="st" class="d" x="120" y="800" font-size="48">Notice it, then steer it.</text>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">How many things happen</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">before you <tspan style="fill:var(--gain)">decide</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">to do them?</text></g>
<g id="clk"><circle class="s-ink" cx="1340" cy="450" r="110" fill="var(--stage)" stroke-width="8"/>
<path class="gain" d="M1340 450V344A106 106 0 0 1 1393 358Z"/>
<path id="hh" class="s-ink" d="M1340 450V390" stroke-width="8" stroke-linecap="round"/>
<path id="mh" class="s-ink" d="M1340 450V365" stroke-width="5" stroke-linecap="round"/></g>
<text id="tg" class="m" x="143" y="700" font-size="26">TOMORROW: WATCH ONE ORDINARY HOUR</text>
</g>