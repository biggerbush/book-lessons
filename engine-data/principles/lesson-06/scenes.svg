<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Weigh opinions</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">by believability.</text>
<text class="b" x="120" y="600" font-size="32">Not every opinion deserves an equal vote, including yours.</text>
<g id="waves"></g>
<g id="mtg"></g>
<g id="loudx"><text class="m" x="1310" y="720" font-size="22" text-anchor="middle" style="fill:var(--loss)">LOUDEST ≠ RIGHT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">People are wired differently.</text>
<text class="b" x="120" y="176" font-size="32">Each mind notices different things.</text>
<g id="hA"></g><g id="hB"></g>
<g id="bp">
<circle class="gain" cx="300" cy="330" r="16"/>
<path class="s-gain" d="M270 450L320 370L360 420L410 340L450 450" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="360" y="770" font-size="20" text-anchor="middle">SEES THE BIG PICTURE</text>
<text class="m" x="360" y="802" font-size="20" text-anchor="middle" style="fill:var(--loss)">MISSES THE DETAILS</text>
</g>
<g id="dl">
<g id="mg"><circle class="gain" cx="1205" cy="372" r="7"/><circle class="gain" cx="1240" cy="366" r="7"/><circle class="gain" cx="1222" cy="400" r="7"/><circle class="gain" cx="1250" cy="402" r="7"/>
<circle class="s-ink" cx="1225" cy="385" r="55" fill="none" stroke-width="8"/><path class="s-ink" d="M1264 424L1300 460" stroke-width="12" stroke-linecap="round"/></g>
<text class="m" x="1240" y="770" font-size="20" text-anchor="middle">CATCHES EVERY DETAIL</text>
<text class="m" x="1240" y="802" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOSES THE BIG PICTURE</text>
</g>
<g id="yy"><g id="hY"></g>
<text class="d" x="800" y="455" font-size="150" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="m" x="800" y="770" font-size="20" text-anchor="middle">NO MIND SEES IT ALL</text>
<text class="m" x="800" y="802" font-size="20" text-anchor="middle" style="fill:var(--gain)">INCLUDING YOURS</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not all votes are equal.</text>
<g id="sub2"><text class="b" x="120" y="176" font-size="32">Weigh each opinion by how believable the person is.</text></g>
<g id="voters"></g>
<g id="cards"></g>
