<g id="gtl"><circle class="ink" cx="1100" cy="610" r="14"/><text class="d5" x="1130" y="600" font-size="40">Gradual</text><text class="m" x="1130" y="640" font-size="20">MASTERING WHAT THEY DO</text></g>
</g>

