<g id="parts"></g>
<text class="m" x="400" y="710" font-size="20" text-anchor="middle">ALL SHIFTING AT ONCE</text>
<g id="rc0"><text class="m" x="720" y="280" font-size="20">SAME RULE</text><rect x="720" y="300" width="340" height="90" rx="14" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="745" y="352" font-size="20">WORKED ONCE</text><circle class="gain" cx="1015" cy="345" r="24"/><path d="M1004 346l8 8 14-16" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
