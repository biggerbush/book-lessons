<g id="eq"><g id="eqh"></g><text class="m" x="120" y="730" font-size="20">WEALTHY FAMILIES DIDN'T SHOW OFF</text></g>
<g id="buffer"><text class="d" x="120" y="820" font-size="44">This web protected them from modern stress.</text></g>
</g>

<g id="s7" opacity="0">
