<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Nobody wins</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">an argument.</text>
<text class="b" x="120" y="600" font-size="32">Why the only way to win an argument is avoiding it.</text>
