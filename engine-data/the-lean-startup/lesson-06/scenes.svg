<g id="third"><text class="d" x="120" y="840" font-size="44">Ries offers a third path between the extremes.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">What a pivot is.</text>
<text class="b" x="120" y="176" font-size="32">Keep one foot planted. Turn to find a new direction.</text>
