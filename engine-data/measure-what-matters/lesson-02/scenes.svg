<g id="s0">
<text class="m" x="120" y="150" font-size="28">MEASURE WHAT MATTERS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">What an OKR</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">actually is.</text>
<text class="b" x="120" y="600" font-size="32">One clear goal, a few numbers, and no room for doubt.</text>
<g id="tgt"></g>
<g id="arw" opacity="0"><path class="s-ink" d="M0 0l130-80" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M112-69l-4-30M112-69l30 2M124-76l-4-30M124-76l30 2" stroke-width="5" stroke-linecap="round"/></g>
<g id="prv"><text class="m" x="1270" y="650" font-size="24" text-anchor="middle" style="fill:var(--loss)">PROVE IT WITH A NUMBER?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A class at Intel, 1975.</text>
<text class="b" x="120" y="176" font-size="32">Andy Grove taught. A young John Doerr took notes.</text>
<g id="doe"><rect class="ink" x="220" y="600" width="260" height="14" rx="4"/><path class="s-ink" d="M240 614v120M460 614v120" stroke-width="6" stroke-linecap="round"/><rect id="nb1" class="ink" x="395" y="576" width="64" height="24" rx="3"/><text class="m" x="330" y="790" font-size="22" text-anchor="middle">JOHN DOERR</text></g>
<g id="grv"><rect class="s-ink" x="900" y="250" width="560" height="380" rx="10" fill="var(--stage)" stroke-width="6"/><g id="grvp"></g><path class="s-ink" d="M808 520L900 440" stroke-width="7" stroke-linecap="round"/><text class="m" x="760" y="650" font-size="22" text-anchor="middle">ANDY GROVE</text></g>
<g id="wb"><text class="m" x="940" y="320" font-size="24" style="fill:var(--gain)">OBJECTIVE</text><path class="s-ink" d="M940 360h420" stroke-width="7" stroke-linecap="round"/><text class="m" x="940" y="430" font-size="24">KEY RESULTS</text>
<circle class="gain" cx="950" cy="470" r="9"/><circle class="gain" cx="950" cy="518" r="9"/><circle class="gain" cx="950" cy="566" r="9"/><path class="s-line" d="M975 470h300M975 518h300M975 566h300" stroke-width="6" stroke-linecap="round"/></g>
<path id="arc1" class="s-gain" d="M900 610Q650 800 428 570" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="dec"><text class="m" x="650" y="800" font-size="22" text-anchor="middle" style="fill:var(--gain)">CARRIED FOR DECADES</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fixing an old idea.</text>
<text class="b" x="120" y="176" font-size="32">Management by objectives, from the thinker Peter Drucker.</text>
<g id="bk"><rect class="s-ink" x="120" y="300" width="210" height="270" rx="8" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="120" y="300" width="30" height="270"/><text class="d" x="240" y="452" font-size="48" text-anchor="middle">MBO</text><text class="m" x="225" y="620" font-size="20" text-anchor="middle">PETER DRUCKER</text><path class="s-muted" d="M360 440h80m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="gl"><path class="s-line" d="M480 560H1440" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M960 560V320" stroke-width="7" stroke-linecap="round"/><path id="fl2" class="ink" d="M960 320l110 34-110 34z"/><text class="m" x="960" y="602" font-size="24" text-anchor="middle">GOAL</text></g>
<g id="fog"></g>
<g id="qm2"><text class="d" x="1200" y="460" font-size="140" style="fill:var(--loss)">?</text></g>
<g id="tape"><rect id="tr" class="gain" x="480" y="630" width="0" height="60" rx="6"/></g>
<rect id="tcs" class="ink" x="440" y="615" width="70" height="90" rx="14"/>
<g id="tl"><text class="m" x="480" y="750" font-size="22" style="fill:var(--gain)">TIE EVERY GOAL TO RESULTS YOU CAN MEASURE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Half one: the objective.</text>
<g id="sub3"><text class="b" x="120" y="176" font-size="32">The what: the place you want to reach.</text></g>
<polygon class="s-ink" points="120,700 380,300 470,420 540,360 700,700" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<g id="flg"><path class="s-ink" d="M380 300V200" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M380 200l80 24-80 24z"/><text class="m" x="480" y="230" font-size="20">WHERE YOU WANT TO GO</text></g>
<g id="tags"></g>
<g id="bak"><text class="d" x="1010" y="284" font-size="36" text-anchor="middle">BAKERY</text><rect class="s-ink" x="820" y="360" width="380" height="300" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="800" y="300" width="420" height="60"/><g id="awn"></g>
<rect class="s-ink" x="870" y="420" width="150" height="120" fill="var(--stage)" stroke-width="5"/><ellipse class="gain" cx="912" cy="515" rx="26" ry="14"/><ellipse class="gain" cx="976" cy="515" rx="26" ry="14"/><rect class="ink" x="1060" y="500" width="90" height="160"/></g>
<g id="obj3"><text class="m" x="820" y="720" font-size="22" style="fill:var(--gain)">OBJECTIVE</text><text class="d5" x="820" y="770" font-size="36">Become the favorite breakfast</text><text class="d5" x="820" y="815" font-size="36">spot in town.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Half two: the key results.</text>
<g id="sub4"><text class="b" x="120" y="176" font-size="32">The how: measurable steps that show you are getting closer.</text></g>
<g id="lad"><path class="s-ink" d="M200 780V300M340 780V300" stroke-width="7" stroke-linecap="round"/><g id="rungs"></g><path class="s-ink" d="M270 300V230" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M270 230l60 20-60 20z"/><text class="m" x="270" y="830" font-size="20" text-anchor="middle">MEASURABLE STEPS</text></g>
<g id="chk"><rect class="s-ink" x="460" y="260" width="520" height="440" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="500" y="320" font-size="22">EACH KEY RESULT</text><g id="rows"></g></g>
<text class="m" x="1060" y="300" font-size="22">WHEN TIME IS UP</text>
<g id="yes1"><rect class="gain" x="1060" y="330" width="420" height="150" rx="18"/><text class="d" x="1090" y="420" font-size="44" style="fill:var(--on-gain)">Yes, we did it.</text></g>
<g id="no1"><rect class="s-loss" x="1060" y="520" width="420" height="150" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="1090" y="610" font-size="44" style="fill:var(--loss)">No, we did not.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">It needs a number.</text>
<g id="my"><g id="myp"></g><text class="m" x="120" y="520" font-size="20">MARISSA MAYER · GOOGLE</text>
<path class="s-ink" d="M404 350L330 395L404 400" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<rect class="s-ink" x="400" y="230" width="900" height="210" rx="24" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="440" y="320" font-size="44">“It’s not a key result unless</text><text class="d5" x="440" y="390" font-size="44">it has a <tspan style="fill:var(--gain)">number</tspan>.”</text></g>
<g id="few"></g>
<g id="fewl"><text class="m" x="120" y="800" font-size="22" style="fill:var(--gain)">OFTEN 3 TO 5 PER OBJECTIVE</text></g>
<g id="many"></g>
<g id="manyl"><text class="m" x="900" y="800" font-size="22" style="fill:var(--loss)">TOO MANY: THE GOAL LOSES SHAPE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Doerr’s formula.</text>
<text class="b" x="120" y="176" font-size="32">One handy sentence.</text>
<g id="fc"><rect class="s-ink" x="120" y="220" width="1360" height="260" rx="20" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="170" y="322" font-size="48">I will achieve</text><rect id="sl1" x="550" y="274" width="400" height="64" rx="32" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text id="st1" class="m" x="750" y="315" font-size="24" text-anchor="middle">THIS OBJECTIVE</text><text class="d5" x="962" y="322" font-size="48">,</text>
<text class="d5" x="170" y="432" font-size="48">as measured by</text><rect id="sl2" x="550" y="384" width="460" height="64" rx="32" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text id="st2" class="m" x="780" y="425" font-size="24" text-anchor="middle">THESE KEY RESULTS</text><text class="d5" x="1022" y="432" font-size="48">.</text></g>
<g id="ex"><text class="m" x="120" y="545" font-size="20">FOR EXAMPLE</text>
<text class="d5" x="120" y="590" font-size="34">I will <tspan style="fill:var(--gain)">delight our customers</tspan>,</text>
<text class="d5" x="120" y="638" font-size="34">as measured by raising our</text>
<text class="d5" x="120" y="686" font-size="34">satisfaction score from <tspan style="fill:var(--gain)">7 to 9</tspan></text>
<text class="d5" x="120" y="734" font-size="34">this quarter.</text></g>
<g id="gg"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write your own.</text>
<text class="b" x="120" y="176" font-size="32">Objective first, then the numbers.</text>
<g id="nb7"><rect class="s-ink" x="120" y="230" width="640" height="560" rx="14" fill="var(--stage)" stroke-width="5"/><g id="rng"></g>
<g id="ob7"><text class="m" x="170" y="310" font-size="22" style="fill:var(--gain)">OBJECTIVE</text><text class="d5" x="170" y="370" font-size="36">What truly matters</text><text class="m" x="170" y="450" font-size="22">KEY RESULTS</text></g>
<g id="krs"></g></g>
<g id="sk"><g id="skp"></g><text class="m" x="900" y="640" font-size="20" text-anchor="middle">A SKEPTIC</text><circle class="s-ink" cx="980" cy="300" r="44" fill="var(--stage)" stroke-width="5"/><text id="skq" class="d" x="980" y="320" font-size="56" text-anchor="middle" style="fill:var(--loss)">?</text><path id="skc" class="s-gain" d="M960 302l14 16 28-34" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pen7"><path class="gain" d="M0 0l8 30 96 96 22-22-96-96z"/><path class="ink" d="M0 0l8 30 22-22z"/></g>
<g id="fr"><rect class="s-ink" x="1100" y="240" width="360" height="500" rx="24" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1100 420h360" stroke-width="5"/><path class="s-ink" d="M1130 290v80M1130 460v120" stroke-width="8" stroke-linecap="round"/><text class="m" x="1280" y="790" font-size="22" text-anchor="middle">WHERE YOU’LL SEE IT OFTEN</text></g>
<g id="stk"><rect class="gain" x="1220" y="470" width="200" height="200" rx="6"/><text class="m" x="1240" y="515" font-size="20" style="fill:var(--on-gain)">OBJECTIVE</text><path d="M1240 550h150M1240 590h120M1240 630h140" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="84" letter-spacing="-2">One goal you care about.</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="84" letter-spacing="-2">Can you finish</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="84" letter-spacing="-2"><tspan style="fill:var(--gain)">“as measured by …”</tspan></text></g>
<g id="qd"><text class="d" x="136" y="660" font-size="84" letter-spacing="-2">with a real number?</text></g>
<g id="qg"><circle class="gain" cx="1300" cy="560" r="120"/><text class="d" x="1300" y="612" font-size="150" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="lbl8"><text class="m" x="143" y="780" font-size="26">OBJECTIVE · KEY RESULTS · A NUMBER</text></g>
</g>