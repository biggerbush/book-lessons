<g id="s0">
<text class="m" x="120" y="150" font-size="28">RANGE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Drop your tools,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">stay curious.</text>
<text class="b" x="120" y="600" font-size="32">Why letting go of favorite methods keeps you adaptable.</text>
<path class="s-line" d="M1080 660H1480" stroke-width="6" stroke-linecap="round"/>
<g id="xfl0"></g>
<g id="xff0"><g id="xffb"><g id="xffp"></g><path id="xffl" class="s-ink" fill="none" stroke-width="12" stroke-linecap="round"/><path class="gain" d="M1300 395a40 40 0 0 1 80 0h14v8h-108v-8z"/><path class="s-ink" d="M1380 510L1420 560" stroke-width="10" stroke-linecap="round"/><rect class="s-ink" x="1400" y="552" width="76" height="28" rx="4" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1408 580l6 10 6-10 6 10 6-10 6 10 6-10 6 10 6-10 6 10 6-10" fill="none" stroke-width="3"/></g></g>
