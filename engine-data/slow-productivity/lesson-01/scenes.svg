<g id="opt0"><rect class="s-ink" x="120" y="560" width="400" height="60" rx="30" fill="var(--stage)" stroke-width="4"/><text class="m" x="320" y="598" font-size="22" text-anchor="middle">HOURS WORKED?</text></g>
<g id="opt1"><rect class="s-ink" x="120" y="640" width="400" height="60" rx="30" fill="var(--stage)" stroke-width="4"/><text class="m" x="320" y="678" font-size="22" text-anchor="middle">TASKS FINISHED?</text></g>
