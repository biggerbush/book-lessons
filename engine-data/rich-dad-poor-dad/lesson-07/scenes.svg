<g id="eqr"><text class="d" x="850" y="390" font-size="80" text-anchor="middle" style="fill:var(--muted)">=</text><text class="d" x="920" y="384" font-size="64" style="fill:var(--loss)">Arrogance</text></g>
<g id="k0"><circle class="gain" cx="220" cy="610" r="56"/><text class="d" x="220" y="632" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">+</text><text class="m" x="300" y="600" font-size="22">WHAT YOU KNOW</text><text class="m" x="300" y="632" font-size="22" style="fill:var(--gain)">EARNS YOU MONEY</text></g>
<g id="k1"><circle class="loss" cx="820" cy="610" r="56"/><text class="d" x="820" y="630" font-size="64" text-anchor="middle" style="fill:var(--stage)">−</text><text class="m" x="900" y="600" font-size="22">WHAT YOU DON’T KNOW</text><text class="m" x="900" y="632" font-size="22" style="fill:var(--loss)">LOSES IT</text></g>
<g id="cb"><path class="gain" d="M180 770c-15-10-40-10-55-5v60c15-5 40-5 55 5 15-10 40-10 55-5v-60c-15-5-40-5-55 5z"/><path d="M180 770v60" stroke="var(--stage)" stroke-width="4"/><text class="d" x="270" y="815" font-size="40">Feel certain? Take a course or find an expert.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="120" y="290" font-size="56" letter-spacing="-1">This week, catch</text><text class="d" x="120" y="360" font-size="56" letter-spacing="-1">yourself saying</text></g>
<g id="qb"><text class="d" x="120" y="430" font-size="56" letter-spacing="-1" style="fill:var(--loss)">“I can’t afford it.”</text></g>
<g id="qc"><text class="d" x="120" y="530" font-size="56" letter-spacing="-1">Then ask:</text><text class="d" x="120" y="600" font-size="56" letter-spacing="-1" style="fill:var(--gain)">“How could I</text><text class="d" x="120" y="670" font-size="56" letter-spacing="-1" style="fill:var(--gain)">afford it?”</text></g>
<g id="q8l"><text class="m" x="123" y="770" font-size="24">TURN “CAN’T” INTO “HOW”</text></g>
