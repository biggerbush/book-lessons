<g id="today"><text class="d" x="120" y="830" font-size="46">The choice is yours to make today.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start small.</text>
<text class="b" x="120" y="176" font-size="32">One creative act you can repeat.</text>
<g id="st0">
