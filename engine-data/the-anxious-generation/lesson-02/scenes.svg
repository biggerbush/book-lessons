<g id="bub">
<circle class="s-ink" cx="1100" cy="460" r="180" fill="var(--ice)" fill-opacity=".35" stroke-width="5"/>
<path class="s-line" d="M990 390a130 130 0 0 1 60-70" fill="none" stroke-width="6" stroke-linecap="round"/>
<circle class="s-loss" cx="1100" cy="460" r="110" fill="none" stroke-width="3" stroke-dasharray="6 10"/>
<g id="kidB"></g>
<text class="m" x="1100" y="730" font-size="20" text-anchor="middle">PERFECTLY CLEAN BUBBLE · STAYS WEAK</text>
</g>
<g id="mind"><text class="d" x="120" y="820" font-size="44">The mind works the same way with fear and conflict.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Free play: kids are in charge.</text>
<text class="b" x="120" y="176" font-size="32">Play that kids choose and run themselves.</text>
