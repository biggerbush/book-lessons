<g id="s0">
<text class="m" x="120" y="150" font-size="28">QUIET · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The surprising strength</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of soft power.</text>
<text class="b" x="120" y="600" font-size="32">How calm conviction and quiet persistence can move the world.</text>
<rect class="ink" x="1290" y="360" width="28" height="200" rx="10"/>
<rect class="ink" x="1290" y="530" width="180" height="28" rx="10"/>
<path class="s-ink" d="M1310 558v90M1450 558v90" stroke-width="8" stroke-linecap="round"/>
<g id="rider"></g>
<g id="no0"><rect class="gain" x="1300" y="230" width="170" height="90" rx="20"/><path class="gain" d="M1350 318l10 32 22-32z"/><text class="d" x="1385" y="292" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">No.</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A seat in Montgomery.</text>
<g id="when"><text class="b" x="120" y="176" font-size="32">December 1955 · Montgomery, Alabama.</text></g>
<g id="bus">
<rect x="220" y="300" width="1160" height="320" rx="36" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path class="s-line" d="M230 560h1140" stroke-width="5"/>
<g id="win"></g>
<g id="rosaG"></g>
<g id="rlab"><text class="m" x="822" y="520" font-size="20" text-anchor="middle" style="fill:var(--gain)">ROSA PARKS</text></g>
<circle class="ink" cx="420" cy="620" r="46"/><circle cx="420" cy="620" r="16" fill="var(--stage)"/>
<circle class="ink" cx="1180" cy="620" r="46"/><circle cx="1180" cy="620" r="16" fill="var(--stage)"/>
</g>
<g id="drv"><rect x="1000" y="200" width="380" height="70" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M1270 270l12 30 14-30" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="1190" y="246" font-size="30" text-anchor="middle" style="fill:var(--loss)">Move, or be arrested.</text></g>
<g id="stay"><text class="d" x="120" y="770" font-size="48">She stays seated, calmly.</text></g>
<g id="arr"><g transform="rotate(-6 1260 745)"><rect x="1100" y="700" width="320" height="90" rx="10" fill="none" stroke="var(--loss)" stroke-width="6"/><text class="d" x="1260" y="763" font-size="48" text-anchor="middle" style="fill:var(--loss)">ARRESTED</text></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not a loud hero.</text>
<g id="sub2"><text class="b" x="120" y="176" font-size="32">Cain opens her book with this moment for a reason.</text></g>
<g id="por"><rect id="frame" x="240" y="250" width="360" height="410" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="5"/><g id="pp"></g><text class="m" x="420" y="630" font-size="20" text-anchor="middle">ROSA PARKS</text></g>
<g id="loud"><path class="s-ink" d="M710 300h30l80-40v120l-80-40h-30z" fill="none" stroke-width="6" stroke-linejoin="round"/><path class="s-loss" d="M700 385L845 255" stroke-width="8" stroke-linecap="round"/><text class="m" x="880" y="312" font-size="22">NOT A FIERY SPEAKER</text><text class="m" x="880" y="348" font-size="22">OR A CROWD-PLEASER</text></g>
<g id="chips2"></g>
<g id="tired"><text class="m" x="700" y="560" font-size="20">SHE LATER SAID</text><text class="d5" x="700" y="616" font-size="40">“Simply tired of giving in.”</text></g>
<g id="cour"><text class="d" x="120" y="790" font-size="52">A quiet refusal. Enormous courage.</text><rect class="gain" x="124" y="816" width="160" height="10"/></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Calm sparks change.</text>
<g id="rings"></g>
<g id="parks3"><text class="m" x="400" y="650" font-size="22" text-anchor="middle">QUIET ACT · ROSA PARKS</text></g>
<g id="boy"><text class="m" x="400" y="690" font-size="22" text-anchor="middle" style="fill:var(--gain)">MONTGOMERY BUS BOYCOTT</text></g>
<g id="kg"><g id="kw"></g><text class="m" x="1200" y="650" font-size="22" text-anchor="middle">BOOMING VOICE</text><text class="m" x="1200" y="690" font-size="22" text-anchor="middle">MARTIN LUTHER KING JR.</text></g>
<g id="both"><circle class="gain" cx="800" cy="440" r="46"/><text class="d" x="800" y="460" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">+</text><text class="m" x="800" y="530" font-size="22" text-anchor="middle">IT TOOK BOTH</text></g>
<g id="each"><text class="d" x="120" y="800" font-size="46">Each style did what the other could not.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Soft power.</text>
<g id="sub4"><text class="b" x="120" y="176" font-size="32">Steady conviction, not volume.</text></g>
<g id="mag"><path class="s-ink" d="M520 330h-120a100 100 0 0 0 0 200h120" fill="none" stroke-width="50"/><rect class="gain" x="500" y="305" width="40" height="50"/><rect class="gain" x="500" y="505" width="40" height="50"/></g>
<g id="dots4"></g>
<g id="steps4"></g>
<g id="tide"><circle id="drop" cx="360" r="12" fill="var(--ice)" stroke="var(--ink)" stroke-width="3"/><rect class="ink" x="160" y="720" width="400" height="120" rx="40"/><ellipse id="groove" cx="360" cy="722" fill="var(--stage)"/><text class="m" x="660" y="740" font-size="22">LIKE WATER ON STONE</text><text class="d" x="660" y="806" font-size="52">Slowly, but surely.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shyness as a shield.</text>
<g id="sub5"><text class="b" x="120" y="176" font-size="32">Gandhi saw himself as painfully shy.</text></g>
<g id="gd"><text class="m" x="330" y="545" font-size="20" text-anchor="middle">GANDHI</text></g>
<g id="shd"><path d="M420 340h170v90q0 110-85 150q-85-40-85-150z" fill="var(--gain)" fill-opacity=".3" stroke="var(--gain)" stroke-width="7" stroke-linejoin="round"/><text class="m" x="440" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">SHYNESS AS A SHIELD</text></g>
<g id="tiles"></g>
<g id="fw"><text class="m" x="720" y="600" font-size="20">FEW WORDS, EACH CHOSEN WITH CARE</text></g>
<g id="wt"><text class="d" x="720" y="700" font-size="46">Careful words carry weight.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why quiet persuades.</text>
<g id="k0"><g id="lis"></g></g>
<g id="k1"><circle cx="600" cy="330" r="50" fill="none" stroke="var(--ink)" stroke-width="6"/><circle cx="660" cy="330" r="50" fill="none" stroke="var(--gain)" stroke-width="6"/><rect x="510" y="440" width="230" height="44" rx="22" fill="none" stroke="var(--ink)" stroke-width="4"/><rect id="tm" class="gain" x="510" y="440" height="44" rx="22"/></g>
<g id="k2"><circle cx="975" cy="400" r="90" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><line id="hand" x1="975" y1="400" x2="975" y2="335" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="975" cy="400" r="9"/></g>
<g id="k3"><rect class="ink" x="1230" y="500" width="190" height="70" rx="8"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your quiet toolkit.</text>
<g id="sub7"><text class="b" x="120" y="176" font-size="32">You do not need a megaphone to make a difference.</text><path class="s-ink" d="M1330 150h24l64-32v96l-64-32h-24z" fill="none" stroke-width="6" stroke-linejoin="round"/><path class="s-loss" d="M1320 214L1440 118" stroke-width="7" stroke-linecap="round"/></g>
<g id="t0"><circle cx="327" cy="420" r="100" fill="none" stroke="var(--ink)" stroke-width="6"/><circle cx="327" cy="420" r="66" fill="none" stroke="var(--gain)" stroke-width="6"/><circle class="gain" cx="327" cy="420" r="30"/></g>
<g id="t1"><rect x="690" y="340" width="220" height="150" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-line" d="M715 380h170M715 415h170M715 450h110" stroke-width="7" stroke-linecap="round"/></g>
<g id="t2"><g id="dots7"></g></g>
<g id="cons"><text class="d" x="120" y="770" font-size="52">Let your consistency do the talking.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where in your life could</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">a calm, firm <tspan style="fill:var(--gain)">no</tspan> do more</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">than a loud argument?</text></g>
<g id="tw"><text class="m" x="143" y="700" font-size="26">THIS WEEK, TRY SAYING IT</text></g>
<g id="no8"><rect class="gain" x="1270" y="620" width="190" height="100" rx="24"/><path class="gain" d="M1310 718l8 34 26-34z"/><text class="d" x="1365" y="690" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">No.</text></g>
</g>