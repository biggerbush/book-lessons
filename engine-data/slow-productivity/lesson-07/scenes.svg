<g id="alb"><circle class="gain" cx="1430" cy="280" r="34"/><circle cx="1430" cy="280" r="8" fill="var(--stage)"/><text class="m" x="1080" y="330" font-size="20" style="fill:var(--gain)">MASSIVE SUCCESS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Quality needs room.</text>
<text class="b" x="120" y="176" font-size="32">Excellence can’t happen while juggling twenty commitments.</text>
<g id="ov"><rect class="s-line" x="120" y="230" width="640" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><g id="jug"></g><g id="balls"></g><text class="m" x="120" y="760" font-size="20" style="fill:var(--loss)">TWENTY COMMITMENTS, FRANTIC SPEED</text></g>
<g id="wb"><rect class="s-line" x="840" y="230" width="640" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="ink" x="1060" y="580" width="360" height="18" rx="4"/><path class="s-ink" d="M1090 598v100M1390 598v100" stroke-width="8" stroke-linecap="round"/><g id="wbx"></g><g id="nos"></g><text class="m" x="840" y="760" font-size="20" style="fill:var(--gain)">ONE PROJECT, THE TIME IT DESERVES</text></g>
<g id="fcap"><text class="d" x="120" y="840" font-size="40">So quality pulls you to fewer things and a gentler pace.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Quality buys freedom.</text>
<text class="b" x="120" y="176" font-size="32">Valued work gives you leverage.</text>
<path class="s-line" d="M380 620h360" stroke-width="5" stroke-linecap="round"/>
<polygon class="ink" points="560,540 505,620 615,620"/>
<line id="beam" class="s-ink" x1="200" y1="540" x2="920" y2="540" stroke-width="12" stroke-linecap="round"/>
<g id="lgem"></g><g id="rcard"></g>
<g id="mgr"></g>
<g id="bub"><rect class="s-ink" x="1090" y="220" width="160" height="76" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1250 252l40 14-40 8" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1170" y="272" font-size="40" text-anchor="middle">Yes.</text></g>
<g id="bsy"><g id="bsyp"></g><rect class="loss" x="230" y="755" width="130" height="46" rx="23"/><text class="d" x="295" y="787" font-size="26" text-anchor="middle" style="fill:var(--stage)">BUSY</text><text class="d5" x="400" y="792" font-size="40">Anyone can look busy. That earns no respect.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sharpen your taste.</text>
<text class="b" x="120" y="176" font-size="32">Ira Glass: the frustrating gap between your taste and your skill.</text>
<g id="ch6"><path class="s-muted" d="M160 250V760H1100" fill="none" stroke-width="4"/>
