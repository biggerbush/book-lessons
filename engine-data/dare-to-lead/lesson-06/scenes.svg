<path class="loss" d="M240 580L300 330H500L560 580Z"/>
<text class="d" x="400" y="480" font-size="64" text-anchor="middle" style="fill:var(--stage)">TRUST</text>
</g><text class="m" x="400" y="626" font-size="20" text-anchor="middle">ONE HEAVY WORD</text></g>
<g id="pcs"></g>
<g id="pcl"><text class="m" x="400" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">SMALLER PIECES YOU CAN DISCUSS</text></g>
<g id="s1f"></g>
