<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Three Paths</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to Meaning.</text>
<text class="b" x="120" y="600" font-size="32">Work, love, and courage in suffering can all give life meaning.</text>
<g id="door0">
<rect id="glow" class="gain" x="1240" y="240" width="120" height="200"/>
<rect id="leaf" x="1240" y="240" width="120" height="200" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<rect class="s-ink" x="1240" y="240" width="120" height="200" fill="none" stroke-width="8" stroke-linejoin="round"/>
</g>
<path id="tp0" class="s-ink" d="M1300 446Q1200 480 1140 540" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="tp1" class="s-ink" d="M1300 446V540" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="tp2" class="s-gain" d="M1300 446Q1400 480 1460 540" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A map with three roads.</text>
<text class="b" x="120" y="176" font-size="32">Frankl’s logotherapy points to three roads to meaning.</text>
<g id="faint"></g>
<g id="roads"></g>
<g id="start"><circle class="gain" cx="240" cy="520" r="44"/><text class="m" x="240" y="528" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
<g id="rlab"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Path one: create.</text>
<text class="b" x="120" y="176" font-size="32">Your work and your deeds.</text>
<g id="bench">
<rect class="ink" x="200" y="640" width="640" height="20" rx="4"/>
<path class="s-ink" d="M240 660v120M800 660v120M236 636l50-50" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M266 566l40 40" stroke-width="18" stroke-linecap="round"/>
<text class="m" x="200" y="830" font-size="22">BUILD · WRITE · TEACH · HELP</text>
</g>
<g id="blocks"></g>
<g id="only"><text class="m" x="600" y="448" font-size="20" style="fill:var(--gain)">ONLY YOU</text></g>
<g id="cA"><text class="d5" x="960" y="380" font-size="52" style="fill:var(--muted)">Not a feeling</text><text class="d5" x="960" y="444" font-size="52" style="fill:var(--muted)">you wait for.</text></g>
<g id="cB"><text class="d" x="960" y="580" font-size="64" style="fill:var(--gain)">Something</text><text class="d" x="960" y="650" font-size="64" style="fill:var(--gain)">you make.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Path two: experience.</text>
<text class="b" x="120" y="176" font-size="32">It can open even when you can do almost nothing.</text>
<path class="s-line" d="M120 700H1480" stroke-width="4" stroke-linecap="round"/>
<g id="hut">
<path class="s-ink" d="M140 470L350 360L560 470Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="loss" x="160" y="470" width="380" height="230" fill-opacity=".15" stroke="var(--ink)" stroke-width="6"/>
<rect x="320" y="590" width="60" height="110" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
</g>
<g id="sun"><path id="ring" class="s-gain" d="M1170 700A140 140 0 0 1 1450 700" fill="none" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/><path class="gain" d="M1200 700a110 110 0 0 1 220 0z"/></g>
<g id="clouds"><rect class="gain" x="1000" y="420" width="220" height="34" rx="17" fill-opacity=".45"/><rect class="gain" x="1250" y="370" width="200" height="34" rx="17" fill-opacity=".45"/><rect class="gain" x="1180" y="480" width="180" height="34" rx="17" fill-opacity=".45"/></g>
<g id="prisM"><g id="pris"></g><g id="rush"></g></g>
<g id="beau"><text class="d" x="120" y="810" font-size="46">“How beautiful the world could be.”</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">Love sees who they could become.</text>
<text class="b" x="120" y="176" font-size="32">Loving another person belongs on this road too.</text>
<path class="s-line" d="M120 640H1480" stroke-width="4" stroke-linecap="round"/>
<g id="lv"><text class="m" x="260" y="690" font-size="20" text-anchor="middle">THE LOVER</text></g>
<g id="bl"><text class="m" x="640" y="690" font-size="20" text-anchor="middle">TRUE ESSENCE</text></g>
<g id="gz"><path class="s-gain" d="M310 472H590" stroke-width="5" stroke-dasharray="8 10" stroke-linecap="round"/></g>
<g id="pt">
<path class="s-gain" d="M700 430Q800 360 916 400M894 384l22 16-26 8" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1000" y="690" font-size="20" text-anchor="middle">WHO THEY COULD BECOME</text>
</g>
<path id="stem" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="leaves"><path class="gain" d="M1340 540q-60-10-70-60q60 0 70 60z"/><path class="gain" d="M1340 520q60-10 70-60q-60 0-70 60z"/></g>
<g id="grow"><text class="d" x="120" y="800" font-size="44">By seeing it, the lover helps it grow.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Path three: attitude.</text>
<text class="b" x="120" y="176" font-size="32">When the first two roads are blocked, one road remains.</text>
<path class="s-line" d="M160 300H1440M160 470H1440" stroke-width="8" stroke-linecap="round"/>
<path id="ln2" class="s-line" d="M160 640H1440" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1480" y="276" font-size="22" text-anchor="end">CREATE</text>
<text class="m" x="1480" y="446" font-size="22" text-anchor="end">EXPERIENCE</text>
<text class="m" x="1480" y="616" font-size="22" text-anchor="end">ATTITUDE</text>
<g id="gates"></g>
<g id="wkM"><g id="wk"></g></g>
<g id="qt"><text class="d" x="120" y="770" font-size="44">“Suffering ceases to be suffering</text><text class="d" x="120" y="826" font-size="44">at the moment it finds a <tspan style="fill:var(--gain)">meaning</tspan>.”</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The grieving doctor.</text>
<text class="b" x="120" y="176" font-size="32">Two years after his wife died, he was still crushed by grief.</text>
<g id="dc"><g id="dfig"></g><path class="s-ink" d="M450 600L470 720" stroke-width="6" stroke-linecap="round"/></g>
<g id="grief"><rect class="loss" x="300" y="410" width="130" height="34" rx="17"/><circle class="loss" cx="320" cy="410" r="34"/><circle class="loss" cx="372" cy="396" r="44"/><circle class="loss" cx="420" cy="414" r="30"/><path class="s-loss" d="M330 460v16M372 462v16M414 460v16" stroke-width="4" stroke-linecap="round"/></g>
<g id="ch"><path id="chairP" class="s-ink" d="M590 470V720M590 600H710V720" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="q1"><text class="m" x="850" y="236" font-size="20">FRANKL</text><rect class="s-ink" x="820" y="250" width="660" height="120" rx="20" fill="var(--stage)" stroke-width="4"/><text class="d5" x="850" y="324" font-size="36">What if you had died first?</text></g>
<g id="q2"><text class="m" x="850" y="406" font-size="20">THE DOCTOR</text><rect class="s-ink" x="820" y="420" width="660" height="120" rx="20" fill="var(--stage)" stroke-width="4"/><text class="d5" x="850" y="492" font-size="32">“She would have suffered terribly.”</text></g>
<g id="sh"><path class="gain" d="M900 600l50 18v40c0 40-25 60-50 72c-25-12-50-32-50-72v-40z"/><text class="d" x="980" y="650" font-size="36">He spared her that pain.</text><text class="m" x="980" y="692" font-size="20">NOW HE PAYS FOR IT BY GRIEVING</text></g>
<g id="cm"><text class="d" x="120" y="820" font-size="36">He shook Frankl’s hand and left calmly.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Suffering is not required.</text>
<text class="b" x="120" y="176" font-size="32">Meaning does not depend on pain.</text>
<g id="ws"><path class="s-ink" d="M290 290L450 540H130Z" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/><text id="bang" class="d" x="290" y="512" font-size="130" text-anchor="middle" style="fill:var(--loss)">!</text></g>
<g id="r1"><rect class="s-ink" x="560" y="300" width="400" height="110" rx="16" fill="var(--stage)" stroke-width="4"/><text class="m" x="760" y="364" font-size="24" text-anchor="middle">PAIN CAN BE REMOVED</text><path class="s-muted" d="M980 355h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="1080" y="374" font-size="52">Remove it.</text></g>
<g id="r2"><rect class="s-ink" x="560" y="480" width="400" height="110" rx="16" fill="var(--stage)" stroke-width="4"/><text class="m" x="760" y="544" font-size="24" text-anchor="middle">UNAVOIDABLE PAIN</text><path class="s-muted" d="M980 535h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1080" y="480" width="400" height="110" rx="55"/><text class="d" x="1280" y="550" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">The third road</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">Which road</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">will you walk <tspan style="fill:var(--gain)">first</tspan>?</text></g>
<g id="ml"><text class="m" x="143" y="680" font-size="22">NAME ONE THING TO CREATE, ONE PERSON TO LOVE, ONE BURDEN TO CARRY WELL</text></g>
<g id="nb">
<rect class="s-ink" x="1200" y="230" width="260" height="320" rx="14" fill="var(--stage)" stroke-width="6"/>
<g id="rings"></g>
<path class="s-ink" d="M1230 296h36v36h-36zM1230 386h36v36h-36zM1230 476h36v36h-36z" fill="none" stroke-width="4" stroke-linejoin="round"/>
<text class="m" x="1290" y="324" font-size="22">CREATE</text><text class="m" x="1290" y="414" font-size="22">LOVE</text><text class="m" x="1290" y="504" font-size="22">CARRY</text>
<path id="ck0" class="s-gain" d="M1236 314l10 10 22-24" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ck1" class="s-gain" d="M1236 404l10 10 22-24" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ck2" class="s-gain" d="M1236 494l10 10 22-24" pathLength="1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>