<text class="d" x="260" y="450" font-size="90" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="d" x="540" y="450" font-size="90" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="d" x="400" y="435" font-size="36" text-anchor="middle" style="fill:var(--muted)">VS</text>
<text class="m" x="120" y="600" font-size="22">A MATCH TO WIN</text>
</g>
