<text class="m" x="1325" y="590" font-size="20" text-anchor="middle" style="fill:var(--gain)">PROUD AND RESPECTED</text>
</g>
<g id="door"><text class="d" x="120" y="740" font-size="48">The drill is just the doorway to a feeling.</text><rect class="gain" x="124" y="766" width="140" height="10"/></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Marketing is a generous act.</text>
<text class="b" x="120" y="176" font-size="32">Solve their problem, not yours.</text>
<g id="give">
