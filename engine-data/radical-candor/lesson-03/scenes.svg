<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Four ways bosses</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">get it wrong.</text>
<text class="b" x="120" y="600" font-size="32">Why staying nice is the most common way bosses fail.</text>
<g id="t_guy"></g>
<g id="t_alert"><circle class="gain" cx="1410" cy="240" r="36"/><text class="d" x="1410" y="256" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">!</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two lines, four boxes.</text>
<text class="b" x="120" y="176" font-size="32">Caring personally, and challenging directly.</text>
<g id="g_ax"><path class="s-ink" d="M320 790V215M306 234l14-19 14 19M320 790h615M916 776l19 14-19 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="290" y="505" font-size="20" text-anchor="middle" transform="rotate(-90 290 505)">CARE PERSONALLY</text>
<text class="m" x="625" y="836" font-size="20" text-anchor="middle">CHALLENGE DIRECTLY</text></g>
<g id="g_box"></g>
<g id="g_tr"><text class="m" x="1000" y="320" font-size="22">BOTH HIGH</text><text class="d" x="1000" y="390" font-size="52" style="fill:var(--gain)">Radical Candor.</text></g>
<g id="g_three"><text class="m" x="1000" y="540" font-size="22">THE OTHER THREE</text><text class="d5" x="1000" y="600" font-size="40">Where feedback</text><text class="d5" x="1000" y="650" font-size="40" style="fill:var(--loss)">goes wrong.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The loud mocker.</text>
<text class="b" x="120" y="176" font-size="32">You point at the zipper and laugh in front of everyone.</text>
<g id="m2"></g>
<g id="a_col"></g>
<g id="a_boss"><g id="a_bossf"></g><path class="s-ink" d="M548 410L378 498" stroke-width="12" stroke-linecap="round"/>
<rect x="650" y="200" width="210" height="76" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M690 276l-24 30 46-30" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<text class="d" x="755" y="252" font-size="40" text-anchor="middle" style="fill:var(--loss)">HA HA!</text></g>
<g id="a_crowd"></g>
<g id="a_jerk">
<g id="a_l"><polygon points="1000,320 1120,320 1104,400 1132,470 1100,540 1116,620 1000,620" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path class="s-line" d="M1024 370h70M1024 420h76M1024 470h70M1024 520h60" stroke-width="6" stroke-linecap="round"/></g>
<g id="a_r"><polygon points="1130,320 1250,320 1250,620 1126,620 1110,540 1142,470 1114,400" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path class="s-line" d="M1150 370h76M1162 420h64M1166 470h60" stroke-width="6" stroke-linecap="round"/></g>
<text class="d5" x="940" y="700" font-size="40">“I’m just being honest.”</text>
<text class="m" x="940" y="748" font-size="20">THE BOSS WHO TEARS YOUR WORK APART</text></g>
<g id="a_def"><text class="d" x="120" y="820" font-size="44"><tspan style="fill:var(--loss)">Obnoxious Aggression:</tspan> challenge, no care.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The whisperer.</text>
<text class="b" x="120" y="176" font-size="32">You say nothing to them, but snicker about it later.</text>
<g id="m3"></g>
<g id="w_col"></g>
<g id="w_wh"><g id="w_f"></g><rect x="470" y="250" width="230" height="70" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-dasharray="10 8"/><text class="d5" x="585" y="297" font-size="34" text-anchor="middle" style="fill:var(--loss)">hehe…</text></g>
<g id="w_bs">
<rect x="900" y="280" width="580" height="110" rx="16" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text class="m" x="930" y="318" font-size="20">TO YOUR FACE</text><text class="d5" x="930" y="368" font-size="38" style="fill:var(--gain)">“Great work!”</text>
<rect x="900" y="410" width="580" height="110" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="930" y="448" font-size="20">BEHIND YOUR BACK</text><text class="d5" x="930" y="498" font-size="38" style="fill:var(--loss)">“What a mess.”</text></g>
<g id="w_why"><text class="m" x="900" y="580" font-size="20">WHY PEOPLE SLIDE HERE</text></g>
<g id="w_def"><text class="d" x="120" y="820" font-size="40"><tspan style="fill:var(--loss)">Manipulative Insincerity:</tspan> no care, no challenge.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The silent friend.</text>
<text class="b" x="120" y="176" font-size="32">You say nothing, to spare them the awkward moment.</text>
<g id="m4"></g>
<g id="r_stage"><polygon class="gain" fill-opacity=".25" points="1150,250 1190,250 1330,640 1010,640"/><rect class="ink" x="860" y="640" width="620" height="36" rx="6"/></g>
<g id="r_fr"><g id="r_ff"></g><rect x="190" y="286" width="100" height="56" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d" x="240" y="324" font-size="34" text-anchor="middle">…</text>
<path class="gain" d="M345 420c-30-20-34-46-16-52 8-3 14 2 16 8 2-6 8-11 16-8 18 6 14 32-16 52z"/></g>
<g id="r_cw"><g id="r_col"></g></g>
<g id="r_def"><text class="d" x="120" y="750" font-size="40"><tspan style="fill:var(--loss)">Ruinous Empathy:</tspan> caring, but not challenging.</text></g>
<g id="r_top"><text class="d" x="120" y="830" font-size="44">The most common mistake, by far.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The story of Bob.</text>
<text class="b" x="120" y="176" font-size="32">Scott learned this the hard way.</text>
<g id="b_kb"><g id="b_f"></g><text class="m" x="220" y="520" font-size="20" text-anchor="middle">KIM</text><text class="m" x="420" y="520" font-size="20" text-anchor="middle">BOB</text></g>
<g id="b_tr">
<rect class="gain" x="140" y="560" width="190" height="50" rx="25"/><text class="m" x="235" y="592" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">CHARMING</text>
<rect class="gain" x="350" y="560" width="190" height="50" rx="25"/><text class="m" x="445" y="592" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">LIKEABLE</text>
<rect x="560" y="300" width="140" height="180" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-line" d="M584 330h92M584 355h92M584 380h60" stroke-width="6" stroke-linecap="round"/>
<path class="s-loss" d="M600 410l60 50M660 410l-60 50" stroke-width="8" stroke-linecap="round"/><text class="m" x="630" y="520" font-size="20" text-anchor="middle">HIS WORK</text></g>
<g id="b_pat"><rect x="140" y="204" width="380" height="64" rx="16" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text class="d5" x="330" y="247" font-size="30" text-anchor="middle">“You’ll get there!”</text><path id="b_arm" class="s-ink" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<g id="b_team"><g id="b_tf"></g><text class="m" x="800" y="540" font-size="20">THE TEAM COVERS FOR HIM</text></g>
<g id="b_exit"><g id="b_bob2"></g><polygon id="b_door" class="ink"/><rect class="s-ink" x="1240" y="240" width="170" height="270" fill="none" stroke-width="6"/>
<text class="d" x="120" y="720" font-size="52">“Why did you never tell me?”</text><text class="m" x="120" y="776" font-size="20">BOB, ON HIS WAY OUT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Moments, not people.</text>
<text class="b" x="120" y="176" font-size="32">The boxes describe behavior, not types of people.</text>
<g id="n_ppl"></g>
<g id="n_lab"><text class="m" x="120" y="590" font-size="22">LABEL THE BEHAVIOR, NOT THE PERSON</text></g>
<g id="n_grid"></g>
<path id="n_arr" class="s-gain" d="M1030 620L1218 432M1182 432h36v36" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="n_tw"><g id="n_tok"><circle class="gain" r="36"/><text class="m" y="8" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g></g>
<g id="n_m"><text class="d5" x="120" y="660" font-size="34">Everyone lands in each box sometimes,</text><text class="d5" x="120" y="705" font-size="34">even Scott herself.</text></g>
<g id="n_a"><text class="d" x="120" y="800" font-size="40" style="fill:var(--gain)">Notice your box. Move up and right.</text></g>
</g>

<g id="s7" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What feedback are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">holding back to stay nice?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Say it kindly and clearly.</text>
<text class="m" x="143" y="700" font-size="26">THIS WEEK, BEFORE IT COSTS SOMEONE MORE</text></g>
<g id="q_bub"><rect class="gain" x="1260" y="640" width="220" height="120" rx="24"/><path class="gain" d="M1300 756l-20 44 56-44z"/><g id="q_dots"></g></g>
</g>