<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Aim for no,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">then “that’s right.”</text>
<text class="b" x="120" y="600" font-size="32">Why a safe no beats a forced yes every time.</text>
<g id="aim0"><circle class="s-line" cx="1290" cy="400" r="170" fill="none" stroke-width="5" stroke-dasharray="18 14"/><path class="s-muted" d="M1290 210v40M1290 550v40M1100 400h40M1440 400h40" stroke-width="6" stroke-linecap="round"/></g>
<g id="nob0"><rect class="s-ink" x="1170" y="320" width="240" height="150" rx="28" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1215 470l-15 46 50-46" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><text class="d" x="1290" y="430" font-size="100" text-anchor="middle" style="fill:var(--gain)">No.</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The trouble with yes.</text>
<text class="b" x="120" y="176" font-size="32">A yes squeezed out under pressure is often counterfeit.</text>
<path class="s-line" d="M200 600H1440" stroke-width="4"/>
<g id="sales1"><g id="fsal1"></g><rect class="s-ink" x="230" y="240" width="300" height="90" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M330 328L360 368L385 328" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="380" y="302" font-size="44" text-anchor="middle">Say yes!</text></g>
<g id="push1"></g>
<g id="you1"><g id="fyou1"></g><text class="m" x="1000" y="656" font-size="26" text-anchor="middle">YOU</text></g>
<g id="arms1"><path d="M935 520L1065 575M1065 520L935 575" stroke="var(--loss)" stroke-width="16" stroke-linecap="round"/></g>
<g id="fake1"><rect class="s-ink" x="1120" y="260" width="280" height="110" rx="22" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1140 368L1080 400L1175 368" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="1260" y="335" font-size="56" text-anchor="middle">Yes…</text></g>
<g id="stamp1"><g transform="rotate(-8 1270 465)"><rect x="1110" y="430" width="320" height="70" rx="8" fill="none" stroke="var(--loss)" stroke-width="5"/><text class="m" x="1270" y="476" font-size="28" text-anchor="middle" style="fill:var(--loss)">COUNTERFEIT</text></g></g>
<g id="stop1"><text class="d" x="120" y="790" font-size="46">Just a way to make the pressure stop.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why no feels safe.</text>
<text class="b" x="120" y="176" font-size="32">No feels like a shield, not a wall.</text>
<g id="shield2"><g id="pers2"></g><path class="gain" d="M330 410Q380 390 430 410V500Q430 570 380 600Q330 570 330 500Z"/><text class="m" x="380" y="512" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">NO</text><text class="m" x="320" y="700" font-size="22" text-anchor="middle">PROTECTED</text></g>
<g id="wheel2"><g id="wh2"><circle class="s-ink" cx="800" cy="480" r="110" fill="none" stroke-width="14"/><path class="s-ink" d="M800 480V590M800 480L705 425M800 480L895 425" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="800" cy="480" r="24"/></g><text class="m" x="800" y="700" font-size="22" text-anchor="middle">IN CONTROL</text></g>
<g id="door2g"><rect class="gain" x="1160" y="360" width="200" height="280"/><g id="leaf2"><rect class="s-ink" x="1160" y="360" width="200" height="280" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1330" cy="500" r="10"/></g><rect class="s-ink" x="1160" y="360" width="200" height="280" fill="none" stroke-width="8"/><text class="m" x="1260" y="700" font-size="22" text-anchor="middle">REAL TALK BEGINS</text></g>
<g id="start2"><text class="d" x="120" y="800" font-size="44">No is a starting point, not a dead end.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask for a no.</text>
<text class="b" x="120" y="176" font-size="32">Shape the question so the easy answer is no.</text>
<g id="hd3"><text class="m" x="150" y="252" font-size="22">INSTEAD OF</text><text class="m" x="870" y="252" font-size="22" style="fill:var(--gain)">ASK</text></g>
<g id="cards3"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The ghosting email.</text>
<text class="b" x="120" y="176" font-size="32">When someone simply stops replying.</text>
<g id="silent4"><rect class="s-ink" x="180" y="250" width="240" height="420" rx="32" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M270 280h60" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="260" y="320" width="130" height="46" rx="18"/><rect class="ink" x="260" y="390" width="130" height="46" rx="18"/><rect class="ink" x="260" y="460" width="130" height="46" rx="18"/><rect x="210" y="540" width="140" height="50" rx="18" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="10 8"/><g id="dots4"></g><text class="m" x="300" y="710" font-size="22" text-anchor="middle">NO REPLY</text></g>
<g id="email4"><g id="em4"><rect class="s-ink" x="520" y="300" width="580" height="300" rx="18" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="523" y="303" width="574" height="60" rx="15"/><text class="m" x="560" y="342" font-size="22" style="fill:var(--stage)">ONE-LINE EMAIL</text><text class="d" x="560" y="450" font-size="44">Have you given up</text><text class="d" x="560" y="510" font-size="44">on this project?</text></g></g>
<path id="arr4" d="M1100 520C1180 600 1320 580 1320 470" fill="none" stroke="var(--gain)" stroke-width="6" stroke-linecap="round" stroke-dasharray="500"/>
<path id="arrh4" d="M1300 485L1320 455L1340 485" fill="none" stroke="var(--gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="rep4"><rect class="gain" x="1160" y="290" width="320" height="150" rx="24"/><text class="d5" x="1185" y="352" font-size="32" style="fill:var(--on-gain)">No! Here’s where</text><text class="d5" x="1185" y="400" font-size="32" style="fill:var(--on-gain)">things stand…</text></g>
<g id="quick4"><text class="d" x="120" y="820" font-size="44">A quick no gets them talking again.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen for “that’s right.”</text>
<text class="b" x="120" y="176" font-size="32">Summarize their view so well they feel completely understood.</text>
<g id="fyou5"></g><g id="fthem5"></g>
<text class="m" x="300" y="724" font-size="26" text-anchor="middle">YOU</text><text class="m" x="1300" y="724" font-size="26" text-anchor="middle">THEM</text>
<g id="goal5"><rect x="600" y="240" width="400" height="60" rx="30" fill="none" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="800" y="278" font-size="22" text-anchor="middle" style="fill:var(--gain)">GOAL: “THAT’S RIGHT”</text></g>
<g id="sp5"><rect class="s-ink" x="400" y="380" width="480" height="140" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M425 500L360 530L470 518" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-line" d="M440 420h380M440 455h320M440 490h360" stroke-width="10" stroke-linecap="round"/><text class="m" x="400" y="570" font-size="20">YOUR SUMMARY OF THEIR VIEW</text></g>
<circle id="bulb5" class="s-ink" cx="1300" cy="320" r="38" stroke-width="6"/><rect class="ink" x="1284" y="360" width="32" height="22" rx="4"/>
<g id="rays5"><path class="s-gain" d="M1300 268v-20M1252 290l-17-10M1348 290l17-10M1250 340h-20M1350 340h20" stroke-width="6" stroke-linecap="round"/></g>
<g id="tr5"><rect class="gain" x="900" y="380" width="330" height="120" rx="24"/><path class="gain" d="M1170 496L1250 530L1205 496Z"/><text class="d" x="1065" y="455" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">That’s right.</text></g>
<g id="see5"><text class="d" x="120" y="800" font-size="40">They agree with your summary, and see you differently.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The “you’re right” trap.</text>
<text class="b" x="120" y="176" font-size="32">It sounds like agreement. Often it isn’t.</text>
<path class="s-line" d="M200 700H1400" stroke-width="4"/>
<g id="fthem6"></g>
<g id="thumb6"><rect class="s-ink" x="420" y="290" width="480" height="120" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M450 408L380 470L500 408" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><g id="th6"><rect class="gain" x="450" y="345" width="18" height="45" rx="4"/><path class="gain" d="M472 390V350L490 310Q500 300 505 315L500 340H520Q532 340 528 354L522 384Q520 392 512 392Z"/></g><text class="d" x="540" y="368" font-size="46">You’re right.</text></g>
<g id="ex6"><rect class="gain" x="1120" y="240" width="200" height="70" rx="8"/><text class="d" x="1220" y="292" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">EXIT</text><rect class="s-ink" x="1150" y="380" width="140" height="320" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1265" cy="540" r="9"/><path id="arr6" d="M420 640H1120" stroke="var(--muted)" stroke-width="5" stroke-dasharray="20 16" stroke-linecap="round"/><path class="s-muted" d="M1100 620L1126 640L1100 660" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="770" y="610" font-size="22" text-anchor="middle">“JUST STOP TALKING”</text></g>
<g id="no6"><text class="d" x="120" y="800" font-size="50" style="fill:var(--loss)">Nothing has really changed.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">A hostage standoff.</text>
<text class="b" x="120" y="176" font-size="32">The Philippines: a rebel leader holding an American hostage.</text>
<g id="camp7"><path class="s-line" d="M500 660H1200" stroke-width="4"/><path class="s-ink" d="M520 660L660 430L800 660Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="ink" d="M635 660L660 570L685 660Z"/><path class="s-ink" d="M1080 660Q1070 540 1090 430" fill="none" stroke-width="10" stroke-linecap="round"/><path class="s-gain" d="M1090 430q-50-20-90 30M1090 430q50-20 85 35M1090 430q-30 5-55 55M1090 430q35 5 50 55" fill="none" stroke-width="9" stroke-linecap="round"/><g id="fsab7"></g><text class="m" x="920" y="700" font-size="20" text-anchor="middle">ABU SABAYA</text></g>
<g id="scr7g"><rect class="ink" x="140" y="240" width="320" height="20" rx="10"/><rect id="pap7" class="s-ink" x="160" y="250" width="280" height="0" fill="var(--stage)" stroke-width="4"/><g id="lns7"></g><rect id="rod7" class="ink" x="140" y="240" width="320" height="20" rx="10"/><text class="m" x="300" y="725" font-size="20" text-anchor="middle">HIS GRIEVANCES,</text><text class="m" x="300" y="755" font-size="20" text-anchor="middle">SUMMARIZED BACK</text></g>
<g id="tw7"><rect class="gain" x="780" y="270" width="320" height="100" rx="24"/><path class="gain" d="M900 368L915 420L935 368Z"/><text class="d" x="940" y="335" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">That’s right.</text></g>
<g id="ran7"><circle class="s-ink" cx="1340" cy="460" r="80" fill="var(--stage)" stroke-width="6"/><text class="d" x="1340" y="495" font-size="100" text-anchor="middle">$</text><path id="rx7" d="M1285 405L1395 515" stroke="var(--loss)" stroke-width="10" stroke-linecap="round" stroke-dasharray="160"/><text class="m" x="1340" y="590" font-size="20" text-anchor="middle">STOPPED PUSHING</text><text class="m" x="1340" y="620" font-size="20" text-anchor="middle">FOR RANSOM</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa8"><text class="d" x="136" y="330" font-size="80" letter-spacing="-2">Turn one yes question</text></g>
<g id="qb8"><text class="d" x="136" y="430" font-size="80" letter-spacing="-2">into a <tspan style="fill:var(--gain)">no</tspan> question.</text></g>
<g id="qc8"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">Then wait for “<tspan style="fill:var(--gain)">that’s right</tspan>.”</text></g>
<g id="nb8"><rect x="1260" y="200" width="200" height="110" rx="24" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/><text class="d" x="1360" y="278" font-size="64" text-anchor="middle" style="fill:var(--gain)">No.</text></g>
<g id="ear8"><path class="s-ink" d="M1335 760c-25 0-35-25-35-45c0-25 20-35 20-60c0-35 25-55 55-55s55 25 55 55c0 30-25 40-25 60" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M1350 665c0-18 32-18 32 4c0 16-16 16-16 32" fill="none" stroke-width="7" stroke-linecap="round"/><g id="wav8"></g><text class="m" x="143" y="700" font-size="26">AIM FOR NO · LISTEN FOR THAT’S RIGHT</text></g>
</g>