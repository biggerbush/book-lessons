<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Become a creature</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of discomfort.</text>
<text class="b" x="120" y="600" font-size="32">Why feeling awkward is often the surest sign you are learning.</text>
