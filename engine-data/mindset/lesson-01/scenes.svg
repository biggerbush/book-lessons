<text class="m" x="1310" y="800" font-size="20" text-anchor="middle">AGAIN AND AGAIN</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The growth mindset.</text>
<text class="b" x="120" y="176" font-size="32">Ability is a seed that grows.</text>
