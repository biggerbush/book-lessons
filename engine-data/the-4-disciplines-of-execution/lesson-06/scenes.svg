<line id="l_hand" x1="1220" y1="430" x2="1220" y2="320" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1220" cy="430" r="12"/>
<text class="m" x="1220" y="620" font-size="22" text-anchor="middle">TELL WITHIN SECONDS</text></g>
<g id="l_rep"><rect class="s-loss" x="1150" y="722" width="80" height="100" rx="8" fill="var(--stage)" stroke-width="5"/><path class="s-loss" d="M1168 748h44M1168 770h44M1168 792h44M1168 810h28" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="120" y="790" font-size="44">Have to study it? Then it’s a report.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Built by the team.</text>
<text class="b" x="120" y="176" font-size="32">Design your own, even on a plain whiteboard.</text>
