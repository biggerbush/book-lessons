<g id="sq"><rect class="s-ink" x="560" y="250" width="140" height="56" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d" x="630" y="288" font-size="28" text-anchor="middle">Fair?!</text></g>
<g id="gray"><text class="m" x="980" y="280" font-size="20">PSYCHOLOGIST PETER GRAY:</text><text class="m" x="980" y="312" font-size="20">KIDS LEARN THROUGH PLAY</text></g>
<g id="fprows"></g>
<g id="team"><text class="d" x="120" y="800" font-size="40">That squabble is practice for friendship and teamwork.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A little bit scary.</text>
<text class="b" x="120" y="176" font-size="32">Kids seek out risky play on purpose.</text>
<path class="s-line" d="M120 640h880" stroke-width="5" stroke-linecap="round"/>
