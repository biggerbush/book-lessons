<text class="d" x="840" y="785" font-size="48">what makes it work.</text>
<rect class="gain" x="844" y="808" width="140" height="10"/></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">From hoping to doing.</text>
<text class="b" x="120" y="176" font-size="32">Track leads, and the team asks what it did today.</text>
<g id="hb1"><rect class="s-muted" x="140" y="230" width="520" height="64" rx="32" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="400" y="270" font-size="22" text-anchor="middle">HOPE THE QUARTER GOES WELL</text></g>
<path id="hs" class="s-loss" d="M170 262h460" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="hb2"><rect class="gain" x="140" y="314" width="520" height="64" rx="32"/>
<text class="m" x="400" y="354" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WHAT DID WE DO TODAY?</text></g>
<g id="hud"><circle class="s-line" cx="400" cy="590" r="60" fill="none" stroke-width="5"/></g>
<g id="gears"></g>
<g id="gl"><text class="m" x="1220" y="528" font-size="24" text-anchor="middle" style="fill:var(--stage)">RESULT</text>
<text class="m" x="1000" y="770" font-size="20" text-anchor="middle">DAILY ACTIONS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find your lead measure.</text>
<text class="b" x="120" y="176" font-size="32">One goal. One action that moves it.</text>
<g id="you"><circle class="ink" cx="280" cy="420" r="42"/><path class="ink" d="M217 596v-55a63 63 0 0 1 126 0v55z"/>
<text class="m" x="280" y="640" font-size="22" text-anchor="middle">YOU</text></g>
<g id="qm"><text class="d" x="760" y="590" font-size="220" text-anchor="middle" style="fill:var(--muted)">?</text></g>
<g id="qlab"><text class="m" x="760" y="680" font-size="22" text-anchor="middle">ONE ACTION, DONE MORE OFTEN</text></g>
<g id="lbox"><rect class="gain" x="590" y="450" width="340" height="110" rx="55"/>
<text class="m" x="760" y="514" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">YOUR LEAD MEASURE</text>
<path class="s-gain" d="M380 505h190M950 505h270m-18-18 18 18-18 18" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="flag"><path class="s-line" d="M1160 680h300" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M1300 680V300" stroke-width="8" stroke-linecap="round"/>
<path class="ink" d="M1304 304h150l-34 44 34 44h-150z"/>
<text class="m" x="1310" y="730" font-size="22" text-anchor="middle">YOUR GOAL</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">A result you can’t control?</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="80" letter-spacing="-2">Name the daily action</text></g>
<g id="qc"><text class="d" x="136" y="530" font-size="80" letter-spacing="-2">behind it, and <tspan style="fill:var(--gain)">track that.</tspan></text></g>
<g id="qm8"><text class="m" x="143" y="680" font-size="26">THIS WEEK: TRACK THE LEAD, NOT THE LAG</text></g>
<g id="sw"><rect class="ink" x="1320" y="590" width="40" height="22" rx="6"/>
<circle class="s-ink" cx="1340" cy="720" r="100" fill="var(--stage)" stroke-width="8"/>
