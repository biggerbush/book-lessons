<g id="s0">
<text class="m" x="120" y="150" font-size="28">MENTAL MODEL · THINKING TOOLS</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Break it down,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">then rebuild.</text>
<text class="b" x="120" y="600" font-size="32">Strip a problem to what is truly known, then rebuild.</text>
<g id="tagw"><g id="tag">
<path class="s-muted" d="M1120 220Q1130 330 1185 400" fill="none" stroke-width="4"/>
<circle class="ink" cx="1120" cy="220" r="7"/>
