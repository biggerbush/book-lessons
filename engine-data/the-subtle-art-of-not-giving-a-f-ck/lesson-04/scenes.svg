<text class="m" x="1180" y="680" font-size="20" text-anchor="middle">LEFT ANGRY AND HEARTBROKEN</text>
<text class="m" x="1180" y="712" font-size="20" text-anchor="middle" style="fill:var(--loss)">VOWING TO PROVE THEM WRONG</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">He built his own band.</text>
<text class="b" x="120" y="176" font-size="32">Megadeth: millions of records sold, arenas packed worldwide.</text>
