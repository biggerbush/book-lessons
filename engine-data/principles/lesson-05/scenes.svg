<g id="ch"><text class="m" x="143" y="250" font-size="26">THIS WEEK, WHEN SOMEONE DISAGREES:</text><text class="m" x="143" y="292" font-size="26" style="fill:var(--gain)">PAUSE. ASK ONE HONEST QUESTION BEFORE YOU REPLY.</text></g>
