<ellipse cx="920" cy="420" rx="120" ry="80" fill="var(--line)" fill-opacity=".5"/>
<g id="route"></g>
<g id="trav"></g>
<g id="glass">
<text class="m" x="1330" y="270" font-size="22" text-anchor="middle">FREEDOM</text>
<polygon id="water" class="gain"/>
<path class="s-ink" d="M1220 300L1440 300L1410 640L1250 640Z" fill="none" stroke-width="7" stroke-linejoin="round"/>
</g>
<text id="hollow" class="m" x="1330" y="690" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEELS HOLLOW</text>
<g id="noties"><text class="d5" x="120" y="800" font-size="40">No ties. No obligations. No reason to stay.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Choose one. Reject the rest.</text>
<text class="b" x="120" y="176" font-size="32">Every no is a quiet statement about what you value.</text>
<g id="fork"></g>
<circle class="ink" cx="200" cy="470" r="24"/>
