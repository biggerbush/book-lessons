<g id="s0">
<text class="m" x="120" y="150" font-size="28">CAN'T HURT ME · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The 40 Percent</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Rule.</text>
<text class="b" x="120" y="600" font-size="32">Your first urge to quit is not your real limit.</text>
<path class="s-line" d="M1000 700H1480" stroke-width="6" stroke-linecap="round"/>
<g id="gap0"><path class="s-gain" d="M1190 660v-16H1440v16" fill="none" stroke-width="5" stroke-dasharray="10 8"/><text class="m" x="1315" y="624" font-size="18" text-anchor="middle" style="fill:var(--gain)">HIDDEN STRENGTH</text><circle class="gain" cx="1440" cy="700" r="12"/><text class="m" x="1440" y="744" font-size="18" text-anchor="middle">BODY</text></g>
<g id="mind0"><circle class="loss" cx="1150" cy="700" r="12"/><text class="m" x="1150" y="744" font-size="18" text-anchor="middle">MIND</text></g>
<g id="run0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The quitting voice.</text>
<text class="b" x="120" y="176" font-size="32">Deep in a hard workout: lungs burning, legs shaking.</text>
<g id="tp"><g id="tpb"><circle class="ink" cx="330" cy="420" r="50"/><path class="ink" d="M250 640v-60a80 80 0 0 1 160 0v60z"/></g><g id="sweat"></g><text class="m" x="330" y="690" font-size="20" text-anchor="middle">YOU</text></g>
<g id="bub"><path d="M542 350L400 410L542 410" fill="var(--stage)" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/><rect x="540" y="230" width="600" height="220" rx="34" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><path d="M543 356V406" stroke="var(--stage)" stroke-width="8"/>
<text class="d" x="590" y="320" font-size="56" style="fill:var(--loss)">I’m finished.</text><text class="d5" x="590" y="400" font-size="40">I have nothing left.</text></g>
<line id="stk1" class="s-ink" x1="584" y1="302" x2="584" y2="302" stroke-width="6" stroke-linecap="round"/>
<g id="gog"><circle class="gain" cx="1330" cy="380" r="44"/><path class="gain" d="M1260 574v-53a70 70 0 0 1 140 0v53z"/><text class="m" x="1330" y="620" font-size="20" text-anchor="middle">DAVID GOGGINS</text></g>
<g id="lie"><text class="d" x="120" y="790" font-size="46">That voice is usually <tspan style="fill:var(--gain)">lying</tspan>.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The 40 percent rule.</text>
<text class="b" x="120" y="176" font-size="32">Imagine a fuel gauge that measures your effort.</text>
<g id="gg"><path class="s-line" d="M260 640A300 300 0 0 1 860 640" fill="none" stroke-width="44"/>
<path id="ua" fill="none" stroke="var(--loss)" stroke-width="44"/><path id="ga" fill="none" stroke="var(--gain)" stroke-width="44"/>
<text class="m" x="260" y="700" font-size="24" text-anchor="middle">E</text><text class="m" x="860" y="700" font-size="24" text-anchor="middle">F</text>
<line id="ndl" class="s-ink" x1="560" y1="640" x2="310" y2="640" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="560" cy="640" r="20"/></g>
<g id="fm"></g>
<g id="t40"><text id="n40" class="d" x="1000" y="370" font-size="120" style="fill:var(--loss)">0%</text><text class="m" x="1006" y="436" font-size="20">USED WHEN YOU</text><text class="m" x="1006" y="466" font-size="20">FIRST FEEL DONE</text></g>
<g id="t60"><text id="n60" class="d" x="1000" y="620" font-size="120" style="fill:var(--gain)">60%</text><text class="m" x="1006" y="686" font-size="20">STILL IN THE TANK</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your brain has a governor.</text>
<text class="b" x="120" y="176" font-size="32">Like the device that caps how fast a car can go.</text>
<g id="pc0"><rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M240 400A90 90 0 0 1 420 400" fill="none" stroke-width="12"/><path class="s-loss" d="M342 323L346 297" stroke-width="6" stroke-linecap="round"/>
<line id="cn" class="s-ink" x1="330" y1="400" x2="258" y2="400" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="330" cy="400" r="10"/>
<path class="ink" d="M180 560h300v-50l-60-14-40-50H260l-40 50h-40z"/><circle cx="245" cy="560" r="28" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><circle cx="415" cy="560" r="28" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/>
<text class="m" x="330" y="660" font-size="20" text-anchor="middle">SPEED CAP</text></g>
<g id="pc1"><rect class="s-line" x="590" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<g class="ink"><circle cx="745" cy="410" r="62"/><circle cx="855" cy="410" r="62"/><circle cx="800" cy="385" r="62"/><circle cx="735" cy="475" r="55"/><circle cx="865" cy="475" r="55"/><circle cx="800" cy="495" r="60"/></g>
<path d="M740 470A60 60 0 0 1 860 470" fill="none" stroke="var(--stage)" stroke-width="8"/><line id="bn" x1="800" y1="470" x2="760" y2="440" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="800" y="660" font-size="20" text-anchor="middle">COMFORT + SAFETY</text></g>
<g id="pc2"><rect class="s-line" x="1060" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="ped"><path class="s-ink" d="M1220 280L1270 500" stroke-width="14" stroke-linecap="round"/><rect class="ink" x="1225" y="495" width="100" height="26" rx="8"/></g><circle class="ink" cx="1220" cy="280" r="14"/>
<path class="s-line" d="M1110 600H1430" stroke-width="6"/><circle class="ink" cx="1150" cy="600" r="12"/><path class="loss" d="M1400 580l20 34h-40z"/>
<text class="m" x="1150" y="644" font-size="18" text-anchor="middle">BRAKES</text><text class="m" x="1390" y="644" font-size="18" text-anchor="middle" style="fill:var(--loss)">REAL DANGER</text></g>
<g id="early"><text class="d" x="120" y="790" font-size="44">It brakes long before real danger.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">An untrained 100.</text>
<text class="b" x="120" y="176" font-size="32">A 24-hour race, with 100 miles to cover.</text>
<g id="clk"><circle cx="330" cy="460" r="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><g id="tk"></g>
<line id="hand" class="s-gain" x1="330" y1="460" x2="330" y2="340" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="330" cy="460" r="12"/>
<text class="d5" x="330" y="690" font-size="40" text-anchor="middle">24 hours</text><text class="m" x="330" y="730" font-size="22" text-anchor="middle" style="fill:var(--gain)">100 MILES</text></g>
<g id="db"><circle class="ink" cx="800" cy="350" r="46"/><path class="ink" d="M690 556v-56a110 70 0 0 1 220 0v56z"/>
<g id="dbb"><path class="s-ink" d="M680 600H920" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="690" y="568" width="26" height="64" rx="6"/><rect class="ink" x="884" y="568" width="26" height="64" rx="6"/></g>
<text class="m" x="800" y="690" font-size="20" text-anchor="middle">BIG LIFTER, BARELY RUNNING</text></g>
<g id="cal"><rect x="1130" y="330" width="280" height="290" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="1130" y="330" width="280" height="60" rx="14"/><g id="cells"></g>
<text class="m" x="1270" y="690" font-size="20" text-anchor="middle">ONLY DAYS TO PREPARE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">His body broke down.</text>
<text class="b" x="120" y="176" font-size="32">Partway through the 100 miles.</text>
<g id="beg"><text class="d5" x="120" y="250" font-size="38" style="fill:var(--loss)">Every part of him begged to stop.</text></g>
<path class="s-line" d="M160 560H1440" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="160" y="604" font-size="20" text-anchor="middle">0</text>
<g id="pms"></g>
<g id="fin"><path class="s-ink" d="M1440 380V560" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1440 382L1360 402L1440 422z"/><text class="m" x="1440" y="604" font-size="20" text-anchor="middle" style="fill:var(--gain)">100</text>
<text class="m" x="120" y="820" font-size="22">ONE PAINFUL STEP AT A TIME</text></g>
<g id="r5" fill="var(--ink)"><circle cx="0" cy="470" r="16"/><path d="M-24 548v-20a24 24 0 0 1 48 0v20z"/></g>
<text id="mi" class="d" x="120" y="760" font-size="80">0 miles</text>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="56">The felt limit wasn’t the real limit.</text>
<text class="b" x="120" y="176" font-size="32">Treat the first urge to quit as a signal, not an order.</text>
<g id="bulb"><g id="rays"></g><circle id="bulbC" cx="300" cy="420" r="95" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path class="s-ink" d="M270 430l15-25 15 25 15-25 15 25" fill="none" stroke-width="5" stroke-linejoin="round"/>
<rect class="ink" x="262" y="512" width="76" height="22" rx="4"/><rect class="ink" x="270" y="540" width="60" height="18" rx="4"/>
<text class="m" x="300" y="660" font-size="20" text-anchor="middle">THE FELT LIMIT</text><text class="m" x="300" y="690" font-size="20" text-anchor="middle">WAS NOT THE REAL ONE</text></g>
<g id="flag"><path class="s-ink" d="M740 300V610" stroke-width="8" stroke-linecap="round"/><path id="flp" class="gain"/>
<text class="d5" x="800" y="670" font-size="40" text-anchor="middle" style="fill:var(--gain)">A signal,</text><text class="m" x="800" y="710" font-size="20" text-anchor="middle">NOT AN ORDER</text></g>
<g id="bars6"></g>
<g id="arr6"><path class="s-gain" d="M1100 500L1430 280M1430 280l-34 2M1430 280l-15 30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="lb6"><text class="m" x="1270" y="660" font-size="20" text-anchor="middle">WHAT’S POSSIBLE GROWS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Move your limit, step by step.</text>
<text class="b" x="120" y="176" font-size="32">In a workout, or a tough task at work.</text>
<g id="sw"><rect class="ink" x="268" y="330" width="44" height="26" rx="6"/><circle cx="290" cy="500" r="140" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/>
<line id="swh" class="s-gain" x1="290" y1="500" x2="290" y2="390" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="290" cy="500" r="12"/>
<text class="m" x="290" y="700" font-size="20" text-anchor="middle">SMALL SCALE</text></g>
<g id="r70"><path class="s-muted" d="M1050 320V660" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="1050" y="300" font-size="18" text-anchor="middle">USUAL STOP</text>
<text class="m" x="600" y="392" font-size="20" text-anchor="end">NOW</text><rect class="ink" x="620" y="360" width="430" height="50" rx="8"/></g>
<g id="ps0"><rect class="gain" x="1050" y="360" width="100" height="50" rx="8"/><text class="m" x="1166" y="392" font-size="18" style="fill:var(--gain)">+ A LITTLE MORE</text></g>
<g id="row1"><text class="m" x="600" y="502" font-size="20" text-anchor="end">NEXT</text><rect id="b1" class="ink" x="620" y="470" width="430" height="50" rx="8"/><rect id="p1" class="gain" x="1050" y="470" width="100" height="50" rx="8"/></g>
<g id="row2"><text class="m" x="600" y="612" font-size="20" text-anchor="end">LATER</text><rect id="b2" class="ink" x="620" y="580" width="430" height="50" rx="8"/><rect id="p2" class="gain" x="1050" y="580" width="100" height="50" rx="8"/></g>
<g id="nm"><text class="d" x="120" y="790" font-size="46">Your normal gets bigger.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Is this really my limit,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">or just my first</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">40 percent</tspan>?</text></g>
<g id="lb8"><text class="m" x="143" y="700" font-size="26">PAUSE AND ASK ONE QUESTION</text></g>
<g id="g8"><path class="s-line" d="M1110 760A90 90 0 0 1 1290 760" fill="none" stroke-width="22"/><path id="ua8" fill="none" stroke="var(--loss)" stroke-width="22"/>
<line id="n8" class="s-ink" x1="1200" y1="760" x2="1130" y2="760" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1200" cy="760" r="10"/></g>
<g id="qm"><circle class="gain" cx="1390" cy="720" r="60"/><text class="d" x="1390" y="748" font-size="80" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
</g>