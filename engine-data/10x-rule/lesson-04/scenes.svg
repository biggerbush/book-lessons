<g id="s0">
<text class="m" x="120" y="150" font-size="28">10X RULE · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Average is a</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">failing formula.</text>
<text class="b" x="120" y="600" font-size="32">Why playing it safe like everyone else is quietly risky.</text>
<g id="tcrowd"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What average means.</text>
<text class="b" x="120" y="176" font-size="32">What most people do, earn, and settle for.</text>
<g id="bell">
<path class="s-line" d="M120 640H760" stroke-width="4"/>
<path class="loss" d="M120 640C320 640 340 300 440 300C540 300 560 640 760 640Z" fill-opacity=".14"/>
<path class="s-loss" d="M120 640C320 640 340 300 440 300C540 300 560 640 760 640" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="bdots"></g>
<g id="mid"><path class="s-loss" d="M440 280V660" stroke-width="6" stroke-dasharray="12 10"/><text class="m" x="440" y="262" font-size="22" text-anchor="middle" style="fill:var(--loss)">AVERAGE</text><text class="m" x="440" y="696" font-size="20" text-anchor="middle">MOST PEOPLE</text></g>
<g id="ck0"><circle class="s-ink" cx="940" cy="380" r="70" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M940 380h-40M940 380v-52" stroke-width="7" stroke-linecap="round"/><text class="m" x="940" y="500" font-size="20" text-anchor="middle">9 TO 5</text></g>
<g id="ck1"><rect class="loss" x="1130" y="380" width="60" height="70"/><rect class="s-ink" x="1130" y="310" width="60" height="140" rx="10" fill="none" stroke-width="6"/><text class="m" x="1160" y="500" font-size="20" text-anchor="middle">USUAL EFFORT</text></g>
<g id="ck2"><rect class="s-ink" x="1310" y="320" width="120" height="130" rx="18" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1300" y="306" width="140" height="20" rx="6"/><rect class="gain" x="1326" y="418" width="88" height="20" rx="10"/><text class="m" x="1370" y="500" font-size="20" text-anchor="middle">TYPICAL SAVINGS</text></g>
<g id="s1f"><text class="d" x="120" y="800" font-size="48">Follow the crowd: at best, you get what it gets.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why average feels safe.</text>
<text class="b" x="120" y="176" font-size="32">Nobody questions it.</text>
<g id="house">
<circle id="hsmoke" class="s-muted" cx="520" cy="300" r="14" fill="none" stroke-width="4"/>
<path class="s-ink" d="M500 371V320H540V403" fill="none" stroke-width="7" stroke-linejoin="round"/>
<path id="hroof" class="s-ink" d="M190 460L400 290L610 460" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect id="hbody" class="s-ink" x="230" y="450" width="340" height="250" fill="var(--stage)" stroke-width="8"/>
<rect class="gain" x="370" y="580" width="70" height="120"/>
<rect class="gain" x="270" y="500" width="70" height="60" fill-opacity=".6"/><rect class="gain" x="460" y="500" width="70" height="60" fill-opacity=".6"/>
<text class="m" x="400" y="740" font-size="20" text-anchor="middle">COMFORTABLE</text>
</g>
<g id="ppl"></g>
<g id="ill"><text class="d" x="120" y="800" font-size="48">But the comfort is an illusion.</text><text class="m" x="120" y="846" font-size="22">IT ONLY WORKS WHEN NOTHING GOES WRONG</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Life isn’t average.</text>
<text class="b" x="120" y="176" font-size="32">Real life brings storms you never planned for.</text>
<g id="cloud">
<g id="rain"></g>
<path id="bolt" class="s-gain" d="M820 380l-30 50h30l-24 50" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="loss" cx="720" cy="330" r="60"/><circle class="loss" cx="800" cy="300" r="80"/><circle class="loss" cx="880" cy="330" r="60"/><rect class="loss" x="660" y="330" width="280" height="60" rx="30"/>
</g>
<g id="ev0"><g id="smoke"></g><path class="ink" d="M350 570l20-36h80l20 36z"/><rect class="ink" x="320" y="570" width="180" height="50" rx="12"/><circle class="s-ink" cx="360" cy="624" r="20" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="460" cy="624" r="20" fill="var(--stage)" stroke-width="6"/><text class="m" x="400" y="690" font-size="20" text-anchor="middle">CAR BREAKS DOWN</text></g>
<g id="ev1"><path class="s-ink" d="M780 550v-16h40v16" fill="none" stroke-width="6"/><rect class="s-ink" x="740" y="550" width="120" height="86" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-loss" d="M755 530l90 120M845 530l-90 120" stroke-width="8" stroke-linecap="round"/><text class="m" x="800" y="690" font-size="20" text-anchor="middle">JOB DISAPPEARS</text></g>
<g id="ev2"><path id="heart" class="loss" d="M1200 640C1120 590 1110 540 1150 525C1175 516 1195 530 1200 545C1205 530 1225 516 1250 525C1290 540 1280 590 1200 640Z"/><text class="m" x="1200" y="690" font-size="20" text-anchor="middle">HEALTH SCARE</text></g>
<g id="s3f"><text class="d" x="120" y="800" font-size="46">An average plan leaves no room for any of it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The 2008 lesson.</text>
<text class="b" x="120" y="176" font-size="32">Cardone wrote the book in the shadow of the financial crisis.</text>
<g id="news"><rect class="s-ink" x="120" y="230" width="500" height="300" rx="8" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="276" font-size="20">THE DAILY NEWS</text><path class="s-line" d="M150 292h440" stroke-width="3"/><text class="d" x="150" y="374" font-size="80" style="fill:var(--loss)">2008</text><text class="d5" x="150" y="450" font-size="32">Financial crisis</text><path class="s-line" d="M150 486h440M150 510h300" stroke-width="6" stroke-linecap="round"/></g>
<g id="chart"><path class="s-ink" d="M740 240V530H1480" fill="none" stroke-width="5"/><text class="m" x="760" y="262" font-size="20">THE ECONOMY</text><polyline id="fall" class="s-loss" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="fam"></g>
<g id="famt"><text class="m" x="560" y="620" font-size="20">NORMAL JOBS. NORMAL EFFORT. NORMAL SAVINGS.</text><text class="m" x="560" y="660" font-size="20" style="fill:var(--loss)">SUDDENLY EXPOSED.</text></g>
<g id="s4f"><text class="d" x="120" y="800" font-size="46">Average was never safe. Good times hid it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">No room for error.</text>
<text class="b" x="120" y="176" font-size="32">Average works like a rope with no slack.</text>
<g id="rope"><path class="s-line" d="M120 620h600" stroke-width="4"/><rect class="ink" x="150" y="300" width="24" height="320"/><rect class="ink" x="686" y="300" width="24" height="320"/><path id="ropeL" class="s-ink" fill="none" stroke-width="8" stroke-linecap="round"/><path id="ropeR" class="s-ink" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="430" y="290" font-size="22" text-anchor="middle">NO SLACK</text></g>
<g id="scale"><path class="ink" d="M1120 440L1070 620H1170Z"/><g id="beam"><path class="s-ink" d="M880 440H1360M880 440V520M1360 440V520" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M820 520h120q-60 50-120 0z"/><path class="loss" d="M1300 520h120q-60 50-120 0z"/><text class="m" x="880" y="600" font-size="22" text-anchor="middle">INCOME</text><text class="m" x="1360" y="600" font-size="22" text-anchor="middle">COSTS</text></g></g>
<g id="sct"><text class="m" x="1120" y="700" font-size="22" text-anchor="middle">WHEN INCOME DIPS EVEN SLIGHTLY</text></g>
<g id="s5f"><text class="d" x="120" y="800" font-size="46">No margin built in: a failing formula.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t aim for average.</text>
<text class="b" x="120" y="176" font-size="32">The danger grows when average becomes your goal.</text>
<g id="board"><circle class="s-ink" cx="520" cy="500" r="220" fill="var(--stage)" stroke-width="6"/><circle class="s-line" cx="520" cy="500" r="160" fill="none" stroke-width="5"/><circle class="s-line" cx="520" cy="500" r="100" fill="none" stroke-width="5"/><circle class="loss" cx="520" cy="500" r="40"/></g>
<g id="aim"><path class="s-muted" d="M1300 420L520 500" stroke-width="3" stroke-dasharray="8 10"/><text class="m" x="1180" y="500" font-size="22">AIM: THE MIDDLE</text></g>
<g id="push"><path class="s-loss" d="M900 320v60m-14-14 14 14 14-14M1000 320v60m-14-14 14 14 14-14M1100 320v60m-14-14 14 14 14-14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1000" y="296" font-size="22" text-anchor="middle">LIFE PUSHES BACK</text></g>
<g id="arwg"><g id="arw"><path class="s-ink" d="M-160 0H-4M-28 -16L0 0L-28 16" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="lnd"><text class="m" x="760" y="700" font-size="22" style="fill:var(--loss)">YOU LAND BELOW IT</text></g>
<g id="s6f"><text class="d" x="120" y="820" font-size="44">Aiming for average means planning to fall short.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build a surplus.</text>
<text class="b" x="120" y="176" font-size="32">More than you think you need.</text>
<g id="pig"><circle id="coin" class="gain" cx="290" cy="250" r="22"/><path class="ink" d="M230 375l20-45 30 35z"/><rect class="ink" x="200" y="530" width="32" height="55" rx="8"/><rect class="ink" x="340" y="530" width="32" height="55" rx="8"/><ellipse class="s-ink" cx="290" cy="460" rx="140" ry="100" fill="var(--stage)" stroke-width="7"/><rect class="s-ink" x="415" y="435" width="40" height="50" rx="12" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="380" cy="430" r="8"/><path class="s-ink" d="M260 380h60" stroke-width="7" stroke-linecap="round"/><text class="m" x="140" y="650" font-size="20">BUILD MORE THAN YOU NEED</text></g>
<g id="need"><path class="s-muted" d="M560 600H1310" stroke-width="3" stroke-dasharray="10 8"/><text class="m" x="1320" y="607" font-size="20">NEEDED</text></g>
<g id="stacks"></g>
<g id="rain2"></g>
<g id="umb"><path class="gain" d="M540 340Q940 150 1340 340Z"/><path class="s-ink" d="M940 340V392" stroke-width="7" stroke-linecap="round"/><text class="m" x="940" y="318" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOUR SURPLUS</text></g>
<g id="s7f"><text class="d" x="120" y="830" font-size="44">Your surplus is your umbrella in the next storm.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What would it take to</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">build a <tspan style="fill:var(--gain)">real cushion</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">there this month?</text></g>
<g id="mir"><path class="s-ink" d="M1340 570v80M1280 650h120" stroke-width="8" stroke-linecap="round"/><ellipse class="s-ink" cx="1340" cy="420" rx="100" ry="150" fill="var(--stage)" stroke-width="8"/><g id="mirf"></g><path class="s-line" d="M1280 330q10-40 40-55" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="mlab"><text class="m" x="143" y="700" font-size="26">LOOK AT ONE AREA WHERE YOU’VE SETTLED</text></g>
</g>