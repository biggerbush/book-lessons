<g id="s0">
<text class="m" x="120" y="150" font-size="28">DRIVE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The puzzle rewards</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">can’t explain.</text>
<text class="b" x="120" y="600" font-size="32">Why monkeys and students play with puzzles for no reward.</text>
<rect class="s-ink" x="1300" y="330" width="170" height="140" rx="10" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1350 290v80M1420 300v40a14 14 0 0 1-28 0" fill="none" stroke-width="7" stroke-linecap="round"/>
<circle class="gain" cx="1350" cy="290" r="11"/>
<g id="mk0"></g>
<line id="arm0" x1="1205" y1="460" x2="1335" y2="305" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
<g id="q0"><text class="d" x="1170" y="290" font-size="80" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="dish0"><path class="s-ink" d="M1320 520a65 26 0 0 0 130 0z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1385" y="590" font-size="20" text-anchor="middle">NO TREAT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two drives, or so we thought.</text>
<text class="b" x="120" y="176" font-size="32">Scientists long believed behavior had two main drivers.</text>
<g id="sci"><text class="m" x="260" y="610" font-size="20" text-anchor="middle">SCIENTISTS</text></g>
<g id="card1">
<rect class="s-line" x="420" y="240" width="480" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="450" y="300" font-size="22">DRIVE 1 · BIOLOGICAL</text>
<path class="s-line" d="M530 410q-14-20 0-40M560 410q-14-20 0-40M590 410q-14-20 0-40" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="ink" d="M480 440h160a80 80 0 0 1-160 0z"/>
<path class="s-ink" d="M780 340c40 60 60 90 60 120a60 60 0 0 1-120 0c0-30 20-60 60-120z" fill="var(--ice)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="450" y="660" font-size="44">Hunger &amp; thirst</text>
</g>
<g id="card2">
<rect class="s-line" x="1000" y="240" width="480" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1030" y="300" font-size="22">DRIVE 2 · REWARDS</text>
<g id="carrot"><path class="s-line" d="M1140 330v50" stroke-width="4"/><path class="s-ink" d="M1125 380l-10-28M1140 380v-30M1155 380l10-28" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M1110 380h60l-30 120z"/></g>
<path class="s-ink" d="M1300 520L1400 340M1360 410l40-10" fill="none" stroke-width="14" stroke-linecap="round"/>
<text class="d" x="1030" y="660" font-size="44">Carrot &amp; stick</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Harlow’s monkeys, 1949.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Harry Harlow put a puzzle in their cages.</text>
<g id="mk2w"><g id="mk2"></g><g id="bars"></g><rect class="s-line" x="120" y="230" width="640" height="520" rx="12" fill="none" stroke-width="5"/></g>
<g id="pz">
<rect class="s-ink" x="900" y="320" width="520" height="260" rx="10" fill="var(--stage)" stroke-width="7"/>
<g id="lid"><rect class="ink" x="890" y="290" width="540" height="34" rx="6"/></g>
<g id="pin"><path class="s-ink" d="M1000 250v90" stroke-width="9" stroke-linecap="round"/><circle class="gain" cx="1000" cy="250" r="14"/></g>
<g id="hook"><path class="s-ink" d="M1280 250v60a16 16 0 0 0 32 0" fill="none" stroke-width="8" stroke-linecap="round"/></g>
</g>
<text id="st0" class="m" x="990" y="640" font-size="20" text-anchor="middle">1 PULL PIN</text>
<text id="st1" class="m" x="1180" y="640" font-size="20" text-anchor="middle">2 UNDO HOOK</text>
<text id="st2" class="m" x="1380" y="640" font-size="20" text-anchor="middle">3 LIFT COVER</text>
<g id="nofood"><text class="m" x="1160" y="720" font-size="24" text-anchor="middle" style="fill:var(--loss)">NO FOOD · NO PRAISE</text></g>
<g id="happy"><text class="d" x="120" y="830" font-size="44">They dove in, and got good fast.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then Harlow added raisins.</text>
<text class="b" x="120" y="176" font-size="32">A treat for every solved puzzle.</text>
<g id="mk3"></g>
<g id="rais"></g>
<path class="ink" d="M350 590a90 36 0 0 0 180 0z"/>
<text class="m" x="440" y="680" font-size="20" text-anchor="middle">RAISINS</text>
<rect class="s-line" x="720" y="240" width="760" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="760" y="300" font-size="22">NO RAISINS</text>
<g id="row1"></g>
<g id="r2l"><text class="m" x="760" y="500" font-size="22" style="fill:var(--loss)">WITH RAISINS</text></g>
<g id="row2"></g>
<g id="treat"><text class="d" x="120" y="800" font-size="52">The treat got in the way.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A strange new idea.</text>
<text class="b" x="120" y="176" font-size="32">Harlow called it intrinsic motivation.</text>
<g id="rays"></g>
<circle id="bulbC" class="s-ink" cx="330" cy="410" r="110" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="290" y="520" width="80" height="60" rx="8"/>
<path d="M300 540h60M300 560h60" stroke="var(--stage)" stroke-width="4"/>
<g id="bulbT"><text class="d5" x="330" y="690" font-size="34" text-anchor="middle">Intrinsic motivation</text></g>
<g id="gift">
<rect class="s-ink" x="640" y="420" width="300" height="220" rx="8" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="620" y="370" width="340" height="56" rx="8"/>
<rect class="gain" x="770" y="370" width="40" height="270"/>
<ellipse class="s-gain" cx="762" cy="346" rx="30" ry="16" fill="none" stroke-width="8" transform="rotate(-20 762 346)"/>
<ellipse class="s-gain" cx="818" cy="346" rx="30" ry="16" fill="none" stroke-width="8" transform="rotate(20 818 346)"/>
<text class="d5" x="790" y="700" font-size="34" text-anchor="middle">The task = the reward</text>
</g>
<g id="ignl">
<path class="s-muted" d="M990 480H1150" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round" opacity=".6"/>
<path class="s-loss" d="M1050 450l40 60M1090 450l-40 60" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1300" y="600" font-size="20" text-anchor="middle">OTHER SCIENTISTS</text>
<text class="m" x="1300" y="632" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOOKED AWAY</text>
</g>
<g id="ign"></g>
<g id="ignt"><text class="d" x="120" y="810" font-size="44">So unusual, it was largely ignored.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Deci’s Soma cubes.</text>
<text class="b" x="120" y="176" font-size="32">Two decades later, with university students.</text>
<path class="s-line" d="M120 720H1480" stroke-width="4"/>
<rect class="s-ink" x="140" y="420" width="110" height="300" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="230" cy="575" r="7"/>
<g id="deciw"><g id="deci"><text class="m" x="330" y="650" font-size="20" text-anchor="middle">EDWARD DECI</text></g></g>
<g id="desk">
<g id="stud"></g>
<rect class="ink" x="480" y="600" width="420" height="16"/>
<path class="s-ink" d="M500 616V720M880 616V720" stroke-width="8"/>
<g id="cubes"></g>
<text class="m" x="620" y="770" font-size="20" text-anchor="middle">STUDENT</text>
<text class="m" x="780" y="770" font-size="20" text-anchor="middle" style="fill:var(--gain)">SOMA CUBES</text>
</g>
<g id="timer">
<circle class="s-ink" cx="1320" cy="330" r="90" fill="var(--stage)" stroke-width="7"/>
<path id="tsec" class="gain"/>
<line id="thand" x1="1320" y1="330" x2="1320" y2="252" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="1320" cy="330" r="9"/>
<text class="m" x="1320" y="470" font-size="20" text-anchor="middle">8 MINUTES FREE TIME</text>
</g>
<g id="mags">
<text class="m" x="990" y="640" font-size="24" text-anchor="middle">OR</text>
<rect class="loss" x="1150" y="626" width="160" height="14" rx="3"/><rect class="ink" x="1160" y="612" width="150" height="14" rx="3"/><rect class="loss" x="1145" y="598" width="160" height="14" rx="3"/>
<rect class="ink" x="1080" y="640" width="340" height="12"/>
<path class="s-ink" d="M1100 652V720M1400 652V720" stroke-width="8"/>
<text class="m" x="1250" y="770" font-size="20" text-anchor="middle">MAGAZINES</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pay changed the play.</text>
<text class="b" x="120" y="176" font-size="32">Free-time play across three sessions (schematic).</text>
<g id="band"><rect class="gain" x="560" y="260" width="200" height="440" fill-opacity=".15"/><text class="m" x="660" y="244" font-size="18" text-anchor="middle" style="fill:var(--gain)">PAID $1 PER DESIGN</text></g>
<text class="m" x="230" y="244" font-size="20">FREE-TIME PLAY</text>
<path class="s-ink" d="M220 260V700H1100" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="360" y="740" font-size="20" text-anchor="middle">SESSION 1</text>
<text class="m" x="660" y="740" font-size="20" text-anchor="middle">SESSION 2</text>
<text class="m" x="960" y="740" font-size="20" text-anchor="middle">SESSION 3</text>
<g id="startl"><path class="s-muted" d="M360 520H1000" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="1010" y="526" font-size="18">START</text></g>
<polyline id="lfree" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<polyline id="lpaid" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="ink" cx="360" cy="520" r="11"/>
<g id="coin"><circle class="gain" cx="660" cy="320" r="36"/><text class="d" x="660" y="331" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">$1</text></g>
<g id="leg1"><path class="s-loss" d="M1180 420h60" stroke-width="8" stroke-linecap="round"/><text class="m" x="1260" y="427" font-size="20">PAID GROUP</text></g>
<g id="leg2"><path class="s-gain" d="M1180 480h60" stroke-width="8" stroke-linecap="round"/><text class="m" x="1260" y="487" font-size="20">UNPAID GROUP</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">A third drive.</text>
<g id="sub7"><text class="b" x="120" y="176" font-size="32">We do some things simply because they are satisfying.</text></g>
<g id="toy">
<rect class="gain" x="130" y="300" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<rect class="gain" x="170" y="300" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<rect class="gain" x="210" y="300" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<rect class="gain" x="130" y="260" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<rect class="gain" x="170" y="260" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<rect class="gain" x="130" y="220" width="40" height="40" stroke="var(--stage)" stroke-width="3"/>
<text class="m" x="190" y="378" font-size="24" text-anchor="middle">PLAY</text>
<text class="d" x="345" y="266" font-size="36" text-anchor="middle" style="fill:var(--gain)">$</text>
<path class="s-muted" d="M290 290h110m-22-22 22 22-22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M470 256v-20h60v20" fill="none" stroke-width="8" stroke-linejoin="round"/>
<rect class="loss" x="430" y="256" width="140" height="84" rx="10"/>
<text class="m" x="500" y="378" font-size="24" text-anchor="middle">JOB</text>
<text class="d5" x="620" y="310" font-size="40">Money turned play into a job.</text>
</g>
<g id="gw0"><text class="d" x="360" y="740" font-size="44" text-anchor="middle">Hunger</text></g>
<g id="gw1"><text class="d" x="800" y="740" font-size="44" text-anchor="middle">Rewards</text></g>
<g id="gw2"><text class="d" x="1240" y="740" font-size="44" text-anchor="middle" style="fill:var(--gain)">Satisfaction</text></g>
<g id="ignore"><text class="d" x="120" y="830" font-size="40">Ignore it, and we waste a strong motivator.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Think of one task</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you’d happily do</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">for free.</text></g>
<g id="nbl"><text class="m" x="143" y="700" font-size="26">NOTICE WHAT MAKES IT SATISFYING</text></g>
<g id="nb">
<rect class="s-ink" x="1180" y="280" width="260" height="320" rx="14" fill="var(--stage)" stroke-width="7"/>
<g id="spir"></g>
<path class="s-line" d="M1220 360h180M1220 420h180M1220 480h120" stroke-width="6" stroke-linecap="round"/>
<path class="s-gain" d="M1220 540l16 18 34-38" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pen"><path class="gain" d="M0 0l10-26 70-70 16 16-70 70z"/></g>
</g>
</g>