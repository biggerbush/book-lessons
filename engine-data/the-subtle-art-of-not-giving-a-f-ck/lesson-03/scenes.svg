<rect class="s-ink" x="840" y="260" width="320" height="380" rx="12" fill="var(--stage)" stroke-width="5"/>
<g id="spi"></g>
<text class="d5" x="870" y="340" font-size="34">I’m bad at this.</text>
<g id="bars"></g>
<text class="m" x="870" y="610" font-size="20">THEN WORK ON IT</text>
</g>
