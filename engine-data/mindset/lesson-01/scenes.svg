<g id="q2"><text class="d5" x="760" y="800" font-size="46" style="fill:var(--loss)">“I feel like a reject.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">Growth: problems you can handle.</text>
<text class="b" x="120" y="176" font-size="32">The same three events, read as things to work on.</text>
