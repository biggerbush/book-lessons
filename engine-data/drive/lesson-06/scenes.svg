<g id="stl"><text class="m" x="1310" y="750" font-size="22" text-anchor="middle" style="fill:var(--gain)">IT ADDED UP TO SOMETHING</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of goals.</text>
<text class="b" x="120" y="176" font-size="32">University of Rochester graduates, followed after college.</text>
