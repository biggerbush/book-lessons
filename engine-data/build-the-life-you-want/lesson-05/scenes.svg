<g id="s0">
<text class="m" x="120" y="150" font-size="28">BUILD THE LIFE YOU WANT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Get over</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">yourself.</text>
<text class="b" x="120" y="600" font-size="32">Why worrying about how others see you steals your joy</text>
<g id="rays0"></g>
<g id="mir">
<rect class="ink" x="1280" y="526" width="40" height="156" rx="16"/>
<ellipse class="s-ink" cx="1300" cy="380" rx="110" ry="150" fill="var(--stage)" stroke-width="8"/>
<g id="refl"><circle class="loss" cx="1300" cy="350" r="34"/><path class="loss" d="M1249 482v-20a51 51 0 0 1 102 0v20z"/></g>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The mirror trap.</text>
<text class="b" x="120" y="176" font-size="32">Replaying every word said at a party.</text>
<circle id="loop" class="s-loss" cx="320" cy="500" r="180" fill="none" stroke-width="6" stroke-dasharray="40 24" stroke-linecap="round"/>
<g id="p1"></g>
<g id="b1a"><circle class="ink" cx="420" cy="370" r="8"/><circle class="ink" cx="480" cy="345" r="12"/>
<rect class="s-ink" x="560" y="290" width="420" height="90" rx="45" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="770" y="348" font-size="36" text-anchor="middle">Did I sound dumb?</text></g>
<g id="b1b"><rect class="s-ink" x="560" y="410" width="420" height="90" rx="45" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="770" y="468" font-size="36" text-anchor="middle">Did they like me?</text></g>
<g id="ch1"><path class="s-ink" d="M1080 300V700H1460" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1096" y="320" font-size="20">MOOD</text>
<text class="m" x="1460" y="740" font-size="20" text-anchor="end">SELF-FOCUS</text>
<path id="ln1" class="s-loss" d="M1100 360L1200 420L1300 520L1440 670" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>
<g id="c1"><text class="d" x="120" y="820" font-size="44">The more we stare at ourselves, the worse we feel.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">An old puzzle.</text>
<text class="b" x="120" y="176" font-size="32">Marcus Aurelius, Roman emperor, nearly 2,000 years ago.</text>
<g id="emp"><rect class="ink" x="180" y="700" width="240" height="36"/></g>
<g id="hrt"><path class="gain" d="M440 350c-40-28-44-58-22-64c10-3 18 3 22 10c4-7 12-13 22-10c22 6 18 36-22 64z"/>
<text class="m" x="300" y="772" font-size="20" text-anchor="middle">WE LOVE OURSELVES MOST</text></g>
<g id="scl"><path class="s-ink" d="M1000 330V720" stroke-width="8"/><rect class="ink" x="900" y="720" width="200" height="20" rx="6"/>
<line id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1000" cy="330" r="12"/>
<g id="panL"></g><g id="panR"></g></g>
<g id="c2"><text class="d" x="120" y="836" font-size="44">That worry about judgment can quietly run our lives.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The spotlight effect.</text>
<text class="b" x="120" y="176" font-size="32">It feels like everyone is watching you.</text>
<g id="gz"></g>
<g id="stg"><path class="ink" d="M770 210h60l-10 30h-40z"/><polygon id="cone3" class="gain" points="780,240 820,240 960,620 640,620" fill-opacity=".32"/>
<rect class="ink" x="520" y="620" width="560" height="28" rx="6"/><g id="p3"></g></g>
<g id="aud"></g>
<g id="t3a"><text class="d" x="120" y="380" font-size="40">“Everyone sees me.”</text><text class="m" x="120" y="420" font-size="20">THE SPOTLIGHT EFFECT</text></g>
<g id="t3b"><text class="d" x="1480" y="380" font-size="40" text-anchor="end" style="fill:var(--gain)">Mostly in our heads.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The shirt test.</text>
<text class="b" x="120" y="176" font-size="32">Students wore an embarrassing T-shirt into a room of peers.</text>
<g id="shirt"><path class="s-ink" d="M260 270L200 300L160 370L215 395L240 365V560H440V365L465 395L520 370L480 300L420 270Q340 320 260 270Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="gain" cx="340" cy="440" r="55"/><circle cx="320" cy="425" r="7" fill="var(--on-gain)"/><circle cx="360" cy="425" r="7" fill="var(--on-gain)"/>
<path d="M310 455q30 30 60 0" fill="none" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/></g>
<g id="peers"></g><g id="me4"></g>
<g id="ch4"><path class="s-muted" d="M800 300H1440" stroke-width="2" stroke-dasharray="6 8"/>
<text class="m" x="1440" y="288" font-size="18" text-anchor="end">WHOLE ROOM</text>
<rect id="bg" class="loss" x="880" y="700" width="200" height="0"/><rect id="ba" class="gain" x="1160" y="700" width="200" height="0"/>
<path class="s-ink" d="M800 300V700H1440" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="980" y="740" font-size="20" text-anchor="middle">GUESSED</text><text class="m" x="1260" y="740" font-size="20" text-anchor="middle">ACTUAL</text>
<text class="m" x="1440" y="780" font-size="18" text-anchor="end">SCHEMATIC</text>
<g id="vg"><text class="d" x="980" y="480" font-size="36" text-anchor="middle">About half</text></g>
<g id="va"><text class="d" x="1260" y="610" font-size="36" text-anchor="middle" style="fill:var(--gain)">Far fewer</text></g></g>
<g id="c4"><text class="d" x="120" y="836" font-size="40">Everyone else was busy thinking about themselves.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody’s really watching.</text>
<text class="b" x="120" y="176" font-size="32">The spotlight is much dimmer than you think.</text>
<g id="lamp5"><path class="ink" d="M370 230h60l-10 32h-40z"/><polygon id="cone5" class="gain"/><path class="s-ink" d="M220 700H580" stroke-width="8" stroke-linecap="round"/><g id="p5"></g></g>
<g id="cage"><path class="s-ink" d="M800 640V440a100 100 0 0 1 200 0V640z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<rect class="ink" x="780" y="640" width="240" height="20" rx="6"/><circle class="ink" cx="900" cy="332" r="10"/>
<path class="s-ink" d="M920 520H1000" stroke-width="5" stroke-linecap="round"/>
<circle class="ink" cx="1000" cy="534" r="7"/><circle class="ink" cx="1000" cy="626" r="7"/>
<g id="door"><rect class="s-ink" x="-80" y="0" width="80" height="120" rx="4" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M-53 6V114M-27 6V114" stroke-width="4"/><circle class="ink" cx="-70" cy="60" r="7"/></g></g>
<g id="trail"></g>
<g id="birdw"><g id="bird">
<path class="gain" d="M-40-4L-76-22L-68 10z" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
<ellipse class="gain" rx="46" ry="28" stroke="var(--ink)" stroke-width="4"/>
<path id="wing" class="gain" d="M-24-4C-32-52 6-70 28-46C14-34 10-18 12-2z" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
<circle class="gain" cx="38" cy="-22" r="20" stroke="var(--ink)" stroke-width="4"/>
<path class="ink" d="M56-30L78-21L56-12z"/><circle class="ink" cx="44" cy="-26" r="4"/>
</g></g>
<g id="tags"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Look out the window.</text>
<text class="b" x="120" y="176" font-size="32">Shift your gaze outward, toward people and the world.</text>
<g id="win"><rect class="s-ink" x="160" y="230" width="540" height="420" fill="var(--stage)" stroke-width="8"/>
<circle class="gain" cx="580" cy="320" r="40"/><path class="s-line" d="M168 560H692" stroke-width="4"/><g id="out6"></g>
<path class="s-ink" d="M430 230V650M160 440H700" stroke-width="8"/></g>
<g id="gz6"><path class="s-gain" d="M430 586L560 360" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><path class="s-gain" d="M430 586L300 470" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/></g>
<g id="me6"></g>
<g id="q6"><rect class="s-line" x="800" y="240" width="680" height="220" rx="18" fill="var(--stage)" stroke-width="3"/><g id="q6p"></g>
<rect class="s-ink" x="960" y="280" width="380" height="80" rx="40" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="1150" y="332" font-size="34" text-anchor="middle">How was your day?</text>
<text class="m" x="1150" y="430" font-size="20" text-anchor="middle">ASK, THEN TRULY LISTEN</text></g>
<g id="h6"><rect class="s-line" x="800" y="490" width="680" height="220" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="880" y="560" width="100" height="80" rx="6"/><path d="M930 560v80M880 596h100" stroke="var(--on-gain)" stroke-width="6"/>
<path class="s-gain" d="M930 560c-30-30-40 0 0 0c30-30 40 0 0 0" fill="none" stroke-width="5"/>
<path class="ink" d="M850 650h160q16 0 16 16v8H850z"/>
<text class="d5" x="1060" y="600" font-size="34">A small kindness.</text>
<text class="m" x="1060" y="646" font-size="20">NO CREDIT NEEDED</text></g>
<g id="c6"><text class="d" x="120" y="820" font-size="40">Attention on others leaves less room for self-watching.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Set it down.</text>
<text class="b" x="120" y="176" font-size="32">Self-focus is a heavy backpack you carry everywhere.</text>
<g id="sun7"><g id="sunr"><circle class="gain" cx="1250" cy="540" r="80"/><g id="rays7"></g></g></g>
<path class="s-line" d="M120 720H1480" stroke-width="5" stroke-linecap="round"/>
<g id="s7w"><g id="walker"><path class="s-ink" d="M585 586L575 720M615 586L625 720" stroke-width="12" stroke-linecap="round"/></g>
<g id="pack"><rect class="loss" x="470" y="440" width="100" height="160" rx="20"/><path class="s-ink" d="M490 440q30-40 60 0" fill="none" stroke-width="6"/>
<text class="m" x="520" y="530" font-size="22" text-anchor="middle" style="fill:var(--stage)">ME</text></g></g>
<g id="rel"><text class="d" x="760" y="400" font-size="56" style="fill:var(--gain)">Relief.</text><path class="s-gain" d="M690 350q14 20 0 40M716 336q22 34 0 68" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="c7"><text class="d" x="120" y="820" font-size="48">You stop performing, and you start living.</text></g>
</g>

<g id="s8" opacity="0">
<text class="m" x="143" y="170" font-size="26">TODAY’S CHALLENGE</text>
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Next time you wonder</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">what people think,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">ask about <tspan style="fill:var(--gain)">someone else</tspan>.</text></g>
<g id="lt"><text class="m" x="143" y="680" font-size="26">NOTICE HOW MUCH LIGHTER YOU FEEL</text></g>
<g id="notew"><g id="note"><rect class="gain" x="-120" y="-100" width="240" height="200" rx="8"/><text class="d" x="0" y="50" font-size="140" text-anchor="middle" style="fill:var(--on-gain)">?</text></g></g>
</g>