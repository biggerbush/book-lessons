<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Meet your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">pain-body.</text>
<text class="b" x="120" y="600" font-size="32">Why small things spark big feelings, and how to calm them</text>
<path class="s-line" d="M1100 540h380" stroke-width="5" stroke-linecap="round"/>
<g id="b0"></g>
<g id="zz"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Old pain adds up.</text>
<text class="b" x="120" y="176" font-size="32">Pain we never fully faced leaves a residue.</text>
<circle class="s-ink" cx="420" cy="330" r="70" fill="none" stroke-width="6"/>
<path class="s-ink" d="M220 820V600a200 160 0 0 1 400 0v220z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<g id="cl1"></g>
<g id="dots"></g>
<g id="r10"><text class="d5" x="800" y="400" font-size="44">Pain never fully faced</text></g>
<g id="r11"><text class="d5" x="800" y="510" font-size="44">leaves a residue,</text></g>
<g id="r12"><text class="d5" x="800" y="620" font-size="44">gathering into one field:</text><text class="d" x="800" y="710" font-size="64" style="fill:var(--loss)">the pain-body.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Asleep, then awake.</text>
<text class="b" x="120" y="176" font-size="32">Most of the time it lies dormant. Then something small wakes it.</text>
<g id="b2"></g>
<path id="grip2" class="s-loss" d="M540 470C610 330 750 330 795 430" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
<g id="f2"></g>
<path id="spk" class="s-ink" d="M990 400l-60 50 40 10-70 60 30 6-60 50" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="tg">
<rect class="s-ink" x="1020" y="300" width="440" height="84" rx="42" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1240" y="351" font-size="24" text-anchor="middle">A TONE OF VOICE</text>
<rect class="s-ink" x="1020" y="430" width="440" height="84" rx="42" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1240" y="481" font-size="24" text-anchor="middle">AN OLD MEMORY</text>
</g>
<text id="st2" class="m" x="560" y="840" font-size="26" text-anchor="middle">DORMANT</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">It feeds on drama.</text>
<text class="b" x="120" y="176" font-size="32">Pain feeds thoughts. Thoughts feed more pain.</text>
<g id="b3"></g>
<g id="l3"><text class="m" x="400" y="720" font-size="24" text-anchor="middle">HUNGRY FOR MORE PAIN</text></g>
<g id="cyc"><circle class="s-loss" cx="1100" cy="510" r="190" fill="none" stroke-width="6" stroke-dasharray="16 14"/>
<g id="arw"><path class="loss" d="M1274 500h32l-16 28z"/><path class="loss" d="M894 520h32l-16-28z"/></g></g>
<g id="n3a"><rect class="s-ink" x="920" y="280" width="360" height="80" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="1100" y="328" font-size="22" text-anchor="middle">GLOOMY, ANGRY THOUGHTS</text></g>
<g id="n3b"><rect class="s-ink" x="920" y="660" width="360" height="80" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="1100" y="708" font-size="22" text-anchor="middle">MORE EMOTION</text></g>
<g id="pel"></g>
<g id="sp3"><text class="d" x="120" y="830" font-size="44">The loop turns until it has had its fill.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A small remark.</text>
<text class="b" x="120" y="176" font-size="32">Close relationships are where pain-bodies love to flare.</text>
<path id="lnk" class="s-loss" d="M250 452C250 290 1350 290 1350 452" fill="none" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
<g id="b4a"></g>
<g id="b4b"></g>
<g id="f4"></g>
<g id="tb4">
<rect class="ink" x="380" y="630" width="840" height="18" rx="6"/>
<path class="s-ink" d="M440 648v50M1160 648v50" stroke-width="8" stroke-linecap="round"/>
<ellipse class="s-ink" cx="640" cy="620" rx="60" ry="10" fill="var(--stage)" stroke-width="4"/>
<ellipse class="s-ink" cx="960" cy="620" rx="60" ry="10" fill="var(--stage)" stroke-width="4"/>
</g>
<g id="bub4">
<rect class="s-ink" x="880" y="205" width="320" height="76" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1100 281l20 34 10-34" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1040" y="251" font-size="22" text-anchor="middle">A MILD COMMENT</text>
</g>
<g id="ang4"><g id="bst"></g><text class="d" x="460" y="284" font-size="78" text-anchor="middle" style="fill:var(--stage)">!</text></g>
<g id="bars4">
<text class="m" x="120" y="738" font-size="22">WORDS</text><rect class="ink" x="320" y="718" width="70" height="26" rx="6"/>
<text class="m" x="120" y="808" font-size="22">REACTION</text><rect id="rbar" class="loss" x="320" y="788" width="0" height="26" rx="6"/>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">It hates being seen.</text>
<text class="b" x="120" y="176" font-size="32">It survives only while you mistake it for yourself.</text>
<g id="cone5"><path class="gain" d="M610 230h60l200 470h-460z" fill-opacity=".22"/><ellipse class="gain" cx="640" cy="700" rx="230" ry="24" fill-opacity=".3"/><rect class="ink" x="600" y="210" width="80" height="30" rx="8"/></g>
<g id="b5"></g>
<g id="f5"></g>
<path id="sl5" class="s-gain" d="M1110 450L860 560" fill="none" stroke-width="4" stroke-dasharray="8 10"/>
<g id="eye5"><path class="s-gain" d="M1110 330q90-70 180 0q-90 70-180 0z" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="1192" cy="332" r="22"/></g>
<g id="lb5a"><text class="m" x="640" y="780" font-size="24" text-anchor="middle" style="fill:var(--loss)">THE ONE WHO IS CONSUMED</text></g>
<g id="lb5b"><text class="m" x="1200" y="780" font-size="24" text-anchor="middle" style="fill:var(--gain)">THE ONE WHO NOTICES</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stay present with it.</text>
<text class="b" x="120" y="176" font-size="32">Don’t fight it. Don’t feed it with stories.</text>
<circle id="glo" class="gain" cx="420" cy="520" r="200" fill-opacity=".2"/>
<circle id="br6" class="s-gain" cx="420" cy="520" r="220" fill="none" stroke-width="5"/>
<g id="f6"></g>
<g id="c6a"><rect class="s-ink" x="800" y="228" width="300" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="970" y="272" font-size="24" text-anchor="middle">FIGHT IT</text></g>
<g id="x6a"><circle class="loss" cx="840" cy="263" r="20"/><path d="M831 254l18 18M849 254l-18 18" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/></g>
<g id="c6b"><rect class="s-ink" x="1130" y="228" width="350" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="1325" y="272" font-size="24" text-anchor="middle">FEED IT STORIES</text></g>
<g id="x6b"><circle class="loss" cx="1170" cy="263" r="20"/><path d="M1161 254l18 18M1179 254l-18 18" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/></g>
<circle id="gl6" class="gain" cx="1140" cy="480" r="0" fill-opacity=".25"/>
<g id="ry6"></g>
<circle id="dk6" class="gain" cx="1140" cy="480" r="0"/>
<g id="cl6"></g>
<g id="sp6"></g>
<g id="lb6"><text id="l6t" class="m" x="1140" y="830" font-size="24" text-anchor="middle">OLD PAIN</text></g>
<g id="ft6"><text class="m" x="420" y="800" font-size="24" text-anchor="middle" style="fill:var(--gain)">FEEL IT FULLY. STAY ALERT.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Name it early.</text>
<text class="b" x="120" y="176" font-size="32">A simple inner note: this is the pain-body.</text>
<g id="b7"></g>
<text id="lt7a" class="m" x="300" y="790" font-size="24" text-anchor="middle">TRIGGER</text>
<g id="tag7"><path class="s-ink" d="M390 440L470 370" stroke-width="3"/><rect class="gain" x="440" y="300" width="400" height="70" rx="10"/><circle cx="462" cy="335" r="8" fill="var(--stage)"/>
<text class="m" x="660" y="344" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">THIS IS THE PAIN-BODY</text></g>
<g id="ps7"><path class="s-muted" d="M450 560H790" stroke-width="5" stroke-dasharray="10 10"/><circle class="gain" cx="880" cy="560" r="80"/>
<rect x="852" y="525" width="18" height="70" rx="4" fill="var(--on-gain)"/><rect x="890" y="525" width="18" height="70" rx="4" fill="var(--on-gain)"/>
<text class="m" x="880" y="790" font-size="24" text-anchor="middle">SPACE</text></g>
<g id="dr7"><path class="s-muted" d="M970 560H1170m-20-18 20 18-20 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="gain" x="1200" y="380" width="200" height="340"/><polygon id="dp" class="ink" points="1200,380 1400,380 1400,720 1200,720"/>
<rect class="s-ink" x="1200" y="380" width="200" height="340" fill="none" stroke-width="6"/>
<text class="m" x="1300" y="790" font-size="24" text-anchor="middle" style="fill:var(--gain)">YOUR CHOICE</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="143" y="250" font-size="26">NEXT TIME A TINY THING SPARKS A HUGE FEELING, PAUSE.</text></g>
<g id="qa"><text class="d" x="136" y="390" font-size="80" letter-spacing="-2">Can you watch the</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="80" letter-spacing="-2">pain-body instead of letting</text></g>
<g id="qc"><text class="d" x="136" y="590" font-size="80" letter-spacing="-2">it speak <tspan style="fill:var(--gain)">for you?</tspan></text></g>
<g id="wl8"><text class="m" x="143" y="720" font-size="26">WATCH IT. DON’T FEED IT.</text></g>
<g id="g8"><g id="b8"></g><path class="s-gain" d="M1290 760q70-50 140 0q-70 50-140 0z" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="1352" cy="762" r="16"/></g>
</g>