</g>
<g id="st"><text class="d" x="120" y="800" font-size="40">You don’t need the storm’s name to carry an umbrella.</text></g>
</g>

<g id="s8" opacity="0">
<text class="m" x="143" y="220" font-size="26">YOUR CHALLENGE</text>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Could your <tspan style="fill:var(--gain)">money, health</tspan></text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">or work</tspan> survive a hit</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">you never saw coming?</text></g>
