<text class="m" x="220" y="670" font-size="20" text-anchor="middle">PRODUCT</text></g>
<g id="vanW"><g id="van"><rect class="gain" x="0" y="500" width="140" height="84" rx="8"/><rect class="ink" x="144" y="526" width="60" height="58" rx="10"/>
<circle class="ink" cx="40" cy="596" r="18"/><circle class="ink" cx="164" cy="596" r="18"/></g></g>
<g id="cust"><text class="m" x="1330" y="670" font-size="20" text-anchor="middle">CUSTOMERS</text></g>
<g id="sell"><text class="d" x="120" y="330" font-size="48">Great products do not sell themselves.</text></g>
<g id="nox"><path class="s-loss" d="M720 560l60 60M780 560l-60 60" stroke-width="9" stroke-linecap="round"/></g>
<g id="shelf"><path class="s-ink" d="M140 820H560M150 820V720M550 820V720" stroke-width="6" stroke-linecap="round"/>
<rect class="gain" x="180" y="740" width="90" height="80" rx="6"/><rect class="gain" x="290" y="740" width="90" height="80" rx="6"/><rect class="gain" x="400" y="740" width="90" height="80" rx="6"/>
<path class="s-muted" d="M200 724h40M320 716h50M420 724h40" stroke-width="3" stroke-dasharray="4 6"/>
<text class="m" x="620" y="776" font-size="22">EVEN A CLEVER INVENTION</text>
<text class="m" x="620" y="812" font-size="22" style="fill:var(--loss)">JUST SITS ON A SHELF</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">6. Durability. 7. Secrets.</text>
<g id="q6"><text class="m" x="120" y="260" font-size="22">QUESTION 6 · STILL DEFENSIBLE?</text>
<path class="s-muted" d="M150 560H720m-16-14 16 14-16 14" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cards"></g>
<g id="q7"><text class="m" x="860" y="260" font-size="22">QUESTION 7 · THE SECRET</text>
<rect class="s-ink" x="880" y="290" width="260" height="330" rx="8" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="1010" cy="420" r="30"/><path class="ink" d="M995 440l-12 60h54l-12-60z"/>
<polygon id="beam" class="gain" points="1030,430 1460,330 1460,530" fill-opacity=".3"/>
<path class="gain" d="M1390 400l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z"/>
<text class="m" x="860" y="670" font-size="22">AN OPPORTUNITY OTHERS DON’T SEE</text></g>
<g id="obv"><text class="d5" x="120" y="770" font-size="42" fill-opacity=".6">“The world needs green power.”</text>
<text class="m" x="120" y="830" font-size="22" style="fill:var(--loss)">THE OBVIOUS IDEA, NOT A SECRET</text></g>
<line id="ostk" class="s-ink" x1="112" y1="756" x2="112" y2="756" stroke-width="5" stroke-linecap="round"/>
</g>

<g id="s6" opacity="0">
