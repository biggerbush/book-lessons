<text class="m" x="340" y="750" font-size="20" text-anchor="middle">AN EMOTION GRABS YOU</text>
</g>
<g id="n1">
<path class="s-muted" d="M500 460h170m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
