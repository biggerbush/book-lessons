<circle cx="760" cy="335" r="22" fill="var(--muted)" fill-opacity=".5"/><circle cx="790" cy="325" r="28" fill="var(--muted)" fill-opacity=".5"/><circle cx="820" cy="337" r="20" fill="var(--muted)" fill-opacity=".5"/>
<circle class="loss" cx="770" cy="430" r="34"/><path class="loss" d="M739 573v-44a51 51 0 0 1 102 0v44z"/>
</g>
