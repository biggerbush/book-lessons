</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">One sentence.</text>
<text class="b" x="120" y="176" font-size="32">Pink shares a story about President John F. Kennedy.</text>
<g id="bub"><rect class="s-ink" x="300" y="250" width="1000" height="170" rx="30" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M420 417L450 490L500 417" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="800" y="352" font-size="50" text-anchor="middle">“A great man is one sentence.”</text>
