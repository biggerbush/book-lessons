<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The art of the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">graceful <tspan style="fill:var(--gain)">no</tspan>.</text>
<text class="b" x="120" y="600" font-size="32">Kind, firm refusals that protect your time for what matters.</text>
<g id="t0p"></g>
<g id="t0b"><g id="t0i">
<rect class="s-ink" x="1080" y="230" width="380" height="210" rx="40" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1220 438l40 56 10-58" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<text class="d" x="1270" y="385" font-size="130" text-anchor="middle" style="fill:var(--gain)">No.</text>
</g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why no feels hard.</text>
<text class="b" x="120" y="176" font-size="32">We fear letting people down, so we say yes to almost everything.</text>
<g id="c1"><g id="c1p"></g>
<rect class="s-ink" x="130" y="270" width="300" height="90" rx="24" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="280" y="326" font-size="30" text-anchor="middle">Can you help?</text>
<text class="m" x="230" y="650" font-size="20" text-anchor="middle">COLLEAGUE</text></g>
<g id="y1"><g id="y1p"></g><text class="m" x="560" y="650" font-size="20" text-anchor="middle">YOU</text></g>
<g id="b1"><rect class="gain" x="490" y="270" width="140" height="90" rx="24"/><text class="d" x="560" y="329" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Yes!</text></g>
<g id="f1"><circle cx="547" cy="434" r="4" fill="var(--stage)"/><circle cx="573" cy="434" r="4" fill="var(--stage)"/>
<path d="M546 458q14-10 28 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
<path class="loss" d="M616 408q10 14 0 22q-10-8 0-22z"/></g>
<rect class="s-line" x="840" y="250" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="290" font-size="20">YOUR WEEK</text>
<g id="w1"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Decision vs. person.</text>
<text class="b" x="120" y="176" font-size="32">Turning down a request is not turning down the person.</text>
<line id="sl2" class="s-muted" x1="800" y1="230" x2="800" y2="230" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
<g id="dc2"><rect class="s-ink" x="330" y="250" width="140" height="190" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M355 300h90M355 340h90M355 380h60" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="400" y="490" font-size="20" text-anchor="middle">THE DECISION</text></g>
<g id="x2"><path class="s-loss" d="M320 260L480 430M480 260L320 430" stroke-width="12" stroke-linecap="round"/></g>
<g id="pr2"><g id="pr2p"></g><text class="m" x="1200" y="490" font-size="20" text-anchor="middle">THE RELATIONSHIP</text></g>
<g id="h2"></g>
<g id="dk2"><g id="dkp"></g><rect class="ink" x="170" y="770" width="300" height="14" rx="4"/>
<text class="m" x="320" y="820" font-size="20" text-anchor="middle">PETER DRUCKER</text></g>
<g id="rc2"><g id="rcp"></g><text class="m" x="1280" y="820" font-size="20" text-anchor="middle">MIHALY CSIKSZENTMIHALYI</text></g>
<g id="lt2"><text class="m" x="800" y="600" font-size="20" text-anchor="middle" style="fill:var(--gain)">A COURTEOUS, GENEROUS NO</text></g>
<g id="h2b"></g>
