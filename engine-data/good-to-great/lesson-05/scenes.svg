<g id="s0">
<text class="m" x="120" y="150" font-size="28">GOOD TO GREAT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Find your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Hedgehog Concept.</text>
<text class="b" x="120" y="600" font-size="32">Why great companies master one big thing instead of many.</text>
<g id="qm"><text id="qmt" class="d" x="1300" y="330" font-size="180" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="fh0"></g>
