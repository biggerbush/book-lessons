<path class="s-ink" d="M920 570h170V420" fill="none" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="ink" cx="1090" cy="400" r="30"/>
</g>
<g id="bars"></g>
<g id="anti"><text class="d" x="880" y="650" font-size="48" style="fill:var(--gain)">Antifragile</text></g>
<g id="design"><text class="d" x="120" y="800" font-size="52">Children are antifragile by design.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Germs train the immune system.</text>
<text class="b" x="120" y="176" font-size="32">It has to meet everyday germs to learn how to fight them.</text>
