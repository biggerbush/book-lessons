</g>
<g id="rare"><text class="m" x="1320" y="810" font-size="20" text-anchor="middle">RARELY TURNED</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. The preacher.</text>
<text class="b" x="120" y="176" font-size="32">Phil Tetlock: we slip into familiar mental roles.</text>
<g id="rl1"></g>
<g id="pre">
<g id="pfig"></g>
