<g id="q8_st1">
<circle cx="1000" cy="490" r="75" fill="var(--stage)" stroke="var(--line)" stroke-width="5"/>
<g id="q8_fig"></g>
<g id="q8_arm"><path class="s-ink" d="M1004 504L1032 452" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="1034" cy="446" r="12"/></g>
<text class="m" x="1110" y="474" font-size="20">STEP 2</text>
<text class="d5" x="1110" y="518" font-size="34">Celebrate</text>
</g>
<path id="q8_a2" class="s-muted" d="M1000 578v42m-14-14 14 14 14-14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="q8_st2">
<g id="q8_sunr"></g>
<circle class="gain" cx="1000" cy="708" r="40"/>
<text class="m" x="1110" y="692" font-size="20">STEP 3</text>
<text class="d5" x="1110" y="736" font-size="34" style="fill:var(--gain)">Feel the Shine</text>
</g>
</g>