<g id="snap"><text class="d" x="120" y="830" font-size="44">Push hard for a week, then snap right back.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The power of microshifts.</text>
<text class="b" x="120" y="176" font-size="32">Changes so small they feel safe.</text>
<g id="c1"><rect class="s-line" x="120" y="240" width="420" height="200" rx="18" fill="var(--stage)" stroke-width="3"/><path class="gain" d="M185 330h90l-7 90h-76z"/><path class="s-ink" d="M180 280h100l-12 140h-76z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="320" y="330" font-size="20">ONE EXTRA</text><text class="m" x="320" y="362" font-size="20">GLASS OF WATER</text></g>
<g id="c2"><rect class="s-line" x="120" y="470" width="420" height="200" rx="18" fill="var(--stage)" stroke-width="3"/><path class="gain" d="M230 570V518A52 52 0 0 1 275 544z"/><circle class="s-ink" cx="230" cy="570" r="52" fill="none" stroke-width="6"/><path class="s-ink" d="M230 570V530" stroke-width="6" stroke-linecap="round"/><text class="m" x="320" y="560" font-size="20">TEN MINUTES ON</text><text class="m" x="320" y="592" font-size="20">AVOIDED WORK</text></g>
<g id="steps"></g>
