<g id="bub1"><rect class="s-ink" x="1190" y="270" width="220" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><text class="m" x="1300" y="310" font-size="24" text-anchor="middle">IT’S A 9.</text></g>
<g id="flip"><path class="s-gain" d="M360 380Q800 200 1240 380" fill="none" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path class="s-gain" d="M1212 352l28 28-38 8" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="262" font-size="20" text-anchor="middle" style="fill:var(--gain)">SEE IT THROUGH THEIR EYES</text></g>
<g id="spk"><g id="sburst"></g><text class="d" x="120" y="800" font-size="44">Feel the sting? Stay curious, don’t fight.</text></g>
