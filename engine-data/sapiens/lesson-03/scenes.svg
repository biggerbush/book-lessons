<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The surprising lives</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of foragers.</text>
<text class="b" x="120" y="600" font-size="32">Why Stone Age life was richer than we usually imagine.</text>
<circle id="sun" class="gain" cx="1250" cy="290" r="44"/>
<path class="s-ink" d="M1160 672h320" stroke-width="6" stroke-linecap="round"/>
<g id="fgr"><circle class="ink" cx="1330" cy="520" r="36"/><path class="ink" d="M1276 671v-47a54 54 0 0 1 108 0v47z"/><path class="s-ink" d="M1410 672V400" stroke-width="7" stroke-linecap="round"/><polygon class="ink" points="1410,366 1396,404 1424,404"/></g>
<g id="q0"><text class="d" x="1170" y="520" font-size="100" style="fill:var(--gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old story.</text>
<text class="b" x="120" y="176" font-size="32">How we usually picture the Stone Age.</text>
<g id="cave"><path class="s-ink" d="M160 660C160 340 560 340 560 660" fill="var(--line)" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M140 660h440" stroke-width="6" stroke-linecap="round"/><g id="cavep"></g><text class="m" x="160" y="710" font-size="20">HUNGRY · DIRTY · DESPERATE</text></g>
<g id="farr"><path class="s-muted" d="M600 620L1050 370" stroke-width="7" stroke-linecap="round"/><path class="s-muted" d="M1010 366l40 4-18 36" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="620" y="360" font-size="20">THEN FARMING SAVES THEM</text>
<rect class="s-ink" x="1120" y="500" width="140" height="140" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1100 506L1190 430L1280 506" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect class="ink" x="1170" y="570" width="40" height="70"/>
<path class="s-gain" d="M1320 640V520M1370 640V520M1420 640V520" stroke-width="5"/><ellipse class="gain" cx="1320" cy="506" rx="9" ry="20"/><ellipse class="gain" cx="1370" cy="506" rx="9" ry="20"/><ellipse class="gain" cx="1420" cy="506" rx="9" ry="20"/>
<path class="s-ink" d="M1100 640h380" stroke-width="6" stroke-linecap="round"/><text class="m" x="1100" y="710" font-size="20">FARMS</text></g>
<g id="harq"><circle class="gain" cx="830" cy="570" r="40"/><text class="d" x="830" y="590" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">?</text><text class="d" x="120" y="800" font-size="46">Harari: the real picture is more surprising.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A walking library.</text>
<text class="b" x="120" y="176" font-size="32">Everything she needed, she carried in her head.</text>
<g id="hd"><circle class="s-ink" cx="380" cy="470" r="170" fill="var(--stage)" stroke-width="7"/><path class="ink" d="M210 790v-30a170 100 0 0 1 340 0v30z"/></g>
<g id="map"><ellipse class="s-muted" cx="340" cy="440" rx="80" ry="50" fill="none" stroke-width="4"/><ellipse class="s-muted" cx="340" cy="440" rx="42" ry="24" fill="none" stroke-width="4"/><path class="s-muted" d="M255 555C320 500 420 560 515 470" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M290 360L440 410L470 540" fill="none" stroke-width="5" stroke-dasharray="10 10"/><circle class="gain" cx="290" cy="360" r="10"/><circle class="gain" cx="440" cy="410" r="10"/><circle class="gain" cx="470" cy="540" r="10"/><text class="m" x="380" y="610" font-size="18" text-anchor="middle">MENTAL MAP</text></g>
<g id="mush"><path class="gain" d="M710 330a50 42 0 0 1 100 0z"/><rect class="ink" x="746" y="330" width="28" height="56" rx="6"/><path class="loss" d="M870 330a50 42 0 0 1 100 0z"/><circle cx="905" cy="312" r="6" fill="var(--stage)"/><circle cx="935" cy="318" r="5" fill="var(--stage)"/><rect class="ink" x="906" y="330" width="28" height="56" rx="6"/><text class="m" x="760" y="420" font-size="20" text-anchor="middle">FOOD</text><text class="m" x="920" y="420" font-size="20" text-anchor="middle" style="fill:var(--loss)">POISON</text></g>
<g id="trk"><text class="m" x="700" y="640" font-size="20">TRACKS</text></g>
<g id="sea"><circle class="s-ink" cx="1300" cy="330" r="80" fill="none" stroke-width="6"/><path class="s-line" d="M1300 250v160M1220 330h160" stroke-width="4"/><circle id="seaD" class="gain" r="16"/><text class="m" x="1300" y="450" font-size="20" text-anchor="middle">SEASONS</text></g>
<g id="knf"><polygon class="ink" points="1190,570 1300,520 1450,555 1310,605"/><path d="M1260 545L1290 590M1340 535L1365 595" stroke="var(--stage)" stroke-width="4"/><text class="m" x="1320" y="650" font-size="20" text-anchor="middle">STONE KNIFE</text></g>
<g id="dep"><text class="d" x="700" y="740" font-size="48">Her life depended on it</text><text class="d" x="700" y="800" font-size="48" style="fill:var(--gain)">every single day.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Broad skills.</text>
<text class="b" x="120" y="176" font-size="32">Each forager had to master almost everything.</text>
<g id="w0"><text class="m" x="440" y="770" font-size="22" text-anchor="middle">FORAGER</text></g>
<g id="w1"><text class="m" x="1160" y="770" font-size="22" text-anchor="middle">TODAY</text></g>
<g id="exs"><text class="m" x="1440" y="240" font-size="20" text-anchor="end">EXPERTS</text></g>
<g id="wide"><text class="d" x="120" y="840" font-size="38">Harari: wider knowledge of her surroundings than most of us.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A varied menu.</text>
<text class="b" x="120" y="176" font-size="32">What might a forager eat in a single meal?</text>
<g id="plate"><circle class="s-ink" cx="460" cy="500" r="230" fill="var(--stage)" stroke-width="6"/><text class="m" x="460" y="800" font-size="22" text-anchor="middle">FORAGER</text></g>
<g id="ring"></g>
<g id="foods"></g>
<g id="fb"><text class="m" x="120" y="846" font-size="20" style="fill:var(--gain)">IF ONE FOOD FAILS, PLENTY OF OTHERS REMAIN</text></g>
<g id="bowl"><text class="m" x="820" y="510" font-size="28">VS</text><g id="grains"></g><path class="ink" d="M1020 480h320a160 140 0 0 1-320 0z"/><text class="m" x="1180" y="690" font-size="22" text-anchor="middle">ONE OR TWO STAPLE CROPS</text><text class="m" x="1180" y="724" font-size="20" text-anchor="middle">WHEAT · RICE</text><text class="m" x="1180" y="800" font-size="22" text-anchor="middle">FARMER</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shorter workdays.</text>
<text class="b" x="120" y="176" font-size="32">How many hours does it take to feed yourself?</text>
<g id="clk"><circle class="s-ink" cx="300" cy="400" r="130" fill="var(--stage)" stroke-width="8"/><circle class="ink" cx="300" cy="292" r="7"/><circle class="ink" cx="300" cy="508" r="7"/><circle class="ink" cx="192" cy="400" r="7"/><circle class="ink" cx="408" cy="400" r="7"/><path id="hh" class="s-ink" d="M300 400v-65" stroke-width="10" stroke-linecap="round"/><path id="mh" class="s-gain" d="M300 400v-100" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="300" cy="400" r="10"/></g>
<g id="brs"><text class="m" x="500" y="320" font-size="22">FORAGER</text><rect id="bf" class="gain" x="500" y="336" width="0" height="44" rx="8"/><text class="m" x="500" y="430" font-size="22">FARMER</text><rect id="bm" class="loss" x="500" y="446" width="0" height="44" rx="8"/><text class="m" x="500" y="530" font-size="18">ILLUSTRATION, NOT TO SCALE</text></g>
<g id="kal"><circle class="gain" cx="1380" cy="300" r="46"/><path d="M1080 500q100-80 200 0t200 0V520H1080z" fill="var(--line)"/><text class="m" x="1080" y="560" font-size="22">KALAHARI DESERT</text><text class="m" x="1080" y="592" font-size="20">A HARSH ENVIRONMENT</text></g>
<g id="wk"><text id="hrs" class="d" x="120" y="730" font-size="96">35–45</text><text class="m" x="124" y="776" font-size="22">HOURS A WEEK</text><g id="days"></g><text class="m" x="600" y="770" font-size="22">HUNT ONLY ONE DAY IN THREE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fewer plagues.</text>
<text class="b" x="120" y="176" font-size="32">Where did epidemics come from?</text>
<g id="bandP"><rect class="s-line" x="120" y="230" width="620" height="510" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">SMALL BANDS, ALWAYS MOVING</text><path class="s-gain" d="M170 640h470" stroke-width="5" stroke-dasharray="12 12"/><path class="s-gain" d="M632 620l24 20-24 20" fill="none" stroke-width="5" stroke-linecap="round"/><g id="band"></g></g>
<g id="vilP"><rect class="s-line" x="800" y="230" width="680" height="510" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="830" y="280" font-size="22">CROWDED VILLAGES</text><g id="houses"></g><g id="germs"></g><text class="m" x="830" y="716" font-size="20">ANIMALS · CROWDS · GERMS</text></g>
<g id="few"><text class="d" x="120" y="820" font-size="44">So foragers suffered far fewer epidemics.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not paradise.</text>
<text class="b" x="120" y="176" font-size="32">The full picture is mixed.</text>
<g id="sto"><circle cx="240" cy="320" r="50" fill="var(--muted)"/><circle cx="310" cy="285" r="60" fill="var(--muted)"/><circle cx="380" cy="320" r="50" fill="var(--muted)"/><rect x="240" y="320" width="140" height="50" fill="var(--muted)"/><polygon class="loss" points="315,375 285,450 312,450 292,520 355,430 325,430 345,375"/><text class="m" x="140" y="560" font-size="20">LIFE COULD BE VIOLENT AND HARSH</text></g>
<g id="bab"><circle class="s-ink" cx="300" cy="612" r="26" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M200 640a100 60 0 0 0 200 0z"/><path class="s-ink" d="M190 712q110 30 220 0" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="140" y="770" font-size="20">MANY CHILDREN DIED YOUNG</text></g>
<g id="scl"><path class="s-ink" d="M1060 300V760M960 760h200" stroke-width="10" stroke-linecap="round"/><g id="beam"><path class="s-ink" d="M760 300h600" stroke-width="10" stroke-linecap="round"/></g><circle class="ink" cx="1060" cy="300" r="16"/>
<g id="panL"><path class="s-ink" d="M0 0L-110 200M0 0L110 200" stroke-width="4"/>
<g id="wt0"><rect class="gain" x="-75" y="162" width="150" height="36" rx="8"/><text class="m" x="0" y="187" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">DIET</text></g>
<g id="wt1"><rect class="gain" x="-75" y="122" width="150" height="36" rx="8"/><text class="m" x="0" y="147" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">SKILLS</text></g>
<g id="wt2"><rect class="gain" x="-75" y="82" width="150" height="36" rx="8"/><text class="m" x="0" y="107" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">LEISURE</text></g>
<path class="ink" d="M-120 200h240a120 50 0 0 1-240 0z"/><text class="m" x="0" y="290" font-size="22" text-anchor="middle">FORAGER</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-110 200M0 0L110 200" stroke-width="4"/><path class="ink" d="M-120 200h240a120 50 0 0 1-240 0z"/><text class="m" x="0" y="290" font-size="22" text-anchor="middle">FARMER</text></g></g>
<g id="bet"><text class="d" x="120" y="840" font-size="38">On diet, skills and leisure, the forager often did better.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Think of one survival skill</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">your ancestors had</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">that you have <tspan style="fill:var(--gain)">lost.</tspan></text></g>
<g id="qd"><text class="m" x="143" y="640" font-size="26">THIS WEEK, LEARN A SMALL PIECE OF IT</text><text class="b" x="143" y="700" font-size="32">Cook a new plant, or read the night sky.</text></g>
<g id="sky"></g>
</g>