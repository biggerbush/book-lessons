<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 7 HABITS OF HIGHLY EFFECTIVE PEOPLE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Be proactive:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">own your response.</text>
<text class="b" x="120" y="600" font-size="32">The power hiding in the pause before you react.</text>
<g id="t0storm"><g id="t0cl"></g><path id="t0bolt" class="loss" d="M1324 292l-36 56h28l-20 52 50-72h-30l18-36z"/></g>
<g id="t0pause"><rect class="gain" x="1282" y="430" width="18" height="60" rx="4"/><rect class="gain" x="1320" y="430" width="18" height="60" rx="4"/></g>
<g id="t0p"></g>
<g id="t0spk"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A cell and a choice.</text>
<text class="b" x="120" y="176" font-size="32">Viktor Frankl: a psychiatrist imprisoned in Nazi death camps.</text>
<text class="m" x="120" y="270" font-size="20">WHAT HIS CAPTORS CONTROLLED</text>
<g id="f1chips"></g>
<g id="f1man"></g>
<g id="f1light"><circle class="gain" cx="800" cy="590" r="18"/><circle id="f1halo" class="s-gain" cx="800" cy="590" r="30" fill="none" stroke-width="4"/></g>
<rect id="f1rect" class="s-ink" x="560" y="240" width="480" height="540" rx="8" fill="none" stroke-width="8"/>
<g id="f1bars"></g>
<g id="f1one"><text class="m" x="1072" y="420" font-size="22">ONE THING STAYED HIS OWN</text></g>
<g id="f1resp"><path class="s-gain" d="M872 570L1060 516" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><text class="d" x="1072" y="500" font-size="44" style="fill:var(--gain)">His response.</text><text class="m" x="1072" y="546" font-size="22">HOW IT AFFECTS HIM INSIDE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stimulus, gap, response.</text>
<text class="b" x="120" y="176" font-size="32">Something happens. You react. In between sits a space.</text>
<g id="g2in"><text class="m" x="140" y="420" font-size="22">WHAT HAPPENS TO YOU</text><path class="s-loss" d="M140 480H596" stroke-width="8" stroke-linecap="round"/><path class="loss" d="M624 480l-34-22v44z"/></g>
<g id="g2gap"><rect class="s-gain" x="640" y="360" width="320" height="240" rx="18" fill="var(--gain)" fill-opacity=".14" stroke-width="5" stroke-dasharray="14 10"/><text class="d" x="800" y="335" font-size="44" text-anchor="middle">The gap</text><g id="g2man"></g><text class="m" x="800" y="566" font-size="22" text-anchor="middle" style="fill:var(--ink)">FREEDOM TO CHOOSE</text></g>
<g id="g2out"><text class="m" x="1000" y="420" font-size="22">YOUR RESPONSE</text><path class="s-ink" d="M980 480H1440" stroke-width="8" stroke-linecap="round"/><path class="ink" d="M1470 480l-34-22v44z"/></g>
<g id="g2txt"><text class="d" x="120" y="760" font-size="48">In that gap lives your freedom to choose.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Responsibility, split in two.</text>
<text class="b" x="120" y="176" font-size="32">Response + ability: your ability to choose your response.</text>
<g id="r3w"><text class="d" x="120" y="320" font-size="80" letter-spacing="-2">Response</text><g id="r3b"><text class="d" x="500" y="320" font-size="80" letter-spacing="-2" style="fill:var(--gain)">ability</text></g></g>
<g id="r3L"><rect class="s-line" x="120" y="380" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="425" font-size="22" style="fill:var(--loss)">REACTIVE</text><g id="r3Lc"></g><g id="r3rainL"></g><g id="r3Lp"></g><text class="d5" x="150" y="790" font-size="34">Outside forces run the day.</text></g>
<g id="r3R"><rect class="s-line" x="840" y="380" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="425" font-size="22" style="fill:var(--gain)">PROACTIVE</text><g id="r3Rc"></g><g id="r3rainR"></g><g id="r3Rp"></g><path class="gain" d="M1060 580a100 64 0 0 1 200 0z"/><path class="s-ink" d="M1160 580v110a14 14 0 0 1-28 0" fill="none" stroke-width="6" stroke-linecap="round"/><text class="d5" x="870" y="790" font-size="34">Values guide the day.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen to your words.</text>
<text class="b" x="120" y="176" font-size="32">You can hear reactivity in everyday language.</text>
<g id="w4h"></g>
<g id="w4b"></g>
<g id="w4end"><text class="d" x="120" y="770" font-size="52">I have to <tspan style="fill:var(--muted)">→</tspan> I <tspan style="fill:var(--gain)">choose</tspan> to.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The circle of concern.</text>
<text class="b" x="120" y="176" font-size="32">Everything you worry about.</text>
<g id="c5c"><circle class="s-loss" cx="560" cy="520" r="300" fill="var(--loss)" fill-opacity=".08" stroke-width="6"/><text class="m" x="560" y="300" font-size="22" text-anchor="middle" style="fill:var(--loss)">CONCERN</text></g>
<g id="c5i0"><g transform="translate(-30 -10)"><path class="s-ink" d="M380 370v80h100" fill="none" stroke-width="5" stroke-linecap="round"/><path class="s-loss" d="M392 390l26 20 20-12 34 34" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="430" y="492" font-size="20" text-anchor="middle">ECONOMY</text></g></g>
<g id="c5i1"><g transform="translate(30 -10)"><circle class="ink" cx="668" cy="395" r="20"/><circle class="ink" cx="692" cy="381" r="26"/><circle class="ink" cx="716" cy="395" r="20"/><rect class="ink" x="650" y="395" width="84" height="20" rx="10"/><path class="loss" d="M698 418l-14 22h12l-8 20 22-28h-12l8-14z"/><text class="m" x="690" y="492" font-size="20" text-anchor="middle">WEATHER</text></g></g>
<g id="c5i2"><g transform="translate(-10 -12)"><g id="c5boss"></g><path class="s-loss" d="M396 576l-12-10M464 576l12-10M430 566v-14" stroke-width="5" stroke-linecap="round"/><text class="m" x="430" y="714" font-size="20" text-anchor="middle">BOSS’S TEMPER</text></g></g>
<g id="c5i3"><g transform="translate(30 -12)"><rect class="s-ink" x="640" y="590" width="100" height="80" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M656 612h68M656 632h68M656 652h40" stroke-width="5" stroke-linecap="round"/><text class="m" x="690" y="714" font-size="20" text-anchor="middle">THE NEWS</text></g></g>
<g id="c5r"><g id="c5man"></g><g id="c5flow"></g><text class="m" x="960" y="660" font-size="22">REACTIVE PEOPLE END UP</text><text class="d" x="960" y="720" font-size="40">Blaming others.</text><text class="d" x="960" y="776" font-size="40">Feeling like victims.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The circle of influence.</text>
<text class="b" x="120" y="176" font-size="32">What you can actually affect.</text>
<circle class="s-line" cx="560" cy="520" r="300" fill="none" stroke-width="5"/>
<text class="m" x="560" y="270" font-size="22" text-anchor="middle">CONCERN</text>
<g id="i6c"><circle id="i6ring" class="s-gain" cx="560" cy="520" r="110" fill="none" stroke-width="4"/><circle id="i6r" class="gain" cx="560" cy="520" r="110"/>
<g id="i6w0"><text class="m" x="560" y="528" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">INFLUENCE</text></g>
<g id="i6w1"><text class="m" x="560" y="484" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">HABITS</text><text class="m" x="560" y="528" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">EFFORT</text><text class="m" x="560" y="572" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CHOICES</text></g></g>
<g id="i6grow"><text class="m" x="960" y="300" font-size="22" style="fill:var(--gain)">AS THEY ACT, THE CIRCLE GROWS</text></g>
<g id="i6old"><text id="i6ot" class="d5" x="960" y="430" font-size="30" style="fill:var(--loss)">“If only I had a better boss.”</text></g>
<line id="i6s" class="s-ink" x1="952" y1="420" x2="952" y2="420" stroke-width="5" stroke-linecap="round"/>
<path id="i6arr" class="s-muted" d="M1000 455v60m-16-16 16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="i6new"><text class="d" x="960" y="600" font-size="46" style="fill:var(--gain)">“I can be</text><text class="d" x="960" y="656" font-size="46" style="fill:var(--gain)">more patient.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The 30-day test.</text>
<text class="b" x="120" y="176" font-size="32">For 30 days, work only within your circle of influence.</text>
<g id="d7cal"><rect class="s-ink" x="120" y="230" width="530" height="530" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="120" y="230" width="530" height="64" rx="16"/><text class="m" x="385" y="272" font-size="24" text-anchor="middle" style="fill:var(--stage)">30 DAYS</text><g id="d7cells"></g></g>
<g id="d7r0"><circle class="gain" cx="770" cy="300" r="50"/><path d="M748 300l16 16 30-32" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="860" y="292" font-size="38">Make small commitments.</text><text class="b" x="860" y="334" font-size="28">And keep them.</text></g>
<g id="d7r1"><ellipse class="s-ink" cx="770" cy="476" rx="40" ry="54" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="770" cy="464" r="12"/><path class="ink" d="M752 500a18 18 0 0 1 36 0z"/><path class="s-ink" d="M770 530v16M748 548h44" stroke-width="6" stroke-linecap="round"/><text class="d5" x="860" y="472" font-size="38">Skip the blame.</text><text class="b" x="860" y="514" font-size="28">Ask: what can I do next?</text></g>
<g id="d7r2"><path class="gain" d="M770 704c-50-30-60-70-30-80 14-5 26 2 30 12 4-10 16-17 30-12 30 10 20 50-30 80z"/><text class="d5" x="860" y="652" font-size="38">Compassion, not accusation.</text><text class="b" x="860" y="694" font-size="28">Look at others’ weaknesses kindly.</text></g>
</g>

<g id="s8" opacity="0">
<g id="e8a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pause in the gap.</text></g>
<g id="e8b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">What part of this is</text></g>
<g id="e8c"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">inside <tspan style="fill:var(--gain)">my circle?</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">BE PROACTIVE · OWN YOUR RESPONSE</text>
<g id="e8btn"><circle id="e8ring" class="s-gain" cx="1330" cy="450" r="120" fill="none" stroke-width="5"/><circle class="gain" cx="1330" cy="450" r="110"/><rect x="1290" y="400" width="26" height="100" rx="6" fill="var(--on-gain)"/><rect x="1344" y="400" width="26" height="100" rx="6" fill="var(--on-gain)"/></g>
</g>