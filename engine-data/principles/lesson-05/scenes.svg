<rect class="s-gain" x="1150" y="330" width="200" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="1250" y="374" font-size="24" text-anchor="middle">WHY?</text>
<rect class="s-gain" x="1150" y="430" width="280" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="1290" y="474" font-size="24" text-anchor="middle">TELL ME MORE.</text>
<g id="mag"><circle class="s-ink" cx="1400" cy="280" r="24" fill="none" stroke-width="6"/><path class="s-ink" d="M1418 298l20 20" stroke-width="8" stroke-linecap="round"/></g>
<text class="d5" x="870" y="650" font-size="30">Asks questions. Gets curious.</text></g>
