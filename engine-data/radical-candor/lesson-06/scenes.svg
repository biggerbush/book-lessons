<text class="b" x="120" y="176" font-size="32">Notice each person’s growth trajectory, right now.</text>
<g id="chart"><path class="s-ink" d="M220 260V760H1140" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="240" y="280" font-size="20">GROWTH</text><text class="m" x="1140" y="800" font-size="20" text-anchor="end">TIME</text></g>
