<g id="yw6"><g id="yof"></g><text class="d5" x="1180" y="670" font-size="44" text-anchor="middle" style="fill:var(--gain)">Coach</text></g>
<g id="kw6"><g id="coach"><g id="cof"></g><rect class="s-gain" x="1290" y="230" width="140" height="90" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M1330 275h60m-22-20 22 20-22 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="fw6"><path class="s-gain" d="M960 600H1410M1380 576l30 24-30 24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1180" y="712" font-size="20" text-anchor="middle">ON YOUR SIDE · LOOKS AHEAD</text></g>
<g id="wd6"><text class="d" x="120" y="810" font-size="44">One word changes the help you get.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it this week.</text>
<text class="b" x="120" y="176" font-size="32">One small experiment in asking.</text>
<g id="c71"><rect class="s-line" x="120" y="220" width="420" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="260" y="250" width="140" height="170" rx="10" fill="var(--stage)" stroke-width="6"/><g id="spi7"></g><path class="s-line" d="M290 300h80M290 340h80M290 380h50" stroke-width="6" stroke-linecap="round"/><text class="d5" x="150" y="480" font-size="28">Pick one thing</text><text class="d5" x="150" y="518" font-size="28">you’re working on.</text></g>
<g id="c72"><rect class="s-line" x="590" y="220" width="420" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><g id="mnf"></g><text class="d5" x="620" y="480" font-size="28">Someone credible</text><text class="d5" x="620" y="518" font-size="28">who wants you to succeed.</text></g>
<g id="c73"><rect class="s-line" x="1060" y="220" width="420" height="330" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1090" y="280" font-size="20">INSTEAD OF ASKING</text><text class="d5" x="1090" y="350" font-size="32" fill-opacity=".6">“What did you think?”</text></g>
