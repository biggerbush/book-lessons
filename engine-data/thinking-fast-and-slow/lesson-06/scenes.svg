<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The experiencing and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">remembering selves.</text>
<text class="b" x="120" y="600" font-size="32">Why your memories, not your moments, make your decisions.</text>
<g id="clk"><circle class="s-ink" cx="1300" cy="320" r="110" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g><line id="hh" class="s-ink" x1="1300" y1="320" x2="1300" y2="262" stroke-width="9" stroke-linecap="round"/><line id="mh" class="s-gain" x1="1300" y1="320" x2="1300" y2="236" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1300" cy="320" r="10"/></g>
<g id="t0p"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two selves, one life.</text>
<text class="b" x="120" y="176" font-size="32">One lives each moment. One looks back and keeps score.</text>
<g id="pa1"><rect class="s-line" x="120" y="220" width="620" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="268" font-size="22">EXPERIENCING SELF</text><text class="m" x="150" y="750" font-size="20">LIVES EVERY MOMENT AS IT HAPPENS</text></g>
<g id="pb1"><rect class="s-line" x="860" y="220" width="620" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="890" y="268" font-size="22" style="fill:var(--gain)">REMEMBERING SELF</text><text class="m" x="890" y="750" font-size="20">LOOKS BACK AND KEEPS SCORE</text></g>
<path id="spl" class="s-ink" d="M800 220V780" stroke-width="5" stroke-dasharray="12 12"/>
<g id="bb0"><path class="s-ink" d="M428 372L378 396" stroke-width="5" stroke-linecap="round"/><rect class="s-ink" x="420" y="320" width="160" height="70" rx="35" fill="var(--stage)" stroke-width="5"/><text class="d" x="500" y="367" font-size="32" text-anchor="middle" style="fill:var(--gain)">GOOD</text></g>
<g id="bb1"><path class="s-ink" d="M1188 372L1138 396" stroke-width="5" stroke-linecap="round"/><rect class="s-ink" x="1180" y="320" width="160" height="70" rx="35" fill="var(--stage)" stroke-width="5"/><text class="d" x="1260" y="367" font-size="32" text-anchor="middle" style="fill:var(--loss)">BAD</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The colonoscopy study.</text>
<text class="b" x="120" y="176" font-size="32">Patients rated their pain every minute.</text>
<g id="la"><text class="d" x="130" y="400" font-size="56">A</text><text class="m" x="130" y="444" font-size="22">8 MIN</text><path class="s-line" d="M250 422H1460" stroke-width="4"/></g>
<g id="ba"></g>
<g id="lb"><text class="d" x="130" y="680" font-size="56">B</text><text class="m" x="130" y="724" font-size="22">24 MIN</text><path class="s-line" d="M250 702H1460" stroke-width="4"/></g>
<g id="bb"></g>
<g id="tot"><text class="m" x="260" y="780" font-size="24" style="fill:var(--loss)">B: MORE TOTAL PAIN</text></g>
<g id="rem"><path class="s-loss" d="M666 300h80m-18-16 18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-loss" x="760" y="260" width="520" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="m" x="1020" y="309" font-size="26" text-anchor="middle" style="fill:var(--loss)">A: REMEMBERED AS WORSE</text><text class="m" x="790" y="384" font-size="20">IT ENDED AT A PAINFUL MOMENT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Memory keeps two moments.</text>
<text class="b" x="120" y="176" font-size="32">It does not add up every minute.</text>
<path class="s-line" d="M200 720H1300" stroke-width="4"/>
<text class="m" x="1300" y="756" font-size="20" text-anchor="end">TIME</text>
<path id="pf" class="loss" opacity="0"/>
<path id="pc" class="s-ink" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="pk"><circle class="loss" cx="500" cy="337" r="16"/><text class="m" x="500" y="308" font-size="22" text-anchor="middle" style="fill:var(--loss)">PEAK</text></g>
<g id="eng"><circle id="en" class="ink" cx="1300" cy="450" r="16"/><text id="enl" class="m" x="1300" y="420" font-size="22" text-anchor="middle">END</text></g>
<g id="mem3"><line id="ml" class="s-gain" x1="200" x2="1300" stroke-width="5" stroke-dasharray="14 10"/><text id="mlt" class="m" x="1320" font-size="22" style="fill:var(--gain)">MEMORY</text></g>
<g id="frm"><text class="m" x="124" y="774" font-size="24" style="fill:var(--gain)">THE PEAK-END RULE</text><text class="d" x="120" y="834" font-size="48">Memory ≈ (peak + end) ÷ 2</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Length barely mattered.</text>
<text class="b" x="120" y="176" font-size="32">Many extra minutes of pain, almost the same memory.</text>
<g id="sw4"><rect class="ink" x="310" y="298" width="40" height="30" rx="6"/><circle class="s-ink" cx="330" cy="480" r="150" fill="var(--stage)" stroke-width="10"/><g id="swt"></g><line id="swh" class="s-loss" x1="330" y1="480" x2="330" y2="362" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="330" cy="480" r="12"/></g>
<g id="bars4"><text class="m" x="620" y="340" font-size="22">LENGTH OF THE EXPERIENCE</text><rect id="db" class="loss" x="620" y="360" width="200" height="60" rx="8"/><text class="m" x="620" y="540" font-size="22">HOW BAD IT WAS REMEMBERED</text><rect id="mb" class="loss" x="620" y="560" width="380" height="60" rx="8"/></g>
<g id="lx"><text class="m" x="620" y="460" font-size="20">+ MANY EXTRA MINUTES</text></g>
<g id="lm"><text class="m" x="1040" y="600" font-size="22">BARELY MOVES</text></g>
<g id="dn"><text class="d" x="620" y="770" font-size="64">Duration neglect.</text><text class="m" x="620" y="820" font-size="22" style="fill:var(--gain)">THE LENGTH IS ALMOST IGNORED</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cold water test.</text>
<text class="b" x="120" y="176" font-size="32">Two trials. Which one would you repeat?</text>
<g id="cw0"><rect class="s-line" x="120" y="220" width="620" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="262" font-size="22">TRIAL 1</text></g>
<g id="cw1"><rect id="cwr" x="860" y="220" width="620" height="520" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="890" y="262" font-size="22">TRIAL 2</text></g>
<g id="t1a"><rect class="loss" x="150" y="610" width="360" height="30" rx="6"/><text class="m" x="150" y="680" font-size="20">60 SECONDS</text></g>
<g id="t2a"><rect class="loss" x="890" y="610" width="360" height="30" rx="6"/><text class="m" x="890" y="680" font-size="20">60 SECONDS</text></g>
<g id="t2b"><rect class="loss" x="1250" y="610" width="180" height="30" rx="6" fill-opacity=".45"/><text class="m" x="1256" y="680" font-size="20">+30 WARMER</text></g>
<g id="wrs"><text class="d" x="120" y="800" font-size="40">Same pain, plus extra: strictly worse.</text></g>
<g id="chs"><circle class="gain" cx="1424" cy="264" r="26"/><path d="M1411 264l9 9 17-18" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="120" y="850" font-size="24" style="fill:var(--gain)">YET MOST PEOPLE CHOSE TO REPEAT THE LONGER ONE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A spoiled ending.</text>
<text class="b" x="120" y="176" font-size="32">A long symphony recording, and one screech near the end.</text>
<g id="lis"><path class="s-ink" d="M158 384a32 32 0 0 1 64 0" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="wave6"></g>
<g id="scr"><path class="s-loss" d="M1340 380l12-70 12 130 12-110 12 90 12-120 12 100 12-60 12 40" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1392" y="522" font-size="22" text-anchor="middle" style="fill:var(--loss)">SCREECH</text></g>
<g id="brk"><path class="s-gain" d="M300 498v16h1020v-16" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="300" y="560" font-size="22" style="fill:var(--gain)">WONDERFUL FOR MOST OF THE TIME</text></g>
<g id="rw0"><text class="m" x="120" y="680" font-size="22">EXPERIENCE</text><rect class="gain" x="400" y="650" width="940" height="44" rx="6"/><rect class="loss" x="1340" y="650" width="100" height="44" rx="6"/></g>
<g id="rw1"><text class="m" x="120" y="770" font-size="22">MEMORY</text><rect class="gain" x="400" y="740" width="1040" height="44" rx="6"/><rect id="spo" class="loss" x="1440" y="740" width="0" height="44" rx="6"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who makes the choices?</text>
<text class="b" x="120" y="176" font-size="32">The remembering self decides, based on stories.</text>
<g id="dsk"><g id="dskp"></g><rect class="ink" x="200" y="560" width="520" height="22" rx="4"/><rect class="ink" x="230" y="582" width="18" height="160"/><rect class="ink" x="672" y="582" width="18" height="160"/><text class="m" x="200" y="790" font-size="22" style="fill:var(--gain)">THE REMEMBERING SELF</text></g>
<g id="cd0"><rect class="s-ink" x="200" y="230" width="240" height="64" rx="12" fill="var(--stage)" stroke-width="4"/><text class="m" x="320" y="270" font-size="22" text-anchor="middle">NEXT HOLIDAY</text></g>
<g id="cd1"><rect class="s-ink" x="480" y="230" width="240" height="64" rx="12" fill="var(--stage)" stroke-width="4"/><text class="m" x="600" y="270" font-size="22" text-anchor="middle">NEXT DOCTOR</text></g>
<g id="qt"><rect class="s-gain" x="820" y="230" width="660" height="290" rx="18" fill="var(--stage)" stroke-width="6"/><text class="d" x="860" y="350" font-size="56">“I am my</text><text class="d" x="860" y="420" font-size="56" style="fill:var(--gain)">remembering self.”</text><text class="m" x="860" y="482" font-size="20">DANIEL KAHNEMAN</text></g>
<g id="strg" opacity=".45"></g>
<g id="strl"><text class="m" x="960" y="640" font-size="22">THE EXPERIENCING SELF</text><text class="m" x="960" y="676" font-size="20">LIVES THE HOURS, GETS LITTLE SAY</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Am I choosing for the</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">memory, or for the</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">moments?</text></g>
<path id="gc" class="s-ink" d="M1080 700C1160 560 1240 600 1300 640S1420 740 1460 750" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<circle id="gdot" class="gain" cx="1460" cy="750" r="16"/>
<g id="gnd"><text class="m" x="143" y="700" font-size="26">GIVE GOOD EXPERIENCES A GENTLE ENDING</text></g>
</g>