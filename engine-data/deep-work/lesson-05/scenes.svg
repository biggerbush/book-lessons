</g>
<g id="craft"><text class="d5" x="120" y="810" font-size="40">Benefits clearly outweigh costs, for her most important work.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The farmer’s hay.</text>
<text class="b" x="120" y="176" font-size="32">Forrest Pritchard’s family always made their own hay.</text>
