<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atomic Habits Lesson Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays five scenes, with a transport bar beneath it. */
:root{
  --bg:#E9EEF2; --stage:#F6F8FA; --ink:#12233A; --muted:#5C6B7E; --line:#C5CFD9;
  --gain:#C97F00; --loss:#5562C4; --ice:#BFDDF0; --on-gain:#12233A;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:14px}
@keyframes wmmove{0%{transform:translate(0,0)}25%{transform:translate(-1330px,0)}50%{transform:translate(-1330px,-812px)}75%{transform:translate(0,-812px)}}
.wmc{animation:wmmove 80s step-end infinite}
@media (prefers-reduced-motion:reduce){.wmc{animation:none}}
#stageBox{background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
#stageBox:fullscreen{border:0;border-radius:0;aspect-ratio:auto;display:flex;align-items:center}
svg{display:block;width:100%;height:100%}
.d{font-family:var(--display);font-weight:800;fill:var(--ink)}
.d5{font-family:var(--display);font-weight:500;fill:var(--ink)}
.b{font-family:var(--body);fill:var(--muted)}
.m{font-family:var(--mono);fill:var(--muted);letter-spacing:.04em}
.ink{fill:var(--ink)} .gain{fill:var(--gain)} .loss{fill:var(--loss)}
.s-ink{stroke:var(--ink)} .s-line{stroke:var(--line)} .s-gain{stroke:var(--gain)} .s-loss{stroke:var(--loss)} .s-muted{stroke:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
#play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:86px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--gain)}
#clock{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font-weight:400;font-size:13px;padding:6px 10px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch;margin:4px 0 0}
</style>

<div class="wrap">
  <div id="stageBox">
    <svg viewBox="0 0 1600 900" role="img" aria-label="Animated summary of the second lesson of Atomic Habits: lasting habits come from changing your identity, not chasing outcomes. Seven scenes.">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.6" fill="var(--line)"/></pattern>
      </defs>
      <rect width="1600" height="900" fill="var(--stage)"/>
      <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>

      <!-- 1 Title -->
      <g id="s0">
        <text class="m" x="120" y="150" font-size="28">ATOMIC HABITS · CHAPTER 2</text>
        <text class="d" x="104" y="540" font-size="380" letter-spacing="-12">Who</text>
        <text class="d5" x="120" y="660" font-size="84">comes before what.</text>
        <text class="b" x="120" y="740" font-size="32">Lesson two: habits and identity. Press Play for sound.</text>
        <g transform="translate(1250 430)" fill="none" stroke-width="3">
          <ellipse class="s-line" rx="240" ry="84"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(60)"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(120)"/>
          <circle class="gain" r="36" stroke="none"/>
          <circle id="e0" class="ink" r="13" stroke="none"/><circle id="e1" class="ink" r="13" stroke="none"/><circle id="e2" class="ink" r="13" stroke="none"/>
        </g>
      </g>

      <!-- 2 Three layers -->
      <g id="s1" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Three layers of change.</text>
        <text class="b" x="120" y="176" font-size="32">Where you start decides whether it lasts.</text>
        <g id="ringO"><circle class="s-ink" cx="430" cy="545" r="270" fill="none" stroke-width="5"/><text class="m" x="430" y="315" font-size="24" text-anchor="middle">OUTCOMES</text></g>
        <g id="ringP"><circle class="s-ink" cx="430" cy="545" r="180" fill="none" stroke-width="5"/><text class="m" x="430" y="405" font-size="24" text-anchor="middle">PROCESSES</text></g>
        <circle id="pulse1" class="s-gain" cx="430" cy="545" r="90" fill="none" stroke-width="5" opacity="0"/>
        <circle id="pulse2" class="s-gain" cx="430" cy="545" r="90" fill="none" stroke-width="5" opacity="0"/>
        <g id="core"><circle id="coreC" class="gain" cx="430" cy="545" r="90"/><text x="430" y="553" font-size="24" text-anchor="middle" style="font-family:var(--mono);letter-spacing:.04em;fill:var(--on-gain)">IDENTITY</text></g>
        <g id="arrowIn" opacity="0"><line id="arrowL" class="s-muted" x1="30" y1="545" x2="30" y2="545" stroke-width="6" stroke-linecap="round"/><polygon id="arrowH" points="0,0 -24,-14 -24,14" fill="var(--muted)"/></g>
        <g id="rowO"><text class="d" x="820" y="330" font-size="56">Outcomes</text><text class="b" x="820" y="376" font-size="32">what you get</text></g>
        <g id="rowP"><text class="d" x="820" y="470" font-size="56">Processes</text><text class="b" x="820" y="516" font-size="32">what you do</text></g>
        <g id="rowI"><text class="d" x="820" y="610" font-size="56">Identity</text><text class="b" x="820" y="656" font-size="32">what you believe about yourself</text></g>
        <text id="layerStatus" class="d5" x="820" y="780" font-size="40"></text>
      </g>

      <!-- 3 Two answers -->
      <g id="s2" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Two people, one cigarette.</text>
        <text class="b" x="120" y="176" font-size="32">Both say no. Listen to how.</text>
        <g id="cardA">
          <text class="m" x="120" y="270" font-size="26">THE FIRST PERSON</text>
          <path class="s-ink" d="M138 300h584a18 18 0 0 1 18 18v184a18 18 0 0 1-18 18H230l-50 44v-44h-42a18 18 0 0 1-18-18V318a18 18 0 0 1 18-18z" fill="none" stroke-width="4"/>
          <text class="d5" x="160" y="390" font-size="52">“No thanks,</text>
          <text class="d5" x="160" y="460" font-size="52">I’m trying to quit.”</text>
        </g>
        <g id="cardB">
          <text class="m" x="860" y="270" font-size="26">THE SECOND PERSON</text>
          <path class="s-ink" d="M878 300h584a18 18 0 0 1 18 18v184a18 18 0 0 1-18 18H970l-50 44v-44h-42a18 18 0 0 1-18-18V318a18 18 0 0 1 18-18z" fill="none" stroke-width="4"/>
          <text class="d5" x="900" y="390" font-size="52">“No thanks,</text>
          <text class="d5" x="900" y="460" font-size="52">I’m not a smoker.”</text>
        </g>
        <g id="verA"><rect class="loss" x="120" y="640" width="34" height="8"/><text class="m" x="168" y="652" font-size="26">STILL BELIEVES</text><text class="d" x="120" y="720" font-size="52">“I am a smoker.”</text></g>
        <g id="verB"><rect class="gain" x="860" y="640" width="34" height="8"/><text class="m" x="908" y="652" font-size="26">HAS BECOME</text><text class="d" x="860" y="720" font-size="52">Someone new.</text></g>
      </g>

      <!-- 4 Become -->
      <g id="s3" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Don’t achieve. Become.</text>
        <text class="b" x="120" y="176" font-size="32">Swap the goal for the kind of person who reaches it.</text>
        <text class="m" x="120" y="310" font-size="26">THE GOAL</text>
        <text class="m" x="820" y="310" font-size="26">THE IDENTITY</text>
        <g id="l0"><text id="l0t" class="d5" x="120" y="430" font-size="64" fill-opacity=".6">Read a book</text></g>
        <line id="st0" class="s-ink" x1="112" y1="409" x2="112" y2="409" stroke-width="5" stroke-linecap="round"/>
        <g id="r0"><path class="s-gain" d="M650 409h110m-22-16l22 16-22 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="820" y="436" font-size="88">Be a reader</text></g>
        <g id="l1"><text id="l1t" class="d5" x="120" y="630" font-size="64" fill-opacity=".6">Run a marathon</text></g>
        <line id="st1" class="s-ink" x1="112" y1="609" x2="112" y2="609" stroke-width="5" stroke-linecap="round"/>
        <g id="r1"><path class="s-gain" d="M650 609h110m-22-16l22 16-22 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="820" y="636" font-size="88">Be a runner</text></g>
      </g>

      <!-- 5 Votes -->
      <g id="s4" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Every action is a vote.</text>
        <text class="b" x="120" y="176" font-size="32">Evidence for the person you are becoming.</text>
        <g id="slots"></g>
        <text class="m" x="120" y="640" font-size="24">40 DAYS · FILLED = A DAY YOU WROTE A PAGE</text>
        <text class="m" x="920" y="300" font-size="26">VOTES FOR “WRITER”</text>
        <text id="yes" class="d" x="914" y="450" font-size="160">0</text>
        <text id="elapsed" class="b" x="920" y="500" font-size="32">out of 0 days</text>
        <line class="s-line" x1="920" y1="580" x2="1480" y2="580" stroke-width="14" stroke-linecap="round"/>
        <line id="voteBar" class="s-gain" x1="920" y1="580" x2="920" y2="580" stroke-width="14" stroke-linecap="round" opacity="0"/>
        <g id="major"><line class="s-ink" x1="1200" y1="552" x2="1200" y2="608" stroke-width="4"/><text class="m" x="1200" y="642" font-size="24" text-anchor="middle">MAJORITY</text></g>
        <text id="voteStatus" class="d5" x="120" y="760" font-size="48"></text>
      </g>

      <!-- 6 Two steps -->
      <g id="s5" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Two steps.</text>
        <text class="b" x="120" y="176" font-size="32">In this order.</text>
        <g id="step1"><text class="m" x="120" y="320" font-size="26">STEP 1</text><text class="d" x="120" y="410" font-size="84">Decide who you want to be.</text></g>
        <g id="step2"><text class="m" x="120" y="540" font-size="26">STEP 2</text><text class="d" x="120" y="630" font-size="84">Prove it with small wins.</text></g>
        <g id="wins"></g>
      </g>

      <!-- 7 Close -->
      <g id="s6" opacity="0">
        <g id="q1"><text id="q1t" class="d5" x="140" y="220" font-size="60" fill-opacity=".6">What do you want to achieve?</text></g>
        <line id="st2" class="s-ink" x1="132" y1="200" x2="132" y2="200" stroke-width="5" stroke-linecap="round"/>
        <g id="q2a"><text class="d" x="136" y="420" font-size="136" letter-spacing="-3">Who do you want</text></g>
        <g id="q2b"><text class="d" x="136" y="560" font-size="136" letter-spacing="-3">to become?</text></g>
        <text class="m" x="143" y="720" font-size="26">ATOMIC HABITS · CHAPTER 2 · IDENTITY BEFORE OUTCOMES</text>
      </g>
      <g id="wm" aria-hidden="true" pointer-events="none">
        <defs><pattern id="wmtile" width="560" height="360" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="24" y="190" font-family="DM Mono,monospace" font-size="34" font-weight="500" fill="var(--ink)" opacity=".06">visualgrowth.app</text></pattern></defs>
        <rect width="1600" height="900" fill="url(#wmtile)"/>
        <g class="wmc"><text x="1564" y="868" text-anchor="end" font-family="DM Mono,monospace" font-size="30" font-weight="500" fill="var(--ink)" stroke="var(--stage)" stroke-width="6" paint-order="stroke" opacity=".62">visualgrowth.app</text></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="82" step="0.01" value="0" aria-label="Position in the animation">
    <span id="clock">0:00 / 1:22</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">A paraphrased summary of chapter 2 of James Clear's <em>Atomic Habits</em>. Narration is an AI voice generated with ElevenLabs.</p>
</div>

<audio id="vo" preload="auto" src="lesson-02.mp3"></audio>
<script>
(function(){
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b)=>ease(lin(t,a,b));
// K scales the scene timings to the narration length
const K=1, DUR=82, SC=[[0,6.8],[6.8,26.05],[26.05,40.5],[40.5,48.4],[48.4,66.4],[66.4,74.1],[74.1,82]].map(a=>[a[0]*K,a[1]*K]);
const NAMES=['Who, not what','Three layers','Two answers','Become','Votes','Two steps','The question'];
const TM={out:10.86,proc:14.05,iden:17.53,most:20.93,core:23.36,first:29.0,second:32.25,still:35.8,other:38.15,goal:41.1,strike0:42.0,reader:43.17,marathon:45.2,strike1:46.0,runner:46.64,slots:51.63,v0:56.6,onevote:59.51,vs:61.43,ve:64.3,major:64.5,step1:69.2,step2:71.37,wins:72.4,q1:74.49,qstrike:75.6,q2:76.61};

const MISS=new Set([5,11,14,20,23,27,31,34,38]);
const slots=[];for(let i=0;i<40;i++)slots.push(mk('rect',{x:120+(i%10)*72,y:300+Math.floor(i/10)*72,width:56,height:56,rx:10,'stroke-width':3},$('slots')));
const voteAt=i=>i===0?TM.v0:TM.vs+(i-1)*(TM.ve-TM.vs)/38;
const wins=[];for(let i=0;i<7;i++)wins.push(mk('circle',{class:'gain',cx:136+i*56,cy:710,r:0},$('wins')));
const W={l0:360,l1:470,q1:800};
function measure(){try{W.l0=$('l0t').getComputedTextLength();W.l1=$('l1t').getComputedTextLength();W.q1=$('q1t').getComputedTextLength()}catch(e){}}
measure(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();render(t)});
let lastVote='';

function vis(t,i){const[a,b]=SC[i],last=i===SC.length-1;
  if(t<a||(t>=b&&!last))return 0;
  return Math.min(i===0?1:lin(t,a,a+.6), last?1:1-lin(t,b-.5,b));}
function rise(el,k){el.setAttribute('opacity',k);el.setAttribute('transform','translate(0 '+((1-k)*22).toFixed(1)+')')}
function strike(id,w,k){$(id).setAttribute('x2',(+$(id).getAttribute('x1')+(w+16)*k).toFixed(1));$(id).setAttribute('opacity',k>0?1:0)}

function render(t){
  const u=t/K;
  for(let i=0;i<SC.length;i++)$('s'+i).setAttribute('opacity',vis(t,i).toFixed(3));

  // title: electrons
  for(let i=0;i<3;i++){const a=t*1.5+i*2.1, th=i*Math.PI/3, x=240*Math.cos(a), y=84*Math.sin(a);
    $('e'+i).setAttribute('cx',(x*Math.cos(th)-y*Math.sin(th)).toFixed(1));
    $('e'+i).setAttribute('cy',(x*Math.sin(th)+y*Math.cos(th)).toFixed(1));}

  // three layers
  const kO=p(u,TM.out,TM.out+.6), kP=p(u,TM.proc,TM.proc+.6), kI=p(u,TM.iden,TM.iden+.6);
  $('ringO').setAttribute('opacity',kO); $('ringP').setAttribute('opacity',kP);
  $('core').setAttribute('opacity',kI); $('coreC').setAttribute('r',(90*kI).toFixed(1));
  rise($('rowO'),kO); rise($('rowP'),kP); rise($('rowI'),kI);
  const ka=p(u,TM.most,TM.most+1.4), ax=30+250*ka;
  $('arrowIn').setAttribute('opacity',ka>0?(1-lin(u,TM.core,TM.core+.5)).toFixed(2):0);
  $('arrowL').setAttribute('x2',ax-12); $('arrowH').setAttribute('transform','translate('+ax.toFixed(1)+' 545)');
  const kp=lin(u,TM.core,TM.core+2.2);
  [0,.5].forEach((off,i)=>{const f=(kp*2+off)%1, on=kp>0&&kp<1&&(i===0||kp>.25);
    $('pulse'+(i+1)).setAttribute('r',(90+180*f).toFixed(1));$('pulse'+(i+1)).setAttribute('opacity',on?(1-f).toFixed(2):0)});
  $('layerStatus').textContent=u>=TM.core?'Lasting change starts at the core.':u>=TM.most?'Most people start from the outside.':'';

  // two answers
  rise($('cardA'),p(u,TM.first,TM.first+.55)); rise($('cardB'),p(u,TM.second,TM.second+.55));
  rise($('verA'),p(u,TM.still,TM.still+.55)); rise($('verB'),p(u,TM.other,TM.other+.55));

  // become
  rise($('l0'),p(u,TM.goal,TM.goal+.5)); strike('st0',W.l0,p(u,TM.strike0,TM.strike0+.7)); rise($('r0'),p(u,TM.reader,TM.reader+.5));
  rise($('l1'),p(u,TM.marathon,TM.marathon+.5)); strike('st1',W.l1,p(u,TM.strike1,TM.strike1+.7)); rise($('r1'),p(u,TM.runner,TM.runner+.5));

  // votes
  $('slots').setAttribute('opacity',p(u,TM.slots,TM.slots+.8));
  let yes=0, el=0;
  for(let i=0;i<40;i++){if(u>=voteAt(i)){el++; if(!MISS.has(i))yes++;}}
  const key=yes+'/'+el;
  if(key!==lastVote){lastVote=key;
    slots.forEach((r,i)=>{const done=u>=voteAt(i), ok=done&&!MISS.has(i);
      r.setAttribute('fill',ok?'var(--gain)':'var(--stage)');r.setAttribute('stroke',ok?'var(--gain)':done?'var(--muted)':'var(--line)')});
    $('yes').textContent=yes; $('elapsed').textContent='out of '+el+(el===1?' day':' days');
    $('voteBar').setAttribute('x2',920+560*yes/40); $('voteBar').setAttribute('opacity',yes?1:0);}
  $('major').setAttribute('opacity',p(u,TM.major,TM.major+.5));
  $('voteStatus').textContent=u>=TM.major?'You only need a majority.':u>=TM.vs?'But the votes add up.':u>=TM.onevote?'One vote changes nothing.':u>=TM.v0?'One page written. One vote for “writer”.':'';

  // two steps
  rise($('step1'),p(u,TM.step1,TM.step1+.55)); rise($('step2'),p(u,TM.step2,TM.step2+.55));
  wins.forEach((c,i)=>c.setAttribute('r',(16*p(u,TM.wins+i*.2,TM.wins+.2+i*.2)).toFixed(1)));

  // close
  rise($('q1'),p(u,TM.q1,TM.q1+.5)); strike('st2',W.q1,p(u,TM.qstrike,TM.qstrike+.7));
  rise($('q2a'),p(u,TM.q2,TM.q2+.6)); rise($('q2b'),p(u,TM.q2+.3,TM.q2+.9));
}

// transport: the narration is the master clock while it is playing
const au=$('vo');
const alen=()=>isFinite(au.duration)&&au.duration>0?au.duration:78.6;
const chap=$('chapters'), cbtns=NAMES.map((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;
  b.addEventListener('click',()=>{t=SC[i][0]+(i?0.01:0);start()});chap.appendChild(b);return b});
let t=0, playing=false, prev=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function sync(){
  render(t); $('seek').value=t; $('clock').textContent=fmt(t)+' / '+fmt(DUR);
  $('play').textContent=playing?'Pause':(t>=DUR?'Replay':'Play');
  cbtns.forEach((b,i)=>b.setAttribute('aria-current',t>=SC[i][0]&&(t<SC[i][1]||i===SC.length-1)?'true':'false'));
}
function start(){
  if(t>=DUR)t=0; playing=true;
  if(t<alen()-.05){try{au.currentTime=t;const r=au.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  sync();
}
function stop(){playing=false;try{au.pause()}catch(e){} sync()}
function frame(now){
  if(playing&&prev!==null){
    if(!au.paused&&!au.ended&&au.readyState>2)t=au.currentTime; else t+=Math.min(.1,(now-prev)/1000);
    if(t>=DUR){t=DUR;playing=false;try{au.pause()}catch(e){}}
    sync();
  }
  prev=now; requestAnimationFrame(frame);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('seek').addEventListener('input',e=>{t=+e.target.value;stop()});
$('mute').addEventListener('click',e=>{au.muted=!au.muted;e.target.textContent=au.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',au.muted)});
$('full').addEventListener('click',()=>{const el=$('stageBox');
  try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}});
sync(); requestAnimationFrame(frame);
})();
</script>
</html>
