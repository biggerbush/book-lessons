<text class="m" x="1320" y="730" font-size="20" text-anchor="middle">RISK-TAKING</text>
<text class="d" x="120" y="810" font-size="40">Risk-taking tracked their own lifetime.</text></g>
</g>

<g id="s5" opacity="0">
