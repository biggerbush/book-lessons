<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">When carrots and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">sticks backfire.</text>
<text class="b" x="120" y="600" font-size="32">Why a cash prize can make clever thinking slower.</text>
