<g id="rQb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">that earns while</text></g>
<g id="rQc"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2">you’re <tspan style="fill:var(--gain)">not there</tspan>?</text></g>
