<g id="m2"><circle class="gain" cx="1120" cy="695" r="44"/><path d="M1098 695l15 15 28-30" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1184" y="703" font-size="22">YOU GOT IT</text></g>
