<g id="dsm"><text class="d" x="940" y="760" font-size="44">Debt must be smaller.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Steady earnings.</text>
<text class="b" x="120" y="176" font-size="32">A profit in each of the past 10 years.</text>
