</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Jam tomorrow, never jam today.</text>
<text class="b" x="120" y="176" font-size="32">Keynes on the restless, purposive person.</text>
<g id="key">
<text class="m" x="280" y="580" font-size="20" text-anchor="middle">JOHN MAYNARD KEYNES</text>
<text class="m" x="280" y="612" font-size="20" text-anchor="middle">RESTLESS, PURPOSIVE</text>
</g>
<g id="jarD"></g>
