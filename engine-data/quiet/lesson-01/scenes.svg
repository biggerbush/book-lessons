<g id="traits"></g>
<g id="newtag"><text class="d" x="1100" y="610" font-size="48">Not timeless.</text><text class="m" x="1100" y="650" font-size="20" style="fill:var(--gain)">SURPRISINGLY NEW</text></g>
</g>

