<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fox and the hedgehog.</text>
<text class="b" x="120" y="176" font-size="32">An old Greek parable, retold by Isaiah Berlin.</text>
<g id="scroll"><rect class="s-ink" x="150" y="220" width="1300" height="150" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="120" y="208" width="36" height="174" rx="18"/><rect class="ink" x="1444" y="208" width="36" height="174" rx="18"/></g>
<g id="quote"><text class="d5" x="190" y="282" font-size="40">“The fox knows many things,</text><text class="d5" x="190" y="338" font-size="40">but the hedgehog knows <tspan style="fill:var(--gain)">one big thing.</tspan>”</text><text class="m" x="1410" y="338" font-size="20" text-anchor="end">— ISAIAH BERLIN</text></g>
<g id="fox1"><text class="m" x="380" y="760" font-size="22" text-anchor="middle">MANY THINGS</text></g>
<g id="tricks"></g>
<g id="hb"><g id="hog1"></g><g id="ball1"></g><text class="m" x="1100" y="760" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE BIG THING</text></g>
<g id="lead"><text class="d" x="120" y="840" font-size="44">Great companies were run by hedgehogs.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Circle one: best in the world.</text>
<text class="b" x="120" y="176" font-size="32">What could you be the best in the world at?</text>
