<g id="pack"></g>
<g id="inh"><text class="d" x="120" y="780" font-size="44">Copy the method, inherit the assumptions.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">First principles thinking.</text>
<text class="b" x="120" y="176" font-size="32">Break it down to what is certainly true. Build up from there.</text>
<path class="s-ink" d="M120 640H1000" stroke-width="6" stroke-linecap="round"/>
