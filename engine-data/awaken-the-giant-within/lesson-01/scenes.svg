</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t drift down the river.</text>
<text class="b" x="120" y="176" font-size="32">Choose a direction before you hear the roar.</text>
<g id="riv"><rect class="loss" x="120" y="430" width="1140" height="190" fill-opacity=".12"/><g id="flow"></g><text class="m" x="160" y="670" font-size="22" style="fill:var(--gain)">CALM WATER</text></g>
