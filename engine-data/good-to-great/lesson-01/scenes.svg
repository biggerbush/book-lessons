<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The comfort trap.</text>
<text class="b" x="120" y="176" font-size="32">Jim Collins’s famous opening line.</text>
<g id="q1"><text class="d5" x="120" y="262" font-size="52" style="fill:var(--gain)">“Good is the enemy of great.”</text></g>
