<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Did wheat</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">domesticate us?</text>
<text class="b" x="120" y="600" font-size="32">How a humble grass quietly took charge of human lives</text>
<path class="s-line" d="M1100 800h380" stroke-width="5" stroke-linecap="round"/>
<g id="t_wheat"></g>
<g id="t_man"></g>
<path id="t_leash" d="M1360 600Q1270 610 1200 712" fill="none" stroke="var(--gain)" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round"/>
<text id="t_q" class="d" x="1250" y="560" font-size="56" text-anchor="middle" style="fill:var(--gain)">?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A grass goes global.</text>
<text class="b" x="120" y="176" font-size="32">From one corner of the Middle East to fields across the world.</text>
<g id="map"></g>
<g id="origin"><circle id="ring" cx="900" cy="400" r="20" fill="none" stroke="var(--gain)" stroke-width="5"/><circle cx="900" cy="400" r="10" class="gain"/></g>
<text id="olbl" class="m" x="120" y="750" font-size="22" style="fill:var(--gain)">WILD GRASS · ONE SMALL CORNER OF THE MIDDLE EAST</text>
<text id="wl" class="m" x="120" y="786" font-size="22">WITHIN A FEW THOUSAND YEARS · FIELDS ACROSS THE WORLD</text>
<text id="cap1" class="d" x="120" y="846" font-size="44">Few plants have ever succeeded so spectacularly.</text>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wheat’s demands.</text>
<text class="b" x="120" y="176" font-size="32">Wheat was fussy, and Sapiens became its servant.</text>
<circle id="sun2" class="gain" cx="1400" cy="250" r="36"/>
<path class="s-line" d="M120 600H1480" stroke-width="5" stroke-linecap="round"/>
<g id="f2"><path d="M190 600L195 520Q215 470 275 480M255 485L300 575" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink" cx="300" cy="478" r="22"/></g>
<path id="bucket" class="s-ink" d="M330 560h44l-6 40h-32z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<g id="stalks2"></g>
<g id="rocks"></g>
<g id="weeds"></g>
<g id="pests"></g>
<g id="cards"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bodies not built for it.</text>
<text class="b" x="120" y="176" font-size="32">Evolved for climbing and chasing, not bending over fields all day.</text>
<path class="s-line" d="M760 240V820" stroke-width="3"/>
<g id="spine"></g>
<g id="marks"></g>
<text id="pl0" class="m" x="120" y="820" font-size="22" style="fill:var(--loss)">SLIPPED DISCS</text>
<text id="pl1" class="m" x="360" y="820" font-size="22" style="fill:var(--loss)">ARTHRITIS</text>
<text id="pl2" class="m" x="560" y="820" font-size="22" style="fill:var(--loss)">HERNIAS</text>
<g id="variety"><circle cx="960" cy="420" r="30" class="ink"/><path d="M1060 430q50-40 100 0q-50 40-100 0zM1160 430l30-22v44z" class="ink"/><circle cx="1250" cy="410" r="16" class="ink"/><circle cx="1280" cy="440" r="16" class="ink"/><circle cx="1240" cy="445" r="16" class="ink"/><path d="M1330 460q10-70 60-80q0 70-60 80z" class="ink"/></g>
<g id="grains"></g>
<path id="bowl3" class="s-ink" d="M880 520H1400A260 170 0 0 1 880 520Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<text id="gl0" class="m" x="880" y="740" font-size="22" style="fill:var(--gain)">A FEW GRAINS</text>
<text id="gl1" class="m" x="880" y="776" font-size="22">POOR IN VITAMINS AND MINERALS</text>
<text id="gl2" class="m" x="880" y="812" font-size="22">HARD ON TEETH</text>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">New dangers.</text>
<text class="b" x="120" y="176" font-size="32">Crowded villages, new diseases, and a single crop.</text>
<g id="vill"></g>
<g id="anim"></g>
<g id="germs"></g>
<text id="v_l" class="m" x="120" y="800" font-size="20">PEOPLE, ANIMALS AND WASTE, SIDE BY SIDE</text>
<text id="g_l" class="m" x="120" y="840" font-size="20" style="fill:var(--loss)">INFECTIOUS DISEASES SPREAD</text>
<g transform="translate(0 -30)">
<g id="fp">
<rect class="s-line" x="920" y="240" width="560" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle cx="1160" cy="320" r="34" fill="var(--muted)"/><circle cx="1240" cy="320" r="34" fill="var(--muted)"/><circle cx="1200" cy="298" r="40" fill="var(--muted)"/>
<path id="rain" d="M1150 370l-10 30M1200 370l-10 30M1250 370l-10 30" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M960 690H1440" stroke-width="5" stroke-linecap="round"/>
<path id="cracks" d="M960 710l40 20 30-14 40 22M1130 706l30 26 40-12M1260 712l40 18 50-16" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g id="okf"></g><g id="dryf"></g><g id="loc"></g>
</g>
</g>
<text id="f_l" class="m" x="940" y="770" font-size="20">ONE CROP</text>
<text id="d_l" class="m" x="940" y="806" font-size="20" style="fill:var(--loss)">RAINS FAIL · LOCUSTS · STARVATION</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who tamed whom?</text>
<g id="w5"><text class="d5" x="120" y="250" font-size="56">domesticate</text><text class="m" x="120" y="296" font-size="22">FROM THE LATIN WORD FOR HOUSE</text></g>
<path class="s-line" d="M120 700H1480" stroke-width="5" stroke-linecap="round"/>
<g id="house5"><path class="s-ink" d="M240 460L460 340L680 460Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect class="s-ink" x="280" y="455" width="360" height="245" fill="var(--stage)" stroke-width="7"/><rect class="s-ink" x="420" y="580" width="80" height="120" fill="var(--stage)" stroke-width="5"/><rect id="win5" x="310" y="500" width="70" height="60" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/></g>
<g id="fld5"></g>
<g id="p5"></g>
<text id="l5a" class="m" x="280" y="750" font-size="22" style="fill:var(--gain)">SAPIENS MOVES IN</text>
<text id="l5b" class="m" x="920" y="750" font-size="22">WHEAT STAYS OUT</text>
<text id="quo5" class="d" x="120" y="830" font-size="44">“We did not domesticate wheat. <tspan style="fill:var(--gain)">It domesticated us.</tspan>”</text>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The luxury trap.</text>
<text class="b" x="120" y="176" font-size="32">Each step seemed sensible at the time.</text>
<g id="ring6"><circle class="s-line" cx="560" cy="500" r="230" fill="none" stroke-width="5" stroke-dasharray="12 10"/><g id="arw"></g></g>
<circle id="orb" class="gain" r="10"/>
<g id="nodes"></g>
<g id="fam"></g>
<g id="forage"><text class="m" x="940" y="430" font-size="20">BACK TO FORAGING</text><path d="M940 500H1190m-20-18 20 18-20 18" fill="none" stroke="var(--muted)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1340" cy="460" r="62" fill="var(--muted)" fill-opacity=".5"/><rect x="1330" y="520" width="20" height="80" fill="var(--muted)"/></g>
<path id="nox" d="M1045 472l50 56M1095 472l-50 56" stroke="var(--loss)" stroke-width="10" stroke-linecap="round"/>
<text id="cap6" class="d" x="120" y="830" font-size="40">Small improvements quietly become necessities.</text>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Success isn’t happiness.</text>
<text class="b" x="120" y="176" font-size="32">Far more humans, but harder lives.</text>
<g id="hc"></g>
<text id="hl" class="m" x="120" y="730" font-size="20" style="fill:var(--gain)">FAR MORE HUMANS · A TRIUMPH FOR THE SPECIES</text>
<text id="ne" class="d" x="800" y="540" font-size="160" text-anchor="middle" style="fill:var(--loss)">≠</text>
<g id="ind"><path class="s-line" d="M1080 590h240" stroke-width="5" stroke-linecap="round"/><g id="indf" transform="rotate(16 1190 573)"></g></g>
<text id="il" class="m" x="900" y="680" font-size="20" style="fill:var(--loss)">ONE LIFE · HARDER WORK, POORER DIET</text>
<text id="cap7" class="d" x="120" y="830" font-size="40">A species can thrive while its individuals suffer.</text>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What luxury in your life</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">now <tspan style="fill:var(--gain)">demands your time?</tspan></text></g>
<text id="qm" class="m" x="143" y="620" font-size="26">NOTICE ONE THIS WEEK · WHO IS SERVING WHOM?</text>
<g id="cg"><path class="s-line" d="M1260 820h220" stroke-width="5" stroke-linecap="round"/><g id="cw"></g><g id="cp"></g></g>
</g>