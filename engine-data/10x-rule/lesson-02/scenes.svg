<g id="r100"><text class="m" x="760" y="285" font-size="20">THE 10X TARGET</text><rect class="s-muted" x="760" y="300" width="600" height="60" rx="8" fill="none" stroke-width="4" stroke-dasharray="12 8"/><text class="d" x="1380" y="346" font-size="44">100</text></g>
<g id="r50"><text class="m" x="760" y="435" font-size="20" style="fill:var(--gain)">HALF OF THE 10X TARGET</text><rect id="b50" class="gain" x="760" y="450" width="0" height="60" rx="8"/><text id="n50" class="d" x="780" y="496" font-size="44" style="fill:var(--gain)">0</text></g>
