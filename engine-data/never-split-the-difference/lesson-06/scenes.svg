<g id="bars"><text class="m" x="1180" y="452" font-size="20">LISTENING</text><rect id="barL" class="gain" x="1180" y="466" width="0" height="40" rx="8"/><text class="m" x="1180" y="562" font-size="20">TALKING</text><rect id="barT" class="ink" x="1180" y="576" width="0" height="40" rx="8"/></g>
<g id="lis"><text class="d" x="120" y="790" font-size="46">Listen far more than you talk.</text></g>
