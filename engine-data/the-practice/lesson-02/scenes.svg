<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PRACTICE · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Trust the process,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not the outcome.</text>
<text class="b" x="120" y="600" font-size="32">Commit to the making, not to how it lands.</text>
<g id="wr"><rect class="ink" x="1080" y="556" width="360" height="14" rx="7"/><rect class="s-ink" x="1260" y="532" width="110" height="24" fill="var(--stage)" stroke-width="4"/></g>
<g id="sheets"></g>
<g id="hush"><rect class="s-line" x="1110" y="240" width="160" height="80" rx="40" fill="var(--stage)" stroke-width="4"/><circle id="hd0" cx="1150" cy="280" r="8" fill="var(--muted)"/><circle id="hd1" cx="1190" cy="280" r="8" fill="var(--muted)"/><circle id="hd2" cx="1230" cy="280" r="8" fill="var(--muted)"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two things you hold.</text>
<text class="b" x="120" y="176" font-size="32">Every piece of creative work comes with two parts.</text>
<g id="bx0"><rect class="s-line" x="120" y="230" width="620" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="160" y="284" font-size="22" style="fill:var(--gain)">PROCESS</text></g>
<g id="bx1"><rect class="s-line" x="860" y="230" width="620" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="900" y="284" font-size="22">OUTCOME</text></g>
<g id="pc"><path id="zig" class="s-gain" d="M180 470l60-60 60 60 60-60 60 60 60-60 60 60 60-60" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="680"/>
<g id="pen"><path class="ink" d="M0 0l-12-26h24z"/><rect class="ink" x="-12" y="-90" width="24" height="60" rx="4"/></g>
<text class="d5" x="160" y="630" font-size="38">The daily act of making.</text></g>
<g id="oc"><text class="d5" x="900" y="630" font-size="38">How people react.</text></g>
<g id="mix"><path class="s-loss" d="M430 700C430 790 1170 790 1170 700" fill="none" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="800" y="840" font-size="22" text-anchor="middle" style="fill:var(--loss)">MOST OF US MIX THEM UP</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Only one part is yours.</text>
<text class="b" x="120" y="176" font-size="32">You hold the process. The crowd holds the reaction.</text>
<g id="dial"><circle class="s-ink" cx="330" cy="480" r="140" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g>
<path id="ptr" class="s-gain" d="M330 480V370" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="330" cy="480" r="20"/>
<text class="m" x="330" y="690" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOURS</text></g>
<g id="i0"><circle class="gain" cx="522" cy="392" r="6"/><text class="m" x="540" y="400" font-size="22">WHEN YOU SIT DOWN</text></g>
<g id="i1"><circle class="gain" cx="522" cy="472" r="6"/><text class="m" x="540" y="480" font-size="22">WHAT YOU TRY</text></g>
<g id="i2"><circle class="gain" cx="522" cy="552" r="6"/><text class="m" x="540" y="560" font-size="22">HOW HARD YOU WORK</text></g>
<g id="crw"><path class="s-line" d="M860 240V760" stroke-width="4" stroke-dasharray="10 12"/><text class="m" x="1200" y="790" font-size="22" text-anchor="middle">CLAPS? BUYS? SHARES?</text></g>
<g id="theirs"><text class="m" x="1200" y="290" font-size="22" text-anchor="middle" style="fill:var(--loss)">THEIRS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The outcome trap.</text>
<text class="b" x="120" y="176" font-size="32">Tie your worth to results and every launch becomes a verdict.</text>
<g id="me3"></g>
<g id="board3"><rect class="s-ink" x="900" y="230" width="560" height="250" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="930" y="280" font-size="22">VERDICT</text></g>
<path id="vline" class="s-loss" d="M900 430L440 540" stroke-width="5" stroke-dasharray="12 10" fill="none"/>
<g id="cloud"><g id="cl3"><circle class="loss" cx="280" cy="360" r="70" fill-opacity=".22"/><circle class="loss" cx="370" cy="325" r="90" fill-opacity=".22"/><circle class="loss" cx="470" cy="360" r="70" fill-opacity=".22"/><circle class="loss" cx="370" cy="400" r="78" fill-opacity=".22"/></g>
<g id="w0"><text class="m" x="370" y="340" font-size="22" text-anchor="middle" style="fill:var(--ink)">ANXIOUS</text></g>
<g id="w1"><text class="m" x="370" y="375" font-size="22" text-anchor="middle" style="fill:var(--ink)">CAUTIOUS</text></g>
<g id="w2"><text class="m" x="370" y="410" font-size="22" text-anchor="middle" style="fill:var(--ink)">COPY WHAT WORKED</text></g></g>
<g id="wk"><text class="m" x="930" y="580" font-size="22">THE WORK</text>
<rect x="930" y="604" width="220" height="180" rx="10" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="10 8"/>
<rect id="wrect" x="930" y="604" width="220" height="180" rx="10"/>
<path id="wkarr" d="M1130 764L1020 670m0 30v-30h30" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="small"><text class="d" x="1200" y="680" font-size="48">Smaller</text><text class="d" x="1200" y="740" font-size="48">and safer.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">It might not work.</text>
<text class="b" x="120" y="176" font-size="32">Real creative work always carries that chance.</text>
<circle class="gain" cx="280" cy="565" r="40"/><text class="m" x="280" y="572" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text>
<g id="wind"><path class="s-gain" d="M320 540C520 260 700 640 1060 420" fill="none" stroke-width="7" stroke-dasharray="14 12" stroke-linecap="round"/>
<text id="qm" class="d" x="1200" y="470" font-size="230" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="m" x="1200" y="606" font-size="22" text-anchor="middle">CREATIVE WORK</text></g>
<g id="safe"><path class="s-muted" d="M320 590L765 700" stroke-width="7" stroke-linecap="round"/><rect class="s-line" x="770" y="650" width="420" height="96" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="980" y="706" font-size="20" text-anchor="middle">JUST FOLLOWING INSTRUCTIONS</text></g>
<g id="flaw"><text class="m" x="120" y="800" font-size="22">UNCERTAINTY IS NOT A FLAW IN YOUR PLAN</text></g>
<g id="deal"><text class="d" x="120" y="854" font-size="44">It is part of the deal.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Godin’s daily blog.</text>
<text class="b" x="120" y="176" font-size="32">He writes and posts every single day.</text>
<g id="lap"><rect class="s-ink" x="160" y="270" width="420" height="270" rx="12" fill="var(--stage)" stroke-width="7"/><path class="ink" d="M120 552h500l-30 30H150z"/><g id="tl"></g>
<text class="m" x="370" y="650" font-size="22" text-anchor="middle">WRITE · POST · REPEAT</text></g>
<g id="cal"><rect class="ink" x="760" y="240" width="686" height="50" rx="8"/><text class="m" x="1103" y="273" font-size="20" text-anchor="middle" style="fill:var(--stage)">ONE POST, EVERY DAY</text>
<text class="m" x="760" y="700" font-size="20">HOW POPULAR EACH POST WAS (ILLUSTRATIVE)</text></g>
<g id="cmt"><text class="d" x="120" y="800" font-size="46">Committed to the writing, not to one post.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Results follow practice.</text>
<text class="b" x="120" y="176" font-size="32">A steady practice gives good results more chances to show up.</text>
<rect x="120" y="700" width="1360" height="36" rx="10" fill="var(--line)"/>
<g id="plants"></g>
<g id="can"></g>
<g id="tend"><text class="m" x="120" y="800" font-size="22">TEND THE SOIL DAILY. TODAY’S SEED DOES NOT HAVE TO BLOOM TONIGHT.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shift your question.</text>
<g id="oq"><rect class="s-loss" x="120" y="230" width="500" height="320" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="160" y="290" font-size="22" style="fill:var(--loss)">OLD QUESTION</text>
<text class="d5" x="160" y="400" font-size="52">Will this</text><text class="d5" x="160" y="466" font-size="52">succeed?</text></g>
<line id="ostk" class="s-loss" x1="150" y1="500" x2="150" y2="500" stroke-width="7" stroke-linecap="round"/>
<path id="arr7" class="s-muted" d="M660 390h110m-26-26 26 26-26 26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="nq"><rect class="s-gain" x="820" y="230" width="660" height="320" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="860" y="290" font-size="22" style="fill:var(--gain)">NEW QUESTION</text>
<text class="d" x="860" y="370" font-size="44">Did I show up and do</text><text class="d" x="860" y="430" font-size="44">the work as well as</text><text class="d" x="860" y="490" font-size="44">I could today?</text></g>
<g id="chk"><circle class="gain" cx="900" cy="700" r="70"/><path id="tick" d="M866 702l24 24 46-50" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120"/>
<text class="d" x="1000" y="700" font-size="60">Yes.</text><text class="m" x="1000" y="746" font-size="22">NO MATTER WHAT ANYONE ELSE DOES</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Pick one small project.</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">Decide your process</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">for this week.</tspan></text></g>
<g id="jg"><text class="m" x="143" y="640" font-size="26">JUDGE YOURSELF ONLY ON WHETHER YOU FOLLOWED IT</text><g id="days"></g></g>
</g>