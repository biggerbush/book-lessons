<g id="s0">
<text class="m" x="120" y="150" font-size="28">INFLUENCE: THE PSYCHOLOGY OF PERSUASION · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Scarcity and defending</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your autopilot.</text>
<text class="b" x="120" y="600" font-size="32">Why almost gone feels so precious, and how to stay calm</text>
