<text class="b" x="120" y="176" font-size="32">Robert and Mike asked rich dad how to get rich.</text>
<g id="rBoys"><text class="m" x="310" y="670" font-size="20" text-anchor="middle">ROBERT &amp; MIKE · AGE 9</text></g>
