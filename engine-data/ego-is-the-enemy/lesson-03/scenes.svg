<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">To be someone,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">or to do something?</text>
<text class="b" x="120" y="600" font-size="32">Choosing between looking important and doing work that matters.</text>
<path class="s-ink" d="M1300 820V600" stroke-width="10" stroke-linecap="round"/>
<path id="bL" d="M1300 600Q1300 480 1180 340" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<path id="bR" d="M1300 600Q1300 480 1430 340" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<g id="lb0"><text class="d" x="1180" y="310" font-size="40" text-anchor="middle" style="fill:var(--loss)">BE</text><text class="d" x="1430" y="310" font-size="40" text-anchor="middle" style="fill:var(--gain)">DO</text></g>
<circle id="walker" class="gain" cx="1300" cy="800" r="18"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet John Boyd.</text>
<text class="b" x="120" y="176" font-size="32">Fighter pilot. Brilliant military strategist.</text>
<g id="jet1"><g id="jetb"></g><text class="m" x="380" y="580" font-size="22" text-anchor="middle">FIGHTER PILOT</text></g>
<g id="bp">
<rect x="700" y="240" width="740" height="360" rx="12" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<g id="bpg"></g>
<path class="s-muted" d="M740 570C820 470 760 330 860 280M1290 570C1380 500 1410 360 1400 270" fill="none" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>
<text class="m" x="700" y="640" font-size="22">HOW PLANES MOVE AND FIGHT</text>
</g>
<g id="clash1">
<g id="clashP"></g>
<path id="bolt1" class="loss" d="M440 700l-24 40h20l-16 44 40-54h-22l18-30z"/>
<text class="m" x="300" y="844" font-size="22" text-anchor="middle">BOYD</text>
<text class="m" x="560" y="844" font-size="22" text-anchor="middle">BOSS</text>
<text class="d5" x="700" y="780" font-size="36">Stubborn. Blunt. Clashed with bosses.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The young officer.</text>
<text class="b" x="120" y="176" font-size="32">Boyd mentored officers who wanted to make a real difference.</text>
<path class="s-line" d="M120 730H1480" stroke-width="4"/>
<g id="boyd2"><rect class="ink" x="1180" y="596" width="260" height="18"/><path class="s-ink" d="M1200 614V730M1420 614V730" stroke-width="6"/><text class="m" x="1310" y="676" font-size="22" text-anchor="middle">BOYD</text></g>
<g id="door2"><rect x="900" y="300" width="200" height="430" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect id="dpanel" x="900" y="300" width="200" height="430" fill="var(--line)"/></g>
<g id="off2"><g id="offm2"><text class="m" x="0" y="772" font-size="22" text-anchor="middle">THE YOUNG OFFICER</text></g></g>
<g id="test2"><text class="d" x="120" y="852" font-size="48">That promise would soon be tested.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two paths, one question.</text>
<text class="b" x="120" y="176" font-size="32">Boyd sketched it out for the officer.</text>
<g id="board3"><rect x="120" y="240" width="520" height="460" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<path id="pa3" d="M380 660V520" pathLength="1" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
<path id="pb3" d="M380 520Q380 420 230 330" pathLength="1" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
<path id="pc3" d="M380 520Q380 420 530 330" pathLength="1" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
<g id="lb3"><text class="d" x="230" y="300" font-size="40" text-anchor="middle" style="fill:var(--loss)">BE</text><text class="d" x="530" y="300" font-size="40" text-anchor="middle" style="fill:var(--gain)">DO</text></g></g>
<g id="boyd3"><text class="m" x="790" y="730" font-size="20" text-anchor="middle">BOYD</text></g>
<g id="bub3"><rect x="920" y="280" width="540" height="200" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M960 478L880 540L1020 478" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<text class="d" x="1190" y="365" font-size="56" text-anchor="middle">To be</text><text class="d" x="1190" y="440" font-size="56" text-anchor="middle">or <tspan style="fill:var(--gain)">to do?</tspan></text>
<text class="m" x="920" y="600" font-size="20">IN BOYD’S WORDS, AS HOLIDAY TELLS IT</text></g>
<g id="ans3"><text class="d" x="120" y="810" font-size="44">Every ambitious person has to answer it.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Path one: to be somebody.</text>
<text class="b" x="120" y="176" font-size="32">Climb toward promotions and good assignments.</text>
<g id="med4"></g>
<g id="lad4"><path class="s-ink" d="M300 770V260M420 770V260" stroke-width="7" stroke-linecap="round"/><g id="rg4"></g></g>
<g id="lab4"><text class="m" x="440" y="658" font-size="20">GO ALONG</text><text class="m" x="440" y="518" font-size="20">PLAY POLITICS</text><text class="m" x="440" y="378" font-size="20">PROMOTIONS</text></g>
<g id="clm4"><g id="clmm4"></g></g>
<g id="work4"><g id="wk4in"><rect id="wrect" x="1000" y="620" width="360" height="140" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d5" x="1180" y="702" font-size="40" text-anchor="middle">The work</text></g></g>
<g id="cmp4"><text class="d" x="860" y="400" font-size="44">You compromise.</text><text class="d" x="860" y="456" font-size="44">You turn your back</text><text class="d" x="860" y="512" font-size="44" style="fill:var(--loss)">on the work.</text></g>
<g id="many4"><text class="m" x="120" y="840" font-size="22">MANY TALENTED PEOPLE TAKE THIS ROAD WITHOUT NOTICING</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Path two: to do something.</text>
<text class="b" x="120" y="176" font-size="32">Something that truly counts.</text>
<g id="do5"><rect class="ink" x="220" y="640" width="160" height="90" rx="10"/><path class="s-ink" d="M270 640v-20h60v20" fill="none" stroke-width="6"/></g>
<g id="brk5"></g>
<text class="m" x="616" y="756" font-size="20" text-anchor="middle">THE WORK</text>
<g id="boss5"></g>
<g id="ls0"><text class="m" x="1080" y="420" font-size="22" style="fill:var(--loss)">ANNOYED BOSSES</text></g>
<g id="ls1"><text class="m" x="1080" y="470" font-size="22" style="fill:var(--loss)">MISSED PROMOTIONS</text></g>
<g id="ls2"><text class="m" x="1080" y="520" font-size="22" style="fill:var(--loss)">LOST FAVOR</text></g>
<g id="chk5"><path class="s-gain" d="M540 400l40 40 80-90" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="fth5"><text class="d" x="120" y="840" font-size="44">You keep faith with yourself and the work.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Boyd chose to do.</text>
<text class="b" x="120" y="176" font-size="32">He never rose beyond the rank of colonel.</text>
<g id="bdg6"><path class="s-loss" d="M160 290H520" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="340" y="270" font-size="20" text-anchor="middle" style="fill:var(--loss)">RANK CEILING</text>
<circle cx="340" cy="470" r="130" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><circle class="s-line" cx="340" cy="470" r="100" fill="none" stroke-width="3"/><g id="bst6"></g>
<text class="m" x="340" y="505" font-size="26" text-anchor="middle">COLONEL</text></g>
<g id="rip6"></g><g id="nd6"></g>
<g id="rc6"><circle class="ink" cx="1050" cy="480" r="22"/><path class="s-muted" d="M1330 480h-0" stroke-width="0"/><text class="m" x="1340" y="487" font-size="22">IDEAS</text></g>
<g id="mat6"><text class="d" x="120" y="830" font-size="40">Missing rank didn’t stop his work mattering.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why ego picks “be”.</text>
<text class="b" x="120" y="176" font-size="32">Titles and applause feel like proof that we matter.</text>
<g id="mir7"><ellipse cx="360" cy="420" rx="150" ry="180" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><path class="s-ink" d="M360 600V640M300 648h120" stroke-width="8" stroke-linecap="round"/><g id="mp7"></g><g id="spk7"></g>
<text class="m" x="360" y="690" font-size="20" text-anchor="middle">TITLES · APPLAUSE</text></g>
<g id="cmp7"><circle cx="1100" cy="420" r="170" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><g id="tk7"></g>
<g id="ndl7"><polygon class="gain" points="0,-140 16,0 -16,0"/><polygon class="ink" points="0,140 16,0 -16,0"/><circle cx="0" cy="0" r="8" fill="var(--stage)"/></g>
<text class="d" x="910" y="434" font-size="40" text-anchor="end" style="fill:var(--loss)">BE</text><text class="d" x="1290" y="434" font-size="40" style="fill:var(--gain)">DO</text>
<text class="m" x="1100" y="640" font-size="20" text-anchor="middle">PURPOSE</text></g>
<g id="pur7"><text class="d" x="120" y="770" font-size="40">Purpose, not status, should guide our choices.</text></g>
<g id="eas7"><text class="m" x="120" y="836" font-size="22" style="fill:var(--gain)">KNOW YOUR PURPOSE: RECOGNITION OR RESULTS GETS MUCH EASIER</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where do looking good</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">and <tspan style="fill:var(--gain)">doing good</tspan> pull</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">apart this week?</text></g>
<g id="fk8"><path class="s-ink" d="M1380 800V720" stroke-width="10" stroke-linecap="round"/><path class="s-loss" d="M1380 720Q1380 680 1320 630" fill="none" stroke-width="10" stroke-linecap="round"/><path class="s-gain" d="M1380 720Q1380 680 1440 630" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<g id="wr8"><text class="m" x="143" y="700" font-size="26">WRITE DOWN WHAT YOU ARE TRYING TO DO</text></g>
</g>