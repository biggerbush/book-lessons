</g>
<g id="ends"><circle class="loss" cx="340" cy="290" r="26"/><circle id="e1" class="gain" cx="780" cy="290" r="26"/></g>
<g id="qt">
<text class="d5" x="900" y="330" font-size="44">“It is in your moments</text>
<text class="d5" x="900" y="390" font-size="44">of decision that your</text>
<text class="d5" x="900" y="450" font-size="44">destiny is shaped.”</text>
<text class="m" x="900" y="500" font-size="22">— TONY ROBBINS</text>
</g>
<g id="n1g"><text id="n1" class="m" x="900" y="610" font-size="26">NOT LUCK</text><line id="k1" class="s-ink" x1="900" y1="601" x2="900" y2="601" stroke-width="4"/></g>
<g id="n2g"><text id="n2" class="m" x="900" y="670" font-size="26">NOT CIRCUMSTANCES</text><line id="k2" class="s-ink" x1="900" y1="661" x2="900" y2="661" stroke-width="4"/></g>
<g id="yc"><text class="d" x="900" y="760" font-size="52" style="fill:var(--gain)">Your choices.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Decide means “to cut off”.</text>
<text class="b" x="120" y="176" font-size="32">From the Latin roots of the word decision.</text>
<text class="m" x="160" y="270" font-size="22">OLD OPTIONS</text>
<g id="opts"></g>
<g id="ropes"></g>
<circle class="gain" cx="1100" cy="500" r="44"/>
<text class="m" x="1100" y="508" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text>
<g id="res"><path class="s-gain" d="M1160 500H1320m-22-22 22 22-22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="s-ink" d="M1380 560V400" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M1380 400l90 30-90 30z"/><text class="m" x="1380" y="600" font-size="22" text-anchor="middle">THE RESULT</text></g>
<g id="sc"></g>
<g id="nob"><text class="d" x="120" y="820" font-size="46">Backing out is off the table.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wishes are not choices.</text>
<text class="b" x="120" y="176" font-size="32">Most of us say we decided, when really we only hoped.</text>
<g id="wc"><g id="cl"><path class="s-muted" d="M260 560A70 70 0 0 1 280 430A90 90 0 0 1 440 370A80 80 0 0 1 590 410A80 80 0 0 1 620 560Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round" stroke-dasharray="12 10"/><g id="wt"><text class="d5" x="440" y="500" font-size="40" text-anchor="middle">I should get fit.</text></g></g><text class="m" x="440" y="640" font-size="24" text-anchor="middle">A WISH</text></g>
<g id="ss"><rect class="s-ink" x="900" y="300" width="540" height="300" rx="10" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1400 300l-24 44 16 30M920 580l30-20 20 26" fill="none" stroke-width="4" stroke-linejoin="round"/>
<g id="cv0"><text class="d" x="1170" y="430" font-size="52" text-anchor="middle">I will get fit,</text></g>
<g id="cv1"><text class="d" x="1170" y="500" font-size="52" text-anchor="middle" style="fill:var(--gain)">no matter what.</text></g>
<text class="m" x="1170" y="660" font-size="24" text-anchor="middle" style="fill:var(--gain)">A DECISION</text></g>
<g id="neq"><text class="d" x="760" y="500" font-size="110" text-anchor="middle" style="fill:var(--muted)">≠</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Robbins hits bottom.</text>
<text class="b" x="120" y="176" font-size="32">As a young man: broke, in a tiny apartment.</text>
