<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMING WAVE · LESSON 6</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">The dilemma:</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">catastrophe or</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">dystopia.</text>
<text class="b" x="120" y="620" font-size="32">Too little control invites disaster. Too much invites tyranny.</text>
<path id="f0" d="M1330 850V600" fill="none" stroke="var(--line)" stroke-width="36" pathLength="1" stroke-dasharray="1"/>
<path id="f1" d="M1330 610Q1330 470 1220 330" fill="none" stroke="var(--line)" stroke-width="36" pathLength="1" stroke-dasharray="1"/>
<path id="f2" d="M1330 610Q1330 470 1410 330" fill="none" stroke="var(--line)" stroke-width="36" pathLength="1" stroke-dasharray="1"/>
<g id="fe0"></g><g id="fe1"></g>
<circle id="tdot" class="gain" cx="1330" cy="850" r="18"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two bad roads.</text>
<text class="b" x="120" y="176" font-size="32">Where powerful technology could take us.</text>
<path d="M800 860V600" fill="none" stroke="var(--line)" stroke-width="36"/>
<g id="r1L"><path d="M800 610Q640 470 430 380" fill="none" stroke="var(--line)" stroke-width="36"/>
<text class="d" x="260" y="278" font-size="48" style="fill:var(--loss)">Catastrophe</text>
<text class="m" x="262" y="314" font-size="20">NO REAL CONTROLS</text></g>
<g id="r1R"><path d="M800 610Q960 470 1170 380" fill="none" stroke="var(--line)" stroke-width="36"/>
<text class="d" x="1340" y="278" font-size="48" text-anchor="end" style="fill:var(--loss)">Dystopia</text>
<text class="m" x="1340" y="314" font-size="20" text-anchor="end">TOTAL GOVERNMENT CONTROL</text></g>
<g id="trav"><g id="travI"></g></g>
<g id="neither"><text class="d" x="120" y="820" font-size="44">Neither road is safe.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Road one: catastrophe.</text>
<text class="b" x="120" y="176" font-size="32">Powerful tools become cheap and everywhere.</text>
<g id="pr"><rect class="s-ink" x="150" y="400" width="240" height="130" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="190" y="380" width="160" height="20"/><circle class="gain" cx="360" cy="500" r="10"/>
<text class="m" x="270" y="580" font-size="20" text-anchor="middle">DNA SYNTHESIS</text></g>
<g id="helix"></g><g id="minis"></g>
<path id="a2a" class="s-muted" d="M430 465h90m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="grp"><text class="m" x="690" y="580" font-size="20" text-anchor="middle">ONE PERSON, OR A FEW</text></g>
<g id="bug"></g>
<path id="a2b" class="s-muted" d="M880 465h90m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="map"><rect class="s-line" x="1000" y="300" width="480" height="280" rx="18" fill="var(--stage)" stroke-width="4"/>
<g id="conts"></g><g id="dots"></g>
<text class="m" x="1240" y="620" font-size="20" text-anchor="middle">SPREADS WORLDWIDE</text></g>
<g id="fast"><text class="d" x="120" y="790" font-size="44">Faster than anyone could respond.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Accidents happen too.</text>
<text class="b" x="120" y="176" font-size="32">It is not only villains we should worry about.</text>
<g id="lab"><path class="s-ink" d="M140 360L350 250L560 360z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="160" y="360" width="380" height="330" fill="var(--stage)" stroke-width="6"/>
<rect x="200" y="410" width="80" height="70" fill="var(--line)"/><rect x="310" y="410" width="80" height="70" fill="var(--line)"/><rect x="420" y="410" width="80" height="70" fill="var(--line)"/>
<rect class="ink" x="310" y="560" width="80" height="130"/>
<text class="m" x="350" y="730" font-size="20" text-anchor="middle">HIGH-SECURITY LAB</text></g>
