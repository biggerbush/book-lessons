<path class="s-line" d="M250 545q25-40 50 0t50 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<path id="stem" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="lvs"><path class="gain" d="M300 360c-40 0-60-20-64-50 34 0 60 14 64 50z"/><path class="gain" d="M300 330c40 0 60-20 64-50-34 0-60 14-64 50z"/></g>
<text class="m" x="300" y="680" font-size="20" text-anchor="middle">ABILITIES GROW WITH EFFORT</text>
</g>
<g id="st">
<path d="M560 760V700H860V590H1160V480H1460V760z" fill="var(--line)"/>
<path class="s-ink" d="M560 700H860V590H1160V480H1460" fill="none" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="710" y="740" font-size="20" text-anchor="middle">BELIEF</text>
<text class="m" x="1010" y="640" font-size="20" text-anchor="middle">OPTIMISTIC SELF-TALK</text>
<text class="m" x="1310" y="530" font-size="20" text-anchor="middle">PERSEVERANCE</text>
<g id="cl7"></g>
</g>
