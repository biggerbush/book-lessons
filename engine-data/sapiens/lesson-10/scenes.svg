<text class="m" x="580" y="780" font-size="20" text-anchor="middle">LATER</text>
<text class="m" x="860" y="780" font-size="20" text-anchor="middle">US</text>
<g id="e_st0"><text class="m" x="300" y="580" font-size="20" text-anchor="middle" style="fill:var(--gain)">THRILLED</text></g>
<g id="e_st1"><text class="m" x="580" y="440" font-size="20" text-anchor="middle">NORMAL</text></g>
<g id="e_st2"><text class="m" x="860" y="300" font-size="20" text-anchor="middle">NORMAL</text></g>
