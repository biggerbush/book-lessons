<g id="ers"><rect class="loss" x="-44" y="-24" width="88" height="48" rx="10"/><rect class="ink" x="-44" y="-24" width="30" height="48" rx="10"/></g>
<g id="intr"><path class="loss" d="M960 450l-40 70h34l-24 70 66-90h-36l26-50z"/><text class="m" x="1010" y="530" font-size="22">INTERRUPTION</text></g>
<g id="dec"><text class="d" x="960" y="690" font-size="44">You decide the day,</text><text class="d" x="960" y="750" font-size="44" style="fill:var(--gain)">not the inbox.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Measure the depth.</text>
<text id="tst" class="b" x="120" y="176" font-size="32">Newport’s test: how long to train a smart recent graduate?</text>
<g id="qm"><text class="d" x="140" y="560" font-size="260" style="fill:var(--loss)">?</text></g>
