<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Stories and documents</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">build societies.</text>
<text class="b" x="120" y="600" font-size="32">How shared stories and paperwork turn strangers into societies.</text>
<g id="tLinks"></g>
<g id="tNote"><rect class="s-ink" x="1200" y="250" width="260" height="130" rx="10" fill="var(--stage)" stroke-width="6"/><circle class="s-gain" cx="1330" cy="315" r="38" fill="none" stroke-width="6"/><path class="s-line" d="M1222 280h50M1388 350h50" stroke-width="6" stroke-linecap="round"/></g>
<g id="tCrowd"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Strangers, together.</text>
<text class="b" x="120" y="176" font-size="32">Chimps cooperate with a few dozen. Humans, with millions.</text>
<g id="chimp"><circle class="s-line" cx="380" cy="470" r="190" fill="none" stroke-width="4"/><g id="chimpN"></g><text class="m" x="380" y="710" font-size="22" text-anchor="middle">A FEW DOZEN, ALL KNOWN</text></g>
<g id="crowd"></g>
<g id="shL"></g>
<g id="shB"><rect class="gain" x="1010" y="425" width="240" height="90" rx="16"/><text class="m" x="1130" y="479" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">SHARED STORY</text></g>
<g id="crowdL"><text class="m" x="1110" y="710" font-size="22" text-anchor="middle">MILLIONS OF STRANGERS</text></g>
<g id="link1"><text class="d" x="120" y="810" font-size="48">The secret: shared information links us.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three kinds of real.</text>
<text class="b" x="120" y="176" font-size="32">Some things are real in very different ways.</text>
<g id="k0"><path class="s-ink" d="M210 560L240 470L300 420L380 410L450 460L480 560Z" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/><path class="s-muted" d="M180 560h320" stroke-width="5" stroke-linecap="round"/><text class="d" x="340" y="650" font-size="46" text-anchor="middle">Objective</text><text class="m" x="340" y="700" font-size="20" text-anchor="middle">EXISTS WHETHER ANYONE</text><text class="m" x="340" y="730" font-size="20" text-anchor="middle">NOTICES IT OR NOT</text></g>
<g id="k1"><circle class="s-ink" cx="800" cy="400" r="90" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M680 580a120 80 0 0 1 240 0" fill="none" stroke-width="6" stroke-linecap="round"/><path id="ache" class="s-loss" d="M880 300l30-22-8 30 34-14M712 300l-30-22 8 30-34-14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="800" y="650" font-size="46" text-anchor="middle">Subjective</text><text class="m" x="800" y="700" font-size="20" text-anchor="middle">ONLY YOU CAN FEEL IT</text></g>
<g id="k2"><g id="mindL"></g><rect class="gain" x="1160" y="400" width="200" height="100" rx="8"/><circle cx="1260" cy="450" r="28" fill="none" stroke="var(--on-gain)" stroke-width="5"/><g id="minds"></g><text class="d" x="1260" y="650" font-size="46" text-anchor="middle" style="fill:var(--gain)">Intersubjective</text><text class="m" x="1260" y="700" font-size="20" text-anchor="middle">REAL BECAUSE MANY MINDS</text><text class="m" x="1260" y="730" font-size="20" text-anchor="middle">SHARE THE SAME STORY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nations and money.</text>
<text class="b" x="120" y="176" font-size="32">Powerful realities made of shared belief.</text>
<g id="nat"><g id="natS"><path class="s-ink" d="M190 270V700" stroke-width="8" stroke-linecap="round"/><path class="s-loss" d="M196 280h270v170H196" fill="none" stroke-width="5" stroke-dasharray="14 10"/></g><text class="m" x="120" y="750" font-size="20" style="fill:var(--ink)">NO PHYSICAL BODY</text></g>
<g id="acts"></g>
<g id="money"><g id="monS"><rect class="s-ink" x="880" y="300" width="380" height="180" rx="12" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1070" cy="390" r="50" fill="none" stroke-width="5"/><path class="s-line" d="M910 330h80M1150 450h80" stroke-width="5" stroke-linecap="round"/></g><text class="m" x="1070" y="530" font-size="20" text-anchor="middle" style="fill:var(--ink)">JUST PAPER</text></g>
<g id="buy"><g id="buyS"><path class="s-muted" d="M1280 390h60m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="gain" d="M1360 430v-30a60 40 0 0 1 120 0v30z"/></g><text class="m" x="1420" y="480" font-size="20" text-anchor="middle" style="fill:var(--ink)">BREAD</text></g>
<g id="belW"><g id="believers"></g></g>
<g id="fades"><text class="d" x="120" y="820" font-size="48">If the shared story fades, so do they.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The power of a story.</text>
<text class="b" x="120" y="176" font-size="32">Theodor Herzl imagined a Jewish state in a book.</text>
<g id="rays"></g>
<g id="hz"><g id="hzP"></g><text class="m" x="300" y="610" font-size="22" text-anchor="middle">THEODOR HERZL</text></g>
<g id="bk"><path class="ink" d="M620 440c-40-24-100-24-140-10v130c40-14 100-14 140 10 40-24 100-24 140-10V430c-40-14-100-14-140 10z"/><path d="M620 440v130" stroke="var(--stage)" stroke-width="4"/><text class="m" x="620" y="620" font-size="20" text-anchor="middle">A STATE IMAGINED IN A BOOK</text></g>
<g id="ctry"></g>
<g id="rally"><text class="d5" x="120" y="780" font-size="40">A vivid tale can rally strangers faster than any order.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A story alone can’t run a state.</text>
<text class="b" x="120" y="176" font-size="32">Records, offices and bureaucrats make the dream real.</text>
<g id="dream"><path class="s-muted" d="M220 340a50 50 0 0 1 40-80a70 70 0 0 1 130-20a60 60 0 0 1 110 40a40 40 0 0 1 0 60z" fill="none" stroke-width="5" stroke-dasharray="10 8"/><text class="m" x="370" y="315" font-size="22" text-anchor="middle">THE DREAM</text></g>
<g id="office"><path class="ink" d="M170 440L370 380L570 440Z"/><rect class="s-ink" x="190" y="440" width="360" height="250" fill="var(--stage)" stroke-width="6"/><g id="win"></g><text class="m" x="120" y="740" font-size="20">BUREAUCRATS · RECORDS · OFFICES</text></g>
<g id="tab"><rect class="s-ink" x="700" y="250" width="320" height="400" rx="34" fill="var(--line)" stroke-width="6"/><g id="wedge"></g><text class="m" x="860" y="700" font-size="20" text-anchor="middle">CLAY TABLET</text></g>
<g id="deed"><path class="s-gain" d="M1040 450h90m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="s-ink" d="M1160 460L1260 380L1360 460" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="1180" y="460" width="160" height="140" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1240" y="530" width="40" height="70"/><g id="ownP"></g><text class="m" x="1290" y="700" font-size="20" text-anchor="middle">OWNERSHIP = WHAT IT SAYS</text></g>
<g id="created"><text class="d" x="120" y="820" font-size="44">The document didn’t describe reality. It created it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why paper feels cold.</text>
<text class="b" x="120" y="176" font-size="32">We evolved to love stories, not filing cabinets.</text>
<g id="cab"><rect id="cabR" x="160" y="270" width="240" height="400" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="drw"></g></g>
<g id="love"><path class="gain" d="M580 300c-30-18-70-18-100-8v80c30-10 70-10 100 8 30-18 70-18 100-8v-80c-30-10-70-10-100 8z"/><path d="M580 300v80" stroke="var(--stage)" stroke-width="4"/><text class="m" x="580" y="430" font-size="22" text-anchor="middle">WHAT WE LOVE</text></g>
<g id="cold"></g>
<g id="city"><g id="bld"></g><path class="s-ink" d="M880 600h600" stroke-width="6"/><path class="s-line" d="M900 690h580" stroke-width="30"/><path id="flow" class="s-gain" d="M900 690h580" stroke-width="6" stroke-dasharray="20 24" fill="none"/><text class="m" x="880" y="750" font-size="20">FROM TAX SYSTEMS TO SEWAGE PIPES</text></g>
<g id="run"><text class="d" x="120" y="830" font-size="46">Records quietly keep cities running.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your move this week.</text>
<text class="b" x="120" y="176" font-size="32">Find the story. Then find the paperwork.</text>
<g id="c0"><rect class="s-line" x="120" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">1. NOTICE ONE SHARED STORY</text><rect class="s-ink" x="180" y="340" width="200" height="260" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M220 400h120M220 450h120M220 500h80" stroke-width="6" stroke-linecap="round"/><g id="nb"></g></g>
<g id="c1"><rect class="s-line" x="840" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="290" font-size="22">2. SPOT THE PAPERWORK</text><rect class="s-ink" x="900" y="340" width="200" height="260" rx="6" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M930 390h140M930 430h140M930 470h100M930 510h120" stroke-width="5" stroke-linecap="round"/><circle class="s-gain" cx="1060" cy="560" r="26" fill="none" stroke-width="6"/></g>
<path id="bridge" class="s-gain" d="M772 480h56m-16-16 16 16-16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="layers"><text class="d" x="120" y="810" font-size="44">Seeing both layers shows how power really works.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">If everyone suddenly</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">stopped believing in money,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">what would your wallet</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="80" letter-spacing="-2">be <tspan style="fill:var(--gain)">worth tomorrow?</tspan></text></g>
<g id="qlab"><text class="m" x="143" y="720" font-size="26">WHAT IS MONEY WITHOUT THE STORY?</text></g>
<g id="wal"><rect class="s-muted" x="1250" y="620" width="160" height="60" rx="6" fill="none" stroke-width="4" stroke-dasharray="8 6"/><rect id="cash" class="gain" x="1250" y="620" width="160" height="60" rx="6"/><rect class="s-ink" x="1220" y="660" width="220" height="140" rx="18" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="1380" y="710" width="60" height="40" rx="8"/></g>
</g>