<g id="hold"><text class="d5" x="120" y="800" font-size="40">Hold each tool up against those few key activities.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Weigh it honestly.</text>
<text class="b" x="120" y="176" font-size="32">Does it substantially help? Does it substantially hurt?</text>
