<g id="rp4"></g>
<g id="lf4"><text class="m" x="440" y="262" font-size="24" text-anchor="middle" style="fill:var(--loss)">STRETCHED THIN</text><g id="lfig4"></g></g>
<g id="op4"></g>
<g id="rt4">
<text class="m" x="1160" y="262" font-size="24" text-anchor="middle" style="fill:var(--gain)">CONFIDENCE</text>
<path class="s-line" d="M880 600H1460" stroke-width="5" stroke-linecap="round"/>
<path class="s-gain" d="M940 640H1350" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<path class="s-gain" d="M1340 624l20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
