</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A doctor's hunch.</text>
<text class="b" x="120" y="176" font-size="32">Late 1950s: physician Stewart Wolf hears something strange.</text>
<g id="wolf"><text class="m" x="250" y="600" font-size="20" text-anchor="middle">STEWART WOLF</text><text class="m" x="450" y="600" font-size="20" text-anchor="middle">LOCAL DOCTOR</text></g>
