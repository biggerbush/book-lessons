<g id="lbl2"><text class="m" x="390" y="550" font-size="22" text-anchor="middle" style="fill:var(--ink)">MY SIDE BUSINESS</text></g>
<g id="cld">
<rect x="780" y="250" width="700" height="250" rx="110" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<circle cx="740" cy="540" r="20" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><circle cx="700" cy="580" r="11" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<g id="cq0"><text class="d5" x="1130" y="355" font-size="40" text-anchor="middle">Will people laugh?</text></g>
<g id="cq1"><text class="d5" x="1130" y="430" font-size="34" text-anchor="middle">Will they think I'm showing off?</text></g>
</g>
<g id="yrw"><g id="yr"></g><text class="m" x="160" y="760" font-size="22">THE IDEA SITS UNTOUCHED FOR ANOTHER YEAR</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Opinions happen anyway.</text>
<g id="pt3"><text class="b" x="120" y="176" font-size="32">Here is the book's point.</text></g>
<g id="you3"></g>
<path id="pa" class="s-gain" d="M240 500C380 500 420 305 600 305" fill="none" stroke-width="6" stroke-dasharray="12 10"/>
<path id="pb" class="s-muted" d="M240 520C380 520 420 675 600 675" fill="none" stroke-width="6" stroke-dasharray="12 10"/>
<g id="ba3"><rect class="gain" x="600" y="270" width="280" height="70" rx="35"/><text class="m" x="740" y="313" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">GO FOR IT</text></g>
<g id="bb3"><rect class="s-ink" x="600" y="640" width="280" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><text class="m" x="740" y="683" font-size="22" text-anchor="middle">PLAY IT SAFE</text></g>
<g id="jd3"></g>
<g id="je3"><text class="m" x="760" y="497" font-size="22" text-anchor="middle" style="fill:var(--loss)">JUDGED EITHER WAY</text></g>
