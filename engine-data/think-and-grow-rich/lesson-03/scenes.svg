<text class="m" x="1140" y="300" font-size="22" text-anchor="middle">OR</text>
<rect x="1180" y="260" width="220" height="64" rx="32" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="1290" y="300" font-size="22" text-anchor="middle">LACK IT</text>
</g></g>
<g id="wall"></g>
<path class="s-ink" d="M860 700H1460" stroke-width="6" stroke-linecap="round"/>
<g id="bld"><text class="d" x="880" y="790" font-size="48">Build it on purpose.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Autosuggestion.</text>
<text class="b" x="120" y="176" font-size="32">Simply put: the messages you send yourself.</text>
