<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE RICHEST MAN IN BABYLON · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Guard your treasure</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">from loss.</text>
<text class="b" x="120" y="600" font-size="32">Why saving money is only half the battle.</text>
