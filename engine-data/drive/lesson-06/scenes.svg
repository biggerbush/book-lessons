<text class="d5" x="1090" y="325" font-size="40">Profit goals</text>
<text class="m" x="1090" y="365" font-size="20">WEALTH · FAME</text>
</g>
<g id="gh">
<path class="gain" d="M1000 700c-40-26-48-52-30-66 14-10 26-4 30 6 4-10 16-16 30-6 18 14 10 40-30 66z"/>
