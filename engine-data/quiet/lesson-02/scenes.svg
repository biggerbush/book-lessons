<text class="m" x="0" y="70" font-size="20" text-anchor="middle">THE CLUB</text><text class="m" x="0" y="100" font-size="20" text-anchor="middle">INSPIRATION</text></g>
<g id="panR"><path class="s-muted" d="M0 -110L-90 0M0 -110L90 0" stroke-width="3"/><circle class="gain" cx="0" cy="-28" r="22"/><path class="ink" d="M-100 0h200a100 34 0 0 1 -200 0z"/>
<text class="m" x="0" y="70" font-size="20" text-anchor="middle" style="fill:var(--gain)">SOLITUDE</text><text class="m" x="0" y="100" font-size="20" text-anchor="middle">THE BUILDING</text></g>
</g>
<g id="swp"><text class="d" x="120" y="810" font-size="42">Swap ideas together. Do your deepest thinking <tspan style="fill:var(--gain)">alone</tspan>.</text></g>
