<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIERS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why birthdays shape</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">hockey stars.</text>
<text class="b" x="120" y="600" font-size="32">How a tiny head start grows into a huge advantage.</text>
<g id="rink">
<rect class="s-ink" x="1100" y="260" width="380" height="230" rx="80" fill="var(--ice)" stroke-width="7"/>
<path class="s-loss" d="M1290 260v230" stroke-width="5"/>
<circle class="s-loss" cx="1290" cy="375" r="40" fill="none" stroke-width="4"/>
<path class="s-gain" d="M1140 340a35 35 0 0 1 0 70M1440 340a35 35 0 0 0 0 70" fill="none" stroke-width="5"/>
<circle id="puck" class="ink" r="12"/>
</g>
<g id="cal0">
<rect class="s-ink" x="1210" y="560" width="160" height="150" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1214" y="564" width="152" height="40"/>
<text class="d" x="1290" y="684" font-size="56" text-anchor="middle">JAN</text>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A strange roster.</text>
<text class="b" x="120" y="176" font-size="32">Roger Barnsley’s wife noticed something odd in the program.</text>
<g id="roster">
<rect class="s-line" x="120" y="230" width="560" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="282" font-size="20">JUNIOR HOCKEY PROGRAM</text>
<g id="rows"></g>
</g>
<g id="chart">
<path class="s-ink" d="M770 680h710" stroke-width="5"/>
<g id="bars"></g>
<text class="m" x="770" y="782" font-size="20">PLAYERS BY BIRTH MONTH · ILLUSTRATIVE</text>
</g>
<g id="magW"><g id="mag"><circle class="s-ink" cx="0" cy="0" r="95" fill="none" stroke-width="12"/><path class="s-ink" d="M67 -67l60 -60" stroke-width="20" stroke-linecap="round"/></g></g>
<g id="pat"><text class="m" x="770" y="840" font-size="22" style="fill:var(--gain)">SAME PATTERN ACROSS ELITE HOCKEY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cutoff: January 1.</text>
<text class="b" x="120" y="176" font-size="32">Youth hockey groups children by calendar year.</text>
<g id="cut">
<rect class="s-ink" x="120" y="236" width="160" height="120" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="gain" x="124" y="240" width="152" height="38"/>
<text class="m" x="200" y="267" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">CUTOFF</text>
<text class="d" x="200" y="334" font-size="40" text-anchor="middle">JAN 1</text>
</g>
<path class="s-ink" d="M300 300h1000" stroke-width="6" stroke-linecap="round"/>
<g id="ticks"></g>
<g id="grp">
<rect class="s-muted" x="480" y="420" width="640" height="390" rx="20" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="800" y="462" font-size="20" text-anchor="middle">SAME AGE GROUP</text>
<path class="s-gain" d="M312 300L620 420" stroke-width="4" stroke-dasharray="8 8"/>
<path class="s-loss" d="M1290 300L980 420" stroke-width="4" stroke-dasharray="8 8"/>
<circle class="gain" cx="312" cy="300" r="14"/><circle class="loss" cx="1290" cy="300" r="14"/>
<text class="m" x="620" y="790" font-size="20" text-anchor="middle">BORN EARLY JAN</text>
<text class="m" x="980" y="790" font-size="20" text-anchor="middle">BORN LATE DEC</text>
<g id="kA" transform="translate(620 750)"></g>
<g id="kB" transform="translate(980 750)"></g>
</g>
<g id="hb">
<text class="m" x="1290" y="466" font-size="22" text-anchor="middle">AT AGE 9</text>
<rect id="hbA" class="gain" x="1200" y="750" width="70" height="0"/>
<rect id="hbB" class="loss" x="1310" y="750" width="70" height="0"/>
<path class="s-ink" d="M1180 750h220" stroke-width="5"/>
<text class="m" x="1235" y="785" font-size="20" text-anchor="middle">JAN</text>
<text class="m" x="1345" y="785" font-size="20" text-anchor="middle">DEC</text>
</g>
<g id="bigT"><text class="d" x="120" y="855" font-size="40">Extra months: bigger, stronger, more coordinated.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Picked early.</text>
<text class="b" x="120" y="176" font-size="32">Coaches choose the best nine and ten year olds for all star teams.</text>
<path class="s-line" d="M140 720h1000" stroke-width="5"/>
<g id="kids3"></g>
<g id="coachG"><g id="coachF"></g><path class="gain" d="M1308 622a32 32 0 0 1 64 0z"/></g>
<g id="clip">
<rect class="s-ink" x="1220" y="240" width="240" height="220" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1300" y="226" width="80" height="28" rx="8"/>
<text id="tal" class="d5" x="1340" y="320" font-size="36" text-anchor="middle">Talent?</text>
<line id="tStrike" class="s-loss" x1="1265" y1="308" x2="1265" y2="308" stroke-width="6" stroke-linecap="round"/>
<g id="mat"><text class="d" x="1340" y="410" font-size="40" text-anchor="middle" style="fill:var(--gain)">Maturity</text></g>
</g>
<g id="chosen"><text class="d" x="120" y="820" font-size="46">The older kids get chosen far more often.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The snowball.</text>
<text class="b" x="120" y="176" font-size="32">Once chosen, players get more of everything.</text>
<path class="s-ink" d="M160 360L1440 760" stroke-width="6" stroke-linecap="round"/>
<g id="lb"><circle class="loss" cx="196" cy="351" r="16"/><text class="m" x="130" y="315" font-size="20">LEFT BEHIND</text></g>
<g id="ghosts"></g>
<g id="steps"></g>
<g id="ball"><circle id="bc" class="gain"/><path id="bl" stroke="var(--on-gain)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="gap">
<text class="d" x="1480" y="270" font-size="44" text-anchor="end">By thirteen or fourteen,</text>
<text class="d" x="1480" y="326" font-size="44" text-anchor="end" style="fill:var(--gain)">the gap keeps growing.</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Matthew Effect.</text>
<text class="b" x="120" y="176" font-size="32">A name Gladwell borrows from sociology.</text>
<g id="book">
<path class="s-ink" d="M360 280c-60-30-150-30-210-10v170c60-20 150-20 210 10zM360 280c60-30 150-30 210-10v170c-60-20-150-20-210 10z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M190 312q70-14 140 4M190 352q70-14 140 4M190 392q70-14 140 4M390 316q70-18 140-4M390 356q70-18 140-4M390 396q70-18 140-4" fill="none" stroke-width="4"/>
</g>
<g id="verse">
<text class="d5" x="120" y="540" font-size="38">“Unto every one that hath</text>
<text class="d5" x="120" y="592" font-size="38">shall be given.”</text>
<text class="m" x="120" y="644" font-size="20" style="fill:var(--gain)">GOSPEL OF MATTHEW</text>
</g>
<g id="stairs"></g>
<g id="climb"></g>
<g id="acc"><text class="d" x="120" y="820" font-size="52" style="fill:var(--gain)">Accumulative advantage.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beyond the rink.</text>
<text class="b" x="120" y="176" font-size="32">Birth-month patterns appear wherever there are age cutoffs.</text>
<g id="b0">
<rect class="s-line" x="120" y="230" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="sball"><circle class="s-ink" cx="330" cy="430" r="80" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M330 400l29 21-11 34h-36l-11-34z"/><path class="s-ink" d="M330 400v-50M359 421l45-14M348 455l28 40M312 455l-28 40M301 421l-45-14" stroke-width="5"/></g>
<text class="d5" x="330" y="640" font-size="40" text-anchor="middle">Soccer</text>
<text class="m" x="330" y="685" font-size="18" text-anchor="middle">AGE CUTOFFS TOO</text>
</g>
<g id="b1">
<rect class="s-line" x="590" y="230" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="650" y="340" width="50" height="220"/><rect class="ink" x="730" y="390" width="50" height="170"/><rect class="ink" x="810" y="430" width="50" height="130"/><rect class="ink" x="890" y="460" width="50" height="100"/>
<text class="m" x="675" y="592" font-size="18" text-anchor="middle" style="fill:var(--gain)">OLDEST</text>
<text class="m" x="915" y="592" font-size="18" text-anchor="middle">YOUNGEST</text>
<text class="d5" x="800" y="640" font-size="40" text-anchor="middle">Classrooms</text>
<text class="m" x="800" y="685" font-size="18" text-anchor="middle">TEST SCORES</text>
</g>
<g id="b2">
<rect class="s-line" x="1060" y="230" width="420" height="490" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-muted" d="M1270 470L1420 560" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
<path class="s-ink" d="M1120 600L1270 470" stroke-width="8" stroke-linecap="round"/>
<path class="s-gain" d="M1270 470L1420 310" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1420" y="290" font-size="18" text-anchor="end" style="fill:var(--gain)">ADVANCED TRACK</text>
<circle id="tdot" class="gain" r="14"/>
<text class="d5" x="1270" y="640" font-size="40" text-anchor="middle">School tracks</text>
<text class="m" x="1270" y="685" font-size="18" text-anchor="middle">THE GAP CARRIES ON</text>
</g>
<g id="years"><text class="d" x="120" y="810" font-size="44">The advantage carries on for years.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fixing the system.</text>
<text class="b" x="120" y="176" font-size="32">The real loss: talented younger kids who never got the chance.</text>
<g id="lost">
<g id="lostF"></g>
<text class="m" x="400" y="560" font-size="20" text-anchor="middle">TALENTED, BUT YOUNGER</text>
<text class="m" x="400" y="592" font-size="20" text-anchor="middle" style="fill:var(--loss)">NEVER GOT THE CHANCE</text>
</g>
<g id="lg">
<rect class="s-ink" x="720" y="240" width="360" height="360" rx="18" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="1120" y="240" width="360" height="360" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="900" y="290" font-size="22" text-anchor="middle">BORN JAN–JUN</text>
<text class="m" x="1300" y="290" font-size="22" text-anchor="middle">BORN JUL–DEC</text>
<g id="lgK"></g>
<text class="m" x="1100" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">COMPETE WITH TRUE PEERS</text>
</g>
<g id="chk">
<path class="s-gain" d="M128 760l32 32 64-76" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="260" y="760" font-size="44">A small, arbitrary head start</text>
<text class="d" x="260" y="818" font-size="44">can be mistaken for talent.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where might you be</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">mistaking a head start</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">for <tspan style="fill:var(--gain)">talent?</tspan></text></g>
<g id="q2"><text class="d5" x="140" y="680" font-size="52">Who deserves a second look?</text></g>
<text class="m" x="143" y="780" font-size="26">LOOK PAST THE HEAD START</text>
<g id="mir">
<ellipse class="s-ink" cx="1340" cy="330" rx="80" ry="110" fill="var(--ice)" stroke-width="8"/>
<path class="s-ink" d="M1340 440v60M1290 500h100" stroke-width="8" stroke-linecap="round"/>
<path class="s-gain" d="M1300 300l40-40M1310 350l60-60" stroke-width="6" stroke-linecap="round"/>
</g>
</g>