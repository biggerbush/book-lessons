<text class="m" x="1265" y="642" font-size="22" text-anchor="middle">BORED</text>
</g>
<g id="s1end"><text class="d" x="120" y="830" font-size="44">We stop improving before our potential runs out.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Deliberate play.</text>
<text class="b" x="120" y="176" font-size="32">Design practice as a game, so building skills feels like fun.</text>
