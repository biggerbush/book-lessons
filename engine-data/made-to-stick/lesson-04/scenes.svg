<path d="M968 418q12 10 24 0" fill="none" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/>
<path class="ink" d="M1040 430h40l14 40h-68z"/>
<path class="s-ink" d="M1060 470v50" stroke-width="6"/>
<rect class="ink" x="1042" y="518" width="36" height="8" rx="3"/>
</g></g>
<g id="chips"></g>
<path id="kd" pathLength="1" class="s-gain" d="M276 660a26 26 0 1 1-52 0a26 26 0 1 1 52 0M250 686v50M220 706h60M250 736l-24 34M250 736l24 34M424 650a24 24 0 1 1-48 0a24 24 0 1 1 48 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="kt"><text class="d" x="120" y="836" font-size="44">If a child could draw it, it will stick.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="88" letter-spacing="-2">Pick one goal.</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">Could you see it,</text></g>
<g id="qc"><text class="d" x="136" y="550" font-size="88" letter-spacing="-2">or <tspan style="fill:var(--gain)">check it off?</tspan></text></g>
<g id="sh8"><text class="m" x="143" y="700" font-size="26">THEN SHARE THAT VERSION INSTEAD</text></g>
<g id="card8">
<rect class="s-ink" x="1080" y="250" width="360" height="320" rx="18" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="1120" y="300" width="40" height="40" rx="6" fill="none" stroke-width="5"/>
<rect class="s-ink" x="1120" y="390" width="40" height="40" rx="6" fill="none" stroke-width="5"/>
<rect class="s-ink" x="1120" y="480" width="40" height="40" rx="6" fill="none" stroke-width="5"/>
<path class="s-line" d="M1190 320h210M1190 410h170M1190 500h190" stroke-width="10" stroke-linecap="round"/>
