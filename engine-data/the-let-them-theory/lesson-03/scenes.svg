<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Let them think</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">what they think.</text>
<text class="b" x="120" y="600" font-size="32">Stop managing other people's opinions and start living your life.</text>
<g id="you0"></g>
<g id="qs0"></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The invisible jury.</text>
<text class="b" x="120" y="176" font-size="32">Friends, coworkers and strangers, sitting in your head.</text>
<g id="you1"></g>
<text class="m" x="260" y="630" font-size="22" text-anchor="middle">YOU</text>
<path id="th1" class="s-muted" d="M340 400H700" fill="none" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
<g id="jury">
<rect class="s-line" x="720" y="290" width="720" height="330" rx="18" fill="var(--stage)" stroke-width="4"/>
<g id="jr"></g>
<rect class="ink" x="740" y="520" width="680" height="80" rx="8"/>
<text class="m" x="1080" y="568" font-size="20" text-anchor="middle" style="fill:var(--stage)">THE JURY IN YOUR HEAD</text>
</g>
<g id="gav"><rect class="ink" x="1130" y="276" width="100" height="14" rx="4"/><g id="gavh"><rect class="ink" x="1180" y="224" width="120" height="12" rx="6"/><rect class="ink" x="1150" y="196" width="44" height="68" rx="8"/></g></g>
<g id="dec1"><text class="d" x="120" y="770" font-size="44">It quietly decides more of your choices.</text><text class="m" x="120" y="816" font-size="20">MORE THAN WE REALISE</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A dream on hold.</text>
<text class="b" x="120" y="176" font-size="32">Imagine starting something of your own.</text>
<g id="lap">
<rect class="s-ink" x="160" y="290" width="460" height="290" rx="14" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M150 592h480l24 28H126z"/>
