</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What would you make</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">if you stopped waiting</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">to be <tspan style="fill:var(--gain)">gifted</tspan>?</text></g>
