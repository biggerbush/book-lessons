<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Meet your moody</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">partner, Mr. Market.</text>
<text class="b" x="120" y="600" font-size="32">Why daily stock prices are offers, not orders.</text>
<g id="tBub"><rect class="s-ink" x="1240" y="220" width="230" height="110" rx="18" fill="var(--stage)" stroke-width="5"/><path class="ink" d="M1345 328l35 0-12 22z"/><polyline id="tSpark" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="tMM"></g>
<g id="tYou"><text class="m" x="1200" y="636" font-size="18" text-anchor="middle">YOU DECIDE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The partnership.</text>
<text class="b" x="120" y="176" font-size="32">Picture a small private business, shared by partners.</text>
<g id="shop">
<polygon class="s-ink" points="180,380 220,300 640,300 680,380" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="430" y="350" font-size="22" text-anchor="middle">THE BUSINESS</text>
<rect class="s-ink" x="200" y="380" width="460" height="360" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="219" y="440" width="76" height="90" fill="none" stroke-width="5"/>
<rect class="s-ink" x="334" y="440" width="76" height="90" fill="none" stroke-width="5"/>
<rect class="s-ink" x="564" y="440" width="76" height="90" fill="none" stroke-width="5"/>
<rect class="s-ink" x="452" y="560" width="70" height="180" fill="none" stroke-width="5"/>
</g>
<g id="slice">
<rect class="gain" x="203" y="383" width="112" height="354" fill-opacity=".4"/>
<path class="s-ink" d="M315 380V740M430 380V740M545 380V740" stroke-width="4" stroke-dasharray="10 8"/>
<text class="m" x="257" y="776" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOUR SHARE</text>
</g>
<g id="stake"><text class="m" x="760" y="400" font-size="22">YOUR SHARE COST</text><text id="stakeV" class="d" x="752" y="510" font-size="110" style="fill:var(--gain)">$1,000</text></g>
<g id="pMM"><text class="m" x="1300" y="545" font-size="22" text-anchor="middle">MR. MARKET</text></g>
<g id="cal"></g>
<g id="calL"><text class="m" x="1090" y="700" font-size="20">NEVER MISSES A DAY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every day, a new offer.</text>
<text class="b" x="120" y="176" font-size="32">He names a price, then offers to buy or sell at it.</text>
<g id="dMM"><text class="m" x="300" y="610" font-size="20" text-anchor="middle">MR. MARKET</text></g>
<g id="dYou"><text class="m" x="1300" y="610" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text></g>
<g id="note"><rect class="s-ink" x="640" y="230" width="320" height="160" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="800" y="280" font-size="22" text-anchor="middle">TODAY’S PRICE</text><text class="d" x="800" y="362" font-size="72" text-anchor="middle">$ ???</text></g>
<g id="bArr"><text class="m" x="800" y="510" font-size="22" text-anchor="middle">HE BUYS YOU OUT</text><path class="s-ink" d="M1180 540H424m22-20-22 20 22 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect id="tokB" class="gain" y="522" width="36" height="36" rx="6"/></g>
<g id="sArr"><text class="m" x="800" y="630" font-size="22" text-anchor="middle">HE SELLS YOU MORE</text><path class="s-ink" d="M420 660H1176m-22-20 22 20-22 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect id="tokS" class="gain" y="642" width="36" height="36" rx="6"/></g>
<g id="same2"><text class="d" x="120" y="790" font-size="44">Same price, either way.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">His calm days.</text>
<text class="b" x="120" y="176" font-size="32">Sometimes his price makes perfect sense.</text>
<path id="ax3" class="s-ink" d="M160 260V720H900" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="bars3"></g>
<polyline id="line3" class="s-gain" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="leg3"><text class="m" x="160" y="780" font-size="20">BARS: BUSINESS RESULTS</text><text class="m" x="560" y="780" font-size="20" style="fill:var(--gain)">LINE: HIS PRICE</text></g>
<g id="calm"><g id="nod3"></g><text class="m" x="1210" y="650" font-size="22" text-anchor="middle">NOTHING TO GET EXCITED ABOUT</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">His wild days.</text>
<text class="b" x="120" y="176" font-size="32">Often his feelings run away with him.</text>
<g id="val4"><path class="s-muted" d="M160 480H1080" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="170" y="512" font-size="20">BUSINESS VALUE</text></g>
<polyline id="pc4" class="s-ink" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="hpl"><text class="m" x="560" y="330" font-size="20">HIS PRICE</text></g>
<g id="hat4"><path class="gain" d="M365 288L390 218L415 288Z"/><circle class="gain" cx="390" cy="212" r="9"/></g>
<g id="cloud4"><circle class="loss" cx="825" cy="712" r="22"/><circle class="loss" cx="855" cy="700" r="28"/><circle class="loss" cx="885" cy="714" r="20"/><rect class="loss" x="815" y="712" width="75" height="24" rx="12"/><path class="s-loss" d="M830 750l-8 22M860 752l-8 22M890 750l-8 22" stroke-width="5" stroke-linecap="round"/></g>
<g id="mood4"><g id="f4g"></g><text class="m" x="1300" y="610" font-size="22" text-anchor="middle">HIS MOOD</text></g>
<g id="bz0"><text class="d" x="120" y="830" font-size="44">The business didn’t change.</text></g>
<g id="bz1"><text class="d" x="800" y="830" font-size="44" style="fill:var(--gain)">Only his mood did.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">You can say no.</text>
<text class="b" x="120" y="176" font-size="32">You are never forced to trade with him.</text>
<g id="nOff"><rect class="s-ink" x="130" y="220" width="260" height="76" rx="16" fill="var(--stage)" stroke-width="5"/><path class="ink" d="M220 294h30l-14 22z"/><text class="m" x="260" y="267" font-size="22" text-anchor="middle">BUY? SELL?</text></g>
<rect class="s-ink" x="400" y="260" width="200" height="460" fill="none" stroke-width="6"/>
<rect id="dPan" class="s-ink" x="400" y="260" width="40" height="460" fill="var(--line)" stroke-width="5"/>
<circle id="dKnob" class="ink" cy="500" r="9"/>
<g id="ign"><text class="m" x="500" y="758" font-size="22" text-anchor="middle">IGNORED</text></g>
<g id="nYou"></g>
<path class="s-ink" d="M760 600H1440" stroke-width="8" stroke-linecap="round"/>
<g id="rep"><path class="s-gain" d="M915 400L1090 470" stroke-width="4" stroke-dasharray="8 8"/><path class="ink" d="M1150 490c-30-20-80-20-110-10v100c30-10 80-10 110 10 30-20 80-20 110-10V480c-30-10-80-10-110 10z"/><path d="M1150 490v100" stroke="var(--stage)" stroke-width="4"/><text class="m" x="1150" y="650" font-size="20" text-anchor="middle">COMPANY REPORTS AND RESULTS</text></g>
<g id="info"><text class="d" x="120" y="840" font-size="44">His quote is information, not an instruction.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sell to his euphoria.</text>
<text class="b" x="120" y="176" font-size="32">A ridiculously high price? You can happily sell.</text>
<g id="scale6"><path class="s-ink" d="M300 240V728M290 300h20M290 400h20M290 500h20M290 700h20" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M270 600H330" stroke-width="8" stroke-linecap="round"/><text class="m" x="255" y="607" font-size="20" text-anchor="end">VALUE</text></g>
<g id="hTagW"><g id="hTag"><polygon class="gain" points="330,0 362,-36 640,-36 640,36 362,36"/><text class="m" x="500" y="8" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">HIS OFFER</text></g></g>
<g id="far6"><path class="s-gain" d="M680 590V300m-14 20 14-20 14 20" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><text class="m" x="700" y="450" font-size="20" style="fill:var(--gain)">FAR ABOVE VALUE</text></g>
<g id="sh6"><rect class="ink" x="960" y="420" width="140" height="140" rx="8"/><text class="m" x="1030" y="498" font-size="20" text-anchor="middle" style="fill:var(--stage)">SHARE</text></g>
<g id="bag6"><path class="s-muted" d="M1130 490h100m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="gain" d="M1310 380h80l-20 40c80 30 100 180 0 200h-40c-100-20-80-170 0-200z"/><text class="d" x="1350" y="560" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">$</text><text class="m" x="1350" y="670" font-size="20" text-anchor="middle">CASH</text></g>
<g id="hold6"><text class="d" x="120" y="800" font-size="44">Or simply hold on, and let him rave.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Buy from his despair.</text>
<text class="b" x="120" y="176" font-size="32">A silly low price? Buy a bigger piece for less.</text>
<g id="scale7"><path class="s-ink" d="M260 240V740M250 300h20M250 460h20M250 560h20M250 700h20" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M230 360H290" stroke-width="8" stroke-linecap="round"/><text class="m" x="220" y="367" font-size="20" text-anchor="end">VALUE</text></g>
<g id="lTagW"><g id="lTag"><polygon class="loss" points="290,0 322,-36 530,-36 530,36 322,36"/><text class="m" x="426" y="8" font-size="22" text-anchor="middle" style="fill:var(--stage)">HIS OFFER</text></g></g>
<g id="cart7"><path class="s-ink" d="M544 460h26l30 40h320l-30 130H630z" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle class="ink" cx="660" cy="665" r="18"/><circle class="ink" cx="860" cy="665" r="18"/><text class="m" x="760" y="730" font-size="20" text-anchor="middle">MORE SHARES, SAME BUSINESS</text></g>
<g id="blk7"></g>
<g id="scr7"><rect class="s-ink" x="1000" y="250" width="460" height="330" rx="14" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1230 580v50M1160 640h140" stroke-width="6" stroke-linecap="round"/><polyline id="spk7" class="s-ink" fill="none" stroke-width="5" stroke-linejoin="round"/><g id="mini7"></g><text class="m" x="1230" y="700" font-size="20" text-anchor="middle">EVERY PRICE ON YOUR SCREEN</text></g>
<g id="lo7"><text class="d" x="1230" y="770" font-size="40" text-anchor="middle" style="fill:var(--gain)">= his latest offer</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="143" y="230" font-size="26">NEXT TIME PRICES LEAP OR CRASH, ASK:</text></g>
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">Has the business</text></g>
<g id="qb"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">really changed, or just</text></g>
<g id="qc"><text class="d" x="136" y="580" font-size="88" letter-spacing="-2">Mr. Market’s <tspan style="fill:var(--gain)">mood?</tspan></text></g>
<g id="f8g"></g>
<text class="m" x="143" y="720" font-size="26">OFFERS, NOT ORDERS</text>
</g>