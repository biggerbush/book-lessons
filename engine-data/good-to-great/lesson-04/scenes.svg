<g id="s0">
<text class="m" x="120" y="150" font-size="28">GOOD TO GREAT · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Face the brutal facts.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Keep the faith.</text>
<text class="b" x="120" y="600" font-size="32">Face the hardest truth, and never stop believing you’ll win.</text>
