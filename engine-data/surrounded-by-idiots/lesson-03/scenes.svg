</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the Yellow.</text>
<text class="b" x="120" y="176" font-size="32">Sociable, optimistic and expressive.</text>
<g id="meet1"><g id="yp1"></g>
