<g id="st"></g>
<g id="blt"><text class="d" x="120" y="830" font-size="44">From one blur to a clear list.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pick the top one.</text>
<text class="b" x="120" y="176" font-size="32">The one that unlocks or protects everything else.</text>
<circle class="s-line" cx="420" cy="480" r="190" fill="none" stroke-width="5"/>
<circle class="s-line" cx="420" cy="480" r="130" fill="none" stroke-width="5"/>
