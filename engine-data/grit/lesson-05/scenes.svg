<text class="d" x="629" y="580" font-size="64">Career</text><text class="m" x="629" y="630" font-size="20">A PATH TOWARD</text><text class="m" x="629" y="662" font-size="20">ADVANCEMENT</text><text class="m" x="629" y="750" font-size="20">BRICKLAYER 2</text></g>
<g id="j2"><rect class="s-gain" x="1066" y="230" width="414" height="560" rx="18" fill="var(--stage)" stroke-width="4"/>
<circle class="s-gain" cx="1273" cy="400" r="100" fill="none" stroke-width="3" stroke-dasharray="6 8"/><g id="ring"></g>
<circle class="ink" cx="1273" cy="370" r="22"/><path class="ink" d="M1240 462v-29a33 33 0 0 1 66 0v29z"/>
<text class="d" x="1102" y="580" font-size="64" style="fill:var(--gain)">Calling</text><text class="m" x="1102" y="630" font-size="20">DEEPLY MEANINGFUL,</text><text class="m" x="1102" y="662" font-size="20">CONNECTED TO SOMETHING</text><text class="m" x="1102" y="694" font-size="20">LARGER</text><text class="m" x="1102" y="750" font-size="20" style="fill:var(--gain)">BRICKLAYER 3</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s not the title.</text>
<text class="b" x="120" y="176" font-size="32">Amy Wrzesniewski studies how people describe their work.</text>
<g id="amy"><g id="amyp"></g>
<rect class="s-ink" x="290" y="470" width="70" height="100" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M304 500h42M304 524h42M304 548h28" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="120" y="640" font-size="20">AMY WRZESNIEWSKI</text><text class="m" x="120" y="672" font-size="20">PSYCHOLOGIST</text></g>
<g id="desks"></g>
<g id="mat"><text class="d" x="120" y="790" font-size="44">What matters is how the worker sees it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Gritty people look outward.</text>
<text class="b" x="120" y="176" font-size="32">Duckworth’s surveys, and the role models of grit she met.</text>
