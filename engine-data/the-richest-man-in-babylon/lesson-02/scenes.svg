<g id="copper"><text class="m" x="120" y="820" font-size="22" style="fill:var(--gain)">EVEN A SINGLE COPPER COIN COUNTS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">It did not hurt.</text>
<text class="b" x="120" y="176" font-size="32">Each payday, one coin out of every ten was hidden away.</text>
