<g id="xqb"><text class="d" x="136" y="400" font-size="76" letter-spacing="-2">you carry everywhere,</text></g>
<g id="xqc"><text class="d" x="136" y="500" font-size="76" letter-spacing="-2">even when it <tspan style="fill:var(--loss)">slows you down</tspan>?</text></g>
