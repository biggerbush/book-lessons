<g id="s0">
<text class="m" x="120" y="150" font-size="28">10X RULE · LESSON 1</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Why everyone</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">underestimates what</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">success takes.</text>
<text class="b" x="120" y="620" font-size="32">Why most goals fail from bad math, not lack of talent.</text>
<path class="s-line" d="M1120 700L1440 260" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M1440 260V140" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M1440 140h-70l20 25-20 25h70z"/>
<circle id="t_ball" class="loss" r="26"/>
<g id="t_math"><rect class="s-loss" x="1100" y="730" width="300" height="60" rx="12" fill="none" stroke-width="4"/><text class="m" x="1250" y="768" font-size="22" text-anchor="middle" style="fill:var(--loss)">PLAN &lt; THE ROAD</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plans built for an easy road.</text>
<g id="r_sub"><text class="b" x="120" y="176" font-size="32">Cardone: people underestimate what success will take.</text></g>
<g id="r_trav"></g>
<g id="r_pl"><path class="s-muted" d="M270 640H600" stroke-width="6" stroke-dasharray="12 12" fill="none"/><path class="s-ink" d="M600 640V580" stroke-width="5"/><path class="ink" d="M600 580h50l-12 15 12 15h-50z"/><text class="m" x="435" y="680" font-size="20" text-anchor="middle">THE PLAN</text></g>
<path id="r_real" class="s-ink" d="M270 640C450 640 520 480 700 520S950 720 1100 560S1300 360 1440 400" stroke-width="8" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="r_end"><path class="s-loss" d="M580 700l40 40M620 700l-40 40" stroke-width="7" stroke-linecap="round"/><text class="m" x="600" y="790" font-size="20" text-anchor="middle" style="fill:var(--loss)">PLAN RUNS OUT</text></g>
<g id="r_fl2"><path class="s-ink" d="M1440 400V300" stroke-width="5"/><path class="gain" d="M1440 300h-70l18 22-18 22h70z"/><text class="m" x="1480" y="270" font-size="20" text-anchor="end">WHAT IT REALLY TAKES</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four things we misjudge.</text>
<text class="b" x="120" y="176" font-size="32">Time, money, effort and energy.</text>
<g id="c_tanks"></g>
<text class="m" x="140" y="720" font-size="20">FILL = WHAT WE PLAN · LINE = WHAT IT TAKES</text>
<g id="c_r1"><rect class="s-ink" x="820" y="250" width="150" height="150" rx="12" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="820" y="250" width="150" height="34" rx="8"/><g id="c_cells"></g>
<text class="m" x="1010" y="290" font-size="22">WE THINK</text><text id="c_t1" class="d5" x="1010" y="345" font-size="42" fill-opacity=".55">A few months</text></g>
<line id="c_s1" class="s-ink" x1="1002" y1="331" x2="1002" y2="331" stroke-width="5" stroke-linecap="round"/>
<g id="c_a1"><text class="d" x="1010" y="420" font-size="60" style="fill:var(--gain)">Years.</text></g>
<g id="c_r2"><path id="c_arr" class="s-ink" d="M830 630h100m-30-30 30 30-30 30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1010" y="570" font-size="22">WE THINK</text><text class="d5" x="1010" y="625" font-size="42" fill-opacity=".55">A little push</text></g>
<line id="c_s2" class="s-ink" x1="1002" y1="611" x2="1002" y2="611" stroke-width="5" stroke-linecap="round"/>
<g id="c_a2"><text class="d" x="1010" y="700" font-size="48" style="fill:var(--gain)">A relentless,</text><text class="d" x="1010" y="752" font-size="48" style="fill:var(--gain)">daily shove.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A sales picture.</text>
<text class="b" x="120" y="176" font-size="32">She wants five new clients this month.</text>
<g id="sp_a"><g id="sp_p"></g><rect class="ink" x="140" y="510" width="320" height="14" rx="4"/><path class="s-ink" d="M170 524v110M430 524v110" stroke-width="6"/>
<text class="m" x="1140" y="290" font-size="22">GOAL: 5 CLIENTS</text><g id="sp_slots"></g></g>
<g id="sp_ph"><rect class="ink" x="340" y="474" width="84" height="32" rx="8"/><path class="s-ink" d="M346 468q36-26 72 0" stroke-width="10" fill="none" stroke-linecap="round"/></g>
<g id="sp_b"><text class="m" x="526" y="240" font-size="22">20 CALLS</text><g id="sp_calls"></g></g>
<g id="sp_leg"><text class="m" x="526" y="650" font-size="20">– NO ANSWER · NO · ? MAYBE LATER</text></g>
<g id="sp_res"><text class="d" x="1140" y="440" font-size="44">One client.</text><text class="m" x="1140" y="480" font-size="20">AND A BRUISED EGO</text></g>
<g id="sp_e1"><text class="d" x="120" y="730" font-size="46">Her effort was not the real problem.</text></g>
<g id="sp_e2"><text class="d" x="120" y="810" font-size="60" style="fill:var(--loss)">Her estimate was.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Things go wrong.</text>
<text class="b" x="120" y="176" font-size="32">Plan for what is outside your control.</text>
<g id="w_cl"><rect class="loss" x="260" y="320" width="200" height="60" rx="30"/><circle class="loss" cx="310" cy="330" r="45"/><circle class="loss" cx="370" cy="305" r="55"/><circle class="loss" cx="420" cy="335" r="40"/><g id="w_rain"></g></g>
<text class="m" x="160" y="610" font-size="22">YOUR PLAN</text>
<path id="w_a1" class="s-ink" d="M160 640H1100" stroke-width="10" stroke-linecap="round"/>
<g id="w_a2"><path id="w_a2p" class="s-ink" d="M1100 640H1430m-34-30 34 30-34 30" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="w_o0"><path class="s-loss" d="M650 520h-60m20-20-20 20 20 20" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="700" y="612" font-size="18" text-anchor="middle">COMPETITORS</text></g>
<g id="w_o1"><circle class="s-ink" cx="1015" cy="420" r="24" fill="var(--stage)" stroke-width="4"/><text class="d" x="1015" y="431" font-size="30" text-anchor="middle">?</text><text class="m" x="960" y="612" font-size="18" text-anchor="middle">CUSTOMERS</text></g>
<g id="w_o2"><rect class="s-line" x="1160" y="380" width="280" height="180" rx="12" fill="var(--stage)" stroke-width="4"/><polyline id="w_line" class="s-loss" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1300" y="612" font-size="18" text-anchor="middle">ECONOMY</text></g>
<g id="w_08"><text class="d" x="1300" y="360" font-size="44" text-anchor="middle" style="fill:var(--loss)">2008</text></g>
<g id="w_txt"><text class="b" x="120" y="800" font-size="30">He wrote the book after the 2008 financial crisis, when careful plans collapsed.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The quitting trap.</text>
<text class="b" x="120" y="176" font-size="32">The hidden cost of a low estimate.</text>
<g id="q_face"><circle class="s-ink" cx="300" cy="440" r="110" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="262" cy="410" r="10"/><circle class="ink" cx="338" cy="410" r="10"/><path id="q_m" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="q_math"><text class="m" x="300" y="610" font-size="20" text-anchor="middle">RESULTS FALL SHORT</text><path class="s-muted" d="M400 390L560 310" stroke-width="3" stroke-dasharray="6 8"/><path class="s-loss" d="M470 335l30 30M500 335l-30 30" stroke-width="5" stroke-linecap="round"/>
<rect class="s-muted" x="550" y="236" width="300" height="118" rx="12" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="700" y="283" font-size="24" text-anchor="middle">THE MATH</text><text class="m" x="700" y="325" font-size="22" text-anchor="middle">NOT BLAMED</text></g>
<g id="q_pills"></g>
<g id="q_quit"><g id="q_oct"></g><text class="d" x="1060" y="496" font-size="52" text-anchor="middle" style="fill:var(--stage)">QUIT</text></g>
<g id="q_flag"><path class="s-ink" d="M1360 600V400" stroke-width="5"/><path class="gain" d="M1360 400h70l-18 22 18 22h-70z"/><text class="m" x="1380" y="640" font-size="20" text-anchor="middle">REACHABLE</text>
<rect class="s-ink" x="1300" y="664" width="160" height="22" rx="6" fill="none" stroke-width="3"/><rect class="loss" x="1303" y="667" width="28" height="16" rx="4"/><text class="m" x="1380" y="716" font-size="18" text-anchor="middle">EFFORT</text></g>
<g id="q_end"><text class="d" x="120" y="800" font-size="40">A reachable goal, abandoned because it was underfunded.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plan for the hard road.</text>
<text class="b" x="120" y="176" font-size="32">Assume it is longer and harder than it looks.</text>
<g id="b_pack"><path class="s-ink" d="M240 300v-40a60 60 0 0 1 120 0v40" fill="none" stroke-width="7"/><rect class="s-ink" x="180" y="300" width="240" height="320" rx="40" fill="var(--stage)" stroke-width="7"/><g id="b_bars"></g><path class="s-muted" d="M290 350V600" stroke-width="3" stroke-dasharray="6 6"/><text class="m" x="180" y="670" font-size="18">LINE = SENSIBLE</text></g>
<g id="b_rd"><path id="b_road" class="s-ink" d="M600 660C680 660 700 560 780 580S900 700 980 640S1100 520 1180 540S1300 620 1360 520S1420 420 1460 420" fill="none" stroke-width="8" stroke-linecap="round"/><g id="b_sb"></g><path class="s-ink" d="M1460 420V330" stroke-width="5"/><path class="gain" d="M1460 330h-70l18 22-18 22h70z"/><circle id="b_tr" class="gain" r="18"/></g>
<g id="b_txt"><text class="d" x="120" y="790" font-size="44">Setbacks become part of the plan.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Check your estimate.</text>
<text class="b" x="120" y="176" font-size="32">Try this today.</text>
<g id="n_pad"><rect class="s-ink" x="160" y="240" width="480" height="520" rx="18" fill="var(--stage)" stroke-width="6"/><g id="n_rings"></g><g id="n_lines"></g></g>
<g id="n_sign"><text class="d" x="1058" y="290" font-size="110" text-anchor="middle" style="fill:var(--gain)">?</text><rect class="ink" x="1050" y="300" width="16" height="460"/>
<polygon class="s-loss" points="1040,330 780,330 750,365 780,400 1040,400" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="905" y="374" font-size="24" text-anchor="middle" style="fill:var(--loss)">EASY ROAD</text>
<polygon class="gain" points="1076,440 1380,440 1410,475 1380,510 1076,510"/><text class="m" x="1235" y="484" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">REAL ROAD</text>
<path class="s-muted" d="M1040 740L780 700" stroke-width="5" stroke-dasharray="10 10"/><path class="s-gain" d="M1080 740C1180 760 1180 640 1280 660S1400 600 1460 560" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="n_q"><text class="b" x="120" y="830" font-size="30">Did you plan for the easy road, or the real one?</text></g>
</g>

<g id="s8" opacity="0">
<g id="x_a"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Which goal in your life</text></g>
<g id="x_b"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">have you been quietly</text></g>
<g id="x_c"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2" style="fill:var(--gain)">underestimating?</text></g>
<g id="x_d"><text class="m" x="143" y="640" font-size="26">WHAT WOULD CHANGE IF YOU PLANNED FOR WHAT IT TRULY TAKES?</text></g>
<g id="x_g"><ellipse class="s-ink" cx="1360" cy="580" rx="64" ry="92" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="1360" cy="564" r="18"/><path class="gain" d="M1333 626v-13a27 27 0 0 1 54 0v13z"/><path class="s-ink" d="M1360 672v42M1324 718h72" stroke-width="7" stroke-linecap="round"/></g>
</g>