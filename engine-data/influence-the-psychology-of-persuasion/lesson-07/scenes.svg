<text id="s3cnt" class="d" x="420" y="420" font-size="110">10</text>
<g id="s3arrow"><path class="s-loss" d="M480 450v90M456 516l24 24 24-24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="s3st0"><rect class="ink" x="600" y="520" width="124" height="120" rx="8"/><text class="m" x="662" y="676" font-size="22" text-anchor="middle">ALWAYS</text><text class="m" x="662" y="704" font-size="22" text-anchor="middle">SCARCE</text></g>
<g id="s3st1"><rect class="ink" x="744" y="440" width="124" height="200" rx="8"/><text class="m" x="806" y="676" font-size="22" text-anchor="middle">NEWLY</text><text class="m" x="806" y="704" font-size="22" text-anchor="middle">SCARCE</text></g>
<g id="s3st2"><rect class="gain" x="888" y="340" width="124" height="300" rx="8"/><text class="m" x="950" y="676" font-size="22" text-anchor="middle">OTHERS</text><text class="m" x="950" y="704" font-size="22" text-anchor="middle">WANT IT</text></g>
<g id="s3crowd"><g id="s3last"></g><g id="s3hands"></g></g>
<g id="s3grab"><text class="d" x="120" y="800" font-size="44">Competition turns a mild want into a hungry grab.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sellers know this.</text>
<text class="b" x="120" y="176" font-size="32">Deadlines and dwindling stock squeeze your thinking time.</text>
<g id="s4sign0"><rect x="120" y="250" width="540" height="96" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="150" y="308" font-size="26" style="fill:var(--loss)">LIMITED NUMBER</text></g>
<g id="s4sign1"><rect x="120" y="380" width="540" height="96" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="150" y="438" font-size="26" style="fill:var(--loss)">ONLY WHILE SUPPLIES LAST</text></g>
<g id="s4sign2"><rect x="120" y="510" width="540" height="96" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="150" y="568" font-size="26" style="fill:var(--loss)">PRICE ENDS AT MIDNIGHT</text></g>
