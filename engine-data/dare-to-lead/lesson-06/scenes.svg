<circle id="walk" class="gain" cx="450" cy="710" r="16"/>
<text class="m" x="450" y="770" font-size="20" text-anchor="middle">VALUES PRACTICED, NOT JUST STATED</text></g>
<g id="ffe"><text class="m" x="270" y="408" font-size="18" text-anchor="middle" style="fill:var(--loss)">FUN · FAST · EASY</text></g>
<g id="pN"></g>
<g id="iN"><g id="iNf"></g>
<rect class="s-ink" x="940" y="400" width="120" height="60" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1000" y="440" font-size="30" text-anchor="middle">Help?</text>
