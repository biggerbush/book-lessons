</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Compliments.</text>
<text class="b" x="120" y="176" font-size="32">Joe Girard, called the world’s greatest car salesman.</text>
<g id="joe"><text class="m" x="260" y="610" font-size="22" text-anchor="middle" style="fill:var(--gain)">JOE GIRARD</text></g>
<g id="card"><rect class="s-ink" x="550" y="260" width="380" height="320" rx="14" fill="var(--stage)" stroke-width="6"/><path class="gain" d="M0 14C-22 0-22-16-11-18C-5-19-1-15 0-11C1-15 5-19 11-18C22-16 22 0 0 14Z" transform="translate(740 330) scale(1.3)"/></g>
<g id="lyt"><text class="d" x="740" y="460" font-size="52" text-anchor="middle">I like you.</text><text class="m" x="740" y="530" font-size="20" text-anchor="middle">JOE</text></g>
<g id="cus"></g>
<g id="hrt4"></g>
<text class="m" x="420" y="660" font-size="20">A CARD TO EVERY PAST CUSTOMER, EVERY MONTH</text>
<g id="env"></g>
<g id="prs"><text class="d" x="120" y="820" font-size="44">Strategic praise still works on us.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Contact and cooperation.</text>
<text class="b" x="120" y="176" font-size="32">Working toward a shared goal turns rivals into allies.</text>
