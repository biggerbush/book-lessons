<text id="lb3" class="m" x="410" y="560" font-size="22" text-anchor="middle">RARE JEWELS?</text>
<text class="m" x="860" y="290" font-size="20" text-anchor="middle">A YEAR OF SAVINGS</text>
<g id="fp3"><g transform="translate(860 450) scale(1.1)"><path d="M-40 -70h80l-20 30c70 30 90 140 30 160h-100c-60-20-40-130 30-160z" fill="var(--gain)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></g></g>
