<g id="xk1"><rect class="s-line" x="593" y="230" width="414" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="730" y="300" width="140" height="230" fill="var(--gain)" stroke-width="6"/><polygon id="xleaf" class="ink" points="730,300 870,300 870,530 730,530"/><text class="d5" x="623" y="610" font-size="36">What would</text><text class="d5" x="623" y="656" font-size="36">make me wrong?</text><text class="m" x="623" y="730" font-size="20">SEEK OUTSIDE VIEWS</text></g>
