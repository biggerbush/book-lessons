<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Hunt for the hidden</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">black swans.</text>
<text class="b" x="120" y="600" font-size="32">The hidden facts that can quietly flip any deal.</text>
<g id="wsw"></g>
<circle id="ring0" class="s-gain" cx="1375" cy="515" r="112" fill="none" stroke-width="5" stroke-dasharray="10 12" opacity="0"/>
<g id="bsw"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t split the difference.</text>
<text class="b" x="120" y="176" font-size="32">One partner wants black shoes, the other wants brown.</text>
<g id="ppl1"></g>
<g id="sh0"><text class="m" x="312" y="670" font-size="20" text-anchor="middle">WANTS BLACK</text></g>
<g id="sh1"><text class="m" x="1302" y="670" font-size="20" text-anchor="middle">WANTS BROWN</text></g>
<g id="odd"><path class="s-loss" d="M450 585H660M640 570l20 15-20 15M1160 585H955M975 570l-20 15 20 15" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 0"/><text class="m" x="812" y="670" font-size="20" text-anchor="middle" style="fill:var(--loss)">SPLIT: ONE OF EACH</text></g>
<g id="fr1"><text class="m" x="800" y="380" font-size="22" text-anchor="middle" style="fill:var(--loss)">NEITHER IS HAPPY</text><text class="m" x="800" y="414" font-size="22" text-anchor="middle" style="fill:var(--loss)">PROBLEM UNSOLVED</text></g>
<g id="lazy"><text class="d" x="120" y="790" font-size="46">Lazy compromise leaves both sides worse off.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three kinds of facts.</text>
<text class="b" x="120" y="176" font-size="32">What you know, and what you don’t.</text>
<g id="bx0"><rect class="s-line" x="120" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="20">KNOWN KNOWNS</text>
<path class="s-ink" d="M247 380h100l40 50-40 50h-100z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="360" cy="430" r="9"/><text class="d" x="300" y="450" font-size="52" text-anchor="middle">$</text>
<text class="d5" x="150" y="600" font-size="36">The asking price</text><text class="m" x="150" y="650" font-size="20">YOU KNOW YOU KNOW</text></g>
<g id="bx1"><rect class="s-line" x="593" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="623" y="280" font-size="20">KNOWN UNKNOWNS</text>
<text class="d" x="800" y="490" font-size="170" text-anchor="middle" style="fill:var(--muted)">?</text>
<text class="d5" x="623" y="600" font-size="36">Their budget</text><text class="m" x="623" y="650" font-size="20">YOU KNOW YOU DON’T KNOW</text></g>
<g id="bx2"><rect x="1066" y="230" width="414" height="480" rx="18" fill="var(--loss)" fill-opacity=".16" stroke="var(--loss)" stroke-width="3"/><text class="m" x="1096" y="280" font-size="20">UNKNOWN UNKNOWNS</text>
<text class="d5" x="1096" y="600" font-size="36">What you don’t</text><text class="d5" x="1096" y="644" font-size="36">know to ask</text></g>
<g id="sw2"></g>
<g id="blk2"><text class="d" x="120" y="800" font-size="46">Those hidden unknowns are the <tspan style="fill:var(--gain)">black swans.</tspan></text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small facts, big lever.</text>
<text class="b" x="120" y="176" font-size="32">One black swan can tip a whole negotiation.</text>
<g id="lev">
<path class="ink" d="M800 640L748 740H852Z"/>
<path class="s-ink" d="M680 744h240" stroke-width="6" stroke-linecap="round"/>
<line id="beam" class="s-ink" stroke-width="12" stroke-linecap="round"/>
<g id="lb"><g id="lbb"><rect class="ink" x="-100" y="-116" width="200" height="110" rx="10"/><text class="d" x="0" y="-40" font-size="56" text-anchor="middle" style="fill:var(--stage)">$$$</text></g><text class="m" x="0" y="-146" font-size="22" text-anchor="middle">AN EXTRA FEW THOUSAND</text></g>
<g id="seller"></g><text class="m" x="1420" y="406" font-size="22" text-anchor="middle">SELLER</text>
</g>
<g id="rcw"><g id="rc"><g id="rcb"><rect class="s-ink" x="-65" y="-126" width="130" height="120" rx="10" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="-65" y="-126" width="130" height="34" rx="8"/><text class="d" x="0" y="-26" font-size="44" text-anchor="middle">FRI</text></g><text class="m" x="0" y="-158" font-size="22" text-anchor="middle" style="fill:var(--gain)">MUST MOVE BY FRIDAY</text></g></g>
<g id="t3a"><text class="d" x="120" y="810" font-size="44">A fast closing beats a few thousand more.</text></g>
<g id="t3b"><text class="m" x="120" y="856" font-size="22">YOU’D NEVER LEARN THAT BY HAGGLING HARDER</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A costly miss.</text>
<text class="b" x="120" y="176" font-size="32">The 1993 siege at Waco, Texas.</text>
<path class="s-line" d="M120 700H1480" stroke-width="5"/>
<g id="cmpg"><path class="s-ink" d="M160 700V520h130v-90h80v90h190v180z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-ink" d="M200 600h40M300 600h40M420 600h40M500 600h40" stroke-width="10"/><path id="cmpx" class="loss" d="M160 700V520h130v-90h80v90h190v180z" opacity="0"/><text class="m" x="360" y="745" font-size="20" text-anchor="middle">DAVID KORESH</text></g>
<g id="bub4"></g>
<g id="fbi"><text class="m" x="1320" y="745" font-size="20" text-anchor="middle">FBI</text></g>
<g id="noise"><text class="m" x="875" y="360" font-size="22" text-anchor="middle" style="fill:var(--loss)">RELIGIOUS TALK TREATED AS NOISE</text></g>
<g id="key"><text class="m" x="875" y="360" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE KEY TO HIS WHOLE WORLD</text></g>
<g id="trag"><text class="d" x="120" y="810" font-size="44">Missing it helped turn a standoff into a tragedy.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody is crazy.</text>
<text class="b" x="120" y="176" font-size="32">When someone seems irrational, assume they aren’t.</text>
<g id="conf"><text class="d" x="280" y="345" font-size="80" text-anchor="middle" style="fill:var(--loss)">?!</text><text class="m" x="280" y="650" font-size="20" text-anchor="middle">SEEMS IRRATIONAL</text></g>
<g id="arr5"><path class="s-muted" d="M380 470H530M512 454l18 16-18 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="doors"></g>
<g id="cur"><text class="d" x="120" y="800" font-size="50">Curiosity beats judgment every time.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen when guards drop.</text>
<text class="b" x="120" y="176" font-size="32">Black swans rarely show up in emails.</text>
