</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="84" letter-spacing="-2">Who is your <tspan style="fill:var(--gain)">plus</tspan></text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="84" letter-spacing="-2">right now, and when</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="84" letter-spacing="-2">did you last let them</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="84" letter-spacing="-2">correct you?</text></g>
<g id="qg"><circle class="gain" cx="1330" cy="440" r="110"/><path d="M1330 380v120M1270 440h120" stroke="var(--on-gain)" stroke-width="22" stroke-linecap="round"/></g>
<g id="qm"><circle class="ink" cx="1420" cy="330" r="44"/><text class="d" x="1420" y="348" font-size="52" text-anchor="middle" style="fill:var(--stage)">?</text></g>
<text class="m" x="143" y="720" font-size="26">ALWAYS STAY A STUDENT</text>
</g>