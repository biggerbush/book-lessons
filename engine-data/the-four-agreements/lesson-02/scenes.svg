<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Meet your inner</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Judge and Victim.</text>
<text class="b" x="120" y="600" font-size="32">Why we keep punishing ourselves for the same old mistake.</text>
<path class="ink" d="M1150 620q0-80 150-80t150 80z"/>
<circle class="s-ink" cx="1300" cy="380" r="150" fill="var(--stage)" stroke-width="7"/>
<g id="court">
<circle class="loss" cx="1300" cy="290" r="18"/>
<rect class="ink" x="1220" y="312" width="160" height="40" rx="6"/>
<g id="tg"><path class="s-ink" d="M1350 320l40-30" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="1378" y="272" width="30" height="18" transform="rotate(-37 1393 281)"/></g>
</g>
<g id="you0"><ellipse class="gain" cx="1300" cy="492" rx="54" ry="10" opacity=".5"/><text class="m" x="1334" y="468" font-size="24">YOU</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Book of Law.</text>
<text class="b" x="120" y="176" font-size="32">Everything we learned growing up gets written into it.</text>
<g id="child"><text class="m" x="220" y="610" font-size="20" text-anchor="middle">GROWING UP</text></g>
<g id="book">
<path class="s-ink" d="M300 500h100m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="440" y="260" width="320" height="440" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="760" y="260" width="320" height="440" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="760" y="742" font-size="22" text-anchor="middle">BOOK OF LAW</text>
</g>
<g id="rules"></g><g id="rp"></g>
<g id="ballot">
<rect class="s-ink" x="1180" y="420" width="220" height="180" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1250 450h80" stroke-width="8" stroke-linecap="round"/>
<path class="s-loss" d="M1230 480l120 100M1350 480l-120 100" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1290" y="650" font-size="20" text-anchor="middle">NEVER VOTED ON</text>
</g>
<g id="obey"><text class="d" x="120" y="810" font-size="44">We never voted on them. We obey anyway.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Judge.</text>
<text class="b" x="120" y="176" font-size="32">One part of the mind checks everything against the Book.</text>
<g id="bench">
<g id="jdg"></g>
<rect class="s-ink" x="200" y="480" width="500" height="280" rx="8" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="240" y="448" width="130" height="32" rx="4"/>
<text class="m" x="450" y="630" font-size="24" text-anchor="middle">THE JUDGE</text>
<g id="gv"><path class="s-ink" d="M560 470H648" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="640" y="440" width="40" height="36" rx="6"/></g>
</g>
<g id="rows"></g>
<rect id="scan" class="gain" x="850" y="250" width="640" height="6" opacity="0"/>
<g id="guilty"><text class="d" x="860" y="740" font-size="110" style="fill:var(--loss)">GUILTY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Victim.</text>
<text class="b" x="120" y="176" font-size="32">Another part receives the verdict and carries the weight.</text>
<g id="vic"><path class="s-line" d="M260 672h280" stroke-width="5" stroke-linecap="round"/></g>
<g id="blk"></g>
<g id="bub">
<text class="m" x="760" y="330" font-size="22">THE QUIET REFRAIN</text>
<path d="M764 480L458 504L764 530" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<rect x="760" y="360" width="660" height="200" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="d5" x="800" y="440" font-size="44">Poor me.</text>
<text class="d5" x="800" y="510" font-size="44">I am not good enough.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One small mistake.</text>
<text class="b" x="120" y="176" font-size="32">Picture yourself snapping at a friend after a long day.</text>
<g id="pair"><text class="m" x="380" y="670" font-size="20" text-anchor="middle">YOU</text><text class="m" x="880" y="670" font-size="20" text-anchor="middle">FRIEND</text></g>
<g id="burst"><text class="m" x="628" y="320" font-size="20" text-anchor="middle">AFTER A LONG DAY</text><path class="s-loss" d="M480 430l35-40 30 50 35-50 30 50 35-50 30 50 35-50 30 50 35-40" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<path id="sting" class="s-loss" d="M306 350l-20 24h22l-18 26" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="sign">
<path class="s-ink" d="M1260 400V660" stroke-width="8"/>
<rect class="loss" x="1080" y="280" width="360" height="120" rx="12"/>
<text class="d" x="1260" y="364" font-size="64" text-anchor="middle" style="fill:var(--stage)">GUILTY</text>
<text class="m" x="1260" y="700" font-size="20" text-anchor="middle">THE JUDGE’S VERDICT</text>
</g>
<g id="end4"><text class="d" x="120" y="800" font-size="48">That could be the end of it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Animals pay once.</text>
<text class="b" x="120" y="176" font-size="32">Humans can pay a thousand times for the same mistake.</text>
<text class="m" x="160" y="280" font-size="22">ANIMAL</text>
<g id="dog"><ellipse class="ink" cx="250" cy="385" rx="70" ry="30"/><circle class="ink" cx="330" cy="350" r="26"/><path class="ink" d="M318 330l-14-26 26 12z"/><path class="s-ink" d="M200 400v35M230 405v30M275 405v30M300 400v35M182 375l-26-30" stroke-width="8" stroke-linecap="round" fill="none"/></g>
<path class="s-line" d="M420 380H1440" stroke-width="4"/>
<g id="m1"><circle class="loss" cx="520" cy="380" r="16"/><text class="m" x="520" y="430" font-size="20" text-anchor="middle">PAID ONCE</text></g>
<path id="mvA" class="s-gain" d="M600 380H1390" stroke-width="8" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800" fill="none"/>
<g id="mvL"><path class="s-gain" d="M1370 360l24 20-24 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1440" y="340" font-size="20" text-anchor="end" style="fill:var(--gain)">MOVES ON</text></g>
<g id="hum"><text class="m" x="160" y="490" font-size="22">HUMAN</text><path class="s-line" d="M420 640H1440" stroke-width="4"/><text class="m" x="420" y="700" font-size="20">PAYS AGAIN AND AGAIN</text></g>
<g id="mks"></g>
<g id="cntG"><text id="cnt" class="d" x="1480" y="790" font-size="72" text-anchor="end" style="fill:var(--loss)">0×</text></g>
<g id="reop"><text class="m" x="420" y="790" font-size="22">EVERY MEMORY REOPENS THE CASE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Paying again, and again.</text>
<text class="b" x="120" y="176" font-size="32">Someone reminds us, and we pay with fresh guilt.</text>
<g id="ptn"><g id="ptF"></g><text class="m" x="230" y="630" font-size="20" text-anchor="middle">PARTNER OR FAMILY</text><text class="m" x="560" y="630" font-size="20" text-anchor="middle">YOU</text></g>
<g id="rbub">
<path d="M260 328L240 380L310 328" fill="var(--stage)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
<rect x="120" y="240" width="400" height="90" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<text class="d5" x="150" y="298" font-size="34">Remember when…?</text>
</g>
<g id="scale">
<path class="s-ink" d="M1120 300V720" stroke-width="8"/>
<rect class="ink" x="1020" y="716" width="200" height="20" rx="6"/>
<path id="beam" class="s-ink" d="M860 300H1380" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1120" cy="300" r="12"/>
<g id="panL"><path class="s-ink" d="M0 0L-70 140M0 0L70 140" stroke-width="3"/><rect class="loss" x="-40" y="96" width="80" height="44" rx="6"/><path class="ink" d="M-75 140a75 34 0 0 0 150 0z"/><text class="m" x="0" y="205" font-size="18" text-anchor="middle">1 MISTAKE</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-70 140M0 0L70 140" stroke-width="3"/><g id="coinsG"></g><path class="ink" d="M-75 140a75 34 0 0 0 150 0z"/><text class="m" x="0" y="205" font-size="18" text-anchor="middle">PAYMENTS</text></g>
</g>
<g id="inj"><text class="d" x="1236" y="680" font-size="40" style="fill:var(--loss)">INJUSTICE</text></g>
<g id="just"><text class="d" x="120" y="810" font-size="44">True justice: one mistake, paid once.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">No one is harsher than us.</text>
<text class="b" x="120" y="176" font-size="32">No one abuses us more than we abuse ourselves.</text>
<g id="mir"><g id="mirF"></g><ellipse class="s-ink" cx="440" cy="470" rx="110" ry="180" fill="none" stroke-width="7"/><path class="s-ink" d="M440 650v40M390 690h100" stroke-width="7" stroke-linecap="round"/><text class="m" x="440" y="740" font-size="22" text-anchor="middle">SELF-ABUSE</text></g>
<path id="zap" class="s-loss" d="M306 320l-16 22h18l-14 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="lim">
<path class="s-line" d="M780 680H1460" stroke-width="5"/>
<g id="pk"></g><g id="limF"></g>
<text class="m" x="1115" y="720" font-size="20" text-anchor="middle">THE LIMIT</text>
<text class="m" x="1460" y="440" font-size="20" text-anchor="end">HARSHNESS FROM OTHERS</text>
<g id="arrs"></g>
</g>
<g id="quiet"><text class="d" x="120" y="810" font-size="44">Quiet the Judge, and the limit rises.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Have you already</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">paid for this mistake?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Then <tspan style="fill:var(--gain)">close the case.</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">LET THE VICTIM SET DOWN THE WEIGHT</text>
<g id="fold">
<rect class="ink" x="1250" y="582" width="70" height="24" rx="6"/>
<rect class="s-ink" x="1240" y="600" width="200" height="180" rx="8" fill="var(--stage)" stroke-width="6"/>
<rect id="paper" class="s-ink" x="1265" y="540" width="150" height="150" fill="var(--stage)" stroke-width="4"/>
<rect class="s-ink" x="1240" y="650" width="200" height="130" rx="8" fill="var(--line)" stroke-width="6"/>
<g id="stamp"><rect class="gain" x="1280" y="680" width="120" height="56" rx="8"/><text class="d" x="1340" y="720" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">PAID</text></g>
</g>
</g>