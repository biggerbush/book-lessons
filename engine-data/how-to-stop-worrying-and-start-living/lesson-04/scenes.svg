<text class="m" x="880" y="600" font-size="20" text-anchor="middle">STRUCK BY LIGHTNING</text>
</g></g>
<g id="f2"><g id="f2i">
<rect class="s-line" x="1120" y="240" width="320" height="380" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M1220 540V400a60 60 0 0 1 120 0V540z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1280 410v70M1255 435h50M1170 540h220" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1280" y="600" font-size="20" text-anchor="middle">BURIED ALIVE</text>
</g></g>
<g id="never"><text class="m" x="720" y="690" font-size="24" style="fill:var(--gain)">ALMOST NONE OF IT EVER HAPPENED</text></g>
