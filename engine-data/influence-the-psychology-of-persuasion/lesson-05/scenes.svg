<g id="b2"><rect x="1340" y="250" width="140" height="70" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="1410" y="298" font-size="36" text-anchor="middle" style="fill:var(--gain)">YES!</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Tupperware party.</text>
<text class="b" x="120" y="176" font-size="32">The real pull comes from the friend who invited you.</text>
<g id="room"><rect class="ink" x="560" y="560" width="480" height="22" rx="6"/><path class="s-ink" d="M590 582v90M1010 582v90" stroke-width="8" stroke-linecap="round"/><g id="cont"></g><g id="gst"></g></g>
