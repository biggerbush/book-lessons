<path class="s-ink" d="M690 600V310" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M690 310l50 22-50 22z"/>
<g id="ld2f"></g>
<text class="d5" x="150" y="690" font-size="36">Works with his men.</text></g>
<g id="ld6"><rect class="s-line" x="840" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">CREW SIX’S LEADER</text>
