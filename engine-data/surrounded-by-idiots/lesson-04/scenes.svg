<g id="g_team"><circle class="s-gain" cx="400" cy="610" r="130" fill="none" stroke-width="5"/><g id="g_tp"></g><text class="d" x="400" y="636" font-size="76" text-anchor="middle" style="fill:var(--gain)">WE</text><text class="m" x="400" y="820" font-size="22" text-anchor="middle">WE, NOT ME</text></g>
<g id="g_ear"><g transform="translate(1160 420)"><path class="s-ink" d="M-40-40C-40-110 70-110 70-30C70 20 30 30 25 70C20 110-20 115-30 90" fill="none" stroke-width="12" stroke-linecap="round"/><path class="s-ink" d="M-10-30C-10-60 35-60 35-25C35 0 10 0 10 20" fill="none" stroke-width="8" stroke-linecap="round"/></g><g id="g_wv"></g></g>
