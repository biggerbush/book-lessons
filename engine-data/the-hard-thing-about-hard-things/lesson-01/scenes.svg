<g id="team"></g>
<text id="entL" class="m" x="1150" y="640" font-size="20" text-anchor="middle">GREAT HIRES, ACTING ENTITLED</text>
<g id="nobook"><text class="d" x="120" y="760" font-size="50">No book has a tidy formula for these.</text></g>
<g id="decide"><text class="m" x="120" y="830" font-size="22" style="fill:var(--gain)">THESE MOMENTS DECIDE WHETHER A COMPANY SURVIVES</text></g>
</g>

<g id="s3" opacity="0">
