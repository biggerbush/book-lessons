<rect class="ink" x="450" y="600" width="600" height="70" rx="18"/>
<rect class="ink" x="480" y="668" width="16" height="37"/><rect class="ink" x="1004" y="668" width="16" height="37"/>
<circle class="gain" cx="540" cy="568" r="32"/><rect class="gain" x="578" y="560" width="340" height="40" rx="20"/>
</g>
<g id="stu"></g>
<g id="bq"><rect class="s-ink" x="950" y="330" width="460" height="100" rx="20" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M1170 428l30 40 4-40" fill="var(--stage)" stroke-width="4"/><text class="d5" x="975" y="392" font-size="30">“Can you take any punch?”</text></g>
