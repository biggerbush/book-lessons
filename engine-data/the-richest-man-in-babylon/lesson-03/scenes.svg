<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE RICHEST MAN IN BABYLON · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Tell needs apart</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">from desires.</text>
<text class="b" x="120" y="600" font-size="32">Why spending grows with every raise, and how to stop it.</text>
<path class="s-ink" d="M1240 470Q1190 660 1330 670Q1470 660 1420 470Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M1270 470l-20-40h160l-20 40" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="tcoins"></g>
<text id="tq" class="d" x="1330" y="610" font-size="110" text-anchor="middle" style="fill:var(--loss)">?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Arkad’s classroom.</text>
<text class="b" x="120" y="176" font-size="32">Teaching ordinary Babylonians how to fatten a lean purse.</text>
<g id="arkadW"><g id="arkad"></g>
<g id="purse"><path class="gain" d="M-30 -30q-14 70 30 74q44-4 30-74z" stroke="var(--ink)" stroke-width="4"/><path d="M-22 -30l-10-16h64l-10 16" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></g>
<text class="m" x="320" y="610" font-size="22" text-anchor="middle">ARKAD</text></g>
<g id="studs"></g>
<rect class="ink" x="700" y="590" width="680" height="14" rx="7"/>
<text class="m" x="1040" y="650" font-size="22" text-anchor="middle">STUDENTS</text>
<g id="arm"><path class="s-ink" d="M1070 520L1092 412" stroke-width="9" stroke-linecap="round"/><circle class="gain" cx="1094" cy="404" r="12"/></g>
<g id="bub1"><rect class="s-ink" x="780" y="220" width="560" height="150" rx="20" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M990 370l-10 50 40-50" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/>
<text class="d5" x="810" y="285" font-size="32">“Every coin goes to needs.”</text>
<text id="bq2" class="d5" x="810" y="340" font-size="32" style="fill:var(--loss)">“How can I keep any?”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Expenses grow to match income.</text>
<text class="b" x="120" y="176" font-size="32">True for almost everyone, whatever they earn.</text>
<path class="s-ink" d="M140 260V760H680" fill="none" stroke-width="4" stroke-linecap="round"/>
<g id="bars"></g>
<g id="leg2"><rect class="gain" x="140" y="794" width="24" height="24"/><text class="m" x="176" y="814" font-size="20">INCOME</text><rect class="loss" x="330" y="794" width="24" height="24"/><text class="m" x="366" y="814" font-size="20">EXPENSES</text></g>
<g id="scroll"><rect class="s-ink" x="780" y="240" width="660" height="270" rx="10" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="760" y="228" width="28" height="294" rx="14"/><rect class="ink" x="1440" y="228" width="28" height="294" rx="14"/>
<text class="d5" x="812" y="320" font-size="30">“Necessary expenses will always</text><text class="d5" x="812" y="380" font-size="30">grow to equal our incomes</text><text class="d5" x="812" y="440" font-size="30">unless we <tspan style="fill:var(--gain)">protest</tspan> to the contrary.”</text>
<text class="m" x="812" y="486" font-size="20">ARKAD</text></g>
<g id="houses">
<rect class="s-ink" x="850" y="650" width="140" height="90" fill="var(--stage)" stroke-width="5"/><polygon class="ink" points="832,650 920,592 1008,650"/><rect class="ink" x="902" y="694" width="36" height="46"/>
<rect class="s-ink" x="1150" y="620" width="280" height="120" fill="var(--stage)" stroke-width="5"/><polygon class="ink" points="1130,620 1290,562 1450,620"/><path class="s-line" d="M1196 638v102M1252 638v102M1328 638v102M1384 638v102" stroke-width="6"/>
<path class="s-loss" d="M856 766H984M856 766l16-12M856 766l16 12M984 766l-16-12M984 766l-16 12M1156 766H1424M1156 766l16-12M1156 766l16 12M1424 766l-16-12M1424 766l-16 12" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="920" y="806" font-size="20" text-anchor="middle">POOR WORKER</text><text class="m" x="1290" y="806" font-size="20" text-anchor="middle">WEALTHY MERCHANT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Needs versus desires.</text>
<text class="b" x="120" y="176" font-size="32">We mix up two different things.</text>
<g id="basket"><text class="d" x="400" y="270" font-size="48" text-anchor="middle" style="fill:var(--gain)">Needs</text>
<polygon class="s-ink" points="180,520 620,520 580,680 220,680" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-line" d="M240 565h320M250 610h300M262 650h276" stroke-width="4"/></g>
<g id="ni0"><ellipse class="gain" cx="260" cy="470" rx="70" ry="36"/><path d="M232 455l-12 22M262 452l-12 26M292 455l-12 22" stroke="var(--stage)" stroke-width="4"/></g>
<g id="ni1"><polygon class="ink" points="350,505 350,450 405,402 460,450 460,505"/></g>
<g id="ni2"><path class="ink" d="M495 430l25-15h20l25 15 15 30-22 8v47h-56v-47l-22-8z"/></g>
<g id="fhc"><text class="m" x="400" y="730" font-size="22" text-anchor="middle">FED · HOUSED · CLOTHED</text></g>
<g id="neq"><text class="d" x="740" y="535" font-size="110" text-anchor="middle" style="fill:var(--muted)">≠</text></g>
<g id="cloud"><text class="d" x="1100" y="270" font-size="48" text-anchor="middle" style="fill:var(--loss)">Desires</text></g>
<g id="fam"><text class="d" x="120" y="820" font-size="40">Every family wants more than any income can pay.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write it all down.</text>
<text class="b" x="120" y="176" font-size="32">Keep only true needs that fit in nine tenths of your income.</text>
<g id="paper"><rect class="s-ink" x="140" y="220" width="540" height="600" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="180" y="268" font-size="22">MY LIST</text></g>
<g id="list"></g>
<g id="penW"><g id="pen"></g></g>
<g id="inc4"><text class="m" x="820" y="370" font-size="22">YOUR INCOME</text></g>
<g id="segs"></g>
<g id="seglab"><text class="m" x="820" y="520" font-size="20">NINE TENTHS: NEEDS ONLY</text><text class="m" x="1425" y="520" font-size="20" text-anchor="middle" style="fill:var(--gain)">KEEP</text></g>
<g id="regret"><text class="d" x="820" y="700" font-size="60">Without regret.</text><rect class="gain" x="824" y="726" width="160" height="10"/></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A budget is a guard.</text>
<g id="sub5"><text class="b" x="120" y="176" font-size="32">It is meant to help you, not to punish you.</text></g>
<g id="tab"><rect class="s-ink" x="140" y="260" width="340" height="420" rx="24" fill="var(--stage)" stroke-width="6"/><text class="d" x="310" y="340" font-size="44" text-anchor="middle">Budget</text></g>
<g id="trows"></g>
<g id="arr5"><path class="s-muted" d="M510 470h290m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="chest"><circle class="s-gain" cx="1060" cy="520" r="200" fill="none" stroke-width="8"/>
<path class="gain" d="M975 500v-30a85 40 0 0 1 170 0v30z" stroke="var(--ink)" stroke-width="4"/><rect class="gain" x="975" y="500" width="170" height="110" rx="8" stroke="var(--ink)" stroke-width="4"/><rect class="ink" x="1046" y="490" width="28" height="36" rx="6"/>
<text class="m" x="1060" y="660" font-size="18" text-anchor="middle">WHAT MATTERS MOST</text></g>
<g id="wants"></g>
<g id="wl"><text class="m" x="1480" y="696" font-size="20" text-anchor="end" style="fill:var(--loss)">PASSING WANTS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Unless we protest.</text>
<g id="sub6"><text class="b" x="120" y="176" font-size="32">Spending creeps upward on its own, every time income rises.</text></g>
<path class="s-ink" d="M160 260V760H1100" fill="none" stroke-width="4" stroke-linecap="round"/>
<polyline id="inc" class="s-gain" fill="none" stroke-width="7" stroke-linejoin="round"/>
<polyline id="spd" class="s-loss" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="leg6"><path class="s-gain" d="M160 805h40" stroke-width="6"/><text class="m" x="214" y="812" font-size="20">INCOME</text><path class="s-loss" d="M380 805h40" stroke-width="6"/><text class="m" x="434" y="812" font-size="20">SPENDING</text></g>
<g id="gap"><path class="s-gain" d="M1040 352V542" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="900" y="470" font-size="40" text-anchor="middle" style="fill:var(--gain)">Saved</text></g>
<g id="stop"><polygon id="oct" class="gain"/><text class="d" x="1320" y="413" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">PROTEST</text></g>
<g id="dec"><text class="d5" x="1200" y="600" font-size="38">Decide it.</text><text class="d5" x="1200" y="652" font-size="38">Write it down.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same principle, new tools.</text>
<text class="b" x="120" y="176" font-size="32">A spreadsheet or a banking app works like the tablet.</text>
<g id="oldt"><rect class="s-ink" x="140" y="330" width="220" height="290" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M175 400h150M175 450h150M175 500h110M175 550h130" stroke-width="8" stroke-linecap="round"/></g>
<g id="arr7"><path class="s-muted" d="M390 475h100m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="phone"><rect class="s-ink" x="540" y="220" width="340" height="610" rx="40" fill="var(--stage)" stroke-width="7"/><rect class="s-line" x="670" y="245" width="80" height="8" rx="4" fill="var(--line)" stroke-width="0"/><text class="m" x="580" y="300" font-size="22">BUDGET</text></g>
<g id="prow"></g>
<ellipse id="circ" class="s-gain" cx="710" cy="578" rx="160" ry="44" fill="none" stroke-width="6"/>
<text class="m" x="964" y="320" font-size="20">THE PRINCIPLE IS THE SAME</text>
<g id="pr1"><circle class="gain" cx="990" cy="398" r="26"/><text class="d" x="990" y="409" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">1</text><text class="d" x="1036" y="412" font-size="38">Name your real needs.</text></g>
<g id="pr2"><circle class="gain" cx="990" cy="520" r="26"/><text class="d" x="990" y="531" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">2</text><text class="d" x="1036" y="534" font-size="38">Make every desire</text><text class="d" x="1036" y="586" font-size="38">earn its place.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">Which desire will you</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">cross out <tspan style="fill:var(--gain)">first?</tspan></text></g>
<g id="tonight"><text class="m" x="143" y="640" font-size="26">TONIGHT: LIST YOUR LAST TEN PURCHASES</text></g>
<g id="pp"><rect class="s-ink" x="1220" y="230" width="240" height="560" rx="12" fill="var(--stage)" stroke-width="5"/></g>
<g id="prows"></g>
</g>