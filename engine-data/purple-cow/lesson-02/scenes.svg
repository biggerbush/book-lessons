<text class="m" x="750" y="444" font-size="22" text-anchor="middle" style="fill:var(--ink)">AVERAGE</text>
<text class="d" x="910" y="460" font-size="64" text-anchor="middle" style="fill:var(--muted)">+</text>
<rect class="gain" x="960" y="360" width="200" height="150" rx="10"/>
<text class="d" x="1060" y="455" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">$$$</text>
<text class="d" x="1205" y="460" font-size="64" text-anchor="middle" style="fill:var(--muted)">=</text>
</g>
<g id="eq7b">
