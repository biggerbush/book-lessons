<rect class="ink" x="1140" y="480" width="280" height="24" rx="6"/>
<path class="s-ink" d="M1150 504v50M1410 504v50" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="1110" y="610" font-size="36">A short rest.</text></g>
<g id="hurt"><text class="d" x="120" y="800" font-size="48">So losing hurt even more.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two leaders.</text>
<text class="b" x="120" y="176" font-size="32">Same training, very different attitudes.</text>
<g id="ld2"><rect class="s-line" x="120" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
