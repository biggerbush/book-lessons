<g id="qc"><text class="d" x="120" y="480" font-size="66" letter-spacing="-1">before you take it</text></g>
<g id="qd"><text class="d" x="120" y="570" font-size="66" letter-spacing="-1">to a <tspan style="fill:var(--gain)">meeting</tspan>.</text></g>
