<g id="lf2"><path class="gain" d="M1350 296q-34-24-20-66q32 26 20 66z"/><path class="gain" d="M1350 296q34-24 20-66q-32 26-20 66z"/></g>
<path class="ink" d="M1290 566h120l-16 84h-88z"/>
