<text class="m" x="1180" y="680" font-size="22" text-anchor="middle">COULD I COPE WITH THE UNKNOWN?</text>
</g>
<g id="rdy"><text class="d" x="120" y="800" font-size="48">Being ready beats guessing.</text><rect class="gain" x="124" y="824" width="200" height="10"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep a cushion for the unknown.</text>
<text class="b" x="120" y="176" font-size="32">A buffer not assigned to any particular disaster.</text>
<g id="jar">
