<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The bet that nearly</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">broke him.</text>
<text class="b" x="120" y="600" font-size="32">How being spectacularly wrong taught Ray Dalio a better question.</text>
<g id="ball">
<path class="ink" d="M1250 560h160l-24-50h-112z"/>
<circle class="s-ink" cx="1330" cy="400" r="110" fill="var(--stage)" stroke-width="8"/>
<path class="s-loss" d="M1270 350l40 40 30-20 50 70m0 0v-34m0 34h-34" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1330" y="610" font-size="22" text-anchor="middle">1982</text>
</g>
<path id="crack" class="s-ink" d="M1300 292l18 44-26 30 34 40-20 46 28 36" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A young star.</text>
<text class="b" x="120" y="176" font-size="32">Ray Dalio, running a small firm called Bridgewater.</text>
<g id="dal"><g id="dalp"></g><rect class="ink" x="190" y="536" width="300" height="16" rx="8"/>
<text class="m" x="340" y="600" font-size="22" text-anchor="middle">BRIDGEWATER</text>
<text class="m" x="340" y="634" font-size="20" text-anchor="middle">SMALL INVESTMENT FIRM</text></g>
<g id="dchart">
<path class="s-ink" d="M680 260V700H1460" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="700" y="270" font-size="20">BORROWING</text>
<path class="s-gain" d="M1040 263h44" stroke-width="5" stroke-dasharray="10 8"/>
<text class="m" x="1096" y="270" font-size="20" style="fill:var(--gain)">WHAT THEY COULD PAY BACK</text>
<g id="bars"></g>
<path class="s-gain" d="M690 560H1450" stroke-width="5" stroke-dasharray="14 10"/>
<text class="m" x="795" y="732" font-size="20" text-anchor="middle" style="fill:var(--loss)">MEXICO</text>
<text class="m" x="1155" y="732" font-size="20" text-anchor="middle">OTHER BORROWERS</text>
</g>
<g id="mex">
<path d="M740 510l22 18 22-18 22 18 22-18 22 18" fill="none" stroke="var(--stage)" stroke-width="8" stroke-linejoin="round"/>
<rect x="690" y="300" width="210" height="44" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<text class="m" x="795" y="329" font-size="20" text-anchor="middle" style="fill:var(--loss)">DEFAULTS · 1982</text>
<path class="s-loss" d="M795 344v20" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="chk"><circle class="gain" cx="164" cy="792" r="40"/><path d="M146 792l14 14 24-28" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="230" y="810" font-size="50">It felt like proof he was razor sharp.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Going public.</text>
<text class="b" x="120" y="176" font-size="32">He told everyone a depression was coming.</text>
<g id="tv">
<rect class="s-ink" x="150" y="260" width="360" height="270" rx="18" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M300 530l-30 60M360 530l30 60M250 594h160" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="tvp"></g>
<rect class="s-loss" x="180" y="450" width="300" height="56" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="330" y="486" font-size="20" text-anchor="middle" style="fill:var(--loss)">DEPRESSION COMING</text>
<text class="m" x="330" y="680" font-size="22" text-anchor="middle">ON TELEVISION</text></g>
<g id="cap">
<path class="s-ink" d="M700 380a100 100 0 0 1 200 0z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M800 280v-30" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="650" y="380" width="300" height="22"/>
<path class="s-ink" d="M680 410v130M740 410v130M800 410v130M860 410v130M920 410v130" stroke-width="12"/>
<rect class="ink" x="630" y="540" width="340" height="26"/>
<text class="m" x="800" y="680" font-size="22" text-anchor="middle">BEFORE CONGRESS</text>
<text class="m" x="800" y="714" font-size="20" text-anchor="middle" style="fill:var(--loss)">WARNING OF COLLAPSE</text></g>
<g id="chips"></g>
<g id="chl"><text class="m" x="1280" y="680" font-size="22" text-anchor="middle">BETS TO MATCH</text><text class="m" x="1280" y="714" font-size="20" text-anchor="middle">HIS CONFIDENCE</text></g>
<g id="conf"><text class="d" x="120" y="810" font-size="48">Certain, public, and all in.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The opposite happened.</text>
<text class="b" x="120" y="176" font-size="32">Money got easier to borrow, and the market soared.</text>
<g id="fed">
<path class="s-ink" d="M140 330L310 262L480 330z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="ink" x="140" y="336" width="340" height="18"/>
<path class="s-ink" d="M190 364v150M250 364v150M310 364v150M370 364v150M430 364v150" stroke-width="12"/>
<rect class="ink" x="140" y="520" width="340" height="22"/>
<text class="m" x="310" y="590" font-size="20" text-anchor="middle">FEDERAL RESERVE</text>
<g id="coins"></g>
<text class="m" x="310" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">MONEY EASIER TO BORROW</text></g>
<g id="mkt">
<path class="s-ink" d="M620 250V740H1460" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M640 480L1430 690" fill="none" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
<text class="m" x="1440" y="720" font-size="20" text-anchor="end" style="fill:var(--loss)">HIS CALL: COLLAPSE</text></g>
<polyline id="up" class="s-gain" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<circle id="uph" class="gain" cx="1430" cy="290" r="13"/>
<g id="upl"><text class="m" x="1440" y="262" font-size="20" text-anchor="end" style="fill:var(--gain)">THE STOCK MARKET</text></g>
<g id="opp"><text class="d" x="120" y="830" font-size="50">Not just wrong. <tspan style="fill:var(--loss)">The opposite.</tspan></text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Losing it all.</text>
<text class="b" x="120" y="176" font-size="32">Bridgewater’s office empties out.</text>
<rect class="s-line" x="130" y="230" width="740" height="410" rx="18" fill="none" stroke-width="4"/>
<g id="office"></g>
<text class="m" x="130" y="680" font-size="22">BRIDGEWATER</text>
<g id="loan">
<g id="lp"></g>
<rect id="bill" class="gain" x="1120" y="360" width="80" height="44" rx="6"/>
<text class="m" x="1060" y="500" font-size="20" text-anchor="middle">FATHER</text>
<text class="m" x="1380" y="500" font-size="20" text-anchor="middle" style="fill:var(--gain)">DALIO</text>
<text id="amt" class="d" x="1220" y="610" font-size="100" text-anchor="middle">$4,000</text>
<text class="m" x="1220" y="660" font-size="20" text-anchor="middle">BORROWED TO PAY FAMILY BILLS</text></g>
<g id="one"><text class="d" x="120" y="800" font-size="52">Down to one person: <tspan style="fill:var(--gain)">himself.</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The real mistake.</text>
<text class="b" x="120" y="176" font-size="32">Dalio looked back at what went wrong.</text>
<g id="mir">
<ellipse class="s-ink" cx="330" cy="440" rx="150" ry="190" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M330 630v60M260 696h140" stroke-width="8" stroke-linecap="round"/>
<g id="mirp" opacity=".5"></g>
<text class="m" x="330" y="760" font-size="22" text-anchor="middle">NOT A LACK OF INTELLIGENCE</text></g>
<g id="stamp"><g transform="rotate(-10 330 450)"><rect class="s-loss" x="170" y="408" width="320" height="86" rx="10" fill="var(--stage)" stroke-width="7"/><text class="d" x="330" y="468" font-size="50" text-anchor="middle" style="fill:var(--loss)">Arrogance.</text></g></g>
<g id="bl">
<path class="gain" d="M1070 500L1030 290H1170L1130 500z" fill-opacity=".25"/>
<text class="m" x="1100" y="270" font-size="20" text-anchor="middle" style="fill:var(--gain)">HIS OWN VIEW</text>
<circle class="ink" cx="1100" cy="560" r="72"/>
<path class="s-loss" d="M1028 520L1008 380M1172 520L1192 380" stroke-width="16" stroke-linecap="round"/>
<g id="arrs"></g>
<text class="m" x="790" y="400" font-size="20">OTHER VIEWS</text>
<text class="m" x="1440" y="400" font-size="20" text-anchor="end">TESTS</text></g>
<g id="nt"><text class="d5" x="790" y="760" font-size="36">Trusted completely. Never tested.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A new question.</text>
<text class="b" x="120" y="176" font-size="32">One small shift in what he asked himself.</text>
<g id="q1"><rect class="s-line" x="120" y="240" width="500" height="220" rx="20" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="150" y="290" font-size="20">BEFORE</text><text id="q1t" class="d" x="150" y="400" font-size="64">Am I right?</text></g>
<line id="q1s" class="s-loss" x1="140" y1="380" x2="140" y2="380" stroke-width="7" stroke-linecap="round" opacity="0"/>
<g id="q2"><path class="s-muted" d="M640 350h56m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="gain" x="720" y="240" width="760" height="220" rx="20"/>
<text class="m" x="750" y="290" font-size="20" style="fill:var(--on-gain)">NOW</text>
<text class="d" x="750" y="366" font-size="58" style="fill:var(--on-gain)">How do I know</text>
<text class="d" x="750" y="434" font-size="58" style="fill:var(--on-gain)">I am right?</text></g>
<g id="dec"></g>
<g id="decl"><text class="m" x="120" y="760" font-size="22">EVERY BIG DECISION AFTERWARD</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Testing your view.</text>
<text class="b" x="120" y="176" font-size="32">Seek out disagreement, and make your bets survivable.</text>
<g id="th"><text class="m" x="220" y="610" font-size="20" text-anchor="middle" style="fill:var(--gain)">DALIO</text>
<text class="m" x="650" y="610" font-size="20" text-anchor="middle">SMART PEOPLE WHO DISAGREE</text></g>
<g id="why"><rect x="160" y="300" width="120" height="56" rx="14" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><text class="m" x="220" y="336" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHY?</text></g>
<path id="lnk" class="s-gain" d="M280 500H448" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<g id="und"><text class="d5" x="120" y="720" font-size="36">Not to win the argument,</text><text class="d5" x="120" y="770" font-size="36" style="fill:var(--gain)">but to understand their reasoning.</text></g>
<g id="sh">
<path class="s-gain" d="M1210 300L1340 340V460C1340 550 1280 600 1210 630C1140 600 1080 550 1080 460V340Z" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/>
<g id="shc"></g>
<path id="hitp" class="s-loss" stroke-width="8" stroke-linecap="round"/>
<circle id="hitc" class="loss" r="10"/>
<circle id="spk" class="s-gain" cx="1345" cy="356" fill="none" stroke-width="5"/>
<text class="m" x="1460" y="236" font-size="20" text-anchor="end" style="fill:var(--loss)">IF HE’S WRONG</text>
<text class="m" x="1210" y="690" font-size="20" text-anchor="middle">BETS THAT WON’T RUIN HIM</text></g>
</g>

<g id="s8" opacity="0">
<g id="qlab"><text class="m" x="143" y="220" font-size="26">THINK OF ONE BELIEF YOU HOLD WITH TOTAL CONFIDENCE</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="72" letter-spacing="-1">How do I know</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="72" letter-spacing="-1">I am right, and</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="72" letter-spacing="-1">who could show me</text></g>
<g id="qd"><text class="d" x="136" y="610" font-size="72" letter-spacing="-1">I am <tspan style="fill:var(--gain)">wrong</tspan>?</text></g>
<g id="blf">
<text class="m" x="1180" y="252" font-size="20" text-anchor="middle">YOUR BELIEF</text>
<rect class="s-ink" x="1000" y="330" width="360" height="110" rx="55" fill="var(--stage)" stroke-width="7"/>
<text class="d5" x="1180" y="402" font-size="48" text-anchor="middle">I’m sure.</text></g>
<g id="lensw"><g id="lens2"><circle class="s-gain" cx="0" cy="0" r="90" fill="var(--stage)" fill-opacity=".2" stroke-width="14"/><path class="s-gain" d="M64 64l66 66" stroke-width="22" stroke-linecap="round"/></g></g>
<g id="dis">
<g id="disp"></g>
<path d="M1298 578L1352 600L1298 608" fill="var(--stage)" stroke="var(--loss)" stroke-width="4" stroke-linejoin="round"/>
<rect x="1120" y="560" width="180" height="64" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<text class="m" x="1210" y="600" font-size="22" text-anchor="middle" style="fill:var(--loss)">ARE YOU?</text>
<text class="m" x="1470" y="790" font-size="20" text-anchor="end">SOMEONE WHO DISAGREES</text></g>
</g>