<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The big question.</text>
<text class="b" x="120" y="176" font-size="32">Can a merely good company ever become truly great?</text>
<g id="qm"><text class="d" x="320" y="640" font-size="300" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="320" y="700" font-size="20" text-anchor="middle">GOOD → GREAT?</text></g>
