<g id="tnr"><text class="m" x="1310" y="620" font-size="20" text-anchor="middle">NO REPLY</text><text class="m" x="1310" y="652" font-size="20" text-anchor="middle" style="fill:var(--gain)">IS AN ANSWER</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chasing drains you.</text>
<text class="b" x="120" y="176" font-size="32">When the effort only runs one way.</text>
<g id="p1a"><rect class="s-line" x="120" y="230" width="420" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><g id="chase"></g><text class="m" x="330" y="590" font-size="20" text-anchor="middle">YOU DO THE CHASING</text></g>
<g id="p1b"><rect class="s-line" x="590" y="230" width="420" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="ink" x="620" y="256" width="360" height="44" rx="8"/><text class="m" x="800" y="285" font-size="20" text-anchor="middle" style="fill:var(--stage)">PLANS</text><g id="cal"></g><text class="m" x="800" y="590" font-size="20" text-anchor="middle">YOU PLAN IT ALL</text></g>
