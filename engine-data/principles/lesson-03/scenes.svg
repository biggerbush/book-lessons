<g id="sigw"><text class="d" x="120" y="840" font-size="46">Each one is a signal worth reading.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One simple formula.</text>
<g id="quo"><text class="b" x="120" y="176" font-size="32">“Pain plus reflection equals progress.” Ray Dalio</text></g>
<g id="e0"><rect class="s-loss" x="120" y="240" width="320" height="120" rx="18" fill="var(--stage)" stroke-width="6"/><text class="d" x="280" y="318" font-size="52" text-anchor="middle" style="fill:var(--loss)">Pain</text></g>
