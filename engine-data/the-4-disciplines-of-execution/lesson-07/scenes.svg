<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The weekly rhythm</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of accountability.</text>
<text class="b" x="120" y="600" font-size="32">A short weekly meeting that keeps your top goal alive.</text>
<g id="clk"><circle class="s-ink" cx="1300" cy="420" r="140" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g><path id="hand" class="s-gain" d="M1300 420V310" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1300" cy="420" r="12"/><text class="m" x="1300" y="620" font-size="22" text-anchor="middle">EVERY WEEK</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Goals fade quietly.</text>
<text class="b" x="120" y="176" font-size="32">The goal simply stops coming up.</text>
<text id="mon" class="m" x="120" y="260" font-size="24">JANUARY</text>
<g id="team"><g id="teamp"></g><rect class="ink" x="200" y="600" width="680" height="20" rx="6"/><path class="s-ink" d="M240 620V760M840 620V760" stroke-width="8" stroke-linecap="round"/></g>
<g id="goal"><g id="gcard"><rect class="gain" x="1000" y="300" width="380" height="140" rx="14"/><text class="d" x="1190" y="388" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">BOLD GOAL</text></g></g>
<g id="pile"></g>
<g id="quit1"><text class="d" x="120" y="830" font-size="46">Nobody decided to quit.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The WIG session.</text>
<text class="b" x="120" y="176" font-size="32">WIG = wildly important goal. Same day, same time, every week.</text>
<g id="cal"><rect class="s-ink" x="110" y="230" width="720" height="440" rx="14" fill="var(--stage)" stroke-width="5"/></g>
<g id="ssl"><text class="m" x="120" y="712" font-size="22">SAME DAY · SAME TIME · EVERY WEEK</text></g>
<g id="sw"><rect class="ink" x="1160" y="264" width="40" height="30" rx="6"/><circle class="s-ink" cx="1180" cy="470" r="170" fill="var(--stage)" stroke-width="8"/><circle class="s-line" cx="1180" cy="470" r="140" fill="none" stroke-width="22"/><path id="swarc" class="s-gain" fill="none" stroke-width="22"/><text class="d" x="1180" y="495" font-size="72" text-anchor="middle">20–30</text><text class="m" x="1180" y="545" font-size="22" text-anchor="middle">MINUTES</text></g>
<g id="beats"><text class="d" x="120" y="800" font-size="44">Short and predictable beats long and occasional.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 1: Account.</text>
<text class="b" x="120" y="176" font-size="32">Did you keep last week’s commitments? Yes or no.</text>
<g id="ring3"><circle class="s-line" cx="560" cy="500" r="110" fill="var(--stage)" stroke-width="5"/></g>
<g id="badges"></g>
<g id="nox"><rect class="s-ink" x="1000" y="280" width="440" height="140" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1060 420l-20 40 60-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-line" d="M1040 320h360M1040 350h360M1040 380h240" stroke-width="6" stroke-linecap="round"/><path class="s-loss" d="M1060 300l320 100M1380 300l-320 100" stroke-width="10" stroke-linecap="round"/><text class="m" x="1000" y="500" font-size="22">NO EXCUSES · NO LONG STORIES</text></g>
<g id="yn"><rect class="gain" x="1000" y="560" width="200" height="100" rx="50"/><text class="d" x="1100" y="627" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">YES</text><rect class="s-loss" x="1240" y="560" width="200" height="100" rx="50" fill="var(--stage)" stroke-width="6"/><text class="d" x="1340" y="627" font-size="48" text-anchor="middle" style="fill:var(--loss)">NO</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 2: Review the scoreboard.</text>
<text class="b" x="120" y="176" font-size="32">Did last week’s actions move the lead measures?</text>
<g id="sb"><rect class="s-ink" x="120" y="230" width="780" height="560" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="272" font-size="22">SCOREBOARD</text><path class="s-gain" d="M150 330H870" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="870" y="316" font-size="20" text-anchor="end" style="fill:var(--gain)">GOAL</text><g id="bars"></g></g>
<g id="upa"><polygon class="gain" points="980,300 1040,380 1005,380 1005,600 955,600 955,380 920,380"/></g>
<g id="bulb"><g id="rays"></g><circle class="gain" cx="1260" cy="400" r="100"/><path d="M1235 440l12-40 13 25 13-25 12 40" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linejoin="round"/><rect class="ink" x="1222" y="502" width="76" height="24" rx="6"/><rect class="ink" x="1232" y="532" width="56" height="18" rx="6"/><text class="m" x="1260" y="650" font-size="22" text-anchor="middle">WHAT DID WE LEARN?</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 3: Plan.</text>
<text class="b" x="120" y="176" font-size="32">One or two new commitments for the coming week.</text>
<g id="np"><rect class="s-ink" x="120" y="240" width="460" height="420" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><text class="m" x="160" y="320" font-size="22">THIS WEEK I WILL</text><text class="d" x="160" y="440" font-size="44">1</text><text class="d" x="160" y="560" font-size="44">2</text><path id="w1" class="s-gain" d="M210 425q30-30 60 0t60 0t60 0t60 0t60 0" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round"/><path id="w2" class="s-gain" d="M210 545q30-30 60 0t60 0t60 0t60 0" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="tg"><circle class="s-ink" cx="1220" cy="450" r="170" fill="var(--stage)" stroke-width="8"/><circle class="s-ink" cx="1220" cy="450" r="115" fill="none" stroke-width="8"/><circle class="gain" cx="1220" cy="450" r="60"/><circle cx="1220" cy="450" r="22" fill="var(--stage)"/></g>
<g id="dart"><path class="s-ink" d="M-200 0H-10" stroke-width="7"/><path class="ink" d="M0 0l-30-14v28z"/><path class="s-gain" d="M-200 0l-20-18M-200 0l-20 18M-180 0l-20-18M-180 0l-20 18" stroke-width="5" stroke-linecap="round"/></g>
<g id="tq"><text class="m" x="1480" y="680" font-size="22" text-anchor="end">WHICH ACTION MOVES THE SCOREBOARD MOST?</text></g>
<g id="vg"><rect class="s-loss" x="120" y="718" width="130" height="42" rx="21" fill="var(--stage)" stroke-width="4"/><text class="m" x="185" y="746" font-size="20" text-anchor="middle" style="fill:var(--loss)">VAGUE</text><text id="vt" class="d5" x="280" y="752" font-size="40" fill-opacity=".6">“I’ll focus on sales.”</text></g>
<line id="vs" class="s-loss" x1="272" y1="738" x2="272" y2="738" stroke-width="5" stroke-linecap="round"/>
<g id="sp"><rect class="gain" x="120" y="796" width="150" height="42" rx="21"/><text class="m" x="195" y="824" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">SPECIFIC</text><text class="d" x="292" y="830" font-size="40">Send a proposal to every lapsed client.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep the whirlwind out.</text>
<text class="b" x="120" y="176" font-size="32">The session stays on the goal. Daily problems go elsewhere.</text>
<g id="room"><path class="s-ink" d="M640 520V240H1440V760H640V700" fill="none" stroke-width="10" stroke-linejoin="round"/><g id="chairs"></g><circle class="s-ink" cx="1040" cy="480" r="90" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="1040" cy="480" r="40"/><circle cx="1040" cy="480" r="16" fill="var(--stage)"/><path id="cpath" class="s-gain" d="M652 610L955 515" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/><g id="obs"><rect class="loss" x="705" y="573" width="30" height="30" rx="4"/><rect class="loss" x="862" y="524" width="30" height="30" rx="4"/></g><text class="m" x="658" y="550" font-size="20">DOOR</text></g>
<line id="door" class="s-ink" x1="640" y1="700" x2="460" y2="700" stroke-width="8" stroke-linecap="round"/>
<g id="cld"><circle class="loss" cx="260" cy="400" r="70"/><circle class="loss" cx="350" cy="360" r="90"/><circle class="loss" cx="440" cy="400" r="65"/><rect class="loss" x="260" y="400" width="180" height="75"/><path class="ink" d="M360 380l-30 50h24l-14 40 40-56h-24l14-34z"/><g id="torn"></g><text class="m" x="350" y="740" font-size="22" text-anchor="middle" style="fill:var(--loss)">WHIRLWIND</text></g>
<g id="lead"><g id="leadp"></g><path class="s-gain" d="M741 390L705 330M819 390L855 330" stroke-width="10" stroke-linecap="round"/></g>
<g id="cq"><text class="m" x="640" y="820" font-size="22">LEADER: HOW CAN I CLEAR THE PATH FOR YOU?</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Promises to peers.</text>
<text class="b" x="120" y="176" font-size="32">Commitments made to teammates, not just to the boss.</text>
<g id="net"><g id="bl"></g><g id="ch"></g><g id="boss"></g><g id="peers"></g></g>
<g id="duo"><path class="s-gain" d="M1060 360Q1190 220 1320 360" fill="none" stroke-width="6" stroke-dasharray="12 10"/><text class="m" x="1190" y="262" font-size="22" text-anchor="middle" style="fill:var(--gain)">MY WORD</text></g>
<g id="dl"><text class="m" x="1190" y="620" font-size="22" text-anchor="middle">FACE TO FACE, EVERY WEEK</text><text class="m" x="1190" y="660" font-size="22" text-anchor="middle" style="fill:var(--gain)">IT FEELS LIKE MY OWN CHOICE</text></g>
<g id="stick"><text class="d" x="120" y="830" font-size="48">That’s why the rhythm sticks.</text></g>
</g>
<g id="s8" opacity="0">
<g id="pp"><rect class="s-ink" x="1290" y="150" width="150" height="180" rx="10" fill="var(--stage)" stroke-width="7"/><path class="s-line" d="M1315 200h100M1315 240h100M1315 280h60" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M1450 300l-60 30 10-30 60-110 22 12z"/></g>
<g id="qa"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">Pick a day and a time</text></g>
<g id="qb"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">for a 20-minute goal check.</text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="80" letter-spacing="-2" style="fill:var(--gain)">One specific action each.</text></g>
<g id="qm"><text class="m" x="143" y="720" font-size="26">FINISHED BEFORE YOU MEET AGAIN</text></g>
</g>