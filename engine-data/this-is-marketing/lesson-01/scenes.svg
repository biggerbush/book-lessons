<circle class="ink" cx="230" cy="397" r="34"/><path class="ink" d="M179 540v-44a51 51 0 0 1 102 0v44z"/>
<circle id="rcvH" class="ink" cx="610" cy="397" r="34"/><path id="rcvB" class="ink" d="M559 540v-44a51 51 0 0 1 102 0v44z"/>
<text class="m" x="230" y="580" font-size="20" text-anchor="middle">YOU</text>
<text class="m" x="610" y="580" font-size="20" text-anchor="middle">THEM</text>
