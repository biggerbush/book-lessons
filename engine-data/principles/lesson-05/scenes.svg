<g id="beam"><path class="s-ink" d="M830 360h500" stroke-width="8" stroke-linecap="round"/></g><circle class="ink" cx="1080" cy="360" r="14"/>
<g id="panL"><path class="s-ink" d="M0 0L-80 110M0 0L80 110" stroke-width="3"/><path class="ink" d="M-90 110a90 40 0 0 0 180 0z"/><text class="d" x="0" y="96" font-size="80" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="0" y="196" font-size="20" text-anchor="middle">NOT KNOWING,</text><text class="m" x="0" y="222" font-size="20" text-anchor="middle">HANDLED WELL</text></g>
