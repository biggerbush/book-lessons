<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Watch</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the Thinker.</text>
<text class="b" x="120" y="600" font-size="32">Listen to your thoughts without judging, and find stillness behind them.</text>
<circle class="s-ink" cx="1150" cy="320" r="110" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M1030 540v-20a120 70 0 0 1 240 0v20z"/>
<g id="t0dots"></g>
<line id="t0eye" x1="1392" y1="300" x2="1268" y2="318" stroke="var(--gain)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<g id="t0watch"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The voice that never stops.</text>
<text class="b" x="120" y="176" font-size="32">A running commentary on everything, all day long.</text>
<g id="s1head"><circle class="s-ink" cx="300" cy="470" r="110" fill="var(--stage)" stroke-width="7"/><path class="ink" d="M190 690v-20a110 70 0 0 1 220 0v20z"/></g>
<g id="s1b0"><rect class="s-ink" x="480" y="300" width="380" height="84" rx="42" fill="var(--stage)" stroke-width="5"/><text class="d5" x="670" y="352" font-size="26" text-anchor="middle">“Why did I say that?”</text></g>
<g id="s1b1"><rect class="s-ink" x="480" y="420" width="380" height="84" rx="42" fill="var(--stage)" stroke-width="5"/><text class="d5" x="670" y="472" font-size="26" text-anchor="middle">“What if it goes wrong?”</text></g>
<g id="s1b2"><rect class="s-ink" x="480" y="540" width="380" height="84" rx="42" fill="var(--stage)" stroke-width="5"/><text class="d5" x="670" y="592" font-size="26" text-anchor="middle">“Not this again…”</text></g>
<g id="s1loop"><path id="s1lp" class="s-loss" d="M870 582C970 582 970 342 880 342" fill="none" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><path class="s-loss" d="M896 326l-18 16 18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="670" y="664" font-size="20" text-anchor="middle" style="fill:var(--loss)">AGAIN AND AGAIN</text></g>
<g id="s1rec"><g id="s1spin"></g><path class="s-muted" d="M1460 250L1440 300L1340 420" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink" cx="1460" cy="250" r="14"/></g>
<g id="s1cap"><text class="m" x="120" y="770" font-size="22">TOLLE: REPEATING THOUGHT PATTERNS ARE LIKE OLD RECORDS PLAYING OVER AND OVER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Just listen.</text>
<text class="b" x="120" y="176" font-size="32">Listen to the voice in your head as often as you can.</text>
<g id="s2ear"><path class="s-ink" d="M250 360c100 0 160 70 160 150 0 70-50 90-70 120-25 40-20 80-80 80-45 0-70-30-70-60" fill="none" stroke-width="12" stroke-linecap="round"/><path class="s-ink" d="M240 450c40-20 90 10 90 60 0 40-40 50-40 80" fill="none" stroke-width="10" stroke-linecap="round"/><text class="m" x="300" y="770" font-size="22" text-anchor="middle">LISTEN</text></g>
<path id="s2wav" class="s-gain" d="M470 430q-30 50 0 100M510 410q-40 70 0 140M550 390q-50 90 0 180" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="s2voice"><rect class="s-ink" x="600" y="360" width="400" height="220" rx="30" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M650 578l-30 50 70-50" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path id="s2sq" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="800" y="664" font-size="22" text-anchor="middle">THE VOICE</text></g>
<g id="s2c0"><rect class="s-ink" x="1080" y="270" width="400" height="72" rx="36" fill="var(--stage)" stroke-width="4"/><text class="m" x="1290" y="315" font-size="24" text-anchor="middle" style="fill:var(--ink)">ARGUE</text></g>
<g id="s2c1"><rect class="s-ink" x="1080" y="370" width="400" height="72" rx="36" fill="var(--stage)" stroke-width="4"/><text class="m" x="1290" y="415" font-size="24" text-anchor="middle" style="fill:var(--ink)">CONDEMN</text></g>
<g id="s2c2"><rect class="s-ink" x="1080" y="470" width="400" height="72" rx="36" fill="var(--stage)" stroke-width="4"/><text class="m" x="1290" y="515" font-size="24" text-anchor="middle" style="fill:var(--ink)">TRY TO FIX</text></g>
<g id="s2x0"><circle class="loss" cx="1126" cy="306" r="24"/><path d="M1116 296l20 20M1136 296l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="s2x1"><circle class="loss" cx="1126" cy="406" r="24"/><path d="M1116 396l20 20M1136 396l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="s2x2"><circle class="loss" cx="1126" cy="506" r="24"/><path d="M1116 496l20 20M1136 496l-20 20" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="s2noise"><text class="m" x="1080" y="600" font-size="22" style="fill:var(--loss)">JUDGING ADDS MORE NOISE</text></g>
<g id="s2obs"><rect class="gain" x="1080" y="640" width="400" height="90" rx="45"/><text class="d5" x="1280" y="697" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Just notice it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="60">The voice, and the one who hears it.</text>
<text class="b" x="120" y="176" font-size="32">There is the voice, and there is you, hearing it.</text>
<g id="s3voice"><rect class="s-ink" x="160" y="320" width="440" height="220" rx="30" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M500 538l40 50-90-50" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path id="s3sq" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="380" y="650" font-size="22" text-anchor="middle">THE VOICE</text></g>
<path id="s3arr" class="s-muted" d="M640 440h180m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<g id="s3glow"><circle id="s3r2" class="gain" cx="1100" cy="480" r="250" fill-opacity=".1"/><circle id="s3r1" class="gain" cx="1100" cy="480" r="195" fill-opacity=".12"/><circle id="s3r0" class="gain" cx="1100" cy="480" r="140" fill-opacity=".16"/></g>
<g id="s3you"><circle class="gain" cx="1100" cy="400" r="50"/><path class="gain" d="M1025 590v-60a75 75 0 0 1 150 0v60z"/></g>
<g id="s3youl"><text class="m" x="1100" y="775" font-size="22" text-anchor="middle">YOU, HEARING IT</text></g>
<g id="s3pres"><text class="m" x="1100" y="820" font-size="22" text-anchor="middle" style="fill:var(--gain)">A CONSCIOUS PRESENCE BEHIND THE THOUGHT</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The grip loosens.</text>
<text class="b" x="120" y="176" font-size="32">Once a thought is watched, it loses much of its power.</text>
<path class="s-line" d="M180 720h560" stroke-width="4" stroke-linecap="round"/>
<circle id="s4ring" class="s-gain" cx="400" cy="610" r="150" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<path id="s4rope" class="s-ink" fill="none" stroke-width="4" stroke-linecap="round"/>
<g id="s4manw"><g id="s4man"></g></g>
<g id="s4bal"><g id="s4bi"><circle class="loss" r="180"/><path class="loss" d="M-14 192h28l-14-16z"/><text class="d" x="0" y="20" font-size="56" text-anchor="middle" style="fill:var(--stage)">THOUGHT</text></g></g>
<g id="s4drag"><text class="m" x="760" y="760" font-size="22">IT NO LONGER DRAGS YOU ALONG</text></g>
<g id="s4awt"><text class="d" x="120" y="830" font-size="46">You become the awareness noticing it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The mouse hole test.</text>
<text class="b" x="120" y="176" font-size="32">Close your eyes: “I wonder what my next thought is going to be.”</text>
<g id="s5face"><circle class="s-ink" cx="320" cy="500" r="120" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M260 490q25 20 50 0M330 490q25 20 50 0M295 560h50" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="s5q"><circle class="ink" cx="450" cy="400" r="10"/><circle class="ink" cx="482" cy="362" r="15"/><circle class="s-ink" cx="540" cy="300" r="50" fill="var(--stage)" stroke-width="5"/><text class="d" x="540" y="320" font-size="56" text-anchor="middle">?</text></g>
<path class="s-line" d="M700 720h780" stroke-width="4"/>
<g id="s5wall"><rect x="1180" y="300" width="300" height="420" fill="var(--line)"/><path class="ink" d="M1270 720v-70a60 60 0 0 1 120 0v70z"/></g>
<g id="s5cat"><path id="s5tail" class="s-ink" fill="none" stroke-width="14" stroke-linecap="round"/><ellipse class="ink" cx="900" cy="650" rx="130" ry="70"/><circle class="ink" cx="1020" cy="560" r="60"/><path class="ink" d="M978 522l12-52 26 36zM1024 506l26-36 12 52z"/><circle class="gain" cx="1035" cy="555" r="9"/><circle class="gain" cx="1060" cy="555" r="9"/></g>
<line id="s5look" x1="1072" y1="560" x2="1300" y2="650" stroke="var(--gain)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<g id="s5dots"><circle id="s5d0" class="ink" cx="1305" cy="540" r="8"/><circle id="s5d1" class="ink" cx="1330" cy="540" r="8"/><circle id="s5d2" class="ink" cx="1355" cy="540" r="8"/></g>
<g id="s5slow"><text class="m" x="120" y="810" font-size="22">AS LONG AS ATTENTION STAYS SHARP, THE NEXT THOUGHT IS SLOW TO ARRIVE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The gap of stillness.</text>
<text class="b" x="120" y="176" font-size="32">In the pause, the stream of thinking stops. Tolle calls it no-mind.</text>
<g id="s6lab"><text class="m" x="120" y="300" font-size="22">THE STREAM OF THINKING</text></g>
<g id="s6str"></g>
<rect id="s6gap" class="gain" y="330" height="130" rx="18" fill-opacity=".15" stroke="var(--gain)" stroke-width="4" stroke-dasharray="10 8"/>
<text id="s6nm" class="d" x="800" y="412" font-size="44" text-anchor="middle" style="fill:var(--gain)">no-mind</text>
<g id="s6calm"><text class="m" x="800" y="530" font-size="22" text-anchor="middle">NOT DULL OR BLANK, BUT</text>
<text id="s6w0" class="d5" x="400" y="610" font-size="52" text-anchor="middle">Quiet</text><text id="s6w1" class="d5" x="800" y="610" font-size="52" text-anchor="middle">Awake</text><text id="s6w2" class="d5" x="1200" y="610" font-size="52" text-anchor="middle" style="fill:var(--gain)">Peaceful</text></g>
<g id="s6grow"><path class="s-line" d="M120 740h1360" stroke-width="4"/>
<rect id="s6g0" class="gain" x="300" y="722" width="60" height="36" rx="8"/><rect id="s6g1" class="gain" x="640" y="722" width="160" height="36" rx="8"/><rect id="s6g2" class="gain" x="1060" y="722" width="320" height="36" rx="8"/>
<text class="m" x="120" y="820" font-size="22">AT FIRST, SECONDS. WITH PRACTICE, THE GAPS GROW LONGER.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyday gaps.</text>
<text class="b" x="120" y="176" font-size="32">Give ordinary moments your complete attention.</text>
<g id="s7p0"><rect class="s-line" x="120" y="220" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="270" font-size="22">WASHING YOUR HANDS</text>
<path class="s-ink" d="M330 330h140v40M380 330v-30M356 300h48" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<g id="s7drops"></g>
<ellipse class="gain" cx="440" cy="535" rx="48" ry="24"/><ellipse class="gain" cx="500" cy="535" rx="48" ry="24"/>
<path class="s-ink" d="M300 570q170 80 340 0" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="s7p1"><rect class="s-line" x="840" y="220" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="270" font-size="22">WALKING UP THE STAIRS</text>
<path class="s-ink" d="M900 620h100v-60h100v-60h100v-60h100v-60h100" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g id="s7man"></g></g>
<g id="s7f0"><text class="m" x="150" y="640" font-size="20" style="fill:var(--gain)">FULL ATTENTION</text></g>
<g id="s7f1"><text class="m" x="1460" y="640" font-size="20" text-anchor="end" style="fill:var(--gain)">EVERY MOVEMENT, EVERY SENSATION</text></g>
<g id="s7ch"><path id="s7sq" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round"/><g id="s7flat"></g></g>
<g id="s7cap"><text class="m" x="120" y="830" font-size="22">EACH MOMENT OF FULL ATTENTION IS A SMALL BREAK IN THE CHATTER</text></g>
</g>

<g id="s8" opacity="0">
<g id="s8a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pause three times today.</text></g>
<g id="s8b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Can you notice the one</text></g>
<g id="s8c"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">who is <tspan style="fill:var(--gain)">listening</tspan>?</text></g>
<g id="s8l"><text class="m" x="143" y="710" font-size="26">LISTEN TO THE VOICE IN YOUR HEAD</text></g>
<g id="s8pz"></g>
</g>