<g id="doit"><text class="d" x="120" y="800" font-size="52">Then do that.</text><text class="m" x="120" y="846" font-size="20">EVEN WHEN YOU'D RATHER NOT</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why big leaps fail.</text>
<text class="b" x="120" y="176" font-size="32">Sudden upheaval feels like danger to your mind.</text>
<rect x="120" y="600" width="300" height="160" fill="var(--line)"/>
<text class="m" x="230" y="580" font-size="22" text-anchor="middle">FAMILIAR</text>
<g id="bigR"><rect x="1080" y="600" width="400" height="160" fill="var(--line)"/><text class="m" x="1300" y="580" font-size="22" text-anchor="middle">CHANGE EVERYTHING</text><text class="d5" x="1280" y="700" font-size="36" text-anchor="middle">Monday</text><path class="s-muted" d="M340 600Q730 200 1120 600" fill="none" stroke-width="4" stroke-dasharray="6 12"/></g>
<line id="rope" class="s-loss" x1="340" y1="600" x2="340" y2="600" stroke-width="5" stroke-linecap="round"/>
