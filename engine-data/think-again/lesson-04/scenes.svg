<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Fight about ideas,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not people.</text>
<text class="b" x="120" y="600" font-size="32">Why the best teams argue hard about ideas, never about people.</text>
<g id="bros"></g>
<g id="bub0"><rect x="1070" y="250" width="110" height="70" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="1125" y="300" font-size="40" text-anchor="middle">!?</text></g>
<g id="bub1"><rect x="1340" y="250" width="110" height="70" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="1395" y="300" font-size="40" text-anchor="middle">?!</text></g>
<g id="plane"><path class="s-gain" d="M-60 -14h120M-60 14h120M-36 -14v28M36 -14v28M-60 0h-14" fill="none" stroke-width="7" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of conflict.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Karen Jehn studied how teams fight.</text>
<g id="tbl"><g id="tblp"></g><ellipse cx="410" cy="520" rx="200" ry="70" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<path id="zz" class="s-loss" d="M330 350l14-20 14 20 14-20 14 20M450 350l14-20 14 20 14-20 14 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="410" y="650" font-size="20" text-anchor="middle">A TEAM, ARGUING</text></g>
<g id="kt"><path class="s-gain" d="M710 470C760 470 760 370 800 370" fill="none" stroke-width="5" stroke-dasharray="10 8"/>
<rect x="800" y="240" width="680" height="260" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/>
<text class="m" x="840" y="295" font-size="22" style="fill:var(--gain)">TASK CONFLICT</text>
<text class="d5" x="840" y="365" font-size="40">About the work itself.</text>
<text class="b" x="840" y="430" font-size="28">Disagreeing over the task.</text>
<rect x="1350" y="290" width="90" height="120" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<path class="s-ink" d="M1368 324h54M1368 350h54M1368 376h34" stroke-width="5" stroke-linecap="round"/></g>
<g id="kp"><path class="s-loss" d="M710 570C760 570 760 670 800 670" fill="none" stroke-width="5" stroke-dasharray="10 8"/>
<rect x="800" y="540" width="680" height="260" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/>
<text class="m" x="840" y="595" font-size="22" style="fill:var(--loss)">RELATIONSHIP CONFLICT</text>
<text class="d5" x="840" y="665" font-size="40">About who people are.</text>
<circle class="ink" cx="1356" cy="680" r="22"/><circle class="ink" cx="1432" cy="680" r="22"/>
<path class="s-loss" d="M1400 630l-12 30h20l-12 30" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="atk"><text class="b" x="840" y="740" font-size="28">It feels like an attack.</text></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One fight sinks. One sparks.</text>
<text class="b" x="120" y="176" font-size="32">Personal conflict drags teams down. Idea conflict lifts them.</text>
<g id="lp"><rect x="120" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22" style="fill:var(--loss)">PERSONAL CONFLICT</text><g id="sadp"></g>
<path class="s-loss" d="M180 540L660 610M632 588L660 610L627 623" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="150" y="740" font-size="36">Teams get dragged down.</text></g>
<g id="shd"></g>
<g id="lpm"><text class="m" x="150" y="680" font-size="22" style="fill:var(--loss)">DEFENSIVE · STOP SHARING</text></g>
<g id="rp"><rect x="840" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22" style="fill:var(--gain)">IDEA CONFLICT</text><g id="rays"></g>
<circle id="bulb" cx="1160" cy="410" r="80" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/>
<rect class="ink" x="1128" y="488" width="64" height="50" rx="8"/>
<text class="d5" x="870" y="740" font-size="36">Better decisions.</text></g>
<g id="rpm"><text class="m" x="870" y="680" font-size="22" style="fill:var(--gain)">EVERYONE TESTS ASSUMPTIONS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Wright brothers.</text>
<text class="b" x="120" y="176" font-size="32">Bicycle makers who dreamed of flight.</text>
<g id="shop"><path class="s-ink" d="M140 380L330 260L520 380" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="160" y="380" width="340" height="320" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<g transform="translate(330 335) scale(.55)"><path class="s-gain" d="M-60 -14h120M-60 14h120M-36 -14v28M36 -14v28M-60 0h-14" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<g id="shopp"></g>
<path class="s-ink" d="M250 630L310 570L410 630M310 570H360L410 630M298 560h24M360 570l-10-20h20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="250" cy="630" r="46" fill="none" stroke="var(--ink)" stroke-width="5"/><circle cx="410" cy="630" r="46" fill="none" stroke="var(--ink)" stroke-width="5"/>
<text class="m" x="330" y="750" font-size="20" text-anchor="middle">BICYCLE SHOP</text></g>
<g id="dad"><g id="dadp"></g>
<text class="d" x="690" y="440" font-size="40" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d" x="912" y="440" font-size="40" text-anchor="middle" style="fill:var(--gain)">!</text>
<text class="m" x="800" y="750" font-size="20" text-anchor="middle">ENCOURAGED TO ARGUE</text></g>
<g id="prp"><g id="p3"></g><g id="prpp"></g>
<path id="zz3" class="s-loss" d="M1160 640l20-16 20 16 20-16 20 16 20-16 20 16 20-16 20 16 20-16 20 16 20-16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1270" y="750" font-size="20" text-anchor="middle">ARGUED LOUDLY FOR WEEKS</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Swap sides.</text>
<text class="b" x="120" y="176" font-size="32">Each brother argued the other’s view.</text>
<g id="ppl4"><text class="m" x="300" y="610" font-size="22" text-anchor="middle">WILBUR</text><text class="m" x="1300" y="610" font-size="22" text-anchor="middle">ORVILLE</text></g>
<g id="arr4"><path class="s-muted" d="M620 330Q800 230 980 330M965 305L980 330L950 331M980 520Q800 620 620 520M635 545L620 520L650 519" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cA" transform="translate(500 425)"><rect x="-80" y="-50" width="160" height="100" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="d" y="20" font-size="56" text-anchor="middle">A</text><path id="xA" class="s-loss" d="M-40 -30l80 60M40 -30l-80 60" stroke-width="8" stroke-linecap="round"/></g>
<g id="cB" transform="translate(1100 425)"><rect x="-80" y="-50" width="160" height="100" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="d" y="20" font-size="56" text-anchor="middle">B</text><path id="xB" class="s-loss" d="M-40 -30l80 60M40 -30l-80 60" stroke-width="8" stroke-linecap="round"/></g>
<g id="bw"><text class="m" x="800" y="620" font-size="22" text-anchor="middle" style="fill:var(--loss)">BOTH WERE WRONG</text></g>
<g id="nw"><text class="d5" x="120" y="760" font-size="44" style="fill:var(--muted)">Not to win.</text></g>
<line id="nwS" class="s-ink" x1="114" y1="746" x2="360" y2="746" stroke-width="5" stroke-linecap="round"/>
<g id="gr"><text class="d" x="440" y="760" font-size="52" style="fill:var(--gain)">To get it right.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two propellers, opposite ways.</text>
<text class="b" x="120" y="176" font-size="32">The answer came out of the argument.</text>
<g id="pr5"><rect class="ink" x="300" y="404" width="1000" height="32" rx="16"/></g>
<g id="arc5"><path class="s-ink" d="M470 300A150 150 0 0 1 650 300M639 274L650 300L622 297M1130 300A150 150 0 0 0 950 300M961 274L950 300L978 297" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="alone"><text class="m" x="800" y="600" font-size="22" text-anchor="middle">NEITHER BROTHER WOULD HAVE FOUND IT ALONE</text></g>
<g id="hl"><g id="hrt" transform="translate(320 700) scale(.28)"><path class="gain" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/></g></g>
<g id="nv"><text class="d" x="520" y="700" font-size="44">Fought about the design,</text><text class="d" x="520" y="760" font-size="44" style="fill:var(--gain)">never about each other.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep the heat on the idea.</text>
<text class="b" x="120" y="176" font-size="32">Not on the person.</text>
<g id="th"><rect x="165" y="240" width="30" height="280" rx="15" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<rect id="merc" class="gain" x="172" y="485" width="16" height="40"/><circle class="gain" cx="180" cy="530" r="30"/>
<circle cx="180" cy="530" r="30" fill="none" stroke="var(--ink)" stroke-width="5"/></g>
<g id="dc6"><path class="s-gain" d="M232 380h44m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="310" width="100" height="130" rx="8" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/>
<path class="s-ink" d="M320 346h60M320 374h60M320 402h36" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="350" y="480" font-size="20" text-anchor="middle" style="fill:var(--gain)">IDEA</text></g>
<g id="b1"><rect x="520" y="240" width="900" height="100" rx="20" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path d="M600 338l-20 30 50-30" fill="var(--stage)" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="560" y="305" font-size="38">“I disagree with this plan.”</text><path class="s-gain" d="M1340 292l16 16 30-34" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="b2"><rect x="520" y="390" width="900" height="100" rx="20" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M600 488l-20 30 50-30" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<text id="t6" class="d5" x="560" y="455" font-size="38" style="fill:var(--muted)">“You always get things wrong.”</text><path class="s-loss" d="M1350 420l40 40M1390 420l-40 40" stroke-width="7" stroke-linecap="round"/></g>
<line id="st6" class="s-loss" x1="552" y1="442" x2="552" y2="442" stroke-width="5" stroke-linecap="round"/>
<g id="crit"><text class="m" x="520" y="570" font-size="20">CRITICISE A PLAN: STILL USEFUL · CRITICISE A PERSON: IT JUST STINGS</text></g>
<g id="pz"><g id="pzp"></g><path id="pzA" class="gain" d="M0 0h60v20a14 14 0 0 1 0 28v20h-60z"/><path id="pzB" class="ink" d="M0 0h60v68h-60v-20a14 14 0 0 0 0-28z"/>
<text class="d" x="660" y="720" font-size="40">Solve it together, like a puzzle.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beware of fake harmony.</text>
<text class="b" x="120" y="176" font-size="32">Agreeing just to keep the peace can be dangerous.</text>
<g id="mk7"></g>
<g id="sil"><text class="m" x="120" y="630" font-size="22" style="fill:var(--loss)">SILENCE LETS BAD IDEAS SLIP THROUGH</text></g>
<g id="grt"><text class="d5" x="120" y="710" font-size="34">Teams that avoid all conflict</text><text class="d5" x="120" y="760" font-size="34">miss problems in plain sight.</text></g>
<g id="dr"><rect class="gain" x="1060" y="260" width="200" height="400"/>
<polygon id="leaf" points="1060,260 1260,260 1260,660 1060,660" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<circle id="knob" class="ink" cx="1236" cy="460" r="8"/>
<rect x="1060" y="260" width="200" height="400" fill="none" stroke="var(--ink)" stroke-width="8"/></g>
<g id="bad"><rect x="-44" y="-36" width="88" height="72" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path d="M-30 34l-16 28 36-26" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/><text class="d" y="16" font-size="44" text-anchor="middle" style="fill:var(--loss)">!</text></g>
<g id="dw"><text class="d" x="960" y="740" font-size="40">Dissent is welcome.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Is it about the idea,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">or about the person?</text></g>
<g id="qc"><text class="m" x="143" y="600" font-size="26" style="fill:var(--gain)">IF IT’S THE IDEA, LEAN IN.</text><text class="m" x="143" y="644" font-size="26">IF IT’S PERSONAL, STEP BACK AND RESET.</text></g>
<g id="q8g"><circle id="q8b" class="gain" cx="1340" cy="300" r="50"/><rect class="ink" x="1320" y="352" width="40" height="30" rx="6"/><g id="q8p"></g></g>
</g>