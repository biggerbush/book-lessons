<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Keep a players’</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">scoreboard.</text>
<text class="b" x="120" y="600" font-size="32">Why a simple scoreboard beats a detailed report every time</text>
<rect class="s-line" x="1060" y="330" width="420" height="200" rx="16" fill="none" stroke-width="5"/>
<path class="s-line" d="M1270 330v200" stroke-width="4" stroke-dasharray="8 10"/>
<g id="t_pl"></g>
<circle id="t_ball" class="gain" cx="1270" cy="490" r="12"/>
<g id="t_tal"><rect class="s-ink" x="1100" y="190" width="340" height="110" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="1130" y="225" font-size="18">A</text><text class="m" x="1290" y="225" font-size="18">B</text><g id="t_mk"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Scoring changes play.</text>
<text class="b" x="120" y="176" font-size="32">Discipline 3 rests on a simple truth about people.</text>
<g id="a_au"><g id="a_fig"></g><text class="m" x="320" y="640" font-size="22" text-anchor="middle">THE AUTHORS</text></g>
<path id="a_ln" class="s-gain" d="M500 420h100" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
<g id="a_q"><rect class="s-ink" x="620" y="250" width="860" height="440" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="620" y="268" width="22" height="404"/>
<text class="d" x="690" y="390" font-size="52">“People play differently</text>
<text class="d" x="690" y="460" font-size="52">when they’re keeping</text>
<text class="d" x="690" y="530" font-size="52" style="fill:var(--gain)">score.”</text>
<text class="m" x="690" y="620" font-size="22">THE 4 DISCIPLINES OF EXECUTION</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The coach’s scoreboard.</text>
<text class="b" x="120" y="176" font-size="32">Built for managers, not for the team.</text>
<g id="c_grid"></g>
<g id="c_pile"></g>
<g id="c_boss"><g id="c_bf"></g><text class="m" x="1360" y="440" font-size="22" text-anchor="middle">COACH</text><path class="s-gain" d="M1410 250l14 14 28-30" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="c_team"><g id="c_tf"></g><text class="m" x="1080" y="800" font-size="22" text-anchor="middle">THE TEAM · RARELY MOTIVATED</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The players’ scoreboard.</text>
<text class="b" x="120" y="176" font-size="32">One glance tells you who is winning.</text>
<g id="p_sb">
<path class="s-ink" d="M640 450v150M960 450v150" stroke-width="12"/>
<rect class="ink" x="520" y="230" width="560" height="220" rx="16"/>
<text class="m" x="660" y="280" font-size="22" text-anchor="middle" style="fill:var(--stage)">HOME</text>
<text class="m" x="940" y="280" font-size="22" text-anchor="middle" style="fill:var(--stage)">AWAY</text>
<text id="p_h" class="d" x="660" y="420" font-size="130" text-anchor="middle" style="fill:var(--gain)">2</text>
<text class="d" x="940" y="420" font-size="130" text-anchor="middle" style="fill:var(--stage)">1</text>
<rect class="s-line" x="400" y="600" width="800" height="180" rx="12" fill="var(--line)" fill-opacity=".35" stroke-width="4"/>
<path class="s-line" d="M800 600v180" stroke-width="4"/><circle class="s-line" cx="800" cy="690" r="50" fill="none" stroke-width="4"/>
</g>
<g id="p_fan"><path class="s-gain" d="M214 510L520 360" stroke-width="4" stroke-dasharray="8 10"/><g id="p_ff"></g><text class="m" x="120" y="820" font-size="20">ANY FAN · ONE GLANCE</text></g>
<g id="p_wig"><rect class="gain" x="1120" y="260" width="360" height="170" rx="14"/>
<text class="m" x="1145" y="315" font-size="22" style="fill:var(--on-gain)">FOR YOUR TEAM’S</text>
<text class="m" x="1145" y="355" font-size="22" style="fill:var(--on-gain)">WILDLY IMPORTANT</text>
<text class="m" x="1145" y="395" font-size="22" style="fill:var(--on-gain)">GOAL</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Simple and visible.</text>
<text class="b" x="120" y="176" font-size="32">The authors’ tests for a good scoreboard.</text>
<g id="k_cl"><rect class="s-ink" x="120" y="240" width="340" height="560" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="230" y="222" width="120" height="36" rx="10"/><g id="k_rows"></g></g>
<g id="k_a"><rect class="s-line" x="540" y="240" width="440" height="360" rx="16" fill="var(--stage)" stroke-width="4"/>
<path class="s-ink" d="M590 290V540h340" fill="none" stroke-width="5" stroke-linecap="round"/>
<polyline class="s-gain" points="590,520 680,480 770,470 860,400 930,330" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="540" y="670" font-size="40">Simple</text>
<text class="m" x="540" y="710" font-size="20">ONLY THE DATA NEEDED TO PLAY</text></g>
<g id="k_b"><rect class="s-ink" x="1100" y="250" width="320" height="200" rx="10" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1260" cy="250" r="10"/>
<polyline class="s-gain" points="1130,420 1210,390 1290,360 1390,290" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="k_ppl"></g>
<text class="d5" x="1040" y="670" font-size="40">Visible</text>
<text class="m" x="1040" y="710" font-size="20">POSTED WHERE THE TEAM SEES IT</text>
<path class="s-ink" d="M1040 760h36l10 12h44v48h-90z" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path id="k_x" class="s-loss" d="M1050 770l70 40M1120 770l-70 40" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1150" y="798" font-size="20">NOT IN A SHARED FOLDER</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lead, lag, at a glance.</text>
<text class="b" x="120" y="176" font-size="32">Actions you control, results you want, readable in seconds.</text>
<g id="l_ch"><path class="s-ink" d="M160 260V620h680" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g id="l_bars"></g>
<polyline id="l_lag" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="ink" x="160" y="664" width="24" height="24"/><text class="m" x="196" y="684" font-size="20">LEAD · OUR ACTIONS</text>
<rect class="gain" x="500" y="664" width="24" height="24"/><text class="m" x="536" y="684" font-size="20">LAG · THE RESULT</text></g>
<g id="l_sw"><rect class="ink" x="1196" y="250" width="48" height="26" rx="6"/>
<circle id="l_face" cx="1220" cy="430" r="140" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/>
