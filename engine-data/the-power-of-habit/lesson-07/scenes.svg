<text class="d" x="360" y="814" font-size="44">Weight up. Willpower <tspan style="fill:var(--loss)">losing.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 1: Name the routine.</text>
<text class="b" x="120" y="176" font-size="32">Treat the habit like a detective case.</text>
<g id="steps"></g>
<g id="brk"><path class="s-muted" d="M120 480v20h1340v-20" fill="none" stroke-width="4"/><text class="m" x="790" y="545" font-size="22" text-anchor="middle">THE ROUTINE</text></g>
<g id="lens2"><g id="lens2i"><circle class="s-ink" cx="0" cy="0" r="34" fill="var(--stage)" fill-opacity=".6" stroke-width="9"/><path class="s-ink" d="M25 25l28 28" stroke-width="14" stroke-linecap="round"/></g></g>
<g id="qq">
<rect class="s-loss" x="120" y="620" width="420" height="150" rx="16" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="d" x="150" y="690" font-size="52" style="fill:var(--loss)">Cue ?</text><text class="m" x="150" y="742" font-size="22">WHAT STARTED IT?</text>
<rect class="s-loss" x="1060" y="620" width="420" height="150" rx="16" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="d" x="1090" y="690" font-size="52" style="fill:var(--loss)">Reward ?</text><text class="m" x="1090" y="742" font-size="22">WHAT DID HE REALLY WANT?</text>
<text id="bigq" class="d" x="800" y="760" font-size="150" text-anchor="middle" style="fill:var(--loss)">?</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 2: Experiment with rewards.</text>
<text class="b" x="120" y="176" font-size="32">Swap the reward, then check the craving.</text>
<text id="rh" class="m" x="120" y="252" font-size="20">REWARD EXPERIMENTS</text>
<g id="slots"></g>
<g id="c0"><rect class="s-ink" x="120" y="280" width="250" height="300" rx="16" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="245" cy="350" r="22"/><path class="s-ink" d="M245 375L235 440M240 395L205 420M240 395L280 410M235 440L205 490M235 440L270 490" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-line" d="M160 500h170" stroke-width="4"/><text class="m" x="245" y="555" font-size="20" text-anchor="middle">WALK OUTSIDE</text></g>
<g id="c1"><rect class="s-ink" x="400" y="280" width="250" height="300" rx="16" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="525" cy="430" r="60"/><path class="s-ink" d="M525 372v-24" stroke-width="6" stroke-linecap="round"/><path class="ink" d="M530 360q30-30 50-10q-25 25-50 10z"/><text class="m" x="525" y="555" font-size="20" text-anchor="middle">EAT AN APPLE</text></g>
