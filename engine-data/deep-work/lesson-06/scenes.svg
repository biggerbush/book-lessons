</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The shallow flood.</text>
<text class="b" x="120" y="176" font-size="32">A few deep spots. Wide shallow edges.</text>
<g id="pond1">
<ellipse class="s-loss" cx="800" cy="510" rx="520" ry="250" fill="var(--loss)" fill-opacity=".16" stroke-width="5"/>
