<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMPOUND EFFECT · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Find your why</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to change habits.</text>
<text class="b" x="120" y="600" font-size="32">Why a powerful reason beats willpower every time.</text>
