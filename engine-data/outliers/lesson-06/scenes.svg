<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIERS · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The lessons</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Joe Flom.</text>
