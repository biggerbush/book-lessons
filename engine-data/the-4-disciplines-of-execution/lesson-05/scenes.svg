<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of measure.</text>
<text class="b" x="120" y="176" font-size="32">Lag tracks the result. Lead tracks the actions that cause it.</text>
<g id="lagP"><rect class="s-line" x="120" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="24" style="fill:var(--loss)">LAG MEASURE</text>
<text class="d5" x="150" y="590" font-size="48">The result</text></g>
<g id="mir"><path class="s-ink" d="M440 290v24" stroke-width="10" stroke-linecap="round"/>
<rect class="s-ink" x="200" y="314" width="480" height="170" rx="85" fill="var(--stage)" stroke-width="8"/>
<path class="s-muted" d="M340 478L425 340M540 478L455 340M440 470v-22M440 428v-16M440 396v-10" stroke-width="4" stroke-linecap="round" fill="none"/>
<rect class="loss" x="424" y="352" width="32" height="20" rx="6"/>
<text class="m" x="150" y="636" font-size="20">SHOWS WHAT ALREADY HAPPENED</text></g>
<g id="leadP"><rect class="s-line" x="840" y="230" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="24" style="fill:var(--gain)">LEAD MEASURE</text>
<text class="d5" x="870" y="590" font-size="48">The actions</text>
<text class="m" x="870" y="636" font-size="20">THAT CAUSE THE RESULT</text>
<circle class="s-ink" cx="1370" cy="400" r="62" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="1370" y="407" font-size="18" text-anchor="middle">RESULT</text></g>
<g id="acts"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Imagine losing 10 pounds.</text>
<text class="b" x="120" y="176" font-size="32">Your weight is the lag. Calories and exercise are leads.</text>
<g id="leadA"><rect class="s-line" x="120" y="230" width="440" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="272" font-size="20" style="fill:var(--gain)">LEAD</text>
<circle class="s-ink" cx="250" cy="370" r="68" fill="var(--stage)" stroke-width="6"/>
<circle class="s-line" cx="250" cy="370" r="40" fill="none" stroke-width="4"/>
<text class="d5" x="350" y="370" font-size="40">Calories</text>
<text class="m" x="350" y="410" font-size="20">EACH DAY</text></g>
<g id="leadB"><rect class="s-line" x="120" y="520" width="440" height="250" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="562" font-size="20" style="fill:var(--gain)">LEAD</text>
<path class="ink" d="M170 700h170c6-22-6-34-26-38l-46-10-22-34h-56c-12 0-20 10-20 22z"/>
<path class="s-gain" d="M170 714h172" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="350" y="660" font-size="40">Exercise</text>
<text class="m" x="350" y="700" font-size="20">MINUTES</text></g>
