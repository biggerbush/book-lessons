<g id="agst"><text class="m" x="1230" y="752" font-size="20" text-anchor="middle" style="fill:var(--loss)">THEN TURNS IT AGAINST THEM</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The perfect feed.</text>
<text class="b" x="120" y="176" font-size="32">Faces and bodies, filtered, then scored in public.</text>
