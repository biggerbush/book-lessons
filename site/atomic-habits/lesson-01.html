<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atomic Habits Long Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays five scenes, with a transport bar beneath it. */
:root{
  --bg:#E9EEF2; --stage:#F6F8FA; --ink:#12233A; --muted:#5C6B7E; --line:#C5CFD9;
  --gain:#C97F00; --loss:#5562C4; --ice:#BFDDF0;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:14px}
@keyframes wmmove{0%{transform:translate(0,0)}25%{transform:translate(-1330px,0)}50%{transform:translate(-1330px,-812px)}75%{transform:translate(0,-812px)}}
.wmc{animation:wmmove 80s step-end infinite}
@media (prefers-reduced-motion:reduce){.wmc{animation:none}}
#stageBox{background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
#stageBox:fullscreen{border:0;border-radius:0;aspect-ratio:auto;display:flex;align-items:center}
svg{display:block;width:100%;height:100%}
.d{font-family:var(--display);font-weight:800;fill:var(--ink)}
.d5{font-family:var(--display);font-weight:500;fill:var(--ink)}
.b{font-family:var(--body);fill:var(--muted)}
.m{font-family:var(--mono);fill:var(--muted);letter-spacing:.04em}
.ink{fill:var(--ink)} .gain{fill:var(--gain)} .loss{fill:var(--loss)}
.s-ink{stroke:var(--ink)} .s-line{stroke:var(--line)} .s-gain{stroke:var(--gain)} .s-loss{stroke:var(--loss)} .s-muted{stroke:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
#play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:86px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--gain)}
#clock{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font-weight:400;font-size:13px;padding:6px 10px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch;margin:4px 0 0}
</style>

<div class="wrap">
  <div id="stageBox">
    <svg viewBox="0 0 1600 900" role="img" aria-label="Animated summary of the first lesson of Atomic Habits: small daily improvements compound into large results. Seven scenes with narration.">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.6" fill="var(--line)"/></pattern>
      </defs>
      <rect width="1600" height="900" fill="var(--stage)"/>
      <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>

      <!-- 1 Title -->
      <g id="s0">
        <text class="m" x="120" y="150" font-size="28">ATOMIC HABITS · CHAPTER 1</text>
        <text class="d" x="104" y="540" font-size="380" letter-spacing="-12">1%</text>
        <text class="d5" x="120" y="660" font-size="84">better, every day.</text>
        <text class="b" x="120" y="740" font-size="32">The book's first lesson, in a minute and a half. Press Play for sound.</text>
        <g transform="translate(1250 430)" fill="none" stroke-width="3">
          <ellipse class="s-line" rx="240" ry="84"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(60)"/>
          <ellipse class="s-line" rx="240" ry="84" transform="rotate(120)"/>
          <circle class="gain" r="36" stroke="none"/>
          <circle id="e0" class="ink" r="13" stroke="none"/><circle id="e1" class="ink" r="13" stroke="none"/><circle id="e2" class="ink" r="13" stroke="none"/>
        </g>
      </g>

      <!-- British Cycling -->
      <g id="s1" opacity="0">
        <text class="d" x="120" y="124" font-size="68">British Cycling, 2003.</text>
        <text class="b" x="120" y="176" font-size="32">A century of racing. Tour de France wins: 0.</text>
        <g id="wR" class="s-ink" stroke-width="2.5"></g><g id="wF" class="s-ink" stroke-width="2.5"></g>
        <g fill="none" class="s-ink" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="270" cy="560" r="110"/><circle cx="600" cy="560" r="110"/>
          <path d="M270 560L410 560L370 400L560 400L410 560M270 560L370 400M560 400L600 560M572 366L560 400M540 366L604 366M342 392L402 392"/>
        </g>
        <line class="s-line" x1="120" y1="674" x2="740" y2="674" stroke-width="4"/>
        <g id="gains">
          <text id="gHead" class="m" x="840" y="300" font-size="26">HUNTING 1% IN EVERYTHING</text>
          <g id="g0"><text class="d5" x="840" y="380" font-size="48">Seats</text><text class="m gain" x="1440" y="380" font-size="40" text-anchor="end">+1%</text></g>
          <g id="g1"><text class="d5" x="840" y="452" font-size="48">Tyres</text><text class="m gain" x="1440" y="452" font-size="40" text-anchor="end">+1%</text></g>
          <g id="g2"><text class="d5" x="840" y="524" font-size="48">Sleep</text><text class="m gain" x="1440" y="524" font-size="40" text-anchor="end">+1%</text></g>
          <g id="g3"><text class="d5" x="840" y="596" font-size="48">Hand-washing</text><text class="m gain" x="1440" y="596" font-size="40" text-anchor="end">+1%</text></g>
          <text id="tiny" class="d5" x="840" y="700" font-size="44">Each change was tiny.</text>
          <text id="together" class="d" x="840" y="762" font-size="52">Together, they were not.</text>
        </g>
        <g id="beijing" opacity="0">
          <text class="m" x="840" y="300" font-size="26">BEIJING OLYMPICS, 2008</text>
          <g id="medals"></g>
          <text class="d" x="840" y="560" font-size="64">8 cycling golds.</text>
          <text class="b" x="840" y="614" font-size="32">Five years after the 1% hunt began.</text>
        </g>
      </g>

      <!-- The plane -->
      <g id="s3" opacity="0">
        <text class="d" x="120" y="124" font-size="68">A small turn, a different city.</text>
        <text class="b" x="120" y="176" font-size="32">Same plane, same speed, a 3.5° change at take-off.</text>
        <line id="plan" class="s-muted" x1="200" y1="560" x2="200" y2="560" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 16"/>
        <line id="actual" class="s-gain" x1="200" y1="560" x2="200" y2="560" stroke-width="7" stroke-linecap="round"/>
        <circle class="ink" cx="200" cy="560" r="14"/>
        <text class="d5" x="120" y="630" font-size="40">Los Angeles</text>
        <circle class="s-ink" cx="1400" cy="330" r="14" fill="var(--stage)" stroke-width="5"/>
        <text class="d5" x="1440" y="290" font-size="40" text-anchor="end">New York</text>
        <circle id="dc" class="s-ink" cx="1341" cy="413" r="14" fill="var(--stage)" stroke-width="5"/>
        <text class="d5" x="1440" y="486" font-size="40" text-anchor="end">Washington, D.C.</text>
        <text id="deg" class="m" x="440" y="592" font-size="30">3.5° OFF COURSE</text>
        <circle id="plane" class="gain" cx="200" cy="560" r="13"/>
      </g>

      <!-- 2 Compounding chart -->
      <g id="s2" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Small changes compound.</text>
        <text class="m" x="120" y="172" font-size="26">ONE YEAR, STARTING AT 1.00</text>
        <g id="grid" fill="none" stroke-width="2"></g>
        <polyline id="up" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline id="down" class="s-loss" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="upHead" class="gain" r="11"/><circle id="downHead" class="loss" r="11"/>
        <text class="m" x="1230" y="262" font-size="26">DAY</text>
        <text id="day" class="d" x="1230" y="350" font-size="92">0</text>
        <rect class="gain" x="1230" y="424" width="34" height="8"/>
        <text class="b" x="1276" y="438" font-size="28">1% better each day</text>
        <text id="upVal" class="d" x="1230" y="530" font-size="92">1.00×</text>
        <rect class="loss" x="1230" y="614" width="34" height="8"/>
        <text class="b" x="1276" y="628" font-size="28">1% worse each day</text>
        <text id="downVal" class="d" x="1230" y="720" font-size="92">1.00×</text>
      </g>

      <!-- 3 Ice cube -->
      <g id="s4" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Results show up late.</text>
        <text class="b" x="120" y="176" font-size="32">Early effort is stored, not wasted.</text>
        <ellipse id="puddle" cx="390" cy="598" rx="60" ry="6" fill="var(--ice)"/>
        <rect id="cube" class="s-ink" x="260" y="330" width="260" height="260" rx="22" fill="var(--ice)" stroke-width="5"/>
        <line class="s-ink" x1="150" y1="596" x2="630" y2="596" stroke-width="5" stroke-linecap="round"/>
        <text id="temp" class="d" x="720" y="360" font-size="150">25°F</text>
        <text class="m" x="1420" y="360" font-size="26" text-anchor="end">32°F = 0°C</text>
        <line class="s-line" x1="720" y1="450" x2="1420" y2="450" stroke-width="3"/>
        <g id="steps"></g>
        <g id="bracket">
          <path class="s-muted" d="M720 535v16h600v-16" fill="none" stroke-width="3"/>
          <text class="m" x="1020" y="592" font-size="26" text-anchor="middle">PLATEAU OF LATENT POTENTIAL</text>
        </g>
        <text id="status" class="d5" x="720" y="700" font-size="52">Nothing seems to happen.</text>
      </g>

      <!-- 4 Goals vs systems -->
      <g id="s5" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Same goal. Different system.</text>
        <text class="b" x="120" y="176" font-size="32">Winners and losers aim at the same target. What they do daily is the difference.</text>
        <text class="d5" x="130" y="330" font-size="40">Goal only</text>
        <line class="s-line" x1="130" y1="390" x2="1374" y2="390" stroke-width="4"/>
        <circle class="s-ink" cx="1400" cy="390" r="26" fill="var(--stage)" stroke-width="5"/>
        <circle id="dotA" class="loss" cx="130" cy="390" r="17"/>
        <text class="d5" x="130" y="540" font-size="40">Goal + a daily system</text>
        <line class="s-line" x1="130" y1="600" x2="1374" y2="600" stroke-width="4"/>
        <g id="ticks" class="s-gain" stroke-width="5" stroke-linecap="round"></g>
        <circle id="goalB" class="s-ink" cx="1400" cy="600" r="26" fill="var(--stage)" stroke-width="5"/>
        <circle id="dotB" class="ink" cx="130" cy="600" r="17"/>
        <text id="s3end" class="d5" x="130" y="770" font-size="46">Goals set the direction. Systems do the moving.</text>
      </g>

      <!-- 5 Close -->
      <g id="s6" opacity="0">
        <text class="d" x="140" y="300" font-size="128" letter-spacing="-3">Get 1% better today.</text>
        <text class="d5" x="143" y="400" font-size="64" fill-opacity=".7">Then do it again tomorrow.</text>
        <g id="year"></g>
        <text class="m" x="143" y="700" font-size="26">365 DAYS</text>
        <text id="yearLine" class="d5" x="143" y="800" font-size="46">Invisible next week. Obvious in a year.</text>
        <text id="yearEnd" class="m" x="1457" y="700" font-size="26" text-anchor="end">1.01 ^ 365 ≈ 37.78</text>
      </g>
      <g id="wm" aria-hidden="true" pointer-events="none">
        <defs><pattern id="wmtile" width="560" height="360" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="24" y="190" font-family="DM Mono,monospace" font-size="34" font-weight="500" fill="var(--ink)" opacity=".06">visualgrowth.app</text></pattern></defs>
        <rect width="1600" height="900" fill="url(#wmtile)"/>
        <g class="wmc"><text x="1564" y="868" text-anchor="end" font-family="DM Mono,monospace" font-size="30" font-weight="500" fill="var(--ink)" stroke="var(--stage)" stroke-width="6" paint-order="stroke" opacity=".62">visualgrowth.app</text></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="87" step="0.01" value="0" aria-label="Position in the animation">
    <span id="clock">0:00 / 1:27</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">A paraphrased, extended summary of chapter 1 of James Clear's <em>Atomic Habits</em>. The curves are drawn to scale: 1.01<sup>365</sup> ≈ 37.78 and 0.99<sup>365</sup> ≈ 0.03. Narration is an AI voice generated with ElevenLabs.</p>
</div>

<audio id="vo" preload="auto" src="lesson-01.mp3"></audio>
<script>
(function(){
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b)=>ease(lin(t,a,b));
const DUR=87, SC=[[0,3.75],[3.75,28.9],[28.9,40.5],[40.5,50.55],[50.55,63.85],[63.85,73.6],[73.6,87]];
const NAMES=['1% better','British Cycling','Compounding','The plane','The plateau','Goals vs systems','Start today'];

// chart scale: one mapping for marks, grid and labels
const X=d=>160+d/365*990, Y=v=>760-v*13.5;
const grid=$('grid');
[0,10,20,30,40].forEach(v=>{
  mk('line',{class:'s-line',x1:160,x2:1150,y1:Y(v),y2:Y(v)},grid);
  const tx=mk('text',{class:'m',x:140,y:Y(v)+8,'font-size':24,'text-anchor':'end'},grid);tx.textContent=v+'×';
});
[0,90,180,270,365].forEach(d=>{
  const tx=mk('text',{class:'m',x:X(d),y:806,'font-size':24,'text-anchor':d===0?'start':d===365?'end':'middle'},grid);tx.textContent=d===0?'DAY 0':d;
});

// ice steps 25..32
const steps=[];for(let i=0;i<8;i++){
  const x=720+i*100, g=$('steps');
  const c=mk('circle',{cx:x,cy:450,r:14,fill:'var(--stage)',stroke:'var(--muted)','stroke-width':3},g);
  const tx=mk('text',{class:'m',x:x,y:506,'font-size':26,'text-anchor':'middle'},g);tx.textContent=(25+i)+'°';
  steps.push(c);
}
// lane ticks
const ticks=[];for(let i=1;i<=11;i++){const x=130+i/12*1270;ticks.push(mk('line',{x1:x,x2:x,y1:584,y2:616},$('ticks')))}
// 365 dots, 73 x 5
const yr=[];for(let i=0;i<365;i++){yr.push(mk('circle',{cx:152+(i%73)*18,cy:520+Math.floor(i/73)*26,r:5},$('year')))}
// bike spokes and medals
['wR','wF'].forEach((id,w)=>{for(let i=0;i<8;i++){const a=i*Math.PI/4,cx=w?600:270;mk('line',{x1:cx,y1:560,x2:(cx+104*Math.cos(a)).toFixed(1),y2:(560+104*Math.sin(a)).toFixed(1)},$(id))}});
const medals=[];for(let i=0;i<8;i++)medals.push(mk('circle',{class:'gain',cx:868+i*76,cy:410,r:0},$('medals')));
const GT=[16.45,17.1,17.75,18.8];
let lastCount=-1;

function vis(t,i){const[a,b]=SC[i],last=i===SC.length-1;
  if(t<a||(t>=b&&!last))return 0;
  return Math.min(i===0?1:lin(t,a,a+.6), last?1:1-lin(t,b-.5,b));}
function rise(el,k){el.setAttribute('opacity',k);el.setAttribute('transform','translate(0 '+((1-k)*22).toFixed(1)+')')}

function render(t){
  for(let i=0;i<SC.length;i++)$('s'+i).setAttribute('opacity',vis(t,i).toFixed(3));

  // 1: electrons
  for(let i=0;i<3;i++){const a=t*1.5+i*2.1, th=i*Math.PI/3, x=240*Math.cos(a), y=84*Math.sin(a);
    $('e'+i).setAttribute('cx',(x*Math.cos(th)-y*Math.sin(th)).toFixed(1));
    $('e'+i).setAttribute('cy',(x*Math.sin(th)+y*Math.cos(th)).toFixed(1));}

  // 2: curves
  const D=365*lin(t,31.2,39.9); let u='',dn='';
  for(let d=0;d<D;d+=4){u+=X(d).toFixed(1)+','+Y(Math.pow(1.01,d)).toFixed(1)+' ';dn+=X(d).toFixed(1)+','+Y(Math.pow(.99,d)).toFixed(1)+' '}
  const uv=Math.pow(1.01,D), dv=Math.pow(.99,D);
  u+=X(D).toFixed(1)+','+Y(uv).toFixed(1); dn+=X(D).toFixed(1)+','+Y(dv).toFixed(1);
  $('up').setAttribute('points',u); $('down').setAttribute('points',dn);
  $('upHead').setAttribute('cx',X(D));$('upHead').setAttribute('cy',Y(uv));
  $('downHead').setAttribute('cx',X(D));$('downHead').setAttribute('cy',Y(dv));
  $('day').textContent=Math.round(D); $('upVal').textContent=uv.toFixed(2)+'×'; $('downVal').textContent=dv.toFixed(2)+'×';

  // 3: ice
  let n=0; steps.forEach((c,i)=>{const on=t>=(i<7?53.5+i*.42:58.4); if(on)n=i;
    c.setAttribute('fill',on?(i===7?'var(--gain)':'var(--muted)'):'var(--stage)');
    c.setAttribute('stroke',on&&i===7?'var(--gain)':'var(--muted)');
    c.setAttribute('r',on&&i===7?20:14);});
  $('temp').textContent=(25+n)+'°F';
  const melted=t>=59.45, m=p(t,59.5,62.4), h=260*(1-m*.94);
  $('cube').setAttribute('height',h.toFixed(1)); $('cube').setAttribute('y',(590-h).toFixed(1));
  $('cube').setAttribute('rx',Math.min(22,h/2).toFixed(1));
  $('puddle').setAttribute('rx',(60+200*m).toFixed(1)); $('puddle').setAttribute('ry',(6+12*m).toFixed(1));
  $('status').textContent=melted?'At 32°, it melts.':'Nothing seems to happen.';
  rise($('bracket'),p(t,56.6,57.3));

  // 4: lanes
  const a=.2*p(t,66.4,67.8)-.09*p(t,68.6,70.4);
  $('dotA').setAttribute('cx',(130+a*1270).toFixed(1));
  const s=lin(t,66.4,72.3)*12, k=Math.min(11,Math.floor(s)), pos=s>=12?1:(k+ease(cl((s-k)/.6)))/12;
  $('dotB').setAttribute('cx',(130+pos*1270).toFixed(1));
  ticks.forEach((l,i)=>l.setAttribute('opacity',pos>=(i+1)/12-.001?1:0));
  $('goalB').setAttribute('fill',s>=12?'var(--gain)':'var(--stage)');
  rise($('s3end'),p(t,72.3,72.9));

  // British Cycling
  let ang=50*Math.max(0,t-4); GT.forEach((g,i)=>{ang+=45*Math.max(0,t-g);rise($('g'+i),p(t,g,g+.35))});
  $('wR').setAttribute('transform','rotate('+(ang%360).toFixed(1)+' 270 560)');
  $('wF').setAttribute('transform','rotate('+(ang%360).toFixed(1)+' 600 560)');
  rise($('gHead'),p(t,12.9,13.5)); rise($('tiny'),p(t,20.45,20.9)); rise($('together'),p(t,22.46,22.9));
  $('gains').setAttribute('opacity',(1-lin(t,23.9,24.35)).toFixed(3));
  $('beijing').setAttribute('opacity',lin(t,24.35,24.8).toFixed(3));
  medals.forEach((c,i)=>c.setAttribute('r',(28*p(t,24.7+i*.3,24.95+i*.3)).toFixed(1)));

  // plane
  const k1=p(t,41.2,43.6), k2=p(t,46.6,49.9), px=200+1141*k2, py=560-147*k2;
  $('plan').setAttribute('x2',200+1200*k1); $('plan').setAttribute('y2',560-230*k1);
  $('actual').setAttribute('x2',px); $('actual').setAttribute('y2',py);
  $('plane').setAttribute('cx',px); $('plane').setAttribute('cy',py);
  $('deg').setAttribute('opacity',p(t,45.6,46.3));
  $('dc').setAttribute('fill',k2>=1?'var(--gain)':'var(--stage)');

  // 5: year
  rise($('yearLine'),p(t,80.2,80.9));
  const count=Math.floor(365*lin(t,75.8,81.9));
  if(count!==lastCount){lastCount=count;yr.forEach((c,i)=>{const last=i===364&&count>=365;
    c.setAttribute('fill',last?'var(--gain)':i<count?'var(--ink)':'var(--line)');c.setAttribute('r',last?9:5)});}
  $('yearEnd').setAttribute('opacity',p(t,81.9,82.6));
}

// transport: the narration is the master clock while it is playing
const au=$('vo');
const alen=()=>isFinite(au.duration)&&au.duration>0?au.duration:83.88;
const chap=$('chapters'), cbtns=NAMES.map((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;
  b.addEventListener('click',()=>{t=SC[i][0]+(i?0.01:0);start()});chap.appendChild(b);return b});
let t=0, playing=false, prev=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function sync(){
  render(t); $('seek').value=t; $('clock').textContent=fmt(t)+' / '+fmt(DUR);
  $('play').textContent=playing?'Pause':(t>=DUR?'Replay':'Play');
  cbtns.forEach((b,i)=>b.setAttribute('aria-current',t>=SC[i][0]&&(t<SC[i][1]||i===SC.length-1)?'true':'false'));
}
function start(){
  if(t>=DUR)t=0; playing=true;
  if(t<alen()-.05){try{au.currentTime=t;const r=au.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  sync();
}
function stop(){playing=false;try{au.pause()}catch(e){} sync()}
function frame(now){
  if(playing&&prev!==null){
    if(!au.paused&&!au.ended&&au.readyState>2)t=au.currentTime; else t+=Math.min(.1,(now-prev)/1000);
    if(t>=DUR){t=DUR;playing=false;try{au.pause()}catch(e){}}
    sync();
  }
  prev=now; requestAnimationFrame(frame);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('seek').addEventListener('input',e=>{t=+e.target.value;stop()});
$('mute').addEventListener('click',e=>{au.muted=!au.muted;e.target.textContent=au.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',au.muted)});
$('full').addEventListener('click',()=>{const el=$('stageBox');
  try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}});
sync(); requestAnimationFrame(frame);
})();
</script>
