<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Manipulation works,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">but only briefly.</text>
<text class="b" x="120" y="600" font-size="32">Discounts and gimmicks win the sale but not the customer.</text>
<g id="cartItems"></g>
<path class="s-ink" d="M1140 250h50l40 170h180l36-130H1200" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ink" cx="1260" cy="446" r="16"/><circle class="ink" cx="1390" cy="446" r="16"/>
<g id="struggle"><path class="s-loss" d="M1180 520l90 30 80-10 100 60" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/><text class="m" x="1180" y="660" font-size="20" style="fill:var(--loss)">STILL STRUGGLING?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two ways to influence.</text>
<text class="b" x="120" y="176" font-size="32">Sinek: you can only manipulate people or inspire them.</text>
<path id="forkL" class="s-ink" d="M800 820V700C800 620 460 660 460 560" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<path id="forkR" class="s-ink" d="M800 700C800 620 1140 660 1140 560" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<circle class="gain" cx="800" cy="830" r="16"/>
<g id="pup">
<path class="s-ink" d="M390 240h140M460 222v36" stroke-width="8" stroke-linecap="round"/>
<g id="pupFig"></g>
<text class="d" x="460" y="470" font-size="44" text-anchor="middle" style="fill:var(--loss)">Manipulation</text>
<text class="m" x="460" y="505" font-size="20" text-anchor="middle">OUTSIDE PRESSURE</text>
</g>
<g id="bulb">
<g id="rays"></g>
<circle class="gain" cx="1140" cy="300" r="56"/>
<rect class="ink" x="1118" y="360" width="44" height="28" rx="6"/>
<text class="d" x="1140" y="470" font-size="44" text-anchor="middle" style="fill:var(--gain)">Inspiration</text>
<text class="m" x="1140" y="505" font-size="20" text-anchor="middle">A SHARED BELIEF</text>
</g>
<g id="works"><text class="m" x="120" y="780" font-size="22" style="fill:var(--loss)">IT WORKS... FOR A WHILE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The price trap.</text>
<text class="b" x="120" y="176" font-size="32">Sinek compares heavy discounting to a drug habit.</text>
<g id="tag"><path class="s-ink" d="M150 260H430L510 330L430 400H150Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><circle class="ink" cx="452" cy="330" r="11"/><text class="d" x="180" y="352" font-size="60" style="fill:var(--loss)">SALE</text></g>
<g id="bottle"><rect class="ink" x="245" y="470" width="150" height="40" rx="8"/><rect class="s-ink" x="225" y="520" width="190" height="250" rx="20" fill="var(--stage)" stroke-width="7"/><rect class="loss" x="225" y="590" width="190" height="110"/><text class="d" x="320" y="668" font-size="60" text-anchor="middle" style="fill:var(--stage)">−%</text></g>
<g id="chartA">
<text class="m" x="700" y="250" font-size="20">SALES HIGH</text>
<path class="s-line" d="M700 520H1460" stroke-width="4"/>
<polyline id="spike" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="700" y="610" font-size="20">MARGIN</text>
<g id="cuts"></g>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Promotions and rebates.</text>
<text class="b" x="120" y="176" font-size="32">Extras close the sale, then the buyer walks away.</text>
<g id="gift">
<rect class="s-ink" x="140" y="330" width="220" height="190" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="125" y="290" width="250" height="50" rx="6"/>
<rect class="gain" x="238" y="290" width="24" height="230"/>
<circle class="s-gain" cx="228" cy="272" r="18" fill="none" stroke-width="7"/><circle class="s-gain" cx="272" cy="272" r="18" fill="none" stroke-width="7"/>
<text class="d" x="400" y="450" font-size="80" style="fill:var(--muted)">+</text>
<rect class="s-gain" x="470" y="370" width="150" height="150" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="545" y="455" font-size="22" text-anchor="middle" style="fill:var(--gain)">FREE</text>
<text class="m" x="140" y="580" font-size="22">BUY ONE, GET ONE</text>
</g>
<g id="reb">
<rect class="s-ink" x="760" y="250" width="240" height="300" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="790" y="300" font-size="22">REBATE</text>
<path class="s-line" d="M790 350h180M790 400h180M790 450h120" stroke-width="6" stroke-linecap="round"/>
<rect class="s-ink" x="790" y="480" width="30" height="30" fill="none" stroke-width="4"/>
<g id="forms"></g>
<path class="s-ink" d="M1300 520V380a70 70 0 0 1 140 0V520Z" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1335 420h70" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="1360" y="520" width="20" height="80"/>
<path class="gain" d="M1440 450h30v-40h-30z"/>
</g>
<g id="unsent"><text class="m" x="760" y="710" font-size="20" style="fill:var(--loss)">MANY NEVER SEND IT IN</text></g>
<g id="rel">
<text class="d" x="120" y="820" font-size="40">More profit. No relationship.</text>
<circle class="ink" cx="1000" cy="800" r="22"/><circle class="gain" cx="1400" cy="800" r="22"/>
<path class="s-line" d="M1030 800H1170M1230 800H1370" stroke-width="5" stroke-dasharray="10 8"/>
<path class="s-loss" d="M1185 785l30 30M1215 785l-30 30" stroke-width="6" stroke-linecap="round"/>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fear lever.</text>
<text class="b" x="120" y="176" font-size="32">Fear pushes a decision. It doesn’t earn loyalty.</text>
<g id="cloud">
<circle class="loss" cx="240" cy="320" r="50"/><circle class="loss" cx="320" cy="280" r="70"/><circle class="loss" cx="410" cy="320" r="50"/><rect class="loss" x="240" y="320" width="170" height="50"/>
<path id="bolt" class="ink" d="M330 370l-30 45h28l-18 40 48-60h-28l18-25z"/>
</g>
<g id="buyer"><g id="buyerFig"></g></g>
<g id="q4"><text class="d5" x="640" y="280" font-size="36">“Nobody ever got fired for buying IBM.”</text></g>
<g id="boxes"></g>
<g id="pick"><path class="s-gain" d="M400 560H1040V492" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/><path class="s-gain" d="M1022 510l18-20 18 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="520" y="600" font-size="22">TO PROTECT MY JOB, NOT FOR LOVE</text></g>
<g id="loy">
<text class="m" x="640" y="670" font-size="22">LOYALTY</text>
<rect class="s-ink" x="640" y="690" width="800" height="36" rx="18" fill="none" stroke-width="4"/>
<rect id="loyFill" class="loss" x="640" y="690" width="36" height="36" rx="18"/>
<text class="d" x="120" y="820" font-size="40">Nobody feels loyal to what scared them.</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chasing novelty.</text>
<text class="b" x="120" y="176" font-size="32">A shiny new feature grabs attention, for a while.</text>
<g id="phone">
<rect class="s-ink" x="200" y="250" width="180" height="190" rx="24" fill="var(--stage)" stroke-width="7"/>
<rect class="gain" x="225" y="275" width="130" height="125" rx="8"/>
<rect class="ink" x="200" y="440" width="180" height="20"/>
<rect class="s-ink" x="200" y="460" width="180" height="190" rx="24" fill="var(--stage)" stroke-width="7"/>
<g id="keys"></g>
<path id="spark" class="gain" d="M430 220l8 22 22 8-22 8-8 22-8-22-22-8 22-8z"/>
</g>
<g id="razr"><text class="m" x="290" y="710" font-size="22" text-anchor="middle">MOTOROLA RAZR</text></g>
<g id="chart5">
<path class="s-ink" d="M640 270V700H1460" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="660" y="300" font-size="20">SALES</text>
<path id="upL" class="s-gain" d="M640 690C760 680 820 330 900 320" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<path id="downL" class="s-loss" d="M900 320C980 315 1100 600 1440 650" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="hit"><text class="m" x="920" y="310" font-size="22" style="fill:var(--gain)">HUGE HIT</text></g>
<g id="fade"><text class="m" x="1200" y="540" font-size="20" style="fill:var(--loss)">EXCITEMENT FADES</text></g>
</g>
<g id="rivals"><text class="m" x="620" y="780" font-size="20">RIVALS COPY IT · BUYERS MOVE ON</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Deals, not loyalty.</text>
<text class="b" x="120" y="176" font-size="32">Every lever buys one transaction.</text>
<g id="reg">
<rect id="rcpt" class="s-ink" x="370" y="400" width="80" height="0" fill="var(--stage)" stroke-width="4"/>
<rect class="ink" x="180" y="320" width="160" height="70" rx="8"/>
<rect class="s-ink" x="140" y="400" width="340" height="160" rx="12" fill="var(--stage)" stroke-width="7"/>
<g id="regKeys"></g>
<rect class="ink" x="140" y="560" width="340" height="40" rx="6"/>
<text class="m" x="140" y="650" font-size="20">ONE SALE AT A TIME</text>
</g>
<g id="deal"><path class="gain" d="M610 260H760L800 295L760 330H610Z"/><text class="d" x="630" y="307" font-size="34" style="fill:var(--on-gain)">DEAL</text><g id="dealFig"></g></g>
<g id="heart"><path class="gain" d="M700 420c-30-20-40-45-20-55c10-5 20 0 20 10c0-10 10-15 20-10c20 10 10 35-20 55z"/><text class="m" x="700" y="640" font-size="20" text-anchor="middle">LOYAL TO THE DEAL</text></g>
<g id="costB"></g>
<g id="costL"><text class="m" x="1020" y="670" font-size="20">COST OF EACH SALE</text></g>
<g id="car">
<path class="ink" d="M150 800V760H200L240 720H320L360 760H380V800Z"/>
<circle class="s-ink" cx="200" cy="805" r="20" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="330" cy="805" r="20" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="430" y="790" font-size="22">TRAINED TO WAIT FOR THE NEXT DEAL</text>
<g id="waitD"></g>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Check your levers.</text>
<text class="b" x="120" y="176" font-size="32">Look back at your last few big pushes.</text>
<g id="cards"></g>
<g id="mag"><circle class="s-ink" r="56" fill="var(--stage)" fill-opacity=".3" stroke-width="10"/><path class="s-ink" d="M40 40l50 50" stroke-width="18" stroke-linecap="round"/></g>
<g id="hand">
<rect class="s-gain" x="120" y="600" width="1360" height="200" rx="18" fill="var(--stage)" stroke-width="4"/>
<path class="s-ink" d="M180 730L260 690H320" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-gain" d="M460 730L380 690H320" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="gain" cx="320" cy="690" r="26"/>
<text class="d" x="520" y="688" font-size="44">What would make them choose you</text>
<text class="d5" x="520" y="748" font-size="36">even without the push?</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Would people still say yes</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">because they believe</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">what <tspan style="fill:var(--gain)">you</tspan> believe?</text></g>
<g id="cal">
<text class="m" x="143" y="700" font-size="26">THIS WEEK: ONE PITCH, NO DISCOUNT, NO PRESSURE</text>
<rect class="s-ink" x="1240" y="570" width="220" height="200" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1243" y="573" width="214" height="47" rx="13"/>
<g id="calDays"></g>
<circle id="calMark" class="s-gain" cx="1350" cy="694" r="18" fill="none" stroke-width="5"/>
</g>
</g>