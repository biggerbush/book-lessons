<g id="tix"><rect class="s-gain" x="1060" y="610" width="400" height="60" rx="30" fill="none" stroke-width="5"/><text class="m" x="1260" y="648" font-size="22" text-anchor="middle" style="fill:var(--gain)">PRICE OF ADMISSION</text></g>
<g id="w2nd"><text class="d" x="620" y="770" font-size="52">Words come second.</text><text class="m" x="620" y="820" font-size="22">IF THEY ARE READ AT ALL</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pinterest is a dream board.</text>
<text class="b" x="120" y="176" font-size="32">Where people collect their hopes and plans.</text>
<g id="board2"><rect class="s-ink" x="120" y="220" width="800" height="600" rx="16" fill="var(--line)" fill-opacity=".35" stroke-width="6"/></g>
<g id="c2s"></g>
<g id="cards2"></g>
<g id="plan">
<text class="m" x="980" y="280" font-size="22">MANY USERS ARE PLANNING</text>
<text class="m" x="980" y="312" font-size="22">FUTURE PURCHASES</text>
<path class="s-ink" d="M1000 400h420" stroke-width="5"/>
<circle class="s-gain" cx="1440" cy="400" r="18" fill="var(--stage)" stroke-width="5"/>
<circle id="dot2" class="gain" cx="1000" cy="400" r="14"/>
<text class="m" x="980" y="450" font-size="20">NOW</text>
<text class="m" x="1460" y="450" font-size="20" text-anchor="end" style="fill:var(--gain)">SOMEDAY</text></g>
