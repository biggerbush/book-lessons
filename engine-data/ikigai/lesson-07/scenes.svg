<g id="s0">
<text class="m" x="120" y="150" font-size="28">IKIGAI · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Bend without breaking,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">live your ikigai.</text>
<text class="b" x="120" y="600" font-size="32">Resilience, imperfection and savouring the moment keep your ikigai alive.</text>
