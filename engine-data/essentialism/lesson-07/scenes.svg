</g>
<g id="auto"><text class="d" x="120" y="830" font-size="44">Automatic action. No energy wasted deciding.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The same routine, every race.</text>
