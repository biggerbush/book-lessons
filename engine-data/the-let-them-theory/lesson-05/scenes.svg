<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Invest in people</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">who show up.</text>
<text class="b" x="120" y="600" font-size="32">Let people show you who they are, then invest wisely.</text>
