</g>
<g id="win2"><text class="d" x="120" y="840" font-size="44">Win the case, not find the truth.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. The politician.</text>
<text class="b" x="120" y="176" font-size="32">We campaign for the audience’s approval.</text>
<g id="rl3"></g>
<g id="pol"><g id="polfig"></g>
<path class="s-ink" d="M330 560v-30" stroke-width="5"/><circle class="ink" cx="330" cy="524" r="9"/>
