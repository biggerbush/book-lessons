<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Prove you’re listening</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">by looping.</text>
<text class="b" x="120" y="600" font-size="32">Show people you understand them, and watch their defences drop.</text>
<path id="tEar" class="s-ink" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g id="tRing"><path id="tLoop" class="s-gain" d="M1340 270A130 130 0 1 1 1210 400" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="10" stroke-linecap="round"/>
<path id="tHead" class="s-gain" d="M1190 420l20-26 20 26" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle id="td0" class="gain" cx="1300" cy="580" r="10"/><circle id="td1" class="gain" cx="1340" cy="580" r="10"/><circle id="td2" class="gain" cx="1380" cy="580" r="10"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why listening fails.</text>
<text class="b" x="120" y="176" font-size="32">Both sides are busy preparing their next point.</text>
<g id="p1L"></g><g id="p1R"></g>
<g id="b1L"><rect x="290" y="250" width="260" height="90" rx="45" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/><text class="m" x="420" y="303" font-size="22" text-anchor="middle">NEXT POINT…</text><circle class="s-line" cx="420" cy="368" r="9" fill="none" stroke-width="4"/></g>
<g id="b1R"><rect x="1050" y="250" width="260" height="90" rx="45" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/><text class="m" x="1180" y="303" font-size="22" text-anchor="middle">NEXT POINT…</text><circle class="s-line" cx="1180" cy="368" r="9" fill="none" stroke-width="4"/></g>
<g id="g1"><rect class="gain" x="290" y="250" width="260" height="90" rx="45"/><text class="m" x="420" y="303" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">I’M LISTENING</text><circle class="gain" cx="420" cy="368" r="9"/></g>
<text id="q1" class="d" x="1260" y="470" font-size="96" style="fill:var(--loss)">?</text>
<path id="sh1" class="loss" d="M1010 440l80 30v80c0 60-40 90-80 110c-40-20-80-50-80-110v-80z"/>
<g id="c1"><text class="d" x="120" y="800" font-size="46">So they assume you’re not listening.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The gun debate.</text>
<text class="b" x="120" y="176" font-size="32">Getting people on opposite sides to really talk.</text>
<g id="sd0"><text class="m" x="520" y="680" font-size="22" text-anchor="middle">ONE SIDE</text></g>
<g id="sd1"><text class="m" x="1080" y="680" font-size="22" text-anchor="middle">THE OTHER SIDE</text></g>
<g id="tb2"><rect class="ink" x="300" y="586" width="1000" height="24" rx="8"/></g>
<g id="spl"><path class="s-loss" d="M800 310V640" stroke-width="5" stroke-dasharray="12 10"/>
<path class="s-loss" d="M770 420h-70m20-20-20 20 20 20M830 420h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="290" font-size="20" text-anchor="middle" style="fill:var(--loss)">EXPECTING ATTACK</text></g>
<ellipse id="lp2" class="s-gain" cx="800" cy="360" rx="330" ry="70" fill="none" stroke-width="7" pathLength="1" stroke-dasharray="1 1"/>
<circle id="dot2" class="gain" r="13"/>
<g id="c2"><text class="d5" x="120" y="770" font-size="44">Not better arguments, but a listening habit:</text>
<text class="m" x="120" y="830" font-size="24" style="fill:var(--gain)">LOOPING FOR UNDERSTANDING</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 1: Ask.</text>
<text class="b" x="120" y="176" font-size="32">A question about what they think or feel.</text>
<g id="st0"><circle cx="340" cy="450" r="130" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/><text class="d" x="340" y="515" font-size="190" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d5" x="340" y="660" font-size="40" text-anchor="middle">Ask a question</text><text class="m" x="340" y="705" font-size="20" text-anchor="middle">WHAT DO THEY THINK OR FEEL?</text></g>
<path id="ar3a" class="s-muted" d="M495 450h130m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="st1"><circle cx="800" cy="450" r="130" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/><rect class="s-ink" x="760" y="370" width="100" height="160" fill="none" stroke-width="6"/><polygon class="gain" points="760,370 712,392 712,552 760,530"/><circle class="ink" cx="722" cy="470" r="6"/>
<text class="d5" x="800" y="660" font-size="40" text-anchor="middle">With curiosity</text><text class="m" x="800" y="705" font-size="20" text-anchor="middle">THEIR ANSWER MIGHT TEACH YOU</text></g>
<path id="ar3b" class="s-muted" d="M955 450h130m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="st2"><circle cx="1260" cy="450" r="130" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/><path id="ear3" class="s-ink" fill="none" stroke-width="9" stroke-linecap="round"/>
<path id="wav3" class="s-gain" d="M1345 395q22 45 0 90M1370 375q34 65 0 130" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="1260" y="660" font-size="40" text-anchor="middle">Listen fully</text><text class="m" x="1260" y="705" font-size="20" text-anchor="middle">DON’T PLAN YOUR REPLY</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 2: Repeat it back.</text>
<text class="b" x="120" y="176" font-size="32">What you heard, in your own words.</text>
<g id="p4L"></g><g id="p4R"></g>
<g id="b4L"><rect x="300" y="260" width="400" height="180" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-ink" d="M340 305h320M340 340h290M340 375h320M340 410h220" stroke-width="8" stroke-linecap="round"/><text class="m" x="500" y="480" font-size="20" text-anchor="middle">WHAT THEY SAID</text></g>
<path id="mir4" class="s-muted" d="M800 240V640" stroke-width="4" stroke-dasharray="10 10"/>
<g id="b4R"><rect x="900" y="260" width="400" height="180" rx="30" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<path id="cp4" class="s-muted" d="M940 305h320M940 340h290M940 375h320M940 410h220" stroke-width="8" stroke-linecap="round"/>
<path id="sm4" class="s-gain" d="M940 320h200M940 380h160" stroke-width="10" stroke-linecap="round"/>
<path id="ht4" class="gain" d="M1225 385c-42-26-46-58-23-64c11-3 19 4 23 13c4-9 12-16 23-13c23 6 19 38-23 64z"/>
<text class="m" x="1100" y="480" font-size="20" text-anchor="middle">WHAT YOU HEARD</text></g>
<g id="c4a"><text class="d" x="120" y="770" font-size="44">Not a parrot copy: your best summary.</text></g>
<g id="c4b"><text class="m" x="120" y="830" font-size="22" style="fill:var(--gain)">INCLUDE THE FEELING, NOT JUST THE FACTS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 3: Check.</text>
<text class="b" x="120" y="176" font-size="32">Ask if you got it right, and keep going until they say yes.</text>
<circle id="ring5" cx="560" cy="500" r="210" fill="none" stroke="var(--muted)" stroke-width="8" transform="rotate(-90 560 500)" pathLength="1" stroke-dasharray="1 1"/>
<circle id="dot5" class="gain" r="14"/>
<g id="nodes5"></g>
<g id="gift5"><rect class="gain" x="510" y="475" width="100" height="80"/><rect class="gain" x="500" y="450" width="120" height="25"/><path d="M560 450v105" stroke="var(--stage)" stroke-width="8"/><path class="s-gain" d="M560 448c-30-30-50-10-30 0M560 448c30-30 50-10 30 0" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="chk5"><path class="s-gain" d="M900 340l18 20 34-40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="970" y="360" font-size="42">Did I get that right?</text></g>
<g id="lp5"><text class="m" x="900" y="440" font-size="22">NO? TAKE IT IN AND TRY AGAIN</text><text class="m" x="900" y="480" font-size="22" style="fill:var(--gain)">UNTIL THEY SAY YES</text></g>
<g id="gf5"><text class="d5" x="900" y="590" font-size="34">Each correction is a gift:</text><text class="d5" x="900" y="636" font-size="34">it shows what matters to them.</text></g>
<g id="end5"><text class="d" x="900" y="770" font-size="52" style="fill:var(--gain)">That’s the loop.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Understanding isn’t agreeing.</text>
<text class="b" x="120" y="176" font-size="32">Looping proves you understand. You don’t have to agree.</text>
<path class="s-ink" d="M800 330V700M700 700h200" stroke-width="10" stroke-linecap="round"/>
<g id="bm6"><path class="s-ink" d="M440 330H1160" stroke-width="10" stroke-linecap="round"/></g>
<circle class="ink" cx="800" cy="330" r="14"/>
<g id="pan0"><path class="s-ink" d="M0 0v110" stroke-width="4"/><path class="ink" d="M-100 110a100 40 0 0 0 200 0z"/><path class="s-ink" d="M-70 100h30l40-30 40 30h30" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path id="x6" class="s-loss" d="M-40 50l80 60M40 50l-80 60" stroke-width="8" stroke-linecap="round"/><text class="m" x="0" y="190" font-size="22" text-anchor="middle">AGREE</text></g>
<g id="pan1"><path class="s-ink" d="M0 0v110" stroke-width="4"/><path class="ink" d="M-100 110a100 40 0 0 0 200 0z"/><path class="s-gain" d="M-30 80l22 22 40-46" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="0" y="190" font-size="22" text-anchor="middle" style="fill:var(--gain)">UNDERSTAND</text></g>
<g id="eye6"><path class="s-ink" d="M740 250q60-50 120 0q-60 50-120 0z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="800" cy="250" r="15"/><text class="m" x="880" y="258" font-size="20">SHOW IT, DON’T JUST FEEL IT</text></g>
<g id="c6"><text class="d" x="120" y="800" font-size="44">Feel understood. Relax. Listen back.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it out.</text>
<text class="b" x="120" y="176" font-size="32">One loop, as an illustration.</text>
<g id="p7a"></g><g id="p7b"></g>
<g id="bb7a"><rect x="320" y="270" width="660" height="100" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d5" x="350" y="332" font-size="34">“I need to protect my family.”</text></g>
<g id="ar7"><path class="s-gain" d="M1000 320c90 0 90 110 20 110M1038 414l-18 16 18 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="bb7b"><rect x="320" y="450" width="860" height="200" rx="30" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/>
<text class="d5" x="360" y="510" font-size="34">“So safety for the people you love</text><text class="d5" x="360" y="560" font-size="34">matters most to you,</text><text class="d5" x="360" y="610" font-size="34" style="fill:var(--gain)">is that right?”</text></g>
<g id="th7"><rect x="1310" y="280" width="60" height="420" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect id="thf" x="1324" width="32" rx="10"/><circle cx="1340" cy="730" r="46" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle id="thb" cx="1340" cy="730" r="32"/>
<text class="m" x="1400" y="310" font-size="20">HOT</text><text class="m" x="1400" y="690" font-size="20">CALM</text></g>
<g id="c7"><text class="d" x="120" y="810" font-size="40">You argued nothing. The room cools.</text></g>
<g id="ill7"><text class="m" x="120" y="852" font-size="20">AN ILLUSTRATION OF THE SHAPE OF A LOOP</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">In your next disagreement,</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">loop once before you</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">make <tspan style="fill:var(--gain)">your own point.</tspan></text></g>
<g id="tg8"><circle cx="1320" cy="560" r="110" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><circle class="s-ink" cx="1320" cy="560" r="72" fill="none" stroke-width="8"/><circle class="gain" cx="1320" cy="560" r="36"/></g>
<g id="ar8"><path class="s-ink" d="M0 0l90-90M70-90h20v-20M90-70h20v-20" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="n8"><text class="m" x="143" y="700" font-size="26">THEN NOTICE HOW THEIR TONE CHANGES</text></g>
</g>