<g id="e_txt"><text class="d5" x="1100" y="470" font-size="36">Yesterday’s luxury</text><text class="d5" x="1100" y="516" font-size="36">is today’s normal.</text></g>
<rect class="gain" x="120" y="812" width="18" height="18"/><text class="m" x="148" y="830" font-size="20">REALITY</text>
<path class="s-loss" d="M300 822h40" stroke-width="6"/><text class="m" x="352" y="830" font-size="20">EXPECTATION</text>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cost to others.</text>
<text class="b" x="120" y="176" font-size="32">Billions of farm animals pay for our power.</text>
<g id="c_cages"></g>
<g id="c_lbl"><text class="m" x="120" y="690" font-size="20" style="fill:var(--loss)">BILLIONS OF FARM ANIMALS, NEEDS IGNORED</text></g>
