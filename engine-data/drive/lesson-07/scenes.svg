<rect class="ink" x="300" y="620" width="800" height="18" rx="4"/>
<rect class="ink" x="340" y="638" width="16" height="170"/><rect class="ink" x="1044" y="638" width="16" height="170"/>
<g id="wk"><rect class="s-ink" x="600" y="460" width="200" height="140" rx="8" fill="var(--stage)" stroke-width="6"/>
