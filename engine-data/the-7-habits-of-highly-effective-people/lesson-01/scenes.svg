<g id="kids"></g>
<g id="ask"><rect x="1000" y="376" width="440" height="56" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><path d="M1064 432l16 12 6-12" fill="var(--stage)" stroke="var(--loss)" stroke-width="4" stroke-linejoin="round"/><text class="d5" x="1220" y="413" font-size="26" text-anchor="middle">Could you control your kids?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same scene. A new lens.</text>
<text class="b" x="120" y="176" font-size="32">The man looked up and explained.</text>
<g id="hosp"><rect class="s-ink" x="180" y="290" width="320" height="230" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="325" y="315" width="30" height="90"/><rect class="loss" x="295" y="345" width="90" height="30"/><rect class="ink" x="310" y="450" width="60" height="70"/><rect class="s-line" x="210" y="440" width="60" height="44" fill="none" stroke-width="4"/><rect class="s-line" x="410" y="440" width="60" height="44" fill="none" stroke-width="4"/><text class="d5" x="120" y="590" font-size="34">They had just come from the hospital.</text></g>
<g id="died"><text class="d5" x="120" y="645" font-size="34" style="fill:var(--loss)">Their mother had died an hour earlier.</text></g>
<g id="irr"><rect x="700" y="250" width="320" height="76" rx="38" fill="var(--stage)" stroke="var(--muted)" stroke-width="5"/><text class="m" x="860" y="296" font-size="24" text-anchor="middle" style="fill:var(--muted)">IRRITATION</text></g>
<g id="comp"><path class="s-muted" d="M1040 288h80m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1140" y="250" width="340" height="76" rx="38"/><text class="m" x="1310" y="296" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">COMPASSION</text></g>
<g id="hg"><g transform="translate(1310 525)"><path id="hrt" d="M0 60C-90 0-100-70-50-80C-25-85-5-65 0-50C5-65 25-85 50-80C100-70 90 0 0 60Z"/></g></g>
<g id="same1"><text class="d" x="120" y="740" font-size="46">Nothing about the situation changed.</text></g>
<g id="same2"><text class="d" x="120" y="810" font-size="46" style="fill:var(--gain)">Only the way he saw it changed.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">How they saw their son.</text>
<text class="b" x="120" y="176" font-size="32">Covey and his wife worried about their son, who struggled at school.</text>
<g id="fam"><g id="parents"></g><g id="son"></g><text class="m" x="275" y="620" font-size="20" text-anchor="middle">PARENTS</text><text class="m" x="760" y="620" font-size="20" text-anchor="middle">SON</text></g>
