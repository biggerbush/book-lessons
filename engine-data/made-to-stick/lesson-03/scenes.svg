<g id="eb1"><circle class="gain" cx="972" cy="472" r="10"/><text class="m" x="1000" y="480" font-size="26">EYES WIDEN</text></g>
<g id="eb2"><circle class="gain" cx="972" cy="542" r="10"/><text class="m" x="1000" y="550" font-size="26">WE STOP TO FIGURE IT OUT</text></g>
<g id="teach"><text class="d" x="120" y="800" font-size="52">That pause is your chance to teach.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The missing school day.</text>
<text class="b" x="120" y="176" font-size="32">Nora Ephron remembered a high school journalism assignment.</text>
<g id="np"><rect class="s-ink" x="120" y="230" width="560" height="540" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rings"></g>
<text class="m" x="160" y="310" font-size="22">THE TEACHER’S FACTS</text>
<g id="fx">
<g id="f0"><circle class="ink" cx="172" cy="390" r="7"/><text class="d5" x="192" y="400" font-size="30">Faculty travel next Thursday</text></g>
<g id="f1"><circle class="ink" cx="172" cy="470" r="7"/><text class="d5" x="192" y="480" font-size="30">To a conference</text></g>
<g id="f2"><circle class="ink" cx="172" cy="550" r="7"/><text class="d5" x="192" y="560" font-size="30">To hear famous speakers</text></g>
</g></g>
