<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Matching</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Principle.</text>
<text class="b" x="120" y="600" font-size="32">Connection starts when you join the other person's conversation.</text>
<line id="tie" class="s-line" x1="1110" y1="420" x2="1250" y2="420" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
<g id="pA"></g>
<g id="bA"><rect x="980" y="200" width="160" height="96" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-ink" d="M1040 298l10 24 18-24M1010 230h100M1010 252h100M1010 274h60" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pB"><g id="pBf"></g><g id="bB"><rect x="1220" y="200" width="160" height="96" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><path class="s-gain" d="M1290 298l10 24 18-24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text id="neq" class="d" x="1230" y="275" font-size="64" text-anchor="middle" style="fill:var(--loss)">≠</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="64">Right answer, wrong conversation.</text>
<text class="b" x="120" y="176" font-size="32">A friend shares a bad moment at work.</text>
<g id="sofa"><rect x="180" y="460" width="520" height="70" rx="22" fill="var(--stage)" stroke="var(--line)" stroke-width="6"/><rect x="150" y="530" width="580" height="70" rx="22" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-ink" d="M210 600v30M670 600v30" stroke-width="8" stroke-linecap="round"/></g>
<g id="fr"></g>
<g id="me"></g>
<g id="quiet"><rect x="150" y="350" width="100" height="60" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-dasharray="8 8"/><path class="s-loss" d="M236 410l20 16-6-18" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="fb"><rect x="150" y="230" width="360" height="90" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-ink" d="M310 322l10 26 20-26" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="330" y="283" font-size="20" text-anchor="middle">MY BOSS CRITICISED ME</text></g>
<g id="clip"><path class="s-muted" d="M640 420h200m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="900" y="230" width="360" height="370" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="1020" y="214" width="120" height="36" rx="8"/><text class="m" x="1080" y="290" font-size="20" text-anchor="middle">THREE SMART FIXES</text></g>
<g id="tips"></g>
<g id="want"><text class="m" x="150" y="680" font-size="24" style="fill:var(--gain)">WANTED: COMFORT</text><text class="m" x="900" y="680" font-size="24" style="fill:var(--loss)">GOT: A PLAN</text></g>
<g id="kinds"><rect x="120" y="730" width="440" height="80" rx="40" fill="none" stroke="var(--loss)" stroke-width="5"/><text class="m" x="340" y="779" font-size="24" text-anchor="middle" style="fill:var(--loss)">THEY: EMOTIONAL</text><rect x="1040" y="730" width="440" height="80" rx="40" fill="none" stroke="var(--ink)" stroke-width="5"/><text class="m" x="1260" y="779" font-size="24" text-anchor="middle" style="fill:var(--ink)">YOU: PRACTICAL</text><path class="s-muted" d="M580 770h170M850 770h170" stroke-width="5" stroke-dasharray="10 10"/><text class="d" x="800" y="790" font-size="52" text-anchor="middle" style="fill:var(--loss)">≠</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">When we connect, brains sync.</text>
<text class="b" x="120" y="176" font-size="32">Research by neuroscientist Thalia Wheatley.</text>
<g id="brains"></g>
<polyline id="w1" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline id="w2" fill="none" stroke="var(--loss)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="ent"><text class="d" x="800" y="530" font-size="56" text-anchor="middle">Neural entrainment.</text></g>
<g id="brk"><text class="m" x="120" y="666" font-size="22">DIFFERENT</text><text class="m" x="120" y="698" font-size="22">CONVERSATIONS</text>
<polyline id="w3" fill="none" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/><polyline id="w4" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="120" y="810" font-size="36">Out of step, the syncing is much harder.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">Jim Lawler, former CIA officer.</text>
<text class="b" x="120" y="176" font-size="32">His job: persuading foreigners to share secrets.</text>
<g id="badge"><rect x="120" y="230" width="300" height="360" rx="22" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="230" y="214" width="80" height="28" rx="8"/><g id="bfig"></g><text class="d" x="270" y="530" font-size="52" text-anchor="middle">CIA</text><text class="m" x="270" y="568" font-size="20" text-anchor="middle">J. LAWLER</text></g>
<g id="lock"><path class="s-ink" d="M235 670v-25a35 35 0 0 1 70 0v25" fill="none" stroke-width="10"/><rect class="loss" x="215" y="670" width="110" height="80" rx="12"/><text class="m" x="350" y="720" font-size="22">SECRETS</text></g>
<g id="pitch"><rect x="560" y="240" width="320" height="400" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-line" d="M600 300h180M600 350h240M600 400h240M600 450h200M600 500h240M600 550h160" stroke-width="8" stroke-linecap="round"/><text class="m" x="720" y="690" font-size="20" text-anchor="middle">THE POLISHED PITCH</text></g>
<g id="nox"><path class="s-loss" d="M600 300l240 280M840 300l-240 280" stroke-width="14" stroke-linecap="round"/></g>
<g id="table"><g id="tfig"></g><rect class="ink" x="1000" y="556" width="440" height="16" rx="4"/><path class="s-ink" d="M1040 572v100M1400 572v100" stroke-width="8" stroke-linecap="round"/><g id="th"></g><text class="m" x="1220" y="720" font-size="20" text-anchor="middle">WHAT THEY FELT AND NEEDED</text></g>
<g id="meet"><text class="d" x="120" y="830" font-size="44">Meet them where they are.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Which conversation are they in?</text>
<text class="b" x="120" y="176" font-size="32">Notice first, before you respond.</text>
<g id="ear"><path class="s-ink" d="M180 430c0-90 50-150 110-150s100 50 100 110c0 60-60 70-60 120s-30 60-60 50M245 420c0-50 20-70 45-70s45 20 45 50" fill="none" stroke-width="10" stroke-linecap="round"/></g>
<path id="snd" class="s-gain" d="M430 360q20 40 0 80M470 340q30 60 0 120" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="bub"><rect x="520" y="240" width="960" height="300" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-ink" d="M600 538l-50 60 110-60" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="chips"></g>
<g id="clues"><text class="m" x="120" y="710" font-size="24">CLUES</text><g id="tags"></g>
<g id="mag"><circle cx="0" cy="0" r="36" fill="none" stroke="var(--ink)" stroke-width="9"/><path class="s-ink" d="M26 26l28 28" stroke-width="12" stroke-linecap="round"/></g></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet them there.</text>
<text class="b" x="120" y="176" font-size="32">Answer in the same kind of conversation first.</text>
<g id="cards"></g>
<g id="agree"><text class="d" x="120" y="730" font-size="52">Matching does not mean agreeing.</text></g>
<g id="steer"><text class="b" x="120" y="800" font-size="32">It means joining their conversation before steering anywhere.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not sure? Just ask.</text>
<text class="b" x="120" y="176" font-size="32">Sometimes the clues are fuzzy.</text>
<g id="qg"><text id="qm" class="d" x="290" y="510" font-size="250" text-anchor="middle" style="fill:var(--loss)">?</text><text class="m" x="290" y="660" font-size="22" text-anchor="middle">FUZZY CLUES</text></g>
<g id="ask"><path class="s-gain" d="M470 450h170m-24-24 24 24-24 24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="555" y="412" font-size="22" text-anchor="middle" style="fill:var(--gain)">ASK</text></g>
<g id="o0"><rect x="700" y="250" width="780" height="130" rx="65" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/><circle class="gain" cx="770" cy="315" r="32"/><text class="d" x="770" y="327" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">A</text><text class="d5" x="830" y="330" font-size="40">Help solve it?</text></g>
<g id="o1"><rect x="700" y="420" width="780" height="130" rx="65" fill="var(--stage)" stroke="var(--gain)" stroke-width="6"/><circle class="gain" cx="770" cy="485" r="32"/><text class="d" x="770" y="497" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">B</text><text class="d5" x="830" y="500" font-size="40">Or just listen?</text></g>
<g id="dots"><path class="s-line" d="M200 740H1400" stroke-width="4" stroke-dasharray="4 10"/><line id="lnk" class="s-gain" y1="740" y2="740" stroke-width="8" stroke-linecap="round"/><circle id="dl" class="ink" cy="740" r="26"/><circle id="dr" class="gain" cy="740" r="26"/></g>
<g id="stay"><text class="d5" x="120" y="840" font-size="34">One question keeps you in the same conversation.</text></g>
</g>

<g id="s7" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">In your next tough chat,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">which conversation are</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">they <tspan style="fill:var(--gain)">having?</tspan></text></g>
<g id="lab7"><text class="m" x="143" y="700" font-size="26">PAUSE, THEN MEET THEM THERE FIRST</text></g>
<g id="cb"><rect x="1100" y="640" width="220" height="120" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><path class="s-ink" d="M1150 760l-10 40 40-40" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
