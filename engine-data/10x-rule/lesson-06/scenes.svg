<g id="dis"><text class="d" x="120" y="836" font-size="44">That’s why so many dreams quietly disappear.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Success is an obligation.</text>
<text class="b" x="120" y="176" font-size="32">Not a luxury.</text>
