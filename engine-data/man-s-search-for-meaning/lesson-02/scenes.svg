<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Shock, numbness and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the mind’s defenses.</text>
<text class="b" x="120" y="600" font-size="32">How the mind numbs itself to survive the unbearable</text>
<g id="t_rings"></g><g id="t_head"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three stages.</text>
<text class="b" x="120" y="176" font-size="32">Frankl, a psychiatrist, quietly studied the people around him.</text>
<g id="d_doors"></g>
<path class="s-line" d="M320 800H1280" stroke-width="5" stroke-linecap="round"/>
<circle id="d_dot" class="gain" cx="320" cy="800" r="16"/>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The first shock.</text>
<text class="b" x="120" y="176" font-size="32">When the trains reached Auschwitz, many clung to a desperate hope.</text>
<g id="tr_train">
<rect class="s-ink" x="140" y="590" width="200" height="100" rx="8" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="360" y="590" width="200" height="100" rx="8" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="580" y="570" width="200" height="120" rx="10"/>
<rect class="ink" x="700" y="536" width="40" height="40"/>
<g id="tr_wh"></g>
</g>
<path class="s-line" d="M120 716H820" stroke-width="6" stroke-linecap="round"/>
<g id="tr_people"></g>
<g id="tr_lab"><text class="m" x="860" y="262" font-size="22">“THE DELUSION OF REPRIEVE”</text></g>
<g id="tr_bub">
<g id="tr_L">
<polygon id="tr_Lt" class="s-ink" points="995,396 1035,396 1100,546" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path id="tr_Lp" class="s-ink" d="M1080 300H900q-40 0-40 40v20q0 40 40 40H1080L1060 375L1095 350L1060 325Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d5" x="965" y="362" font-size="34" text-anchor="middle">Somehow,</text>
</g>
<g id="tr_R">
<polygon id="tr_Rt" class="s-ink" points="1195,396 1240,396 1222,546" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path id="tr_Rp" class="s-ink" d="M1080 300H1420q40 0 40 40v20q0 40-40 40H1080L1060 375L1095 350L1060 325Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="1280" y="362" font-size="34" text-anchor="middle">we’ll be spared.</text>
</g>
</g>
<g id="tr_real"><text class="d" x="120" y="800" font-size="44">Then reality broke through.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Grim jokes, cold curiosity.</text>
<text class="b" x="120" y="176" font-size="32">Odd reactions among the new arrivals.</text>
<g id="gh_frame"><rect class="s-line" x="140" y="290" width="900" height="400" rx="18" fill="none" stroke-width="4" stroke-dasharray="12 10"/></g>
<g id="gh_ppl"></g>
<g id="gh_jl"><text class="m" x="340" y="660" font-size="20" text-anchor="middle">GRIM JOKES</text></g>
<g id="gh_q"><text class="d" x="840" y="560" font-size="200" text-anchor="middle">?</text><text class="m" x="840" y="660" font-size="20" text-anchor="middle">DETACHED CURIOSITY</text></g>
<g id="gh_back"><path id="gh_line" class="s-gain" d="M1050 470H1140" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="1300" y="660" font-size="20" text-anchor="middle">STEPPING BACK</text></g>
<g id="gh_obs"></g>
<g id="gh_cope"><text class="d" x="120" y="790" font-size="44">The mind steps back to cope from a distance.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Apathy: the second stage.</text>
<g id="ap_sub"><text class="b" x="120" y="176" font-size="32">Feelings dulled. Prisoners stopped reacting.</text></g>
<text class="m" x="120" y="240" font-size="20">FEELINGS</text>
<polyline id="ap_wave" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<g id="ap_figs"></g>
<g id="ap_eyes"><text class="m" x="800" y="836" font-size="22" text-anchor="middle">WITNESSING SUFFERING WITHOUT LOOKING AWAY</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A bowl of soup.</text>
<text class="b" x="120" y="176" font-size="32">Frankl’s own example of how deep the numbness had gone.</text>
<g id="sp_meal">
<g id="sp_fig"></g>
<rect class="ink" x="140" y="600" width="680" height="14" rx="4"/>
<path class="s-ink" d="M200 614v110M760 614v110" stroke-width="8" stroke-linecap="round"/>
<path class="ink" d="M380 520h240a120 72 0 0 1-240 0z"/>
<g id="sp_steam"></g>
<g id="sp_spoon"><path class="s-ink" d="M300 520L436 490" stroke-width="8" stroke-linecap="round"/><ellipse class="ink" cx="452" cy="488" rx="20" ry="10"/></g>
</g>
<g id="sp_win">
<rect class="s-ink" x="960" y="250" width="400" height="360" rx="6" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1160 250V610M960 430H1360" stroke-width="6"/>
<text class="m" x="1160" y="660" font-size="20" text-anchor="middle">A DEAD FELLOW PRISONER, DRAGGED AWAY</text>
</g>
<g id="sp_eyes"></g>
<g id="sp_keep"><text class="d" x="120" y="790" font-size="48">Frankl kept eating.</text></g>
<g id="sp_deep"><text class="m" x="120" y="840" font-size="22" style="fill:var(--loss)">THAT IS HOW DEEP THE NUMBNESS HAD GONE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A protective shell.</text>
<text class="b" x="120" y="176" font-size="32">Not a moral failure: a necessary defense that shields the mind.</text>
<g id="sh_arr"></g>
<circle id="sh_shell" cx="600" cy="520" r="200" fill="none" stroke="var(--gain)" stroke-width="12" stroke-dasharray="1257" stroke-dashoffset="1257" stroke-linecap="round"/>
<g id="sh_fig"></g>
<g id="sh_def"><text class="m" x="600" y="790" font-size="22" text-anchor="middle">APATHY · A NECESSARY DEFENSE</text></g>
<g id="sh_bat">
<text class="m" x="1000" y="390" font-size="22">STRENGTH SAVED FOR ONE TASK</text>
<rect class="s-ink" x="1000" y="420" width="360" height="120" rx="14" fill="none" stroke-width="7"/>
<rect class="ink" x="1366" y="455" width="20" height="50" rx="4"/>
<rect id="sh_fill" class="gain" x="1014" y="434" width="0" height="92" rx="6"/>
<text class="d" x="1000" y="620" font-size="52">Staying alive.</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Free, but not free.</text>
<text class="b" x="120" y="176" font-size="32">Liberation brought the third stage, not what anyone expected.</text>
<rect class="ink" x="150" y="260" width="20" height="380"/><rect class="ink" x="450" y="260" width="20" height="380"/>
<g id="fr_gl"></g><g id="fr_gr"></g>
<path class="s-line" d="M120 640H1480" stroke-width="5" stroke-linecap="round"/>
<g id="fr_fl"></g>
<g id="fr_walk"></g>
<g id="fr_bar"><text class="m" x="680" y="722" font-size="22" text-anchor="end">JOY</text><rect class="s-ink" x="700" y="700" width="400" height="28" rx="14" fill="none" stroke-width="4"/><rect id="fr_fill" class="gain" x="704" y="704" width="0" height="20" rx="10"/></g>
<g id="fr_re"><text class="m" x="700" y="770" font-size="20">SLOWLY RELEARNING HOW TO FEEL</text></g>
<g id="fr_home">
<rect class="s-ink" x="1240" y="540" width="160" height="100" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1220 540L1320 470L1420 540" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="fr_cloud"></g>
<text class="m" x="1320" y="690" font-size="20" text-anchor="middle">BITTERNESS</text>
<text class="m" x="1320" y="720" font-size="20" text-anchor="middle">DISAPPOINTMENT</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="ys_a"><text class="d" x="136" y="270" font-size="80" letter-spacing="-2">Numb after hard news?</text></g>
<g id="ys_b"><text class="d" x="136" y="370" font-size="80" letter-spacing="-2">It may be protecting you.</text></g>
<g id="ys_c"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">What small step helps you</text></g>
<g id="ys_d"><text class="d" x="136" y="600" font-size="80" letter-spacing="-2">begin to <tspan style="fill:var(--gain)">feel again</tspan>?</text></g>
<text class="m" x="143" y="730" font-size="26">GENTLY, ONE FEELING AT A TIME</text>
<g id="ys_mir">
<ellipse class="s-ink" cx="1380" cy="730" rx="54" ry="74" fill="var(--stage)" stroke-width="7"/>
<circle class="gain" cx="1380" cy="712" r="18"/><path class="gain" d="M1352 770a28 28 0 0 1 56 0z"/>
<path id="ys_shine" class="s-line" d="M1350 690q6-20 22-28" fill="none" stroke-width="5" stroke-linecap="round"/>
</g>
</g>