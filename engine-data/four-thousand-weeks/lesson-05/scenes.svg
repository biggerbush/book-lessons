<g id="more"><text class="d" x="120" y="830" font-size="46">A good life needs more of these, valued for themselves.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be happily mediocre.</text>
<text class="b" x="120" y="176" font-size="32">Hobbies you enjoy, not hobbies you perform.</text>
