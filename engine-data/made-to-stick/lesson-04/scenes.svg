<text class="d5" x="840" y="836" font-size="32" style="fill:var(--gain)">within the decade.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why the moon works.</text>
<text class="b" x="120" y="176" font-size="32">A goal you can see, check and share.</text>
