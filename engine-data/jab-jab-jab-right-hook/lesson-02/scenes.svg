<g id="sh2"><rect class="s-ink" x="800" y="470" width="680" height="300" rx="18" fill="var(--stage)" stroke-width="5"/><rect x="830" y="500" width="340" height="240" rx="10" fill="var(--line)"/>
<path class="ink" d="M850 720l90-120 60 70 50-50 100 100z"/><circle class="gain" cx="1110" cy="550" r="26"/>
<text class="m" x="1210" y="540" font-size="20">PINTEREST</text><text class="d5" x="1210" y="600" font-size="30">A striking image</text>
<rect class="gain" x="1210" y="650" width="150" height="56" rx="28"/><text class="m" x="1285" y="686" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">SAVE</text></g>
<g id="loc"><text class="d" x="120" y="840" font-size="44">Same story, in the local language.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your context check.</text>
<text class="b" x="120" y="176" font-size="32">Two questions before you post.</text>
<g id="clip"><rect class="s-ink" x="120" y="230" width="640" height="560" rx="20" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="340" y="208" width="200" height="50" rx="12"/><text class="m" x="160" y="750" font-size="20">BEFORE YOU POST</text></g>
<g id="ck1"><rect class="s-ink" x="160" y="320" width="56" height="56" rx="10" fill="none" stroke-width="5"/><text class="d5" x="240" y="345" font-size="34">Why do people come</text><text class="d5" x="240" y="388" font-size="34">to this platform?</text></g>
