<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Knowing when you</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">have enough.</text>
<text class="b" x="120" y="600" font-size="32">Why the hardest money skill is getting the goalpost to stop moving.</text>
<path class="s-line" d="M1080 520h380" stroke-width="5" stroke-linecap="round"/>
<g id="tcoins"></g>
<g id="tgp"><path class="s-ink" d="M1180 520V260M1400 520V260" stroke-width="8" stroke-linecap="round"/><line id="tbar" x1="1180" x2="1400" y1="362" y2="362" stroke="var(--loss)" stroke-width="8" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Heller had something more.</text>
<text class="b" x="120" y="176" font-size="32">Kurt Vonnegut and Joseph Heller, at a billionaire’s party.</text>
<g id="h1a"><g id="hppl"></g><path class="s-ink" d="M322 470H408" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
<text class="m" x="260" y="650" font-size="20" text-anchor="middle">THE HOST</text><text class="m" x="470" y="650" font-size="20" text-anchor="middle">VONNEGUT</text></g>
<g id="h1b"><g id="hhel"></g><text class="m" x="680" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">HELLER</text></g>
<g id="h2"><text class="m" x="860" y="280" font-size="20">THE HOST · ONE DAY</text><rect id="bar0" class="ink" x="860" y="296" width="0" height="48" rx="6"/>
<text class="m" x="860" y="390" font-size="20">CATCH-22 · ALL TIME</text><rect id="bar1" x="860" y="406" width="0" height="48" rx="6" fill="var(--muted)"/></g>
<g id="h3"><path d="M884 520H1436a24 24 0 0 1 24 24V646a24 24 0 0 1-24 24H884a24 24 0 0 1-24-24V604L745 482L860 570V544a24 24 0 0 1 24-24Z" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="900" y="585" font-size="40">I have something he</text><text class="d5" x="900" y="637" font-size="40">will never have.</text></g>
<g id="h4"><text class="d" x="860" y="800" font-size="96" style="fill:var(--gain)">“Enough.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rajat Gupta’s climb.</text>
<text class="b" x="120" y="176" font-size="32">From a Kolkata orphan to the top of McKinsey.</text>
<path id="stairs" class="s-ink" d="M120 720H520V540H920V360H1360" fill="none" stroke-width="8" stroke-linejoin="round" pathLength="1"/>
<g id="st0"><text class="d5" x="140" y="780" font-size="40">Kolkata</text><text class="m" x="140" y="820" font-size="20">LOST BOTH PARENTS AS A TEEN</text></g>
<g id="st1"><text class="d5" x="540" y="600" font-size="40">McKinsey</text><text class="m" x="540" y="640" font-size="20">RAN ONE OF THE WORLD’S</text><text class="m" x="540" y="670" font-size="20">MOST POWERFUL FIRMS</text></g>
<g id="st2"><text id="gnum" class="d" x="940" y="430" font-size="64" style="fill:var(--gain)">$0 million</text><text class="m" x="944" y="470" font-size="20">REPORTED WORTH AT RETIREMENT</text></g>
<g id="gup"><g id="gupi"></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then he wanted more.</text>
<text class="b" x="120" y="176" font-size="32">He wanted to be a billionaire, like the people around him.</text>
<rect class="gain" x="160" y="520" width="400" height="120" rx="10"/><text class="d" x="360" y="602" font-size="60" text-anchor="middle" style="fill:var(--on-gain)">$100M</text>
<g id="f3me"></g>
<g id="f3b"><g id="f3fr"></g><rect x="700" y="300" width="400" height="40" rx="8" fill="none" stroke="var(--loss)" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="900" y="380" font-size="20" text-anchor="middle" style="fill:var(--loss)">BILLIONAIRES</text>
<path class="s-loss" d="M410 380Q520 250 690 300M690 300l-28-2m28 2l-16 22" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/></g>
<g id="f3p"><path id="sig" class="s-loss" d="M420 470Q860 600 1316 470" fill="none" stroke-width="5" stroke-dasharray="14 12"/><g id="f3hf"></g>
<text class="m" x="860" y="620" font-size="20" text-anchor="middle">SECRETS FROM THE GOLDMAN SACHS BOARD</text>
<text class="m" x="1360" y="570" font-size="20" text-anchor="middle">HEDGE FUND FRIEND</text></g>
<g id="f3j"><rect x="290" y="370" width="140" height="150" fill="none" stroke="var(--loss)" stroke-width="7"/><path class="s-loss" d="M318 370v150M346 370v150M374 370v150M402 370v150" stroke-width="6"/>
<text class="m" x="360" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">CONVICTED OF INSIDER TRADING</text></g>
<g id="f3t"><text class="d" x="120" y="800" font-size="40">He gambled what he needed to chase what he never needed.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bernie Madoff, too.</text>
<text class="b" x="120" y="176" font-size="32">He was already rich before the fraud.</text>
<rect class="s-line" x="120" y="230" width="620" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="860" y="230" width="620" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="m4a"><g id="m4p"></g><text class="m" x="230" y="570" font-size="20" text-anchor="middle">BERNIE MADOFF</text></g>
<g id="m4b"><text class="m" x="150" y="280" font-size="20">REAL TRADING BUSINESS</text><rect class="ink" x="360" y="526" width="350" height="18" rx="4"/><path class="s-ink" d="M380 544v120M690 544v120M560 500v26" stroke-width="8"/>
<rect class="s-ink" x="480" y="400" width="160" height="100" rx="8" fill="var(--stage)" stroke-width="6"/><polyline class="s-gain" points="500,480 540,460 580,470 620,420" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text class="d5" x="150" y="715" font-size="36">Already very rich.</text></g>
<g id="m4s"><text class="m" x="890" y="280" font-size="20" style="fill:var(--loss)">PONZI SCHEME</text><path class="s-line" d="M896 718H1444" stroke-width="5" stroke-linecap="round"/></g>
<g id="pyr"></g>
<g id="m4x"><text class="d" x="890" y="400" font-size="64" style="fill:var(--loss)">Collapsed.</text></g>
<g id="m4c"><text class="d" x="120" y="820" font-size="46">He never needed the scheme that destroyed him.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The goalpost keeps moving.</text>
<text class="b" x="120" y="176" font-size="32">The hardest financial skill: getting it to stop.</text>
<path class="s-muted" d="M160 240V560H880" fill="none" stroke-width="4"/>
