</g>
<path id="plat" class="s-loss" d="M1090 370H1430" stroke-width="12" stroke-linecap="round" opacity="0"/>
<g id="platL"><text class="m" x="1430" y="345" font-size="20" text-anchor="end" style="fill:var(--loss)">NO LONGER IMPROVING</text></g>
<g id="clk">
