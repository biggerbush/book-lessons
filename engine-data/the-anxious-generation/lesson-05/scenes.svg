<text class="m" x="1140" y="662" font-size="20">ROSE FASTEST AMONG</text>
<text class="m" x="1140" y="694" font-size="20" style="fill:var(--loss)">YOUNG TEEN GIRLS</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Built to belong.</text>
<text class="b" x="120" y="176" font-size="32">Two deep motives: agency, to stand out, and communion, to belong.</text>
<g id="cA"><circle class="s-line" cx="420" cy="470" r="170" fill="none" stroke-width="4"/><g id="ag"></g>
<text class="d" x="420" y="710" font-size="44" text-anchor="middle">Agency</text><text class="m" x="420" y="752" font-size="20" text-anchor="middle">STAND OUT</text></g>
<g id="cB"><circle id="cBc" class="s-line" cx="860" cy="470" r="170" fill="none" stroke-width="4"/><circle class="s-line" cx="860" cy="470" r="105" fill="none" stroke-width="3"/><g id="cm"></g>
<text class="d" x="860" y="710" font-size="44" text-anchor="middle">Communion</text><text class="m" x="860" y="752" font-size="20" text-anchor="middle">BELONG</text></g>
<circle id="gcm" class="gain" cx="640" cy="470" r="22" opacity="0"/>
<g id="lean"><text class="m" x="640" y="810" font-size="20" text-anchor="middle" style="fill:var(--gain)">GIRLS, ON AVERAGE, LEAN TOWARD COMMUNION</text></g>
