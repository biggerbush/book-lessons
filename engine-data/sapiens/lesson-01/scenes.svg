<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">We were once one human</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">among many.</text>
<text class="b" x="120" y="600" font-size="32">Why there was a time when we had human cousins</text>
<path class="s-line" d="M1190 722h290" stroke-width="5" stroke-linecap="round"/>
<g id="t1"></g>
<g id="t0w"><g id="t0"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What does “human” mean?</text>
<text class="b" x="120" y="176" font-size="32">To a biologist: any animal in the genus Homo, not just us.</text>
<g id="brs"></g>
<g id="tree"><path class="s-ink" d="M830 800V620" stroke-width="10" stroke-linecap="round"/><text class="m" x="860" y="780" font-size="24">GENUS HOMO</text></g>
<g id="sap"><path class="s-gain" d="M280 520V660" stroke-width="4" stroke-dasharray="8 8"/><rect class="gain" x="120" y="660" width="560" height="170" rx="18"/><text class="d" x="156" y="736" font-size="52" style="fill:var(--on-gain)">Homo sapiens</text><text class="m" x="158" y="796" font-size="28" style="fill:var(--on-gain)">MEANING “WISE MAN”</text></g>
<g id="sibs"></g>
<g id="sibt"><text class="m" x="1480" y="780" font-size="22" text-anchor="end">MANY HUMAN SIBLINGS</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A crowded planet.</text>
<text class="b" x="120" y="176" font-size="32">About 2 million to 10,000 years ago: several human species at once.</text>
<g id="map">
<ellipse cx="240" cy="340" rx="90" ry="70" fill="var(--line)"/><ellipse cx="300" cy="530" rx="55" ry="95" fill="var(--line)"/>
<ellipse cx="560" cy="320" rx="70" ry="50" fill="var(--line)"/><ellipse cx="590" cy="520" rx="80" ry="120" fill="var(--line)"/>
<ellipse cx="800" cy="340" rx="160" ry="95" fill="var(--line)"/><ellipse cx="880" cy="600" rx="70" ry="45" fill="var(--line)"/>
<g id="stripes"></g>
<text class="m" x="120" y="812" font-size="20">2 MILLION YEARS AGO</text><text class="m" x="1480" y="812" font-size="20" text-anchor="end">10,000 YEARS AGO</text>
</g>
<g id="nea"><path class="s-muted" d="M594 316L1040 330" stroke-width="3" stroke-dasharray="6 8"/><circle class="ink" cx="570" cy="315" r="14"/><circle class="s-ink" cx="570" cy="315" r="24" fill="none" stroke-width="3"/>
<rect class="s-ink" x="1040" y="230" width="440" height="200" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="1070" y="292" font-size="40">Neanderthals</text><text class="m" x="1070" y="336" font-size="20">EUROPE &amp; WESTERN ASIA</text><text class="m" x="1070" y="368" font-size="20">BULKIER, MORE MUSCULAR</text><text class="m" x="1070" y="400" font-size="20">BUILT FOR ICE AGE COLD</text></g>
<g id="ere"><path class="s-muted" d="M888 376L1040 560" stroke-width="3" stroke-dasharray="6 8"/><circle class="ink" cx="870" cy="360" r="14"/><circle class="s-ink" cx="870" cy="360" r="24" fill="none" stroke-width="3"/>
<rect class="s-ink" x="1040" y="470" width="440" height="200" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="1070" y="532" font-size="40">Homo erectus</text><text class="m" x="1070" y="576" font-size="20">EASTERN ASIA</text><text class="m" x="1070" y="608" font-size="20">SURVIVED CLOSE TO</text><text class="m" x="1070" y="640" font-size="20" style="fill:var(--gain)">2 MILLION YEARS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Island dwarfs.</text>
<text class="b" x="120" y="176" font-size="32">Homo floresiensis, on the Indonesian island of Flores.</text>
<g id="isl"><rect class="loss" x="120" y="640" width="520" height="120" rx="16" fill-opacity=".12"/>
<path class="s-loss" d="M170 690q25-14 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0M195 730q25-14 50 0t50 0t50 0t50 0t50 0t50 0t50 0" fill="none" stroke-width="4" stroke-linecap="round"/>
<path class="s-ink" d="M170 640Q380 520 590 640Z" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="380" y="810" font-size="24" text-anchor="middle">FLORES, INDONESIA</text></g>
<path class="s-ink" d="M700 762H1480" stroke-width="5" stroke-linecap="round"/>
<g id="tape"><rect class="gain" x="790" y="330" width="50" height="430"/></g>
<g id="m1"><path class="s-ink" d="M780 460H1060" stroke-width="4" stroke-dasharray="10 8"/><text class="d" x="1090" y="478" font-size="52">≈ 1 metre</text></g>
<g id="shr"><path class="s-muted" d="M1110 580H1410m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1480" y="812" font-size="22" text-anchor="end">SCARCE FOOD, SMALLER BODIES</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A finger bone.</text>
<text class="b" x="120" y="176" font-size="32">2010: scientists study a fossil from a Siberian cave.</text>
<g id="cave"><path class="s-ink" d="M140 720Q140 300 350 300Q560 300 560 720" fill="var(--stage)" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M120 722H640" stroke-width="5" stroke-linecap="round"/><text class="m" x="350" y="772" font-size="22" text-anchor="middle">SIBERIAN CAVE</text></g>
<g id="bone"><text class="d" x="350" y="470" font-size="64" text-anchor="middle">2010</text><circle id="ring" class="s-gain" cx="350" cy="640" r="70" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<rect class="ink" x="300" y="630" width="100" height="20" rx="10"/><circle class="ink" cx="300" cy="630" r="12"/><circle class="ink" cx="300" cy="650" r="12"/><circle class="ink" cx="400" cy="630" r="12"/><circle class="ink" cx="400" cy="650" r="12"/></g>
<g id="dna"><g id="rungs"></g><path id="hx1" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/><path id="hx2" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-muted" d="M1070 470h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="newsp"><rect class="gain" x="1120" y="380" width="360" height="180" rx="18"/><text class="m" x="1150" y="432" font-size="20" style="fill:var(--on-gain)">NEW HUMAN SPECIES</text><text class="d" x="1150" y="510" font-size="52" style="fill:var(--on-gain)">Denisovans</text></g>
<g id="cous"></g>
<g id="cousl"><text class="m" x="760" y="790" font-size="22">HOW MANY MORE LOST COUSINS?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then there was one.</text>
<text class="b" x="120" y="176" font-size="32">Around 70,000 years ago, Sapiens spread out of East Africa.</text>
<path class="s-ink" d="M120 522H1480" stroke-width="5" stroke-linecap="round"/>
<g id="oth"><text class="m" x="704" y="566" font-size="20">OTHER HUMANS</text></g>
<g id="walkw"><g id="walk"></g><text class="m" x="120" y="566" font-size="20" style="fill:var(--gain)">SAPIENS · OUT OF EAST AFRICA</text></g>
<g id="qm"><text class="d" x="120" y="760" font-size="140" style="fill:var(--gain)">?</text><text class="d5" x="230" y="680" font-size="44">Breed with them,</text><text class="d5" x="230" y="740" font-size="44">or replace them?</text></g>
<g id="quo"><rect class="s-ink" x="840" y="600" width="640" height="200" rx="18" fill="var(--stage)" stroke-width="4"/><text class="d" x="880" y="672" font-size="40">“Tolerance is not a</text><text class="d" x="880" y="724" font-size="40">Sapiens trademark.”</text><text class="m" x="880" y="772" font-size="20">— YUVAL NOAH HARARI</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mixed ancestry.</text>
<text class="b" x="120" y="176" font-size="32">Our DNA still carries traces of lost cousins.</text>
<g id="l0"><text class="m" x="120" y="270" font-size="20">MODERN EUROPEANS &amp; MIDDLE EASTERNERS</text><rect id="b0" class="gain" x="120" y="290" width="0" height="70"/></g>
<g id="x0"><rect class="ink" x="850" y="290" width="50" height="70"/><text class="m" x="900" y="392" font-size="20" text-anchor="end">A FEW % NEANDERTHAL</text></g>
<g id="l1"><text class="m" x="120" y="470" font-size="20">SOME MELANESIANS &amp; ABORIGINAL AUSTRALIANS</text><rect id="b1" class="gain" x="120" y="490" width="0" height="70"/></g>
<g id="x1"><rect class="ink" x="860" y="490" width="40" height="70"/><text class="m" x="900" y="592" font-size="20" text-anchor="end">DENISOVAN DNA TOO</text></g>
<g id="scl"><path class="s-ink" d="M1240 340V780" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="1160" y="780" width="160" height="16" rx="8"/>
<path id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1240" cy="340" r="12"/>
<g id="pl"><path class="s-ink" d="M0 0L-60 120M0 0L60 120" stroke-width="4"/><path class="s-ink" d="M-70 120h140a70 36 0 0 1-140 0z" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="0" cy="106" r="14"/><text class="m" x="0" y="196" font-size="20" text-anchor="middle">SOME MIXING</text></g>
<g id="pr"><path class="s-ink" d="M0 0L-60 120M0 0L60 120" stroke-width="4"/><path class="s-ink" d="M-70 120h140a70 36 0 0 1-140 0z" fill="var(--stage)" stroke-width="5"/>
<circle class="loss" cx="-42" cy="106" r="14"/><circle class="loss" cx="-14" cy="106" r="14"/><circle class="loss" cx="14" cy="106" r="14"/><circle class="loss" cx="42" cy="106" r="14"/><circle class="loss" cx="-28" cy="80" r="14"/><circle class="loss" cx="0" cy="80" r="14"/><circle class="loss" cx="28" cy="80" r="14"/>
<text class="m" x="0" y="196" font-size="20" text-anchor="middle">REPLACEMENT</text></g></g>
<g id="cap6"><text class="d" x="120" y="760" font-size="44">Some mixing, mostly replacement.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it matters.</text>
<text class="b" x="120" y="176" font-size="32">We are one surviving branch of a once bushy family tree.</text>
<g id="pa"><rect class="s-line" x="120" y="230" width="413" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><g id="me"></g>
<path class="gain" d="M300 296l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
<ellipse class="s-ink" cx="420" cy="440" rx="60" ry="120" fill="var(--stage)" stroke-width="7"/><g id="refl"></g>
<path class="s-ink" d="M420 560V620M380 620h80" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="156" y="670" font-size="20">“WE ARE SPECIAL,</text><text class="m" x="156" y="702" font-size="20">SEPARATE FROM ANIMALS”</text></g>
<g id="pb"><rect class="s-line" x="593" y="230" width="413" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><g id="brs7"></g>
<path class="s-ink" d="M800 640V540" stroke-width="10" stroke-linecap="round"/><circle id="leaf" class="gain" cx="850" cy="300" r="16"/>
<text class="m" x="629" y="670" font-size="20">ONE BRANCH SURVIVES</text><text class="m" x="629" y="702" font-size="20">THE REST ARE GONE</text></g>
<g id="pc"><rect class="s-line" x="1067" y="230" width="413" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<polygon id="sandT" class="gain"/><polygon id="sandB" class="gain"/><path id="stream" class="s-gain" d="M1273 450V596" stroke-width="3"/>
<path class="s-ink" d="M1203 300h140l-62 150 62 150h-140l62-150z" fill="none" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M1188 300h170M1188 600h170" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1097" y="670" font-size="20">ERECTUS: ~2 MILLION YEARS</text><text class="m" x="1097" y="702" font-size="20" style="fill:var(--gain)">WILL WE LAST THAT LONG?</text></g>
</g>

<g id="s8" opacity="0">
<g id="top8"><text class="m" x="143" y="240" font-size="26">NEXT TIME YOU FEEL APART FROM NATURE…</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What changes if you see</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">yourself as one survivor</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">among <tspan style="fill:var(--gain)">many cousins</tspan>?</text></g>
<g id="lab8"><text class="m" x="143" y="700" font-size="26">ONE SURVIVOR AMONG MANY</text></g>
<g id="pair"><path class="s-line" d="M1220 764h260" stroke-width="5" stroke-linecap="round"/></g>
</g>