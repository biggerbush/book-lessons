<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Love reaches beyond</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the barbed wire.</text>
<text class="b" x="120" y="600" font-size="32">How picturing a loved one kept Frankl going in the camps.</text>
