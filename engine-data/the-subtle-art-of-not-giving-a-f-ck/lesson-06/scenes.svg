<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE SUBTLE ART OF NOT GIVING A F*CK · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Failure is the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">way forward.</text>
<text class="b" x="120" y="600" font-size="32">Stop waiting for motivation and let action create it.</text>
<path class="s-line" d="M1160 610H1480" stroke-width="5" stroke-linecap="round"/>
<g id="chair"><path class="s-ink" d="M1250 260V460H1430M1262 460V600M1418 460V600" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="wdots"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Picasso’s napkin.</text>
<text class="b" x="120" y="176" font-size="32">A story Mark Manson tells about Pablo Picasso, late in life.</text>
<g id="cafe">
<path class="s-ink" d="M420 600H1000M710 600V720M640 720H780" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="pic" class="ink"></g>
<text class="m" x="330" y="640" font-size="20" text-anchor="middle">PICASSO</text>
</g>
<g id="nap">
<rect class="s-ink" x="620" y="460" width="180" height="130" rx="6" fill="var(--stage)" stroke-width="5"/>
<path id="doodle" class="s-ink" d="M650 548c20-60 50-60 62-16s40 40 60-26M690 500l18-18 18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="wom" class="ink"></g>
<g id="tag">
<path class="s-ink" d="M800 470L840 432" stroke-width="3"/>
<path class="gain" d="M840 400h150l30 30-30 30h-150z"/>
<text class="m" x="925" y="437" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">HUGE PRICE</text>
</g>
<g id="bub1">
<rect class="s-ink" x="945" y="260" width="360" height="84" rx="20" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="1125" y="315" font-size="36" text-anchor="middle">“Only minutes?”</text>
</g>
<g id="reply"><text class="d" x="120" y="810" font-size="56">“It took me more than <tspan style="fill:var(--gain)">sixty years</tspan>.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Built from failures.</text>
<text class="b" x="120" y="176" font-size="32">Sixty years full of attempts that didn’t work.</text>
<g id="pages"></g>
<path id="better" class="s-gain" d="M120 680H1354" stroke-width="8" stroke-linecap="round"/>
<g id="betl"><text class="m" x="1372" y="688" font-size="22" style="fill:var(--gain)">BETTER</text></g>
<g id="lesson"><text class="d" x="120" y="790" font-size="44">Improvement comes from thousands of small failures.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The order we assume.</text>
<text class="b" x="120" y="176" font-size="32">Feel inspired, then motivated, then finally act.</text>
<g id="chain3"></g>
<g id="bulb"><circle id="bulbC" class="s-ink" cx="290" cy="490" r="42" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="272" y="536" width="36" height="26" rx="5"/></g>
<g id="clk">
<circle class="s-ink" cx="380" cy="710" r="90" fill="var(--stage)" stroke-width="7"/>
<path id="hand1" class="s-ink" d="M380 710V640" stroke-width="7" stroke-linecap="round"/>
<path id="hand2" class="s-ink" d="M380 710H428" stroke-width="7" stroke-linecap="round"/>
</g>
<g id="wait">
<text class="d" x="540" y="700" font-size="52">We wait for the spark…</text>
<text class="m" x="540" y="752" font-size="22" style="fill:var(--loss)">…AND OFTEN IT NEVER COMES</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s a loop. Start with action.</text>
<text class="b" x="120" y="176" font-size="32">Inspiration and motivation follow what you do.</text>
<g id="loopg"><circle class="s-line" cx="500" cy="530" r="220" fill="none" stroke-width="6"/><circle id="ldot" class="gain" r="14"/><g id="nodes"></g></g>
<g id="shoe"><g id="shoeI">
<path class="ink" d="M940 430V330q50-6 70 34l70 22q110 6 140 44z"/>
<rect class="gain" x="930" y="426" width="300" height="24" rx="12"/>
<path class="s-muted" d="M880 360h40M860 400h60" stroke-width="6" stroke-linecap="round"/>
</g></g>
<g id="first"><text class="d" x="900" y="560" font-size="52">Action comes first.</text></g>
<g id="react">
<text class="d5" x="900" y="680" font-size="36">Doing something, even badly,</text>
<text class="d5" x="900" y="730" font-size="36">gives your brain a reaction.</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Just do something.</text>
<text class="b" x="120" y="176" font-size="32">A lesson from Manson’s high school math teacher.</text>
<g id="board5">
<rect class="s-ink" x="120" y="240" width="560" height="360" rx="10" fill="var(--stage)" stroke-width="7"/>
<text class="d" x="170" y="340" font-size="72">x =</text>
<g id="qm"><text class="d" x="310" y="340" font-size="72" style="fill:var(--loss)">?</text></g>
<g id="chk"><path class="s-gain" d="M310 310l25 25 45-55" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<path id="scrib" class="s-ink" d="M170 420c30-30 60 30 90 0s60 30 90 0 60 30 90 0 60 30 90 0M170 500c40-20 80 20 120 0s80 20 120 0 80 20 120 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="pen"><path class="gain" d="M0 0l12-30 70-70 18 18-70 70z"/><path class="ink" d="M0 0l12-30 18 18z"/></g>
</g>
<g id="tch" class="ink"></g>
<g id="bub5">
<rect class="s-ink" x="880" y="240" width="600" height="90" rx="24" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="1180" y="298" font-size="38" text-anchor="middle">“Do something, anything.”</text>
</g>
<g id="stu">
<path class="s-ink" d="M1040 720H1360" stroke-width="8" stroke-linecap="round"/>
<g id="stuP" class="ink"></g>
<g id="qs"><text class="d" x="1262" y="560" font-size="64" style="fill:var(--loss)">?</text></g>
</g>
<g id="along"><text class="d" x="120" y="800" font-size="40">Start scribbling. The answer often shows up along the way.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small and bad is fine.</text>
<text class="b" x="120" y="176" font-size="32">One clumsy sentence beats a blank page.</text>
<g id="wr" style="stroke:var(--ink);stroke-width:4"></g>
<text id="wrl" class="m" x="300" y="640" font-size="22" text-anchor="middle">FROZEN</text>
<g id="page6">
<rect class="s-ink" x="520" y="220" width="560" height="600" rx="8" fill="var(--stage)" stroke-width="6"/>
<g id="lines"></g>
<rect id="cur" class="gain" width="6" height="40"/>
</g>
<g id="edits"><path class="s-gain" d="M640 296h140M900 410l14-24 14 24M600 476h90" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="exist">
<text class="d" x="1140" y="460" font-size="52">Not good.</text>
<text class="d" x="1140" y="530" font-size="52" style="fill:var(--gain)">Just there.</text>
<text class="m" x="1140" y="590" font-size="20">IT JUST HAS TO EXIST</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Failure is information.</text>
<text class="b" x="120" y="176" font-size="32">Not a verdict on you, but a pointer to your next move.</text>
<g id="gav">
<g id="gavH"><rect class="ink" x="230" y="300" width="150" height="64" rx="12"/><path class="s-ink" d="M305 364V490" stroke-width="12" stroke-linecap="round"/></g>
<rect class="ink" x="200" y="540" width="220" height="30" rx="8"/>
<text class="m" x="310" y="630" font-size="26" text-anchor="middle">VERDICT</text>
<path id="vstr" class="s-loss" d="M230 620H390" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="cmp">
<circle class="s-ink" cx="720" cy="420" r="130" fill="var(--stage)" stroke-width="7"/>
<g id="needle"><path class="gain" d="M720 330L742 420H698z"/><path class="ink" d="M720 510L742 420H698z"/></g>
<circle class="ink" cx="720" cy="420" r="10"/>
<text class="m" x="720" y="610" font-size="24" text-anchor="middle" style="fill:var(--gain)">INFORMATION</text>
</g>
<g id="stairs">
<path class="s-ink" d="M960 560h90v-60h90v-60h90v-60h90v-60h90" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle id="sdot" class="gain" r="18"/>
<text class="m" x="960" y="610" font-size="22">EACH MISSTEP SHOWS WHAT TO ADJUST</text>
</g>
<g id="fear"><text class="d" x="120" y="780" font-size="44">Fear of failing only wins when you refuse to start.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="80" letter-spacing="-2">Pick one thing</text></g>
<g id="qb"><text class="d" x="136" y="385" font-size="80" letter-spacing="-2">you keep putting off.</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">Give it <tspan style="fill:var(--gain)">five clumsy</tspan></text></g>
<g id="qd"><text class="d" x="136" y="595" font-size="80" letter-spacing="-2"><tspan style="fill:var(--gain)">minutes</tspan> today.</text></g>
<g id="nxt"><text class="m" x="143" y="720" font-size="26">THEN NOTICE WHAT IT MAKES YOU WANT TO DO NEXT</text></g>
<g id="sw">
<rect class="ink" x="1255" y="285" width="50" height="26" rx="6"/>
<path class="s-ink" d="M1280 311V322" stroke-width="10"/>
<circle class="s-ink" cx="1280" cy="460" r="140" fill="var(--stage)" stroke-width="10"/>
<path id="swarc" class="gain" d="M0 0"/>
<path id="swh" class="s-ink" d="M1280 460V350" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1280" cy="460" r="12"/>
</g>
</g>