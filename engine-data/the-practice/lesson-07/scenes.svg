<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PRACTICE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Show up and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">do it again.</text>
<text class="b" x="120" y="600" font-size="32">The practice has no finish line, so keep coming back.</text>
<ellipse class="s-line" cx="1260" cy="450" rx="200" ry="130" fill="none" stroke-width="40"/>
<ellipse class="s-ink" cx="1260" cy="450" rx="200" ry="130" fill="none" stroke-width="3" stroke-dasharray="12 12"/>
<g id="fin"><path class="s-ink" d="M1260 300v40" stroke-width="12" stroke-dasharray="5 5"/><text class="m" x="1260" y="270" font-size="20" text-anchor="middle">FINISH?</text></g>
<text id="lapn" class="d" x="1260" y="466" font-size="44" text-anchor="middle" opacity="0">LAP 1</text>
<circle id="runner" class="gain" r="20"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A loop, not a ladder.</text>
<text class="b" x="120" y="176" font-size="32">Seth Godin’s picture of the practice.</text>
<g id="lad">
<path class="s-muted" d="M180 760V300M300 760V300M180 720h120M180 650h120M180 580h120M180 510h120M180 440h120M180 370h120" fill="none" stroke-width="6" stroke-linecap="round"/>
<path class="s-muted" d="M180 300V240M300 300V240" stroke-width="6" stroke-dasharray="8 10"/>
<text class="m" x="240" y="800" font-size="20" text-anchor="middle">LADDER</text>
</g>
<g id="notop"><text class="m" x="330" y="262" font-size="20" style="fill:var(--loss)">NO TOP RUNG</text></g>
<circle id="loopc" class="s-ink" cx="960" cy="500" r="240" fill="none" stroke-width="6" stroke-dasharray="1508" transform="rotate(-90 960 500)"/>
<circle id="ldot" class="gain" r="16"/>
<g id="nodes"></g>
<g id="again"><text class="d" x="960" y="520" font-size="56" text-anchor="middle" style="fill:var(--gain)">Again.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">No finish line.</text>
<text class="b" x="120" y="176" font-size="32">No final project ends the work.</text>
<path class="s-line" d="M120 700H1480" stroke-width="8" stroke-linecap="round"/>
<g id="walker"></g>
<g id="tro" opacity="0">
<path class="s-ink" d="M1240 440h120v40a60 60 0 0 1-120 0zM1240 455h-24v30h24M1360 455h24v30h-24M1290 540h20v60h-20zM1255 600h90v20h-90z" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round"/>
<text class="m" x="1300" y="400" font-size="20" text-anchor="middle">THE MOMENT WE ARRIVE</text>
</g>
<g id="hz"><path class="s-muted" d="M1200 700H1460m-20-16 20 16-20 16" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><text class="m" x="1480" y="750" font-size="20" text-anchor="end">THE WORK KEEPS GOING</text></g>
<g id="laps"></g>
<g id="evst"><text class="d" x="120" y="820" font-size="44">Every finished piece starts the next lap.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A blog post, every single day.</text>
<text class="b" x="120" y="176" font-size="32">Godin points to his own practice.</text>
<g id="lap">
<rect class="s-ink" x="160" y="280" width="400" height="250" rx="12" fill="var(--stage)" stroke-width="7"/>
<g id="typ"></g>
<path class="ink" d="M120 560h480l-30 30H150z"/>
</g>
<text class="m" x="700" y="262" font-size="20">DAILY POSTS · MANY YEARS</text>
<g id="cal"></g>
<g id="lg0"><text class="m" x="700" y="670" font-size="20" style="fill:var(--gain)">SOME LAND WELL</text></g>
<g id="lg1"><text class="m" x="1000" y="670" font-size="20">SOME BARELY GET NOTICED</text></g>
<g id="stk"></g>
<rect id="tmr" class="gain" x="220" y="600" width="240" height="14" rx="3"/>
<g id="tmw"><text class="d5" x="700" y="790" font-size="40">Tomorrow, he writes another one.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Learning makes the loop grow.</text>
<text class="b" x="120" y="176" font-size="32">Each time you ship, you see a little more clearly.</text>
<g id="card">
<rect class="s-ink" x="180" y="290" width="360" height="240" rx="14" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="210" y="335" font-size="20">SHIPPED</text>
<path class="s-line" d="M210 380h200M210 430h200M210 480h200" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="mk4">
<path class="s-gain" d="M436 380l12 12 22-24M436 480l12 12 22-24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M440 420l24 24M464 420l-24 24" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="lb4"><text class="m" x="180" y="600" font-size="20" style="fill:var(--gain)">WHAT WORKED</text><text class="m" x="380" y="600" font-size="20" style="fill:var(--loss)">WHAT DID NOT</text></g>
<g id="magw"><g id="mag"><circle class="s-ink" r="64" fill="none" stroke-width="12"/><path class="s-ink" d="M46 46l60 60" stroke-width="18" stroke-linecap="round"/></g></g>
<path id="spi" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round"/>
<circle id="sdot" class="gain" r="16"/>
<g id="sk"><path class="s-muted" d="M1420 780V300m-16 20 16-20 16 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1420" y="280" font-size="20" text-anchor="middle">SKILL</text></g>
<g id="spt"><text class="d" x="120" y="820" font-size="44">The loop becomes a spiral.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">No one has to pick you.</text>
<text class="b" x="120" y="176" font-size="32">The practice needs no one’s approval.</text>
<path class="s-line" d="M120 640H1480" stroke-width="6" stroke-linecap="round"/>
<g id="que"></g>
<g id="gate"><rect class="loss" x="500" y="300" width="40" height="340"/><g id="gk"></g></g>
<g id="tags"></g>
<g id="wt"><text class="m" x="120" y="700" font-size="20">WAITING TO BE PICKED</text></g>
<g id="door">
<rect class="gain" x="1140" y="300" width="200" height="340" fill-opacity=".3"/>
<rect id="pnl" class="ink" x="1140" y="300" width="200" height="340"/>
<rect class="s-ink" x="1140" y="300" width="200" height="340" fill="none" stroke-width="7"/>
</g>
<g id="you5w"><g id="you5"></g></g>
<g id="bgn"><text class="m" x="1480" y="700" font-size="20" text-anchor="end">BEGIN TODAY, WITH WHAT YOU HAVE</text></g>
<g id="nop"><text class="d" x="120" y="810" font-size="44">No approval required.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A routine, not an event.</text>
<text class="b" x="120" y="176" font-size="32">Choose a commitment small enough to keep.</text>
<g id="clk"><g id="clkin">
<circle class="ink" cx="215" cy="335" r="34"/><circle class="ink" cx="385" cy="335" r="34"/>
<path class="s-ink" d="M220 560l-30 50M380 560l30 50" stroke-width="10" stroke-linecap="round"/>
<circle class="s-ink" cx="300" cy="450" r="130" fill="var(--stage)" stroke-width="8"/>
<line id="hh" class="s-ink" x1="300" y1="450" x2="300" y2="385" stroke-width="10" stroke-linecap="round"/>
<line id="mh" class="s-gain" x1="300" y1="450" x2="300" y2="345" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="300" cy="450" r="10"/>
</g><text class="m" x="300" y="660" font-size="20" text-anchor="middle">SAME TIME, EVERY DAY</text></g>
<rect x="600" y="700" width="120" height="80" fill="var(--line)"/>
<rect x="1320" y="380" width="160" height="400" fill="var(--line)"/>
<g id="stp"></g>
<g id="lp"><path id="lpa" d="M660 690Q1000 120 1320 380" fill="none" stroke="var(--loss)" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text id="lpt" class="m" x="1000" y="280" font-size="22" text-anchor="middle" style="fill:var(--loss)">A FRIGHTENING LEAP</text></g>
<g id="hab"><text class="m" x="1410" y="322" font-size="20" text-anchor="middle" style="fill:var(--gain)">ORDINARY</text><text class="m" x="1410" y="352" font-size="20" text-anchor="middle" style="fill:var(--gain)">HABIT</text></g>
<g id="sb"><text class="m" x="720" y="830" font-size="20">ONE SMALL STEP, AGAIN AND AGAIN</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">You become one by doing it.</text>
<text class="b" x="120" y="176" font-size="32">Over time, something shifts.</text>
<g id="mir">
<path class="s-ink" d="M520 760v60M440 830h160" stroke-width="10" stroke-linecap="round"/>
<ellipse class="s-ink" cx="520" cy="500" rx="190" ry="260" fill="var(--stage)" stroke-width="10"/>
<path class="s-line" d="M410 360q20-70 80-90" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="refl"></g>
</g>
<g id="q0"><text class="d5" x="820" y="330" font-size="52" style="fill:var(--muted)">Writer?</text></g>
<g id="q1"><text class="d5" x="820" y="410" font-size="52" style="fill:var(--muted)">Designer?</text></g>
<g id="q2"><text class="d5" x="820" y="490" font-size="52" style="fill:var(--muted)">Artist?</text></g>
<g id="tag">
<rect class="gain" x="820" y="560" width="560" height="200" rx="22"/>
<text class="m" x="860" y="615" font-size="24" style="fill:var(--on-gain)">HELLO, I AM A</text>
<text id="tagw" class="d" x="860" y="715" font-size="72" style="fill:var(--on-gain)">Writer</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="q8a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What is one small thing</text></g>
<g id="q8b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you could make and <tspan style="fill:var(--gain)">share</tspan></text></g>
<g id="q8c"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">this week?</text></g>
<g id="nxt"><text class="m" x="143" y="700" font-size="26">SHIP IT · LEARN · SHOW UP FOR THE NEXT LAP</text></g>
<g id="nlp"><circle class="s-line" cx="1340" cy="720" r="70" fill="none" stroke-width="10"/><circle id="nd" class="gain" r="16"/></g>
</g>