<g id="bk"><text class="m" x="800" y="370" font-size="20" text-anchor="middle">COURSE OFFERED</text><rect class="ink" x="700" y="400" width="200" height="150" rx="8"/><path d="M724 400v150" stroke="var(--stage)" stroke-width="4"/><text class="m" x="812" y="484" font-size="22" text-anchor="middle" style="fill:var(--stage)">ENGLISH</text></g>
<g id="mv5"><g id="g5a"><g id="p5a"></g><text class="m" x="1150" y="610" font-size="20" text-anchor="middle" style="fill:var(--gain)">GROWTH</text><g id="yes5"><rect class="gain" x="1090" y="300" width="120" height="64" rx="32"/><text class="d" x="1150" y="344" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">YES</text></g></g></g>
<g id="g5b"><g id="p5b"></g><text class="m" x="1360" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">FIXED</text></g>
<g id="li5"><text class="m" x="1360" y="660" font-size="20" text-anchor="middle" style="fill:var(--loss)">LITTLE INTEREST</text></g>
<g id="dep5"><text class="d" x="120" y="790" font-size="40">Even though their studies depended on it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Effort: weakness, or the engine?</text>
<text class="b" x="120" y="176" font-size="32">The same split shows up with effort.</text>
