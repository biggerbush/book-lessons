<text class="m" x="720" y="540" font-size="24" text-anchor="middle" style="fill:var(--ink)">AVERAGE</text>
<text class="m" x="720" y="660" font-size="22" text-anchor="middle">SAFE · FOR EVERYONE</text>
</g>
<text id="plus1" class="d" x="930" y="525" font-size="80" text-anchor="middle" style="fill:var(--muted)">+</text>
<g id="tv1">
<path class="s-ink" d="M1130 300l40 50 40-50" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="1020" y="350" width="300" height="230" rx="18" fill="var(--stage)" stroke-width="7"/>
<rect class="gain" x="1044" y="374" width="252" height="182" rx="8"/>
<text class="d" x="1170" y="485" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">BUY IT!</text>
<g id="waves"></g>
<text class="m" x="1170" y="660" font-size="22" text-anchor="middle">LOTS OF TV ADS</text>
</g>
<g id="eq1"><text class="d" x="120" y="790" font-size="48">Average product + lots of TV ads.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The TV-industrial complex.</text>
<text class="b" x="120" y="176" font-size="32">Seth Godin’s name for the old money machine.</text>
<ellipse id="loopE" class="s-gain" cx="800" cy="520" rx="350" ry="225" fill="none" stroke-width="5" stroke-dasharray="12 12"/>
<g id="chev"></g>
<circle id="orb" class="gain" r="14"/>
<g id="nodes"></g>
<g id="cash"></g>
<g id="worked"><text class="m" x="800" y="640" font-size="24" text-anchor="middle" style="fill:var(--gain)">ROUND AND ROUND</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it worked back then.</text>
<text class="b" x="120" y="176" font-size="32">Few channels, few choices, and attention you could buy.</text>
<g id="fam">
<rect class="s-ink" x="150" y="320" width="220" height="160" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="170" y="340" width="180" height="120" rx="6"/>
<path class="s-ink" d="M230 480l-16 30M290 480l16 30" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="260" y="550" font-size="20" text-anchor="middle">A FEW CHANNELS</text>
<rect x="440" y="500" width="310" height="80" rx="20" fill="var(--line)"/>
<g id="famp"></g>
<rect class="s-ink" x="420" y="550" width="350" height="56" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="410" y="530" width="30" height="100" rx="12"/><rect class="ink" x="750" y="530" width="30" height="100" rx="12"/>
<text class="m" x="595" y="670" font-size="20" text-anchor="middle">EVERY EVENING</text>
</g>
<g id="help"><rect class="gain" x="150" y="220" width="280" height="64" rx="32"/><path class="gain" d="M240 282l20 26 20-26z"/><text class="m" x="290" y="260" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">TRY THIS ONE</text></g>
<g id="shelf3">
<path class="s-ink" d="M880 420h560M880 600h560M880 250v370M1440 250v370" fill="none" stroke-width="6" stroke-linecap="round"/>
<rect x="940" y="330" width="70" height="90" rx="6" fill="var(--muted)" fill-opacity=".5"/>
<rect class="gain" x="1060" y="300" width="110" height="120" rx="8"/>
<text class="m" x="1115" y="368" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">BRAND</text>
<rect x="1220" y="330" width="70" height="90" rx="6" fill="var(--muted)" fill-opacity=".5"/>
<rect x="1000" y="510" width="70" height="90" rx="6" fill="var(--muted)" fill-opacity=".5"/>
<rect x="1250" y="510" width="70" height="90" rx="6" fill="var(--muted)" fill-opacity=".5"/>
<text class="m" x="1160" y="660" font-size="22" text-anchor="middle">FEWER CHOICES</text>
</g>
<g id="pay">
<circle class="gain" cx="160" cy="770" r="36"/><text class="d" x="160" y="786" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">$</text>
<path class="s-muted" d="M214 770h70m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-ink" d="M310 770q50-44 100 0q-50 44-100 0z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="360" cy="770" r="14"/>
<text class="d" x="450" y="788" font-size="48">Pay for ads, get noticed.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then choices exploded.</text>
<text class="b" x="120" y="176" font-size="32">Packed aisles, less time, and no urgent need.</text>
<g id="aisle"></g>
<g id="clk">
<circle class="s-ink" cx="1240" cy="340" r="100" fill="var(--stage)" stroke-width="8"/>
<path id="hrH" class="s-ink" d="M1240 340v-50" stroke-width="8" stroke-linecap="round"/>
<path id="mnH" class="s-loss" d="M1240 340v-80" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="1240" cy="340" r="9"/>
<text class="m" x="1240" y="490" font-size="22" text-anchor="middle">LESS TIME AND ATTENTION</text>
</g>
<g id="own"><text class="m" x="1245" y="660" font-size="22" text-anchor="middle">WHAT WE OWN WORKS FINE</text></g>
<g id="filt"><path class="s-gain" d="M130 710h140l-50 60v50l-40 20v-70z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="d" x="310" y="790" font-size="48">Shoppers now filter things out.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone tunes out.</text>
<text class="b" x="120" y="176" font-size="32">Ads arrive from every direction, all day long.</text>
<g id="ads5"></g>
<g id="me5"><circle class="ink" cx="800" cy="450" r="56"/><path class="ink" d="M700 640v-20a100 100 0 0 1 200 0v20z"/></g>
<g id="muff"><path class="s-gain" d="M736 450a64 64 0 0 1 128 0" fill="none" stroke-width="12"/><circle class="gain" cx="740" cy="455" r="26"/><circle class="gain" cx="860" cy="455" r="26"/></g>
<g id="chips5"></g>
<g id="surv"><text class="d" x="120" y="846" font-size="40">Ignoring ads is how people survive the flood.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Shouting gets pricey.</text>
<text class="b" x="120" y="176" font-size="32">Ads cost more, and each dollar buys less attention.</text>
<g id="tag6">
<g id="tagS"><path class="loss" d="M-130-80h180l80 80-80 80h-180z"/><circle cx="50" cy="0" r="14" fill="var(--stage)"/><text id="tagT" class="d" x="-40" y="22" font-size="64" text-anchor="middle" style="fill:var(--stage)">$</text></g>
<text class="m" x="400" y="690" font-size="22" text-anchor="middle">COST OF REACHING PEOPLE</text>
</g>
<g id="crwd"><g id="crowd6"></g><text class="m" x="1120" y="690" font-size="22" text-anchor="middle">ATTENTION PER AD DOLLAR</text></g>
<g id="nobuy"><text class="d" x="120" y="800" font-size="48">You can no longer buy your way into minds.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old machine has snapped.</text>
<text class="b" x="120" y="176" font-size="32">Ads can no longer carry an ordinary product.</text>
<text class="m" x="380" y="270" font-size="20" text-anchor="middle">THE OLD LOOP</text>
<path id="loop7" class="s-gain" fill="none" stroke-width="7" stroke-dasharray="14 10" stroke-linecap="round"/>
