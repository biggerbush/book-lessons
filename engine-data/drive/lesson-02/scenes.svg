<g id="s0">
<text class="m" x="120" y="150" font-size="28">DRIVE · LESSON 2</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Upgrading our</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">motivation</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">operating system.</text>
<text class="b" x="120" y="650" font-size="32">Why carrots and sticks are outdated software for modern work</text>
