<g id="md2"><circle class="gain" cx="920" cy="740" r="22"/><text class="m" x="920" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEXT STEP</text></g>
<g id="eff"><text class="d5" x="120" y="720" font-size="36">No longer feels like effort.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Identity follows action.</text>
<text class="b" x="120" y="176" font-size="32">Over time, you stop imitating your future self.</text>
