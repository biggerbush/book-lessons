<g id="shr"><g id="cyc"><circle class="s-muted" cx="1120" cy="450" r="200" fill="none" stroke-width="4" stroke-dasharray="14 12"/><path class="gain" d="M1110 234l28 16-28 16z"/></g>
<path class="ink" d="M990 385L1120 325L1250 385z"/><rect class="s-ink" x="1030" y="385" width="180" height="175" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1095" y="470" width="50" height="90"/><rect class="ink" x="990" y="560" width="260" height="18" rx="4"/>
<text id="yr" class="m" x="1120" y="700" font-size="20" text-anchor="middle">ISE GRAND SHRINE · REBUILT EVERY 20 YEARS</text></g>
<g id="nl"><text class="d" x="120" y="790" font-size="46">Nothing lasts, so nothing has to be perfect.</text></g>
<g id="ub"><text class="d5" x="120" y="846" font-size="34" style="fill:var(--gain)">Your life can be unfinished and still beautiful.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">This moment, once.</text>
<text class="b" x="120" y="176" font-size="32">Ichi-go ichi-e: this moment will happen only once.</text>
<path class="s-line" d="M120 300h1360" stroke-width="4"/>
<g id="dots"></g>
