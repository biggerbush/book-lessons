<g id="s0">
<text class="m" x="120" y="150" font-size="28">AWAKEN THE GIANT WITHIN · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Change your words,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">change your feelings.</text>
<text class="b" x="120" y="600" font-size="32">The labels you give feelings can turn them up or down.</text>
<g id="host"></g>
<g id="tbub"><rect class="s-ink" x="1170" y="250" width="300" height="140" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1278 388l18 44 14-44" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><g id="tbars"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The tense meeting.</text>
<text class="b" x="120" y="176" font-size="32">Same bad news. Two very different reactions.</text>
<g id="mt"><g id="ppl"></g>
<rect class="ink" x="260" y="600" width="1080" height="26" rx="6"/>
<path class="s-ink" d="M320 626v90M1280 626v90" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="740" y="240" width="120" height="150" rx="8" fill="var(--stage)" stroke-width="5"/>
<path class="s-loss" d="M766 280h68M766 310h68M766 340h40" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="800" y="422" font-size="18" text-anchor="middle">BAD NEWS</text>
<text class="m" x="500" y="700" font-size="22" text-anchor="middle">ROBBINS</text>
<text class="m" x="1100" y="700" font-size="22" text-anchor="middle">COLLEAGUE</text></g>
<g id="rf"><rect class="s-loss" x="340" y="215" width="320" height="100" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-loss" d="M482 313l18 40 14-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="500" y="285" font-size="56" text-anchor="middle" style="fill:var(--loss)">FURIOUS!</text>
<polyline id="ecg1" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="500" y="850" font-size="20" text-anchor="middle" style="fill:var(--loss)">HEART POUNDING</text></g>
<g id="cb"><rect class="s-ink" x="940" y="215" width="320" height="100" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1082 313l18 40 14-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1100" y="273" font-size="22" text-anchor="middle">A MUCH MILDER WORD</text></g>
<g id="calm"><polyline id="ecg2" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1100" y="850" font-size="20" text-anchor="middle" style="fill:var(--gain)">NOTICEABLY CALMER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Words are volume knobs.</text>
<text class="b" x="120" y="176" font-size="32">A word doesn’t just describe a feeling. It sets its size.</text>
<g id="tag"><path class="s-ink" d="M120 230h380l40 35-40 35H120z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><circle class="s-ink" cx="500" cy="265" r="7" fill="none" stroke-width="4"/><text id="tagt" class="m" x="144" y="273" font-size="22" style="fill:var(--ink)">HOW DO YOU FEEL?</text></g>
<g id="kn"><g id="ticks"></g><circle class="s-ink" cx="330" cy="550" r="140" fill="var(--stage)" stroke-width="8"/>
<g id="ptr"><path class="s-ink" d="M330 550V430" stroke-width="12" stroke-linecap="round"/></g><circle class="ink" cx="330" cy="550" r="16"/>
<text class="m" x="190" y="770" font-size="20" text-anchor="middle">SOFT</text><text class="m" x="470" y="770" font-size="20" text-anchor="middle">LOUD</text>
<path class="s-muted" d="M560 550h200m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="feel" cx="1100" cy="520" r="130" fill="var(--loss)" fill-opacity=".25" stroke="var(--loss)" stroke-width="6"/>
<text class="m" x="1100" y="820" font-size="22" text-anchor="middle">THE FEELING</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your habit words.</text>
<text class="b" x="120" y="176" font-size="32">Dramatic go-to words turn small setbacks into storms.</text>
<g id="bubs"></g>
<g id="same3"><text class="m" x="120" y="620" font-size="20">THE SAME FEW WORDS, AGAIN AND AGAIN</text></g>
<g id="storm"><g id="rain"></g><circle class="loss" cx="1060" cy="390" r="70"/><circle class="loss" cx="1160" cy="340" r="95"/><circle class="loss" cx="1260" cy="390" r="70"/><rect class="loss" x="1060" y="390" width="200" height="70"/><path id="bolt" class="gain" stroke="var(--gain)" stroke-width="4" stroke-linejoin="round" d="M1170 420l-34 70h30l-20 70 60-92h-32l22-48z"/></g>
<g id="sb"><ellipse cx="1160" cy="690" rx="44" ry="18" fill="var(--muted)"/><text class="m" x="1160" y="745" font-size="20" text-anchor="middle">ORDINARY SETBACK</text></g>
<g id="w3"><text class="d" x="120" y="820" font-size="44">Your vocabulary sets your emotional weather.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Turn the negative down.</text>
<text class="b" x="120" y="176" font-size="32">Swap intense negative words for softer ones.</text>
<g id="fd4"></g>
<g id="r1"><rect class="s-ink" x="130" y="315" width="130" height="62" rx="10" fill="none" stroke-width="5"/><rect class="ink" x="262" y="333" width="12" height="26" rx="3"/><rect id="batf" x="140" y="325" height="42" rx="4"/><text class="d5" x="320" y="362" font-size="48" fill-opacity=".55">Exhausted</text></g>
<line id="sk1" class="s-ink" x1="314" y1="346" x2="314" y2="346" stroke-width="5" stroke-linecap="round"/>
<g id="n1"><path class="s-muted" d="M600 346h80m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="720" y="362" font-size="48" style="fill:var(--gain)">Recharging</text></g>
<g id="r2"><circle id="face" cx="190" cy="540" r="60"/><circle cx="170" cy="525" r="6" fill="var(--stage)"/><circle cx="210" cy="525" r="6" fill="var(--stage)"/><path id="mouth" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/><text class="d5" x="320" y="562" font-size="48" fill-opacity=".55">Furious</text></g>
<line id="sk2" class="s-ink" x1="314" y1="546" x2="314" y2="546" stroke-width="5" stroke-linecap="round"/>
<g id="n2"><path class="s-muted" d="M600 546h80m-20-20 20 20-20 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="720" y="562" font-size="48" style="fill:var(--gain)">A bit annoyed</text></g>
<g id="mild"><text class="d" x="120" y="800" font-size="46">So mild it breaks the pattern.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Turn the good up.</text>
<text class="b" x="120" y="176" font-size="32">The same trick works in reverse for good feelings.</text>
<g id="fd5"></g>
<g id="ask"><rect class="s-ink" x="120" y="220" width="380" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d5" x="310" y="278" font-size="40" text-anchor="middle">How are you?</text></g>
<path class="s-line" d="M140 720h1060" stroke-width="4" stroke-linecap="round"/>
<g id="bars"></g>
<g id="big5"><text class="d" x="120" y="840" font-size="44">Bigger words make good moments feel bigger.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same event. Different label.</text>
<text class="b" x="120" y="176" font-size="32">Words trigger the meaning we attach to an experience.</text>
<g id="brain"><path class="s-ink" d="M240 300c-44 0-66 30-54 56-22 16-10 50 22 50h64c32 0 44-34 22-50 12-26-10-56-54-56z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-ink" d="M240 306v96M240 340c-20 0-26 14-26 24M240 340c20 0 26 14 26 24" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="ev"><rect id="evr" x="120" y="440" width="240" height="100" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="d" x="240" y="504" font-size="40" text-anchor="middle">Event</text></g>
<g id="pth"><path d="M360 470C420 470 420 330 480 330" fill="none" stroke="var(--loss)" stroke-width="5"/><path d="M360 510C420 510 420 650 480 650" fill="none" stroke="var(--gain)" stroke-width="5"/></g>
<g id="rows"></g>
<g id="same6"><text class="m" x="120" y="580" font-size="18">EVENT STAYS THE SAME</text></g>
<g id="loud"><text class="d" x="120" y="800" font-size="46">You choose how loudly it speaks.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Three swaps, one strong word, said out loud.</text>
<g id="nb"><rect class="s-ink" x="120" y="240" width="680" height="380" rx="14" fill="var(--stage)" stroke-width="5"/><g id="spiral"></g><text class="m" x="170" y="310" font-size="20">MY MOST-USED WORDS</text><g id="nbL"></g></g>
<g id="nbR"></g>
<g id="stk"><g transform="rotate(3 1160 410)"><rect class="gain" x="960" y="260" width="400" height="300" rx="6"/><text class="m" x="1160" y="330" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">MY STRONG WORD</text><text class="d" x="1160" y="440" font-size="54" text-anchor="middle" style="fill:var(--on-gain)">Fantastic!</text></g><text class="m" x="960" y="624" font-size="20">USE IT WHENEVER YOU FEEL GOOD</text></g>
<g id="aloud"><g id="spk"></g><g id="wv"></g><text class="d" x="320" y="762" font-size="40">Catch yourself. Make the swap out loud.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What’s one word</text></g>
<g id="qb"><text class="d" x="136" y="395" font-size="80" letter-spacing="-2">you’ll retire</text><text class="d" x="136" y="490" font-size="80" letter-spacing="-2">this week?</text></g>
<g id="qc"><text class="d5" x="140" y="600" font-size="44">And what <tspan style="fill:var(--gain)">gentler</tspan> word</text><text class="d5" x="140" y="656" font-size="44">will take its place?</text></g>
<text class="m" x="143" y="760" font-size="26">RETIRE ONE WORD THIS WEEK</text>
<g id="slot"><rect class="s-muted" x="940" y="470" width="480" height="120" rx="60" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="1180" y="640" font-size="20" text-anchor="middle">THIS WEEK’S WORD</text></g>
<g id="rlab"><text class="m" x="1180" y="226" font-size="20" text-anchor="middle" style="fill:var(--loss)">RETIRED</text></g>
<g id="otag"><rect x="960" y="480" width="440" height="100" rx="50" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="d" x="1180" y="548" font-size="52" text-anchor="middle" style="fill:var(--loss)">Furious</text><line id="ostk" class="s-ink" x1="1080" y1="532" x2="1080" y2="532" stroke-width="6" stroke-linecap="round"/></g>
<g id="ntag"><rect class="gain" x="960" y="480" width="440" height="100" rx="50"/><text class="d" x="1180" y="546" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">A bit annoyed</text></g>
</g>