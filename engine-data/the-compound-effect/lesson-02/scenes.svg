<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The blame game.</text>
<text class="b" x="120" y="176" font-size="32">It is easy to point at everything else.</text>
<g id="bc0"><rect class="s-line" x="120" y="240" width="380" height="210" rx="18" fill="var(--stage)" stroke-width="3"/><g id="cars"></g><text class="m" x="310" y="428" font-size="20" text-anchor="middle">TRAFFIC</text></g>
<g id="bc1"><rect class="s-line" x="610" y="240" width="380" height="210" rx="18" fill="var(--stage)" stroke-width="3"/><polyline class="s-loss" points="650,290 720,330 780,310 860,370 950,390" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="800" y="428" font-size="20" text-anchor="middle">THE ECONOMY</text></g>
