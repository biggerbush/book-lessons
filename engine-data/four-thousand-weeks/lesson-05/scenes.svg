<g id="never"><text class="d" x="120" y="800" font-size="50">Always promised. Never tasted.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Even rest gets put to work.</text>
<text class="b" x="120" y="176" font-size="32">Naps and holidays turned into fuel for productivity.</text>
