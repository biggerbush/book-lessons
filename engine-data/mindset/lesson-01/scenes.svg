<rect x="1100" y="300" width="140" height="250" rx="22" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<g id="ph"></g>
<g id="bb"><path d="M1272 362l-26 16 26 6" fill="var(--stage)" stroke="var(--gain)" stroke-width="4" stroke-linejoin="round"/><rect x="1270" y="320" width="180" height="80" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><text class="d" x="1360" y="371" font-size="30" text-anchor="middle">Bad day?</text></g>
<text class="d5" x="1090" y="645" font-size="30">Just a bad day?</text>
</g>
<g id="same"><text class="d" x="120" y="800" font-size="48">Same events. Two completely different worlds.</text></g>
</g>

<g id="s8" opacity="0">
<g id="lead"><text class="m" x="143" y="260" font-size="24">NEXT TIME SOMETHING GOES WRONG,</text><text class="m" x="143" y="300" font-size="24">NOTICE THE STORY YOU TELL YOURSELF.</text></g>
