<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 6</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Anticipate trouble,</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">then embrace</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">what happens.</text>
<text class="b" x="120" y="620" font-size="32">Expect the worst, then welcome whatever actually happens.</text>
<g id="cloud"><circle class="loss" cx="1250" cy="330" r="60"/><circle class="loss" cx="1330" cy="290" r="80"/><circle class="loss" cx="1410" cy="330" r="60"/><rect class="loss" x="1250" y="320" width="160" height="70"/></g>
<g id="rain0"></g>
<path class="s-line" d="M1180 800h300" stroke-width="5" stroke-linecap="round"/>
<g id="per0"></g>
<g id="umb"><path class="gain" d="M1230 600a100 70 0 0 1 200 0z"/><path class="s-ink" d="M1330 600v72" stroke-width="6" fill="none" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The third discipline: will.</text>
<g id="s1sub"><text class="b" x="120" y="176" font-size="32">The inner strength that holds when perception and action are not enough.</text></g>
<g id="cit">
<rect class="s-ink" x="180" y="470" width="440" height="290" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="ink" d="M180 430h40v40h-40zM280 430h40v40h-40zM480 430h40v40h-40zM580 430h40v40h-40z"/>
<rect class="gain" x="340" y="280" width="120" height="190"/>
<path class="gain" d="M340 250h40v30h-40zM420 250h40v30h-40z"/>
<rect x="385" y="330" width="30" height="50" rx="4" fill="var(--stage)"/>
<path class="ink" d="M360 760v-80a40 40 0 0 1 80 0v80z"/>
</g>
<g id="tri"><text class="m" x="120" y="830" font-size="22">PERCEPTION · ACTION · <tspan style="fill:var(--gain)">WILL</tspan></text></g>
<path id="wl" class="s-gain" d="M620 520C700 520 700 370 780 370M620 520C700 520 700 660 780 660" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="w0"><rect class="s-line" x="780" y="250" width="700" height="240" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="820" y="310" font-size="22">BEFORE IT COMES</text><text class="d" x="820" y="400" font-size="56">Prepare</text>
<text class="b" x="820" y="452" font-size="28">Expect trouble in advance.</text>
<path class="gain" d="M1360 300l70 24v50c0 50-35 80-70 96c-35-16-70-46-70-96v-50z"/></g>
<g id="w1"><rect class="s-line" x="780" y="540" width="700" height="240" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="820" y="600" font-size="22">ONCE IT ARRIVES</text><text class="d" x="820" y="690" font-size="56">Accept</text>
<text class="b" x="820" y="742" font-size="28">Stop fighting what is real.</text>
<circle class="gain" cx="1360" cy="620" r="18"/><path class="s-gain" d="M1290 650q70 110 140 0" fill="none" stroke-width="10" stroke-linecap="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Seneca rehearsed disaster.</text>
<text class="b" x="120" y="176" font-size="32">Picture what could go wrong, before it happens.</text>
<g id="sen"><text class="m" x="260" y="810" font-size="22" text-anchor="middle">SENECA</text></g>
<g id="bub"><circle class="s-line" cx="350" cy="470" r="12" fill="var(--stage)" stroke-width="4"/><circle class="s-line" cx="405" cy="420" r="20" fill="var(--stage)" stroke-width="4"/><ellipse class="s-line" cx="800" cy="400" rx="320" ry="170" fill="var(--stage)" stroke-width="4"/></g>
<g id="storm">
<circle class="loss" cx="620" cy="310" r="30"/><circle class="loss" cx="660" cy="295" r="36"/><circle class="loss" cx="700" cy="310" r="30"/>
<path class="loss" d="M960 285l-30 60h24l-20 60 50-80h-26l20-40z"/>
<g id="ship"><path class="s-ink" d="M800 450v-130" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M808 335l70 100h-70z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="ink" d="M690 450h220l-30 50h-160z"/></g>
<path id="wv2" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="800" y="620" font-size="20" text-anchor="middle">STORMS · DELAYS · PLANS FALLING APART</text>
</g>
<g id="reh"><text class="d" x="480" y="740" font-size="52">Not gloom. <tspan style="fill:var(--gain)">Rehearsal.</tspan></text></g>
<g id="shd"><path class="gain" d="M1330 330l90 30v70c0 70-45 110-90 130c-45-20-90-60-90-130v-70z"/>
<path d="M1290 440l30 30 55-60" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="loss" d="M1440 220l-40 70h30l-30 60 70-90h-30l30-40z"/>
<text class="m" x="1330" y="620" font-size="20" text-anchor="middle">NOT CAUGHT OFF GUARD</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The premortem.</text>
<text class="b" x="120" y="176" font-size="32">Imagine the project has already failed. Then ask why.</text>
<g id="tbl"><ellipse class="s-ink" cx="560" cy="500" rx="300" ry="140" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="480" y="430" width="160" height="140" rx="8" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M505 470h110M505 500h110M505 530h70" stroke-width="6" stroke-linecap="round"/></g>
<g id="team"></g>
<g id="stamp" opacity="0"><g transform="rotate(-12 560 500)"><rect x="420" y="465" width="280" height="76" rx="8" fill="var(--stage)" stroke="var(--loss)" stroke-width="7"/><text class="d" x="560" y="520" font-size="48" text-anchor="middle" style="fill:var(--loss)">FAILED</text></g></g>
<g id="pmh"><text class="m" x="1000" y="300" font-size="22">THEN ASK: WHAT WENT WRONG?</text></g>
<g id="pmrows"></g>
<g id="pm"><text class="d" x="120" y="820" font-size="44">Find the weak spots before they find you.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Accept what comes.</text>
<g id="s4sub"><text class="b" x="120" y="176" font-size="32">Not giving up, but no longer fighting what is already real.</text></g>
<g id="rain4"></g>
<path class="s-line" d="M160 720h600" stroke-width="5" stroke-linecap="round"/>
<g id="calm"></g>
<g id="hands"><path class="s-gain" d="M415 690L345 632M505 690L575 632" stroke-width="10" stroke-linecap="round"/><path class="s-gain" d="M315 625q30 26 60 0M545 625q30 26 60 0" fill="none" stroke-width="8" stroke-linecap="round"/></g>
<g id="bat"><text class="m" x="960" y="330" font-size="22">ANGER AT THE UNCHANGEABLE</text>
<rect class="s-ink" x="960" y="370" width="400" height="180" rx="20" fill="none" stroke-width="8"/><rect class="ink" x="1360" y="425" width="30" height="70" rx="6"/>
<rect id="batf" x="980" y="390" width="360" height="140" rx="10"/>
<text class="m" x="960" y="610" font-size="22">DRAINS THE ENERGY YOU NEED</text><text class="m" x="960" y="644" font-size="22">FOR THE NEXT STEP</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Edison’s fire, 1914.</text>
<text class="b" x="120" y="176" font-size="32">His research and factory complex in New Jersey burned.</text>
<g id="smk"></g>
<g id="lab"><path class="s-ink" d="M200 760V500l90-50v50l90-50v50l90-50v50l90-50v50l90-50v310z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<rect class="ink" x="660" y="420" width="50" height="340"/><g id="win"></g><g id="wfl"></g>
<text class="m" x="200" y="810" font-size="22">1914 · NEW JERSEY</text></g>
<g id="fl"></g>
<g id="ed"><text class="m" x="950" y="730" font-size="20" text-anchor="middle">EDISON, 67</text><text class="m" x="1100" y="730" font-size="20" text-anchor="middle">HIS SON</text></g>
<g id="bub5"><path class="s-ink" d="M930 436l20 56 30-56" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<rect class="s-ink" x="860" y="250" width="600" height="190" rx="20" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="890" y="305" font-size="30">Fetch your mother.</text><text class="d5" x="890" y="350" font-size="30">We’ll never see a fire</text><text class="d5" x="890" y="395" font-size="30">like this again.</text></g>
<g id="br"></g>
<g id="btw"><text class="m" x="1320" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">BACK TO WORK</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Love your fate.</text>
<g id="s6sub"><text class="b" x="120" y="176" font-size="32">Treat whatever happens as something to use.</text></g>
<g id="af"><text class="d" x="120" y="380" font-size="110" style="fill:var(--gain)">amor fati</text><text class="m" x="124" y="440" font-size="24">LATIN · LOVE OF FATE</text></g>
<g id="use"><text class="d5" x="120" y="560" font-size="40">Use whatever happens.</text><text class="d5" x="120" y="620" font-size="40">Even be cheerful about it.</text></g>
<g id="fire"><g id="flm"></g><path class="s-ink" d="M920 710L1280 650M920 650L1280 710" stroke-width="22" stroke-linecap="round"/></g>
<g id="obs"></g>
<g id="mq"><text class="m" x="1100" y="766" font-size="20" text-anchor="middle" style="fill:var(--gain)">MARCUS AURELIUS</text><text class="m" x="1100" y="800" font-size="20" text-anchor="middle">THE FIRE TURNS ALL IT IS GIVEN INTO FLAME</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Put it to work.</text>
<text class="b" x="120" y="176" font-size="32">Before your next big task, try this.</text>
<g id="nb"><rect class="s-ink" x="160" y="230" width="820" height="580" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g>
<text class="m" x="240" y="300" font-size="22" style="fill:var(--loss)">COULD GO WRONG</text><text class="m" x="630" y="300" font-size="22" style="fill:var(--gain)">MY RESPONSE</text>
<path class="s-line" d="M600 330v440" stroke-width="3"/><g id="nrows"></g></g>
<g id="sm"><g id="face"><circle class="gain" cx="1260" cy="400" r="120"/><circle cx="1220" cy="370" r="12" fill="var(--on-gain)"/><circle cx="1300" cy="370" r="12" fill="var(--on-gain)"/>
<path d="M1200 430q60 60 120 0" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round"/></g></g>
<g id="good"><text class="d" x="1060" y="640" font-size="72" style="fill:var(--gain)">Good.</text><text class="d5" x="1060" y="700" font-size="34">This is material</text><text class="d5" x="1060" y="746" font-size="34">I can use.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="72" letter-spacing="-2">What setback could</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="72" letter-spacing="-2">you stop resisting</text></g>
<g id="qc"><text class="d" x="136" y="480" font-size="72" letter-spacing="-2">today, and start</text></g>
<g id="qd"><text class="d" x="136" y="570" font-size="72" letter-spacing="-2">treating as <tspan style="fill:var(--gain)">fuel?</tspan></text></g>
<text class="m" x="143" y="680" font-size="26">THE OBSTACLE IS THE WAY</text>
<g id="mir">
