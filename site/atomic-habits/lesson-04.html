<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atomic Habits Lesson Four</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage that plays five scenes, with a transport bar beneath it. */
:root{
  --bg:#E9EEF2; --stage:#F6F8FA; --ink:#12233A; --muted:#5C6B7E; --line:#C5CFD9;
  --gain:#C97F00; --loss:#5562C4; --ice:#BFDDF0; --on-gain:#12233A;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1524; --stage:#101E33; --ink:#EAF0F7; --muted:#93A3B8; --line:#2A3B55;
  --gain:#FFC233; --loss:#9AA5FF; --ice:#3E6E92; --on-gain:#101E33; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:14px}
@keyframes wmmove{0%{transform:translate(0,0)}25%{transform:translate(-1330px,0)}50%{transform:translate(-1330px,-812px)}75%{transform:translate(0,-812px)}}
.wmc{animation:wmmove 80s step-end infinite}
@media (prefers-reduced-motion:reduce){.wmc{animation:none}}
#stageBox{background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
#stageBox:fullscreen{border:0;border-radius:0;aspect-ratio:auto;display:flex;align-items:center}
svg{display:block;width:100%;height:100%}
.d{font-family:var(--display);font-weight:800;fill:var(--ink)}
.d5{font-family:var(--display);font-weight:500;fill:var(--ink)}
.b{font-family:var(--body);fill:var(--muted)}
.m{font-family:var(--mono);fill:var(--muted);letter-spacing:.04em}
.ink{fill:var(--ink)} .gain{fill:var(--gain)} .loss{fill:var(--loss)}
.s-ink{stroke:var(--ink)} .s-line{stroke:var(--line)} .s-gain{stroke:var(--gain)} .s-loss{stroke:var(--loss)} .s-muted{stroke:var(--muted)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
button{font:600 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
#play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:86px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--gain)}
#clock{font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font-weight:400;font-size:13px;padding:6px 10px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;max-width:65ch;margin:4px 0 0}
</style>

<div class="wrap">
  <div id="stageBox">
    <svg viewBox="0 0 1600 900" role="img" aria-label="Animated summary of the fourth lesson of Atomic Habits: you cannot change a habit you do not notice. Six scenes.">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.6" fill="var(--line)"/></pattern>
      </defs>
      <rect width="1600" height="900" fill="var(--stage)"/>
      <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>

      <!-- 1 Title -->
      <g id="s0">
        <text class="m" x="120" y="150" font-size="28">ATOMIC HABITS · CHAPTER 4</text>
        <text class="d" x="116" y="400" font-size="88" letter-spacing="-2">You can’t change</text>
        <text class="d" x="116" y="500" font-size="88" letter-spacing="-2">what you can’t see.</text>
        <text class="b" x="120" y="600" font-size="32">Lesson four: before you change a habit, you have to notice it. Press Play for sound.</text>
        <g id="eye" transform="translate(1300 420)">
          <clipPath id="eyeClip"><path d="M-180 0Q0-150 180 0Q0 150-180 0z"/></clipPath>
          <g clip-path="url(#eyeClip)">
            <g id="iris"><circle class="gain" r="66"/><circle class="ink" r="28"/><circle r="9" cx="12" cy="-12" fill="var(--stage)"/></g>
          </g>
          <path id="lid" class="s-ink" d="M-180 0Q0-150 180 0Q0 150-180 0z" fill="none" stroke-width="7" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- 2 The paramedic -->
      <g id="s1" opacity="0">
        <text class="d" x="120" y="124" font-size="68">She saw it before he felt it.</text>
        <text class="b" x="120" y="176" font-size="32">A former paramedic at a family gathering.</text>
        <g id="bubble">
          <rect class="s-ink" x="120" y="236" width="700" height="112" rx="26" fill="var(--stage)" stroke-width="5"/>
          <path class="s-ink" d="M210 346v44l46-44" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
          <rect x="213" y="340" width="40" height="8" fill="var(--stage)"/>
          <text class="d5" x="152" y="306" font-size="42">“I don’t like the way you look.”</text>
        </g>
        <g>
          <circle class="gain" cx="240" cy="480" r="42"/>
          <path class="gain" d="M160 700v-90a80 80 0 0 1 160 0v90z"/>
          <text class="m" x="240" y="740" font-size="22" text-anchor="middle">PARAMEDIC</text>
        </g>
        <g>
          <circle class="ink" cx="520" cy="480" r="42"/>
          <path class="ink" d="M440 700v-90a80 80 0 0 1 160 0v90z"/>
          <text class="m" x="520" y="740" font-size="22" text-anchor="middle">FATHER-IN-LAW</text>
        </g>
        <g id="fine"><text class="d5" x="640" y="560" font-size="36">Feels fine.</text></g>
        <text class="m" x="940" y="270" font-size="24">HEART</text>
        <path class="s-line" d="M940 340h540" fill="none" stroke-width="3"/>
        <polyline id="ecg" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(1210 560) scale(1.25)">
          <path class="s-ink" d="M0 90C-110 10-120-70-55-85C-25-92-5-70 0-55C5-70 25-92 55-85C120-70 110 10 0 90Z" fill="none" stroke-width="5" stroke-linejoin="round"/>
          <path id="artery" class="s-gain" d="M-30-45Q0 0 35 45" fill="none" stroke-width="9" stroke-linecap="round"/>
          <circle id="block" class="loss" cx="3" cy="2" r="15" opacity="0"/>
        </g>
        <g id="blockLbl"><rect class="loss" x="1330" y="606" width="34" height="8"/><text class="m" x="1330" y="650" font-size="24">MAJOR BLOCKAGE</text></g>
        <g id="practice"><text class="d" x="120" y="830" font-size="52">Practice taught her brain to read the cue.</text></g>
      </g>

      <!-- 3 Autopilot -->
      <g id="s2" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Your brain runs the cue for you.</text>
        <text class="b" x="120" y="176" font-size="32">The more you repeat a habit, the less you notice it.</text>
        <text class="m" x="120" y="270" font-size="24">HOW MUCH YOU NOTICE</text>
        <g id="bars"></g>
        <path class="s-line" d="M120 720h1360" fill="none" stroke-width="3"/>
        <text class="m" x="120" y="760" font-size="24">FIRST TIME</text>
        <text class="m" x="1480" y="760" font-size="24" text-anchor="end">HUNDREDTH TIME</text>
        <g id="pow"><text class="d" x="120" y="850" font-size="60">Powerful,</text></g>
        <g id="invis"><text class="d5" x="420" y="850" font-size="60" fill-opacity=".3">and invisible.</text></g>
      </g>

      <!-- 4 Pointing and calling -->
      <g id="s3" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Point at it. Say it out loud.</text>
        <text class="b" x="120" y="176" font-size="32">Train operators in Japan call this pointing-and-calling.</text>
        <rect class="ink" x="290" y="440" width="20" height="300"/>
        <rect class="ink" x="230" y="250" width="140" height="230" rx="70"/>
        <circle id="lampG" cx="300" cy="318" r="38" fill="var(--stage)"/>
        <circle cx="300" cy="412" r="38" fill="var(--muted)" fill-opacity=".45"/>
        <g id="op"><circle class="ink" cx="900" cy="540" r="42"/><path class="ink" d="M820 770v-90a80 80 0 0 1 160 0v90z"/>
        <text class="m" x="900" y="810" font-size="22" text-anchor="middle">OPERATOR</text></g>
        <g id="arm">
          <path class="s-ink" d="M850 650L600 470" fill="none" stroke-width="30" stroke-linecap="round"/>
          <path class="s-ink" d="M600 470L430 340" fill="none" stroke-width="16" stroke-linecap="round"/>
        </g>
        <g id="call">
          <rect class="s-ink" x="520" y="236" width="400" height="96" rx="24" fill="var(--stage)" stroke-width="5"/>
          <text class="d5" x="550" y="298" font-size="42">“Signal is green!”</text>
        </g>
        <text class="m" x="1040" y="290" font-size="24">MISTAKES</text>
        <text class="m" x="1040" y="350" font-size="22">JUST LOOKING</text>
        <rect class="s-line" x="1040" y="366" width="440" height="56" fill="var(--line)"/>
        <text class="m" x="1040" y="480" font-size="22">POINTING AND CALLING</text>
        <rect class="s-line" x="1040" y="496" width="440" height="56" fill="none" stroke-width="3" stroke-dasharray="6 8"/>
        <rect id="pcBar" class="gain" x="1040" y="496" width="440" height="56"/>
        <g id="pct"><text id="pctNum" class="d" x="1034" y="730" font-size="150" letter-spacing="-4">−85%</text>
        <text class="m" x="1040" y="790" font-size="22">UP TO 85% FEWER MISTAKES</text></g>
        <g id="silly"><text class="d5" x="120" y="830" font-size="40" fill-opacity=".6">It sounds silly. It works.</text></g>
      </g>

      <!-- 5 Scorecard -->
      <g id="s4" opacity="0">
        <text class="d" x="120" y="124" font-size="68">Keep a Habits Scorecard.</text>
        <text class="b" x="120" y="176" font-size="32">List your normal day. Mark every habit.</text>
        <rect class="s-line" x="120" y="230" width="760" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
        <text class="m" x="160" y="280" font-size="22">MY DAY</text>
        <text class="m" x="840" y="280" font-size="22" text-anchor="end">MARK</text>
        <g id="rows"></g>
        <g id="test">
          <text class="m" x="1000" y="330" font-size="24">THE ONLY TEST</text>
          <text class="d" x="1000" y="410" font-size="50">Does this help</text>
          <text class="d" x="1000" y="472" font-size="50">me become the</text>
          <text class="d" x="1000" y="534" font-size="50">person I want</text>
          <text class="d" x="1000" y="596" font-size="50">to be?</text>
        </g>
        <g id="legend">
          <text class="m" x="1000" y="700" font-size="22"><tspan fill="var(--gain)">+ GOOD</tspan>   <tspan fill="var(--loss)">− BAD</tspan>   = NEUTRAL</text>
        </g>
      </g>

      <!-- 6 Close -->
      <g id="s5" opacity="0">
        <g id="q2a"><text class="d" x="136" y="400" font-size="120" letter-spacing="-3">What did you do today</text></g>
        <g id="q2b"><text class="d" x="136" y="540" font-size="120" letter-spacing="-3">without noticing?</text></g>
        <text class="m" x="143" y="700" font-size="26">NOTICE IT FIRST · THEN CHANGE IT</text>
      </g>
      <g id="wm" aria-hidden="true" pointer-events="none">
        <defs><pattern id="wmtile" width="560" height="360" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="24" y="190" font-family="DM Mono,monospace" font-size="34" font-weight="500" fill="var(--ink)" opacity=".06">visualgrowth.app</text></pattern></defs>
        <rect width="1600" height="900" fill="url(#wmtile)"/>
        <g class="wmc"><text x="1564" y="868" text-anchor="end" font-family="DM Mono,monospace" font-size="30" font-weight="500" fill="var(--ink)" stroke="var(--stage)" stroke-width="6" paint-order="stroke" opacity=".62">visualgrowth.app</text></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="seek" type="range" min="0" max="79" step="0.01" value="0" aria-label="Position in the animation">
    <span id="clock">0:00 / 1:19</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">A paraphrased summary of chapter 4 of James Clear's <em>Atomic Habits</em>. The noticing bars are an illustration, not measured data. Narration is an AI voice generated with ElevenLabs.</p>
</div>

<audio id="vo" preload="auto" src="lesson-04.mp3"></audio>
<script>
(function(){
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const p=(t,a,b)=>ease(lin(t,a,b));
// K scales the scene timings to the narration length
const K=1, DUR=79, SC=[[0,5.6],[5.6,30.9],[30.9,44.1],[44.1,55.1],[55.1,72.8],[72.8,79]].map(a=>[a[0]*K,a[1]*K]);
const NAMES=['Can’t see it','The paramedic','Autopilot','Point and call','The scorecard','The question'];
const TM={said:12.9,fine:14.9,blockage:21.2,practice:25.4,bars:35.3,powerful:39.6,invisible:42.0,point:45.8,green:49.0,silly:50.7,pct:53.0,list:58.2,plus:61.6,minus:63.4,equals:65.0,judge:69.8,q:73.2};

// autopilot bars: noticing fades with repetition
const NB=20, bars=[];
for(let i=0;i<NB;i++){const h=420*Math.exp(-i/5.2)+8;
  bars.push([mk('rect',{x:120+i*68,width:50,rx:6,class:'ink'},$('bars')),h,1-i/(NB+2)]);}
// scorecard rows
const ROWS=[['Wake up','=','muted'],['Check phone','−','loss'],['Make coffee','=','muted'],['Go for a walk','+','gain'],['Scroll the news','−','loss'],['Read ten pages','+','gain']];
const rows=ROWS.map((r,i)=>{const y=345+i*68, g=mk('g',{},$('rows'));
  if(i)mk('path',{d:'M160 '+(y-44)+'H840',class:'s-line','stroke-width':2,fill:'none'},g);
  const tx=mk('text',{x:160,y:y,'font-size':38,class:'d5'},g);tx.textContent=r[0];
  const m=mk('text',{x:840,y:y+4,'font-size':54,'text-anchor':'end',class:'d',style:'fill:var(--'+r[2]+')'},$('rows'));m.textContent=r[1];
  return [g,m,r[1]]});
const MT={'+':'plus','−':'minus','=':'equals'};
// heartbeat trace
const ECG=x=>{const k=((x-940)%135+135)%135; return k<40?0:k<52?-(k-40)*2:k<62?-24+(k-52)*9:k<72?66-(k-62)*10:k<82?-34+(k-72)*3.4:0};

function vis(t,i){const[a,b]=SC[i],last=i===SC.length-1;
  if(t<a||(t>=b&&!last))return 0;
  return Math.min(i===0?1:lin(t,a,a+.6), last?1:1-lin(t,b-.5,b));}
function rise(el,k){el.setAttribute('opacity',k);el.setAttribute('transform','translate(0 '+((1-k)*22).toFixed(1)+')')}

function render(t){
  const u=t/K;
  for(let i=0;i<SC.length;i++)$('s'+i).setAttribute('opacity',vis(t,i).toFixed(3));

  // title: the eye looks around and blinks
  $('iris').setAttribute('transform','translate('+(70*Math.sin(t*.9)).toFixed(1)+' '+(16*Math.sin(t*1.7)).toFixed(1)+')');
  const bl=t%4.2, sh=bl>3.9?Math.abs(Math.cos((bl-3.9)/.3*Math.PI)):1;
  $('eye').setAttribute('transform','translate(1300 420) scale(1 '+Math.max(.06,sh).toFixed(3)+')');

  // the paramedic
  rise($('bubble'),p(u,TM.said,TM.said+.5)); rise($('fine'),p(u,TM.fine,TM.fine+.5));
  const ex=940+540*lin(u,SC[1][0]/K+.6,TM.blockage), sick=u>=TM.blockage; let pts='';
  for(let x=940;x<=ex;x+=3)pts+=x+','+(340+ECG(x)*(sick&&x>1300?1.4:1)).toFixed(1)+' ';
  $('ecg').setAttribute('points',pts);$('ecg').style.stroke=sick?'var(--loss)':'var(--ink)';
  $('block').setAttribute('opacity',p(u,TM.blockage,TM.blockage+.4));
  $('block').setAttribute('r',(15+5*Math.sin(t*6)*(sick?1:0)).toFixed(1));
  rise($('blockLbl'),p(u,TM.blockage+.2,TM.blockage+.7)); rise($('practice'),p(u,TM.practice,TM.practice+.6));

  // autopilot
  bars.forEach((b,i)=>{const a=TM.bars+i*.32, k=p(u,a,a+.5), h=b[1]*k;
    b[0].setAttribute('y',(720-h).toFixed(1));b[0].setAttribute('height',h.toFixed(1));
    b[0].setAttribute('opacity',(b[2]*(i<3?1:.85)).toFixed(2));
    b[0].setAttribute('class',i===0&&u>=TM.powerful?'gain':'ink')});
  rise($('pow'),p(u,TM.powerful,TM.powerful+.5)); rise($('invis'),p(u,TM.invisible,TM.invisible+.6));

  // pointing and calling
  const pt=p(u,TM.point,TM.point+.7);
  $('arm').setAttribute('opacity',pt);$('arm').setAttribute('transform','translate('+(60*(1-pt)).toFixed(1)+' '+(46*(1-pt)).toFixed(1)+')');
  rise($('call'),p(u,TM.green,TM.green+.4));
  $('lampG').setAttribute('fill',u>=TM.green?'#3A9D6B':'var(--stage)');
  const red=p(u,TM.pct,TM.pct+1.4);
  $('pcBar').setAttribute('width',(440*(1-.85*red)).toFixed(1));
  $('pct').setAttribute('opacity',p(u,TM.pct,TM.pct+.4)); $('pctNum').textContent='−'+Math.round(85*red)+'%';
  rise($('silly'),p(u,TM.silly,TM.silly+.5));

  // scorecard
  rows.forEach((r,i)=>{const a=TM.list+i*.35; rise(r[0],p(u,a,a+.5));
    const m=TM[MT[r[2]]]+(i%3)*.15; r[1].setAttribute('opacity',p(u,m,m+.3));
    r[1].setAttribute('transform','translate(0 '+((1-p(u,m,m+.3))*-14).toFixed(1)+')')});
  $('legend').setAttribute('opacity',p(u,TM.plus,TM.plus+.5));
  rise($('test'),p(u,TM.judge,TM.judge+.6));

  // close
  rise($('q2a'),p(u,TM.q,TM.q+.6)); rise($('q2b'),p(u,TM.q+.4,TM.q+1));
}
// transport: the narration is the master clock while it is playing
const au=$('vo');
const alen=()=>isFinite(au.duration)&&au.duration>0?au.duration:76.12;
const chap=$('chapters'), cbtns=NAMES.map((n,i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;
  b.addEventListener('click',()=>{t=SC[i][0]+(i?0.01:0);start()});chap.appendChild(b);return b});
let t=0, playing=false, prev=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function sync(){
  render(t); $('seek').value=t; $('clock').textContent=fmt(t)+' / '+fmt(DUR);
  $('play').textContent=playing?'Pause':(t>=DUR?'Replay':'Play');
  cbtns.forEach((b,i)=>b.setAttribute('aria-current',t>=SC[i][0]&&(t<SC[i][1]||i===SC.length-1)?'true':'false'));
}
function start(){
  if(t>=DUR)t=0; playing=true;
  if(t<alen()-.05){try{au.currentTime=t;const r=au.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  sync();
}
function stop(){playing=false;try{au.pause()}catch(e){} sync()}
function frame(now){
  if(playing&&prev!==null){
    if(!au.paused&&!au.ended&&au.readyState>2)t=au.currentTime; else t+=Math.min(.1,(now-prev)/1000);
    if(t>=DUR){t=DUR;playing=false;try{au.pause()}catch(e){}}
    sync();
  }
  prev=now; requestAnimationFrame(frame);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('seek').addEventListener('input',e=>{t=+e.target.value;stop()});
$('mute').addEventListener('click',e=>{au.muted=!au.muted;e.target.textContent=au.muted?'Sound off':'Sound on';e.target.setAttribute('aria-pressed',au.muted)});
$('full').addEventListener('click',()=>{const el=$('stageBox');
  try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}});
sync(); requestAnimationFrame(frame);
})();
</script>
</html>
