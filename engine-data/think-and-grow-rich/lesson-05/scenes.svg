<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AND GROW RICH · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Build a Master</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Mind team.</text>
<text class="b" x="120" y="600" font-size="32">Why a small, harmonious team beats going it alone</text>
<path class="s-line" d="M1060 680h420" stroke-width="5" stroke-linecap="round"/>
<g id="blk"><rect class="loss" x="1110" y="300" width="320" height="190" rx="18"/><text class="d" x="1270" y="412" font-size="44" text-anchor="middle" style="fill:var(--stage)">YOUR GOAL</text></g>
<g id="lone"></g><g id="help"></g>
<text id="tlab" class="m" x="1270" y="740" font-size="22" text-anchor="middle">TOO HEAVY FOR ONE?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Master Mind.</text>
<text class="b" x="120" y="176" font-size="32">Two or more minds, sharing knowledge and effort.</text>
<g id="spk"></g>
<g id="tgt"><circle class="gain" cx="560" cy="520" r="70"/><circle cx="560" cy="520" r="46" fill="var(--stage)"/><circle class="gain" cx="560" cy="520" r="24"/></g>
<g id="ring"></g>
<g id="purp"><text class="m" x="980" y="300" font-size="22">IN HARMONY, ONE PURPOSE</text></g>
<g id="bars">
<text class="m" x="980" y="400" font-size="20">ONE MEMBER ALONE</text>
<rect class="ink" x="980" y="420" width="120" height="50" rx="8"/>
<text class="m" x="980" y="520" font-size="20" style="fill:var(--gain)">THE MASTER MIND</text>
<rect id="bar2" class="gain" x="980" y="540" width="0" height="50" rx="8"/>
<text class="d" x="980" y="680" font-size="44">Far more than any</text>
<text class="d" x="980" y="736" font-size="44">member alone.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Carnegie’s secret.</text>
<text class="b" x="120" y="176" font-size="32">The man who sent Hill on his research.</text>
<g id="carn"><text class="m" x="330" y="620" font-size="22" text-anchor="middle">ANDREW CARNEGIE</text></g>
<g id="mill"><path class="ink" d="M760 520V360L900 290V360L1040 290V360L1180 290V360L1320 290V520Z"/><rect class="ink" x="1340" y="230" width="40" height="290"/><rect class="ink" x="1400" y="260" width="40" height="260"/><g id="smoke"></g></g>
<text id="cnt" class="m" x="800" y="568" font-size="22">ABOUT 50 MEN</text>
<g id="men"></g>
<g id="cred"><path class="s-gain" d="M786 690C640 690 560 520 452 504" fill="none" stroke-width="5" stroke-dasharray="10 10"/><path class="s-gain" d="M474 488L452 504L476 518" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="120" y="840" font-size="40">His fortune, he said, came from the group.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ford’s friends.</text>
<text class="b" x="120" y="176" font-size="32">Henry Ford and the company he kept.</text>
<circle id="fglow" class="s-gain" cx="800" cy="480" r="130" fill="none" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
<g id="flk"></g>
<g id="ford"><text class="m" x="800" y="650" font-size="22" text-anchor="middle">HENRY FORD</text></g>
<g id="frs"></g>
<g id="bulb"><circle class="gain" cx="1420" cy="296" r="26"/><rect class="ink" x="1410" y="324" width="20" height="18" rx="3"/></g>
<g id="drew"><text class="d" x="120" y="820" font-size="44">He drew on their knowledge and outlook.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two payoffs.</text>
<text class="b" x="120" y="176" font-size="32">Hill saw two benefits in a Master Mind.</text>
<g id="pc0"><rect class="s-line" x="120" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">1 · PRACTICAL</text><g id="coins"></g><text class="m" x="150" y="750" font-size="20">MORE THAN YOU COULD GATHER ALONE</text></g>
<g id="it0"><text class="d" x="420" y="440" font-size="44"><tspan style="fill:var(--gain)">+</tspan> Advice</text></g>
<g id="it1"><text class="d" x="420" y="520" font-size="44"><tspan style="fill:var(--gain)">+</tspan> Skills</text></g>
<g id="it2"><text class="d" x="420" y="600" font-size="44"><tspan style="fill:var(--gain)">+</tspan> Cooperation</text></g>
<g id="pc1"><rect class="s-line" x="840" y="230" width="640" height="550" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="290" font-size="22">2 · ALMOST SPIRITUAL</text>
<circle class="s-ink" cx="1060" cy="500" r="120" fill="none" stroke-width="5"/><circle class="s-ink" cx="1260" cy="500" r="120" fill="none" stroke-width="5"/>
<text class="m" x="1020" y="508" font-size="22" text-anchor="middle">MIND</text><text class="m" x="1300" y="508" font-size="22" text-anchor="middle">MIND</text></g>
<g id="m3"><circle id="m3c" class="gain" cx="1160" cy="500" r="40"/><text class="m" x="1160" y="700" font-size="22" text-anchor="middle" style="fill:var(--gain)">AN INVISIBLE THIRD MIND</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Minds are like batteries.</text>
<text class="b" x="120" y="176" font-size="32">Hill’s picture of a group of minds.</text>
<g id="bats"></g>
<g id="lamp"><path class="s-ink" d="M1086 385H1280" stroke-width="6"/><g id="rays"></g><circle id="bulb2" class="gain" cx="1340" cy="385" r="60"/><circle class="s-ink" cx="1340" cy="385" r="60" fill="none" stroke-width="6"/><rect class="ink" x="1320" y="445" width="40" height="34" rx="4"/></g>
<text class="m" x="120" y="490" font-size="20">ONE BRAIN = ONE BATTERY</text>
<g id="heads5"></g>
<g id="same5"><text class="d" x="120" y="800" font-size="48">Link minds, and the energy adds up.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Harmony matters.</text>
<text class="b" x="120" y="176" font-size="32">Hill insisted the group work in perfect harmony.</text>
<g id="hp0"><rect class="s-line" x="120" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22" style="fill:var(--loss)">OUT OF HARMONY</text><path id="tang" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g id="pl0"></g><text class="m" x="150" y="650" font-size="20">ENERGY</text><rect class="s-line" x="160" y="670" width="560" height="36" rx="8" fill="none" stroke-width="3"/><rect id="lbar" class="loss" x="160" y="670" width="560" height="36" rx="8"/></g>
<g id="drain"><text class="m" x="150" y="600" font-size="20">BICKERING · RIVALRY · DOUBT</text></g>
<g id="hp1"><rect class="s-line" x="840" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="280" font-size="22" style="fill:var(--gain)">IN HARMONY</text><path class="s-gain" d="M990 470H1330" stroke-width="7" stroke-linecap="round"/><g id="pl1"></g><circle class="gain" cx="1160" cy="470" r="18"/><text class="m" x="870" y="600" font-size="20">ONE GOAL · ALL IN</text><text class="m" x="870" y="650" font-size="20">ENERGY</text><rect class="s-line" x="880" y="670" width="560" height="36" rx="8" fill="none" stroke-width="3"/><rect id="rbar" class="gain" x="880" y="670" width="0" height="36" rx="8"/></g>
<g id="adds"><text class="d" x="120" y="830" font-size="44">Harmony adds energy. Conflict drains it.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build yours.</text>
<text class="b" x="120" y="176" font-size="32">Start small, meet often, share the rewards.</text>
<g id="k0"><rect class="s-line" x="120" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">START SMALL</text><g id="slots"></g><circle class="gain" cx="340" cy="470" r="44"/><text class="m" x="340" y="477" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text><text class="d5" x="150" y="710" font-size="34">Fill your gaps.</text></g>
<g id="k1"><rect class="s-line" x="580" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="610" y="290" font-size="22">MEET OFTEN</text><rect class="ink" x="620" y="340" width="360" height="50" rx="8"/><g id="cal"></g><text class="m" x="610" y="640" font-size="20" style="fill:var(--gain)">AT LEAST 2× A WEEK</text><text class="d5" x="610" y="710" font-size="34">Meet twice a week.</text></g>
<g id="k2"><rect class="s-line" x="1040" y="240" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1070" y="290" font-size="22">SHARE THE REWARDS</text>
<rect class="gain" x="1170" y="445" width="180" height="135"/><rect x="1250" y="445" width="20" height="135" fill="var(--stage)"/>
<g id="lid"><rect class="gain" x="1155" y="405" width="210" height="44"/><rect x="1250" y="405" width="20" height="44" fill="var(--stage)"/><path class="gain" d="M1260 405c-40-40-70-10-40 0zM1260 405c40-40 70-10 40 0z" stroke="var(--ink)" stroke-width="4"/></g>
<text class="m" x="1070" y="640" font-size="20">SO THE COOPERATION LASTS</text><text class="d5" x="1070" y="710" font-size="34">Something for each.</text></g>
</g>

