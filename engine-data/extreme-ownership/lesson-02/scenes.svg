<text class="m" x="710" y="725" font-size="22" text-anchor="middle" style="fill:var(--stage)">CREW SIX</text>
<g id="cr6"></g>
<g id="cup"><path class="gain" d="M670 270h80v30a40 40 0 0 1-80 0z"/><rect class="gain" x="702" y="336" width="16" height="24"/><rect class="gain" x="685" y="358" width="50" height="12" rx="4"/></g></g>
<g id="pod2"><rect class="ink" x="260" y="580" width="300" height="180"/>
<text class="d" x="410" y="700" font-size="96" text-anchor="middle" style="fill:var(--stage)">2</text>
<text class="m" x="410" y="745" font-size="20" text-anchor="middle" style="fill:var(--stage)">CREW TWO</text>
<g id="cr2"></g></g>
<g id="sec2"><text class="m" x="120" y="820" font-size="20">CREW TWO: A CLOSE SECOND. ITS OLD LEADER’S HABITS STAYED.</text></g>
<g id="same6"><text class="m" x="960" y="360" font-size="22">THE MEN OF CREW SIX</text><text class="d" x="960" y="450" font-size="56">Same people.</text></g>
<g id="onlyl"><text class="d" x="960" y="540" font-size="56">Only the leader</text><text class="d" x="960" y="610" font-size="56" style="fill:var(--gain)">changed.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Leaders set the standard.</text>
<text class="b" x="120" y="176" font-size="32">The team lives up to it, or down to it.</text>
<path class="s-ink" d="M200 260V720M760 260V720M160 720H800" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="ropes"></g><g id="team"></g>
<g id="sbarg"><rect id="sbar" class="ink" x="200" y="320" width="560" height="16" rx="8"/><text id="sbl" class="m" x="480" y="304" font-size="20" text-anchor="middle">THE STANDARD</text></g>
<g id="quote"><rect class="s-line" x="880" y="240" width="600" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="910" y="300" font-size="22">AS THE BOOK PUTS IT</text>
<text class="d5" x="910" y="380" font-size="40">“It’s not what you preach,</text>
<text class="d5" x="910" y="440" font-size="40">it’s what you <tspan style="fill:var(--loss)">tolerate</tspan>.”</text></g>
<g id="lowc"><text class="m" x="880" y="600" font-size="22" style="fill:var(--loss)">ACCEPT POOR PERFORMANCE = NEW NORMAL</text></g>
<g id="pullc"><text class="m" x="880" y="660" font-size="22" style="fill:var(--gain)">REFUSE TO LOSE = TEAM PULLS TOGETHER</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Raise the bar.</text>
<text class="b" x="120" y="176" font-size="32">When your team struggles, look at the leader first.</text>
