<text class="m" x="880" y="760" font-size="20" text-anchor="end">TODAY</text>
<g id="p_ape"></g>
</g>
<path id="p_curve" class="s-gain" d="M220 690C500 680 700 600 820 330" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
