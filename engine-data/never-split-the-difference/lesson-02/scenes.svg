</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mirror, then wait.</text>
<text class="b" x="120" y="176" font-size="32">She repeats his words and lets the silence work.</text>
<g id="f6"></g>
