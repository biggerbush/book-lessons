<g id="t0c"><text class="m" x="1480" y="690" font-size="20" text-anchor="end">CHRIS VOSS · FORMER FBI NEGOTIATOR</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mirroring.</text>
<text class="b" x="120" y="176" font-size="32">Return the last few words that matter, gently, like a question.</text>
<g id="m1p"></g>
<g id="m1a"><path class="s-ink" d="M380 382l-30 42 62-42" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-ink" x="360" y="296" width="600" height="92" rx="46" fill="var(--stage)" stroke-width="5"/><text class="d5" x="400" y="356" font-size="36">I can’t finish <tspan id="m1w">it by Friday.</tspan></text></g>
<path id="m1arc" class="s-gain" d="M820 396Q900 430 940 466" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<g id="m1b"><path class="s-gain" d="M1196 556l44 28-12-36" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-gain" x="760" y="470" width="480" height="92" rx="46" fill="var(--stage)" stroke-width="5"/><text class="d5" x="800" y="530" font-size="36" style="fill:var(--gain)">…it by Friday<tspan id="m1q">?</tspan></text></g>
<g id="m1qq"><text class="d" x="1250" y="430" font-size="90" style="fill:var(--gain)">?</text></g>
<g id="m1c"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Mirroring builds rapport and buys you time.</text>
<g id="w0"><rect class="s-line" x="120" y="230" width="420" height="560" rx="18" fill="var(--stage)" stroke-width="3"/><g id="w0a"></g><g id="w0b"></g>
