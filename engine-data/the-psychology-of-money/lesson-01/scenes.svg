<text class="m" x="1190" y="510" font-size="20" text-anchor="middle">JOB</text><text class="m" x="1360" y="510" font-size="20" text-anchor="middle">SAVINGS</text>
<text class="m" x="860" y="610" font-size="22">LIVE THROUGH IT</text></g>
<text class="m" x="120" y="690" font-size="20">HOW LONG IT STICKS</text>
<rect id="bk0" x="120" y="710" width="0" height="30" rx="6" fill="var(--muted)"/>
