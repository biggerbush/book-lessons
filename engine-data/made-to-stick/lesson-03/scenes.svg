<g id="s0">
<text class="m" x="120" y="150" font-size="28">MADE TO STICK · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Unexpected:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Break the pattern.</text>
<text class="b" x="120" y="600" font-size="32">Surprise grabs attention, and curiosity gaps keep people listening.</text>
<g id="grid"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Patterns put us to sleep.</text>
<text class="b" x="120" y="176" font-size="32">Your brain is a pattern machine. Expected things get tuned out.</text>
<g id="brs" opacity="0"></g>
<g id="brn"><path id="brp" class="s-ink" d="M190 540a70 70 0 0 1-10-130a80 80 0 0 1 130-70a80 80 0 0 1 130 40a70 70 0 0 1 20 140a60 60 0 0 1-90 40h-110a60 60 0 0 1-70-20z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-ink" d="M310 350v200M240 430q35 25 70 0M310 480q45 25 85-15" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="320" y="630" font-size="22" text-anchor="middle">YOUR BRAIN</text></g>
<g id="zz"><text class="d5" x="470" y="330" font-size="40" style="fill:var(--muted)">z z z</text></g>
