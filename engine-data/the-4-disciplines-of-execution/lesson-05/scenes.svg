<path id="fb" class="s-gain" d="M570 645C780 645 800 500 985 500" fill="none" stroke-width="6" stroke-dasharray="12 10"/>
<path class="s-gain" d="M970 484l18 16-18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="lagC"><rect class="s-line" x="1000" y="230" width="480" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1030" y="272" font-size="22">GOAL: −10 LB</text>
<circle class="ink" cx="1240" cy="340" r="40"/><path class="ink" d="M1180 508v-52a60 60 0 0 1 120 0v52z"/>
<rect class="s-ink" x="1140" y="560" width="200" height="90" rx="18" fill="var(--stage)" stroke-width="6"/>
<text id="wt" class="d" x="1240" y="620" font-size="40" text-anchor="middle">0 LB</text></g>
<g id="lagT"><text class="m" x="1240" y="720" font-size="24" text-anchor="middle" style="fill:var(--loss)">LAG: YOUR WEIGHT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two tests for a lead.</text>
<g id="t1"><rect class="s-ink" x="120" y="240" width="110" height="110" rx="18" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="270" y="290" font-size="52">Predictive</text>
<text class="b" x="270" y="340" font-size="30">When it moves, the result is likely to move too.</text></g>
<path id="ck1" class="s-gain" d="M145 295l25 25 45-55" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="gr1"><path class="s-line" d="M1080 360h380" stroke-width="4"/>
<polyline class="s-gain" points="1080,330 1180,300 1290,280 1440,240" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline class="s-ink" points="1100,350 1200,322 1310,302 1460,264" fill="none" stroke-width="4" stroke-dasharray="10 8"/></g>
<g id="t2"><rect class="s-ink" x="120" y="440" width="110" height="110" rx="18" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="270" y="490" font-size="52">Influenceable</text>
<text class="b" x="270" y="540" font-size="30">Your team can directly make it happen.</text></g>
<path id="ck2" class="s-gain" d="M145 495l25 25 45-55" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="kn"><circle class="s-gain" cx="1260" cy="495" r="52" fill="var(--stage)" stroke-width="6"/>
<line id="knb" class="s-gain" x1="1260" y1="495" x2="1260" y2="457" stroke-width="8" stroke-linecap="round"/></g>
<path class="s-line" d="M120 610h1360" stroke-width="3"/>
<g id="no">
<rect class="s-ink" x="172" y="662" width="136" height="136" rx="22" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M210 706a30 30 0 0 1 60 0z" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/>
<line class="s-loss" x1="240" y1="706" x2="254" y2="686" stroke-width="4" stroke-linecap="round"/>
<circle class="ink" cx="240" cy="706" r="4"/>
<ellipse class="ink" cx="218" cy="754" rx="13" ry="22"/>
<ellipse class="ink" cx="262" cy="754" rx="13" ry="22"/>
<path class="s-loss" d="M150 660L330 800M330 660L150 800" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="370" y="740" font-size="20">YOU CAN’T WILL THE SCALE DOWN</text></g>
<g id="yes"><path class="s-gain" d="M840 742l18 18 36-44" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-line" d="M898 806h128" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M912 798H1010V724L912 768Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
