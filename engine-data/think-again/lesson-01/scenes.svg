<path class="s-ink" d="M430 616l44 14v30c0 30-22 44-44 54c-22-10-44-24-44-54v-30z" fill="var(--loss)" stroke-width="5"/>
<text class="m" x="430" y="756" font-size="18" text-anchor="middle">SACRED BELIEF</text>
</g>
