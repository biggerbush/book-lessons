<text id="rec" class="m" x="960" y="700" font-size="22" style="fill:var(--gain)">RECORD EVERY RELATED ACTION</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write down every dollar.</text>
<text class="b" x="120" y="176" font-size="32">Every one, no matter how small.</text>
<g id="bill"><rect class="gain" x="120" y="240" width="300" height="150" rx="14"/><rect x="140" y="258" width="260" height="114" rx="8" fill="none" stroke="var(--on-gain)" stroke-width="3"/><circle cx="270" cy="315" r="40" fill="none" stroke="var(--on-gain)" stroke-width="4"/><text class="d" x="270" y="333" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">$</text><text class="m" x="120" y="430" font-size="22">MONEY</text></g>
