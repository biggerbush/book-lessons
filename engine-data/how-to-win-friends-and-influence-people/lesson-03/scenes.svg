<text class="d" x="1180" y="352" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">What I want</text>
</g>
<g id="cap2"><text class="d" x="120" y="850" font-size="40">Everyone is busy caring about what they want.</text></g>
</g>

<g id="s3" opacity="0">
