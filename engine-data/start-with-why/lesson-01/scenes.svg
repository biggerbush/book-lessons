<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 1</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Why some leaders</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">inspire and</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">others don’t.</text>
<text class="b" x="120" y="620" font-size="32">People follow leaders who share their purpose first.</text>
<g id="tApple"></g>
<g id="tQ"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="64">Same resources, different results.</text>
<text class="b" x="120" y="176" font-size="32">Two tech companies, side by side.</text>
<g id="bA"><path class="s-ink" d="M140 320L320 240L500 320" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-ink" x="160" y="320" width="320" height="320" fill="var(--stage)" stroke-width="7"/><g id="winA"></g><text class="m" x="320" y="690" font-size="22" text-anchor="middle">COMPANY A</text></g>
<g id="bB"><path class="s-ink" d="M1100 320L1280 240L1460 320" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-ink" x="1120" y="320" width="320" height="320" fill="var(--stage)" stroke-width="7"/><g id="winB"></g><text class="m" x="1280" y="690" font-size="22" text-anchor="middle">COMPANY B</text></g>
<g id="pool">
<rect class="s-line" x="600" y="300" width="400" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="800" y="342" font-size="22" text-anchor="middle">SAME TALENT</text>
<text class="m" x="630" y="420" font-size="20">ENGINEERS</text><text class="m" x="630" y="510" font-size="20">AGENCIES</text><text class="m" x="630" y="600" font-size="20">CONSULTANTS</text>
<g id="poolP"></g>
<path class="s-muted" d="M590 470H500M515 455l-15 15 15 15M1010 470H1100M1085 455l15 15-15 15" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="oA"><text class="d5" x="320" y="755" font-size="38" text-anchor="middle" style="fill:var(--gain)">Fierce loyalty</text></g>
<g id="oB"><text class="d5" x="1280" y="755" font-size="38" text-anchor="middle" style="fill:var(--muted)">Just sales</text></g>
<g id="diff"><text class="d" x="800" y="840" font-size="44" text-anchor="middle">The difference is not in the product.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="64">The usual pitch starts with what.</text>
<text class="b" x="120" y="176" font-size="32">Then a list of features, and a hope.</text>
<g id="pc">
<rect class="s-ink" x="160" y="270" width="420" height="270" rx="14" fill="var(--stage)" stroke-width="8"/>
<rect x="190" y="300" width="360" height="210" rx="6" fill="var(--line)"/>
<path class="ink" d="M340 540h80l14 66h-108z"/><rect class="ink" x="280" y="604" width="200" height="14" rx="7"/>
<text class="m" x="160" y="680" font-size="22">WHAT WE MAKE</text>
<text class="d5" x="160" y="730" font-size="34">A fast, well-designed computer.</text>
</g>
<g id="sheet">
<rect class="s-ink" x="680" y="250" width="400" height="500" rx="14" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="820" y="232" width="120" height="36" rx="8"/>
<text class="m" x="720" y="318" font-size="22">FEATURES</text>
<g id="feats"></g>
</g>
<g id="hope">
<path class="s-muted" transform="translate(1290 440) scale(1.6)" d="M0 60C-75 10-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 10 0 60Z" fill="none" stroke-width="3" stroke-dasharray="6 6"/>
<text class="m" x="1290" y="600" font-size="22" text-anchor="middle">NOTHING TO</text><text class="m" x="1290" y="632" font-size="22" text-anchor="middle">BELIEVE IN</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Apple starts with why.</text>
<text class="b" x="120" y="176" font-size="32">Sinek imagines Apple speaking in its own voice.</text>
<g id="gWhat"><circle class="s-ink" cx="420" cy="500" r="260" fill="var(--stage)" stroke-width="6"/><text class="m" x="420" y="292" font-size="22" text-anchor="middle">WHAT</text>
<rect class="s-ink" x="394" y="694" width="52" height="30" rx="4" fill="var(--stage)" stroke-width="4"/><path class="ink" d="M386 728h68l-5 8h-58z"/></g>
<g id="gHow"><circle class="s-ink" cx="420" cy="500" r="170" fill="var(--stage)" stroke-width="6"/><text class="m" x="420" y="378" font-size="22" text-anchor="middle">HOW</text></g>
<g id="gWhy"><circle class="gain" cx="420" cy="500" r="80"/><circle cx="420" cy="478" r="24" fill="none" stroke="var(--on-gain)" stroke-width="5"/><path d="M410 512h20M413 522h14" stroke="var(--on-gain)" stroke-width="5" stroke-linecap="round"/><text class="m" x="420" y="558" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g>
<g id="bub"><rect class="s-line" x="760" y="240" width="720" height="540" rx="24" fill="var(--stage)" stroke-width="4"/><path class="s-line" d="M762 470L706 500L762 530" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/></g>
<g id="tWhy"><text class="m" x="800" y="300" font-size="22" style="fill:var(--gain)">WHY</text><text class="d5" x="800" y="348" font-size="32">We challenge the way things</text><text class="d5" x="800" y="390" font-size="32">have always been done.</text><text class="d" x="800" y="432" font-size="32" style="fill:var(--gain)">We think differently.</text></g>
<g id="tHow"><text class="m" x="800" y="500" font-size="22">HOW</text><text class="d5" x="800" y="548" font-size="32">Our products are beautiful</text><text class="d5" x="800" y="590" font-size="32">and simple to use.</text></g>
<g id="tWhat"><text class="m" x="800" y="658" font-size="22">WHAT</text><text class="d5" x="800" y="706" font-size="32">We just happen to make</text><text class="d5" x="800" y="748" font-size="32">great computers.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="60">A belief travels. A product doesn’t.</text>
<text class="b" x="120" y="176" font-size="32">Apple sold music players and phones. Dell tried too.</text>
<path class="s-line" d="M800 300V820" stroke-width="3"/>
<g id="ap"><text class="m" x="420" y="400" font-size="22" text-anchor="middle">APPLE</text><circle class="gain" cx="420" cy="500" r="70"/><text class="m" x="420" y="508" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WHY</text><g id="apI"></g><text class="m" x="420" y="820" font-size="22" text-anchor="middle" style="fill:var(--gain)">TRUSTED</text></g>
<g id="dl"><text class="m" x="1180" y="400" font-size="22" text-anchor="middle">DELL</text><rect id="dlBox" x="1000" y="440" width="360" height="120" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text id="dlT" class="m" x="1180" y="508" font-size="20" text-anchor="middle">COMPUTERS</text><g id="dlI"></g></g>
<g id="dlN"><text class="m" x="1180" y="820" font-size="22" text-anchor="middle" style="fill:var(--loss)">NOT TAKEN SERIOUSLY</text></g>
</g>

<g id="s5" opacity="0">
<g id="qc"><rect class="s-line" x="120" y="150" width="1360" height="290" rx="24" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="150" y="300" font-size="140" style="fill:var(--gain)">“</text>
<text class="d" x="240" y="270" font-size="60">People don’t buy what you do;</text>
<text class="d" x="240" y="355" font-size="60">they buy <tspan style="fill:var(--gain)">why</tspan> you do it.</text>
<text class="m" x="244" y="410" font-size="22">SIMON SINEK</text></g>
<g id="ht"><path id="htP" class="gain" d="M0 60C-75 10-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 10 0 60Z"/><text class="m" x="380" y="810" font-size="22" text-anchor="middle">SHARE YOUR PURPOSE FIRST</text></g>
<g id="fol"></g>
<g id="cust"><text class="m" x="840" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">NOT BUYING. JOINING A CAUSE.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">Leaders draw people with a belief.</text>
<text class="b" x="120" y="176" font-size="32">This pattern goes far beyond tech companies.</text>
<g id="waves"></g>
<g id="pod"><g id="spk"></g><path class="ink" d="M720 420h160l-20 120h-120z"/><rect class="ink" x="700" y="408" width="200" height="16" rx="6"/></g>
<g id="mlk"><text class="m" x="120" y="300" font-size="22">MARTIN LUTHER KING JR.</text><text class="m" x="120" y="340" font-size="22" style="fill:var(--gain)">A BELIEF, NOT A PLAN</text></g>
<g id="self"><text class="m" x="1480" y="300" font-size="22" text-anchor="end" style="fill:var(--gain)">THEY CAME FOR THEMSELVES</text></g>
<g id="crd"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write down your why first.</text>
<text class="b" x="120" y="176" font-size="32">Before your next pitch, presentation or job interview.</text>
<g id="nb"><rect class="s-ink" x="160" y="250" width="440" height="520" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g>
<path class="s-line" d="M200 400h360M200 470h360M200 540h360M200 610h360M200 680h360" stroke-width="3"/>
<text class="d5" x="200" y="385" font-size="34">Why I do my work:</text></g>
<path id="scr" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="penG"><path class="ink" d="M0 0l6-28 70-70 22 22-70 70z"/></g>
<g id="ord">
<rect class="gain" x="760" y="260" width="220" height="90" rx="45"/><text class="d" x="870" y="320" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">WHY</text>
<path class="s-muted" d="M990 305h40m-14-14 14 14-14 14M1230 305h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="1040" y="260" width="180" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1130" y="317" font-size="34" text-anchor="middle">HOW</text>
<rect class="s-ink" x="1280" y="260" width="200" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1380" y="317" font-size="34" text-anchor="middle">WHAT</text>
<text class="m" x="760" y="400" font-size="20">LEAD WITH THE BELIEF, THEN THE DETAILS</text>
</g>
<g id="lis"></g>
<g id="lnT"><text class="m" x="1100" y="720" font-size="22" text-anchor="middle" style="fill:var(--gain)">WATCH THEM LEAN IN</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="76" letter-spacing="-2">Can you explain <tspan style="fill:var(--gain)">why</tspan></text></g>
<g id="qb"><text class="d" x="136" y="395" font-size="76" letter-spacing="-2">you do what you do,</text></g>
<g id="qc2"><text class="d" x="136" y="490" font-size="76" letter-spacing="-2">in one sentence, without</text></g>
<g id="qd"><text class="d" x="136" y="585" font-size="76" letter-spacing="-2">mentioning what you make?</text></g>
<text class="m" x="143" y="700" font-size="26">START WITH WHY</text>
<g id="gc"><circle class="s-ink" cx="1360" cy="440" r="100" fill="none" stroke-width="5"/><circle class="s-ink" cx="1360" cy="440" r="66" fill="none" stroke-width="5"/><circle id="gcC" class="gain" cx="1360" cy="440" r="32"/></g>
