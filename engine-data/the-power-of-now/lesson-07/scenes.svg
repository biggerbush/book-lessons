<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The quiet power</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of surrender.</text>
<text class="b" x="120" y="600" font-size="32">Why accepting this moment is the start of wise action.</text>
<path class="s-line" d="M1060 600h420" stroke-width="5" stroke-linecap="round"/>
<g id="tug"><g id="tugP"></g><path id="rope" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round"/><circle id="nowC" cx="1400" cy="530" r="62" fill="var(--stage)" stroke-width="7"/><text class="d" x="1400" y="544" font-size="34" text-anchor="middle">NOW</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Surrender is not giving up.</text>
<text class="b" x="120" y="176" font-size="32">Tolle means something different.</text>
<g id="fl"><rect class="s-line" x="120" y="230" width="440" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M240 640V290" stroke-width="8" stroke-linecap="round"/>
<path id="flagP" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="150" y="670" font-size="22">DEFEAT?</text></g>
<g id="fx"><path class="s-loss" d="M180 300L500 620M500 300L180 620" stroke-width="9" stroke-linecap="round"/></g>
<g id="rv"><rect class="s-line" x="620" y="230" width="860" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M660 350C860 320 1060 380 1440 340M660 610C860 640 1060 580 1440 620" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="flow"></g>
<path id="leaf" class="gain" d="M-34 0C-20-22 20-22 34 0C20 22-20 22-34 0Z"/>
<text class="m" x="660" y="670" font-size="22">YIELD TO THE FLOW OF LIFE</text></g>
<g id="acc"><text class="d" x="120" y="800" font-size="44">Inner acceptance of what is, not resignation.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stuck in the mud.</text>
<text class="b" x="120" y="176" font-size="32">Tolle’s simple example.</text>
<g id="cm"><g id="car"><path class="ink" d="M-210 20V-40a20 20 0 0 1 20-20H-100L-50-120H90L140-60H190a20 20 0 0 1 20 20V20Z"/>
<path d="M-38-104H40v44H-70Z" fill="var(--stage)"/><path d="M56-104H82l40 44H56Z" fill="var(--stage)"/>
<circle class="ink" cx="-120" cy="20" r="42"/><circle cx="-120" cy="20" r="16" fill="var(--stage)"/><circle class="ink" cx="120" cy="20" r="42"/><circle cx="120" cy="20" r="16" fill="var(--stage)"/></g>
<ellipse class="loss" cx="480" cy="650" rx="360" ry="72"/></g>
<g id="sh"><g id="shR"><path class="s-gain" d="M900 380L860 590" stroke-width="10" stroke-linecap="round"/><path class="gain" d="M834 580h52l-8 70h-36z"/></g></g>
<text class="m" x="1000" y="280" font-size="22">NOT THIS</text>
<g id="say0"><text class="d5" x="1000" y="340" font-size="36" fill-opacity=".55">“Fine, I’ll stay here.”</text></g>
<line id="sk0" class="s-ink" x1="992" y1="328" x2="992" y2="328" stroke-width="5" stroke-linecap="round"/>
<g id="st1"><rect class="gain" x="1000" y="420" width="480" height="90" rx="16"/><text class="d5" x="1030" y="478" font-size="34" style="fill:var(--on-gain)">1. Accept: I’m stuck.</text></g>
<g id="st2"><rect class="s-gain" x="1000" y="540" width="480" height="90" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1030" y="598" font-size="34">2. Act: start digging.</text></g>
<g id="fin"><text class="d" x="120" y="810" font-size="48">Acceptance first. Then action follows.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three options. That’s all.</text>
<text class="b" x="120" y="176" font-size="32">When a situation feels unbearable.</text>
<g id="dfr"><rect class="s-ink" x="220" y="240" width="240" height="340" rx="6" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="680" y="240" width="240" height="340" rx="6" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="1140" y="240" width="240" height="340" rx="6" fill="var(--stage)" stroke-width="6"/></g>
<g id="i0"><rect class="gain" x="290" y="268" width="100" height="44" rx="8"/><text class="m" x="340" y="298" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">EXIT</text>
<path class="s-ink" d="M270 430h130m-40-40 40 40-40 40" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="340" y="660" font-size="48" text-anchor="middle">Leave it</text></g>
<g id="i1"><g id="wr">
<path class="s-ink" d="M730 420A70 70 0 0 1 853.6 375" fill="none" stroke-width="16" stroke-linecap="round"/>
<path class="ink" d="M867.7 391.9L865.9 364.7L841.3 385.3Z" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M870 420A70 70 0 0 1 746.4 465" fill="none" stroke-width="16" stroke-linecap="round"/>
<path class="ink" d="M732.3 448.1L758.7 454.7L734.1 475.3Z" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
</g>
<text class="d" x="800" y="660" font-size="48" text-anchor="middle">Change it</text></g>
<g id="i2"><rect class="gain" x="1143" y="243" width="234" height="334" fill-opacity=".3"/>
<text class="d" x="1260" y="660" font-size="48" text-anchor="middle" style="fill:var(--gain)">Accept it</text></g>
<path id="dp2" class="s-ink" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<g id="cmp"><text class="d5" x="120" y="790" font-size="40"><tspan style="fill:var(--loss)">Complaining</tspan> and <tspan style="fill:var(--loss)">stewing</tspan> only add suffering.</text>
<text class="m" x="120" y="840" font-size="22">NOT ON THE LIST</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Resistance says no to what is.</text>
<text class="b" x="120" y="176" font-size="32">And the mind’s no has a cost.</text>
<g transform="translate(0 90)">
<g id="rs"><g id="rp"></g>
<rect class="s-ink" x="460" y="316" width="140" height="66" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="530" y="363" font-size="40" text-anchor="middle" style="fill:var(--loss)">NO!</text>
<text class="m" x="460" y="420" font-size="20">TO WHAT ALREADY IS</text></g>
<g id="fist"><path class="s-ink" d="M394 488H440" stroke-width="12" stroke-linecap="round"/><rect class="loss" x="440" y="460" width="80" height="56" rx="18"/><path d="M460 460v22M480 460v22M500 460v22" stroke="var(--stage)" stroke-width="4"/></g>
<g id="tz"><path class="s-loss" d="M222 360l-14 20 14 20-14 20 14 20-14 20 14 20M540 450l14 20-14 20 14 20-14 20" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
<g id="cl"><path id="cp" d="M260 290h140a30 30 0 0 0 0-60a40 40 0 0 0-70-20a36 36 0 0 0-70 20a30 30 0 0 0 0 60z"/></g>
</g>
<g id="ch"><text class="m" x="800" y="390" font-size="20">HOW MUCH YOU SUFFER</text>
<rect x="800" y="410" width="300" height="100" rx="10" fill="var(--line)"/>
<text class="m" x="800" y="550" font-size="20">ONCE: THE SITUATION</text></g>
<rect id="b2" class="loss" x="1110" y="410" width="0" height="100" rx="10"/>
<g id="l2"><text class="m" x="1110" y="550" font-size="20" style="fill:var(--loss)">AGAIN: FIGHTING IT</text></g>
<g id="tw"><text class="d" x="120" y="790" font-size="44">Once from the situation, again from fighting it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">When you can’t accept it.</text>
<text class="b" x="120" y="176" font-size="32">Some moments feel impossible to accept.</text>
<g id="hh"><g id="hp"><path class="loss" d="M0 100C-150 0-140-110-65-110C-30-110 0-85 0-60C0-85 30-110 65-110C140-110 150 0 0 100Z"/></g>
<text class="m" x="340" y="620" font-size="22" text-anchor="middle">ILLNESS · LOSS</text></g>
<g id="ar5"><path class="s-muted" d="M520 440C640 400 760 460 850 550" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/><path class="s-muted" d="M816 540l36 12-4-38" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="560" y="380" font-size="20">TURN INWARD</text></g>
<g id="bd"><circle class="s-ink" cx="1080" cy="300" r="56" fill="none" stroke-width="6"/><path class="s-ink" d="M900 720V600a180 180 0 0 1 360 0V720Z" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="cd"><circle class="gain" cx="1080" cy="560" r="80" fill-opacity=".18"/><rect class="ink" x="1062" y="590" width="36" height="110" rx="4"/><path id="flm" class="gain" d="M1080 520c22 26 24 46 0 62c-24-16-22-36 0-62z"/></g>
<g id="chips"></g>
<g id="pc5"><text class="d" x="120" y="810" font-size="38">Even surrendering to your non-acceptance can bring peace.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Act from clear seeing.</text>
<text class="b" x="120" y="176" font-size="32">Stop resisting, and your energy comes back.</text>
<g id="cf"><g id="cfP"></g><g id="args"></g>
<rect class="s-ink" x="220" y="620" width="280" height="34" rx="17" fill="none" stroke-width="4"/>
<rect id="en" class="gain" x="220" y="620" width="0" height="34" rx="17"/>
<text class="m" x="220" y="700" font-size="20">ENERGY</text></g>
<g id="bl"><g id="rays"></g><circle id="bc" class="s-ink" cx="840" cy="380" r="80" stroke-width="7"/><rect class="ink" x="805" y="466" width="70" height="44" rx="8"/>
<text class="m" x="840" y="590" font-size="20" text-anchor="middle">CLEAR SEEING</text></g>
<g id="tg"><circle class="s-ink" cx="1300" cy="410" r="120" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1300" cy="410" r="80" fill="none" stroke-width="6"/><circle class="gain" cx="1300" cy="410" r="40"/>
<text class="m" x="1300" y="590" font-size="20" text-anchor="middle">EFFECTIVE ACTION</text></g>
<path id="ar6" class="s-gain" d="M-160 0H0m-24-20 24 20-24 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="eff"><text class="d" x="120" y="800" font-size="44">Clear action is often far more effective.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">It all connects.</text>
<text class="b" x="120" y="176" font-size="32">Surrender gathers the whole book together.</text>
<g id="frm"><rect class="s-muted" x="310" y="240" width="470" height="470" rx="20" fill="none" stroke-width="4" stroke-dasharray="12 10"/></g>
<g id="pz"></g>
<g id="hd"><circle class="gain" cx="1210" cy="460" r="150"/>
<path id="ck" d="M1140 465L1190 515L1290 405" fill="none" stroke="var(--on-gain)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="230"/>
<text class="m" x="1210" y="680" font-size="22" text-anchor="middle">SAYING YES</text></g>
<g id="yes7"><text class="d" x="120" y="810" font-size="48">Surrender is that yes, made complete.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Next time it goes wrong:</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">leave it, change it,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2">or <tspan style="fill:var(--gain)">accept it fully</tspan>?</text></g>
<g id="qm"><text class="d" x="1380" y="760" font-size="220" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="dr8"><rect class="s-ink" x="143" y="590" width="90" height="130" rx="4" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="263" y="590" width="90" height="130" rx="4" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="383" y="590" width="90" height="130" rx="4"/></g>
<g id="lab8"><path class="s-muted" d="M540 700c40-20 80 20 120 0s80 20 120 0s80 20 120 0" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="143" y="800" font-size="26">THEN CHOOSE ONE, AND LET GO OF THE FIGHT</text></g>
</g>