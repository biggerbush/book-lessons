<g id="s0">
<text class="m" x="120" y="150" font-size="28">AWAKEN THE GIANT WITHIN · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Beliefs are built</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">from references.</text>
<text class="b" x="120" y="600" font-size="32">Why your beliefs stand firm, and how to rebuild them</text>
<g id="t0"><g id="t0r"><rect class="ink" x="1090" y="380" width="360" height="24" rx="6"/><g id="t0l"></g></g>
<path class="s-line" d="M1060 612h420" stroke-width="5" stroke-linecap="round"/></g>
<g id="sk0"><text class="m" x="1340" y="660" font-size="20" text-anchor="middle" style="fill:var(--loss)">SHAKY EVIDENCE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">An idea is a tabletop.</text>
<text class="b" x="120" y="176" font-size="32">Flat, with nothing holding it up.</text>
<ellipse id="sh1" cx="800" cy="720" rx="260" ry="16" fill="var(--line)"/>
<g id="gh1"><path class="s-muted" d="M560 490V690M1040 490V690" stroke-width="4" stroke-dasharray="6 12" stroke-linecap="round"/></g>
<g id="tt1"><g id="tt1r"><rect class="ink" x="500" y="430" width="600" height="30" rx="8"/>
<g id="th1"><text class="d5" x="800" y="400" font-size="44" text-anchor="middle">“I’m good with people.”</text></g></g></g>
<g id="wb1"><text class="m" x="800" y="800" font-size="24" text-anchor="middle" style="fill:var(--loss)">WOBBLY AND UNCERTAIN</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">References are legs.</text>
<text class="b" x="120" y="176" font-size="32">The experiences that seem to prove the idea true.</text>
<text class="d5" x="600" y="306" font-size="36" text-anchor="middle">“I’m good with people.”</text>
<rect class="ink" x="280" y="330" width="640" height="28" rx="8"/>
<g id="l2"></g>
<path class="s-line" d="M240 648h720" stroke-width="5" stroke-linecap="round"/>
<g id="rf2"><text class="m" x="600" y="700" font-size="22" text-anchor="middle">LEGS = REFERENCES</text></g>
<g id="pt2"><rect class="s-line" x="1040" y="240" width="440" height="360" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-gain" d="M1184 320L1236 300M1284 300L1336 320" stroke-width="4" stroke-dasharray="6 8" fill="none"/>
<g id="pp2"></g>
<text class="m" x="1070" y="500" font-size="20">A PARTY WHERE YOU</text>
<text class="m" x="1070" y="532" font-size="20">MADE FRIENDS EASILY</text>
<path class="s-gain" d="M1040 560Q960 560 896 590" fill="none" stroke-width="4" stroke-dasharray="8 8"/></g>
<g id="ok2"><text class="d" x="120" y="800" font-size="48">Enough legs, and you feel certain.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two brothers, one father.</text>
<text class="b" x="120" y="176" font-size="32">The same childhood, two very different lives.</text>
<g id="fa3"><g id="fp3"></g>
<text class="m" x="850" y="244" font-size="20" style="fill:var(--loss)">ADDICTION · VIOLENCE</text>
<path class="s-line" d="M800 345V380H450V440M800 380H1150V400" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
<g id="so3"></g>
<g id="ce3"><rect class="s-loss" x="320" y="440" width="260" height="260" rx="6" fill="none" stroke-width="7"/>
<path class="s-loss" d="M365 440V700M410 440V700M490 440V700M535 440V700" stroke-width="6"/></g>
<g id="lb3a"><text class="m" x="450" y="770" font-size="22" text-anchor="middle" style="fill:var(--loss)">PRISON</text></g>
<g id="ho3"><path class="s-ink" d="M990 490L1150 400L1310 490" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="1010" y="480" width="280" height="230" fill="none" stroke-width="7"/></g>
<g id="fm3"></g>
<g id="lb3b"><text class="m" x="1150" y="770" font-size="22" text-anchor="middle" style="fill:var(--gain)">A STEADY FAMILY MAN</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same legs, two tables.</text>
<text class="b" x="120" y="176" font-size="32">Both brothers gave the same answer.</text>
<g id="q4a"></g>
<g id="q4b"><text class="d5" x="800" y="262" font-size="40" text-anchor="middle">“What else would I become,</text>
<text class="d5" x="800" y="312" font-size="40" text-anchor="middle">with a father like that?”</text></g>
<g id="tb4"><rect class="loss" x="230" y="450" width="440" height="26" rx="8"/><rect class="gain" x="930" y="450" width="440" height="26" rx="8"/>
<g id="l4"></g><path class="s-line" d="M200 652h500M900 652h500" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="800" y="704" font-size="24" text-anchor="middle" style="fill:var(--ink)">SAME PAINFUL REFERENCES</text></g>
<g id="f4a"><text class="d" x="450" y="430" font-size="40" text-anchor="middle" style="fill:var(--loss)">This is my fate.</text></g>
<g id="f4b"><text class="d" x="1150" y="380" font-size="38" text-anchor="middle" style="fill:var(--gain)">This is exactly what</text>
<text class="d" x="1150" y="430" font-size="38" text-anchor="middle" style="fill:var(--gain)">I refuse to become.</text></g>
<g id="m4a"><text class="d" x="120" y="785" font-size="44">Experiences alone don’t decide your beliefs.</text></g>
<g id="m4b"><text class="d" x="120" y="845" font-size="44" style="fill:var(--gain)">The meaning you give them does.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Saw off the legs.</text>
<text class="b" x="120" y="176" font-size="32">Weaken a limiting belief by questioning it.</text>
<g id="tb5"><text class="m" x="560" y="306" font-size="22" text-anchor="middle" style="fill:var(--loss)">A LIMITING BELIEF</text>
<rect class="loss" x="240" y="330" width="640" height="26" rx="8"/><g id="l5"></g></g>
<path class="s-line" d="M200 648h720" stroke-width="5" stroke-linecap="round"/>
<g id="sw5"><g id="sw5m"><path class="s-ink" d="M0 -18h150v36H0z" fill="var(--stage)" stroke-width="4"/>
<rect class="gain" x="150" y="-30" width="56" height="60" rx="14"/></g></g>
<g id="q5a"><circle class="gain" cx="1030" cy="290" r="26"/><text class="d" x="1030" y="302" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">?</text>
<text class="d5" x="1080" y="302" font-size="34">Is this really true?</text>
<text class="m" x="1080" y="346" font-size="22" style="fill:var(--ink)" fill-opacity=".85">OR DID I JUST ACCEPT IT</text>
<text class="m" x="1080" y="378" font-size="22" style="fill:var(--ink)" fill-opacity=".85">FROM SOMEONE ELSE?</text></g>
<g id="q5b"><circle class="gain" cx="1030" cy="470" r="26"/><text class="d" x="1030" y="482" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">?</text>
<text class="d5" x="1080" y="482" font-size="34">What will it cost me?</text>
<text class="m" x="1080" y="526" font-size="22" style="fill:var(--ink)" fill-opacity=".85">IN THE YEARS AHEAD</text></g>
<g id="wb5"><text class="d" x="120" y="790" font-size="46">Shaky legs, and the whole table wobbles.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Add new legs.</text>
<text class="b" x="120" y="176" font-size="32">Strengthen an empowering belief on purpose.</text>
<text class="m" x="560" y="306" font-size="22" text-anchor="middle" style="fill:var(--gain)">AN EMPOWERING BELIEF</text>
<rect class="gain" x="240" y="330" width="640" height="26" rx="8"/>
<g id="gh6"><path class="s-muted" d="M390 366V632M490 366V632M630 366V632M730 366V632" stroke-width="4" stroke-dasharray="6 12" stroke-linecap="round"/></g>
<g id="l6"></g>
<path class="s-line" d="M200 648h720" stroke-width="5" stroke-linecap="round"/>
<g id="r60"><rect class="s-ink" x="1000" y="272" width="30" height="56" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="1030" y="272" width="30" height="56" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1090" y="308" font-size="22">OTHERS’ STORIES</text></g>
<g id="r61"><circle class="ink" cx="1015" cy="428" r="16"/><circle class="ink" cx="1035" cy="412" r="20"/><circle class="ink" cx="1054" cy="430" r="14"/>
<text class="m" x="1090" y="428" font-size="22">YOUR IMAGINATION</text></g>
<g id="r62"><circle class="ink" cx="1030" cy="508" r="12"/><path class="ink" d="M1012 558v-16a18 18 0 0 1 36 0v16z"/>
<text class="m" x="1090" y="532" font-size="22">READ ABOUT PEOPLE</text><text class="m" x="1090" y="562" font-size="22">WHO’VE DONE IT</text></g>
<g id="r63"><path class="s-gain" d="M1000 690h20v-20h20v-20h20v-20" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="1090" y="652" font-size="22">SMALL ACTIONS,</text><text class="m" x="1090" y="682" font-size="22">REAL EXPERIENCES</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">From belief to conviction.</text>
<text class="b" x="120" y="176" font-size="32">Pile up references, especially emotional ones.</text>
<rect id="fl7" x="214" y="326" width="476" height="286" fill="var(--ink)" opacity="0"/>
<rect id="tp7" class="ink" x="200" y="300" width="500" height="26" rx="8"/>
<g id="l7"></g>
<path class="s-line" d="M180 628h540" stroke-width="5" stroke-linecap="round"/>
<g id="bk7"><text class="d" x="450" y="276" font-size="44" text-anchor="middle" style="fill:var(--gain)">CONVICTION</text></g>
<g id="lg7"><text class="m" x="450" y="672" font-size="20" text-anchor="middle">EACH LEG = A REFERENCE · AMBER = EMOTIONAL</text></g>
<g id="st7"><path class="s-ink" d="M860 640h100v-75h100v-75h100v-75h100v-75h220" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="pr7"></g></g>
<g id="cv7"><text class="d" x="120" y="780" font-size="44">Certainty pushes you to act,</text>
<text class="m" x="120" y="830" font-size="22" style="fill:var(--gain)">EVEN WHEN THINGS GET HARD</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one belief that</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">holds you back.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Which <tspan style="fill:var(--gain)">legs</tspan> would survive?</text></g>
<g id="ql8"><text class="m" x="143" y="700" font-size="26">TONIGHT, WRITE DOWN ITS LEGS</text></g>
<g id="g8"><rect class="ink" x="1190" y="260" width="260" height="22" rx="6"/><g id="l8"></g>
<path class="s-line" d="M1170 432h300" stroke-width="5" stroke-linecap="round"/></g>
</g>