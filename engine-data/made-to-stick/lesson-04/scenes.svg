</g>
<path class="gain" d="M620 400c22 22 26 64 14 100h-28c-12-36-8-78 14-100zM606 470l-18 30h18zM634 470l18 30h-18z"/>
<rect class="ink" x="160" y="500" width="560" height="16" rx="4"/>
<path class="s-ink" d="M190 516v60M690 516v60" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="160" y="626" font-size="22">“LEAD THE INDUSTRY THROUGH</text>
<text class="m" x="160" y="658" font-size="22">TEAM-CENTERED INNOVATION.”</text>
</g>
<g id="qm">
<text class="d" x="350" y="450" font-size="180" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="m" x="160" y="712" font-size="20" style="fill:var(--loss)">NOBODY PICTURES IT. NOBODY REMEMBERS IT.</text>
</g>
<g id="rp">
<rect class="s-line" x="840" y="220" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
