<g id="rt1"><text class="d" x="120" y="800" font-size="44">No agreed way to measure good work.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="64">So we measured what we could see.</text>
<text class="b" x="120" y="176" font-size="32">Visible effort became our proof of value.</text>
