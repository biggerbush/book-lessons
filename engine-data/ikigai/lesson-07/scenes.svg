<g id="cF"><text class="d" x="800" y="470" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Follow your</text><text class="d" x="800" y="524" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">ikigai.</text></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start small today.</text>
