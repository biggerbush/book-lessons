<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Candor that gets</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">things done.</text>
<text class="b" x="120" y="600" font-size="32">How candid teams turn good ideas into real results.</text>
<g id="tt"><g id="ttp"></g><ellipse cx="1270" cy="520" rx="180" ry="70" fill="var(--stage)" class="s-ink" stroke-width="6"/></g>
<g id="gear"><g id="gearR"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Get Stuff Done wheel.</text>
<text class="b" x="120" y="176" font-size="32">Seven steps. Then the wheel turns again.</text>
<g id="wheel"><g id="wh"><circle cx="800" cy="530" r="230" fill="none" class="s-ink" stroke-width="8"/></g><circle cx="800" cy="530" r="70" fill="var(--stage)" class="s-ink" stroke-width="6"/></g>
<g id="wlab"></g>
<g id="hub"><circle cx="800" cy="530" r="70" class="gain"/><text class="m" x="800" y="537" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">CANDOR</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Listen.</text>
<text class="b" x="120" y="176" font-size="32">Ideas can surface from anyone, not just the boss.</text>
<g id="ear"><path class="s-ink" d="M290 300c0-50-40-80-85-80s-85 35-85 85c0 45 30 60 30 95s25 60 55 60 45-25 45-45" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M245 310c0-22-17-38-38-38s-38 17-38 38 17 28 27 28" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="row"></g><g id="ideas"></g>
<g id="jobs"><rect class="s-line" x="120" y="490" width="650" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d5" x="150" y="548" font-size="44">Steve Jobs</text><text class="m" x="150" y="584" font-size="20">STRONG OPINIONS · FIGHT BACK</text><g id="jp"></g>
<path id="ja" class="s-ink" d="M350 690h100m-22-22 22 22-22 22" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path id="jb" class="s-gain" d="M590 722h-100m22-22-22 22 22 22" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cook"><rect class="s-line" x="830" y="490" width="650" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d5" x="860" y="548" font-size="44">Tim Cook</text><text class="m" x="860" y="584" font-size="20">QUESTION AFTER QUESTION</text><g id="cp"></g><g id="cq"></g></g>
<g id="safe"><text class="d" x="120" y="845" font-size="38">Both styles work, if people feel safe speaking up.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Clarify.</text>
<text class="b" x="120" y="176" font-size="32">New ideas are fragile, like seedlings.</text>
<line id="stem" x1="420" y1="640" x2="420" y2="640" class="s-gain" stroke-width="8" stroke-linecap="round"/>
<g id="leaves"><ellipse cx="395" cy="525" rx="26" ry="12" class="gain" transform="rotate(-30 395 525)"/><ellipse cx="445" cy="525" rx="26" ry="12" class="gain" transform="rotate(30 445 525)"/></g>
<g id="pot"><path class="ink" d="M355 640h130l-18 80h-94z"/><path class="s-line" d="M160 720h520" stroke-width="5" stroke-linecap="round"/></g>
<g id="ws"><path class="s-gain" d="M190 720A230 230 0 0 1 650 720" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<circle cx="420" cy="380" r="38" fill="var(--stage)" class="s-ink" stroke-width="5"/><path class="s-ink" d="M420 380h18" stroke-width="5" stroke-linecap="round"/><line id="hand" class="s-gain" x1="420" y1="380" x2="420" y2="352" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="420" y="780" font-size="20" text-anchor="middle">TIME AND SPACE</text></g>
<g id="clar"><path class="s-muted" d="M690 520h90m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-line" x="820" y="300" width="660" height="320" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="960" cy="440" r="50"/><rect class="ink" x="940" y="495" width="40" height="24" rx="6"/>
<path class="s-ink" d="M1060 400h360M1060 450h300M1060 500h220" stroke-width="10" stroke-linecap="round"/>
<g id="lis"></g><text class="m" x="820" y="806" font-size="20">CLEAR ENOUGH FOR OTHERS TO UNDERSTAND</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Debate, then decide.</text>
<text class="b" x="120" y="176" font-size="32">Focus on the issue, not on egos.</text>
<g id="ring"><rect class="s-ink" x="140" y="260" width="520" height="400" rx="10" fill="none" stroke-width="6"/><rect class="s-line" x="170" y="290" width="460" height="340" fill="none" stroke-width="4"/>
<g id="rp"></g><circle class="gain" cx="400" cy="470" r="44"/><text class="m" x="400" y="477" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">IDEA</text>
<path id="da" class="s-ink" d="M280 470h50m-16-16 16 16-16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="db" class="s-ink" d="M520 470h-50m16-16-16 16 16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="400" y="710" font-size="22" text-anchor="middle">THE ISSUE, NOT EGOS</text></g>
<g id="scl"><path class="s-ink" d="M1120 280V460M1050 460h140" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M970 280h300M990 280v60M1250 280v60" stroke-width="6" stroke-linecap="round"/><path class="ink" d="M945 340h90a45 22 0 0 1-90 0z"/><path class="gain" d="M1205 340h90a45 22 0 0 1-90 0z"/></g>
<circle class="ink" cx="1120" cy="280" r="12"/></g>
<g id="dec"><path class="s-muted" d="M1380 500Q1140 420 900 540" fill="none" stroke-width="3" stroke-dasharray="6 8"/><g id="dp"></g><g id="dm"></g><g id="dd"></g>
<text class="m" x="1380" y="690" font-size="20" text-anchor="middle">BOSS</text><text class="m" x="1010" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">CLOSEST TO THE FACTS</text>
<circle id="tok" class="gain" r="16"/></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. Persuade.</text>
<text class="b" x="120" y="176" font-size="32">A decision means little if the wider team doesn’t buy in.</text>
<g id="mega"><path class="ink" d="M150 330h60l170-80v240l-170-80h-60z"/><rect class="ink" x="190" y="410" width="30" height="60" rx="8"/><path id="mw" class="s-gain" d="M420 320a70 70 0 0 1 0 100M450 290a110 110 0 0 1 0 160" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="ap0"><circle cx="700" cy="370" r="80" fill="var(--stage)" class="s-ink" stroke-width="5"/><path class="s-ink" d="M660 400L700 330L740 400Z" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="660" cy="400" r="10"/><circle class="ink" cx="700" cy="330" r="10"/><circle class="ink" cx="740" cy="400" r="10"/><text class="m" x="700" y="490" font-size="22" text-anchor="middle">LOGIC</text></g>
<g id="ap1"><circle cx="980" cy="370" r="80" fill="var(--stage)" class="s-ink" stroke-width="5"/><path class="gain" d="M980 415C920 375 915 330 948 322C964 318 976 330 980 342C984 330 996 318 1012 322C1045 330 1040 375 980 415Z"/><text class="m" x="980" y="490" font-size="22" text-anchor="middle">EMOTION</text></g>
<g id="ap2"><circle cx="1260" cy="370" r="80" fill="var(--stage)" class="s-ink" stroke-width="5"/><polygon class="ink" points="1260,325 1272.9,357.2 1307.6,359.5 1280.9,381.8 1289.4,415.5 1260,397 1230.6,415.5 1239.1,381.8 1212.4,359.5 1247.1,357.2"/><text class="m" x="1260" y="490" font-size="22" text-anchor="middle">CREDIBILITY</text></g>
<g id="cr"></g>
<g id="commit"><text class="d" x="120" y="820" font-size="48">People commit, not merely comply.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">5. Execute.</text>
<text class="b" x="120" y="176" font-size="32">Then comes the actual work.</text>
<g id="cal"><rect class="s-ink" x="120" y="240" width="580" height="400" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="120" y="240" width="580" height="40"/><text class="m" x="140" y="268" font-size="20" style="fill:var(--stage)">THIS WEEK</text><g id="cg"></g><g id="cm"></g></g>
<g id="shd"><path class="gain" d="M1090 300L1210 340V440C1210 520 1150 560 1090 590C1030 560 970 520 970 440V340Z"/><path d="M1040 440l35 35 65-70" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1090" y="640" font-size="20" text-anchor="middle">FEWER MEETINGS · MORE FOCUS</text></g>
<g id="close"><path class="s-line" d="M160 760H1440" stroke-width="6" stroke-linecap="round"/><g id="dots"></g><path class="loss" d="M1000 735l24 40h-48z"/><circle id="spot" class="s-gain" cx="1000" cy="760" r="42" fill="none" stroke-width="5"/>
<text class="m" x="120" y="840" font-size="20">STAY CLOSE TO THE WORK · SPOT PROBLEMS EARLY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">6. Learn.</text>
<text class="b" x="120" y="176" font-size="32">Look back at what worked and what didn’t.</text>
<g id="cards"></g>
<g id="mag"><circle r="70" fill="var(--stage)" fill-opacity=".35" class="s-ink" stroke-width="10"/><path class="s-ink" d="M50 50L118 118" stroke-width="18" stroke-linecap="round"/></g>
<g id="rw"><text class="d" x="120" y="570" font-size="52">Were you right, or wrong?</text></g>
<g id="lp"><path id="arc" class="s-gain" d="M1280 540A120 120 0 1 1 1160 660" pathLength="100" stroke-dasharray="100" fill="none" stroke-width="10" stroke-linecap="round"/><path id="ah" class="s-gain" d="M1140 676l20-26 20 26" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1280" y="652" font-size="22" text-anchor="middle">AGAIN,</text><text class="m" x="1280" y="686" font-size="22" text-anchor="middle" style="fill:var(--gain)">WISER</text>
<text class="m" x="1280" y="830" font-size="20" text-anchor="middle">ADMIT IT OPENLY</text></g>
<g id="blame"><text class="m" x="120" y="650" font-size="20">WITHOUT CANDOR</text>
<rect class="gain" x="120" y="680" width="330" height="90" rx="45"/><text class="d5" x="285" y="738" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Learning</text>
<path class="s-muted" d="M480 725h60m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="loss" x="580" y="680" width="280" height="90" rx="45"/><text class="d5" x="720" y="738" font-size="40" text-anchor="middle" style="fill:var(--stage)">Blame</text></g>
<line id="lstrike" class="s-loss" x1="140" y1="725" x2="430" y2="725" stroke-width="7" stroke-linecap="round"/>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Your last big decision:</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">which step did you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">rush or <tspan style="fill:var(--gain)">skip</tspan>?</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">ONE CANDID CONVERSATION CAN FIX IT</text></g>
<g id="qw"></g>
</g>