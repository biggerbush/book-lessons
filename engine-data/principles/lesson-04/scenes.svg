<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The five-step loop</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to your goals.</text>
<text class="b" x="120" y="600" font-size="32">Five steps that turn any goal into steady progress.</text>
<circle id="tdot" class="gain" r="14"/>
<g id="tl"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step one: choose clear goals.</text>
<text class="b" x="120" y="176" font-size="32">Goals are what you truly want. Desires pull you away.</text>
<g id="tg">
<circle class="s-ink" cx="360" cy="480" r="150" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="360" cy="480" r="100" fill="none" stroke-width="6"/>
<circle class="gain" cx="360" cy="480" r="50"/>
<g id="dart"><path class="s-ink" d="M366 474L520 320" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M498 318l22 2 2-22M484 332l22 2 2-22" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<text class="m" x="360" y="680" font-size="22" text-anchor="middle">CLEAR GOAL</text>
</g>
<g id="fk">
<path class="s-gain" d="M800 610C800 520 640 500 530 495" fill="none" stroke-width="7" stroke-linecap="round"/>
<path class="s-loss" d="M800 610C800 520 900 470 950 420" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 12"/>
<g id="fkp"></g>
</g>
<g id="ds"><g id="dsb">
<circle class="loss" cx="960" cy="372" r="18"/><circle class="loss" cx="1012" cy="400" r="14"/><circle class="loss" cx="1004" cy="340" r="12"/>
</g><text class="m" x="985" y="300" font-size="22" text-anchor="middle" style="fill:var(--loss)">DESIRES</text></g>
<g id="mn">
<rect class="s-ink" x="1110" y="240" width="370" height="440" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1295" y="288" font-size="22" text-anchor="middle">PRIORITIZE</text>
<g id="mnI"></g>
</g>
<g id="mnc"><text class="d5" x="120" y="800" font-size="40">You can have almost anything, but not everything.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step two: spot the problems.</text>
<text class="b" x="120" y="176" font-size="32">What stands between you and your goal?</text>
<path class="s-line" d="M120 520H1480M120 600H1480" stroke-width="6"/>
<path class="s-line" d="M120 560H1480" stroke-width="4" stroke-dasharray="20 20"/>
<g id="rp"></g>
<path class="s-ink" d="M1400 600V380" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M1400 380L1470 405L1400 430Z"/>
<text class="m" x="1400" y="640" font-size="20" text-anchor="middle">GOAL</text>
<g id="rb">
<path class="s-ink" d="M660 510V600M780 510V600" stroke-width="6" stroke-linecap="round"/>
<rect class="loss" x="630" y="470" width="180" height="44" rx="6"/>
<path d="M666 470l-22 44M716 470l-22 44M766 470l-22 44M806 476l-18 38" stroke="var(--stage)" stroke-width="10"/>
<text class="m" x="720" y="450" font-size="20" text-anchor="middle" style="fill:var(--loss)">PROBLEM</text>
</g>
<g id="fl">
<polygon class="gain" points="510,746 1200,680 1200,820 510,778" fill-opacity=".18"/>
<rect class="ink" x="380" y="742" width="110" height="40" rx="8"/>
<path class="ink" d="M490 734h20v56h-20z"/>
</g>
<g id="rk"></g>
<g id="rf"><path class="s-ink" d="M1140 766V700" stroke-width="4"/><path class="loss" d="M1140 700l46 16-46 16z"/></g>
<g id="rft"><text class="m" x="560" y="680" font-size="20">DON'T TOLERATE EVEN SMALL ONES</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step three: diagnose.</text>
<text class="b" x="120" y="176" font-size="32">Ask why, then ask why again.</text>
<path class="s-ink" d="M120 402H560" stroke-width="5"/>
<g id="trn"><g id="trm">
<rect class="ink" x="190" y="300" width="220" height="80" rx="14"/>
<rect x="214" y="318" width="40" height="28" rx="4" fill="var(--stage)"/><rect x="274" y="318" width="40" height="28" rx="4" fill="var(--stage)"/><rect x="334" y="318" width="40" height="28" rx="4" fill="var(--stage)"/>
<circle class="s-ink" cx="240" cy="388" r="12" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="360" cy="388" r="12" fill="var(--stage)" stroke-width="5"/>
</g></g>
<g id="trp"><text class="m" x="120" y="444" font-size="20">MISSED IT</text></g>
<g id="tt">
<rect class="s-ink" x="120" y="480" width="440" height="240" rx="12" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="150" y="522" font-size="20">SCHEDULE</text>
<g id="ttr"></g>
<text class="m" x="340" y="702" font-size="22" text-anchor="middle" style="fill:var(--loss)">NOT CHECKED</text>
</g>
<g id="tre">
<path class="s-line" d="M640 560H1480" stroke-width="5"/>
<rect class="ink" x="1015" y="390" width="50" height="170"/>
<circle cx="1040" cy="300" r="100" fill="var(--line)"/>
<g id="pd"></g>
<text class="m" x="1170" y="306" font-size="20">PROBLEM: MISSED TRAIN</text>
</g>
<path id="lk" class="s-muted" d="M570 600C720 600 880 470 1000 470" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<g id="px"><text class="m" x="1110" y="440" font-size="20">PROXIMATE CAUSE</text><text class="d5" x="1110" y="490" font-size="38">didn't check</text></g>
<g id="pv"><text class="m" x="1110" y="526" font-size="20" style="fill:var(--gain)">USUALLY A VERB</text></g>
<g id="why"><text class="d" x="640" y="690" font-size="60" style="fill:var(--loss)">Why?</text></g>
<g id="rts" fill="none" stroke-width="8" stroke-linecap="round"><path d="M1040 560C1040 620 960 640 920 720"/><path d="M1040 560V740"/><path d="M1040 560C1040 620 1120 640 1150 710"/></g>
<g id="rc"><text class="m" x="1180" y="640" font-size="20">ROOT CAUSE</text><text class="d5" x="1180" y="690" font-size="38" style="fill:var(--loss)">forgetful</text></g>
<g id="rv"><text class="m" x="1180" y="726" font-size="20" style="fill:var(--gain)">USUALLY AN ADJECTIVE</text></g>
<g id="fx"><text class="d" x="120" y="830" font-size="44">Fix the root, and a family of problems disappears.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step four: design a plan.</text>
<text class="b" x="120" y="176" font-size="32">Work around the root cause.</text>
<g id="bp">
<rect class="s-ink" x="120" y="230" width="440" height="440" rx="12" fill="var(--stage)" stroke-width="5"/>
<g id="bpg"></g>
<rect class="loss" x="300" y="420" width="120" height="90" rx="8"/>
<text class="m" x="360" y="472" font-size="20" text-anchor="middle" style="fill:var(--stage)">ROOT</text>
<path id="route" class="s-gain" d="M170 620H240V340H500V290" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
<circle class="ink" cx="170" cy="620" r="10"/><circle class="gain" cx="500" cy="280" r="16"/>
<text class="m" x="120" y="710" font-size="20">PLAN AROUND THE ROOT</text>
</g>
<g id="fs"></g>
<g id="fsl"><text class="m" x="640" y="478" font-size="20">LIKE A MOVIE SCRIPT</text></g>
<g id="nb">
<rect class="s-ink" x="640" y="510" width="840" height="260" rx="12" fill="var(--stage)" stroke-width="5"/>
<g id="nbI"></g>
<text class="m" x="1220" y="580" font-size="20">PROGRESS</text>
<rect class="s-ink" x="1220" y="600" width="220" height="28" rx="14" fill="none" stroke-width="4"/>
<rect id="pg" class="gain" x="1220" y="600" height="28" rx="14" width="0"/>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step five: push it through.</text>
<text class="b" x="120" y="176" font-size="32">Turn the plan into results.</text>
<path class="s-ink" d="M120 620H900" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M880 620V400" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M880 400l70 24-70 24z"/>
<text class="m" x="880" y="660" font-size="20" text-anchor="middle">RESULTS</text>
<g id="rg0"><g id="rg">
<path class="s-line" d="M140 500h50M120 540h60" stroke-width="5" stroke-linecap="round"/>
<rect class="gain" x="300" y="520" width="140" height="100" rx="10"/>
<text class="m" x="370" y="580" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">PLAN</text>
<path class="s-ink" d="M268 520L300 548" stroke-width="8" stroke-linecap="round"/>
</g></g>
<g id="ga">
<path class="s-line" d="M1060 620A200 200 0 0 1 1460 620" fill="none" stroke-width="30"/>
<path class="s-gain" d="M1350.8 441.8A200 200 0 0 1 1460 620" fill="none" stroke-width="30"/>
<line id="ndl" class="s-ink" x1="1260" y1="620" x2="1090" y2="620" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1260" cy="620" r="16"/>
<text class="m" x="1060" y="670" font-size="20" text-anchor="middle">OFF TRACK</text>
<text class="m" x="1475" y="670" font-size="20" text-anchor="end" style="fill:var(--gain)">ON TRACK</text>
</g>
<g id="gal"><text class="m" x="1260" y="730" font-size="22" text-anchor="middle">CLEAR METRICS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then run it again.</text>
<text class="b" x="120" y="176" font-size="32">Each pass makes the loop sharper.</text>
<circle id="lpd" class="gain" r="14"/>
<g id="lp"></g>
<g id="tg0"><text class="m" x="660" y="420" font-size="24" style="fill:var(--gain)">+ SHARPER GOALS</text></g>
<g id="tg1"><text class="m" x="660" y="490" font-size="24" style="fill:var(--gain)">+ NEW PROBLEMS</text></g>
<g id="tg2"><text class="m" x="660" y="560" font-size="24" style="fill:var(--gain)">+ BETTER PLANS</text></g>
<g id="st"><path class="s-ink" d="M1230 260V744" stroke-width="8" stroke-linecap="round"/></g>
<circle id="clb" class="gain" r="14"/>
<g id="stl"><text class="m" x="1230" y="790" font-size="20" text-anchor="middle">EVERY CYCLE, A LITTLE HIGHER</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Know your weak step.</text>
<text class="b" x="120" y="176" font-size="32">Very few people are strong at all five steps.</text>
<g id="bx"></g>
<g id="bars"></g>
<g id="ba">
<path class="s-loss" d="M245 680H800" stroke-width="8" stroke-linecap="round"/>
<path class="s-loss" d="M800 666l14 14-14 14M860 666l-14 14 14 14" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-loss" d="M860 680H1330M1330 664l24 16-24 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 14" opacity=".5"/>
<text class="m" x="120" y="730" font-size="20" style="fill:var(--loss)">BOLD GOALS, NO FOLLOW-THROUGH</text>
</g>
<g id="lgd">
<rect class="ink" x="120" y="756" width="22" height="22"/><text class="m" x="152" y="775" font-size="20">YOU</text>
<rect class="gain" x="230" y="756" width="22" height="22"/><text class="m" x="262" y="775" font-size="20">TEAMMATE</text>
</g>
<g id="tcap"><text class="d" x="120" y="840" font-size="40">Find people strong where you are weak.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one goal this week.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Which step do you skip,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and who could <tspan style="fill:var(--gain)">help</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">RUN THE FIVE-STEP LOOP</text>
<g id="cl"></g>
<circle id="hlp" class="gain" r="14"/>
</g>