<g id="s0">
<text class="m" x="120" y="150" font-size="28">HIDDEN POTENTIAL · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Turn practice into</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">play and detours.</text>
