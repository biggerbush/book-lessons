<g id="wall2"></g>
<g id="wl2"><text class="m" x="1000" y="270" font-size="20" text-anchor="middle">BUSY · SATISFIED · IGNORING YOU</text></g>
<g id="ads2"></g>
<g id="bnc2"><text class="d" x="120" y="800" font-size="48">Messages aimed at them bounce off.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the sneezers.</text>
<text class="b" x="120" y="176" font-size="32">They spread the ideas they love without being asked.</text>
