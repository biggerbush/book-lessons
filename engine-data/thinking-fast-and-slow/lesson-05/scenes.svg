<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Losses hurt more</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">than gains.</text>
<text class="b" x="120" y="600" font-size="32">Why losing 100 dollars stings more than winning 100 delights.</text>
<g id="coinW"><g id="coin"><circle class="gain" r="100"/><circle r="78" fill="none" stroke="var(--on-gain)" stroke-width="6"/><text id="cointx" class="d" y="30" font-size="88" text-anchor="middle" style="fill:var(--on-gain)">$</text></g></g>
<g id="cT"><rect x="1200" y="500" width="280" height="70" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="1224" y="543" font-size="20">TAILS</text><text class="d" x="1458" y="548" font-size="36" text-anchor="end" style="fill:var(--loss)">−$100</text></g>
<g id="cH"><rect x="1200" y="600" width="280" height="70" rx="14" fill="var(--stage)" stroke="var(--gain)" stroke-width="5"/><text class="m" x="1224" y="643" font-size="20">HEADS</text><text class="d" x="1458" y="648" font-size="36" text-anchor="end" style="fill:var(--gain)">+$150</text></g>
<g id="bet"><text class="d" x="1340" y="760" font-size="40" text-anchor="middle">Take the bet?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most people refuse.</text>
<text class="b" x="120" y="176" font-size="32">Even though the odds favor them.</text>
<g id="crowd"></g>
<g id="crl"><text class="m" x="120" y="640" font-size="22">MOST PEOPLE SAY NO</text></g>
<g id="qm"><text class="m" x="1100" y="225" font-size="22" text-anchor="middle" style="fill:var(--gain)">WHAT WIN WOULD BALANCE IT?</text></g>
<g id="sc">
<path class="s-ink" d="M1100 320V760M1000 760H1200" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M-230 0H230" stroke-width="10" stroke-linecap="round"/></g>
<circle class="ink" cx="1100" cy="320" r="14"/>
<g id="panL"><path class="s-ink" d="M0 0L-100 140M0 0L100 140" stroke-width="3"/><path class="ink" d="M-100 140h200l-30 26h-140z"/><rect class="loss" x="-70" y="70" width="140" height="70" rx="10"/><text class="d" y="118" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">−$100</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-100 140M0 0L100 140" stroke-width="3"/><path class="ink" d="M-100 140h200l-30 26h-140z"/><rect class="gain" x="-70" y="70" width="140" height="70" rx="10"/><text id="wtR" class="d" y="118" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">+$150</text></g>
</g>
<g id="cap1"><text class="d" x="120" y="830" font-size="44">About $200: roughly double the loss.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Loss aversion.</text>
<text class="b" x="120" y="176" font-size="32">A loss feels about twice as painful as an equal gain feels good.</text>
<g id="f0"><circle cx="200" cy="320" r="60" fill="none" class="s-gain" stroke-width="7"/><circle class="gain" cx="180" cy="305" r="7"/><circle class="gain" cx="220" cy="305" r="7"/><path class="s-gain" d="M172 336q28 26 56 0" fill="none" stroke-width="7" stroke-linecap="round"/><text class="m" x="300" y="280" font-size="20">A GAIN</text><rect id="bg" class="gain" x="300" y="295" width="0" height="50" rx="10"/><text id="xg" class="d" x="320" y="336" font-size="40" style="fill:var(--gain)">1×</text></g>
<g id="f1"><circle cx="200" cy="470" r="60" fill="none" class="s-loss" stroke-width="7"/><circle class="loss" cx="180" cy="455" r="7"/><circle class="loss" cx="220" cy="455" r="7"/><path class="s-loss" d="M172 502q28-26 56 0" fill="none" stroke-width="7" stroke-linecap="round"/><text class="m" x="300" y="430" font-size="20">AN EQUAL LOSS</text><rect id="bl" class="loss" x="300" y="445" width="0" height="50" rx="10"/><text id="xl" class="d" x="320" y="486" font-size="40" style="fill:var(--loss)">≈2×</text></g>
<g id="quote"><rect class="s-line" x="120" y="600" width="1360" height="180" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="gain" x="120" y="600" width="14" height="180"/><text class="d" x="170" y="695" font-size="56">“Losses loom larger than gains.”</text><text class="m" x="172" y="748" font-size="20">DANIEL KAHNEMAN</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Jack and Jill.</text>
<text class="b" x="120" y="176" font-size="32">Two people from the book.</text>
<path class="s-ink" d="M330 720H690M1050 720H1410" stroke-width="5" stroke-linecap="round"/>
<g id="jk"><g id="jkp"></g><text class="d5" x="220" y="790" font-size="44" text-anchor="middle">Jack</text></g>
<g id="jl"><g id="jlp"></g><text class="d5" x="940" y="790" font-size="44" text-anchor="middle">Jill</text></g>
<g id="td"><rect class="ink" x="540" y="520" width="120" height="200"/><text class="d" x="600" y="505" font-size="32" text-anchor="middle">$5M</text><text class="m" x="600" y="760" font-size="20" text-anchor="middle">TODAY</text>
<rect class="ink" x="1260" y="520" width="120" height="200"/><text class="d" x="1320" y="505" font-size="32" text-anchor="middle">$5M</text><text class="m" x="1320" y="760" font-size="20" text-anchor="middle">TODAY</text></g>
<g id="yd"><rect x="360" y="680" width="120" height="40" fill="var(--muted)" fill-opacity=".5"/><text class="d" x="420" y="665" font-size="32" text-anchor="middle">$1M</text><text class="m" x="420" y="760" font-size="20" text-anchor="middle">YESTERDAY</text>
<rect x="1080" y="360" width="120" height="360" fill="var(--muted)" fill-opacity=".5"/><text class="d" x="1140" y="345" font-size="32" text-anchor="middle">$9M</text><text class="m" x="1140" y="760" font-size="20" text-anchor="middle">YESTERDAY</text></g>
<text id="eq" class="d" x="800" y="560" font-size="80" text-anchor="middle" style="fill:var(--muted)">=?</text>
<g id="fk"><text class="d" x="220" y="480" font-size="48" text-anchor="middle" style="fill:var(--gain)">Lucky</text></g>
<g id="fl"><text class="d" x="940" y="480" font-size="48" text-anchor="middle" style="fill:var(--loss)">Crushed</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The reference point.</text>
<text class="b" x="120" y="176" font-size="32">Prospect theory, by Kahneman and Amos Tversky.</text>
<g id="end"><path class="s-muted" d="M800 380V536M800 590V680" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="800" y="360" font-size="20" text-anchor="middle">WHERE WE END UP</text></g>
<g id="nl"><path class="s-ink" d="M200 520H1400" stroke-width="6" stroke-linecap="round"/><g id="ticks"></g>
<text class="m" x="320" y="565" font-size="20" text-anchor="middle">$1M</text><text class="m" x="800" y="572" font-size="20" text-anchor="middle">$5M</text><text class="m" x="1280" y="565" font-size="20" text-anchor="middle">$9M</text><text class="m" x="1400" y="495" font-size="20" text-anchor="end">WEALTH</text></g>
<g id="arr">
<circle class="gain" cx="320" cy="440" r="12"/><line id="aJ" class="s-gain" x1="320" y1="440" x2="320" y2="440" stroke-width="8" stroke-linecap="round"/><path id="hJ" class="s-gain" d="M-18-14L0 0L-18 14" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="loss" cx="1280" cy="610" r="12"/><line id="aL" class="s-loss" x1="1280" y1="610" x2="1280" y2="610" stroke-width="8" stroke-linecap="round"/><path id="hL" class="s-loss" d="M-18-14L0 0L-18 14" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="320" y="410" font-size="20" text-anchor="middle">REFERENCE POINT</text><text class="m" x="1280" y="655" font-size="20" text-anchor="middle">REFERENCE POINT</text>
</g>
<g id="albl"><text class="m" x="560" y="410" font-size="22" text-anchor="middle" style="fill:var(--gain)">JACK · GAIN</text><text class="m" x="1045" y="660" font-size="22" text-anchor="middle" style="fill:var(--loss)">JILL · LOSS</text></g>
<g id="same"><text class="d" x="120" y="790" font-size="52">Same 5 million, opposite feelings.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feelings flatten out.</text>
<text class="b" x="120" y="176" font-size="32">The same 100 dollars feels smaller as amounts grow.</text>
<g id="st1"><text class="d5" x="120" y="320" font-size="44">$100 → $200</text><rect id="b1" class="gain" x="120" y="350" width="0" height="40" rx="10"/><text class="m" x="120" y="430" font-size="20">FEELS LIKE A BIG JUMP</text></g>
<g id="st2"><text class="d5" x="120" y="540" font-size="44">$900 → $1000</text><rect id="b2" class="gain" x="120" y="570" width="0" height="40" rx="10"/><text class="m" x="120" y="650" font-size="20">SAME $100, FEELS SMALLER</text></g>
<g id="axes"><path class="s-muted" d="M820 520H1460M1140 260V780" stroke-width="4"/>
<text class="m" x="1460" y="556" font-size="20" text-anchor="end">GAINS</text><text class="m" x="820" y="500" font-size="20">LOSSES</text><text class="m" x="1156" y="280" font-size="20">GOOD</text><text class="m" x="1156" y="776" font-size="20">BAD</text></g>
<path id="curveP" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
<g id="cap5"><text class="d" x="120" y="760" font-size="34">Feelings flatten as amounts grow.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it holds us back.</text>
<text class="b" x="120" y="176" font-size="32">Once it kept us alive. Today it can keep us stuck.</text>
<path class="s-line" d="M760 240V760" stroke-width="3"/>
<g id="then"><text class="m" x="120" y="260" font-size="22">THEN</text>
<path class="gain" d="M430 300L560 340V450Q560 570 430 630Q300 570 300 450V340Z"/><g id="shp"></g>
<g id="thr"><path class="s-loss" d="M140 400h110m-20-16 20 16-20 16M140 460h110m-20-16 20 16-20 16M140 520h110m-20-16 20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="m" x="120" y="700" font-size="20">TREATING THREATS AS URGENT</text><text class="m" x="120" y="735" font-size="20">HELPED CREATURES SURVIVE</text></g>
<g id="now"><text class="m" x="800" y="260" font-size="22">NOW</text>
<circle id="ring" class="s-loss" cx="980" cy="460" r="100" fill="none" stroke-width="6" stroke-dasharray="14 10"/><g id="stp"></g>
<text class="m" x="980" y="600" font-size="22" text-anchor="middle" style="fill:var(--loss)">STUCK</text></g>
<g id="chips"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Think in bundles.</text>
<text class="b" x="120" y="176" font-size="32">See each risk as one of many.</text>
<g id="coins"></g>
<g id="chart"><path class="s-muted" d="M720 560H1480" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="720" y="595" font-size="20">BREAK EVEN</text>
<path id="cum" class="s-gain" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="ahead"><text class="m" x="1480" y="250" font-size="22" text-anchor="end" style="fill:var(--gain)">ALMOST SURELY AHEAD</text></g>
<g id="mantra"><text class="d" x="120" y="820" font-size="52">You win a few, you lose a few.</text></g>
</g>

<g id="s8" opacity="0">
<g id="ya"><text class="d5" x="136" y="250" font-size="52">One small, favorable risk you avoided…</text></g>
<g id="qa"><text class="d" x="136" y="390" font-size="88" letter-spacing="-2">Would you take it</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">if it were one</text></g>
<g id="qc"><text class="d" x="136" y="590" font-size="88" letter-spacing="-2">of a <tspan style="fill:var(--gain)">hundred?</tspan></text></g>
<g id="dgrid"><rect class="s-line" x="1080" y="290" width="400" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><g id="dots"></g></g>
<g id="g100"><text class="m" x="1280" y="730" font-size="22" text-anchor="middle"><tspan style="fill:var(--gain)">1</tspan> OF 100 BETS</text></g>
<text class="m" x="140" y="820" font-size="26">YOU WIN A FEW, YOU LOSE A FEW</text>
</g>