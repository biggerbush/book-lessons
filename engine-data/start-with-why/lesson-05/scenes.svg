<g id="glance"><text class="d" x="900" y="790" font-size="40">Anyone can tell.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="64">Trust grows when words match deeds.</text>
<text class="b" x="120" y="176" font-size="32">Say one thing, do the same thing, again and again.</text>
<g id="pil"><text class="d" x="210" y="310" font-size="40" text-anchor="middle">SAY</text><rect class="ink" x="160" y="330" width="100" height="230"/><text class="d" x="1390" y="310" font-size="40" text-anchor="middle">DO</text><rect class="ink" x="1340" y="330" width="100" height="230"/><path class="s-line" d="M210 330Q800 380 1390 330" fill="none" stroke-width="4"/><text class="m" x="210" y="606" font-size="24" text-anchor="middle">CUSTOMERS</text></g>
<g id="planks"></g>
<g id="walk"></g>
<g id="blv"><text class="m" x="1390" y="606" font-size="24" text-anchor="middle" style="fill:var(--gain)">BELIEVERS</text></g>
<g id="cal"></g>
<g id="calt"><text class="d5" x="1120" y="690" font-size="30">Check one decision</text><text class="d5" x="1120" y="730" font-size="30">against your why,</text><text class="d5" x="1120" y="770" font-size="30">not just your budget.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="84" letter-spacing="-2">Look at your cart of</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="84" letter-spacing="-2">daily choices. What would</text></g>
<g id="qc"><text class="d" x="136" y="550" font-size="84" letter-spacing="-2">they say you <tspan style="fill:var(--gain)">believe?</tspan></text></g>
<g id="oddq"><text class="m" x="143" y="700" font-size="26">WHICH ONE ITEM DOES NOT BELONG?</text></g>
