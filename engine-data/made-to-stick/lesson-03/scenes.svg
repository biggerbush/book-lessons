<g id="cd0"><rect class="s-loss" x="780" y="250" width="460" height="90" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="810" y="304" font-size="22">TEAM 1: ONE ANSWER</text></g>
<g id="cd1"><rect class="s-loss" x="780" y="370" width="460" height="90" rx="14" fill="var(--stage)" stroke-width="4"/><text class="m" x="810" y="424" font-size="22">TEAM 2: A DIFFERENT ANSWER</text></g>
