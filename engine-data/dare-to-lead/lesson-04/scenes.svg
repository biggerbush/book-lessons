<g id="ck"></g>
<g id="match"><text class="d" x="120" y="820" font-size="46">Ask until both pictures match.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Clear, not cruel.</text>
<text class="b" x="120" y="176" font-size="32">Not harsh, not blunt for its own sake.</text>
