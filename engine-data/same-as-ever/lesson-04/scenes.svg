<g id="n2"><circle class="gain" cx="1060" cy="520" r="34"/><path d="M1044 520l12 12 22-24" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1060" y="590" font-size="20" text-anchor="middle">A CHANGE</text></g>
