<g id="oth4"></g>
<g id="t4a"><rect x="760" y="300" width="300" height="120" rx="50" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><text class="d5" x="910" y="370" font-size="30" text-anchor="middle">You're too much.</text><circle cx="905" cy="450" r="12" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><circle cx="910" cy="490" r="7" fill="var(--muted)"/></g>
<g id="t4b"><rect x="1110" y="300" width="370" height="120" rx="50" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><text class="d5" x="1295" y="370" font-size="30" text-anchor="middle">Your idea will fail.</text><circle cx="1290" cy="450" r="12" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><circle cx="1295" cy="490" r="7" fill="var(--muted)"/></g>
