<text id="lsm" class="m" x="1120" y="760" font-size="20" style="fill:var(--gain)">THE LIST SAYS MORE</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tracking is a mirror.</text>
<g id="aw"><text class="b" x="120" y="176" font-size="32">Recording a behaviour makes you aware of it.</text></g>
