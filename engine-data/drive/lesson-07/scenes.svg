<path id="bry" class="s-gain" d="M1000 545v-20M947 567l-14-14M1053 567l14-14M925 620h-20M1075 620h20" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="840" y="790" font-size="32">Inventing something</text><text class="d5" x="840" y="832" font-size="32">that makes life easier</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Better than yesterday.</text>
<text class="b" x="120" y="176" font-size="32">Your big sentence needs a small daily partner.</text>
<g id="cal"><rect class="s-ink" x="120" y="230" width="500" height="380" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="120" y="230" width="500" height="60" rx="16"/><rect class="ink" x="120" y="262" width="500" height="28"/>
<g id="cells"></g><text id="tq" class="d" x="372" y="490" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="qq"><text class="d" x="700" y="300" font-size="56">Was I better today</text><text class="d" x="700" y="370" font-size="56">than yesterday<tspan style="fill:var(--gain)">?</tspan></text></g>
