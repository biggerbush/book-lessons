<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Mountain</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Is You.</text>
<text class="b" x="120" y="600" font-size="32">The biggest obstacle in your way might be you.</text>
<path class="s-line" d="M860 780H1480" stroke-width="5"/>
<polygon class="s-ink" points="1000,780 1250,260 1480,780" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<g id="fc"><circle class="gain" cx="1250" cy="600" r="80"/><path class="ink" d="M1164 610a86 86 0 0 1 172 0q-40-56-86-46q-46-10-86 46z"/><circle class="ink" cx="1222" cy="604" r="10"/><circle class="ink" cx="1278" cy="604" r="10"/><path class="s-ink" d="M1218 632q32 26 64 0" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="cl"><path d="M842 470a30 30 0 0 1 8-58a40 40 0 0 1 78-6a32 32 0 0 1 28 64z" fill="var(--line)"/><path id="rn" class="s-loss" d="M870 490l-8 24M905 490l-8 24M940 490l-8 24" stroke-width="5" stroke-linecap="round"/></g>
<g id="hk"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The same wall, again.</text>
<text class="b" x="120" y="176" font-size="32">New scenery. The same familiar problem.</text>
<g id="cal"><rect x="120" y="240" width="400" height="460" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><rect class="ink" x="120" y="240" width="400" height="56" rx="14"/><text class="m" x="140" y="276" font-size="20" style="fill:var(--stage)">SAME PROBLEM, EVERY TIME</text><g id="cells"></g></g>
<g id="rows"></g>
<g id="fam"><text class="d" x="120" y="820" font-size="46">The scenery changes. The wall looks familiar.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s rarely your circumstances.</text>
<text class="b" x="120" y="176" font-size="32">Wiest: it’s usually our own patterns, on repeat.</text>
<g id="mt2"><polygon points="560,830 980,230 1400,830" fill="none" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/><text class="d" x="980" y="800" font-size="44" text-anchor="middle" style="fill:var(--loss)">That is the mountain.</text></g>
<g id="bk"><rect class="gain" x="150" y="290" width="200" height="260" rx="8"/><rect class="ink" x="150" y="290" width="24" height="260"/><text class="m" x="196" y="360" font-size="18" style="fill:var(--on-gain)">THE</text><text class="m" x="196" y="390" font-size="18" style="fill:var(--on-gain)">MOUNTAIN</text><text class="m" x="196" y="420" font-size="18" style="fill:var(--on-gain)">IS YOU</text><text class="m" x="150" y="590" font-size="20">BRIANNA WIEST</text></g>
<g id="cs"><rect x="150" y="650" width="280" height="60" rx="30" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><text class="m" x="290" y="688" font-size="20" text-anchor="middle">CIRCUMSTANCES</text><line id="cst" x1="160" y1="680" x2="160" y2="680" stroke="var(--loss)" stroke-width="6" stroke-linecap="round"/></g>
<circle id="lpc" class="s-line" cx="980" cy="520" r="170" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="ld" class="gain" r="14"/>
<g id="ln"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">What we want vs. what we do.</text>
<text class="b" x="120" y="176" font-size="32">Part of us moves forward. Part of us pulls back.</text>
<g id="tg"><path d="M860 340H1220m-24-24 24 24-24 24" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1220" y="310" font-size="22" text-anchor="end" style="fill:var(--gain)">WHAT WE WANT</text><path d="M740 340H380m24-24-24 24 24 24" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="380" y="310" font-size="22" style="fill:var(--loss)">WHAT WE DO</text><g id="tp"></g></g>
<g id="ca"><rect x="120" y="450" width="660" height="300" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><rect class="ink" x="190" y="500" width="100" height="22" rx="6"/><rect x="175" y="525" width="130" height="190" rx="24" fill="none" stroke="var(--ink)" stroke-width="6"/><g id="jc"></g>
<text class="m" x="360" y="530" font-size="22" style="fill:var(--gain)">WANTS</text><text class="d5" x="360" y="572" font-size="32">Financial security</text><text class="m" x="360" y="640" font-size="20" style="fill:var(--loss)">DOES, WHEN STRESSED</text><text class="d5" x="360" y="682" font-size="32">Spends on impulse</text></g>
<g id="cb"><rect x="820" y="450" width="660" height="300" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><path id="hl" class="gain" d="M940 700C860 650 850 580 885 555C910 538 932 555 940 575Z"/><path id="hr" class="gain" d="M940 700C1020 650 1030 580 995 555C970 538 948 555 940 575Z"/>
<text class="m" x="1060" y="530" font-size="22" style="fill:var(--gain)">WANTS</text><text class="d5" x="1060" y="572" font-size="32">Closeness</text><text class="m" x="1060" y="640" font-size="20" style="fill:var(--loss)">DOES, WHEN IT GETS SERIOUS</text><text class="d5" x="1060" y="682" font-size="32">Pulls away</text></g>
<g id="pl"><text class="d" x="120" y="830" font-size="42">One foot on the gas, one on the brake.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hidden in plain sight.</text>
<text class="b" x="120" y="176" font-size="32">Patterns feel normal, so we point outward instead.</text>
<polygon class="s-ink" points="900,760 1180,320 1460,760" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<g id="fg"></g>
<ellipse id="orb" cx="1180" cy="780" rx="290" ry="40" fill="none" stroke="var(--loss)" stroke-width="5" stroke-dasharray="12 10"/>
<circle id="wk" class="loss" r="14"/>
<g id="bper"></g>
<g id="blm"></g>
<g id="crc"><text class="d" x="120" y="840" font-size="40">Blaming keeps us circling the base.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Good news in disguise.</text>
<text class="b" x="120" y="176" font-size="32">If the mountain is you, the power to climb it is yours too.</text>
<g id="kw"><g id="ky"><circle cx="-120" cy="0" r="60" fill="none" stroke="var(--gain)" stroke-width="18"/><path d="M-60 0H200M150 0v44M200 0v44M110 0v30" stroke="var(--gain)" stroke-width="18" stroke-linecap="round"/></g></g>
<g id="kc"><text class="m" x="120" y="600" font-size="22" style="fill:var(--gain)">THE POWER TO CLIMB IS YOURS</text></g>
<g id="co"><circle cx="1100" cy="520" r="300" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="1100" y="300" font-size="22" text-anchor="middle">THE ECONOMY</text><text class="m" x="1100" y="770" font-size="22" text-anchor="middle">OTHER PEOPLE</text></g>
<g id="ci"><circle id="cir" class="gain" cx="1100" cy="520" r="150"/><text class="d" x="1100" y="512" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">Your</text><text class="d" x="1100" y="562" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">choices</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The climb changes you.</text>
<text class="b" x="120" y="176" font-size="32">Wiest frames the climb itself as the point.</text>
<polygon class="s-ink" points="620,820 1040,280 1460,820" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<polyline class="s-muted" points="700,800 1300,690 860,570 1180,470 1010,410" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linejoin="round"/>
<g id="mkr"></g>
<g id="fl"><path class="s-ink" d="M1040 282V196" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1043 196l64 22-64 22z"/></g>
<g id="hk6"><rect id="bp" class="gain" x="8" y="-40" width="18" height="28" rx="5"/></g>
<g id="l1"><text class="m" x="120" y="300" font-size="20">THE CLIMB IS THE POINT</text></g>
<g id="l2"><text class="m" x="120" y="350" font-size="20" style="fill:var(--gain)">EACH STEP TEACHES YOU HOW YOU WORK</text></g>
<g id="cmp"><path d="M275 620H385m-18-18 18 18-18 18" fill="none" stroke="var(--muted)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="220" y="720" font-size="20" text-anchor="middle">AT THE START</text><text class="m" x="440" y="720" font-size="20" text-anchor="middle" style="fill:var(--gain)">AT THE TOP</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">How to start.</text>
<text class="b" x="120" y="176" font-size="32">Write it down, question it, and see it clearly.</text>
<g id="n0"><rect x="120" y="220" width="420" height="490" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="150" y="262" font-size="22">01</text>
<rect x="220" y="290" width="220" height="280" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="rg"></g><path class="s-line" d="M260 350h150M260 400h150M260 500h150M260 550h100" stroke-width="6" stroke-linecap="round"/><path id="hlt" d="M260 450h150" stroke="var(--gain)" stroke-width="12" stroke-linecap="round"/>
<text class="d5" x="150" y="640" font-size="28">Write down one</text><text class="d5" x="150" y="680" font-size="28">returning frustration.</text></g>
<g id="n1"><rect x="590" y="220" width="420" height="490" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="620" y="262" font-size="22">02</text>
<g id="mg"><circle cx="790" cy="420" r="90" fill="var(--stage)" stroke="var(--ink)" stroke-width="14"/><path class="s-ink" d="M856 486l46 46" stroke-width="22" stroke-linecap="round"/><text id="qm" class="d" x="790" y="458" font-size="110" text-anchor="middle">?</text></g>
<text class="d5" x="620" y="640" font-size="28">Ask: what part do</text><text class="d5" x="620" y="680" font-size="28">I play in this?</text></g>
<g id="n2"><rect x="1060" y="220" width="420" height="490" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="1090" y="262" font-size="22">03</text>
<path id="st" class="s-ink" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g id="fp"></g>
<text class="d5" x="1090" y="640" font-size="28">See the pattern:</text><text class="d5" x="1090" y="680" font-size="28">your first step up.</text></g>
<g id="cur"><rect class="gain" x="120" y="736" width="560" height="64" rx="32"/><text class="m" x="400" y="777" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">CURIOSITY, NOT BLAME</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What problem keeps</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">following you from</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">place to <tspan style="fill:var(--gain)">place?</tspan></text></g>
<g id="qg"><g id="qn"><polygon class="s-ink" points="1180,560 1320,320 1460,560" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><text class="d" x="1320" y="540" font-size="110" text-anchor="middle" style="fill:var(--gain)">?</text></g></g>
<g id="qt"><text class="m" x="143" y="700" font-size="26">THIS WEEK: NOTICE IT ONCE, AND NAME IT AS YOURS</text></g>
</g>