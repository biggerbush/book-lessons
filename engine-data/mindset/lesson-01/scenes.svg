<g id="s0">
<text class="m" x="120" y="150" font-size="28">MINDSET · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Two mindsets,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">two different worlds.</text>
<text class="b" x="120" y="600" font-size="32">One belief about ability quietly shapes how you see everything.</text>
