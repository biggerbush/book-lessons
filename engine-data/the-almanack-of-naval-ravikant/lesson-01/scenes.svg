<text class="m" x="1240" y="780" font-size="22" text-anchor="middle">SKILLS CAN BE LEARNED</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Money, status, wealth.</text>
<text class="b" x="120" y="176" font-size="32">Three things people often blur together.</text>
