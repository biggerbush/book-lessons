<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 1</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Preacher, prosecutor,</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">politician,</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">or <tspan style="fill:var(--gain)">scientist?</tspan></text>
<text class="b" x="120" y="630" font-size="32">Four mental roles, and why the scientist rethinks best.</text>
<g id="brain">
<circle class="s-ink" cx="1320" cy="430" r="140" fill="var(--stage)" stroke-width="7"/>
<path class="ink" d="M1170 760v-30a150 110 0 0 1 300 0v30z"/>
