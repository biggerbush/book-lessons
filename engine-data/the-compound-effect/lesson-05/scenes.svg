<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMPOUND EFFECT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Routines build</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">unstoppable momentum.</text>
<text class="b" x="120" y="600" font-size="32">Why the first push is hardest, and how routines keep you rolling.</text>
<g id="cg"><path class="s-line" d="M1180 720H1480" stroke-width="5"/><g id="pushr"></g>
<path id="eff" class="s-loss" d="M1222 566l-10-12M1240 560l-4-16" stroke-width="4" stroke-linecap="round"/>
<g id="cart"><rect class="ink" x="1322" y="574" width="60" height="46" rx="4"/><rect class="ink" x="1392" y="588" width="52" height="32" rx="4"/><rect x="1300" y="620" width="160" height="80" rx="10" fill="var(--stage)" class="s-ink" stroke-width="7"/><circle class="ink" cx="1336" cy="706" r="14"/><circle class="ink" cx="1424" cy="706" r="14"/></g></g>
<g id="phys"><text class="m" x="1180" y="790" font-size="20">A LAW OF PHYSICS</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Newton’s rule.</text>
<text class="b" x="120" y="176" font-size="32">Objects keep doing what they are already doing.</text>
<rect class="s-line" x="120" y="220" width="660" height="280" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="820" y="220" width="660" height="280" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="266" font-size="22">AT REST</text><text class="m" x="850" y="266" font-size="22">IN MOTION</text>
<g id="apl"><path class="s-line" d="M160 450H740" stroke-width="5"/><circle class="loss" cx="450" cy="410" r="40"/><path class="s-ink" d="M450 372q4-18 14-24" fill="none" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M456 362q20-22 38-8q-18 18-38 8z"/></g>
<g id="ballp"><path class="s-line" d="M860 450H1440" stroke-width="5"/><g id="ball"><path class="s-line" d="M-60 -18h-34M-62 0h-28M-60 18h-34" stroke-width="5" stroke-linecap="round"/><circle class="gain" r="40"/><g id="spinb"><path d="M-40 0H40" stroke="var(--on-gain)" stroke-width="6"/></g></g></g>
<g id="hardy"><text class="d5" x="120" y="565" font-size="40">Darren Hardy: people work exactly the same way.</text></g>
<g id="sofa"><rect class="loss" x="170" y="670" width="280" height="70" rx="14" fill-opacity=".35"/><circle class="ink" cx="310" cy="690" r="22"/><path class="ink" d="M280 760v-20a30 30 0 0 1 60 0v20z"/><rect class="loss" x="150" y="740" width="320" height="50" rx="14"/><text class="m" x="150" y="840" font-size="20" style="fill:var(--loss)">STUCK STAYS STUCK</text></g>
<g id="runp"><g id="run"><circle class="gain" cx="960" cy="690" r="20"/><path class="s-gain" d="M955 712L940 770L905 805M940 770L975 800M950 728L985 750M950 728L915 745" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path class="s-line" d="M880 720h-40M890 750h-40M880 780h-40" stroke-width="5" stroke-linecap="round"/></g><text class="m" x="840" y="840" font-size="20" style="fill:var(--gain)">MOVING KEEPS MOVING</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The first push is brutal.</text>
<text class="b" x="120" y="176" font-size="32">Hardy pictures a child pushing a merry-go-round full of friends.</text>
<g id="mg2"></g><g id="mt2"></g>
<g id="sweat"><path class="loss" d="M338 486q8 12 0 16q-8-4 0-16z"/><path class="loss" d="M358 506q8 12 0 16q-8-4 0-16z"/></g>
<g id="crp"><text class="m" x="680" y="740" font-size="22" text-anchor="middle">THE WHEEL BARELY CREEPS FORWARD</text></g>
<g id="pushes"><text class="m" x="1150" y="510" font-size="22">PUSHES</text><g id="pd"></g></g>
<g id="hw"><text class="m" x="1150" y="630" font-size="20" style="fill:var(--loss)">STILL HARD WORK</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then it spins.</text>
<text class="b" x="120" y="176" font-size="32">With steady pushes, the wheel picks up speed.</text>
<g id="mg3"></g><g id="mt3"></g>
<ellipse id="spin" cx="680" cy="545" rx="350" ry="125" fill="none" class="s-gain" stroke-width="6" stroke-dasharray="90 160" stroke-linecap="round"/>
<circle id="tap" cx="350" cy="548" fill="none" class="s-gain" stroke-width="4"/>
<g id="tapl"><text class="m" x="160" y="720" font-size="22" style="fill:var(--gain)">A LIGHT TAP</text></g>
<g id="mom"><text class="d" x="120" y="800" font-size="56" style="fill:var(--gain)">That is momentum.</text></g>
<g id="pay"><text class="m" x="120" y="848" font-size="22">EARLY EFFORT IS STORED UP, THEN IT PAYS YOU BACK</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Routines do the pushing.</text>
<text class="b" x="120" y="176" font-size="32">Bookend your day with a set morning and a set evening ritual.</text>
<rect class="s-line" x="280" y="330" width="1040" height="60" rx="12" fill="none" stroke-width="4"/>
<g id="sun"><path class="gain" d="M146 390a44 44 0 0 1 88 0z"/><path class="s-gain" d="M190 330v-18M150 344l-12-12M230 344l12-12M132 378h-12M248 378h12" stroke-width="5" stroke-linecap="round"/></g>
<path class="ink" d="M1420 324a40 40 0 1 0 0 72a44 44 0 1 1 0-72z"/>
<g id="mor"><rect class="gain" x="280" y="330" width="180" height="60" rx="12"/><text class="m" x="280" y="430" font-size="20">MORNING RITUAL</text></g>
<g id="eve"><rect class="gain" x="1140" y="330" width="180" height="60" rx="12"/><text class="m" x="1320" y="430" font-size="20" text-anchor="end">EVENING RITUAL</text></g>
<g id="rows"></g>
<g id="cols" opacity="0"><rect x="340" y="466" width="60" height="258" rx="30" fill="none" class="s-gain" stroke-width="4" stroke-dasharray="10 8"/><rect x="1200" y="466" width="60" height="258" rx="30" fill="none" class="s-gain" stroke-width="4" stroke-dasharray="10 8"/></g>
<g id="nodeb"><text class="m" x="280" y="764" font-size="20" style="fill:var(--gain)">SAME TIME EVERY DAY: NO MORE DEBATING</text></g>
<g id="brush"><rect class="ink" x="120" y="816" width="130" height="16" rx="8"/><rect class="gain" x="226" y="798" width="44" height="16" rx="4"/><text class="d5" x="300" y="832" font-size="40">It just runs, like brushing your teeth.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Like an Olympic athlete.</text>
<text class="b" x="120" y="176" font-size="32">Michael Phelps follows the same routine before every race.</text>
<g id="pool"><rect x="120" y="240" width="760" height="300" rx="18" fill="var(--loss)" fill-opacity=".08" class="s-line" stroke-width="3"/><path class="s-muted" d="M140 340H860M140 440H860" stroke-width="4" stroke-dasharray="14 12"/>
<g id="swm"><path class="s-ink" d="M-20 4H-90M-90 4l-20-10M-90 4l-20 12" fill="none" stroke-width="10" stroke-linecap="round"/><g id="arm"><path class="s-ink" d="M0 0v-38" stroke-width="9" stroke-linecap="round"/></g><circle class="gain" r="18"/></g></g>
<g id="steps"></g>
<g id="loopa"><path class="s-muted" d="M770 664C770 740 200 740 200 672" fill="none" stroke-width="4" stroke-dasharray="8 8"/><path class="s-muted" d="M188 686l12-14 12 14" fill="none" stroke-width="4" stroke-linecap="round"/><text class="m" x="120" y="800" font-size="20">SAME STEPS BEFORE EVERY RACE</text></g>
<g id="stw"><rect class="ink" x="1200" y="268" width="40" height="28" rx="6"/><circle cx="1220" cy="450" r="150" fill="var(--stage)" class="s-ink" stroke-width="10"/><g id="ticks"></g><line id="hand" x1="1220" y1="450" x2="1220" y2="330" class="s-gain" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1220" cy="450" r="12"/></g>
<g id="peak"><text class="d" x="1220" y="690" font-size="44" text-anchor="middle">Peak performance,</text><text class="d" x="1220" y="744" font-size="44" text-anchor="middle" style="fill:var(--gain)">automatically.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t let the water drain.</text>
<text class="b" x="120" y="176" font-size="32">Hardy’s warning about stopping: an old hand water pump.</text>
<rect class="loss" x="120" y="520" width="1360" height="320" fill-opacity=".08"/>
<rect x="120" y="790" width="1360" height="50" fill="var(--muted)" fill-opacity=".22"/>
<path class="s-ink" d="M120 520H1480" stroke-width="5"/>
<g id="pump"><rect x="495" y="300" width="80" height="220" fill="var(--stage)"/><rect x="515" y="520" width="40" height="300" fill="var(--stage)" class="s-ink" stroke-width="6"/>
<rect id="wl" class="gain" x="521" y="812" width="28" height="0"/>
<rect x="495" y="300" width="80" height="220" fill="none" class="s-ink" stroke-width="7"/>
<path class="s-ink" d="M575 330H680V352" fill="none" stroke-width="14" stroke-linejoin="round"/>
<rect class="ink" x="485" y="288" width="100" height="16" rx="4"/>
<g id="handle"><path class="s-ink" d="M500 320L380 280" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="380" cy="280" r="14"/></g>
<rect id="strm" class="gain" x="673" y="358" width="14" height="72"/>
<rect id="bw" class="gain" x="622" y="518" width="76" height="0"/>
<path d="M612 432L708 432L698 520L622 520Z" fill="none" class="s-ink" stroke-width="6" stroke-linejoin="round"/></g>
<path id="drn" class="s-loss" d="M610 600V760M590 738l20 24 20-24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="w0"><text class="m" x="900" y="280" font-size="22">PUMP AND PUMP</text></g>
<g id="w1"><text class="d" x="900" y="350" font-size="48" style="fill:var(--gain)">Water flows.</text></g>
<g id="w2"><text class="d" x="900" y="420" font-size="48" style="fill:var(--loss)">Quit, and it drains.</text></g>
<g id="w3"><text class="m" x="900" y="470" font-size="22">START PRIMING ALL OVER AGAIN</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rhythm beats intensity.</text>
<text class="b" x="120" y="176" font-size="32">A modest action every day beats a heroic burst, then weeks off.</text>
<g id="metro"><path d="M150 560L205 250H275L330 560Z" fill="var(--stage)" class="s-ink" stroke-width="7" stroke-linejoin="round"/><line id="marm" x1="240" y1="520" x2="240" y2="300" class="s-ink" stroke-width="7" stroke-linecap="round"/><circle id="mw" r="16" class="gain"/></g>
<g id="bars1"><text class="m" x="440" y="370" font-size="20">EVERY DAY</text></g>
<g id="bars2"><text class="m" x="440" y="550" font-size="20">BURST, THEN OFF</text></g>
<g id="cal"><text class="m" x="120" y="790" font-size="20">KEEP THE BEAT</text></g>
<g id="kb"><text class="d5" x="640" y="700" font-size="34">Every day you keep the beat,</text><text class="d5" x="640" y="750" font-size="34">the wheel spins faster and easier.</text></g>
<g id="whl"><circle cx="1370" cy="720" r="95" fill="var(--stage)" class="s-ink" stroke-width="8"/><g id="whs"><path class="s-ink" d="M1370 625V815M1288 672.5L1452 767.5M1288 767.5L1452 672.5" stroke-width="5"/></g><circle class="gain" cx="1370" cy="720" r="16"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one small routine</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">for tomorrow morning.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Same time, <tspan style="fill:var(--gain)">every day.</tspan></text></g>
<g id="push8"><text class="m" x="143" y="700" font-size="26">PUSH THROUGH THE FIRST HEAVY DAYS</text></g>
<path class="s-line" d="M1220 620H1480" stroke-width="5"/>
<g id="b8"><circle r="60" class="gain"/><path d="M-60 0H60M0 -60V60" stroke="var(--on-gain)" stroke-width="6"/></g>
</g>