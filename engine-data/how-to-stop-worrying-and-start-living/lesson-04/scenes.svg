<path class="s-line" d="M170 360h300M170 410h260M170 460h280" stroke-width="6" stroke-linecap="round"/>
</g></g>
<g id="tp">
<rect class="s-line" x="600" y="240" width="880" height="320" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="630" y="290" font-size="22">TIMES I FEARED IT</text><text class="m" x="1450" y="290" font-size="18" text-anchor="end">ILLUSTRATION</text>
<text class="m" x="630" y="460" font-size="22">TIMES IT ACTUALLY HAPPENED</text>
</g>
<g id="marks"></g>
<g id="hon"><text class="d5" x="600" y="640" font-size="34">Be honest. Use real numbers.</text></g>
<g id="chk">
<circle class="gain" cx="200" cy="730" r="64"/>
<path d="M168 732l22 22l42-46" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="300" y="720" font-size="52">Almost never?</text>
<text class="b" x="300" y="770" font-size="32">Tell yourself so, and get on with your day.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">dreading <tspan style="fill:var(--gain)">right now?</tspan></text></g>
<g id="qc"><text class="m" x="143" y="580" font-size="26">ASK: WHAT ARE THE ODDS, REALLY?</text></g>
