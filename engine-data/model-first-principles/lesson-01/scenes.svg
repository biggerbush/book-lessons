<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sort, question, rebuild.</text>
<text class="b" x="120" y="176" font-size="32">Keep what is certain. Cross out what is only assumed.</text>
<g id="col6">
