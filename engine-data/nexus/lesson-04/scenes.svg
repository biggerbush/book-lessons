<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The dream of an</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">infallible source.</text>
<text class="b" x="120" y="600" font-size="32">Why even a perfect book still needs fallible human readers.</text>
<g id="tbook">
<g id="trays"></g>
<path class="s-ink" d="M1280 340Q1200 310 1110 330V470Q1200 450 1280 480Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1280 340Q1360 310 1450 330V470Q1360 450 1280 480Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M1140 365q60-12 115 2M1140 400q60-12 115 2M1140 435q60-12 115 2M1305 367q55-14 115-2M1305 402q55-14 115-2M1305 437q55-14 115-2" fill="none" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="treader"><path class="s-gain" d="M1325 580q14 20 0 40M1345 568q22 32 0 64M1365 556q30 44 0 88" fill="none" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">People make mistakes.</text>
<text class="b" x="120" y="176" font-size="32">Leaders lie, judges take bribes, experts get things wrong.</text>
<g id="hp"></g>
<g id="tags"></g>
<path class="s-line" d="M820 260V760" stroke-width="4" stroke-dasharray="8 10"/>
<g id="scl">
<path class="s-ink" d="M1170 320V680" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="1080" y="676" width="180" height="16" rx="8"/>
<circle class="gain" cx="1170" cy="270" r="28"/>
<path id="beam" class="s-ink" d="M1000 320H1340" stroke-width="8" stroke-linecap="round"/>
<g id="panL"><path class="s-ink" d="M1000 320L955 440M1000 320L1045 440" stroke-width="3"/><path class="ink" d="M940 440h120a60 34 0 0 1-120 0z"/></g>
<g id="panR"><path class="s-ink" d="M1340 320L1295 440M1340 320L1385 440" stroke-width="3"/><path class="ink" d="M1280 440h120a60 34 0 0 1-120 0z"/></g>
</g>
<g id="sl1"><text class="m" x="1170" y="770" font-size="22" text-anchor="middle">A SOURCE THAT CAN NEVER ERR</text></g>
<g id="sl2"><text class="d5" x="1170" y="826" font-size="34" text-anchor="middle" style="fill:var(--gain)">Settles every argument.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Enter the holy book.</text>
<text class="b" x="120" y="176" font-size="32">A sacred text, believed to come from beyond humanity.</text>
<g id="scr">
<rect class="s-ink" x="200" y="280" width="320" height="220" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="180" y="262" width="360" height="24" rx="12"/><rect class="ink" x="180" y="494" width="360" height="24" rx="12"/>
<path class="s-line" d="M240 330h240M240 370h240M240 410h200M240 450h220" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="coin"><circle class="gain" cx="0" cy="0" r="26"/><text class="d" x="0" y="11" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">$</text></g>
<g id="nb"><text class="m" x="120" y="740" font-size="22">CANNOT BE BRIBED</text><text class="m" x="120" y="776" font-size="22">CANNOT CHANGE ITS MIND</text></g>
<g id="cpl"></g>
<g id="cpb"></g>
<path id="shld" class="s-gain" d="M360 222L600 262V450Q600 600 360 690Q120 600 120 450V262Z" fill="none" stroke-width="8" stroke-linejoin="round"/>
<g id="sh2"><text class="d" x="700" y="776" font-size="44">A perfect shield</text><text class="d" x="700" y="830" font-size="44">against human error?</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who chose the pages?</text>
<text class="b" x="120" y="176" font-size="32">Someone had to decide which writings counted as holy.</text>
<g id="pile"></g>
<path id="arr3" class="s-muted" d="M540 450h60m-16-16 16 16-16 16M990 450h70m-16-16 16 16-16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="sch"><g id="schp"></g><text class="m" x="800" y="432" font-size="20" text-anchor="middle">JEWISH SCHOLARS</text></g>
<g id="eld"><g id="eldp"></g><text class="m" x="800" y="632" font-size="20" text-anchor="middle">CHURCH LEADERS</text></g>
<g id="canon">
<rect class="s-ink" x="1100" y="290" width="320" height="320" rx="12" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="1100" y="290" width="40" height="320" rx="6"/>
<text class="d5" x="1280" y="464" font-size="44" text-anchor="middle">Bible</text>
</g>
<g id="cl1"><text class="m" x="1260" y="660" font-size="20" text-anchor="middle">WHICH BELONG IN THE BIBLE?</text></g>
<g id="cl2"><text class="m" x="1260" y="696" font-size="20" text-anchor="middle">WHICH MAKE THE NEW TESTAMENT?</text></g>
<g id="fal"><text class="d" x="120" y="800" font-size="40">Fallible people made the choice meant to remove them.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A text cannot explain itself.</text>
<text class="b" x="120" y="176" font-size="32">What does an ancient rule mean in a new city, century, situation?</text>
<g id="tab">
<path class="s-ink" d="M160 620V340a150 90 0 0 1 300 0V620Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-line" d="M200 380h220M200 430h220M200 480h220M200 530h160" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="310" y="670" font-size="22" text-anchor="middle">AN ANCIENT RULE</text>
</g>
<text id="bq" class="d" x="760" y="520" font-size="200" text-anchor="middle" style="fill:var(--loss)">?</text>
<g id="cards"></g>
<g id="rab">
<path class="s-gain" d="M480 450H690" stroke-width="5" stroke-dasharray="10 10"/>
<g id="rabp"></g>
<rect class="ink" x="716" y="334" width="88" height="12" rx="4"/><rect class="ink" x="730" y="296" width="60" height="42" rx="6"/>
<text class="m" x="760" y="590" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE RABBIS</text>
</g>
<g id="int"><text class="d" x="120" y="790" font-size="44">Someone had to interpret it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Books about books.</text>
<text class="b" x="120" y="176" font-size="32">The rabbis’ interpretations became new sacred texts.</text>
<g id="bib"><rect class="s-ink" x="300" y="620" width="400" height="80" rx="10" fill="var(--stage)" stroke-width="6"/><text class="d5" x="500" y="672" font-size="34" text-anchor="middle">Bible</text></g>
<g id="mis"><rect class="s-ink" x="330" y="530" width="340" height="80" rx="10" fill="var(--stage)" stroke-width="6"/><text class="d5" x="500" y="582" font-size="34" text-anchor="middle">Mishnah</text></g>
<g id="tal"><rect id="talr" class="s-ink" x="280" y="360" width="440" height="160" rx="10" fill="var(--stage)" stroke-width="6"/><text id="talt" class="d" x="500" y="458" font-size="52" text-anchor="middle">Talmud</text></g>
<g id="nxt"><rect class="s-muted" x="330" y="240" width="340" height="90" rx="10" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="500" y="292" font-size="20" text-anchor="middle">ITS OWN INTERPRETERS</text><g id="nxp"></g></g>
<g id="rd"><g id="rdp"></g><path class="s-gain" d="M1150 440H740" stroke-width="4" stroke-dasharray="8 10"/>
<text class="m" x="1200" y="640" font-size="22" text-anchor="middle">STUDIED MORE CLOSELY</text><text class="m" x="1200" y="672" font-size="22" text-anchor="middle">THAN THE BIBLE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Power never left human hands.</text>
<text class="b" x="120" y="176" font-size="32">It moved to whoever controlled the interpretation.</text>
<g id="pb">
<path class="s-ink" d="M330 470Q260 445 180 462V590Q260 575 330 600Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M330 470Q400 445 480 462V590Q400 575 330 600Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="330" y="660" font-size="20" text-anchor="middle">THE INFALLIBLE SOURCE</text>
</g>
<g id="ilink">
<path class="s-gain" d="M490 500Q720 330 990 390" fill="none" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>
<path class="s-gain" d="M971 373L990 390L966 397" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="730" y="350" font-size="22" text-anchor="middle" style="fill:var(--gain)">INTERPRETATION</text>
</g>
<circle id="idot" class="gain" r="10"/>
<g id="tp"></g>
<g id="ivoc"><path class="s-gain" d="M1095 342q14 18 0 36M1115 330q22 30 0 60M1135 318q30 42 0 84" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="hr"><text class="m" x="1300" y="650" font-size="20">CHURCH</text><text class="m" x="1300" y="678" font-size="20">HIERARCHY</text></g>
<path id="crw" class="gain" d="M-44 22L-48-26L-22 0L0-36L22 0L48-26L44 22Z"/>
<g id="voc"><text class="d" x="120" y="830" font-size="46">Behind every perfect source: a human voice.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spot it today.</text>
<text class="b" x="120" y="176" font-size="32">Any authority “beyond question” still has people explaining it.</text>
<g id="scrn"><rect class="s-ink" x="160" y="240" width="480" height="200" rx="14" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="400" y="300" font-size="22" text-anchor="middle">BEYOND QUESTION</text>
<path class="s-line" d="M210 350h380M210 390h300" stroke-width="8" stroke-linecap="round"/></g>
<g id="spk"><g id="spkp"></g><path class="ink" d="M300 600H500L480 770H320Z"/></g>
<path id="wv" class="s-gain" d="M445 485q12 15 0 30M465 473q20 27 0 54" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="mag"><circle cx="0" cy="0" r="78" class="s-gain" fill="none" stroke-width="10"/><path class="s-gain" d="M56 56L120 120" stroke-width="18" stroke-linecap="round"/></g>
<g id="k0"><rect class="s-line" x="800" y="260" width="640" height="120" rx="16" fill="var(--stage)" stroke-width="4"/><text class="d5" x="840" y="334" font-size="40" style="fill:var(--muted)">Is the source perfect?</text></g>
<line id="sk" class="s-ink" x1="830" y1="322" x2="830" y2="322" stroke-width="5"/>
<g id="k1"><rect class="s-gain" x="800" y="420" width="640" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="840" y="494" font-size="40">Who interprets it?</text></g>
<g id="k2"><rect class="s-gain" x="800" y="580" width="640" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="840" y="654" font-size="40">Can anyone challenge them?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="80" letter-spacing="-2">Notice one claim backed by</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="80" letter-spacing="-2">an authority beyond question.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">Who is <tspan style="fill:var(--gain)">interpreting</tspan> it?</text></g>
<text class="m" x="143" y="700" font-size="26">THIS WEEK’S CHALLENGE</text>
<g id="nbk"><rect class="s-ink" x="1220" y="600" width="200" height="220" rx="10" fill="var(--stage)" stroke-width="6"/>
<g id="rings"></g>
<path class="s-line" d="M1250 640h140M1250 670h100" stroke-width="6" stroke-linecap="round"/>
<text class="d" x="1330" y="795" font-size="100" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>