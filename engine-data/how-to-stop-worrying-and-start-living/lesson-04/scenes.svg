</g></g>
<g id="calm"><text class="m" x="1320" y="580" font-size="22" text-anchor="middle" style="fill:var(--gain)">CHECK THE ODDS</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A boy full of fears.</text>
<text class="b" x="120" y="176" font-size="32">Dale Carnegie, growing up on a Missouri farm.</text>
<path class="s-line" d="M140 760H1460" stroke-width="5"/>
<g id="farm">
<path class="s-ink" d="M160 570L290 460L420 570" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
