<g id="incB"><rect class="s-gain" x="600" y="270" width="400" height="100" rx="14" fill="none" stroke-width="6"/><text class="m" x="800" y="330" font-size="28" text-anchor="middle">INCOME</text></g>
<g id="expB"><path class="s-loss" d="M800 380v100m-16-16 16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-loss" x="600" y="500" width="400" height="100" rx="14" fill="none" stroke-width="6"/><text class="m" x="800" y="560" font-size="28" text-anchor="middle">EXPENSES</text><path id="leak" class="s-loss" d="M800 610v110" stroke-width="6" stroke-dasharray="14 12"/><path class="s-loss" d="M784 704l16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="more"><path class="s-gain" d="M300 320h280m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="440" y="300" font-size="20" text-anchor="middle" style="fill:var(--gain)">ASSET</text><path class="s-loss" d="M1010 550h280m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1150" y="530" font-size="20" text-anchor="middle" style="fill:var(--loss)">LIABILITY</text></g>
<g id="flowT"><text class="d" x="120" y="830" font-size="40">Everything you own adds an arrow: in or out.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The poor pattern.</text>
<text class="b" x="120" y="176" font-size="32">The paycheck comes in and goes straight back out.</text>
<g id="pay"><rect class="s-ink" x="140" y="270" width="260" height="120" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M170 310h120M170 340h200M170 365h80" stroke-width="6" stroke-linecap="round"/><text class="m" x="270" y="430" font-size="20" text-anchor="middle">PAYCHECK</text></g>
<g id="flow"></g>
<g id="bins"></g>
<g id="jarG"><rect class="s-ink" x="590" y="550" width="200" height="24" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M600 580h180v160q0 20-20 20h-140q-20 0-20-20z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="d" x="860" y="650" font-size="40">Nothing left over to grow.</text></g>
<g id="emp"><text class="d" x="690" y="700" font-size="80" text-anchor="middle" style="fill:var(--loss)">0</text><text class="m" x="860" y="710" font-size="22">END OF THE MONTH: EMPTY AGAIN</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The middle-class trap.</text>
<text class="b" x="120" y="176" font-size="32">More income, bigger loans.</text>
<g id="couple"><g id="cpl"></g><text class="m" x="245" y="450" font-size="20" text-anchor="middle">BOTH WORK</text></g>
<g id="raise"><path class="s-gain" d="M390 400V290m-18 18 18-18 18 18" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="390" y="270" font-size="20" text-anchor="middle" style="fill:var(--gain)">RAISE</text></g>
<g id="it0"><path class="s-ink" d="M460 420V320L550 250L640 320V420z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><rect class="ink" x="530" y="360" width="40" height="60"/><text class="m" x="550" y="460" font-size="20" text-anchor="middle">BIGGER HOUSE</text></g>
<g id="it1"><path class="s-ink" d="M720 400v-40q0-16 16-16h30l30-40h90l30 40h20q16 0 16 16v40z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="770" cy="405" r="18"/><circle class="ink" cx="880" cy="405" r="18"/><text class="m" x="826" y="460" font-size="20" text-anchor="middle">NEW CARS</text></g>
<g id="it2"><rect class="s-ink" x="1040" y="300" width="180" height="60" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="1020" y="350" width="220" height="50" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1040 400v20M1220 400v20" stroke-width="6" stroke-linecap="round"/><text class="m" x="1130" y="460" font-size="20" text-anchor="middle">FURNITURE</text></g>
<g id="loans"></g>
<g id="hard"><path class="s-loss" d="M245 580V720H1130M550 720V690M826 720V690M1130 720V690" fill="none" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="245" y="550" font-size="20" text-anchor="middle" style="fill:var(--loss)">WORKING HARDER</text></g>
<g id="trap"><text class="d" x="120" y="810" font-size="40">They thought they bought assets. Each one drains cash.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Is your home an asset?</text>
<text class="b" x="120" y="176" font-size="32">The book’s most debated claim.</text>
<g id="home"><path class="s-ink" d="M200 640V440L380 300L560 440V640z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="350" y="540" width="60" height="100"/><rect class="s-ink" x="250" y="470" width="70" height="60" fill="none" stroke-width="5"/><rect class="s-ink" x="440" y="470" width="70" height="60" fill="none" stroke-width="5"/><text class="m" x="380" y="690" font-size="24" text-anchor="middle" style="fill:var(--loss)">USUALLY A LIABILITY</text></g>
<g id="bills"></g>
<g id="chart"><path class="s-ink" d="M1200 280V600H1470" fill="none" stroke-width="4"/><path class="s-gain" d="M1210 570C1300 560 1380 450 1460 300" fill="none" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="1460" y="270" font-size="20" text-anchor="end" style="fill:var(--gain)">SOMEDAY?</text><circle class="loss" cx="1210" cy="570" r="14"/><text class="m" x="1200" y="640" font-size="20">TODAY: IT COSTS YOU</text></g>
<g id="month"><text class="d" x="120" y="790" font-size="40">Every month, money leaves your pocket.</text></g>
</g>

<g id="s6" opacity="0">
<g id="hd6"><text class="d" x="120" y="124" font-size="68">“The rich buy assets.”</text><text class="b" x="120" y="176" font-size="32">Assets that feed your income.</text></g>
<g id="inc"><rect class="gain" x="640" y="420" width="320" height="120" rx="16"/><text class="d" x="800" y="494" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">INCOME</text></g>
<g id="flat"><rect class="s-ink" x="180" y="300" width="220" height="260" fill="var(--stage)" stroke-width="6"/><g id="win"></g><text class="m" x="290" y="600" font-size="20" text-anchor="middle">RENTAL</text><text class="m" x="290" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">RENT − COSTS = EXTRA</text></g>
<g id="biz"><rect class="s-ink" x="1200" y="380" width="220" height="180" fill="var(--stage)" stroke-width="6"/><path class="gain" d="M1190 380l20-50h200l20 50z"/><rect class="ink" x="1285" y="470" width="50" height="90"/><text class="m" x="1310" y="600" font-size="20" text-anchor="middle">BUSINESS</text><text class="m" x="1310" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">RUNS WITHOUT YOU</text></g>
<g id="paper"></g>
<g id="inw"><path class="s-gain" d="M410 480H620m-18-18 18 18-18 18M1190 480H980m18-18-18 18 18 18M800 690V560m-18 18 18-18 18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Luxuries come last.</text>
<text class="b" x="120" y="176" font-size="32">Assets first. Their income pays for the treat.</text>
<g id="car"><path class="ink" d="M1000 500v-40q0-20 20-20h100l70-50h140l80 50h60q20 0 20 20v40z"/><circle class="s-ink" cx="1090" cy="500" r="32" fill="var(--stage)" stroke-width="8"/><circle class="s-ink" cx="1330" cy="500" r="32" fill="var(--stage)" stroke-width="8"/><text class="m" x="1210" y="590" font-size="24" text-anchor="middle">2. LUXURY</text></g>
<g id="pile"><text class="m" x="375" y="700" font-size="24" text-anchor="middle" style="fill:var(--gain)">1. ASSETS (THEY STAY)</text></g>
<g id="arc"></g>
<g id="rev"><text class="d" x="120" y="780" font-size="40">Most people do the reverse: borrow for luxuries first.</text><text class="m" x="120" y="830" font-size="22" style="fill:var(--loss)">LUXURY FIRST → LOANS → NO ASSETS</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">List what you own.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Money in,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">or <tspan style="fill:var(--loss)">money out</tspan>?</text></g>
