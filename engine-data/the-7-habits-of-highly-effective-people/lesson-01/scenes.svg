<g id="thr"><text class="d" x="120" y="830" font-size="46">Seen as capable, he slowly thrived.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Inside out.</text>
<text class="b" x="120" y="176" font-size="32">Change how you see, and your behavior and results follow.</text>
<g id="ring2"><circle class="s-line" cx="560" cy="500" r="250" fill="none" stroke-width="5"/><text class="m" x="560" y="300" font-size="22" text-anchor="middle">RESULTS</text></g>
