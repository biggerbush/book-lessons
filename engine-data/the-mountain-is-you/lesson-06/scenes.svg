<g id="walk"></g>
<g id="old"><circle class="s-gain" cx="1300" cy="380" r="60" fill="none" stroke-width="4"/></g>
<g id="ol0"><text class="m" x="1200" y="610" font-size="20">HOW THEY STAND</text></g>
