<text class="m" x="320" y="670" font-size="20" text-anchor="middle">FAST · FLASHY · EASY TO SEE</text></g>
<g id="sd"><path id="sdst" class="s-gain" stroke-width="6" stroke-linecap="round" fill="none"/><g id="sdl"><path class="gain" d="M0 0c-30-4-40-24-40-24c24-4 38 6 40 24zM0 0c30-4 40-24 40-24c-24-4-38 6-40 24z"/></g>
<path class="ink" d="M740 560h120l-14 60h-92z"/><text class="m" x="800" y="670" font-size="20" text-anchor="middle">SLOW · HIDES FROM A GLANCE</text></g>
<g id="mg"><path class="s-ink" d="M1140 330V580H1440" fill="none" stroke-width="5"/><polyline class="s-gain" points="1160,560 1220,530 1280,480 1340,430 1400,370" fill="none" stroke-width="6" stroke-linejoin="round"/>
<g id="mgl"><circle class="s-ink" r="40" fill="none" stroke-width="7"/><path class="s-ink" d="M28 28l32 32" stroke-width="10" stroke-linecap="round"/></g>
<text class="m" x="1290" y="670" font-size="20" text-anchor="middle" style="fill:var(--gain)">WATCH THE RATE, NOT THE LEVEL</text></g>
<g id="watch"><text class="d" x="120" y="790" font-size="44">Watch the rate of progress, not just the level.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What drives the climb?</text>
<text class="b" x="120" y="176" font-size="32">What carries people the whole distance?</text>
<g id="tb"><path class="s-ink" d="M420 440v-50h120v50" fill="none" stroke-width="8"/><rect id="tbr" x="320" y="440" width="320" height="180" rx="14" stroke="var(--ink)" stroke-width="7"/><path class="s-ink" d="M320 500h320" stroke-width="6"/></g>
<g id="gf"><rect x="180" y="572" width="60" height="48" rx="6" fill="none" stroke="var(--muted)" stroke-width="5"/><path class="s-muted" d="M210 572v48M180 590h60" stroke-width="5"/>
<text class="m" x="210" y="670" font-size="20" text-anchor="middle">INBORN GIFTS</text><text class="m" x="210" y="704" font-size="22" text-anchor="middle">LESS</text></g>
<g id="hl"><text class="m" x="480" y="670" font-size="22" text-anchor="middle" style="fill:var(--gain)">LEARNABLE HABITS</text><text class="m" x="480" y="704" font-size="22" text-anchor="middle" style="fill:var(--gain)">MORE</text></g>
