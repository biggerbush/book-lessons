</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Beauty in the cracks.</text>
<text class="b" x="120" y="176" font-size="32">Wabi-sabi: beauty in the imperfect and impermanent.</text>
