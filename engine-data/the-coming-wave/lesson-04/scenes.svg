</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pessimism aversion.</text>
<text class="b" x="120" y="176" font-size="32">Our instinct to look away from dark possibilities.</text>
<g id="cld"><path class="loss" d="M200 340a40 40 0 0 1 20-74a55 55 0 0 1 100-20a45 45 0 0 1 70 50a30 30 0 0 1-10 44z"/><path class="s-loss" d="M300 350l-20 40h30l-20 40" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
