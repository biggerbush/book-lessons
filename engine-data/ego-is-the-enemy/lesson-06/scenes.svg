</g>
<g id="first"><text class="m" x="120" y="810" font-size="22">FIRST BLACK PLAYER IN THE MODERN MAJOR LEAGUES</text></g>
<g id="crowdg"></g>
<g id="failt"><text class="d5" x="980" y="790" font-size="40" style="fill:var(--loss)">Wanted him to fail.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A strange deal.</text>
<text class="b" x="120" y="176" font-size="32">Dodgers executive Branch Rickey made an unusual request.</text>
<g id="rk"><g id="rkp"></g><text class="m" x="360" y="620" font-size="22" text-anchor="middle">BRANCH RICKEY</text></g>
<g id="jr"><g id="jrp"></g><text class="m" x="1240" y="620" font-size="22" text-anchor="middle">JACKIE ROBINSON</text></g>
<g id="ask">
<path d="M590 408L462 432L650 408" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<rect x="540" y="240" width="520" height="170" rx="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text class="d5" x="800" y="315" font-size="40" text-anchor="middle">Take the abuse.</text>
<text class="d5" x="800" y="375" font-size="40" text-anchor="middle" style="fill:var(--loss)">Don’t fight back.</text>
</g>
<g id="shake">
<line id="armL" class="s-ink" x1="400" y1="540" x2="430" y2="540" stroke-width="10" stroke-linecap="round"/>
<line id="armR" class="s-ink" x1="1200" y1="540" x2="1170" y2="540" stroke-width="10" stroke-linecap="round"/>
<circle id="hL" class="ink" cx="430" cy="540" r="16"/>
<circle id="hR" class="gain" cx="1170" cy="540" r="16"/>
<circle id="glow" class="s-gain" cx="800" cy="540" r="40" fill="none" stroke-width="5"/>
</g>
<g id="quote"><text class="d" x="800" y="740" font-size="44" text-anchor="middle">“With guts enough not to fight back.”</text></g>
<g id="kept"><text class="m" x="800" y="820" font-size="22" text-anchor="middle" style="fill:var(--gain)">ROBINSON AGREED, AND KEPT THAT PROMISE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The abuse.</text>
<text class="b" x="120" y="176" font-size="32">It came from every direction.</text>
<g id="rb"><g id="rbp"></g></g>
<g id="dug">
<rect x="140" y="600" width="300" height="110" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<path class="s-ink" d="M130 600h320" stroke-width="10" stroke-linecap="round"/>
<circle class="ink" cx="210" cy="660" r="20"/><circle class="ink" cx="290" cy="660" r="20"/><circle class="ink" cx="370" cy="660" r="20"/>
<text class="m" x="140" y="750" font-size="20">INSULTS FROM THE DUGOUT</text>
</g>
<g id="bubs"></g>
<line id="trail" class="s-loss" x1="1400" y1="340" x2="1400" y2="340" stroke-width="4" stroke-dasharray="10 10"/>
<circle id="ball" cx="1400" cy="340" r="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<g id="balll"><text class="m" x="1420" y="300" font-size="20" text-anchor="end">PITCHES AT HIS HEAD</text></g>
<g id="clg"><g id="clmv">
<g transform="translate(980 560) scale(1.5)"><path class="loss" d="M150 0H40Q0 0 0 34H150z"/><path class="s-ink" d="M24 34l8 16 8-16M70 34l8 16 8-16M116 34l8 16 8-16" fill="none" stroke-width="4" stroke-linejoin="round"/></g>
<path class="s-muted" d="M1240 572h80M1260 598h100M1240 624h70" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
<text class="m" x="1092" y="680" font-size="20" text-anchor="middle">SPIKES RAISED</text>
</g></g>
<g id="inst">
<circle id="instR" class="s-loss" cx="800" cy="500" r="150" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="d" x="120" y="845" font-size="44">Every instinct: strike back.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why he held back.</text>
<text class="b" x="120" y="176" font-size="32">His pride, weighed against a bigger cause.</text>
<g id="scl">
<path class="s-ink" d="M500 330V720M400 720H600" stroke-width="8" stroke-linecap="round"/>
<line id="beam" class="s-ink" x1="240" y1="320" x2="760" y2="320" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="500" cy="320" r="12"/>
<g id="panL"><path class="s-ink" d="M0 0L-70 100M0 0L70 100" stroke-width="4"/><path class="loss" d="M-90 100a90 40 0 0 0 180 0z"/><text class="m" x="0" y="180" font-size="22" text-anchor="middle">PRIDE</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-70 100M0 0L70 100" stroke-width="4"/><path class="gain" d="M-90 100a90 40 0 0 0 180 0z"/><text class="m" x="0" y="180" font-size="22" text-anchor="middle">OTHERS</text></g>
</g>
<g id="door">
<rect class="gain" x="1060" y="280" width="240" height="400" fill-opacity=".25"/>
<g id="dpp"></g>
<polygon id="leaf" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="1060" y="280" width="240" height="400" fill="none" stroke-width="7"/>
<text class="m" x="1180" y="730" font-size="20" text-anchor="middle">THE DOOR HE WAS OPENING</text>
</g>
<g id="exc"><text class="d5" x="120" y="790" font-size="38" style="fill:var(--loss)">One angry reaction = the excuse critics wanted.</text></g>
<g id="ans"><text class="d" x="120" y="850" font-size="44">So he let his play answer instead.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ego wants revenge.</text>
<text class="b" x="120" y="176" font-size="32">It treats every slight as an attack.</text>
<g id="prvg"><g id="prvp"></g><text class="m" x="220" y="500" font-size="20" text-anchor="middle" style="fill:var(--loss)">PROVOKER</text></g>
<g id="egog"><g id="egop"></g><text class="m" x="600" y="278" font-size="22" text-anchor="middle" style="fill:var(--loss)">EGO</text></g>
<g id="youg"><g id="youp"></g><text class="m" x="600" y="545" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text></g>
<g id="sl">
<line id="slL" class="s-loss" x1="290" y1="400" x2="290" y2="400" stroke-width="6" stroke-linecap="round"/>
<path id="slH" class="s-loss" d="M-22 -20L0 0L-22 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="300" y="378" font-size="20">A SLIGHT</text>
</g>
<g id="hit"><path class="s-loss" d="M532 376l-14-18M532 424l-14 18M522 400h-0" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="prove"><text class="d5" x="740" y="270" font-size="36">“Nobody pushes me around!”</text></g>
<g id="pupg">
<path class="s-loss" d="M670 420C780 420 800 355 900 355H1004M986 341l18 14-18 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-line" x="1020" y="230" width="460" height="250" rx="16" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1044" y="268" font-size="22" style="fill:var(--loss)">REACT</text>
<path class="s-loss" d="M1180 300H1300M1300 300L1376 338" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="pupf"></g><g id="pvs"></g>
<text class="m" x="1044" y="464" font-size="20" style="fill:var(--loss)">THEY HOLD THE STRINGS</text>
</g>
<g id="strs"><path class="s-muted" d="M1190 300L1213 420M1240 300L1240 344M1290 300L1267 420" fill="none" stroke-width="3"/></g>
<g id="resg">
<path class="s-gain" d="M670 420C780 420 800 635 900 635H1004M986 621l18 14-18 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-line" x="1020" y="510" width="460" height="250" rx="16" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1044" y="548" font-size="22" style="fill:var(--gain)">RESTRAINT</text>
<g id="rsf"></g><g id="pvr"></g>
<path class="s-gain" d="M1166 652L1242 632" stroke-width="7" stroke-linecap="round"/>
<circle id="pzd" class="gain" cx="1290" cy="625" r="44"/>
<rect x="1274" y="603" width="10" height="44" rx="3" fill="var(--on-gain)"/><rect x="1296" y="603" width="10" height="44" rx="3" fill="var(--on-gain)"/>
<path class="s-loss" d="M1392 640H1352" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<text class="m" x="1044" y="740" font-size="20" style="fill:var(--gain)">YOU KEEP THE CHOICE</text>
</g>
<g id="rest"><text class="d" x="120" y="840" font-size="44">Restraint keeps the choice in your hands.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Strength, not weakness.</text>
<text class="b" x="120" y="176" font-size="32">He answered on the field.</text>
<g id="fury"><circle class="loss" cx="220" cy="425" r="75"/><text class="m" x="220" y="433" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">FURY</text>
<path class="s-muted" d="M300 425L380 325M300 425H380M300 425L380 525" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="chips"></g>
<g id="wallg"><g id="thru"></g><g id="wall"></g></g>
<g id="wlab"><text class="m" x="1160" y="650" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE BARRIER STAYED BROKEN</text></g>
<g id="row1"><text class="m" x="120" y="690" font-size="20">WHAT IT TAKES (ILLUSTRATION)</text><text class="m" x="120" y="750" font-size="22">THROWING A PUNCH</text><rect id="barP" class="loss" x="600" y="728" width="0" height="30" rx="6"/></g>
<g id="row2"><text class="m" x="120" y="820" font-size="22" style="fill:var(--gain)">HOLDING BACK, NOT WEAKNESS</text><rect id="barH" class="gain" x="600" y="798" width="0" height="30" rx="6"/></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your turn to pause.</text>
<text class="b" x="120" y="176" font-size="32">Smaller tests will come.</text>
<g id="inbx"><rect class="s-line" x="120" y="230" width="520" height="430" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="275" font-size="22">INBOX</text></g>
<g id="inb"></g>
<g id="pz"><circle class="s-ink" cx="800" cy="460" r="90" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="770" y="410" width="22" height="100" rx="6"/><rect class="ink" x="808" y="410" width="22" height="100" rx="6"/></g>
<g id="arw"><path class="s-muted" d="M900 430L960 360M900 490L960 560" stroke-width="5" stroke-linecap="round"/><text class="m" x="960" y="280" font-size="20">ASK BEFORE YOU RESPOND</text></g>
<g id="goal"><rect class="gain" x="960" y="300" width="520" height="120" rx="16"/><text class="d5" x="1000" y="375" font-size="40" style="fill:var(--on-gain)">Serves my goal?</text></g>
<g id="pride"><rect x="960" y="500" width="520" height="120" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="1000" y="575" font-size="40" style="fill:var(--loss)">Only my pride?</text>
<path id="prx" class="s-loss" d="M1390 530l50 60M1440 530l-50 60" stroke-width="8" stroke-linecap="round"/></g>
<g id="work"><text class="d" x="120" y="790" font-size="46">Then let your work do the answering.</text></g>
</g>

<g id="s8" opacity="0">
<g id="chal"><text class="m" x="143" y="220" font-size="26">THIS WEEK: WAIT ONE FULL DAY BEFORE REPLYING</text></g>
<g id="q1"><text class="d" x="136" y="420" font-size="88" letter-spacing="-2">What happens when</text></g>
<g id="q2"><text class="d" x="136" y="530" font-size="88" letter-spacing="-2">your ego does not get</text></g>
<g id="q3"><text class="d" x="136" y="640" font-size="88" letter-spacing="-2">the <tspan style="fill:var(--gain)">last word</tspan>?</text></g>
<g id="cal">
<rect x="1180" y="600" width="260" height="230" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<rect class="ink" x="1180" y="600" width="260" height="44" rx="10"/>
