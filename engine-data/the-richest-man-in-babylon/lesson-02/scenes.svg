<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The secret.</text>
<g id="lab3"><text class="m" x="120" y="290" font-size="22">ALGAMISH’S SHORT ANSWER</text></g>
<g id="q3">
<text class="d" x="120" y="380" font-size="60">“A part of all</text>
<text class="d" x="120" y="460" font-size="60">you earn is</text>
<text class="d" x="120" y="540" font-size="60" style="fill:var(--gain)">yours to keep.”</text>
</g>
