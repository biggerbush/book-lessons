<g id="mbs"></g>
<circle id="drop" class="gain" cx="500" cy="330" r="20" opacity="0"/>
<g id="mo0"><rect class="s-line" x="800" y="300" width="680" height="100" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="850" cy="350" r="18"/><text class="d5" x="890" y="362" font-size="36">Remember a detail</text></g>
<g id="mo1"><rect class="s-line" x="800" y="430" width="680" height="100" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="850" cy="480" r="18"/><text class="d5" x="890" y="492" font-size="36">Keep a promise</text></g>
