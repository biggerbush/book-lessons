<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF HABIT · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Rewire your own</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">habits.</text>
<text class="b" x="120" y="600" font-size="32">A four-step method for taking apart any habit you want to change</text>
<g id="pz"></g>
<text id="pzl" class="m" x="1240" y="558" font-size="22" text-anchor="middle">THE AFTERNOON COOKIE</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cookie problem.</text>
<text class="b" x="120" y="176" font-size="32">Duhigg’s afternoon habit.</text>
