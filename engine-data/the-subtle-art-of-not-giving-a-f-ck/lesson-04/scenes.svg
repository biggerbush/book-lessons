<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Pick better values</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to measure yourself.</text>
<text class="b" x="120" y="600" font-size="32">Your suffering depends on the ruler you measure yourself with.</text>
