<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Admiral Jim Stockdale.</text>
<text class="b" x="120" y="176" font-size="32">A senior American officer, held prisoner in the Vietnam War.</text>
<g id="cell"><rect x="200" y="240" width="500" height="520" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><g id="stock"></g><circle class="gain" cx="478" cy="580" r="9"/></g>
<g id="bars"></g>
<g id="st0"><text id="yrs" class="d" x="820" y="390" font-size="140">8</text><text class="m" x="828" y="470" font-size="22">ABOUT EIGHT YEARS IN PRISON</text></g>
<g id="st1"><text id="tor" class="d" x="820" y="640" font-size="140" style="fill:var(--loss)">20+</text><text class="m" x="828" y="730" font-size="22">TORTURED MORE THAN TWENTY TIMES</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The optimists broke.</text>
<text class="b" x="120" y="176" font-size="32">Who didn’t make it out? Stockdale’s answer: the optimists.</text>
