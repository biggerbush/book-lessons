<text id="el" class="m" x="1080" y="300" font-size="22">PUT YOUR EGO ASIDE</text>
<g id="st0"><rect class="gain" x="880" y="380" width="600" height="96" rx="16"/><text class="d5" x="910" y="440" font-size="34" style="fill:var(--on-gain)">1  Admit the mistake.</text></g>
<g id="st1"><rect class="gain" x="880" y="500" width="600" height="96" rx="16"/><text class="d5" x="910" y="560" font-size="34" style="fill:var(--on-gain)">2  Take responsibility.</text></g>
<g id="st2"><rect class="gain" x="880" y="620" width="600" height="96" rx="16"/><text class="d5" x="910" y="680" font-size="34" style="fill:var(--on-gain)">3  Plan to prevent it.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Think of one problem</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you’ve been blaming</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">on <tspan style="fill:var(--loss)">someone else.</tspan></text></g>
