<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stay a step ahead.</text>
<text class="b" x="120" y="176" font-size="32">Plan for likely problems before they hit.</text>
<g id="cal"><rect class="s-ink" x="120" y="230" width="532" height="380" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="120" y="230" width="532" height="56" rx="10"/><g id="grid"></g><text class="m" x="120" y="660" font-size="20">LIKELY PROBLEMS, RANKED IN ADVANCE</text></g>
