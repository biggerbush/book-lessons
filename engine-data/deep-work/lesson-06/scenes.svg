<g id="s0">
<text class="m" x="120" y="150" font-size="28">DEEP WORK · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Drain the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">shallows.</text>
<text class="b" x="120" y="600" font-size="32">Shrink busywork on purpose so deep work has room.</text>
<path class="s-ink" d="M1310 700v50" stroke-width="10" stroke-linecap="round"/>
<rect id="w0" x="1184" y="600" width="252" height="96" rx="16" fill="var(--loss)" fill-opacity=".3"/>
