<text class="m" x="1420" y="600" font-size="20" text-anchor="end">HAPPIER</text>
<text class="d" x="1220" y="680" font-size="72" text-anchor="middle" style="fill:var(--loss)">?</text>
</g>
<g id="p_q"><text class="d" x="120" y="830" font-size="44">Maybe the most important question of all.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The inner thermostat.</text>
<text class="b" x="120" y="176" font-size="32">Happiness as chemistry inside the body.</text>
<g id="h_head"><circle class="s-ink" cx="300" cy="400" r="90" fill="var(--stage)" stroke-width="6"/><path class="ink" d="M170 640v-40a130 110 0 0 1 260 0v40z"/><g id="h_mol"></g></g>
