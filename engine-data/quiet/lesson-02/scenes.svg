</g>
<g id="wcap"><text class="d" x="120" y="830" font-size="44">The meetings inspired him to design his own.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Building it alone.</text>
<text class="b" x="120" y="176" font-size="32">After his day job at Hewlett-Packard, late into the night.</text>
<g id="cub">
