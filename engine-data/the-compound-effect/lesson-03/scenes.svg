<text id="stkl" class="m" x="1200" y="262" font-size="20">TINY CHOICES ADD UP</text>
<g id="stk"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fix: write it down.</text>
<text class="b" x="120" y="176" font-size="32">Carry a small notebook and a pen everywhere.</text>
