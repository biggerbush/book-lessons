<g id="s0">
<text class="m" x="120" y="150" font-size="28">MEASURE WHAT MATTERS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Align and connect</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">in the open.</text>
<text class="b" x="120" y="600" font-size="32">Why shared, visible goals keep everyone rowing the same way.</text>
<g id="flags"></g>
<g id="boat"><path d="M1180 430Q1300 385 1420 430Q1300 475 1180 430Z" fill="var(--stage)" class="s-ink" stroke-width="6" stroke-linejoin="round"/><g id="oars"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Goals live in hiding.</text>
<text class="b" x="120" y="176" font-size="32">Private documents. Managers’ heads.</text>
<g id="rooms"></g>
<g id="ov"><path d="M500 370H720" stroke="var(--loss)" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M560 236V360" stroke="var(--loss)" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
<rect x="240" y="345" width="260" height="50" rx="25" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<rect x="720" y="345" width="260" height="50" rx="25" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="370" y="377" font-size="20" text-anchor="middle" style="fill:var(--loss)">SAME PROJECT</text>
<text class="m" x="850" y="377" font-size="20" text-anchor="middle" style="fill:var(--loss)">SAME PROJECT</text>
<text class="m" x="560" y="225" font-size="20" text-anchor="middle" style="fill:var(--loss)">UNSEEN OVERLAP</text>
<text class="m" x="120" y="660" font-size="22">TWO TEAMS, SAME WORK, FOR MONTHS</text></g>
<g id="blk"><g id="blkp"></g>
<rect x="1250" y="268" width="60" height="54" rx="12" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="d" x="1280" y="308" font-size="38" text-anchor="middle" style="fill:var(--loss)">?</text>
<path d="M1400 268h50l-50 64h50z" fill="none" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1480" y="660" font-size="22" text-anchor="end" style="fill:var(--loss)">WAITING FOR HELP NO ONE PLANNED</text></g>
<g id="s1t"><text class="d" x="120" y="790" font-size="46">Nobody can see anyone else’s goals.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make every OKR public.</text>
<text class="b" x="120" y="176" font-size="32">Open by default, all the way to the top.</text>
<g id="lk"><rect class="ink" x="170" y="320" width="100" height="80" rx="10"/><path id="shk" d="M190 320v-30a30 30 0 0 1 60 0v30" fill="none" class="s-ink" stroke-width="10"/>
<text class="m" x="220" y="450" font-size="22" text-anchor="middle" style="fill:var(--gain)">OPEN</text></g>
<g id="mon"><rect x="360" y="220" width="880" height="480" rx="16" fill="var(--stage)" class="s-ink" stroke-width="7"/><path class="ink" d="M770 700l-20 66h100l-20-66z"/>
<text class="m" x="400" y="264" font-size="20">COMPANY NETWORK · EVERYONE’S OKRS</text></g>
<g id="cards"></g>
<g id="ceo"><rect class="gain" x="640" y="290" width="320" height="96" rx="12"/><text class="m" x="800" y="346" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">TOP-LEVEL OKRS</text></g>
<g id="view"></g>
<g id="s2t"><text class="d" x="120" y="840" font-size="40">Anyone can see what leaders are aiming for.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Visible goals line up.</text>
<text class="b" x="120" y="176" font-size="32">Overlaps and gaps jump out quickly.</text>
<g id="tree"></g>
<g id="thr"><path d="M740 590L830 470M830 410L560 310M700 650Q650 700 600 650" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round"/></g>
<g id="eyes"></g>
<g id="mag"><circle r="56" fill="var(--stage)" fill-opacity=".35" class="s-ink" stroke-width="8"/><path d="M40 40l42 42" class="s-ink" stroke-width="14" stroke-linecap="round"/></g>
<g id="w0"><circle cx="1096" cy="332" r="10" class="loss"/><text class="m" x="1120" y="340" font-size="22">OVERLAPS JUMP OUT</text></g>
<g id="w1"><circle cx="1096" cy="412" r="10" fill="none" class="s-muted" stroke-width="4" stroke-dasharray="4 4"/><text class="m" x="1120" y="420" font-size="22">GAPS JUMP OUT</text></g>
<g id="w2"><circle cx="1096" cy="492" r="10" class="gain"/><text class="m" x="1120" y="500" font-size="22">YOUR WORK LINKS UP</text><text class="m" x="1120" y="532" font-size="22">AND SIDEWAYS</text></g>
<g id="w3"><circle cx="1096" cy="612" r="10" class="ink"/><text class="m" x="1120" y="620" font-size="22">OTHERS SEE IT, SO</text><text class="m" x="1120" y="652" font-size="22">YOU CHOOSE WITH CARE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The cascade trap.</text>
<text class="b" x="120" y="176" font-size="32">Goals copied strictly from the top down.</text>
<g id="steps"></g>
<g id="clk"><circle cx="1300" cy="370" r="110" fill="var(--stage)" class="s-ink" stroke-width="7"/><g id="tk"></g>
<path id="hh" d="M1300 370v-50" class="s-ink" stroke-width="8" stroke-linecap="round"/><path id="mh" d="M1300 370v-80" class="s-loss" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1300" y="540" font-size="22" text-anchor="middle" style="fill:var(--loss)">RIGID AND SLOW</text></g>
<g id="otk"><text class="m" x="1260" y="760" font-size="22" text-anchor="middle">ORDER TAKERS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let goals bubble up.</text>
<text class="b" x="120" y="176" font-size="32">From the front line, closest to customers and problems.</text>
<g id="lead5"><rect x="200" y="240" width="500" height="70" rx="14" fill="var(--stage)" class="s-ink" stroke-width="5"/><text class="m" x="450" y="284" font-size="22" text-anchor="middle">LEADERS</text></g>
<g id="team"><path d="M150 710H760" class="s-line" stroke-width="5"/><text class="m" x="455" y="750" font-size="20" text-anchor="middle">FRONT LINE</text></g>
<g id="bub"></g>
<g id="cust"><path d="M720 650H1130" stroke="var(--gain)" stroke-width="5" stroke-dasharray="10 10"/>
<text class="m" x="925" y="630" font-size="20" text-anchor="middle" style="fill:var(--gain)">BEST OPPORTUNITIES</text>
<text class="m" x="1290" y="750" font-size="20" text-anchor="middle">CUSTOMERS</text></g>
<g id="upa"><path d="M880 560V320" class="s-gain" stroke-width="18" stroke-linecap="round"/><path class="gain" d="M836 330l44-60 44 60z"/>
<text class="d5" x="950" y="340" font-size="34">Help write your goals,</text><text class="d5" x="950" y="386" font-size="34">care more about them.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Down, up and sideways.</text>
<text class="b" x="120" y="176" font-size="32">Leaders set the direction. Teams choose the route.</text>
<g id="arr6"><path d="M150 260V700" class="s-ink" stroke-width="10" stroke-linecap="round"/><path class="ink" d="M126 690l24 34 24-34z"/>
<path d="M216 724V290" class="s-gain" stroke-width="10" stroke-linecap="round"/><path class="gain" d="M192 294l24-34 24 34z"/>
<text class="m" x="150" y="770" font-size="20" text-anchor="middle">DOWN</text><text class="m" x="216" y="770" font-size="20" text-anchor="middle" style="fill:var(--gain)">UP</text></g>
<g id="lead6"><rect x="520" y="230" width="560" height="70" rx="14" class="ink"/><text class="m" x="800" y="274" font-size="22" text-anchor="middle" style="fill:var(--stage)">LEADERS · DIRECTION</text></g>
<g id="teams6"></g>
<g id="rts" fill="none" stroke="var(--gain)" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round"><path d="M390 640C300 520 520 420 700 300"/><path d="M800 640c60-60-60-120 0-180s-60-120 0-160"/><path d="M1210 640C1260 500 900 450 900 300"/></g>
<g id="cmp"><circle cx="1370" cy="300" r="70" fill="var(--stage)" class="s-ink" stroke-width="6"/><text class="m" x="1370" y="252" font-size="18" text-anchor="middle">N</text>
<g id="ndl"><path class="gain" d="M1370 262l12 38h-24z"/><path class="ink" d="M1370 338l12-38h-24z"/></g></g>
<g id="side"><path d="M520 680H670M930 680H1080" class="s-gain" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/><g id="sdots"></g>
<text class="m" x="800" y="790" font-size="22" text-anchor="middle">SHARED KEY RESULTS · NOBODY WAITS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it this week.</text>
<text class="b" x="120" y="176" font-size="32">Three small steps toward open goals.</text>
<g id="c1"><rect x="120" y="230" width="420" height="500" rx="18" fill="var(--stage)" class="s-line" stroke-width="3"/><circle cx="170" cy="290" r="30" class="gain"/><text class="d" x="170" y="302" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">1</text>
<rect x="250" y="360" width="160" height="190" rx="10" fill="var(--stage)" class="s-ink" stroke-width="6"/><path d="M280 410h100M280 450h100M280 490h70" class="s-line" stroke-width="7" stroke-linecap="round"/><circle cx="330" cy="360" r="12" class="gain"/>
<text class="d5" x="150" y="640" font-size="28">Post your top goals</text><text class="d5" x="150" y="680" font-size="28">where the team sees.</text></g>
<g id="c2"><rect x="590" y="230" width="420" height="500" rx="18" fill="var(--stage)" class="s-line" stroke-width="3"/><circle cx="640" cy="290" r="30" class="gain"/><text class="d" x="640" y="302" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">2</text>
<g id="pp2"></g>
<g id="ask"><rect x="680" y="350" width="180" height="60" rx="16" fill="var(--stage)" class="s-gain" stroke-width="5"/><path d="M712 410v24l24-24" fill="var(--stage)" class="s-gain" stroke-width="5" stroke-linejoin="round"/><text class="m" x="770" y="388" font-size="20" text-anchor="middle">YOUR GOALS?</text></g>
<text class="d5" x="620" y="640" font-size="28">Ask one colleague</text><text class="d5" x="620" y="680" font-size="28">to share theirs too.</text></g>
<g id="c3"><rect x="1060" y="230" width="420" height="500" rx="18" fill="var(--stage)" class="s-line" stroke-width="3"/><circle cx="1110" cy="290" r="30" class="gain"/><text class="d" x="1110" y="302" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">3</text>
<path class="ink" transform="translate(1150 410)" d="M0 0h80v30a20 20 0 0 1 0 40v30h-80z"/>
<path id="pb" class="gain" d="M0 0h100v100h-100v-30a20 20 0 0 0 0-40z"/>
<g id="fit"><text class="m" x="1250" y="560" font-size="20" text-anchor="middle" style="fill:var(--gain)">FIT TOGETHER</text></g>
<text class="d5" x="1090" y="640" font-size="28">Look for overlaps,</text><text class="d5" x="1090" y="680" font-size="28">gaps and ways to help.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which goals were handed</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">to you, and which did</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">you <tspan style="fill:var(--gain)">choose</tspan> yourself?</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">COULD SOMEONE ACROSS THE HALL SEE THEM TODAY?</text>
<path d="M1310 690Q1380 630 1450 690Q1380 750 1310 690Z" fill="var(--stage)" class="s-ink" stroke-width="6"/><circle id="pup" cx="1380" cy="690" r="18" class="gain"/></g>
</g>