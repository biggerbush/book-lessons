<g id="clt"><text class="d" x="120" y="830" font-size="44">Calm is a skill, and the team copies it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step back to see.</text>
<text class="b" x="120" y="176" font-size="32">Even one pace back shows the bigger picture.</text>
