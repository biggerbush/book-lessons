<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The pull of</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">random numbers.</text>
<text class="b" x="120" y="600" font-size="32">How a meaningless number can quietly steer your judgment.</text>
<g id="tw"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A rigged wheel of fortune.</text>
<text class="b" x="120" y="176" font-size="32">Kahneman and Amos Tversky’s experiment.</text>
<g id="s1w"></g>
<g id="rig">
<text class="m" x="760" y="280" font-size="22">SECRETLY RIGGED TO STOP ONLY AT</text>
<rect class="gain" x="760" y="305" width="180" height="100" rx="22"/><text class="d" x="850" y="380" font-size="68" text-anchor="middle" style="fill:var(--on-gain)">10</text>
<rect class="gain" x="970" y="305" width="180" height="100" rx="22"/><text class="d" x="1060" y="380" font-size="68" text-anchor="middle" style="fill:var(--on-gain)">65</text>
</g>
<g id="stu"></g>
<g id="stl"><text class="m" x="760" y="620" font-size="20">STUDENTS SPIN, WRITE IT DOWN, THEN ANSWER</text></g>
<g id="unq">
<rect class="s-ink" x="760" y="655" width="720" height="140" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="d5" x="790" y="712" font-size="34">What percentage of African nations</text>
<text class="d5" x="790" y="762" font-size="34">belong to the United Nations?</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The number leaks in.</text>
<text class="b" x="120" y="176" font-size="32">Everyone knew the wheel had nothing to do with Africa.</text>
<g id="ax">
<path class="s-ink" d="M200 520H1400M200 505v30M800 505v30M1400 505v30" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="200" y="564" font-size="20" text-anchor="middle">0%</text>
<text class="m" x="800" y="564" font-size="20" text-anchor="middle">50%</text>
<text class="m" x="1400" y="564" font-size="20" text-anchor="middle">100%</text>
<text class="m" x="1400" y="610" font-size="20" text-anchor="end">% OF AFRICAN NATIONS IN THE UN</text>
</g>
<g id="a10">
<text class="m" x="320" y="324" font-size="24" text-anchor="middle">WHEEL</text>
<rect class="s-loss" x="260" y="340" width="120" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="320" y="398" font-size="52" text-anchor="middle" style="fill:var(--loss)">10</text>
<path class="s-loss" d="M320 420V520" stroke-width="4" stroke-dasharray="6 8"/>
<circle class="gain" cx="500" cy="520" r="18"/>
<text class="d" x="500" y="630" font-size="56" text-anchor="middle" style="fill:var(--gain)">25%</text>
<text class="m" x="500" y="672" font-size="24" text-anchor="middle">AVERAGE</text>
<text class="m" x="500" y="704" font-size="24" text-anchor="middle">GUESS</text>
</g>
<g id="a65">
<text class="m" x="980" y="324" font-size="24" text-anchor="middle">WHEEL</text>
<rect class="s-loss" x="920" y="340" width="120" height="80" rx="14" fill="var(--stage)" stroke-width="5"/>
<text class="d" x="980" y="398" font-size="52" text-anchor="middle" style="fill:var(--loss)">65</text>
<path class="s-loss" d="M980 420V520" stroke-width="4" stroke-dasharray="6 8"/>
<circle class="gain" cx="740" cy="520" r="18"/>
<text class="d" x="740" y="630" font-size="56" text-anchor="middle" style="fill:var(--gain)">45%</text>
<text class="m" x="740" y="672" font-size="24" text-anchor="middle">AVERAGE</text>
<text class="m" x="740" y="704" font-size="24" text-anchor="middle">GUESS</text>
</g>
<g id="pull"><path class="s-loss" d="M480 470H350m22-18-22 18 22 18M760 470H950m-22-18 22 18-22 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pulled"><text class="d" x="120" y="790" font-size="46">The random number pulled answers toward it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="62">Adjusting, but stopping too soon.</text>
<text class="b" x="120" y="176" font-size="32">Kahneman describes two ways anchors work.</text>
<g id="lad">
<path class="s-gain" d="M340 230h220" stroke-width="5" stroke-dasharray="10 8"/>
<text class="m" x="580" y="237" font-size="20" style="fill:var(--gain)">TRUE VALUE</text>
<path class="s-ink" d="M380 250V790M500 250V790M380 760h120M380 700h120M380 640h120M380 580h120M380 520h120M380 460h120M380 400h120M380 340h120M380 280h120" stroke-width="7" stroke-linecap="round"/>
<rect class="loss" x="340" y="790" width="200" height="14" rx="4"/>
<text class="m" x="440" y="844" font-size="24" text-anchor="middle">ANCHOR</text>
<path id="miss" class="s-muted" d="M440 500V262" stroke-width="4" stroke-dasharray="6 8"/>
<circle id="clm" class="gain" cx="440" cy="770" r="24"/>
</g>
<g id="l1">
<text class="m" x="760" y="300" font-size="22">WAY 1 · SLOW AND DELIBERATE</text>
<text class="d5" x="760" y="370" font-size="40">Start at the anchor,</text>
<text class="d5" x="760" y="420" font-size="40">then adjust away from it.</text>
</g>
<g id="stp">
<polygon points="688,560 660,588 620,588 592,560 592,520 620,492 660,492 688,520" fill="var(--stage)" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="640" y="550" font-size="26" text-anchor="middle" style="fill:var(--loss)">STOP</text>
</g>
<g id="l2">
<text class="d5" x="760" y="560" font-size="40">System 2 tires quickly</text>
<text class="d5" x="760" y="610" font-size="40" style="fill:var(--loss)">and stops too soon.</text>
<text class="m" x="760" y="670" font-size="22">STILL TOO CLOSE TO THE STARTING POINT</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A quiet suggestion.</text>
<text class="b" x="120" y="176" font-size="32">The second way is automatic.</text>
<g id="bulb">
<circle id="glow" class="s-gain" cx="300" cy="290" r="60" fill="none" stroke-width="4" opacity=".4"/>
<circle class="gain" cx="300" cy="290" r="46"/>
<rect class="ink" x="282" y="336" width="36" height="30" rx="4"/>
<path class="s-gain" d="M300 222v-18M238 290h-18M362 290h18M256 246l-13-13M344 246l13-13" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="hd"></g>
<g id="cloud">
<circle class="s-ink" cx="410" cy="400" r="12" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="462" cy="350" r="18" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="520" y="230" width="960" height="460" rx="140" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="600" y="500" font-size="160" style="fill:var(--loss)">65</text>
<text class="m" x="610" y="622" font-size="26">ANCHOR</text>
<g id="ideas"></g>
</g>
<g id="nudge"><text class="d" x="120" y="820" font-size="46">You never feel the nudge.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Even experts get anchored.</text>
<text class="b" x="120" y="176" font-size="32">Professionals are not immune.</text>
<g id="jdg">
<g id="jp"></g>
<rect class="ink" x="140" y="470" width="360" height="40" rx="6"/>
<rect class="gain" x="350" y="400" width="70" height="28" rx="6" transform="rotate(-20 385 414)"/>
<path class="s-ink" d="M392 426l30 40" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="140" y="550" font-size="20">EXPERIENCED GERMAN JUDGES</text>
</g>
<g id="case">
<rect class="s-ink" x="140" y="590" width="380" height="220" rx="14" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="170" y="635" font-size="20">CASE FILE</text>
<text class="d5" x="170" y="700" font-size="40">Shoplifting</text>
<path class="s-line" d="M170 740h300M170 775h220" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="d9"><rect class="s-ink" x="620" y="260" width="120" height="120" rx="18" fill="var(--stage)" stroke-width="6"/><text class="d" x="680" y="345" font-size="72" text-anchor="middle" style="fill:var(--loss)">9</text></g>
<g id="d3"><rect class="s-ink" x="620" y="520" width="120" height="120" rx="18" fill="var(--stage)" stroke-width="6"/><text class="d" x="680" y="605" font-size="72" text-anchor="middle">3</text></g>
<g id="rows"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Anchors are everywhere.</text>
<text class="b" x="120" y="176" font-size="32">Wherever numbers show up.</text>
<g id="cards"></g>
<g id="i0"><path class="s-ink" d="M250 380L330 300L410 380V450H250Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="312" y="405" width="36" height="45"/><text class="m" x="330" y="485" font-size="22" text-anchor="middle">ASKING PRICE</text></g>
<g id="i1"><rect class="s-ink" x="710" y="310" width="180" height="120" rx="8" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M712 314L800 380L888 314" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="800" y="485" font-size="22" text-anchor="middle">FIRST SALARY OFFER</text></g>
<g id="i2"><rect class="s-ink" x="1210" y="310" width="120" height="140" rx="22" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="1245" y="294" width="50" height="10" rx="4"/><circle class="gain" cx="1270" cy="380" r="24"/><text class="m" x="1270" y="485" font-size="22" text-anchor="middle">SUGGESTED DONATION</text></g>
<g id="sgn"><rect class="s-loss" x="120" y="560" width="520" height="200" rx="16" fill="var(--stage)" stroke-width="6"/><text class="d" x="380" y="670" font-size="72" text-anchor="middle" style="fill:var(--loss)">LIMIT 12</text><text class="m" x="380" y="720" font-size="24" text-anchor="middle">PER PERSON</text></g>
<g id="cart"><path class="s-ink" d="M720 600h50l40 140h260l40-110H790" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle class="ink" cx="840" cy="770" r="16"/><circle class="ink" cx="1040" cy="770" r="16"/><g id="items"></g></g>
<g id="more"><text class="m" x="1150" y="690" font-size="22" style="fill:var(--gain)">SHOPPERS BUY MORE</text></g>
<g id="hs"><text class="d" x="120" y="850" font-size="40">Whoever names the first number has a head start.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fight back.</text>
<text class="b" x="120" y="176" font-size="32">Assume any number on the table has already influenced you.</text>
<g id="c0">
<rect class="s-line" x="120" y="230" width="420" height="510" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="gain" d="M330 280l90 34v60q0 84-90 120q-90-36-90-120v-60z"/>
<path d="M290 390l30 30 55-60" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="150" y="560" font-size="38">Assume influence</text>
<text class="m" x="150" y="610" font-size="20">ANY NUMBER ON THE TABLE</text><text class="m" x="150" y="642" font-size="20">HAS ALREADY MOVED YOU</text>
</g>
<g id="c1">
<rect class="s-line" x="590" y="230" width="420" height="510" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-loss" d="M800 300V456" stroke-width="8" stroke-linecap="round"/>
<path id="aL" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path id="aR" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="494" font-size="24" text-anchor="middle">ANCHOR</text>
<text class="d5" x="620" y="560" font-size="38">Argue the opposite</text>
<text class="m" x="620" y="610" font-size="20">LIST REASONS THE TRUE</text><text class="m" x="620" y="642" font-size="20">VALUE IS FAR FROM IT</text>
</g>
<g id="c2">
<rect class="s-line" x="1060" y="230" width="420" height="510" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M1120 420h160M1140 420v60M1260 420v60" stroke-width="7" stroke-linecap="round"/>
<rect class="s-loss" x="1165" y="368" width="70" height="50" rx="4" fill="var(--stage)" stroke-width="4"/>
<path id="xo" class="s-loss" d="M1180 378l40 30M1220 378l-40 30" stroke-width="5" stroke-linecap="round"/>
<g id="walker"></g>
<text class="d5" x="1090" y="560" font-size="38">Don’t counter</text>
<text class="m" x="1090" y="610" font-size="20">IF A FIRST OFFER IS</text><text class="m" x="1090" y="642" font-size="20">OUTRAGEOUS, REFUSE TO</text><text class="m" x="1090" y="674" font-size="20">NEGOTIATE FROM THERE</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qm"><circle id="ring" class="s-gain" cx="1370" cy="280" r="96" fill="none" stroke-width="5" stroke-dasharray="14 12"/><circle class="gain" cx="1370" cy="280" r="72"/><text class="d" x="1370" y="318" font-size="110" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="80" letter-spacing="-2">A price. A deadline.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="80" letter-spacing="-2">An estimate.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">Who chose this number <tspan style="fill:var(--gain)">first?</tspan></text></g>
<g id="scr"><text class="m" x="143" y="700" font-size="26">THEN BUILD YOUR OWN ESTIMATE FROM SCRATCH</text></g>
</g>