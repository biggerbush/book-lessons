<g id="s0">
<text class="m" x="120" y="150" font-size="28">GRIT · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Practice that actually</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">makes you better.</text>
<text class="b" x="120" y="600" font-size="32">Why some practice works, and most practice doesn’t.</text>
<rect class="s-ink" x="1160" y="220" width="300" height="290" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1160" y="220" width="300" height="50"/>
