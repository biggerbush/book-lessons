<g id="s0">
<text class="m" x="120" y="150" font-size="28">GRIT · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Hope keeps you</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">getting back up.</text>
<text class="b" x="120" y="600" font-size="32">Why believing your effort matters keeps you going after failure</text>
<path class="s-line" d="M990 560H1470" stroke-width="5" stroke-linecap="round"/>
<g id="rnrW"><g id="rnr"><circle class="ink" cx="0" cy="-180" r="32"/><path class="ink" d="M-50 0v-90a50 50 0 0 1 100 0v90z"/></g></g>
<g id="hopeA"><path class="s-gain" d="M1290 520C1350 470 1380 390 1400 300" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M1374 316L1400 300L1414 328" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1480" y="260" font-size="20" text-anchor="end" style="fill:var(--gain)">BELIEF ABOUT THE FUTURE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hope that does the work.</text>
<text class="b" x="120" y="176" font-size="32">Not just wishing, but expecting your effort to help.</text>
<g id="wishP">
<rect class="s-line" x="120" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">WISHING</text>
<path class="s-line" d="M160 600H720" stroke-width="4"/>
<g id="wishFig"></g>
<circle class="ink" cx="360" cy="440" r="6" opacity=".5"/><circle class="ink" cx="420" cy="410" r="8" opacity=".5"/><circle class="ink" cx="480" cy="380" r="10" opacity=".5"/>
<path id="star" class="s-muted" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="120" y="700" font-size="34">Wishing things turn out fine.</text>
</g>
<g id="expP">
<rect class="s-line" x="840" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22" style="fill:var(--gain)">EXPECTING</text>
<polygon class="s-ink" points="880,600 1200,320 1440,600" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1200 320V262" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M1200 262h40l-10 12 10 12h-40z"/>
<g id="clm"></g>
<text class="d5" x="840" y="700" font-size="34">Expecting effort to make</text>
<text class="d5" x="840" y="744" font-size="34">tomorrow better.</text>
</g>
<g id="gritH"><text class="d" x="120" y="830" font-size="46">Gritty people carry this kind of hope.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two dogs, the same shocks.</text>
<text class="b" x="120" y="176" font-size="32">Martin Seligman and Steven Maier’s experiment, the 1960s.</text>
<g id="pens">
<rect class="s-line" x="160" y="260" width="580" height="380" rx="18" fill="var(--stage)" stroke-width="4"/>
<rect class="s-line" x="860" y="260" width="580" height="380" rx="18" fill="var(--stage)" stroke-width="4"/>
<path class="s-line" d="M190 600H710M890 600H1410" stroke-width="4"/>
<text class="m" x="190" y="305" font-size="22">DOG A</text><text class="m" x="890" y="305" font-size="22">DOG B</text>
</g>
<rect id="panel" class="gain" x="650" y="470" width="30" height="70" rx="6"/>
<g id="dogs"><g id="dA"></g><g id="dB"></g></g>
<path id="bA" class="loss" transform="translate(420 320)" d="M0 0l-24 56h22l-18 56 48-76h-24l20-36z"/>
<path id="bB" class="loss" transform="translate(1120 320)" d="M0 0l-24 56h22l-18 56 48-76h-24l20-36z"/>
<g id="lA"><text class="m" x="450" y="700" font-size="24" text-anchor="middle" style="fill:var(--gain)">PRESSES A PANEL, SHOCKS STOP</text></g>
<g id="lB"><text class="m" x="1150" y="700" font-size="24" text-anchor="middle" style="fill:var(--loss)">SAME SHOCKS, NO WAY TO STOP</text></g>
<g id="ctl"><text class="d" x="120" y="810" font-size="48">Same pain. Different control.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Later: an easy escape.</text>
<text class="b" x="120" y="176" font-size="32">Each dog went in a box with a low wall it could easily jump.</text>
<g id="boxes"></g>
<path id="bj1" class="loss" transform="translate(620 280)" d="M0 0l-24 56h22l-18 56 48-76h-24l20-36z"/>
<path id="bj2" class="loss" transform="translate(620 580)" d="M0 0l-24 56h22l-18 56 48-76h-24l20-36z"/>
<g id="jA"></g><g id="jB"></g>
<g id="zz"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why did they give up?</text>
<text class="b" x="120" y="176" font-size="32">Not the pain itself.</text>
<g id="ar">
<rect class="s-ink" x="160" y="260" width="300" height="120" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="310" y="330" font-size="26" text-anchor="middle">MY ACTION</text>
<rect class="s-ink" x="1140" y="260" width="300" height="120" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1290" y="330" font-size="26" text-anchor="middle">THE RESULT</text>
<g id="lkL"></g><g id="lkR"></g>
</g>
<g id="nod"><text class="m" x="800" y="460" font-size="24" text-anchor="middle" style="fill:var(--loss)">NOTHING I DO MAKES A DIFFERENCE</text></g>
<g id="lh">
<g id="lhC"></g><g id="rain"></g><g id="lhF"></g>
<text class="m" x="640" y="600" font-size="22">SELIGMAN’S NAME FOR IT</text>
<text class="d" x="640" y="690" font-size="76">Learned</text>
<text class="d" x="640" y="780" font-size="76" style="fill:var(--loss)">helplessness.</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">How you explain it.</text>
<text class="b" x="120" y="176" font-size="32">People show a version of this in how they explain bad events.</text>
<g id="hd"></g>
<g id="wall">
<circle class="ink" cx="372" cy="348" r="7"/><circle class="ink" cx="398" cy="330" r="10"/>
<g id="bricks"></g>
<text class="m" x="160" y="730" font-size="24" style="fill:var(--loss)">PESSIMIST</text>
<text class="d5" x="160" y="778" font-size="36">Permanent. All-encompassing.</text>
</g>
<g id="door">
<circle class="ink" cx="1092" cy="348" r="7"/><circle class="ink" cx="1118" cy="330" r="10"/>
<rect class="gain" x="1180" y="300" width="180" height="260"/>
<rect class="s-ink" x="1180" y="300" width="180" height="260" fill="none" stroke-width="6"/>
<polygon id="dp" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="880" y="730" font-size="24" style="fill:var(--gain)">OPTIMIST</text>
<text class="d5" x="880" y="778" font-size="36">Temporary. Specific. Fixable.</text>
</g>
<g id="gr"><rect class="s-gain" x="840" y="230" width="640" height="575" rx="22" fill="none" stroke-width="5"/><text class="m" x="870" y="275" font-size="22" style="fill:var(--gain)">GRITTY PEOPLE TEND TO BE HERE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same setback. Two stories.</text>
<text class="b" x="120" y="176" font-size="32">Picture two students who both fail a test.</text>
<g id="ex">
