<path class="s-gain" d="M1056 610h-0" stroke-width="0"/>
<text class="m" x="1046" y="618" font-size="24" text-anchor="end" style="fill:var(--gain)">YOU</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Years of dread.</text>
<text class="b" x="120" y="176" font-size="32">Until he was 29, Tolle lived with almost constant anxiety.</text>
<g id="anx"><text class="m" x="120" y="270" font-size="22">ALMOST CONSTANT ANXIETY</text></g>
<g id="dep"><text class="m" x="120" y="306" font-size="22" style="fill:var(--loss)">LONG STRETCHES OF DEEP DEPRESSION</text></g>
<g id="sky"></g>
<g id="rainG"></g>
<path class="s-line" d="M160 760H1440" stroke-width="6" stroke-linecap="round"/>
<path id="tl" class="s-loss" d="M160 760H1440" stroke-width="6" stroke-linecap="round" stroke-dasharray="1280" stroke-dashoffset="1280"/>
<path class="s-ink" d="M160 746v28M1440 746v28" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="160" y="806" font-size="22" text-anchor="middle">AGE 0</text>
<text class="m" x="1440" y="806" font-size="22" text-anchor="middle">AGE 29</text>
<g id="walker">
<g id="wk"></g>
<path id="jit" class="s-loss" d="M-96 540l8-10 8 10 8-10M64 540l8-10 8 10 8-10" fill="none" stroke-width="4" stroke-linecap="round"/>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The night it broke.</text>
<text class="b" x="120" y="176" font-size="32">Shortly after his 29th birthday, he woke filled with dread.</text>
<g id="bed">
<rect class="ink" x="140" y="440" width="26" height="210"/>
<rect class="ink" x="166" y="570" width="530" height="36" rx="6"/>
<path class="s-ink" d="M190 606v44M676 606v44" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="180" y="532" width="100" height="38" rx="18" fill="var(--stage)" stroke-width="5"/>
<circle class="ink" cx="232" cy="520" r="30"/>
<rect class="s-ink" x="266" y="520" width="420" height="50" rx="22" fill="var(--line)" stroke-width="5"/>
<path id="dread" class="s-loss" d="M190 460l14-20 14 20 14-20 14 20 14-20 14 20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="win">
<rect x="860" y="240" width="400" height="320" fill="var(--loss)" fill-opacity=".2"/>
<circle class="s-loss" cx="1170" cy="310" r="30" fill="none" stroke-width="6"/>
<path class="loss" d="M860 560l40-80 40 50 40-110 40 90 40-60 40 100 40-70 40 40 40-60 40 100z"/>
<rect class="s-ink" x="860" y="240" width="400" height="320" fill="none" stroke-width="8"/>
<path class="s-ink" d="M1060 240v320M860 400h400" stroke-width="6"/>
<text class="m" x="1060" y="604" font-size="22" text-anchor="middle">HOSTILE AND MEANINGLESS</text>
</g>
<g id="quote">
<rect class="s-loss" x="120" y="700" width="1360" height="120" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="160" y="776" font-size="44">“I cannot live with myself much longer.”</text>
<text class="m" x="1440" y="774" font-size="20" text-anchor="end">IN HIS WORDS</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">One or two?</text>
<text class="b" x="120" y="176" font-size="32">“If I cannot live with myself, there must be two of me.”</text>
<g id="figs"><g id="fB"></g><g id="fA"></g></g>
<g id="lA"><text class="m" x="560" y="640" font-size="24" text-anchor="middle" style="fill:var(--gain)">THE I</text></g>
<g id="lB"><text class="m" x="1040" y="640" font-size="24" text-anchor="middle" style="fill:var(--loss)">THE SELF I CANNOT LIVE WITH</text></g>
<g id="qm"><text class="d" x="800" y="530" font-size="180" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="real"><text class="d" x="120" y="800" font-size="48">Maybe only one of them is real.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Waking up.</text>
<text class="b" x="120" y="176" font-size="32">The question stunned his mind into silence.</text>
<g id="pn0"><rect class="s-line" x="120" y="230" width="400" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="spir"></g><circle class="ink" cx="320" cy="440" r="10"/>
<text class="m" x="320" y="670" font-size="20" text-anchor="middle">MIND FALLS SILENT</text></g>
<g id="pn1"><rect class="s-line" x="600" y="230" width="400" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle id="sun" class="gain" cx="800" cy="600" r="70"/>
<rect x="604" y="562" width="392" height="80" fill="var(--stage)"/>
<path class="s-ink" d="M604 560h392" stroke-width="6"/>
<path id="bird" class="s-ink" d="M0 0q17-22 34 0q17-22 34 0" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="670" font-size="20" text-anchor="middle">BIRDSONG, ALL NEW</text></g>
<g id="pn2"><rect class="s-line" x="1080" y="230" width="400" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M1150 500h260M1160 560v70M1400 560v70" stroke-width="8" stroke-linecap="round"/>
<circle id="halo" class="s-gain" cx="1280" cy="470" r="110" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<g id="bp"></g>
<path class="s-ink" d="M1140 560h280" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="1280" y="670" font-size="20" text-anchor="middle">NEARLY TWO YEARS OF PEACE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The voice is not you.</text>
<text class="b" x="120" y="176" font-size="32">The miserable self was a story made of thinking.</text>
<g id="obsI"></g>
<g id="obsG"><circle class="s-gain" cx="380" cy="500" r="175" fill="none" stroke-width="5" stroke-dasharray="12 12"/><g id="obsG2"></g>
<text class="m" x="380" y="720" font-size="22" text-anchor="middle" style="fill:var(--gain)">QUIET AWARENESS</text></g>
<g id="cordG"><path id="c1" class="s-loss" d="M570 430H700" stroke-width="6" stroke-linecap="round"/><path id="c2" class="s-loss" d="M700 430H830" stroke-width="6" stroke-linecap="round"/></g>
<g id="cloudG"><g id="cloudT">
<circle class="loss" cx="930" cy="420" r="90"/><circle class="loss" cx="1060" cy="380" r="110"/><circle class="loss" cx="1190" cy="420" r="90"/><rect class="loss" x="930" y="420" width="260" height="90"/>
<path d="M950 400h220M970 440h180M990 480h140" stroke="var(--stage)" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1060" y="564" font-size="22" text-anchor="middle">A STORY MADE OF THINKING</text>
</g></g>
<g id="stop"><text class="d" x="120" y="820" font-size="46">He stopped believing he was the voice.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why we suffer.</text>
<text class="b" x="120" y="176" font-size="32">We listen to the voice all day, as if it were the truth.</text>
<g id="man"><g id="manP"></g><circle id="loop" class="s-loss" cx="520" cy="370" r="70" fill="none" stroke-width="5" stroke-dasharray="26 16" stroke-linecap="round"/></g>
<g id="pills"></g>
<g id="chainG"><g id="chain"></g><circle class="loss" cx="520" cy="790" r="46"/>
<text class="m" x="590" y="798" font-size="22" style="fill:var(--loss)">SUFFERING</text></g>
<g id="ident"><text class="d" x="800" y="720" font-size="36">Identification, not life itself,</text><text class="d" x="800" y="776" font-size="36">causes most suffering.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">A tool, not a master.</text>
<text class="b" x="120" y="176" font-size="32">The mind is brilliant when you use it on purpose.</text>
<g id="col1"><g id="c7a"></g><path class="s-gain" d="M340 500L410 455" stroke-width="8" stroke-linecap="round"/><g id="g7a"></g>
<text class="m" x="360" y="680" font-size="22" text-anchor="middle">A BRILLIANT TOOL</text></g>
<g id="col2"><path class="s-muted" d="M570 450h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><g id="g7b"></g>
<path id="str" class="s-ink" fill="none" stroke-width="3"/><g id="pup"></g>
<text class="m" x="800" y="680" font-size="22" text-anchor="middle" style="fill:var(--loss)">RUNNING YOU</text></g>
<g id="col3"><path class="s-muted" d="M1010 450h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><g id="g7c"></g>
<path class="s-muted" d="M1260 316v40M1300 316v28" stroke-width="3"/>
<circle class="s-gain" cx="1280" cy="500" r="120" fill="none" stroke-width="4" stroke-dasharray="10 10"/><g id="c7c"></g>
<text class="m" x="1280" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">SEEN AS SEPARATE</text></g>
<g id="back"><text class="d" x="120" y="800" font-size="44">The first step to taking your life back.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="60" letter-spacing="-1">Next time the voice is</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="60" letter-spacing="-1">harsh, pause and ask:</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="60" letter-spacing="-1" style="fill:var(--gain)">who is hearing this?</text></g>
<g id="lisB"><g transform="translate(-20 -20)">
<text class="m" x="1010" y="232" font-size="20" style="fill:var(--loss)">THE VOICE</text>
<rect class="s-loss" x="1010" y="250" width="280" height="110" rx="30" fill="var(--stage)" stroke-width="6"/>
