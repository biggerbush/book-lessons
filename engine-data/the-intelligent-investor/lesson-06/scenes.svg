<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Buy a business,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a ticker.</text>
<text class="b" x="120" y="600" font-size="32">Judge every stock as if you were buying the whole company.</text>
<clipPath id="tclip"><rect x="1060" y="220" width="420" height="120" rx="12"/></clipPath>
<rect class="ink" x="1060" y="220" width="420" height="120" rx="12"/>
