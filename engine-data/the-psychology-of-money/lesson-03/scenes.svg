<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Time is the real</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">superpower.</text>
<text class="b" x="120" y="600" font-size="32">Why patience, not genius, builds the biggest fortunes.</text>
<g id="clk"><circle class="s-ink" cx="1300" cy="400" r="130" fill="var(--stage)" stroke-width="8"/><g id="tks"></g><path id="hh" class="s-ink" d="M1300 400V330" stroke-width="10" stroke-linecap="round"/><path id="mh" class="s-gain" d="M1300 400V295" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1300" cy="400" r="10"/></g>
<g id="coins"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The greatest investor alive.</text>
<text class="b" x="120" y="176" font-size="32">Most people assume his fortune comes from rare genius.</text>
<g id="wb"><g id="wbf"></g><text class="m" x="420" y="680" font-size="22" text-anchor="middle">WARREN BUFFETT</text></g>
<g id="gen"><circle class="ink" cx="495" cy="372" r="8"/><circle class="ink" cx="545" cy="346" r="12"/><circle class="s-ink" cx="650" cy="290" r="52" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="630" y="344" width="40" height="26" rx="4"/><path class="s-gain" d="M650 266v48M626 290h48" stroke-width="6" stroke-linecap="round"/><text class="m" x="650" y="420" font-size="22" text-anchor="middle">RARE GENIUS?</text></g>
<path id="gx" class="s-loss" d="M570 220L730 380" stroke-width="10" stroke-linecap="round"/>
<g id="qm"><text class="d" x="1150" y="640" font-size="400" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="120" y="800" font-size="40">That misses the most important part of the story.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One long line.</text>
<text class="b" x="120" y="176" font-size="32">Buffett’s life, from childhood to old age.</text>
<g id="tl"><path class="s-ink" d="M160 500H1420" stroke-width="6" stroke-linecap="round"/><g id="tlt"></g><text class="m" x="160" y="560" font-size="22">CHILDHOOD</text><text class="m" x="1420" y="560" font-size="22" text-anchor="end">OLD AGE</text></g>
<g id="ret"><path class="s-muted" d="M1060 380V600" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="1060" y="360" font-size="20" text-anchor="middle">NORMAL RETIREMENT</text></g>
<rect id="run" class="gain" x="300" y="490" height="20" rx="10" width="0"/>
<circle id="wk" class="gain" cx="300" cy="455" r="18"/>
<g id="a10"><path class="s-ink" d="M300 500V360" stroke-width="5"/><path class="gain" d="M300 360h90l-16 22 16 22h-90z"/><circle class="gain" cx="300" cy="500" r="16"/><text class="d" x="300" y="300" font-size="44">Age 10</text><text class="m" x="300" y="334" font-size="20">STARTS INVESTING</text></g>
<g id="dec"><path class="s-gain" d="M1060 640v20h340v-20" fill="none" stroke-width="5"/><text class="m" x="1230" y="700" font-size="20" text-anchor="middle" style="fill:var(--gain)">STILL GOING, DECADES PAST IT</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where the money came from.</text>
<text class="b" x="120" y="176" font-size="32">Buffett’s fortune, plotted across his life.</text>
<g id="late"><rect class="gain" x="806" y="260" width="294" height="520" fill-opacity=".15"/><path class="s-gain" d="M806 260V780" stroke-width="4" stroke-dasharray="8 8"/><text class="m" x="806" y="244" font-size="20" text-anchor="middle">MID-SIXTIES</text></g>
<g id="ax"><path class="s-ink" d="M160 260V780H1100" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="160" y="820" font-size="20">AGE 10</text><text class="m" x="1100" y="820" font-size="20" text-anchor="end">AGE →</text></g>
<polyline id="wc" class="s-ink" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g id="flat"><text class="m" x="200" y="740" font-size="20">FLAT FOR DECADES</text></g>
<g id="cmp"><text class="m" x="790" y="290" font-size="20" text-anchor="end" style="fill:var(--gain)">THIS IS COMPOUNDING →</text></g>
<g id="tot"><text class="m" x="1180" y="320" font-size="20">TOTAL FORTUNE, ROUGHLY</text><text id="tv" class="d" x="1176" y="410" font-size="80">$84B</text></g>
<g id="aft"><text class="m" x="1180" y="500" font-size="20">AFTER HIS MID-SIXTIES</text><text class="d" x="1176" y="590" font-size="80" style="fill:var(--gain)">$81B+</text></g>
<g id="sb"><rect class="ink" x="1180" y="640" width="11" height="40"/><rect class="gain" x="1195" y="640" width="285" height="40"/><text class="m" x="1180" y="720" font-size="20">SHARE OF THE FORTUNE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Skill versus secret.</text>
<text class="b" x="120" y="176" font-size="32">“His skill is investing, but his secret is time.”</text>
<g id="cardL"><rect class="s-ink" x="120" y="220" width="660" height="170" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="156" y="272" font-size="22">HIS SKILL</text><text class="d" x="156" y="356" font-size="64">Investing</text></g>
<g id="cardR"><rect class="gain" x="820" y="220" width="660" height="170" rx="18"/><text class="m" x="856" y="272" font-size="22" style="fill:var(--on-gain)">HIS SECRET</text><text class="d" x="856" y="356" font-size="64" style="fill:var(--on-gain)">Time</text></g>
<g id="real"><text class="m" x="300" y="466" font-size="20">REAL: FROM AGE 10, FOR DECADES PAST RETIREMENT</text><rect class="gain" x="300" y="480" width="1092" height="40" rx="20"/></g>
<g id="imag"><text class="m" x="580" y="586" font-size="20">IMAGINED: AGE 30 TO 60</text><rect id="ib" class="ink" x="580" y="600" width="0" height="40" rx="20"/></g>
<g id="tp"><circle class="gain" cx="1436" cy="500" r="40"/><circle class="loss" cx="1030" cy="620" r="12"/><text class="d" x="120" y="760" font-size="72" style="fill:var(--loss)">About $11.9 million</text><text class="m" x="120" y="810" font-size="22">SAME STRONG RETURNS · NOT BILLIONS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">More returns, less wealth.</text>
<text class="b" x="120" y="176" font-size="32">Jim Simons: about 66% a year since 1988.</text>
<text class="m" x="120" y="280" font-size="22">RETURNS PER YEAR</text>
<g id="sim"><text class="m" x="120" y="326" font-size="20">SIMONS</text><rect class="gain" x="120" y="340" width="600" height="70" rx="12"/><text class="d" x="146" y="392" font-size="40" style="fill:var(--on-gain)">~66%</text></g>
<g id="bfr"><text class="m" x="120" y="466" font-size="20">BUFFETT</text><rect class="ink" x="120" y="480" width="360" height="70" rx="12"/></g>
<g id="twr"><text class="m" x="1480" y="240" font-size="22" text-anchor="end">TOTAL WEALTH</text><path class="s-line" d="M840 740H1440" stroke-width="5" stroke-linecap="round"/><rect id="tw0" class="gain" x="900" width="180" rx="8"/><rect id="tw1" class="ink" x="1200" width="180" rx="8"/><text class="m" x="990" y="780" font-size="20" text-anchor="middle">BUFFETT</text><text class="m" x="1290" y="780" font-size="20" text-anchor="middle">SIMONS</text></g>
<g id="bf10"><text class="m" x="990" y="300" font-size="20" text-anchor="middle" style="fill:var(--gain)">STARTED AT ~10</text></g>
<g id="st50"><text class="m" x="1290" y="620" font-size="20" text-anchor="middle" style="fill:var(--loss)">STRIDE AT AGE ~50</text></g>
<g id="notyrs"><text class="d" x="120" y="850" font-size="40">He had the returns, but not the years.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Our brains think in straight lines.</text>
<text class="b" x="120" y="176" font-size="32">So compounding feels unnatural.</text>
<path class="s-ink" d="M160 240V760H1000" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="sln"><path class="s-muted" d="M160 760L1000 300" stroke-width="5" stroke-dasharray="12 10"/><path class="s-muted" d="M180 290h50" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="245" y="297" font-size="20">STRAIGHT-LINE GUESS</text></g>
<g id="lg1"><path class="s-gain" d="M180 330h50" stroke-width="7"/><text class="m" x="245" y="337" font-size="20">COMPOUNDING</text></g>
<polyline id="cc" class="s-gain" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g id="dts"></g>
<g id="bor"><text class="m" x="300" y="720" font-size="20">SMALL, BORING GAINS</text></g>
<g id="lp"><text class="m" x="980" y="250" font-size="22" text-anchor="end" style="fill:var(--gain)">LATE PAYOFF</text></g>
<g id="ppl"></g>
<g id="swp"><text class="m" x="1290" y="470" font-size="20" text-anchor="middle">MANY SWITCH PLANS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Patience beats brilliance.</text>
<text class="b" x="120" y="176" font-size="32">A decent return you can stick with for a very long time.</text>
<g id="spk"><polyline class="s-loss" fill="none" stroke-width="6" stroke-linejoin="round" points="160,540 220,470 260,500 320,400 360,440 420,350 470,380 520,330"/><path class="s-loss" d="M505 315l30 30M535 315l-30 30" stroke-width="6" stroke-linecap="round"/><text class="m" x="160" y="290" font-size="20">HIGHEST RETURN, BRIEFLY</text></g>
<polyline id="std" class="s-gain" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g id="stdl"><text class="m" x="1440" y="236" font-size="20" text-anchor="end" style="fill:var(--gain)">DECENT RETURN, KEPT FOR A VERY LONG TIME</text></g>
<g id="cal"><text class="m" x="120" y="610" font-size="20">EVERY EXTRA YEAR INVESTED</text><g id="yrs"></g></g>
<g id="heavy"><text class="d" x="120" y="800" font-size="44">Patience, not brilliance, does the heavy lifting.</text></g>
</g>

<g id="s8" opacity="0">
<g id="look"><text class="m" x="143" y="220" font-size="26" style="fill:var(--gain)">LOOK AT ONE INVESTMENT OR SAVINGS HABIT TODAY</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Could you happily keep</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">this going for the next</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">twenty years</tspan>?</text></g>
