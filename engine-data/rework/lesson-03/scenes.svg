<g id="s0">
<text class="m" x="120" y="150" font-size="28">REWORK · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Scratch your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">own itch.</text>
<text class="b" x="120" y="600" font-size="32">Great products start with a problem that bugs you personally.</text>
<g id="tfig"></g>
<g id="tarm"><path class="s-ink" d="M1368 432Q1424 340 1362 274" fill="none" stroke-width="18" stroke-linecap="round"/><circle class="gain" cx="1360" cy="270" r="18"/></g>
