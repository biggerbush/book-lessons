<rect class="ink" x="1092" y="290" width="16" height="470"/>
<polygon class="gain" points="1110,320 1400,320 1440,370 1400,420 1110,420"/>
<text class="d5" x="1140" y="382" font-size="34" style="fill:var(--on-gain)">Your terms</text>
<polygon class="loss" points="1090,460 800,460 760,510 800,560 1090,560"/>
<text class="m" x="820" y="518" font-size="22" style="fill:var(--stage)">THE OLD RULEBOOK</text>
</g>
<g id="tl"><text class="d" x="120" y="840" font-size="44">Terms that actually suit your life.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Test the warning.</text>
<text class="b" x="120" y="176" font-size="32">Put the warning on paper and look for its reason.</text>
<g id="nb">
<rect class="s-ink" x="120" y="230" width="820" height="550" rx="14" fill="var(--stage)" stroke-width="6"/>
<g id="rings"></g>
<path class="s-line" d="M530 280V740" stroke-width="4"/>
