</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Big enough.</text>
<text class="b" x="120" y="176" font-size="32">Large, established companies that can survive a bad year.</text>
<path class="s-ink" d="M180 760h760" stroke-width="6" stroke-linecap="round"/>
