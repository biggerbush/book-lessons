<g id="ring0"><circle class="gain" cx="560" cy="500" r="90"/><text class="d" x="560" y="515" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">SEE</text></g>
<g id="arw"></g>
<g id="legend"></g>
<g id="quote"><text class="d" x="120" y="830" font-size="44">“The way we see the problem is the problem.”</text></g>
</g>

<g id="s7" opacity="0">
