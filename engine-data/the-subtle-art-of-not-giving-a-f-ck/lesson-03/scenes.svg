<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE SUBTLE ART OF NOT GIVING A F*CK · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You are</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not special.</text>
<text class="b" x="120" y="600" font-size="32">Why feeling exceptional, or exceptionally broken, keeps you stuck.</text>
<g id="row0"></g>
<path id="star0" class="gain" opacity="0"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Jimmy.</text>
<text class="b" x="120" y="176" font-size="32">A friend of Manson’s, always with a big new business idea.</text>
<circle id="halo" class="s-gain" cx="320" cy="500" r="140" fill="none" stroke-width="5" opacity="0"/>
<g id="jim"><g id="jimP"></g></g>
<g id="bulb" opacity="0"><circle class="gain" cx="320" cy="280" r="36"/><rect class="ink" x="304" y="318" width="32" height="22" rx="4"/></g>
<g id="deck">
<rect class="s-ink" x="540" y="280" width="360" height="260" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M600 540l-30 120M840 540l30 120M720 540v120" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="566" y="322" font-size="20">BIG PLANS</text>
<polyline id="chart" class="s-gain" points="580,500 660,460 740,472 820,390 860,340" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/>
</g>
<g id="work">
<rect class="s-line" x="1040" y="280" width="420" height="320" rx="16" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1070" y="330" font-size="22">THE WORK</text>
<rect class="s-loss" x="1070" y="370" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="1130" y="402" font-size="30">Build it</text>
<rect class="s-loss" x="1070" y="440" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="1130" y="472" font-size="30">Launch it</text>
<rect class="s-loss" x="1070" y="510" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="1130" y="542" font-size="30">Sell it</text>
</g>
<g id="dest"><text class="d" x="120" y="780" font-size="46">Still sure he was destined for success.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feeling good is cheap.</text>
<text class="b" x="120" y="176" font-size="32">The self-esteem movement: just feel good, and success follows.</text>
<g id="tro">
<path class="gain" d="M300 280h160v50a80 80 0 0 1-160 0z"/>
<path class="s-gain" d="M300 300h-30a30 30 0 0 0 30 50M460 300h30a30 30 0 0 1-30 50" fill="none" stroke-width="8" stroke-linecap="round"/>
<rect class="gain" x="366" y="410" width="28" height="60"/><rect class="ink" x="320" y="470" width="120" height="28" rx="4"/>
<text class="m" x="380" y="550" font-size="20" text-anchor="middle">SELF-ESTEEM MOVEMENT</text>
<text class="m" x="380" y="584" font-size="20" text-anchor="middle">FEEL GOOD = SUCCESS</text>
</g>
<g id="mir">
<rect class="loss" x="740" y="556" width="160" height="14" rx="7"/>
<g id="mirP"></g>
<text class="m" x="820" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">STUCK</text>
<path class="s-muted" d="M866 410H996" stroke-width="3" stroke-dasharray="6 8"/>
<rect class="s-ink" x="1000" y="250" width="260" height="380" rx="20" fill="var(--stage)" stroke-width="7"/>
<g id="refP"></g>
<path class="gain" d="M1100 342l6-32 24 20 24-20 6 32z"/>
<text class="m" x="1130" y="670" font-size="20" text-anchor="middle" style="fill:var(--gain)">CONFIDENT</text>
</g>
<g id="dc"><text class="d" x="120" y="790" font-size="46">Feeling good without earning it.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Entitlement has two faces.</text>
<text class="b" x="120" y="176" font-size="32">The obvious face, and the hidden face.</text>
<polygon id="ful" class="ink" points="800,566 750,650 850,650"/>
<g id="tilt">
<g id="f0"><g id="p0"></g><path class="ink" d="M450 356l6-30 24 20 24-20 6 30z"/></g>
<g id="f1"><g id="p1"></g><circle class="loss" cx="1090" cy="300" r="26"/><circle class="loss" cx="1125" cy="285" r="34"/><circle class="loss" cx="1160" cy="302" r="24"/><rect class="loss" x="1066" y="300" width="118" height="26" rx="13"/><path class="s-loss" d="M1095 336l-6 14M1125 336l-6 14M1155 336l-6 14" stroke-width="4" stroke-linecap="round"/></g>
<g id="plank"><path class="s-ink" d="M360 560H1240" stroke-width="12" stroke-linecap="round"/></g>
</g>
<g id="lbA"><text class="m" x="480" y="710" font-size="22" text-anchor="middle">I’M AWESOME. YOU ALL SUCK.</text></g>
<g id="lbB"><text class="m" x="1120" y="710" font-size="22" text-anchor="middle">I SUCK. YOU’RE ALL AWESOME.</text></g>
<g id="both"><text class="d" x="120" y="810" font-size="48">Both make themselves the exception.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why broken feels safe.</text>
<text class="b" x="120" y="176" font-size="32">“Nobody could ever understand my pain.”</text>
<g id="vb">
<circle id="bub" class="s-ink" cx="520" cy="520" r="180" fill="var(--stage)" stroke-width="5"/>
<g id="vicP"></g><circle class="loss" cx="520" cy="575" r="16"/>
<text class="m" x="520" y="750" font-size="22" text-anchor="middle">MY PAIN IS UNIQUE</text>
</g>
<g id="exp"><text class="m" x="130" y="404" font-size="20">EXPECTATIONS</text></g>
<g id="crw"></g>
<g id="crl"><text class="m" x="900" y="720" font-size="22">MILLIONS FACE THE SAME STRUGGLES</text></g>
<g id="ex2"><text class="d" x="120" y="830" font-size="44">So nobody can expect you to change.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The highlight reel.</text>
<text class="b" x="120" y="176" font-size="32">Media shows us only the extremes.</text>
<g id="ph"><rect class="s-ink" x="150" y="220" width="300" height="500" rx="32" fill="var(--stage)" stroke-width="7"/><g id="cards"></g></g>
<g id="rul">
