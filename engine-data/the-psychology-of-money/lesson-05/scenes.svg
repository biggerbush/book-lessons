<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Wealth is what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you don’t see.</text>
<text class="b" x="120" y="600" font-size="32">Why the richest people often have the least to show off</text>
<path class="s-line" d="M1060 520h420" stroke-width="5" stroke-linecap="round"/>
<g id="tcar"></g>
<g id="tq"><text class="d" x="1290" y="360" font-size="140" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Morgan Housel, the valet.</text>
<text class="b" x="120" y="176" font-size="32">Before he wrote about money: a fancy hotel in Los Angeles.</text>
