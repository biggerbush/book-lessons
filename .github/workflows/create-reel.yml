name: Create reel
run-name: "Create reel: ${{ inputs.book }} ${{ inputs.format == 'list' && '10 things' || format('lesson {0}', inputs.lesson) }}${{ inputs.mode == 'dry' && ' (dry run)' || inputs.mode == 'plan' && ' (plan only)' || '' }}"

# Turns one lesson of a book into a ~60s vertical reel (Instagram / TikTok). Output: site/reels/<book>-<lesson>/reel.mp4
# real = Claude directs + ONE ElevenLabs generation (saved, so re-renders never pay for audio again). dry = free test.

on:
  workflow_dispatch:
    inputs:
      book:
        description: Book slug (e.g. deep-work), or a standalone reel name saved under engine-data/topics (e.g. 7-laws)
        required: true
        type: string
      lesson:
        description: Lesson number
        required: true
        type: string
        default: "1"
      format:
        description: "lesson = one lesson. list = '10 things to do' from the whole book (lesson is ignored)."
        type: choice
        options: [lesson, list]
        default: lesson
      mode:
        description: "real = Claude + ElevenLabs credits. voice = the voice only (render elsewhere). plan = Claude writes the plan only (no voice). dry = free test (silent, example plan)."
        type: choice
        options: [real, voice, plan, dry]
        default: real

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-${{ inputs.book }}-${{ inputs.format }}-${{ inputs.lesson }}
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r engine/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Make the reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BOOK: ${{ inputs.book }}
          LESSON: ${{ inputs.lesson }}
          MODE: ${{ inputs.mode }}
          FORMAT: ${{ inputs.format }}
        run: |
          if [ -d "engine-data/topics/$BOOK" ]; then args=(--name "$BOOK")    # standalone reel (no book): plan saved in engine-data/topics/<name>/reels
          else args=(--book "$BOOK" --lesson "$LESSON" --format "${FORMAT:-lesson}"); fi
          [ "$MODE" = "dry" ] && args+=(--dry --scale 0.5 --fps 24)
          [ "$MODE" = "plan" ] && args+=(--plan-only)
          [ "$MODE" = "voice" ] && args+=(--voice-only)
          python -m engine.reel "${args[@]}"
      - name: Save audio, plan and video
        if: ${{ always() }}
        run: |
          git config user.name "book-engine"; git config user.email "book-engine@users.noreply.github.com"
          # the paid-for voice goes up first, on its own, so a failed video push can never lose it
          git add engine-data
          git diff --cached --quiet || git commit -m "Reel voice + plan: ${{ inputs.book }} ${{ inputs.lesson }}"
          git pull --rebase -q origin main || true
          git push || true
          mkdir -p site/reels
          find site/reels -name '*.mp4' -size +95M -exec echo "::warning::{} is over 95MB and will not be pushed" \; -exec rm {} \;
          git add site/reels
          git diff --cached --quiet || git commit -m "Reel: ${{ inputs.book }} lesson ${{ inputs.lesson }}"
          git pull --rebase -q origin main || true
          git push || true
      - name: Deploy
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
