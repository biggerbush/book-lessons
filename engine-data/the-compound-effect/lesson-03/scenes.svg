<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMPOUND EFFECT · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Track everything you</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">want to change.</text>
<text class="b" x="120" y="600" font-size="32">Write down what you do, and hidden habits come to light.</text>
<g id="bills"></g>
<g id="wal"><rect class="s-ink" x="1160" y="320" width="300" height="190" rx="24" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1160 390h300" stroke-width="6"/><rect class="gain" x="1400" y="370" width="60" height="44" rx="10"/></g>
<text id="wq" class="d" x="1290" y="490" font-size="96" text-anchor="middle" style="fill:var(--gain)">?</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most choices run on autopilot.</text>
<text class="b" x="120" y="176" font-size="32">Tiny choices, made without deciding.</text>
