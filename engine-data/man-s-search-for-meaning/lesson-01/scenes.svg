<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Stripped of everything,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">something remains.</text>
<text class="b" x="120" y="600" font-size="32">What remains when everything you have is taken away?</text>
<g id="tg"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">From Vienna to Auschwitz.</text>
<text class="b" x="120" y="176" font-size="32">A psychiatrist with a career, a home and a family.</text>
<g id="vh"><path id="hpath" class="s-ink" d="M170 620V420L310 300L450 420V620Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><g id="vin"></g><text class="m" x="310" y="700" font-size="22" text-anchor="middle">VIENNA</text></g>
<g id="trk"><path class="s-line" d="M120 650H1480" stroke-width="6" stroke-linecap="round"/><g id="trn"></g></g>
<g id="gt"><path class="s-loss" d="M1212 650V380M1432 650V380M1190 380H1454" stroke-width="12" stroke-linecap="round"/><path class="s-loss" d="M1212 440H1432M1212 500H1432M1212 560H1432" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="1322" y="700" font-size="22" text-anchor="middle">AUSCHWITZ</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A manuscript in his coat.</text>
<text class="b" x="120" y="176" font-size="32">Hidden inside the lining.</text>
<g id="pile"></g>
<g id="ghost" opacity="0"></g>
<g id="coat"></g>
<g id="mtxt"><text class="m" x="700" y="400" font-size="22">YEARS OF HIS THINKING</text><text class="d" x="700" y="480" font-size="56">His life’s work.</text></g>
<g id="gone"><text class="m" x="1140" y="770" font-size="22" text-anchor="middle">GIVEN UP</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stripped bare.</text>
<text class="b" x="120" y="176" font-size="32">Prisoners handed over their clothes and belongings.</text>
<path class="ink" d="M295 654v-91a105 105 0 0 1 210 0v91z"/>
<circle class="s-ink" cx="400" cy="360" r="70" fill="var(--stage)" stroke-width="7"/>
<path id="hair" class="s-ink" d="M334 340a66 66 0 0 1 132 0" fill="none" stroke-width="26" stroke-linecap="round"/>
<rect id="tagr" x="300" y="516" width="200" height="62" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text id="tagt" class="m" x="400" y="555" font-size="22" text-anchor="middle">V. FRANKL</text>
<g id="jk"><path d="M285 662v-97a115 115 0 0 1 230 0v97z" fill="var(--line)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M400 450V662" stroke-width="5"/></g>
<g id="rz"><rect class="gain" x="-30" y="-14" width="60" height="28" rx="6"/></g>
<text class="m" x="760" y="250" font-size="20">TAKEN AWAY</text>
<g id="w0"><text class="d5" x="760" y="320" font-size="40">Clothes</text><line id="k0" class="s-loss" x1="754" y1="307" x2="754" y2="307" stroke-width="5" stroke-linecap="round"/></g>
<g id="w1"><text class="d5" x="760" y="420" font-size="40">Belongings</text><line id="k1" class="s-loss" x1="754" y1="407" x2="754" y2="407" stroke-width="5" stroke-linecap="round"/></g>
<g id="w2"><text class="d5" x="760" y="520" font-size="40">Hair</text><line id="k2" class="s-loss" x1="754" y1="507" x2="754" y2="507" stroke-width="5" stroke-linecap="round"/></g>
<g id="w3"><text class="d5" x="760" y="620" font-size="40">Name</text><line id="k3" class="s-loss" x1="754" y1="607" x2="754" y2="607" stroke-width="5" stroke-linecap="round"/></g>
<g id="w4"><text class="d" x="1000" y="620" font-size="40" style="fill:var(--loss)">→ a number</text></g>
<g id="naked"><text class="d" x="120" y="790" font-size="52">All that was left: naked existence.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every outer support, removed.</text>
<text class="b" x="120" y="176" font-size="32">Separated from the people he loved.</text>
<g id="fl"><rect class="s-line" x="120" y="230" width="520" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><g id="flf"></g><path id="tie" class="s-gain" d="M272 500H360" stroke-width="6" stroke-linecap="round"/><g id="fam"></g><text class="m" x="150" y="690" font-size="20">NOT KNOWING IF THEY WERE ALIVE</text></g>
<g id="sup"><g id="pil"></g><g id="plat"><rect class="ink" x="880" y="440" width="480" height="16" rx="4"/><g id="pf"></g><circle id="shield4" cx="1120" cy="405" r="58" fill="none" stroke="var(--gain)" stroke-width="5" stroke-dasharray="10 8" opacity="0"/><circle id="core4" class="gain" cx="1120" cy="405" r="20" opacity="0"/></g><g id="grd"></g></g>
<g id="keep"><text class="m" x="1120" y="490" font-size="22" text-anchor="middle" style="fill:var(--gain)">SOMETHING THE GUARDS COULD NOT CONFISCATE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A private world inside.</text>
<text class="b" x="120" y="176" font-size="32">Memories, thoughts and feelings.</text>
<g id="cold"></g>
<path class="ink" d="M240 860v-60a260 130 0 0 1 520 0v60z"/>
<circle class="s-ink" cx="500" cy="450" r="200" fill="var(--stage)" stroke-width="7"/>
<circle id="warm" class="gain" cx="500" cy="450" r="186" fill-opacity=".18" opacity="0"/>
<g id="bub"></g>
<g id="mem">
<path class="s-muted" d="M700 400C780 380 820 380 900 400" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<rect class="s-line" x="900" y="240" width="580" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="930" y="285" font-size="20">A MEMORY FROM HOME</text>
<rect id="door5" x="980" y="330" width="170" height="290" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<circle class="ink" cx="1125" cy="480" r="8"/>
<path class="s-ink" d="M1360 240V330" stroke-width="4"/>
<g id="rays"></g>
