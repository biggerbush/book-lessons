<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Self-sabotage is</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">secretly helping you.</text>
<text class="b" x="120" y="600" font-size="32">Your worst habits may be meeting needs you have not noticed.</text>
<g id="door"><rect class="s-ink" x="1220" y="230" width="200" height="380" rx="10" fill="var(--stage)" stroke-width="7"/><path class="s-line" d="M1250 260h140v150h-140zM1250 440h140v140h-140z" fill="none" stroke-width="4"/><circle class="ink" cx="1395" cy="425" r="9"/></g>
<g id="lock"><g id="lockr"><path class="s-ink" d="M1300 420v-26a20 20 0 0 1 40 0v26" fill="none" stroke-width="8"/><rect class="gain" x="1290" y="420" width="60" height="50" rx="8"/><circle cx="1320" cy="442" r="6" fill="var(--on-gain)"/></g></g>
<g id="t0lab"><text class="m" x="1310" y="664" font-size="20" letter-spacing="2.5" text-anchor="middle">KEEPING SOMETHING SAFE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">You know what you want.</text>
<text class="b" x="120" y="176" font-size="32">Yet you keep doing the thing that pulls you away from it.</text>
<path class="s-line" d="M160 520H1440" stroke-width="5" stroke-linecap="round"/>
<g id="goal"><path class="s-ink" d="M1340 520V340" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M1340 344l90 30-90 30z"/><text class="m" x="1340" y="310" font-size="20" text-anchor="middle">WHAT YOU WANT</text></g>
<g id="walker"></g>
<path id="rope" class="s-loss" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="tags"></g>
<g id="diff"><text class="d" x="120" y="830" font-size="48">Brianna Wiest sees it <tspan style="fill:var(--gain)">differently.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A coping mechanism, not a flaw.</text>
<text class="b" x="120" y="176" font-size="32">Below the surface, it is quietly meeting a need.</text>
<rect class="loss" x="120" y="440" width="1360" height="340" fill-opacity=".1"/>
<path id="sea" class="s-loss" fill="none" stroke-width="4"/>
<g id="berg"><polygon class="s-ink" points="380,440 450,310 520,340 580,270 660,440" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="900" y="300" font-size="22">WHAT YOU SEE</text><text class="d" x="900" y="360" font-size="48">Self-sabotage</text></g>
<g id="hand"><polygon class="s-ink" points="320,440 720,440 800,600 690,750 390,750 250,600" fill="var(--stage)" fill-opacity=".7" stroke-width="6" stroke-linejoin="round" stroke-dasharray="14 10"/>
<path class="ink" d="M440 650a80 46 0 0 0 160 0z"/><rect class="ink" x="495" y="680" width="50" height="60" rx="12"/><rect class="ink" x="420" y="638" width="40" height="22" rx="11"/>
<circle id="needo" class="gain" cx="520" cy="600" r="36"/>
<text class="m" x="900" y="560" font-size="22">WHAT IT GIVES YOU</text><text class="d" x="900" y="620" font-size="48" style="fill:var(--gain)">A hidden need</text></g>
<g id="work"><text class="d" x="120" y="840" font-size="46">It is working, just not in your favor.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">What is it protecting?</text>
<text class="b" x="120" y="176" font-size="32">Three hidden needs that self-sabotage often meets.</text>
<g id="n0"><path class="gain" d="M340 270l110 40v90q0 90-110 140q-110-50-110-140v-90z"/><path d="M290 410l35 35 70-75" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="340" y="630" font-size="46" text-anchor="middle">Safety</text><text class="m" x="340" y="680" font-size="20" text-anchor="middle">AVOIDING HURT</text><text class="m" x="340" y="712" font-size="20" text-anchor="middle">OR REJECTION</text></g>
<g id="n1"><g id="chair"><rect class="s-ink" x="710" y="300" width="180" height="150" rx="30" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="690" y="430" width="220" height="70" rx="18" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="660" y="390" width="50" height="120" rx="22"/><rect class="ink" x="890" y="390" width="50" height="120" rx="22"/><path class="s-ink" d="M690 510v30M910 510v30" stroke-width="8" stroke-linecap="round"/><path class="s-line" d="M760 350h80M760 385h50" stroke-width="5" stroke-linecap="round"/></g>
<text class="d" x="800" y="630" font-size="46" text-anchor="middle">Familiarity</text><text class="m" x="800" y="680" font-size="20" text-anchor="middle">A LIFE THAT FEELS KNOWN,</text><text class="m" x="800" y="712" font-size="20" text-anchor="middle">EVEN WHEN IT FEELS BAD</text></g>
<g id="n2"><g id="eyes"></g>
<text class="d" x="1260" y="630" font-size="42" text-anchor="middle">Avoiding judgment</text><text class="m" x="1260" y="680" font-size="20" text-anchor="middle">NOT TRYING FEELS SAFER</text><text class="m" x="1260" y="712" font-size="20" text-anchor="middle">THAN TRYING AND FAILING</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wanting love, pulling away.</text>
<text class="b" x="120" y="176" font-size="32">Whenever closeness grows, they step back.</text>
<path class="s-line" d="M160 546H1060" stroke-width="5" stroke-linecap="round"/>
<g id="lover"></g><g id="other"></g>
<path id="heart" class="gain" d="M0 30C-40 0-44-28-22-34C-10-37-2-28 0-22C2-28 10-37 22-34C44-28 40 0 0 30Z"/>
<g id="win"><rect class="s-ink" x="520" y="290" width="180" height="250" rx="6" fill="none" stroke-width="7"/></g>
<g id="rand"><text class="d" x="120" y="740" font-size="48">Pulling away is not random.</text></g>
<g id="prot"><text class="m" x="1120" y="360" font-size="22">IT PROTECTS FROM</text><text class="d" x="1120" y="420" font-size="44">being seen,</text><text class="d" x="1120" y="476" font-size="44">then hurt.</text></g>
<g id="safe"><rect class="gain" x="1120" y="530" width="340" height="80" rx="40"/><text class="d" x="1290" y="584" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">Need: safety</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why forcing it fails.</text>
<text class="b" x="120" y="176" font-size="32">Remove the behavior, keep the need, and it finds another outlet.</text>
<g id="tug"><g id="tugm"><path class="s-ink" d="M250 395H612" stroke-width="7" stroke-linecap="round"/><circle class="gain" cx="660" cy="395" r="50"/><text class="m" x="660" y="402" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">NEED</text></g>
<text class="m" x="220" y="470" font-size="18" text-anchor="middle">WILLPOWER</text></g>
<g id="outl"><rect class="s-ink" x="160" y="560" width="150" height="190" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="168" y="600" width="134" height="142" rx="6"/>
<path class="s-ink" d="M310 610H556M310 700H620V730" fill="none" stroke-width="14" stroke-linejoin="round"/><rect class="loss" x="556" y="592" width="26" height="36" rx="4"/>
<text class="m" x="330" y="585" font-size="18">HABIT REMOVED</text><text class="m" x="330" y="680" font-size="18">NEED FINDS A NEW OUTLET</text><g id="drops"></g></g>
<g id="ceil"><path class="s-ink" d="M880 300V740H1460" fill="none" stroke-width="5" stroke-linejoin="round"/><path class="s-loss" d="M880 430H1460" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="890" y="412" font-size="20" style="fill:var(--loss)">COMFORT CEILING</text><text class="m" x="880" y="790" font-size="20">WE PULL BACK WHEN LIFE RISES ABOVE IT</text></g>
<path id="life" class="s-gain" d="M890 720L980 680L1060 640L1140 560L1220 470L1270 410L1320 520L1380 480L1450 500" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="pb"><text class="m" x="1300" y="600" font-size="18">WE PULL BACK</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask a better question.</text>
<g id="oldq"><text class="d5" x="120" y="290" font-size="40" fill-opacity=".55">“How do I stop?”</text></g>
<line id="qs" class="s-ink" x1="112" y1="278" x2="112" y2="278" stroke-width="5" stroke-linecap="round"/>
<g id="newq"><text class="d" x="120" y="370" font-size="44" style="fill:var(--gain)">“What is this giving me?”</text></g>
<g id="mag"><rect class="s-line" x="160" y="470" width="480" height="260" rx="16" fill="var(--stage)" stroke-width="3"/><text class="m" x="190" y="510" font-size="20">THE HABIT</text>
<g id="hid"><circle class="gain" cx="400" cy="620" r="34"/><text class="m" x="400" y="768" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT IT GIVES YOU</text></g>
<g id="lensg"><circle class="s-ink" r="80" fill="none" stroke-width="12"/><path class="s-ink" d="M57 57L100 100" stroke-width="18" stroke-linecap="round"/></g></g>
<g id="nb"><rect class="s-ink" x="820" y="240" width="620" height="520" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><text class="m" x="870" y="320" font-size="20">THE HABIT</text></g>
<path id="scr0" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="l2"><text class="m" x="870" y="450" font-size="20">IF I GAVE IT UP, I WOULD FEEL</text></g>
<path id="scr1" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="pill"><path class="s-muted" d="M1130 530v50m-16-16 16 16 16-16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="870" y="600" width="520" height="80" rx="40"/><text class="d" x="1130" y="654" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">the hidden need</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the need a better way.</text>
<text class="b" x="120" y="176" font-size="32">Same need. A healthier way to give it to yourself.</text>
<circle class="gain" cx="260" cy="470" r="64"/><text class="m" x="260" y="478" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">NEED</text>
<g id="oldp"><path class="s-loss" d="M320 440C460 330 560 300 718 302" fill="none" stroke-width="5" stroke-dasharray="10 10"/><rect class="s-loss" x="720" y="270" width="260" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><text class="m" x="850" y="309" font-size="20" text-anchor="middle" style="fill:var(--loss)">SABOTAGE</text></g>
<path id="newp" class="s-gain" d="M320 500C460 610 560 640 716 640" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="steps"></g><g id="climber"></g>
<g id="stl"><text class="m" x="720" y="740" font-size="20">SHARE ONE SMALL HONEST THING · BUILD SAFETY SLOWLY</text></g>
<g id="met"><text class="d" x="120" y="830" font-size="44">The need gets met. No more fighting yourself.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="88" letter-spacing="-2">Pick one habit.</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">Ask what it is</text></g>
<g id="qc"><text class="d" x="136" y="550" font-size="88" letter-spacing="-2">protecting you <tspan style="fill:var(--gain)">from</tspan>.</text></g>
<g id="mir"><ellipse class="s-ink" cx="1340" cy="420" rx="110" ry="150" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1340 570v60M1280 640h120" stroke-width="8" stroke-linecap="round"/><g id="refl"></g></g>
<g id="ql"><text class="m" x="143" y="690" font-size="26">THEN GIVE YOURSELF THAT, GENTLY</text></g>
