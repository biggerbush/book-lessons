<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">What stands in the way</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">becomes the way.</text>
<text class="b" x="120" y="600" font-size="32">Why the thing blocking your path might be the path.</text>
<g transform="translate(-70 -80)">
<path class="s-ink" d="M1140 840L1270 580h60l130 260z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<g id="r0"></g>
<line id="p0" class="s-gain" x1="1300" y1="830" x2="1300" y2="830" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 14"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">An emperor’s notebook.</text>
<text class="b" x="120" y="176" font-size="32">Marcus Aurelius ruled Rome nearly two thousand years ago.</text>
<g id="emp">
<circle class="ink" cx="380" cy="400" r="62"/>
<path class="ink" d="M270 620v-40a110 110 0 0 1 220 0v40z"/>
<path class="s-gain" d="M318 436A72 72 0 0 1 374 328M442 436A72 72 0 0 0 386 328" fill="none" stroke-width="12" stroke-dasharray="14 7"/>
<text class="m" x="380" y="680" font-size="22" text-anchor="middle">MARCUS AURELIUS</text>
<text class="m" x="380" y="712" font-size="20" text-anchor="middle">ROMAN EMPEROR</text>
</g>
<g id="prs"></g>
<g id="nb">
<rect class="s-ink" x="920" y="280" width="260" height="320" rx="8" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="1180" y="280" width="260" height="320" rx="8" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1180" y="650" font-size="22" text-anchor="middle">PRIVATE NOTES TO HIMSELF</text>
</g>
<g id="nl"></g>
<g id="hol"><text class="d5" x="120" y="800" font-size="40">Holiday draws on these notes, and on other Stoic thinkers.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The line that flips it.</text>
<text class="b" x="120" y="176" font-size="32">In his private notes, one line flips everything.</text>
<g id="qc0"><rect class="s-line" x="120" y="220" width="1360" height="210" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="150" y="370" font-size="160" style="fill:var(--gain)">“</text></g>
<g id="qt"><text class="d" x="260" y="310" font-size="60">What stands in the way</text><text class="d" x="260" y="386" font-size="60" style="fill:var(--gain)">becomes the way.”</text><text class="m" x="1440" y="400" font-size="22" text-anchor="end">MARCUS AURELIUS</text></g>
<path class="s-ink" d="M160 690H1440" stroke-width="8" stroke-linecap="round"/>
<path id="gw" class="s-gain" d="M160 690H1420" stroke-width="12" stroke-linecap="round"/>
<g id="rk2"></g>
<g id="dt"><path class="s-loss" d="M560 690C600 460 1000 460 1040 690" fill="none" stroke-width="6" stroke-dasharray="14 12"/><text class="m" x="800" y="470" font-size="22" text-anchor="middle" style="fill:var(--loss)">A DETOUR?</text></g>
<path id="dx" class="s-loss" d="M776 494l48 48M824 494l-48 48" stroke-width="8" stroke-linecap="round"/>
<g id="st"></g>
<g id="rdl"><path class="s-gain" d="M1404 664l32 26-32 26" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="800" y="780" font-size="24" text-anchor="middle" style="fill:var(--gain)">THE OBSTACLE BECOMES THE ROAD</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A boulder in the road.</text>
<text class="b" x="120" y="176" font-size="32">An old story about a king.</text>
<g id="rd3"></g>
<text class="m" x="140" y="790" font-size="20">A BUSY ROAD</text>
<g id="b3"></g>
<g id="kg"></g>
<g id="bush" fill="var(--muted)"><circle cx="1250" cy="540" r="60"/><circle cx="1390" cy="540" r="60"/><circle cx="1320" cy="480" r="70"/><circle cx="1320" cy="540" r="60"/></g>
<line id="gz" class="s-muted" x1="1288" y1="412" x2="910" y2="490" stroke-width="3" stroke-dasharray="6 8"/>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone walks around.</text>
<text class="b" x="120" y="176" font-size="32">Merchants and courtiers stepped around it, grumbling.</text>
<g id="rd4"></g>
<path id="rt4" class="s-muted" fill="none" stroke-width="3" stroke-dasharray="6 10"/>
<g id="b4"></g>
<g id="wk"></g>
<g id="cmp"><path class="s-loss" d="M120 220h520v80H300l-30 30v-30H120z" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/><text class="m" x="140" y="268" font-size="22" style="fill:var(--loss)">THE KING SHOULD KEEP ROADS CLEAR!</text></g>
<g id="nob"><text class="d" x="120" y="830" font-size="52">Nobody tried to move it.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">One person pushes.</text>
<text class="b" x="120" y="176" font-size="32">A peasant arrives, carrying a load of vegetables.</text>
<g id="rd5"></g>
<g id="b5"></g>
<g id="pz"></g>
<g id="nc"><text class="d" x="120" y="830" font-size="52">No complaints. He just pushed.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The gift underneath.</text>
<text class="b" x="120" y="176" font-size="32">Right where the boulder had been.</text>
<g id="rd6"></g>
<g id="b6" opacity=".45"></g>
<ellipse class="s-muted" cx="800" cy="650" rx="130" ry="22" fill="none" stroke-width="3" stroke-dasharray="8 8"/>
<g id="pur"><path class="gain" d="M800 660c-70 0-90-60-40-100l-16-26h112l-16 26c50 40 30 100-40 100z" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path class="s-ink" d="M762 560h76" stroke-width="5" stroke-linecap="round"/></g>
<g id="cns"></g>
<g id="nt"><rect class="s-ink" x="150" y="230" width="460" height="250" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="184" y="296" font-size="22">A NOTE FROM THE KING</text><text class="d5" x="184" y="368" font-size="30">The gold belongs to</text><text class="d5" x="184" y="414" font-size="30">whoever clears the way.</text></g>
<g id="hid"><text class="d" x="120" y="830" font-size="48">The obstacle was hiding the reward all along.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fuel for the fire.</text>
<text class="b" x="120" y="176" font-size="32">A strong fire turns whatever you throw on it into flame.</text>
<g id="frw">
<path class="ink" d="M300 650l240-34v26l-240 34zM540 650l-240-34v26l240 34z"/>
<g id="fr"><path id="fl" class="gain" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" d="M-100 0C-130-90-40-120-40-210C-10-160 10-170 20-250C70-170 130-110 100 0Z"/><path id="fi" d="M-45 0C-60-50-15-70-10-120C10-80 40-60 45 0Z" fill="var(--stage)" fill-opacity=".55"/></g>
</g>
<g id="lgs"></g>
<g id="o0"><path class="s-gain" d="M600 420C780 340 900 340 1066 340" fill="none" stroke-width="5" stroke-dasharray="10 10"/><rect class="gain" x="1080" y="300" width="380" height="80" rx="40"/><text class="d5" x="1270" y="352" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Build a skill</text></g>
<g id="o1"><path class="s-gain" d="M600 460C780 480 900 480 1066 480" fill="none" stroke-width="5" stroke-dasharray="10 10"/><rect class="gain" x="1080" y="440" width="380" height="80" rx="40"/><text class="d5" x="1270" y="492" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Find a better route</text></g>
<g id="tm0"><text class="d5" x="120" y="770" font-size="38">Next time something blocks you, pause before you grumble.</text></g>
<g id="tm1"><text class="d" x="120" y="840" font-size="46">Ask: what does this obstacle make <tspan style="fill:var(--gain)">possible</tspan>?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">What boulder is sitting</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">in your road right now?</text></g>
<g id="qc"><text class="d5" x="140" y="540" font-size="52">And what might be waiting <tspan style="fill:var(--gain)">underneath it?</tspan></text></g>
<text class="m" x="143" y="680" font-size="26">WHAT STANDS IN THE WAY BECOMES THE WAY</text>
<path class="s-ink" d="M1060 800H1460" stroke-width="6" stroke-linecap="round"/>
<g id="gl"><circle class="gain" cx="1230" cy="784" r="16" stroke="var(--ink)" stroke-width="4"/><circle class="gain" cx="1270" cy="784" r="16" stroke="var(--ink)" stroke-width="4"/><circle class="gain" cx="1250" cy="760" r="16" stroke="var(--ink)" stroke-width="4"/></g>
<g id="r8"></g>
</g>