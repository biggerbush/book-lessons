<text class="m" x="120" y="300" font-size="20">FIRST</text><text class="m" x="120" y="610" font-size="20">LAST</text>
<text class="m" x="1000" y="680" font-size="20" text-anchor="end">RACE AFTER RACE</text>
<polyline id="l2" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<polyline id="l6" class="s-loss" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="lab2"><text class="d5" x="300" y="250" font-size="30" style="fill:var(--gain)">Boat Crew Two</text></g>
<g id="lab6"><text class="d5" x="300" y="540" font-size="30" style="fill:var(--loss)">Boat Crew Six</text></g>
