<g id="conf"><g id="ckid"></g><rect class="s-ink" x="900" y="560" width="540" height="90" rx="20" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1170" y="616" font-size="34" text-anchor="middle">I can handle hard things.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Discover mode or defend mode?</text>
<text class="b" x="120" y="176" font-size="32">Two basic modes a child can be in.</text>
