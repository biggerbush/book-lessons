<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The land of the living dead.</text>
<text class="b" x="120" y="176" font-size="32">Not dying. Not growing. Just stuck.</text>
<g id="ax1"><path class="s-ink" d="M160 260V760H960" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
