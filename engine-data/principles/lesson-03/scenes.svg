<g id="see"><text class="d" x="120" y="810" font-size="40">The log turns pain into a lesson everyone can see.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Reflect while it stings.</text>
<text class="b" x="120" y="176" font-size="32">Right after a setback, details are fresh and feelings are strong.</text>
