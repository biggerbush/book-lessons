<g id="s0">
<text class="m" x="120" y="150" font-size="28">SURROUNDED BY IDIOTS · LESSON 3</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2" style="fill:var(--gain)">Yellow:</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">The enthusiastic</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">optimist.</text>
<text class="b" x="120" y="620" font-size="32">Why the most energetic person in the room needs your help finishing.</text>
