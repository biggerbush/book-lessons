<ellipse class="s-gain" cx="1290" cy="450" rx="180" ry="95" fill="var(--gain)" fill-opacity=".2" stroke-width="5"/>
<path class="gain" d="M1240 490v-50l50-40 50 40v50z"/><text class="m" x="1290" y="522" font-size="20" text-anchor="middle">A BETTER LIFE</text></g></g>
<g id="dr2"><text class="d" x="120" y="800" font-size="40">A ticket buys a dream that feels within reach.</text></g>
