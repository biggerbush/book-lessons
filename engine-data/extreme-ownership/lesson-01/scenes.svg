<path class="s-ink" d="M1170 360V280" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="1120" y="360" width="220" height="280" rx="24" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M1160 420h140M1160 460h140M1160 500h140" stroke-width="7" stroke-linecap="round"/>
<circle class="loss" cx="1230" cy="580" r="22"/>
<g id="waves"></g>
<text class="d" x="1120" y="720" font-size="48">Who is where?</text>
<text class="m" x="1120" y="760" font-size="20">A CONSTANT STRUGGLE</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Blue on blue.</text>
<text class="b" x="120" y="176" font-size="32">During one big operation, friendly forces fired on each other.</text>
<g id="fire"><path id="f0" class="s-loss" d="M500 460H1100" stroke-width="5" stroke-dasharray="20 24" stroke-linecap="round"/><path id="f1" class="s-loss" d="M1100 530H500" stroke-width="5" stroke-dasharray="20 24" stroke-linecap="round"/></g>
<g id="houses"></g>
<g id="fogg"><g id="fg"><ellipse cx="700" cy="480" rx="140" ry="90" fill="var(--muted)" fill-opacity=".35"/><ellipse cx="890" cy="500" rx="160" ry="100" fill="var(--muted)" fill-opacity=".35"/><ellipse cx="800" cy="430" rx="120" ry="70" fill="var(--muted)" fill-opacity=".3"/></g></g>
<g id="enemy"><text class="m" x="340" y="290" font-size="26" text-anchor="middle" style="fill:var(--loss)">ENEMY?</text><text class="m" x="1260" y="290" font-size="26" text-anchor="middle" style="fill:var(--loss)">ENEMY?</text></g>
<g id="cas"></g>
<text id="night" class="m" x="120" y="856" font-size="20">EVERY LEADER’S WORST NIGHTMARE</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plenty of people to blame.</text>
<text class="b" x="120" y="176" font-size="32">Jocko had to explain the incident to his commanders.</text>
<g id="rep"><rect class="s-ink" x="120" y="240" width="340" height="460" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="290" font-size="22">INCIDENT REPORT</text><g id="rlines"></g></g>
<g id="jk3"></g>
<text id="bll" class="m" x="900" y="226" font-size="20" style="fill:var(--loss)">PEOPLE HE COULD BLAME</text>
<g id="bl"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then it hit him.</text>
<text class="b" x="120" y="176" font-size="32">He was the commander. Everything under his command was his.</text>
<text id="lbl4" class="m" x="120" y="290" font-size="22">WHO TO BLAME?</text>
<g id="n0"><text id="nt0" class="d5" x="120" y="380" font-size="48">The plan</text></g>
<g id="n1"><text id="nt1" class="d5" x="120" y="490" font-size="48">The radios</text></g>
<g id="n2"><text id="nt2" class="d5" x="120" y="600" font-size="48">His men</text></g>
<line id="ns0" class="s-loss" x1="112" y1="364" x2="112" y2="364" stroke-width="6" stroke-linecap="round"/>
<line id="ns1" class="s-loss" x1="112" y1="474" x2="112" y2="474" stroke-width="6" stroke-linecap="round"/>
<line id="ns2" class="s-loss" x1="112" y1="584" x2="112" y2="584" stroke-width="6" stroke-linecap="round"/>
<g id="jk4"></g><g id="jk4s"></g>
<ellipse class="s-ink" cx="1260" cy="450" rx="130" ry="200" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1260 650v60M1190 712h140" stroke-width="8" stroke-linecap="round"/>
<g id="lk4"><path class="s-gain" d="M950 470C1010 400 1070 400 1118 450M1096 446l22 4 2-22" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="mir"></g>
<text id="ol" class="m" x="1260" y="770" font-size="24" text-anchor="middle" style="fill:var(--gain)">THE ONLY ONE TO BLAME</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">He owned it, out loud.</text>
<text class="b" x="120" y="176" font-size="32">In front of his commanding officer and his own men.</text>
<g id="jk5"><path class="s-ink" d="M290 500L372 450" stroke-width="6" stroke-linecap="round"/></g>
<g id="brd"><rect class="s-ink" x="380" y="230" width="640" height="440" rx="14" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="400" y="290" font-size="20">MISTAKE</text><text class="m" x="790" y="290" font-size="20">THE FIX</text><g id="rows"></g></g>
<g id="aud"><text class="m" x="1270" y="474" font-size="24" text-anchor="middle">COMMANDING OFFICER</text><text class="m" x="1270" y="774" font-size="24" text-anchor="middle">HIS MEN</text></g>
<text id="nob" class="d" x="120" y="830" font-size="46">No blame shifted to anyone else.</text>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Instead, trust went up.</text>
<text class="b" x="120" y="176" font-size="32">Owning the failure showed he could be trusted to learn from it.</text>
<g id="gw"><g id="gauge"></g>
<text class="m" x="240" y="676" font-size="20" text-anchor="middle">LOW</text>
<text class="m" x="720" y="676" font-size="20" text-anchor="middle">HIGH</text>
<text class="d5" x="480" y="706" font-size="40" text-anchor="middle">Trust</text></g>
<text id="exp" class="m" x="120" y="776" font-size="22" style="fill:var(--loss)">EXPECTED: TO LOSE HIS JOB</text>
<text id="ins" class="m" x="120" y="816" font-size="22" style="fill:var(--gain)">INSTEAD: HIS BOSS TRUSTED HIM MORE</text>
<g id="tm"></g>
<text id="rp" class="m" x="960" y="730" font-size="22">MORE RESPECT FROM HIS TEAM, NOT LESS</text>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Own everything in your world.</text>
<text class="b" x="120" y="176" font-size="32">Including the failures of the people you lead.</text>
<g id="wld"><circle class="s-ink" cx="480" cy="520" r="250" fill="none" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
<g id="ldr"></g><g id="tw"></g>
<text class="m" x="480" y="812" font-size="22" text-anchor="middle">YOUR WORLD</text></g>
<g id="bl7"><path class="s-loss" d="M752 520H860m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="806" y="474" font-size="26" text-anchor="middle" style="fill:var(--loss)">BLAME</text></g>
<path id="bx" class="s-ink" d="M790 504l32 32m0-32l-32 32" stroke-width="7" stroke-linecap="round"/>
