<g id="s0">
<text class="m" x="120" y="150" font-size="28">ZERO TO ONE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">From Zero to One.</text>
<text class="b" x="120" y="600" font-size="32">Why creating something new beats copying what already works</text>
<path class="s-line" d="M1150 540H1480" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="1200" y="530" font-size="140" text-anchor="middle" style="fill:var(--muted)">0</text>
<path id="t_arr" class="s-gain" d="M1250 430Q1290 290 1350 270" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="t_one"><text class="d" x="1410" y="330" font-size="170" text-anchor="middle" style="fill:var(--gain)">1</text></g>
<g id="t_opp"><text class="m" x="120" y="680" font-size="22">PETER THIEL: THE FUTURE DEPENDS ON DOING THE OPPOSITE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of progress.</text>
<text class="b" x="120" y="176" font-size="32">Progress comes in two directions.</text>
<g id="gh"><path class="s-line" d="M400 720H900M400 720V280" fill="none" stroke-width="4" stroke-dasharray="6 10"/><circle class="ink" cx="400" cy="720" r="14"/></g>
<path id="fa" class="s-ink" d="M400 720H898" fill="none" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="fah" class="s-ink" d="M872 696l28 24-28 24" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ta" class="s-gain" d="M400 720V282" fill="none" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="tah" class="s-gain" d="M376 308l24-28 24 28" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g id="hl"><text class="d5" x="940" y="734" font-size="40">Horizontal progress</text><text class="m" x="940" y="780" font-size="20">SIDEWAYS</text></g>
<g id="vl"><text class="d" x="450" y="300" font-size="40" style="fill:var(--gain)">Vertical progress</text><text class="m" x="450" y="340" font-size="20">STRAIGHT UP</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Going sideways.</text>
<g id="s2sub"><text class="b" x="120" y="176" font-size="32">Horizontal progress: copying things that already work.</text></g>
<g id="s2n"><text class="d" x="120" y="320" font-size="96">1 → n</text></g>
<g id="tw1"><text class="m" x="230" y="630" font-size="20" text-anchor="middle">ONE TYPEWRITER</text></g>
<g id="tw1a"><path class="s-muted" d="M340 520H420M398 498l22 22-22 22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="450" y="420" font-size="20">100 MORE OF THEM</text></g>
<g id="twrow"></g>
<g id="s2end"><text class="d" x="120" y="830" font-size="46">More of the same, spread wider.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Going up.</text>
<g id="s3sub"><text class="b" x="120" y="176" font-size="32">Vertical progress: doing something nobody has done before.</text></g>
<g id="s3n"><text class="d" x="120" y="320" font-size="96" style="fill:var(--gain)">0 → 1</text></g>
<path class="s-line" d="M120 690H1480" stroke-width="4"/>
<g id="tw2"></g>
<g id="wp">
<rect class="s-ink" x="800" y="380" width="260" height="180" rx="12" fill="var(--stage)" stroke-width="7"/>
<path class="s-gain" d="M840 430h180M840 470h140M840 510h160" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M930 560v50M880 610h100" stroke-width="7" stroke-linecap="round"/>
<rect class="ink" x="790" y="640" width="280" height="40" rx="8"/>
</g>
<path id="lp" class="s-gain" d="M440 540C470 330 640 290 770 380" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="lph"><path class="s-gain" d="M742 374l28 6-8 28" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="560" y="300" font-size="20" style="fill:var(--gain)">LEAP</text></g>
<g id="nw"><rect class="gain" x="1120" y="400" width="300" height="100" rx="50"/><text class="d" x="1270" y="466" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">Brand new</text><text class="m" x="1270" y="550" font-size="20" text-anchor="middle">DID NOT EXIST BEFORE</text></g>
<g id="s3end"><text class="d" x="120" y="800" font-size="48">That leap is vertical progress.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Globalization vs technology.</text>
<text class="b" x="120" y="176" font-size="32">Thiel gives each direction a big name.</text>
<g id="pL">
<rect class="s-line" x="120" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="285" font-size="22">HORIZONTAL</text>
<circle class="s-ink" cx="440" cy="460" r="130" fill="var(--stage)" stroke-width="6"/>
<ellipse class="s-line" cx="440" cy="460" rx="60" ry="130" fill="none" stroke-width="4"/>
<path class="s-line" d="M310 460H570M325 400H555M325 520H555" stroke-width="4"/>
</g>
<g id="gname"><ellipse class="s-muted" cx="440" cy="460" rx="190" ry="60" fill="none" stroke-width="3" stroke-dasharray="6 8"/><g id="gdots"></g>
<text class="d" x="150" y="680" font-size="52">Globalization</text><text class="m" x="150" y="725" font-size="20">SPREADING WHAT WORKS</text></g>
<g id="pR">
<rect class="s-line" x="840" y="230" width="640" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="285" font-size="22">VERTICAL</text>
<g id="rays"></g>
<circle class="gain" cx="1160" cy="420" r="95"/>
<rect class="ink" x="1120" y="515" width="80" height="20" rx="4"/><rect class="ink" x="1125" y="545" width="70" height="20" rx="4"/><rect class="ink" x="1137" y="575" width="46" height="16" rx="8"/>
<text class="d" x="870" y="680" font-size="52">Technology</text><text class="m" x="870" y="725" font-size="20">ANY NEW, BETTER WAY OF DOING THINGS</text>
</g>
<g id="s4end"><text class="d" x="120" y="830" font-size="44">Not just computers.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The China example.</text>
<text class="b" x="120" y="176" font-size="32">A clear case of horizontal progress.</text>
<g id="chn"><path class="s-ink" d="M200 480C220 380 380 360 480 400C580 430 600 520 540 590C470 660 300 660 240 610C190 570 190 530 200 480Z" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="390" y="700" font-size="22" text-anchor="middle">CHINA</text></g>
<g id="cmin"></g>
<g id="usa"><path class="s-muted" d="M640 520H928M904 496l26 24-26 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="785" y="495" font-size="20" text-anchor="middle">BECOME MORE LIKE</text>
<g id="usk"></g><path class="s-ink" d="M980 640H1460" stroke-width="6" stroke-linecap="round"/><text class="m" x="1220" y="690" font-size="20" text-anchor="middle">UNITED STATES TODAY</text></g>
<g id="smk"><g id="smkin"></g><text class="m" x="520" y="300" font-size="20" style="fill:var(--loss)">STRAIN ON RESOURCES</text><text class="m" x="520" y="330" font-size="20" style="fill:var(--loss)">AND THE ENVIRONMENT</text></g>
<g id="s5end"><text class="d" x="120" y="810" font-size="44">Old methods everywhere, no new technology.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every moment happens once.</text>
<text class="b" x="120" y="176" font-size="32">Copying a great founder repeats a moment that is gone.</text>
<g id="cal"><rect class="s-ink" x="120" y="240" width="300" height="340" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="loss" x="123" y="243" width="294" height="70" rx="12"/>
<circle class="ink" cx="190" cy="240" r="12"/><circle class="ink" cx="350" cy="240" r="12"/>
<text class="d" x="270" y="470" font-size="100" text-anchor="middle">NOW</text><text class="m" x="270" y="540" font-size="20" text-anchor="middle">HAPPENS ONCE</text></g>
<g id="cg"><rect class="s-line" x="500" y="240" width="460" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="730" y="290" font-size="20" text-anchor="middle">THE NEXT BILL GATES</text><g id="gp"></g>
<text class="d5" x="730" y="580" font-size="34" text-anchor="middle">won’t build an</text><text class="d5" x="730" y="625" font-size="34" text-anchor="middle">operating system</text></g>
<g id="cp"><rect class="s-line" x="1020" y="240" width="460" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1250" y="290" font-size="20" text-anchor="middle">THE NEXT LARRY PAGE</text>
<rect class="s-ink" x="1080" y="390" width="340" height="70" rx="35" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1370" cy="422" r="14" fill="none" stroke-width="5"/><path class="s-ink" d="M1380 432l14 14" stroke-width="5" stroke-linecap="round"/><path id="cur" class="s-ink" d="M1120 408v28" stroke-width="4"/>
<text class="d5" x="1250" y="580" font-size="34" text-anchor="middle">won’t make another</text><text class="d5" x="1250" y="625" font-size="34" text-anchor="middle">search engine</text></g>
<path id="x1" class="s-loss" d="M620 315L840 520M840 315L620 520" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="x2" class="s-loss" d="M1110 335L1390 515M1390 335L1110 515" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="s6end"><text class="d" x="120" y="790" font-size="42">Copying their moves misses what made them great.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why vertical matters.</text>
<text class="b" x="120" y="176" font-size="32">Copying is easier. Creating raises the ceiling.</text>
<g id="ceil"><path class="s-ink" d="M120 0H1480" stroke-width="5" stroke-dasharray="14 10"/><text class="m" x="120" y="-14" font-size="20">CEILING OF WHAT’S POSSIBLE</text></g>
<g id="road"><path class="s-muted" d="M120 720H700" stroke-width="14" stroke-linecap="round"/><g id="rp"></g><text class="m" x="410" y="780" font-size="20" text-anchor="middle">COPYING · PATH ALREADY PROVEN</text></g>
<g id="mtn"><polygon class="s-ink" points="760,720 1120,300 1480,720" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/><circle id="clb" class="gain" r="18"/>
<text class="d" x="860" y="450" font-size="64" style="fill:var(--gain)">?</text><text class="m" x="820" y="500" font-size="20">NO MAP</text>
<text class="m" x="1120" y="780" font-size="20" text-anchor="middle">CREATING · NOBODY HANDS YOU THE MAP</text></g>
<g id="s7end"><text class="d" x="120" y="845" font-size="38">That’s the climb Thiel urges founders to make.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qm"><text class="m" x="143" y="230" font-size="26">LOOK AT YOUR OWN WORK THIS WEEK</text></g>
<g id="qa"><text class="d" x="136" y="350" font-size="84" letter-spacing="-2">Where are you making</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="84" letter-spacing="-2"><tspan style="fill:var(--loss)">100 more typewriters</tspan>,</text></g>
<g id="qc"><text class="d" x="136" y="550" font-size="84" letter-spacing="-2">and where could you build</text></g>
<g id="qd"><text class="d" x="136" y="650" font-size="84" letter-spacing="-2">the <tspan style="fill:var(--gain)">first word processor</tspan>?</text></g>
<g id="qg"><g id="q_tw"></g><path class="s-gain" d="M1310 770Q1336 722 1370 728" fill="none" stroke-width="5" stroke-linecap="round"/><rect class="gain" x="1380" y="700" width="100" height="70" rx="8"/><rect class="ink" x="1420" y="770" width="20" height="18"/></g>
</g>