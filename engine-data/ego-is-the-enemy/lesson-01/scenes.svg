<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Meet the enemy</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">inside you.</text>
<text class="b" x="120" y="600" font-size="32">The quiet saboteur that follows you</text>
<text class="b" x="120" y="644" font-size="32">through every stage of life</text>
<circle class="s-ink" cx="1280" cy="390" r="170" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1090 800v-50a190 130 0 0 1 380 0v50" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="shadow"><circle class="loss" cx="1280" cy="350" r="34"/><path class="loss" d="M1230 460v-20a50 50 0 0 1 100 0v20z"/><circle cx="1268" cy="346" r="5" fill="var(--stage)"/><circle cx="1292" cy="346" r="5" fill="var(--stage)"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">What is ego?</text>
<g id="def"><text class="b" x="120" y="176" font-size="32">“An unhealthy belief in our own importance.” — Ryan Holiday</text></g>
<g id="me"></g>
<g id="mir"><ellipse class="s-ink" cx="640" cy="480" rx="190" ry="250" fill="var(--stage)" stroke-width="8"/><g id="refl"></g></g>
<g id="blind"><rect class="loss" x="236" y="402" width="128" height="28" rx="8"/><path class="s-loss" d="M364 416l30 18M364 416l26-14" stroke-width="6" stroke-linecap="round"/></g>
<g id="bubs"></g>
<g id="blcap"><text class="d" x="120" y="810" font-size="46">It quietly blinds us to how things really are.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ego lives in all of us.</text>
<text class="b" x="120" y="176" font-size="32">Not only in the loud and arrogant. Even the shy and the kind.</text>
<g id="crowd"></g>
<g id="loud"><path class="s-loss" d="M580 372l28-16M584 400h30M580 428l28 16" stroke-width="6" stroke-linecap="round"/></g>
<g id="sparks"></g>
<g id="mom"><rect x="120" y="610" width="380" height="70" rx="35" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="310" y="653" font-size="22" text-anchor="middle">NEEDING TO BE RIGHT</text>
<rect x="530" y="610" width="320" height="70" rx="35" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="690" y="653" font-size="22" text-anchor="middle">WANTING CREDIT</text>
<text class="m" x="120" y="740" font-size="20">EGO HIDES IN SMALL MOMENTS</text></g>
<g id="stoic">
<circle class="ink" cx="1250" cy="350" r="56"/>
<path class="ink" d="M1160 514v-22a90 62 0 0 1 180 0v22z"/>
<rect class="ink" x="1146" y="522" width="208" height="22" rx="4"/>
<rect class="s-ink" x="1180" y="544" width="140" height="124" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1215 558v96M1250 558v96M1285 558v96" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="1146" y="668" width="208" height="22" rx="4"/>
<text class="m" x="1250" y="738" font-size="20" text-anchor="middle">STOIC PHILOSOPHERS</text>
<text class="m" x="1250" y="770" font-size="20" text-anchor="middle" style="fill:var(--loss)">PRIDE = CONSTANT DANGER</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A fast rise.</text>
<text class="b" x="120" y="176" font-size="32">Holiday knows this personally.</text>
<path class="s-line" d="M120 760H1480" stroke-width="4"/>
<path id="climb" class="s-gain" d="M250 740C390 740 440 720 570 720S880 440 990 330" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="door"><rect class="s-ink" x="510" y="520" width="120" height="240" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="610" cy="640" r="7"/><text class="m" x="570" y="500" font-size="20" text-anchor="middle">LEFT COLLEGE AT 19</text></g>
<g id="tower"><rect class="s-ink" x="1000" y="320" width="160" height="440" fill="var(--stage)" stroke-width="7"/><g id="wins"></g>
<text class="m" x="1190" y="450" font-size="20">AMERICAN APPAREL</text><text class="m" x="1190" y="482" font-size="20">DIRECTOR OF</text><text class="m" x="1190" y="514" font-size="20">MARKETING</text><text class="m" x="1190" y="546" font-size="20" style="fill:var(--gain)">EARLY TWENTIES</text></g>
<g id="praise"></g>
<g id="ryan"></g>
<g id="prcap"><text class="m" x="120" y="830" font-size="22">SUCCESS CAME FAST. SO DID THE PRAISE.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then came the crash.</text>
<text class="b" x="120" y="176" font-size="32">Powerful people he looked up to made reckless choices.</text>
<line id="trail" class="s-muted" x1="240" y1="260" x2="240" y2="260" stroke-width="4" stroke-dasharray="6 10"/>
<g id="fsg"></g>
<text class="m" x="330" y="720" font-size="22" text-anchor="middle">RECKLESS CHOICES</text>
<g id="crown"><path id="crL" class="ink" d="M640 540V400L700 460L760 380L790 450L770 480L800 510V540Z"/><path id="crR" class="ink" d="M800 540V510L770 480L790 450L840 380L900 460L960 400V540Z"/></g>
<g id="lost"><text class="m" x="800" y="620" font-size="24" text-anchor="middle">COMPANIES</text><text class="m" x="800" y="660" font-size="24" text-anchor="middle">FORTUNES</text><text class="m" x="800" y="700" font-size="24" text-anchor="middle">REPUTATIONS</text></g>
<g id="tired"><g id="tme"></g><path id="scrib" class="s-loss" d="M1190 320c20-30 40 30 60 0s40 30 60 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<path d="M1232 410h12M1256 410h12" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="1250" y="630" font-size="22" text-anchor="middle">STRESSED · BURNED OUT</text></g>
<g id="egocap"><text class="d" x="120" y="800" font-size="48">His answer kept pointing to one thing: <tspan style="fill:var(--loss)">ego.</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stage one: Aspire.</text>
<text class="b" x="120" y="176" font-size="32">We are always in one of three stages.</text>
<g id="stages"><rect class="gain" x="1000" y="280" width="480" height="84" rx="42"/><text class="d5" x="1050" y="336" font-size="40" style="fill:var(--on-gain)">1  Aspire</text>
<rect class="s-line" x="1000" y="390" width="480" height="84" rx="42" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1050" y="446" font-size="40">2  Succeed</text>
<rect class="s-line" x="1000" y="500" width="480" height="84" rx="42" fill="var(--stage)" stroke-width="4"/><text class="d5" x="1050" y="556" font-size="40">3  Fail</text></g>
<g id="lad"><path class="s-muted" d="M420 400h120M420 460h120M420 520h120M420 580h120M420 640h120M420 700h120M420 760h120" stroke-width="6" stroke-dasharray="8 10"/><path class="s-ink" d="M420 340V780M540 340V780" stroke-width="8" stroke-linecap="round"/></g>
<g id="skip"><text class="m" x="570" y="586" font-size="20">HARD, HUMBLE WORK</text><text class="m" x="570" y="616" font-size="20" style="fill:var(--loss)">SKIPPED</text></g>
<g id="aspme"></g>
<g id="dream"><circle class="s-ink" cx="268" cy="562" r="14" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="262" cy="602" r="9" fill="var(--stage)" stroke-width="4"/><ellipse class="s-ink" cx="260" cy="420" rx="130" ry="80" fill="var(--stage)" stroke-width="5"/><g id="dstar"></g></g>
<g id="pin"><g id="pinb"><path class="loss" d="M480 335C455 300 446 290 446 280a34 34 0 0 1 68 0c0 10-9 20-34 55z"/><circle cx="480" cy="280" r="12" fill="var(--stage)"/><text class="m" x="530" y="288" font-size="22" style="fill:var(--loss)">ARRIVED?</text></g></g>
<g id="here"><text class="m" x="260" y="830" font-size="20" text-anchor="middle">YOU ARE HERE</text></g>
<g id="asc"><text class="d" x="1000" y="700" font-size="40">Dreaming big,</text><text class="d" x="1000" y="752" font-size="40">skipping the work.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stage two: Success.</text>
<text class="b" x="120" y="176" font-size="32">Ego says you are special and the rules no longer apply.</text>
<g id="troph"><path class="s-gain" d="M260 300h-40v40a40 40 0 0 0 50 38M460 300h40v40a40 40 0 0 1-50 38" fill="none" stroke-width="8"/><path class="gain" d="M260 280h200v80a100 100 0 0 1-200 0z"/>
<rect class="gain" x="345" y="455" width="30" height="80"/><rect class="ink" x="290" y="535" width="140" height="30" rx="6"/><text class="m" x="360" y="610" font-size="22" text-anchor="middle">“I’M SPECIAL”</text></g>
<g id="rules"><rect class="s-ink" x="580" y="300" width="300" height="180" rx="12" fill="var(--stage)" stroke-width="6"/><text class="m" x="730" y="350" font-size="26" text-anchor="middle">THE RULES</text><path class="s-line" d="M620 400h220M620 440h160" stroke-width="6" stroke-linecap="round"/>
<line id="rstrike" class="s-loss" x1="570" y1="490" x2="890" y2="290" stroke-width="10" stroke-linecap="round" stroke-dasharray="380"/></g>
<g id="tgt"></g>
<g id="lose"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stage three: Failure.</text>
<text class="b" x="120" y="176" font-size="32">Ego turns a setback into a story about unfairness.</text>
<g id="rain"></g>
<g id="cloud"><circle class="loss" cx="300" cy="300" r="50"/><circle class="loss" cx="370" cy="280" r="64"/><circle class="loss" cx="440" cy="305" r="46"/><rect class="loss" x="300" y="300" width="140" height="50"/></g>
<g id="fp"></g>
<g id="unfair"><rect x="470" y="380" width="290" height="70" rx="35" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="615" y="423" font-size="22" text-anchor="middle">IT’S NOT FAIR!</text></g>
<g id="blame"><g id="others"></g><path class="s-loss" d="M420 560L570 575M552 560l18 15-20 12" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="665" y="690" font-size="22" text-anchor="middle" style="fill:var(--loss)">BLAME</text></g>
<g id="pity"><text class="m" x="360" y="720" font-size="22" text-anchor="middle">SELF-PITY</text></g>
<g id="cyc"><circle class="s-line" cx="1150" cy="500" r="190" fill="none" stroke-width="5" stroke-dasharray="14 10"/></g>
<g id="never"><text class="d" x="120" y="810" font-size="46">Life keeps cycling. Ego never stops showing up.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Which stage are you in:</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">aspiring</tspan>, succeeding,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2">or failing?</text></g>
<g id="nlab"><text class="m" x="143" y="700" font-size="26">WRITE DOWN WHERE EGO IS STEERING YOU</text><text class="m" x="143" y="740" font-size="26" style="fill:var(--gain)">AND NAME IT PLAINLY</text></g>
<g id="nb"><rect class="s-ink" x="1120" y="560" width="300" height="260" rx="14" fill="var(--stage)" stroke-width="6"/><g id="spir"></g><text class="m" x="1145" y="618" font-size="18" style="fill:var(--loss)">EGO IS STEERING:</text><g id="nbl"></g><path id="pen" class="gain" d="M0 0l8-24 50-50 16 16-50 50z"/></g>
</g>