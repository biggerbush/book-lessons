</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every mistake is a puzzle.</text>
<text class="b" x="120" y="176" font-size="32">Solve it, and you get a gem.</text>
<g id="box"><rect class="s-ink" x="160" y="280" width="280" height="280" rx="14" fill="var(--stage)" stroke-width="7"/><path id="pzl" class="s-line" d="M300 280v280M160 420h280" stroke-width="4"/><circle class="s-ink" cx="300" cy="420" r="70" fill="var(--stage)" stroke-width="5"/><text class="d" x="300" y="453" font-size="96" text-anchor="middle">?</text><text class="m" x="300" y="600" font-size="22" text-anchor="middle">MISTAKE</text></g>
