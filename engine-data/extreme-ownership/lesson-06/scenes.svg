<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Decentralized</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Command.</text>
<text class="b" x="120" y="600" font-size="32">Explain the why, then let your frontline leaders decide.</text>
<g id="boss"></g>
<g id="phone"><rect class="ink" x="1384" y="330" width="34" height="62" rx="8"/></g>
<path id="rg" class="s-loss" d="M1432 340a30 30 0 0 1 0 42M1446 326a50 50 0 0 1 0 70" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="asks"></g>
<g id="calm"><text class="m" x="1480" y="790" font-size="22" text-anchor="end" style="fill:var(--gain)">EXPLAIN MORE · DECIDE LESS</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One leader, too many.</text>
<text class="b" x="120" y="176" font-size="32">No single person can directly lead a large crowd.</text>
<g id="wires"></g>
<g id="crd"><text class="m" x="760" y="232" font-size="20">A LARGE CROWD</text></g>
<g id="ring1"><circle class="s-gain" cx="360" cy="520" r="190" fill="none" stroke-width="5" stroke-dasharray="12 10"/><text class="m" x="360" y="770" font-size="22" text-anchor="middle" style="fill:var(--gain)">ABOUT 6–10 PEOPLE</text></g>
<g id="inner"></g>
<circle class="gain" cx="360" cy="520" r="48"/>
<text class="m" x="360" y="528" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text>
<g id="bneck"><text class="d" x="740" y="800" font-size="44" style="fill:var(--loss)">You become the bottleneck.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small teams.</text>
<text class="b" x="120" y="176" font-size="32">SEAL units are broken down into small groups.</text>
<g id="pltn"><rect class="s-ink" x="630" y="238" width="340" height="90" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="990" y="292" font-size="22">PLATOON</text></g>
<path id="tree" class="s-muted" d="M800 328L480 420M800 328L1120 420M480 490L320 558M480 490L640 558M1120 490L960 558M1120 490L1280 558" fill="none" stroke-width="4" stroke-linecap="round"/>
<g id="sq">
<rect class="s-ink" x="360" y="420" width="240" height="70" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="480" y="463" font-size="22" text-anchor="middle">SQUAD</text>
<rect class="s-ink" x="1000" y="420" width="240" height="70" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="1120" y="463" font-size="22" text-anchor="middle">SQUAD</text>
</g>
<g id="ft"></g>
<g id="mem"></g>
<circle id="pl" class="gain" cx="800" cy="283" r="18"/>
<g id="jr"><text class="m" x="120" y="772" font-size="22" style="fill:var(--gain)">EACH TEAM HAS ITS OWN LEADER, OFTEN QUITE JUNIOR</text></g>
<g id="rep"><text class="d" x="120" y="836" font-size="40">Each leader reports up to the next level.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ramadi: chaos in the streets.</text>
<text class="b" x="120" y="176" font-size="32">Task Unit Bruiser, fighting street by street.</text>
<g id="map"></g>
<circle id="view" class="gain" cx="420" cy="490" r="0" fill-opacity=".16"/>
<g id="foes"></g>
<circle id="team" class="gain" cx="420" cy="490" r="18"/>
<g id="hq"><rect class="s-ink" x="1220" y="240" width="240" height="100" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d" x="1340" y="306" font-size="44" text-anchor="middle">HQ</text></g>
<polyline id="zz" class="s-loss" fill="none" stroke-width="4" stroke-dasharray="10 6"/>
<g id="xx"><path class="s-loss" d="M970 360l50 50M1020 360l-50 50" stroke-width="9" stroke-linecap="round"/></g>
<g id="sda"></g>
<g id="eyeg"><path class="s-ink" d="M800 730q40-36 80 0q-40 36-80 0z" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="840" cy="730" r="12"/><text class="d" x="900" y="744" font-size="38">They saw what HQ never could.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Know the why.</text>
<text class="b" x="120" y="176" font-size="32">Commander’s intent: the purpose behind the plan.</text>
<g id="kp" fill="var(--ink)"></g>
<text id="qm" class="d" x="220" y="540" font-size="110" text-anchor="middle">?</text>
<g id="plang"><path class="s-ink" d="M280 600L1150 540" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/></g>
<g id="planl"><text class="m" x="480" y="630" font-size="22" style="fill:var(--muted)">THE PLAN</text></g>
<g id="tgt"><circle class="s-ink" cx="1280" cy="520" r="120" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1280" cy="520" r="80" fill="none" stroke-width="6"/><circle class="gain" cx="1280" cy="520" r="40"/><text class="m" x="1280" y="690" font-size="22" text-anchor="middle">COMMANDER’S INTENT</text></g>
<g id="wall"><rect class="loss" x="690" y="500" width="36" height="150" rx="6"/><text class="m" x="708" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">PLAN BREAKS</text></g>
<path id="adp" class="s-gain" d="M280 590Q700 260 1160 510" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="adl"><text class="m" x="700" y="370" font-size="22" text-anchor="middle" style="fill:var(--gain)">ADAPT</text></g>
<g id="kg"><text class="d" x="120" y="800" font-size="44">Know the goal, adapt when the plan breaks.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Freedom has edges.</text>
<text class="b" x="120" y="176" font-size="32">Senior leaders set clear limits on what juniors can decide alone.</text>
<rect id="fld" class="gain" x="320" y="250" width="960" height="450" opacity="0"/>
<g id="fen"><rect class="s-ink" x="320" y="250" width="960" height="450" fill="none" stroke-width="6"/><g id="posts"></g>
<path class="s-ink" d="M800 520V420" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M800 420l70 22-70 22z"/><text class="m" x="800" y="550" font-size="20" text-anchor="middle">MISSION</text></g>
<g id="fdots"></g>
<circle id="wnd" cx="1000" cy="470" r="18"/>
<circle id="hit" class="s-loss" cx="1280" cy="470" r="34" fill="none" stroke-width="5"/>
<g id="fl1"><text class="m" x="320" y="760" font-size="22">LIMITS SET BY SENIOR LEADERS</text></g>
<g id="fl2"><text class="m" x="1280" y="760" font-size="22" text-anchor="end" style="fill:var(--loss)">KEEPS TEAMS ON MISSION</text></g>
<g id="ftx"><text class="d" x="320" y="830" font-size="44">Inside the limits, juniors make the call.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trust both ways.</text>
<text class="b" x="120" y="176" font-size="32">Seniors let go. Juniors ask until they understand.</text>
<g id="snr" fill="var(--ink)"><text class="m" x="300" y="660" font-size="20" text-anchor="middle">SENIOR</text></g>
<g id="jnr" fill="var(--ink)"><text class="m" x="900" y="660" font-size="20" text-anchor="middle">JUNIOR</text></g>
<g id="a1"><path class="s-gain" d="M390 440H800m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="595" y="410" font-size="20" text-anchor="middle">STOP HOVERING, LET THEM LEAD</text></g>
<g id="a2"><path class="s-ink" d="M810 580H400m20-18-20 18 20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="605" y="625" font-size="20" text-anchor="middle">ASK UNTIL YOU KNOW THE INTENT</text></g>
<g id="arm"><path class="s-ink" d="M940 545L980 410" stroke-width="14" stroke-linecap="round"/><circle class="gain" cx="982" cy="398" r="14"/></g>
<g id="bino"><circle class="gain" cx="338" cy="452" r="14"/><circle class="gain" cx="366" cy="452" r="14"/></g>
<g id="bp"><rect class="s-line" x="1100" y="260" width="380" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><g id="bpc"></g><text class="m" x="1290" y="700" font-size="22" text-anchor="middle">THE BIGGER PICTURE</text></g>
<g id="nt"><text class="d" x="120" y="770" font-size="40" style="fill:var(--loss)">Without trust, it falls apart.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same rule, any company.</text>
<text class="b" x="120" y="176" font-size="32">Hand off the purpose and the limits, not just the task.</text>
<g id="ofc"><path class="s-line" d="M120 600H1480" stroke-width="4"/><g id="ofp" fill="var(--ink)"></g>
<rect class="ink" x="220" y="540" width="200" height="26" rx="6"/><rect class="ink" x="960" y="540" width="200" height="26" rx="6"/>
<text class="m" x="320" y="640" font-size="20" text-anchor="middle">BOSS</text><text class="m" x="1060" y="640" font-size="20" text-anchor="middle">FRONTLINE</text></g>
<g id="card"><rect class="s-ink" width="160" height="100" rx="10" fill="var(--stage)" stroke-width="5"/><text class="m" x="20" y="40" font-size="18" style="fill:var(--gain)">PURPOSE</text><text class="m" x="20" y="76" font-size="18">LIMITS</text></g>
<g id="tl"><rect class="ink" x="1200" y="300" width="60" height="140" rx="14"/><circle cx="1230" cy="335" r="20" fill="var(--line)"/><circle id="lmp" cx="1230" cy="405" r="20"/></g>
<g id="cust" fill="var(--ink)"><text class="d" x="1390" y="360" font-size="50" text-anchor="middle" style="fill:var(--loss)">!</text></g>
<g id="spot"><text class="d" x="1060" y="372" font-size="44" text-anchor="middle" style="fill:var(--gain)">!</text></g>
<g id="cl"><text class="d" x="120" y="760" font-size="40">The person closest to the problem decides.</text></g>
<g id="fd"><text class="m" x="120" y="830" font-size="22">FRONTLINE STAFF OFTEN SPOT PROBLEMS BEFORE THE BOSS</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Pick one decision</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">you usually make,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">explain <tspan style="fill:var(--gain)">the why</tspan>,</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="80" letter-spacing="-2">and let them make it.</text></g>
<g id="cal"><rect class="s-ink" x="1180" y="240" width="260" height="260" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="1183" y="243" width="254" height="57" rx="11"/><g id="days"></g><circle id="day" class="s-gain" cx="1311" cy="375" r="28" fill="none" stroke-width="6"/></g>
<g id="q8l"><text class="m" x="143" y="720" font-size="26">THIS WEEK · EXPLAIN THE WHY, THEN LET GO</text></g>
</g>