<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Find your smallest</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">viable market.</text>
<text class="b" x="120" y="600" font-size="32">Stop chasing everyone and become essential to a few.</text>
