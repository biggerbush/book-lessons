<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Open minds by</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">listening first.</text>
<text class="b" x="120" y="600" font-size="32">Why curious questions change minds better than arguments do</text>
<g id="t_who"></g>
<g id="t_arcs"></g>
<g id="t_bub"><rect class="s-ink" x="1160" y="240" width="130" height="100" rx="20" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1240 337l26 32v-32" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="d" x="1225" y="316" font-size="70" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Arguing makes people dig in.</text>
<text class="b" x="120" y="176" font-size="32">Pressure often hardens the very belief we attack.</text>
<g id="a_pair"><text class="m" x="300" y="670" font-size="22" text-anchor="middle">YOU</text><text class="m" x="1240" y="670" font-size="22" text-anchor="middle">THEM</text></g>
<g id="a_arr"></g>
<g id="a_wall"></g>
<g id="a_path"><path id="a_pp" class="s-gain" d="M300 710Q770 870 1240 710" fill="none" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/><text class="m" x="770" y="750" font-size="22" text-anchor="middle" style="fill:var(--gain)">A BETTER PATH</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A worried mother in Quebec.</text>
<text class="b" x="120" y="176" font-size="32">Marie-Hélène had just given birth to a premature baby boy.</text>
<g id="m_m"><g id="m_mf"></g><ellipse cx="420" cy="575" rx="44" ry="26" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><circle class="gain" cx="446" cy="566" r="16"/><text class="m" x="380" y="670" font-size="22" text-anchor="middle">MARIE-HÉLÈNE</text></g>
<g id="m_v"><g id="m_tri"></g><rect class="ink" x="755" y="360" width="90" height="34" rx="6"/><rect class="s-ink" x="765" y="394" width="70" height="170" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="771" y="470" width="58" height="88" rx="8"/><path class="s-loss" d="M720 400L880 560M880 400L720 560" stroke-width="10" stroke-linecap="round"/><text class="m" x="800" y="630" font-size="20" text-anchor="middle">FRIGHTENING CLAIMS ONLINE</text></g>
<g id="m_n"><g id="m_nf"></g><text class="m" x="1260" y="650" font-size="20" text-anchor="middle">NURSES TRIED TO PERSUADE</text><text class="m" x="380" y="710" font-size="22" text-anchor="middle" style="fill:var(--loss)">SHE HELD FIRM</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then a doctor asked.</text>
<text class="b" x="120" y="176" font-size="32">Neonatologist Arnaud Gagneur listened instead of lecturing.</text>
<g id="d_momf"></g>
<text class="m" x="520" y="780" font-size="20" text-anchor="middle">MARIE-HÉLÈNE</text>
<g id="d_doc"><g id="d_docf"></g><path class="s-gain" d="M1050 560v24a30 30 0 0 0 60 0v-24" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="1080" y="780" font-size="20" text-anchor="middle">DR ARNAUD GAGNEUR</text></g>
<g id="d_q"><rect class="s-ink" x="800" y="230" width="120" height="100" rx="20" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M876 327l34 33v-33" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="d" x="860" y="306" font-size="76" text-anchor="middle" style="fill:var(--gain)">?</text>
<rect x="1270" y="300" width="120" height="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><rect x="1285" y="315" width="120" height="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><rect x="1300" y="330" width="120" height="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><path class="s-line" d="M1320 370h80M1320 400h80M1320 430h50" stroke-width="5"/><path class="s-loss" d="M1265 305L1430 495M1430 305L1265 495" stroke-width="8" stroke-linecap="round"/><text class="m" x="1355" y="540" font-size="20" text-anchor="middle">NO LECTURE</text></g>
<g id="d_ch"><path class="s-ink" d="M440 500V720M440 625H600M590 625V720M1160 500V720M1000 625H1160M1010 625V720" fill="none" stroke-width="8" stroke-linecap="round"/><g id="d_arcs"></g></g>
<g id="d_cap"><text class="m" x="120" y="840" font-size="20">ASKED ABOUT HER WORRIES · LISTENED CLOSELY · TREATED HER AS A CAPABLE PARENT</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">She chose to say yes.</text>
<text class="b" x="120" y="176" font-size="32">Her decision, reached through her own reasons.</text>
<g id="f_c"><circle class="gain" cx="380" cy="460" r="110"/><path id="f_ck" d="M325 462l38 38 74-80" fill="none" stroke="var(--on-gain)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="180"/><text class="m" x="380" y="640" font-size="20" text-anchor="middle">SHE DECIDED TO VACCINATE</text></g>
<rect class="s-ink" x="900" y="300" width="240" height="400" fill="none" stroke-width="8"/>
<g id="f_inf"></g>
<polygon id="f_dr" points="900,300 1140,300 1140,700 900,700" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<circle id="f_hd" class="ink" cx="1116" cy="500" r="9"/>
<g id="f_no"><path class="s-loss" d="M1440 420H1250M1274 400l-24 20 24 20M1440 580H1250M1274 560l-24 20 24 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path class="s-ink" d="M1290 370L1400 630M1400 370L1290 630" stroke-width="6" stroke-linecap="round"/><text class="m" x="1480" y="700" font-size="20" text-anchor="end">NO OUTSIDE PRESSURE</text></g>
<g id="f_out"><path class="s-gain" d="M960 650H1230M1206 630l24 20-24 20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1020" y="760" font-size="20" text-anchor="middle" style="fill:var(--gain)">HER OWN REASONS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Motivational interviewing.</text>
<text class="b" x="120" y="176" font-size="32">A method by psychologists William Miller and Stephen Rollnick.</text>
<g id="i_bk"><rect class="gain" x="170" y="280" width="220" height="300" rx="10"/><rect class="ink" x="170" y="280" width="34" height="300" rx="6"/><text class="d" x="300" y="420" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">MI</text><path d="M240 460h120M240 500h90" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round"/><text class="m" x="280" y="640" font-size="20" text-anchor="middle">MILLER &amp; ROLLNICK</text></g>
<g id="i_lk"><text class="m" x="900" y="230" font-size="22" text-anchor="middle">CORE BELIEF</text><path id="i_sh" class="s-ink" d="M840 400V340a60 60 0 0 1 120 0v60" fill="none" stroke-width="16"/><rect class="ink" x="800" y="400" width="200" height="170" rx="16"/><circle cx="900" cy="465" r="16" fill="var(--stage)"/><rect x="893" y="470" width="14" height="40" fill="var(--stage)"/></g>
<g id="i_fc"><g id="i_fa"><path class="s-loss" d="M0 0H150M122-24l28 24-28 24" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text class="m" x="670" y="640" font-size="20" text-anchor="middle" style="fill:var(--loss)">YOU CAN’T FORCE IT</text></g>
<g id="i_key" opacity="0"><rect class="gain" x="0" y="-8" width="135" height="16"/><rect class="gain" x="22" y="8" width="14" height="24"/><rect class="gain" x="52" y="8" width="14" height="16"/><circle cx="170" cy="0" r="38" fill="none" stroke="var(--gain)" stroke-width="14"/></g>
<g id="i_ml"><text class="m" x="1200" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">THEIR OWN MOTIVATION</text></g>
<g id="i_ln"><text class="d" x="120" y="790" font-size="48">Help people find their own reasons.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three simple moves.</text>
<text class="b" x="120" y="176" font-size="32">How motivational interviewing works in practice.</text>
<g id="v_c0"><rect class="s-line" x="120" y="230" width="414" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="154" y="300" font-size="56" style="fill:var(--gain)">1</text>
<rect class="s-ink" x="227" y="320" width="200" height="140" rx="24" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M262 457l-8 42 46-42" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="d" x="327" y="428" font-size="96" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d5" x="327" y="620" font-size="36" text-anchor="middle">Open questions</text><text class="m" x="327" y="676" font-size="20" text-anchor="middle">INVITE THEM TO EXPLORE</text><text class="m" x="327" y="708" font-size="20" text-anchor="middle">NOT JUST YES OR NO</text></g>
<g id="v_c1"><rect class="s-line" x="593" y="230" width="414" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="627" y="300" font-size="56" style="fill:var(--gain)">2</text>
<path class="s-muted" d="M800 320V520" stroke-width="4" stroke-dasharray="8 8"/><g id="v_f"></g><g id="v_e0"></g><g id="v_e1"></g>
<text class="d5" x="800" y="620" font-size="36" text-anchor="middle">Reflect back</text><text class="m" x="800" y="676" font-size="20" text-anchor="middle">SAY BACK WHAT YOU HEARD</text><text class="m" x="800" y="708" font-size="20" text-anchor="middle">SO THEY FEEL UNDERSTOOD</text></g>
<g id="v_c2"><rect class="s-line" x="1066" y="230" width="414" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="1100" y="300" font-size="56" style="fill:var(--gain)">3</text>
<g id="v_th"><rect class="ink" x="1183" y="400" width="34" height="110" rx="6"/><rect class="gain" x="1223" y="400" width="110" height="110" rx="18"/><rect class="gain" x="1223" y="310" width="40" height="110" rx="20"/><path d="M1268 432h60M1268 458h60M1268 484h60" stroke="var(--stage)" stroke-width="4"/></g>
<text class="d5" x="1273" y="620" font-size="36" text-anchor="middle">Affirm</text><text class="m" x="1273" y="676" font-size="20" text-anchor="middle">AFFIRM THEIR ABILITY</text><text class="m" x="1273" y="708" font-size="20" text-anchor="middle">THE CHOICE STAYS THEIRS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Feeling heard turns defending into honest weighing.</text>
<path class="s-muted" d="M540 410l24 20-24 20M1010 410l24 20-24 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="w_z0"><g transform="translate(300 430)"><path class="s-ink" d="M-40 60C-70-60 20-110 60-40C80 0 40 20 30 60C20 100-20 110-40 80M-10 20C-20-30 30-40 30-10" fill="none" stroke-width="12" stroke-linecap="round"/></g>
<path id="w_sh" class="loss" d="M0-70L60-45V10C60 50 30 70 0 85C-30 70-60 50-60 10V-45Z" transform="translate(430 430)"/>
<text class="d5" x="360" y="640" font-size="36" text-anchor="middle">Feel heard</text><text class="m" x="360" y="690" font-size="20" text-anchor="middle">DEFENSES COME DOWN</text></g>
<g id="w_z1"><path class="s-ink" d="M800 340V560M720 560H880" fill="none" stroke-width="9" stroke-linecap="round"/><line id="w_bm" class="s-ink" x1="690" y1="340" x2="910" y2="340" stroke-width="9" stroke-linecap="round"/>
<g id="w_p0" transform="translate(690 340)"><path class="s-ink" d="M0 0L-40 80M0 0L40 80" stroke-width="4"/><path class="loss" d="M-50 80h100a50 26 0 0 1-100 0z"/></g>
<g id="w_p1" transform="translate(910 340)"><path class="s-ink" d="M0 0L-40 80M0 0L40 80" stroke-width="4"/><path class="gain" d="M-50 80h100a50 26 0 0 1-100 0z"/></g>
<text class="d5" x="800" y="640" font-size="36" text-anchor="middle">Weigh both sides</text><text class="m" x="800" y="690" font-size="20" text-anchor="middle">MORE HONESTLY</text></g>
<g id="w_z2"><g id="w_ry"></g><circle id="w_bl" cx="1240" cy="400" r="70" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/><rect class="ink" x="1210" y="470" width="60" height="44" rx="6"/>
<text class="d5" x="1240" y="640" font-size="36" text-anchor="middle">Their own idea</text><text class="m" x="1240" y="690" font-size="20" text-anchor="middle">MORE LIKELY TO ACT</text></g>
</g>

<g id="s8" opacity="0">
<g id="q_g"><rect class="s-ink" x="1300" y="170" width="140" height="100" rx="22" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1340 267l-10 34 40-34" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><text class="d" x="1370" y="248" font-size="72" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="q_a"><text class="d" x="136" y="360" font-size="80" letter-spacing="-2">Before your next point,</text></g>
<g id="q_b"><text class="d" x="136" y="460" font-size="80" letter-spacing="-2">ask one <tspan style="fill:var(--gain)">curious question</tspan>.</text></g>
<g id="q_c"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">Then listen, and say it back.</text><text class="m" x="143" y="700" font-size="26">LISTEN FIRST · REFLECT WHAT YOU HEARD</text></g>
</g>