<text id="tagt" class="d" x="270" y="392" font-size="60">PRICE</text>
</g></g>
<g id="much"><text class="d5" x="120" y="540" font-size="34">Pay far too much,</text><text class="d5" x="120" y="584" font-size="34">and even a great</text><text class="d5" x="120" y="628" font-size="34" style="fill:var(--loss)">bakery is a bad buy.</text></g>
