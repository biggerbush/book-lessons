<g id="v2"><text class="d5" x="120" y="820" font-size="38">Ability is set, so failing = “I don’t have it.”</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Growth mindset: failure as data.</text>
<text class="b" x="120" y="176" font-size="32">Not a verdict. A reading of where you are now.</text>
