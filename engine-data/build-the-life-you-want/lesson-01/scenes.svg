<g id="s0">
<text class="m" x="120" y="150" font-size="28">BUILD THE LIFE YOU WANT · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Happier is the goal,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not happy.</text>
<text class="b" x="120" y="600" font-size="32">Why the real goal is getting happier, one step at a time</text>
<g id="tstep"><path class="s-ink" d="M1160 720h50v-70h50v-70h50v-70h50v-70h50v-70h50" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-gain" d="M1460 360V272M1446 290l14-18 14 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 10"/></g>
<g id="trun"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The finish line myth.</text>
<text class="b" x="120" y="176" font-size="32">We picture happiness as a place we arrive and stay.</text>
<path class="s-ink" d="M120 640H1480" stroke-width="6" stroke-linecap="round"/>
<g id="fl"><path class="s-ink" d="M1110 640V380M1290 640V380" stroke-width="8" stroke-linecap="round"/></g>
<g id="ms"></g>
<g id="tro"><path class="gain" d="M1160 250h80v30a40 40 0 0 1-80 0z"/><path class="s-gain" d="M1160 262h-16a16 16 0 0 0 16 26M1240 262h16a16 16 0 0 1-16 26" fill="none" stroke-width="6"/><rect class="gain" x="1192" y="316" width="16" height="26"/><rect class="gain" x="1170" y="340" width="60" height="14" rx="4"/></g>
<g id="w1"></g>
<g id="fev"><text class="d" x="120" y="800" font-size="46">…and keep that feeling forever?</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">But the glow fades.</text>
<text class="b" x="120" y="176" font-size="32">And a new finish line keeps appearing.</text>
<path class="s-ink" d="M200 280V620H760" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="300" y="330" font-size="20">THE GLOW OF A WIN</text>
<text class="m" x="760" y="660" font-size="20" text-anchor="end">TIME</text>
<polyline id="glow" class="s-gain" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="cal"><rect class="s-ink" x="650" y="260" width="100" height="90" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="loss" x="650" y="260" width="100" height="24" rx="6"/><path class="s-ink" d="M675 250v22M725 250v22" stroke-width="6" stroke-linecap="round"/><path class="s-line" d="M668 305h64M668 327h64" stroke-width="5"/></g>
<path class="s-ink" d="M860 600H1480" stroke-width="6" stroke-linecap="round"/>
<path class="s-muted" d="M1100 600V420" stroke-width="5" stroke-dasharray="8 10"/>
<g id="nf"><path class="s-ink" d="M0 600V420" stroke-width="8" stroke-linecap="round"/><rect class="gain" x="0" y="420" width="60" height="40"/><text id="nfl" class="m" x="-14" y="400" font-size="20" text-anchor="end">NEW FINISH LINE</text></g>
<g id="w2"></g>
<g id="short"><text class="d" x="120" y="790" font-size="46">Always chasing. Always falling <tspan style="fill:var(--loss)">short</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Happiness is a direction.</text>
<text class="b" x="120" y="176" font-size="32">Not a place you reach.</text>
<g id="cmp"><circle class="s-ink" cx="400" cy="480" r="160" fill="var(--stage)" stroke-width="7"/><g id="tks"></g>
<text class="m" x="400" y="374" font-size="22" text-anchor="middle">N</text><text class="m" x="400" y="602" font-size="22" text-anchor="middle">S</text><text class="m" x="522" y="488" font-size="22" text-anchor="middle">E</text><text class="m" x="278" y="488" font-size="22" text-anchor="middle">W</text>
<g id="ndl"><polygon class="gain" points="400,390 416,480 384,480"/><polygon class="ink" points="400,570 416,480 384,480"/><circle class="ink" cx="400" cy="480" r="10"/></g>
<text class="m" x="400" y="700" font-size="22" text-anchor="middle">BROOKS &amp; WINFREY</text></g>
<g id="pin"><path class="s-muted" d="M900 380c-40-50-60-70-60-100a60 60 0 0 1 120 0c0 30-20 50-60 100z" fill="none" stroke-width="5" stroke-dasharray="10 8"/><text class="m" x="900" y="420" font-size="20" text-anchor="middle">A PLACE TO REACH</text></g>
<path id="pinx" class="s-loss" d="M850 240l100 100M950 240l-100 100" stroke-width="8" stroke-linecap="round"/>
<path id="arw" class="s-gain" d="M720 720L1440 300" pathLength="1" stroke-dasharray="1" stroke-width="10" stroke-linecap="round"/>
<polygon id="arh" class="gain" points="1440,300 1409,347 1384,304"/>
<g id="hap"><text class="m" x="1440" y="260" font-size="22" text-anchor="end" style="fill:var(--gain)">HAPPIER</text></g>
<g id="goal"><text class="d" x="120" y="810" font-size="52">The goal is not happy, but <tspan style="fill:var(--gain)">happier</tspan>.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The smell is not the meal.</text>
<text class="b" x="120" y="176" font-size="32">Happy feelings are evidence of happiness.</text>
<g id="tky"><path class="s-gain" d="M290 560L200 520M510 560L600 520" stroke-width="30" stroke-linecap="round"/><circle class="ink" cx="200" cy="520" r="18"/><circle class="ink" cx="600" cy="520" r="18"/>
<ellipse class="s-ink" cx="400" cy="650" rx="230" ry="34" fill="var(--stage)" stroke-width="6"/><ellipse class="gain" cx="400" cy="580" rx="160" ry="90"/>
<text class="m" x="400" y="730" font-size="20" text-anchor="middle">THANKSGIVING DINNER</text></g>
<g id="stm"></g>
<g id="c4a"><rect class="s-line" x="760" y="280" width="720" height="170" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="800" y="335" font-size="22">THE SMELL · EVIDENCE</text><text class="d5" x="800" y="410" font-size="48">Happy feelings</text></g>
<g id="c4b"><rect class="gain" x="760" y="500" width="720" height="170" rx="18"/><text class="m" x="800" y="555" font-size="22" style="fill:var(--on-gain)">THE MEAL · THE REAL THING</text><text class="d5" x="800" y="630" font-size="48" style="fill:var(--on-gain)">Happiness itself</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Good feelings come and go.</text>
<text class="b" x="120" y="176" font-size="32">You can move in a happier direction on a gloomy day.</text>
<text class="m" x="120" y="340" font-size="20">MOOD</text>
<path id="wv" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="sun"><circle class="gain" cx="347" cy="280" r="40"/><g id="rays"></g></g>
<g id="cld"><rect x="724" y="300" width="166" height="40" rx="20" fill="var(--muted)"/><circle cx="764" cy="306" r="34" fill="var(--muted)"/><circle cx="814" cy="290" r="46" fill="var(--muted)"/><circle cx="856" cy="310" r="30" fill="var(--muted)"/><g id="drops"></g></g>
<path id="dir" class="s-gain" d="M120 720L1060 640" pathLength="1" stroke-dasharray="1" stroke-width="8" stroke-linecap="round"/>
<g id="dirh"><polygon class="gain" points="1060,640 1012,669 1008,619"/><text class="m" x="120" y="780" font-size="20" style="fill:var(--gain)">YOUR DIRECTION: STILL HAPPIER</text></g>
<g id="plt"><ellipse class="s-ink" cx="1330" cy="680" rx="130" ry="40" fill="var(--stage)" stroke-width="6"/><ellipse class="s-line" cx="1330" cy="680" rx="80" ry="22" fill="none" stroke-width="4"/><g id="pst"></g><text class="m" x="1330" y="770" font-size="20" text-anchor="middle">LIVING ON THE SMELL</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bad feelings protect you.</text>
<text class="b" x="120" y="176" font-size="32">Unhappiness never fully vanishes, and that is not a failure.</text>
<g id="shd"><path class="s-ink" d="M360 260L520 320V460C520 560 450 620 360 660C270 620 200 560 200 460V320Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><g id="sp"></g><text class="m" x="360" y="720" font-size="22" text-anchor="middle">NOT A FAILURE</text></g>
<g id="bel"><g id="bsw"><path class="loss" d="M740 500V420a60 60 0 0 1 120 0V500l20 24H720z"/><circle class="loss" cx="800" cy="540" r="14"/></g>
<path id="rng" class="s-loss" d="M710 370q-40 60 0 130M890 370q40 60 0 130M680 350q-60 80 0 170M920 350q60 80 0 170" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="800" y="600" font-size="22" text-anchor="middle">AN ALARM</text></g>
<g id="f0"><text class="m" x="1040" y="330" font-size="22">FEAR</text><text class="d5" x="1040" y="385" font-size="40">keeps you safe.</text></g>
<g id="f1"><text class="m" x="1040" y="470" font-size="22">SADNESS</text><text class="d5" x="1040" y="525" font-size="40">shows what matters.</text></g>
<g id="unp"><text class="d" x="120" y="800" font-size="46">Remove them, and you’re unprotected.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small choices, every day.</text>
<text class="b" x="120" y="176" font-size="32">Each one nudges you further along the path.</text>
<g id="card"><rect class="s-line" x="120" y="240" width="540" height="400" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="160" y="295" font-size="20">TODAY’S SMALL CHOICES</text></g>
<g id="it0"><rect class="s-ink" x="160" y="338" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="220" y="370" font-size="32">Call a friend</text></g>
<g id="it1"><rect class="s-ink" x="160" y="428" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="220" y="460" font-size="32">A moment of gratitude</text></g>
<g id="it2"><rect class="s-ink" x="160" y="518" width="40" height="40" rx="6" fill="none" stroke-width="4"/><text class="d5" x="220" y="550" font-size="32">Help someone</text></g>
<path id="ck0" class="s-gain" d="M168 358l10 12 20-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ck1" class="s-gain" d="M168 448l10 12 20-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ck2" class="s-gain" d="M168 538l10 12 20-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="fts"></g>
<g id="ctl"><text class="d" x="120" y="810" font-size="46">Small steps <tspan style="fill:var(--gain)">you actually control</tspan>.</text></g>
</g>

<g id="s8" opacity="0">
<g id="ask"><text class="m" x="140" y="240" font-size="26">TONIGHT, ASK YOURSELF</text></g>
<g id="qa"><text class="d" x="136" y="360" font-size="76" letter-spacing="-2">What is one small choice</text></g>
<g id="qb"><text class="d" x="136" y="460" font-size="76" letter-spacing="-2">tomorrow that would make</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="76" letter-spacing="-2">me a bit <tspan style="fill:var(--gain)">happier</tspan> than today?</text></g>
<g id="sgn"><path class="s-ink" d="M1400 230V640" stroke-width="10" stroke-linecap="round"/><path class="gain" d="M1290 250h150l36 30-36 30h-150z"/><text class="m" x="1306" y="288" font-size="22" style="fill:var(--on-gain)">HAPPIER</text><path class="s-ink" d="M1470 340h-150l-30 26 30 26h150z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1456" y="374" font-size="22" text-anchor="end">TODAY</text><path class="s-line" d="M1330 640h140" stroke-width="6" stroke-linecap="round"/></g>
<g id="ft8"><text class="m" x="143" y="700" font-size="26">ONE SMALL STEP AT A TIME</text></g>
</g>