<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Make it for</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">yourself first.</text>
<text class="b" x="120" y="600" font-size="32">Why the best work starts with your own honest taste.</text>
<path class="s-ink" d="M1250 480l-30 150M1390 480l30 150M1320 480v150" fill="none" stroke-width="7" stroke-linecap="round"/>
<rect class="s-ink" x="1200" y="270" width="240" height="210" rx="6" fill="var(--stage)" stroke-width="7"/>
<g id="t_heart"><path id="t_hp" class="gain" d="M0 50C-75 0-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 0 0 50Z"/></g>
<g id="t_me"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The guessing game.</text>
<text class="b" x="120" y="176" font-size="32">Making something while picturing who will judge it.</text>
<g id="c_me"><g id="c_fig"></g><rect class="ink" x="260" y="620" width="460" height="18" rx="4"/><path class="s-ink" d="M290 638v90M690 638v90" stroke-width="8" stroke-linecap="round"/><rect class="s-ink" x="540" y="530" width="150" height="90" rx="8" fill="var(--stage)" stroke-width="6"/><circle id="c_spark" class="gain" cx="615" cy="575" r="22"/></g>
<g id="c_crowd"></g>
<g id="c_clab"><text class="m" x="900" y="616" font-size="20">IMAGINED FANS AND CRITICS</text></g>
<path id="c_look" class="s-muted" d="M660 390L870 360" stroke-width="4" stroke-dasharray="8 8"/>
<g id="c_q"><circle class="s-loss" cx="600" cy="400" r="46" fill="var(--stage)" stroke-width="5"/><text class="d" x="600" y="422" font-size="60" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="c_meter"><text class="m" x="900" y="680" font-size="20">LIFE IN THE WORK</text><rect class="s-ink" x="900" y="696" width="500" height="30" rx="6" fill="none" stroke-width="4"/><rect id="c_fill" class="gain" x="900" y="696" width="500" height="30" rx="6"/></g>
<g id="c_drain"><text class="d" x="120" y="820" font-size="44">This habit quietly drains the life from the work.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody can predict taste.</text>
<text class="b" x="120" y="176" font-size="32">Tastes rise and fall, and they keep moving.</text>
<g id="w_wv"><text class="m" x="120" y="260" font-size="20">WHAT PEOPLE WANT</text><path id="w_wave" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<line id="w_aim" class="s-muted" x1="214" y1="690" x2="214" y2="690" stroke-width="4" stroke-dasharray="10 10"/>
<g id="w_me"></g>
<g id="w_tg"><g id="w_tgi"><circle r="54" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle r="32" fill="none" stroke="var(--ink)" stroke-width="6"/><circle r="12" class="gain"/></g></g>
<g id="w_chase"><text class="d" x="120" y="830" font-size="44">You end up chasing a guess.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The audience comes last.</text>
<text class="b" x="120" y="176" font-size="32">Other people matter. Just not while you are making.</text>
<g id="a_l">
<rect class="s-line" x="120" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="262" font-size="20">DURING · MAKING</text>
<g id="a_fig"></g>
<rect class="s-ink" x="470" y="350" width="190" height="170" rx="6" fill="var(--stage)" stroke-width="6"/>
<path class="s-gain" d="M500 480l40-60 30 30 30-50 40 80" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse id="a_spot" class="s-gain" cx="440" cy="460" rx="290" ry="170" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
</g>
<g id="a_r">
<path class="s-muted" d="M772 455h50m-18-18 18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-line" x="840" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="262" font-size="20">AFTER · SHARING</text>
<g id="a_dim"><g id="a_crowd"></g><g id="a_ops"></g></g>
<g id="a_opl"><text class="m" x="870" y="652" font-size="22" style="fill:var(--muted)">THEIR OPINIONS COME AFTER</text></g>
</g>
<g id="a_only"><text class="d" x="120" y="790" font-size="44">While creating, there is only you and the work.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trust your inner compass.</text>
<text class="b" x="120" y="176" font-size="32">Notice what feels right, instead of guessing.</text>
<g id="k_comp">
<text class="m" x="420" y="296" font-size="22" text-anchor="middle" style="fill:var(--gain)">FEELS RIGHT</text>
<circle class="s-ink" cx="420" cy="500" r="180" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M420 334v24M420 642v24M254 500h24M562 500h24" stroke-width="6" stroke-linecap="round"/>
<g id="k_nd"><path class="gain" d="M420 360l26 140h-52z"/><path class="ink" d="M420 640l26-140h-52z" fill-opacity=".35"/></g>
<circle class="ink" cx="420" cy="500" r="14"/>
</g>
<g id="k_hb"><text class="m" x="760" y="300" font-size="20">YOUR BODY KNOWS</text><polyline id="k_ecg" class="s-gain" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="k_chips"></g>
<g id="k_rel"><text class="d" x="120" y="800" font-size="44">That reaction is more reliable than any forecast.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rubin in the studio.</text>
<text class="b" x="120" y="176" font-size="32">He listens, and trusts what moves him.</text>
<g id="r_me"><g id="r_fig"></g><path class="s-ink" d="M232 384a48 48 0 0 1 96 0" fill="none" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="220" y="372" width="20" height="38" rx="8"/><rect class="ink" x="320" y="372" width="20" height="38" rx="8"/></g>
<path id="r_waves" class="s-gain" d="M400 430q24 30 0 60M440 410q36 50 0 100M480 390q48 70 0 140" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="r_desk"><rect class="s-ink" x="560" y="400" width="880" height="300" rx="16" fill="var(--stage)" stroke-width="7"/><g id="r_fad"></g></g>
<g id="r_lbl"><text class="d5" x="560" y="296" font-size="38" style="fill:var(--gain)">Honest reactions</text><text class="m" x="560" y="350" font-size="24" style="fill:var(--muted)">NOT TECHNICAL EXPERTISE</text></g>
<g id="r_th"><rect class="gain" x="250" y="660" width="72" height="60" rx="14"/><rect class="gain" x="252" y="604" width="26" height="70" rx="13"/><rect class="gain" x="226" y="664" width="18" height="52" rx="6"/></g>
<g id="r_tool"><text class="d" x="120" y="800" font-size="48">His taste is the tool, and he trusts it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it connects.</text>
<text class="b" x="120" y="176" font-size="32">Work made for yourself often reaches others more deeply.</text>
<g id="n_th"></g>
<g id="n_me"><text class="m" x="140" y="690" font-size="20">MADE FOR YOURSELF</text></g>
<g id="n_ppl"></g>
<g id="n_sense"><text class="m" x="940" y="756" font-size="20" style="fill:var(--gain)">PEOPLE SENSE THE HONESTY</text></g>
<g id="n_sinc"><text class="d" x="120" y="822" font-size="48">Sincerity travels further than calculation.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not for everyone.</text>
<text class="b" x="120" y="176" font-size="32">Pleasing everyone turns the dial down to bland.</text>
<g id="v_dial">
<text class="m" x="340" y="280" font-size="20" text-anchor="middle">PLEASE EVERYONE?</text>
<g id="v_tk"></g>
<circle class="s-ink" cx="340" cy="470" r="110" fill="var(--stage)" stroke-width="7"/>
<path id="v_ind" d="M340 470V384" stroke-width="12" stroke-linecap="round"/>
<circle class="ink" cx="340" cy="470" r="14"/>
<text class="m" x="227" y="650" font-size="20" text-anchor="middle">BLAND</text>
<text class="m" x="453" y="650" font-size="20" text-anchor="middle">BOLD</text>
</g>
<g id="v_work"><rect class="gain" x="690" y="420" width="100" height="100" rx="12"/><text class="m" x="740" y="560" font-size="20" text-anchor="middle">THE WORK</text></g>
<g id="v_crowd"></g>
<g id="v_lbl"><text class="m" x="930" y="320" font-size="20" text-anchor="middle" style="fill:var(--gain)">LOVE IT</text><text class="m" x="1375" y="320" font-size="20" text-anchor="middle">WALK AWAY</text></g>
<g id="v_alive"><text class="d" x="120" y="800" font-size="44">A sign of something alive, not a failure.</text></g>
</g>

<g id="s8" opacity="0">
<g id="z_lab"><text class="m" x="143" y="250" font-size="24">ON YOUR NEXT PROJECT, WRITE:</text><path class="s-gain" d="M660 242h480m-18-18 18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="z_note"><g id="z_ni"><rect class="gain" x="1180" y="150" width="260" height="210" rx="6"/><circle class="ink" cx="1310" cy="172" r="10"/><text class="d" x="1206" y="250" font-size="38" style="fill:var(--on-gain)">Do I love</text><text class="d" x="1206" y="306" font-size="38" style="fill:var(--on-gain)">this?</text></g></g>
<g id="z_qa"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2">What would you make</text></g>
<g id="z_qb"><text class="d" x="136" y="550" font-size="88" letter-spacing="-2">if you knew no one</text></g>
<g id="z_qc"><text class="d" x="136" y="660" font-size="88" letter-spacing="-2">else would ever see it?</text></g>
<g id="z_tag"><text class="m" x="143" y="780" font-size="26">MAKE IT FOR YOURSELF FIRST</text></g>
</g>