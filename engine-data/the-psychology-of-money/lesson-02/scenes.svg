<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Luck and risk</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">are twins.</text>
<text class="b" x="120" y="600" font-size="32">Why success and failure are never just about you.</text>
<g id="tws"><path id="twst" class="gain"/></g>
<g id="tw0"><text class="m" x="1250" y="580" font-size="22" text-anchor="middle" style="fill:var(--gain)">LUCK</text></g>
<g id="tw1"><text class="m" x="1400" y="580" font-size="22" text-anchor="middle" style="fill:var(--loss)">RISK</text></g>
<path id="twl" class="s-muted" d="M1310 500Q1325 522 1340 500" fill="none" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A rare computer.</text>
<text class="b" x="120" y="176" font-size="32">Lakeside School, near Seattle, late 1960s.</text>
<g id="sch">
<path class="s-ink" d="M140 400L330 280L520 400Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="160" y="400" width="340" height="320" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="200" y="450" width="60" height="60" fill="none" stroke-width="5"/><rect class="s-ink" x="400" y="450" width="60" height="60" fill="none" stroke-width="5"/>
<rect class="ink" x="300" y="600" width="60" height="120"/>
<text class="m" x="330" y="770" font-size="22" text-anchor="middle">LAKESIDE SCHOOL</text>
</g>
<g id="cmp">
<rect class="s-ink" x="640" y="330" width="300" height="390" rx="10" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="720" cy="420" r="46" fill="none" stroke-width="6"/><circle class="s-ink" cx="860" cy="420" r="46" fill="none" stroke-width="6"/>
<circle class="ink" cx="720" cy="420" r="10"/><circle class="ink" cx="860" cy="420" r="10"/>
<rect class="s-line" x="670" y="510" width="240" height="70" fill="none" stroke-width="4"/>
