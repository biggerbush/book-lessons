<g id="s0">
<text class="m" x="120" y="150" font-size="28">QUIET · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why solitude sparks</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">creativity.</text>
<text class="b" x="120" y="600" font-size="32">Why your best ideas may need an empty room.</text>
<path class="s-line" d="M1480 470V260H1140V660H1480V600" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="leave"></g>
<g id="lone"></g>
<rect class="ink" x="1220" y="560" width="180" height="16" rx="4"/>
<path class="s-ink" d="M1236 576v60M1384 576v60" stroke-width="6" stroke-linecap="round"/>
<g id="rays"></g>
<g id="bulb"><circle class="gain" cx="1310" cy="360" r="30"/><rect class="ink" x="1298" y="390" width="24" height="14" rx="3"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The New Groupthink.</text>
<text class="b" x="120" y="176" font-size="32">Teamwork everywhere, from offices to classrooms.</text>
<g id="off">
<rect class="s-line" x="120" y="240" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="20">LONG TABLES, NO WALLS</text>
<g id="offp"></g>
<rect class="ink" x="170" y="470" width="540" height="24" rx="6"/>
<g id="offq"></g>
</g>
<g id="cls">
<rect class="s-line" x="840" y="240" width="640" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="290" font-size="20">DESKS PUSHED INTO CLUSTERS</text>
<g id="desks"></g>
</g>
<g id="ng"><text class="d" x="120" y="790" font-size="52">Cain calls it the <tspan style="fill:var(--loss)">New Groupthink</tspan>.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Brainstorming is born.</text>
<text class="b" x="120" y="176" font-size="32">Alex Osborn, an advertising executive, in the 1940s.</text>
<g id="osb"><g id="osbf"></g>
<text class="m" x="260" y="570" font-size="20" text-anchor="middle">ALEX OSBORN</text>
<text class="m" x="260" y="602" font-size="20" text-anchor="middle">ADVERTISING · 1940S</text></g>
<g id="storm">
<circle cx="760" cy="300" r="50" fill="var(--line)"/><circle cx="825" cy="268" r="60" fill="var(--line)"/><circle cx="890" cy="300" r="50" fill="var(--line)"/>
<rect x="715" y="300" width="220" height="50" rx="25" fill="var(--line)"/>
<path class="gain" d="M830 350l-20 48h24l-14 46l40-62h-24l16-32z"/>
<g id="spk"></g><g id="sprk"></g>
</g>
<text class="m" x="1080" y="300" font-size="20">THE RULES</text>
<g id="rule0"><rect x="1080" y="330" width="400" height="90" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d5" x="1104" y="386" font-size="28">1. Shout out every idea</text></g>
<g id="rule1"><rect x="1080" y="450" width="400" height="90" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="d5" x="1104" y="506" font-size="28">2. Never criticise</text></g>
<g id="mach"><text class="d" x="120" y="790" font-size="46">It sounded like the perfect creativity machine.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">What the studies found.</text>
<text class="b" x="120" y="176" font-size="32">Decades of research put brainstorming to the test.</text>
<g id="lab">
<text class="m" x="120" y="250" font-size="20">SAME PEOPLE, TWO WAYS (SCHEMATIC)</text>
<rect id="bar0" class="gain" x="200" y="700" width="180" height="0"/>
<rect id="bar1" class="loss" x="440" y="700" width="180" height="0"/>
<path class="s-ink" d="M160 700H680" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="290" y="740" font-size="20" text-anchor="middle">ALONE,</text><text class="m" x="290" y="768" font-size="20" text-anchor="middle">THEN POOLED</text>
<text class="m" x="530" y="740" font-size="20" text-anchor="middle">BRAINSTORMING</text><text class="m" x="530" y="768" font-size="20" text-anchor="middle">TOGETHER</text>
<g id="b0t"><text class="d5" x="290" y="320" font-size="28" text-anchor="middle" style="fill:var(--gain)">More, better ideas</text></g>
</g>
<g id="shr">
<text class="m" x="820" y="250" font-size="20">BIGGER GROUP, WORSE RESULTS</text>
<path class="s-line" d="M860 700H1460" stroke-width="4"/>
<text class="m" x="1460" y="740" font-size="20" text-anchor="end">GROUP SIZE →</text>
<g id="gdots"></g>
<path id="perf" class="s-loss" d="M900 360L1130 440L1360 540" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="500"/>
<g id="pvs"></g>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why groups stall.</text>
<text class="b" x="120" y="176" font-size="32">Cain explains a few reasons why.</text>
<g id="w0"><rect class="s-line" x="120" y="240" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="20">REASON 1</text><g id="w0f"></g>
<rect class="ink" x="190" y="572" width="170" height="48" rx="6"/><text class="m" x="275" y="603" font-size="18" text-anchor="middle" style="fill:var(--stage)">THE WORK</text>
<g id="slk" transform="rotate(-18 450 560)"></g>
<g id="zz"><text class="d5" x="482" y="410" font-size="28">z</text><text class="d5" x="505" y="378" font-size="22">z</text></g>
<text class="d5" x="150" y="690" font-size="28">Some sit back.</text></g>
<g id="w1"><rect class="s-line" x="590" y="240" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="620" y="290" font-size="20">REASON 2</text><g id="w1f"></g>
<rect x="680" y="360" width="80" height="56" rx="14" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/>
<circle class="gain" cx="704" cy="388" r="5"/><circle class="gain" cx="720" cy="388" r="5"/><circle class="gain" cx="736" cy="388" r="5"/>
<text class="d5" x="620" y="690" font-size="28">Ideas wait, and fade.</text></g>
<g id="w2"><rect class="s-line" x="1060" y="240" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1090" y="290" font-size="20">REASON 3</text><g id="w2f"></g>
<text class="d5" x="1090" y="690" font-size="28">Fear of looking foolish.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Steve Wozniak.</text>
<text class="b" x="120" y="176" font-size="32">A shy young engineer in the 1970s.</text>
<g id="wz"><g id="wzf"></g>
<text class="m" x="300" y="650" font-size="20" text-anchor="middle">STEVE WOZNIAK</text>
<text class="m" x="300" y="682" font-size="20" text-anchor="middle">ENGINEER · 1970S</text></g>
<g id="club"><circle cx="1100" cy="470" r="70" fill="var(--line)"/><g id="links"></g><g id="mem"></g>
<text class="m" x="1100" y="730" font-size="20" text-anchor="middle">HOMEBREW COMPUTER CLUB</text>
<text class="m" x="1100" y="762" font-size="20" text-anchor="middle">HOBBYISTS SWAPPING IDEAS</text></g>
