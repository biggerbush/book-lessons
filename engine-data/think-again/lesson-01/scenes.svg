<g id="crowd3"></g><g id="thumbs"></g>
<g id="mtr"><text class="m" x="990" y="780" font-size="20">APPROVAL</text><rect id="meter" class="loss" x="990" y="796" width="0" height="24" rx="12"/><rect class="s-ink" x="990" y="796" width="470" height="24" rx="12" fill="none" stroke-width="4"/></g>
<g id="say3"><text class="d" x="120" y="840" font-size="40">We say what they want to hear.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Busy being right.</text>
<text class="b" x="120" y="176" font-size="32">In all three roles, our own views stay safe from questioning.</text>
<g id="trio"></g><g id="chk"></g><g id="ties"></g>
<g id="vault"><rect class="s-ink" x="640" y="560" width="320" height="220" rx="16" fill="var(--stage)" stroke-width="7"/>
<g id="lock"><path class="s-ink" d="M770 640v-24a30 30 0 0 1 60 0v24" fill="none" stroke-width="10"/><rect class="loss" x="755" y="636" width="90" height="70" rx="10"/><circle cx="800" cy="664" r="9" fill="var(--stage)"/></g>
<text class="m" x="800" y="752" font-size="20" text-anchor="middle">OUR OWN VIEWS</text></g>
<g id="others"></g>
<g id="outs"><path class="s-gain" d="M630 700H460m20-16-20 16 20 16M970 700H1140m-20-16 20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="never4"><text class="d" x="120" y="840" font-size="44">We change other minds, never our own.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">4. The scientist.</text>
<text class="b" x="120" y="176" font-size="32">A belief is a hypothesis: a best guess waiting to be tested.</text>
