<g id="st1"><text class="m" x="1220" y="530" font-size="18" text-anchor="middle">EXPLAIN WHY</text></g>
<g id="st2"><text class="m" x="1380" y="410" font-size="18" text-anchor="middle">HOLD DAILY</text></g>
<circle id="clm" class="gain" r="20"/>
<g id="askq"><text class="d5" x="120" y="810" font-size="38">What standard have you quietly been accepting?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qt"><text class="m" x="143" y="230" font-size="26">ONE AREA WHERE YOUR TEAM KEEPS FALLING SHORT</text></g>
<g id="qm"><path class="s-ink" d="M1340 300V640M1460 300V640" stroke-width="8" stroke-linecap="round"/><rect id="qbar" class="gain" x="1330" y="600" width="140" height="14" rx="7"/></g>
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">What are you tolerating,</text></g>
<g id="qb"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">and what will you stop</text></g>
<g id="qc"><text class="d" x="136" y="580" font-size="88" letter-spacing="-2">accepting <tspan style="fill:var(--gain)">this week?</tspan></text></g>
<text class="m" x="143" y="700" font-size="26">NO BAD TEAMS, ONLY BAD LEADERS</text>
</g>