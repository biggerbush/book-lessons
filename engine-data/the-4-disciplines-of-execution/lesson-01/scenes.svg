<text class="m" x="1120" y="650" font-size="22" text-anchor="middle">YOUR GOAL, INSIDE THE WHIRLWIND</text></g>
<g id="mid"><text class="d" x="120" y="820" font-size="44">Execute your goal in the middle of it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of strategy.</text>
<text class="b" x="120" y="176" font-size="32">Some need a signature. Some need many people to change.</text>
<g id="pnl0"><rect class="s-line" x="120" y="220" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="275" font-size="22">STROKE OF A PEN</text>
<rect class="s-ink" x="300" y="310" width="240" height="300" rx="8" fill="none" stroke-width="5"/>
<text class="m" x="330" y="350" font-size="18">PURCHASE</text>
<path class="s-line" d="M330 385h180M330 425h180M330 465h120" stroke-width="6" stroke-linecap="round"/>
<path id="sig" class="s-ink" d="M330 560c20-40 30 20 50-10s20-30 40 0 30 20 50-10 20 10 40 0" fill="none" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="done"><circle class="gain" cx="640" cy="340" r="44"/><path d="M618 340l16 16 28-30" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="money"><text class="d5" x="150" y="700" font-size="34">Money or authority does it.</text></g></g>
<g id="pnl1"><rect class="s-line" x="840" y="220" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="275" font-size="22">MANY PEOPLE MUST CHANGE</text>
<g id="ppl"></g><g id="swal"></g>
<g id="swtx"><text class="d5" x="870" y="700" font-size="34">The whirlwind swallows these.</text></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The wrong diagnosis.</text>
<text class="b" x="120" y="176" font-size="32">Lazy people? A weak plan? Usually neither.</text>
<g id="fing"><path class="loss" d="M200 450h360v-20l60 40-60 40v-20H200z"/><text class="m" x="200" y="420" font-size="22" style="fill:var(--loss)">BLAME</text></g>
