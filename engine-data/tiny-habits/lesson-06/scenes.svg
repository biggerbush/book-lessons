<g id="s0">
<text class="m" x="120" y="150" font-size="28">TINY HABITS · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Celebrate to</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">wire it in.</text>
<text class="b" x="120" y="600" font-size="32">A tiny celebration turns a small action into a lasting habit.</text>
<path class="s-line" d="M1200 540h280" stroke-width="5" stroke-linecap="round"/>
<g id="t_fig"></g>
<g id="t_arm"><path class="s-ink" d="M1370 420L1420 310" stroke-width="18" stroke-linecap="round"/><circle class="gain" cx="1420" cy="300" r="24"/><g id="t_rays"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The repetition myth.</text>
<text class="b" x="120" y="176" font-size="32">We count the days and wait for it to become automatic.</text>
<g id="r_cal">
<rect class="s-ink" x="120" y="240" width="520" height="480" rx="16" fill="var(--stage)" stroke-width="6"/>
<path class="loss" d="M120 310V256a16 16 0 0 1 16-16h488a16 16 0 0 1 16 16v54z"/>
<rect class="ink" x="212" y="222" width="16" height="40" rx="8"/><rect class="ink" x="532" y="222" width="16" height="40" rx="8"/>
<text class="m" x="380" y="284" font-size="22" text-anchor="middle" style="fill:var(--stage)">DAY AFTER DAY</text>
<g id="r_x"></g>
</g>
<g id="r_tal"></g>
<g id="r_auto"><rect x="780" y="610" width="700" height="90" rx="14" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="1130" y="664" font-size="22" text-anchor="middle">STILL WAITING FOR “AUTOMATIC”…</text></g>
<g id="r_not"><text class="d" x="120" y="820" font-size="50">Repetition is <tspan style="fill:var(--loss)">not</tspan> the main thing.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feelings do the work.</text>
<text class="b" x="120" y="176" font-size="32">Your brain learns from how a behavior makes you feel.</text>
<g id="f_brain">
<g id="f_glow"></g>
<g transform="translate(400 460)">
<path id="f_bo" d="M-150 40C-190 0-170-80-110-95C-90-150-10-160 20-120C60-160 150-140 155-70C200-40 190 40 140 60C130 110 60 120 20 95C-20 130-110 120-120 70C-140 65-150 55-150 40Z" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M-80-60c30 10 30 50 0 60M20-110c-10 40 30 60 10 100M90-60c-30 20-20 60 20 70" fill="none" stroke-width="5" stroke-linecap="round"/>
</g>
<text class="m" x="400" y="618" font-size="22" text-anchor="middle">YOUR BRAIN</text>
</g>
<g id="f_quote">
<rect class="s-line" x="760" y="250" width="720" height="330" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="760" y="250" width="14" height="330"/>
<text class="d5" x="810" y="350" font-size="44">“Emotions create habits.</text>
<text class="d5" x="810" y="420" font-size="44">Not repetition.</text>
<text class="d5" x="810" y="490" font-size="44">Not frequency.”</text>
<text class="m" x="810" y="545" font-size="20">— BJ FOGG</text>
</g>
<g id="f_pills"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Shine.</text>
<text class="b" x="120" y="176" font-size="32">Fogg’s name for the feeling of success.</text>
<g id="sh_fw"><g id="sh_rays"></g><g id="sh_face"></g></g>
<g id="sh_word"><text class="d" x="400" y="790" font-size="110" text-anchor="middle" style="fill:var(--gain)">Shine</text></g>
<g id="sh_paper">
<rect class="s-ink" x="820" y="250" width="280" height="360" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="860" y="340" font-size="72" style="fill:var(--gain)">A+</text>
<path class="s-line" d="M860 400h200M860 450h200M860 500h160M860 550h200" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="960" y="650" font-size="20" text-anchor="middle">ACE A TEST</text>
</g>
<g id="sh_clap"><text class="m" x="1320" y="650" font-size="20" text-anchor="middle">HEAR APPLAUSE</text></g>
<g id="sh_cel"><text class="d" x="820" y="760" font-size="48">Celebration = Shine</text><text class="m" x="820" y="810" font-size="22" style="fill:var(--gain)">CREATED ON PURPOSE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Timing is everything.</text>
<text class="b" x="120" y="176" font-size="32">Celebrate right after the behavior, or even during it.</text>
<g id="tm_sw">
<rect class="ink" x="340" y="300" width="40" height="28" rx="6"/>
<circle class="s-ink" cx="360" cy="480" r="150" fill="var(--stage)" stroke-width="8"/>
<g id="tm_ticks"></g>
<path id="tm_hand" class="s-gain" d="M360 480V362" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="360" cy="480" r="12"/>
<text class="m" x="360" y="690" font-size="22" text-anchor="middle">INSTANTLY</text>
</g>
<g id="tm_beh">
<path class="s-muted" d="M680 460H1450m-18-18 18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="ink" x="700" y="410" width="200" height="50" rx="8"/>
<text class="m" x="800" y="395" font-size="20" text-anchor="middle">BEHAVIOR</text>
</g>
<g id="tm_cel"><circle id="tm_dot" class="gain" cx="950" cy="460" r="24"/><text class="m" x="950" y="520" font-size="20" text-anchor="middle" style="fill:var(--gain)">CELEBRATE</text></g>
<g id="tm_chain">
<rect x="740" y="580" width="150" height="64" rx="32" fill="none" stroke="var(--ink)" stroke-width="10"/>
<rect x="850" y="580" width="150" height="64" rx="32" fill="none" stroke="var(--gain)" stroke-width="10"/>
<text class="m" x="870" y="690" font-size="20" text-anchor="middle" style="fill:var(--gain)">FEELING LINKED TO ACTION</text>
</g>
<g id="tm_late">
<circle class="loss" cx="1360" cy="460" r="24"/>
<text class="m" x="1360" y="520" font-size="20" text-anchor="middle">AN HOUR LATER</text>
<rect x="1230" y="580" width="110" height="64" rx="32" fill="none" stroke="var(--loss)" stroke-width="10"/>
<rect x="1376" y="580" width="100" height="64" rx="32" fill="none" stroke="var(--loss)" stroke-width="10"/>
<text class="m" x="1355" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">TOO LATE</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">One tooth, one cheer.</text>
<text class="b" x="120" y="176" font-size="32">The book’s classic example.</text>
<g id="tb_panel">
<rect class="s-line" x="120" y="230" width="620" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-loss" d="M150 300H710" stroke-width="10" stroke-linecap="round"/>
<g id="tb_teeth"></g>
<path id="tb_floss" class="s-gain" d="M340 262V418Q385 446 430 418V262" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="tb_brush">
<path class="s-ink" d="M234 500v-16M252 500v-16M270 500v-16M288 500v-16M306 500v-16" stroke-width="5" stroke-linecap="round"/>
<rect class="s-ink" x="220" y="500" width="100" height="44" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="320" y="510" width="300" height="24" rx="12"/>
</g>
<text class="m" x="150" y="650" font-size="20">AFTER I BRUSH, I FLOSS ONE TOOTH</text>
</g>
<g id="mr">
<ellipse class="s-ink" cx="1140" cy="430" rx="170" ry="190" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1140 620v40M1060 660h160" stroke-width="8" stroke-linecap="round"/>
<g id="mr_rays"></g><g id="mr_face"></g>
</g>
<g id="mr_v"><text class="d" x="1140" y="740" font-size="64" text-anchor="middle" style="fill:var(--gain)">Victory!</text></g>
<g id="mr_s"><text class="m" x="1140" y="800" font-size="22" text-anchor="middle">A LITTLE SILLY? THAT’S FINE.</text></g>
<g id="mr_k"><text class="d" x="120" y="800" font-size="40">Shine says: keep this habit.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Find your celebration.</text>
<text class="b" x="120" y="176" font-size="32">A word, a gesture, or a big smile.</text>
<g id="c6_0">
<rect id="c6r0" x="120" y="240" width="440" height="400" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/>
<rect class="s-ink" x="160" y="280" width="220" height="100" rx="40" fill="var(--stage)" stroke-width="6"/>
<path class="ink" d="M200 383l-14 36 46-36z"/>
<text class="d" x="270" y="348" font-size="48" text-anchor="middle">Yes!</text>
<rect class="gain" x="260" y="430" width="260" height="100" rx="40"/>
<path class="gain" d="M480 528l14 36-46-36z"/>
<text class="d" x="390" y="494" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">Nailed it!</text>
<text class="m" x="150" y="610" font-size="22">A WORD</text>
</g>
<g id="c6_1">
<rect id="c6r1" x="580" y="240" width="440" height="400" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/>
<g id="fc_p"></g>
<g id="fc_arm"><path class="s-ink" d="M795 470L850 360" stroke-width="14" stroke-linecap="round"/><circle class="gain" cx="850" cy="350" r="20"/></g>
<text class="m" x="610" y="610" font-size="22">A GESTURE</text>
</g>
<g id="c6_2">
<rect id="c6r2" x="1040" y="240" width="440" height="400" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="4"/>
<g id="fc_smile"></g>
<text class="m" x="1070" y="610" font-size="22">A BIG SMILE</text>
</g>
<g id="c6_t"><text class="d" x="120" y="770" font-size="52">The only test: does it <tspan style="fill:var(--gain)">feel good?</tspan></text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Practice the feeling.</text>
<text class="b" x="120" y="176" font-size="32">Awkward at first? Treat celebrating as a skill.</text>
<g id="lp">
<circle class="s-line" cx="400" cy="470" r="140" fill="none" stroke-width="8"/>
<circle id="lp_arc" cx="400" cy="470" r="140" fill="none" stroke="var(--gain)" stroke-width="10" stroke-linecap="round" stroke-dasharray="200 680"/>
<text class="m" x="400" y="479" font-size="26" text-anchor="middle">PRACTICE</text>
<text class="m" x="400" y="680" font-size="22" text-anchor="middle">TREAT IT AS A SKILL</text>
</g>
<g id="lp_hd">
<text class="m" x="800" y="290" font-size="22">TRY IT A FEW TIMES TODAY</text>
<text class="m" x="840" y="490" font-size="20" text-anchor="middle">AWKWARD</text>
<text class="m" x="1440" y="490" font-size="20" text-anchor="middle" style="fill:var(--gain)">EASY</text>
</g>
<g id="lp_faces"></g>
<g id="su"><g id="su_rays"></g><circle class="gain" r="50"/></g>
<g id="su_l"><path class="s-line" d="M820 700H1460" stroke-width="5" stroke-linecap="round"/><text class="m" x="1140" y="770" font-size="22" text-anchor="middle" style="fill:var(--gain)">THE SHINE ARRIVES QUICKLY</text></g>
<g id="su_t"><text class="d" x="120" y="800" font-size="46">Your new habits start to stick.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="52" letter-spacing="-1">Pick one tiny habit.</text></g>
<g id="qb"><text class="d" x="136" y="360" font-size="52" letter-spacing="-1">Choose a celebration.</text></g>
<g id="qc"><text class="d" x="136" y="470" font-size="52" letter-spacing="-1">Tonight: do it,</text></g>
<g id="qd"><text class="d" x="136" y="540" font-size="52" letter-spacing="-1">celebrate, and notice</text></g>
<g id="qe"><text class="d" x="136" y="610" font-size="52" letter-spacing="-1">your <tspan style="fill:var(--gain)">Shine</tspan>.</text></g>
<text class="m" x="139" y="720" font-size="24">CELEBRATE INSTANTLY</text>
<path class="s-line" d="M860 230V790" stroke-width="3" stroke-dasharray="6 10"/>

<g id="q8_st0">
<circle cx="1000" cy="272" r="75" fill="var(--stage)" stroke="var(--line)" stroke-width="5"/>
<path id="q8_tooth" d="M972 238Q1000 224 1028 238Q1042 246 1036 272L1026 312Q1021 324 1016 312L1008 288L992 288L984 312Q979 324 974 312L964 272Q958 246 972 238Z" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1110" y="256" font-size="20">STEP 1</text>
<text class="d5" x="1110" y="300" font-size="34">Do one tiny habit</text>
</g>
