<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What one small thing</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">would your future self</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">do <tspan style="fill:var(--gain)">tomorrow</tspan>?</text></g>
