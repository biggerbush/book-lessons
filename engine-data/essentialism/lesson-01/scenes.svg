<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 1</text>
<text class="d" x="116" y="430" font-size="84" letter-spacing="-2">Less, but better.</text>
<text class="b" x="120" y="520" font-size="32">Why fewer priorities can mean far more progress</text>
<g id="t_fig"></g>
<circle class="s-ink" cx="1220" cy="400" r="56" fill="var(--stage)" stroke-width="7"/>
<g id="t_sc"></g>
<g id="t_big"><path id="t_line" class="s-gain" fill="none" stroke-width="12" stroke-linecap="round"/><path id="t_head" class="gain" d="M0 -24L40 0L0 24z"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stretched thin.</text>
<text class="b" x="120" y="176" font-size="32">Yes to everything. Progress on nothing.</text>
<g id="jug"></g><g id="balls"></g><g id="yes"></g>
<g id="cal"><rect class="s-ink" x="860" y="240" width="580" height="420" rx="12" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="860" y="240" width="580" height="60" rx="12"/><g id="cells"></g></g>
<g id="imp"><text class="m" x="860" y="694" font-size="20">IMPORTANT WORK</text><rect class="s-ink" x="860" y="706" width="580" height="24" rx="12" fill="none" stroke-width="4"/><rect id="impf" class="gain" x="860" y="706" width="0" height="24" rx="12"/></g>
<g id="nothing"><text class="d" x="120" y="820" font-size="46">Busy all week. Nothing important moved.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Energy scattered.</text>
<text class="b" x="120" y="176" font-size="32">Dozens of directions at once.</text>
<g id="c1"><circle class="s-ink" cx="520" cy="500" r="110" fill="var(--stage)" stroke-width="7"/></g>
<g id="e1"><text class="m" x="520" y="508" font-size="22" text-anchor="middle">YOUR ENERGY</text></g>
<g id="sarr"></g>
<circle id="ring" class="s-muted" cx="520" cy="500" r="190" fill="none" stroke-width="3" stroke-dasharray="6 10"/>
<g id="bars"><text class="m" x="920" y="366" font-size="20" style="fill:var(--gain)">REAL PROGRESS</text><path class="s-gain" d="M920 384H1440" stroke-width="4" stroke-dasharray="12 10"/><path class="s-ink" d="M920 620H1440" stroke-width="5"/><text class="m" x="920" y="660" font-size="20">PROGRESS PER PROJECT</text><g id="barsg"></g></g>
<g id="none"><text class="d" x="120" y="800" font-size="46">A little everywhere. Real progress nowhere.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Energy focused.</text>
<text class="b" x="120" y="176" font-size="32">Same circle. Same effort. One direction.</text>
<g id="c2"><circle class="s-ink" cx="320" cy="500" r="110" fill="var(--stage)" stroke-width="7"/><text class="m" x="320" y="508" font-size="22" text-anchor="middle">YOUR ENERGY</text></g>
<path id="bigl" class="s-gain" fill="none" stroke-width="16" stroke-linecap="round"/>
<path id="bigh" class="gain" d="M0 -30L44 0L0 30z"/>
<g id="same"><text class="m" x="320" y="672" font-size="22" text-anchor="middle">SAME EFFORT</text></g>
<g id="fin"><path class="s-ink" d="M1380 330V670" stroke-width="5" stroke-dasharray="14 10"/><path class="gain" d="M1384 330h70l-16 22 16 22h-70z"/><text class="m" x="1380" y="704" font-size="20" text-anchor="middle">FURTHER</text></g>
<g id="far"><text class="d" x="120" y="800" font-size="46">Undivided, it travels much further.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A designer’s motto.</text>
<text class="b" x="120" y="176" font-size="32">Borrowed from German industrial designer Dieter Rams.</text>
<g id="rams"><text class="m" x="260" y="640" font-size="22" text-anchor="middle">DIETER RAMS</text><text class="m" x="260" y="676" font-size="22" text-anchor="middle">INDUSTRIAL DESIGNER</text></g>
<g id="motto"><rect class="gain" x="440" y="300" width="560" height="150" rx="24"/><path class="gain" d="M444 392L370 440L444 420z"/><text class="d" x="720" y="394" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">Less, but better.</text></g>
<g id="dev"><rect class="s-ink" x="1080" y="280" width="360" height="260" rx="24" fill="var(--stage)" stroke-width="6"/><circle class="s-gain" cx="1350" cy="400" r="54" fill="none" stroke-width="8"/><path class="s-gain" d="M1350 400V362" stroke-width="8" stroke-linecap="round"/><g id="grid"></g><text class="m" x="1260" y="600" font-size="20" text-anchor="middle">EVERY PART EARNS ITS PLACE</text></g>
<g id="clut"></g>
<g id="apply"><text class="d" x="120" y="790" font-size="42">Same thinking, for your time and energy.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Disciplined, not lazy.</text>
<text class="b" x="120" y="176" font-size="32">Choosing, on purpose, where your effort goes.</text>
<g id="scale"><path class="s-ink" d="M400 300V680M320 680H480" fill="none" stroke-width="8" stroke-linecap="round"/><path id="beam" class="s-ink" d="M200 300H600" stroke-width="8" stroke-linecap="round"/><g id="panL"></g><g id="panR"></g><circle class="ink" cx="400" cy="300" r="14"/></g>
<g id="row1"><text class="m" x="820" y="290" font-size="22">NONESSENTIALIST</text><g id="f1"></g><polyline class="s-loss" points="950,360 1010,320 1060,400 1120,330 1180,410 1240,320 1300,390 1360,340 1420,400" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="950" y="462" font-size="20">REACTS TO WHATEVER IS LOUDEST</text></g>
<g id="row2"><text class="m" x="820" y="522" font-size="22" style="fill:var(--gain)">ESSENTIALIST</text><g id="f2"></g><rect class="ink" x="950" y="548" width="14" height="50" rx="4"/><rect class="ink" x="976" y="548" width="14" height="50" rx="4"/></g>
<g id="row2b"><path class="s-gain" d="M1020 573H1400" stroke-width="10" stroke-linecap="round"/><path class="gain" d="M1396 549L1440 573L1396 597z"/><text class="m" x="950" y="690" font-size="20">PAUSES, ASKS, GIVES IT FULL ENERGY</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who chooses?</text>
<text class="b" x="120" y="176" font-size="32">If you don’t prioritise your life, someone else will.</text>
<g id="pupw"><text class="m" x="390" y="236" font-size="22" text-anchor="middle">SOMEONE ELSE</text>
<g id="pup"><path class="s-ink" d="M240 262H540" stroke-width="10" stroke-linecap="round"/><g id="strs"><path class="s-muted" d="M250 262L300 510M390 262L390 414M530 262L480 510" fill="none" stroke-width="3"/></g><g id="pupf"></g><path class="s-loss" d="M350 540L300 510M430 540L480 510" stroke-width="10" stroke-linecap="round"/><circle class="loss" cx="300" cy="510" r="10"/><circle class="loss" cx="480" cy="510" r="10"/></g></g>
<g id="wheelg"><g id="wheel"><circle class="s-ink" cx="1150" cy="470" r="130" fill="none" stroke-width="16"/><path class="s-ink" d="M1150 470V340M1150 470L1037 535M1150 470L1263 535" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="1150" cy="470" r="30"/></g><text class="m" x="1150" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">YOU DECIDE</text><path class="s-gain" d="M640 470H900M876 446L900 470L876 494" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ctrl"><text class="d" x="120" y="790" font-size="46">Choose the few. Take back control.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your arrows.</text>
<text class="b" x="120" y="176" font-size="32">List them all. Circle the one or two that matter most.</text>
<g id="nb"><rect class="s-ink" x="300" y="240" width="1000" height="560" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g></g>
<g id="rows"></g><g id="marks"></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="d" x="136" y="300" font-size="76" letter-spacing="-2">If you could point</text></g>
<g id="q1"><text class="d" x="136" y="390" font-size="76" letter-spacing="-2">your energy in only</text></g>
<g id="q2"><text class="d" x="136" y="480" font-size="76" letter-spacing="-2">one direction this week,</text></g>
<g id="q3"><text class="d" x="136" y="570" font-size="76" letter-spacing="-2" style="fill:var(--gain)">which would it be?</text></g>
<g id="qg"><path id="qa8" class="s-gain" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle class="s-ink" cx="1320" cy="560" r="60" fill="var(--stage)" stroke-width="8"/><circle class="gain" cx="1320" cy="560" r="34"/><text class="d" x="1320" y="577" font-size="46" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="q4"><text class="m" x="143" y="700" font-size="26">CHOOSE IT. GIVE IT YOUR BEST HOUR TOMORROW MORNING.</text></g>
</g>