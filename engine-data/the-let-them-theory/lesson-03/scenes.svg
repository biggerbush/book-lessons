<g id="sl2"><text class="m" x="1200" y="404" font-size="18">SIGN UP FOR THE CLASS</text></g>
<g id="cl6w"><g id="cl6"></g></g>
<g id="vl6"><text class="d" x="120" y="800" font-size="40">Your actions answer to your values,</text><text class="m" x="120" y="846" font-size="22" style="fill:var(--gain)">NOT TO THE CROWD</text></g>
