<rect class="s-line" x="1060" y="230" width="420" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1270" y="280" font-size="20" text-anchor="middle">A GOOD FEELING</text>
<g id="rings"></g>
