<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The short-term trap.</text>
<text class="b" x="120" y="176" font-size="32">Repeated relationships are where real returns live.</text>
<text class="m" x="140" y="252" font-size="20">REPEATED DEALS</text>
<g id="sbars"></g><g id="chn"></g>
<g id="zeroT"><text class="m" x="610" y="770" font-size="22" style="fill:var(--loss)">BACK TO ZERO</text></g>
<g id="strg"><text class="m" x="1190" y="620" font-size="20">NEW PEOPLE, NO TRUST</text></g>
<g id="cutT"><text class="d" x="120" y="830" font-size="40">Cutting corners resets compounding to zero.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trust saves time.</text>
<text class="b" x="120" y="176" font-size="32">After years together, you stop checking every detail.</text>
