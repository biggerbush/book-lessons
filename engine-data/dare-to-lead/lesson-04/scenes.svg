<g id="ld"><text class="d" x="120" y="820" font-size="46">Let down, though she never explained.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">Paint the finished picture together.</text>
<text class="b" x="120" y="176" font-size="32">Describe the result before anyone starts.</text>
