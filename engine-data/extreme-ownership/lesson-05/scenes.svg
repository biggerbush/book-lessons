<text class="m" x="1280" y="310" font-size="20" text-anchor="end">ABOVE</text><text class="m" x="1280" y="490" font-size="20" text-anchor="end" style="fill:var(--gain)">YOU</text><text class="m" x="1280" y="670" font-size="20" text-anchor="end">BELOW</text>
