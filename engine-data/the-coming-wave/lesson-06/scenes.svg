<ellipse class="loss" cx="575" cy="775" rx="50" ry="10"/><g id="drips"></g>
<text class="d" x="160" y="840" font-size="40">Leaks have happened.</text></g>
<g id="labs"></g>
<g id="labsL"><text class="m" x="660" y="610" font-size="20">MORE LABS, MORE POWERFUL TOOLS</text></g>
<g id="gauge"><path class="s-line" d="M1080 560A180 180 0 0 1 1440 560" fill="none" stroke-width="24"/>
<path class="s-loss" d="M1387 433A180 180 0 0 1 1440 560" fill="none" stroke-width="24"/>
<path id="ndl" class="s-ink" d="M1260 560V410" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1260" cy="560" r="16"/>
<text class="m" x="1260" y="610" font-size="20" text-anchor="middle">ODDS OF A SERIOUS MISTAKE</text></g>
<g id="warn"><polygon class="loss" points="1260,232 1318,332 1202,332" stroke="var(--loss)" stroke-width="8" stroke-linejoin="round"/>
<text class="d" x="1260" y="320" font-size="56" text-anchor="middle" style="fill:var(--stage)">!</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The urge to clamp down.</text>
<text class="b" x="120" y="176" font-size="32">A frightened public will demand protection.</text>
<g id="crowd4"><text class="m" x="120" y="680" font-size="20">FRIGHTENED PUBLIC</text></g>
<path id="a4" class="s-muted" d="M480 460h80m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
