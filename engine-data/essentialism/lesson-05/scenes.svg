<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Not a clear yes?</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Then it’s a <tspan style="fill:var(--gain)">no</tspan>.</text>
<text class="b" x="120" y="600" font-size="32">Why a strict filter beats a loose yes every time.</text>
<g id="fun"><path class="s-ink" d="M1120 260H1460L1320 480V620M1260 620V480L1120 260" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1290" y="704" font-size="22" text-anchor="middle" style="fill:var(--gain)">CLEAR YES</text></g>
<g id="fdots"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most of us say yes too easily.</text>
<text class="b" x="120" y="176" font-size="32">If it seems useful, we say yes.</text>
<g id="door1">
<rect class="gain" x="160" y="260" width="240" height="480" fill-opacity=".18"/>
<path class="s-ink" d="M160 260L300 300V700L160 740Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="ink" cx="280" cy="500" r="8"/>
<rect class="s-ink" x="160" y="260" width="240" height="480" fill="none" stroke-width="7"/>
<text class="m" x="280" y="790" font-size="20" text-anchor="middle">IF IT SEEMS USEFUL: YES</text>
<path class="s-muted" d="M440 500h140m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="cal1"><rect class="s-line" x="620" y="240" width="572" height="524" rx="16" fill="var(--stage)" stroke-width="3"/><text class="m" x="640" y="290" font-size="22">THIS WEEK</text></g>
<g id="cells1"></g>
<g id="great1"><g id="great1w"><rect class="gain" x="1250" y="420" width="210" height="120" rx="14"/><text class="d" x="1355" y="494" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">GREAT</text></g></g>
<g id="noroom"><text class="m" x="1355" y="600" font-size="22" text-anchor="middle" style="fill:var(--loss)">NO ROOM LEFT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">“Hell yeah!” or no.</text>
<text class="b" x="120" y="176" font-size="32">A rule from entrepreneur Derek Sivers.</text>
<g id="siv"><g id="sivp"></g><text class="m" x="260" y="640" font-size="20" text-anchor="middle">DEREK SIVERS</text></g>
<g id="bub2">
<polygon class="s-ink" points="430,376 480,376 360,430" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="s-ink" x="400" y="260" width="380" height="120" rx="30" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="590" y="338" font-size="52" text-anchor="middle">Hell yeah?</text>
</g>
<g id="notyes"><text class="m" x="400" y="470" font-size="22" style="fill:var(--loss)">NOT A HELL YEAH? THEN NO.</text></g>
<g id="cA"><rect class="s-line" x="880" y="240" width="280" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><g id="tA"></g>
<text class="d5" x="1020" y="640" font-size="36" text-anchor="middle">Hell yeah</text><text class="m" x="1020" y="690" font-size="20" text-anchor="middle" style="fill:var(--gain)">BIG ENTHUSIASM</text></g>
<g id="cB"><rect class="s-line" x="1200" y="240" width="280" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><g id="tB"></g>
<text class="d5" x="1340" y="640" font-size="36" text-anchor="middle">Lukewarm</text><text class="m" x="1340" y="690" font-size="20" text-anchor="middle" style="fill:var(--loss)">THUMBS DOWN</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The 90 percent rule.</text>
<text class="b" x="120" y="176" font-size="32">Score each option on your single most important criterion.</text>
<g id="crit"><text class="m" x="172" y="278" font-size="22">YOUR #1 CRITERION</text></g>
<g id="bar3">
<rect x="200" y="408" width="1200" height="24" rx="12" fill="var(--line)"/>
<rect class="gain" x="1280" y="408" width="120" height="24"/>
<path class="s-gain" d="M1280 345V470" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="1280" y="334" font-size="30" text-anchor="middle" style="fill:var(--gain)">90</text>
</g>
<g id="tick3"></g>
<g id="mk3"></g>
<g id="rule3"><text class="d" x="120" y="640" font-size="56">Below 90? It’s a zero.</text><text class="m" x="120" y="700" font-size="22">ANYTHING SHORT OF A CLEAR YES IS REJECTED</text></g>
