</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Respect over liking.</text>
<text class="b" x="120" y="176" font-size="32">A clear no trades a little popularity for a lot of respect.</text>
<g id="sc3">
<path class="s-ink" d="M700 300V660" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="590" y="660" width="220" height="16" rx="8"/>
<line id="bm3" class="s-ink" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="700" cy="300" r="14"/>
<g id="pL3"><path class="s-muted" d="M0 0L-80 150M0 0L80 150" fill="none" stroke-width="3"/>
<rect class="s-ink" x="-40" y="100" width="80" height="50" fill="var(--stage)" stroke-width="4"/>
<path class="ink" d="M-100 150h200l-30 30h-140z"/>
