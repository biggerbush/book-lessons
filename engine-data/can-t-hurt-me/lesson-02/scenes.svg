<g id="s0">
<text class="m" x="120" y="150" font-size="28">CAN'T HURT ME · LESSON 2</text>
<text class="d" x="116" y="330" font-size="84" letter-spacing="-2">Face the</text>
<text class="d" x="116" y="426" font-size="84" letter-spacing="-2">accountability</text>
<text class="d" x="116" y="522" font-size="84" letter-spacing="-2">mirror.</text>
<text class="b" x="120" y="630" font-size="32">Change begins with brutal honesty, written where you can't ignore it.</text>
<g id="mir0"><ellipse cx="1300" cy="390" rx="140" ry="190" fill="var(--ice)" class="s-ink" stroke-width="8"/><g id="rf0"></g><path id="gl" d="M1375 255l30 40M1365 300l40 52" stroke="var(--stage)" stroke-width="10" stroke-linecap="round"/></g>
<g id="bub0"><path d="M1150 238l45 40-5-40" fill="var(--stage)" class="s-gain" stroke-width="5" stroke-linejoin="round"/><rect x="1000" y="170" width="200" height="70" rx="20" fill="var(--stage)" class="s-gain" stroke-width="5"/><text class="m" x="1100" y="213" font-size="22" text-anchor="middle" style="fill:var(--gain)">NO LIES</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The comfortable lie.</text>
<text class="b" x="120" y="176" font-size="32">Telling yourself a kinder story than the truth.</text>
<g id="yd"><g id="dv"></g><rect class="ink" x="160" y="560" width="600" height="14" rx="7"/><path class="s-ink" d="M200 574v120M720 574v120" stroke-width="8" stroke-linecap="round"/><rect class="s-ink" x="250" y="470" width="100" height="80" fill="var(--stage)" stroke-width="5"/><text class="d" x="300" y="530" font-size="52" text-anchor="middle" style="fill:var(--loss)">F</text></g>
<g id="cs"><g id="fr"></g><rect class="s-ink" x="570" y="470" width="100" height="80" fill="var(--stage)" stroke-width="5"/><text class="d" x="620" y="530" font-size="52" text-anchor="middle" style="fill:var(--gain)">A</text>
<path class="s-loss" d="M600 462Q465 320 330 462M326 438l4 24 22-10" fill="none" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="465" y="350" font-size="20" text-anchor="middle" style="fill:var(--loss)">COPIED</text></g>
<g id="yl"><text class="m" x="160" y="732" font-size="24" style="fill:var(--ink)">SO NOBODY SAW HOW FAR BEHIND HE WAS</text></g>
<g id="face"><circle class="loss" cx="1170" cy="440" r="150"/><circle cx="1120" cy="410" r="12" fill="var(--stage)"/><circle cx="1220" cy="410" r="12" fill="var(--stage)"/><path d="M1110 515Q1170 470 1230 515" fill="none" stroke="var(--stage)" stroke-width="8" stroke-linecap="round"/></g>
<g id="mask"><path class="s-ink" d="M1020 430h-40M1320 430h40" stroke-width="5" stroke-linecap="round"/><circle class="gain" cx="1170" cy="440" r="150"/><path d="M1100 410q20-20 40 0M1200 410q20-20 40 0M1095 475Q1170 550 1245 475" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round"/></g>
<text id="lt" class="m" x="1170" y="650" font-size="22" text-anchor="middle">THE TRUTH</text>
<g id="stuck"><text class="d" x="120" y="820" font-size="46">A comfortable story keeps you stuck.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Talking straight.</text>
<text class="b" x="120" y="176" font-size="32">Out loud, eye to eye, in front of the mirror.</text>
<g id="bath"><rect x="160" y="230" width="380" height="420" rx="16" fill="var(--ice)" class="s-ink" stroke-width="7"/><g id="rf"></g>
<path class="s-ink" d="M350 690v-24h30" fill="none" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="180" y="690" width="340" height="36" rx="18"/><g id="gp"></g></g>
<path id="eye" class="s-gain" d="M690 395L392 370" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
<g id="sb"><path d="M884 410L815 440L884 470" fill="var(--stage)" class="s-ink" stroke-width="6" stroke-linejoin="round"/><rect x="880" y="250" width="600" height="380" rx="28" fill="var(--stage)" class="s-ink" stroke-width="6"/>
<text class="m" x="920" y="310" font-size="20">WHAT HE ADMITTED, OUT LOUD</text>
<g id="l1"><text class="d" x="920" y="400" font-size="44">I can barely read.</text></g>
<g id="l2"><text class="d" x="920" y="470" font-size="44">I'm not putting</text><text class="d" x="920" y="540" font-size="44">in the work.</text></g></g>
<g id="ng"><text class="d" x="120" y="810" font-size="50" style="fill:var(--loss)">He was not gentle.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Notes on the glass.</text>
<text class="b" x="120" y="176" font-size="32">What has to change, stuck where he can't miss it.</text>
<rect x="160" y="230" width="560" height="580" rx="16" fill="var(--ice)" class="s-ink" stroke-width="7"/>
<rect id="glow" class="gain" x="160" y="230" width="560" height="580" rx="16" opacity="0"/>
<g id="n0"><g transform="translate(210 280) rotate(-4)"><rect class="gain" width="220" height="190" rx="6"/><path d="M30 60h160M30 100h120M30 140h150" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round"/></g></g>
<g id="n1"><g transform="translate(470 300) rotate(3)"><rect class="gain" width="220" height="190" rx="6"/><text class="m" x="24" y="70" font-size="22" style="fill:var(--on-gain)">PASS THE</text><text class="m" x="24" y="105" font-size="22" style="fill:var(--on-gain)">AIR FORCE</text><text class="m" x="24" y="140" font-size="22" style="fill:var(--on-gain)">TEST</text></g></g>
<g id="n2"><g transform="translate(230 540) rotate(2)"><rect class="gain" width="220" height="190" rx="6"/><text class="m" x="24" y="70" font-size="22" style="fill:var(--on-gain)">STUDY</text><text class="m" x="24" y="105" font-size="22" style="fill:var(--on-gain)">EVERY DAY</text></g></g>
<g id="r0"><g class="ink">
<rect x="812" y="316" width="128" height="18" rx="9"/>
<path d="M896 322L862 270H846L866 325L846 380H862L896 328Z" stroke-linejoin="round"/>
<path d="M834 322L816 290H804L814 325L804 360H816L834 328Z" stroke-linejoin="round"/>
</g>
<text class="d5" x="980" y="330" font-size="36">Join the Air Force.</text><text class="b" x="980" y="372" font-size="28">The entrance test became a goal.</text></g>
<g id="r1"><rect class="ink" x="826" y="520" width="96" height="22" rx="4"/><rect class="gain" x="836" y="496" width="80" height="22" rx="4"/><rect class="ink" x="830" y="472" width="88" height="22" rx="4" opacity=".6"/>
<text class="d5" x="980" y="520" font-size="36">Study every day,</text><text class="b" x="980" y="562" font-size="28">until his reading caught up.</text></g>
<g id="r2"><g id="sun"><circle class="gain" cx="870" cy="700" r="26"/><g id="rays"></g></g><path class="s-ink" d="M810 732h120" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="980" y="710" font-size="34">Every morning, a reminder</text><text class="b" x="980" y="752" font-size="28">of the promises made to himself.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Truth, then steps.</text>
<text class="b" x="120" y="176" font-size="32">Break a huge goal into small, checkable steps.</text>
<g id="pt"><rect class="ink" x="120" y="216" width="220" height="60" rx="30"/><text class="m" x="230" y="254" font-size="24" text-anchor="middle" style="fill:var(--stage)">TRUTH</text></g>
<g id="ps"><text class="d" x="370" y="262" font-size="44" text-anchor="middle" style="fill:var(--muted)">+</text><rect class="gain" x="400" y="216" width="220" height="60" rx="30"/><text class="m" x="510" y="254" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">STEPS</text></g>
<g id="st"><path d="M200 780V700H370V620H540V540H710V460H880V380H1050V300H1220V780Z" fill="var(--line)"/><path class="s-ink" d="M200 780V700H370V620H540V540H710V460H880V380H1050V300H1220V780Z" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
