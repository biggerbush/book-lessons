<g id="ph"><text class="m" x="143" y="230" font-size="26">TOMORROW, BEFORE YOU CHECK YOUR PHONE, ASK:</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What is one thing</text></g>
