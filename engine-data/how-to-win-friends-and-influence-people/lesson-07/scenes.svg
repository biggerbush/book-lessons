<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">See the world</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">through their eyes.</text>
<text class="b" x="120" y="600" font-size="32">The one habit hiding underneath every principle in the book.</text>
<g id="eye"><path class="s-ink" d="M1160 400Q1310 280 1460 400Q1310 520 1160 400Z" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/><circle class="gain" cx="1310" cy="400" r="54"/><circle id="pupil" class="ink" cx="1310" cy="400" r="22"/></g>
<g id="skills"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wrong to you. Right to them.</text>
<text class="b" x="120" y="176" font-size="32">There is always a reason people think and act the way they do.</text>
<g id="man"></g>
<g id="cloud"><circle class="s-ink" cx="450" cy="420" r="10" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="500" cy="380" r="16" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="540" y="240" width="440" height="160" rx="80" fill="var(--stage)" stroke-width="6"/><path class="s-gain" d="M600 322l24 24 44-52" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="700" y="338" font-size="48">I’m right.</text></g>
<g id="lockg"><circle class="s-ink" cx="1220" cy="430" r="130" fill="var(--stage)" stroke-width="7"/><path id="khole" class="ink" d="M1220 370a32 32 0 0 1 18 58l14 62h-64l14-62a32 32 0 0 1 18-58z"/><text class="m" x="1220" y="610" font-size="22" text-anchor="middle">THERE’S ALWAYS A REASON</text></g>
<g id="key"><circle class="s-gain" cx="0" cy="0" r="24" fill="none" stroke-width="9"/><path class="s-gain" d="M-24 0h-96M-96 0v20M-72 0v14" fill="none" stroke-width="9" stroke-linecap="round"/></g>
<g id="keyt"><text class="d" x="120" y="800" font-size="44">Find the reason, and you hold the key.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The park fires.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie loved walking in a wooded park near his home.</text>
<path class="s-line" d="M120 720H1480" stroke-width="6" stroke-linecap="round"/>
<g id="trees"></g>
<g id="boys2"></g>
<g id="sparks"><path id="spp" class="s-loss" d="M810 610Q900 440 1000 470" fill="none" stroke-width="4" stroke-dasharray="8 10"/></g>
<g id="sparkt"><text class="d" x="120" y="800" font-size="44" style="fill:var(--loss)">One spark could burn the whole park.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The wrong way: orders.</text>
<text class="b" x="120" y="176" font-size="32">He told them to stop, or risk being arrested.</text>
<g id="gone3"><g id="carn3"></g>
<g id="bub3"><path class="s-loss" d="M440 336L390 400L500 336" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-loss" x="400" y="240" width="600" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d" x="430" y="304" font-size="34">Stop, or you’ll be arrested!</text></g></g>
<g id="boys3"></g>
<g id="lab3"><text class="m" x="1150" y="670" font-size="22" text-anchor="middle">OBEYED, BUT SULLENLY</text></g>
<g id="fire3"></g>
<g id="relt"><text class="m" x="120" y="800" font-size="22">THE MOMENT HE LEFT, THE FIRE CAME BACK</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The right way: interest.</text>
<text class="b" x="120" y="176" font-size="32">He started with what the boys cared about.</text>
<g id="carn4"></g>
<g id="b41"><rect class="s-gain" x="420" y="230" width="340" height="80" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d" x="450" y="284" font-size="36">Having fun?</text></g>
<g id="b42"><rect class="s-gain" x="420" y="330" width="420" height="80" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d" x="450" y="384" font-size="36">What’s for supper?</text></g>
<g id="mem"><rect class="s-ink" x="860" y="220" width="310" height="186" rx="30" fill="var(--stage)" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="1015" y="384" font-size="22" text-anchor="middle">HE LOVED FIRES TOO</text></g>
<g id="boys4"></g>
<g id="agr"><path class="s-gain" d="M1240 360l20 20 40-46" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1270" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">HAPPILY AGREED</text></g>
<g id="cd1"><rect class="s-line" x="120" y="690" width="600" height="90" rx="16" fill="var(--stage)" stroke-width="3"/><text class="d5" x="150" y="748" font-size="34"><tspan style="fill:var(--gain)">1.</tspan> Rake the leaves away</text></g>
<g id="cd2"><rect class="s-line" x="760" y="690" width="600" height="90" rx="16" fill="var(--stage)" stroke-width="3"/><text class="d5" x="790" y="748" font-size="34"><tspan style="fill:var(--gain)">2.</tspan> Cover it with dirt after</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="60">Same facts. New starting point.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie stood where the boys stood first.</text>
<g id="scale"><path class="s-ink" d="M490 300V640M400 640h180" stroke-width="8" stroke-linecap="round"/>
<g id="beam"><path class="s-ink" d="M250 300H730M250 300L150 420M250 300L350 420M730 300L630 420M730 300L830 420" fill="none" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M150 420Q250 470 350 420ZM630 420Q730 470 830 420Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<rect class="ink" x="188" y="362" width="124" height="56" rx="8"/><rect class="ink" x="668" y="362" width="124" height="56" rx="8"/>
<text class="m" x="250" y="398" font-size="22" text-anchor="middle" style="fill:var(--stage)">FACTS</text><text class="m" x="730" y="398" font-size="22" text-anchor="middle" style="fill:var(--stage)">FACTS</text>
<circle class="ink" cx="490" cy="300" r="12"/></g>
<text class="m" x="250" y="520" font-size="22" text-anchor="middle">ORDERS</text><text class="m" x="730" y="520" font-size="22" text-anchor="middle">QUESTIONS</text></g>
<g id="factt"><text class="d" x="120" y="760" font-size="40">Nothing about the facts changed.</text></g>
<path class="s-line" d="M880 662H1480" stroke-width="5" stroke-linecap="round"/>
<g id="room5"><g id="boys5"></g><rect class="s-ink" x="1060" y="300" width="240" height="420" fill="none" stroke-width="6"/><polygon id="door5" class="loss" points="1060,300 1300,300 1300,720 1060,720"/></g>
<g id="c5m"><g id="carn5"></g></g>
<g id="undt"><text class="m" x="1180" y="780" font-size="22" text-anchor="middle" style="fill:var(--gain)">THEY FELT UNDERSTOOD</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">In their shoes.</text>
<text class="b" x="120" y="176" font-size="32">You care most about your own life. So does everyone you meet.</text>
<g id="self"><circle class="s-gain" cx="300" cy="500" r="150" fill="none" stroke-width="6"/><text class="m" x="300" y="700" font-size="22" text-anchor="middle">YOU, TO YOU</text></g>
<g id="crowd"></g>
<g id="shoes"></g>
<g id="shoet"><text class="d5" x="1000" y="650" font-size="40">How would I feel</text><text class="d5" x="1000" y="705" font-size="40">in their shoes?</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The root of it all.</text>
<text class="b" x="120" y="176" font-size="32">One sincere habit beneath the whole book.</text>
<g id="pills"></g>
<path class="s-ink" d="M470 620V460" stroke-width="12" stroke-linecap="round"/>
<path class="s-line" d="M180 620H760" stroke-width="5" stroke-linecap="round"/>
<g id="roots"><path class="s-gain" d="M470 620Q440 690 330 740M470 620V770M470 620Q500 690 610 740" fill="none" stroke-width="8" stroke-linecap="round"/><text class="m" x="470" y="820" font-size="22" text-anchor="middle" style="fill:var(--gain)">SEEING THROUGH THEIR EYES</text></g>
<g id="quote"><rect class="s-line" x="900" y="240" width="580" height="320" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="940" y="290" font-size="20">CARNEGIE’S PRINCIPLE</text>
<text class="d5" x="940" y="360" font-size="36">“Try <tspan style="fill:var(--gain)">honestly</tspan> to see</text><text class="d5" x="940" y="415" font-size="36">things from the other</text><text class="d5" x="940" y="470" font-size="36">person’s point of view.”</text></g>
<g id="hrt"><g transform="translate(990 665)"><path id="heartP" class="gain" d="M0 30C-50 0-50-40-25-45C-10-48 0-38 0-30C0-38 10-48 25-45C50-40 50 0 0 30Z"/></g><text class="d" x="1060" y="676" font-size="32">Honestly matters.</text></g>
<g id="fake"><circle class="s-loss" cx="990" cy="770" r="26" fill="none" stroke-width="6"/><path class="s-loss" d="M972 752l36 36" stroke-width="6" stroke-linecap="round"/><text class="d" x="1060" y="782" font-size="32" style="fill:var(--loss)">Faked = manipulation.</text></g>
</g>

<g id="s8" opacity="0">
<g id="cal"><rect class="s-ink" x="1240" y="240" width="220" height="200" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="1243" y="243" width="214" height="48" rx="13"/><text class="m" x="1350" y="275" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">TOMORROW</text><g id="calp"></g></g>
<g id="ql"><text class="m" x="143" y="250" font-size="26">THINK OF ONE PERSON YOU’LL DEAL WITH TOMORROW</text></g>
<g id="qa"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">What do they want,</text></g>
<g id="qb"><text class="d" x="136" y="510" font-size="88" letter-spacing="-2">and why do they see</text></g>
<g id="qc"><text class="d" x="136" y="620" font-size="88" letter-spacing="-2">it <tspan style="fill:var(--gain)">their</tspan> way?</text></g>
<g id="qd"><text class="m" x="143" y="740" font-size="26">ASK BEFORE YOU SPEAK</text></g>
</g>