<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE SUBTLE ART OF NOT GIVING A F*CK · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Choose your problems,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a problem-free life.</text>
<text class="b" x="120" y="600" font-size="32">Happiness isn’t a problem-free life. It’s choosing better problems.</text>
<rect class="s-loss" x="1150" y="700" width="80" height="80" rx="8" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="1190" y="758" font-size="44" text-anchor="middle" style="fill:var(--loss)">!</text>
<rect class="s-loss" x="1250" y="640" width="90" height="140" rx="8" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="1295" y="730" font-size="44" text-anchor="middle" style="fill:var(--loss)">!</text>
<rect id="tb3" x="1360" y="560" width="100" height="220" rx="8" stroke-width="6"/>
<g id="thop"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Problems never end.</text>
<text class="b" x="120" y="176" font-size="32">Solve one, and another takes its place.</text>
<g id="pA"><rect class="s-loss" x="140" y="420" width="140" height="140" rx="12" fill="var(--stage)" stroke-width="7"/><text class="d" x="210" y="516" font-size="72" text-anchor="middle" style="fill:var(--loss)">!</text><text class="m" x="210" y="600" font-size="20" text-anchor="middle">PROBLEM</text></g>
<g id="pB"><path class="s-muted" d="M300 520L400 620M372 618L400 620L398 592" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-loss" x="420" y="560" width="140" height="140" rx="12" fill="var(--stage)" stroke-width="7"/><text class="d" x="490" y="656" font-size="72" text-anchor="middle" style="fill:var(--loss)">!</text><text class="m" x="490" y="740" font-size="20" text-anchor="middle">SWAPPED</text></g>
<g id="pC"><path class="s-muted" d="M300 460L400 360M372 362L400 360L398 388" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-loss" x="420" y="210" width="200" height="200" rx="14" fill="var(--stage)" stroke-width="8"/><text class="d" x="520" y="350" font-size="110" text-anchor="middle" style="fill:var(--loss)">!!</text><text class="m" x="520" y="444" font-size="20" text-anchor="middle">UPGRADED</text></g>
<g id="lad"><path class="s-ink" d="M1000 700V220M1200 700V220" stroke-width="8" stroke-linecap="round"/><g id="rungs"></g><g id="clb"></g><text class="m" x="1100" y="740" font-size="20" text-anchor="middle">A FRESH CHALLENGE ON EVERY RUNG</text></g>
<g id="l1n"><text class="d" x="120" y="800" font-size="40">That’s not bad news. It’s just how life works.</text></g>
<g id="l1w"><text class="m" x="120" y="846" font-size="22" style="fill:var(--loss)">WAITING FOR NOTHING TO GO WRONG MEANS WAITING FOREVER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The gym example.</text>
<text class="b" x="120" y="176" font-size="32">One of Manson’s own examples.</text>
<g id="gP"><g id="gFig"></g><text class="m" x="250" y="580" font-size="20" text-anchor="middle">HEALTH PROBLEM</text></g>
<g id="gC"><path class="s-muted" d="M330 415h80M396 401l14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="440" y="325" width="280" height="180" rx="16" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M510 415h140" stroke-width="10"/><rect class="ink" x="496" y="385" width="18" height="60" rx="4"/><rect class="ink" x="646" y="385" width="18" height="60" rx="4"/>
<text class="m" x="580" y="545" font-size="20" text-anchor="middle">GYM MEMBERSHIP</text>
<path class="s-muted" d="M730 415h80" stroke-width="6" stroke-linecap="round"/></g>
<g id="b1"><path class="s-muted" d="M810 415V285h50" fill="none" stroke-width="5"/><rect class="s-loss" x="860" y="230" width="600" height="110" rx="14" fill="var(--stage)" stroke-width="5"/>
<g id="alm"><circle class="s-ink" cx="920" cy="290" r="30" fill="none" stroke-width="6"/><path class="s-ink" d="M920 290v-17M920 290h13" stroke-width="5" stroke-linecap="round"/><circle class="ink" cx="896" cy="262" r="10"/><circle class="ink" cx="944" cy="262" r="10"/></g>
<text class="m" x="990" y="294" font-size="26">WAKE UP EARLY</text></g>
<g id="b2"><path class="s-muted" d="M810 415h50" stroke-width="5"/><rect class="s-loss" x="860" y="360" width="600" height="110" rx="14" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M885 445h70l14-50" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path id="belt" class="s-ink" d="M888 456h64" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="990" y="424" font-size="26">SWEAT ON A MACHINE</text></g>
<g id="b3"><path class="s-muted" d="M810 415V545h50" fill="none" stroke-width="5"/><rect class="s-loss" x="860" y="490" width="600" height="110" rx="14" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M895 515h44v14M907 548v14M922 548v20M937 548v14" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="990" y="554" font-size="26">SHOWER, RUSH TO WORK</text></g>
<g id="gN"><text class="m" x="860" y="650" font-size="22" style="fill:var(--loss)">OLD PROBLEM → NEW PROBLEMS</text></g>
<g id="gProg"><text class="d" x="120" y="790" font-size="48">That’s not failure. That’s progress.</text><rect class="gain" x="124" y="814" width="160" height="10"/></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where happiness comes from.</text>
<g id="hF"><circle class="gain" cx="330" cy="500" r="120"/><circle cx="290" cy="465" r="12" fill="var(--on-gain)"/><circle cx="370" cy="465" r="12" fill="var(--on-gain)"/><path id="smile" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round"/></g>
<g id="hQ"><rect class="gain" x="560" y="230" width="920" height="110" rx="20"/><text class="d5" x="590" y="300" font-size="40" style="fill:var(--on-gain)">“Happiness comes from solving problems.”</text><text class="m" x="1480" y="374" font-size="20" text-anchor="end">MARK MANSON</text></g>
<g id="hP"><rect class="s-ink" x="640" y="420" width="140" height="140" rx="12" fill="var(--line)" stroke-width="5"/><rect class="s-ink" x="790" y="420" width="140" height="140" rx="12" fill="var(--line)" stroke-width="5"/><rect class="s-ink" x="640" y="570" width="140" height="140" rx="12" fill="var(--line)" stroke-width="5"/>
<rect class="s-muted" x="790" y="570" width="140" height="140" rx="12" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<rect id="pc4" class="gain" x="790" y="570" width="140" height="140" rx="12"/>
<path id="hC" class="s-gain" d="M1080 560l60 60 120-140" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="270"/></g>
<g id="hS"><text class="d" x="120" y="790" font-size="42">The good feeling lives in the solving,</text><text class="b" x="120" y="840" font-size="32">not in having nothing to solve.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask a better question.</text>
<g id="qL"><g id="qM"><rect class="s-line" x="120" y="220" width="620" height="490" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d" x="146" y="480" font-size="220" style="fill:var(--muted)">?</text></g>
<g id="qQ"><text class="d5" x="320" y="340" font-size="44">What do you want</text><text class="d5" x="320" y="394" font-size="44">to enjoy?</text></g>
<g id="qI"><path class="ink" d="M195 540l20-34h80l20 34z"/><rect class="ink" x="160" y="540" width="170" height="50" rx="14"/><circle class="s-ink" cx="200" cy="595" r="18" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="290" cy="595" r="18" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M420 570h120" stroke-width="10"/><rect class="ink" x="410" y="545" width="16" height="50" rx="4"/><rect class="ink" x="534" y="545" width="16" height="50" rx="4"/>
<path class="ink" d="M650 610C600 580 600 535 625 532C640 530 648 542 650 550C652 542 660 530 675 532C700 535 700 580 650 610Z"/>
<text class="m" x="160" y="680" font-size="20" style="fill:var(--muted)">EVERYONE WANTS THE SAME THINGS</text></g></g>
<g id="qS"><path class="s-ink" d="M1150 300V620" stroke-width="8"/><rect class="ink" x="1070" y="620" width="160" height="16" rx="6"/>
<line id="beam" class="s-ink" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1150" cy="300" r="12"/>
<g id="panL"><path class="s-ink" d="M0 0L-50 90M0 0L50 90" fill="none" stroke-width="3"/><path class="s-ink" d="M-75 90h150a75 28 0 0 1-150 0z" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="0" cy="66" r="22"/><text class="m" x="0" y="160" font-size="20" text-anchor="middle">THE REWARD</text></g>
<g id="panR"><path class="s-ink" d="M0 0L-50 90M0 0L50 90" fill="none" stroke-width="3"/><path class="s-ink" d="M-75 90h150a75 28 0 0 1-150 0z" fill="var(--stage)" stroke-width="5"/><rect class="loss" x="-32" y="34" width="64" height="56" rx="6"/><text class="m" x="0" y="160" font-size="20" text-anchor="middle" style="fill:var(--loss)">THE PAIN</text></g></g>
<g id="qT"><text class="d" x="820" y="740" font-size="48" style="fill:var(--gain)">What pain do you want?</text></g>
<g id="qT2"><text class="b" x="820" y="796" font-size="32">What struggle will you keep going with?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The rock star dream.</text>
<text class="b" x="120" y="176" font-size="32">Manson, as a teenager.</text>
<rect class="s-line" x="120" y="230" width="640" height="450" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="230" width="640" height="450" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="276" font-size="22">THE DREAM</text><text class="m" x="870" y="276" font-size="22">THE PRACTICE</text>
<g id="rC"><polygon class="gain" points="440,300 370,540 510,540" fill-opacity=".25"/><g id="crowdW"></g></g>
<g id="rG"><rect class="ink" x="160" y="540" width="560" height="18" rx="4"/><g id="rFig"></g><g id="gtrD"></g></g>
<g id="rE"><path class="s-line" d="M880 600h560" stroke-width="4"/><g id="gtrP"></g>
<text class="m" x="1110" y="350" font-size="20">PRACTICE LOG</text><g id="pl"></g><text class="m" x="1110" y="470" font-size="20" style="fill:var(--loss)">EMPTY FOR YEARS</text></g>
<g id="rL"><text class="m" x="140" y="730" font-size="26" style="fill:var(--gain)">LOVED THE RESULT</text><text class="m" x="860" y="730" font-size="26" style="fill:var(--loss)">NOT THE PROCESS</text></g>
<g id="rV"><text class="d" x="120" y="820" font-size="46">He wanted the victory without the fight.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="60">What you’ll struggle for defines you.</text>
<g id="mG"><text class="m" x="120" y="300" font-size="22">PEOPLE WHO GET SOMEWHERE</text><text class="d5" x="120" y="360" font-size="40">choose the daily grind</text><text class="d5" x="120" y="410" font-size="40">and find it worth it.</text>
<polygon class="s-ink" points="640,760 1040,240 1440,760" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<g id="flg"><path class="s-ink" d="M1040 240V160" stroke-width="5"/><polygon class="gain" points="1040,160 1092,176 1040,192"/></g>
<polyline id="mpath" class="s-muted" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<polyline id="trail" class="s-gain" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="clm"></g><text class="m" x="1140" y="700" font-size="20">THE DAILY GRIND</text></g>
<g id="cL"><text class="m" x="120" y="540" font-size="22" style="fill:var(--gain)">A CLIMBER LOVES THE CLIMB</text><text class="d5" x="120" y="600" font-size="40">not just the view.</text></g>
<g id="mD"><text class="d" x="120" y="840" font-size="44">Who you are is what you’re willing to struggle for.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try the Tuesday test.</text>
<g id="nB"><rect class="s-ink" x="120" y="230" width="340" height="330" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rings"></g>
<text class="m" x="150" y="300" font-size="22">ONE GOAL</text><polygon id="star" class="gain"/><path class="s-line" d="M150 520h280" stroke-width="5" stroke-linecap="round"/></g>
<g id="cA"><g id="days"></g><path class="s-gain" d="M734 320V360" stroke-width="5"/><rect class="s-gain" x="540" y="360" width="940" height="200" rx="16" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="570" y="404" font-size="22">AN ORDINARY TUESDAY</text></g>
<g id="bG"></g>
<g id="bB"><text class="m" x="1450" y="404" font-size="20" text-anchor="end">THE BORING PARTS TOO</text></g>
<g id="oY"><rect class="gain" x="120" y="620" width="660" height="200" rx="18"/><text class="d" x="150" y="700" font-size="38" style="fill:var(--on-gain)">Love the everyday struggle?</text><text class="d5" x="150" y="760" font-size="34" style="fill:var(--on-gain)">Keep going.</text></g>
<g id="oN"><rect class="s-loss" x="820" y="620" width="660" height="200" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="850" y="700" font-size="38">Only the finish line?</text><text class="d5" x="850" y="760" font-size="34" style="fill:var(--loss)">Choose a different goal.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q1"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What problem would you</text></g>
<g id="q2"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">happily solve <tspan style="fill:var(--gain)">every day</tspan>,</text></g>
<g id="q3"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">even without applause?</text></g>
<g id="q4"><text class="m" x="143" y="640" font-size="26">START CHOOSING THAT ONE</text></g>
<g id="spt"><polygon id="cone" class="gain" points="1285,596 1315,596 1420,812 1180,812"/><ellipse class="gain" cx="1300" cy="816" rx="130" ry="20" fill-opacity=".5"/><rect class="ink" x="1275" y="562" width="50" height="36" rx="6"/><g id="sFig"></g></g>
</g>