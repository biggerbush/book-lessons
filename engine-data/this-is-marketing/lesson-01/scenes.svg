<text class="m" x="1180" y="760" font-size="22" text-anchor="middle" style="fill:var(--gain)">WHO THEY HOPE TO BECOME</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not hype. Not tricks.</text>
<text class="b" x="120" y="176" font-size="32">Spam and tricks are not the point.</text>
<g id="spam"><g id="envs"></g><text class="m" x="300" y="620" font-size="20" text-anchor="middle">HYPE · SPAM · TRICKS</text></g>
