<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINKING, FAST AND SLOW · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why we trust</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">our gut too much.</text>
<text class="b" x="120" y="600" font-size="32">Why feeling certain and being right are not the same.</text>
<g id="t_fig"></g>
<g id="t_badge"><circle id="t_bc" class="gain" cx="1290" cy="470" r="34"/><path d="M1274 470l12 12 20-24" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="t_bub"><rect x="1170" y="140" width="240" height="86" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M1272 226l10 24 14-24" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1290" y="198" font-size="44" text-anchor="middle">SURE!</text></g>
<g id="t_q"><text class="d" x="1420" y="500" font-size="110" style="fill:var(--loss)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stories feel true.</text>
<text class="b" x="120" y="176" font-size="32">Your fast mind loves a neat story.</text>
<g id="st_cards"></g>
<path id="st_link" class="s-gain" d="M270 335h15M435 335h15M600 335h15" stroke-width="8"/>
<g id="st_chk"><path class="s-gain" d="M330 510l60 60 120-140" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="440" y="660" font-size="22" text-anchor="middle">IT FEELS TRUE</text></g>
<g id="st_bars">
<text class="m" x="900" y="330" font-size="20">HOW TIDY THE STORY IS</text>
<rect x="900" y="350" width="560" height="48" rx="24" fill="var(--line)"/><rect id="st_b1" class="gain" x="900" y="350" width="48" height="48" rx="24"/>
<text class="m" x="900" y="480" font-size="20">HOW GOOD THE EVIDENCE IS</text>
<rect x="900" y="500" width="560" height="48" rx="24" fill="var(--line)"/><rect id="st_b2" class="loss" x="900" y="500" width="48" height="48" rx="24"/>
<text class="d5" x="900" y="640" font-size="32">Confidence follows the top one.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The log over the wall.</text>
<text class="b" x="120" y="176" font-size="32">Israeli army: picking future officers in a field exercise.</text>
<path class="s-line" d="M120 720H1040" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="300" y="440" width="80" height="280"/>
<path d="M300 510h80M300 580h80M300 650h80M340 440v70M320 510v70M360 510v70M340 580v70M320 650v70M360 650v70" stroke="var(--stage)" stroke-width="4"/>
<text class="m" x="340" y="760" font-size="20" text-anchor="middle">TALL WALL</text>
<g id="sd_men"></g>
<line id="sd_log" stroke="var(--muted)" stroke-width="22" stroke-linecap="round"/>
<g id="sd_rule"><text class="m" x="120" y="820" font-size="20">THE LOG MAY NOT TOUCH THE WALL OR THE GROUND</text></g>
<g id="sd_note">
<rect x="1080" y="240" width="400" height="460" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<rect class="ink" x="1220" y="224" width="120" height="32" rx="8"/>
<text class="m" x="1110" y="310" font-size="20">OBSERVER NOTES</text>
<text class="m" x="1110" y="380" font-size="20" style="fill:var(--gain)">SOLDIER 2 · LED</text>
<text class="m" x="1110" y="440" font-size="20" style="fill:var(--loss)">SOLDIER 4 · GAVE UP</text>
<g id="sd_stamp"><g transform="rotate(-4 1280 580)"><rect class="gain" x="1110" y="540" width="340" height="80" rx="12"/><text class="d" x="1280" y="592" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">FUTURE OFFICER</text></g></g>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then the feedback came.</text>
<text class="b" x="120" y="176" font-size="32">Months later: reports from officer training.</text>
<g id="fb_card">
<rect x="120" y="230" width="420" height="440" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<text class="m" x="150" y="280" font-size="20">OFFICER TRAINING</text>
<text class="m" x="300" y="330" font-size="18" text-anchor="middle" style="fill:var(--gain)">PREDICTED</text>
<text class="m" x="440" y="330" font-size="18" text-anchor="middle">ACTUAL</text>
<g id="fb_rows"></g>
</g>
<g id="fb_coin">
<ellipse class="s-line" cx="830" cy="548" rx="80" ry="10" fill="none" stroke-width="4"/>
<g id="fb_cg">
<circle class="s-ink" cx="0" cy="0" r="100" fill="var(--stage)" stroke-width="8"/>
<circle class="s-line" cx="0" cy="0" r="74" fill="none" stroke-width="5"/>
<text id="fb_cl" class="d" x="0" y="34" font-size="96" text-anchor="middle">H</text>
</g>
<text class="m" x="830" y="600" font-size="22" text-anchor="middle">LITTLE BETTER THAN</text>
<text class="d" x="830" y="656" font-size="44" text-anchor="middle">a blind guess</text>
</g>
<g id="fb_next">
<text class="m" x="1080" y="260" font-size="20">NEXT GROUP</text>
<g id="fb_ppl"></g>
<text class="m" x="1080" y="480" font-size="20">CONFIDENCE</text>
<rect x="1080" y="500" width="400" height="44" rx="22" fill="var(--line)"/><rect id="fb_cf" class="gain" x="1080" y="500" width="44" height="44" rx="22"/>
<text class="d5" x="1080" y="610" font-size="30">Just as sure as before.</text>
</g>
<g id="fb_ill"><text class="d" x="120" y="790" font-size="64">The illusion of validity.</text><rect class="gain" x="124" y="816" width="200" height="10"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plans go wrong too.</text>
<text class="b" x="120" y="176" font-size="32">Kahneman’s team writes a school textbook on judgment.</text>
<g id="pl_book">
<rect x="120" y="250" width="300" height="350" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<rect class="ink" x="120" y="250" width="44" height="350"/>
<text class="m" x="292" y="340" font-size="22" text-anchor="middle">JUDGMENT</text>
<path class="s-line" d="M200 400h180M200 440h180M200 480h130" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="270" y="650" font-size="20" text-anchor="middle">SCHOOL TEXTBOOK</text>
</g>
<g id="pl_cal">
<rect x="520" y="250" width="380" height="350" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<rect class="gain" x="523" y="253" width="374" height="57" rx="11"/>
<rect class="ink" x="600" y="230" width="14" height="44" rx="7"/><rect class="ink" x="806" y="230" width="14" height="44" rx="7"/>
<g id="pl_grid"></g>
<text class="d" x="710" y="680" font-size="52" text-anchor="middle">About 2 years</text>
<text class="m" x="710" y="730" font-size="20" text-anchor="middle">EVERYONE’S GUESS</text>
</g>
<g id="pl_exp">
<g id="pl_ep"></g>
<rect x="1040" y="220" width="400" height="110" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<path d="M1222 330l18 26 14-26" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1240" y="268" font-size="22" text-anchor="middle">HOW DID SIMILAR</text>
<text class="m" x="1240" y="302" font-size="22" text-anchor="middle">PROJECTS GO?</text>
<text class="m" x="1240" y="630" font-size="20" text-anchor="middle">CURRICULUM EXPERT</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The outside view.</text>
<text class="b" x="120" y="176" font-size="32">How similar teams actually did.</text>
<g id="ov_ppl"></g>
<g id="ov_x"></g>
<g id="ov_a"><path class="s-loss" d="M135 410v16h340v-16" fill="none" stroke-width="5"/><text id="ov_40" class="d" x="305" y="510" font-size="72" text-anchor="middle" style="fill:var(--loss)">40%</text><text class="m" x="305" y="550" font-size="20" text-anchor="middle">NEVER FINISHED</text></g>
<g id="ov_b"><path class="s-gain" d="M490 410v16h525v-16" fill="none" stroke-width="5"/><circle class="s-ink" cx="590" cy="500" r="36" fill="var(--stage)" stroke-width="6"/><path id="ov_h" class="s-ink" stroke-width="5" stroke-linecap="round"/><text class="d" x="650" y="520" font-size="56">7–10 years</text><text class="m" x="650" y="560" font-size="20">THE REST</text></g>
<g id="ov_c"><text class="d5" x="120" y="760" font-size="34">He hadn’t thought of it until asked. The team carried on.</text></g>
<g id="ov_d">
<rect x="1180" y="240" width="260" height="220" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="1180" y="240" width="36" height="220"/>
<g transform="rotate(-8 1310 352)"><rect x="1180" y="320" width="260" height="64" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="m" x="1310" y="362" font-size="24" text-anchor="middle" style="fill:var(--loss)">NEVER USED</text></g>
<text id="ov_8" class="d" x="1310" y="590" font-size="80" text-anchor="middle">8 years</text>
<text class="m" x="1310" y="635" font-size="20" text-anchor="middle">TO WRITE IT</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The planning fallacy.</text>
<text class="b" x="120" y="176" font-size="32">Plans built on the best case, imagined from the inside.</text>
<g id="pf_ol"><text class="m" x="260" y="380" font-size="20">OUTSIDE VIEW · SIMILAR PROJECTS</text></g>
<g id="pf_bars"></g>
<path class="s-ink" d="M120 700H1420" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1420" y="740" font-size="20" text-anchor="end">TIME</text>
<g id="pf_best"><path class="s-loss" d="M160 700V470" stroke-width="6" stroke-linecap="round"/><path class="loss" d="M160 470h70l-16 22 16 22h-70z"/><text class="m" x="150" y="420" font-size="20" style="fill:var(--loss)">INSIDE VIEW</text><text class="m" x="150" y="450" font-size="20" style="fill:var(--loss)">BEST CASE</text></g>
<g id="pf_typ"><path class="s-gain" d="M677 700V440" stroke-width="5" stroke-dasharray="10 8"/><text class="m" x="677" y="425" font-size="20" text-anchor="middle" style="fill:var(--gain)">TYPICAL</text></g>
<circle id="pf_you" class="gain" cx="677" cy="700" r="16"/>
<g id="pf_adj"><path class="s-gain" d="M690 730h70m-12-10 12 10-12 10" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="677" y="790" font-size="20">START FROM THE TYPICAL OUTCOME, THEN ADJUST FOR YOURS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trust, but check.</text>
<text class="b" x="120" y="176" font-size="32">Confidence is a feeling, not a fact.</text>
<g id="tc_th">
<rect x="230" y="240" width="60" height="400" rx="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<rect id="tc_m" class="gain" x="246" y="640" width="28" height="30" rx="14"/>
<circle class="gain" cx="260" cy="660" r="46"/>
<path class="s-line" d="M300 300h20M300 380h20M300 460h20M300 540h20" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="260" y="750" font-size="20" text-anchor="middle">CONFIDENCE</text>
<text class="m" x="260" y="780" font-size="20" text-anchor="middle" style="fill:var(--gain)">A FEELING</text>
</g>
<g id="tc_card">
<rect x="420" y="240" width="540" height="400" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/>
<text class="m" x="450" y="295" font-size="20">BEFORE A BIG PREDICTION</text>
<text class="d5" x="450" y="370" font-size="34">Do I have real feedback</text>
<text class="d5" x="450" y="415" font-size="34">that I’m good at this?</text>
<rect x="450" y="480" width="48" height="48" rx="8" fill="none" stroke="var(--ink)" stroke-width="5"/><text class="m" x="514" y="514" font-size="22">YES</text>
<rect x="640" y="480" width="48" height="48" rx="8" fill="none" stroke="var(--ink)" stroke-width="5"/><text class="m" x="704" y="514" font-size="22">NO</text>
<path id="tc_no" class="s-loss" d="M652 504l12 12 22-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="tc_mir">
<g id="tc_p"></g>
<ellipse class="s-ink" cx="1350" cy="450" rx="100" ry="160" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1350 610v90M1290 700h120" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="tc_ref"><path class="ink" d="M1350 430c-20-14-50-14-70-6v80c20-8 50-8 70 6 20-14 50-14 70-6v-80c-20-8-50-8-70 6z"/><path d="M1350 430v80" stroke="var(--stage)" stroke-width="4"/><text class="m" x="1350" y="560" font-size="20" text-anchor="middle">STORY</text><text class="m" x="1350" y="760" font-size="20" text-anchor="middle" style="fill:var(--loss)">A STORY, NOT A FACT</text></g>
</g>

<g id="s8" opacity="0">
<g id="cq_a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">How long did your last</text></g>
<g id="cq_b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">three similar projects</text></g>
<g id="cq_c"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">actually</tspan> take you?</text></g>
<g id="cq_l"><text class="m" x="143" y="700" font-size="26">PICK ONE PLAN YOU ARE MAKING THIS WEEK</text></g>
<g id="cq_g">
<polygon id="cq_top" class="gain"/><polygon id="cq_bot" class="gain"/>
<path class="s-ink" d="M1320 560h140M1320 780h140M1335 560c0 70 55 80 55 110s-55 40-55 110M1445 560c0 70-55 80-55 110s55 40 55 110" fill="none" stroke-width="7" stroke-linecap="round"/>
</g>
