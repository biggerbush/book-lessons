<g id="car">
<path class="s-ink" d="M50 0l34-48h96l34 48z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="ink" cx="112" cy="-20" r="13"/><circle class="ink" cx="160" cy="-20" r="13"/>
<rect class="s-ink" x="0" y="0" width="264" height="62" rx="18" fill="var(--stage)" stroke-width="6"/>
<circle class="ink" cx="60" cy="64" r="22"/><circle class="ink" cx="204" cy="64" r="22"/>
</g>
<g id="hearts">
<path class="gain" d="M380 438c-34-22-34-50-12-54 6-1 10 2 12 8 2-6 6-9 12-8 22 4 22 32-12 54z"/>
<path class="gain" d="M460 398c-34-22-34-50-12-54 6-1 10 2 12 8 2-6 6-9 12-8 22 4 22 32-12 54z"/>
<path class="gain" d="M540 448c-34-22-34-50-12-54 6-1 10 2 12 8 2-6 6-9 12-8 22 4 22 32-12 54z"/>
</g>
<g id="pb"><text class="m" x="1480" y="300" font-size="22" text-anchor="end">LIKE A PICTURE BOOK</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Twenty minutes later.</text>
<text class="b" x="120" y="176" font-size="32">The charm wore off.</text>
<g id="clk">
<circle class="s-ink" cx="300" cy="460" r="150" fill="var(--stage)" stroke-width="8"/>
<path id="wedge" class="gain" fill-opacity=".5"/>
<g id="ticks"></g>
<line id="hand" class="s-ink" x1="300" y1="460" x2="300" y2="350" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="300" cy="460" r="10"/>
<text class="m" x="300" y="660" font-size="22" text-anchor="middle">ABOUT 20 MINUTES</text>
</g>
<g id="nob"><text class="m" x="300" y="725" font-size="20" text-anchor="middle">NOBODY LOOKS OUT THE WINDOW</text></g>
<g id="grid"></g>
<g id="bor"><text class="d" x="120" y="820" font-size="46">Even a beautiful cow had become boring.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then: a purple cow.</text>
<text class="b" x="120" y="176" font-size="32">Same field, same fence, but one cow changes everything.</text>
<rect class="s-ink" x="120" y="240" width="400" height="360" rx="36" fill="var(--ice)" stroke-width="8"/>
<g id="faces"></g>
<path class="s-line" d="M720 700H1480" stroke-width="5"/>
<g id="c3"></g>
<g id="rays"></g>
<g id="p3"></g>
<g id="fence"></g>
<circle id="flash" cx="215" cy="725" r="60" fill="none" class="s-gain" stroke-width="6"/>
<g id="phone">
<rect class="s-ink" x="160" y="630" width="110" height="190" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect x="175" y="655" width="80" height="130" rx="6" fill="var(--ice)"/>
<circle class="loss" cx="215" cy="720" r="20"/>
</g>
<g id="frnd"><path class="s-gain" d="M290 740h30" stroke-width="5" stroke-dasharray="6 6"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Good becomes invisible.</text>
<text class="b" x="120" y="176" font-size="32">Attention filters out what looks like what we’ve already seen.</text>
<path class="s-ink" d="M160 400q100-90 200 0q-100 90-200 0z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="ink" cx="260" cy="400" r="34"/><circle cx="272" cy="390" r="9" fill="var(--stage)"/>
<text class="m" x="260" y="510" font-size="26" text-anchor="middle">YOU</text>
<g id="flt">
<rect class="s-ink" x="580" y="260" width="40" height="320" fill="none" stroke-width="6"/>
<g id="hatch"></g>
<text class="m" x="600" y="630" font-size="24" text-anchor="middle">ATTENTION FILTER</text>
</g>
<g id="dots"></g>
<g id="row"></g>
<g id="inv"><text class="d" x="120" y="800" font-size="52">Being good does not mean being noticed.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most products are brown cows.</text>
<text class="b" x="120" y="176" font-size="32">Each one is fine. None of them stands out.</text>
<g id="shelfb"><rect class="ink" x="160" y="480" width="1280" height="12"/><rect class="ink" x="160" y="720" width="1280" height="12"/></g>
<g id="boxes"></g>
<path id="trail" class="s-muted" stroke-width="4" stroke-dasharray="8 10" fill="none"/>
<g id="eye2"><path class="s-ink" d="M-40 0q40-36 80 0q-40 36-80 0z" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="8" cy="0" r="12"/></g>
<g id="slide"><text class="m" x="120" y="852" font-size="20">YOUR EYES SLIDE RIGHT PAST, LIKE THE FRENCH COWS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Different grabs attention.</text>
<text class="b" x="120" y="176" font-size="32">Its difference is part of the thing itself.</text>
<g id="mega">
<path class="s-ink" d="M160 320h50l150-70v220l-150-70h-50z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M385 300q30 60 0 120M405 275q40 85 0 170" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="260" y="556" font-size="26" text-anchor="middle">LOUDER?</text>
</g>
<line id="xm" class="s-loss" x1="150" y1="240" x2="150" y2="240" stroke-width="10" stroke-linecap="round"/>
<polygon id="beam" class="gain" points="1010,210 1050,210 1160,560 900,560" fill-opacity=".25"/>
<g id="c6"></g>
<g id="p6"></g>
<g id="st1"><text class="d" x="120" y="700" font-size="56" style="fill:var(--gain)">Different stops people.</text></g>
<g id="st2"><text class="d5" x="120" y="780" font-size="44" style="fill:var(--muted)">Familiar lets them keep walking.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spot your brown cows.</text>
<text class="b" x="120" y="176" font-size="32">Something to try today.</text>
<g id="nb">
<rect class="s-ink" x="120" y="240" width="440" height="500" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="spir"></g>
<rect class="s-ink" x="160" y="358" width="24" height="24" rx="4" fill="none" stroke-width="4"/>
<rect class="s-ink" x="160" y="458" width="24" height="24" rx="4" fill="none" stroke-width="4"/>
<rect class="s-ink" x="160" y="558" width="24" height="24" rx="4" fill="none" stroke-width="4"/>
<text class="m" x="200" y="380" font-size="24">A PRODUCT</text>
<text class="m" x="200" y="480" font-size="24">A SERVICE</text>
<text class="m" x="200" y="580" font-size="24">A PRESENTATION</text>
</g>
<g id="pick">
