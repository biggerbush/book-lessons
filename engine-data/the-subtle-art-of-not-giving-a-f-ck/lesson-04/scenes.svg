</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fired from the band.</text>
<text class="b" x="120" y="176" font-size="32">A young guitarist named Dave Mustaine, Metallica, early 1980s.</text>
