<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of success advice.</text>
<text class="b" x="120" y="176" font-size="32">Covey read about 200 years of American writing on success.</text>
<g id="shelf"></g>
<path class="s-ink" d="M120 522H1480" stroke-width="8" stroke-linecap="round"/>
<g id="tl"><path class="s-muted" d="M140 570H1436M140 556v28M1112 556v28M1436 556v28" stroke-width="3"/>
<text class="m" x="140" y="612" font-size="20">200 YEARS AGO</text><text class="m" x="788" y="612" font-size="20" text-anchor="middle">ABOUT 200 YEARS OF SUCCESS WRITING</text><text class="m" x="1436" y="612" font-size="20" text-anchor="end">TODAY</text></g>
<g id="ch1"><text class="m" x="140" y="676" font-size="22" style="fill:var(--gain)">CHARACTER</text><text class="d5" x="140" y="722" font-size="34">Honesty, patience, courage</text></g>
<g id="pe1"><text class="m" x="1436" y="676" font-size="22" text-anchor="end" style="fill:var(--loss)">PERSONALITY</text><text class="d5" x="1436" y="722" font-size="34" text-anchor="end">Image, charm, techniques</text></g>
<g id="last1"><text class="d" x="120" y="826" font-size="46">Techniques without character don’t last.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The wrong map.</text>
<text class="b" x="120" y="176" font-size="32">Effort and positive thinking can’t fix a wrong map.</text>
<g id="map"><rect class="s-ink" x="120" y="230" width="600" height="520" rx="10" fill="var(--stage)" stroke-width="6"/><g id="grid"></g><path class="s-line" d="M320 320v430M520 320v430" stroke-width="2" stroke-dasharray="6 8"/><text class="d" x="150" y="300" font-size="44">CHICAGO</text><line id="strk" class="s-loss" x1="146" y1="286" x2="146" y2="286" stroke-width="7" stroke-linecap="round"/></g>
<g id="stamp"><g transform="rotate(-8 420 520)"><rect x="270" y="470" width="300" height="100" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="7"/><text class="d" x="420" y="541" font-size="56" text-anchor="middle" style="fill:var(--loss)">DETROIT</text></g></g>
<g id="row1"><text class="m" x="800" y="290" font-size="22">TRY HARDER</text><text class="m" x="1480" y="290" font-size="22" text-anchor="end" style="fill:var(--loss)">LOST FASTER</text><ellipse class="s-line" cx="1140" cy="390" rx="240" ry="50" fill="none" stroke-width="4" stroke-dasharray="10 10"/><circle id="rnr" class="gain" r="18"/></g>
<g id="row2"><text class="m" x="800" y="520" font-size="22">THINK POSITIVELY</text><text class="m" x="1480" y="520" font-size="22" text-anchor="end" style="fill:var(--loss)">STILL LOST</text><circle class="gain" cx="900" cy="620" r="50"/><circle class="ink" cx="884" cy="606" r="6"/><circle class="ink" cx="916" cy="606" r="6"/><path class="s-ink" d="M878 632q22 20 44 0" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="1010" y="650" font-size="72" style="fill:var(--loss)">? ? ?</text></g>
<g id="para"><text class="d" x="120" y="830" font-size="46">Covey calls these mental maps <tspan style="fill:var(--gain)">paradigms</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A noisy Sunday subway.</text>
<text class="b" x="120" y="176" font-size="32">A quiet Sunday morning on a New York subway.</text>
