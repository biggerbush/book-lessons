<g id="coll"><text class="m" x="120" y="800" font-size="20">THE MORE PUZZLES YOU SOLVE, THE BIGGER YOUR COLLECTION</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The issue log.</text>
<text class="b" x="120" y="176" font-size="32">Bridgewater’s tool: record what went wrong, and why.</text>
