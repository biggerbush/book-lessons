<g id="pad"><rect class="s-ink" x="1000" y="280" width="220" height="300" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1000 312h220" stroke-width="5"/><g id="pw"></g><text class="m" x="1110" y="555" font-size="20" text-anchor="middle">3 WORDS</text></g>
<g id="alm"><circle class="ink" cx="1300" cy="345" r="22"/><circle class="ink" cx="1420" cy="345" r="22"/><path class="s-ink" d="M1310 490l-20 26M1410 490l20 26" stroke-width="7" stroke-linecap="round"/><circle class="s-ink" cx="1360" cy="420" r="80" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M1360 420h28" stroke-width="7" stroke-linecap="round"/><line id="mh2" class="s-gain" x1="1360" y1="420" x2="1360" y2="364" stroke-width="6" stroke-linecap="round"/><text id="mins" class="m" x="1360" y="555" font-size="22" text-anchor="middle">0 MIN</text></g>
<g id="still"><g id="ck3"></g><text class="d" x="210" y="722" font-size="56">Still want the cookie?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The real craving.</text>
<text class="b" x="120" y="176" font-size="32">He walked to a friend’s desk and talked for a while.</text>
<g id="pals"><g id="palf"></g><rect class="s-line" x="200" y="600" width="360" height="18" rx="9" fill="var(--line)"/><rect id="tbar" class="gain" x="200" y="600" width="0" height="18" rx="9"/><text id="tmin" class="m" x="200" y="660" font-size="22">0 MIN</text></g>
<g id="talk"><rect class="s-ink" x="190" y="236" width="120" height="60" rx="30" fill="var(--stage)" stroke-width="4"/><rect class="s-ink" x="420" y="236" width="120" height="60" rx="30" fill="var(--stage)" stroke-width="4"/><path class="s-ink" d="M230 266h0M250 266h0M270 266h0M460 266h0M480 266h0M500 266h0" stroke-width="9" stroke-linecap="round"/></g>
<g id="ckw"><g id="ck4"></g><text class="m" x="850" y="580" font-size="22" text-anchor="middle">THE URGE</text></g>
<g id="xx"><path class="s-loss" d="M780 360l140 140M920 360l-140 140" stroke-width="12" stroke-linecap="round"/></g>
<g id="rr0"><text class="m" x="1080" y="300" font-size="22">THE REAL REWARD</text><text class="d5" x="1080" y="390" font-size="56" fill-opacity=".55">Sugar</text></g>
<line id="sk" class="s-ink" x1="1072" y1="372" x2="1072" y2="372" stroke-width="6" stroke-linecap="round"/>
<g id="rr1"><text class="d" x="1080" y="490" font-size="60" style="fill:var(--gain)">A break</text><text class="d" x="1080" y="570" font-size="54" style="fill:var(--gain)">and company.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 3: Isolate the cue.</text>
<text class="b" x="120" y="176" font-size="32">Five checks, every time the urge hit.</text>
<g id="cuesl"></g>
<g id="cues"></g>
<g id="tl"></g>
<g id="dots"></g>
