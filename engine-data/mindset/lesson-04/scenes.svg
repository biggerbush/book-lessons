<g id="s0">
<text class="m" x="120" y="150" font-size="28">MINDSET · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Praise the process,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not the person.</text>
<text class="b" x="120" y="600" font-size="32">Why calling someone smart can backfire, and what to say instead.</text>
<g id="kid"><circle class="ink" cx="1330" cy="350" r="50"/><path class="ink" d="M1255 540v-60a75 75 0 0 1 150 0v60z"/><circle cx="1312" cy="340" r="5" fill="var(--stage)"/><circle cx="1348" cy="340" r="5" fill="var(--stage)"/><path id="mouth" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/></g>
<g id="bub0"><rect class="s-gain" x="1170" y="180" width="300" height="84" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M1300 262l10 30 22-30" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1320" y="236" font-size="36" text-anchor="middle">“So smart!”</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One sentence of praise.</text>
<text class="b" x="120" y="176" font-size="32">Dweck’s study: hundreds of young adolescents, fairly hard puzzles.</text>
<g id="pz1"><rect class="s-ink" x="650" y="220" width="300" height="190" rx="14" fill="var(--stage)" stroke-width="5"/><g id="pz1g"></g><text class="m" x="800" y="445" font-size="20" text-anchor="middle">NONVERBAL IQ PUZZLES</text></g>
<g id="kids1"><g id="kl"></g><g id="kr"></g></g>
<g id="bdS"><rect class="s-loss" x="170" y="650" width="520" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d5" x="430" y="706" font-size="30" text-anchor="middle" style="fill:var(--loss)">“You must be smart at this.”</text><text class="m" x="430" y="790" font-size="20" text-anchor="middle">PRAISED FOR ABILITY</text></g>
<g id="bdE"><rect class="gain" x="910" y="650" width="520" height="90" rx="45"/><text class="d5" x="1170" y="706" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">“You must have worked hard.”</text><text class="m" x="1170" y="790" font-size="20" text-anchor="middle" style="fill:var(--gain)">PRAISED FOR EFFORT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Easy, or a challenge?</text>
<text class="b" x="120" y="176" font-size="32">Each child could pick a task.</text>
<g id="dr">
<rect class="s-ink" x="220" y="240" width="200" height="340" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-muted" d="M250 290h140" stroke-width="5" stroke-linecap="round"/><text class="m" x="320" y="620" font-size="24" text-anchor="middle">EASY TASK</text>
<rect class="s-gain" x="1180" y="240" width="200" height="340" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-gain" d="M1210 318l45-28 40 16 60-40" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1280" y="620" font-size="24" text-anchor="middle" style="fill:var(--gain)">CHALLENGE</text>
</g>
<g id="glS"><text class="m" x="630" y="300" font-size="20" text-anchor="middle" style="fill:var(--loss)">SMART-PRAISED</text></g>
<g id="glE"><text class="m" x="970" y="300" font-size="20" text-anchor="middle" style="fill:var(--gain)">EFFORT-PRAISED</text></g>
<g id="dots"></g>
<g id="dcE"><text class="m" x="320" y="660" font-size="20" text-anchor="middle" style="fill:var(--loss)">MOSTLY SMART-PRAISED</text></g>
<g id="dcC"><text class="m" x="1280" y="660" font-size="20" text-anchor="middle" style="fill:var(--gain)">MOSTLY EFFORT-PRAISED</text></g>
<g id="lbl2"><text class="d" x="120" y="770" font-size="40">They had a label to protect.</text></g>
<g id="n90"><text id="n90t" class="d" x="760" y="780" font-size="100" style="fill:var(--gain)">90%</text><text class="m" x="1010" y="738" font-size="20">OF EFFORT-PRAISED KIDS</text><text class="m" x="1010" y="770" font-size="20">CHOSE THE CHALLENGE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">When it got hard.</text>
<text class="b" x="120" y="176" font-size="32">Harder puzzles that nobody solved well.</text>
<g id="pz3"><rect class="s-ink" x="640" y="220" width="320" height="220" rx="14" fill="var(--stage)" stroke-width="5"/><g id="pz3g"></g><text class="m" x="800" y="475" font-size="20" text-anchor="middle">HARDER PUZZLES</text></g>
<g id="fS"><circle class="s-loss" cx="330" cy="560" r="110" fill="var(--stage)" stroke-width="7"/><circle class="loss" cx="292" cy="535" r="10"/><circle class="loss" cx="368" cy="535" r="10"/><path class="s-loss" d="M285 615q45-36 90 0" fill="none" stroke-width="7" stroke-linecap="round"/><text class="d5" x="330" y="730" font-size="30" text-anchor="middle">“I’m not smart after all.”</text><text class="m" x="330" y="780" font-size="20" text-anchor="middle">ENJOYMENT DROPPED</text><rect x="180" y="805" width="300" height="18" rx="9" fill="var(--line)"/><rect id="bS" class="loss" x="180" y="805" width="300" height="18" rx="9"/></g>
<g id="fC"><circle class="s-gain" cx="1270" cy="560" r="110" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="1232" cy="535" r="10"/><circle class="gain" cx="1308" cy="535" r="10"/><path class="s-gain" d="M1210 500q22-16 44 0M1286 500q22-16 44 0" fill="none" stroke-width="6" stroke-linecap="round"/><circle class="s-gain" cx="1270" cy="610" r="16" fill="none" stroke-width="6"/><text class="d5" x="1270" y="730" font-size="30" text-anchor="middle">“A sign to try harder.”</text><text class="m" x="1270" y="780" font-size="20" text-anchor="middle" style="fill:var(--gain)">MANY ENJOYED THEM MOST</text><rect x="1120" y="805" width="300" height="18" rx="9" fill="var(--line)"/><rect id="bG" class="gain" x="1120" y="805" width="150" height="18" rx="9"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The aftermath.</text>
<text class="b" x="120" y="176" font-size="32">Back to easy puzzles, then a letter to another school.</text>
<g id="ch"><text class="m" x="160" y="260" font-size="20">GREY = FIRST SET · COLOUR = FINAL EASY SET</text><path class="s-ink" d="M160 700H880" stroke-width="5" stroke-linecap="round"/><text class="m" x="300" y="740" font-size="20" text-anchor="middle">SMART-PRAISED</text><text class="m" x="640" y="740" font-size="20" text-anchor="middle">EFFORT-PRAISED</text></g>
<rect id="b0" x="200" width="90" fill="var(--line)"/><rect id="b1" class="loss" x="310" width="90"/><rect id="b2" x="540" width="90" fill="var(--line)"/><rect id="b3" class="gain" x="650" width="90"/>
<g id="wS"><text class="m" x="355" y="514" font-size="20" text-anchor="middle" style="fill:var(--loss)">WORSE</text></g>
<g id="wE"><text class="m" x="695" y="374" font-size="20" text-anchor="middle" style="fill:var(--gain)">BETTER</text></g>
<g id="lt"><rect class="s-ink" x="1040" y="240" width="380" height="320" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1080 290h300M1080 325h300M1080 360h200" stroke-width="6" stroke-linecap="round"/><text class="m" x="1080" y="420" font-size="22">MY SCORE</text><rect id="sc" class="loss" x="1080" y="440" width="120" height="40" rx="6"/><text id="scl" class="m" x="1080" y="530" font-size="22" style="fill:var(--loss)">INFLATED</text></g>
<g id="n40"><text id="n40t" class="d" x="1040" y="685" font-size="100" style="fill:var(--loss)">40%</text><text class="m" x="1040" y="724" font-size="20">ALMOST 40% OF SMART-PRAISED KIDS</text><text class="m" x="1040" y="756" font-size="20">INFLATED THEIR SCORES</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it backfires.</text>
<text class="b" x="120" y="176" font-size="32">What each kind of praise teaches.</text>
<g id="per5"><circle class="ink" cx="300" cy="400" r="44"/><path class="ink" d="M234 585v-57a66 66 0 0 1 132 0v57z"/>
<g id="tagw"><path class="s-loss" d="M360 480L440 470" stroke-width="4"/><path class="s-loss" d="M440 470l30-40h230v80h-230z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="loss" x="488" y="470" width="26" height="22" rx="3"/><path class="s-loss" d="M493 470v-8a8 8 0 0 1 16 0v8" fill="none" stroke-width="4"/><text class="d" x="605" y="487" font-size="44" text-anchor="middle" style="fill:var(--loss)">SMART</text></g></g>
<g id="cap5a"><text class="d5" x="120" y="760" font-size="32">A fixed trait to protect.</text><text class="m" x="120" y="810" font-size="20" style="fill:var(--loss)">PRAISE THE PERSON</text></g>
<g id="st5"><path class="s-ink" d="M880 680H1040V580H1200V480H1360V380H1460" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="960" y="660" font-size="20" text-anchor="middle">EFFORT</text><text class="m" x="1120" y="560" font-size="20" text-anchor="middle">STRATEGY</text><text class="m" x="1280" y="460" font-size="20" text-anchor="middle">FOCUS</text><path class="s-ink" d="M1420 380V300" stroke-width="5"/><path class="gain" d="M1420 300h40l-10 15 10 15h-40z"/><circle id="wk" class="gain" r="16"/></g>
<g id="cap5b"><text class="d5" x="880" y="760" font-size="32">Things you did, and can do again.</text><text class="m" x="880" y="810" font-size="20" style="fill:var(--gain)">PRAISE THE PROCESS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Praise the process.</text>
<g id="chips6"></g>
<g id="bub6"><circle class="ink" cx="190" cy="600" r="30"/><path class="ink" d="M145 726v-39a45 45 0 0 1 90 0v39z"/><path class="s-ink" d="M330 530L225 575L390 530" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-ink" x="300" y="330" width="560" height="200" rx="30" fill="var(--stage)" stroke-width="5"/><path d="M336 530h50" stroke="var(--stage)" stroke-width="8"/><text class="d5" x="330" y="390" font-size="30">“You tried several approaches</text><text class="d5" x="330" y="435" font-size="30">until you found the one</text><text class="d5" x="330" y="480" font-size="30">that worked.”</text></g>
<g id="map6"><text class="m" x="960" y="360" font-size="20">IF EFFORT ISN’T WORKING</text><path class="s-ink" d="M1000 720H1200" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="1000" cy="720" r="18"/><rect class="loss" x="1212" y="670" width="22" height="100" rx="4"/><text class="m" x="1223" y="810" font-size="20" text-anchor="middle" style="fill:var(--loss)">STUCK</text><path class="s-ink" d="M1420 720V640" stroke-width="5"/><path class="gain" d="M1420 640h44l-11 15 11 15h-44z"/><path id="det6" class="s-gain" d="M1000 720C1050 460 1380 460 1420 720" pathLength="1" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="ns6"><text class="m" x="1210" y="490" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEW STRATEGY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too easy? Raise the bar.</text>
<text class="b" x="120" y="176" font-size="32">When a child finishes quickly and perfectly.</text>
<g id="jump7"><path class="s-line" d="M160 780H740" stroke-width="5" stroke-linecap="round"/><rect class="ink" x="250" y="300" width="14" height="480"/><rect class="ink" x="636" y="300" width="14" height="480"/><g id="kidJ"></g><rect id="hb" class="gain" x="257" y="730" width="386" height="12" rx="6"/><text id="hbl" class="m" x="664" y="740" font-size="20">TOO EASY</text></g>
<g id="it0"><circle class="gain" cx="852" cy="319" r="10"/><text class="d5" x="880" y="330" font-size="34">Skip the gushing.</text></g>
<g id="it1"><circle class="gain" cx="852" cy="409" r="10"/><text class="d5" x="880" y="420" font-size="34">Apologize for wasting their time.</text></g>
<g id="it2"><circle class="gain" cx="852" cy="499" r="10"/><text class="d5" x="880" y="510" font-size="34">Offer something to learn from.</text></g>
<g id="str7"><text class="d" x="840" y="660" font-size="56">The fun lives</text><text class="d" x="840" y="730" font-size="56" style="fill:var(--gain)">in the stretch.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">Instead of “so smart”,</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">name one thing they did</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="88" letter-spacing="-2">that made <tspan style="fill:var(--gain)">the difference.</tspan></text></g>
<g id="tg8"><text class="m" x="143" y="700" font-size="26" style="fill:var(--gain)">PRAISE WHAT THEY DID</text></g>
<g id="sb8"><rect class="s-ink" x="1120" y="650" width="340" height="110" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1170 760l-20 40 50-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1290" y="722" font-size="40" text-anchor="middle">So smart!</text><path id="sk8" class="s-loss" d="M1170 708H1410" pathLength="1" stroke-width="7" stroke-linecap="round"/></g>
</g>