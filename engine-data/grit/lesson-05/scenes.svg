<g id="s0">
<text class="m" x="120" y="150" font-size="28">GRIT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Finding a purpose</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">beyond yourself.</text>
<text class="b" x="120" y="600" font-size="32">Why seeing who your work helps makes you keep going</text>
<g id="cath0"></g>
<g id="tpp"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three bricklayers.</text>
<text class="b" x="120" y="176" font-size="32">An old parable, retold by Duckworth.</text>
<path class="s-line" d="M120 760H1480" stroke-width="5" stroke-linecap="round"/>
<g id="sun"><circle class="gain" cx="960" cy="270" r="34"/><g id="rays"></g></g>
<g id="bl"></g>
<g id="pb"><text class="m" x="1300" y="650" font-size="20" text-anchor="middle">PASSERBY</text></g>
<g id="q1"><rect class="s-ink" x="1120" y="270" width="340" height="70" rx="35" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1270 338l20 40 10-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1290" y="314" font-size="22" text-anchor="middle">WHAT ARE YOU DOING?</text></g>
<g id="bw"></g>
<text id="idw" class="m" x="200" y="806" font-size="20">IDENTICAL WORK, SIDE BY SIDE</text>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three answers.</text>
<text class="b" x="120" y="176" font-size="32">Same question: what are you doing?</text>
<g id="a0"><g id="bb0"></g><text class="d5" x="340" y="258" font-size="32" text-anchor="middle">I am</text><text class="d5" x="340" y="304" font-size="32" text-anchor="middle">laying bricks.</text>
<rect class="s-ink" x="300" y="540" width="80" height="40" fill="var(--stage)" stroke-width="6"/></g>
<g id="a1"><g id="bb1"></g><text class="d5" x="800" y="258" font-size="32" text-anchor="middle">I am building</text><text class="d5" x="800" y="304" font-size="32" text-anchor="middle">a church.</text>
<path class="s-ink" d="M730 620V500h140v120zM712 502L800 424L888 502M800 384v36M786 398h28M785 620v-40a15 15 0 0 1 30 0v40" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="a2"><g id="bb2"></g><text class="d5" x="1260" y="258" font-size="32" text-anchor="middle">I am building</text><text class="d5" x="1260" y="304" font-size="32" text-anchor="middle" style="fill:var(--gain)">the house of God.</text>
<path id="cg" class="s-gain" d="M1140 620V430L1180 370L1220 430V620M1220 500L1260 450L1300 500M1300 620V430L1340 370L1380 430V620M1140 620H1380M1220 500V620M1300 500V620M1282 550a22 22 0 1 0-44 0a22 22 0 1 0 44 0" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="w2"></g>
<g id="same"><text class="d" x="120" y="846" font-size="40">Same hands, same bricks, three very different stories.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Job, career, calling.</text>
<text class="b" x="120" y="176" font-size="32">Duckworth’s three ways of seeing the same work.</text>
<g id="j0"><rect class="s-line" x="120" y="230" width="414" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<ellipse id="coin" class="s-ink" cx="327" cy="390" rx="80" ry="80" fill="var(--stage)" stroke-width="7"/><ellipse id="coin2" class="s-gain" cx="327" cy="390" rx="50" ry="50" fill="none" stroke-width="6"/>
<text class="d" x="156" y="580" font-size="64">Job</text><text class="m" x="156" y="630" font-size="20">DONE TO PAY THE BILLS</text><text class="m" x="156" y="750" font-size="20">BRICKLAYER 1</text></g>
<g id="j1"><rect class="s-line" x="593" y="230" width="414" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
