<g id="tp"><path id="tptr" class="s-loss" d="M960 380H1180M1150 350l30 30-30 30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ramadi, 2006.</text>
<text class="b" x="120" y="176" font-size="32">Jocko led SEAL Task Unit Bruiser in one of Iraq’s most violent cities.</text>
<rect class="s-line" x="120" y="230" width="880" height="540" rx="12" fill="var(--stage)" stroke-width="3"/>
<g id="blocks"></g><g id="units"></g>
<g id="leg"><circle class="ink" cx="135" cy="813" r="12"/><text class="m" x="160" y="820" font-size="20">US UNITS</text>
<circle class="s-ink" cx="335" cy="813" r="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="360" y="820" font-size="20">IRAQI UNITS</text></g>
