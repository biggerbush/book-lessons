<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why we reach</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">for distraction.</text>
<text class="b" x="120" y="600" font-size="32">Why we flee hard work, and how to stay with it.</text>
<path class="s-line" d="M1100 640h380" stroke-width="5" stroke-linecap="round"/>
<g id="t_rings"></g>
<g id="t_phone"><rect class="s-ink" x="1200" y="290" width="170" height="310" rx="26" fill="var(--stage)" stroke-width="7"/><rect id="t_scr" class="gain" x="1218" y="322" width="134" height="230" rx="8"/><circle class="ink" cx="1285" cy="576" r="8"/></g>
<g id="t_why"><text class="d" x="1060" y="300" font-size="110" style="fill:var(--loss)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Blame the device?</text>
<text class="b" x="120" y="176" font-size="32">Apps are designed to grab attention, and that part is real.</text>
<g id="ph"><rect class="s-ink" x="160" y="240" width="260" height="480" rx="34" fill="var(--stage)" stroke-width="8"/><g id="ic"></g><circle class="ink" cx="290" cy="690" r="10"/></g>
<g id="nt"><circle id="bdg" class="loss" cx="405" cy="255" r="26"/><text class="d" x="405" y="266" font-size="30" text-anchor="middle" style="fill:var(--stage)">1</text>
<rect x="470" y="250" width="170" height="64" rx="32" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="555" y="290" font-size="24" text-anchor="middle" style="fill:var(--loss)">PING</text>
<path class="s-loss" d="M630 500H450M472 480l-22 20 22 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10"/></g>
<g id="pq"><g id="pp"></g></g>
<g id="au"><path class="loss" d="M1220 320a150 150 0 0 0 0 300z"/><path class="s-muted" d="M1220 320a150 150 0 0 1 0 300" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="1145" y="478" font-size="20" text-anchor="middle" style="fill:var(--stage)">DEVICES</text><text class="d5" x="1290" y="494" font-size="64" text-anchor="middle" style="fill:var(--muted)">?</text>
<text class="d5" x="1220" y="690" font-size="36" text-anchor="middle">Only half the story.</text><text class="m" x="1220" y="730" font-size="20" text-anchor="middle">OLIVER BURKEMAN</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The itch at the blank page.</text>
<text class="b" x="120" y="176" font-size="32">Burkeman sits down to write, a task he truly cares about.</text>
<g id="dk"><path class="s-ink" d="M160 650H980M200 650v180M940 650v180" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="380" y="300" width="520" height="320" rx="12" fill="var(--stage)" stroke-width="7"/><path class="ink" d="M350 650l30-30h520l30 30z"/><g id="p2"></g></g>
<g id="bp"><rect class="s-line" x="500" y="330" width="220" height="270" fill="var(--stage)" stroke-width="4"/><rect id="cur" class="ink" x="530" y="370" width="4" height="36"/></g>
<g id="nw"><rect class="loss" x="760" y="330" width="120" height="56" rx="8"/><text class="m" x="820" y="366" font-size="20" text-anchor="middle" style="fill:var(--stage)">NEWS</text>
<path class="s-loss" d="M790 318l-8-14M820 314v-12M850 318l8-14" stroke-width="5" stroke-linecap="round"/></g>
<text class="m" x="1080" y="300" font-size="22">WHY THE URGE?</text>
<g id="n1"><text id="nt1" class="d5" x="1080" y="380" font-size="36" fill-opacity=".6">The news is</text><text id="nt2" class="d5" x="1080" y="426" font-size="36" fill-opacity=".6">fascinating.</text>
<line id="nstr" class="s-loss" x1="1074" y1="368" x2="1074" y2="368" stroke-width="5" stroke-linecap="round"/>
<line id="nstr2" class="s-loss" x1="1074" y1="414" x2="1074" y2="414" stroke-width="5" stroke-linecap="round"/></g>
<g id="n2"><text class="d" x="1080" y="540" font-size="44" style="fill:var(--gain)">The work just</text><text class="d" x="1080" y="594" font-size="44" style="fill:var(--gain)">got hard.</text></g>
<g id="mtr"><rect id="dm" class="loss" x="1080" y="650" width="0" height="28" rx="14"/><rect class="s-ink" x="1080" y="650" width="380" height="28" rx="14" fill="none" stroke-width="4"/><text class="m" x="1080" y="716" font-size="20">DIFFICULTY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hard work shows us our limits.</text>
<g id="p3"></g>
<path id="zz" class="s-loss" d="M240 400l15-20 15 20 15-20 15 20 15-20 15 20 15-20 15 20" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<g id="tk"><rect class="ink" x="440" y="330" width="360" height="320" rx="10"/><text class="m" x="620" y="500" font-size="28" text-anchor="middle" style="fill:var(--stage)">THE TASK</text></g>
<g id="qm"><text class="d" x="920" y="500" font-size="180" style="fill:var(--loss)">?</text><text class="m" x="1040" y="380" font-size="22">HOW WILL IT TURN OUT?</text><text class="m" x="1040" y="430" font-size="22">AM I GOOD ENOUGH?</text></g>
<g id="dc"><text class="m" x="120" y="760" font-size="22" style="fill:var(--loss)">UNCERTAINTY FEELS UNCOMFORTABLE, EVEN PAINFUL</text></g>
<g id="mr"><ellipse class="s-ink" cx="1110" cy="680" rx="90" ry="120" fill="var(--stage)" stroke-width="6"/><g id="rf" opacity=".45"></g><path class="s-ink" d="M1110 800v36M1060 840h100" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1230" y="660" font-size="22">FACE YOUR</text><text class="m" x="1230" y="692" font-size="22">LIMITS HEAD ON</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Distraction is a door out.</text>
<polygon id="beam" class="gain" points="640,420 760,260 760,760 640,740" opacity="0"/>
<path class="s-ink" d="M640 420V260H120V740H640" fill="none" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="150" y="300" font-size="20">LIMITS</text>
<g id="p4"></g>
<polygon id="dpan" class="ink" points="640,420 652,420 652,740 640,740"/>
<g id="fd"><text class="m" x="935" y="230" font-size="20" text-anchor="middle">ENDLESS · NO HARD CHOICES</text></g>
<g id="sg"><circle class="s-ink" cx="1310" cy="440" r="90" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1265 425q15 14 30 0M1325 425q15 14 30 0M1275 480q35 30 70 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="sgl" class="s-gain" d="M1418 404h36M1426 440h44M1418 476h36" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1310" y="590" font-size="22" text-anchor="middle" style="fill:var(--gain)">RELIEF</text></g>
<g id="tm"><text class="d" x="120" y="840" font-size="40">That relief is what makes it so tempting.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Block one exit, another opens.</text>
<text class="b" x="120" y="176" font-size="32">Blocking tools and willpower help, but only partly.</text>
<g id="rt"><g id="rts"></g><ellipse class="loss" cx="800" cy="720" rx="170" ry="40"/><text class="m" x="800" y="728" font-size="22" text-anchor="middle" style="fill:var(--stage)">DISCOMFORT</text></g>
<g id="hl"></g>
<g id="lk"><path class="s-gain" d="M268 420v-22a22 22 0 0 1 44 0v22" fill="none" stroke-width="9"/><rect class="gain" x="250" y="420" width="80" height="64" rx="10"/></g>
<g id="dv"><text class="d" x="120" y="840" font-size="40">The real driver is the discomfort, not the device.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let it be hard.</text>
<g id="s6sub"><text class="b" x="120" y="176" font-size="32">Discomfort is simply what meaningful work feels like.</text></g>
<g id="hd"><circle id="blob" class="loss" cx="360" cy="600" r="56"/><path class="s-ink" d="M170 500Q190 690 360 690Q530 690 550 500M170 500l-20-30M550 500l20-30" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="360" y="760" font-size="22" text-anchor="middle">ACCEPT IT</text></g>
<g id="wv"><text class="m" x="660" y="280" font-size="20">THE URGE: NOTICE · LET IT RISE · LET IT PASS</text><path class="s-line" d="M660 540H1460" stroke-width="4"/><path id="wvp" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle id="wdot" class="loss" r="10" cx="660" cy="540"/></g>
<g id="st"><path class="s-ink" d="M660 840V790H840V740H1020V690H1200V640H1400" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1220" y="600" font-size="20" style="fill:var(--gain)">NEXT SMALL STEP</text><g id="stp"></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Imperfect is fine.</text>
<text class="b" x="120" y="176" font-size="32">Admit the work may not be brilliant.</text>
<g id="dp"><rect class="s-ink" x="160" y="280" width="300" height="380" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="190" y="300" width="300" height="380" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="220" y="320" width="300" height="380" fill="var(--stage)" stroke-width="5"/>
<path class="s-muted" d="M250 380h220M250 430h180M250 480h230M250 530h160M250 580h200M250 630h120" stroke-width="6" stroke-linecap="round"/><path class="s-loss" d="M245 470l240 20M245 520l200 10" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="160" y="760" font-size="20">MAY NOT BE BRILLIANT</text></g>
<path id="fl" class="s-gain" d="M790 600H540" stroke-width="5" stroke-dasharray="10 10" opacity="0"/>
<g id="ps"><g id="psin"></g></g>
<g id="wt"><g id="wtin"><rect class="ink" x="740" y="340" width="240" height="100" rx="12"/><text class="m" x="860" y="400" font-size="26" text-anchor="middle" style="fill:var(--stage)">PERFECTION</text></g></g>
<g id="lr"><text class="d" x="1100" y="480" font-size="60">Less to</text><text class="d" x="1100" y="550" font-size="60" style="fill:var(--gain)">run from.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="72" letter-spacing="-2">Next time you reach</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="72" letter-spacing="-2">for distraction,</text></g>
<g id="qc"><text class="d" x="136" y="480" font-size="72" letter-spacing="-2">pause and <tspan style="fill:var(--gain)">name</tspan></text></g>
<g id="qd"><text class="d" x="136" y="570" font-size="72" letter-spacing="-2">the discomfort.</text></g>
<g id="q2"><text class="m" x="143" y="700" font-size="26">THEN SIT WITH IT FOR ONE MINUTE BEFORE YOU CHOOSE</text></g>
<g id="tmr"><g id="tks"></g>
<circle class="s-line" cx="1300" cy="380" r="100" fill="none" stroke-width="14"/>
<circle id="tarc" class="s-gain" cx="1300" cy="380" r="100" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628" transform="rotate(-90 1300 380)"/>
