<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Keep the plan</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">simple.</text>
<text class="b" x="120" y="600" font-size="32">If your team can't explain the plan, it won't work.</text>
<text class="m" x="1140" y="270" font-size="20">YOUR PLAN</text>
