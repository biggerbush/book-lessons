<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIERS · LESSON 8</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Culture in</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the Cockpit.</text>
<text class="b" x="120" y="600" font-size="32">Why polite hints can bring down planes,</text>
<text class="b" x="120" y="644" font-size="32">and how one airline changed.</text>
<path class="s-ink" d="M900 250H1480L1440 480H940Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path id="mtn" class="loss" d="M960 480L1080 350L1150 420L1240 320L1420 480Z"/>
<path class="s-ink" d="M900 250H1480L1440 480H940ZM1190 250V480" fill="none" stroke-width="7" stroke-linejoin="round"/>
<g id="pilots"></g>
<g id="hint0"><rect class="s-muted" x="1372" y="500" width="100" height="56" rx="14" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="1422" y="536" font-size="36" text-anchor="middle" style="fill:var(--muted)">…</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Crashes rarely have one cause.</text>
<text class="b" x="120" y="176" font-size="32">Small errors pile up, one after another.</text>
<path class="s-line" d="M160 300Q900 240 1360 460" fill="none" stroke-width="4" stroke-dasharray="10 12"/>
<g id="pl1"></g>
<g id="errs"></g>
<g id="boom"><path class="s-muted" d="M1180 580h50m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle class="loss" cx="1360" cy="580" r="100"/><text class="m" x="1360" y="588" font-size="22" text-anchor="middle" style="fill:var(--stage)">DISASTER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Guam, 1997.</text>
<text class="b" x="120" y="176" font-size="32">A Korean Air jet crashed approaching the island at night.</text>
<rect class="s-line" x="120" y="220" width="660" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-muted" cx="700" cy="290" r="26" fill="none" stroke-width="5"/>
<g id="isl"><path class="ink" d="M300 740Q500 540 740 740Z"/><text class="m" x="520" y="612" font-size="22" text-anchor="middle">GUAM</text></g>
<g id="pl2"></g>
<g id="cld"><circle class="loss" cx="410" cy="330" r="40"/><circle class="loss" cx="465" cy="305" r="50"/><circle class="loss" cx="525" cy="335" r="36"/><rect class="loss" x="380" y="330" width="170" height="42" rx="21"/></g>
<g id="rain"></g>
<g id="cap"><text class="d5" x="950" y="470" font-size="36" style="fill:var(--muted)">Z z</text><text class="m" x="900" y="704" font-size="18" text-anchor="middle">CAPTAIN</text></g>
<g id="fo"><text class="m" x="1100" y="704" font-size="18" text-anchor="middle">FIRST OFFICER</text></g>
<g id="fe"><text class="m" x="1340" y="704" font-size="18" text-anchor="middle">FLIGHT ENGINEER</text></g>
<g id="hb0"><rect class="s-muted" x="1010" y="380" width="180" height="70" rx="16" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="b" x="1100" y="424" font-size="26" text-anchor="middle">the rain…</text></g>
<g id="hb1"><rect class="s-muted" x="1250" y="380" width="180" height="70" rx="16" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="b" x="1340" y="424" font-size="26" text-anchor="middle">the rain…</text></g>
<g id="unsaid"><text class="d" x="120" y="812" font-size="44">Neither one said the danger out loud.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mitigated speech.</text>
<text class="b" x="120" y="176" font-size="32">Softening a message to sound polite or respectful.</text>
<g id="spk"><circle class="ink" cx="200" cy="360" r="32"/><path class="ink" d="M152 494v-42a48 48 0 0 1 96 0v42z"/></g>
<g id="bA"><rect class="s-ink" x="300" y="230" width="280" height="120" rx="20" fill="var(--stage)" stroke-width="6"/><text class="d" x="440" y="324" font-size="90" text-anchor="middle" style="fill:var(--gain)">!</text><text class="m" x="300" y="384" font-size="20">DIRECT</text></g>
<g id="bB"><path class="s-muted" d="M440 396v38m-14-14 14 14 14-14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-muted" x="320" y="450" width="240" height="90" rx="20" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="440" y="506" font-size="56" text-anchor="middle" style="fill:var(--muted)">…</text><text class="m" x="320" y="580" font-size="20">SOFTENED</text></g>
<g id="rails"><path class="s-ink" d="M960 250V760M1240 250V760" stroke-width="8" stroke-linecap="round"/></g>
<g id="rungs"></g>
<g id="lblT"><text class="m" x="1270" y="298" font-size="20" style="fill:var(--gain)">BLUNT COMMAND</text></g>
<g id="lblB"><text class="m" x="1270" y="738" font-size="20">VAGUE HINT</text></g>
<g id="miss"><text class="d" x="120" y="832" font-size="40">A hint is easy to miss when a captain is struggling.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Power distance.</text>
<text class="b" x="120" y="176" font-size="32">Researcher Geert Hofstede measured it across cultures.</text>
<g id="pd"><path class="s-line" d="M120 270H1480" stroke-width="8" stroke-linecap="round"/><g id="ticks"></g><text class="m" x="120" y="316" font-size="20">LOW</text><text class="m" x="1480" y="316" font-size="20" text-anchor="end">HIGH</text><circle id="pdm" class="gain" cx="800" cy="270" r="18"/></g>
<g id="def"><text class="d5" x="120" y="386" font-size="38">How much people defer to those above them.</text></g>
<g id="lowp"><rect class="s-line" x="120" y="430" width="640" height="350" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M160 720H720" stroke-width="4"/><path class="s-gain" d="M380 577H500" stroke-width="5" stroke-dasharray="8 8"/><text class="m" x="440" y="760" font-size="18" text-anchor="middle">LOW POWER DISTANCE</text></g>
<g id="hip"><rect class="s-line" x="840" y="430" width="640" height="350" rx="18" fill="var(--stage)" stroke-width="3"/><path class="s-line" d="M880 720H1440" stroke-width="4"/><rect class="ink" x="1220" y="620" width="180" height="100"/><text class="m" x="1160" y="760" font-size="18" text-anchor="middle">HIGH POWER DISTANCE</text></g>
<g id="nochal"><rect class="s-loss" x="900" y="470" width="140" height="70" rx="16" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="970" y="524" font-size="50" text-anchor="middle" style="fill:var(--loss)">!</text><path class="s-loss" d="M890 545L1050 465" stroke-width="6" stroke-linecap="round"/></g>
<g id="chal"><text class="d" x="120" y="836" font-size="40">Challenging a boss feels wrong, even in an emergency.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not just one country.</text>
<text class="b" x="120" y="176" font-size="32">A Colombian crew in 1990 ran out of fuel near New York.</text>
<g id="gauge"><path class="s-ink" d="M200 540A200 200 0 0 1 600 540" fill="none" stroke-width="10" stroke-linecap="round"/><path class="s-loss" d="M200 540A200 200 0 0 1 219 456" fill="none" stroke-width="16" stroke-linecap="round"/><text class="d" x="200" y="592" font-size="36" text-anchor="middle" style="fill:var(--loss)">E</text><text class="d" x="600" y="592" font-size="36" text-anchor="middle">F</text><line id="needle" class="s-ink" x1="400" y1="540" x2="570" y2="540" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="400" cy="540" r="16"/><text class="m" x="400" y="630" font-size="20" text-anchor="middle">FUEL</text></g>
<g id="cop"><text class="m" x="820" y="690" font-size="18" text-anchor="middle">CO-PILOT</text></g>
<g id="em"><rect class="s-muted" x="860" y="300" width="320" height="80" rx="18" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="d5" x="1020" y="354" font-size="36" text-anchor="middle" fill-opacity=".4">EMERGENCY</text><text class="m" x="1020" y="416" font-size="18" text-anchor="middle" style="fill:var(--loss)">NEVER CLEARLY SAID</text></g>
<g id="waves"></g>
<g id="tower"><rect class="ink" x="1320" y="440" width="40" height="280"/><path class="ink" d="M1290 440h100l-15-50h-70z"/><text class="m" x="1340" y="760" font-size="18" text-anchor="middle">AIR TRAFFIC CONTROL</text></g>
<g id="muff"><text class="d" x="120" y="824" font-size="42">Here too, deference to authority muffled the warning.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fix.</text>
<text class="b" x="120" y="176" font-size="32">Korean Air brought in outside help to rebuild its training.</text>
<g id="c1"><rect class="s-line" x="120" y="220" width="580" height="200" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="20">OUTSIDE HELP</text><path class="s-muted" d="M160 345h140m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="330" y="300" width="340" height="90" rx="16"/><text class="d5" x="500" y="357" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">New training</text></g>
<g id="c2"><rect class="s-line" x="760" y="220" width="720" height="200" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M870 300c-25-16-55-16-70-8v80c15-8 45-8 70 8 25-16 55-16 70-8v-80c-15-8-45-8-70 8z"/><path d="M870 300v80" stroke="var(--stage)" stroke-width="4"/><text class="d" x="980" y="330" font-size="56">English</text><text class="m" x="980" y="370" font-size="18">WITHOUT THE SAME BUILT-IN</text><text class="m" x="980" y="398" font-size="18">LEVELS OF RESPECT</text></g>
<g id="pil"><path class="s-line" d="M400 780H1200" stroke-width="4"/><rect id="blkC" class="ink" x="480" y="620" width="160" height="160"/><rect id="blkJ" class="ink" x="960" y="760" width="160" height="20"/><text class="m" x="460" y="770" font-size="20" text-anchor="end">CAPTAIN</text><text class="m" x="1140" y="770" font-size="20">JUNIOR PILOT</text></g>
<g id="eqf"><path class="s-gain" d="M610 584H990" stroke-width="5" stroke-dasharray="8 8"/><text class="m" x="800" y="566" font-size="20" text-anchor="middle" style="fill:var(--gain)">EQUAL FOOTING</text></g>
<g id="spk6"><text class="m" x="800" y="842" font-size="22" text-anchor="middle" style="fill:var(--gain)">JUNIOR PILOTS SPEAK UP CLEARLY AND DIRECTLY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Culture can change.</text>
<text class="b" x="120" y="176" font-size="32">Korean Air went on to become a safe, respected airline.</text>
<g id="badge"><path class="gain" d="M330 340L430 380V470Q430 560 330 600Q230 560 230 470V380Z"/><path d="M285 470l30 30 55-60" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="330" y="650" font-size="20" text-anchor="middle">SAFE · RESPECTED</text></g>
<g id="team"><circle id="tc" cx="800" cy="470" r="140" fill="none" stroke="var(--line)" stroke-width="5"/><g id="tpl"></g><text class="m" x="800" y="690" font-size="20" text-anchor="middle">CULTURE SHAPES US</text></g>
<g id="seeit"><text class="d5" x="800" y="462" font-size="34" text-anchor="middle">See it.</text><text class="d" x="800" y="504" font-size="34" text-anchor="middle" style="fill:var(--gain)">Change it.</text></g>
<g id="clr"><rect class="gain" x="1080" y="330" width="400" height="120" rx="20"/><path class="gain" d="M1150 448l10 42 34-42z"/><text class="d" x="1280" y="406" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Say it plainly.</text></g>
<g id="habit"><text class="d" x="120" y="812" font-size="44">That habit can make your own team safer too.</text></g>
</g>

<g id="s8" opacity="0">
<g id="q0"><text class="m" x="143" y="230" font-size="22">THINK OF A TIME YOU HINTED WHEN YOU SHOULD HAVE SPOKEN DIRECTLY</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What would you say,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">if you had to say it</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">clearly</tspan>, today?</text></g>
<g id="hq1"><rect class="s-muted" x="1240" y="280" width="180" height="90" rx="18" fill="var(--stage)" stroke-width="4" stroke-dasharray="8 8"/><text class="d" x="1330" y="336" font-size="48" text-anchor="middle" style="fill:var(--muted)">…</text></g>
<g id="hq2"><path class="s-muted" d="M1330 390v50m-16-16 16 16 16-16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1220" y="460" width="220" height="120" rx="20"/><text class="d" x="1330" y="550" font-size="84" text-anchor="middle" style="fill:var(--on-gain)">!</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">SAY IT PLAINLY, NOT AS A HINT</text></g>
</g>