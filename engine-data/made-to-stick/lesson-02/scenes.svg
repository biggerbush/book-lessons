<g id="s0">
<text class="m" x="120" y="150" font-size="28">MADE TO STICK · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Simple:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">find the core.</text>
<text class="b" x="120" y="600" font-size="32">Find the one thing that matters when the plan falls apart.</text>
<text class="m" x="960" y="184" font-size="20">EVERYTHING YOU COULD SAY</text>
