<g id="cap6"><text class="d" x="120" y="830" font-size="40">A rough first version teaches you more.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your first step.</text>
<text class="b" x="120" y="176" font-size="32">For one week, write down every small problem that bugs you.</text>
