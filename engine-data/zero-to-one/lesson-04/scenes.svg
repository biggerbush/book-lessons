<g id="s0">
<text class="m" x="120" y="150" font-size="28">ZERO TO ONE · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Competition</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is for losers.</text>
<text class="b" x="120" y="600" font-size="32">Why fighting rivals destroys profits, and what monopolies get right.</text>
<g id="coinG"><circle class="gain" cx="1240" cy="360" r="90"/><text class="d" x="1240" y="382" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">$</text></g>
