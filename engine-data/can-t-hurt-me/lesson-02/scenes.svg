<g id="hon"><text class="m" x="190" y="770" font-size="24" style="fill:var(--gain)">HONESTY TURNS STRAIGHT INTO ACTION</text></g>
</g>

<g id="s7" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Tonight: one honest</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">sentence on a note.</text></g>
