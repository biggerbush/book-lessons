<path class="s-ink" d="M600 460Q760 330 920 460Q760 590 600 460Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<circle id="iris" class="ink" cx="760" cy="460" r="58"/><circle id="pupil" cx="760" cy="460" r="24" fill="var(--stage)"/>
<text class="m" x="760" y="700" font-size="20" text-anchor="middle">WATCH EVERYTHING</text></g>
<g id="wall"></g>
<rect id="scan4" class="loss" x="980" y="260" width="480" height="4"/>
<g id="wallL"><text class="m" x="1220" y="690" font-size="20" text-anchor="middle">EVERY LAB, MESSAGE, PURCHASE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Road two: dystopia.</text>
<text class="b" x="120" y="176" font-size="32">Suleyman points to China as an early glimpse.</text>
<g id="city"><path class="s-ink" d="M120 720H800" stroke-width="6"/><text class="m" x="120" y="776" font-size="22">CHINA</text></g>
<g id="face"><circle class="ink" cx="1150" cy="440" r="70"/><path class="ink" d="M1040 720v-60a110 110 0 0 1 220 0v60z"/>
<path class="s-loss" d="M1060 390v-40h40M1200 350h40v40M1240 490v40h-40M1100 530h-40v-40" fill="none" stroke-width="6" stroke-linecap="round"/>
<rect id="fscan" class="loss" x="1070" y="360" width="160" height="4"/>
<text class="m" x="1150" y="776" font-size="20" text-anchor="middle">FACIAL RECOGNITION</text></g>
<g id="bars"></g>
<g id="tags"><rect x="1250" y="350" width="228" height="86" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="3"/>
<text class="m" x="1264" y="382" font-size="20" style="fill:var(--loss)">ID MATCHED</text><text class="m" x="1264" y="420" font-size="20" style="fill:var(--loss)">LOCATION LOGGED</text></g>
<g id="price"><text class="d" x="120" y="846" font-size="48">The price of safety: our freedom.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why not just stop?</text>
<text class="b" x="120" y="176" font-size="32">Halting the technology brings its own disaster.</text>
<g id="pause"><circle class="s-ink" cx="290" cy="450" r="130" fill="var(--stage)" stroke-width="8"/>
<rect class="ink" x="240" y="390" width="45" height="120" rx="6"/><rect class="ink" x="305" y="390" width="45" height="120" rx="6"/>
<text class="m" x="290" y="640" font-size="20" text-anchor="middle">HALT IT ALL</text></g>
<path id="a6a" class="s-muted" d="M440 450h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="shelf"><rect class="s-ink" x="540" y="300" width="360" height="300" fill="none" stroke-width="6"/>
<path class="s-ink" d="M540 400h360M540 500h360" stroke-width="6"/><g id="boxes"></g>
<text class="d" x="720" y="680" font-size="44" text-anchor="middle" style="fill:var(--loss)">Stagnation</text></g>
<path id="a6b" class="s-muted" d="M930 450h80m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="globe"><circle id="gfill" class="loss" cx="1200" cy="450" r="140" fill-opacity=".1"/>
<circle class="s-ink" cx="1200" cy="450" r="140" fill="none" stroke-width="6"/>
<ellipse class="s-ink" cx="1200" cy="450" rx="60" ry="140" fill="none" stroke-width="4"/><path class="s-ink" d="M1060 450h280" stroke-width="4"/>
<rect class="s-ink" x="1400" y="320" width="36" height="230" rx="18" fill="var(--stage)" stroke-width="5"/>
<rect id="merc" class="loss" x="1410" y="500" width="16" height="40"/><circle class="loss" cx="1418" cy="560" r="28"/></g>
<g id="pb0"><text class="m" x="1240" y="650" font-size="22" text-anchor="middle" style="fill:var(--loss)">CLIMATE CHANGE</text></g>
<g id="pb1"><text class="m" x="1240" y="690" font-size="22" text-anchor="middle" style="fill:var(--loss)">DISEASE</text></g>
<g id="pb2"><text class="m" x="1240" y="730" font-size="22" text-anchor="middle" style="fill:var(--loss)">AGEING POPULATIONS</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep both dangers in view.</text>
<text class="b" x="120" y="176" font-size="32">The point is not to pick a side.</text>
<g id="scale"><path class="s-ink" d="M800 300V560M650 566h300" stroke-width="10" stroke-linecap="round"/>
<path id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="800" cy="300" r="16"/>
<g id="panL"></g><g id="panR"></g></g>
<g id="card0"><rect class="s-line" x="120" y="600" width="640" height="230" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M160 630V720" stroke-width="6" stroke-linecap="round"/><path class="loss" d="M160 632L215 650L160 668z"/>
<text class="d5" x="240" y="672" font-size="40">“Unleash it!”</text>
<g id="ask0"><text class="m" x="150" y="750" font-size="20" style="fill:var(--gain)">ASK</text><text class="d" x="150" y="800" font-size="34">What could go wrong?</text></g></g>
<g id="card1"><rect class="s-line" x="840" y="600" width="640" height="230" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M880 630V720" stroke-width="6" stroke-linecap="round"/><path class="loss" d="M880 632L935 650L880 668z"/>
<text class="d5" x="960" y="672" font-size="40">“Lock it down!”</text>
<g id="ask1"><text class="m" x="870" y="750" font-size="20" style="fill:var(--gain)">ASK</text><text class="d" x="870" y="800" font-size="34">What freedoms would it cost?</text></g></g>
</g>

<g id="s8" opacity="0">
<g id="q8l"><text class="m" x="143" y="230" font-size="26">THINK OF ONE TECHNOLOGY YOU USE EVERY DAY</text></g>
<g id="qa"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">What would too little</text></g>
<g id="qb"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">control look like?</text></g>
<g id="qc"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2">And <tspan style="fill:var(--gain)">too much</tspan>?</text></g>
