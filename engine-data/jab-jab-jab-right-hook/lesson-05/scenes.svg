<g id="s0">
<text class="m" x="120" y="150" font-size="28">JAB, JAB, JAB, RIGHT HOOK · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Twitter: join the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">conversation.</text>
<text class="b" x="120" y="600" font-size="32">Stop shouting announcements and start joining real conversations.</text>
<g id="mega"><rect class="ink" x="1020" y="345" width="34" height="50" rx="6"/><path class="loss" d="M1054 345L1150 295V445L1054 395z"/><path class="s-ink" d="M1070 395l10 50" stroke-width="8" stroke-linecap="round"/></g>
<g id="waves"></g>
<g id="crowd0"></g>
<g id="chat0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Twitter is one giant party.</text>
<text class="b" x="120" y="176" font-size="32">Noisy, crowded, and happening in real time.</text>
<g id="room"><rect class="s-line" x="150" y="230" width="1300" height="560" rx="24" fill="var(--stage)" stroke-width="4"/><path class="s-muted" d="M170 250Q380 300 590 250T1010 250T1430 250" fill="none" stroke-width="3"/><g id="bulbs"></g></g>
<g id="groups"></g>
<g id="guest">
<g id="bub1"><rect x="1200" y="330" width="240" height="80" rx="20" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><path class="loss" d="M1300 408l20 30 14-30z"/><text class="d" x="1320" y="382" font-size="30" text-anchor="middle" style="fill:var(--loss)">ME, ME, ME!</text></g>
<g id="guestp"></g>
</g>
<g id="ign"><text class="m" x="1320" y="610" font-size="22" text-anchor="middle" style="fill:var(--loss)">IGNORED</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stop pinning up notices.</text>
<text class="b" x="120" y="176" font-size="32">Many brands treat Twitter like a notice board.</text>
<rect class="s-ink" x="120" y="230" width="560" height="370" rx="14" fill="var(--stage)" stroke-width="6"/>
<g id="nb"></g>
<g id="feedw"><rect class="s-line" x="780" y="230" width="420" height="560" rx="20" fill="none" stroke-width="3"/><text class="m" x="800" y="274" font-size="22" style="fill:var(--muted)">YOUR FEED</text><g id="feed"></g></g>
<g id="pw"><text class="d" x="120" y="700" font-size="38">The power isn’t posting more.</text><text class="d" x="120" y="760" font-size="38" style="fill:var(--gain)">It’s listening and replying.</text></g>
<g id="lr0"><rect class="gain" x="1250" y="380" width="220" height="100" rx="50"/><text class="d" x="1360" y="443" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">LISTEN</text></g>
<g id="lr1"><rect class="gain" x="1250" y="520" width="220" height="100" rx="50"/><text class="d" x="1360" y="583" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">REPLY</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Listen first.</text>
<text class="b" x="120" y="176" font-size="32">Twitter search lets you hear what people say, right now.</text>
<g id="sb"><rect class="s-ink" x="120" y="230" width="900" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="180" cy="270" r="20" fill="none" stroke-width="6"/><path class="s-ink" d="M195 285l16 16" stroke-width="7" stroke-linecap="round"/><text id="qtxt" class="d5" x="230" y="290" font-size="36"></text></g>
<g id="kt"></g>
<g id="convs"></g>
<g id="door"><text class="m" x="1100" y="400" font-size="22" style="fill:var(--gain)">AN OPEN DOOR</text><rect class="gain" x="1100" y="430" width="380" height="260" rx="30"/><path class="gain" d="M1102 570L1030 600L1102 620z"/>
<text class="d" x="1140" y="510" font-size="44" style="fill:var(--on-gain)">Helpful.</text><text class="d" x="1140" y="580" font-size="44" style="fill:var(--on-gain)">Funny.</text><text class="d" x="1140" y="650" font-size="44" style="fill:var(--on-gain)">Kind.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every reply is a jab.</text>
<text class="b" x="120" y="176" font-size="32">A small gift of attention that asks for nothing back.</text>
<g id="brand"><rect class="ink" x="190" y="300" width="140" height="140" rx="20"/><text class="d" x="260" y="397" font-size="80" text-anchor="middle" style="fill:var(--stage)">@</text><text class="m" x="260" y="480" font-size="20" text-anchor="middle">BRAND</text></g>
<g id="rarr"><path class="s-gain" d="M350 330Q800 170 1270 320" fill="none" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/><path class="s-gain" d="M1236 292L1272 321L1228 334" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="usr"></g>
<g id="smile"><path d="M1322 330q18 16 36 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="gift"><rect class="gain" x="-20" y="-20" width="40" height="40" rx="4"/><path d="M0 -20V20M-20 0H20" stroke="var(--on-gain)" stroke-width="4"/></g>
<g id="noticed"><text class="m" x="1340" y="540" font-size="20" text-anchor="middle" style="fill:var(--gain)">FEELS NOTICED</text><text class="m" x="1340" y="572" font-size="20" text-anchor="middle">AND REMEMBERS</text></g>
<g id="thr"></g>
<g id="heart4"><path class="gain" transform="translate(1370 680)" d="M0 40C-50 7-53-30-25-37C-12-40-3-31 0-23C3-31 12-40 25-37C53-30 50 7 0 40Z"/><text class="m" x="1370" y="770" font-size="20" text-anchor="middle" style="fill:var(--gain)">RELATIONSHIP</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ride the moment.</text>
<text class="b" x="120" y="176" font-size="32">Join trends only where your brand genuinely belongs.</text>
<g id="tl"><rect class="s-line" x="120" y="230" width="520" height="470" rx="20" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="280" font-size="22">TRENDING</text><g id="rows"></g></g>
