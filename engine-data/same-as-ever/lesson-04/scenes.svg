<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">How could you tell</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">your unheard idea</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">as a <tspan style="fill:var(--gain)">story</tspan> this week?</text></g>
