<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Every conversation</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is really three.</text>
<text class="b" x="120" y="600" font-size="32">Why we talk past each other, even when we agree.</text>
<g id="pp"></g>
<g id="bb0"><path class="s-ink" d="M1100 300H1220Q1240 300 1240 320V370Q1240 390 1220 390H1180L1160 420L1150 390H1100Q1080 390 1080 370V320Q1080 300 1100 300Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-gain" d="M1130 345l20 20l35-40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="bb1"><g transform="translate(240 0)"><path class="s-ink" d="M1100 300H1220Q1240 300 1240 320V370Q1240 390 1220 390H1180L1160 420L1150 390H1100Q1080 390 1080 370V320Q1080 300 1100 300Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-gain" d="M1130 345l20 20l35-40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="gap0"><path class="s-loss" d="M1214 530h30M1316 530h30" stroke-width="5" stroke-linecap="round"/><text id="gapq" class="d" x="1280" y="556" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One talk. Three conversations.</text>
<text class="b" x="120" y="176" font-size="32">Most discussions are not just one conversation.</text>
<g id="bub1"><path class="s-ink" d="M150 260H530Q560 260 560 290V530Q560 560 530 560H260L180 630L200 560H150Q120 560 120 530V290Q120 260 150 260Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/></g>
<g id="ln1"></g><g id="cn1"></g><g id="strips"></g>
<g id="note1"><text class="d" x="120" y="770" font-size="44">We rarely stop to notice which one we’re in.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Practical.</text>
<text class="b" x="120" y="176" font-size="32">Plans, problems and what to do next.</text>
<g id="clip2"><rect class="s-ink" x="160" y="260" width="360" height="470" rx="16" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="270" y="236" width="140" height="50" rx="10"/></g>
<g id="rows2"></g>
<g id="hq2"><text class="m" x="640" y="300" font-size="22">HIDDEN QUESTION</text><text class="d" x="640" y="380" font-size="56">What is this</text><text class="d" x="640" y="450" font-size="56">really about?</text><circle class="gain" cx="1330" cy="390" r="70"/><text class="d" x="1330" y="422" font-size="90" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="tag2"><path class="s-ink" d="M640 590h220l50 50l-50 50h-220z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="s-ink" cx="866" cy="640" r="10" fill="var(--stage)" stroke-width="4"/><text class="m" x="680" y="650" font-size="26">PRICE</text><text class="m" x="640" y="790" font-size="20">AGREEING ON A PRICE</text></g>
<g id="cal2"><rect class="s-ink" x="1000" y="560" width="280" height="190" rx="12" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1000" y="560" width="280" height="44" rx="10"/><rect class="gain" x="1030" y="628" width="100" height="96" rx="10"/><rect class="gain" x="1150" y="628" width="100" height="96" rx="10"/><text class="m" x="1080" y="686" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">SAT</text><text class="m" x="1200" y="686" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">SUN</text><text class="m" x="1000" y="790" font-size="20">PLANNING A WEEKEND</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Emotional.</text>
<text class="b" x="120" y="176" font-size="32">Worries, joys and frustrations that want to be acknowledged.</text>
<g id="hrtW"><g id="hrt" transform="translate(330 460)"><path class="loss" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/></g></g>
<g id="hq3"><text class="m" x="640" y="290" font-size="22">HIDDEN QUESTION</text><text class="d" x="640" y="360" font-size="56">How do we feel?</text></g>
<g id="faces3"></g>
<g id="und3"><text class="d" x="120" y="770" font-size="50"><tspan style="fill:var(--gain)">Understood</tspan>, more than corrected.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Social.</text>
<text class="b" x="120" y="176" font-size="32">Ourselves, our relationships and our groups.</text>
<g id="ringc"><circle class="s-line" cx="400" cy="500" r="230" fill="none" stroke-width="4" stroke-dasharray="10 10"/></g>
<g id="ring4"></g>
<g id="you4"><circle class="gain" cx="400" cy="500" r="60"/><text class="d" x="400" y="509" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
<g id="hq4"><text class="m" x="760" y="260" font-size="22">HIDDEN QUESTION</text><text class="d" x="760" y="330" font-size="56">Who are we?</text></g>
<g id="badges4"></g>
<g id="pride4"><text class="d5" x="760" y="710" font-size="34" style="fill:var(--gain)">Pride · belonging · how others see us</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A kitchen mismatch.</text>
<text class="b" x="120" y="176" font-size="32">Duhigg comes home and complains about his job.</text>
<path class="s-line" d="M120 760H1480" stroke-width="4"/>
<rect class="ink" x="600" y="600" width="400" height="14" rx="6"/><path class="s-ink" d="M640 614V760M960 614V760" stroke-width="8" stroke-linecap="round"/>
<g id="auth5"></g>
<g id="ab5"><path class="s-ink" d="M570 260H760Q780 260 780 280V340Q780 360 760 360H620L500 430L580 360H570Q550 360 550 340V280Q550 260 570 260Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-loss" d="M585 318l16-24l16 32l16-32l16 32l16-32l16 32l16-32l16 32l16-24" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="sp5"></g>
<g id="sb5"><path class="s-ink" d="M850 260H1060Q1080 260 1080 280V340Q1080 360 1060 360H1030L1110 430L990 360H850Q830 360 830 340V280Q830 260 850 260Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><circle class="gain" cx="862" cy="285" r="7"/><circle class="gain" cx="862" cy="310" r="7"/><circle class="gain" cx="862" cy="335" r="7"/><path class="s-ink" d="M882 285h170M882 310h150M882 335h160" stroke-width="5" stroke-linecap="round"/></g>
<g id="cloud5"><g id="cloudIn"><circle class="loss" cx="380" cy="350" r="36"/><circle class="loss" cx="430" cy="330" r="46"/><circle class="loss" cx="480" cy="352" r="34"/><rect class="loss" x="380" y="350" width="100" height="36"/><path class="s-loss" d="M440 390l-14 20h18l-12 22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="tens5"><text class="d" x="800" y="540" font-size="90" text-anchor="middle" style="fill:var(--muted)">?</text><text class="m" x="800" y="830" font-size="22" text-anchor="middle">NEITHER COULD QUITE EXPLAIN THE TENSION</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it went wrong.</text>
<text class="b" x="120" y="176" font-size="32">Two conversations, running on two different tracks.</text>
<g id="tA"><text class="m" x="120" y="262" font-size="22">SHE</text><text class="d" x="120" y="318" font-size="44">Practical</text><g id="trA"></g>
<g id="cAi"><rect class="ink" x="0" y="240" width="120" height="56" rx="10"/><circle class="ink" cx="25" cy="300" r="9"/><circle class="ink" cx="95" cy="300" r="9"/><text class="m" x="60" y="275" font-size="20" text-anchor="middle" style="fill:var(--stage)">FIX IT</text></g></g>
<g id="tB"><text class="m" x="120" y="482" font-size="22">HE</text><text class="d" x="120" y="538" font-size="44" style="fill:var(--loss)">Emotional</text><g id="trB"></g>
<g id="cBi"><rect class="loss" x="0" y="460" width="120" height="56" rx="10"/><circle class="loss" cx="25" cy="520" r="9"/><circle class="loss" cx="95" cy="520" r="9"/><text class="m" x="60" y="495" font-size="20" text-anchor="middle" style="fill:var(--stage)">HEAR ME</text></g></g>
<g id="nomeet6"><text class="m" x="1480" y="420" font-size="22" text-anchor="end" style="fill:var(--gain)">BOTH MEANT WELL · DIFFERENT TRACKS</text></g>
<g id="bot6"><text class="d" x="120" y="680" font-size="52">The advice wasn’t the problem.</text><text class="d" x="120" y="760" font-size="52" style="fill:var(--gain)">The mismatch was.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">It happens everywhere.</text>
<text class="b" x="120" y="176" font-size="32">A work meeting about a deadline.</text>
<g id="meet7"><g id="ppl7"></g><rect class="ink" x="400" y="560" width="800" height="18" rx="9"/>
<circle class="s-ink" cx="1340" cy="420" r="56" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1340 420V384" stroke-width="6" stroke-linecap="round"/><path id="hand7" class="s-loss" d="M1340 420h28" stroke-width="6" stroke-linecap="round"/><text class="m" x="1340" y="510" font-size="20" text-anchor="middle">DEADLINE</text></g>
<g id="bub7"></g>
<g id="tangle7"></g>
<g id="bot7"><text class="d" x="120" y="820" font-size="44">Not real disagreement. A mismatch of kinds.</text></g>
</g>

<g id="s8" opacity="0">
<text class="m" x="143" y="230" font-size="26">IN YOUR NEXT TENSE CHAT, QUIETLY ASK</text>
<g id="qa8"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which kind of</text></g>
<g id="qb8"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">conversation is the</text></g>
<g id="qc8"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">other person having?</text></g>
