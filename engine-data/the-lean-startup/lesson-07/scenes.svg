<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LEAN STARTUP · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Speed through Build,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Measure, Learn.</text>
<text class="b" x="120" y="600" font-size="32">Small batches and fast loops beat big, slow launches.</text>
<g id="sw">
<rect class="ink" x="1306" y="226" width="48" height="30" rx="6"/>
<rect class="ink" x="1320" y="250" width="20" height="22"/>
