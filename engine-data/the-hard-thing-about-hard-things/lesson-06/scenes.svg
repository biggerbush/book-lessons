<g id="b1"></g>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The peacetime CEO.</text>
<text class="b" x="120" y="176" font-size="32">Thinks big, widens the field, builds agreement.</text>
<g id="tb"><ellipse class="s-ink" cx="640" cy="530" rx="280" ry="100" fill="var(--stage)" stroke-width="6"/><text class="m" x="300" y="620" font-size="20" text-anchor="middle" style="fill:var(--gain)">CEO</text></g>
<g id="tm"></g>
<g id="ids"></g>
