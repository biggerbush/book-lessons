<circle class="gain" cx="1370" cy="320" r="34"/>
<path d="M1354 320l12 12 22-24" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1270" y="620" font-size="20" text-anchor="middle" style="fill:var(--gain)">A CHANGE THEY WANT</text>
</g>
<g id="nob"><text class="d" x="120" y="760" font-size="40">Nobody is tricked, because the change is good for them.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with one question.</text>
<text class="b" x="120" y="176" font-size="32">Then picture the before and after.</text>
