<circle class="s-ink" cx="600" cy="420" r="90" fill="none" stroke-width="6"/><circle class="s-ink" cx="600" cy="420" r="58" fill="none" stroke-width="6"/><circle class="gain" cx="600" cy="420" r="26"/>
<text class="m" x="150" y="630" font-size="20">SHOWS WHAT MATTERS TO THE READER</text></g>
