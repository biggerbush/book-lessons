<text class="m" x="1360" y="550" font-size="20" text-anchor="middle">PLENTY</text>
<g id="s6same"><text class="m" x="1260" y="650" font-size="22" text-anchor="middle" style="fill:var(--gain)">STILL THE SAME COOKIE</text></g>
</g>
</g>

