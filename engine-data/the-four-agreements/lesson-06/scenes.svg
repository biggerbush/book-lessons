<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE FOUR AGREEMENTS · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Always do</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your best.</text>
<text class="b" x="120" y="600" font-size="32">Why your best keeps changing, and why that is enough.</text>
<g id="tg">
<text class="m" x="1260" y="236" font-size="20" text-anchor="middle">YOUR BEST</text>
<rect class="s-ink" x="1200" y="260" width="120" height="300" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect id="tlev" class="gain" x="1210" y="400" width="100" height="150" rx="8"/>
</g>
<path id="tchk" class="s-gain" d="M1370 420l30 30 60-70" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your best moves.</text>
<text class="b" x="120" y="176" font-size="32">It is not a fixed bar. It changes from moment to moment.</text>
<g id="sm">
<circle class="gain" cx="360" cy="290" r="44"/>
<circle class="s-gain" cx="360" cy="290" r="64" fill="none" stroke-width="10" stroke-dasharray="8 17"/>
<path class="ink" d="M1240 246A44 44 0 1 0 1284 300A36 36 0 0 1 1240 246Z"/>
</g>
<g id="mm">
<path class="s-line" d="M430 290Q800 170 1170 290" fill="none" stroke-width="4" stroke-dasharray="10 12"/>
<text class="m" x="800" y="290" font-size="20" text-anchor="middle">MOMENT TO MOMENT</text>
<circle id="arcdot" class="gain" r="12"/>
</g>
<g id="rv"><g id="rp"></g><rect id="rbar" class="gain" x="400" y="686" width="70" height="0" rx="6"/>
<text class="m" x="385" y="730" font-size="22" text-anchor="middle">RESTED · HEALTHY</text></g>
<g id="tv"><g id="tp" transform="rotate(-8 1180 680)"></g><rect id="tbar" class="gain" x="1280" y="686" width="70" height="0" rx="6"/>
<text class="m" x="1265" y="730" font-size="22" text-anchor="middle">TIRED · SICK · UPSET</text></g>
<g id="both"><text class="d" x="800" y="820" font-size="48" text-anchor="middle">Both are genuinely your best.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too little.</text>
<text class="b" x="120" y="176" font-size="32">Holding back gives the inner Judge evidence against you.</text>
<g id="lb">
<text class="m" x="280" y="286" font-size="20" text-anchor="middle">YOUR BEST</text>
<rect class="s-muted" x="220" y="300" width="120" height="400" rx="8" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<rect id="lbar" class="loss" x="220" y="700" width="120" height="0" rx="8"/>
<text class="m" x="360" y="470" font-size="20" style="fill:var(--loss)">HOLDING BACK</text>
<g id="lp"></g>
</g>
<g id="jg">
<path class="s-loss" d="M680 610Q780 550 880 610" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="jp"></g>
<rect class="s-ink" x="900" y="560" width="460" height="150" rx="12" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="1130" y="645" font-size="22" text-anchor="middle">THE INNER JUDGE</text>
<rect class="ink" x="1150" y="544" width="70" height="16" rx="4"/>
<g id="gav"><path class="s-ink" d="M1210 522H1320" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="1160" y="500" width="50" height="44" rx="6"/></g>
</g>
<g id="gc">
<circle class="loss" cx="560" cy="392" r="34"/><circle class="loss" cx="610" cy="370" r="44"/><circle class="loss" cx="660" cy="394" r="32"/>
<rect class="loss" x="540" y="390" width="140" height="36" rx="18"/>
<g id="rain"></g>
<text class="m" x="600" y="770" font-size="22" text-anchor="middle">GUILT · REGRET · BLAME</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too much.</text>
<text class="b" x="120" y="176" font-size="32">Pushing past your best drains you, and the work gets worse.</text>
<g id="hb">
<rect class="gain" x="220" y="400" width="120" height="300"/>
<rect id="hhi" class="loss" x="220" y="400" width="120" height="0"/>
<rect class="s-muted" x="220" y="400" width="120" height="300" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="360" y="410" font-size="20">YOUR BEST</text>
<text class="m" x="360" y="280" font-size="20" style="fill:var(--loss)">PUSHED PAST</text>
</g>
<g id="eb">
<text class="m" x="600" y="410" font-size="22">ENERGY</text>
<rect class="s-ink" x="600" y="440" width="320" height="160" rx="16" fill="none" stroke-width="7"/>
<rect class="ink" x="920" y="490" width="18" height="60" rx="4"/>
<rect id="batl" class="gain" x="614" y="454" width="292" height="132" rx="8"/>
<text class="m" x="1060" y="410" font-size="22">QUALITY OF WORK</text>
<path class="s-ink" d="M1040 420V600H1460" fill="none" stroke-width="5"/>
<polyline id="qline" class="s-loss" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="suf"><text class="d" x="120" y="800" font-size="48">Overdoing it is just another way to suffer.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The master’s answer.</text>
<text class="b" x="120" y="176" font-size="32">A story Ruiz tells about trying too hard.</text>
<g id="tem">
<path class="ink" d="M140 400L330 290L520 400Z"/>
<rect class="ink" x="160" y="400" width="340" height="18"/>
<path class="ink" d="M190 418h30v262h-30zM272 418h30v262h-30zM354 418h30v262h-30zM436 418h30v262h-30z"/>
<rect class="ink" x="150" y="680" width="360" height="20"/>
<g id="mp"></g>
</g>
<g id="stu"><g id="up"></g>
<rect class="s-ink" x="940" y="300" width="300" height="90" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1000 390l10 40 30-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="1090" y="356" font-size="26" text-anchor="middle">HOW LONG?</text></g>
<g id="clk">
<text class="m" x="1330" y="440" font-size="22" text-anchor="middle">TWICE THE HOURS?</text>
<circle class="s-ink" cx="1330" cy="560" r="80" fill="var(--stage)" stroke-width="7"/>
<path id="h1" class="s-ink" d="M1330 560V500" stroke-width="6" stroke-linecap="round"/>
<path id="h2" class="s-gain" d="M1330 560h40" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="mb">
<rect class="s-loss" x="560" y="300" width="300" height="90" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-loss" d="M690 390l10 40 20-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="710" y="356" font-size="26" text-anchor="middle" style="fill:var(--loss)">EVEN LONGER</text></g>
<g id="live"><text class="d" x="120" y="800" font-size="52">We are here to <tspan style="fill:var(--gain)">live and enjoy</tspan>.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Action, not reward.</text>
<text class="b" x="120" y="176" font-size="32">Do it for the love of the action itself.</text>
<g id="pc"><g id="pcin">
<rect class="s-ink" x="120" y="240" width="380" height="150" rx="12" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="150" y="290" font-size="22">PAYCHECK</text>
<path class="s-line" d="M150 330h180M150 360h120" stroke-width="6" stroke-linecap="round"/>
<circle class="gain" cx="440" cy="330" r="26"/>
<g id="pcp"></g>
<path d="M298 496q12-10 24 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
</g></g>
<g id="cal"></g>
<g id="empt"><text class="m" x="580" y="580" font-size="22">…AND STILL EMPTY</text></g>
<g id="sw"><g id="swp"></g>
<path d="M1286 480q14 14 28 0" fill="none" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/>
<rect class="ink" x="1180" y="620" width="240" height="16" rx="6"/>
<path id="spk" class="s-gain" d="M1196 420h28M1210 406v28M1376 400h28M1390 386v28M1386 510h28M1400 496v28" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1300" y="690" font-size="22" text-anchor="middle">FOR THE LOVE OF IT</text></g>
<g id="pt"><text class="d" x="120" y="800" font-size="48">The reward stops being the point.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A quiet Judge.</text>
<text class="b" x="120" y="176" font-size="32">When you truly do your best, there is nothing to convict.</text>
<g id="sc">
<path class="s-ink" d="M350 640V300" stroke-width="8"/>
<rect class="ink" x="270" y="640" width="160" height="18" rx="6"/>
<g id="beam">
<path class="s-ink" d="M210 300H490M210 300L170 400M210 300L250 400M490 300L450 400M490 300L530 400" fill="none" stroke-width="4" stroke-linecap="round"/>
<path class="gain" d="M160 400h100q-50 40-100 0zM440 400h100q-50 40-100 0z"/>
</g>
<circle class="ink" cx="350" cy="300" r="12"/>
<text class="m" x="350" y="710" font-size="20" text-anchor="middle">NOTHING TO CONVICT</text>
</g>
<g id="oh">
<path class="gain" d="M760 540c-10-40 30-70 60-56 34 14 40 50 14 70-20 16-66 18-74-14z"/>
<path class="s-ink" d="M620 480l20 40Q800 660 960 520l20-40" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="710" font-size="20" text-anchor="middle">ACCEPTED, EVEN IMPERFECT</text>
</g>
<g id="fs">
<g id="stones"></g>
<rect class="gain" x="1060" y="560" width="380" height="90" rx="22"/>
<text class="m" x="1250" y="613" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">DO YOUR BEST</text>
<text class="m" x="1250" y="710" font-size="20" text-anchor="middle">KEEPS YOU PRACTISING</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Check in, then match your effort to your best right now.</text>
<g id="ci">
<rect class="s-ink" x="120" y="250" width="440" height="130" rx="40" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="340" y="305" font-size="22" text-anchor="middle">WHAT DOES MY BEST</text>
<text class="m" x="340" y="345" font-size="22" text-anchor="middle">LOOK LIKE RIGHT NOW?</text>
<circle class="s-ink" cx="240" cy="412" r="12" fill="var(--stage)" stroke-width="4"/>
<circle class="s-ink" cx="252" cy="456" r="8" fill="var(--stage)" stroke-width="4"/>
<g id="cip"></g>
</g>
<g id="dl">
<g id="arcs"></g>
<text class="m" x="800" y="400" font-size="20" text-anchor="middle" style="fill:var(--gain)">MATCH</text>
<text class="m" x="600" y="670" font-size="20" text-anchor="middle">LOWER</text>
<text class="m" x="1000" y="670" font-size="20" text-anchor="middle">HIGHER</text>
<path id="ndl" class="s-ink" d="M800 620h-160" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="800" cy="620" r="16"/>
</g>
<g id="cf">
<path id="wave" class="s-muted" fill="none" stroke-width="5" stroke-linecap="round"/>
<circle class="s-ink" cx="1270" cy="540" r="90" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1225 520q15 12 30 0M1285 520q15 12 30 0M1235 572q35 28 70 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1270" y="680" font-size="20" text-anchor="middle">QUIETER MIND</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Tonight, can you look back</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="88" letter-spacing="-2">and honestly say,</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2" style="fill:var(--gain)">“I did my best</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="88" letter-spacing="-2">with what I had”?</text></g>
<g id="ql"><text class="m" x="143" y="720" font-size="26">DO YOUR BEST · THEN LET IT BE ENOUGH</text></g>
<circle id="qkc" class="s-gain" cx="1320" cy="560" r="90" fill="none" stroke-width="10" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<path id="qk" class="s-gain" d="M1278 562l30 30 56-64" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>