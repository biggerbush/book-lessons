<g id="irr"><text class="d" x="260" y="360" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d5" x="760" y="300" font-size="34">From outside, it looks irrational.</text></g>
<g id="tix"><rect class="s-gain" x="780" y="560" width="320" height="140" rx="14" fill="var(--stage)" stroke-width="6"/><path class="s-gain" d="M870 570v120" stroke-width="4" stroke-dasharray="8 8"/>
