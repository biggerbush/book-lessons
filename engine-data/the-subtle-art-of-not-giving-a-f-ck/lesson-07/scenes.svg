<text class="m" x="1090" y="290" font-size="20">SAY YES TO ALL</text>
<path class="s-muted" d="M1100 360H1440M1100 420H1440M1100 480H1440M1100 540H1440M1100 600H1440" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1090" y="670" font-size="20" style="fill:var(--loss)">ALL THE SAME WEIGHT</text>
</g>
<g id="rejnot"><text class="d" x="120" y="800" font-size="44">Reject nothing, and nothing can really matter.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Go deep, not wide.</text>
<text class="b" x="120" y="176" font-size="32">One partner, one craft or one place lets you go deep.</text>
