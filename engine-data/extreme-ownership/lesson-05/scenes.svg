<circle class="s-ink" cx="220" cy="360" r="22" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="400" cy="480" r="22" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="580" cy="360" r="22" fill="var(--stage)" stroke-width="6"/></g>
