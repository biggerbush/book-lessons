<rect class="s-ink" x="1240" y="700" width="100" height="100" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d" x="1290" y="770" font-size="56" text-anchor="middle">#</text>
<rect class="s-ink" x="1360" y="700" width="100" height="100" rx="14" fill="var(--stage)" stroke-width="5"/><text class="m" x="1410" y="758" font-size="26" text-anchor="middle" style="fill:var(--ink)">GIF</text></g>
