<g id="s0">
<text class="m" x="120" y="150" font-size="28">SURROUNDED BY IDIOTS · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Red: the driven</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">decision-maker.</text>
<text class="b" x="120" y="600" font-size="32">How to talk to fast, driven people so they actually listen.</text>
<g id="sw">
<rect class="ink" x="1262" y="196" width="36" height="24" rx="6"/>
<path class="s-ink" d="M1280 220v18" stroke-width="10"/>
<circle class="s-ink" cx="1280" cy="350" r="112" fill="var(--stage)" stroke-width="8"/>
<path id="swarc" class="gain" fill-opacity=".35"/>
<line id="swh" class="s-ink" x1="1280" y1="350" x2="1280" y2="250" stroke-width="7" stroke-linecap="round"/>
<circle class="ink" cx="1280" cy="350" r="10"/>
</g>
<g id="rr"><text class="m" x="1280" y="530" font-size="26" text-anchor="middle">RUDE? OR <tspan style="fill:var(--gain)">RED?</tspan></text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the Red.</text>
<text class="b" x="120" y="176" font-size="32">Fast, driven people who want to get things done.</text>
<rect id="quad" class="gain" x="440" y="250" width="260" height="240" rx="16" fill-opacity=".22" opacity="0"/>
<g id="ax">
<path class="s-line" d="M160 500H700M430 250V750" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="420" y="272" font-size="20" text-anchor="end">TASK</text>
<text class="m" x="420" y="742" font-size="20" text-anchor="end">PEOPLE</text>
<text class="m" x="160" y="534" font-size="20">RESERVED</text>
<text class="m" x="700" y="534" font-size="20" text-anchor="end">OUTGOING</text>
</g>
<g id="redf"></g>
<g id="fl">
<text class="d" x="860" y="330" font-size="56">Results. Winning.</text>
<path class="s-line" d="M860 640H1460" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M1440 640V400" stroke-width="7" stroke-linecap="round"/>
<g id="chk"></g>
<circle id="runr" class="gain" cx="880" cy="616" r="22"/>
</g>
<g id="dec"><text class="d5" x="860" y="760" font-size="40">Decides fast. Moves on.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Task over talk.</text>
<text class="b" x="120" y="176" font-size="32">The job matters more than the chit-chat around it.</text>
<g id="tl"><rect class="s-ink" x="120" y="240" width="520" height="460" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="160" y="290" font-size="20">TO DO</text><g id="rows"></g></g>
<g id="cup">
<path class="s-ink" d="M980 480h220v110a70 70 0 0 1-70 70h-80a70 70 0 0 1-70-70z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M1200 510a40 40 0 0 1 0 80" fill="none" stroke-width="7"/>
<path class="s-ink" d="M930 690h320" stroke-width="7" stroke-linecap="round"/>
<path id="stm" class="s-muted" fill="none" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="chat"></g>
<g id="nx"><text class="m" x="1090" y="740" font-size="20" text-anchor="middle">SMALL TALK FEELS LIKE WASTED TIME</text></g>
<g id="nc1"><text class="d" x="120" y="820" font-size="46">Not coldness.</text></g>
<g id="nc2"><text class="d" x="480" y="820" font-size="46" style="fill:var(--gain)">Just how they prefer to work.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where Reds shine.</text>
<text class="b" x="120" y="176" font-size="32">Drive, courage, and a bias for action.</text>
<g id="p0"><rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="rk"><path id="flm" class="gain"/><path class="ink" d="M292 440l-36 60h40zM368 440l36 60h-40z"/><path class="s-ink" d="M330 290c44 44 52 130 40 210h-80c-12-80-4-166 40-210z" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="330" cy="390" r="18"/></g>
<text class="d" x="330" y="660" font-size="40" text-anchor="middle">Drive</text></g>
<g id="p1"><rect class="s-line" x="590" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M800 610V470M800 470L690 330M800 470L910 330" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path id="cr" class="s-gain" d="M800 610V470L910 330" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320" stroke-dashoffset="320"/>
<text class="d" x="800" y="660" font-size="40" text-anchor="middle">Makes the call</text></g>
<g id="p2"><rect class="s-line" x="1060" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<polygon class="s-ink" points="1100,600 1270,330 1440,600" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M1270 330v-60" stroke-width="5"/><path class="gain" d="M1270 270h44l-12 15 12 15h-44z"/>
<circle id="clb" class="gain" r="14" cx="1117" cy="557"/>
<text class="d" x="1270" y="660" font-size="40" text-anchor="middle">Pushes through</text></g>
<g id="ener"><text class="d" x="120" y="800" font-size="46">Deadlines and competition <tspan style="fill:var(--gain)">energize</tspan> them.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The shadow side.</text>
<text class="b" x="120" y="176" font-size="32">The same speed, turned up too high.</text>
<g id="fz">
<circle class="loss" cx="190" cy="330" r="50"/>
<path class="s-line" d="M240 330H640" stroke-width="6" stroke-dasharray="4 8"/>
<line id="fzl" class="s-ink" x1="232" y1="330" x2="640" y2="330" stroke-width="6" stroke-linecap="round"/>
<circle id="spk" class="gain" cx="640" cy="330" r="14"/>
<text class="m" x="140" y="430" font-size="22">IMPATIENT · BLUNT</text>
</g>
<g id="sb0"><rect class="s-muted" x="800" y="240" width="320" height="80" rx="40" fill="var(--stage)" stroke-width="4"/><text class="m" x="960" y="288" font-size="20" text-anchor="middle">SO, I WAS THINKING…</text></g>
<g id="sb1"><path class="gain" d="M1080 300h360a30 30 0 0 1 30 30v50a30 30 0 0 1-30 30H1180l-40 30v-30h-60a30 30 0 0 1-30-30v-50a30 30 0 0 1 30-30z"/>
<text class="d" x="1260" y="372" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">JUST DO IT.</text>
<text class="m" x="800" y="490" font-size="20">INTERRUPTS · GIVES ORDERS · SOUNDS AGGRESSIVE</text></g>
<g id="dz"><path class="s-line" d="M120 760H1480" stroke-width="5" stroke-linecap="round"/><g id="ppl"></g><g id="dzb"></g>
<text class="m" x="1480" y="820" font-size="20" text-anchor="end">STEAMROLLS SLOWER PEOPLE UNDER PRESSURE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">A typical meeting.</text>
<text class="b" x="120" y="176" font-size="32">Picture pitching an idea to a Red manager.</text>
<g id="room"><g id="rmp"></g><rect class="ink" x="260" y="556" width="1080" height="22" rx="6"/><text class="m" x="360" y="616" font-size="20" text-anchor="middle">YOU</text></g>
<g id="sld"></g>
<text id="scnt" class="m" x="680" y="526" font-size="22" text-anchor="middle">SLIDE 1 OF 20</text>
<g id="clk"><circle class="s-ink" cx="1200" cy="290" r="52" fill="var(--stage)" stroke-width="6"/>
<line id="ch1" class="s-ink" x1="1200" y1="290" x2="1200" y2="252" stroke-width="5" stroke-linecap="round"/>
<line id="ch2" class="s-ink" x1="1200" y1="290" x2="1226" y2="290" stroke-width="7" stroke-linecap="round"/></g>
<g id="att"><text class="m" x="1000" y="630" font-size="20">ATTENTION</text><rect x="1000" y="645" width="380" height="22" rx="11" fill="var(--line)"/><rect id="attf" x="1000" y="645" width="380" height="22" rx="11" fill="var(--gain)"/></g>
<g id="mg1"><text class="d5" x="120" y="720" font-size="40">The idea may have been great.</text></g>
<g id="mg2"><text class="d" x="120" y="780" font-size="40" style="fill:var(--loss)">The delivery lost them.</text></g>
<g id="mg3"><path class="s-muted" d="M900 800c80-80 160 40 240-30s160 50 240-40" fill="none" stroke-width="5" stroke-dasharray="8 10"/>
<path class="s-ink" d="M1380 730v-50" stroke-width="5"/><path class="gain" d="M1380 680h40l-10 12 10 12h-40z"/>
<text class="m" x="120" y="840" font-size="20">THEY WANTED THE DESTINATION, NOT THE WHOLE JOURNEY</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with the outcome.</text>
<text class="b" x="120" y="176" font-size="32">Erikson’s advice for talking to a Red.</text>
<g id="tgt"><circle class="s-ink" cx="300" cy="440" r="150" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="300" cy="440" r="100" fill="none" stroke-width="6"/><circle class="gain" cx="300" cy="440" r="50"/></g>
<g id="arw"><path class="s-ink" d="M0 0H200" stroke-width="8" stroke-linecap="round"/><path class="ink" d="M0 0l26-14v28z"/><path class="s-gain" d="M170 0l24-18M170 0l24 18M150 0l24-18M150 0l24 18" stroke-width="6" stroke-linecap="round"/></g>
<g id="cf"><text class="m" x="300" y="650" font-size="22" text-anchor="middle">CONCLUSION FIRST</text><text class="m" x="300" y="684" font-size="20" text-anchor="middle">SKIP THE WARM-UP</text></g>
<g id="nums"></g>
<g id="few"><text class="m" x="566" y="640" font-size="22">IN A FEW SENTENCES</text></g>
<g id="opt"><path class="s-muted" d="M1280 610V550M1280 550L1170 490M1280 550L1390 490" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="1080" y="300" width="180" height="180" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="1170" y="425" font-size="100" text-anchor="middle">A</text>
<rect id="cb" class="s-ink" x="1300" y="300" width="180" height="180" rx="18" fill="var(--stage)" stroke-width="5"/><text id="cbt" class="d" x="1390" y="425" font-size="100" text-anchor="middle">B</text>
<text class="m" x="1280" y="660" font-size="22" text-anchor="middle">REDS LIKE TO DECIDE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stand your ground.</text>
<text class="b" x="120" y="176" font-size="32">When a Red pushes back, don’t shrink.</text>
<g id="shd"><g id="you7"></g><path class="gain" d="M420 320l110 40v90c0 80-60 120-110 150c-50-30-110-70-110-150v-90z"/>
<text class="m" x="420" y="630" font-size="22" text-anchor="middle">DON’T SHRINK</text></g>
<g id="psh"><g id="pshi"></g></g>
<g id="hs"><path class="s-ink" d="M900 560L1080 460" stroke-width="30" stroke-linecap="round"/><path class="s-gain" d="M1400 560L1220 460" stroke-width="30" stroke-linecap="round"/>
<rect class="ink" x="1060" y="425" width="100" height="70" rx="30"/><rect class="gain" x="1140" y="425" width="100" height="70" rx="30"/>
<text class="m" x="1150" y="630" font-size="22" text-anchor="middle">RESPECT</text></g>
<g id="fcl"></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="88" letter-spacing="-2">Think of the most Red</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="88" letter-spacing="-2">person you know.</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">Put your main point</text></g>
<g id="qd"><text class="d" x="136" y="620" font-size="88" letter-spacing="-2">in the very <tspan style="fill:var(--gain)">first line.</tspan></text></g>
<text class="m" x="143" y="740" font-size="26">REWRITE YOUR NEXT MESSAGE TO THEM</text>
<g id="env"><g id="ltr"><rect class="s-ink" x="1290" y="658" width="150" height="104" fill="var(--stage)" stroke-width="4"/><rect class="gain" x="1305" y="670" width="120" height="14" rx="7"/><rect x="1305" y="694" width="90" height="10" rx="5" fill="var(--line)"/></g>
<rect class="s-ink" x="1270" y="650" width="190" height="118" rx="10" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1270 658l95 60 95-60" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
</g>