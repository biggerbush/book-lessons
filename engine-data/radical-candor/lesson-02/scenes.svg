<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Care personally,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">challenge directly.</text>
<text class="b" x="120" y="600" font-size="32">Why great bosses care deeply and still say hard things.</text>
<path class="s-line" d="M1160 540h320" stroke-width="5" stroke-linecap="round"/>
<g id="tppl"></g>
<g id="tb"><path d="M1250 230h150a20 20 0 0 1 20 20v60a20 20 0 0 1-20 20h-110l-40 30v-30a20 20 0 0 1-20-20v-60a20 20 0 0 1 20-20z" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><text class="d" x="1365" y="302" font-size="56" text-anchor="middle">!</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two things at once.</text>
<text class="b" x="120" y="176" font-size="32">Great bosses care personally and challenge directly, at the same time.</text>
<g id="ax"><path class="s-line" d="M440 240V760H1320" fill="none" stroke-width="4"/><path class="s-line" d="M870 250V760M440 500H1300" stroke-width="3" stroke-dasharray="8 10"/></g>
<line id="ca" class="s-ink" x1="440" y1="760" x2="440" y2="760" stroke-width="8" stroke-linecap="round"/>
<path id="cah" class="s-ink" d="M414 270l26-30 26 30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="cal"><text class="m" x="400" y="500" font-size="22" text-anchor="middle" transform="rotate(-90 400 500)">CARE PERSONALLY</text></g>
<line id="ha" class="s-ink" x1="440" y1="760" x2="440" y2="760" stroke-width="8" stroke-linecap="round"/>
<path id="hah" class="s-ink" d="M1290 734l30 26-30 26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="hal"><text class="m" x="880" y="815" font-size="22" text-anchor="middle">CHALLENGE DIRECTLY</text></g>
<g id="rc"><rect class="gain" x="890" y="260" width="380" height="220" rx="18"/><text class="d" x="1080" y="360" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">Radical</text><text class="d" x="1080" y="430" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">Candor.</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">See the whole person.</text>
<text class="b" x="120" y="176" font-size="32">Caring personally: a whole human, not just a job title.</text>
<circle id="ring" class="s-gain" cx="800" cy="500" r="190" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
<g id="wp"></g>
<g id="tag"><rect x="700" y="546" width="200" height="48" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="m" x="800" y="578" font-size="22" text-anchor="middle">JOB TITLE</text></g>
<g id="life"></g>
<g id="door"><text class="d" x="120" y="790" font-size="40">Work is personal. Don’t leave your humanity at the door.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Challenge directly.</text>
<text class="b" x="120" y="176" font-size="32">Say clearly when work isn’t good enough.</text>
<rect class="s-ink" x="160" y="240" width="340" height="440" rx="12" fill="var(--stage)" stroke-width="5"/>
<g id="doclines"></g>
<path id="mark" class="s-gain" d="M180 400a150 32 0 1 0 300 0a150 32 0 1 0-300 0" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round"/>
<g id="nge"><text class="m" x="330" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">NOT GOOD ENOUGH YET</text></g>
<g id="fork"><path class="s-ink" d="M820 680V520L700 330M820 520L940 330" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink" cx="700" cy="330" r="14"/><circle class="ink" cx="940" cy="330" r="14"/><text class="m" x="820" y="720" font-size="20" text-anchor="middle">HARD CALL</text></g>
<g id="pick"><path class="s-gain" d="M820 520L940 330" stroke-width="10" stroke-linecap="round"/><circle class="gain" cx="940" cy="330" r="20"/></g>
<g id="sad"><text class="m" x="1080" y="680" font-size="18" text-anchor="middle">DISAPPOINTED</text></g>
<g id="meter"><rect x="1260" y="260" width="80" height="420" rx="12" fill="none" stroke="var(--ink)" stroke-width="5"/><rect id="mfill" class="loss" x="1268" y="676" width="64" height="0"/><text class="m" x="1300" y="720" font-size="20" text-anchor="middle">DISCOMFORT</text></g>
<g id="avoid"><text class="d" x="120" y="810" font-size="40">That discomfort is why so many bosses avoid it.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Spinach in the teeth.</text>
<text class="b" x="120" y="176" font-size="32">Scott’s simple, everyday picture.</text>
<g id="face"><circle class="s-ink" cx="440" cy="470" r="200" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="370" cy="420" r="16"/><circle class="ink" cx="510" cy="420" r="16"/>
<path class="ink" d="M340 510h200q0 90-100 90q-100 0-100-90z"/><rect x="360" y="512" width="160" height="40" fill="var(--stage)"/><path class="s-ink" d="M400 512v40M440 512v40M480 512v40" stroke-width="4"/>
<path class="loss" d="M406 514h30l-5 22-10-9-9 17z"/><circle id="spr" class="s-loss" cx="421" cy="530" r="34" fill="none" stroke-width="4" stroke-dasharray="6 6"/></g>
<g id="meet"><text class="m" x="1360" y="285" font-size="20" text-anchor="middle">BIG MEETING</text><rect class="s-ink" x="1260" y="300" width="200" height="400" rx="6" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1430" cy="510" r="10"/><path class="s-muted" d="M680 720H1230M1214 706l16 14-16 14" fill="none" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/></g>
<g id="wh"><path d="M740 280h280a20 20 0 0 1 20 20v50a20 20 0 0 1-20 20h-140l-10 30-20-30h-110a20 20 0 0 1-20-20v-50a20 20 0 0 1 20-20z" fill="var(--stage)" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="880" y="337" font-size="34" text-anchor="middle">Psst… spinach.</text><g id="whp"></g></g>
<g id="silent"><text class="d" x="120" y="810" font-size="46">Staying silent protects you, not them.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">You need both.</text>
<text class="b" x="120" y="176" font-size="32">Care without challenge, or challenge without care, both fail.</text>
<g id="sc5"><path class="s-ink" d="M800 360V700" stroke-width="8"/><rect class="ink" x="700" y="700" width="200" height="14" rx="7"/>
<path id="beam" class="s-ink" d="M500 360H1100" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="800" cy="360" r="14"/><g id="pl"></g><g id="pr"></g></g>
<g id="lt"><text class="m" x="507" y="660" font-size="22" text-anchor="middle">SAME MISTAKES</text><text class="m" x="507" y="690" font-size="22" text-anchor="middle">KEEP HAPPENING</text></g>
<g id="storm"><circle class="loss" cx="1260" cy="250" r="40"/><circle class="loss" cx="1310" cy="230" r="50"/><circle class="loss" cx="1360" cy="255" r="38"/><rect class="loss" x="1250" y="250" width="110" height="40" rx="20"/><path id="bolt" class="s-loss" d="M1315 300l-20 44h26l-18 46" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
<g id="rt"><text class="m" x="1093" y="660" font-size="22" text-anchor="middle">FEELS LIKE AN ATTACK</text><text class="m" x="1093" y="690" font-size="22" text-anchor="middle">PEOPLE STOP LISTENING</text></g>
<g id="side"><text class="d" x="120" y="800" font-size="40">When people know you’re on their side, hard truths help.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What you say, not who you are.</text>
<text class="b" x="120" y="176" font-size="32">Judge each conversation, not yourself or others.</text>
<g id="bubs"></g>
<g id="mir"><ellipse class="s-ink" cx="380" cy="580" rx="120" ry="160" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M380 740V770M320 770h120" stroke-width="8" stroke-linecap="round"/><g id="mirp"></g></g>
<g id="lab"><rect x="512" y="536" width="316" height="70" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><text class="m" x="670" y="581" font-size="24" text-anchor="middle">“I’M JUST BLUNT”</text></g>
<g id="lx"><circle class="loss" cx="868" cy="571" r="26"/><path d="M858 561l20 20m0-20l-20 20" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="lis"><g id="lisp"></g><path id="larr" class="s-ink" d="M1040 560H1290" stroke-width="5" stroke-dasharray="12 10"/><path class="s-ink" d="M1280 546l14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="980" y="730" font-size="20" text-anchor="middle">WHAT YOU MEANT</text><text class="m" x="1360" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">HOW IT LANDS</text></g>
<g id="meas"><text class="d" x="120" y="830" font-size="40">Candor is measured by how the listener hears it.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it this week.</text>
<text class="b" x="120" y="176" font-size="32">Three small steps.</text>
<g id="k0"><rect class="s-line" x="120" y="230" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="240" y="290" width="200" height="180" rx="10" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="240" y="290" width="200" height="44" rx="8"/><g id="cal7"></g>
<text class="m" x="340" y="540" font-size="20" text-anchor="middle">STEP 1</text><text class="d5" x="340" y="600" font-size="30" text-anchor="middle">Pick one person</text><text class="d5" x="340" y="645" font-size="30" text-anchor="middle">you work with.</text></g>
<g id="k1"><rect class="s-line" x="580" y="230" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M720 340h140v90a40 40 0 0 1-40 40h-60a40 40 0 0 1-40-40z"/><path class="s-ink" d="M860 360a30 30 0 0 1 0 60M700 486h180" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="st0" class="s-muted" d="M760 320q-12-18 0-36t0-36" fill="none" stroke-width="5" stroke-linecap="round"/><path id="st1" class="s-muted" d="M790 320q-12-18 0-36t0-36" fill="none" stroke-width="5" stroke-linecap="round"/><path id="st2" class="s-muted" d="M820 320q-12-18 0-36t0-36" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="800" y="540" font-size="20" text-anchor="middle">STEP 2</text><text class="d5" x="800" y="600" font-size="30" text-anchor="middle">Ask about their life</text><text class="d5" x="800" y="645" font-size="30" text-anchor="middle">beyond the project.</text></g>
<g id="k2"><rect class="s-line" x="1040" y="230" width="440" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><g transform="rotate(-4 1260 380)"><rect class="s-ink" x="1160" y="290" width="200" height="180" rx="8" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M1185 340h150M1185 380h120M1185 420h140" stroke-width="7" stroke-linecap="round"/><path class="s-gain" d="M1185 446h100" stroke-width="7" stroke-linecap="round"/></g>
<text class="m" x="1260" y="540" font-size="20" text-anchor="middle">STEP 3</text><text class="d5" x="1260" y="600" font-size="30" text-anchor="middle">Name one thing to</text><text class="d5" x="1260" y="645" font-size="30" text-anchor="middle">improve, kindly</text><text class="d5" x="1260" y="690" font-size="30" text-anchor="middle">and clearly.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="260" font-size="76" letter-spacing="-2">Who on your team has <tspan style="fill:var(--loss)">spinach</tspan></text></g>
<g id="qb"><text class="d" x="136" y="360" font-size="76" letter-spacing="-2">in their teeth right now?</text></g>
<g id="qc"><text class="d" x="136" y="460" font-size="76" letter-spacing="-2">And what is stopping you</text></g>
<g id="qd"><text class="d" x="136" y="560" font-size="76" letter-spacing="-2">from <tspan style="fill:var(--gain)">telling them</tspan>?</text></g>
<text class="m" x="143" y="680" font-size="26">SAY IT KINDLY. SAY IT CLEARLY.</text>
<g id="tooth"><g transform="translate(-70 -90)"><path d="M1300 650q70-30 140 0q20 70-15 120l-15 60q-12 14-22-2l-18-58-18 58q-10 16-22 2l-15-60q-35-50-15-120z" fill="var(--stage)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/><path id="spn" class="loss" d="M1340 668h40l-8 26-10-10-10 18z"/></g></g>
</g>