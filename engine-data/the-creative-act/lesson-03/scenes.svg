<g id="f1"><circle class="gain" cx="868" cy="590" r="18"/><text class="d" x="930" y="606" font-size="44">Moving light</text></g>
<g id="f2"><rect class="gain" x="840" y="668" width="18" height="30" fill-opacity=".4"/><rect class="gain" x="862" y="668" width="18" height="30" fill-opacity=".7"/><rect class="gain" x="884" y="668" width="18" height="30"/><text class="d" x="930" y="696" font-size="44">Many subtle shades</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">No judging.</text>
<text class="b" x="120" y="176" font-size="32">The other trap: labelling what we notice as good or bad.</text>
<g id="items"></g>
<g id="pills"></g>
<g id="lensw"><g id="lens5"><circle class="s-ink" r="80" fill="var(--stage)" fill-opacity=".25" stroke-width="12"/><path class="s-ink" d="M58 58l60 60" stroke-width="20" stroke-linecap="round"/></g></g>
<g id="later"><text class="d5" x="120" y="660" font-size="40">You can sort things later.</text></g>
<g id="look"><text class="d" x="120" y="740" font-size="56">For now, just look.</text></g>
<g id="door5"><text id="dlab" class="m" x="1310" y="300" font-size="22" text-anchor="middle">JUDGMENT CLOSES IT</text><rect class="s-ink" x="1180" y="320" width="260" height="440" fill="var(--gain)" fill-opacity=".25" stroke-width="6"/><polygon id="dpan" class="s-ink" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/></g>
<g id="curio"><text class="m" x="1310" y="810" font-size="20" text-anchor="middle" style="fill:var(--gain)">CURIOSITY KEEPS IT OPEN</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">A daily practice.</text>
<text class="b" x="120" y="176" font-size="32">Awareness grows through small daily repetitions.</text>
<g id="med"><circle id="ring" class="s-gain" cx="300" cy="470" r="140" fill="none" stroke-width="4" stroke-dasharray="6 10"/><circle class="ink" cx="300" cy="400" r="34"/><path class="ink" d="M245 545Q245 448 300 448Q355 448 355 545Z"/><ellipse class="ink" cx="300" cy="560" rx="115" ry="32"/><circle class="gain" cx="215" cy="540" r="14"/><circle class="gain" cx="385" cy="540" r="14"/><text class="m" x="300" y="720" font-size="22" text-anchor="middle">A LONG-TIME MEDITATOR</text></g>
