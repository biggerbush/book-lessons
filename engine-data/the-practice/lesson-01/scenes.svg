<g id="newb"><circle class="gain" cx="690" cy="370" r="26"/><path class="s-gain" d="M730 370h50m-14-14 14 14-14 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="800" y="344" width="52" height="52" rx="6"/></g>
<g id="tchr"></g>
<path class="s-ink" d="M925 410L890 385" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="629" y="600" font-size="40">Teaching</text>
<text class="m" x="629" y="650" font-size="20">A TEACHER REDESIGNING</text>
<text class="m" x="629" y="680" font-size="20">A LESSON</text>
</g>
<g id="card2">
<rect class="s-line" x="1066" y="230" width="414" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="1110" y="340" width="60" height="60" rx="8"/><rect class="ink" x="1240" y="340" width="60" height="60" rx="8"/><rect class="ink" x="1370" y="340" width="60" height="60" rx="8"/>
<path class="s-ink" d="M1170 370h70" stroke-width="6"/>
