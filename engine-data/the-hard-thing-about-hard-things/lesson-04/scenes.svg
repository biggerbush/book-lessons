<path class="s-loss" d="M1150 430a55 55 0 0 1 40-95a75 75 0 0 1 140-10a55 55 0 0 1 40 105z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="1215" y="410" font-size="52" style="fill:var(--loss)">?</text><text class="d" x="1265" y="390" font-size="52" style="fill:var(--loss)">?</text><text class="d" x="1315" y="410" font-size="52" style="fill:var(--loss)">?</text>
</g>
<g id="worried"></g>
<g id="guess"><text class="d" x="120" y="810" font-size="44">Days spent guessing instead of working.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Own the reason.</text>
<text class="b" x="120" y="176" font-size="32">A missed plan is a failure of leadership.</text>
<circle class="s-ink" cx="300" cy="440" r="130" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="300" cy="440" r="85" fill="none" stroke-width="6"/>
<circle class="s-ink" cx="300" cy="440" r="40" fill="none" stroke-width="6"/>
<circle class="ink" cx="300" cy="440" r="12"/>
<text class="m" x="300" y="620" font-size="20" text-anchor="middle">THE PLAN</text>
<g id="arw"><path class="s-loss" d="M470 300L590 220M590 220l-6-26M590 220l26 4" fill="none" stroke-width="7" stroke-linecap="round"/><circle class="loss" cx="470" cy="300" r="7"/></g>
<g id="missd"><text class="m" x="490" y="350" font-size="22" style="fill:var(--loss)">MISSED</text></g>
<g id="notp"><text class="m" x="640" y="380" font-size="26">NOT THE PEOPLE LEAVING</text></g>
<line id="stk" class="s-ink" x1="632" y1="371" x2="632" y2="371" stroke-width="5" stroke-linecap="round"/>
<g id="lead1"><text class="d" x="640" y="470" font-size="48" style="fill:var(--gain)">Leadership failed.</text></g>
<g id="pod"><g id="lead"></g><path class="ink" d="M1215 400H1365L1345 540H1235Z"/></g>
<g id="aud"></g>
<g id="clear"><text class="d" x="120" y="790" font-size="44">Say it clearly, to the whole company.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Managers tell their own people.</text>
<text class="b" x="120" y="176" font-size="32">Not HR. Not a stranger.</text>
<g id="pL">
<rect class="s-line" x="120" y="230" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22" style="fill:var(--gain)">YOUR MANAGER</text>
<g id="pl"></g>
<rect class="s-gain" x="380" y="300" width="120" height="60" rx="20" fill="var(--stage)" stroke-width="5"/>
<g id="dots"></g>
<text class="m" x="440" y="600" font-size="20" text-anchor="middle">FACE TO FACE</text>
</g>
<g id="pR">
<rect class="s-line" x="840" y="230" width="640" height="400" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="22">HR OR A STRANGER</text>
<g id="pr"></g>
<path class="loss" d="M1080 450v-12h44l8 12z"/><rect class="loss" x="1080" y="450" width="120" height="90" rx="6"/>
<text class="m" x="1160" y="600" font-size="20" text-anchor="middle">HANDED OFF</text>
</g>
<g id="cruel"><text class="m" x="1180" y="350" font-size="20" text-anchor="middle" style="fill:var(--loss)">NOT WORTH MY BOSS’S TIME?</text></g>
<g id="chk"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stay visible.</text>
<text class="b" x="120" y="176" font-size="32">Be out among people, not behind a closed door.</text>
<rect class="s-ink" x="200" y="260" width="220" height="380" fill="var(--stage)" stroke-width="7"/>
<g id="ldr"></g>
<rect id="door" class="s-ink" x="204" y="264" width="212" height="372" fill="var(--line)" stroke-width="5"/>
<text class="m" x="310" y="690" font-size="20" text-anchor="middle">NO CLOSED DOOR</text>
<g id="others" opacity=".5"></g>
<g id="lvrg"><g id="lvr"></g></g>
<g id="shake"><path class="s-gain" d="M760 495H858" stroke-width="12" stroke-linecap="round"/><path class="s-ink" d="M950 495H866" stroke-width="12" stroke-linecap="round"/></g>
<g id="thx"><rect class="s-gain" x="790" y="280" width="160" height="60" rx="20" fill="var(--stage)" stroke-width="5"/><text class="m" x="870" y="318" font-size="20" text-anchor="middle" style="fill:var(--gain)">THANK YOU</text></g>
<g id="mat"><text class="d" x="120" y="790" font-size="44">Showing up says their work truly mattered.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone who stays is watching.</text>
<text class="b" x="120" y="176" font-size="32">Trust is the bridge between them and you.</text>
<g id="exit"><rect class="s-loss" x="120" y="240" width="140" height="50" rx="8" fill="var(--stage)" stroke-width="4"/><text class="m" x="190" y="273" font-size="22" text-anchor="middle" style="fill:var(--loss)">← EXIT</text></g>
<path d="M120 560H460V740Q460 760 440 760H140Q120 760 120 740Z" fill="var(--line)"/>
<path d="M1140 560H1480V740Q1480 760 1460 760H1160Q1140 760 1140 740Z" fill="var(--line)"/>
<rect class="s-ink" x="1230" y="380" width="160" height="180" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1265 420h30M1325 420h30M1265 470h30M1325 470h30" stroke-width="10"/>
<text class="m" x="1310" y="620" font-size="20" text-anchor="middle">COMPANY</text>
<g id="surv"></g>
<g id="brg">
<rect id="bl" x="460" y="556" width="340" height="14" fill="var(--gain)"/>
<rect id="br" x="800" y="556" width="340" height="14" fill="var(--gain)"/>
<text id="trl" class="m" x="800" y="530" font-size="22" text-anchor="middle" style="fill:var(--gain)">TRUST</text>
</g>
<g id="tA"><text class="d" x="800" y="810" font-size="36" text-anchor="middle">They’ll treat us fairly too.</text></g>
<g id="tB"><text class="d" x="800" y="810" font-size="36" text-anchor="middle" style="fill:var(--loss)">Best people look for the exit.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Will you deliver it</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">yourself, quickly,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and <tspan style="fill:var(--gain)">face to face</tspan>?</text></g>
<g id="env"><g id="envb"><rect class="gain" x="1220" y="360" width="220" height="150" rx="10"/><path d="M1220 364l110 80 110-80" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linejoin="round"/></g></g>
<g id="think"><text class="m" x="143" y="700" font-size="26">THINK OF THE HARDEST MESSAGE YOU MIGHT DELIVER</text></g>
</g>