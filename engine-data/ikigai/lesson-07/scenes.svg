<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="76" letter-spacing="-2">What imperfect moment</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="76" letter-spacing="-2">today will you savour,</text></g>
