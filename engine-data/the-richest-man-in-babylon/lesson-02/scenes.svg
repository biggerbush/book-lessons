<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">A part of all you</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">earn is yours.</text>
<text class="b" x="120" y="600" font-size="32">Why the first coin you earn should go to you.</text>
