<g id="s0">
<text class="m" x="120" y="150" font-size="28">HIDDEN POTENTIAL · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Be a sponge,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a rock.</text>
<text class="b" x="120" y="600" font-size="32">Why the best learners soak up knowledge and ask for advice</text>
<polygon id="water" class="loss" fill-opacity=".16"/>
<g id="spg0"></g>
<polygon id="rock0" class="ink" points="-50,30 -40,-20 -5,-38 40,-25 52,20 30,34"/>
<path class="s-ink" d="M1140 300L1180 620H1420L1460 300" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g id="lb0"><text class="m" x="1240" y="680" font-size="22" text-anchor="middle" style="fill:var(--gain)">SOAKS IT UP</text><text class="m" x="1370" y="680" font-size="22" text-anchor="middle">SAME</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rocks and sponges.</text>
<text class="b" x="120" y="176" font-size="32">Ideas splash around a rock. A sponge soaks them in.</text>
<path class="s-line" d="M240 640H1140" stroke-width="5" stroke-linecap="round"/>
<g id="rp1"><g id="rpf"></g><text class="d5" x="420" y="700" font-size="32" text-anchor="middle">Rock</text><text class="m" x="420" y="736" font-size="20" text-anchor="middle">LITTLE SINKS IN</text></g>
<g id="sp1"><g id="spf"></g><text class="d5" x="1000" y="700" font-size="32" text-anchor="middle">Sponge</text><text class="m" x="1000" y="736" font-size="20" text-anchor="middle">SOAKS IT IN</text></g>
<g id="dr1"></g>
<g id="gro1"><path id="gl" class="s-gain" d="M1250 640V320" stroke-width="10" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330"/><path id="gh" class="s-gain" d="M1218 352L1250 316L1282 352" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1250" y="700" font-size="24" text-anchor="middle" style="fill:var(--gain)">IMPROVEMENT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Soak it up actively.</text>
<text class="b" x="120" y="176" font-size="32">Sponges go looking for knowledge on purpose.</text>
<g id="me2"></g>
<path id="arm" class="s-gain" stroke-width="14" stroke-linecap="round" fill="none"/>
<circle id="hand" class="gain" cy="480" r="18"/>
<g id="q2"><rect class="s-ink" x="330" y="220" width="130" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d" x="395" y="300" font-size="76" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<path id="r20" class="s-gain" d="M800 480L1015 320" stroke-width="4" stroke-dasharray="8 8"/>
<path id="r21" class="s-gain" d="M800 480L1050 490" stroke-width="4" stroke-dasharray="8 8"/>
<path id="r22" class="s-gain" d="M800 480L1030 640" stroke-width="4" stroke-dasharray="8 8"/>
<g id="t20"><path class="ink" d="M1100 290c-20-14-50-14-70-6v70c20-8 50-8 70 6 20-14 50-14 70-6v-70c-20-8-50-8-70 6z"/><path d="M1100 290v70" stroke="var(--stage)" stroke-width="4"/><text class="m" x="1200" y="330" font-size="20">BOOKS</text></g>
<g id="t21"><g id="ex2"></g><text class="m" x="1160" y="500" font-size="20">PEOPLE WHO KNOW MORE</text></g>
<g id="t22"><rect class="ink" x="1040" y="610" width="90" height="56" rx="16"/><rect class="s-ink" x="1080" y="640" width="90" height="56" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="1200" y="670" font-size="20">EVERY CONVERSATION</text></g>
<g id="pro2"><rect class="gain" x="120" y="740" width="620" height="90" rx="45"/><text class="d" x="430" y="800" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Proactivity in action.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Filter what you absorb.</text>
<text class="b" x="120" y="176" font-size="32">Not all input deserves equal weight.</text>
<g id="sq"></g>
<g id="pl3"><rect id="tp3" class="ink" x="290" width="280" height="16" rx="8"/><rect id="bp3" class="ink" x="290" width="280" height="16" rx="8"/></g>
<g id="gd3"></g>
<g id="sl3"><text class="m" x="430" y="780" font-size="22" text-anchor="middle">SQUEEZED OUT</text></g>
<path id="aa3" class="s-gain" d="M1195 370L590 400" stroke-width="10" stroke-linecap="round"/>
<path id="ab3" class="s-muted" d="M1195 625L590 480" stroke-width="3" stroke-dasharray="8 10"/>
<g id="va3"><g id="vaf"></g><text class="m" x="1250" y="470" font-size="20" text-anchor="middle" style="fill:var(--gain)">CREDIBLE + CARING</text></g>
<g id="vb3"><g id="vbf"></g><text class="m" x="1250" y="730" font-size="20" text-anchor="middle">LESS WEIGHT</text></g>
<g id="ck3"><path class="s-gain" d="M700 744l12 12 24-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="750" y="760" font-size="34">Knows the subject</text></g>
<g id="ck3b"><path class="s-gain" d="M700 804l12 12 24-26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="750" y="820" font-size="34">Genuinely cares about your growth</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The feedback problem.</text>
<text class="b" x="120" y="176" font-size="32">Feedback invites people to judge what you already did.</text>
<g id="fb4"><rect class="s-ink" x="160" y="250" width="320" height="430" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="260" y="230" width="120" height="40" rx="10"/><text class="m" x="320" y="330" font-size="24" text-anchor="middle">FEEDBACK</text><path class="s-line" d="M200 390h240M200 450h240M200 510h240M200 570h240M200 630h160" stroke-width="6" stroke-linecap="round"/></g>
<g id="jd4"><g id="jdf"></g><path class="s-ink" d="M880 500V330" stroke-width="8" stroke-linecap="round"/><rect class="s-ink" x="840" y="230" width="260" height="100" rx="12" fill="var(--stage)" stroke-width="5"/><g id="stars"></g></g>
<g id="pa4"><path class="s-muted" d="M760 620H515M545 596l-30 24 30 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="520" y="670" font-size="20">WHAT YOU ALREADY DID</text></g>
<g id="b41"><rect class="s-ink" x="1140" y="250" width="340" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="ink" transform="translate(1160 275)" d="M0 22h12v28H0zM16 50V22l10-20c6 0 9 4 8 10l-3 10h15c5 0 7 5 5 9l-6 16c-1 3-3 4-6 4z"/><text class="d5" x="1235" y="314" font-size="34">“Nice job!”</text><text class="m" x="1140" y="384" font-size="20">VAGUE PRAISE</text></g>
<g id="b42"><rect class="s-ink" x="1140" y="430" width="340" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="loss" transform="translate(1210 528) rotate(180)" d="M0 22h12v28H0zM16 50V22l10-20c6 0 9 4 8 10l-3 10h15c5 0 7 5 5 9l-6 16c-1 3-3 4-6 4z"/><text class="d5" x="1235" y="494" font-size="34">“A bit long?”</text><text class="m" x="1140" y="564" font-size="20">POLITE CRITICISM</text></g>
<g id="cr4"><text class="d" x="120" y="800" font-size="46">They become critics of the past.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask for advice instead.</text>
<text class="b" x="120" y="176" font-size="32">Same work, two simple requests.</text>
<g id="pl5"><rect class="s-line" x="120" y="220" width="620" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="150" y="250" width="560" height="90" rx="45" fill="var(--stage)" stroke-width="5"/><text class="d5" x="430" y="308" font-size="38" text-anchor="middle">“Any feedback?”</text></g>
<g id="pr5"><rect class="s-line" x="860" y="220" width="620" height="440" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="gain" x="890" y="250" width="560" height="90" rx="45"/><text class="d5" x="1170" y="308" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">“Any advice?”</text></g>
<g id="vl5"><rect x="190" y="410" width="300" height="20" rx="10" fill="var(--line)"/><rect x="190" y="460" width="180" height="20" rx="10" fill="var(--line)"/><text class="m" x="190" y="620" font-size="20">GENERAL, OFTEN VAGUE</text></g>
<g id="cl5"></g>
<g id="ul5"><text class="m" x="900" y="620" font-size="20" style="fill:var(--gain)">MORE SPECIFIC · MORE USEFUL</text></g>
<g id="al5"><path class="s-muted" d="M700 730H165M195 706l-30 24 30 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="160" y="790" font-size="22">BACK AT WHAT YOU ALREADY DID</text></g>
<g id="ar5"><path class="s-gain" d="M900 730H1425M1395 704l30 26-30 26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="900" y="790" font-size="22" style="fill:var(--gain)">TOWARD WHAT YOU COULD DO NEXT TIME</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">From critic to coach.</text>
<text class="b" x="120" y="176" font-size="32">The same person, a different request.</text>
