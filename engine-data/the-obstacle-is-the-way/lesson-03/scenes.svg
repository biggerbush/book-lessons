<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Focus only on what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you control.</text>
<g id="t0sub"><text class="b" x="120" y="600" font-size="32">Stop fighting what you can’t change. Pour yourself into what you can.</text></g>
<circle class="s-loss" cx="1290" cy="380" r="150" fill="none" stroke-width="5" stroke-dasharray="12 12"/>
<g id="t0dots"></g>
<circle id="t0core" class="gain" cx="1290" cy="380" r="56"/>
<text class="m" x="1290" y="388" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">YOU</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">All that heat changes nothing.</text>
<text class="b" x="120" y="176" font-size="32">Fuming at what you can’t control only drains you.</text>
<g id="a1">
<rect class="s-line" x="120" y="230" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="20">STUCK IN TRAFFIC</text>
<g id="a1p"></g>
<circle class="s-ink" cx="440" cy="560" r="64" fill="var(--stage)" stroke-width="10"/>
<path class="s-ink" d="M376 560h128M440 560v64" stroke-width="8"/>
<g id="steam"><path class="s-loss" d="M400 350q-12-12 0-24t0-24M440 345q-12-12 0-24t0-24M480 350q-12-12 0-24t0-24" fill="none" stroke-width="5" stroke-linecap="round"/></g>
</g>
<g id="a2">
<rect class="s-line" x="840" y="230" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="280" font-size="20">REPLAYING THE BOSS’S DECISION</text>
<rect class="ink" x="900" y="560" width="520" height="24" rx="8"/>
<path class="s-ink" d="M910 584v40M1410 584v40" stroke-width="8" stroke-linecap="round"/>
<rect class="s-line" x="910" y="510" width="90" height="46" rx="14" fill="none" stroke-width="5"/>
<circle class="ink" cx="960" cy="500" r="30"/>
<path class="ink" d="M990 520h300a20 20 0 0 1 0 40h-300z"/>
<g id="cloud"><circle class="loss" cx="1120" cy="400" r="42"/><circle class="loss" cx="1180" cy="375" r="55"/><circle class="loss" cx="1245" cy="405" r="38"/><rect class="loss" x="1080" y="400" width="200" height="42" rx="21"/><path class="s-ink" d="M1185 450l-20 30h26l-18 28" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g>
</g>
<g id="ebarg">
<rect class="s-ink" x="120" y="700" width="900" height="44" rx="10" fill="none" stroke-width="5"/>
<rect id="ebar" class="gain" x="128" y="708" width="884" height="28" rx="6"/>
<text class="m" x="1050" y="732" font-size="22">YOUR ENERGY</text>
</g>
<g id="fix"><text class="d" x="120" y="830" font-size="44">The fix: one simple sorting job.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Epictetus drew a line.</text>
<text class="b" x="120" y="176" font-size="32">A Stoic teacher who was born into slavery.</text>
<g id="ep"></g>
<g id="chain2"></g>
<g id="own"><text class="m" x="330" y="720" font-size="20" text-anchor="middle">OWNED ALMOST NOTHING,</text><text class="m" x="330" y="752" font-size="20" text-anchor="middle">NOT EVEN HIS OWN BODY</text></g>
<line id="divl" class="s-gain" x1="1050" y1="250" x2="1050" y2="250" stroke-width="8" stroke-linecap="round"/>
<g id="upl"><text class="d5" x="1010" y="320" font-size="44" text-anchor="end" style="fill:var(--gain)">Up to us</text><circle class="gain" cx="860" cy="520" r="80"/></g>
<g id="upr"><text class="d5" x="1090" y="320" font-size="44" style="fill:var(--loss)">Not up to us</text><g id="lossdots"></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two piles.</text>
<text class="b" x="120" y="176" font-size="32">What is up to you, and what is not.</text>
<text class="m" x="140" y="256" font-size="22" style="fill:var(--gain)">UP TO YOU</text>
<text class="m" x="860" y="256" font-size="22" style="fill:var(--loss)">NOT UP TO YOU</text>
<path class="s-line" d="M800 230v560" stroke-width="4" stroke-dasharray="8 10"/>
<g id="pl"></g><g id="pr"></g>
<g id="pw"><path class="s-loss" d="M1080 690v-56m-20 20 20-20 20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="860" y="760" font-size="44" style="fill:var(--loss)">Energy here is wasted.</text></g>
<g id="pp"><path class="s-gain" d="M360 690v-56m-20 20 20-20 20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="140" y="760" font-size="44" style="fill:var(--gain)">Energy here is power.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rubin “Hurricane” Carter.</text>
<text class="b" x="120" y="176" font-size="32">A top boxer, wrongly convicted of triple murder.</text>
<g id="bx"></g>
<g id="cell"><rect class="s-ink" x="230" y="250" width="380" height="500" fill="none" stroke-width="8"/><g id="bars"></g></g>
<g id="oh"></g>
<g id="ohx"><text class="m" x="760" y="740" font-size="24" style="fill:var(--loss)">ALL OUT OF HIS HANDS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">He kept the one thing still his.</text>
<text class="b" x="120" y="176" font-size="32">Carter refused to hand it over.</text>
<g id="k0">
<rect class="s-line" x="120" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="20">REFUSED THE UNIFORM</text>
<path class="loss" transform="translate(327 470)" d="M-30-80l-70 40 25 45 35-20v115h80V-15l35 20 25-45-70-40q-30 25-60 0z"/>
<path id="k0x" class="s-ink" d="M247 390l160 160M407 390l-160 160" stroke-width="10" stroke-linecap="round"/>
<text class="d5" x="150" y="670" font-size="34">Not a prisoner.</text>
</g>
<g id="k1">
<rect class="s-line" x="593" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="623" y="280" font-size="20">STUDIED LAW, READ WIDELY</text>
<g id="bks"></g>
<text class="d5" x="623" y="670" font-size="34">Hours of study.</text>
</g>
<g id="k2">
<rect class="s-line" x="1066" y="230" width="414" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1096" y="280" font-size="20">CONVICTION OVERTURNED</text>
<rect class="gain" x="1178" y="340" width="190" height="260" fill-opacity=".35"/>
<g id="walker"></g>
<polygon id="leaf" class="ink" points="1178,340 1368,340 1368,600 1178,600"/>
<rect class="s-ink" x="1178" y="340" width="190" height="260" fill="none" stroke-width="7"/>
<text id="yrs" class="d" x="1096" y="680" font-size="60" style="fill:var(--gain)">19 years</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your energy is limited.</text>
<text class="b" x="120" y="176" font-size="32">Attention is a battery with a fixed charge.</text>
<g id="bat"><rect class="s-ink" x="160" y="300" width="440" height="180" rx="20" fill="none" stroke-width="8"/><rect class="ink" x="600" y="355" width="30" height="70" rx="6"/><g id="cells"></g><text class="m" x="160" y="540" font-size="20">FIXED CHARGE</text></g>
<g id="drn"><text class="m" x="160" y="600" font-size="20" style="fill:var(--loss)">EVERY MINUTE OF RAGE DRAINS IT</text></g>
<g id="spot">
<rect class="s-loss" x="760" y="430" width="720" height="340" rx="18" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="1460" y="470" font-size="20" text-anchor="end" style="fill:var(--loss)">CAN’T MOVE</text>
<g id="spdots"></g>
<polygon id="cone" class="gain" points="1410,262 985,615 1135,665" fill-opacity=".25"/>
<circle class="ink" cx="1410" cy="262" r="24"/>
<circle class="gain" cx="1060" cy="640" r="70"/>
<text class="m" x="1060" y="647" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">CAN MOVE</text>
</g>
<g id="always"><text class="d" x="120" y="840" font-size="42">Smaller than we want, but always there.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sort, then act.</text>
<text class="b" x="120" y="176" font-size="32">When trouble hits, ask one question.</text>
<g id="qcard"><rect class="gain" x="120" y="230" width="620" height="150" rx="20"/><g id="qtxt"><text class="d" x="160" y="325" font-size="54" style="fill:var(--on-gain)">Is this up to me?</text></g></g>
<g id="bL"><path class="gain" d="M260 600h380l-30 160h-320z"/><text class="m" x="450" y="702" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">UP TO ME</text></g>
<g id="bR"><path id="bRo" class="s-ink" d="M960 600h380l-30 160h-320z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1150" y="702" font-size="24" text-anchor="middle" style="fill:var(--muted)">NOT UP TO ME</text></g>
<g id="pcs"></g>
<path id="pour" class="s-gain" d="M450 420v90m-26-26 26 26 26-26" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="setd"><text class="d5" x="1150" y="830" font-size="36" text-anchor="middle">Set it down.</text></g>
<g id="pourt"><text class="d" x="450" y="830" font-size="36" text-anchor="middle" style="fill:var(--gain)">Pour everything in.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">One problem today.</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="88" letter-spacing="-2">Which piece is truly</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">up to you</tspan>?</text></g>
<text class="m" x="143" y="680" font-size="26">SORT IT. THEN ACT ON YOUR PIECE.</text>
<g id="clist"><rect class="s-ink" x="1120" y="600" width="320" height="220" rx="16" fill="var(--stage)" stroke-width="6"/></g>
</g>