<text class="m" x="870" y="630" font-size="20" style="fill:var(--loss)">GIMMICK: UNEXPECTED FOR ITS OWN SAKE</text></g>
<g id="cf"><text class="d5" x="870" y="700" font-size="36">Just confuses people.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Curiosity gaps.</text>
<text class="b" x="120" y="176" font-size="32">Surprise grabs attention, but curiosity holds it.</text>
<g id="bar"><text class="m" x="120" y="350" font-size="22">WHAT YOU KNOW</text><text class="m" x="1140" y="350" font-size="22" text-anchor="middle" style="fill:var(--loss)">THE GAP</text>
