<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Live into two</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">core values.</text>
<text class="b" x="120" y="600" font-size="32">Why two clearly defined values beat a long list of ideals.</text>
<g id="tpair"><circle class="gain" cx="1230" cy="400" r="64"/><circle class="gain" cx="1390" cy="400" r="64"/>
<text class="d" x="1230" y="420" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">1</text>
<text class="d" x="1390" y="420" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">2</text>
<text class="m" x="1310" y="510" font-size="22" text-anchor="middle">TWO WORDS</text></g>
<g id="tdots"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too many values.</text>
<text class="b" x="120" y="176" font-size="32">Most of us could list a dozen things we value.</text>
<g id="poster"><rect x="120" y="230" width="500" height="530" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<circle class="loss" cx="370" cy="230" r="12"/>
<text class="m" x="150" y="290" font-size="22">OUR VALUES</text><g id="pwords"></g></g>
<g id="tangle"></g>
<circle id="hub" class="loss" cx="1150" cy="470" r="16"/>
<g id="chooser"><g id="chp"></g>
<text class="d" x="780" y="478" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="m" x="1150" y="745" font-size="22" text-anchor="middle">TOUGH CHOICE</text></g>
<g id="nothing"><text class="d" x="120" y="830" font-size="46">When everything is a core value, nothing is.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with a long list.</text>
<text class="b" x="120" y="176" font-size="32">Brown’s list runs from honesty and humor to faith and fairness.</text>
<g id="grid"></g><g id="rings"></g>
<g id="st1"><text class="d" x="120" y="815" font-size="46">Circle the ones that speak to you.</text></g>
<g id="st2"><text class="d" x="120" y="815" font-size="46">Then narrow them down to just <tspan style="fill:var(--gain)">two</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask three questions.</text>
<text class="b" x="120" y="176" font-size="32">Run each value through the filter.</text>
<g id="q0"><rect class="s-line" x="120" y="250" width="680" height="110" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="175" cy="305" r="28"/><text class="d" x="175" y="316" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">1</text><text class="d5" x="225" y="316" font-size="32">Does this define me?</text></g>
<g id="q1"><rect class="s-line" x="120" y="390" width="680" height="110" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="175" cy="445" r="28"/><text class="d" x="175" y="456" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">2</text><text class="d5" x="225" y="456" font-size="32">Is this who I am at my best?</text></g>
<g id="q2"><rect class="s-line" x="120" y="530" width="680" height="110" rx="16" fill="var(--stage)" stroke-width="3"/><circle class="gain" cx="175" cy="585" r="28"/><text class="d" x="175" y="596" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">3</text><text class="d5" x="225" y="596" font-size="32">A filter I use for hard decisions?</text></g>
<g id="funnel"><polygon class="s-ink" points="960,260 1420,260 1230,580 1230,640 1150,640 1150,580" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<line id="fl0" x1="1008" y1="340" x2="1372" y2="340" stroke="var(--gain)" stroke-width="5" stroke-dasharray="12 10"/>
<line id="fl1" x1="1055" y1="420" x2="1325" y2="420" stroke="var(--gain)" stroke-width="5" stroke-dasharray="12 10"/>
<line id="fl2" x1="1103" y1="500" x2="1277" y2="500" stroke="var(--gain)" stroke-width="5" stroke-dasharray="12 10"/></g>
<g id="fdots"></g>
<g id="fit"><text class="d" x="120" y="830" font-size="44">Many other values fit under your top two.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Brown’s own two.</text>
<text class="b" x="120" y="176" font-size="32">She did the exercise herself.</text>
<g id="brene"><g id="bfig"></g><text class="m" x="260" y="540" font-size="22" text-anchor="middle">BRENÉ BROWN</text></g>
<g id="fc"><text class="d" x="120" y="660" font-size="64" style="fill:var(--gain)">Faith</text><text class="d" x="120" y="740" font-size="64" style="fill:var(--gain)">Courage</text></g>
<g id="comp"><circle class="s-ink" cx="1000" cy="470" r="220" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1000 262v24M1000 654v24M792 470h24M1184 470h24" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1000" y="232" font-size="26" text-anchor="middle" style="fill:var(--gain)">FAITH</text>
<text class="m" x="1000" y="732" font-size="26" text-anchor="middle" style="fill:var(--gain)">COURAGE</text>
<g id="needle"><path class="gain" d="M1000 290L1026 470H974Z"/><path class="ink" d="M1000 650L1026 470H974Z"/></g>
<circle class="s-ink" cx="1000" cy="470" r="14" fill="var(--stage)" stroke-width="5"/></g>
<g id="noise"></g>
<g id="blur"><text class="d" x="120" y="830" font-size="44">Easy to remember when stress blurs the rest.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Values become actions.</text>
<text class="b" x="120" y="176" font-size="32">For each value, write down what it looks like.</text>
<g id="k0"><rect class="s-line" x="120" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="20">BEHAVIORS THAT SUPPORT IT</text><g id="chks"></g>
<text class="d" x="150" y="720" font-size="40" style="fill:var(--gain)">Do this.</text></g>
<g id="k1"><rect class="s-line" x="590" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="620" y="290" font-size="20">SLIPPERY BEHAVIORS</text>
<path class="s-loss" d="M640 380L960 640" stroke-width="8" stroke-linecap="round"/>
<circle id="ball" class="loss" r="20"/>
<text class="d" x="620" y="720" font-size="40" style="fill:var(--loss)">Watch for this.</text></g>
<g id="k2"><rect class="s-line" x="1060" y="240" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1090" y="290" font-size="20">A TIME YOU LIVED IT</text>
<rect class="s-ink" x="1120" y="330" width="300" height="270" fill="var(--stage)" stroke-width="7"/>
<g id="mem"></g><circle class="gain" cx="1380" cy="375" r="18"/>
<text class="d" x="1090" y="720" font-size="40">Remember this.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Use them under pressure.</text>
<text class="b" x="120" y="176" font-size="32">Your two values make the hard choice simpler.</text>
<g id="meet"><text class="m" x="440" y="610" font-size="20" text-anchor="middle">TEMPTED TO STAY QUIET</text></g>
<g id="tense"></g>
<g id="bub"><rect x="400" y="280" width="80" height="50" rx="14" fill="var(--stage)" stroke="var(--muted)" stroke-width="4"/><circle class="ink" cx="424" cy="305" r="5"/><circle class="ink" cx="440" cy="305" r="5"/><circle class="ink" cx="456" cy="305" r="5"/></g>
<g id="scl"><path class="s-ink" d="M1150 280V560M1070 560h160" stroke-width="8" stroke-linecap="round"/>
<line id="beam" class="s-ink" x1="950" y1="280" x2="1350" y2="280" stroke-width="8" stroke-linecap="round"/>
<circle class="gain" cx="1150" cy="280" r="12"/>
<g id="panL"><path class="s-muted" d="M0 0L-75 90M0 0L75 90" stroke-width="4"/><rect class="loss" x="-50" y="48" width="100" height="42" rx="6"/><path class="s-ink" d="M-85 90h170" stroke-width="7" stroke-linecap="round"/><text class="m" x="0" y="130" font-size="20" text-anchor="middle">STAY QUIET</text></g>
<g id="panR"><path class="s-muted" d="M0 0L-75 90M0 0L75 90" stroke-width="4"/><rect class="gain" x="-60" y="48" width="120" height="42" rx="6"/><text class="m" x="0" y="75" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">COURAGE</text><path class="s-ink" d="M-85 90h170" stroke-width="7" stroke-linecap="round"/><text class="m" x="0" y="130" font-size="18" text-anchor="middle" style="fill:var(--gain)">SAY THE HARD</text><text class="m" x="0" y="154" font-size="18" text-anchor="middle" style="fill:var(--gain)">THING KINDLY</text></g></g>
<g id="tm"><text class="d" x="120" y="720" font-size="44">Teams share their two values.</text><text class="m" x="120" y="770" font-size="20">SO COLLEAGUES CAN SUPPORT EACH OTHER</text></g>
<g id="team"></g>
<path id="tline" class="s-gain" d="M940 805H1460" stroke-width="5" stroke-dasharray="10 10"/>
</g>

<g id="s7" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Circle ten values.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Cut them to <tspan style="fill:var(--gain)">two</tspan>.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Practice tomorrow.</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">WRITE ONE BEHAVIOR · SHARE IT WITH SOMEONE</text></g>
<g id="ppr"><rect class="s-ink" x="1180" y="260" width="260" height="340" rx="10" fill="var(--stage)" stroke-width="6"/><g id="paper"></g></g>
<path id="pen" class="gain" d="M0 0l60-150 22 8-60 150-24 14z"/>
</g>