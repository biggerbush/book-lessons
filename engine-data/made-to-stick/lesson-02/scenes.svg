</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two questions find the core.</text>
<g id="q1"><rect x="120" y="210" width="660" height="210" rx="16" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="150" y="256" font-size="22">QUESTION 1</text><g id="q1t"><text class="d5" x="150" y="320" font-size="34">If we do nothing else tomorrow,</text><text class="d5" x="150" y="370" font-size="34">what must we do?</text></g></g>
<g id="q2"><rect x="820" y="210" width="660" height="210" rx="16" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><text class="m" x="850" y="256" font-size="22">QUESTION 2</text><text class="d5" x="850" y="320" font-size="34">What is the single most</text><text class="d5" x="850" y="370" font-size="34">important thing?</text></g>
<g id="ideas"></g>
<g id="pen" opacity="0"><polygon class="loss" points="0,0 8,-22 50,-75 64,-65 22,-12"/></g>
<g id="keep"><text class="d" x="980" y="640" font-size="44" style="fill:var(--gain)">Keep only</text><text class="d" x="980" y="696" font-size="44" style="fill:var(--gain)">the core.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One line of strategy.</text>
<text class="b" x="120" y="176" font-size="32">Southwest Airlines had its own Commander’s Intent.</text>
<g id="plane"><g id="planeB"><polygon class="ink" points="180,388 220,388 190,310 160,310"/><rect class="ink" x="160" y="380" width="420" height="64" rx="32"/><polygon class="ink" points="330,412 410,412 330,520 290,520"/></g><text class="m" x="150" y="580" font-size="20">SOUTHWEST AIRLINES</text></g>
<g id="kel"><text class="m" x="760" y="500" font-size="20" text-anchor="middle">HERB KELLEHER</text></g>
<g id="quote"><rect x="880" y="240" width="600" height="220" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><polygon class="ink" points="880,330 840,360 880,372"/><text class="d" x="920" y="330" font-size="52">“We are the</text><text class="d" x="920" y="410" font-size="52"><tspan style="fill:var(--gain)">low-fare</tspan> airline.”</text></g>
<g id="tag"><polygon class="gain" points="120,640 440,640 500,700 440,760 120,760"/><circle cx="450" cy="700" r="12" fill="var(--stage)"/><text class="d" x="150" y="718" font-size="48" style="fill:var(--on-gain)">LOW FARE</text></g>
<g id="rul"><rect x="600" y="650" width="880" height="70" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><g id="ticks"></g><path id="mk4" class="gain" d="M0 0l-14-24h28z"/><text class="b" x="600" y="800" font-size="32">Every decision is measured against those six words.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The salad test.</text>
<text class="b" x="120" y="176" font-size="32">Every idea meets one question.</text>
<g id="mkt"><rect x="290" y="240" width="380" height="80" rx="16" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/><polygon class="ink" points="300,320 270,345 324,320"/><text class="m" x="480" y="288" font-size="22" text-anchor="middle">ADD A CHICKEN SALAD?</text></g>
