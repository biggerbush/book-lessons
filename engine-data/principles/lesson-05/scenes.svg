<text class="m" x="1220" y="400" font-size="20" style="fill:var(--gain)">TEAM FILLS</text><text class="m" x="1220" y="430" font-size="20" style="fill:var(--gain)">THE GAPS</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Radical open-mindedness.</text>
<g id="sinc"><text class="b" x="120" y="176" font-size="32">Sincerely believing you might not know the best answer.</text></g>
<g id="dr"><rect class="gain" x="220" y="300" width="240" height="420"/><path id="door" class="s-ink" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><rect class="s-ink" x="220" y="300" width="240" height="420" fill="none" stroke-width="7"/>
<text class="m" x="340" y="790" font-size="20" text-anchor="middle">MIGHT I BE WRONG?</text></g>
