<text class="m" x="1350" y="690" font-size="22" text-anchor="middle" style="fill:var(--gain)">GROWTH</text>
</g>
<g id="hon"><text class="d" x="120" y="800" font-size="44">Honest admission is where growth begins.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Where do you think you’re</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">too gifted</tspan>, or <tspan style="fill:var(--loss)">too broken</tspan>,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">to need effort?</text></g>
