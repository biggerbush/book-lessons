<g id="qfew"><text class="d" x="120" y="420" font-size="56" style="fill:var(--gain)">How few?</text></g>
<g id="svm"><text class="m" x="120" y="560" font-size="22">THE SMALLEST GROUP THAT</text><text class="m" x="120" y="592" font-size="22">MAKES IT WORTHWHILE</text></g>
<g id="svm2"><text class="d" x="120" y="690" font-size="52">Your smallest</text><text class="d" x="120" y="750" font-size="52" style="fill:var(--gain)">viable market.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small lets you go deep.</text>
<text class="b" x="120" y="176" font-size="32">Learn exactly what a few people want and fear.</text>
