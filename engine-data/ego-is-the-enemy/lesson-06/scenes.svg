<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">1947. One man on the field.</text>
<text class="b" x="120" y="176" font-size="32">Jackie Robinson walks out for the Brooklyn Dodgers.</text>
<g id="park">
<path class="s-line" d="M360 540L240 420M760 540L880 420M240 420Q560 80 880 420" fill="none" stroke-width="5" stroke-linecap="round"/>
<polygon points="560,340 760,540 560,740 360,540" fill="var(--gain)" fill-opacity=".12" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<rect x="548" y="328" width="24" height="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<rect x="748" y="528" width="24" height="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<rect x="348" y="528" width="24" height="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
<rect x="548" y="728" width="24" height="24" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/>
