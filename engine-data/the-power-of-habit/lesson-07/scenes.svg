</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step 4: Make a plan.</text>
<text class="b" x="120" y="176" font-size="32">Same cue, same reward, a new routine.</text>
<g id="card"><rect class="s-ink" x="120" y="240" width="620" height="340" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="150" y="295" font-size="22">MY PLAN</text><path class="gain" d="M656 318h48l-8-10v-22a16 16 0 0 0-32 0v22z"/><circle class="gain" cx="680" cy="326" r="6"/></g>
<g id="pl0"><text class="d5" x="150" y="380" font-size="38">At <tspan style="fill:var(--gain)">3:30</tspan> every day,</text></g>
<g id="pl1"><text class="d5" x="150" y="450" font-size="38">walk to a friend’s desk</text></g>
<g id="pl2"><text class="d5" x="150" y="520" font-size="38">and talk for <tspan style="fill:var(--gain)">10 minutes</tspan>.</text></g>
<g id="lp"><circle class="s-line" cx="1140" cy="450" r="170" fill="none" stroke-width="8"/><circle id="pulse" class="gain" r="14"/><g id="nodes"></g></g>
<g id="auto"><text class="d" x="120" y="700" font-size="48">Within weeks, it was automatic.</text><text class="m" x="120" y="760" font-size="22">HE RARELY THOUGHT ABOUT THE COOKIE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your toolkit.</text>
<text class="b" x="120" y="176" font-size="32">The method works on almost any habit.</text>
<g id="tbx"><path class="s-ink" d="M250 420v-40a20 20 0 0 1 20-20h80a20 20 0 0 1 20 20v40" fill="none" stroke-width="8"/><rect class="s-ink" x="140" y="420" width="340" height="220" rx="16" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M140 490h340" stroke-width="6"/><rect class="gain" x="280" y="470" width="60" height="40" rx="6"/></g>
<g id="rows"></g>
<g id="fin"><text class="d" x="120" y="810" font-size="40">Every habit you understand is a habit you can change.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one habit</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">that <tspan style="fill:var(--gain)">bugs you</tspan>.</text></g>
