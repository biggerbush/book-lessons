<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Deep questions</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">open people up.</text>
<text class="b" x="120" y="600" font-size="32">Ask about values and experiences, and strangers start feeling close.</text>
<g id="tp"></g>
<path id="tlink" class="s-gain" d="M1220 340Q1300 250 1380 340" fill="none" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>
<g id="tq"><rect class="gain" x="1240" y="170" width="120" height="90" rx="20"/><text class="d" x="1300" y="238" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The small talk trap.</text>
<text class="b" x="120" y="176" font-size="32">Two strangers meet at a party.</text>
<g id="pA"></g><g id="pB"></g>
<g id="b1"><rect class="s-ink" x="160" y="230" width="360" height="84" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M320 314l20 40 20-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="340" y="282" font-size="24" text-anchor="middle">WHERE DO YOU WORK?</text></g>
<g id="b2"><rect class="s-ink" x="600" y="230" width="300" height="84" rx="18" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M730 314l20 40 20-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="750" y="282" font-size="24" text-anchor="middle">“JOB TITLE.”</text></g>
<g id="sh"><path class="s-muted" d="M690 540l-24-26M810 540l24-26" stroke-width="6" stroke-linecap="round"/></g>
<g id="ch1"><text class="m" x="1040" y="280" font-size="22">CLOSENESS</text><path class="s-line" d="M1040 300V600H1440" fill="none" stroke-width="4"/><line id="flat" class="s-loss" x1="1040" y1="560" x2="1040" y2="560" stroke-width="7" stroke-linecap="round"/><text class="m" x="1040" y="640" font-size="20">NOTHING MUCH HAPPENS</text></g>
<g id="f1"><text class="d" x="120" y="760" font-size="40">Facts tell us what someone does, not who they are.</text></g>
<g id="f2"><text class="m" x="120" y="820" font-size="22">MANY OF US STAY THERE OUT OF HABIT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What makes a question deep?</text>
<text class="b" x="120" y="176" font-size="32">Duhigg: it asks about values, beliefs or experiences.</text>
<g id="chips2"></g>
<g id="cf"><rect class="s-line" x="120" y="330" width="500" height="240" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="150" y="380" font-size="22">FACT QUESTION</text><text class="d5" x="150" y="470" font-size="40">Where do you work?</text></g>
<g id="ar2"><path class="s-muted" d="M650 450h170m-26-26 26 26-26 26" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cd"><rect class="gain" x="860" y="330" width="620" height="240" rx="18"/><text class="m" x="890" y="380" font-size="22" style="fill:var(--on-gain)">DEEP QUESTION</text><text class="d5" x="890" y="460" font-size="40" style="fill:var(--on-gain)">What do you love</text><text class="d5" x="890" y="516" font-size="40" style="fill:var(--on-gain)">about your work?</text></g>
<g id="h2"></g>
<g id="t2"><text class="d" x="120" y="705" font-size="40">It invites people to share how they feel.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Arthur Aron’s experiment.</text>
<text class="b" x="120" y="176" font-size="32">Strangers in pairs, asking each other a list of questions.</text>
<g id="ar3"><text class="m" x="240" y="500" font-size="22" text-anchor="middle">ARTHUR ARON</text><text class="m" x="240" y="530" font-size="20" text-anchor="middle">PSYCHOLOGIST</text></g>
<g id="pr3"></g>
<g id="prl"><text class="m" x="540" y="760" font-size="20" text-anchor="middle">STRANGERS IN PAIRS</text></g>
<g id="lad3"><path class="s-ink" d="M960 240V780M1060 240V780" stroke-width="7" stroke-linecap="round"/><g id="rg3"></g><circle id="clb" class="gain" cx="1010" cy="740" r="18"/>
<text class="m" x="930" y="268" font-size="22" text-anchor="end" style="fill:var(--gain)">PERSONAL</text><text class="m" x="930" y="748" font-size="22" text-anchor="end">LIGHT</text></g>
<g id="eq3"><rect class="s-line" x="1100" y="640" width="380" height="150" rx="16" fill="var(--stage)" stroke-width="4"/><text class="m" x="1124" y="680" font-size="20">EARLY QUESTION</text><text class="d5" x="1124" y="724" font-size="30">What would a perfect</text><text class="d5" x="1124" y="762" font-size="30">day look like?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Closeness, fast.</text>
<text class="b" x="120" y="176" font-size="32">Same time together. Different questions.</text>
<g id="cpA"></g><g id="cpB"></g>
<g id="rA"><text class="m" x="360" y="300" font-size="22">SMALL TALK</text><rect class="s-line" x="360" y="320" width="740" height="40" rx="20" fill="none" stroke-width="4"/><rect id="bfA" class="loss" x="360" y="320" width="0" height="40" rx="20"/></g>
<g id="rB"><text class="m" x="360" y="500" font-size="22" style="fill:var(--gain)">DEEP QUESTIONS</text><rect class="s-line" x="360" y="520" width="740" height="40" rx="20" fill="none" stroke-width="4"/><rect id="bfB" class="gain" x="360" y="520" width="0" height="40" rx="20"/><text class="m" x="360" y="620" font-size="20">FELT CLOSENESS · ILLUSTRATIVE</text></g>
<g id="ck4"><circle class="s-ink" cx="1300" cy="420" r="110" fill="var(--stage)" stroke-width="8"/><path id="hand" class="s-gain" d="M1300 420V340" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1300" cy="420" r="10"/><text class="m" x="1300" y="580" font-size="24" text-anchor="middle">UNDER AN HOUR</text></g>
<g id="t4"><text class="d" x="120" y="780" font-size="40">Strangers built what usually takes much longer.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">A deep question signals that you care about the answer.</text>
<g id="dr5"><rect class="gain" x="200" y="260" width="220" height="380"/><rect id="door" class="ink" x="200" y="260" width="220" height="380"/><rect class="s-ink" x="200" y="260" width="220" height="380" fill="none" stroke-width="8"/><text class="m" x="310" y="690" font-size="22" text-anchor="middle">SIGNALS YOU CARE</text></g>
<g id="fl5"></g>
<g id="fl5l"><text class="m" x="460" y="300" font-size="22" style="fill:var(--gain)">EMOTIONS, NOT JUST DETAILS</text></g>
<g id="pp5"></g>
<g id="ra1"><path class="s-gain" d="M870 320H1240m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1055" y="296" font-size="20" text-anchor="middle">OPENS UP</text></g>
<g id="ra2"><path class="s-gain" d="M1250 620H880m20-20-20 20 20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1065" y="664" font-size="20" text-anchor="middle">OPENS UP IN RETURN</text></g>
<g id="t5"><text class="d" x="120" y="800" font-size="44">Not prying. An invitation.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Share back.</text>
<text class="b" x="120" y="176" font-size="32">Ask a deep question, then offer a real answer yourself.</text>
<g id="cv6"><rect class="s-line" x="120" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="262" font-size="22" style="fill:var(--gain)">CONVERSATION</text><path class="s-muted" d="M440 300V640" stroke-width="4" stroke-dasharray="10 10"/></g>
<g id="hh6"><path class="s-gain" d="M340 660H540M360 640l-20 20 20 20M520 640l20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="440" y="704" font-size="20" text-anchor="middle" style="fill:var(--gain)">BOTH WAYS</text></g>
<g id="iv6"><rect class="s-line" x="840" y="220" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="262" font-size="22" style="fill:var(--loss)">INTERVIEW</text><path class="s-loss" d="M1060 660H1260m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1160" y="704" font-size="20" text-anchor="middle">ONE-WAY</text><g id="qs6"></g></g>
<g id="t6"><text class="d" x="120" y="800" font-size="40">Closeness grows when vulnerability goes both ways.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Swap one fact question for a feeling question.</text>
<g id="c7"><g id="card">
<g id="cfr"><rect class="s-ink" x="120" y="240" width="580" height="220" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="150" y="290" font-size="22">FACT QUESTION</text><text class="d5" x="150" y="390" font-size="40">Where do you work?</text></g>
<g id="cbk"><rect class="gain" x="120" y="240" width="580" height="220" rx="18"/><text class="m" x="150" y="290" font-size="22" style="fill:var(--on-gain)">FEELING QUESTION</text><text class="d5" x="150" y="370" font-size="36" style="fill:var(--on-gain)">What made you choose</text><text class="d5" x="150" y="420" font-size="36" style="fill:var(--on-gain)">your field?</text></g>
</g></g>
<g id="a7"><path class="s-muted" d="M720 350h96m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cq7"><rect class="s-gain" x="840" y="240" width="640" height="220" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="870" y="290" font-size="22" style="fill:var(--gain)">FOLLOW-UP</text><text class="d5" x="870" y="370" font-size="36">What surprised you</text><text class="d5" x="870" y="420" font-size="36">about it?</text></g>
<g id="v7"><text class="m" x="120" y="560" font-size="22">LISTEN FOR THE VALUES IN THEIR ANSWER</text><rect class="s-line" x="120" y="585" width="900" height="150" rx="24" fill="none" stroke-width="4"/><g id="ln7"></g></g>
<g id="t7"><text class="d" x="120" y="810" font-size="40">Notice how the conversation changes.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="80" letter-spacing="-2">This week, ask one person a</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="80" letter-spacing="-2">question you genuinely want</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="80" letter-spacing="-2">answered about <tspan style="fill:var(--gain)">their life.</tspan></text></g>
<g id="ql"><text class="m" x="143" y="680" font-size="26">WHAT MIGHT YOU LEARN?</text></g>
<g id="qg"><rect class="gain" x="1290" y="600" width="170" height="130" rx="28"/><path class="gain" d="M1320 724l-10 46 50-46z"/><text class="d" x="1375" y="694" font-size="80" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
</g>