<g id="adult"><text class="d" x="120" y="800" font-size="46">Clear words treat people as capable adults.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Painting done.</text>
<text class="b" x="120" y="176" font-size="32">A practical tool from the book.</text>
