<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PSYCHOLOGY OF MONEY · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Getting rich versus</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">staying rich.</text>
<text class="b" x="120" y="600" font-size="32">Why making money and keeping money need opposite skills.</text>
<g id="dr0"><rect class="s-ink" x="1170" y="300" width="130" height="240" rx="8" fill="var(--stage)" stroke-width="6"/><g id="upA"><path class="s-gain" d="M1235 470V370M1205 400l30-30 30 30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="m" x="1235" y="580" font-size="22" text-anchor="middle">GET</text></g>
<g id="dr1"><rect class="s-ink" x="1340" y="300" width="130" height="240" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1405 370l40 16v40c0 30-20 46-40 56-20-10-40-26-40-56v-40z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1405" y="580" font-size="22" text-anchor="middle">KEEP</text></g>
<g id="opp"><path class="s-muted" d="M1180 630h280M1200 614l-20 16 20 16M1440 614l20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1320" y="680" font-size="20" text-anchor="middle">OPPOSITE SKILLS</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Getting money takes boldness.</text>
<text class="b" x="120" y="176" font-size="32">Risk, self-belief and optimism when others doubt you.</text>
<path class="s-line" d="M180 740h240" stroke-width="6" stroke-linecap="round"/>
<path id="trail" class="s-gain" d="M300 720V720" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
<g id="rkW"><g id="rkt"><path id="fl" class="loss" d="M-16 44L0 92L16 44Z"/><path class="ink" d="M-26 10l-24 42h24zM26 10l24 42h-24z"/><path class="gain" d="M0 -90C34 -50 34 10 26 44H-26C-34 10 -34 -50 0 -90Z"/><circle cx="0" cy="-30" r="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/></g></g>
<g id="dice"></g>
<g id="ch1"></g>
<g id="dbt"></g>
<g id="dare"><text class="d" x="120" y="820" font-size="48">Without daring, wealth rarely shows up.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keeping money is different.</text>
<text class="b" x="120" y="176" font-size="32">Caution, frugality and a healthy dose of fear.</text>
<g id="shd"><path class="s-ink" d="M290 230L420 280V400C420 490 360 540 290 570C220 540 160 490 160 400V280Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><circle class="gain" cx="290" cy="400" r="48"/><circle cx="290" cy="400" r="30" fill="none" stroke="var(--on-gain)" stroke-width="5"/></g>
<g id="pig"><rect class="ink" x="600" y="500" width="34" height="48" rx="6"/><rect class="ink" x="722" y="500" width="34" height="48" rx="6"/><path class="ink" d="M600 344l10-44 36 32z"/><path class="s-ink" d="M542 410c-30-12-30 30-8 20" fill="none" stroke-width="5" stroke-linecap="round"/><circle id="pcoin" class="gain" cx="680" cy="230" r="20" stroke="var(--ink)" stroke-width="4"/><ellipse class="s-ink" cx="680" cy="420" rx="140" ry="100" fill="var(--stage)" stroke-width="7"/><ellipse class="s-ink" cx="826" cy="420" rx="22" ry="30" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="760" cy="390" r="8"/><path class="s-ink" d="M650 322h60" stroke-width="8" stroke-linecap="round"/></g>
<g id="ch2"></g>
<g id="lk"><text class="m" x="960" y="520" font-size="20">SOME SUCCESS CAME FROM LUCK</text><rect class="ink" x="960" y="545" width="300" height="56"/><text class="m" x="1110" y="581" font-size="20" text-anchor="middle" style="fill:var(--stage)">SKILL</text><rect id="lbar" class="gain" x="1260" y="545" width="220" height="56"/><text class="m" x="1370" y="581" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">LUCK</text><text class="m" x="1480" y="640" font-size="20" text-anchor="end" style="fill:var(--gain)">MAY NOT REPEAT</text></g>
<g id="hum"><text class="d" x="120" y="790" font-size="48">Humility becomes more useful than courage.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Jesse Livermore.</text>
<text class="b" x="120" y="176" font-size="32">One of the most famous stock traders of his time.</text>
<g id="trd"><text class="m" x="300" y="600" font-size="20" text-anchor="middle">JESSE LIVERMORE</text><text class="m" x="300" y="630" font-size="18" text-anchor="middle">STOCK TRADER</text></g>
<g id="cht"><path class="s-ink" d="M520 260V640H1080" fill="none" stroke-width="5"/><path id="cline" class="s-ink" d="M540 600L600 560L650 580L710 500L760 520L820 400L860 420L900 300L960 470L1000 560L1040 620" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><text class="m" x="900" y="284" font-size="22" text-anchor="middle">1929</text></g>
<g id="bet"><path class="s-gain" d="M1060 420V560M1044 540l16 20 16-20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="800" y="680" font-size="20" text-anchor="middle" style="fill:var(--gain)">HE BET PRICES WOULD FALL</text></g>
<g id="mny"></g>
<g id="rich"><text class="d" x="120" y="780" font-size="40">Almost overnight, one of the richest people in the world.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then he lost it all.</text>
<text class="b" x="120" y="176" font-size="32">Success made him overconfident.</text>
<g id="bets"></g>
<g id="blab"><text class="m" x="120" y="660" font-size="20">BIGGER, RISKIER BETS</text></g>
<g id="pkt"><path class="s-ink" d="M1000 260h320l20 340h-150l-30-220-30 220h-150z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M1000 300h320" stroke-width="5"/><path id="pk0" class="loss" d="M1030 300c-50 30-50 110-10 130c30 10 50-20 40-60c-6-30-14-50-30-70z"/><path id="pk1" class="loss" d="M1290 300c50 30 50 110 10 130c-30 10-50-20-40-60c6-30 14-50 30-70z"/><text class="m" x="1160" y="660" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOST EVERYTHING</text></g>
<g id="gr1"><text class="d" x="120" y="740" font-size="46" style="fill:var(--gain)">He was brilliant at getting rich.</text></g>
<g id="gr2"><text class="d" x="120" y="810" font-size="46" style="fill:var(--loss)">He never learned how to stay rich.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Survival first.</text>
<text class="b" x="120" y="176" font-size="32">Michael Moritz of Sequoia, a hugely successful venture capital firm.</text>
<g id="tre"><rect class="ink" x="280" y="520" width="60" height="220"/><polygon class="gain" points="310,230 200,400 420,400"/><polygon class="gain" points="310,320 180,500 440,500"/><polygon class="gain" points="310,410 160,600 460,600"/><path class="s-line" d="M160 740h300" stroke-width="6" stroke-linecap="round"/></g>
<g id="clk"><circle class="s-ink" cx="700" cy="430" r="120" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g><path id="hh" class="s-ink" d="M700 430V370" stroke-width="9" stroke-linecap="round"/><path id="mh" class="s-gain" d="M700 430V335" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="700" cy="430" r="10"/><text class="m" x="700" y="600" font-size="22" text-anchor="middle">WHY DID IT LAST?</text></g>
<g id="fear"><text class="m" x="920" y="290" font-size="22" style="fill:var(--loss)">ALWAYS AFRAID OF</text><text class="m" x="920" y="324" font-size="22" style="fill:var(--loss)">GOING OUT OF BUSINESS</text></g>
<g id="trk"><text class="m" x="1460" y="640" font-size="20" text-anchor="end" style="fill:var(--gain)">STILL PLAYING</text></g>
<g id="play"><text class="d" x="120" y="800" font-size="44">Time only works for you if you are still playing.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Leave room for error.</text>
<text class="b" x="120" y="176" font-size="32">Keep savings and slack for when things go wrong.</text>
<g id="csh"><rect class="gain" x="240" y="620" width="360" height="70" rx="35"/><text class="m" x="420" y="663" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">ROOM FOR ERROR</text><g id="cst"></g></g>
<g id="stm"><g id="rain"></g><circle class="loss" cx="360" cy="300" r="50"/><circle class="loss" cx="430" cy="270" r="65"/><circle class="loss" cx="500" cy="300" r="50"/><rect class="loss" x="360" y="300" width="140" height="50"/><path id="bolt" class="ink" d="M440 330l-24 50h22l-14 46 40-60h-22l16-36z"/></g>
<g id="svl"><text class="m" x="420" y="740" font-size="22" text-anchor="middle">SAVINGS + SLACK</text></g>
<g id="pln"><text class="m" x="820" y="360" font-size="22">THE PLAN</text><path class="s-muted" d="M840 420H1440" stroke-width="5" stroke-dasharray="12 10"/><path id="real" class="s-gain" d="M840 420C960 420 980 560 1080 560S1200 320 1300 380S1400 460 1440 420" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><text class="m" x="820" y="640" font-size="22" style="fill:var(--gain)">WHAT ACTUALLY HAPPENS</text></g>
<g id="ppl"><text class="d" x="120" y="800" font-size="44">Plan on your plan not going according to plan.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be two things at once.</text>
<text class="b" x="120" y="176" font-size="32">Optimistic and paranoid, at the same time.</text>
<g id="scl"><path class="s-ink" d="M800 280V640" stroke-width="8"/><path class="ink" d="M720 700h160l-80-60z"/>
<g id="pL"><path class="s-ink" d="M480 280L370 500M480 280L590 500" stroke-width="3"/><path class="ink" d="M360 500h240a120 40 0 0 1-240 0z"/><g id="sun"><path class="gain" d="M420 500a60 60 0 0 1 120 0z"/><path class="s-gain" d="M480 428v-28M434 446l-20-20M526 446l20-20M410 490h-26M550 490h26" stroke-width="6" stroke-linecap="round"/></g></g>
<g id="pR"><path class="s-ink" d="M1120 280L1010 500M1120 280L1230 500" stroke-width="3"/><path class="ink" d="M1000 500h240a120 40 0 0 1-240 0z"/><g id="umb"><path class="ink" d="M1040 450a80 80 0 0 1 160 0q-20-14-40 0q-20-14-40 0q-20-14-40 0q-20-14-40 0z"/><path class="s-ink" d="M1120 450v28a10 10 0 0 0 20 0" fill="none" stroke-width="6" stroke-linecap="round"/><g id="ubl"><path class="loss" d="M1010 300l-14 30h14l-8 28 26-38h-14l10-20z"/><path class="loss" d="M1252 300l-14 30h14l-8 28 26-38h-14l10-20z"/></g></g></g>
<g id="bm"><path class="s-ink" d="M480 280H1120" stroke-width="8" stroke-linecap="round"/><circle class="gain" cx="800" cy="280" r="14"/></g></g>
<g id="lL"><text class="d5" x="480" y="640" font-size="44" text-anchor="middle" style="fill:var(--gain)">Optimistic</text><text class="m" x="480" y="680" font-size="20" text-anchor="middle">ABOUT THE LONG-TERM FUTURE</text></g>
<g id="lR"><text class="d5" x="1120" y="640" font-size="44" text-anchor="middle">Paranoid</text><text class="m" x="1120" y="680" font-size="20" text-anchor="middle">ABOUT SHORT-TERM SHOCKS</text></g>
<g id="both"><text class="d" x="120" y="800" font-size="40">Optimistic about the future. Paranoid about the path.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="68" letter-spacing="-1">If something went badly</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="68" letter-spacing="-1">wrong tomorrow, would</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="68" letter-spacing="-1">your money <tspan style="fill:var(--gain)">survive</tspan> it?</text></g>
<g id="nx"><text class="m" x="143" y="620" font-size="26" style="fill:var(--gain)">THIS MONTH: BUILD ONE CUSHION</text><text class="m" x="143" y="664" font-size="26">LIKE A FEW MONTHS OF EXPENSES SET ASIDE</text></g>
<g id="cl8"><g id="rain8"></g><circle class="loss" cx="1220" cy="290" r="44"/><circle class="loss" cx="1285" cy="260" r="58"/><circle class="loss" cx="1350" cy="290" r="44"/><rect class="loss" x="1220" y="290" width="130" height="44"/></g>
<g id="cg"><rect class="gain" x="1080" y="640" width="400" height="90" rx="45"/><text class="m" x="1280" y="694" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">CUSHION</text><text class="m" x="1280" y="780" font-size="20" text-anchor="middle">A FEW MONTHS OF EXPENSES</text></g>
<g id="cstk"></g>
</g>