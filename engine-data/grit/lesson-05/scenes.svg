<text id="hm1" class="m" x="860" y="756" font-size="20">THEIR WORK MATTERED TO OTHER PEOPLE</text>
<text id="hm2" class="m" x="860" y="794" font-size="20" style="fill:var(--gain)">A REASON TO KEEP GOING ON HARD DAYS</text>
