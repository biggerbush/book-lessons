<g id="s0">
<text class="m" x="120" y="150" font-size="28">TINY HABITS · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Grow good habits,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">untangle bad ones.</text>
<text class="b" x="120" y="600" font-size="32">How small wins grow, and how to unravel the habits you don’t want.</text>
<g id="tpot"></g><g id="tpl"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tiny habits rarely stay tiny.</text>
<text id="sub1" class="b" x="120" y="176" font-size="32">Once it feels automatic, you often want to do a little more.</text>
<g id="pot1"></g><g id="sp1"></g>
<path id="arr1" class="s-muted" d="M450 520Q560 520 640 380M450 560Q560 560 640 640" fill="none" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<text id="lbt" class="m" x="680" y="300" font-size="22">MORE OFTEN</text>
<g id="br1top"></g>
<text id="lbb" class="m" x="680" y="580" font-size="22">A BIGGER VERSION</text>
<g id="br1bot"></g>
<text id="nat" class="d" x="120" y="800" font-size="44">Nobody forces it. Growth comes naturally.</text>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The push-up recipe.</text>
<text class="b" x="120" y="176" font-size="32">Fogg gave himself an unusual recipe.</text>
<g id="card"><rect class="s-line" x="120" y="230" width="600" height="300" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="156" y="290" font-size="22">FOGG’S RECIPE</text>
<text class="d5" x="156" y="370" font-size="36">After I use the bathroom,</text>
<g id="rc2"><text class="d" x="156" y="450" font-size="36" style="fill:var(--gain)">I will do two push-ups.</text></g></g>
<path class="s-line" d="M780 620H1440" stroke-width="6" stroke-linecap="round"/>
<g id="fig"><circle id="phd" r="28"/><path id="pbody" fill="none" stroke-width="12" stroke-linecap="round"/><path id="parm" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<text id="x2" class="d" x="1200" y="440" font-size="64" style="fill:var(--gain)">×2</text>
<text id="blbl" class="m" x="120" y="664" font-size="20" style="fill:var(--gain)">MORE PUSH-UPS EACH DAY, OVER TIME</text>
<g id="bars"></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Success spreads.</text>
<text class="b" x="120" y="176" font-size="32">One win, and you see yourself as someone who can change.</text>
<g id="rings"></g>
<g id="core"><circle class="gain" cx="420" cy="480" r="60"/><path d="M392 482l20 20 34-40" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="ican"><text class="d" x="420" y="820" font-size="44" text-anchor="middle">“I can change.”</text></g>
<g id="blocks"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Untangle the knot.</text>
<text class="b" x="120" y="176" font-size="32">Fogg compares an unwanted habit to a tangled knot.</text>
<g id="kng"><g id="kn"></g>
<path id="pullL" class="s-ink" d="M300 470H760M330 446l-30 24 30 24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="pullR" class="s-ink" d="M840 470H1300M1270 446l30 24-30 24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text id="tight" class="m" x="800" y="690" font-size="22" text-anchor="middle" style="fill:var(--loss)">YANK HARD AND IT GETS TIGHTER</text>
<path id="loose" class="s-gain" d="M860 500C980 600 1080 520 1180 660S1320 760 1400 740" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="800"/>
<g id="easy"><text class="d" x="120" y="790" font-size="44">Break it into behaviors.</text><text class="d" x="120" y="846" font-size="44" style="fill:var(--gain)">Loosen the easiest strand first.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with new habits.</text>
<text class="b" x="120" y="176" font-size="32">Build a few good new habits before you attack the old ones.</text>
<g id="tro"><path class="gain" d="M340 250h120v40a60 60 0 0 1-120 0z"/><rect class="gain" x="392" y="348" width="16" height="28"/><rect class="gain" x="360" y="376" width="80" height="18" rx="4"/>
<path class="s-gain" d="M340 266h-24v18q0 26 30 30M460 266h24v18q0 26-30 30" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="490" y="320" font-size="22">SKILLS + CONFIDENCE</text></g>
<g id="pots5"></g>
<text id="lbl5" class="m" x="400" y="760" font-size="22" text-anchor="middle">NEW HABITS FIRST</text>
<path id="arr5" class="s-muted" d="M760 560H1060M1036 536l24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="old5"><g id="old5k"></g><text class="m" x="1220" y="700" font-size="22" text-anchor="middle">OLD HABITS, LATER</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Run the formula backwards.</text>
<text class="b" x="120" y="176" font-size="32">Imagine you scroll your phone in bed every night.</text>
<g id="bed"><rect class="ink" x="120" y="340" width="24" height="210" rx="6"/><rect class="ink" x="144" y="440" width="400" height="50" rx="8"/>
<rect class="ink" x="160" y="490" width="16" height="50"/><rect class="ink" x="512" y="490" width="16" height="50"/>
<ellipse cx="200" cy="430" rx="44" ry="12" fill="var(--line)"/><circle class="ink" cx="205" cy="402" r="26"/>
<path d="M236 440q150-70 300 0z" fill="var(--line)"/><text class="m" x="120" y="610" font-size="22">EVERY NIGHT</text></g>
<g id="ph6"><rect class="ink" x="270" y="318" width="34" height="58" rx="6"/><path id="glw" class="s-loss" d="M262 310l-14-14M312 310l14-14M287 300v-20" stroke-width="5" stroke-linecap="round"/></g>
<text id="zz" class="d5" x="250" y="350" font-size="36" style="fill:var(--muted)">z z</text>
<g id="cd0"><rect class="s-line" x="640" y="240" width="840" height="140" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="700" cy="310" r="32"/><text class="d" x="700" y="324" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">1</text>
<rect class="ink" x="792" y="270" width="40" height="72" rx="8"/><path class="s-ink" d="M812 342q0 24 40 24" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="d5" x="900" y="306" font-size="36">Remove the prompt</text><text class="m" x="900" y="346" font-size="20">CHARGE THE PHONE IN THE KITCHEN</text></g>
<g id="cd1"><rect class="s-line" x="640" y="410" width="840" height="140" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="700" cy="480" r="32"/><text class="d" x="700" y="494" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">2</text>
<path class="s-ink" d="M798 470v-16a22 22 0 0 1 44 0v16" fill="none" stroke-width="8"/><rect class="ink" x="782" y="470" width="76" height="56" rx="8"/>
<text class="d5" x="900" y="476" font-size="36">Make it harder to do</text><text class="m" x="900" y="516" font-size="20">IF REMOVING THE PROMPT FAILS</text></g>
<g id="cd2"><rect class="s-line" x="640" y="580" width="840" height="140" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="700" cy="650" r="32"/><text class="d" x="700" y="664" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">3</text>
<circle class="s-ink" cx="820" cy="650" r="40" fill="none" stroke-width="6"/><line id="ndl" class="s-gain" x1="820" y1="650" x2="820" y2="620" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="900" y="646" font-size="36">Then lower motivation</text><text class="m" x="900" y="686" font-size="20">ONLY AFTER THAT</text></g>
<g id="fm"><text class="d" x="120" y="770" font-size="64">B = MAP</text><text class="m" x="120" y="820" font-size="20">RUN IT BACKWARDS: PROMPT, ABILITY, MOTIVATION</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Swap it out.</text>
<text class="b" x="120" y="176" font-size="32">Keep the old prompt. Attach a better tiny behavior.</text>
<g id="pb"><rect class="s-ink" x="120" y="380" width="400" height="140" rx="18" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="150" y="425" font-size="20">PROMPT</text><text class="d5" x="150" y="485" font-size="38">Climb into bed</text>
<path class="s-muted" d="M540 450h150m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="oc"><g id="ocm"><rect x="720" y="380" width="480" height="140" rx="18" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="750" y="425" font-size="20" style="fill:var(--loss)">OLD BEHAVIOR</text><text class="d5" x="750" y="485" font-size="38">Scroll the phone</text></g></g>
<g id="nc"><g id="ncm"><rect class="gain" x="720" y="380" width="480" height="140" rx="18"/>
<text class="m" x="750" y="425" font-size="20" style="fill:var(--on-gain)">NEW TINY BEHAVIOR</text><text class="d5" x="750" y="485" font-size="38" style="fill:var(--on-gain)">Read one page</text></g></g>
<path id="swp" class="s-ink" d="M1250 470v220M1232 490l18-20 18 20M1232 670l18 20 18-20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="bk"><path class="gain" d="M1390 420l-80-22v104l80 22zM1390 420l80-22v104l-80 22z" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></g>
<g id="same"><text class="d" x="120" y="820" font-size="48">Same prompt. Better behavior.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one habit to loosen.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Tonight, find its prompt,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and make it <tspan style="fill:var(--gain)">disappear</tspan>.</text></g>
<text class="m" x="143" y="700" font-size="26">UNTANGLE THE EASIEST STRAND</text>
<g id="g8"><circle id="pr8" class="s-muted" cx="1300" cy="740" r="110" fill="none" stroke-width="5" stroke-dasharray="12 10"/><g id="k8"></g></g>
</g>