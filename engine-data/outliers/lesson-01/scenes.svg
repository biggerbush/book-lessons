<g id="risk2"><rect class="s-ink" x="1330" y="350" width="120" height="110" rx="18" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1360 395a30 30 0 0 1 60 0" fill="none" stroke-width="5"/><line id="needle" class="s-loss" x1="1390" y1="395" x2="1390" y2="368" stroke-width="5" stroke-linecap="round"/><text class="m" x="1390" y="520" font-size="22" text-anchor="middle">EXTRA WEIGHT</text></g>
<g id="sick"><text class="d" x="120" y="800" font-size="46">By the textbook, they should have been <tspan style="fill:var(--loss)">sick</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Was it their genes?</text>
<text class="b" x="120" y="176" font-size="32">Wolf checked whether Roseto's health ran in the family.</text>
<rect class="s-line" x="120" y="240" width="440" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="22">ROSETO FAMILIES</text>
<rect class="s-line" x="760" y="240" width="720" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="790" y="280" font-size="22">RELATIVES ELSEWHERE IN AMERICA</text>
<g id="rlinks"></g><g id="tree"></g><g id="rel"></g>
<g id="relNo"><text class="m" x="790" y="690" font-size="20" style="fill:var(--loss)">NO SPECIAL HEART HEALTH</text></g>
<g id="blood"><text class="d" x="120" y="810" font-size="56">The secret was not in their blood.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Was it the land?</text>
<text class="b" x="120" y="176" font-size="32">Maybe it was the place itself.</text>
<g id="bars"><text class="m" x="120" y="250" font-size="20">BARS: HEART-DISEASE DEATHS (SCHEMATIC)</text>
<rect id="bar0" class="loss" x="310" y="530" width="60" height="0"/><rect id="bar1" class="gain" x="770" y="530" width="60" height="0"/><rect id="bar2" class="loss" x="1230" y="530" width="60" height="0"/></g>
