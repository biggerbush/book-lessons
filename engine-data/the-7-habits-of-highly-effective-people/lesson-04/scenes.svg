<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 7 HABITS OF HIGHLY EFFECTIVE PEOPLE · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Put first things</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">first.</text>
<text class="b" x="120" y="600" font-size="32">Make time for what matters before it becomes an emergency.</text>
<g id="phone"><rect class="s-ink" x="1220" y="250" width="170" height="310" rx="26" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="1305" cy="535" r="8"/><g id="pills"></g></g>
<g id="buzz"><path class="s-loss" d="M1195 340v40M1180 330v60M1415 340v40M1430 330v60" stroke-width="5" stroke-linecap="round"/></g>
<g id="wm"><text class="m" x="1305" y="640" font-size="24" text-anchor="middle" style="fill:var(--gain)">WHAT MATTERS?</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Some tasks shout. Some whisper.</text>
<text class="b" x="120" y="176" font-size="32">Most of us answer the shouting first.</text>
<g id="notes"></g>
<g id="shout"><text class="m" x="120" y="760" font-size="22" style="fill:var(--loss)">SHOUTS: RIGHT NOW!</text></g>
<g id="me"></g>
<g id="ans"><path class="s-loss" d="M790 500H620m24-22-24 22 24 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="plant"><path class="s-gain" d="M1240 600V470" stroke-width="7" stroke-linecap="round"/><path id="lf1" class="gain" d="M1240 520q-40-50-80-30q30 40 80 30z"/><path id="lf2" class="gain" d="M1240 500q40-50 80-30q-30 40-80 30z"/><path class="ink" d="M1160 600h160l-20 120h-120z"/><text class="m" x="1240" y="770" font-size="22" text-anchor="middle">WHISPERS</text></g>
<g id="whis"><path class="s-gain" d="M1240 380q-24 34-24 50a24 24 0 0 0 48 0q0-16-24-50z" fill="none" stroke-width="4" stroke-dasharray="8 6"/><text class="m" x="1290" y="420" font-size="20">NEEDS WATER</text></g>
<g id="wait"><text class="m" x="1240" y="812" font-size="20" text-anchor="middle" style="fill:var(--gain)">THE QUIET THINGS KEEP WAITING</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two simple questions.</text>
<text class="b" x="120" y="176" font-size="32">Covey sorts every activity on one grid.</text>
<rect id="t1" class="loss" x="800" y="280" width="300" height="520" fill-opacity=".14" opacity="0"/>
<rect id="t2" class="gain" x="800" y="280" width="600" height="260" fill-opacity=".2" opacity="0"/>
<g id="grid"><rect class="s-ink" x="800" y="280" width="600" height="520" fill="none" stroke-width="6"/><path class="s-ink" d="M1100 280v520M800 540h600" stroke-width="5"/></g>
<g id="hc"><text class="m" x="950" y="262" font-size="20" text-anchor="middle" style="fill:var(--loss)">URGENT</text><text class="m" x="1250" y="262" font-size="20" text-anchor="middle">NOT URGENT</text></g>
<g id="hr"><text class="m" x="780" y="418" font-size="20" text-anchor="end" style="fill:var(--gain)">IMPORTANT</text><text class="m" x="780" y="678" font-size="20" text-anchor="end">NOT IMPORTANT</text></g>
<g id="q1"><path class="s-loss" d="M120 320h60m-20-20 20 20-20 20" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="210" y="334" font-size="40">Is it urgent?</text><text class="m" x="210" y="374" font-size="20">PRESSES ON YOU RIGHT NOW</text></g>
<g id="q2"><path id="st2" class="gain"/><text class="d5" x="210" y="504" font-size="40">Is it important?</text><text class="m" x="210" y="544" font-size="20">MOVES YOU TOWARD WHAT YOU VALUE</text></g>
<g id="n1"><text class="d" x="950" y="450" font-size="110" text-anchor="middle">1</text></g>
<g id="n2"><text class="d" x="1250" y="450" font-size="110" text-anchor="middle" style="fill:var(--gain)">2</text></g>
<g id="n3"><text class="d" x="950" y="710" font-size="110" text-anchor="middle" style="fill:var(--muted)">3</text></g>
<g id="n4"><text class="d" x="1250" y="710" font-size="110" text-anchor="middle" style="fill:var(--muted)">4</text></g>
<g id="four"><text class="d5" x="120" y="740" font-size="36">Four boxes, or quadrants.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Quadrant 1: the fire box.</text>
<text class="b" x="120" y="176" font-size="32">Urgent and important.</text>
<g id="fbox"><rect class="s-loss" x="120" y="230" width="640" height="490" rx="18" fill="var(--stage)" stroke-width="6"/></g>
<g id="fires"></g>
<g id="fl"><text class="m" x="150" y="290" font-size="22">CRISES</text><text class="m" x="150" y="330" font-size="22">PRESSING PROBLEMS</text><text class="m" x="150" y="370" font-size="22">DEADLINE PROJECTS</text></g>
<g id="mini"><rect class="loss" x="1320" y="220" width="80" height="80"/><path class="s-ink" d="M1320 220h160v160h-160zM1400 220v160M1320 300h160" fill="none" stroke-width="4"/><text class="m" x="1400" y="414" font-size="18" text-anchor="middle">QUADRANT 1</text></g>
<g id="clk"><circle class="s-ink" cx="960" cy="350" r="90" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M960 350v-50" stroke-width="7" stroke-linecap="round"/><path id="hand" class="s-loss" d="M960 350v-72" stroke-width="5" stroke-linecap="round"/><circle class="ink" cx="960" cy="350" r="8"/></g>
<g id="must"><text class="d5" x="960" y="520" font-size="38" text-anchor="middle" style="fill:var(--gain)">Must be handled.</text></g>
<g id="st"><path id="spray" class="s-muted" d="M1140 640L780 620" stroke-width="4" stroke-dasharray="12 10"/></g>
<g id="stress"><text class="d" x="120" y="810" font-size="40">Live here: stressed, exhausted, always firefighting.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="60">Quadrants 3 and 4: wasted boxes.</text>
<text class="b" x="120" y="176" font-size="32">Urgent but trivial, or neither urgent nor important.</text>
<g id="pn3"><rect class="s-line" x="120" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d5" x="150" y="300" font-size="40">3 · Interruptions</text><path class="s-ink" d="M160 600h560" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="340" y="548" width="80" height="52" rx="6"/><text class="m" x="150" y="670" font-size="20">URGENT · NOT IMPORTANT</text></g>
<g id="bubs"></g>
<g id="pn4"><rect class="s-line" x="840" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><text class="d5" x="870" y="300" font-size="40">4 · Time wasters</text><rect x="910" y="480" width="320" height="80" rx="16" fill="var(--line)"/><rect x="890" y="550" width="360" height="60" rx="16" fill="var(--muted)"/><path class="s-ink" d="M920 610v30M1220 610v30M1375 520v40M1340 560h70" stroke-width="6" stroke-linecap="round"/><rect class="s-ink" x="1300" y="420" width="150" height="100" rx="8" fill="var(--stage)" stroke-width="6"/><rect id="tvs" class="loss" x="1312" y="432" width="126" height="76"/><text class="m" x="870" y="670" font-size="20">NOT URGENT · NOT IMPORTANT</text></g>
<g id="x3"><circle class="s-loss" cx="710" cy="290" r="28" fill="none" stroke-width="6"/><path class="s-loss" d="M690 310l40-40" stroke-width="6"/></g>
<g id="x4"><circle class="s-loss" cx="1430" cy="290" r="28" fill="none" stroke-width="6"/><path class="s-loss" d="M1410 310l40-40" stroke-width="6"/></g>
<g id="out"><text class="d" x="120" y="800" font-size="44">Effective people stay out as much as possible.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Quadrant 2: the quiet box.</text>
<text class="b" x="120" y="176" font-size="32">Important, but not urgent.</text>
<g id="qbox"><rect class="s-gain" x="120" y="230" width="700" height="460" rx="18" fill="var(--stage)" stroke-width="6"/></g>
<g id="i0"><rect class="s-ink" x="245" y="330" width="100" height="90" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="245" y="330" width="100" height="22"/><path class="s-ink" d="M270 380h0M295 380h0M320 380h0M270 402h0M295 402h0" stroke-width="10" stroke-linecap="round"/><text class="m" x="295" y="460" font-size="20" text-anchor="middle">PLANNING</text></g>
<g id="i1"><text class="m" x="645" y="460" font-size="20" text-anchor="middle">RELATIONSHIPS</text></g>
<g id="i2"><path class="s-ink" d="M295 520l45 15v25c0 35-25 50-45 60c-20-10-45-25-45-60v-25z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="295" y="660" font-size="20" text-anchor="middle">PREVENTION</text></g>
<g id="i3"><path class="s-gain" d="M600 610L680 530m-40 0h40v40" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="645" y="660" font-size="20" text-anchor="middle">OPPORTUNITIES</text></g>
<g id="heart"><text class="d" x="120" y="780" font-size="40">The heart of effective personal management.</text></g>
<g id="sqs"><rect id="sq2" class="gain"/><rect id="sq1" class="loss" fill-opacity=".25" stroke="var(--loss)" stroke-width="5"/><g id="f1"></g><text class="m" x="1060" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">QUADRANT 2</text><text class="m" x="1340" y="640" font-size="20" text-anchor="middle">FIRE BOX</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where does the time come from?</text>
<text class="b" x="120" y="176" font-size="32">Take it from quadrants 3 and 4.</text>
<g id="lb3"><rect class="s-loss" x="120" y="230" width="400" height="200" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="145" y="268" font-size="20">QUADRANT 3</text></g>
<g id="lb4"><rect class="s-loss" x="120" y="460" width="400" height="200" rx="16" fill="var(--stage)" stroke-width="5"/><text class="m" x="145" y="498" font-size="20">QUADRANT 4</text></g>
<g id="qb2"><rect class="s-gain" x="1080" y="230" width="400" height="430" rx="16" fill="var(--stage)" stroke-width="6"/><text class="m" x="1110" y="268" font-size="20" style="fill:var(--gain)">QUADRANT 2</text><text id="qm" class="d" x="1280" y="610" font-size="140" text-anchor="middle" style="fill:var(--muted)">?</text></g>
<g id="tblocks"></g>
<g id="yes"><text class="d" x="1210" y="400" font-size="84" style="fill:var(--gain)">YES</text></g>
<g id="nob"><rect class="s-loss" x="160" y="690" width="260" height="100" rx="24" fill="var(--stage)" stroke-width="6"/><path class="s-loss" d="M160 730l-30 30h30" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="d" x="290" y="762" font-size="60" text-anchor="middle" style="fill:var(--loss)">No.</text><text class="m" x="460" y="750" font-size="20">EVEN TO THINGS THAT SEEM NICE</text></g>
<g id="yesl"><text class="d" x="120" y="850" font-size="40">You need a bigger yes burning inside.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plan the week, not the day.</text>
<text class="b" x="120" y="176" font-size="32">Schedule your priorities first.</text>
<g id="week"><rect class="s-ink" x="560" y="230" width="910" height="450" rx="12" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M560 280h910M690 230v450M820 230v450M950 230v450M1080 230v450M1210 230v450M1340 230v450" stroke-width="3"/></g>
<g id="roles"></g>
<g id="fills"></g>
<g id="goals"></g>
<g id="quote"><text class="d5" x="120" y="780" font-size="34">“The key is not to prioritize what’s on your schedule,</text><text class="d5" x="120" y="830" font-size="34">but to schedule your <tspan style="fill:var(--gain)">priorities</tspan>.”</text></g>
</g>
<g id="s8" opacity="0">
<g id="l1"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">This Sunday, pick one</text></g>
<g id="l2"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">quadrant two</tspan> task you</text></g>
<g id="l3"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">keep postponing.</text></g>
<g id="cal"><rect class="s-ink" x="1240" y="590" width="220" height="210" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1243" y="593" width="214" height="40"/><path class="s-line" d="M1271 634v166M1303 634v166M1334 634v166M1366 634v166M1397 634v166M1429 634v166" stroke-width="3"/></g>
<rect id="blk" class="gain" x="1433" y="500" width="23" height="60" rx="4"/>
<g id="cl"><text class="m" x="143" y="700" font-size="26">SCHEDULE IT BEFORE THE URGENT CAN CLAIM IT</text></g>
</g>