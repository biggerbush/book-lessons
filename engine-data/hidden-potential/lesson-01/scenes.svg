<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What skill did you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">give up on because</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">you <tspan style="fill:var(--gain)">started slow</tspan>?</text></g>
