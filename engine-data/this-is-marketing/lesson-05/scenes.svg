<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Status and tension</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">drive every decision.</text>
<text class="b" x="120" y="600" font-size="32">Why people only move when standing still feels uncomfortable.</text>
<path class="s-ink" d="M1180 660h120M1380 600h100" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M1440 600V440" stroke-width="6" stroke-linecap="round"/>
<path class="gain" d="M1436 444l-70 24 70 24z"/>
<path id="tline0" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="stuck"></g>
<text id="tlab0" class="m" x="1340" y="720" font-size="18" text-anchor="middle">TENSION</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The comfortable couch.</text>
<text class="b" x="120" y="176" font-size="32">Most people are fairly comfortable with how things are right now.</text>
<g id="couch">
<rect class="s-ink" x="180" y="420" width="400" height="120" rx="24" fill="var(--stage)" stroke-width="6"/>
<g id="sitter"></g>
<rect class="s-ink" x="160" y="520" width="440" height="80" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="140" y="470" width="60" height="150" rx="24" fill="var(--stage)" stroke-width="6"/>
<rect class="s-ink" x="560" y="470" width="60" height="150" rx="24" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M190 620v40M570 620v40" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="370" y="710" font-size="24" text-anchor="middle">TODAY</text>
</g>
<g id="ar1">
<path class="s-muted" d="M660 500H1110" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12"/>
<path class="s-muted" d="M1096 476l24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="newbox">
<rect x="1160" y="400" width="300" height="200" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="8"/>
<path class="gain" d="M1310 432l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z"/>
<text class="m" x="1310" y="546" font-size="24" text-anchor="middle" style="fill:var(--ink)">SOMETHING NEW</text>
</g>
<g id="rk"></g>
<g id="wins"><text class="d" x="120" y="810" font-size="52">So doing nothing usually wins.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Healthy tension.</text>
<text class="b" x="120" y="176" font-size="32">Open a gap between where someone is and where they could be.</text>
<g id="cliffs">
<path d="M120 560H560V820H120z" fill="var(--line)"/>
<path d="M1040 440H1480V820H1040z" fill="var(--line)"/>
<path class="s-ink" d="M120 820V560H560V820ZM1040 820V440H1480V820Z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<path class="s-muted" d="M590 610h420M612 592l-22 18 22 18M988 592l22 18-22 18" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="660" font-size="22" text-anchor="middle">THE GAP</text>
</g>
<g id="bA"><g id="pA"></g><text class="m" x="340" y="650" font-size="26" text-anchor="middle" style="fill:var(--ink)">TODAY</text></g>
<g id="bB"><g id="pB"></g><text class="m" x="1260" y="530" font-size="26" text-anchor="middle" style="fill:var(--gain)">A BETTER TOMORROW</text></g>
<path id="tline2" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text id="tlab2" class="d" x="800" y="380" font-size="40" text-anchor="middle" style="fill:var(--gain)">Tension</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tension is not fear.</text>
<text class="b" x="120" y="176" font-size="32">An honest invitation to a real change worth making.</text>
<g id="warn"><path class="s-loss" d="M400 250L560 540H240z" fill="none" stroke-width="8" stroke-linejoin="round"/><text class="d" x="400" y="510" font-size="140" text-anchor="middle" style="fill:var(--loss)">!</text></g>
<g id="xg"><path class="s-ink" d="M240 260L560 560M560 260L240 560" stroke-width="10" stroke-linecap="round"/><text class="m" x="400" y="690" font-size="24" text-anchor="middle">NO SCARE TACTICS</text></g>
<g id="door">
<path class="s-line" d="M640 610H1300" stroke-width="4"/>
<rect class="gain" x="960" y="250" width="240" height="360" fill-opacity=".3"/>
<rect class="s-ink" x="960" y="250" width="240" height="360" fill="none" stroke-width="7"/>
<path class="s-ink" d="M960 250L880 290V650L960 610z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle class="ink" cx="900" cy="460" r="8"/>
<text class="m" x="1080" y="690" font-size="24" text-anchor="middle">AN HONEST INVITATION</text>
</g>
<g id="walk"></g>
<g id="relief"><text class="d" x="120" y="800" font-size="44">Cross the gap, and the tension turns to <tspan style="fill:var(--gain)">relief</tspan>.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Everyone is watching.</text>
<g id="s4sub"><text class="b" x="120" y="176" font-size="32">Why does the gap matter so much? Godin points to status.</text></g>
<g id="lad"><path class="s-ink" d="M300 240V800M460 240V800M300 300h160M300 392h160M300 484h160M300 576h160M300 668h160M300 760h160" stroke-width="8" stroke-linecap="round"/><text class="m" x="380" y="842" font-size="20" text-anchor="middle">PECKING ORDER</text></g>
<g id="rungs"></g>
<text id="youl" class="m" x="490" y="466" font-size="22" style="fill:var(--gain)">YOU</text>
<g id="bub">
<rect class="s-ink" x="680" y="250" width="780" height="460" rx="60" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="636" cy="610" r="18" fill="var(--stage)" stroke-width="5"/>
<circle class="s-ink" cx="590" cy="650" r="10" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="740" y="330" font-size="22">BEFORE ALMOST ANY CHOICE: WILL THIS…</text>
</g>
<g id="o0"><path class="s-gain" d="M770 440V400M754 416l16-16 16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="830" y="438" font-size="48" style="fill:var(--gain)">Raise me?</text></g>
<g id="o1"><path class="s-loss" d="M770 500V540M754 524l16 16 16-16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="830" y="538" font-size="48" style="fill:var(--loss)">Lower me?</text></g>
<g id="o2"><path class="s-ink" d="M754 612h32M754 628h32" stroke-width="6" stroke-linecap="round"/><text class="d" x="830" y="638" font-size="48">Keep me where I am?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="64">Every scene is a status exchange.</text>
<text class="b" x="120" y="176" font-size="32">Improv teacher Keith Johnstone saw it between any two people.</text>
<g id="stg"><rect class="loss" x="180" y="210" width="1240" height="30"/><path class="loss" fill-opacity=".25" d="M180 240h140c-30 150-30 290 0 440H180z"/><path class="loss" fill-opacity=".25" d="M1420 240h-140c30 150 30 290 0 440h140z"/></g>
<g id="acts"><g id="actL"></g><g id="actR"></g></g>
<rect class="ink" x="180" y="680" width="1240" height="30"/>
<g id="arL"><path class="s-gain" d="M500 600V500M476 524l24-24 24 24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="arR"><path class="s-loss" d="M1100 500V600M1076 576l24 24 24-24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="life"></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of status.</text>
<g id="pd">
<rect class="s-line" x="120" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="440" y="266" font-size="20" text-anchor="middle">BEING AHEAD OF OTHERS</text>
<path d="M280 520h110v100H280zM390 460h110v160H390zM500 560h110v60H500z" fill="var(--line)"/>
<g id="podp"></g>
<path id="crw" class="gain" d="M415 340l-6-40 20 18 16-26 16 26 20-18-6 40z"/>
<text class="d5" x="440" y="668" font-size="36" text-anchor="middle">Dominance</text>
</g>
<g id="pa">
<rect class="s-line" x="840" y="220" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1160" y="266" font-size="20" text-anchor="middle">BEING IN SYNC WITH THE GROUP</text>
<g id="ring"></g>
<text class="d5" x="1160" y="668" font-size="36" text-anchor="middle">Affiliation</text>
</g>
<g id="prot">
<text class="d5" x="120" y="770" font-size="38">People often resist change to protect</text>
<text class="d5" x="120" y="822" font-size="38">the status they already have, even when it is low.</text>
<path class="s-loss" d="M1270 714l48 18v34c0 34-24 51-48 62-24-11-48-28-48-62v-34z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<path class="loss" d="M1270 738l26 10v20c0 18-13 28-26 34z"/>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Match the tension to the story.</text>
<text class="b" x="120" y="176" font-size="32">Understand which status story your audience is living.</text>
<g id="mapg">
<path class="s-ink" d="M160 260L360 220L560 260L760 220V660L560 700L360 660L160 700Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
