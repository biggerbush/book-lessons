<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Use tools</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">like a craftsman.</text>
<text class="b" x="120" y="600" font-size="32">Keep a tool only when it clearly earns its place.</text>
<rect class="s-ink" x="1120" y="220" width="280" height="520" rx="36" fill="var(--stage)" stroke-width="8"/>
<g id="apps"></g>
<circle class="s-ink" cx="1260" cy="690" r="16" fill="none" stroke-width="5"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The any-benefit trap.</text>
<text class="b" x="120" y="176" font-size="32">If a tool offers any benefit at all, we let it in.</text>
