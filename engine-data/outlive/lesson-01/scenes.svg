<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIVE · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Plan for your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">marginal decade.</text>
<text class="b" x="120" y="600" font-size="32">Why the years you live well matter more than the total.</text>
<circle class="s-line" cx="1300" cy="400" r="120" fill="var(--stage)" stroke-width="4"/>
<g id="ring"></g>
<line id="hand" class="s-ink" x1="1300" y1="400" x2="1300" y2="310" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1300" cy="400" r="12"/>
<g id="hike"><path class="s-line" d="M1160 736h100" stroke-width="4"/><path class="s-gain" d="M1248 670L1262 734" stroke-width="6" stroke-linecap="round"/></g>
<g id="chair"><text class="m" x="1300" y="700" font-size="22" text-anchor="middle">OR</text><path class="s-loss" d="M1440 640v100M1350 726h90M1356 726v14M1434 726v14" fill="none" stroke-width="6" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of years.</text>
<text class="b" x="120" y="176" font-size="32">Every life can be measured in two ways.</text>
<g id="tl"><path class="s-ink" d="M120 270H1400" stroke-width="6" stroke-linecap="round"/><g id="ticks"></g><text class="m" x="120" y="314" font-size="20">BIRTH</text><text class="m" x="1400" y="314" font-size="20" text-anchor="end">DEATH</text></g>
<g id="lsl"><text class="m" x="120" y="384" font-size="22">LIFESPAN · HOW MANY YEARS YOU LIVE</text></g>
<rect id="lsb" class="ink" x="120" y="404" width="0" height="80" rx="10"/>
<g id="hsl"><text class="m" x="120" y="584" font-size="22" style="fill:var(--gain)">HEALTHSPAN · YEARS WITH A BODY AND MIND THAT WORK WELL</text></g>
<rect id="hsb" class="gain" x="120" y="604" width="0" height="80" rx="10"/>
<rect id="hsr" x="1070" y="604" width="330" height="80" rx="10" fill="none" stroke="var(--loss)" stroke-width="4" stroke-dasharray="10 8"/>
<g id="hst"><text class="d" x="120" y="800" font-size="40">Lifespan counts years. Healthspan counts good ones.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The marginal decade.</text>
<text class="b" x="120" y="176" font-size="32">The final stretch of life, often spent in slow decline.</text>
<rect class="gain" x="120" y="236" width="1030" height="64" rx="10" fill-opacity=".35"/>
<g id="seg"><rect class="loss" x="1150" y="236" width="250" height="64" rx="10"/><path class="s-ink" d="M1150 320v14h250v-14" fill="none" stroke-width="4"/><text class="m" x="1275" y="370" font-size="22" text-anchor="middle">MARGINAL DECADE</text></g>
<path id="decl" d="M1162 246L1388 290" stroke="var(--stage)" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="cw"><rect class="s-line" x="120" y="430" width="520" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="476" font-size="20">CARRYING GROCERIES</text>
<circle class="ink" cx="290" cy="560" r="24"/><path class="s-ink" d="M296 588Q330 630 320 690M320 690L300 750M320 690L345 750M310 612L376 636" fill="none" stroke-width="12" stroke-linecap="round"/>
<path class="s-ink" d="M370 630h90M380 630v120M450 630v120" fill="none" stroke-width="7" stroke-linecap="round"/>
<rect class="loss" x="490" y="660" width="70" height="80" rx="8"/><path class="s-loss" d="M505 662q20-36 40 0" fill="none" stroke-width="6"/></g>
<g id="cf"><rect class="s-line" x="680" y="430" width="520" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="710" y="476" font-size="20">GETTING OFF THE FLOOR</text>
<path class="s-line" d="M720 740h440" stroke-width="4"/><circle class="ink" cx="820" cy="640" r="24"/><path class="s-ink" d="M824 668L840 730L940 736" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M1060 730V540M1036 564l24-24 24 24" fill="none" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round"/><path class="s-loss" d="M1030 600l60 60M1090 600l-60 60" stroke-width="8" stroke-linecap="round"/></g>
<g id="qm"><text class="d" x="1340" y="720" font-size="300" text-anchor="middle" style="fill:var(--gain)">?</text><text class="d5" x="120" y="830" font-size="38">What do you want those years to look like?</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. The body.</text>
<text class="b" x="120" y="176" font-size="32">With age, we tend to lose muscle, strength, and balance.</text>
<g id="arm"><path class="s-gain" d="M150 520H320L300 330" fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="240" cy="492" r="50"/><circle class="gain" cx="300" cy="310" r="36"/></g>
<g id="bars"></g>
<g id="stg"><path id="stp" class="s-ink" fill="var(--line)" stroke-width="6" stroke-linejoin="round"/><g id="climber"></g><text class="m" x="820" y="240" font-size="20">A FLIGHT OF STAIRS CAN BECOME A WALL</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. The mind.</text>
<text class="b" x="120" y="176" font-size="32">Memory, focus, and quick thinking can fade.</text>
<g id="brn"><circle class="s-ink" cx="360" cy="500" r="190" fill="var(--stage)" stroke-width="7"/><path class="s-line" d="M360 320V680" stroke-width="4"/><g id="nodes"></g></g>
<g id="ml0"><text class="m" x="620" y="420" font-size="26">MEMORY</text></g>
<g id="ml1"><text class="m" x="620" y="480" font-size="26">FOCUS</text></g>
<g id="ml2"><text class="m" x="620" y="540" font-size="26">QUICK THINKING</text></g>
<g id="ml3"><text class="m" x="620" y="610" font-size="20" style="fill:var(--loss)">CAN FADE YEARS BEFORE</text><text class="m" x="620" y="640" font-size="20" style="fill:var(--loss)">ANYONE NOTICES</text></g>
<g id="pz"></g>
<g id="pzt"><text class="d" x="120" y="800" font-size="44">Losing them means losing independence.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">3. Emotional health.</text>
<text class="b" x="120" y="176" font-size="32">Connection and purpose are part of a good life, not extras.</text>
<g id="face"><circle class="gain" cx="330" cy="470" r="150"/><circle cx="285" cy="430" r="15" fill="var(--on-gain)"/><circle cx="375" cy="430" r="15" fill="var(--on-gain)"/><path id="smile" fill="none" stroke="var(--on-gain)" stroke-width="12" stroke-linecap="round" d="M260 515Q330 515 400 515"/></g>
<g id="pl0"><rect class="s-gain" x="560" y="380" width="360" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="m" x="740" y="428" font-size="26" text-anchor="middle">CONNECTION</text></g>
<g id="pl1"><rect class="s-gain" x="560" y="490" width="360" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="m" x="740" y="538" font-size="26" text-anchor="middle">PURPOSE</text></g>
<g id="frd"><path class="s-gain" d="M1100 380Q1170 320 1240 380Q1310 320 1380 380" fill="none" stroke-width="5" stroke-dasharray="10 8"/></g>
<g id="joy"><text class="d" x="120" y="790" font-size="46">A long life without joy is not the goal.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two curves.</text>
<text class="b" x="120" y="176" font-size="32">Age along the bottom, health up the side.</text>
<g id="ax"><path class="s-ink" d="M220 240V760H1440" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1440" y="800" font-size="22" text-anchor="end">AGE</text><text class="m" x="240" y="250" font-size="22">HEALTH</text></g>
<g id="gapg"><path class="gain" fill-opacity=".18" d="M220 300C700 290 1050 300 1180 360C1260 420 1290 600 1320 760L1300 700C1260 690 1150 670 1000 580C800 460 500 320 220 300Z"/><text class="d" x="960" y="420" font-size="34" text-anchor="middle" style="fill:var(--gain)">MORE GOOD YEARS</text></g>
<path id="cg" class="s-muted" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M220 300C500 320 800 460 1000 580C1150 670 1260 690 1300 700L1320 760"/>
<path id="cn" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M220 300C700 290 1050 300 1180 360C1260 420 1290 600 1320 760"/>
<g id="lg"><text class="m" x="700" y="570" font-size="22">USUAL PATH</text><text class="m" x="1050" y="735" font-size="20">LONG, WEAK TAIL</text></g>
<g id="ln"><text class="m" x="560" y="270" font-size="22" style="fill:var(--gain)">IDEAL PATH</text></g>
<g id="gl"><text class="d" x="120" y="845" font-size="44">More good years, not just more years.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start decades early.</text>
<text class="b" x="120" y="176" font-size="32">The marginal decade is shaped long before it arrives.</text>
<g id="tl2"><path class="s-ink" d="M120 720H1440M1420 704l20 16-20 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="380" y="764" font-size="22" text-anchor="middle">MIDLIFE</text><text class="m" x="1250" y="764" font-size="22" text-anchor="middle">MARGINAL DECADE</text></g>
<g id="ya"></g>
<g id="blk"></g>
<g id="carry"><path class="s-gain" d="M590 520Q880 360 1180 520M1154 488L1180 520L1140 524" fill="none" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round"/></g>
<g id="old"><path class="s-ink" d="M1284 668C1284 642 1316 642 1316 666L1320 718" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="cal"><rect class="s-ink" x="700" y="220" width="200" height="180" rx="12" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="700" y="220" width="200" height="44" rx="12"/><text class="m" x="800" y="251" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">NOW</text><g id="cells"></g><circle id="ring2" class="s-gain" cx="732" cy="290" r="22" fill="none" stroke-width="5"/><text class="d" x="120" y="835" font-size="40">The best time to plan for that decade is now.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">Picture a day in your</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2" style="fill:var(--gain)">marginal decade.</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">Write three things</text></g>
<g id="qd"><text class="d" x="136" y="600" font-size="80" letter-spacing="-2">you want to do.</text></g>
<g id="nb"><rect class="s-ink" x="1160" y="300" width="280" height="340" rx="14" fill="var(--stage)" stroke-width="6"/><g id="holes"></g>
<text class="d" x="1190" y="412" font-size="36">1</text><text class="d" x="1190" y="492" font-size="36">2</text><text class="d" x="1190" y="572" font-size="36">3</text>
<path id="nl0" class="s-gain" d="M1240 400H1410" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="nl1" class="s-gain" d="M1240 480H1410" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="nl2" class="s-gain" d="M1240 560H1410" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></g>
<g id="keep"><text class="m" x="143" y="740" font-size="26">KEEP THAT LIST SOMEWHERE YOU’LL SEE IT</text></g>
</g>