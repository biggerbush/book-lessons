<g id="opt6"><text class="d" x="120" y="815" font-size="42">It feels like optimism, but it leaves us unprepared.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Facing the risk.</text>
<text class="b" x="120" y="176" font-size="32">Notice it, name it, ask what could go wrong.</text>
