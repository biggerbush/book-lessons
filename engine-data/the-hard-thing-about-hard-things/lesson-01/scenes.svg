<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The easy part.</text>
<text class="b" x="120" y="176" font-size="32">Business shelves are full of advice for problems that are already clear.</text>
<rect class="s-ink" x="120" y="240" width="580" height="440" rx="8" fill="none" stroke-width="6"/>
<path class="s-ink" d="M120 386h580M120 533h580" stroke-width="6"/>
<g id="spines1"></g>
<text class="m" x="120" y="720" font-size="20">ADVICE FOR CLEAR PROBLEMS</text>
<g id="adv"></g>
<g id="easy"><text class="d" x="120" y="810" font-size="52">Horowitz: that part is the <tspan style="fill:var(--gain)">easy</tspan> part.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hard part.</text>
<text class="b" x="120" y="176" font-size="32">What you do when the easy advice stops working.</text>
<g id="tgt">
<circle class="s-ink" cx="380" cy="440" r="140" fill="none" stroke-width="6"/>
<circle class="s-ink" cx="380" cy="440" r="95" fill="none" stroke-width="6"/>
<circle class="s-ink" cx="380" cy="440" r="50" fill="none" stroke-width="6"/>
<circle class="gain" cx="380" cy="440" r="18"/>
