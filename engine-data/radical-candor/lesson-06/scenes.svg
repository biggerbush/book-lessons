<g id="bored"><text class="m" x="760" y="610" font-size="22" style="fill:var(--loss)">NO FRESH CHALLENGE:</text><text class="m" x="760" y="646" font-size="22" style="fill:var(--loss)">BORED, LOOKING ELSEWHERE</text><path class="s-loss" d="M1200 638h80m-18-18 18 18-18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
