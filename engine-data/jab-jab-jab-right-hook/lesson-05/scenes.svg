<g id="ph"><rect class="s-ink" x="1250" y="200" width="200" height="340" rx="28" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="1272" y="236" width="156" height="34" rx="17" fill="none" stroke-width="3"/><circle class="s-ink" cx="1292" cy="252" r="8" fill="none" stroke-width="3"/><g id="rb"></g></g>
