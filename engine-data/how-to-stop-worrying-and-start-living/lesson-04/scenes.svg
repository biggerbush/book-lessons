<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO STOP WORRYING AND START LIVING · LESSON 4</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Let the law</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">of averages</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">calm you.</text>
<text class="b" x="120" y="630" font-size="32">Most of what you dread is far less likely than it feels.</text>
<g id="face"><g id="fi">
<circle class="s-ink" cx="1320" cy="400" r="120" fill="var(--stage)" stroke-width="8"/>
<circle class="ink" cx="1280" cy="385" r="10"/><circle class="ink" cx="1360" cy="385" r="10"/>
