<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 7 HABITS OF HIGHLY EFFECTIVE PEOPLE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Seek first</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to understand.</text>
<text class="b" x="120" y="600" font-size="32">Why the best listeners hold their answers and win trust</text>
<g id="t0p"></g>
<g id="tb1"><rect class="s-ink" x="1030" y="300" width="180" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1060 335h120M1060 365h80" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1115" cy="426" r="7"/></g>
<g id="tb2"><rect class="s-loss" x="1290" y="300" width="180" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><circle class="loss" cx="1340" cy="350" r="10"/><circle class="loss" cx="1380" cy="350" r="10"/><circle class="loss" cx="1420" cy="350" r="10"/><circle class="loss" cx="1380" cy="426" r="7"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The borrowed glasses.</text>
<text class="b" x="120" y="176" font-size="32">An eye doctor who barely hears your complaint.</text>
<g id="g1p"></g>
<g id="cmp"><rect class="s-muted" x="790" y="220" width="260" height="100" rx="20" fill="var(--stage)" stroke-width="4"/><path class="s-muted" d="M825 255h190M825 285h120" stroke-width="7" stroke-linecap="round"/><circle cx="900" cy="345" r="7" fill="var(--muted)"/></g>
<g id="try"><rect class="s-ink" x="160" y="220" width="440" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="380" y="282" font-size="34" text-anchor="middle">“These work for me.”</text><circle class="ink" cx="380" cy="345" r="7"/></g>
<g id="gls"><circle class="s-ink" cx="-26" cy="0" r="22" fill="none" stroke-width="6"/><circle class="s-ink" cx="26" cy="0" r="22" fill="none" stroke-width="6"/><path class="s-ink" d="M-4 0h8" stroke-width="6"/></g>
<g id="chart"><rect class="s-ink" x="1140" y="230" width="340" height="440" rx="14" fill="var(--stage)" stroke-width="6"/><g id="rows"></g></g>
<text id="lw" class="m" x="1310" y="710" font-size="22" text-anchor="middle" style="fill:var(--loss)">EVERYTHING LOOKS WORSE</text>
<text id="fit" class="d" x="120" y="800" font-size="52">His glasses fit his eyes, not yours.</text>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">We listen to reply.</text>
<text class="b" x="120" y="176" font-size="32">That doctor is all of us in conversation.</text>
<g id="g2p"></g>
<g id="sp2"><rect class="s-gain" x="160" y="230" width="280" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M195 265h210M195 295h140" stroke-width="7" stroke-linecap="round"/><circle class="gain" cx="300" cy="358" r="7"/></g>
<g id="wds"></g>
<g id="fun"><text class="m" x="740" y="365" font-size="20" text-anchor="middle" style="fill:var(--loss)">MY STORY</text><rect class="s-loss" x="700" y="380" width="80" height="180" rx="14" fill="var(--stage)" stroke-width="6"/></g>
<g id="thk"><circle class="s-loss" cx="1085" cy="372" r="8" fill="none" stroke-width="4"/><circle class="s-loss" cx="1060" cy="340" r="12" fill="none" stroke-width="4"/><rect class="s-loss" x="940" y="210" width="400" height="110" rx="55" fill="var(--stage)" stroke-width="5"/><g id="typ"></g><text class="m" x="1120" y="700" font-size="20" text-anchor="middle">REHEARSING MY ANSWER</text></g>
<g id="rx"><path class="loss" d="M690 620l34-24v48z"/><rect class="s-loss" x="726" y="592" width="294" height="56" rx="28" fill="var(--stage)" stroke-width="5"/><text class="m" x="873" y="627" font-size="20" text-anchor="middle" style="fill:var(--loss)">WHAT WORKED FOR ME</text></g>
<text id="flt" class="d5" x="120" y="790" font-size="40">We filter their words, then prescribe what worked for us.</text>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The listening ladder.</text>
<text class="b" x="120" y="176" font-size="32">Five levels, from ignoring to empathy.</text>
<g id="lad0"><path class="s-ink" d="M300 230V810M480 230V810" stroke-width="8" stroke-linecap="round"/></g>
<g id="lad"></g>
<circle id="clb" class="gain" cx="390" cy="726" r="22"/>
<g id="frm"><rect class="s-gain" x="1100" y="240" width="360" height="300" rx="14" fill="none" stroke-width="6" stroke-dasharray="14 10"/><text class="m" x="1280" y="515" font-size="20" text-anchor="middle" style="fill:var(--gain)">THEIR FRAME OF REFERENCE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four bad reflexes.</text>
<text class="b" x="120" y="176" font-size="32">How we respond when we listen from our own story.</text>
<g id="cards"></g>
<text id="mys" class="m" x="120" y="680" font-size="22">ALL FILTERED THROUGH OUR OWN STORY</text>
<text id="none" class="d" x="120" y="780" font-size="52" style="fill:var(--loss)">None of these make people feel understood.</text>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Father and son.</text>
<text class="b" x="120" y="176" font-size="32">Covey pictures a teenage son.</text>
<g id="g5p"></g>
<g id="sb"><rect class="s-ink" x="900" y="220" width="540" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1170" y="284" font-size="40" text-anchor="middle">“School is pointless.”</text><circle class="ink" cx="1180" cy="345" r="7"/></g>
<g id="wb"><rect class="s-loss" x="140" y="220" width="560" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="m" x="420" y="280" font-size="24" text-anchor="middle" style="fill:var(--loss)">ADVICE · WARNINGS · ADVICE</text><circle class="loss" cx="420" cy="350" r="7"/></g>
<g id="cb"><rect class="s-gain" x="140" y="220" width="560" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="420" y="282" font-size="32" text-anchor="middle">“You sound really frustrated.”</text><circle class="gain" cx="420" cy="350" r="7"/></g>
<g id="arw"></g>
<g id="wav"></g>
<path id="shd" class="s-loss" d="M1085 400q-70 140 0 280" fill="none" stroke-width="8" stroke-linecap="round"/>
<text id="ph1" class="d" x="120" y="790" font-size="48" style="fill:var(--loss)">The son shuts down.</text>
<text id="ph2" class="d" x="120" y="790" font-size="48" style="fill:var(--gain)">The son keeps talking. The real worry comes out.</text>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Diagnose before you prescribe.</text>
<text class="b" x="120" y="176" font-size="32">Like a good doctor.</text>
<g id="dx"><rect class="s-ink" x="120" y="230" width="380" height="150" rx="18" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="190" cy="295" r="28" fill="none" stroke-width="7"/><path class="s-ink" d="M210 315l26 26" stroke-width="9" stroke-linecap="round"/><text class="d5" x="260" y="320" font-size="36">1 Diagnose</text></g>
<g id="px"><path class="s-muted" d="M515 305h80m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-ink" x="620" y="230" width="380" height="150" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="650" y="290" width="70" height="32" rx="16"/><text class="d5" x="750" y="320" font-size="36">2 Prescribe</text></g>
<g id="qt"><rect class="s-gain" x="120" y="430" width="880" height="270" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="160" y="485" font-size="20" style="fill:var(--gain)">COVEY’S PRINCIPLE</text><text class="d" x="160" y="570" font-size="50">Seek first to understand,</text><text class="d" x="160" y="640" font-size="50">then to be understood.</text></g>
<g id="tank"><rect class="ink" x="1260" y="222" width="60" height="30" rx="6"/><rect class="s-ink" x="1170" y="250" width="240" height="440" rx="40" fill="var(--stage)" stroke-width="7"/><rect id="lvl" class="gain" x="1184" y="680" width="212" height="0" rx="28"/><text class="m" x="1290" y="740" font-size="20" text-anchor="middle">BEING UNDERSTOOD = AIR</text></g>
<text id="ue" class="d5" x="120" y="820" font-size="40">Until people get it, they can’t hear anything else.</text>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then be understood.</text>
<text class="b" x="120" y="176" font-size="32">The second half matters too, and it takes courage.</text>
<g id="scl"><path class="s-ink" d="M410 300V620M330 620h160" stroke-width="8" stroke-linecap="round"/><line id="beam" class="s-ink" x1="210" y1="300" x2="610" y2="300" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="410" cy="300" r="14"/><g id="pans"></g></g>
<g id="roof"><path class="ink" d="M790 300L1135 230L1480 300Z"/><rect class="ink" x="790" y="630" width="690" height="20"/></g>
<g id="pil"></g>
<text id="share" class="d5" x="120" y="800" font-size="40">Then share your view clearly, framed around their concerns.</text>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Can you restate their view</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">before you share <tspan style="fill:var(--gain)">your own</tspan>?</text></g>
<g id="qm"><text class="m" x="143" y="560" font-size="26">HOLD YOUR VIEW · SPEAK ONCE THEY SAY YOU GOT IT</text></g>
