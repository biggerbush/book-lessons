<rect class="gain" x="560" y="360" width="200" height="400"/>
<text class="m" x="340" y="800" font-size="20" text-anchor="middle">SMALL FIRM</text>
<text class="m" x="660" y="800" font-size="20" text-anchor="middle">LARGE, ESTABLISHED</text>
</g>
<g id="frag"><text class="m" x="340" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">ONE BAD YEAR COULD SINK IT</text></g>
<g id="thr">
<path class="s-ink" d="M200 520h720" stroke-width="4" stroke-dasharray="12 10"/>
