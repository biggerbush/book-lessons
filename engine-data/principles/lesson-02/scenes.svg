<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Embrace reality</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and deal with it.</text>
<text class="b" x="120" y="600" font-size="32">Why seeing the world clearly beats wishing it were different.</text>
<g id="t0f"></g>
<g id="t0c"><g id="t0cb"><g id="t0cp"></g><text class="m" x="1295" y="256" font-size="22" text-anchor="middle" style="fill:var(--loss)">WISH</text><circle cx="1282" cy="312" r="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><circle cx="1292" cy="346" r="6" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/></g></g>
<g id="t0g"><path d="M1160 540H1460" stroke="var(--gain)" stroke-width="8" stroke-linecap="round"/><text class="m" x="1310" y="580" font-size="20" text-anchor="middle" style="fill:var(--gain)">REALITY</text></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Truth first.</text>
<text class="b" x="120" y="176" font-size="32">Ray Dalio builds everything on one foundation.</text>
<g id="f1q"><text class="d5" x="120" y="290" font-size="40">“An accurate understanding of</text><text class="d5" x="120" y="346" font-size="40">reality is the essential</text><text class="d5" x="120" y="402" font-size="40">foundation for any good</text><text class="d5" x="120" y="458" font-size="40">outcome.”</text></g>
<g id="f1s"><rect x="120" y="520" width="640" height="80" rx="12" fill="var(--gain)"/><text class="m" x="150" y="568" font-size="22" style="fill:var(--on-gain)">ACCURATE UNDERSTANDING OF REALITY</text></g>
<g id="h1w"><g id="h1wc"></g><g id="h1wh"></g><text class="m" x="1000" y="790" font-size="22" text-anchor="middle" style="fill:var(--loss)">WISH</text></g>
<g id="h1f"><g id="h1fh"></g><rect x="1220" y="660" width="240" height="80" rx="10" fill="var(--gain)"/><text class="m" x="1340" y="710" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">FACTS</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be a hyperrealist.</text>
<text class="b" x="120" y="176" font-size="32">Dalio’s simple formula for a successful life.</text>
<g id="eq2"></g>
<g id="p2a"><rect x="120" y="420" width="420" height="330" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><path d="M150 710H510" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><path d="M330 640V700" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 8"/><g id="bal1"><circle class="loss" cx="330" cy="520" r="44"/><path d="M330 564q-14 30 0 60" fill="none" stroke="var(--ink)" stroke-width="3"/></g><text class="m" x="330" y="790" font-size="20" text-anchor="middle">FANTASIES THAT NEVER LAND</text></g>
<g id="p2b"><rect x="590" y="420" width="420" height="330" rx="18" fill="var(--stage)" stroke="var(--line)" stroke-width="3"/><path d="M620 710H980" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><g id="st2"></g><g id="pf2"></g><path d="M780 640q40-10 60-50m-22 4 22-4 2 22" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="800" y="790" font-size="20" text-anchor="middle">A LIFE THAT NEVER REACHES</text></g>
<g id="p2c"><rect x="1060" y="420" width="420" height="330" rx="18" fill="var(--stage)" stroke="var(--gain)" stroke-width="4"/><path d="M1090 710H1450" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><g id="pf3"></g><path d="M1340 524L1214 672" stroke="var(--ink)" stroke-width="3"/><circle class="gain" cx="1340" cy="480" r="44"/></g>
<g id="cap3"><text class="m" x="1270" y="790" font-size="22" text-anchor="middle" style="fill:var(--gain)">HYPERREALIST</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The wildebeest and the hyenas.</text>
<text class="b" x="120" y="176" font-size="32">Dalio watched hyenas bring down a young wildebeest.</text>
<g id="r3"><text class="m" x="120" y="250" font-size="22">FIRST REACTION</text><text class="d" x="120" y="330" font-size="64" style="fill:var(--loss)">Cruel. Wrong.</text></g>
<g id="dal3"><g id="dal3f"></g><path d="M352 468L650 560" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/><text class="m" x="300" y="660" font-size="20" text-anchor="middle">DALIO WATCHING</text></g>
<g id="hunt">
<path d="M1430 740V330M1430 430L1385 345" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>
<ellipse class="ink" cx="1370" cy="320" rx="100" ry="28"/>
<path d="M680 740H1460" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
<g id="herd3"></g>
</g>
<g id="big3"></g>
<g id="fr3"><rect x="660" y="250" width="820" height="520" rx="14" fill="none" stroke="var(--ink)" stroke-width="4" stroke-dasharray="14 10"/><text class="m" x="690" y="296" font-size="20">STEP BACK: THE BIGGER PICTURE</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Zoom out to the whole system.</text>
<text class="b" x="120" y="176" font-size="32">The hunt keeps the hyenas fed and the herd in balance.</text>
<g id="ring4"><path d="M500 280A220 220 0 0 1 500 720" fill="none" stroke-width="6"/><path d="M500 720A220 220 0 0 1 500 280" fill="none" stroke-width="6"/><path d="M704 484l16 16 16-16M264 516l16-16 16 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="hd4"></g>
<g id="nA"><rect x="370" y="248" width="260" height="64" rx="32" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="m" x="500" y="288" font-size="22" text-anchor="middle" style="fill:var(--ink)">HYENAS FED</text></g>
<g id="nB"><rect x="330" y="688" width="340" height="64" rx="32" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="m" x="500" y="728" font-size="22" text-anchor="middle" style="fill:var(--ink)">HERD IN BALANCE</text></g>
<g id="t4a"><text class="m" x="900" y="330" font-size="22">FOR ONE ANIMAL</text><text class="d" x="900" y="400" font-size="56" style="fill:var(--loss)">Terrible.</text></g>
<g id="t4b"><text class="m" x="900" y="490" font-size="22">FOR THE WHOLE</text><text class="d" x="900" y="560" font-size="56" style="fill:var(--gain)">It works.</text></g>
<g id="t4c"><text class="d5" x="900" y="680" font-size="32">Nature optimizes for the whole,</text><text class="d5" x="900" y="728" font-size="32">not for the individual.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Should versus is.</text>
<text class="b" x="120" y="176" font-size="32">Stop arguing with how things should be. Ask how they work.</text>
<path d="M160 760H860" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="490" y="260" width="20" height="500" rx="6"/>
<g id="sh5"><g id="sh5i"><polygon points="490,300 240,300 200,340 240,380 490,380" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="350" y="348" font-size="22" text-anchor="middle" style="fill:var(--loss)">HOW IT SHOULD BE</text></g></g>
<g id="is5"><polygon class="gain" points="510,440 760,440 800,480 760,520 510,520"/><text class="m" x="650" y="488" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">HOW IT IS</text></g>
<g id="pa5"></g><g id="pb5"></g>
<g id="t5a"><text class="d5" x="960" y="320" font-size="36">Argue with reality,</text><text class="d5" x="960" y="372" font-size="36">and you miss its lesson.</text></g>
<g id="st1"><rect x="960" y="500" width="520" height="80" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><text class="m" x="990" y="548" font-size="22" style="fill:var(--ink)">1 · ASK HOW IT ACTUALLY WORKS</text></g>
<g id="st2b"><path d="M1220 592V636m-14-14 14 14 14-14" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="960" y="650" width="520" height="80" rx="14"/><text class="m" x="990" y="698" font-size="22" style="fill:var(--on-gain)">2 · THEN DECIDE WHAT TO DO</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Look past the first result.</text>
<text class="b" x="120" y="176" font-size="32">Every choice has second-order consequences.</text>
<g id="hd6"><text class="m" x="520" y="260" font-size="22">FIRST ORDER · NOW</text><text class="m" x="1040" y="260" font-size="22">SECOND ORDER · LATER</text><path d="M520 712H1460m-16-14 16 14-16 14" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1480" y="760" font-size="20" text-anchor="end">TIME</text></g>
<g id="mk6a"><path d="M720 590V690" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 8"/><path d="M720 698V726" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="720" cy="712" r="7" fill="var(--stage)" stroke="var(--ink)" stroke-width="3"/><text class="m" x="720" y="760" font-size="20" text-anchor="middle">NOW</text></g>
<g id="mk6b"><path d="M1260 590V690" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 8"/><path d="M1260 698V726" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="1260" cy="712" r="7" fill="var(--stage)" stroke="var(--ink)" stroke-width="3"/><text class="m" x="1260" y="760" font-size="20" text-anchor="middle">LATER</text></g>
<g id="c1a"><rect class="ink" x="124" y="325" width="16" height="50" rx="4"/><rect class="ink" x="182" y="325" width="16" height="50" rx="4"/><path d="M140 350h42" stroke="var(--ink)" stroke-width="8"/><text class="d5" x="212" y="362" font-size="40">Exercise</text><rect x="520" y="290" width="400" height="120" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="544" y="362" font-size="34" style="fill:var(--loss)">Pain, lost time</text></g>
<g id="c1b"><path d="M930 350h80m-16-16 16 16-16 16" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1040" y="290" width="440" height="120" rx="16"/><text class="d5" x="1064" y="362" font-size="34" style="fill:var(--on-gain)">Better health</text></g>
<g id="c2a"><circle cx="156" cy="510" r="22" fill="none" stroke="var(--ink)" stroke-width="16"/><text class="d5" x="212" y="522" font-size="40">Junk food</text><rect class="gain" x="520" y="450" width="400" height="120" rx="16"/><text class="d5" x="544" y="522" font-size="34" style="fill:var(--on-gain)">Pleasure</text></g>
<g id="c2b"><path d="M930 510h80m-16-16 16 16-16 16" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040" y="450" width="440" height="120" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="1064" y="522" font-size="34" style="fill:var(--loss)">The bill arrives</text></g>
<g id="w6"><text class="d" x="120" y="825" font-size="40">Chase first-order results, lose the second.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Work with reality.</text>
<text class="b" x="120" y="176" font-size="32">Like a sailor using the wind.</text>
<g id="sea7"><g id="wd7"></g><path id="wv7" fill="none" stroke="var(--loss)" stroke-width="5" stroke-linecap="round"/>
<g id="boat"><path class="ink" d="M300 590h240l-40 50H340z"/><path d="M420 590V340" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M428 350Q560 470 428 580z"/></g></g>
<g id="cp7"><circle cx="1220" cy="440" r="150" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/><g id="tk7"></g>
<text class="m" x="1220" y="342" font-size="24" text-anchor="middle">N</text><text class="m" x="1220" y="556" font-size="24" text-anchor="middle">S</text><text class="m" x="1328" y="448" font-size="24" text-anchor="middle">E</text><text class="m" x="1112" y="448" font-size="24" text-anchor="middle">W</text>
<g id="nd7"><path class="gain" d="M0-90L16 0H-16z"/><path class="ink" d="M0 90L16 0H-16z"/><circle cx="0" cy="0" r="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="4"/></g>
<text class="m" x="1220" y="640" font-size="22" text-anchor="middle">CLEAR SIGHT</text></g>
<g id="ww7"><text class="m" x="1310" y="300" font-size="22" style="fill:var(--gain)">WHAT WORKS</text></g>
<g id="o7"><text class="d" x="120" y="800" font-size="44">Stop blaming the weather. Own your outcomes.</text></g>
</g>
<g id="s8" opacity="0">
<g id="q8a"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Where do you keep insisting</text></g>
<g id="q8b"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">on how things <tspan style="fill:var(--loss)">should be</tspan>?</text></g>
<g id="lab8"><text class="m" x="143" y="590" font-size="26">THIS WEEK: WRITE DOWN HOW IT ACTUALLY WORKS</text></g>
<g id="pad8"><rect x="1200" y="580" width="200" height="220" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="m" x="1300" y="626" font-size="18" text-anchor="middle">HOW IT WORKS</text>
