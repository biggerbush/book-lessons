<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Tuning in</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to the Source.</text>
<text class="b" x="120" y="600" font-size="32">Why great ideas are caught, not built from scratch.</text>
<g id="tdots"></g>
<circle id="tidea" class="gain" cx="1300" cy="230" r="26"/>
<path class="s-ink" d="M1170 560Q1180 690 1300 690Q1420 690 1430 560M1170 560l-24-30M1430 560l24-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-ink" d="M1250 690v110M1350 690v110" stroke-width="8" stroke-linecap="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Source.</text>
<text class="b" x="120" y="176" font-size="32">A vast field of ideas, drifting all around us.</text>
<g id="cloud"><path class="s-ink" d="M260 560a120 120 0 0 1 20-210a150 150 0 0 1 260-90a160 160 0 0 1 280 40a140 140 0 0 1 140 260z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="600" y="340" font-size="22" text-anchor="middle">THE SOURCE</text></g>
<g id="bits"></g>
<g id="srcN"><text class="m" x="160" y="620" font-size="22">THEY BELONG TO NO ONE IN PARTICULAR</text></g>
<path id="rarr" class="s-gain" d="M960 420C1100 400 1200 440 1270 500" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<circle id="rdot" class="gain" r="12"/>
<g id="rcv"></g>
<g id="srcA"><text class="d5" x="120" y="720" font-size="40">We don’t create them from nothing.</text></g>
<g id="srcB"><text class="d" x="120" y="810" font-size="60" style="fill:var(--gain)">We receive them.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">We are antennas.</text>
<text class="b" x="120" y="176" font-size="32">Signals are always in the air around us.</text>
<g id="waves"></g>
<g id="ant">
<path class="s-ink" d="M400 640V360M340 640l60-200 60 200" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="gain" cx="400" cy="360" r="16"/>
<rect class="s-ink" x="280" y="640" width="240" height="140" rx="18" fill="var(--stage)" stroke-width="7"/>
<circle class="s-line" cx="350" cy="710" r="40" fill="none" stroke-width="6"/>
<g id="knob"><circle class="ink" cx="460" cy="710" r="26"/><path d="M460 710v-20" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/></g>
</g>
<g id="anA"><text class="d5" x="720" y="330" font-size="38">An antenna doesn’t make the music.</text></g>
<g id="anB"><text class="d" x="720" y="410" font-size="60" style="fill:var(--gain)">It picks it up.</text></g>
<g id="tune">
<text class="m" x="720" y="520" font-size="22">FREQUENCY</text>
<path class="s-ink" d="M720 580H1440" stroke-width="5" stroke-linecap="round"/>
<path class="gain" d="M1228 546h24l-12 14z"/>
<path id="needle" d="M0 545V615" stroke-width="7" stroke-linecap="round"/>
<polyline id="trace" fill="none" stroke-width="5" stroke-linejoin="round"/>
</g>
<g id="anT"><text class="d" x="120" y="840" font-size="40">Tune in, and the signal comes through clearly.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Forcing it creates static.</text>
<text class="b" x="120" y="176" font-size="32">Strain, worry and ego drown out the signal.</text>
<g id="fist">
<rect class="ink" x="220" y="360" width="200" height="170" rx="44"/>
<path d="M270 380v70M320 380v70M370 380v70M230 480h110" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="260" y="530" width="120" height="60"/>
<text class="m" x="320" y="640" font-size="22" text-anchor="middle">STRAIN</text>
</g>
<g id="ohand">
<rect class="gain" x="240" y="420" width="160" height="130" rx="30"/>
<rect class="gain" x="244" y="290" width="32" height="160" rx="16"/><rect class="gain" x="284" y="280" width="32" height="170" rx="16"/><rect class="gain" x="324" y="285" width="32" height="165" rx="16"/><rect class="gain" x="364" y="300" width="32" height="150" rx="16"/>
<path class="s-gain" d="M250 490l-60-60" stroke-width="32" stroke-linecap="round"/>
<rect class="gain" x="270" y="540" width="100" height="50"/>
<text class="m" x="320" y="640" font-size="22" text-anchor="middle" style="fill:var(--gain)">RELEASE</text>
</g>
<polyline id="sig" fill="none" stroke-width="5" stroke-linejoin="round"/>
<g id="stc0"><rect x="640" y="580" width="220" height="60" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="750" y="618" font-size="22" text-anchor="middle" style="fill:var(--loss)">WORRY</text></g>
<g id="stc1"><rect x="900" y="580" width="220" height="60" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="1010" y="618" font-size="22" text-anchor="middle" style="fill:var(--loss)">EGO</text></g>
<g id="stc2"><rect x="1160" y="580" width="220" height="60" rx="30" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="1270" y="618" font-size="22" text-anchor="middle" style="fill:var(--loss)">PRESSURE</text></g>
<g id="stA"><text class="d" x="120" y="760" font-size="48">Loosen your grip. Let ideas arrive.</text></g>
<g id="stB"><text class="d5" x="120" y="830" font-size="34">A calm, receptive state lets more come through.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stay open.</text>
<text class="b" x="120" y="176" font-size="32">Don’t decide in advance what the idea should be.</text>
<g id="oph">
<circle class="s-muted" cx="310" cy="390" r="70" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text class="d" x="310" y="418" font-size="80" text-anchor="middle" style="fill:var(--muted)">?</text>
<path class="s-ink" d="M170 520Q180 610 310 610Q440 610 450 520M310 610v-50" fill="none" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="310" y="670" font-size="18" text-anchor="middle">NOT DECIDED IN ADVANCE</text>
</g>
<g id="cup1">
<path class="s-ink" d="M640 420L680 680H880L920 420" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="780" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">EMPTY · READY</text>
</g>
<ellipse id="splash" class="s-gain" cx="780" cy="668" rx="14" ry="5" fill="none" stroke-width="4"/>
<circle id="drop1" class="gain" cx="780" r="14"/>
<g id="cup2">
<polygon class="loss" points="1080,420 1360,420 1320,680 1120,680" fill-opacity=".35"/>
<path class="s-ink" d="M1080 420L1120 680H1320L1360 420M1130 480h180M1140 540h160M1150 600h140" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="1220" y="730" font-size="20" text-anchor="middle">ALREADY FULL</text>
</g>
<circle id="drop2" class="gain" r="14"/>
<g id="opT"><text class="d" x="120" y="830" font-size="44">A full mind has no room for anything new.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ideas look for a way in.</text>
<text class="b" x="120" y="176" font-size="32">If one person doesn’t act, the idea may find another.</text>
<path id="arL" class="s-line" d="M740 400Q560 420 430 540" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<path id="arR" class="s-gain" d="M860 400Q1040 420 1170 540" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="ppl"><g id="pL"></g><g id="pR"></g></g>
<g id="bulbW"><g id="bulb">
<path class="s-gain" d="M-70 0h-20M70 0h20M-50-50l-14-14M50-50l14-14M0-70v-20" stroke-width="6" stroke-linecap="round"/>
<circle class="gain" r="50"/><rect class="ink" x="-22" y="44" width="44" height="30" rx="6"/>
</g></g>
<g id="lbL"><text class="m" x="400" y="810" font-size="22" text-anchor="middle">ONE PERSON WAITS</text></g>
<g id="lbR"><text class="m" x="1200" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">ANOTHER ACTS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Catch it before it fades.</text>
<text class="b" x="120" y="176" font-size="32">When something arrives, honor it quickly.</text>
<g id="nb">
<rect class="s-ink" x="160" y="250" width="460" height="470" rx="14" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M190 360H590M190 480H590M190 600H590" stroke-width="3"/>
<g id="rings"></g>
</g>
<g id="sl0"><text class="m" x="190" y="345" font-size="20">WRITE</text></g>
<g id="sl1"><text class="m" x="190" y="465" font-size="20">HUM</text></g>
<g id="sl2"><text class="m" x="190" y="585" font-size="20">SKETCH</text></g>
<path id="sc0" class="s-gain" d="M300 340q15-30 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="sc1" class="s-gain" d="M300 460h40v-50h40v50h40v-30h40v30h40v-40h40" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="sc2" class="s-gain" d="M310 590l60-70 50 40 60-60 60 90" pathLength="1" stroke-dasharray="1" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="nbdot" class="gain" r="16"/>
<g id="clk">
<circle class="s-ink" cx="1120" cy="450" r="160" fill="var(--stage)" stroke-width="7"/>
<g id="cticks"></g>
<line id="hand" class="s-ink" x1="1120" y1="450" x2="1120" y2="330" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="1120" cy="450" r="12"/>
<g id="bars"></g>
<text class="m" x="1120" y="680" font-size="20" text-anchor="middle">WAITING FOR THE PERFECT MOMENT</text>
</g>
<g id="actT"><text class="d" x="120" y="820" font-size="44">Wait too long and the signal is gone.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Less pressure.</text>
<text class="b" x="120" y="176" font-size="32">You don’t have to generate everything alone.</text>
<g id="lpP"></g>
<g id="wt"><rect class="loss" x="280" y="330" width="240" height="110" rx="14"/><text class="m" x="400" y="393" font-size="20" text-anchor="middle" style="fill:var(--stage)">DO IT ALL ALONE</text></g>
<g id="lpA"><path class="s-ink" d="M400 474V404" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="400" cy="394" r="12"/></g>
<g id="lgW"><text class="d5" x="780" y="330" font-size="44" style="fill:var(--muted)">Lone genius</text></g>
<line id="lgS" class="s-ink" x1="772" y1="316" x2="772" y2="316" stroke-width="6" stroke-linecap="round"/>
<g id="sbW"><g id="sbars"></g><text class="m" x="780" y="690" font-size="20">AVAILABLE · PAYING ATTENTION</text></g>
<g id="suW"><g id="sudots"></g><text class="m" x="780" y="840" font-size="20">KEEP SHOWING UP · STAY TUNED</text></g>
<g id="fthW"><g id="fth"><path class="gain" d="M0-80C40-40 30 40 0 80C-30 40-40-40 0-80z"/><path class="s-ink" d="M0-70V100" stroke-width="4" stroke-linecap="round"/></g></g>
</g>

<g id="s8" opacity="0">
<g id="qm"><text class="m" x="143" y="600" font-size="26">THIS WEEK: CATCH AN IDEA WITHIN ONE MINUTE</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What signal might</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">you have been <tspan style="fill:var(--gain)">missing?</tspan></text></g>
<g id="cant"><g id="cw"></g><path class="s-ink" d="M1360 760V620M1320 760l40-110 40 110" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle class="gain" cx="1360" cy="610" r="14"/></g>
</g>