<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Contain the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">small stuff.</text>
<text class="b" x="120" y="600" font-size="32">Stop letting new requests pile up and pull work in instead.</text>
<path class="s-ink" d="M1160 460v70h300v-70" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="flood"></g>
<g id="notyet"><rect class="gain" x="1180" y="270" width="260" height="84" rx="16" transform="rotate(-6 1310 312)"/><text class="d" x="1310" y="330" font-size="44" text-anchor="middle" transform="rotate(-6 1310 312)" style="fill:var(--on-gain)">NOT YET</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The pile-up.</text>
<text class="b" x="120" y="176" font-size="32">Colleagues keep tossing new requests onto her desk.</text>
<g id="cols"></g>
<g id="worker"></g>
<rect class="ink" x="600" y="640" width="440" height="18" rx="4"/>
<path class="s-ink" d="M630 658v110M1010 658v110" stroke-width="8" stroke-linecap="round"/>
<g id="cap"><path class="s-loss" d="M830 500h170" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="1010" y="507" font-size="20" style="fill:var(--loss)">HER TIME</text></g>
<g id="pile"></g>
<g id="push"><text class="d" x="120" y="830" font-size="44">A push system: work lands, room or not.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Limit work at every scale.</text>
<text class="b" x="120" y="176" font-size="32">Newport’s fix works on three levels.</text>
<g id="lv0"><rect class="gain" x="580" y="230" width="360" height="90" rx="16"/><text class="d" x="760" y="290" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Mission</text><text class="m" x="1250" y="272" font-size="22">MISSIONS</text><text class="b" x="1250" y="306" font-size="24">few big aims</text></g>
<g id="lv1"><g id="projs"></g><text class="m" x="1250" y="446" font-size="22">PROJECTS</text><text class="b" x="1250" y="480" font-size="24">serve the missions</text></g>
<g id="lv2"><g id="tasks"></g><text class="m" x="1250" y="608" font-size="22">DAILY TASKS</text><text class="b" x="1250" y="642" font-size="24">finish today</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fewer at each level.</text>
<text class="b" x="120" y="176" font-size="32">Cap how much is active, at every scale.</text>
<g id="rows3"></g>
<g id="wish"><text class="d" x="120" y="810" font-size="48">A short list, not a wish list.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Corral the small stuff.</text>
<text class="b" x="120" y="176" font-size="32">Quick replies, little favors, tiny chores.</text>
<text id="chlbl" class="m" x="120" y="250" font-size="20">TINY CHORES</text>
<text class="m" x="120" y="384" font-size="20">YOUR DAY</text>
<rect class="s-ink" x="120" y="400" width="1360" height="140" rx="16" fill="var(--stage)" stroke-width="5"/>
<g id="focus"><rect class="gain" x="140" y="420" width="1036" height="100" rx="10"/><text class="d" x="658" y="484" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Focused work</text></g>
<g id="pen"><rect class="s-gain" x="1196" y="416" width="270" height="108" rx="10" fill="none" stroke-width="5" stroke-dasharray="12 8"/><text class="m" x="1466" y="572" font-size="20" text-anchor="end" style="fill:var(--gain)">TINY CHORES · SET BLOCK</text></g>
<text id="broken" class="m" x="120" y="580" font-size="22" style="fill:var(--loss)">FOCUS BROKEN ALL DAY</text>
<g id="chores"></g>
<g id="herd"><text class="d" x="120" y="720" font-size="46">Herd them into set blocks of time.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pull, don’t push.</text>
<text class="b" x="120" y="176" font-size="32">Take on new work only when you have room.</text>
<text class="m" x="120" y="226" font-size="22">WAITING</text>
<rect class="s-line" x="120" y="240" width="320" height="500" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="770" y="226" font-size="22">ACTIVE</text>
<rect class="s-ink" x="770" y="240" width="360" height="460" rx="18" fill="var(--stage)" stroke-width="5"/>
<rect class="s-line" x="790" y="280" width="320" height="110" rx="12" fill="none" stroke-width="3" stroke-dasharray="8 6"/>
<rect class="s-line" x="790" y="420" width="320" height="110" rx="12" fill="none" stroke-width="3" stroke-dasharray="8 6"/>
<rect class="s-line" x="790" y="560" width="320" height="110" rx="12" fill="none" stroke-width="3" stroke-dasharray="8 6"/>
<g id="doneG">
<text class="m" x="1190" y="226" font-size="22">DONE</text>
<rect class="s-line" x="1190" y="240" width="290" height="110" rx="18" fill="var(--stage)" stroke-width="4"/>
<path class="s-ink" d="M1138 380C1160 380 1170 370 1172 352m-12 10 12-10 10 12" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1190" y="390" font-size="20">FINISHED · SLOT FREES UP</text>
</g>
<g id="pullA"><path class="s-gain" d="M450 315H772" fill="none" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/><path class="s-gain" d="M756 299l18 16-18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="560" y="294" font-size="22" style="fill:var(--gain)">PULL</text></g>
<g id="queue"></g>
<g id="active"></g>
<g id="askG"></g>
<g id="askX"><path class="s-loss" d="M1160 460l30 30M1190 460l-30 30" stroke-width="7" stroke-linecap="round"/><text class="m" x="1220" y="550" font-size="20" style="fill:var(--loss)">NO ROOM YET</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">How software teams do it.</text>
<text class="b" x="120" y="176" font-size="32">As reported in the book, many teams already work this way.</text>
<g id="tank"><text class="m" x="340" y="262" font-size="22" text-anchor="middle">HOLDING TANK</text><path class="s-ink" d="M140 290V680q0 40 40 40h320q40 0 40-40V290" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="devs"></g>
<path id="pull6" class="s-gain" d="M560 480C620 420 660 420 700 480m-24-6 24 6 4-24" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g id="tickets"></g>
<g id="teamline"><text class="d" x="120" y="810" font-size="40">Each developer pulls the next item when a slot opens.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build your own holding tank.</text>
<text class="b" x="120" y="176" font-size="32">Two lists: one waiting, one active.</text>
<g id="padW"><rect class="s-ink" x="120" y="230" width="460" height="530" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="150" y="284" font-size="22">WAITING</text></g>
<g id="padA"><rect class="s-ink" x="660" y="230" width="420" height="300" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="690" y="284" font-size="22" style="fill:var(--gain)">ACTIVE</text></g>
<g id="rowsW"></g>
<g id="rowsA"></g>
<g id="asker"></g>
<g id="say"><rect class="s-gain" x="660" y="600" width="600" height="140" rx="22" fill="var(--stage)" stroke-width="5"/><text class="d5" x="690" y="662" font-size="40">It’s in my queue.</text><text class="m" x="690" y="708" font-size="20">AND ROUGHLY WHEN I’LL REACH IT</text></g>
<rect id="newAsk" class="loss" width="260" height="20" rx="10"/>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Choose your limit for</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">active projects.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">Write it down.</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">NEW WORK WAITS IN THE TANK · PULL IT IN WHEN A SLOT OPENS</text></g>
<g id="g8">
<rect class="gain" x="1240" y="300" width="200" height="60" rx="12"/>
<rect class="gain" x="1240" y="380" width="200" height="60" rx="12"/>
<rect class="s-ink" x="1240" y="460" width="200" height="60" rx="12" fill="none" stroke-width="4" stroke-dasharray="10 8"/>
<path class="s-ink" d="M1240 590v60q0 20 20 20h160q20 0 20-20v-60" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="c8" class="gain" x="1260" y="610" width="160" height="40" rx="10"/>
</g>
</g>