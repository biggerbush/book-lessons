<text class="m" x="1120" y="800" font-size="22" text-anchor="middle" style="fill:var(--gain)">RATED MORE DESIRABLE</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Newly scarce feels better.</text>
<text class="b" x="120" y="176" font-size="32">A jar of 10 suddenly swapped for a jar of 2.</text>
<rect class="ink" x="160" y="252" width="200" height="28" rx="8"/>
