<g id="kp1"><rect x="470" y="236" width="180" height="56" rx="14" fill="var(--stage)" class="s-gain" stroke-width="4"/><text class="m" x="560" y="271" font-size="20" text-anchor="middle">KEEP A PART</text></g>
