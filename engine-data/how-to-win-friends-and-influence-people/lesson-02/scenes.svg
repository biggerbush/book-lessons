</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">One hunger is never full.</text>
<text class="b" x="120" y="176" font-size="32">Food, sleep, health… and the wish to feel important.</text>
<g id="simple">
