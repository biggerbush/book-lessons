<rect class="ink" x="1236" y="466" width="28" height="20" rx="4"/>
</g>
<g id="learn"><text class="d" x="120" y="840" font-size="40">Difficulty wasn’t failure. It was a chance to learn.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The fixed mindset.</text>
<text class="b" x="120" y="176" font-size="32">Talent is a set amount, like a block of stone.</text>
