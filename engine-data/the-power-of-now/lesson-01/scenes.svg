<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You are not</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your mind.</text>
<text class="b" x="120" y="600" font-size="32">The voice in your head is not who you are.</text>
<g id="tHead"></g>
<g id="tBubW"><g id="tBub">
<rect class="s-ink" x="1000" y="220" width="380" height="130" rx="34" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1180 350l40 55l10-55" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path id="tq0" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round"/>
