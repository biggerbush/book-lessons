<rect class="gain" x="300" y="366" width="54" height="26" rx="13"/>
<rect class="ink" x="287" y="428" width="80" height="100" rx="24"/>
<path class="s-ink" d="M307 528v44M347 528v44" stroke-width="14" stroke-linecap="round"/>
</g>
<text class="d5" x="150" y="700" font-size="44">See it.</text>
<text class="m" x="150" y="740" font-size="20">ASTRONAUT ON GRAY DUST</text>
</g>
<g id="c1">
<rect class="s-line" x="593" y="230" width="414" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="800" y="300" font-size="20" text-anchor="middle">GOAL MET?</text>
<rect class="s-ink" x="720" y="330" width="160" height="160" rx="16" fill="none" stroke-width="8"/>
<path id="chk" pathLength="1" class="s-gain" d="M748 410l38 40 70-90" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="623" y="700" font-size="44">Check it.</text>
<text class="m" x="623" y="740" font-size="20">YOU CAN TELL FOR CERTAIN</text>
</g>
<g id="c2">
<rect class="s-line" x="1066" y="230" width="414" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="1273" cy="320" r="46"/>
