<g id="s0">
<text class="m" x="120" y="150" font-size="28">THINK AGAIN · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Debate like a dance,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a war.</text>
<text class="b" x="120" y="600" font-size="32">Why the best persuaders agree first and argue less</text>
<ellipse class="s-line" cx="1300" cy="484" rx="130" ry="60" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<circle id="secret" class="gain" cx="1300" cy="484" r="12"/>
<g id="tdance"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most of us argue like soldiers.</text>
<text class="b" x="120" y="176" font-size="32">We fire every argument and refuse to give any ground.</text>
<path class="s-line" d="M160 560H1440" stroke-width="5" stroke-linecap="round"/>
<g id="fighters"></g>
<g id="arrows"></g>
<g id="bricks"></g>
<g id="l1"><text class="m" x="300" y="610" font-size="22" text-anchor="middle">FIRE EVERY ARGUMENT</text></g>
<g id="l2"><text class="m" x="1140" y="610" font-size="22" text-anchor="middle" style="fill:var(--loss)">DIG IN</text></g>
<g id="cap1"><text class="d" x="120" y="780" font-size="46">Attacked people dig in and build walls.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Human vs machine.</text>
<text class="b" x="120" y="176" font-size="32">In 2019, champion debater Harish Natarajan faced IBM’s Project Debater.</text>
<g id="stg">
<rect class="ink" x="200" y="640" width="1200" height="30" rx="8" fill-opacity=".25"/>
<g id="harish2"></g>
<rect class="s-ink" x="330" y="520" width="140" height="120" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="400" y="710" font-size="20" text-anchor="middle">HARISH NATARAJAN</text>
</g>
<g id="robot">
<path class="s-ink" d="M1220 400v-28" stroke-width="5"/><circle class="ink" cx="1220" cy="366" r="8"/>
<rect class="s-ink" x="1170" y="400" width="100" height="80" rx="14" fill="var(--stage)" stroke-width="6"/>
<circle class="gain" cx="1198" cy="440" r="9"/><circle class="gain" cx="1242" cy="440" r="9"/>
<rect class="ink" x="1205" y="480" width="30" height="40"/>
<rect class="s-ink" x="1150" y="520" width="140" height="120" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1220" y="710" font-size="20" text-anchor="middle">PROJECT DEBATER</text>
</g>
<g id="docs"></g>
<g id="card">
<rect class="s-ink" x="520" y="220" width="560" height="120" rx="16" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="800" y="272" font-size="22" text-anchor="middle">SHOULD GOVERNMENTS</text>
<text class="m" x="800" y="308" font-size="22" text-anchor="middle">SUBSIDIZE PRESCHOOL?</text>
</g>
<g id="tags">
<rect class="s-ink" x="310" y="740" width="180" height="50" rx="25" fill="none" stroke-width="4"/>
<text class="m" x="400" y="773" font-size="24" text-anchor="middle">AGAINST</text>
<rect class="s-ink" x="1130" y="740" width="180" height="50" rx="25" fill="none" stroke-width="4"/>
<text class="m" x="1220" y="773" font-size="24" text-anchor="middle">FOR</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with agreement.</text>
<text class="b" x="120" y="176" font-size="32">He couldn’t match the evidence, so he named where they agreed.</text>
<g id="h3"><g id="h3p"></g><g id="mtn"></g>
<text class="m" x="200" y="630" font-size="20" text-anchor="middle">HARISH</text>
<text class="m" x="530" y="630" font-size="18" text-anchor="middle">MOUNTAIN OF EVIDENCE</text></g>
<g id="bub"><rect class="gain" x="120" y="220" width="480" height="100" rx="20"/><path class="gain" d="M170 318L196 420L250 318z"/>
<text class="d5" x="150" y="282" font-size="30" style="fill:var(--on-gain)">Here’s where we agree.</text></g>
<g id="fair"><text class="m" x="120" y="700" font-size="22" style="fill:var(--gain)">SEEN AS FAIR, NOT JUST FIGHTING</text></g>
<g id="aud">
<rect class="s-line" x="860" y="230" width="620" height="430" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1000" y="280" font-size="20" text-anchor="middle">AGAINST</text>
<text class="m" x="1320" y="280" font-size="20" text-anchor="middle">FOR</text>
<path class="s-muted" d="M1170 300V570" stroke-width="3" stroke-dasharray="6 8"/>
<g id="dots"></g><g id="movers"></g>
<text class="m" x="890" y="630" font-size="20">MORE LISTENERS MOVED HIS WAY</text>
</g>
<g id="cap3"><text class="d" x="120" y="800" font-size="44">Agree first, then argue.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">What skilled negotiators do.</text>
<text class="b" x="120" y="176" font-size="32">Researchers compared skilled negotiators with average ones.</text>
<g id="tbl">
<g id="grpS"></g>
<rect class="gain" x="190" y="466" width="220" height="22" rx="11"/>
<text class="m" x="300" y="530" font-size="22" text-anchor="middle" style="fill:var(--gain)">SKILLED</text>
<path class="s-line" d="M450 360V500" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
<g id="grpA" opacity=".55"></g>
<rect class="ink" x="490" y="466" width="220" height="22" rx="11" fill-opacity=".55"/>
<text class="m" x="600" y="530" font-size="22" text-anchor="middle">AVERAGE</text>
</g>
<g id="mag"><g id="magp"><circle class="s-ink" cx="0" cy="0" r="38" fill="var(--stage)" fill-opacity=".3" stroke-width="7"/><path class="s-ink" d="M28 28l26 26" stroke-width="12" stroke-linecap="round"/></g>
<text class="m" x="450" y="640" font-size="20" text-anchor="middle">WHAT DO THE BEST DO DIFFERENTLY?</text></g>
<path id="lens" class="gain" d="M1150 332.5A170 170 0 0 1 1150 607.5A170 170 0 0 1 1150 332.5z"/>
<g id="vn"><circle class="s-ink" cx="1050" cy="470" r="170" fill="none" stroke-width="5"/><circle class="s-ink" cx="1250" cy="470" r="170" fill="none" stroke-width="5"/>
<text class="m" x="980" y="478" font-size="24" text-anchor="middle">YOU</text><text class="m" x="1320" y="478" font-size="24" text-anchor="middle">THEM</text></g>
<g id="cg"><text class="d" x="1150" y="700" font-size="36" text-anchor="middle" style="fill:var(--gain)">Common ground</text></g>
<g id="cap4"><text class="d" x="120" y="800" font-size="44">Shared goals before demands.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fewer, stronger points.</text>
<text class="b" x="120" y="176" font-size="32">Each weak reason dilutes your strongest one.</text>
<g id="lbl5"><text class="m" x="160" y="290" font-size="20">A PILE OF MIXED REASONS</text><path class="s-ink" d="M160 700H740" stroke-width="5" stroke-linecap="round"/></g>
<g id="bars5"></g>
<g id="avgG"><path id="avg" class="s-ink" fill="none" stroke-width="4" stroke-dasharray="10 8"/><text id="avgT" class="m" x="740" y="328" font-size="20" text-anchor="end">AVERAGE STRENGTH</text></g>
<g id="shk"><text class="m" x="160" y="745" font-size="20" style="fill:var(--loss)">LISTENERS LATCH ONTO THE SHAKIEST POINT</text></g>
<g id="rp"><text class="m" x="920" y="290" font-size="20">A FEW SOLID REASONS</text><path class="s-ink" d="M920 700H1420" stroke-width="5" stroke-linecap="round"/>
<g id="rbars"></g><path class="s-ink" d="M920 373H1420" stroke-width="4" stroke-dasharray="10 8"/>
<text class="m" x="1420" y="361" font-size="20" text-anchor="end" style="fill:var(--gain)">STAYS STRONG</text></g>
<g id="cap5"><text class="d" x="120" y="820" font-size="40">A few solid reasons hit harder than a pile.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask, don’t push.</text>
<text class="b" x="120" y="176" font-size="32">Skilled negotiators asked many more questions.</text>
<g id="ppl6"></g>
<g id="qm"><text class="d" x="420" y="520" font-size="180" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="ear"><path class="s-gain" d="M568 446q16 24 0 48M586 432q26 38 0 76" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="think"><circle class="ink" cx="684" cy="416" r="8"/><circle class="ink" cx="704" cy="386" r="12"/>
<ellipse class="s-ink" cx="750" cy="330" rx="60" ry="40" fill="var(--stage)" stroke-width="5"/>
<circle class="gain" cx="728" cy="330" r="7"/><circle class="gain" cx="750" cy="330" r="7"/><circle class="gain" cx="772" cy="330" r="7"/></g>
<g id="l6a"><text class="m" x="120" y="680" font-size="22">YOU CARE WHAT THEY THINK</text></g>
<g id="l6b"><text class="m" x="120" y="716" font-size="22" style="fill:var(--gain)">THEY KEEP THINKING, NOT BRACING</text></g>
<polyline id="spir" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="l6c"><text class="m" x="1180" y="720" font-size="22" text-anchor="middle">ATTACK–DEFEND SPIRAL</text></g>
<g id="nox"><path class="s-ink" d="M1060 350L1300 590M1300 350L1060 590" stroke-width="12" stroke-linecap="round"/>
<text class="m" x="1180" y="760" font-size="24" text-anchor="middle" style="fill:var(--gain)">AVOIDED</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Debate like a dance.</text>
<text class="b" x="120" y="176" font-size="32">Move together, adjusting as you go.</text>
<g id="feet"></g>
<g id="dancers"><g id="pair">
<path class="s-line" d="M730 352Q800 296 870 352" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
<g id="dA"></g><g id="dB"></g>
<path class="s-ink" d="M768 474Q800 492 832 474" fill="none" stroke-width="8" stroke-linecap="round"/>
</g></g>
<g id="l7"><text class="m" x="800" y="625" font-size="22" text-anchor="middle">NO ONE LEADS EVERY STEP</text></g>
<g id="waves"></g>
<g id="l7b"><text class="m" x="120" y="840" font-size="22" style="fill:var(--gain)">A SHARED RHYTHM</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa">
<circle class="s-ink" cx="180" cy="296" r="34" fill="none" stroke-width="6"/>
<circle class="s-gain" cx="222" cy="296" r="34" fill="none" stroke-width="6"/>
<text class="d" x="300" y="320" font-size="68" letter-spacing="-1">Name one thing you agree on.</text></g>
<g id="qb">
<path class="s-muted" d="M156 452H246" stroke-width="5" stroke-linecap="round"/>
<rect class="ink" x="160" y="430" width="18" height="22" rx="3" fill-opacity=".4"/>
<rect class="gain" x="188" y="374" width="26" height="78" rx="4"/>
<rect class="ink" x="224" y="436" width="18" height="16" rx="3" fill-opacity=".4"/>
<text class="d" x="300" y="440" font-size="68" letter-spacing="-1">Give your strongest reason.</text></g>
<g id="qc">
<rect class="s-ink" x="150" y="496" width="100" height="70" rx="20" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M174 566L166 590L196 566" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="200" y="549" font-size="44" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d" x="300" y="560" font-size="68" letter-spacing="-1">Ask one genuine <tspan style="fill:var(--gain)">question</tspan>.</text></g>
<g id="fin"><text class="m" x="143" y="700" font-size="26">YOUR NEXT DEBATE</text></g>
