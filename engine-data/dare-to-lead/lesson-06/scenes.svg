<text class="m" x="1325" y="580" font-size="18" text-anchor="middle">NOT OTHERS’</text><text class="m" x="1325" y="606" font-size="18" text-anchor="middle">SECRETS</text></g>
</g>

<g id="s5" opacity="0">
