<g id="good"><text class="m" x="1240" y="455" font-size="20" text-anchor="middle" style="fill:var(--gain)">GOOD THINGS IN HER LIFE</text></g>
<g id="kept"><text class="d" x="120" y="810" font-size="44">She kept her focus on what was still good.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="64">Your life is what you focus on.</text>
<text class="b" x="120" y="176" font-size="32">Gallagher: life is the sum of what you pay attention to.</text>
