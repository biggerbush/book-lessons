<path class="s-line" d="M760 570h660" stroke-width="4"/>
</g>
<g id="ab7">
<text class="m" x="160" y="470" font-size="22" style="fill:var(--loss)">ABSTRACT</text>
<g id="ab7t">
<text class="d5" x="160" y="530" font-size="36">“Improve customer</text>
<text class="d5" x="160" y="576" font-size="36">service.”</text>
</g>
<path class="s-muted" d="M540 520h130m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="shw"><g id="shp">
