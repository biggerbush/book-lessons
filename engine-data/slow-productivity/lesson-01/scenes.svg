<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The trap of</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">pseudo-productivity.</text>
<text class="b" x="120" y="600" font-size="32">Why looking busy has quietly replaced getting real work done.</text>
<g id="cal0"><rect class="s-ink" x="1186" y="190" width="288" height="136" rx="10" fill="var(--stage)" stroke-width="5"/></g>
<g id="wk0"><g id="wkb"></g>
