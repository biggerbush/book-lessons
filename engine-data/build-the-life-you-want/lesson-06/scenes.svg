<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Invest in the</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">four pillars.</text>
<text class="b" x="120" y="600" font-size="32">Four pillars that hold up a happy life.</text>
