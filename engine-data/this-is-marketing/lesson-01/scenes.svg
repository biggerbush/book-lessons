</g>
</g>
<g id="tp"><text class="m" x="420" y="650" font-size="24" text-anchor="middle" style="fill:var(--gain)">THEIR PROBLEM, NOT YOURS</text></g>
<g id="notp"><text class="m" x="420" y="710" font-size="24" text-anchor="middle">JUST SELLING A PRODUCT</text></g>
<line id="nS" class="s-loss" x1="235" y1="702" x2="235" y2="702" stroke-width="4" stroke-linecap="round"/>
