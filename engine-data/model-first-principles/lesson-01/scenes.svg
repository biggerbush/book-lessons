<text class="d5" x="1270" y="580" font-size="30" text-anchor="middle">“The first basis</text>
<text class="d5" x="1270" y="620" font-size="30" text-anchor="middle">from which a thing</text>
<text class="d5" x="1270" y="660" font-size="30" text-anchor="middle">is known.”</text>
