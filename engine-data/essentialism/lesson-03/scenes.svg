<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">You can have anything,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not everything.</text>
<text class="b" x="120" y="600" font-size="32">Every yes quietly closes a door. Choose which one.</text>
<g id="jug"><path class="s-line" d="M1200 776h280" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M1310 715l-50-75M1370 715l50-75" stroke-width="8" stroke-linecap="round"/><g id="jugp"></g><g id="balls"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Every yes is a no.</text>
<text class="b" x="120" y="176" font-size="32">Walk through one door, and the others quietly close.</text>
<g id="doors"></g>
<g id="walker"></g>
<g id="clk"><circle class="s-ink" cx="1360" cy="450" r="100" fill="var(--stage)" stroke-width="7"/><path id="wedge" class="gain" fill-opacity=".8"/><line id="hand" class="s-ink" x1="1360" y1="450" x2="1360" y2="380" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1360" cy="450" r="9"/><text class="m" x="1360" y="604" font-size="24" text-anchor="middle" style="fill:var(--ink)">TIME &amp; ENERGY</text></g>
<g id="tro"><text class="d" x="120" y="760" font-size="52">McKeown calls these trade-offs.</text><text class="m" x="120" y="816" font-size="26" style="fill:var(--ink)">AND WE CANNOT ESCAPE THEM</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The myth of doing it all.</text>
<text class="b" x="120" y="176" font-size="32">We pretend trade-offs don’t exist, and keep adding.</text>
<g id="busy"><g id="bp"></g><rect class="s-ink" x="760" y="220" width="440" height="520" rx="14" fill="var(--stage)" stroke-width="5"/></g>
<g id="fit"><text class="m" x="120" y="640" font-size="22">HOW CAN I FIT IT</text><text class="m" x="120" y="672" font-size="22">ALL IN?</text></g>
<g id="effl"></g>
<g id="items"></g>
<g id="thin"><text class="d5" x="120" y="820" font-size="40">Spread so thin that nothing gets our best.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Southwest chose what not to do.</text>
<text class="b" x="120" y="176" font-size="32">Founder Herb Kelleher made deliberate trade-offs.</text>
<g id="cards"></g>
<g id="map"><rect class="s-line" x="820" y="250" width="660" height="360" rx="18" fill="var(--stage)" stroke-width="3"/><g id="routes"><text class="m" x="850" y="290" font-size="20">POINT TO POINT</text></g><g id="cities"></g><g id="swp"></g></g>
<g id="wins"><rect class="gain" x="120" y="690" width="300" height="84" rx="42"/><text class="d5" x="270" y="744" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Low fares</text><rect class="gain" x="450" y="690" width="300" height="84" rx="42"/><text class="d5" x="600" y="744" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">On time</text><text class="d" x="820" y="746" font-size="44">Simple, on purpose.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Continental tried to do both.</text>
<text class="b" x="120" y="176" font-size="32">A budget service, with the full-service model still running.</text>
<g id="cop"></g>
<path id="pb" d="M290 460C600 460 600 300 880 300" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="pf" d="M290 460C600 460 600 620 880 620" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="lbls"><text id="lbb" class="m" x="920" y="310" font-size="24">BUDGET</text><text class="m" x="920" y="630" font-size="24">FULL SERVICE</text></g>
<g id="stamp"><g transform="rotate(-6 1040 360)"><rect x="910" y="330" width="260" height="62" rx="8" fill="none" stroke="var(--loss)" stroke-width="5"/><text class="d" x="1040" y="374" font-size="34" text-anchor="middle" style="fill:var(--loss)">SHUT DOWN</text></g></g>
<g id="drain"><text class="m" x="1340" y="240" font-size="22" text-anchor="middle">MONEY</text><rect class="s-ink" x="1260" y="260" width="160" height="400" rx="12" fill="none" stroke-width="5"/><rect id="cash" class="gain" x="1268" y="268" width="144" height="384" rx="6"/><g id="drips"></g></g>
<g id="cost"><text class="d" x="120" y="820" font-size="46">Straddling both cost it heavily.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask a different question.</text>
<text class="b" x="120" y="176" font-size="32">A trade-off is a choice, not a failure.</text>
<g id="qm"><text class="d" x="110" y="450" font-size="220" style="fill:var(--gain)">?</text><text class="d5" x="120" y="560" font-size="44" fill-opacity=".55">How can I do it all?</text></g>
<line id="oqs" x1="112" y1="545" x2="112" y2="545" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
<g id="nq"><text class="d" x="120" y="650" font-size="52">Which problem do I want?</text></g>
<g id="sc"><path class="s-ink" d="M1180 330V640" stroke-width="8"/><rect class="ink" x="1100" y="640" width="160" height="16" rx="8"/>
<g id="beam"><path class="s-ink" d="M960 330H1400" stroke-width="10" stroke-linecap="round"/><path class="s-ink" d="M980 330L930 470M980 330L1030 470M1380 330L1330 470M1380 330L1430 470" stroke-width="4" fill="none"/><path class="ink" d="M910 470h140a70 36 0 0 1-140 0zM1310 470h140a70 36 0 0 1-140 0z"/><circle class="gain" cx="980" cy="440" r="28"/><path class="gain" d="M1380 404l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z"/></g>
<circle class="ink" cx="1180" cy="330" r="12"/><text class="m" x="1180" y="710" font-size="22" text-anchor="middle">TWO GOOD THINGS</text></g>
<g id="clar"><text class="d" x="120" y="800" font-size="44">Own the choice: <tspan style="fill:var(--gain)">guilt becomes clarity.</tspan></text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">What can I go big on?</text>
<text class="b" x="120" y="176" font-size="32">One free evening. Two good options.</text>
<rect id="halo" x="1040" y="262" width="220" height="136" rx="20" fill="var(--gain)" fill-opacity=".12" stroke="var(--gain)" stroke-width="6"/>
<g id="paths"><path id="pp" class="s-line" d="M800 620Q620 520 450 400" fill="none" stroke-width="5" stroke-dasharray="10 10"/><path id="pfam" class="s-line" d="M800 620Q980 520 1150 410" fill="none" stroke-width="5" stroke-dasharray="10 10"/></g>
<g id="optP"><g id="optPi"><rect class="s-ink" x="380" y="280" width="140" height="90" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M360 384h180" stroke-width="8" stroke-linecap="round"/></g><text id="lblP" class="m" x="450" y="244" font-size="22" text-anchor="middle" style="fill:var(--ink)">EXTRA PROJECT</text></g>
<g id="optF"><g id="optFi"><g id="fam"></g></g><text id="lblF" class="m" x="1150" y="244" font-size="22" text-anchor="middle" style="fill:var(--ink)">REST WITH FAMILY</text></g>
<g id="me"></g>
<g id="bad"><text class="m" x="800" y="840" font-size="24" text-anchor="middle" style="fill:var(--loss)">DOING BOTH = BOTH DONE BADLY</text></g>
<g id="good"><text class="m" x="800" y="840" font-size="24" text-anchor="middle" style="fill:var(--gain)">CHOOSE ONE ON PURPOSE. GIVE IT EVERYTHING.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Name the trade.</text>
<text class="b" x="120" y="176" font-size="32">Before any new yes, write down what it will cost.</text>
<g id="nb"><rect class="s-ink" x="200" y="230" width="800" height="520" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><text class="m" x="260" y="300" font-size="22">BEFORE I SAY YES</text><text class="m" x="260" y="400" font-size="20">YES TO</text><text class="m" x="260" y="500" font-size="20">IT WILL COST</text></g>
<g id="row3"><text class="m" x="260" y="620" font-size="20" style="fill:var(--loss)">I GIVE UP</text></g>
<g id="scr"></g>
<line id="xs" x1="470" y1="612" x2="470" y2="612" stroke="var(--loss)" stroke-width="8" stroke-linecap="round"/>
<g id="ans"><text class="m" x="1120" y="330" font-size="22">NOT WORTH IT?</text><text class="d" x="1110" y="500" font-size="150" style="fill:var(--gain)">No.</text><text class="m" x="1120" y="570" font-size="20">THEN YOU HAVE</text><text class="m" x="1120" y="600" font-size="20">YOUR ANSWER</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What trade-off</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">are you avoiding</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">right now?</text></g>
<g id="nm"><text class="m" x="143" y="700" font-size="26">NAME IT OUT LOUD. CHOOSE ON PURPOSE.</text></g>
<g id="mir"><ellipse class="s-ink" cx="1270" cy="420" rx="130" ry="180" fill="var(--stage)" stroke-width="8"/><g id="mp"></g><path class="s-line" d="M1190 320q20-50 60-70" stroke-width="6" fill="none" stroke-linecap="round"/><path class="s-ink" d="M1270 600v100M1190 700h160" stroke-width="8" stroke-linecap="round"/></g>
</g>