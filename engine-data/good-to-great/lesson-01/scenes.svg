<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Good is the enemy</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of great.</text>
<text class="b" x="120" y="600" font-size="32">Why being good enough quietly blocks the path to greatness.</text>
