<rect class="ink" x="690" y="620" width="200" height="16"/>
<text class="m" x="790" y="770" font-size="20" text-anchor="middle">THE COMPUTER</text>
</g>
<g id="gts"><g id="hrt"><path class="gain" d="M1050 452c-34-22-30-56 0-40c30-16 34 18 0 40z"/></g><text class="m" x="1050" y="670" font-size="20" text-anchor="middle" style="fill:var(--gain)">BILL GATES</text></g>
<g id="grid"></g>
<g id="gridl"><text class="m" x="1160" y="750" font-size="20">HIGH SCHOOLS</text><text class="m" x="1160" y="780" font-size="20">ALMOST NONE HAD ONE</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The lucky break.</text>
<text class="b" x="120" y="176" font-size="32">Nights of practice, long before most people had touched a computer.</text>
<g id="moon"><path class="ink" d="M240 360a50 50 0 1 0 40 70a40 40 0 1 1-40-70z" fill-opacity=".5"/><text class="m" x="140" y="770" font-size="20">NIGHTS OF PRACTICE</text></g>
<g id="steps"></g>
<circle id="gd" class="gain" r="22"/>
<g id="ms"><rect class="gain" x="900" y="270" width="300" height="90" rx="14"/><text class="d5" x="1050" y="328" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">MICROSOFT</text></g>
<g id="tkt"><rect class="s-gain" x="1240" y="440" width="240" height="150" rx="14" fill="var(--stage)" stroke-width="6"/><circle class="s-gain" cx="1240" cy="515" r="16" fill="var(--stage)" stroke-width="6"/><circle class="s-gain" cx="1480" cy="515" r="16" fill="var(--stage)" stroke-width="6"/><path id="tkst" class="gain"/><text class="m" x="1360" y="640" font-size="20" text-anchor="middle" style="fill:var(--gain)">A STROKE OF LUCK</text></g>
<g id="few"><text class="d" x="120" y="840" font-size="44">Few students anywhere shared that luck.</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The other friend.</text>
<text class="b" x="120" y="176" font-size="32">Kent Evans: just as brilliant, just as ambitious.</text>
<g id="bl"><text class="m" x="300" y="530" font-size="22" text-anchor="middle">BILL</text></g>
<g id="kt"><g id="ktf"></g><text class="m" x="520" y="530" font-size="22" text-anchor="middle">KENT</text></g>
<g id="bars"><text class="m" x="160" y="600" font-size="20">BRILLIANT</text><text class="m" x="160" y="720" font-size="20">AMBITIOUS</text></g>
<g id="mtn"><path class="s-loss" d="M800 740L1060 340L1180 480L1300 290L1480 740Z" fill="var(--loss)" fill-opacity=".15" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1140" y="800" font-size="22" text-anchor="middle">A MOUNTAINEERING ACCIDENT</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same start, different end.</text>
<g id="same"><text class="m" x="120" y="200" font-size="22">SAME SCHOOL · SAME TALENT · SAME DREAMS</text></g>
<g id="sp2"></g>
<path id="ps" class="s-ink" d="M200 500H560" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="pu" class="s-gain" d="M560 500C760 500 820 300 1100 300" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="pd" class="s-loss" d="M560 500C720 500 760 660 900 660" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="pbar" class="s-loss" d="M904 626V694" stroke-width="10" stroke-linecap="round"/>
<circle id="dg" class="gain" r="18"/><circle id="dl" class="loss" r="18"/>
<g id="up"><text class="m" x="1140" y="300" font-size="22" style="fill:var(--gain)">ONE OF THE RICHEST</text><text class="m" x="1140" y="332" font-size="22" style="fill:var(--gain)">PEOPLE ALIVE</text></g>
<g id="dn"><text class="m" x="940" y="650" font-size="22">NEVER GOT THE CHANCE</text><text class="m" x="940" y="682" font-size="22">NO FAULT OF HIS OWN</text></g>
<g id="tw4"><text class="d" x="120" y="820" font-size="46">That is <tspan style="fill:var(--loss)">risk</tspan>, the twin of <tspan style="fill:var(--gain)">luck</tspan>.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Forces beyond us.</text>
<text class="b" x="120" y="176" font-size="32">Our choices on one side. Forces we can’t see on the other.</text>
<g transform="translate(0 -30)">
<g id="scl">
<path class="ink" d="M800 500L860 720H740Z"/><rect class="ink" x="700" y="720" width="200" height="16" rx="6"/>
<line id="beam" class="s-ink" stroke-width="10" stroke-linecap="round"/>
<circle class="gain" cx="800" cy="500" r="12"/>
<g id="pl"><path class="s-ink" d="M0 0L-80 110M0 0L80 110" stroke-width="3"/><path class="ink" d="M-100 110Q0 180 100 110Z"/>
<rect class="gain" x="-70" y="70" width="40" height="40"/><rect class="gain" x="-20" y="50" width="40" height="60"/><rect class="gain" x="30" y="75" width="40" height="35"/>
<text class="m" x="0" y="210" font-size="20" text-anchor="middle">OUR CHOICES</text></g>
<g id="pr"><path class="s-ink" d="M0 0L-80 110M0 0L80 110" stroke-width="3"/><path class="ink" d="M-100 110Q0 180 100 110Z"/>
<g id="cld"><circle class="loss" cx="-40" cy="60" r="34"/><circle class="loss" cx="0" cy="40" r="44"/><circle class="loss" cx="44" cy="62" r="32"/><rect class="loss" x="-74" y="60" width="118" height="36" rx="18"/>
<path d="M4 66l-14 22h20l-12 22" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="0" y="210" font-size="20" text-anchor="middle" style="fill:var(--loss)">FORCES WE CAN’T SEE</text></g></g>
</g>
</g>
<g id="bil"><text class="m" x="120" y="752" font-size="20">BILLIONS OF PEOPLE MAKING CHOICES</text></g>
<g id="crowd5"></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Careful with praise.</text>
<text class="b" x="120" y="176" font-size="32">Not all genius. Not all foolishness.</text>
<g id="c6a"><rect class="s-line" x="120" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="gain" d="M260 300h140v60a70 70 0 0 1-140 0z"/>
<path class="s-gain" d="M260 320h-34v20a34 34 0 0 0 34 34M400 320h34v20a34 34 0 0 1-34 34" fill="none" stroke-width="7" stroke-linecap="round"/>
<rect class="gain" x="318" y="428" width="24" height="40"/><rect class="gain" x="280" y="468" width="100" height="22" rx="6"/>
<text class="m" x="150" y="620" font-size="22" style="fill:var(--gain)">SUCCESS:</text><text class="m" x="150" y="652" font-size="22">NOT ALL GENIUS</text></g>
<g id="c6b"><rect class="s-line" x="590" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M630 532H970" stroke-width="4"/>
<g id="fall"><circle class="loss" cx="0" cy="-128" r="24"/><rect class="loss" x="-26" y="-100" width="52" height="100" rx="22"/></g>
<text class="m" x="620" y="620" font-size="22" style="fill:var(--loss)">FAILURE:</text><text class="m" x="620" y="652" font-size="22">NOT ALL FOOLISHNESS</text></g>
<g id="c6c"><rect class="s-line" x="1060" y="230" width="420" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<ellipse class="s-ink" cx="1270" cy="400" rx="100" ry="140" fill="var(--stage)" stroke-width="8"/>
<g id="mref" opacity=".5"></g>
<path class="s-ink" d="M1270 540V580M1220 580H1320" stroke-width="8" stroke-linecap="round"/>
<path class="s-gain" d="M1420 400v-70m-22 22 22-22 22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-loss" d="M1420 440v70m-22-22 22 22 22-22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1090" y="620" font-size="22">YOU, TOO:</text><text class="m" x="1090" y="652" font-size="22">GOOD TIMES OR BAD</text></g>
<g id="adm"><text class="d" x="120" y="790" font-size="40">Be careful whom you admire, and whom you look down on.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Look for patterns.</text>
<text class="b" x="120" y="176" font-size="32">Not one dazzling success story.</text>
<path class="s-muted" d="M160 260V700H1440" fill="none" stroke-width="4" stroke-linecap="round"/>
<g id="dots7"></g>
<path id="trend" class="s-gain" d="M220 640L1400 404" fill="none" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
<g id="out"><circle cx="900" cy="290" r="14" fill="var(--muted)"/><path id="ost" fill="var(--muted)"/><text class="m" x="990" y="298" font-size="22" style="fill:var(--muted)">ONE DAZZLING STORY</text></g>
<g id="patl"><text class="m" x="1440" y="742" font-size="20" text-anchor="end" style="fill:var(--gain)">A BROAD PATTERN THAT WORKS FOR MANY</text></g>
<g id="magw"><g id="mag"><circle class="s-ink" cx="0" cy="0" r="60" fill="none" stroke-width="10"/><path class="s-ink" d="M44 44L92 92" stroke-width="16" stroke-linecap="round"/></g></g>
<g id="fgv"><text class="d" x="120" y="830" font-size="44">When you stumble, forgive yourself, and others.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">One success. One failure.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">How much of each was <tspan style="fill:var(--gain)">luck</tspan>,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">and how much was <tspan style="fill:var(--loss)">risk</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">LUCK AND RISK ARE TWINS</text>
<g id="qt"><circle class="gain" cx="1300" cy="720" r="30"/><circle class="loss" cx="1390" cy="720" r="30"/><path class="s-muted" d="M1300 770Q1345 800 1390 770" fill="none" stroke-width="5" stroke-linecap="round"/></g>
</g>