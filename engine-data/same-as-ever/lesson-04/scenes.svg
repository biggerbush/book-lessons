<g id="star0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two pitches. One room.</text>
<text class="b" x="120" y="176" font-size="32">Correct numbers versus a story people can feel.</text>
<g id="paIn">
<g id="cardA"><rect class="s-line" x="120" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="266" font-size="22">PITCH A · THE SPREADSHEET</text><g id="pA"></g></g>
<g id="grid"></g>
</g>
<g id="cardB"><rect class="s-line" x="840" y="220" width="640" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="266" font-size="22">PITCH B · THE STORY</text><g id="pB"></g></g>
<g id="tale">
<path class="s-ink" d="M1074 290h342a24 24 0 0 1 24 24v142a24 24 0 0 1-24 24h-326l-78 40 30-46a24 24 0 0 1-12-18v-142a24 24 0 0 1 24-24z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
