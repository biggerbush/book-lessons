<g id="big3"><text class="d" x="1330" y="326" font-size="44" text-anchor="middle" style="fill:var(--gain)">Bigger tips</text></g>
<g id="ln3"><text class="d" x="120" y="820" font-size="46">A tiny echo made customers feel heard.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The late-night FM DJ voice.</text>
<text class="b" x="120" y="176" font-size="32">Your voice matters as much as your words.</text>
