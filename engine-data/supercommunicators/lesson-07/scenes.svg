<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A CIA lesson.</text>
<text class="b" x="120" y="176" font-size="32">Officer Jim Lawler built trust where guards were up.</text>
<path id="att" class="s-gain" d="M420 400Q780 220 1150 400" fill="none" stroke-width="4" stroke-dasharray="10 12"/>
<g id="law"><text class="m" x="360" y="600" font-size="22" text-anchor="middle">JIM LAWLER · CIA OFFICER</text></g>
<g id="str">
<path id="shk" class="s-loss" d="M950 432v-28a30 30 0 0 1 60 0v28" fill="none" stroke-width="10"/>
<rect id="lkb" class="loss" x="938" y="430" width="84" height="76" rx="10"/>
