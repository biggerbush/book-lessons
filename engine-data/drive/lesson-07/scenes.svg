<text class="m" x="1110" y="690" font-size="22" text-anchor="middle">RENEWABLE, NOT BURNED UP</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Take money off the table.</text>
<g id="unf"><text class="m" x="120" y="240" font-size="22" style="fill:var(--loss)">IF PAY FEELS UNFAIR, IT’S ALL PEOPLE SEE</text></g>
