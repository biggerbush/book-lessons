<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">what would it say?</text></g>
<g id="q2"><text class="m" x="143" y="700" font-size="26">AND WHAT COULD YOU DO TOMORROW TO LIVE UP TO IT?</text></g>
