<path id="w2" class="gain" stroke="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="r0"><text class="d" x="800" y="388" font-size="80">70%</text><text class="d5" x="990" y="356" font-size="40">Living</text><text class="m" x="990" y="402" font-size="24">FOOD, CLOTHING AND A HOME</text></g>
<g id="r1"><text class="d" x="800" y="548" font-size="80" style="fill:var(--loss)">20%</text><text class="d5" x="990" y="516" font-size="40">Lenders</text><text class="m" x="990" y="562" font-size="24">SHARED FAIRLY AMONG THEM ALL</text></g>
