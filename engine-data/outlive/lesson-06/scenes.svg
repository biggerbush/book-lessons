<text id="lB" class="m" x="1320" y="548" font-size="20" style="fill:var(--gain)">MEAL B</text>
</g>
<g id="fb"><text class="d" x="120" y="810" font-size="44">Feedback turns vague rules into personal choices.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Protein protects.</text>
<text class="b" x="120" y="176" font-size="32">As we age, muscle quietly melts away unless we fight for it.</text>
<g id="mbars"></g>
<text class="m" x="150" y="610" font-size="18">MUSCLE WITH AGE (ILLUSTRATION)</text>
