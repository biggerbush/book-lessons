<text class="m" x="966" y="584" font-size="20">IN YEARLY SALES, AT LEAST</text>
<text class="m" x="966" y="616" font-size="20">GRAHAM’S DAY · INDUSTRIAL FIRMS</text>
</g>
<g id="infl">
<g id="infl_l"><path class="s-gain" d="M200 290h720" stroke-width="5" stroke-dasharray="12 10"/></g>
