<path class="s-gain" d="M944 506l8 8 14-14M944 536l8 8 14-14M944 566l8 8 14-14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="1040" y="520" font-size="30">“Wrong material.</text>
<text class="d5" x="1040" y="568" font-size="30">I’ll prepare differently.”</text>
</g>
<g id="tryA">
<path class="s-gain" d="M1240 750C1290 740 1330 705 1340 660" fill="none" stroke-width="7" stroke-linecap="round"/>
<path class="s-gain" d="M1322 676L1340 660L1354 680" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1180" y="802" font-size="22" text-anchor="middle" style="fill:var(--gain)">A REASON TO TRY AGAIN</text>
<text class="m" x="420" y="802" font-size="22" text-anchor="middle">NO REASON TO TRY</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Belief builds grit.</text>
<text class="b" x="120" y="176" font-size="32">Carol Dweck’s growth mindset: abilities can improve with effort.</text>
