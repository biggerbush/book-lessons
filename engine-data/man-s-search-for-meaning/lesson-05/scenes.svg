<g id="s0">
<text class="m" x="120" y="150" font-size="28">MAN'S SEARCH FOR MEANING · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">A why</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">to live for.</text>
<text class="b" x="120" y="600" font-size="32">Why a reason to live helped prisoners endure the unbearable.</text>
<path class="s-line" d="M1080 520h400" stroke-width="5"/>
<polygon id="glow" class="gain" points="1250,520 1410,520 1480,560 1120,560" fill-opacity=".25"/>
<rect class="gain" x="1250" y="236" width="160" height="284"/>
<rect id="dp" class="ink" x="1250" y="236" width="160" height="284"/>
<rect class="s-ink" x="1250" y="236" width="160" height="284" fill="none" stroke-width="8"/>
<g id="walker"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nietzsche’s line.</text>
<text class="b" x="120" y="176" font-size="32">A sentence Frankl kept returning to.</text>
<g id="nz"><g id="nzf"></g><path d="M204 296q16-8 32 0" stroke="var(--stage)" stroke-width="6" fill="none" stroke-linecap="round"/><text class="m" x="220" y="470" font-size="20" text-anchor="middle">NIETZSCHE</text></g>
<g id="qc"><rect class="s-line" x="340" y="230" width="1140" height="210" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="370" y="350" font-size="120" style="fill:var(--gain)">“</text>
<text class="d5" x="450" y="320" font-size="44">He who has a <tspan style="fill:var(--gain)">why</tspan> to live for</text>
<text class="d5" x="450" y="390" font-size="44">can bear with almost any <tspan style="fill:var(--loss)">how</tspan>.”</text></g>
<path class="s-line" d="M560 820h480" stroke-width="5"/>
<g id="beam"><path class="s-ink" d="M500 740H1240" stroke-width="8" stroke-linecap="round"/>
<rect class="loss" x="560" y="610" width="160" height="130" rx="8"/><text class="d" x="640" y="690" font-size="40" text-anchor="middle" style="fill:var(--stage)">HOW</text>
<g id="why"><rect class="gain" x="1130" y="676" width="90" height="64" rx="8"/><text class="m" x="1175" y="716" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g></g>
<polygon class="ink" points="800,744 760,820 840,820"/>
<text id="camps" class="m" x="1480" y="520" font-size="22" text-anchor="end">THE CAMPS TESTED THIS IN THE HARSHEST WAY</text>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The last cigarettes.</text>
<text class="b" x="120" y="176" font-size="32">Precious enough to trade for soup.</text>
<g id="trade"><g id="cigs"></g>
<path class="s-muted" d="M372 350h90m-18-14 18 14-18 14M462 392h-90m18-14-18 14 18 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ink" d="M480 360a80 80 0 0 0 160 0z"/>
<path class="s-muted" d="M530 330q-10-20 0-40M590 330q-10-20 0-40" fill="none" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="120" y="490" font-size="22">PRECIOUS: TRADED FOR SOUP</text></g>
<g id="look"><text class="m" x="120" y="610" font-size="22">OTHERS UNDERSTOOD WHAT IT MEANT</text></g>
<g id="bunk"><text class="m" x="820" y="240" font-size="22">SMOKING HIS OWN</text>
<path class="s-ink" d="M820 260V740M1440 260V740" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="820" y="440" width="620" height="18"/><rect class="ink" x="820" y="660" width="620" height="18"/>
<g id="man"><circle class="ink" cx="900" cy="402" r="30"/><rect class="ink" x="936" y="404" width="260" height="36" rx="18"/>
<rect x="924" y="396" width="44" height="9" fill="var(--stage)" stroke="var(--ink)" stroke-width="2"/><circle class="gain" cx="970" cy="400" r="6"/></g>
<path id="smoke" class="s-muted" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="gone"><text class="d" x="120" y="820" font-size="46">He had stopped believing in a future.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two men in despair.</text>
<text class="b" x="120" y="176" font-size="32">Both said they expected nothing more from life.</text>
<g id="men"></g>
<text id="n0" class="m" x="330" y="320" font-size="20">EXPECTS NOTHING</text>
<text id="n1" class="m" x="330" y="580" font-size="20">EXPECTS NOTHING</text>
<line id="th0" class="s-gain" x1="330" y1="380" x2="330" y2="380" stroke-width="5" stroke-dasharray="12 10"/>
<line id="th1" class="s-gain" x1="330" y1="640" x2="330" y2="640" stroke-width="5" stroke-dasharray="12 10"/>
<g id="ch"><path class="s-muted" d="M1100 250V470" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="1120" y="270" font-size="20">ANOTHER COUNTRY</text><g id="kid"></g><text class="m" x="1260" y="450" font-size="20" text-anchor="middle">A CHILD WAITING</text></g>
<g id="bk"><text class="m" x="1265" y="724" font-size="20" text-anchor="middle">BOOKS UNFINISHED</text></g>
<g id="hold"><text class="d" x="120" y="820" font-size="44">Something still waited for each of them.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hope with a date.</text>
<text class="b" x="120" y="176" font-size="32">A prisoner dreamed of the exact day he would be freed.</text>
<g id="cal"><rect class="s-ink" x="160" y="240" width="360" height="400" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="160" y="240" width="360" height="80"/><text class="m" x="340" y="290" font-size="26" text-anchor="middle" style="fill:var(--stage)">MARCH 1945</text>
<text id="cnum" class="d" x="340" y="560" font-size="200" text-anchor="middle">30</text>
<text class="m" x="340" y="690" font-size="20" text-anchor="middle">THE DREAMED DATE</text></g>
<circle id="sun" class="gain" cx="760" cy="300" r="30"/>
<g id="hf"></g>
<g id="res"><text class="m" x="960" y="440" font-size="22">BODY’S RESISTANCE</text><rect id="rbar" class="gain" x="960" y="460" width="500" height="48"/><rect class="s-ink" x="960" y="460" width="500" height="48" fill="none" stroke-width="4"/></g>
<g id="fell"><text class="d" x="120" y="790" font-size="44">No rescue came. He fell ill and died soon after.</text></g>
<g id="frb"><text class="m" x="120" y="850" font-size="22">FRANKL: LOSING HOPE WEAKENED HIS RESISTANCE</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Christmas week.</text>
<text class="b" x="120" y="176" font-size="32">Deaths rose sharply between Christmas and New Year, 1944.</text>
<g id="chart"><text class="m" x="160" y="250" font-size="20">DEATHS IN THE CAMP · SCHEMATIC</text><g id="bars"></g><path class="s-ink" d="M160 270V640H880" fill="none" stroke-width="5"/></g>
<text id="xl" class="m" x="648" y="672" font-size="18" text-anchor="middle" style="fill:var(--loss)">XMAS WEEK</text>
<g id="home"><rect id="hbody" class="s-ink" x="1200" y="420" width="200" height="140" stroke-width="6"/><path class="s-ink" d="M1180 420L1300 320L1420 420" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><rect class="ink" x="1280" y="480" width="40" height="80"/><text class="m" x="1300" y="610" font-size="22" text-anchor="middle">HOME BY CHRISTMAS</text></g>
<g id="pr"></g>
<path id="l0" d="M1045 510h65" stroke-width="6" stroke-linecap="round"/>
<path id="l1" d="M1120 510h70" stroke-width="6" stroke-linecap="round"/>
<g id="coll"><text class="d" x="120" y="790" font-size="44">When hope collapsed, many lost their strength.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Frankl’s own why.</text>
<text class="b" x="120" y="176" font-size="32">A book manuscript, taken from him on arrival.</text>
<g id="ms"><g id="msi"><rect class="s-ink" x="200" y="250" width="240" height="320" fill="var(--stage)" stroke-width="6" rx="6"/><rect class="s-ink" x="180" y="270" width="240" height="320" fill="var(--stage)" stroke-width="6" rx="6"/><path class="s-line" d="M210 330h180M210 370h180M210 410h180M210 450h120" stroke-width="6" stroke-linecap="round"/></g>
<path id="msx" class="s-loss" d="M170 260L430 600M430 260L170 600" stroke-width="10" stroke-linecap="round"/>
<text id="taken" class="m" x="300" y="650" font-size="20" text-anchor="middle" style="fill:var(--loss)">TAKEN ON ARRIVAL</text></g>
<g id="pg"><rect class="s-muted" x="560" y="240" width="400" height="460" rx="8" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="760" y="740" font-size="20" text-anchor="middle">REBUILT IN SHORTHAND</text></g>
<g id="scr"></g>
<g id="dir"><path class="s-gain" d="M1040 470h380m-36-30 36 30-36 30" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1040" y="540" font-size="20">A DIRECTION</text><text class="m" x="1040" y="570" font-size="20">BEYOND SURVIVAL</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Purpose points ahead.</text>
<text class="b" x="120" y="176" font-size="32">It pulls you forward when the present feels unbearable.</text>
<rect class="loss" x="120" y="240" width="440" height="400" fill-opacity=".15"/>
<text class="m" x="140" y="280" font-size="20">THE UNBEARABLE PRESENT</text>
<path class="s-line" d="M120 640H1480" stroke-width="5"/>
<g id="flag"><path class="s-ink" d="M1380 640V340" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M1384 344l90 34-90 34z"/><text class="m" x="1380" y="680" font-size="20" text-anchor="middle">PURPOSE</text></g>
<line id="rope" class="s-gain" y1="590" x2="1380" y2="430" stroke-width="4" stroke-dasharray="10 10"/>
<g id="pw"></g>
<g id="ng"><text class="d" x="120" y="730" font-size="40">No guarantee, but it made enduring possible.</text></g>
<g id="sign"><path class="gain" d="M120 790h1000l40 35-40 35H120z"/><text class="d5" x="150" y="837" font-size="34" style="fill:var(--on-gain)">It gives the pain somewhere to lead.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Who or what is waiting</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">for you, a few years</text></g>
<g id="qc8"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">from <tspan style="fill:var(--gain)">now</tspan>?</text></g>
<g id="wdn"><text class="m" x="143" y="700" font-size="26">WRITE IT DOWN · LOOK AT IT WHEN YOU WANT TO GIVE UP</text></g>
<g id="card"><rect class="s-ink" x="1180" y="600" width="280" height="200" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="1210" y="650" font-size="22">MY WHY</text><rect id="w0" class="gain" x="1210" y="690" width="0" height="10" rx="5"/><rect id="w1" class="gain" x="1210" y="730" width="0" height="10" rx="5"/></g>
</g>