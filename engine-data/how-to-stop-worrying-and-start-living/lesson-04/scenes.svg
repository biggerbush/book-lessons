<rect class="s-ink" x="250" y="660" width="80" height="100" fill="none" stroke-width="6"/>
<path class="s-ink" d="M250 660l80 100M330 660l-80 100" stroke-width="4"/>
</g>
<g id="th"><circle class="ink" cx="580" cy="580" r="6" fill-opacity=".5"/><circle class="ink" cx="625" cy="540" r="9" fill-opacity=".5"/><circle class="ink" cx="675" cy="500" r="12" fill-opacity=".5"/></g>
<g id="f1"><g id="f1i">
<rect class="s-line" x="720" y="240" width="320" height="380" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M810 420a40 40 0 0 1 20-74a55 55 0 0 1 100-10a40 40 0 0 1 30 84z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
