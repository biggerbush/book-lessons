<g id="tg1"><text class="m" x="1200" y="730" font-size="22" text-anchor="middle" style="fill:var(--gain)">ABILITY CAN GROW</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fixed mindset: failure as verdict.</text>
<text class="b" x="120" y="176" font-size="32">If ability is set, failing seems to prove you lack it.</text>
<rect class="ink" x="240" y="540" width="280" height="40" rx="6"/>
<rect class="ink" x="200" y="580" width="360" height="20" rx="6"/>
<g id="gav"><path class="s-ink" d="M0 0H-200" stroke-width="16" stroke-linecap="round"/><rect class="loss" x="-275" y="-70" width="70" height="140" rx="12"/></g>
<path id="imp" class="s-loss" d="M330 500l-40-20M430 500l40-20M300 530h-50M460 530h50" stroke-width="6" stroke-linecap="round"/>
