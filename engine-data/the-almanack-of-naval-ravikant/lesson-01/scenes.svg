<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Getting rich is a skill,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not luck.</text>
<text class="b" x="120" y="600" font-size="32">Why wealth is a learnable skill, not a lottery ticket</text>
