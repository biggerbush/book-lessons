<path class="s-line" d="M520 700H1160" stroke-width="5" stroke-linecap="round"/>
<g id="k0"><rect id="b0" class="loss" x="560" y="700" width="140" height="0"/><text class="m" x="630" y="740" font-size="20" text-anchor="middle">ROTE MEMORY</text></g>
<g id="k1"><rect id="b1" class="loss" x="780" y="700" width="140" height="0"/><text class="m" x="850" y="740" font-size="20" text-anchor="middle">DETAILS</text></g>
