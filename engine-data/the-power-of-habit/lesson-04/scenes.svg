<rect class="ink" x="374" y="252" width="48" height="50" rx="6"/>
<rect class="gain" x="370" y="296" width="56" height="74" rx="20"/>
</g>
<path class="s-ink" d="M352 302H448V368L400 390L352 368Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<g id="pth"><rect class="gain" x="352" y="300" width="22" height="38" rx="11"/><path class="s-ink" d="M352 300h22" stroke-width="0"/></g>
<text class="m" x="330" y="470" font-size="20" text-anchor="middle">HANDS IN POCKETS</text></g>
<g id="pB"><rect class="s-line" x="590" y="230" width="420" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
<g transform="rotate(-20 800 360)"><rect class="gain" x="700" y="344" width="190" height="32"/><polygon class="ink" points="890,344 924,360 890,376"/><circle id="fst2" class="ink" cx="780" cy="360" r="40"/></g>
<text class="m" x="800" y="470" font-size="20" text-anchor="middle">GRIP A PENCIL</text></g>
<g id="pC"><rect class="s-line" x="1060" y="230" width="420" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="1110" y="412" width="320" height="18" rx="4"/>
<path class="s-ink" d="M1140 430v20M1400 430v20" stroke-width="8" stroke-linecap="round"/>
<g id="fist">
<rect class="ink" x="1244" y="286" width="52" height="56" rx="8"/>
<rect class="ink" x="1220" y="330" width="100" height="72" rx="20"/>
<circle class="ink" cx="1234" cy="400" r="12"/><circle class="ink" cx="1258" cy="401" r="12"/><circle class="ink" cx="1282" cy="401" r="12"/><circle class="ink" cx="1306" cy="400" r="12"/>
<path d="M1246 376v24M1270 376v24M1294 376v24" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
<path d="M1232 354h52" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/>
</g>
<path id="rip" class="s-gain" d="M1204 402l-28-16M1198 420h-30M1336 402l28-16M1342 420h30" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1270" y="470" font-size="20" text-anchor="middle">TAP KNUCKLES, RUB ARM</text></g>
<g id="calg"><text class="m" x="120" y="580" font-size="20">ABOUT A MONTH</text><g id="cal"></g></g>
<g id="gone"><text class="d" x="120" y="760" font-size="52">The nail biting was <tspan style="fill:var(--gain)">gone</tspan>.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sober routines.</text>
<text class="b" x="120" y="176" font-size="32">Alcoholics Anonymous uses the same golden rule.</text>
<g id="meet">
<circle class="s-line" cx="1240" cy="420" r="140" fill="none" stroke-width="4"/>
<g id="ppl5"></g>
<path class="gain" d="M1200 395h80a14 14 0 0 1 14 14v22a14 14 0 0 1-14 14h-40l-16 16v-16h-24a14 14 0 0 1-14-14v-22a14 14 0 0 1 14-14z"/>
<text class="m" x="1240" y="680" font-size="20" text-anchor="middle">MEETINGS · TALKING</text>
</g>
<g id="gl">
<path class="loss" d="M180 380H300L290 520H190z"/>
<path class="s-ink" d="M170 300H310L290 520H190z" fill="none" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="240" y="570" font-size="20" text-anchor="middle">THE DRINK</text>
</g>
<path id="gx" class="s-ink" d="M150 300L330 530M330 300L150 530" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="700" y="262" font-size="20" text-anchor="middle">SAME REWARDS</text>
<g id="lg"></g><g id="lc"></g><g id="chips5"></g>
<g id="phone"><rect class="gain" x="1150" y="730" width="46" height="80" rx="8"/><text class="m" x="1214" y="780" font-size="20">A SPONSOR TO CALL</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The power of belief.</text>
<text class="b" x="120" y="176" font-size="32">Swaps can crack under heavy stress.</text>
<g id="cloud">
<circle class="loss" cx="740" cy="300" r="46"/><circle class="loss" cx="810" cy="272" r="60"/><circle class="loss" cx="880" cy="300" r="46"/><rect class="loss" x="700" y="300" width="220" height="46" rx="23"/>
<path class="s-loss" d="M712 370l-10 26M740 370l-10 26M890 370l-10 26M918 370l-10 26" stroke-width="4" stroke-linecap="round"/>
</g>
<polygon id="bolt" points="842,346 792,420 818,420 784,482 856,402 828,402 862,346" fill="var(--ink)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
<g id="rb"><rect id="rbr" x="600" y="480" width="400" height="130" rx="20" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="d5" x="800" y="572" font-size="44" text-anchor="middle">New routine</text></g>
<path id="crk" d="M784 478l14 16-12 12 16 14-8 10" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="stch"><path class="s-gain" d="M774 490h32M776 508h32" stroke-width="6" stroke-linecap="round"/></g>
<g id="spk"><path class="s-gain" d="M1162 545H1012" stroke-width="5" stroke-dasharray="10 10"/><g id="spkM"><polygon id="star" class="gain"/></g>
<text class="d" x="1240" y="660" font-size="44" text-anchor="middle" style="fill:var(--gain)">Belief</text></g>
<g id="bel"><text class="d" x="120" y="750" font-size="42">People who believed they could change</text><text class="d" x="120" y="806" font-size="42">were more likely to stay sober when life got hard.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Belief grows in groups.</text>
<text class="b" x="120" y="176" font-size="32">Change is easier when others believe with you.</text>
<circle id="ring" class="s-gain" cx="520" cy="500" r="200" fill="none" stroke-width="6"/>
<g id="grp"></g>
<text class="m" x="520" y="612" font-size="20" text-anchor="middle">YOU</text>
<g id="pull"></g>
<g id="t71"><text class="d" x="900" y="330" font-size="44">Belief is easiest</text><text class="d" x="900" y="385" font-size="44">to build in a group.</text></g>
<g id="t72"><text class="d5" x="900" y="490" font-size="34">Seeing others change</text><text class="d5" x="900" y="535" font-size="34">makes your own change</text><text class="d5" x="900" y="580" font-size="34">feel real.</text></g>
<g id="t73"><text class="d5" x="900" y="690" font-size="34" style="fill:var(--gain)">Shared trust holds the</text><text class="d5" x="900" y="735" font-size="34" style="fill:var(--gain)">new routine when</text><text class="d5" x="900" y="780" font-size="34" style="fill:var(--gain)">cravings pull hardest.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which habit will you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">keep the cue and reward of,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">but swap the <tspan style="fill:var(--gain)">routine</tspan>?</text></g>
<g id="lab8"><text class="m" x="143" y="700" font-size="26">THEN FIND ONE PERSON TO BELIEVE IN IT</text></g>
<g id="gr8">
<rect class="ink" x="1080" y="660" width="80" height="80" rx="12"/><rect class="ink" x="1380" y="660" width="80" height="80" rx="12"/>
<path class="s-muted" d="M1168 700h52M1318 700h52" stroke-width="5" stroke-linecap="round"/>
<rect id="nq" class="gain" x="1230" y="660" width="80" height="80" rx="12"/>
<text class="m" x="1120" y="780" font-size="18" text-anchor="middle">CUE</text><text class="m" x="1270" y="780" font-size="18" text-anchor="middle">ROUTINE</text><text class="m" x="1420" y="780" font-size="18" text-anchor="middle">REWARD</text>
</g>
</g>