<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Rock stars and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">superstars.</text>
<text class="b" x="120" y="600" font-size="32">Why great bosses stop pushing everyone up the same ladder.</text>
