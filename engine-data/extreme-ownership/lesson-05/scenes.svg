<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Prioritize</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and execute.</text>
<text class="b" x="120" y="600" font-size="32">When everything is urgent, solve one thing at a time.</text>
