<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Always stay</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">a student.</text>
<text class="b" x="120" y="600" font-size="32">Why the best performers never stop learning from others.</text>
<g id="t_me"></g>
<g id="t_badge"><path class="s-loss" d="M1302 392L1286 440M1338 392L1354 440" stroke-width="5" stroke-linecap="round" fill="none"/>
<rect x="1256" y="438" width="128" height="50" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/>
<text class="m" x="1320" y="471" font-size="22" text-anchor="middle" style="fill:var(--ink)">EXPERT</text></g>
<g id="t_cap"><polygon class="gain" points="1240,282 1320,252 1400,282 1320,312"/><rect class="gain" x="1286" y="290" width="68" height="26"/><path class="s-gain" d="M1390 286v52" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The know-it-all trap.</text>
<text class="b" x="120" y="176" font-size="32">Ego tells us we already know enough.</text>
<g id="k_book">
<rect class="s-ink" x="170" y="290" width="210" height="270" rx="10" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="170" y="290" width="34" height="270"/>
<rect class="loss" x="160" y="404" width="230" height="40"/>
<path class="s-ink" d="M266 400v-22a20 20 0 0 1 40 0v22" fill="none" stroke-width="8"/>
<rect class="ink" x="256" y="398" width="60" height="52" rx="8"/>
<text class="m" x="275" y="610" font-size="20" text-anchor="middle">“I KNOW ENOUGH”</text>
</g>
<g id="k_q"></g>
<g id="k_wall"></g>
<path id="k_line" class="s-gain" d="M460 580L880 380" stroke-width="8" stroke-linecap="round" fill="none"/>
<g id="k_hit"><path class="s-loss" d="M876 350l-18-24M872 380h-28M876 410l-18 24" stroke-width="6" stroke-linecap="round"/><text class="m" x="940" y="660" font-size="20" text-anchor="middle">GROWTH STOPS</text></g>
<g id="k_ep"><g id="k_epp"></g>
<rect class="s-ink" x="1360" y="262" width="60" height="214" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1380 280v180M1400 280v180" stroke-width="4"/>
<rect class="ink" x="1346" y="248" width="88" height="16"/><rect class="ink" x="1346" y="476" width="88" height="16"/>
<text class="m" x="1220" y="540" font-size="22" text-anchor="middle">EPICTETUS</text>
<text class="m" x="1220" y="574" font-size="20" text-anchor="middle">STOIC PHILOSOPHER</text>
</g>
<g id="k_quote"><rect class="gain" x="120" y="696" width="8" height="128"/>
<text class="d5" x="152" y="744" font-size="42">“It is impossible for a man to learn</text>
<text class="d5" x="152" y="808" font-size="42">what he thinks he already knows.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Frank Shamrock.</text>
<text class="b" x="120" y="176" font-size="32">A mixed martial arts champion with a simple training system.</text>
<g id="f_fighter"><g id="f_body"></g>
<rect class="gain" x="234" y="498" width="132" height="28"/>
<circle class="gain" cx="300" cy="512" r="22" stroke="var(--ink)" stroke-width="5"/>
<circle class="s-ink" cx="220" cy="470" r="26" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="380" cy="470" r="26" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="300" y="612" font-size="22" text-anchor="middle">FRANK SHAMROCK</text>
<text class="m" x="300" y="646" font-size="20" text-anchor="middle">MMA CHAMPION</text>
</g>
<g id="f_gym"><rect class="s-line" x="560" y="250" width="920" height="460" rx="18" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="600" y="300" font-size="22">PLUS · MINUS · EQUAL</text></g>
<g id="f_parts"></g>
<g id="f_all"><text class="d" x="120" y="800" font-size="48">Every fighter needs all three.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The plus.</text>
<text class="b" x="120" y="176" font-size="32">Someone better than you.</text>
<g id="pl_badge"><circle class="gain" cx="260" cy="430" r="110"/><path d="M260 370v120M200 430h120" stroke="var(--on-gain)" stroke-width="22" stroke-linecap="round"/><text class="m" x="260" y="600" font-size="22" text-anchor="middle">BETTER THAN YOU</text></g>
<g id="pl_scene"><rect class="s-ink" x="660" y="560" width="200" height="80" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M560 640h560" stroke-width="5" stroke-linecap="round"/><g id="pl_ppl"></g>
<text class="m" x="760" y="680" font-size="20" text-anchor="middle">MENTOR</text><text class="m" x="1020" y="680" font-size="20" text-anchor="middle">YOU</text></g>
<g id="pl_ego"><g id="pl_egoS"><circle class="loss" cx="1020" cy="400" r="42"/></g><text class="m" x="958" y="408" font-size="22" text-anchor="end" style="fill:var(--loss)">EGO</text></g>
<g id="pl_card"><path class="s-muted" d="M800 380Q980 280 1140 360" fill="none" stroke-width="3" stroke-dasharray="6 8"/>
<rect class="s-line" x="1150" y="290" width="330" height="200" rx="16" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1176" y="330" font-size="18">YOUR MISTAKE, CORRECTED</text>
<path class="s-loss" d="M1200 380l50 60M1250 380l-50 60" stroke-width="10" stroke-linecap="round"/>
<path class="s-muted" d="M1282 410h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path id="pl_ok" class="s-gain" d="M1370 412l22 24 44-56" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="pl_hon"><text class="d" x="120" y="800" font-size="44">Being around them keeps your ego honest.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The equal.</text>
<text class="b" x="120" y="176" font-size="32">Someone at your own level.</text>
<g id="eq_badge"><circle class="ink" cx="260" cy="430" r="110"/><path d="M205 405h110M205 455h110" stroke="var(--stage)" stroke-width="22" stroke-linecap="round"/><text class="m" x="260" y="600" font-size="22" text-anchor="middle">SAME LEVEL AS YOU</text></g>
<g id="eq_fight"><polygon class="ink" points="980,562 930,640 1030,640"/>
<g id="eq_beam"><rect class="ink" x="660" y="548" width="640" height="14" rx="7"/><g id="eq_ppl"></g></g>
<text class="m" x="980" y="690" font-size="20" text-anchor="middle">WHERE YOU REALLY STAND</text></g>
<g id="eq_hide"><text class="d" x="120" y="800" font-size="48">No easy wins. Nowhere to hide.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The minus.</text>
<text class="b" x="120" y="176" font-size="32">Someone less experienced, someone you teach.</text>
<g id="mi_badge"><circle class="s-ink" cx="260" cy="430" r="110" fill="var(--stage)" stroke-width="8"/><path class="s-ink" d="M200 430h120" stroke-width="22" stroke-linecap="round"/><text class="m" x="260" y="600" font-size="22" text-anchor="middle">SOMEONE YOU TEACH</text></g>
<g id="mi_room"><rect class="s-ink" x="560" y="240" width="520" height="300" rx="10" fill="var(--stage)" stroke-width="8"/><rect class="ink" x="600" y="540" width="440" height="12"/><g id="mi_ppl"></g>
<path class="s-ink" d="M1150 560L1060 470" stroke-width="6" stroke-linecap="round"/></g>
<g id="mi_steps"></g>
<g id="mi_gap"><circle class="s-loss" cx="820" cy="390" r="52" fill="none" stroke-width="5" stroke-dasharray="10 8"/><text class="d" x="820" y="408" font-size="52" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="mi_txt"><text class="d" x="120" y="800" font-size="44">Teaching shows you the gaps in what you know.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why you need all three.</text>
<text class="b" x="120" y="176" font-size="32">Learn from above, test sideways, pass it on below.</text>
<g id="w_loop"><circle id="w_ring" class="s-gain" cx="440" cy="480" r="190" fill="none" stroke-width="6" stroke-dasharray="18 14"/>
<circle class="gain" cx="440" cy="480" r="44"/><text class="m" x="440" y="487" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text></g>
<g id="w_nodes"></g>
<g id="w_lad"><text class="m" x="1190" y="300" font-size="20">ALWAYS SOMEONE ABOVE</text></g>
<g id="w_more"><text class="m" x="120" y="790" font-size="22">A REAL STUDENT NEVER RUNS OUT OF THINGS TO LEARN</text></g>
<g id="w_pt"><text class="d" x="120" y="850" font-size="44">Not to feel smart. To keep getting better.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Write down your three people.</text>
<text class="b" x="120" y="176" font-size="32">Your plus, your equal and your minus.</text>
<g id="n_book"><rect class="s-ink" x="160" y="240" width="560" height="520" rx="14" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="200" y="400" font-size="26">PLUS</text><text class="m" x="200" y="520" font-size="26">EQUAL</text><text class="m" x="200" y="640" font-size="26">MINUS</text>
<path class="s-line" d="M340 410h340M340 530h340M340 650h340" stroke-width="4"/></g>
