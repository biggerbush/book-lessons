<g id="st1"><rect class="s-ink" x="580" y="520" width="110" height="90" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="606" y="506" width="110" height="90" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="632" y="492" width="110" height="90" rx="8" fill="var(--stage)" stroke-width="5"/><path class="gain" d="M687 515l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/><text class="m" x="670" y="660" font-size="20" text-anchor="middle">TRACK RECORD</text></g>
