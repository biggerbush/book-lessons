<g id="s0">
<text class="m" x="120" y="150" font-size="28">THIS IS MARKETING · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Marketing is the act</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of making change.</text>
<text class="b" x="120" y="600" font-size="32">Real marketing is the generous work of helping people change.</text>
<g id="mega"><g id="megaB">
<rect class="ink" x="-110" y="-28" width="50" height="56" rx="6"/>
<path id="cone" class="loss" d="M-60 -28L60 -90V90L-60 28Z"/>
<path class="s-ink" d="M-80 28v54" stroke-width="14" stroke-linecap="round"/>
<path id="w0" class="s-loss" d="M80 -40a60 60 0 0 1 0 80" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="w1" class="s-loss" d="M105 -60a80 80 0 0 1 0 120" fill="none" stroke-width="7" stroke-linecap="round"/>
<path id="w2" class="s-loss" d="M130 -70a90 90 0 0 1 0 140" fill="none" stroke-width="7" stroke-linecap="round"/>
</g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old way: interrupt and shout.</text>
<text class="b" x="120" y="176" font-size="32">Average stuff, for average people.</text>
<g id="tv">
<path class="s-ink" d="M270 260l-40-50M350 260l40-50M250 460l-30 40M370 460l30 40" stroke-width="7" stroke-linecap="round"/>
<rect class="s-ink" x="160" y="260" width="300" height="200" rx="18" fill="var(--stage)" stroke-width="7"/>
<rect class="loss" x="180" y="280" width="260" height="160" rx="8" fill-opacity=".15"/>
<text id="adT" class="d" x="310" y="384" font-size="64" text-anchor="middle" style="fill:var(--loss)">AD!</text>
<text class="m" x="310" y="545" font-size="20" text-anchor="middle">INTERRUPT</text>
</g>
<g id="fac">
<path class="s-ink" d="M580 470V320l80 50V320l80 50V320l80 50V260h60v210z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-ink" d="M560 500H1010" stroke-width="6" stroke-linecap="round"/>
<g id="boxes"></g>
<text class="m" x="780" y="545" font-size="20" text-anchor="middle">AVERAGE STUFF, AVERAGE PEOPLE</text>
</g>
<g id="crowd1"><g id="ppl"></g><g id="tgts"></g>
<text class="m" x="1275" y="545" font-size="20" text-anchor="middle">TARGETS, NOT PEOPLE</text>
</g>
<g id="dec"><g id="bars"></g>
<text class="m" x="880" y="790" font-size="22">WORKS LESS AND LESS EVERY YEAR</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A new definition.</text>
<text class="b" x="120" y="176" font-size="32">Godin offers a very different view.</text>
<g id="gd">
<circle class="ink" cx="230" cy="290" r="30"/><path class="ink" d="M185 416v-39a45 45 0 0 1 90 0v39z"/>
<text class="m" x="230" y="460" font-size="20" text-anchor="middle">SETH GODIN</text>
</g>
<g id="quote">
<text class="d" x="400" y="320" font-size="60">“Marketing is the act of</text>
<text class="d" x="400" y="400" font-size="60" style="fill:var(--gain)">making change happen.”</text>
</g>
<g id="arr">
<circle class="s-loss" cx="360" cy="620" r="70" fill="none" stroke-width="6"/>
<text class="m" x="360" y="730" font-size="20" text-anchor="middle">WHERE THEY ARE</text>
<circle class="s-gain" cx="1240" cy="620" r="70" fill="none" stroke-width="6"/>
<text class="m" x="1240" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">SOMEWHERE BETTER</text>
<line id="arL" class="s-gain" x1="440" y1="620" x2="440" y2="620" stroke-width="7" stroke-dasharray="14 10"/>
<path id="arH" class="s-gain" d="M1140 590l30 30-30 30" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="trv" class="ink" cx="360" cy="620" r="26"/>
</g>
<g id="job"><text class="d" x="120" y="830" font-size="46">That is the whole job.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Nobody wants a drill bit.</text>
<text class="b" x="120" y="176" font-size="32">An old business saying.</text>
<g id="bitD">
