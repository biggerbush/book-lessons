<g id="arc0"></g>
<g id="dots0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">How new ideas spread.</text>
<text class="b" x="120" y="176" font-size="32">Godin borrows a familiar curve of how a market adopts.</text>
<g id="bc1"></g>
<g id="le1">
<text class="m" x="200" y="560" font-size="20" style="fill:var(--gain)">HUNGRY FOR</text>
<text class="m" x="200" y="590" font-size="20" style="fill:var(--gain)">ANYTHING NEW</text>
<text class="m" x="200" y="770" font-size="20">INNOVATORS +</text>
<text class="m" x="200" y="800" font-size="20">EARLY ADOPTERS</text>
</g>
<g id="bm1">
<text class="m" x="800" y="640" font-size="20" text-anchor="middle">WANTS WHAT WORKS</text>
