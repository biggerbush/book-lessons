<g id="s0">
<text class="m" x="120" y="150" font-size="28">REWORK · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Plans are</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">just guesses.</text>
<text class="b" x="120" y="600" font-size="32">Why your five-year plan is really just a guess.</text>
<g id="ball">
<path class="ink" d="M1200 640l30-80h140l30 80z"/>
<circle class="s-ink" cx="1300" cy="420" r="140" fill="var(--stage)" stroke-width="8"/>
<path class="s-line" d="M1200 380a110 110 0 0 1 60-74" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="ballPlan"><path class="s-gain" d="M1220 480l50-30 40 10 70-80" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1300" y="520" font-size="22" text-anchor="middle">5 YEARS</text></g>
<text id="ballQ" class="d" x="1300" y="478" font-size="170" text-anchor="middle" style="fill:var(--loss)">?</text>
<g id="spk"></g>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Long-term planning is a fantasy.</text>
<text class="b" x="120" y="176" font-size="32">Jason Fried and David Heinemeier Hansson put it bluntly.</text>
<g id="quote">
<rect class="gain" x="120" y="250" width="12" height="200"/>
<text class="d5" x="160" y="300" font-size="44">“Unless you’re a fortune-teller,</text>
<text class="d5" x="160" y="360" font-size="44">long-term business planning</text>
<text class="d" x="160" y="430" font-size="56" style="fill:var(--gain)">is a fantasy.”</text>
</g>
<g id="teller"><g id="tp"></g><rect class="ink" x="1150" y="436" width="280" height="18" rx="6"/><circle id="tball" class="gain" cx="1290" cy="396" r="40"/><text class="m" x="1290" y="490" font-size="20" text-anchor="middle">FORTUNE-TELLER</text></g>
<g id="binders"><text class="m" x="120" y="580" font-size="20">THE PLAN · WEEKS OF POLISHING</text></g>
<g id="chart">
<path class="s-ink" d="M720 560V800H1460" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path id="proj" class="s-gain" d="M740 780L880 740L1020 700L1160 660L1300 620L1440 580" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="720" y="840" font-size="20">FIVE-YEAR PROJECTIONS</text>
</g>
<g id="stamp"><g transform="rotate(-8 1120 690)"><rect class="s-loss" x="940" y="650" width="360" height="80" rx="10" fill="var(--stage)" stroke-width="6"/><text class="d" x="1120" y="703" font-size="34" text-anchor="middle" style="fill:var(--loss)">ALREADY DECIDED?</text></g></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Too much is unknown.</text>
<text class="b" x="120" y="176" font-size="32">The future won’t sit still inside a spreadsheet.</text>
<g id="pw"><rect class="s-line" x="120" y="230" width="380" height="280" rx="18" fill="var(--stage)" stroke-width="3"/><path id="wv1" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round"/><path id="wv2" class="s-muted" fill="none" stroke-width="4" stroke-linecap="round"/><text class="m" x="310" y="550" font-size="20" text-anchor="middle">MARKETS SHIFT</text></g>
<g id="pr"><rect class="s-line" x="610" y="230" width="380" height="280" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="720" y="340" width="160" height="130" fill="var(--stage)" stroke-width="6"/><g id="awn"></g><rect class="ink" x="780" y="400" width="40" height="70"/><circle id="bulb" class="gain" cx="935" cy="290" r="22"/><path class="s-gain" d="M935 250v-10M970 290h10M890 290h-10M960 262l8-8M910 262l-8-8" stroke-width="5" stroke-linecap="round"/><text class="m" x="800" y="550" font-size="20" text-anchor="middle">NEW COMPETITORS</text></g>
<g id="pc"><rect class="s-line" x="1100" y="230" width="380" height="280" rx="18" fill="var(--stage)" stroke-width="3"/><g id="cust"></g><circle class="s-ink" cx="1290" cy="388" r="7" fill="var(--stage)" stroke-width="4"/><circle class="s-ink" cx="1372" cy="320" r="54" fill="var(--stage)" stroke-width="5"/><text class="d" x="1372" y="342" font-size="64" text-anchor="middle" style="fill:var(--gain)">?</text><text class="m" x="1290" y="550" font-size="20" text-anchor="middle">SURPRISING CUSTOMERS</text></g>
<g id="sheet"><g id="shk"><rect class="s-ink" x="500" y="600" width="600" height="220" fill="var(--stage)" stroke-width="5"/><rect x="503" y="603" width="594" height="52" fill="var(--line)"/><g id="grid"></g><path id="crack" class="s-loss" d="M720 600L760 660L730 700L800 760L780 820" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="7" stroke-linejoin="round"/></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Call plans what they are.</text>
<g id="hon"><text class="b" x="120" y="176" font-size="32">A simple, honest trick from the authors.</text></g>
<g id="lm">
<rect id="tape" class="gain" x="210" y="470" width="120" height="0"/>
<text id="tapeT" class="m" x="270" y="610" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">GUESS</text>
<rect class="ink" x="120" y="290" width="300" height="190" rx="28"/>
<rect x="150" y="315" width="240" height="60" rx="8" fill="var(--stage)"/>
<text class="m" x="270" y="354" font-size="24" text-anchor="middle">GUESS_</text>
<g id="keys"></g>
</g>
<g id="r0"><text class="d" x="520" y="340" font-size="52">Business</text><text class="d5" x="830" y="340" font-size="52" fill-opacity=".55">plan</text></g>
<g id="r1"><text class="d" x="520" y="510" font-size="52">Financial</text><text class="d5" x="830" y="510" font-size="52" fill-opacity=".55">forecast</text></g>
<g id="r2"><text class="d" x="520" y="680" font-size="52">Strategic</text><text class="d5" x="830" y="680" font-size="52" fill-opacity=".55">plan</text></g>
<line id="rk0" class="s-ink" x1="822" y1="322" x2="822" y2="322" stroke-width="5" stroke-linecap="round"/>
<line id="rk1" class="s-ink" x1="822" y1="492" x2="822" y2="492" stroke-width="5" stroke-linecap="round"/>
<line id="rk2" class="s-ink" x1="822" y1="662" x2="822" y2="662" stroke-width="5" stroke-linecap="round"/>
<g id="tg0"></g><g id="tg1"></g><g id="tg2"></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The comfort trap.</text>
<text class="b" x="120" y="176" font-size="32">A detailed plan feels good: it makes you feel in control.</text>
<g id="ck"><rect id="ckr" class="s-ink" x="120" y="240" width="500" height="400" rx="18" fill="var(--stage)" stroke-width="5"/><text class="m" x="150" y="290" font-size="22">THE DETAILED PLAN</text><g id="rows4"></g></g>
<g id="ill"><g transform="rotate(-10 370 460)"><rect class="s-loss" x="190" y="410" width="360" height="100" rx="12" fill="var(--stage)" stroke-width="7"/><text class="d" x="370" y="482" font-size="56" text-anchor="middle" style="fill:var(--loss)">ILLUSION</text></g><text class="m" x="120" y="700" font-size="22">THE FEELING OF CONTROL IS NOT REAL</text></g>
<g id="hz">
<polygon points="1000,690 965,360 1035,360" class="loss" fill-opacity=".12"/>
<circle class="s-muted" cx="1000" cy="300" r="50" fill="none" stroke-width="5"/><circle class="s-muted" cx="1000" cy="300" r="30" fill="none" stroke-width="5"/><circle class="loss" cx="1000" cy="300" r="12"/>
<text class="m" x="1070" y="308" font-size="20">OLD TARGET</text>
<path class="s-ink" d="M1000 360V640" stroke-width="4" stroke-dasharray="10 10"/>
<g id="hm"><ellipse class="ink" cx="1000" cy="760" rx="34" ry="50"/><path class="ink" d="M978 722l-6-26 18 16zM1022 722l6-26-18 16z"/><rect class="loss" x="948" y="720" width="12" height="54" rx="4"/><rect class="loss" x="1040" y="720" width="12" height="54" rx="4"/><text class="m" x="920" y="780" font-size="20" text-anchor="end">BLINDERS</text></g>
</g>
<g id="bp"><path class="s-gain" d="M1000 640C1100 640 1250 560 1340 470" fill="none" stroke-width="7" stroke-dasharray="12 10" stroke-linecap="round"/><path id="star" class="gain" d="M1370 412l8 18 20 2-15 13 5 20-18-11-18 11 5-20-15-13 20-2z"/><text class="m" x="1370" y="396" font-size="20" text-anchor="middle" style="fill:var(--gain)">BETTER PATH</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The past is steering.</text>
<text class="b" x="120" y="176" font-size="32">A long-term plan lets old decisions drive what you do today.</text>
<g id="mir"><rect class="s-ink" x="580" y="220" width="440" height="100" rx="40" fill="var(--stage)" stroke-width="8"/><text class="m" x="800" y="280" font-size="22" text-anchor="middle">THE PLAN · MADE BACK THEN</text></g>
<path id="str" class="s-loss" d="M210 720C210 520 440 300 576 280" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<g id="bars"></g>
<g id="axl"><text class="m" x="210" y="800" font-size="20" text-anchor="middle">THEN</text><text class="m" x="1310" y="800" font-size="20" text-anchor="middle">NOW</text></g>
<g id="lst"><text class="m" x="120" y="840" font-size="20" style="fill:var(--loss)">YOU KNEW THE LEAST</text></g>
<g id="wyk"><text class="m" x="1480" y="370" font-size="20" text-anchor="end" style="fill:var(--gain)">WHAT YOU KNOW</text></g>
<g id="lock"><path class="s-loss" d="M1380 560v-30a30 30 0 0 1 60 0v30" fill="none" stroke-width="10"/><rect class="loss" x="1365" y="556" width="90" height="74" rx="10"/></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Think this week, not this year.</text>
<g id="yr"><text class="m" x="120" y="252" font-size="20">THIS YEAR</text><g id="yrg"></g></g>
<g id="wk"><text class="m" x="120" y="530" font-size="20" style="fill:var(--gain)">THIS WEEK</text><g id="wkb"></g></g>
<g id="stp">
<path class="s-ink" d="M780 500H920" stroke-width="6" stroke-linecap="round"/>
<path class="s-line" d="M1040 430V360H1160V290H1280" fill="none" stroke-width="6" stroke-dasharray="10 10"/>
<text class="d" x="1100" y="345" font-size="36" text-anchor="middle" style="fill:var(--muted)">?</text><text class="d" x="1220" y="275" font-size="36" text-anchor="middle" style="fill:var(--muted)">?</text>
<path class="s-gain" d="M920 500V430H1040" fill="none" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<g id="per6"></g>
<text class="m" x="780" y="552" font-size="20">THE NEXT MOST IMPORTANT THING</text>
</g>
<g transform="translate(0 -40)">
<g id="inf">
<path class="s-ink" d="M800 620V800H1460" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path id="cur" class="s-gain" d="M800 790C1000 780 1200 720 1420 640" pathLength="1" stroke-dasharray="1 1" fill="none" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="816" y="650" font-size="20">INFORMATION</text><text class="m" x="1460" y="836" font-size="20" text-anchor="end">TIME</text>
<circle class="s-ink" cx="1080" cy="690" r="36" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1080 690h16" stroke-width="5" stroke-linecap="round"/><path id="hand" class="s-gain" d="M1080 690V662" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="dm"><path class="s-ink" d="M1420 800V640" stroke-width="4" stroke-dasharray="6 8"/><text class="m" x="1460" y="616" font-size="20" text-anchor="end" style="fill:var(--gain)">DECIDE HERE</text></g>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Winging it is fine.</text>
<g id="tr"><text class="m" x="120" y="260" font-size="20">NO GRAND PLAN · SCARY</text><path class="s-ink" d="M180 700V380M700 700V380" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M180 400Q440 450 700 400" fill="none" stroke-width="4"/>
<g id="wlk"><g id="wng"><path class="gain" d="M425 385C380 325 330 325 296 348C335 372 380 392 425 402z"/><path class="gain" d="M455 385C500 325 550 325 584 348C545 372 500 392 455 402z"/></g><g id="wp"></g><path class="s-ink" d="M330 380H550" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="cl"><text class="m" x="840" y="260" font-size="20">BLINDLY FOLLOWING A PLAN · SCARIER</text>
<path class="s-ink" d="M840 600H1260L1248 680L1262 760" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-line" d="M880 650l24-24M960 650l24-24M1040 650l24-24M1120 650l24-24M920 710l24-24M1000 710l24-24M1080 710l24-24M1160 710l24-24" stroke-width="4" stroke-linecap="round"/>
<g id="planA"><text class="m" x="960" y="436" font-size="22" style="fill:var(--loss)">THE PLAN</text><path class="s-loss" d="M950 462H1430M1410 450l20 12-20 12" fill="none" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="m" x="1290" y="710" font-size="22" style="fill:var(--loss)">REALITY</text>
<path class="s-loss" d="M1284 684l-18-30" stroke-width="4" stroke-linecap="round"/>
<g id="clw"></g><g id="bang"><text class="d" x="1290" y="590" font-size="80" style="fill:var(--loss)">!</text></g></g>
<g id="wi"><text class="d" x="120" y="810" font-size="52">Wing it. Adjust as you learn.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Rename one plan a guess.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Then: what single step</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">will you take <tspan style="fill:var(--gain)">this week</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">PLAN LESS · DECIDE CLOSER IN</text>
<g id="tag8"><g transform="rotate(-6 1320 690)"><rect class="gain" x="1180" y="650" width="280" height="84" rx="14"/><circle cx="1208" cy="692" r="9" fill="var(--stage)"/><text class="d" x="1334" y="708" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">guess</text></g></g>
</g>