<g id="w_team"><g id="w_tf"></g><text class="m" x="800" y="850" font-size="22" text-anchor="middle">WHEN THEY BUILD IT, THEY OWN IT</text></g>
<g id="w_win"><rect class="gain" x="1220" y="300" width="260" height="90" rx="45"/><text class="d" x="1350" y="358" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Small win</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">A visible score turns strategy into a game.</text>
<g id="y_dk"><rect class="loss" x="120" y="230" width="640" height="470" rx="18" fill-opacity=".14"/><g id="y_wk"></g>
<text class="m" x="150" y="670" font-size="22" style="fill:var(--loss)">NO SCORE · DOES MY EFFORT MATTER?</text></g>
<g id="y_rt"><rect class="s-line" x="840" y="230" width="640" height="470" rx="18" fill="var(--stage)" stroke-width="4"/>
<path class="s-ink" d="M880 280V630h560" fill="none" stroke-width="5" stroke-linecap="round"/>
<polyline id="y_ln" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="y_pp"></g>
<text class="m" x="880" y="670" font-size="22" style="fill:var(--gain)">VISIBLE SCORE · WE’RE WINNING</text></g>
<g id="y_eng"><text class="d" x="120" y="810" font-size="50">That feeling of winning drives engagement.</text></g>
</g>

<g id="s8" opacity="0">
<g id="z_t"><text class="m" x="143" y="230" font-size="26">THIS WEEK · SKETCH ONE SCOREBOARD · POST IT</text></g>
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">Can everyone tell</text></g>
