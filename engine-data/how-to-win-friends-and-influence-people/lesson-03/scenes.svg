<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Talk about what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">they want.</text>
<text class="b" x="120" y="600" font-size="32">Bait the hook with what the fish wants, not you.</text>
