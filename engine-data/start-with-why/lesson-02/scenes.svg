<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Golden Circle:</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Why, How, What.</text>
<text class="b" x="120" y="600" font-size="32">Start at the center, and people start to listen.</text>
<g id="tc0"><circle class="s-ink" cx="1270" cy="420" r="200" fill="var(--stage)" stroke-width="6"/><text class="m" x="1270" y="263" font-size="22" text-anchor="middle">WHAT</text></g>
<g id="tc1"><circle class="s-ink" cx="1270" cy="420" r="130" fill="var(--stage)" stroke-width="6"/><text class="m" x="1270" y="333" font-size="22" text-anchor="middle">HOW</text></g>
<g id="tc2"><circle class="gain" cx="1270" cy="420" r="60"/><text class="m" x="1270" y="428" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g>
<g id="wo"><text class="m" x="1270" y="690" font-size="22" text-anchor="middle" style="fill:var(--loss)">MOST READ IT: WHAT → HOW → WHY</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A target with three rings.</text>
<g id="gold"><text class="b" x="120" y="176" font-size="32">Sinek calls this the <tspan style="fill:var(--gain)">Golden Circle</tspan>.</text></g>
<g id="r1o"><circle class="s-ink" cx="600" cy="520" r="300" fill="var(--stage)" stroke-width="7"/></g>
<g id="r1m"><circle class="s-ink" cx="600" cy="520" r="190" fill="var(--stage)" stroke-width="7"/></g>
<circle id="r1c" class="gain" cx="600" cy="520" r="0"/>
<g id="lb0"><path class="s-muted" d="M830 327L1020 282" stroke-width="3"/><text class="d" x="1040" y="300" font-size="56">What</text><text class="m" x="1042" y="336" font-size="20">OUTER RING</text></g>
<g id="lb1"><path class="s-muted" d="M784 471L1020 432" stroke-width="3"/><text class="d" x="1040" y="450" font-size="56">How</text><text class="m" x="1042" y="486" font-size="20">MIDDLE RING</text></g>
<g id="lb2"><path class="s-muted" d="M661 555L1020 612" stroke-width="3"/><text class="d" x="1040" y="630" font-size="56" style="fill:var(--gain)">Why</text><text class="m" x="1042" y="666" font-size="20">THE CENTER</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What is easy. How is rarer.</text>
<text class="b" x="120" y="176" font-size="32">The two outer rings: what you do, and how you do it.</text>
<rect class="s-line" x="120" y="220" width="640" height="620" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="220" width="640" height="620" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="270" font-size="22">WHAT</text>
<text class="m" x="870" y="270" font-size="22">HOW</text>
<g id="pb">
<rect class="s-ink" x="370" y="400" width="140" height="120" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M370 400l40-40h140l-40 40zM510 400l40-40v120l-40 40z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-gain" d="M425 400l40-40" stroke-width="10" stroke-linecap="round"/>
<text class="d5" x="150" y="590" font-size="34">The products you sell,</text>
<text class="d5" x="150" y="634" font-size="34">the job you do.</text>
</g>
<g id="ra"><g id="rowA"></g><text class="m" x="150" y="805" font-size="18">NEARLY EVERY ORGANIZATION KNOWS ITS WHAT</text></g>
<g id="gr"><g id="gw"></g><circle class="gain" cx="1110" cy="440" r="20"/><circle class="gain" cx="1240" cy="370" r="14"/>
<text class="d5" x="870" y="590" font-size="34">The process or values</text>
<text class="d5" x="870" y="634" font-size="34">that make you different.</text></g>
<g id="rb"><g id="rowB"></g><text class="m" x="870" y="805" font-size="18">SOME KNOW THEIR HOW</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why is your purpose.</text>
<text class="b" x="120" y="176" font-size="32">The belief that gets you out of bed.</text>
<g id="qm"><circle class="gain" cx="360" cy="450" r="150"/><text class="d" x="360" y="528" font-size="220" text-anchor="middle" style="fill:var(--on-gain)">?</text><text class="m" x="360" y="650" font-size="22" text-anchor="middle">PURPOSE</text></g>
<g id="cs"><g id="coins"></g><text class="m" x="760" y="650" font-size="22" text-anchor="middle">MONEY IS NOT A WHY</text></g>
<g id="cx3"><path class="s-loss" d="M650 380L870 600M870 380L650 600" stroke-width="12" stroke-linecap="round"/></g>
<g id="pr"><text class="d" x="960" y="450" font-size="40">Profit is a result,</text><text class="d" x="960" y="505" font-size="40" style="fill:var(--gain)">not a reason.</text></g>
<g id="rc"><g id="rowC"></g><text class="m" x="120" y="820" font-size="20">VERY FEW CAN CLEARLY SAY WHY THEY EXIST</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Most talk from the outside in.</text>
<text class="b" x="120" y="176" font-size="32">They start at the outer ring.</text>
<g id="rg4"></g><g id="ai"></g>
<g id="sp"><rect class="s-ink" x="700" y="240" width="780" height="380" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M700 410L660 440L700 455" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
<g id="pl0"><text class="m" x="750" y="300" font-size="20">WHAT</text><text class="d5" x="750" y="350" font-size="40">“We make great computers.</text></g>
<g id="pl1"><text class="m" x="750" y="400" font-size="20">HOW</text><text class="d5" x="750" y="450" font-size="40">They look good and work easily.</text></g>
<g id="pl2"><text class="m" x="750" y="500" font-size="20" style="fill:var(--loss)">THE ASK</text><text class="d5" x="750" y="550" font-size="40">Want one?”</text></g>
<g id="nt"><text class="m" x="700" y="680" font-size="20">BEGINS WITH THE PRODUCT · ENDS WITH THE SALE</text></g>
<g id="cold"><g id="ppl"></g><text class="d" x="120" y="830" font-size="44">Accurate, but it leaves people cold.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Apple flips the order.</text>
<text class="b" x="120" y="176" font-size="32">From the inside out.</text>
<g id="rg5"></g><g id="ao"></g>
<g id="bb"><rect class="gain" x="740" y="240" width="740" height="170" rx="16"/>
<text class="m" x="770" y="282" font-size="20" style="fill:var(--on-gain)">WHY · A BELIEF</text>
<text class="d" x="770" y="334" font-size="40" style="fill:var(--on-gain)">Challenge the status quo.</text>
<text class="d" x="770" y="384" font-size="40" style="fill:var(--on-gain)">Think differently.</text></g>
<g id="hw"><rect class="s-line" x="740" y="435" width="740" height="110" rx="16" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="770" y="475" font-size="20">HOW</text><text class="d5" x="770" y="525" font-size="34">Beautifully designed and simple.</text></g>
<g id="wt"><rect class="s-line" x="740" y="575" width="740" height="190" rx="16" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="770" y="608" font-size="20">WHAT</text>
<rect class="s-ink" x="790" y="622" width="160" height="100" rx="6" fill="var(--stage)" stroke-width="6"/>
<path class="ink" d="M770 728h200l-14 18h-172z"/>
<text class="d5" x="1010" y="705" font-size="40">Computers.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same facts. Different order.</text>
<g id="oc"><text class="b" x="120" y="176" font-size="32">Only the order changed.</text></g>
<g id="cards">
<rect class="s-line" x="120" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="266" font-size="22">OUTSIDE IN</text>
<text class="m" x="870" y="266" font-size="22">INSIDE OUT</text>
<g id="chL"></g><g id="chR"></g>
</g>
<g id="hz"><path id="hrt" class="gain" d="M0 40C-60 0-64-36-30-44C-14-48-3-37 0-28C3-37 14-48 30-44C64-36 60 0 0 40Z"/></g>
<g id="bl"><text class="m" x="150" y="690" font-size="22" style="fill:var(--loss)">SOMETHING TO BUY</text><text class="m" x="870" y="690" font-size="22" style="fill:var(--gain)">SOMETHING TO BELIEVE IN</text></g>
<g id="quo"><text class="d" x="120" y="770" font-size="50">“People don’t buy what you do,</text><text class="d" x="120" y="836" font-size="50" style="fill:var(--gain)">they buy why you do it.”</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Draw your own circle.</text>
<text class="b" x="120" y="176" font-size="32">Fill in what and how first. Then find your why.</text>
<g id="nb"><rect class="s-ink" x="180" y="220" width="700" height="600" rx="14" fill="var(--stage)" stroke-width="5"/><g id="spir"></g></g>
<g id="nr"></g>
<g id="l0"><text class="m" x="540" y="327" font-size="20" text-anchor="middle">WHAT</text></g>
<g id="l1"><text class="m" x="540" y="407" font-size="20" text-anchor="middle">HOW</text></g>
<g id="st"></g>
<g id="pcw"><g id="pc"><path class="ink" d="M0 0l8-28 54-54 20 20-54 54z"/><path class="gain" d="M62-82l20 20 10-10-20-20z"/></g></g>
<g id="w0"><text class="d" x="960" y="330" font-size="52">What</text><path class="s-gain" d="M1380 310l16 16 30-34" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="w1"><text class="d" x="960" y="440" font-size="52">How</text><path class="s-gain" d="M1380 420l16 16 30-34" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="w2"><text class="d" x="960" y="550" font-size="52" style="fill:var(--gain)">Why?</text></g>
<g id="sb"><rect class="s-gain" x="960" y="620" width="520" height="160" rx="24" fill="var(--stage)" stroke-width="5"/><text class="m" x="990" y="670" font-size="20">SAY IT OUT LOUD</text><text class="d5" x="990" y="735" font-size="34">In one simple sentence.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Next time you pitch,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">open with your <tspan style="fill:var(--gain)">why</tspan>.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Watch people lean in.</text></g>
<text class="m" x="143" y="700" font-size="26">START AT THE CENTER</text>
<g id="fc"><circle class="s-ink" cx="1360" cy="450" r="110" fill="none" stroke-width="6"/><circle class="s-ink" cx="1360" cy="450" r="72" fill="none" stroke-width="6"/><circle id="fcd" class="gain" cx="1360" cy="450" r="36"/></g>
</g>