<g id="s0">
<text class="m" x="120" y="150" font-size="28">PRINCIPLES · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Pain plus reflection</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">equals progress.</text>
<text class="b" x="120" y="600" font-size="32">Why your worst moments can become your best teachers.</text>
