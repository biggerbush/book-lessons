<g id="s0">
<text class="m" x="120" y="150" font-size="28">FOUR THOUSAND WEEKS · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Power</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Patience.</text>
<text class="b" x="120" y="600" font-size="32">Why sticking with the slow, ordinary beginning leads somewhere distinctive.</text>
<path class="s-line" d="M960 480H1480" stroke-width="5" stroke-linecap="round"/>
<path id="trail" class="s-gain" d="M980 470H1100" fill="none" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
<g id="snail">
<rect class="ink" x="1100" y="440" width="220" height="30" rx="15"/>
<path class="s-ink" d="M1296 445l20-50M1306 445l32-44" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="1316" cy="395" r="8"/><circle class="ink" cx="1338" cy="401" r="8"/>
<circle class="s-ink" cx="1190" cy="380" r="70" fill="var(--stage)" stroke-width="8"/>
<path class="s-gain" d="M1180 380a10 10 0 1 1 20 0a24 24 0 1 1-44 0a40 40 0 1 1 78 6" fill="none" stroke-width="7" stroke-linecap="round"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">We want it faster.</text>
<text class="b" x="120" y="176" font-size="32">But real work grows at its own pace.</text>
<g id="sw1">
<rect class="ink" x="282" y="312" width="36" height="22" rx="4"/>
<circle class="s-ink" cx="300" cy="470" r="130" fill="var(--stage)" stroke-width="8"/>
<path id="swh" class="s-loss" d="M300 470V370" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="300" cy="470" r="10"/>
<text class="m" x="300" y="720" font-size="20" text-anchor="middle">FASTER, FASTER</text>
</g>
<g id="pl1">
<path id="stem" class="s-gain" d="M800 610V600" stroke-width="8" stroke-linecap="round"/>
<path id="lf1" class="gain" d="M800 560q-70-10-80-60q60 0 80 60z"/>
<path id="lf2" class="gain" d="M800 490q70-10 80-60q-60 0-80 60z"/>
<path class="ink" d="M720 610h160l-22 90h-116z"/>
<text class="m" x="800" y="740" font-size="20" text-anchor="middle">ITS OWN PACE</text>
</g>
<g id="tp1">
<g id="tp0"></g>
<path class="s-loss" d="M1290 560L1356 540" stroke-width="12" stroke-linecap="round"/>
<rect x="1360" y="380" width="22" height="280" fill="var(--line)"/>
<path id="zz" class="s-loss" d="M1205 400l15-25 15 25 15-25 15 25 15-25 15 25" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="1260" y="740" font-size="20" text-anchor="middle">ANXIOUS, NOT QUICKER</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Helsinki Bus Station theory.</text>
<text class="b" x="120" y="176" font-size="32">A theory from photographer Arno Rafael Minkkinen.</text>
<g id="ph2"><g id="ph0"></g>
<rect class="gain" x="250" y="320" width="64" height="44" rx="6"/><circle cx="282" cy="342" r="12" fill="var(--stage)"/>
<text class="m" x="340" y="350" font-size="22">PHOTOGRAPHER</text></g>
<g id="st2">
<path class="ink" d="M130 480L260 420L390 480z"/>
<rect class="s-ink" x="140" y="480" width="240" height="220" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="260" y="600" font-size="22" text-anchor="middle">HELSINKI</text>
<text class="m" x="260" y="740" font-size="20" text-anchor="middle">CENTRAL STATION</text>
</g>
<g id="lines2"></g>
<g id="rd2"><g id="stops2"></g><g id="buses2"></g>
<text class="m" x="600" y="700" font-size="22">SAME ROAD · SAME STOPS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Getting off too soon.</text>
<text class="b" x="120" y="176" font-size="32">Each stop is like a year of an artist’s career.</text>
<text class="m" x="165" y="360" font-size="18" text-anchor="middle">STATION</text>
<rect class="s-ink" x="120" y="380" width="90" height="80" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M210 420H1460" stroke-width="10" stroke-linecap="round"/>
<g id="yrs3"></g>
<g id="art3"><g id="art0"></g>
<rect class="s-ink" x="790" y="300" width="60" height="50" fill="var(--stage)" stroke-width="5"/><circle class="s-muted" cx="820" cy="325" r="12" fill="none" stroke-width="4"/>
<rect class="s-loss" x="560" y="210" width="420" height="50" rx="25" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="770" y="243" font-size="20" text-anchor="middle">LOOKS LIKE SOMEONE ELSE’S</text></g>
<path id="ret" class="s-loss" d="M772 506Q480 760 165 474" fill="none" stroke-width="6" stroke-linecap="round"/>
<circle id="rdot" class="loss" r="13"/>
<g id="rlb"><text class="m" x="476" y="710" font-size="20" text-anchor="middle" style="fill:var(--loss)">BACK TO THE STATION</text></g>
<g id="lp3"><g id="lpr"><path class="s-ink" d="M1250 560a80 80 0 1 1-76 55" fill="none" stroke-width="8" stroke-linecap="round"/><path class="ink" d="M1250 538l26 22-26 22z"/></g>
<text class="m" x="1250" y="780" font-size="20" text-anchor="middle">AGAIN AND AGAIN</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="88" letter-spacing="-2">“Stay on the bus.”</text>
<text class="b" x="120" y="186" font-size="32">Minkkinen’s advice, in four words.</text>
<g id="br4"></g>
<path class="s-line" d="M120 560H700" stroke-width="12" stroke-linecap="round"/>
<circle class="ink" cx="260" cy="560" r="12"/><circle class="ink" cx="420" cy="560" r="12"/><circle class="ink" cx="580" cy="560" r="12"/>
<g id="flag4"><path class="s-ink" d="M1400 330V240" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1400 240l60 22-60 22z"/>
<text class="m" x="1370" y="300" font-size="20" text-anchor="end" style="fill:var(--gain)">SOMEWHERE NEW</text></g>
<g id="bus4"><rect class="gain" x="-38" y="-20" width="76" height="40" rx="8"/><rect x="-26" y="-12" width="16" height="12" fill="var(--stage)"/><rect x="-4" y="-12" width="16" height="12" fill="var(--stage)"/></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Originality lies beyond copying.</text>
<text class="b" x="120" y="176" font-size="32">It sits on the far side of unoriginality.</text>
<g id="cards5"></g>
<g id="cpa"><path class="s-muted" d="M160 510H1430M1410 495l20 15-20 15" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="140" y="550" font-size="20">UNORIGINAL</text><text class="m" x="1460" y="550" font-size="20" text-anchor="end" style="fill:var(--gain)">ORIGINAL</text></g>
<g id="lr5"><g id="lr0"></g>
<rect class="s-ink" x="290" y="610" width="120" height="140" fill="var(--stage)" stroke-width="5"/><circle class="s-muted" cx="350" cy="670" r="30" fill="none" stroke-width="5"/>
<path class="s-ink" d="M262 700L300 676" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="140" y="810" font-size="20">HOW ANYONE LEARNS A CRAFT</text></g>
<g id="mr5"><path class="s-gain" d="M700 700l20 22 34-44" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d5" x="780" y="700" font-size="40">Sounding ordinary at first</text>
<text class="d5" x="780" y="760" font-size="40">is not a sign you are failing.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small, regular sessions win.</text>
<text class="b" x="120" y="176" font-size="32">Psychologist Robert Boice studied academics struggling to write.</text>
<g id="rs6"><g id="rs0"></g><rect class="s-ink" x="230" y="360" width="50" height="64" rx="4" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M240 380h30M240 396h30M240 412h20" stroke-width="4"/>
<text class="m" x="210" y="470" font-size="20" text-anchor="middle">ROBERT BOICE</text></g>
<g id="cal6"><g id="cells6"></g><text class="m" x="360" y="450" font-size="20">SHORT, REGULAR SESSIONS</text></g>
<g id="bn6"><path class="s-ink" d="M980 410H1460" stroke-width="5" stroke-linecap="round"/><rect id="spike" class="loss" x="1058" y="410" width="22" height="0"/>
<g id="dots6"></g>
<text class="m" x="980" y="450" font-size="20">WAITING FOR HUGE BURSTS</text>
<g id="stall"><text class="d5" x="1460" y="360" font-size="34" text-anchor="end" style="fill:var(--loss)">Stalled.</text></g></g>
<g id="stp6"><polygon id="oct" class="loss"/><text class="d" x="250" y="704" font-size="40" text-anchor="middle" style="fill:var(--stage)">STOP</text>
<text class="d5" x="420" y="670" font-size="42">Stop when your time is up,</text>
<text class="d5" x="420" y="730" font-size="42">so you return <tspan style="fill:var(--gain)">eager</tspan> tomorrow.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Look slowly.</text>
<text class="b" x="120" y="176" font-size="32">Jennifer Roberts: one painting, three hours.</text>
<g id="pt7"><rect class="s-ink" x="160" y="240" width="600" height="480" fill="var(--stage)" stroke-width="10"/>
<circle class="s-ink" cx="620" cy="330" r="40" fill="none" stroke-width="6"/>
<path d="M170 600Q330 470 480 590T750 560V710H170z" fill="var(--line)"/><g id="dets7"></g></g>
<g id="ck7"><circle class="s-ink" cx="1120" cy="440" r="150" fill="var(--stage)" stroke-width="8"/><g id="ticks7"></g>
<path id="hh" class="s-ink" d="M1120 440V360" stroke-width="10" stroke-linecap="round"/>
<path id="mh" class="s-loss" d="M1120 440V320" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="1120" cy="440" r="10"/>
<text class="m" x="1120" y="650" font-size="20" text-anchor="middle">THREE HOURS, ONE PAINTING</text>
<text class="d5" x="1120" y="720" font-size="40" text-anchor="middle" style="fill:var(--loss)">Almost unbearable…</text></g>
<g id="hd7"><text class="d5" x="1120" y="790" font-size="40" text-anchor="middle" style="fill:var(--gain)">Then details appear.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Which project have you</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">been tempted to abandon</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">at an <tspan style="fill:var(--gain)">early stop</tspan>?</text></g>
<g id="qd"><text class="m" x="143" y="690" font-size="26">THIS WEEK: A SHORT DAILY SESSION · STAY ON THE BUS</text></g>
<path class="s-line" d="M143 800H1460" stroke-width="8" stroke-linecap="round"/>
<g id="stops8"></g>
<rect id="bus8" class="gain" x="143" y="760" width="80" height="36" rx="8"/>
