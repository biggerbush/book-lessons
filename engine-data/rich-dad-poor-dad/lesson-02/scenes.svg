<g id="s0">
<text class="m" x="120" y="150" font-size="28">RICH DAD POOR DAD · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Buy assets,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not liabilities.</text>
<text class="b" x="120" y="600" font-size="32">Why your biggest purchase might be quietly emptying your wallet.</text>
<circle id="cin" class="gain" cx="1300" cy="180" r="22" opacity="0"/>
<circle id="cout" class="loss" cx="1300" cy="420" r="22" opacity="0"/>
<g id="wal"><rect class="s-ink" x="1220" y="300" width="240" height="150" rx="22" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1380 350h80v50h-80z" fill="none" stroke-width="6"/><circle class="ink" cx="1410" cy="375" r="8"/></g>
<g id="lblio"><text class="m" x="1340" y="230" font-size="20" style="fill:var(--gain)">MONEY IN</text><text class="m" x="1340" y="560" font-size="20" style="fill:var(--loss)">MONEY OUT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Asset or liability?</text>
<text class="b" x="120" y="176" font-size="32">Rich dad’s definition, simple enough for a child.</text>
<g id="dad"><text class="m" x="240" y="600" font-size="20" text-anchor="middle">RICH DAD</text><text class="m" x="380" y="600" font-size="20" text-anchor="middle">ROBERT</text></g>
<g id="cardIn">
<rect class="s-line" x="480" y="230" width="460" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle id="coinA" class="gain" cx="710" cy="290" r="26"/>
<path class="s-ink" d="M590 380h240v110q0 70-120 90q-120-20-120-90z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-muted" d="M610 400h200" stroke-width="3" stroke-dasharray="8 8"/>
<path class="s-gain" d="M880 260v100m-18-18 18 18 18-18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="510" y="640" font-size="56" style="fill:var(--gain)">Asset</text>
<text class="m" x="510" y="676" font-size="20">PUTS MONEY IN YOUR POCKET</text>
</g>
<g id="cardOut">
<rect class="s-line" x="1020" y="230" width="460" height="470" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle id="coinB" class="loss" cx="1250" cy="440" r="26"/>
<path class="s-ink" d="M1130 380h240v110q0 70-120 90q-120-20-120-90z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-muted" d="M1150 400h200" stroke-width="3" stroke-dasharray="8 8"/>
<path class="s-loss" d="M1420 360v-100m-18 18 18-18 18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="1050" y="640" font-size="56" style="fill:var(--loss)">Liability</text>
<text class="m" x="1050" y="676" font-size="20">TAKES MONEY OUT OF YOUR POCKET</text>
</g>
<g id="nojar"><text class="d" x="120" y="800" font-size="44">No jargon. No fancy formulas.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Draw where the cash goes.</text>
<text class="b" x="120" y="176" font-size="32">Rich dad preferred pictures to words.</text>
