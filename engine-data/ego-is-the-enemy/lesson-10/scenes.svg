<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 10</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Keep your own</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">scorecard.</text>
<text class="b" x="120" y="600" font-size="32">Measure yourself by your standards, not the crowd’s applause.</text>
<g id="sb">
<rect class="s-ink" x="1080" y="230" width="380" height="250" rx="18" fill="var(--stage)" stroke-width="7"/>
<text class="m" x="1270" y="276" font-size="20" text-anchor="middle">WHO KEEPS SCORE?</text>
<path class="s-line" d="M1270 296v160" stroke-width="4"/>
<text id="lyou" class="m" x="1175" y="322" font-size="22" text-anchor="middle">YOU</text>
<text class="m" x="1365" y="322" font-size="22" text-anchor="middle">CROWD</text>
<rect id="byou" x="1120" y="340" width="110" height="110" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<rect id="bcrowd" x="1310" y="340" width="110" height="110" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/>
<path id="ck0" d="M1148 398l20 20 36-44" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text id="qcrowd" class="d" x="1365" y="420" font-size="72" text-anchor="middle">?</text>
</g>
<g id="fan0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ego comes in seasons.</text>
<text class="b" x="120" y="176" font-size="32">Aspiring, succeeding, failing, and around again.</text>
<g id="whl"><circle class="s-line" cx="520" cy="500" r="200" fill="none" stroke-width="6"/></g>
<circle id="ring" cx="520" cy="500" r="200" fill="none" stroke="var(--gain)" stroke-width="8" stroke-dasharray="1257" transform="rotate(-90 520 500)"/>
<g id="nodes"></g>
<path id="runner" class="gain" d="M-14 -16L16 0L-14 16z"/>
<g id="clm">
<path class="s-ink" d="M900 760L1040 440L1120 580L1260 360L1340 520L1460 300" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="1180" y="820" font-size="22" text-anchor="middle">NEVER JUST ONCE</text>
</g>
<circle id="clb" class="gain" r="20"/>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The outside score.</text>
<text class="b" x="120" y="176" font-size="32">We measure ourselves by what others can see.</text>
<g id="chips2"></g>
<g id="arw2"><path class="s-muted" d="M700 320H850m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="crowd2"></g>
<g id="meter">
<rect class="s-line" x="880" y="260" width="140" height="380" rx="12" fill="none" stroke-width="5"/>
<rect id="bar2" class="ink" x="896" y="452" width="108" height="180" rx="6"/>
<text class="m" x="950" y="684" font-size="20" text-anchor="middle">OUTSIDE SCORE</text>
</g>
<g id="luck"><text class="m" x="120" y="800" font-size="22">IT DEPENDS ON LUCK, TIMING AND OTHER PEOPLE</text></g>
<g id="ego2"><circle id="bal" class="loss" cx="1320" cy="450" r="75"/><text class="d" x="1320" y="464" font-size="40" text-anchor="middle" style="fill:var(--stage)">EGO</text><text id="egot" class="m" x="1320" y="640" font-size="22" text-anchor="middle">SWELLS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Winning is not enough.</text>
<text class="b" x="120" y="176" font-size="32">Coach Bill Belichick, New England Patriots.</text>
<g id="board3">
<rect class="s-ink" x="120" y="240" width="520" height="200" rx="16" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="160" y="290" font-size="22">RESULT ON THE BOARD</text>
<text id="win3" class="d" x="160" y="400" font-size="96" style="fill:var(--gain)">WIN</text>
</g>
<line id="st3" class="s-loss" x1="150" y1="366" x2="150" y2="366" stroke-width="10" stroke-linecap="round"/>
<g id="coach3"><rect class="s-ink" x="360" y="580" width="64" height="84" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M374 604h36M374 624h36M374 644h22" stroke-width="5" stroke-linecap="round"/></g>
