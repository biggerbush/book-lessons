<path class="s-ink" d="M440 330v16M440 514v16M340 430h16M524 430h16" stroke-width="6" stroke-linecap="round"/>
<g id="needle"><path class="gain" d="M440 345l16 85h-32z"/><path class="ink" d="M440 515l16-85h-32z"/></g>
<text class="m" x="440" y="620" font-size="22" text-anchor="middle">CURIOUS · OPEN · EAGER TO EXPLORE</text>
</g>
<g id="def">
<text class="m" x="880" y="284" font-size="22" style="fill:var(--loss)">DEFEND MODE</text>
<path class="loss" d="M1160 320l110 40v70c0 70-50 110-110 130c-60-20-110-60-110-130v-70z"/>
<text class="m" x="1160" y="620" font-size="22" text-anchor="middle">WATCHING FOR THREATS · PULLING BACK</text>
</g>
