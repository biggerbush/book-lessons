<path class="s-ink" d="M780 470V720M780 640h120V720M1340 470V720M1340 640h-120V720" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="ink" cx="850" cy="470" r="38"/>
