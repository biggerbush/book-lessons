<text class="d" x="1160" y="300" font-size="40" text-anchor="middle" style="fill:var(--gain)">“How can I afford it?”</text>
<circle class="s-ink" cx="1160" cy="470" r="110" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1010 690v-30a150 70 0 0 1 300 0v30" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="gear"></g><g id="rays"></g></g>
<g id="onL"><text class="m" x="1160" y="740" font-size="22" text-anchor="middle" style="fill:var(--gain)">BRAIN AT WORK, HUNTING ANSWERS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Pay yourself first.</text>
<text class="b" x="120" y="176" font-size="32">Rich dad flipped the usual order.</text>
<g id="r1"><text class="m" x="120" y="250" font-size="22">MOST PEOPLE</text>
<rect class="s-ink" x="120" y="270" width="200" height="100" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d5" x="220" y="333" font-size="36" text-anchor="middle">Pay</text>
