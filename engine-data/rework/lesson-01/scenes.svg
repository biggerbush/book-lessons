<g id="s0">
<text class="m" x="120" y="150" font-size="28">REWORK · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Ignore the so-called</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">real world.</text>
<text class="b" x="120" y="600" font-size="32">Why ‘that won’t work in the real world’ is usually an excuse.</text>
<g id="hk">
<path class="s-ink" d="M1190 230h280v120h-110l-30 40l-10-40h-130z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="1330" y="300" font-size="26" text-anchor="middle" style="fill:var(--ink)">WON’T WORK</text>
</g>
<line id="hks" class="s-gain" x1="1240" y1="291" x2="1240" y2="291" stroke-width="7" stroke-linecap="round"/>
<g id="t0p"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sharing an idea over coffee.</text>
<text class="b" x="120" y="176" font-size="32">A fresh idea meets the voice of ‘experience’.</text>
<g id="cof">
<rect class="ink" x="340" y="620" width="920" height="14" rx="7"/>
<path class="s-ink" d="M420 634v126M1180 634v126" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="610" y="580" width="50" height="40" rx="6"/><path class="s-ink" d="M660 590h10a10 10 0 0 1 0 20h-10" fill="none" stroke-width="5"/>
<rect class="ink" x="930" y="580" width="50" height="40" rx="6"/><path class="s-ink" d="M930 590h-10a10 10 0 0 0 0 20h10" fill="none" stroke-width="5"/>
<g id="you1"></g>
</g>
<g id="bulb">
<circle id="bulbC" class="gain" cx="480" cy="310" r="44"/>
<rect class="ink" x="464" y="356" width="32" height="20" rx="4"/>
<path id="rays" class="s-gain" d="M480 256v-16M426 310h-16M534 310h16M442 272l-11-11M518 272l11-11" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="skp"><g id="skf"></g></g>
<g id="vrd">
<rect class="s-ink" x="700" y="236" width="640" height="130" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1080 366l20 44 10-44" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="730" y="292" font-size="32">“Nice dream, but that’s not</text>
<text class="d5" x="730" y="340" font-size="32">how things really work.”</text>
</g>
<g id="shv"><text class="m" x="120" y="830" font-size="22">YOU NOD ALONG, AND THE IDEA GOES ON THE SHELF</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The old rulebook.</text>
<text class="b" x="120" y="176" font-size="32">What the so-called real world says you must do.</text>
<g id="bk">
<rect class="s-ink" x="160" y="240" width="380" height="520" rx="10" fill="var(--stage)" stroke-width="8"/>
<rect class="ink" x="160" y="240" width="44" height="520"/>
<rect class="s-ink" x="250" y="330" width="250" height="110" fill="none" stroke-width="4"/>
<text class="m" x="375" y="378" font-size="22" text-anchor="middle">RULES OF THE</text>
<text class="m" x="375" y="412" font-size="22" text-anchor="middle">REAL WORLD</text>
<path class="s-line" d="M250 520h240M250 570h200M250 620h220M250 670h160" stroke-width="6" stroke-linecap="round"/>
<g id="dust"></g>
</g>
<g id="r1">
<circle class="s-loss" cx="740" cy="330" r="40" fill="none" stroke-width="6"/>
<text class="d" x="740" y="346" font-size="44" text-anchor="middle" style="fill:var(--loss)">$</text>
<text class="d5" x="820" y="326" font-size="40">Raise investor money</text>
<text class="m" x="822" y="370" font-size="22">BEFORE YOU BEGIN</text>
</g>
<g id="r2"><g id="r2p"></g>
<text class="d5" x="820" y="496" font-size="40">Hire a big team</text>
<text class="m" x="822" y="540" font-size="22">AND RENT A FANCY OFFICE</text>
</g>
<g id="r3">
<text class="d" x="680" y="680" font-size="56" style="fill:var(--loss)">Break them: doomed.</text>
<text class="m" x="682" y="732" font-size="24">SAYS THE REAL WORLD</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">An excuse, not a place.</text>
<text class="b" x="120" y="176" font-size="32">Fried and Heinemeier Hansson push back hard.</text>
<g id="qcd">
<rect class="s-line" x="120" y="240" width="740" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="160" y="340" font-size="56">“The real world</text>
<text class="d" x="160" y="410" font-size="56">isn’t a place,</text>
<text class="d" x="160" y="480" font-size="56">it’s <tspan style="fill:var(--gain)">an excuse.</tspan>”</text>
<text class="m" x="162" y="540" font-size="20">— FRIED &amp; HEINEMEIER HANSSON</text>
</g>
<g id="shd">
<path class="loss" d="M1180 260L1300 300V430C1300 530 1240 590 1180 620C1120 590 1060 530 1060 430V300Z"/>
<text class="m" x="1180" y="430" font-size="24" text-anchor="middle" style="fill:var(--stage)">REAL</text>
<text class="m" x="1180" y="462" font-size="24" text-anchor="middle" style="fill:var(--stage)">WORLD</text>
<g id="shp"></g>
<text class="m" x="1180" y="700" font-size="20" text-anchor="middle">A SHIELD AGAINST TRYING ANYTHING NEW</text>
</g>
<g id="arwo"><g id="arw">
<path class="s-gain" d="M0 0h110m-24-20 24 20-24 20" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="0" y="-26" font-size="18">NEW IDEA</text>
</g></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">It’s not about you.</text>
<text class="b" x="120" y="176" font-size="32">A warning often reveals the speaker’s own fears and habits.</text>
<g id="spk"></g>
<g id="cl">
<circle cx="300" cy="330" r="50" fill="var(--line)"/><circle cx="370" cy="300" r="60" fill="var(--line)"/>
<circle cx="450" cy="330" r="50" fill="var(--line)"/><circle cx="375" cy="362" r="50" fill="var(--line)"/>
<circle cx="365" cy="440" r="12" fill="var(--line)"/><circle cx="358" cy="476" r="8" fill="var(--line)"/>
<text class="m" x="375" y="345" font-size="22" text-anchor="middle" style="fill:var(--ink)">FEAR · HABIT</text>
</g>
<g id="lim">
<rect class="s-loss" x="180" y="220" width="380" height="520" rx="20" fill="none" stroke-width="5" stroke-dasharray="14 10"/>
<text class="m" x="180" y="780" font-size="22" style="fill:var(--loss)">THE LIMITS THEY ACCEPTED</text>
</g>
<g id="dr">
<rect id="lit" class="gain" x="1004" y="304" width="232" height="412" opacity="0"/>
<rect class="s-ink" x="1000" y="300" width="240" height="420" fill="none" stroke-width="8"/>
<polygon id="leaf" class="loss" points="1000,300 1240,300 1240,720 1000,720"/>
<path class="s-line" d="M820 720h560" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="wk"></g>
<g id="pes"><text class="d" x="120" y="850" font-size="40">Their pessimism isn’t a fact about you.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The authors’ proof.</text>
<text class="b" x="120" y="176" font-size="32">Their own company, 37signals, is a living counterexample.</text>
<g id="pf"></g>
<g id="cust"><text class="m" x="120" y="686" font-size="24">CUSTOMERS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Build on your own terms.</text>
<text class="b" x="120" y="176" font-size="32">Not “does it fit the rulebook?” but “what’s a saner, simpler version?”</text>
<g id="pg">
<rect class="s-ink" x="200" y="240" width="460" height="520" rx="8" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="240" y="300" font-size="20">DOES IT FIT THE RULEBOOK?</text>
</g>
<line id="q1s" class="s-ink" x1="236" y1="293" x2="236" y2="293" stroke-width="4" stroke-linecap="round"/>
<g id="q2"><text class="m" x="240" y="344" font-size="20" style="fill:var(--gain)">WHAT’S A SANER VERSION?</text></g>
<g id="sk"></g>
<g id="pen" opacity="0"><path class="gain" d="M0 0l6-22 56-56 16 16-56 56z"/><path class="ink" d="M0 0l6-22 16 16z"/></g>
