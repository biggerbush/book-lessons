<g id="w4"></g>
<g id="cap4"><text class="m" x="120" y="800" font-size="22">THEIR THOUGHTS STAY IN THEIR HEADS. YOU KEEP WALKING.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Approval is not fuel.</text>
<text class="b" x="120" y="176" font-size="32">The goalposts keep moving.</text>
