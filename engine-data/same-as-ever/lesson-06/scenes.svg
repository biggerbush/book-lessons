<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAME AS EVER · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Overnight tragedies,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">long-term miracles.</text>
<text class="b" x="120" y="600" font-size="32">Why setbacks shout and progress whispers, and how to notice both</text>
