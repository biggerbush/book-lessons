<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE COMING WAVE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The nation-state</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">under pressure.</text>
<text class="b" x="120" y="600" font-size="32">How new technology strains the deal between citizens and states.</text>
<g id="tsw">
<g id="tshield"><path class="s-ink" d="M1310 220L1450 270V380C1450 460 1390 510 1310 540C1230 510 1170 460 1170 380V270Z" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/>
<circle class="gain" cx="1310" cy="330" r="34"/><path class="gain" d="M1250 450v-24a60 60 0 0 1 120 0v24z"/></g>
<path id="tcrack" class="s-loss" d="M1300 224L1330 300L1290 360L1340 430L1308 536" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
</g>
<path id="twave" class="s-loss" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1280" y="770" font-size="20" text-anchor="middle">THE COMING WAVE</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The grand bargain.</text>
<text class="b" x="120" y="176" font-size="32">We hand the state power. It promises order in return.</text>
<g id="cits"><text class="m" x="340" y="630" font-size="22" text-anchor="middle">CITIZENS</text></g>
<g id="stbld"><path class="ink" d="M1090 380L1260 300L1430 380Z"/><g id="cols"></g><rect class="ink" x="1080" y="570" width="360" height="24"/>
<text class="m" x="1260" y="630" font-size="22" text-anchor="middle">STATE</text></g>
<g id="badge"><circle class="s-ink" cx="800" cy="270" r="34" fill="var(--stage)" stroke-width="6"/><path class="gain" d="M800 248l6 14 15 1-11 10 4 15-14-8-14 8 4-15-11-10 15-1z"/></g>
<g id="arrows">
<g id="give"><path id="ar1" class="s-ink" d="M540 380H1050m-22-22 22 22-22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="350" font-size="22" text-anchor="middle">LAWS · TAXES · MONOPOLY ON FORCE</text></g>
<g id="get"><path id="ar2" class="s-ink" d="M1060 520H550m22-22-22 22 22 22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="800" y="570" font-size="22" text-anchor="middle">ORDER · SECURITY · SERVICES</text></g>
</g>
<g id="houses"></g>
<g id="strain"><text class="d" x="120" y="790" font-size="44">The coming wave puts this bargain under strain.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Power gets cheap.</text>
<text class="b" x="120" y="176" font-size="32">Abilities once held only by governments reach ordinary laptops.</text>
<g id="chart"><path class="s-line" d="M160 270V500H620" fill="none" stroke-width="4"/><text class="m" x="180" y="262" font-size="20">COST OF POWER</text>
<path id="cost" class="s-ink" d="M180 290C320 300 400 460 600 480" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></g>
