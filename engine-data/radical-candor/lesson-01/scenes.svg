<g id="s0">
<text class="m" x="120" y="150" font-size="28">RADICAL CANDOR · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The feedback that</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">changed her career.</text>
<text class="b" x="120" y="600" font-size="32">Why the kindest feedback Kim Scott ever got felt blunt.</text>
<g id="burst"></g>
<g id="tb"><rect class="s-ink" x="1130" y="240" width="300" height="170" rx="30" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1250 408L1268 458L1300 408" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="gain" transform="translate(1280 330) scale(.45)" d="M0 100C-140 10-140-100-60-100C-25-100-5-75 0-55C5-75 25-100 60-100C140-100 140 10 0 100Z"/></g>
<g id="tk"></g>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A big presentation.</text>
<text class="b" x="120" y="176" font-size="32">Early at Google: an update to the founders and chief executive.</text>
<g id="room">
<rect class="s-ink" x="160" y="250" width="520" height="320" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="410" y="570" width="20" height="44"/><rect class="ink" x="350" y="610" width="140" height="12" rx="6"/>
<text class="m" x="190" y="292" font-size="20">GROWING FAST</text>
<g id="bars"></g>
<g id="ldr"></g>
<rect class="ink" x="920" y="560" width="520" height="26" rx="6"/>
<text class="m" x="1180" y="630" font-size="20" text-anchor="middle">FOUNDERS · CEO</text>
</g>
<g id="kim1"><g id="k1s"></g></g>
<g id="drops"><path class="loss" d="M708 360c-8 12-12 18-12 24a12 12 0 0 0 24 0c0-6-4-12-12-24z"/><path class="loss" d="M812 348c-8 12-12 18-12 24a12 12 0 0 0 24 0c0-6-4-12-12-24z"/><text class="m" x="760" y="600" font-size="20" text-anchor="middle" style="fill:var(--loss)">NERVE-RACKING</text></g>
<g id="well"><text class="d" x="120" y="780" font-size="46">The meeting went really well.</text></g>
<g id="great"><text class="m" x="120" y="836" font-size="22" style="fill:var(--gain)">SHE WALKED OUT FEELING GREAT</text></g>
</g>
<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The walk back.</text>
<text class="b" x="120" y="176" font-size="32">Her boss, Sheryl Sandberg, walked with her.</text>
<path class="s-line" d="M120 720H1480" stroke-width="4" stroke-linecap="round"/>
<g id="duo"><g id="wk"></g></g>
<g id="pr"><rect class="s-gain" x="900" y="250" width="560" height="150" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M900 330L830 420L920 390" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<rect class="gain" x="930" y="318" width="20" height="52" rx="4"/><rect class="gain" x="954" y="314" width="48" height="56" rx="12"/><rect class="gain" x="958" y="276" width="18" height="46" rx="9"/>
<text class="d5" x="1030" y="330" font-size="40">What went well</text>
<path class="s-gain" d="M1034 362l10 10 20-22M1074 362l10 10 20-22M1114 362l10 10 20-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1170" y="377" font-size="20">SPECIFIC PRAISE</text></g>
<g id="umb"><rect class="s-loss" x="900" y="450" width="560" height="130" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-loss" d="M902 495L805 505L902 530" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="935" y="528" font-size="40">“…you said um a lot.”</text></g>
<g id="cas"><text class="m" x="900" y="620" font-size="20">ALMOST CASUALLY</text></g>
</g>
<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Brushed off.</text>
<text class="b" x="120" y="176" font-size="32">Scott waved away the awkward news, twice.</text>
<g id="k3"></g>
<g id="arms"><path class="s-gain" d="M440 560L380 520L372 470M560 560L620 520L628 470" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="um3"><rect class="s-loss" x="270" y="268" width="150" height="84" rx="26" fill="var(--stage)" stroke-width="5"/><path class="s-loss" d="M392 348L452 388L372 350" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect x="376" y="342" width="22" height="8" fill="var(--stage)"/><text class="d" x="345" y="324" font-size="40" text-anchor="middle" style="fill:var(--loss)">um</text></g>
<g id="small"><text class="m" x="160" y="690" font-size="20">“A MINOR VERBAL HABIT”</text><text class="m" x="160" y="722" font-size="20">TOO SMALL TO MATTER</text></g>
<g id="cc"><rect class="s-ink" x="880" y="300" width="560" height="240" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="920" y="340" width="40" height="70" rx="20"/><path class="s-ink" d="M905 395a35 35 0 0 0 70 0M940 430v30M920 462h40" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="d" x="1010" y="400" font-size="48">Speech coach</text><text class="m" x="1012" y="450" font-size="22">PAID FOR BY GOOGLE</text></g>
<g id="dodge"><text class="d" x="120" y="800" font-size="44">The way most of us dodge awkward news.</text></g>
</g>
<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Getting direct.</text>
<text class="b" x="120" y="176" font-size="32">So Sandberg changed tactics and got blunt.</text>
<g id="face"><circle class="ink" cx="300" cy="470" r="110"/><circle cx="262" cy="455" r="10" fill="var(--stage)"/><circle cx="338" cy="455" r="10" fill="var(--stage)"/>
<path d="M238 420l44 10M362 420l-44 10M265 520h70" stroke="var(--stage)" stroke-width="8" stroke-linecap="round"/>
<path class="ink" d="M170 760v-40a130 130 0 0 1 260 0v40z"/><text class="m" x="300" y="810" font-size="20" text-anchor="middle">SHERYL SANDBERG</text></g>
<g id="q1"><text class="d5" x="480" y="300" font-size="32">“You’re one of the smartest people I know…”</text></g>
<g id="bulb"><g id="rays"></g><circle id="bglass" class="gain" cx="900" cy="470" r="90"/><rect class="ink" x="862" y="560" width="76" height="50" rx="8"/></g>
<g id="ums4"></g>
<g id="q2"><text class="d5" x="480" y="720" font-size="32">“…but all those ums make you sound far less smart.”</text></g>
<g id="bolt"><polygon class="gain" points="1340,330 1250,490 1320,490 1270,640 1420,450 1345,450 1400,330"/></g>
<g id="land"><text class="d" x="480" y="820" font-size="46">This time, the message landed.</text></g>
</g>
<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it worked.</text>
<text class="b" x="120" y="176" font-size="32">The bluntness came wrapped in respect, not contempt.</text>
<g id="hrt"><path id="hp5" class="gain" transform="translate(320 450)" d="M0 100C-140 10-140-100-60-100C-25-100-5-75 0-55C5-75 25-100 60-100C140-100 140 10 0 100Z"/></g>
<g id="hl"><text class="m" x="320" y="620" font-size="22" text-anchor="middle">CARES ABOUT HER</text><text class="m" x="320" y="652" font-size="22" text-anchor="middle">AS A PERSON</text></g>
<g id="gift"><text class="d" x="562" y="495" font-size="80" text-anchor="middle" style="fill:var(--muted)">+</text>
<rect class="s-ink" x="700" y="420" width="280" height="200" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="820" y="420" width="40" height="200"/><rect class="gain" x="700" y="490" width="280" height="30"/>
<g id="lid"><rect class="s-ink" x="680" y="370" width="320" height="50" rx="8" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="820" y="370" width="40" height="50"/><ellipse class="s-gain" cx="812" cy="350" rx="28" ry="16" fill="none" stroke-width="7"/><ellipse class="s-gain" cx="868" cy="350" rx="28" ry="16" fill="none" stroke-width="7"/></g>
<text class="m" x="840" y="670" font-size="22" text-anchor="middle">RESPECT, NOT CONTEMPT</text></g>
<g id="hints"><text class="m" x="1100" y="360" font-size="20">GENTLE HINTS</text><rect class="ink" x="1430" y="380" width="20" height="220" rx="4"/><g id="hd"></g><text class="m" x="1100" y="650" font-size="20">TOO SOFT TO GET THROUGH</text></g>
<g id="soft"><text class="d" x="120" y="790" font-size="44">The gentle hints were too soft to land.</text></g>
</g>
<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fixing the habit.</text>
<text class="b" x="120" y="176" font-size="32">Scott finally went to the speech coach.</text>
<g id="f0"><rect class="s-line" x="120" y="230" width="414" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><g id="f0p"></g><rect class="s-ink" x="290" y="500" width="40" height="54" rx="4" fill="var(--stage)" stroke-width="4"/><text class="m" x="327" y="650" font-size="20" text-anchor="middle">SPEECH COACH</text></g>
<g id="f1"><path class="s-muted" d="M544 465h38m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-line" x="593" y="230" width="414" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><ellipse class="s-ink" cx="900" cy="470" rx="60" ry="120" fill="var(--stage)" stroke-width="7"/><g id="f1p"></g><text class="m" x="800" y="650" font-size="20" text-anchor="middle">BREAKING THE HABIT</text></g>
<g id="f2"><path class="s-muted" d="M1017 465h38m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-line" x="1066" y="230" width="414" height="470" rx="18" fill="var(--stage)" stroke-width="3"/><polygon class="gain" points="1273,250 1170,560 1376,560" fill-opacity=".25"/><rect class="ink" x="1110" y="560" width="326" height="36" rx="6"/><g id="f2p"></g><text class="m" x="1273" y="650" font-size="20" text-anchor="middle">EVERY TALK AHEAD</text></g>
<g id="pay"><text class="d" x="120" y="790" font-size="46">A small fix with a big payoff.</text></g>
</g>
<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The real lesson.</text>
<text class="b" x="120" y="176" font-size="32">Staying quiet to spare someone’s feelings is not kindness.</text>
<g id="scl"><path class="s-ink" d="M800 440V620M720 640h160" stroke-width="8" stroke-linecap="round"/><line id="beam" class="s-ink" x1="450" y1="440" x2="1150" y2="440" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="800" cy="440" r="14"/></g>
<g id="panL"><g id="plc"><path class="s-ink" d="M0 0V130M-110 130a110 40 0 0 0 220 0z" fill="var(--stage)" stroke-width="5"/><rect class="s-muted" x="-60" y="78" width="120" height="50" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d" x="0" y="112" font-size="30" text-anchor="middle" style="fill:var(--muted)">…</text><text class="m" x="0" y="210" font-size="22" text-anchor="middle">STAYING QUIET</text><text class="m" x="0" y="242" font-size="22" text-anchor="middle" style="fill:var(--loss)">≠ KINDNESS</text></g></g>
<g id="panR"><g id="prc"><path class="s-ink" d="M0 0V130M-110 130a110 40 0 0 0 220 0z" fill="var(--stage)" stroke-width="5"/><rect class="gain" x="-70" y="40" width="140" height="90" rx="10"/><text class="m" x="0" y="94" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">TRUTH</text><text class="m" x="0" y="210" font-size="22" text-anchor="middle">SAYING IT CLEARLY</text><text class="m" x="0" y="242" font-size="22" text-anchor="middle" style="fill:var(--gain)">= CARE</text></g></g>
<g id="you"><g id="youf"></g><text class="d" x="210" y="812" font-size="40">Say it plainly, because you want them to succeed.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Who in your life needs</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">to hear something you’ve</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">been too <tspan style="fill:var(--gain)">polite</tspan> to say?</text></g>
<g id="week"><text class="m" x="143" y="700" font-size="26">WHAT WILL YOU TELL THEM THIS WEEK?</text></g>
<g id="qm"><g id="qmi"><rect class="gain" x="1220" y="600" width="220" height="150" rx="30"/><path class="gain" d="M1270 748l-20 52 70-52z"/><text class="d" x="1330" y="712" font-size="100" text-anchor="middle" style="fill:var(--on-gain)">?</text></g></g>
</g>