<g id="s0">
<text class="m" x="120" y="150" font-size="28">MINDSET · LESSON 5</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Leaders who learn</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">versus leaders</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">who prove.</text>
<text class="b" x="120" y="630" font-size="32">Why the best bosses want to learn, not to look smart.</text>
