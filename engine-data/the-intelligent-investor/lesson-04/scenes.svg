<g id="pn1"><circle class="gain" cx="1240" cy="620" r="22"/><text class="d" x="1240" y="629" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">2</text><text class="m" x="840" y="790" font-size="20">2 · OVERLOOKED SECONDARY COMPANIES</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">No halfway house.</text>
<text class="b" x="120" y="176" font-size="32">Drifting between the two paths can leave you worse off.</text>
<g id="road"></g>
<text class="m" x="420" y="250" font-size="22" text-anchor="middle">DEFENSIVE</text>
<text class="m" x="1180" y="250" font-size="22" text-anchor="middle">ENTERPRISING</text>
<g id="pit"><ellipse class="loss" cx="800" cy="420" rx="100" ry="34"/><text class="m" x="800" y="370" font-size="20" text-anchor="middle">WORSE OFF</text></g>
<circle id="dr" class="ink" r="22"/>
<circle id="cm" class="gain" r="24"/>
<g id="sp"><path class="s-ink" d="M1100 620V840" stroke-width="8" stroke-linecap="round"/>
<polygon class="gain" points="1100,630 960,630 935,655 960,680 1100,680"/><text class="m" x="1025" y="662" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">DEFENSIVE</text>
<polygon class="s-ink" points="1100,700 1280,700 1305,725 1280,750 1100,750" fill="var(--stage)" stroke-width="5"/><text class="m" x="1190" y="732" font-size="18" text-anchor="middle">ENTERPRISING</text></g>
<g id="cmT"><text class="d" x="120" y="700" font-size="56">Decide.</text><text class="d" x="120" y="770" font-size="56" style="fill:var(--gain)">Then commit.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">How many hours</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">a week will you give</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">to <tspan style="fill:var(--gain)">investing?</tspan></text></g>
<g id="stw"><rect class="ink" x="1310" y="306" width="40" height="26" rx="6"/><circle class="s-ink" cx="1330" cy="450" r="110" fill="var(--stage)" stroke-width="10"/>
