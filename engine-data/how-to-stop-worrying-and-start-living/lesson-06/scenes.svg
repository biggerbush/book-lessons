<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO STOP WORRYING AND START LIVING · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Count your blessings,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">make lemonade.</text>
<text class="b" x="120" y="600" font-size="32">Choose grateful thoughts, and turn your setbacks into something useful.</text>
<path class="s-line" d="M1160 482h320" stroke-width="5" stroke-linecap="round"/>
<g id="t_lem"></g><g id="t_gl"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your thoughts shape your mood.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie: our biggest problem is choosing the right thoughts.</text>
<circle class="ink" cx="240" cy="560" r="50"/><path class="ink" d="M165 770v-65a75 75 0 0 1 150 0v65z"/>
<g id="th"><circle class="ink" cx="290" cy="485" r="10"/><circle class="ink" cx="318" cy="445" r="15"/><g fill="var(--line)"><circle cx="330" cy="350" r="45"/><circle cx="390" cy="318" r="55"/><circle cx="450" cy="350" r="45"/><circle cx="390" cy="375" r="42"/></g><text class="m" x="390" y="358" font-size="20" text-anchor="middle" style="fill:var(--ink)">THOUGHTS</text></g>
<g id="emq"><text class="d" x="640" y="290" font-size="52">“Our life is what</text><text class="d" x="640" y="352" font-size="52">our thoughts make it.”</text><text class="m" x="644" y="400" font-size="20">MARCUS AURELIUS · ROMAN EMPEROR</text></g>
<g id="lens"><circle cx="840" cy="620" r="110" class="loss" fill-opacity=".15"/><circle cx="1180" cy="620" r="110" class="gain" fill-opacity=".2"/><g id="rain"></g><rect class="gain" x="1150" y="640" width="56" height="56" rx="8"/><path class="s-gain" d="M1206 654h10a12 12 0 0 1 0 24h-10" fill="none" stroke-width="6"/><g fill="none" class="s-ink" stroke-width="7"><circle cx="840" cy="620" r="110"/><circle cx="1180" cy="620" r="110"/><path d="M950 610q60-36 120 0"/></g><text class="m" x="840" y="770" font-size="22" text-anchor="middle" style="fill:var(--loss)">GLOOMY</text><text class="m" x="1180" y="770" font-size="22" text-anchor="middle" style="fill:var(--gain)">COZY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The man with no legs.</text>
<text class="b" x="120" y="176" font-size="32">Harold Abbott’s business had failed, leaving him deep in debt.</text>
<path class="s-line" d="M120 722H1480" stroke-width="6" stroke-linecap="round"/>
<g id="hb"><g id="ab"></g><g id="dc" class="loss"><circle cx="360" cy="400" r="40"/><circle cx="420" cy="385" r="48"/><circle cx="470" cy="410" r="36"/><rect x="330" y="400" width="160" height="46" rx="23"/><text class="m" x="410" y="430" font-size="22" text-anchor="middle" style="fill:var(--stage)">DEBT</text></g><text class="m" x="400" y="770" font-size="20" text-anchor="middle">HAROLD ABBOTT</text></g>
<g id="sun"><circle class="gain" cx="400" cy="400" r="36"/><path class="s-gain" d="M400 350v-20M400 450v20M350 400h-20M450 400h20M364 364l-13-13M436 364l13-13M364 436l-13 13M436 436l13 13" stroke-width="6" stroke-linecap="round"/></g>
<g id="pm"><circle class="ink" cx="860" cy="564" r="30"/><path class="ink" d="M815 690v-39a45 45 0 0 1 90 0v39z"/><path id="grin" d="M848 570q12 12 24 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/><rect x="800" y="690" width="120" height="14" rx="4" fill="var(--stage)" class="s-ink" stroke-width="5"/><circle class="ink" cx="822" cy="712" r="9"/><circle class="ink" cx="898" cy="712" r="9"/><text class="m" x="860" y="770" font-size="20" text-anchor="middle">A MAN WITH NO LEGS</text></g>
<g id="bub"><rect x="690" y="400" width="340" height="84" rx="22" fill="var(--stage)" class="s-gain" stroke-width="5"/><path d="M842 482l14 30 14-30" fill="var(--stage)" class="s-gain" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="860" y="456" font-size="40" text-anchor="middle">Good morning!</text></g>
<g id="lift"><text class="d" x="120" y="840" font-size="44">Abbott saw how much he still had.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Count, don’t complain.</text>
<text class="b" x="120" y="176" font-size="32">Eddie Rickenbacker, adrift on a raft in the Pacific for 21 days.</text>
<g class="s-line" fill="var(--stage)" stroke-width="3"><rect x="120" y="230" width="420" height="490" rx="18"/><rect x="580" y="230" width="420" height="490" rx="18"/><rect x="1040" y="230" width="420" height="490" rx="18"/></g>
<g id="r1"><text class="m" x="150" y="280" font-size="20">ADRIFT IN THE PACIFIC</text><path id="wv" class="s-loss" fill="none" stroke-width="5" stroke-linecap="round"/><g id="rf"><circle class="ink" cx="330" cy="427" r="24"/><path class="ink" d="M294 528v-31a36 36 0 0 1 72 0v31z"/><rect class="ink" x="230" y="528" width="200" height="22" rx="4"/></g><text id="rd" class="d" x="150" y="670" font-size="64">21 days</text></g>
<g id="w2"><text class="m" x="610" y="280" font-size="20">FRESH WATER · FOOD</text><g id="g3"></g><circle class="gain" cx="860" cy="478" r="16"/><circle class="gain" cx="900" cy="470" r="16"/><circle class="gain" cx="940" cy="478" r="16"/><path class="ink" d="M820 490h160q0 70-80 70q-80 0-80-70z"/></g>
<g id="nc"><text class="d" x="610" y="670" font-size="40">Never complain.</text></g>
<g id="e3"><text class="m" x="1070" y="280" font-size="20">SELL BOTH EYES FOR</text><g id="eyes"></g><text class="d" x="1070" y="610" font-size="56" style="fill:var(--gain)">$1 billion?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="64">If you have a lemon, make lemonade.</text>
<text class="b" x="120" y="176" font-size="32">Advice from Julius Rosenwald, head of Sears, Roebuck.</text>
<g id="l4"></g>
<g id="fl"><path class="s-loss" d="M730 360Q520 360 450 410" fill="none" stroke-width="5" stroke-dasharray="10 10"/><g transform="translate(0 -60)"><g id="pf"></g><path d="M386 538q14-12 28 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/><text class="m" x="400" y="720" font-size="20" text-anchor="middle">THE FOOLISH PERSON</text><text class="d5" x="400" y="780" font-size="36" text-anchor="middle">“Fate is against me.”</text></g></g>
<g id="ws"><path class="s-gain" d="M870 360Q1080 360 1150 410" fill="none" stroke-width="5" stroke-dasharray="10 10"/><g transform="translate(0 -60)"><g id="pw"></g><path d="M1188 528q12 12 24 0" fill="none" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/><g id="g4"></g><text class="m" x="1200" y="720" font-size="20" text-anchor="middle">THE WISE PERSON</text><text class="d5" x="1200" y="780" font-size="34" text-anchor="middle">“What can I learn?”</text><text class="d5" x="1200" y="830" font-size="34" text-anchor="middle">“How can I turn it around?”</text></g></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The rattlesnake farm.</text>
<text class="b" x="120" y="176" font-size="32">A Florida farmer’s land was too poor for fruit or pigs.</text>
<g id="fm"><rect class="loss" x="120" y="520" width="640" height="120" rx="16" fill-opacity=".14"/><rect class="ink" x="232" y="400" width="16" height="110"/><circle class="ink" cx="240" cy="370" r="50"/><ellipse class="ink" cx="430" cy="460" rx="70" ry="40"/><circle class="ink" cx="500" cy="452" r="16"/><path class="s-ink" d="M392 495v18M468 495v18" stroke-width="10" stroke-linecap="round"/><text class="m" x="240" y="300" font-size="20" text-anchor="middle">FRUIT</text><text class="m" x="430" y="398" font-size="20" text-anchor="middle">PIGS</text></g>
<path id="fx" class="s-loss" d="M185 320l110 160m0-160l-110 160M365 415l130 90m0-90l-130 90" stroke-width="8" stroke-linecap="round"/>
<g id="sn"></g>
<path id="ar5" class="s-gain" d="M785 380h70m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pr"></g>
<g id="sg"><rect class="ink" x="1182" y="650" width="16" height="170"/><rect class="gain" x="920" y="560" width="540" height="90" rx="10"/><text class="d" x="1190" y="618" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">RATTLESNAKE, FLORIDA</text><text class="m" x="1190" y="540" font-size="20" text-anchor="middle">POST OFFICE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trying still helps.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie: trying helps, even if you fail.</text>
<g id="tg"><circle cx="560" cy="480" r="140" fill="var(--stage)" class="s-ink" stroke-width="7"/><circle cx="560" cy="480" r="96" class="loss" fill-opacity=".2"/><circle cx="560" cy="480" r="52" fill="var(--stage)" class="s-ink" stroke-width="6"/><circle cx="560" cy="480" r="18" class="gain"/><text class="m" x="560" y="680" font-size="22" text-anchor="middle">EVEN IF YOU MISS</text></g>
<g id="aw"><path class="s-ink" d="M-160 0H-6" stroke-width="7" stroke-linecap="round"/><path class="ink" d="M0 0l-26-13v26z"/><path class="s-gain" d="M-160 0l-16-14M-160 0l-16 14M-144 0l-16-14M-144 0l-16 14" stroke-width="5" stroke-linecap="round"/></g>
<g id="cp"><circle cx="1150" cy="480" r="160" fill="var(--stage)" class="s-ink" stroke-width="7"/><path class="s-line" d="M1150 335v24M1150 601v24M1005 480h24M1271 480h24" stroke-width="6" stroke-linecap="round"/><text class="m" x="970" y="488" font-size="22" text-anchor="end" style="fill:var(--loss)">REGRET</text><text class="m" x="1330" y="488" font-size="22" style="fill:var(--gain)">FORWARD</text><g id="nd"><path class="gain" d="M0-16L130 0 0 16z"/><path class="ink" d="M0-16L-100 0 0 16z"/><circle class="ink" r="12"/></g></g>
<g id="fw"><text class="d" x="120" y="800" font-size="40">The search turns your mind forward, away from regret.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tonight, write two lists.</text>
<text class="b" x="120" y="176" font-size="32">Three things going right, and one setback made useful.</text>
<g id="nb"><rect x="120" y="230" width="620" height="520" rx="18" fill="var(--stage)" class="s-ink" stroke-width="6"/><g id="rings"></g><text class="m" x="160" y="310" font-size="22">GOING RIGHT</text><g id="rows"></g></g>
<g id="lc"><rect x="820" y="230" width="660" height="520" rx="18" fill="var(--stage)" class="s-line" stroke-width="4"/><text class="m" x="860" y="310" font-size="22">ONE SETBACK</text><g id="l7"></g><g id="g7"></g><text class="m" x="860" y="690" font-size="22">ONE WAY IT COULD BECOME USEFUL</text></g>
<path id="la" class="s-muted" d="M1100 470h120m-24-24 24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What lemon are you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">holding right now?</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="64" letter-spacing="-1" style="fill:var(--gain)">And your first glass of lemonade?</text></g>
<g id="l8"></g><g id="g8"></g>
<text class="m" x="143" y="700" font-size="26">TURN ONE SETBACK INTO SOMETHING USEFUL</text>
</g>