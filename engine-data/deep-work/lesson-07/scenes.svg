<circle id="dot0" class="gain" cx="1310" cy="200" r="30"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">More than output.</text>
<text class="b" x="120" y="176" font-size="32">Deep work is a productivity tool, and something bigger.</text>
