<text class="d5" x="620" y="650" font-size="38">They open up</text>
<text class="m" x="620" y="700" font-size="20">AND EXPLAIN WHAT</text><text class="m" x="620" y="730" font-size="20">THEY REALLY MEANT</text></g>
