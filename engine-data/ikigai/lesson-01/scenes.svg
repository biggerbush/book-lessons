<text class="m" x="140" y="520" font-size="20">YOUR REASON TO GET UP</text>
<g id="riser"></g>
</g>
<g id="quote">
<rect class="s-line" x="760" y="230" width="720" height="330" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="760" y="230" width="14" height="330"/>
<text class="m" x="810" y="290" font-size="20">THE AUTHORS DESCRIBE IT AS</text>
<text class="d5" x="810" y="390" font-size="48">“The happiness of</text>
<text class="d5" x="810" y="456" font-size="48">always being busy.”</text>
</g>
<g id="faces"></g>
<g id="fl"><text class="m" x="120" y="840" font-size="20">EVERYONE HAS AN IKIGAI · EACH ONE IS PERSONAL</text></g>
</g>

<g id="s3" opacity="0">
