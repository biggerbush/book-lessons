<text class="m" x="1300" y="640" font-size="20" text-anchor="middle">ONE NIGHT IN 1975</text></g>
<g id="apl"><text class="d" x="120" y="800" font-size="44">That machine became the <tspan style="fill:var(--gain)">first Apple computer</tspan>.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Solitude plus sharing.</text>
<text class="b" x="120" y="176" font-size="32">Wozniak’s blunt advice to aspiring inventors.</text>
