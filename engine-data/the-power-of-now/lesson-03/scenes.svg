<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Clock time versus</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">psychological time.</text>
<text class="b" x="120" y="600" font-size="32">Plan with the clock, but live in this moment.</text>
<g id="tc0"><text class="m" x="1220" y="470" font-size="22" text-anchor="middle" style="fill:var(--gain)">CLOCK TIME</text></g>
<g id="tc1"><text class="m" x="1340" y="770" font-size="22" text-anchor="middle" style="fill:var(--loss)">IN YOUR HEAD</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Clock time.</text>
<text class="b" x="120" y="176" font-size="32">The first kind: practical time for real-world plans.</text>
<g id="wc"><text class="m" x="300" y="690" font-size="22" text-anchor="middle">CLOCK TIME</text></g>
<g id="cal"><rect class="s-ink" x="560" y="330" width="340" height="300" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="560" y="330" width="340" height="60" rx="14"/><g id="cells"></g><text class="m" x="730" y="690" font-size="22" text-anchor="middle">DENTIST · TRAIN</text></g>
<g id="map"><rect class="s-line" x="1000" y="330" width="440" height="300" rx="14" fill="var(--stage)" stroke-width="4"/><path id="route" d="M1050 580C1150 580 1120 420 1220 440S1330 560 1390 390" fill="none" stroke="var(--gain)" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1050" cy="580" r="12"/><circle class="gain" cx="1390" cy="380" r="18"/><text class="m" x="1220" y="690" font-size="22" text-anchor="middle">PLANS · SKILLS · PROMISES</text></g>
<g id="ok"><text class="d" x="120" y="810" font-size="50">Tolle has no problem with clock time.</text><path class="s-gain" d="M1220 785l25 25 50-55" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Psychological time.</text>
<text class="b" x="120" y="176" font-size="32">The second kind lives only in your head.</text>
<circle class="ink" cx="800" cy="640" r="56"/><path class="ink" d="M720 830v-50a80 80 0 0 1 160 0v50z"/>
<g id="cloud"><g id="cpuff"></g><g id="pclk"></g></g>
<g id="pl"><text class="m" x="800" y="258" font-size="22" text-anchor="middle" style="fill:var(--loss)">PSYCHOLOGICAL TIME</text></g>
<g id="rw"><path class="loss" d="M310 380l-70 40 70 40zM390 380l-70 40 70 40z"/><path class="s-loss" d="M640 420H410" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="318" y="520" font-size="22" text-anchor="middle">REPLAYING THE PAST</text><g id="frames"></g></g>
<g id="ff"><path class="loss" d="M1220 380l70 40-70 40zM1300 380l70 40-70 40z"/><path class="s-loss" d="M960 420H1200" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="1295" y="520" font-size="22" text-anchor="middle">REHEARSING THE FUTURE</text><g id="fq"></g></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Same mistake, two burdens.</text>
<text class="b" x="120" y="176" font-size="32">A mistake you once made.</text>
<g id="vs">
<g id="vl"><path class="loss" d="M750 240H795L785 270L803 300L790 350H764Q750 350 750 336Z"/></g>
<g id="vr"><path class="loss" d="M795 240H840V336Q840 350 826 350H790L803 300L785 270Z"/><path class="s-loss" d="M840 262C884 262 884 328 840 328" fill="none" stroke-width="12" stroke-linecap="round"/></g>
<text class="m" x="912" y="290" font-size="22" style="fill:var(--loss)">THE MISTAKE</text>
<text class="m" x="912" y="320" font-size="20">A CRACKED MUG</text>
</g>
<g id="va"><path class="s-muted" d="M770 362Q600 372 440 398M830 362Q1000 372 1160 398" fill="none" stroke-width="4" stroke-dasharray="8 8"/></g>
<g id="nb"><rect class="s-line" x="120" y="400" width="620" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="450" font-size="22" style="fill:var(--gain)">CLOCK TIME · NOTICE THE LESSON</text><rect class="s-ink" x="330" y="480" width="200" height="170" rx="10" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M360 530h140M360 570h140M360 610h80" stroke-width="6" stroke-linecap="round"/><path class="s-gain" d="M560 560l30 30 60-70" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="150" y="715" font-size="34">Do better next time.</text></g>
<g id="sk"><rect class="s-line" x="860" y="400" width="620" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="890" y="450" font-size="22" style="fill:var(--loss)">PSYCHOLOGICAL TIME · CARRY IT</text><circle class="ink" cx="1040" cy="540" r="30"/><path class="ink" d="M990 660v-35a50 50 0 0 1 100 0v35z"/><path class="s-ink" d="M1060 590L1150 540" stroke-width="6" stroke-linecap="round"/><circle id="sack" class="loss" cx="1170" cy="560" r="40"/><text class="d5" x="890" y="715" font-size="34">Blame and guilt, for years.</text></g>
<g id="same"><text class="d" x="120" y="815" font-size="44">Same event, two very different burdens.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chasing a goal.</text>
<text class="b" x="120" y="176" font-size="32">Clock time takes the step. Psychological time waits to arrive.</text>
<g id="hall"><rect class="loss" x="120" y="470" width="820" height="240" fill-opacity=".12"/><text class="m" x="140" y="505" font-size="22" style="fill:var(--loss)">THE PRESENT</text></g>
<path class="s-line" d="M120 720H1480" stroke-width="4"/>
<g id="mt"><polygon class="s-ink" points="980,720 1240,330 1480,720" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M1240 330V250" stroke-width="6"/><path class="gain" d="M1240 250l60 20-60 20z"/><text class="m" x="1240" y="225" font-size="22" text-anchor="middle">THE GOAL</text></g>
<ellipse id="halo" class="s-loss" cx="1260" cy="290" rx="100" ry="50" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<g id="mq"><text class="d5" x="120" y="330" font-size="38" style="fill:var(--loss)">“I’ll be happy once I get there.”</text></g>
<g id="fp"></g>
<g id="wk"><g id="wki"><circle class="gain" cx="0" cy="610" r="22"/><path class="gain" d="M-34 712v-28a34 34 0 0 1 68 0v28z"/><text class="m" x="0" y="575" font-size="20" text-anchor="middle" style="fill:var(--gain)">NEXT STEP</text></g></g>
<g id="hw"><text class="d" x="120" y="820" font-size="44">The present becomes just a hallway.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Feelings are clues.</text>
<text class="b" x="120" y="176" font-size="32">Notice which way your attention is being pulled.</text>
<g id="ph"><rect class="s-ink" x="330" y="250" width="160" height="120" fill="var(--stage)" stroke-width="5" transform="rotate(6 410 310)"/><rect class="s-ink" x="320" y="262" width="160" height="120" fill="var(--stage)" stroke-width="5" transform="rotate(-8 400 322)"/><circle class="ink" cx="400" cy="305" r="16"/><path class="ink" d="M374 355a26 26 0 0 1 52 0z"/>
<text class="m" x="400" y="450" font-size="24" text-anchor="middle">REGRET</text><text class="m" x="400" y="490" font-size="24" text-anchor="middle">RESENTMENT</text><text class="m" x="400" y="530" font-size="24" text-anchor="middle">BITTERNESS</text><text class="d5" x="400" y="590" font-size="32" text-anchor="middle" style="fill:var(--loss)">Too much past</text></g>
<g id="st"><g id="rain"></g><g id="spuff"></g><path class="s-loss" d="M1212 355l-16 28h18l-12 28" fill="none" stroke-width="6" stroke-linejoin="round"/></g>
<g id="sw"><text class="m" x="1210" y="450" font-size="24" text-anchor="middle">WORRY</text><text class="m" x="1210" y="490" font-size="24" text-anchor="middle">TENSION</text><text class="m" x="1210" y="530" font-size="24" text-anchor="middle">ANXIETY</text><text class="d5" x="1210" y="590" font-size="32" text-anchor="middle" style="fill:var(--loss)">Too much future</text></g>
<g id="sc"><path class="s-loss" d="M700 630H440m24-18-24 18 24 18M900 630H1160m-24-18 24 18-24 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polygon class="ink" points="800,700 755,780 845,780"/><g id="beam"><path class="s-ink" d="M380 680H1220" stroke-width="8" stroke-linecap="round"/><circle class="loss" cx="380" cy="680" r="22"/><circle class="loss" cx="1220" cy="680" r="22"/></g><circle class="gain" cx="800" cy="680" r="54"/><text class="m" x="800" y="690" font-size="28" text-anchor="middle" style="fill:var(--on-gain)">NOW</text></g>
<g id="life"><text class="d" x="120" y="845" font-size="40">Life only happens in this moment.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Use the tool, then put it down.</text>
<text class="b" x="120" y="176" font-size="32">Don’t throw away your clocks or your plans.</text>
<g id="tb">
<rect class="ink" x="160" y="700" width="480" height="16" rx="4"/>
<path class="s-ink" d="M195 716V770M605 716V770" stroke-width="10" stroke-linecap="round"/>
<g id="tool"></g>
<g id="arm"><path id="armP" class="s-ink" d="M400 220V260" stroke-width="26" stroke-linecap="round"/><circle id="fist" class="ink" cx="400" cy="260" r="28"/></g>
<g id="pk"><text class="m" x="500" y="340" font-size="22" style="fill:var(--gain)">PICK IT UP</text></g>
<g id="pd"><text class="m" x="500" y="640" font-size="22">PUT IT DOWN</text></g>
</g>
<g id="tl"><text class="d5" x="120" y="810" font-size="40">Treat clock time like a tool.</text></g>
<g id="dr"><rect class="gain" x="1040" y="300" width="280" height="440"/><text class="d" x="1222" y="540" font-size="64" text-anchor="middle" style="fill:var(--on-gain)">NOW</text>
<polygon id="door" class="s-ink" points="1040,300 1320,300 1320,740 1040,740" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<circle id="knob" class="ink" cx="1292" cy="520" r="11"/>
<rect class="s-ink" x="1040" y="300" width="280" height="440" fill="none" stroke-width="8"/>
<path class="s-ink" d="M1000 744H1360" stroke-width="6" stroke-linecap="round"/></g>
<g id="ar"><path class="s-gain" d="M640 520C760 460 880 460 1000 520" fill="none" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="1180" y="790" font-size="22" text-anchor="middle" style="fill:var(--gain)">BACK TO THIS MOMENT</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask one quiet question.</text>
<text class="b" x="120" y="176" font-size="32">Whenever you notice your mind drifting.</text>
<g id="sn"><g transform="rotate(-3 330 400)"><rect class="gain" x="130" y="250" width="400" height="300" rx="6"/>
<text class="d5" x="160" y="320" font-size="32" style="fill:var(--on-gain)">Is this thought</text><text class="d5" x="160" y="365" font-size="32" style="fill:var(--on-gain)">helping me plan,</text><text class="d5" x="160" y="410" font-size="32" style="fill:var(--on-gain)">or just replaying</text><text class="d5" x="160" y="455" font-size="32" style="fill:var(--on-gain)">and worrying?</text></g></g>
<g id="qm"><text class="d" x="600" y="480" font-size="220" style="fill:var(--loss)">?</text></g>
<g id="fk"><path class="s-muted" d="M760 420L900 330M760 420L900 520" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="ya"><rect class="gain" x="900" y="270" width="580" height="120" rx="60"/><text class="d" x="1190" y="343" font-size="40" text-anchor="middle" style="fill:var(--on-gain)">Practical? Act on it.</text></g>
<g id="na"><rect class="s-loss" x="900" y="460" width="580" height="120" rx="60" fill="var(--stage)" stroke-width="5"/><text class="d" x="1190" y="533" font-size="40" text-anchor="middle">Not? Let it go.</text></g>
<g id="br"><circle id="brc" cx="1000" cy="730" r="55" fill="var(--gain)" fill-opacity=".35" stroke="var(--gain)" stroke-width="5"/><text class="m" x="1100" y="738" font-size="26">FEEL YOUR BREATH</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Catch one worry today.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Which kind of time</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">does it <tspan style="fill:var(--gain)">belong to?</tspan></text></g>
<g id="ms"><text class="m" x="143" y="700" font-size="26">ONE PRACTICAL STEP, THEN RETURN TO NOW</text></g>
<g id="endclk"></g>
</g>