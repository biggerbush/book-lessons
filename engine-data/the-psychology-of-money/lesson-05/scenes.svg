<text class="d" x="120" y="830" font-size="44">with <tspan style="fill:var(--loss)">things</tspan> instead of money.”</text>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The man in the car paradox.</text>
<text class="b" x="120" y="176" font-size="32">Nobody on the street is really admiring the driver.</text>
<g id="pcarw"><g id="pcar"></g><circle class="ink" cx="1056" cy="589" r="10"/><path id="arm" class="s-ink" d="M1072 593L1088 585" stroke-width="6" stroke-linecap="round"/></g>
