<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 1</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Why controlling</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">others exhausts you.</text>
<text class="b" x="120" y="560" font-size="32">Two small words that stop you carrying other people’s choices.</text>
<g id="t_str"></g><g id="t_me"></g><g id="t_oth"></g>
<g id="t_pill"><rect class="gain" x="1200" y="170" width="270" height="72" rx="36"/><text class="d" x="1335" y="220" font-size="38" text-anchor="middle" style="fill:var(--on-gain)">Let them.</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The prom night.</text>
<text class="b" x="120" y="176" font-size="32">Mel Robbins tells a story about her son’s high school prom.</text>
<g id="p_mel"><text class="m" x="260" y="710" font-size="22" text-anchor="middle">MEL</text></g>
<g id="p_marks"><path class="s-loss" d="M220 415l-16-22M260 405v-28M300 415l16-22" fill="none" stroke-width="7" stroke-linecap="round"/></g>
<g id="p_ph"><circle class="loss" cx="365" cy="370" r="8"/><rect class="s-loss" x="420" y="220" width="230" height="120" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="480" y="250" width="110" height="66" rx="8"/><circle cx="535" cy="283" r="18" fill="var(--stage)"/><text class="m" x="535" y="380" font-size="22" text-anchor="middle">PHOTOS: HER WAY</text></g>
<g id="p_dn"><rect class="s-loss" x="690" y="220" width="230" height="120" rx="18" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="805" cy="280" r="34" fill="none" stroke-width="6"/><circle class="s-line" cx="805" cy="280" r="18" fill="none" stroke-width="4"/><path class="s-ink" d="M745 250v60M865 250v60" stroke-width="6" stroke-linecap="round"/><text class="m" x="805" y="380" font-size="22" text-anchor="middle">DINNER: HER WAY</text></g>
<g id="p_teen"><text class="m" x="770" y="710" font-size="22" text-anchor="middle">HIS FRIENDS</text></g>
<g id="p_dau"><text class="m" x="1300" y="710" font-size="22" text-anchor="middle">HER DAUGHTER</text></g>
<g id="p_say"><rect class="gain" x="1140" y="230" width="320" height="110" rx="30"/><path class="gain" d="M1280 338l20 40 20-40z"/><text class="d" x="1300" y="302" font-size="52" text-anchor="middle" style="fill:var(--on-gain)">Let them.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two small words.</text>
<text class="b" x="120" y="176" font-size="32">A simple remark, and it stopped her.</text>
<g id="w_bub"><rect class="gain" x="120" y="240" width="520" height="180" rx="36"/><path class="gain" d="M200 418v60l70-60z"/><text class="d" x="170" y="360" font-size="84" style="fill:var(--on-gain)">Let them.</text></g>
<g id="w_r0"><circle class="gain" cx="136" cy="572" r="12"/><text class="d5" x="166" y="584" font-size="40">Teenagers. Their night.</text></g>
<g id="w_r1"><circle class="gain" cx="136" cy="652" r="12"/><text class="d5" x="166" y="664" font-size="40">Her son didn’t need managing.</text></g>
<path class="s-line" d="M1000 744h300" stroke-width="4"/>
<g id="w_cl"><circle class="gain" cx="1110" cy="280" r="40" fill-opacity=".35"/><circle class="gain" cx="1160" cy="258" r="50" fill-opacity=".35"/><circle class="gain" cx="1212" cy="284" r="38" fill-opacity=".35"/></g>
<g id="w_mel"></g>
<g id="w_wt"><rect class="loss" x="1040" y="330" width="220" height="110" rx="14"/><text class="m" x="1150" y="394" font-size="26" text-anchor="middle" style="fill:var(--stage)">STRESS</text><path class="s-loss" d="M1110 460v36m-10-12 10 12 10-12M1190 460v36m-10-12 10 12 10-12" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="w_lt"><text class="m" x="1150" y="800" font-size="24" text-anchor="middle" style="fill:var(--gain)">THE STRESS LIFTED</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">We do it everywhere.</text>
<text class="b" x="120" y="176" font-size="32">Robbins realised it wasn’t just prom.</text>
<g id="c_0"><rect class="s-line" x="120" y="230" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-ink" cx="330" cy="420" r="110" fill="none" stroke-width="8"/>
<line id="c_hh" class="s-ink" x1="330" y1="420" stroke-width="8" stroke-linecap="round"/><line id="c_hm" class="s-loss" x1="330" y1="420" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="330" cy="420" r="9"/>
<text class="m" x="330" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">WE FUME</text><text class="d5" x="330" y="690" font-size="32" text-anchor="middle">A friend runs late.</text></g>
<g id="c_1"><rect class="s-line" x="590" y="230" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="720" y="280" width="160" height="270" rx="22" fill="none" stroke-width="6"/><g id="c_ph"></g><g id="c_out"></g>
<text class="m" x="800" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">LEFT OUT AND HURT</text><text class="d5" x="800" y="690" font-size="32" text-anchor="middle">Plans made without us.</text></g>
<g id="c_2"><rect class="s-line" x="1060" y="230" width="420" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="c_you"></g><path id="c_ar" class="s-ink" d="M1235 470h60m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1270" y="610" font-size="20" text-anchor="middle" style="fill:var(--loss)">WE KEEP PUSHING</text><text class="d5" x="1270" y="690" font-size="32" text-anchor="middle">They won’t change.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Steering what you never held.</text>
<text class="b" x="120" y="176" font-size="32">Other people’s choices belong to them.</text>
<g id="d_me"><text class="m" x="220" y="630" font-size="22" text-anchor="middle">YOU</text></g>
<polyline id="d_rope" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<g id="d_oth"></g>
<g id="d_lab"><text class="m" x="900" y="630" font-size="22" text-anchor="middle" style="fill:var(--gain)">THEIR CHOICE</text></g>
<g id="d_c0"><rect class="s-line" x="120" y="680" width="420" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><path class="s-loss" d="M152 705l20 20M172 705l-20 20" stroke-width="5" stroke-linecap="round"/><text class="m" x="192" y="723" font-size="22">MAKE THEM BE ON TIME</text></g>
<g id="d_c1"><rect class="s-line" x="560" y="680" width="420" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><path class="s-loss" d="M592 705l20 20M612 705l-20 20" stroke-width="5" stroke-linecap="round"/><text class="m" x="632" y="723" font-size="22">MAKE THEM INVITE YOU</text></g>
<g id="d_c2"><rect class="s-line" x="1000" y="680" width="420" height="70" rx="35" fill="var(--stage)" stroke-width="4"/><path class="s-loss" d="M1032 705l20 20M1052 705l-20 20" stroke-width="5" stroke-linecap="round"/><text class="m" x="1072" y="723" font-size="22">MAKE THEM CARE</text></g>
<g id="d_bat"><rect class="ink" x="1290" y="256" width="60" height="24" rx="4"/><rect id="d_bf" x="1244" width="152" rx="8"/><rect class="s-ink" x="1230" y="280" width="180" height="300" rx="16" fill="none" stroke-width="7"/><text class="m" x="1320" y="630" font-size="22" text-anchor="middle">YOUR ENERGY</text></g>
<g id="d_end"><text class="d" x="120" y="830" font-size="44">Effort burned. Nothing changed.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">What “let them” means.</text>
<text class="b" x="120" y="176" font-size="32">Adults are free to act as they choose.</text>
<g id="e_h"><g id="e_fig"></g>
<line id="e_al" class="s-ink" x1="362" y1="512" x2="385" y2="560" stroke-width="16" stroke-linecap="round"/>
<line id="e_ar" class="s-ink" x1="438" y1="512" x2="415" y2="560" stroke-width="16" stroke-linecap="round"/>
<circle id="e_hl" class="ink" cx="385" cy="560" r="14"/><circle id="e_hr" class="ink" cx="415" cy="560" r="14"/>
<text class="m" x="400" y="596" font-size="20" text-anchor="middle">YOU</text></g>
<g id="e_c"></g>
<g id="e_n0"><rect class="s-line" x="120" y="620" width="320" height="80" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="280" y="668" font-size="22" text-anchor="middle">NOT GIVING UP</text></g>
<g id="e_n1"><rect class="s-line" x="470" y="620" width="320" height="80" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="630" y="668" font-size="22" text-anchor="middle">NOT APPROVING</text></g>
<path class="s-line" d="M1000 700h460" stroke-width="4"/>
<g id="e_me"></g>
<g id="e_wt"><rect class="loss" x="1050" y="360" width="200" height="90" rx="14"/><text class="m" x="1150" y="413" font-size="22" text-anchor="middle" style="fill:var(--stage)">NOT YOURS</text></g>
<g id="e_end"><text class="d" x="120" y="810" font-size="44">Drop a weight that was never yours to carry.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Where your energy goes.</text>
<text class="b" x="120" y="176" font-size="32">Picture the energy you spend on what others do.</text>
<rect id="f_lv" class="gain" x="206" width="208" rx="16" fill-opacity=".7"/>
<path class="s-ink" d="M230 300h160v30q40 20 40 70v220q0 30-30 30H220q-30 0-30-30V400q0-50 40-70z" fill="none" stroke-width="7" stroke-linejoin="round"/>
<text class="m" x="310" y="700" font-size="22" text-anchor="middle">YOU</text>
<g id="f_o"><text class="m" x="1010" y="700" font-size="22" text-anchor="middle">OTHER PEOPLE</text></g>
<g id="f_d"></g>
<g id="f_face"><circle class="s-ink" cx="1340" cy="450" r="100" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1295 430q15 12 30 0M1355 430q15 12 30 0" fill="none" stroke-width="6" stroke-linecap="round"/><path class="s-gain" d="M1300 490q40 35 80 0" fill="none" stroke-width="7" stroke-linecap="round"/><text class="m" x="1340" y="600" font-size="22" text-anchor="middle" style="fill:var(--gain)">LIGHTER · CALMER</text></g>
<g id="f_end"><text class="d" x="120" y="800" font-size="44">The more she let go, the more peace she felt.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Catch the urge. Say two words. Feel the shift.</text>
<g id="g_0"><rect class="s-line" x="120" y="240" width="440" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="290" font-size="22">1 · NOTICE THE URGE</text>
<rect class="s-ink" x="210" y="330" width="260" height="290" rx="12" fill="var(--stage)" stroke-width="6"/><g id="g_nb"></g>
<rect class="s-ink" x="240" y="376" width="30" height="30" fill="none" stroke-width="4"/><text class="m" x="290" y="400" font-size="24">FIX</text>
<rect class="s-ink" x="240" y="451" width="30" height="30" fill="none" stroke-width="4"/><text class="m" x="290" y="475" font-size="24">CHASE</text>
<rect class="s-ink" x="240" y="526" width="30" height="30" fill="none" stroke-width="4"/><text class="m" x="290" y="550" font-size="24">CONVINCE</text>
<path id="g_k0" class="s-loss" d="M244 390l9 9 15-18" fill="none" stroke-width="5" stroke-linecap="round"/><path id="g_k1" class="s-loss" d="M244 465l9 9 15-18" fill="none" stroke-width="5" stroke-linecap="round"/><path id="g_k2" class="s-loss" d="M244 540l9 9 15-18" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="g_1"><rect class="s-line" x="580" y="240" width="440" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="610" y="290" font-size="22">2 · SAY IT QUIETLY</text><g id="g_p1"></g></g>
<g id="g_b"><circle class="gain" cx="792" cy="424" r="8"/><rect class="gain" x="810" y="340" width="180" height="76" rx="38"/><text class="d5" x="900" y="390" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">let them.</text></g>
<g id="g_2"><rect class="s-line" x="1040" y="240" width="440" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1070" y="290" font-size="22">3 · FEEL THE TENSION</text><g id="g_p2"></g>
<polyline id="g_z" class="s-loss" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1335" y="560" font-size="20" text-anchor="middle">TENSION</text></g>
<g id="g_end"><text class="d" x="120" y="780" font-size="52">That is the whole first step.</text><rect class="gain" x="124" y="806" width="160" height="10"/></g>
</g>

<g id="s8" opacity="0">
<g id="q_g"><circle class="gain" cx="1360" cy="250" r="80"/><text class="d" x="1360" y="290" font-size="110" text-anchor="middle" style="fill:var(--on-gain)">?</text></g>
<g id="q_a"><text class="d" x="136" y="330" font-size="88" letter-spacing="-2">Who are you trying</text></g>
<g id="q_b"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">to control right now?</text></g>
<g id="q_c"><text class="d" x="136" y="580" font-size="88" letter-spacing="-2">What would change if</text></g>
<g id="q_d"><text class="d" x="136" y="680" font-size="88" letter-spacing="-2">you just <tspan style="fill:var(--gain)">let them</tspan>?</text></g>
<text class="m" x="143" y="790" font-size="26">NOTICE · SAY IT · LET GO</text>
</g>