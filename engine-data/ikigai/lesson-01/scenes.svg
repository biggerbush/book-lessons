<text class="d" x="360" y="690" font-size="72" style="fill:var(--gain)">100+</text>
</g>
<g id="elder"></g>
<g id="tg0"><text class="d5" x="940" y="380" font-size="36">Cheerful</text></g>
<g id="tg1"><text class="d5" x="940" y="440" font-size="36">Busy</text></g>
<g id="tg2"><text class="d5" x="940" y="500" font-size="36">Engaged</text></g>
<g id="auth"></g>
<g id="ans"><text class="d" x="120" y="810" font-size="50">Their answer: one Japanese word.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The word is ikigai.</text>
<text class="b" x="120" y="176" font-size="32">Pronounced ee-key-guy: your reason for being.</text>
