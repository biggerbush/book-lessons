<text class="m" x="1110" y="364" font-size="20">SAME COOL RESPONSE</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Her mind filled the silence.</text>
<text class="b" x="120" y="176" font-size="32">With a painful story.</text>
<g id="hd3"></g>
