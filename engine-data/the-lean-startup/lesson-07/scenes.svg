<rect id="tbar" class="loss" x="968" y="378" width="464" height="40" rx="6"/>
<text class="d5" x="960" y="520" font-size="36">Don’t perfect one step.</text>
<text class="d" x="960" y="580" font-size="36" style="fill:var(--gain)">Shrink the whole circle.</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A big mailing.</text>
<text class="b" x="120" y="176" font-size="32">Ries’s example: stuffing newsletters into envelopes.</text>
