<g id="walker"></g>
<g id="cap2"><text class="d" x="120" y="840" font-size="40">Good opportunities walk right past you.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Analyze, don’t criticize.</text>
<text class="b" x="120" y="176" font-size="32">Rich dad’s answer to cynicism.</text>
<g id="deal"><rect class="s-ink" x="600" y="230" width="400" height="450" rx="10" fill="var(--stage)" stroke-width="6"/><text class="m" x="630" y="280" font-size="22">THE DEAL</text><g id="rows"></g></g>
<g id="opp"><rect class="gain" x="615" y="440" width="370" height="60" rx="10"/><text class="m" x="636" y="478" font-size="22" style="fill:var(--on-gain)">OPPORTUNITY</text></g>
<g id="mag" transform="translate(940 330)"><circle class="s-ink" r="46" fill="var(--stage)" fill-opacity=".3" stroke-width="10"/><path class="s-ink" d="M33 -33l34 -34" stroke-width="14" stroke-linecap="round"/></g>
<g id="crit"><g id="critP"></g><rect x="170" y="260" width="220" height="64" rx="16" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="280" y="300" font-size="22" text-anchor="middle" style="fill:var(--loss)">RUMOURS</text><text class="m" x="280" y="640" font-size="22" text-anchor="middle">CRITIC</text></g>
<g id="anl"><g id="anlP"></g><text class="m" x="1320" y="640" font-size="22" text-anchor="middle">ANALYST</text></g>
<g id="fin"><text class="m" x="280" y="680" font-size="20" text-anchor="middle" style="fill:var(--loss)">SEES ONLY PROBLEMS</text><text class="m" x="1320" y="680" font-size="20" text-anchor="middle" style="fill:var(--gain)">SPOTS THE OPPORTUNITY</text></g>
<g id="cap3"><text class="d" x="120" y="800" font-size="44">Check the numbers, not the rumours.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The busiest can be the laziest.</text>
<text class="b" x="120" y="176" font-size="32">Busy work is a perfect place to hide.</text>
<g id="busy"><g id="busyP"></g><rect class="ink" x="140" y="560" width="260" height="16" rx="4"/><text class="m" x="270" y="620" font-size="22" text-anchor="middle">ALWAYS BUSY</text></g>
<g id="sparkW"><g id="spark"></g></g>
<g id="calW"><rect class="ink" x="520" y="240" width="520" height="50"/><text class="m" x="540" y="273" font-size="22" style="fill:var(--stage)">EVERY HOUR</text><g id="cal"></g></g>
<g id="avoid">
<rect id="bx0" x="1120" y="280" width="340" height="100" rx="14" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="10 8"/><text class="d5" x="1150" y="345" font-size="40">Money</text>
<rect id="bx1" x="1120" y="420" width="340" height="100" rx="14" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="10 8"/><text class="d5" x="1150" y="485" font-size="40">Health</text>
<text class="m" x="1120" y="560" font-size="20">NEVER FACED</text></g>
<g id="cap4"><text class="d" x="120" y="780" font-size="44">The cure: a little healthy greed.</text><text class="m" x="120" y="830" font-size="22" style="fill:var(--gain)">ASK YOURSELF: WHAT IS IN IT FOR ME?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask a better question.</text>
<text class="b" x="120" y="176" font-size="32">Rich dad banned the phrase “I can’t afford it.”</text>
<g id="pl"><rect class="s-line" x="120" y="220" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d5" x="440" y="300" font-size="40" text-anchor="middle">“I can’t afford it.”</text>
<circle class="s-ink" cx="440" cy="470" r="110" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M290 690v-30a150 70 0 0 1 300 0v30" fill="none" stroke-width="7" stroke-linecap="round"/>
<rect x="380" y="444" width="120" height="52" rx="26" fill="none" stroke="var(--muted)" stroke-width="5"/><circle cx="406" cy="470" r="16" fill="var(--muted)"/><text class="m" x="440" y="540" font-size="20" text-anchor="middle">OFF</text></g>
