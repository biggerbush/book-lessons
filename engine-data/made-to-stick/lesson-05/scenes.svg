<g id="s0">
<text class="m" x="120" y="150" font-size="28">MADE TO STICK · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Credible: let people</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">test it.</text>
<text class="b" x="120" y="600" font-size="32">Make your idea prove itself, so people believe it for themselves.</text>
<circle id="ring" class="s-line" cx="1320" cy="390" r="130" fill="none" stroke-width="6" stroke-dasharray="14 12"/>
<g id="qm"><path class="s-gain" d="M1272 344a48 48 0 1 1 68 44c-14 8-20 18-20 34v12" fill="none" stroke-width="18" stroke-linecap="round"/><circle class="gain" cx="1320" cy="470" r="12"/></g>
<path id="ck0" class="s-gain" d="M1252 392l46 46 82-92" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Borrowed trust.</text>
<text class="b" x="120" y="176" font-size="32">Where does our belief usually come from?</text>
<g id="ex"><circle class="gain" cx="440" cy="470" r="32"/><path d="M426 470l10 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="340" y="640" font-size="20" text-anchor="middle">EXPERTS · CELEBRITIES · SEALS</text></g>
<g id="ch"><g id="yu"></g><path class="s-muted" d="M800 400v130h80M800 530v80M880 530v80" fill="none" stroke-width="7" stroke-dasharray="12 10" stroke-linecap="round"/><text class="m" x="790" y="640" font-size="20" text-anchor="middle">NO EXPERT BESIDE YOU</text></g>
<g id="gl"><g id="rays"></g><circle class="gain" cx="1260" cy="420" r="80"/><rect class="ink" x="1228" y="505" width="64" height="40" rx="8"/><path d="M1222 420l26 26 50-56" fill="none" stroke="var(--on-gain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1260" y="640" font-size="20" text-anchor="middle">CREDIBILITY INSIDE THE IDEA</text></g>
<g id="g1t"><text class="d" x="120" y="780" font-size="44">An idea can carry its own credibility.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A custody case.</text>
<text class="b" x="120" y="176" font-size="32">Mock jurors heard about a mother and her young son.</text>
<g id="jb"><g id="jur"></g><rect class="s-ink" x="140" y="540" width="460" height="180" rx="10" fill="var(--stage)" stroke-width="7"/><text class="m" x="370" y="640" font-size="22" text-anchor="middle">MOCK JURORS</text></g>
<g id="cA"><rect class="s-line" x="700" y="240" width="360" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="730" y="290" font-size="20">VERSION A</text><path class="s-line" d="M730 340h280M730 390h280M730 440h280M730 490h200" stroke-width="10" stroke-linecap="round"/></g>
<g id="cB"><rect class="s-line" x="1100" y="240" width="380" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1130" y="290" font-size="20">VERSION B</text><path class="s-line" d="M1130 340h300M1130 390h300M1130 440h300M1130 490h220" stroke-width="10" stroke-linecap="round"/></g>
<g id="vd"><path class="s-gain" d="M1130 540h300" stroke-width="10" stroke-linecap="round"/><text class="m" x="1130" y="580" font-size="18" style="fill:var(--gain)">+ SMALL, VIVID DETAILS</text></g>
<g id="tb"><rect class="ink" x="1150" y="640" width="220" height="22" rx="11"/><rect class="ink" x="1340" y="620" width="70" height="24" rx="6"/><path class="s-gain" d="M1346 618v-22M1360 618v-22M1374 618v-22M1388 618v-22M1402 618v-22" stroke-width="6" stroke-linecap="round"/><text class="m" x="1290" y="710" font-size="20" text-anchor="middle">DARTH VADER TOOTHBRUSH</text></g>
<g id="sa"><text class="m" x="1080" y="810" font-size="20" text-anchor="middle">SAME ARGUMENTS IN BOTH</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Details persuade.</text>
<text class="b" x="120" y="176" font-size="32">Even when those details prove nothing.</text>
<g id="sc">
<path class="s-ink" d="M460 330V720M360 730h200" stroke-width="8" stroke-linecap="round" fill="none"/>
<path id="beam" class="s-ink" d="M240 320h440" stroke-width="8" stroke-linecap="round"/>
<circle class="ink" cx="460" cy="320" r="14"/>
<g id="panL"><path class="s-muted" d="M0 0L-60 120M0 0L60 120" stroke-width="3" fill="none"/><path class="ink" d="M-70 120h140l-20 26h-100z"/><rect class="s-line" x="-30" y="88" width="60" height="30" fill="none" stroke-width="4"/><text class="m" x="0" y="184" font-size="20" text-anchor="middle">PLAIN</text></g>
<g id="panR"><path class="s-muted" d="M0 0L-60 120M0 0L60 120" stroke-width="3" fill="none"/><path class="ink" d="M-70 120h140l-20 26h-100z"/><rect class="gain" x="-30" y="70" width="60" height="48" rx="6"/><text class="m" x="0" y="184" font-size="20" text-anchor="middle" style="fill:var(--gain)">VIVID</text></g>
</g>
<g id="lean"><text class="m" x="120" y="810" font-size="20">JURORS LEANED TOWARD THE VIVID SIDE</text></g>
<g id="mg"><path class="s-line" d="M1020 350h160M1020 430h120" stroke-width="8" stroke-linecap="round"/><path class="s-gain" d="M1030 390h140" stroke-width="14" stroke-linecap="round"/><circle class="s-ink" cx="1100" cy="390" r="110" fill="none" stroke-width="10"/><path class="s-ink" d="M1178 468l70 70" stroke-width="22" stroke-linecap="round"/><text class="m" x="900" y="610" font-size="20">A SHARP DETAIL SIGNALS REAL KNOWLEDGE</text></g>
<g id="vg"><text class="d5" x="900" y="700" font-size="40" fill-opacity=".5">Vague feels thin.</text><text class="d" x="900" y="770" font-size="40" style="fill:var(--gain)">Precise feels witnessed.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Numbers need scale.</text>
<text class="b" x="120" y="176" font-size="32">Huge numbers slide right past our feelings.</text>
<g id="cells"></g>
<g id="fly"></g>
<g id="ht"><path id="hp" class="loss" d="M0 72C-90 12-96-54-45-66C-21-72-5-55 0-42C5-55 21-72 45-66C96-54 90 12 0 72Z" transform="translate(790 480)"/><text class="m" x="790" y="610" font-size="20" text-anchor="middle">OUR FEELINGS</text></g>
<g id="ru"><path class="s-muted" d="M900 480h70m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g id="rp"></g><rect class="gain" x="1300" y="290" width="54" height="220" rx="6"/><g id="tk2"></g>
<path class="s-ink" d="M1060 620q40-34 80 0q-40 34-80 0z" fill="none" stroke-width="5"/><circle class="ink" cx="1100" cy="620" r="11"/><text class="m" x="1100" y="680" font-size="20" text-anchor="middle">SEE IT</text>
<path class="ink" d="M1300 606h14l18-16v60l-18-16h-14z"/><path class="s-ink" d="M1346 606q12 14 0 28M1360 596q22 24 0 48" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="1340" y="680" font-size="20" text-anchor="middle">HEAR IT</text></g>
<g id="tr"><text class="d" x="120" y="800" font-size="44">Translate it into something human-sized.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bucket of BBs.</text>
<text class="b" x="120" y="176" font-size="32">Activists made a huge number audible.</text>
<g id="bk"><path class="s-muted" d="M330 360q170-170 340 0" fill="none" stroke-width="5"/><g id="bbs"></g><circle id="bb1" class="gain" cx="500" cy="684" r="10"/><path class="s-ink" d="M320 360L360 700h280L680 360" fill="none" stroke-width="8" stroke-linejoin="round"/><path class="s-ink" d="M300 360h400" stroke-width="10" stroke-linecap="round"/></g>
<path id="wv" class="s-muted" d="M720 520q20 40 0 80M750 500q34 60 0 120M280 520q-20 40 0 80M250 500q-34 60 0 120" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="l1"><circle class="gain" cx="880" cy="386" r="14"/><text class="d" x="910" y="402" font-size="48">One BB</text><text class="m" x="880" y="450" font-size="20">STANDS FOR THE HIROSHIMA BOMB</text></g>
<g id="l2"><circle class="ink" cx="872" cy="572" r="7"/><circle class="ink" cx="888" cy="572" r="7"/><circle class="ink" cx="880" cy="558" r="7"/><text class="d" x="910" y="582" font-size="48">Thousands more</text><text class="m" x="880" y="630" font-size="20">THE WORLD’S NUCLEAR ARSENAL</text></g>
<g id="hr"><text class="d" x="120" y="810" font-size="44">They didn’t just learn the number. They heard it.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let them test it.</text>
<text class="b" x="120" y="176" font-size="32">Ronald Reagan, 1980 debate.</text>
<g id="db"><g id="rg"></g><rect class="ink" x="200" y="520" width="160" height="200" rx="8"/><rect class="s-ink" x="400" y="260" width="260" height="130" rx="16" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M430 300h200M430 330h200M430 360h140" stroke-width="8" stroke-linecap="round"/></g>
<g id="nx"><path class="s-loss" d="M420 272l220 106M640 272l-220 106" stroke-width="8" stroke-linecap="round"/><text class="m" x="400" y="436" font-size="20">SKIPPED THE STATISTICS</text></g>
<g id="qq"><text class="d" x="760" y="300" font-size="44">“Are you better off than you</text><text class="d" x="760" y="360" font-size="44">were four years ago?”</text></g>
<g id="crowd"></g><g id="cks"></g>
<g id="chk"><text class="m" x="760" y="740" font-size="20">THEY CHECKED THEIR OWN LIVES</text></g>
<g id="own"><text class="d" x="120" y="820" font-size="44">Their own discovery, not his claim.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Your toolkit.</text>
<text class="b" x="120" y="176" font-size="32">Before your next pitch, three moves.</text>
<g id="tk"></g>
<g id="ic0"><circle class="s-ink" cx="1330" cy="300" r="36" fill="none" stroke-width="8"/><circle class="gain" cx="1330" cy="300" r="12"/><path class="s-ink" d="M1356 326l30 30" stroke-width="12" stroke-linecap="round"/></g>
<g id="ic1"><rect id="big" class="s-line" x="1250" y="440" width="80" height="80" fill="none" stroke-width="6"/><path class="s-muted" d="M1345 480h40m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round"/><circle class="gain" cx="1420" cy="480" r="12"/></g>
<g id="ic2"><rect class="s-ink" x="1270" y="615" width="130" height="80" rx="6" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1270 615l65 45 65-45" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="gain" cx="1410" cy="620" r="20"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What claim are you making</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">this week that people simply</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2">have to take on <tspan style="fill:var(--loss)">faith</tspan>?</text></g>
<g id="qd"><text class="m" x="143" y="640" font-size="26">HOW COULD YOU LET THEM CHECK IT?</text></g>
<g id="hd"><rect class="s-ink" x="1020" y="590" width="280" height="170" rx="18" fill="var(--stage)" stroke-width="6"/><text class="m" x="1052" y="636" font-size="20">YOUR CLAIM</text><path class="s-line" d="M1052 676h170M1052 716h120" stroke-width="10" stroke-linecap="round"/></g>
<g id="rg2"><circle class="gain" cx="1290" cy="596" r="40"/><path d="M1272 596l12 13 24-27" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>