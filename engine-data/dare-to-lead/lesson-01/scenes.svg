<g id="s0">
<text class="m" x="120" y="150" font-size="28">DARE TO LEAD · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Courage is a skill,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not a trait.</text>
<text class="b" x="120" y="600" font-size="32">Why brave leadership can be learned, practiced and measured.</text>
<path class="s-line" d="M1180 660h300" stroke-width="5" stroke-linecap="round"/>
<g id="cape"><path id="capeP" class="gain"/></g>
<circle class="ink" cx="1320" cy="400" r="40"/>
<path class="ink" d="M1260 560v-50a60 60 0 0 1 120 0v50z"/>
<g id="bell"><g id="bellIn">
<path class="s-ink" d="M1272 490L1236 300M1368 490L1404 300" stroke-width="14" stroke-linecap="round"/>
<path class="s-ink" d="M1200 300h240" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="1196" y="262" width="24" height="76" rx="6"/><rect class="ink" x="1420" y="262" width="24" height="76" rx="6"/>
</g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The big question.</text>
<text class="b" x="120" y="176" font-size="32">Brené Brown asked senior leaders one simple question.</text>
<g id="res">
<circle class="ink" cx="260" cy="420" r="40"/><path class="ink" d="M200 580v-50a60 60 0 0 1 120 0v50z"/>
<rect class="gain" x="292" y="520" width="64" height="80" rx="6"/>
<text class="m" x="260" y="650" font-size="20" text-anchor="middle">COURAGE</text>
<text class="m" x="260" y="680" font-size="20" text-anchor="middle">SHAME</text>
<text class="m" x="260" y="710" font-size="20" text-anchor="middle">VULNERABILITY</text>
</g>
<g id="qcard">
<rect class="s-ink" x="520" y="280" width="520" height="340" rx="18" fill="var(--stage)" stroke-width="6"/>
<text class="d" x="780" y="470" font-size="160" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="m" x="780" y="540" font-size="20" text-anchor="middle">WHAT ABOUT THE WAY PEOPLE LEAD</text>
<text class="m" x="780" y="572" font-size="20" text-anchor="middle">NEEDS TO CHANGE?</text>
</g>
<g id="leaders"><text class="m" x="780" y="790" font-size="20" text-anchor="middle">SENIOR LEADERS</text></g>
<g id="glob">
<circle class="s-ink" cx="1310" cy="450" r="150" fill="var(--stage)" stroke-width="6"/>
<ellipse cx="1310" cy="390" rx="138" ry="22" fill="none" stroke="var(--line)" stroke-width="4"/>
<ellipse cx="1310" cy="510" rx="138" ry="22" fill="none" stroke="var(--line)" stroke-width="4"/>
<path class="s-line" d="M1160 450h300" stroke-width="4"/>
<ellipse id="mer" cx="1310" cy="450" rx="150" ry="150" fill="none" stroke="var(--gain)" stroke-width="5"/>
<ellipse id="mer2" cx="1310" cy="450" rx="80" ry="150" fill="none" stroke="var(--ink)" stroke-width="4"/>
<text class="m" x="1310" y="660" font-size="20" text-anchor="middle">COMPLEX AND</text>
<text class="m" x="1310" y="690" font-size="20" text-anchor="middle">FAST-CHANGING WORLD</text>
</g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">One answer kept coming back.</text>
<text class="b" x="120" y="176" font-size="32">Said in many different words, by many leaders.</text>
<g id="bubs"></g>
<g id="bigb">
<rect class="gain" x="800" y="230" width="680" height="230" rx="30"/>
<path class="gain" d="M900 455l-40 65 100-65z"/>
<text class="d" x="840" y="330" font-size="44" style="fill:var(--on-gain)">Braver leaders.</text>
<text class="d" x="840" y="400" font-size="40" style="fill:var(--on-gain)">More courageous cultures.</text>
</g>
<g id="gap">
<rect class="s-ink" x="120" y="640" width="500" height="200" fill="var(--line)" stroke-width="5"/>
<rect class="s-ink" x="980" y="640" width="500" height="200" fill="var(--line)" stroke-width="5"/>
<text class="m" x="140" y="620" font-size="22">WANTING COURAGE</text>
<text class="m" x="1460" y="620" font-size="22" text-anchor="end">KNOWING HOW TO BUILD IT</text>
<g id="gp"></g>
<path class="s-ink" d="M1040 640V540" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M1040 540h56l-14 20 14 20h-56z"/>
<path class="s-muted" d="M620 640Q800 700 980 640" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text id="gq" class="d" x="800" y="790" font-size="90" text-anchor="middle" style="fill:var(--loss)">?</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Courage is a set of skills.</text>
<text class="b" x="120" y="176" font-size="32">Not charisma. Skills that can be taught, observed and measured.</text>
<g id="cha">
<g id="star"></g>
<circle class="ink" cx="300" cy="410" r="32"/><path class="ink" d="M252 544v-42a48 48 0 0 1 96 0v42z"/>
<text class="m" x="300" y="650" font-size="20" text-anchor="middle">BOLD · LOUD · CHARMING</text>
</g>
<g id="xout"><path class="s-loss" d="M180 310L420 590M420 310L180 590" stroke-width="12" stroke-linecap="round"/></g>
<g id="tbx">
<g id="tools">
<path class="s-ink" d="M680 520V340" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="650" y="326" width="60" height="28" rx="6"/>
<path class="s-ink" d="M770 520L806 360" stroke-width="10" stroke-linecap="round"/><circle cx="810" cy="342" r="20" fill="none" stroke="var(--ink)" stroke-width="8"/>
<path class="s-ink" d="M860 520V380" stroke-width="6" stroke-linecap="round"/><rect class="ink" x="848" y="340" width="24" height="50" rx="8"/>
</g>
<rect class="gain" x="600" y="440" width="320" height="180" rx="12"/>
<rect x="730" y="470" width="60" height="24" rx="6" fill="var(--stage)"/>
<text class="m" x="760" y="680" font-size="22" text-anchor="middle">A SET OF SKILLS</text>
</g>
<g id="clip">
<rect class="s-ink" x="1080" y="270" width="380" height="400" rx="16" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="1210" y="252" width="120" height="40" rx="8"/>
</g>
<g id="rows"></g>
<g id="lock">
<path class="s-ink" d="M136 790v-26a18 18 0 0 1 36 0" fill="none" stroke-width="6" stroke-linecap="round"/>
<rect class="gain" x="124" y="790" width="60" height="46" rx="6"/>
<text class="d" x="210" y="830" font-size="44">Nobody is locked out of bravery.</text>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four skill sets.</text>
<text class="b" x="120" y="176" font-size="32">Daring leadership, organised into four learnable skill sets.</text>
<g id="blocks"></g>
<g id="later">
<path class="s-muted" d="M140 590v20h1320v-20" fill="none" stroke-width="4" stroke-dasharray="8 8"/>
<text class="m" x="800" y="660" font-size="22" text-anchor="middle">EACH ONE COMES IN A LATER LESSON</text>
</g>
<g id="every">
<text class="d" x="120" y="790" font-size="46">Every one can be learned and practiced.</text>
<rect class="gain" x="124" y="815" width="160" height="10"/>
</g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Who is a leader?</text>
<text class="b" x="120" y="176" font-size="32">Brown’s definition has nothing to do with job titles.</text>
<g id="badge">
<rect class="s-ink" x="120" y="250" width="460" height="290" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect class="loss" x="120" y="250" width="460" height="80" rx="20"/><rect class="loss" x="120" y="300" width="460" height="30"/>
<text class="m" x="350" y="300" font-size="22" text-anchor="middle" style="fill:var(--stage)">HELLO, MY TITLE IS</text>
<text class="d" x="350" y="460" font-size="64" text-anchor="middle">The Boss</text>
<line id="bstr" class="s-loss" x1="190" y1="440" x2="190" y2="440" stroke-width="9" stroke-linecap="round"/>
</g>
<g id="tnote"><text class="m" x="120" y="600" font-size="22">LEADERSHIP ≠ JOB TITLE</text></g>
<g id="pot"><path class="ink" d="M1020 560h160l-20 110h-120z"/></g>
<path id="stem" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/>
<g id="leaves">
<path class="gain" d="M1100 400q-60-50-110-10q50 40 110 10z"/>
<path class="gain" d="M1100 420q60-50 110-10q-50 40-110 10z"/>
<text class="m" x="975" y="400" font-size="20" text-anchor="end">PEOPLE</text>
<text class="m" x="1222" y="440" font-size="20">PROCESSES</text>
</g>
<g id="can">
<path class="s-ink" d="M1240 292L1200 272" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="1240" y="260" width="110" height="70" rx="10"/>
<path class="s-ink" d="M1350 272q40 0 40 28q0 28-40 28" fill="none" stroke-width="8"/>
<g id="drops"></g>
</g>
<g id="def1"><text class="d5" x="120" y="760" font-size="36">A leader takes responsibility for finding the potential</text></g>
<g id="def2"><text class="d5" x="120" y="812" font-size="36">in people and processes, and has the <tspan style="fill:var(--gain)">courage to develop it.</tspan></text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">That includes you.</text>
<text class="b" x="120" y="176" font-size="32">Leaders show up in every role.</text>
<g id="pan"></g>
<g id="chk6"></g>
<g id="rc"><text class="d" x="120" y="800" font-size="46">Responsibility and courage are what count.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Practice it like a muscle.</text>
<text class="b" x="120" y="176" font-size="32">If courage is a skill, it grows with every rep.</text>
<g id="db"><g id="dbIn">
<path class="s-ink" d="M150 290h160" stroke-width="10" stroke-linecap="round"/>
<rect class="ink" x="140" y="260" width="22" height="60" rx="5"/><rect class="ink" x="298" y="260" width="22" height="60" rx="5"/>
</g></g>
<g id="bars"></g>
<path class="s-line" d="M120 680h640" stroke-width="5" stroke-linecap="round"/>
<g id="awk"><text class="m" x="140" y="720" font-size="20" style="fill:var(--loss)">AWKWARD AT FIRST</text></g>
<g id="str"><text class="m" x="722" y="720" font-size="20" text-anchor="end" style="fill:var(--gain)">STRONGER</text></g>
<g id="cal">
<rect class="s-ink" x="900" y="240" width="560" height="420" rx="16" fill="var(--stage)" stroke-width="5"/>
<rect class="ink" x="900" y="240" width="560" height="70" rx="16"/><rect class="ink" x="900" y="280" width="560" height="30"/>
<text class="m" x="1180" y="285" font-size="24" text-anchor="middle" style="fill:var(--stage)">THIS WEEK</text>
<g id="days"></g>
</g>
<g id="hl">
<rect id="hcell" class="gain" x="1068" y="380" width="64" height="160" rx="10"/>
<path d="M1088 460l9 10 18-20" fill="none" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1180" y="610" font-size="22" text-anchor="middle" style="fill:var(--gain)">ONE SMALL MOMENT</text>
</g>
<g id="pick"><text class="d5" x="120" y="800" font-size="36">Choose one small moment this week to lead on purpose.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="72" letter-spacing="-2">Whose potential, or which</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="72" letter-spacing="-2">process, will you take</text></g>
<g id="qc"><text class="d" x="136" y="480" font-size="72" letter-spacing="-2">responsibility for</text></g>
<g id="qd"><text class="d" x="136" y="570" font-size="72" letter-spacing="-2"><tspan style="fill:var(--gain)">developing</tspan> this week?</text></g>
<g id="qe"><text class="m" x="143" y="690" font-size="26">WHAT IS ONE BRAVE STEP YOU COULD TAKE TOMORROW?</text></g>
<g id="mir">
<path class="s-ink" d="M1370 580V690M1310 700h120" stroke-width="8" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1370" cy="450" rx="90" ry="130" fill="var(--stage)" stroke-width="8"/>
<circle class="gain" cx="1370" cy="420" r="28"/><path class="gain" d="M1328 530v-20a42 42 0 0 1 84 0v20z"/>
<path class="s-line" d="M1312 400q4-50 40-74" fill="none" stroke-width="5" stroke-linecap="round"/>
</g>
</g>