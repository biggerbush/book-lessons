<g id="ordP"></g>
<text class="m" x="620" y="750" font-size="20" style="fill:var(--loss)">ORDINARY FEELS LIKE FAILURE</text>
</g>
<g id="spt">
<polygon id="cone" class="gain" points="1390,256 1140,690 1400,690" fill-opacity=".25"/>
<circle class="ink" cx="1395" cy="236" r="20"/>
<ellipse cx="1270" cy="696" rx="140" ry="16" fill="var(--line)"/>
<g id="spP"></g>
<text class="m" x="1460" y="750" font-size="20" text-anchor="end">PRESSURE TO BE EXCEPTIONAL</text>
</g>
<g id="tyr"><text class="d" x="120" y="830" font-size="48">The tyranny of exceptionalism.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Average is freeing.</text>
<text class="b" x="120" y="176" font-size="32">Most of us are pretty average at most things.</text>
<path class="s-line" d="M140 640H900" stroke-width="4"/>
<path id="bc" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="avg"><circle class="gain" cx="520" cy="300" r="16"/><text class="m" x="520" y="272" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text><text class="m" x="520" y="680" font-size="22" text-anchor="middle">AVERAGE</text></g>
<circle id="climb" class="gain" r="14" opacity="0"/>
<g id="exl"><text class="m" x="840" y="560" font-size="20" text-anchor="middle">EXCEPTIONAL</text></g>
