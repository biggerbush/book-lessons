<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The myth of</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">more information.</text>
<text class="b" x="120" y="600" font-size="32">Why knowing more has never automatically made us wiser.</text>
<g id="t_pile"></g>
<g id="t_me"></g>
<g id="t_q"><text id="t_qt" class="d" x="1210" y="370" font-size="100" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="t_lbl"><text class="m" x="1140" y="680" font-size="20">HOMO SAPIENS · WISE HUMAN</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A huge library.</text>
<text class="b" x="120" y="176" font-size="32">Thousands of years of piled-up information.</text>
<rect class="s-ink" x="120" y="240" width="600" height="560" rx="8" fill="none" stroke-width="7"/>
<path class="s-ink" d="M120 426h600M120 613h600" stroke-width="6"/>
<g id="l_books"></g>
<text class="m" x="420" y="844" font-size="22" text-anchor="middle">INFORMATION, PILED UP</text>
<g id="l_gal"><circle class="gain" cx="960" cy="370" r="18"/><g id="l_arm"></g><text class="m" x="960" y="524" font-size="24" text-anchor="middle">GALAXIES</text></g>
<g id="l_cell"><ellipse class="s-ink" cx="1300" cy="370" rx="150" ry="100" fill="var(--stage)" stroke-width="6"/><circle class="gain" cx="1270" cy="360" r="34"/><circle class="ink" cx="1360" cy="320" r="10"/><circle class="ink" cx="1380" cy="400" r="14"/><circle class="ink" cx="1200" cy="410" r="8"/><text class="m" x="1300" y="524" font-size="24" text-anchor="middle">CELLS</text></g>
<g id="l_warn"></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The naive view.</text>
<text class="b" x="120" y="176" font-size="32">More information, more truth, more wisdom?</text>
<g id="n0"><rect class="s-ink" x="120" y="300" width="320" height="150" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d5" x="280" y="390" font-size="42" text-anchor="middle">Information</text></g>
<g id="a1"><text class="m" x="540" y="344" font-size="22" text-anchor="middle">LEADS TO</text><path class="s-muted" d="M468 375h145m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="n1"><rect class="s-ink" x="640" y="300" width="320" height="150" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d5" x="800" y="390" font-size="44" text-anchor="middle">Truth</text></g>
<g id="a2"><text class="m" x="1060" y="344" font-size="22" text-anchor="middle">LEADS TO</text><path class="s-muted" d="M988 375h145m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="n2"><rect class="gain" x="1160" y="300" width="320" height="150" rx="18"/><text class="d" x="1320" y="388" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Wisdom &amp; power</text></g>
<g id="nv_gap"><text class="d" x="120" y="610" font-size="48">Every problem is just a lack of data.</text><g id="nv_sq"></g><text class="m" x="120" y="790" font-size="20">SO THE FIX IS ALWAYS: ADD MORE DATA</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A tempting promise.</text>
<text class="b" x="120" y="176" font-size="32">Tech optimists: let information flow freely.</text>
<g id="p_srv"><rect class="s-ink" x="140" y="280" width="180" height="250" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M170 340h90M170 400h90M170 460h90" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="290" cy="340" r="8"/><circle class="gain" cx="290" cy="400" r="8"/><circle class="gain" cx="290" cy="460" r="8"/><g id="p_ppl"></g></g>
<g id="p_pipe"><rect class="s-ink" x="420" y="360" width="1000" height="100" rx="50" fill="none" stroke-width="6"/><g id="p_dots"></g>
<path class="s-loss" d="M840 342v-12h340v12" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
<text class="m" x="1010" y="316" font-size="20" text-anchor="middle" style="fill:var(--loss)">LIES FADE</text>
<path class="s-gain" d="M1180 478v12h220v-12" fill="none" stroke-width="4" stroke-linecap="round"/>
<text class="m" x="1400" y="520" font-size="20" text-anchor="end" style="fill:var(--gain)">TRUTH WINS</text></g>
<g id="p_hope"><text class="d5" x="420" y="620" font-size="44">Hopeful. Simple.</text></g>
<g id="p_hist"><text class="d" x="120" y="790" font-size="52">But history tells a different story.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The printing press.</text>
<text class="b" x="120" y="176" font-size="32">It spread across Europe in the fifteenth century.</text>
<g id="pr"><path class="s-ink" d="M170 620V260M410 620V260M150 620h280" fill="none" stroke-width="8" stroke-linecap="round"/><rect class="ink" x="170" y="260" width="240" height="36"/><path class="s-ink" d="M230 330h120" stroke-width="8" stroke-linecap="round"/><line id="pr_scr" class="s-ink" x1="290" y1="296" x2="290" y2="400" stroke-width="10"/><rect id="pr_plat" class="ink" x="210" y="400" width="160" height="30" rx="4"/><rect class="ink" x="190" y="540" width="200" height="20"/><text class="m" x="290" y="670" font-size="20" text-anchor="middle">PRINTING PRESS</text><g id="pr_fly"></g></g>
<g id="tl"><path class="s-ink" d="M600 400L780 320" stroke-width="26" stroke-linecap="round"/><path class="s-ink" d="M700 360L660 430M700 360L740 430" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="830" cy="280" r="8"/><circle class="gain" cx="868" cy="322" r="5"/><circle class="gain" cx="812" cy="336" r="4"/><text class="m" x="920" y="320" font-size="20">THE NAIVE VIEW</text><text class="d5" x="920" y="375" font-size="38">Printing sparked science.</text></g>
<g id="pa"><rect x="580" y="480" width="110" height="140" rx="6" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" transform="rotate(-8 635 550)"/><rect x="670" y="476" width="110" height="140" rx="6" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" transform="rotate(4 725 546)"/><rect x="760" y="482" width="110" height="140" rx="6" fill="var(--stage)" stroke="var(--loss)" stroke-width="5" transform="rotate(10 815 552)"/><text class="d" x="725" y="572" font-size="64" text-anchor="middle" style="fill:var(--loss)">!</text><text class="d" x="815" y="578" font-size="64" text-anchor="middle" style="fill:var(--loss)">!</text><text class="m" x="580" y="680" font-size="20">TALES · CONSPIRACIES</text></g>
<g id="wb"><rect class="loss" x="1000" y="470" width="170" height="200" rx="8"/><path d="M1020 470v200" stroke="var(--stage)" stroke-width="4"/><polygon points="1060,600 1130,600 1095,510" fill="var(--stage)"/><path d="M1045 602h100" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/><text class="m" x="1200" y="540" font-size="20">HOW TO SPOT</text><text class="m" x="1200" y="570" font-size="20">AND PUNISH</text><text class="m" x="1200" y="600" font-size="20" style="fill:var(--loss)">WITCHES</text></g>
<g id="wf"><text class="d" x="120" y="800" font-size="46">Wild fantasies spread as fast as discoveries.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Truth is costly.</text>
<text class="b" x="120" y="176" font-size="32">Truth is expensive. Fiction is cheap.</text>
<g id="sc"><path class="s-ink" d="M800 330V640M700 640h200" stroke-width="8" stroke-linecap="round"/><line id="sc_beam" class="s-ink" x1="500" y1="330" x2="1100" y2="330" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="800" cy="330" r="14"/>
<g id="sc_L"><path class="s-ink" d="M0 0L-95 120M0 0L95 120M-100 120h200" fill="none" stroke-width="5" stroke-linecap="round"/><rect class="gain" x="-50" y="50" width="100" height="70" rx="6"/><text class="d" x="0" y="172" font-size="30" text-anchor="middle">TRUTH</text></g>
<g id="sc_R"><path class="s-ink" d="M0 0L-95 120M0 0L95 120M-100 120h200" fill="none" stroke-width="5" stroke-linecap="round"/><g id="sc_cards"></g><text class="d" x="0" y="172" font-size="30" text-anchor="middle" style="fill:var(--loss)">FICTION</text></g></g>
<g id="sc_tl"><text class="d5" x="120" y="300" font-size="36" style="fill:var(--gain)">Expensive</text><text class="d5" x="120" y="350" font-size="36" style="fill:var(--gain)">Complicated</text><text class="d5" x="120" y="400" font-size="36" style="fill:var(--gain)">Painful</text></g>
<g id="sc_tr"><text class="d5" x="1480" y="300" font-size="36" text-anchor="end" style="fill:var(--loss)">Cheap</text><text class="d5" x="1480" y="350" font-size="36" text-anchor="end" style="fill:var(--loss)">Simple</text><text class="d5" x="1480" y="400" font-size="36" text-anchor="end" style="fill:var(--loss)">Flattering</text></g>
<g id="sc_cost"><text class="b" x="120" y="720" font-size="32">Checking facts: time and money. Inventing a tale: almost nothing.</text></g>
<g id="sc_fl"><text class="d" x="120" y="810" font-size="48">In a flood, the truth is outnumbered.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not just bad apples.</text>
<text class="b" x="120" y="176" font-size="32">The problem is how large groups share information.</text>
<g id="so"><rect class="s-line" x="120" y="240" width="480" height="480" rx="18" fill="var(--stage)" stroke-width="3"/><g id="so_p"></g><polygon class="loss" points="266,400 300,316 334,400"/><path class="s-ink" d="M350 500L410 440" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="410" cy="440" r="10"/><g id="so_b"></g><text class="m" x="360" y="690" font-size="20" text-anchor="middle">THE FOOLISH APPRENTICE</text></g>
<path id="so_x" class="s-ink" d="M170 280L550 660M550 280L170 660" stroke-width="10" stroke-linecap="round" opacity="0"/>
<g id="nw_w"><g id="nw"></g></g>
<g id="cr">
<text class="m" x="1060" y="720" font-size="22" text-anchor="middle">GOOD PEOPLE, BADLY BUILT NETWORK</text>
<path class="s-loss" d="M1290 470h66m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="loss" d="M1420 418L1462 500H1378Z" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/>
<text class="d" x="1420" y="492" font-size="48" text-anchor="middle" style="fill:var(--stage)">!</text>
<text class="m" x="1420" y="546" font-size="20" text-anchor="middle" style="fill:var(--loss)">DISASTER</text>
</g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Raw material, not wisdom.</text>
<text class="b" x="120" y="176" font-size="32">Ask how well it has been checked.</text>
<g id="rm"><g id="rm_pile"></g><text class="m" x="120" y="700" font-size="20">MORE INFORMATION = RAW MATERIAL</text></g>
<g id="mg_w"><g id="mg"><circle class="s-ink" cx="0" cy="0" r="60" fill="var(--stage)" fill-opacity=".5" stroke-width="10"/><path class="s-ink" d="M44 44l56 56" stroke-width="18" stroke-linecap="round"/></g></g>
<g id="mg_c"><text class="m" x="120" y="760" font-size="22" style="fill:var(--gain)">HOW WELL HAS IT BEEN CHECKED?</text></g>
<path id="ar" class="s-muted" d="M620 450h200m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="fn"><path class="s-ink" d="M880 300H1420L1180 520V600H1120V520Z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="860" y="310" font-size="20" text-anchor="end">VOLUME</text><text class="m" x="1200" y="700" font-size="20" style="fill:var(--gain)">ACCURACY</text><g id="fd"></g></g>
<g id="ft"><text class="d" x="120" y="830" font-size="48">Volume is not the same as accuracy.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">“We just need more data.”</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">What would actually make</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">that data <tspan style="fill:var(--gain)">trustworthy</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">MORE DATA IS NOT ENOUGH</text>
<g id="ch_g"><rect class="s-ink" x="1290" y="640" width="140" height="36" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="1290" y="684" width="140" height="36" rx="18" fill="var(--stage)" stroke-width="5"/><rect class="s-ink" x="1290" y="728" width="140" height="36" rx="18" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="1440" cy="760" r="34"/><path d="M1424 760l12 12 20-24" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>