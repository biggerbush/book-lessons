<text class="d" x="1310" y="495" font-size="28" text-anchor="middle">?</text>
</g>
<g id="lesson2"><text class="d" x="120" y="790" font-size="48">A car shows what you spent, not what you kept.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rich is not the same as wealthy.</text>
<text class="b" x="120" y="176" font-size="32">Income you can see versus income you kept.</text>
