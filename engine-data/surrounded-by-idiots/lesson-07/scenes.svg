<g id="s0">
<text class="m" x="120" y="150" font-size="28">SURROUNDED BY IDIOTS · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Adapt your style,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not yourself.</text>
<text class="b" x="120" y="600" font-size="32">Know your own color, then meet others where they are.</text>
<g id="mir"><path class="s-ink" d="M1300 590v50M1230 644h140" stroke-width="8" stroke-linecap="round" fill="none"/><ellipse class="s-ink" cx="1300" cy="420" rx="120" ry="170" fill="var(--stage)" stroke-width="8"/><path id="glint" class="s-line" d="M1220 360l40-60" stroke-width="6" stroke-linecap="round"/></g>
<g id="me"></g>
<g id="chips0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The listener decides.</text>
<text class="b" x="120" y="176" font-size="32">A message only works when it lands with the receiver.</text>
<g id="spk"></g>
<g id="bub1"><rect class="s-ink" x="320" y="270" width="260" height="110" rx="22" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M352 380l-30 40l70-40" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="ink" cx="400" cy="325" r="10"/><circle class="ink" cx="450" cy="325" r="10"/><circle class="ink" cx="500" cy="325" r="10"/></g>
<g id="tgt"><circle class="s-line" cx="1000" cy="480" r="150" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="1000" cy="480" r="100" fill="none" stroke-width="5"/><circle class="gain" cx="1000" cy="480" r="50"/></g>
<g id="lis"></g>
<circle id="dart1" class="gain" r="14"/>
<circle id="dart2" class="loss" r="14"/>
<text id="qm" class="d" x="1340" y="380" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text>
<g id="said"><text class="d5" x="120" y="750" font-size="44">“I explained it clearly.”</text></g>
<line id="strk" class="s-loss" x1="112" y1="735" x2="112" y2="735" stroke-width="6" stroke-linecap="round"/>
<g id="unfin"><text class="d" x="120" y="830" font-size="44">If they didn’t get it, the job isn’t finished.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Start with you.</text>
<text class="b" x="120" y="176" font-size="32">Most of us are a blend, with one or two colors leading.</text>
<rect class="s-line" x="160" y="260" width="400" height="480" rx="18" fill="var(--stage)" stroke-width="4"/>
<g id="spot"><rect class="ink" x="330" y="205" width="60" height="30" rx="8"/><polygon class="gain" points="345,235 375,235 540,740 180,740" fill-opacity=".18"/><path class="s-gain" d="M430 400q14 20 0 40M454 386q24 34 0 68" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="selfp"><text class="m" x="360" y="700" font-size="22" text-anchor="middle">YOU</text></g>
<g id="blend"><text class="m" x="680" y="300" font-size="22">YOUR BLEND · ILLUSTRATION</text><g id="segs"></g></g>
<g id="lead"><path class="s-gain" d="M680 480v14h520v-14" fill="none" stroke-width="5"/><text class="m" x="940" y="530" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE OR TWO COLORS LEAD</text></g>
<g id="shape"><text class="d5" x="680" y="650" font-size="36">Your leading color shapes how you speak,</text><text class="d5" x="680" y="700" font-size="36">often without you noticing.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Know your blind spots.</text>
<text class="b" x="120" y="176" font-size="32">Every color has strengths that can be overdone.</text>
<g id="k0"><circle class="s-ink" cx="275" cy="360" r="60" fill="none" stroke-width="7"/><path id="hand" class="s-loss" d="M275 360v-44" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="275" cy="360" r="8"/></g>
<g id="k1"><ellipse class="ink" cx="625" cy="370" rx="56" ry="34"/><path class="gain" d="M595 385q30-20 60 0q-30 16-60 0z"/><path id="mth" class="s-ink" d="M700 330l26-14M706 370h30M700 410l26 14M550 330l-26-14M544 370h-30M550 410l-26 14" fill="none" stroke-width="6" stroke-linecap="round"/></g>
<g id="k2"><path class="s-ink" d="M975 300l60 22v40c0 40-30 62-60 74c-30-12-60-34-60-74v-40z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-muted" d="M955 370h40" stroke-width="6" stroke-linecap="round"/></g>
<g id="k3"><g id="lensg"><circle class="s-ink" cx="1305" cy="350" r="46" fill="none" stroke-width="7"/><path class="s-ink" d="M1338 383l34 34" stroke-width="12" stroke-linecap="round"/><path class="s-muted" d="M1282 338h46M1282 352h46M1282 366h30" stroke-width="3"/></g></g>
<g id="over"><text class="d" x="120" y="780" font-size="38">Your strengths, overdone, become someone else’s frustration.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One idea, two pitches.</text>
<text class="b" x="120" y="176" font-size="32">Same idea, different packaging for each color.</text>
<g id="idea"><circle class="gain" cx="800" cy="280" r="44"/><rect class="ink" x="782" y="326" width="36" height="22" rx="4"/><text class="m" x="800" y="390" font-size="22" text-anchor="middle">ONE IDEA</text></g>
<g id="pr"><g id="rp"></g><text class="m" x="260" y="340" font-size="22">FOR THE RED</text><rect id="pkR" x="140" y="440" width="520" height="160" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><circle id="bR" class="gain" cx="200" cy="520" r="24"/><text class="d5" x="250" y="516" font-size="32">Lead with the result.</text><text class="m" x="250" y="562" font-size="20">KEEP IT SHORT</text></g>
<g id="pb"><g id="bp"></g><text class="m" x="1020" y="340" font-size="22">FOR THE BLUE</text><rect id="pkB" x="900" y="440" width="580" height="280" rx="18" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><circle id="bB" class="gain" cx="960" cy="520" r="24"/><text class="d5" x="1010" y="516" font-size="32">Facts.</text><text class="d5" x="1010" y="576" font-size="32">Reasoning.</text><text class="d5" x="1010" y="636" font-size="32">Time to review.</text><circle class="s-ink" cx="1400" cy="660" r="30" fill="none" stroke-width="5"/><path class="s-ink" d="M1400 642v18h14" fill="none" stroke-width="5" stroke-linecap="round"/></g>
<g id="same"><text class="d" x="120" y="820" font-size="44">The idea stays the same.</text></g>
<g id="pack"><text class="d" x="740" y="820" font-size="44" style="fill:var(--gain)">Only the packaging changes.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Flex, don’t fake.</text>
<text class="b" x="120" y="176" font-size="32">Turn parts of your style up or down. Stay yourself.</text>
<g id="mask"><path class="ink" d="M190 430q110-60 220 0q-10 100-110 100t-110-100z"/><circle cx="255" cy="455" r="18" fill="var(--stage)"/><circle cx="345" cy="455" r="18" fill="var(--stage)"/><path class="s-ink" d="M392 500l50 130" stroke-width="8" stroke-linecap="round"/><text class="m" x="300" y="700" font-size="22" text-anchor="middle">NOT A COSTUME</text></g>
<path id="xx" class="s-loss" d="M190 380L410 600M410 380L190 600" stroke-width="10" stroke-linecap="round" fill="none"/>
<g id="mixer"><rect class="s-line" x="620" y="250" width="860" height="520" rx="22" fill="var(--stage)" stroke-width="4"/><path class="s-line" d="M880 290v440" stroke-width="3" stroke-dasharray="6 8"/><g id="sliders"></g></g>
<g id="stay"><rect class="gain" x="736" y="274" width="28" height="20" rx="4"/><path class="s-gain" d="M742 274v-8a8 8 0 0 1 16 0v8" fill="none" stroke-width="4"/><text class="m" x="750" y="720" font-size="20" text-anchor="middle" style="fill:var(--gain)">STAY PUT</text></g>
<g id="shift"><text class="m" x="1200" y="720" font-size="20" text-anchor="middle">THESE SHIFT</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Read the clues.</text>
<text class="b" x="120" y="176" font-size="32">Notice how the other person behaves.</text>
<rect class="s-line" x="420" y="250" width="600" height="460" rx="16" fill="none" stroke-width="3"/>
<g id="axX"><path class="s-ink" d="M420 480h600M440 466l-20 14 20 14M1000 466l20 14-20 14" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="400" y="488" font-size="20" text-anchor="end">MEASURED, RESERVED</text><text class="m" x="1040" y="488" font-size="20">QUICK, OUTSPOKEN</text></g>
<g id="axY"><path class="s-ink" d="M720 250v460M706 270l14-20 14 20M706 690l14 20 14-20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="720" y="236" font-size="20" text-anchor="middle">TASKS</text><text class="m" x="720" y="744" font-size="20" text-anchor="middle">PEOPLE</text></g>
<g id="quads"><text class="d" x="570" y="380" font-size="44" text-anchor="middle" style="fill:var(--muted)">Blue</text><text id="qRed" class="d" x="800" y="444" font-size="44" text-anchor="middle" style="fill:var(--gain)">Red</text><text class="d" x="570" y="600" font-size="44" text-anchor="middle" style="fill:var(--muted)">Green</text><text class="d" x="870" y="600" font-size="44" text-anchor="middle" style="fill:var(--muted)">Yellow</text></g>
<circle id="who" class="gain" r="20"/>
<g id="clue"><text class="d5" x="120" y="810" font-size="38">Those clues hint at a likely color.</text></g>
<g id="guide"><circle class="s-gain" cx="940" cy="330" r="54" fill="none" stroke-width="4" stroke-dasharray="10 10"/><path class="s-ink" d="M1290 330q40-16 80 0v130q-40-16-80 0zM1370 330q40-16 80 0v130q-40-16-80 0z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1370" y="510" font-size="20" text-anchor="middle">A ROUGH GUIDE,</text><text class="m" x="1370" y="540" font-size="20" text-anchor="middle" style="fill:var(--gain)">NOT A LABEL</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Under pressure.</text>
<text class="b" x="120" y="176" font-size="32">Stress drains the energy you need to adapt.</text>
<g id="bat"><rect class="s-ink" x="140" y="300" width="260" height="140" rx="16" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="400" y="340" width="20" height="60" rx="4"/><rect id="lvl" x="156" y="316" width="228" height="108" rx="8"/><text class="m" x="270" y="490" font-size="20" text-anchor="middle">ENERGY TO ADAPT</text></g>
<g id="cloud"><circle class="ink" cx="740" cy="330" r="46"/><circle class="ink" cx="800" cy="300" r="58"/><circle class="ink" cx="860" cy="330" r="46"/><rect class="ink" x="740" y="330" width="120" height="46"/><polygon id="bolt" class="loss" points="800,370 770,430 795,430 775,490 835,415 808,415 825,370"/></g>
<g id="bowl"><path class="s-ink" d="M560 520Q800 820 1040 520" fill="none" stroke-width="7" stroke-linecap="round"/><text class="m" x="800" y="730" font-size="20" text-anchor="middle">NATURAL HABITS</text><text class="m" x="1040" y="500" font-size="20" text-anchor="middle">ADAPTED STYLE</text></g>
<circle id="ball" class="gain" r="22"/>
<g id="pz"><circle class="gain" cx="1300" cy="560" r="96"/><rect x="1262" y="515" width="26" height="90" rx="6" fill="var(--on-gain)"/><rect x="1312" y="515" width="26" height="90" rx="6" fill="var(--on-gain)"/><text class="m" x="1300" y="700" font-size="22" text-anchor="middle">PAUSE FIRST</text></g>
<g id="helps"><text class="d" x="120" y="820" font-size="38">That’s exactly when knowing your blind spots helps most.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="72" letter-spacing="-2">Think of one difficult person.</text></g>
<g id="qb"><text class="d" x="136" y="420" font-size="72" letter-spacing="-2">What color do they lean toward,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="72" letter-spacing="-2">and what do they <tspan style="fill:var(--gain)">need from you?</tspan></text></g>
<text class="m" x="143" y="650" font-size="26">ADAPT YOUR STYLE, NOT YOURSELF</text>
<g id="phone"><rect class="s-ink" x="1330" y="600" width="130" height="220" rx="22" fill="var(--stage)" stroke-width="7"/><circle class="gain" cx="1370" cy="660" r="16"/><circle class="ink" cx="1420" cy="660" r="16"/><circle class="loss" cx="1370" cy="710" r="16"/><circle cx="1420" cy="710" r="16" fill="var(--muted)"/><text class="d" x="1395" y="790" font-size="44" text-anchor="middle">?</text></g>
</g>