<text class="d" x="420" y="580" font-size="280" text-anchor="middle" style="fill:var(--loss)">?</text>
<text class="m" x="420" y="670" font-size="22" text-anchor="middle">WHAT EXACTLY GOES WRONG NEXT?</text>
</g>
