</g>
<g id="errs"></g>
<g id="std3"><text class="d5" x="120" y="790" font-size="40">The real question: did we play to our standard?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of score.</text>
<text class="b" x="120" y="176" font-size="32">You can win badly, and lose well.</text>
<g id="pan">
<rect class="s-line" x="120" y="230" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="230" width="640" height="560" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="160" y="290" font-size="24">A LUCKY WIN</text>
<text class="m" x="880" y="290" font-size="24">AN HONEST LOSS</text>
</g>
<g id="pl">
<text class="m" x="160" y="360" font-size="22">RESULT</text>
<rect class="ink" x="160" y="380" width="240" height="90" rx="14"/>
<text class="d" x="280" y="447" font-size="56" text-anchor="middle" style="fill:var(--stage)">WIN</text>
<text class="m" x="160" y="540" font-size="22">OWN STANDARD</text>
<rect class="s-line" x="160" y="560" width="560" height="44" rx="22" fill="none" stroke-width="4"/>
<rect id="barL" class="loss" x="160" y="560" width="0" height="44" rx="22"/>
<text class="d5" x="160" y="700" font-size="36">Celebrate it, learn nothing.</text>
</g>
<g id="pr">
