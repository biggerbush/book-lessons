<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one decision.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Score it out of 100.</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">Under <tspan style="fill:var(--gain)">90</tspan>? Let it go.</text></g>
