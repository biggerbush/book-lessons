<g id="s0">
<text class="m" x="120" y="150" font-size="28">SLOW PRODUCTIVITY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why busyness feels</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">like progress.</text>
<text class="b" x="120" y="600" font-size="32">How knowledge work swapped real results for looking busy</text>
<circle id="glow" class="gain" cx="1300" cy="560" r="170" opacity="0"/>
<g id="envs"></g>
<path class="s-ink" d="M1140 630v70h320v-70" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="badge"><circle class="gain" cx="1420" cy="330" r="52"/><text id="cnt" class="d" x="1420" y="346" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">0</text></g>
<g id="nothing"><text class="m" x="1300" y="780" font-size="22" text-anchor="middle">REAL WORK DONE: ?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Productivity used to be visible.</text>
<text class="b" x="120" y="176" font-size="32">An early car factory and its assembly line.</text>
<g id="line1"><rect class="ink" x="120" y="600" width="960" height="24" rx="12"/><g id="rollers"></g><g id="cars"></g><text class="m" x="120" y="720" font-size="20">ASSEMBLY LINE</text></g>
<g id="watch"><circle class="s-ink" cx="1300" cy="390" r="110" fill="var(--stage)" stroke-width="8"/><rect class="ink" x="1286" y="250" width="28" height="22" rx="4"/><path id="hand" class="s-gain" d="M1300 390V300" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="1300" cy="390" r="10"/></g>
<g id="tally"><text class="m" x="1190" y="580" font-size="20">CARS PER HOUR</text><g id="marks"></g><path class="s-gain" d="M1446 700V614m-20 20 20-20 20 20" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A new kind of worker.</text>
<text class="b" x="120" y="176" font-size="32">Peter Drucker named them knowledge workers.</text>
<g id="dru"><text class="d" x="120" y="320" font-size="96" style="fill:var(--gain)">1959</text><g id="druP"></g>
<text class="m" x="260" y="650" font-size="20" text-anchor="middle">PETER DRUCKER</text>
<path class="s-ink" d="M360 380h360v80H400l-30 26 6-26h-16z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="540" y="428" font-size="20" text-anchor="middle">KNOWLEDGE WORKERS</text></g>
<g id="wk"><g id="wkP"></g><rect class="ink" x="820" y="640" width="440" height="14" rx="4"/><path class="s-ink" d="M860 654v100M1220 654v100" stroke-width="7" stroke-linecap="round"/><rect class="s-ink" x="1070" y="560" width="120" height="76" rx="6" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="1040" cy="420" r="8"/><circle class="ink" cx="1066" cy="396" r="12"/></g>
<g id="chips2"></g>
<g id="hard"><text class="d" x="120" y="810" font-size="48" style="fill:var(--loss)">Making it productive: a huge challenge.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">No clear number.</text>
<text class="b" x="120" y="176" font-size="32">Many jobs at once, and no fixed output.</text>
<g id="jug"><g id="jugP"></g><path class="s-ink" d="M424 570L380 510M496 570L540 510" stroke-width="10" stroke-linecap="round" fill="none"/><text class="m" x="460" y="720" font-size="20" text-anchor="middle">MANY JOBS AT ONCE</text></g>
<g id="balls"></g>
<g id="qbox"><rect class="s-line" x="860" y="250" width="560" height="420" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="890" y="300" font-size="22">OUTPUT TODAY</text><g id="minicar" transform="translate(1340 330) scale(.6)"></g><path class="s-loss" d="M1280 280l110 64" stroke-width="6" stroke-linecap="round"/><text id="qm" class="d" x="1140" y="610" font-size="280" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="agree"><text class="d" x="120" y="810" font-size="48">Nobody agreed on what productivity meant.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Activity filled the gap.</text>
<text class="b" x="120" y="176" font-size="32">With no clear measure, people showed effort they could see.</text>
<g id="desks"></g><g id="sigs"></g>
<g id="pseudo"><text class="d" x="120" y="790" font-size="60" style="fill:var(--loss)">Pseudo-productivity.</text><text class="b" x="120" y="840" font-size="30">Visible effort standing in for real results.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Tech turned up the signal.</text>
<text class="b" x="120" y="176" font-size="32">Showing activity became possible everywhere, all the time.</text>
<g id="phone"><rect class="s-ink" x="170" y="250" width="240" height="400" rx="32" fill="var(--stage)" stroke-width="7"/><rect class="ink" x="250" y="266" width="80" height="10" rx="5"/><text class="m" x="290" y="710" font-size="20" text-anchor="middle">LAPTOPS · PHONES · EMAIL</text></g>
<g id="notifs"></g>
<g id="chatL"><text class="m" x="670" y="710" font-size="20" text-anchor="middle">CHAT · VIDEO CALLS</text></g>
<g id="chat"></g>
<g id="vidL"><text class="m" x="1203" y="710" font-size="20" text-anchor="middle" style="fill:var(--loss)">REMOTE WORK: THE ONLY PROOF</text></g>
<g id="vid"></g>
<g id="proof"><text class="d" x="120" y="810" font-size="48">Signals became the proof of effort.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Busy feels like progress.</text>
<g id="pc"><rect class="s-line" x="120" y="220" width="640" height="280" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="262" font-size="20">EVERY REPLY FEELS FINISHED</text></g>
<g id="checks"></g>
<g id="pcal"><rect class="s-line" x="840" y="220" width="640" height="280" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="262" font-size="20">A PACKED CALENDAR</text><g id="cal"></g></g>
<g id="bars"><text class="m" x="120" y="580" font-size="20" style="fill:var(--gain)">THE WORK THAT TRULY MATTERS</text><g id="barG"></g></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Name your real output.</text>
<text class="b" x="120" y="176" font-size="32">List activity on one side, finished work on the other.</text>
<g id="pad"><rect class="s-ink" x="220" y="220" width="1160" height="560" rx="16" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><path class="s-line" d="M800 260v480" stroke-width="4"/></g>
<g id="colLw"><g id="colL"><text class="m" x="260" y="300" font-size="22">VISIBLE ACTIVITY</text><text class="d5" x="260" y="400" font-size="36">Emails sent</text><text class="d5" x="260" y="480" font-size="36">Meetings</text><text class="d5" x="260" y="560" font-size="36">Quick replies</text></g></g>
<g id="colR"><text class="m" x="840" y="300" font-size="22" style="fill:var(--gain)">FINISHED WORK THAT MATTERS</text><text class="d5" x="840" y="400" font-size="36">The report</text><text class="d5" x="840" y="480" font-size="36">The design</text><text class="d5" x="840" y="560" font-size="36">The big idea</text></g>
<g id="judge"><rect class="s-gain" x="820" y="250" width="530" height="500" rx="16" fill="none" stroke-width="6" stroke-dasharray="14 10"/><text class="m" x="850" y="700" font-size="22" style="fill:var(--gain)">JUDGE YOURSELF BY THIS, WEEKLY</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What two or three</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">results does your work</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">truly exist to <tspan style="fill:var(--gain)">produce?</tspan></text></g>
<g id="wd"><text class="m" x="143" y="700" font-size="26">WRITE THEM DOWN TODAY. MAKE THEM YOUR MEASURE.</text></g>
<g id="card"><rect class="s-ink" x="1180" y="620" width="280" height="200" rx="16" fill="var(--stage)" stroke-width="6"/><g id="boxes"></g></g>
</g>