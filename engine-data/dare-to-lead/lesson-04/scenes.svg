<g id="oth"><g id="po"></g></g>
<g id="cardw"><g id="card"><rect class="s-ink" width="140" height="110" rx="6" fill="var(--stage)" stroke-width="5"/><text class="m" x="70" y="62" font-size="18" text-anchor="middle">THE TASK</text></g></g>
