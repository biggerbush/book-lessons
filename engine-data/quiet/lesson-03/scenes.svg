<g id="s0">
<text class="m" x="120" y="150" font-size="28">QUIET · LESSON 3</text>
<text class="d" x="116" y="360" font-size="84" letter-spacing="-2">Born sensitive:</text>
<text class="d" x="116" y="456" font-size="84" letter-spacing="-2">the science of</text>
<text class="d" x="116" y="552" font-size="84" letter-spacing="-2">temperament.</text>
<text class="b" x="120" y="650" font-size="32">How a baby’s first reactions can hint at a quiet temperament</text>
<g id="tarcs"></g><g id="tb"></g>
<g id="t4m"><text class="m" x="1280" y="625" font-size="24" text-anchor="middle">4 MONTHS OLD</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Inside Kagan’s lab.</text>
<text class="b" x="120" y="176" font-size="32">Jerome Kagan set out to find where temperament comes from.</text>
<g id="kg"><text class="m" x="240" y="600" font-size="22" text-anchor="middle">JEROME KAGAN</text><text class="m" x="240" y="632" font-size="20" text-anchor="middle">HARVARD</text></g>
<rect class="s-line" x="470" y="290" width="640" height="320" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="bg"></g>
<g id="bl"><text class="m" x="470" y="660" font-size="22">ABOUT 500 BABIES · 4 MONTHS OLD</text></g>
<g id="ob"><g id="sight"></g><text class="m" x="1300" y="660" font-size="22" text-anchor="middle">HIS TEAM WATCHES</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A burst of newness.</text>
<text class="b" x="120" y="176" font-size="32">Each baby met one unfamiliar sound, sight and smell after another.</text>
<g id="pa">
<rect class="s-line" x="120" y="230" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M330 480q-20 40 0 80" fill="none" stroke-width="4"/>
<circle id="bal" class="s-ink" cx="330" cy="400" r="80" fill="var(--stage)" stroke-width="7"/>
<g id="burst"></g>
<path id="voice" class="s-ink" d="M430 540a24 24 0 0 1 0 40M455 525a44 44 0 0 1 0 70M480 510a64 64 0 0 1 0 100" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="330" y="650" font-size="22" text-anchor="middle">POPS AND VOICES</text>
</g>
<g id="pb">
<rect class="s-line" x="590" y="230" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M800 250v50" stroke-width="5"/>
<g id="mob"><path class="s-ink" d="M680 300h240M690 300v90M800 300v130M910 300v70" fill="none" stroke-width="4" stroke-linecap="round"/>
<circle class="gain" cx="690" cy="420" r="30"/><rect class="ink" x="772" y="430" width="56" height="56" rx="6"/><path class="loss" d="M910 370l34 60h-68z"/></g>
<text class="m" x="800" y="650" font-size="22" text-anchor="middle">COLORFUL MOBILES</text>
</g>
<g id="pc">
<rect class="s-line" x="1060" y="230" width="420" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M1180 480h180" stroke-width="8" stroke-linecap="round"/>
<ellipse class="s-ink" cx="1170" cy="480" rx="26" ry="18" fill="var(--stage)" stroke-width="5"/>
<ellipse class="s-ink" cx="1370" cy="480" rx="26" ry="18" fill="var(--stage)" stroke-width="5"/>
<path id="scent" class="s-muted" d="M1340 440q12-20 0-40t0-40M1370 440q12-20 0-40t0-40M1400 440q12-20 0-40t0-40" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1270" y="650" font-size="22" text-anchor="middle">ALCOHOL SWABS</text>
</g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of babies.</text>
<text class="b" x="120" y="176" font-size="32">Same lab, same surprises, very different reactions.</text>
<g id="b3h"><g id="b3hf"></g><text id="n20" class="d" x="256" y="600" font-size="64" text-anchor="middle" style="fill:var(--loss)">20%</text><text class="m" x="256" y="640" font-size="22" text-anchor="middle" style="fill:var(--loss)">HIGH-REACTIVE</text></g>
<g id="b3l"><g id="b3lf"></g><text id="n40" class="d" x="1208" y="600" font-size="64" text-anchor="middle">40%</text><text class="m" x="1208" y="640" font-size="22" text-anchor="middle">LOW-REACTIVE</text></g>
<g id="b3m"><g id="b3mf"></g><text class="d" x="664" y="600" font-size="56" text-anchor="middle" style="fill:var(--muted)">The rest</text><text class="m" x="664" y="640" font-size="22" text-anchor="middle">IN BETWEEN</text></g>
<rect id="barh" class="loss" x="120" y="670" height="56" width="0"/>
<rect id="barm" x="392" y="670" height="56" width="0" fill="var(--line)"/>
<rect id="barl" class="ink" x="1480" y="670" height="56" width="0"/>
<g id="b3n"><text class="d5" x="120" y="810" font-size="36">Kagan called the strong reactors high-reactive.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bold prediction.</text>
<text class="b" x="120" y="176" font-size="32">Kagan forecast how each kind of baby would turn out.</text>
<g id="p4a"><g id="p4b1"></g><text class="m" x="230" y="444" font-size="20" text-anchor="middle">LOUD, WRIGGLING</text></g>
<g id="p4c"><g id="p4b2"></g><text class="m" x="230" y="674" font-size="20" text-anchor="middle">CALM</text></g>
<g id="ball"><path class="ink" d="M740 552l20-34h80l20 34z"/><circle class="s-ink" cx="800" cy="445" r="80" fill="var(--stage)" stroke-width="7"/><text class="d" x="800" y="474" font-size="80" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<path id="ar1" class="s-loss" d="M330 340H1150" stroke-width="6" stroke-linecap="round"/>
<path id="ah1" class="s-loss" d="M1130 322l20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ar2" class="s-ink" d="M330 570H1150" stroke-width="6" stroke-linecap="round"/>
<path id="ah2" class="s-ink" d="M1130 552l20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="p4k1"><text class="m" x="1330" y="330" font-size="22" style="fill:var(--loss)">QUIET,</text><text class="m" x="1330" y="362" font-size="22" style="fill:var(--loss)">CAREFUL</text></g>
<g id="p4k2"><text class="m" x="1330" y="560" font-size="22">RELAXED,</text><text class="m" x="1330" y="592" font-size="22">OUTGOING</text></g>
<g id="bw"><text class="m" x="120" y="740" font-size="22">SOUNDS BACKWARDS?</text></g>
<g id="rx"><text class="d" x="120" y="810" font-size="44">Reactive = more sensitive to everything around.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Growing up.</text>
<text class="b" x="120" y="176" font-size="32">Kagan’s team checked in at ages 2, 4, 7 and 11.</text>
<g id="cal"><rect class="s-ink" x="120" y="250" width="70" height="64" rx="8" fill="var(--stage)" stroke-width="5"/><rect class="ink" x="120" y="250" width="70" height="18" rx="4"/><path class="s-line" d="M420 300H1420" stroke-width="5" stroke-linecap="round"/></g>
<g id="ages"></g>
<text class="m" x="120" y="470" font-size="20" style="fill:var(--loss)">HIGH-REACTIVE</text>
<text class="m" x="120" y="690" font-size="20">LOW-REACTIVE</text>
<g id="k1"></g><g id="k2"></g>
<g id="d1"><text class="m" x="420" y="585" font-size="20" style="fill:var(--loss)">CAUTIOUS · HANGS BACK WITH STRANGERS · THINKS BEFORE ACTING</text></g>
<g id="d2"><text class="m" x="420" y="805" font-size="20">BOLDER · CHATTIER · MORE AT EASE IN NEW SITUATIONS</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Inside the brain.</text>
<text class="b" x="120" y="176" font-size="32">A small region called the amygdala works like an alarm.</text>
<g id="br">
<path class="s-ink" d="M250 530C150 510 150 360 250 330C270 250 410 230 470 270C540 220 690 250 690 350C750 390 730 520 640 535C620 590 520 600 480 565C440 600 330 600 300 555C280 550 262 540 250 530Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/>
<path class="s-line" d="M300 400q60-40 120 0M480 330q60 30 120-10M560 440q50-30 100 10M330 480q50 30 100 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M560 580q6 40 30 70" fill="none" stroke-width="7" stroke-linecap="round"/>
<ellipse id="amy" class="loss" cx="470" cy="470" rx="30" ry="18"/>
<path class="s-loss" d="M470 492V630" stroke-width="3" stroke-dasharray="5 6"/>
<text class="m" x="470" y="664" font-size="22" text-anchor="middle" style="fill:var(--loss)">AMYGDALA</text>
</g>
<g id="bell"><path class="ink" d="M1000 450v-55a60 60 0 0 1 120 0v55l22 26H978z"/><circle class="ink" cx="1060" cy="494" r="14"/><circle class="ink" cx="1060" cy="326" r="10"/><g id="wvs"></g><text class="m" x="1060" y="560" font-size="22" text-anchor="middle">ALARM SYSTEM</text></g>
<g id="loud"><text class="m" x="1060" y="610" font-size="22" text-anchor="middle" style="fill:var(--loss)">HIGH-REACTIVE: LOUDER, SOONER</text></g>
<g id="party"><g id="crowd"></g><text class="d5" x="780" y="780" font-size="36">A busy party can feel overwhelming,</text><text class="m" x="780" y="824" font-size="20">EVEN FOR SOMEONE WHO LOVES PEOPLE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Born, not bound.</text>
<text class="b" x="120" y="176" font-size="32">Temperament is a starting point, not a life sentence.</text>
<g id="tw"><g id="twf"></g><text class="m" x="120" y="510" font-size="22">TWIN STUDIES: INTROVERSION IS</text><text class="d" x="116" y="610" font-size="80" letter-spacing="-2" style="fill:var(--gain)">40–50%</text><text class="m" x="120" y="655" font-size="22">ROUGHLY HERITABLE</text></g>
<g id="paths"><path class="s-muted" d="M800 400Q760 330 680 300M800 400Q840 330 920 290M800 400V270" fill="none" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/></g>
<g id="sd"><path class="ink" d="M740 640h120l-14 80h-92z"/><path id="stem" class="s-gain" fill="none" stroke-width="8" stroke-linecap="round"/><g id="lv"><path class="gain" d="M800 470c-50 0-70-30-70-50 40 0 70 20 70 50z"/><path class="gain" d="M800 450c40-10 70-40 70-60-40 0-70 30-70 60z"/></g><text class="m" x="800" y="770" font-size="22" text-anchor="middle">A STARTING POINT</text></g>
<g id="ck"><circle class="gain" cx="1290" cy="450" r="110"/><path d="M1235 452l38 38 74-80" fill="none" stroke="var(--on-gain)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="1290" y="650" font-size="40" text-anchor="middle">Your wiring,</text><text class="d" x="1290" y="700" font-size="40" text-anchor="middle" style="fill:var(--gain)">not a weakness.</text></g>
</g>

<g id="s8" opacity="0">
<g id="mir"><ellipse class="s-ink" cx="1370" cy="200" rx="56" ry="70" fill="var(--stage)" stroke-width="7"/><path class="s-ink" d="M1370 274v56" stroke-width="12" stroke-linecap="round"/><g id="mirb"></g></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What might your early</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">sensitivity reveal about</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">how you <tspan style="fill:var(--gain)">work and rest</tspan>?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">THINK BACK: HOW DID YOU MEET NEW PLACES AS A CHILD?</text></g>
</g>