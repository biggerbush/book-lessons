<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Own everything.</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Blame no one.</text>
<text class="b" x="120" y="600" font-size="32">Why great leaders take the blame for everything that goes wrong.</text>
<ellipse class="s-ink" cx="1320" cy="370" rx="110" ry="150" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1320 520v50M1260 572h120" stroke-width="8" stroke-linecap="round"/>
<path class="s-line" d="M1260 280l40-40M1262 320l70-70" stroke-width="6" stroke-linecap="round"/>
