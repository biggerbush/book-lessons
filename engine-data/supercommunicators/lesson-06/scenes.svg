<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 6</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Who are we?</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">Identity shapes</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">hearing.</text>
<text class="b" x="120" y="630" font-size="32">Why who we are decides what we hear.</text>
<g id="spk"></g>
<g id="hear">
<path class="s-gain" d="M1090 470L1210 610" stroke-width="6" stroke-linecap="round"/>
<path class="s-loss" d="M1390 470L1270 610" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1150" y="810" font-size="22" text-anchor="middle" style="fill:var(--gain)">WISE</text>
<text class="m" x="1340" y="810" font-size="22" text-anchor="middle" style="fill:var(--loss)">INSULTING</text>
</g>
<g id="who">
<circle class="s-gain" cx="1080" cy="330" r="44" fill="none" stroke-width="5"/>
<circle class="s-loss" cx="1400" cy="330" r="44" fill="none" stroke-width="5"/>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">We are many people.</text>
<text class="b" x="120" y="176" font-size="32">Social identities: the groups that help tell us who we are.</text>
<g id="bln"></g>
<g id="fig"></g>
<g id="bdg"></g>
<g id="sid"><path class="s-gain" d="M240 660v20h1120v-20" fill="none" stroke-width="5" stroke-linecap="round"/><text class="m" x="800" y="730" font-size="26" text-anchor="middle" style="fill:var(--gain)">SOCIAL IDENTITIES</text></g>
<g id="one"><text class="d" x="800" y="820" font-size="52" text-anchor="middle">No one is just one thing.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Each identity is a lens.</text>
<text class="b" x="120" y="176" font-size="32">Before we weigh the argument, we ask what it says about us.</text>
<g id="src"></g>
<circle class="s-ink" cx="1250" cy="470" r="100" fill="var(--stage)" stroke-width="7"/>
<g id="scale2">
<path class="s-ink" d="M1250 412V524M1218 524h64M1195 428h110" fill="none" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="1250" cy="412" r="8"/>
<path class="s-ink" d="M1195 428L1177 478M1195 428L1213 478M1305 428L1287 478M1305 428L1323 478" fill="none" stroke-width="4" stroke-linecap="round"/>
<path class="ink" d="M1173 478h44a22 12 0 0 1 -44 0z"/>
<path class="ink" d="M1283 478h44a22 12 0 0 1 -44 0z"/>
</g>
<text class="m" x="1250" y="350" font-size="20" text-anchor="middle">THE ARGUMENT</text>
<g id="lens2"><ellipse id="lensE" cx="900" cy="470" rx="40" ry="150" fill="var(--gain)" fill-opacity=".15" stroke="var(--gain)" stroke-width="7"/><text class="m" x="900" y="296" font-size="22" text-anchor="middle">IDENTITY CHECK</text></g>
<g id="shield"><path class="loss" d="M1040 380l50 20v80c0 40-30 70-50 80c-20-10-50-40-50-80v-80z"/></g>
<g id="msg"><rect x="-40" y="-27" width="80" height="54" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path d="M-40 -27L0 5L40 -27" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></g>
<g id="ask"><text class="m" x="820" y="690" font-size="20" text-anchor="middle">WHAT DOES THIS SAY ABOUT PEOPLE LIKE US?</text></g>
<g id="arg"><path class="s-line" d="M1250 580V632" stroke-width="4" stroke-dasharray="6 6"/><rect class="s-line" x="1110" y="640" width="280" height="80" rx="14" fill="none" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="1250" y="688" font-size="18" text-anchor="middle">THEN THE ARGUMENT</text></g>
<g id="def"><text class="d" x="120" y="820" font-size="44">Attack the group, and we start defending.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The vaccine clash.</text>
<text class="b" x="120" y="176" font-size="32">Doctors talking with parents who doubted vaccines.</text>
<path class="s-line" d="M160 600H1440" stroke-width="5" stroke-linecap="round"/>
<g id="room"><text class="m" x="420" y="650" font-size="20" text-anchor="middle">DOCTOR</text><text class="m" x="1150" y="650" font-size="20" text-anchor="middle">PARENT</text></g>
<g id="pap"></g>
<g id="atk"><rect class="s-loss" x="940" y="226" width="420" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><text class="m" x="1150" y="266" font-size="20" text-anchor="middle" style="fill:var(--loss)">AN ATTACK ON ME AS A PARENT?</text></g>
<g id="bf"><text class="d" x="120" y="760" font-size="48">Piling on facts often backfired.</text></g>
<g id="dig"><path class="s-loss" d="M1100 500l100 30M1100 530l100-30" stroke-width="12" stroke-linecap="round"/><text class="m" x="120" y="830" font-size="24" style="fill:var(--loss)">SOME PARENTS DUG IN EVEN HARDER</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A gentler path.</text>
<text class="b" x="120" y="176" font-size="32">Sit down, ask questions, and listen.</text>
<g id="dseat"></g>
<g id="pseat"></g>
<g id="qa4"><rect class="s-ink" x="600" y="240" width="440" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><text class="m" x="820" y="280" font-size="20" text-anchor="middle">WHAT MATTERS MOST TO YOU?</text></g>
<g id="qb4"><rect class="s-ink" x="600" y="330" width="440" height="64" rx="32" fill="var(--stage)" stroke-width="4"/><text class="m" x="820" y="370" font-size="20" text-anchor="middle">WHAT WORRIES HAVE YOU HEARD?</text></g>
<text class="m" x="480" y="736" font-size="20" text-anchor="middle">DOCTOR</text>
<g id="obs"><text class="m" x="1120" y="734" font-size="26" text-anchor="middle">OBSTACLE</text></g>
<line id="obsS" class="s-ink" x1="1040" y1="725" x2="1040" y2="725" stroke-width="5" stroke-linecap="round"/>
<g id="prot"><text class="d" x="1120" y="790" font-size="44" text-anchor="middle" style="fill:var(--gain)">Thoughtful protector</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Finding common ground.</text>
<text class="b" x="120" y="176" font-size="32">What helped was a shared identity.</text>
<g id="cg"><text class="m" x="300" y="630" font-size="20" text-anchor="middle">DOCTOR</text><text class="m" x="1300" y="630" font-size="20" text-anchor="middle">PARENT</text></g>
<path class="gain" d="M800 520c-30-20-34-46-16-52c8-3 14 2 16 8c2-6 8-11 16-8c18 6 14 32-16 52z"/>
<path id="sbl" class="s-gain" d="M600 304Q420 330 330 375M1000 304Q1180 330 1270 375" fill="none" stroke-width="5" stroke-dasharray="8 8"/>
<g id="sb"><rect class="gain" x="560" y="240" width="480" height="64" rx="32"/><text class="m" x="800" y="280" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">WANTS THIS CHILD HEALTHY</text></g>
<path id="br" class="s-gain" d="M360 640Q800 800 1240 640" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="facts"></g>
<g id="ok5"><circle class="gain" cx="1390" cy="330" r="30"/><path d="M1376 330l10 10l18-20" stroke="var(--on-gain)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="land"><text class="m" x="800" y="820" font-size="24" text-anchor="middle">THE FACTS COULD FINALLY LAND</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Make identities visible.</text>
<text class="b" x="120" y="176" font-size="32">Bring them into the open instead of ignoring them.</text>
<g id="lamp"><polygon class="gain" points="380,250 460,250 640,720 200,720" fill-opacity=".18"/><path class="ink" d="M380 250l12-40h56l12 40z"/></g>
<g id="me6"></g>
<g id="pb"><rect class="gain" x="360" y="580" width="120" height="34" rx="17"/><text class="m" x="420" y="603" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">PARENT</text></g>
<g id="qt"><path class="s-ink" d="M690 340L520 450L690 380" fill="var(--stage)" stroke-width="4" stroke-linejoin="round"/><rect class="s-ink" x="680" y="250" width="780" height="160" rx="20" fill="var(--stage)" stroke-width="4"/><text class="d5" x="720" y="316" font-size="34">“As a parent myself, I can see</text><text class="d5" x="720" y="366" font-size="34">you care deeply about this.”</text></g>
<g id="oth"><text class="m" x="1380" y="720" font-size="18" text-anchor="middle">THE OTHER PERSON</text></g>
<g id="mb"></g>
<g id="nj"><text class="d" x="120" y="810" font-size="44">Not just the one causing friction.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Look for the overlap.</text>
<g id="vA"><circle class="s-ink" cx="0" cy="480" r="220" fill="var(--gain)" fill-opacity=".15" stroke-width="5"/><text class="m" x="0" y="240" font-size="24" text-anchor="middle">YOU</text></g>
<g id="vB"><circle class="s-muted" cx="0" cy="480" r="220" fill="var(--gain)" fill-opacity=".15" stroke-width="5"/><text class="m" x="0" y="240" font-size="24" text-anchor="middle">THEM</text></g>
<g id="ov0"><text class="m" x="800" y="420" font-size="18" text-anchor="middle" style="fill:var(--ink)">BOTH PARENTS</text></g>
<g id="ov1"><text class="m" x="800" y="456" font-size="18" text-anchor="middle" style="fill:var(--ink)">BOTH NEW IN TOWN</text></g>
<g id="ov2"><text class="m" x="800" y="492" font-size="18" text-anchor="middle" style="fill:var(--ink)">SAME WORRY</text></g>
<g id="hs">
<path d="M732 616L750 603" stroke="var(--muted)" stroke-width="30" stroke-linecap="round" fill="none"/>
<path d="M868 616L850 603" stroke="var(--muted)" stroke-width="30" stroke-linecap="round" fill="none"/>
<path d="M752 601L784 579" stroke="var(--gain)" stroke-width="22" stroke-linecap="round" fill="none"/>
<path d="M848 601L816 579" stroke="var(--ink)" stroke-width="22" stroke-linecap="round" fill="none"/>
<rect class="ink" x="792" y="548" width="52" height="38" rx="16"/>
<rect class="gain" x="756" y="556" width="56" height="38" rx="16"/>
<path d="M784 563v24M797 563v24" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/>
<path d="M806 560q16-14 30-6" stroke="var(--gain)" stroke-width="10" stroke-linecap="round" fill="none"/>
</g>
<g id="small"><text class="d" x="120" y="790" font-size="44">Even a small overlap counts.</text></g>
<g id="hsT"><text class="m" x="120" y="846" font-size="22" style="fill:var(--gain)">START THERE, AND HARDER TOPICS FEEL LESS LIKE A BATTLE</text></g>
</g>

<g id="s8" opacity="0">
<g id="c1"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which identity do you</text></g>
<g id="c2"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">share with the person</text></g>
<g id="c3"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">you need to <tspan style="fill:var(--gain)">talk to?</tspan></text></g>
<g id="c4"><text class="m" x="143" y="700" font-size="26">NAME IT. SAY IT OUT LOUD, EARLY ON.</text></g>
<g id="c5"><circle id="c5a" class="s-ink" cx="1250" cy="720" r="70" fill="var(--gain)" fill-opacity=".2" stroke-width="5"/><circle id="c5b" class="s-muted" cx="1350" cy="720" r="70" fill="var(--gain)" fill-opacity=".2" stroke-width="5"/></g>
</g>