<text class="d5" x="150" y="610" font-size="34">Money, praise, status</text></g>
<g id="x1r"></g>
<g id="i1"><rect class="s-line" x="840" y="220" width="640" height="420" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="270" font-size="22" style="fill:var(--gain)">TYPE I</text><g id="i1y"></g><g id="i1p"></g>
<circle class="gain" cx="1160" cy="486" r="12"/>
<text class="d5" x="870" y="610" font-size="34">The work itself</text></g>
<g id="lh"><text class="m" x="120" y="690" font-size="20">OVER THE LONG HAUL</text>
<path class="s-line" d="M120 790H1420" stroke-width="3"/>
<path id="lX" class="s-muted" d="M140 760C560 752 860 772 1300 776" fill="none" stroke-width="5" pathLength="1" stroke-dasharray="1"/>
<path id="lI" class="s-gain" d="M140 760C560 748 900 718 1300 700" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<text class="m" x="1300" y="682" font-size="20" text-anchor="end" style="fill:var(--gain)">TYPE I · HEALTHIER TOO</text>
<text class="m" x="1316" y="783" font-size="20">TYPE X</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Made, not born.</text>
<text class="b" x="120" y="176" font-size="32">Type I is a pattern of behavior, and patterns can be learned.</text>
<g id="pot"><path id="sd" class="s-gain" d="M430 680V440" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<path class="ink" d="M330 680h200l-24 110h-152z"/></g>
<path id="lf1" class="gain" d="M430 590q-70-10-90-60q70 0 90 60z"/>
<g id="lf2"><path class="gain" d="M430 510q70-10 90-60q-70 0-90 60z"/><circle class="gain" cx="430" cy="440" r="16"/>
<text class="m" x="430" y="840" font-size="20" text-anchor="middle">A PATTERN, NOT A PERSONALITY</text></g>
<g id="bat"><rect class="s-ink" x="900" y="420" width="420" height="200" rx="20" fill="var(--stage)" stroke-width="8"/>
<rect class="ink" x="1320" y="480" width="30" height="80" rx="6"/>
