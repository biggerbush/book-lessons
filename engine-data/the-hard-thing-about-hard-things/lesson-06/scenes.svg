<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE HARD THING ABOUT HARD THINGS · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Peacetime CEO</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">versus wartime CEO.</text>
<text class="b" x="120" y="600" font-size="32">Great leaders know whether they are at peace or at war.</text>
<g id="pg"><rect id="pgb" class="s-line" x="1130" y="230" width="350" height="200" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="1305" y="412" font-size="18" text-anchor="middle">BATTLE BY COMMITTEE</text></g>
<g id="pc"><rect id="pcb" class="s-line" x="1130" y="470" width="350" height="200" rx="18" fill="var(--stage)" stroke-width="4"/><text class="m" x="1305" y="652" font-size="18" text-anchor="middle">ORCHESTRA BY ORDERS</text></g>
<g id="wm"><text class="m" x="1305" y="720" font-size="22" text-anchor="middle" style="fill:var(--loss)">WRONG MOMENT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of times.</text>
<text class="b" x="120" y="176" font-size="32">Every company lives in one of two states.</text>
<g id="cs">
<rect class="s-line" x="120" y="230" width="660" height="540" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect x="122" y="600" width="656" height="150" fill="var(--loss)" fill-opacity=".08"/>
<text class="m" x="150" y="280" font-size="24" style="fill:var(--gain)">PEACETIME</text>
<path id="w0" class="s-loss" fill="none" stroke-width="4"/>
<g id="b0"></g>
<g id="gc"><text class="m" x="150" y="320" font-size="20">LEAD THE MARKET · GROW IT</text></g>
</g>
