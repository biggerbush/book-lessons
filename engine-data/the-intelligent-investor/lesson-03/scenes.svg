<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE INTELLIGENT INVESTOR · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your worst enemy</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is you.</text>
<text class="b" x="120" y="600" font-size="32">Why a calm temperament beats raw brainpower in investing.</text>
<g id="mir">
<ellipse class="s-ink" cx="1310" cy="400" rx="130" ry="190" fill="var(--stage)" stroke-width="8"/>
<path id="shine" class="s-line" d="M1220 300l40-40M1232 344l70-70" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M1310 590v90M1230 690h160" stroke-width="8" stroke-linecap="round"/>
<g id="refl"><circle class="loss" cx="1310" cy="330" r="40"/><path class="loss" d="M1250 498v-52a60 60 0 0 1 120 0v52z"/></g>
</g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Brains are not enough.</text>
<text class="b" x="120" y="176" font-size="32">What Graham saw over decades on Wall Street.</text>
<g id="chips1"></g>
<g id="b1x"><circle class="ink" cx="330" cy="480" r="44"/><path class="ink" d="M264 665v-57a66 66 0 0 1 132 0v57z"/><text class="m" x="330" y="740" font-size="20" text-anchor="middle">EXPERT</text></g>
<g id="brn"><ellipse class="s-ink" cx="330" cy="390" rx="62" ry="36" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M330 358v64M292 378q14 10 0 24M368 378q-14 10 0 24" fill="none" stroke-width="4" stroke-linecap="round"/></g>
<g id="b1c"><circle class="gain" cx="950" cy="480" r="44"/><path class="gain" d="M884 665v-57a66 66 0 0 1 132 0v57z"/><text class="m" x="950" y="740" font-size="20" text-anchor="middle">CALM TEMPERAMENT</text></g>
<path class="s-line" d="M440 700h160M1100 700h160" stroke-width="4"/>
<rect id="barE" class="ink" x="470" y="700" width="90" height="0"/>
<rect id="barC" class="gain" x="1130" y="700" width="90" height="0"/>
<g id="bl1"><text class="m" x="515" y="740" font-size="20" text-anchor="middle">WEALTH KEPT</text><text class="m" x="1175" y="740" font-size="20" text-anchor="middle">WEALTH KEPT</text></g>
<path id="bolt" class="s-loss" d="M450 290l-34 64h30l-26 70" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<g id="imp"><text class="d5" x="120" y="820" font-size="36">Knowledge didn’t protect them from their own impulses.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Graham’s warning.</text>
<g id="qc2">
<rect class="s-line" x="120" y="210" width="1360" height="230" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="gain" x="120" y="210" width="12" height="230"/>
<g id="qt2">
<text class="d5" x="170" y="300" font-size="40">“The investor’s chief problem, and even his worst</text>
<text class="d5" x="170" y="356" font-size="40">enemy, is likely to be himself.”</text>
<text class="m" x="170" y="410" font-size="20">— BENJAMIN GRAHAM</text>
</g>
</g>
<g id="sc2">
<path class="s-ink" d="M800 560V790" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="700" y="790" width="200" height="16" rx="8"/>
<line id="beam" class="s-ink" x1="460" y1="560" x2="1140" y2="560" stroke-width="8" stroke-linecap="round"/>
<g id="panL"><path class="s-ink" d="M0 0V60" stroke-width="4"/><rect class="gain" x="-120" y="60" width="240" height="70" rx="12"/><text class="m" x="0" y="103" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">TEMPERAMENT</text></g>
<g id="panR"><path class="s-ink" d="M0 0V60" stroke-width="4"/><rect class="s-ink" x="-120" y="60" width="240" height="70" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="0" y="103" font-size="22" text-anchor="middle">INTELLIGENCE</text></g>
<circle class="ink" cx="800" cy="560" r="14"/>
</g>
<g id="mk2a"><text class="b" x="120" y="790" font-size="32">The market is not your main threat.</text></g>
<g id="mk2b"><text class="d" x="120" y="842" font-size="44" style="fill:var(--gain)">Your reactions to it are.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Greed at the top.</text>
<text class="b" x="120" y="176" font-size="32">The late 1920s: prices climbed year after year.</text>
<path class="s-line" d="M160 250V760H1100" fill="none" stroke-width="4"/>
<text class="m" x="180" y="270" font-size="20">STOCK PRICES</text>
<text class="m" x="1100" y="792" font-size="20" text-anchor="end">LATE 1920s</text>
<path id="up3" class="s-ink" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="cr3"></g>
<g id="br3"><path class="s-loss" d="M1440 650H1160M1180 630l-20 20 20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1150" y="700" font-size="20">MANY BOUGHT</text><text class="m" x="1150" y="728" font-size="20">WITH BORROWED MONEY</text></g>
<g id="ne3">
<rect class="s-ink" x="1150" y="240" width="330" height="130" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M1250 368v40l40-38" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d" x="1180" y="300" font-size="40">“A new era!”</text>
<text class="m" x="1180" y="332" font-size="18">OLD RULES</text>
<text class="m" x="1180" y="356" font-size="18">NO LONGER APPLY</text>
</g>
<g id="gr3"><text class="d" x="120" y="840" font-size="36">Greed felt like confidence. Rising prices felt like proof.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fear at the bottom.</text>
<text class="b" x="120" y="176" font-size="32">The crash of 1929, then years of falling prices.</text>
<path class="s-line" d="M160 250V720H1040" fill="none" stroke-width="4"/>
<text class="m" x="180" y="270" font-size="20">STOCK PRICES</text>
<path id="dn4" class="s-loss" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="sb4">
<g id="btn4"><rect class="loss" x="1140" y="260" width="300" height="120" rx="60"/><text class="d" x="1290" y="340" font-size="56" text-anchor="middle" style="fill:var(--stage)">SELL</text></g>
<text class="m" x="1290" y="430" font-size="20" text-anchor="middle">SOLD AT THE WORST MOMENTS</text>
<text class="m" x="1290" y="462" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOSSES LOCKED IN</text>
<g id="fp4"><circle class="loss" cx="1290" cy="540" r="22"/><path class="loss" d="M1257 632v-29a33 33 0 0 1 66 0v29z"/></g>
</g>
<g id="tg4"></g>
<g id="sw4"><text class="d" x="120" y="840" font-size="36">Many swore off stocks, just when bargains were everywhere.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Exactly backwards.</text>
<text class="b" x="120" y="176" font-size="32">Greed buys after the rise. Fear sells after the fall.</text>
<path id="wv5" class="s-ink" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="lp5"><g id="lp5r"><path class="s-loss" d="M1364 270A64 64 0 1 1 1300 206" fill="none" stroke-width="8" stroke-linecap="round"/><path class="s-loss" d="M1286 188l18 18-18 18" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="bh5"><circle class="loss" cx="480" cy="300" r="18"/><text class="m" x="480" y="262" font-size="22" text-anchor="middle" style="fill:var(--loss)">GREED: BUY HIGH</text></g>
<g id="sl5"><circle class="loss" cx="1040" cy="640" r="18"/><text class="m" x="1040" y="692" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEAR: SELL LOW</text></g>
<g id="bw5">
<path class="s-muted" d="M504 300H1040" stroke-width="3" stroke-dasharray="8 10"/>
<path class="s-loss" d="M1040 312V612M1016 588l24 24 24-24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1064" y="470" font-size="22" style="fill:var(--loss)">LOSS</text>
<text class="d" x="120" y="790" font-size="44">Buy high, sell low: exactly backwards.</text>
</g>
<g id="cv5"><text class="m" x="120" y="846" font-size="22">IT HAPPENS TO CLEVER PEOPLE JUST AS OFTEN</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Intelligent is not genius.</text>
<text class="b" x="120" y="176" font-size="32">Graham’s intelligent investor is calm, not brilliant.</text>
<g id="pp6"><circle class="gain" cx="800" cy="400" r="46"/><path class="gain" d="M731 593v-60a69 69 0 0 1 138 0v60z"/><text class="m" x="800" y="630" font-size="20" text-anchor="middle">THE INTELLIGENT INVESTOR</text></g>
<g id="fc6"><circle cx="784" cy="392" r="5" fill="var(--on-gain)"/><circle cx="816" cy="392" r="5" fill="var(--on-gain)"/><path d="M780 414q20 14 40 0" fill="none" stroke="var(--on-gain)" stroke-width="4" stroke-linecap="round"/></g>
<g id="tr6"></g>
<g id="cp6">
<circle class="s-ink" cx="1290" cy="340" r="90" fill="var(--stage)" stroke-width="6"/>
<g id="nd6"><polygon class="gain" points="1290,270 1306,340 1274,340"/><polygon points="1290,410 1306,340 1274,340" fill="var(--line)"/><circle class="ink" cx="1290" cy="340" r="8"/></g>
<text class="m" x="1290" y="470" font-size="20" text-anchor="middle">THINKS FOR THEMSELVES</text>
<g id="cr6"></g>
<path class="s-muted" d="M1440 580H1150M1168 562l-18 18 18 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1290" y="630" font-size="18" text-anchor="middle">NOT THE CROWD</text>
</g>
<g id="sg6"><text class="m" x="120" y="660" font-size="20">PRICES SWING</text><polyline id="sw6" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
<g id="st6"><text class="d" x="120" y="840" font-size="44">Above all: steady when prices swing.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rules before moods.</text>
<text class="b" x="120" y="176" font-size="32">Decide your plan while you are calm.</text>
<g id="nb7">
<rect class="s-ink" x="140" y="230" width="600" height="580" rx="16" fill="var(--stage)" stroke-width="6"/>
<g id="rg7"></g>
<text class="m" x="220" y="290" font-size="20" style="fill:var(--gain)">MY PLAN</text>
<text class="m" x="220" y="380" font-size="22">WHAT I WILL BUY</text>
<text class="m" x="220" y="520" font-size="22">HOW MUCH</text>
<text class="m" x="220" y="660" font-size="22">WHY</text>
</g>
<path id="ul0" class="s-gain" d="M220 430H700" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="ul1" class="s-gain" d="M220 570H700" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="ul2" class="s-gain" d="M220 710H700" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="pn7"><path class="gain" d="M0 0l8-30 80-80 22 22-80 80z"/></g>
<g id="lb7"><text class="m" x="840" y="240" font-size="20">PRICES SOAR OR SINK</text></g>
<path id="zz7" class="s-loss" d="M840 360L940 290L1020 420L1110 270L1200 430L1290 300L1380 440L1460 280" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="fe7"><rect class="s-loss" x="840" y="500" width="640" height="110" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d5" x="880" y="570" font-size="40">Your feelings</text></g>
<path id="fx7" class="s-loss" d="M870 556H1150" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="ru7"><rect class="gain" x="840" y="650" width="640" height="110" rx="18"/><text class="d" x="880" y="720" font-size="40" style="fill:var(--on-gain)">Your written rules</text><path d="M1380 705l22 22 42-46" fill="none" stroke="var(--on-gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">Your last money decision:</text></g>
<g id="qb"><text class="d" x="136" y="440" font-size="88" letter-spacing="-2" style="fill:var(--gain)">careful thought,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">or fear and greed?</text></g>
<text class="m" x="143" y="700" font-size="26">TEMPERAMENT BEATS INTELLIGENCE</text>
<g id="sc8"><g transform="translate(1340 520)">
<path class="s-ink" d="M0 0V130" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="-60" y="130" width="120" height="12" rx="6"/>
<g id="bm8"><path class="s-ink" d="M-110 0H110M-110 0v20M110 0v20" fill="none" stroke-width="6" stroke-linecap="round"/><circle class="gain" cx="-110" cy="46" r="26"/><circle class="loss" cx="110" cy="46" r="26"/></g>
<circle class="ink" cx="0" cy="0" r="10"/>
</g></g>
</g>