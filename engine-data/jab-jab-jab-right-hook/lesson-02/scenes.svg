<g id="ck2"><rect class="s-ink" x="160" y="520" width="56" height="56" rx="10" fill="none" stroke-width="5"/><text class="d5" x="240" y="545" font-size="34">Does my post look like</text><text class="d5" x="240" y="588" font-size="34">what they came to see?</text></g>
<path id="tk2" class="s-gain" d="M172 548l14 14 28-32" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="thumb"><g id="thumbI"><rect class="ink" x="980" y="450" width="70" height="200" rx="10"/><rect class="gain" x="1080" y="280" width="76" height="200" rx="38"/><rect class="gain" x="1060" y="440" width="220" height="210" rx="34"/>
<path d="M1160 500h100M1160 550h100M1160 600h100" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/></g></g>
<g id="ctx"><text class="d" x="1150" y="760" font-size="44" text-anchor="middle">Context is on your side.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Pick one message.</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">Rewrite it twice,</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2">for <tspan style="fill:var(--gain)">two platforms.</tspan></text></g>
