<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Finish, release,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and begin again.</text>
<text class="b" x="120" y="600" font-size="32">Why finishing imperfect work keeps your creativity alive.</text>
<rect class="s-ink" x="1180" y="360" width="280" height="340" rx="10" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M1180 600h280" stroke-width="5"/>
<rect class="ink" x="1290" y="640" width="60" height="12" rx="6"/>
<g id="paper0"><g id="paper1">
<rect class="s-ink" x="1230" y="290" width="180" height="150" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M1255 320h130M1255 345h100" stroke-width="5" stroke-linecap="round"/>
<rect class="s-line" x="1255" y="365" width="130" height="14" fill="none" stroke-width="3"/>
<rect class="gain" x="1255" y="365" width="117" height="14"/>
<text class="m" x="1320" y="408" font-size="18" text-anchor="middle">ALMOST DONE</text>
</g></g>
<rect class="s-ink" x="1160" y="420" width="320" height="110" rx="8" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="1280" y="466" width="80" height="14" rx="7"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Perfect does not exist.</text>
<text class="b" x="120" y="176" font-size="32">Picture an artist polishing one piece for months.</text>
<g id="ad">
<path class="s-ink" d="M150 600H730M180 600v160M700 600v160" stroke-width="8" stroke-linecap="round"/>
<g id="art1"></g>
<rect class="s-ink" x="430" y="290" width="260" height="300" fill="var(--stage)" stroke-width="6"/>
<circle class="s-ink" cx="510" cy="370" r="30" fill="none" stroke-width="5"/>
<path class="s-ink" d="M450 570Q560 450 670 570" fill="none" stroke-width="5" stroke-linecap="round"/>
</g>
<g id="flaws"></g>
<g id="magw"><g id="mag"><circle class="s-ink" r="46" fill="var(--stage)" fill-opacity=".3" stroke-width="10"/><path class="s-ink" d="M33 33l40 40" stroke-width="14" stroke-linecap="round"/></g></g>
<g id="lp"><circle class="s-line" cx="1150" cy="480" r="170" fill="none" stroke-width="6"/><circle id="orb" class="loss" r="16"/></g>
<g id="never"><text class="d" x="120" y="800" font-size="44">The loop goes on forever, because perfect does not exist.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Unfinished feels safe.</text>
<text class="b" x="120" y="176" font-size="32">Often the real reason we keep tweaking is fear of being judged.</text>
<g id="art2"></g>
<rect class="s-ink" x="480" y="340" width="220" height="260" fill="var(--stage)" stroke-width="6" stroke-dasharray="14 10"/>
<text class="m" x="590" y="640" font-size="20" text-anchor="middle">UNFINISHED</text>
<g id="aud"></g>
<g id="shield"><path class="gain" d="M850 320l90 30v120c0 80-50 130-90 150c-40-20-90-70-90-150V350z"/><text class="m" x="850" y="480" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">SAFE</text></g>
<g id="grow"><g id="ghost"></g><text class="m" x="330" y="262" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHO YOU COULD BECOME</text>
<text class="d" x="120" y="800" font-size="44">But hiding also keeps the artist from growing.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A snapshot in time.</text>
<text class="b" x="120" y="176" font-size="32">A finished piece is a photo of who you were at that moment.</text>
<g id="pola"><g id="pol1">
<rect class="s-ink" x="200" y="520" width="220" height="250" fill="var(--stage)" stroke-width="6"/>
<rect x="220" y="540" width="180" height="170" fill="var(--line)"/>
<g id="polP"></g>
<text class="m" x="310" y="748" font-size="18" text-anchor="middle">WHO YOU WERE</text>
</g></g>
<g id="cam">
<rect class="ink" x="190" y="276" width="70" height="34" rx="6"/>
<rect class="ink" x="160" y="300" width="300" height="200" rx="24"/>
<circle cx="310" cy="400" r="64" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/>
<circle class="gain" cx="310" cy="400" r="26"/>
</g>
<g id="jr">
<rect class="s-ink" x="720" y="260" width="640" height="400" rx="12" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M1040 260v400" stroke-width="5"/>
<text class="m" x="760" y="315" font-size="22" style="fill:var(--gain)">THAT DAY</text>
<g id="jl"></g>
</g>
<g id="tl"><path class="s-line" d="M720 740H1460" stroke-width="4"/><g id="ticks"></g>
<text class="m" x="720" y="810" font-size="22">ONE ENTRY, NOT YOUR WHOLE LIFE</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The record is done.</text>
<text class="b" x="120" y="176" font-size="32">Imagine a band finishing an album.</text>
<g id="rec"><circle class="ink" cx="340" cy="470" r="190"/>
<circle cx="340" cy="470" r="160" fill="none" stroke="var(--muted)" stroke-width="2"/><circle cx="340" cy="470" r="128" fill="none" stroke="var(--muted)" stroke-width="2"/><circle cx="340" cy="470" r="96" fill="none" stroke="var(--muted)" stroke-width="2"/>
<path id="shine" d="M190 470a150 150 0 0 1 44-106" fill="none" stroke="var(--stage)" stroke-opacity=".6" stroke-width="7" stroke-linecap="round"/>
<circle class="gain" cx="340" cy="470" r="56"/><circle cx="340" cy="470" r="8" fill="var(--stage)"/></g>
<g id="mix"><rect class="s-ink" x="620" y="340" width="400" height="260" rx="16" fill="var(--stage)" stroke-width="6"/><g id="fad"></g>
<text class="m" x="620" y="645" font-size="22">ANOTHER MIX?</text></g>
<g id="cal"><rect class="s-ink" x="1100" y="330" width="340" height="300" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1100" y="330" width="340" height="70" rx="14"/>
<text id="calT" class="m" x="1270" y="374" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THIS SEASON</text><g id="grid"></g></g>
<g id="next"><text class="d" x="120" y="800" font-size="44">Next year: different people, different music.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Release makes room.</text>
<text class="b" x="120" y="176" font-size="32">Holding on to one piece is like a jar that stays full.</text>
<g id="blk"><rect class="loss" x="585" y="470" width="230" height="230" rx="10"/><text class="m" x="700" y="593" font-size="22" text-anchor="middle" style="fill:var(--stage)">OLD PIECE</text></g>
<g id="ideas"></g>
<path class="s-ink" d="M600 300h200v40l40 40v320a20 20 0 0 1-20 20H580a20 20 0 0 1-20-20V380l40-40z" fill="none" stroke-width="7" stroke-linejoin="round"/>
<g id="lid"><rect class="ink" x="680" y="262" width="40" height="18" rx="6"/><rect class="ink" x="590" y="276" width="220" height="24" rx="6"/></g>
<g id="newi"></g>
<g id="nofit"><text class="m" x="1100" y="340" font-size="22" style="fill:var(--loss)">NOTHING NEW CAN FIT</text></g>
<g id="letgo"><text class="m" x="300" y="258" font-size="24" style="fill:var(--gain)">LET IT GO</text><path class="s-gain" d="M520 300H300m18-16-18 16 18 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="flow"><path id="flowP" class="s-gain" d="M200 770H1380" stroke-width="6" stroke-dasharray="18 14" stroke-linecap="round"/><path class="s-gain" d="M1360 750l24 20-24 20" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="d" x="120" y="848" font-size="40">Finishing keeps the creative flow moving.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let it go fully.</text>
<text class="b" x="120" y="176" font-size="32">Once the work is out, it belongs to the world.</text>
<rect class="loss" x="360" y="560" width="760" height="200" fill-opacity=".1"/>
<path id="wave2" class="s-loss" fill="none" stroke-width="4"/>
<path class="s-ink" d="M120 560H360M1120 560H1480" stroke-width="8" stroke-linecap="round"/>
<g id="art6w"><g id="art6"></g></g>
<g id="boat"><path d="M-4-6V-76l52 62z" class="gain"/><path d="M-60 0h120l-28 32h-64z" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/></g>
<g id="crowd6"></g>
<g id="reacts"></g>
<g id="step"><text class="d" x="120" y="820" font-size="44">Make it as true as you can, then step back.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Begin again.</text>
<text class="b" x="120" y="176" font-size="32">The cycle closes, and then opens again.</text>
<circle class="s-line" cx="420" cy="500" r="200" fill="none" stroke-width="6"/>
<path id="arc" class="s-gain" d="M420 300a200 200 0 1 1 0 400a200 200 0 1 1 0-400" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="1257"/>
<circle id="cdot" class="gain" r="16"/>
<g id="cl0"><text class="m" x="420" y="280" font-size="22" text-anchor="middle">MAKE</text></g>
<g id="cl1"><text class="m" x="640" y="508" font-size="22">FINISH</text></g>
<g id="cl2"><text class="m" x="420" y="740" font-size="22" text-anchor="middle">RELEASE</text></g>
<g id="cl3"><text class="m" x="200" y="508" font-size="22" text-anchor="end" style="fill:var(--gain)">BEGIN</text></g>
<g id="sprW"><g id="spr"><path class="s-gain" d="M420 560V420" stroke-width="8" stroke-linecap="round"/><path class="gain" d="M420 490c-40 0-60-20-60-50 40 0 60 20 60 50zM420 465c40 0 60-20 60-50-40 0-60 20-60 50z"/><ellipse class="ink" cx="420" cy="564" rx="18" ry="12"/></g>
<text class="m" x="420" y="612" font-size="18" text-anchor="middle">WHAT YOU LEARNED</text></g>
<g id="stk"></g>
<g id="bodyL"><text class="m" x="860" y="800" font-size="22">A BODY OF WORK</text></g>
<g id="life"><text class="d" x="120" y="852" font-size="40">Never one perfect thing. A lifetime of making.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="76" letter-spacing="-2">Pick one unfinished project.</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="76" letter-spacing="-2">Set a date to call it done.</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="76" letter-spacing="-2">Then <tspan style="fill:var(--gain)">release</tspan> it.</text></g>
<g id="g8">
<rect class="s-ink" x="140" y="600" width="150" height="150" rx="12" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="140" y="600" width="150" height="40" rx="12"/>
<path class="s-gain" d="M180 695l25 25 45-50" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-muted" d="M330 675h100m-22-20 22 20-22 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="fly"><rect class="s-ink" x="470" y="610" width="110" height="130" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M490 640h70M490 665h50" stroke-width="5" stroke-linecap="round"/></g>
</g>
<g id="idea"><circle class="gain" cx="780" cy="675" r="40"/><path class="s-gain" d="M780 610v-20M832 640l16-12M728 640l-16-12M845 685h20M715 685h-20" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="880" y="684" font-size="22">NOTICE THE NEW IDEA</text></g>
<text class="m" x="143" y="830" font-size="26">THIS WEEK: FINISH, RELEASE, BEGIN AGAIN</text>
</g>