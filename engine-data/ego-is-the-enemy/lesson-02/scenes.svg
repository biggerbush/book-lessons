<g id="s0">
<text class="m" x="120" y="150" font-size="28">EGO IS THE ENEMY · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Talk less,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">work more.</text>
<text class="b" x="120" y="600" font-size="32">Why talking about your plans can quietly kill them.</text>
<circle id="glow0" class="gain" cx="1320" cy="660" r="140" fill-opacity=".22" opacity="0"/>
<g id="tp0"></g>
<g id="bub0"><path class="s-ink" d="M1180 290h260a30 30 0 0 1 30 30v100a30 30 0 0 1-30 30h-110l-30 50-10-50h-110a30 30 0 0 1-30-30v-100a30 30 0 0 1 30-30z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><path class="s-line" d="M1200 340h220M1200 390h150" stroke-width="12" stroke-linecap="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The feeling of progress.</text>
<text class="b" x="120" y="176" font-size="32">Praise arrives before a single page exists.</text>
<circle id="glow1" class="gain" cx="330" cy="540" r="120" fill-opacity=".22" opacity="0"/>
<g id="dr1"><g id="dr1p"></g>
<rect class="s-ink" x="200" y="240" width="260" height="150" rx="24" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M300 388l24 40 16-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<rect class="gain" x="285" y="270" width="90" height="90" rx="6"/><path d="M330 270v90" stroke="var(--stage)" stroke-width="4"/></g>
<g id="fr1"><g id="fr1p"></g>
<rect class="s-ink" x="560" y="300" width="320" height="90" rx="24" fill="var(--stage)" stroke-width="5"/>
<text class="d5" x="720" y="356" font-size="30" text-anchor="middle">“Sounds amazing!”</text></g>
<g id="pr1"><rect class="s-muted" x="200" y="690" width="64" height="84" rx="4" fill="none" stroke-width="4" stroke-dasharray="8 6"/>
<text class="m" x="284" y="740" font-size="20">PAGES WRITTEN: 0</text></g>
<g id="bt1"><rect class="s-ink" x="1080" y="320" width="340" height="160" rx="16" fill="var(--stage)" stroke-width="7"/>
<rect class="ink" x="1420" y="365" width="26" height="70" rx="6"/>
<rect id="bf1" x="1096" y="336" width="308" height="128" rx="8" class="gain"/>
<text class="m" x="1080" y="540" font-size="22">ENERGY FOR THE REAL WORK</text></g>
<g id="bt1t"><text class="d" x="120" y="830" font-size="44">The good feeling uses up the energy.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">A brilliant start.</text>
<text class="b" x="120" y="176" font-size="32">The writer Ralph Ellison.</text>
<g id="el2"><g id="el2p"></g><text class="m" x="300" y="700" font-size="22" text-anchor="middle">RALPH ELLISON</text></g>
<g id="nv2"><rect class="ink" x="560" y="250" width="300" height="450" rx="8"/>
<text class="d" x="590" y="340" font-size="44" style="fill:var(--stage)">Invisible</text>
<text class="d" x="590" y="392" font-size="44" style="fill:var(--stage)">Man</text>
<circle cx="710" cy="500" r="36" fill="none" stroke="var(--stage)" stroke-width="4" stroke-dasharray="8 7"/>
<path d="M656 620v-30a54 54 0 0 1 108 0v30" fill="none" stroke="var(--stage)" stroke-width="4" stroke-dasharray="8 7"/>
<text class="m" x="590" y="670" font-size="24" style="fill:var(--stage)">1952</text></g>
<g id="aw2"><polygon class="ink" points="1070,420 1040,520 1068,508 1086,532 1106,430"/><polygon class="ink" points="1130,420 1160,520 1132,508 1114,532 1094,430"/>
<circle class="gain" cx="1100" cy="370" r="66"/><circle cx="1100" cy="370" r="44" fill="none" stroke="var(--on-gain)" stroke-width="5"/>
<text class="m" x="1100" y="565" font-size="20" text-anchor="middle">NATIONAL BOOK AWARD</text></g>
<g id="rd2"><text class="m" x="1180" y="780" font-size="20" text-anchor="middle">READERS WAIT FOR MORE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The missing book.</text>
<text class="b" x="120" y="176" font-size="32">Decades on a second novel, and lots of talk.</text>
<g id="cal3"><rect class="s-ink" x="120" y="240" width="360" height="320" rx="14" fill="var(--stage)" stroke-width="6"/>
<rect class="ink" x="120" y="240" width="360" height="70" rx="14"/>
<text class="m" x="300" y="284" font-size="22" text-anchor="middle" style="fill:var(--stage)">SECOND NOVEL</text>
<g id="cc3"></g><text class="m" x="120" y="610" font-size="22">DECADES OF WORK</text></g>
<g id="bb3"></g>
<g id="ms3"><rect class="s-line" x="1100" y="280" width="280" height="340" rx="6" fill="var(--stage)" stroke-width="4"/>
<rect class="s-line" x="1085" y="295" width="280" height="340" rx="6" fill="var(--stage)" stroke-width="4"/>
<rect class="s-ink" x="1070" y="310" width="280" height="340" rx="6" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M1100 370h220M1100 410h220M1100 450h220M1100 490h120" stroke-width="8" stroke-linecap="round"/>
<path class="s-muted" d="M1100 540h220M1100 580h220" stroke-width="4" stroke-dasharray="8 10"/></g>
<g id="st3"><g transform="rotate(-12 1210 480)"><rect x="1080" y="440" width="260" height="70" rx="8" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/>
<text class="d" x="1210" y="488" font-size="34" text-anchor="middle" style="fill:var(--loss)">UNFINISHED</text></g></g>
<g id="tk3"><text class="d" x="120" y="790" font-size="44">All that talking was part of the problem.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">What research suggests.</text>
<text class="b" x="120" y="176" font-size="32">Psychologists have studied this pattern.</text>
<g id="sc4"><g id="sc4p"></g>
<path class="s-ink" d="M360 520h40M370 520v40l-30 60h100l-30-60v-40" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path class="gain" d="M352 600l-10 18h96l-10-18z"/>
<text class="m" x="290" y="690" font-size="20" text-anchor="middle">PSYCHOLOGISTS</text></g>
<g id="gc4"><rect class="s-ink" x="520" y="250" width="420" height="210" rx="16" fill="var(--stage)" stroke-width="6"/>
<path class="s-ink" d="M580 458l-20 42 52-42" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<text class="m" x="550" y="300" font-size="22">MY GOAL, ANNOUNCED</text>
<path class="s-line" d="M550 350h340M550 400h240" stroke-width="10" stroke-linecap="round"/></g>
<g id="ar4"><path class="s-loss" d="M730 490v120m-30-30 30 30 30-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="730" y="670" font-size="22" text-anchor="middle" style="fill:var(--loss)">LESS LIKELY TO ACHIEVE IT</text></g>
<g id="br4"><ellipse class="s-ink" cx="1230" cy="400" rx="160" ry="115" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1230 290v220M1110 360q30-30 60 0M1290 440q30 30 60 0M1120 450q30 20 50-10M1290 350q20-30 50 0" fill="none" stroke-width="5" stroke-linecap="round"/>
<polygon id="st4" class="gain"/>
<rect class="s-ink" x="1070" y="560" width="320" height="36" rx="18" fill="none" stroke-width="4"/>
<rect id="mf4" class="gain" x="1074" y="564" width="0" height="28" rx="14"/>
<text class="m" x="1070" y="640" font-size="20">RECOGNITION = PARTIAL REWARD</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why talk drains us.</text>
<text class="b" x="120" y="176" font-size="32">Your motivation is water in a tank.</text>
<g id="tk5"><text class="m" x="200" y="230" font-size="22">MOTIVATION</text>
<rect id="wt5" class="gain" x="208" width="324" fill-opacity=".8"/>
<path class="s-ink" d="M200 250V700H540V250" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="loss" cx="540" cy="640" r="9"/><g id="dp5"></g></g>
<g id="tb5"></g>
<g id="et5"><text class="m" x="370" y="750" font-size="22" text-anchor="middle" style="fill:var(--loss)">NEARLY EMPTY</text></g>
<g id="dk5"><g id="dk5p"></g><rect class="ink" x="1120" y="560" width="340" height="16" rx="4"/>
<path class="s-ink" d="M1140 576v124M1440 576v124" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1290" y="740" font-size="20" text-anchor="middle">THE DOING</text></g>
<g id="nf5"><path class="s-muted" d="M548 680H1170V580" fill="none" stroke-width="5" stroke-dasharray="10 10"/>
<text class="d5" x="850" y="660" font-size="36" text-anchor="middle" style="fill:var(--loss)">No fuel</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Silence is strength.</text>
<g id="wq6"><text class="b" x="120" y="176" font-size="32">Work quietly.</text>
<rect class="s-muted" x="420" y="250" width="120" height="84" rx="20" fill="none" stroke-width="5"/>
<path class="s-loss" d="M420 340L540 244" stroke-width="6" stroke-linecap="round"/></g>
<g id="dr6"><rect class="s-ink" x="140" y="250" width="240" height="450" rx="6" fill="var(--stage)" stroke-width="7"/>
<circle class="ink" cx="340" cy="490" r="12"/><rect class="gain" x="180" y="320" width="160" height="50" rx="8"/>
<text class="m" x="260" y="352" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">QUIET</text></g>
<circle id="gl6" class="gain" cx="760" cy="500" r="120" fill-opacity=".2" opacity="0"/>
<g id="dk6"><g id="ph6"></g><rect class="ink" x="600" y="580" width="340" height="16" rx="4"/>
<path class="s-ink" d="M620 596v110M920 596v110" stroke-width="8" stroke-linecap="round"/><g id="pg6"></g>
<text class="m" x="770" y="760" font-size="20" text-anchor="middle">ENERGY KEPT INSIDE</text></g>
<g id="fn6"><rect class="gain" x="1120" y="280" width="220" height="280" rx="10"/>
<text class="d" x="1230" y="432" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Finished</text>
<path class="s-gain" d="M1100 262l-24-24M1360 262l24-24M1230 252v-30" stroke-width="6" stroke-linecap="round"/></g>
<g id="pl6"><text class="m" x="1230" y="800" font-size="20" text-anchor="middle">DISCOVERED WHEN IT’S DONE</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try this instead.</text>
<text class="b" x="120" y="176" font-size="32">Write it down, then do the first small piece.</text>
<g id="nb7"><rect class="s-ink" x="140" y="260" width="340" height="400" rx="14" fill="var(--stage)" stroke-width="6"/>
<g id="nl7"></g><text class="m" x="140" y="720" font-size="22">1  WRITE IT DOWN</text></g>
<g id="tm7"><rect class="ink" x="800" y="272" width="40" height="26" rx="5"/>
<circle class="s-line" cx="820" cy="460" r="160" fill="none" stroke-width="14"/>
<path id="ar7" class="s-gain" fill="none" stroke-width="14" stroke-linecap="round"/>
<text class="d" x="820" y="478" font-size="72" text-anchor="middle">20</text>
<text class="m" x="820" y="520" font-size="22" text-anchor="middle">MINUTES</text>
<text class="m" x="660" y="720" font-size="22">2  DO THE FIRST PIECE</text></g>
<g id="sh7"><polygon id="st7" class="gain"/>
<rect class="s-ink" x="1140" y="400" width="260" height="200" rx="10" fill="var(--stage)" stroke-width="6"/>
<rect class="gain" x="1120" y="360" width="300" height="50" rx="8"/>
<text class="m" x="1120" y="720" font-size="22">3  THEN SHOW IT</text></g>
<g id="tl7"><text class="d" x="120" y="820" font-size="40">Save the telling for something real to show.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">What plan have you been</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">talking about more than</text></g>
<g id="qc"><text class="d" x="136" y="520" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">working</tspan> on?</text></g>
<g id="ql8"><text class="m" x="143" y="680" font-size="26">TODAY: STAY QUIET. TAKE ONE STEP.</text>
<path class="s-ink" d="M1180 800h70v-60h70v-60h70v-60h70" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
