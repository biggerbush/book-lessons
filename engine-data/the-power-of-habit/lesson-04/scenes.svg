<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF HABIT · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The golden rule</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of habit change.</text>
<text class="b" x="120" y="600" font-size="32">Keep the cue and reward, change the routine in between.</text>
<path id="scrib" class="s-loss" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
<g id="eras"><g id="erasM">
<rect x="-100" y="-40" width="200" height="80" rx="14" fill="var(--stage)"/>
<rect class="gain" x="-100" y="-40" width="70" height="80" rx="14"/>
<rect class="s-ink" x="-100" y="-40" width="200" height="80" rx="14" fill="none" stroke-width="6"/>
</g></g>
<g id="gn"><text class="m" x="1110" y="560" font-size="24" style="fill:var(--gain)">YOU DON’T NEED TO</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Habits never vanish.</text>
<text class="b" x="120" y="176" font-size="32">Once a habit forms, its pattern stays stored in the brain.</text>
<g id="brain">
<ellipse class="s-ink" cx="400" cy="480" rx="230" ry="170" fill="var(--stage)" stroke-width="7"/>
<path class="s-line" d="M400 315q-30 80 0 165q30 85 0 160" fill="none" stroke-width="5"/>
<text class="m" x="400" y="700" font-size="20" text-anchor="middle">STORED PATTERN</text>
</g>
<path id="groove" class="s-loss" d="M230 520c60-80 120 40 180-30s110-60 150 20" fill="none" stroke-width="14" stroke-linecap="round" pathLength="1"/>
<g id="tlg">
<path class="s-line" d="M760 640H1460" stroke-width="4"/>
<text class="m" x="840" y="390" font-size="20" text-anchor="middle">HABIT</text>
<text class="m" x="1110" y="680" font-size="20" text-anchor="middle">YEARS AWAY</text>
</g>
<path id="tl" class="s-loss" d="M760 420H920L960 600H1260L1300 420H1460" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>
<g id="back"><text class="m" x="1380" y="390" font-size="20" text-anchor="middle" style="fill:var(--loss)">ROARS BACK</text></g>
<g id="fail"><text class="d" x="120" y="800" font-size="52">So fighting a habit head on often fails.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The golden rule.</text>
<text class="b" x="120" y="176" font-size="32">Keep the cue and the reward. Change the routine.</text>
<g id="L0">
<path class="s-line" d="M1310 420Q800 860 290 420" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="800" y="690" font-size="22" text-anchor="middle">CRAVING</text>
<path class="s-muted" d="M478 340h130m-20-20 20 20-20 20M988 340h130m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect id="bc" class="s-ink" x="120" y="260" width="340" height="160" rx="20" fill="var(--stage)" stroke-width="6"/>
<text id="tc" class="d5" x="290" y="355" font-size="44" text-anchor="middle">Cue</text>
<rect id="br" class="s-ink" x="1140" y="260" width="340" height="160" rx="20" fill="var(--stage)" stroke-width="6"/>
<text id="tr" class="d5" x="1310" y="355" font-size="44" text-anchor="middle">Reward</text>
</g>
<g id="kp"><text class="m" x="290" y="400" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">KEEP</text><text class="m" x="1310" y="400" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">KEEP</text></g>
<g id="old"><rect x="630" y="260" width="340" height="160" rx="20" fill="var(--stage)" stroke="var(--loss)" stroke-width="6"/><text class="d5" x="800" y="355" font-size="44" text-anchor="middle" style="fill:var(--loss)">Old routine</text></g>
<g id="nw"><rect class="gain" x="630" y="260" width="340" height="160" rx="20"/><text class="d5" x="800" y="355" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">New routine</text></g>
<g id="sat"><text class="d" x="120" y="800" font-size="48">The habit changes. The craving is still met.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mandy’s nails.</text>
<text class="b" x="120" y="176" font-size="32">A graduate student who bit her nails until they bled.</text>
<g id="hand">
<g id="mandyP"></g>
<text class="m" x="200" y="600" font-size="22" text-anchor="middle">MANDY</text>
<g id="fing"></g>
<path d="M460 665L378 562" fill="none" stroke="var(--ink)" stroke-width="58" stroke-linecap="round"/>
<path d="M460 665L378 562" fill="none" stroke="var(--stage)" stroke-width="46" stroke-linecap="round"/>
<rect x="420" y="470" width="260" height="250" rx="50" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<path d="M428 596L476 650" fill="none" stroke="var(--stage)" stroke-width="40" stroke-linecap="butt"/>
<path class="s-ink" d="M440 600q20 20 32 50" fill="none" stroke-width="4" stroke-linecap="round" opacity=".5"/>
</g>
<g id="tens"></g>
<g id="burst"></g>
<g id="r3c"><text class="m" x="820" y="330" font-size="22">THE CUE</text><text class="d5" x="820" y="385" font-size="40">Tension in her fingertips</text></g>
<g id="r3b"><text class="m" x="820" y="470" font-size="22">THE OLD ROUTINE</text><text class="d5" x="820" y="525" font-size="40" style="fill:var(--loss)">Biting her nails</text></g>
<g id="r3r"><text class="m" x="820" y="610" font-size="22">THE REWARD</text><text class="d5" x="820" y="665" font-size="38" style="fill:var(--gain)">A quick burst of stimulation</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A competing response.</text>
<text class="b" x="120" y="176" font-size="32">Same cue, same reward, a new routine in between.</text>
<g id="pA"><rect class="s-line" x="120" y="230" width="420" height="260" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-ink" d="M200 262H460L472 440H352L330 330L308 440H188Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
