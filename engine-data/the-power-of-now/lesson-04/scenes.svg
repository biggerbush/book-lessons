<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE POWER OF NOW · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The only moment</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you have.</text>
<text class="b" x="120" y="600" font-size="32">Your problems live in time, but your life is always now.</text>
<g id="clk"><circle class="s-ink" cx="1300" cy="380" r="140" fill="var(--stage)" stroke-width="8"/><g id="ticks"></g>
<path id="hh" class="s-ink" d="M1300 380V300" stroke-width="10" stroke-linecap="round"/>
<path id="mh" class="s-muted" d="M1300 380V270" stroke-width="6" stroke-linecap="round"/>
<circle id="nowd" class="gain" cx="1300" cy="380" r="16"/></g>
<g id="nowl"><text class="m" x="1300" y="580" font-size="24" text-anchor="middle" style="fill:var(--gain)">NOW</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two different things.</text>
<text class="b" x="120" y="176" font-size="32">What we usually blur together.</text>
<g id="ca"><circle class="s-ink" r="120" fill="none" stroke-width="6"/><path class="s-muted" d="M-80 0H80" stroke-width="4"/><circle class="ink" cx="-60" r="10"/><circle class="ink" r="10"/><circle class="ink" cx="60" r="10"/><text class="m" y="164" font-size="22" text-anchor="middle">LIFE SITUATION</text></g>
<g id="cb"><circle id="cbc" class="s-ink" r="120" fill="none" stroke-width="6"/><circle class="gain" r="22"/><text class="m" y="164" font-size="22" text-anchor="middle">LIFE</text></g>
<g id="tl"><path class="s-line" d="M160 680H1440" stroke-width="6" stroke-linecap="round"/><path class="s-line" d="M184 664l-24 16 24 16M1416 664l24 16-24 16" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g id="tdots"></g>
<path class="s-muted" d="M460 565V655" stroke-width="3" stroke-dasharray="6 8"/>
<text class="m" x="160" y="730" font-size="22">PAST</text><text class="m" x="1440" y="730" font-size="22" text-anchor="end">FUTURE</text></g>
<g id="gd"><path class="s-gain" d="M1140 565L815 662" stroke-width="3" stroke-dasharray="6 8"/><circle id="gdot" class="gain" cx="800" cy="680" r="18"/><text class="m" x="800" y="740" font-size="22" text-anchor="middle" style="fill:var(--gain)">NOW</text></g>
<g id="q1"><text class="d5" x="120" y="820" font-size="36">“Your life situation exists in time. Your life is now.”</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The heavy backpack.</text>
<text class="b" x="120" y="176" font-size="32">We carry our life situation everywhere.</text>
<g id="carry"><g id="bod"><rect class="loss" x="520" y="430" width="160" height="170" rx="28"/><path d="M545 470h110" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="press"></g>
<g id="tags"></g>
<g id="cap2"><text class="d" x="120" y="760" font-size="52">We call all of it our <tspan style="fill:var(--loss)">problems</tspan>.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Do you have a problem?</text>
<text class="b" x="120" y="176" font-size="32">Tolle’s simple test.</text>
<g id="qm"><text id="qmt" class="d" x="140" y="640" font-size="360" style="fill:var(--loss)">?</text></g>
<g id="ask"><text class="d5" x="460" y="300" font-size="46">What problem do I have right now?</text></g>
<g id="chips3"></g>
<g id="hnd">
<rect class="s-muted" x="540" y="470" width="400" height="290" rx="20" fill="none" stroke-width="4" stroke-dasharray="12 10"/>
<text class="m" x="740" y="512" font-size="22" text-anchor="middle" style="fill:var(--gain)">RIGHT NOW</text>
<rect class="ink" x="690" y="562" width="22" height="80" rx="11"/>
<rect class="ink" x="716" y="548" width="22" height="94" rx="11"/>
<rect class="ink" x="742" y="552" width="22" height="90" rx="11"/>
<rect class="ink" x="768" y="568" width="22" height="74" rx="11"/>
<rect class="ink" x="650" y="622" width="24" height="72" rx="12" transform="rotate(-35 662 658)"/>
<rect class="ink" x="688" y="615" width="104" height="96" rx="28"/>
<rect class="ink" x="708" y="700" width="64" height="40" rx="6"/>
</g>
<g id="nos"><text class="d" x="1040" y="640" font-size="40">Nothing needs</text><text class="d" x="1040" y="690" font-size="40">solving <tspan style="fill:var(--gain)">right now</tspan>.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Situations, not problems.</text>
<text class="b" x="120" y="176" font-size="32">Deal with it now, or accept it for now.</text>
<g id="pole"><rect class="ink" x="390" y="276" width="20" height="484"/><path class="s-ink" d="M320 760h160" stroke-width="8" stroke-linecap="round"/></g>
<g id="sit"><rect class="s-ink" x="290" y="220" width="220" height="56" rx="28" fill="var(--stage)" stroke-width="5"/><text class="m" x="400" y="256" font-size="22" text-anchor="middle">SITUATION</text></g>
<g id="a1"><polygon class="gain" points="410,320 760,320 800,355 760,390 410,390"/><text class="m" x="430" y="364" font-size="22" style="fill:var(--on-gain)">DEAL WITH IT NOW</text></g>
<g id="a2"><polygon points="390,440 150,440 120,475 150,510 390,510" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="378" y="482" font-size="20" text-anchor="end">ACCEPT IT FOR NOW</text></g>
<g id="mind"><path class="s-line" d="M900 660H1460" stroke-width="5" stroke-linecap="round"/><g id="ghosts"></g>
<path id="drg" class="s-loss" fill="none" stroke-width="3" stroke-dasharray="6 8"/>
<rect id="sq" class="ink" y="600" width="60" height="60" rx="8"/>
<text class="m" x="900" y="700" font-size="20">PAST</text><text class="m" x="1460" y="700" font-size="20" text-anchor="end">FUTURE</text></g>
<g id="cloud"><path d="M1060 440a55 55 0 0 1 10-108a75 75 0 0 1 140-36a65 65 0 0 1 120 46a52 52 0 0 1-10 98z" fill="var(--stage)" stroke="var(--loss)" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1195" y="400" font-size="28" text-anchor="middle" style="fill:var(--loss)">PROBLEM</text></g>
<g id="cap4"><text class="d" x="120" y="830" font-size="40">A problem is a situation dragged through time.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Danger brings you here.</text>
<text class="b" x="120" y="176" font-size="32">Risk pulls some people fully into the present.</text>
<g id="mtn"><path d="M140 720L380 300L620 720Z" fill="var(--line)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
<path d="M380 300L330 388l25-10 25 20 25-20 25 10z" fill="var(--stage)"/>
<path class="s-ink" d="M380 300V236" stroke-width="5" stroke-linecap="round"/><path class="gain" d="M380 236h44l-12 14 12 14h-44z"/><g id="clb"></g></g>
<g id="car"><g id="carb"><path class="s-muted" d="M610 620h50M625 645h40M610 670h50" stroke-width="5" stroke-linecap="round"/>
<path class="ink" d="M770 612l50-50h130l50 50z"/><rect x="826" y="576" width="118" height="30" rx="6" fill="var(--stage)"/>
<rect class="ink" x="690" y="610" width="360" height="56" rx="22"/>
<circle cx="780" cy="676" r="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/><circle cx="960" cy="676" r="30" fill="var(--stage)" stroke="var(--ink)" stroke-width="10"/></g></g>
<g id="nrw"><text class="m" x="870" y="520" font-size="22" text-anchor="middle">NO ROOM FOR WORRY</text></g>
<g id="face"><circle id="fring" class="s-gain" cx="1300" cy="430" r="140" fill="none" stroke-width="4" stroke-dasharray="10 10"/><circle class="gain" cx="1300" cy="430" r="110"/>
<path d="M1250 410q15 12 30 0M1320 410q15 12 30 0M1260 465q40 30 80 0" fill="none" stroke="var(--on-gain)" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="1300" y="626" font-size="20" text-anchor="middle">SAME ALIVENESS,</text><text class="m" x="1300" y="656" font-size="20" text-anchor="middle" style="fill:var(--gain)">NO RISK</text></g>
<g id="alive"><text class="d" x="120" y="810" font-size="44">Danger forces them into the <tspan style="fill:var(--gain)">present</tspan>.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small steps only.</text>
<text class="b" x="120" y="176" font-size="32">The future never actually arrives.</text>
<g id="stp"></g>
<g id="fut"><rect class="s-muted" x="1290" y="180" width="180" height="64" rx="32" fill="none" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="1380" y="220" font-size="22" text-anchor="middle">FUTURE</text></g>
<path id="hop" class="s-gain" d="M250 580Q330 500 400 556m-20 0 20 0 0-20" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>
<g id="wk"><g id="wki"></g></g>
<g id="act"><text class="d" x="120" y="840" font-size="44">Take the one action this moment allows.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Lighten the load.</text>
<text class="b" x="120" y="176" font-size="32">Put the backpack down a few times a day.</text>
<g id="sun"><g id="rays"></g></g>
<path class="s-line" d="M200 600H960" stroke-width="5" stroke-linecap="round"/>
<g id="bp7"><rect class="loss" width="140" height="130" rx="24"/><path d="M24 34h92" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/></g>
<g id="me"></g>
<circle id="brth" class="s-gain" cx="520" cy="450" r="160" fill="none" stroke-width="4"/>
<g id="lst"></g>
<g id="cap7"><text class="d" x="120" y="790" font-size="44">Return to where your life is <tspan style="fill:var(--gain)">happening</tspan>.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="m" x="143" y="250" font-size="28">NEXT TIME YOU FEEL OVERWHELMED, PAUSE AND ASK:</text></g>
<g id="qb"><text class="d" x="136" y="380" font-size="88" letter-spacing="-2">What problem do I have</text></g>
<g id="qc"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">right now</tspan>?</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">THEN SEE WHAT IS TRULY IN FRONT OF YOU</text></g>
<g id="rg"></g>
<circle class="gain" cx="1300" cy="600" r="26"/>
</g>