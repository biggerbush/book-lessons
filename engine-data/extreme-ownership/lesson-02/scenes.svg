<g id="s0">
<text class="m" x="120" y="150" font-size="28">EXTREME OWNERSHIP · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">No bad teams,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">only bad leaders.</text>
<text class="b" x="120" y="600" font-size="32">Same team, new leader, completely different results.</text>
<g id="tcrew"><g id="tb0"></g><g id="tb1"></g></g>
<g id="tlab"><text class="m" x="1080" y="300" font-size="20" style="fill:var(--gain)">KEEPS WINNING</text><text class="m" x="1080" y="490" font-size="20" style="fill:var(--loss)">KEEPS LOSING</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hell Week.</text>
<text class="b" x="120" y="176" font-size="32">SEAL training, on a cold beach.</text>
<g id="beachg"><rect x="120" y="690" width="1360" height="60" fill="var(--line)"/><path id="sea" class="loss" fill-opacity=".2"/></g>
