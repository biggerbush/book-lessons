<g id="s0">
<text class="m" x="120" y="150" font-size="28">MINDSET · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Failure as verdict,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">or as information?</text>
<text class="b" x="120" y="600" font-size="32">The same setback can feel like a judgement or a lesson.</text>
<rect class="s-ink" x="1140" y="230" width="280" height="360" rx="10" fill="var(--stage)" stroke-width="6"/>
<text class="m" x="1170" y="276" font-size="20">TEST</text>
