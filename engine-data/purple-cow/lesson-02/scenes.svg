<text class="d" x="1360" y="460" font-size="64" text-anchor="middle" style="fill:var(--muted)">?</text>
<text class="m" x="1360" y="560" font-size="22" text-anchor="middle" style="fill:var(--loss)">NOBODY NOTICES</text>
</g>
<g id="bulb">
<g id="rays"></g>
<circle class="gain" cx="220" cy="710" r="60"/><rect class="ink" x="194" y="764" width="52" height="40" rx="8"/>
<text class="d" x="340" y="720" font-size="48">Attention must come from</text>
<text class="d" x="340" y="784" font-size="48" style="fill:var(--gain)">the product itself.</text>
</g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">With zero advertising,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">would anyone <tspan style="fill:var(--gain)">notice</tspan></text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">your product?</text></g>
<g id="fix8"><text class="m" x="143" y="700" font-size="26">IF NOT, FIX THE PRODUCT BEFORE THE NEXT AD</text></g>
