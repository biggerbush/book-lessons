<g id="s0">
<text class="m" x="120" y="150" font-size="28">DRIVE · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Purpose: working for</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">something bigger.</text>
<text class="b" x="120" y="600" font-size="32">Why meaningful goals beat money goals for lasting motivation.</text>
<g id="t_ring"><circle id="t_rc" class="s-gain" cx="1330" cy="380" r="130" fill="none" stroke-width="8" stroke-dasharray="20 16" stroke-linecap="round"/></g>
<g id="t_fig"></g>
<g id="t_ticks"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Purpose is the third partner.</text>
<text class="b" x="120" y="176" font-size="32">Autonomy and mastery work best alongside it.</text>
<g id="stw"><g id="stool">
<path class="s-ink" d="M300 360L270 640M480 360V640" stroke-width="14" stroke-linecap="round"/>
