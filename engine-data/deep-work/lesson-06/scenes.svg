<g id="l2"><text class="m" x="1440" y="810" font-size="22" text-anchor="end" style="fill:var(--gain)">MANY MONTHS = DEEP</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Set a shallow budget.</text>
<text class="b" x="120" y="176" font-size="32">Ask: what share of my time should go to shallow work?</text>
