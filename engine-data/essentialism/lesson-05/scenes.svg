<path class="s-line" d="M820 700H1480" stroke-width="4"/>
<g id="mny7"><text class="m" x="840" y="300" font-size="18">A LITTLE TO MANY</text><g id="many7"></g></g>
<g id="few7"><text class="m" x="1180" y="300" font-size="18" style="fill:var(--gain)">EVERYTHING TO THE FEW</text>
<rect id="fb0" class="gain" x="1210" y="700" width="80" height="0"/><rect id="fb1" class="gain" x="1330" y="700" width="80" height="0"/></g>
