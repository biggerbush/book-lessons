<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE LET THEM THEORY · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Turn comparison</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">into direction.</text>
<text class="b" x="120" y="600" font-size="32">Let their success point you toward your own next step.</text>
<rect class="s-ink" x="1180" y="220" width="240" height="440" rx="32" fill="var(--stage)" stroke-width="7"/>
<path class="s-ink" d="M1270 250h60" stroke-width="6" stroke-linecap="round"/>
<g id="scr">
<rect class="gain" x="1204" y="290" width="192" height="130" rx="14"/>
<path d="M1300 318l9 20 22 2-17 14 5 22-19-12-19 12 5-22-17-14 22-2z" fill="var(--on-gain)"/>
<text class="m" x="1300" y="402" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">BIG NEWS</text>
<rect x="1204" y="440" width="192" height="60" rx="12" fill="var(--line)"/>
<rect x="1204" y="520" width="192" height="60" rx="12" fill="var(--line)"/>
</g>
<g id="hrt"><path id="hrtP" class="gain" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The moment it hits.</text>
<text class="b" x="120" y="176" font-size="32">A friend gets the promotion you were quietly hoping for.</text>
<g id="fr"><g id="frP"></g><rect class="gain" x="260" y="620" width="200" height="56" rx="28"/><text class="m" x="360" y="655" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">PROMOTED</text></g>
<g id="frB"><rect class="s-ink" x="440" y="240" width="380" height="80" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="466" y="291" font-size="28">I got the promotion!</text></g>
<g id="you"><g id="youP"></g><text class="m" x="1000" y="672" font-size="20" text-anchor="middle">YOU</text></g>
<g id="rep"><rect class="s-ink" x="620" y="460" width="240" height="76" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="646" y="509" font-size="30">Congrats!</text></g>
<g id="knot"><path d="M960 560c20-30 60-30 70 0s-40 40-60 10 30-40 50-10-20 30-40 10" fill="none" stroke="var(--loss)" stroke-width="7" stroke-linecap="round"/></g>
<g id="th0"><circle class="s-line" cx="1068" cy="362" r="8" fill="none" stroke-width="4"/><circle class="s-line" cx="1092" cy="336" r="12" fill="none" stroke-width="4"/><rect class="s-loss" x="1120" y="250" width="330" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1146" y="301" font-size="34">Why them?</text></g>
<g id="th1"><rect class="s-loss" x="1120" y="350" width="330" height="76" rx="38" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1146" y="401" font-size="34">Why not me?</text></g>
<g id="spi"></g>
<g id="jud"><text class="d" x="120" y="790" font-size="46">It feels like a judgment on your own life.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Comparison makes us feel behind.</text>
<text class="b" x="120" y="176" font-size="32">Mel Robbins: it feels like someone just passed you.</text>
<g id="trk">
<path class="s-line" d="M120 285H1000M120 405H1000M120 520H1000" stroke-width="4"/>
<path class="s-muted" d="M1000 285V520" stroke-width="4" stroke-dasharray="8 8"/>
<g id="rT"><circle class="gain" cx="0" cy="350" r="26"/><text class="m" x="0" y="314" font-size="18" text-anchor="middle">THEM</text></g>
<g id="rY"><circle class="ink" cx="0" cy="460" r="26"/><text class="m" x="0" y="424" font-size="18" text-anchor="middle">YOU</text></g>
</g>
<g id="pie"><circle class="s-ink" cx="1250" cy="420" r="140" fill="var(--line)" stroke-width="6"/><path id="slc" class="gain" d="M1250 420L1250 280A140 140 0 0 1 1371.2 350Z" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="pieT"><text class="d" x="120" y="700" font-size="44">As if their success took a slice of ours.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Success is not a pie.</text>
<g id="sub3"><text class="b" x="120" y="176" font-size="32">There is enough success to go around for everyone.</text></g>
<g id="npie"><circle class="s-ink" cx="1380" cy="150" r="40" fill="var(--line)" stroke-width="5"/><path class="s-ink" d="M1380 150V110M1380 150l34 20" stroke-width="5"/><path class="s-loss" d="M1346 116l68 68" stroke-width="8" stroke-linecap="round"/></g>
<g id="tbl"><rect class="ink" x="120" y="440" width="880" height="16" rx="8"/><rect class="ink" x="150" y="456" width="14" height="100"/><rect class="ink" x="956" y="456" width="14" height="100"/><path class="s-line" d="M1012 448h90" stroke-width="6" stroke-dasharray="10 10"/></g>
<g id="seats"></g>
<g id="lbl3"><text class="m" x="400" y="500" font-size="20" text-anchor="middle" style="fill:var(--gain)">FRIEND</text><text class="m" x="640" y="500" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU</text></g>
<g id="door"><rect class="gain" x="1166" y="286" width="208" height="348" fill-opacity=".35"/><rect class="s-ink" x="1160" y="280" width="220" height="360" fill="none" stroke-width="7"/><g id="dp"><rect class="s-ink" x="1166" y="286" width="208" height="348" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="1350" cy="470" r="9"/></g><text class="m" x="1270" y="690" font-size="20" text-anchor="middle">THE DOOR YOU WANT</text></g>
<g id="cnl"><text class="d" x="120" y="800" font-size="46">Their promotion doesn’t cancel yours.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let them win.</text>
<g id="sub4"><text class="b" x="120" y="176" font-size="32">Their timeline was never yours to control.</text></g>
<g id="ltS"><rect class="gain" x="120" y="220" width="420" height="100" rx="18"/><text class="d" x="150" y="292" font-size="60" style="fill:var(--on-gain)">LET THEM</text></g>
<g id="lc0"><rect class="s-ink" x="120" y="350" width="520" height="60" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="146" y="391" font-size="32">…get promoted.</text></g>
<g id="lc1"><rect class="s-ink" x="120" y="430" width="520" height="60" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="146" y="471" font-size="32">…buy the house.</text></g>
<g id="lc2"><rect class="s-ink" x="120" y="510" width="520" height="60" rx="14" fill="var(--stage)" stroke-width="4"/><text class="d5" x="146" y="551" font-size="32">…move faster.</text></g>
<g id="bat"><rect class="s-ink" x="120" y="620" width="280" height="90" rx="12" fill="none" stroke-width="6"/><rect class="ink" x="400" y="645" width="16" height="40" rx="4"/><rect id="batF" class="loss" x="132" y="632" width="256" height="66" rx="6"/><text class="m" x="120" y="750" font-size="20">CATCHING UP DRAINS YOU</text></g>
<g id="clocks"></g>
<g id="clk"><text class="d" x="1150" y="700" font-size="36" text-anchor="middle">Your life runs on its own clock.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Envy is a signal.</text>
<text class="b" x="120" y="176" font-size="32">A teacher, not an enemy.</text>
<g id="comp"><circle class="s-ink" cx="450" cy="480" r="170" fill="var(--stage)" stroke-width="7"/><circle class="s-line" cx="450" cy="480" r="130" fill="none" stroke-width="3"/>
<text class="m" x="450" y="340" font-size="22" text-anchor="middle">N</text><text class="m" x="602" y="488" font-size="22" text-anchor="middle">E</text><text class="m" x="298" y="488" font-size="22" text-anchor="middle">W</text><text class="m" x="450" y="638" font-size="22" text-anchor="middle">S</text>
<g id="ndl"><path class="gain" d="M450 370L466 480H434Z"/><path d="M450 590L466 480H434Z" fill="var(--muted)"/><circle class="ink" cx="450" cy="480" r="10"/></g></g>
<g id="cpl"><text class="m" x="450" y="710" font-size="22" text-anchor="middle">IT POINTS AT WHAT YOU WANT</text></g>
<g id="spot"><polygon class="gain" points="1118,264 1182,264 1330,640 970,640" fill-opacity=".2"/><rect class="ink" x="1110" y="220" width="80" height="44" rx="10"/>
<rect class="gain" x="1075" y="580" width="40" height="60"/><rect class="gain" x="1125" y="530" width="40" height="110"/><rect class="gain" x="1175" y="480" width="40" height="160"/>
<text class="m" x="1150" y="690" font-size="22" text-anchor="middle">MORE GROWTH AT WORK</text></g>
<g id="ctx"><text class="d" x="120" y="810" font-size="50">Comparison becomes <tspan style="fill:var(--gain)">directions</tspan>.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Then, let me.</text>
<text class="b" x="120" y="176" font-size="32">Turn the feeling into your own next move.</text>
<g id="lmS"><rect class="gain" x="120" y="230" width="380" height="100" rx="18"/><text class="d" x="150" y="302" font-size="60" style="fill:var(--on-gain)">LET ME</text></g>
<g id="lm0"><text class="d5" x="120" y="400" font-size="34">…get clear on what I want.</text></g>
<g id="lm1"><text class="d5" x="120" y="460" font-size="34">…take one small step today.</text></g>
<g id="ask"><text class="m" x="120" y="550" font-size="20">ASK YOUR MANAGER</text><rect class="s-ink" x="120" y="570" width="620" height="90" rx="20" fill="var(--stage)" stroke-width="5"/><text class="d5" x="146" y="625" font-size="28">“What does the next level require?”</text></g>
<g id="stp"><path d="M800 700h120v-80h120v-80h120v-80h120v-80h120V700Z" fill="var(--line)"/><path class="s-ink" d="M800 700h120v-80h120v-80h120v-80h120v-80h120" fill="none" stroke-width="6" stroke-linejoin="round"/><path class="s-ink" d="M1370 380V280" stroke-width="5"/><path class="gain" d="M1370 280l60 22-60 22z"/></g>
<g id="clm"></g>
<g id="nud"><text class="d" x="120" y="800" font-size="46">Their win becomes your nudge to move.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let go of the rest.</text>
<text class="b" x="120" y="176" font-size="32">Some comparisons point to things you cannot change.</text>
<g id="zone"><text class="m" x="440" y="266" font-size="22" text-anchor="middle" style="fill:var(--muted)">OUTSIDE YOUR CONTROL</text><circle class="s-loss" cx="440" cy="480" r="190" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<g id="lgo">
<g id="dc0"><rect class="s-ink" x="376" y="330" width="56" height="56" rx="10" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="390" cy="344" r="5"/><circle class="ink" cx="404" cy="358" r="5"/><circle class="ink" cx="418" cy="372" r="5"/></g>
<g id="dc1"><rect class="s-ink" x="448" y="330" width="56" height="56" rx="10" fill="var(--stage)" stroke-width="5"/><circle class="ink" cx="462" cy="344" r="5"/><circle class="ink" cx="490" cy="344" r="5"/><circle class="ink" cx="476" cy="358" r="5"/><circle class="ink" cx="462" cy="372" r="5"/><circle class="ink" cx="490" cy="372" r="5"/></g>
<g id="l0"><text class="m" x="440" y="420" font-size="22" text-anchor="middle" style="fill:var(--muted)">LUCK</text></g>
<g id="l1">
<path class="s-ink" d="M300 524h110" stroke-width="6" stroke-linecap="round"/>
<path class="s-ink" d="M318 524V448" stroke-width="6" stroke-linecap="round"/>
<path class="ink" d="M321 448h62l-14 16 14 16h-62z"/>
<rect x="333" y="454" width="12" height="10" fill="var(--stage)"/><rect x="357" y="454" width="12" height="10" fill="var(--stage)"/>
<rect x="345" y="464" width="12" height="10" fill="var(--stage)"/>
<path class="s-ink" d="M380 524V500" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="360" y="560" font-size="22" text-anchor="middle" style="fill:var(--muted)">STARTING</text><text class="m" x="360" y="586" font-size="22" text-anchor="middle" style="fill:var(--muted)">POINT</text></g>
<g id="l2">
<circle class="s-ink" cx="520" cy="485" r="32" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M520 485V463M520 485l-14 10" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M520 437A48 48 0 1 0 568 485" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M558 495L568 483L578 495" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="520" y="572" font-size="22" text-anchor="middle" style="fill:var(--muted)">PAST</text></g>
</g></g>
<g id="hand"><g id="fist"><rect class="ink" x="400" y="770" width="80" height="80" rx="24"/><path d="M412 795h56M412 818h56" stroke="var(--stage)" stroke-width="4"/></g>
<g id="opn"><rect class="ink" x="405" y="785" width="70" height="65" rx="18"/><path class="s-ink" d="M415 790V742M435 788V732M455 788V734M475 790V746M408 824l-30-30" stroke-width="14" stroke-linecap="round"/></g></g>
<path class="s-line" d="M960 700h380" stroke-width="5"/>
<g id="blk"></g>
<g id="kee"><text class="m" x="1150" y="760" font-size="22" text-anchor="middle">KEEP YOUR ENERGY FOR WHAT YOU CAN BUILD</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="260" font-size="76" letter-spacing="-2">Whose success stung</text></g>
<g id="qb"><text class="d" x="136" y="350" font-size="76" letter-spacing="-2">you recently?</text></g>
<g id="qc"><text class="d" x="136" y="470" font-size="76" letter-spacing="-2">What is it pointing to,</text></g>
<g id="qd"><text class="d" x="136" y="560" font-size="76" letter-spacing="-2">and what <tspan style="fill:var(--gain)">small step</tspan></text></g>
<g id="qe"><text class="d" x="136" y="650" font-size="76" letter-spacing="-2">will you take this week?</text></g>
<text class="m" x="143" y="750" font-size="26">LET THEM. THEN, LET ME.</text>
<circle class="s-ink" cx="1340" cy="440" r="90" fill="var(--stage)" stroke-width="7"/>
<g id="qn"><path class="gain" d="M1340 370L1354 440H1326Z"/><path d="M1340 510L1354 440H1326Z" fill="var(--muted)"/><circle class="ink" cx="1340" cy="440" r="8"/></g>
</g>