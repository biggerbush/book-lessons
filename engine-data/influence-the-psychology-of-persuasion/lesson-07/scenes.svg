<g id="s2l0"><text class="m" x="480" y="690" font-size="22" text-anchor="middle">10 COOKIES</text></g>
<g id="s2l1"><text class="m" x="1120" y="690" font-size="22" text-anchor="middle">ONLY 2</text></g>
