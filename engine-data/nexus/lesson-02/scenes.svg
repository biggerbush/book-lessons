<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEXUS · LESSON 2</text>
<text class="d" x="116" y="340" font-size="84" letter-spacing="-2">Information</text>
<text class="d" x="116" y="436" font-size="84" letter-spacing="-2">connects more</text>
<text class="d" x="116" y="532" font-size="84" letter-spacing="-2">than it informs.</text>
<text class="b" x="120" y="620" font-size="32">Why a story can unite millions without being true</text>
<g id="sky0"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Information as a mirror?</text>
<text class="b" x="120" y="176" font-size="32">The picture most of us carry around.</text>
<g id="mir">
<g id="wld"><circle class="s-ink" cx="270" cy="470" r="110" fill="var(--stage)" stroke-width="6"/><path class="loss" d="M215 430c20-40 70-30 80 0s-20 50-50 50-40-20-30-50zM280 520c20-10 50 0 45 25s-35 20-45 5z"/></g>
<path class="s-muted" d="M400 470h50m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse class="s-ink" cx="590" cy="460" rx="100" ry="150" fill="var(--stage)" stroke-width="7"/>
<use href="#wld" transform="translate(590 460) scale(-.6 .6) translate(-270 -470)" opacity=".7"/>
<path class="s-ink" d="M590 610v70M540 690h100" stroke-width="7" stroke-linecap="round"/>
<text class="m" x="430" y="760" font-size="22" text-anchor="middle">A MIRROR</text>
</g>
<g id="map1">
<path class="s-ink" d="M820 320L1040 290L1260 320L1470 290V650L1260 680L1040 650L820 680Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M1040 290V650M1260 320V680" stroke-width="4"/>
<path class="s-line" d="M850 420q120-60 240 20t240-20 110 30" fill="none" stroke-width="10" stroke-linecap="round"/>
<path class="s-gain" d="M880 600C960 520 1060 600 1140 520S1300 420 1380 400" fill="none" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>
<circle class="gain" cx="1380" cy="400" r="16"/>
<text class="m" x="1145" y="740" font-size="22" text-anchor="middle">AN ACCURATE MAP</text>
</g>
<g id="xs1"></g>
<g id="wr1"><text class="d" x="120" y="840" font-size="52">Harari: this picture is <tspan style="fill:var(--loss)">mostly wrong.</tspan></text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Information connects.</text>
<text class="b" x="120" y="176" font-size="32">It links separate points into a network.</text>
<g id="net2"></g>
<g id="cam">
<rect class="s-muted" x="1080" y="320" width="320" height="200" rx="22" fill="none" stroke-width="6"/>
<rect class="s-muted" x="1120" y="288" width="90" height="32" rx="8" fill="none" stroke-width="6"/>
<circle class="s-muted" cx="1240" cy="420" r="64" fill="none" stroke-width="6"/>
<circle class="s-muted" cx="1240" cy="420" r="28" fill="none" stroke-width="6"/>
<path class="s-loss" d="M1060 290L1420 550M1420 290L1060 550" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="1240" y="610" font-size="22" text-anchor="middle">NOT A CAMERA</text>
<text class="m" x="1240" y="645" font-size="22" text-anchor="middle" style="fill:var(--gain)">A THREAD</text>
</g>
<g id="exc2"><text class="d5" x="120" y="840" font-size="40">Mirroring reality is the exception, not the rule.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The astrologer.</text>
<text class="b" x="120" y="176" font-size="32">For centuries, the planets were read as messages.</text>
<g id="whl">
<circle class="s-ink" cx="400" cy="450" r="170" fill="var(--stage)" stroke-width="6"/>
<circle class="s-line" cx="400" cy="450" r="110" fill="none" stroke-width="4"/>
<g id="spk"></g><g id="pl3"></g>
<text class="m" x="400" y="670" font-size="22" text-anchor="middle">THE PLANETS</text>
</g>
<g id="pr3"></g>
<g id="no3"><text class="m" x="940" y="510" font-size="22" style="fill:var(--loss)">THE PLANETS DID NOT PREDICT THEM</text></g>
<g id="lk3"></g>
<g id="ppl3"></g>
<g id="fin3"><text class="d" x="120" y="830" font-size="46">False as a picture, <tspan style="fill:var(--gain)">powerful as a connector.</tspan></text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The holy book.</text>
<text class="b" x="120" y="176" font-size="32">Harari points to the Bible as another example.</text>
<g id="rings4"></g>
<g id="bk4">
<rect class="ink" x="725" y="405" width="150" height="180" rx="10"/>
<rect x="745" y="420" width="110" height="150" rx="4" fill="none" stroke="var(--stage)" stroke-width="3"/>
<path class="gain" d="M830 405v70l14-12 14 12v-70z"/>
</g>
<text id="lb4" class="m" x="1480" y="232" font-size="20" text-anchor="end">ACROSS CONTINENTS AND CENTURIES</text>
<g id="fin4"><text class="d" x="120" y="840" font-size="52">A story can be powerful <tspan style="fill:var(--gain)">without being true.</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why fiction often wins.</text>
<g id="tr5">
<path class="s-loss" d="M200 330c50-50 120-10 100 40s-120 50-110-10 90-70 120-20-40 90-90 70-30-60 20-70" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="d" x="380" y="350" font-size="52">Truth</text>
<text class="m" x="380" y="398" font-size="22">COMPLICATED · PAINFUL · COSTLY</text>
</g>
<g id="fi5">
<circle class="gain" cx="250" cy="630" r="64"/>
<text class="d" x="380" y="620" font-size="52" style="fill:var(--gain)">Fiction</text>
<text class="m" x="380" y="668" font-size="22">SIMPLE · FLATTERING · EASY TO SHARE</text>
</g>
<g id="sp5"></g>
<g id="fin5"><text class="d" x="120" y="840" font-size="40">A false story can spread further and hold people tighter.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Power is not proof.</text>
<text class="b" x="120" y="176" font-size="32">Here is the uncomfortable lesson.</text>
<g id="mg6"><path class="ink" d="M140 350h50l140-70v200l-140-70h-50z"/><rect class="ink" x="170" y="410" width="30" height="60" rx="8"/></g>
<g id="wv6"></g>
<g id="cr6"></g>
<text class="m" x="120" y="580" font-size="22">MOVES CROWDS: IT CONNECTS PEOPLE WELL</text>
<rect class="s-line" x="120" y="600" width="900" height="44" rx="22" fill="none" stroke-width="4"/>
<rect id="bar6" class="gain" x="120" y="600" height="44" rx="22" width="0"/>
<g id="tq6">
<text class="m" x="120" y="700" font-size="22">IS IT TRUE?</text>
<rect class="s-muted" x="120" y="720" width="900" height="44" rx="22" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="570" y="749" font-size="20" text-anchor="middle">THE CROWD TELLS YOU NOTHING HERE</text>
</g>
<g id="qm6"><text class="d" x="1250" y="740" font-size="300" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="bo6"><text class="d" x="120" y="850" font-size="40">Both questions matter. We often confuse them.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask two separate questions.</text>
<text class="b" x="120" y="176" font-size="32">Next time a message moves you, keep them apart.</text>
<g id="k0">
<rect class="s-line" x="120" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="160" y="340" font-size="96" style="fill:var(--gain)">1</text>
<rect class="s-ink" x="680" y="260" width="52" height="52" rx="10" fill="none" stroke-width="4"/>
</g>
<g id="k1">
<rect class="s-line" x="840" y="230" width="640" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="d" x="880" y="340" font-size="96" style="fill:var(--gain)">2</text>
<rect class="s-ink" x="1400" y="260" width="52" height="52" rx="10" fill="none" stroke-width="4"/>
</g>
<rect id="wall7" class="ink" x="796" y="230" width="8" height="500" rx="4"/>
<g id="q7a">
<text class="d5" x="160" y="420" font-size="42">Who does this</text>
<text class="d5" x="160" y="472" font-size="42">connect me to?</text>
<g id="ic7a"></g>
<text class="m" x="160" y="712" font-size="20">CONNECTION</text>
</g>
<g id="q7b">
<text class="d5" x="880" y="420" font-size="42">How do I know it</text>
<text class="d5" x="880" y="472" font-size="42">matches reality?</text>
<path class="s-ink" d="M1180 545L1247 535L1313 545L1380 535V655L1313 665L1247 655L1180 665Z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<path class="s-line" d="M1247 535V655M1313 545V665" stroke-width="3"/>
<circle class="s-gain" cx="1300" cy="595" r="34" fill="none" stroke-width="7"/>
<path class="s-gain" d="M1325 620l30 30" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="880" y="712" font-size="20">REALITY</text>
</g>
<g id="cb7"></g>
<g id="fin7"><text class="d" x="120" y="820" font-size="40">Keep them apart: the first step to thinking clearly.</text></g>
</g>

<g id="s8" opacity="0">
<g id="sh8"></g>
<g id="ph8">
<rect class="s-ink" x="1330" y="130" width="130" height="220" rx="20" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M1355 180h80M1355 210h80M1355 240h50" stroke-width="8" stroke-linecap="round"/>
<circle class="gain" cx="1395" cy="300" r="20"/>
</g>
<g id="lb8"><text class="m" x="120" y="250" font-size="26">A STORY YOU SHARED THIS WEEK, BECAUSE IT FELT RIGHT</text></g>
<g id="qa"><text class="d" x="136" y="430" font-size="76" letter-spacing="-2">Did you share it because</text></g>
<g id="qb"><text class="d" x="136" y="530" font-size="76" letter-spacing="-2">it was true, or because it</text></g>
<g id="qc"><text class="d" x="136" y="630" font-size="76" letter-spacing="-2"><tspan style="fill:var(--gain)">connected</tspan> you to your people?</text></g>
<g id="tg8"><text class="m" x="143" y="760" font-size="26">TWO QUESTIONS, KEPT APART</text></g>
</g>