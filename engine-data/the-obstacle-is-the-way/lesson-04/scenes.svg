<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE OBSTACLE IS THE WAY · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Act with persistence</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">and iteration.</text>
<text class="b" x="120" y="600" font-size="32">Keep trying, keep adjusting, until the problem finally gives way.</text>
<g id="wall"></g>
<circle id="push" class="gain" r="26"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Action is a discipline.</text>
<text class="b" x="120" y="176" font-size="32">See the problem clearly, then move on it.</text>
<g id="disc"></g>
<g id="move"><text class="m" x="760" y="306" font-size="22">SEE IT CLEARLY</text><path class="s-gain" d="M970 298h90m-20-18 20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1090" y="306" font-size="22" style="fill:var(--gain)">MOVE ON IT</text></g>
<path class="s-line" d="M120 780H1480" stroke-width="4"/>
<g id="leap"><path class="s-loss" d="M290 660Q744 340 1269 415" fill="none" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/></g>
<g id="leapL"><text class="m" x="810" y="362" font-size="22" text-anchor="middle" style="fill:var(--muted)">ONE HEROIC LEAP</text></g>
<path id="lx" class="s-loss" d="M780 395l60 60m0-60l-60 60" stroke-width="10" stroke-linecap="round"/>
<g id="steps"></g>
<g id="climbW"><g id="climber"></g></g>
<g id="ssl"><text class="m" x="1480" y="830" font-size="22" text-anchor="end" style="fill:var(--gain)">SMALL STEPS, REPEATED</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Grant at Vicksburg.</text>
<text class="b" x="120" y="176" font-size="32">American Civil War. One city stood in the way.</text>
<g id="gr"></g>
<g id="army"></g>
<g id="halfL"><rect class="loss" x="554" y="230" width="386" height="600" rx="16" fill-opacity=".1"/><text class="m" x="574" y="270" font-size="20">CONFEDERACY</text></g>
<g id="halfR"><rect class="loss" x="940" y="230" width="526" height="600" rx="16" fill-opacity=".1"/><text class="m" x="1446" y="270" font-size="20" text-anchor="end" style="fill:var(--gain)">SPLIT IN TWO</text></g>
<path id="riv" d="M940 230C860 330 1010 420 930 520S880 720 950 830" fill="none" stroke="var(--ice)" stroke-width="34" stroke-linecap="round"/>
<g id="city"><polygon class="ink" points="990,520 1000,450 1150,440 1160,520"/><rect class="ink" x="1015" y="410" width="30" height="40"/><rect class="ink" x="1055" y="395" width="36" height="50"/><rect class="ink" x="1100" y="412" width="30" height="34"/><circle class="loss" cx="1018" cy="475" r="10"/><circle class="loss" cx="1018" cy="502" r="10"/><text class="m" x="1180" y="470" font-size="22">VICKSBURG</text><text class="m" x="850" y="760" font-size="20" text-anchor="end">MISSISSIPPI</text></g>
<g id="swamp"></g>
<g id="swl"><text class="m" x="1460" y="810" font-size="20" text-anchor="end">SWAMPS AND WATER ON EVERY SIDE</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try. Fail. Try again.</text>
<text class="b" x="120" y="176" font-size="32">Grant tried one route after another.</text>
<g id="cards"></g>
<g id="xs"></g>
<g id="crit"><g id="crowd3"></g><rect x="380" y="630" width="250" height="64" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><path d="M380 676l-24 14 26-2" fill="var(--stage)" stroke="var(--loss)" stroke-width="4" stroke-linejoin="round"/><text class="m" x="505" y="670" font-size="22" text-anchor="middle" style="fill:var(--loss)">REMOVE HIM!</text><text class="m" x="120" y="800" font-size="20">CRITICS BACK HOME</text></g>
<g id="kept"><text class="d" x="720" y="720" font-size="44">He kept trying the next thing.</text><rect class="gain" x="724" y="746" width="200" height="10"/></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The breakthrough.</text>
<text class="b" x="120" y="176" font-size="32">One more new approach, and the city fell.</text>
<rect x="120" y="220" width="700" height="620" rx="16" fill="none" stroke="var(--line)" stroke-width="3"/>
<path id="riv2" d="M470 252C420 390 530 520 460 680S445 770 475 806" fill="none" stroke="var(--ice)" stroke-width="36" stroke-linecap="butt"/>
<polygon class="ink" points="520,450 530,390 680,380 690,450"/>
<rect class="ink" x="545" y="350" width="28" height="40"/><rect class="ink" x="585" y="335" width="34" height="50"/><rect class="ink" x="630" y="355" width="28" height="28"/>
<circle class="loss" cx="545" cy="412" r="9"/><circle class="loss" cx="545" cy="436" r="9"/>
<text class="m" x="696" y="445" font-size="20">VICKSBURG</text>
<g id="moon"><circle class="gain" cx="200" cy="290" r="28"/><circle cx="214" cy="280" r="24" fill="var(--stage)"/><text class="m" x="244" y="298" font-size="20">NIGHT</text></g>
<g id="boats"></g>
<path id="march" d="M380 260C340 420 420 560 380 720C420 800 560 790 600 700L610 470" fill="none" stroke="var(--gain)" stroke-width="6" stroke-linecap="round"/>
<circle id="lead" class="gain" r="12"/>
<g id="siege"></g>
<g id="flag"><path class="s-ink" d="M605 335V262" stroke-width="5"/><path class="gain" d="M605 262h56l-14 15 14 15h-56z"/><text class="m" x="680" y="290" font-size="20" style="fill:var(--gain)">SURRENDER</text></g>
<g id="funnel"><text class="m" x="900" y="250" font-size="20">EACH FAILURE NARROWS WHAT MIGHT WORK</text><path class="s-line" d="M900 290L1300 480H1460M900 750L1300 540H1460" fill="none" stroke-width="5" stroke-linejoin="round"/><g id="fun"></g></g>
<g id="stop"><text class="m" x="900" y="820" font-size="22">MONTHS OF SETBACKS DID NOT STOP HIM</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Failure is feedback.</text>
<text class="b" x="120" y="176" font-size="32">Ship a rough version, watch what breaks, improve it.</text>
<g id="team"><g id="ppl"></g><path class="s-ink" d="M150 400H450" stroke-width="6" stroke-linecap="round"/><text class="m" x="300" y="440" font-size="20" text-anchor="middle">STARTUP TEAM</text></g>
<g id="mvp"><rect x="160" y="500" width="280" height="150" rx="10" fill="var(--stage)" stroke="var(--ink)" stroke-width="5" stroke-dasharray="14 8"/><text class="d" x="300" y="600" font-size="64" text-anchor="middle">MVP</text><text class="m" x="300" y="694" font-size="22" text-anchor="middle">MINIMUM VIABLE PRODUCT</text></g>
<g id="loop"><circle cx="880" cy="470" r="180" fill="none" stroke="var(--line)" stroke-width="6"/></g>
<g id="doors"><rect x="1220" y="360" width="100" height="190" fill="none" stroke="var(--loss)" stroke-width="5"/><rect class="loss" x="1256" y="455" width="28" height="22" rx="3"/><path d="M1262 455v-8a8 8 0 0 1 16 0v8" fill="none" stroke="var(--loss)" stroke-width="4"/><rect x="1350" y="360" width="100" height="190" fill="none" stroke="var(--gain)" stroke-width="5"/><path class="gain" d="M1350 360l56 22v146l-56 22z"/><text class="m" x="1268" y="594" font-size="20" text-anchor="middle" style="fill:var(--loss)">LOCKED</text><text class="m" x="1404" y="594" font-size="20" text-anchor="middle" style="fill:var(--gain)">TRY ANOTHER</text></g>
<g id="verd"><text class="d" x="120" y="800" font-size="44">Each failure is information, not a verdict.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t wait for the perfect plan.</text>
<text class="b" x="120" y="176" font-size="32">Momentum beats a flawless first move.</text>
<g id="cal"><rect x="120" y="240" width="400" height="320" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><rect class="ink" x="120" y="240" width="400" height="50" rx="14"/><text class="m" x="120" y="600" font-size="20">WAITING FOR THE PERFECT PLAN</text></g>
<g id="clk"><circle cx="770" cy="400" r="130" fill="var(--stage)" stroke="var(--ink)" stroke-width="8"/><path id="hh" class="s-ink" d="M770 400V330" stroke-width="10" stroke-linecap="round"/><path id="hm" class="s-gain" d="M770 400V300" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="770" cy="400" r="10"/><text class="m" x="770" y="600" font-size="20" text-anchor="middle">MOMENTUM MATTERS MORE</text></g>
<g id="chart"><path class="s-ink" d="M1000 260V560H1460" fill="none" stroke-width="4"/><path id="plan" class="s-muted" d="M1000 540H1440" stroke-width="6" stroke-linecap="round"/><polyline id="act" class="s-gain" points="1000,540 1060,500 1100,520 1160,460 1200,480 1260,410 1300,430 1360,350 1400,370 1440,290" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text class="m" x="1440" y="524" font-size="20" text-anchor="end">ENDLESS PLANNING</text><text class="m" x="1440" y="272" font-size="20" text-anchor="end" style="fill:var(--gain)">ACTION</text><text class="m" x="1460" y="592" font-size="20" text-anchor="end">TIME</text></g>
<g id="c4"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Take one small step today.</text>
<text class="b" x="120" y="176" font-size="32">Act, notice what happens, choose the next step.</text>
<g id="nb"><rect x="120" y="240" width="460" height="520" rx="14" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><text class="m" x="160" y="330" font-size="22">ONE STALLED PROBLEM</text><path id="sc1" d="M160 390q20-18 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><path class="s-line" d="M160 640H540M160 700H540" stroke-width="3"/></g>
<g id="fs"><text class="m" x="160" y="470" font-size="22">SMALLEST ACTION TODAY</text><rect x="160" y="500" width="50" height="50" rx="8" fill="none" stroke="var(--ink)" stroke-width="5"/><path id="sc2" d="M240 525q20-18 40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><path id="tick" d="M170 524l14 14 24-30" fill="none" stroke="var(--gain)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="stones"></g>
<g id="hopW"><g id="hop"></g></g>
<g id="days"><text class="m" x="720" y="740" font-size="20">AGAIN TOMORROW</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What problem have you</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">tried only <tspan style="fill:var(--loss)">once</tspan>?</text></g>
<g id="qc"><text class="m" x="143" y="580" font-size="26">THIS WEEK, TRY IT THREE MORE WAYS</text></g>
<rect class="ink" x="1400" y="560" width="36" height="260" rx="6"/>
<g id="tries"></g>
</g>