<text class="d" x="970" y="437" font-size="44" text-anchor="middle">?</text><text class="m" x="970" y="540" font-size="18" text-anchor="middle">A QUESTION</text></g>
<g id="n_c1"><rect class="s-line" x="1090" y="330" width="180" height="240" rx="16" fill="var(--stage)" stroke-width="3"/>
<path class="ink" d="M1145 400h70v50a25 25 0 0 1-25 25h-20a25 25 0 0 1-25-25z"/><path class="s-ink" d="M1215 412a16 16 0 0 1 0 32" fill="none" stroke-width="6"/>
<path id="n_steam" class="s-muted" d="M1165 385q-8-12 0-24M1192 385q-8-12 0-24" fill="none" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="1180" y="540" font-size="18" text-anchor="middle">A COFFEE</text></g>
<g id="n_c2"><rect class="s-line" x="1300" y="330" width="180" height="240" rx="16" fill="var(--stage)" stroke-width="3"/>
<path class="gain" d="M1390 480c-40-26-50-56-30-72 14-10 26-4 30 6 4-10 16-16 30-6 20 16 10 46-30 72z"/>
<text class="m" x="1390" y="540" font-size="18" text-anchor="middle">OFFER HELP</text></g>
