<g id="chk"></g>
</g>
<g id="path1"><text class="m" x="150" y="580" font-size="20">ONE SET PATH, ONE ANSWER</text></g>
<g id="belt"><rect class="ink" x="160" y="690" width="560" height="14" rx="7"/>
<text class="m" x="150" y="770" font-size="20">ADD UP INVOICES · STACK BOXES</text></g>
<g id="boxes"></g>
<g id="pB">
<rect class="s-line" x="840" y="220" width="640" height="580" rx="18" fill="var(--stage)" stroke-width="3"/>
