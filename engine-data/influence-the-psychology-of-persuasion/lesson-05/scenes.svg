<g id="hst"><g id="hstP"></g><text class="m" x="1080" y="376" font-size="20" text-anchor="middle" style="fill:var(--gain)">HOSTESS · YOUR FRIEND</text></g>
<g id="bag"><path class="s-gain" d="M782 650v-14a23 23 0 0 1 46 0v14" fill="none" stroke-width="6"/><rect class="gain" x="760" y="650" width="90" height="90" rx="8"/><path d="M0 14C-22 0-22-16-11-18C-5-19-1-15 0-11C1-15 5-19 11-18C22-16 22 0 0 14Z" transform="translate(805 696)" fill="var(--on-gain)"/><path class="s-gain" d="M866 680Q980 650 1066 560" fill="none" stroke-width="5" stroke-dasharray="10 10"/><text class="m" x="880" y="724" font-size="20" style="fill:var(--gain)">BUYING TO PLEASE HER</text></g>
<g id="rule"><text class="d" x="120" y="836" font-size="48">The rule: we say yes to people we like.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">1. Good looks.</text>
<text class="b" x="120" y="176" font-size="32">Attractive people get a halo.</text>
<g id="man"><g id="manP"></g></g>
<ellipse id="halo" cx="360" cy="300" rx="70" ry="16" fill="none" stroke="var(--gain)" stroke-width="7"/>
<g id="trs"></g>
<g id="crt0"><rect class="s-line" x="820" y="240" width="310" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="975" y="290" font-size="20" text-anchor="middle">CANDIDATES</text><rect id="blt" class="gain" x="955" y="360" width="40" height="50" rx="4"/><rect class="s-ink" x="900" y="470" width="150" height="110" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M950 470h50" stroke-width="10"/><text class="m" x="975" y="630" font-size="22" text-anchor="middle" style="fill:var(--gain)">MORE VOTES</text></g>
<g id="crt1"><rect class="s-line" x="1170" y="240" width="310" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1325" y="290" font-size="20" text-anchor="middle">DEFENDANTS</text><g id="gav"><rect class="ink" x="1265" y="400" width="120" height="50" rx="8"/><rect class="ink" x="1316" y="450" width="18" height="110"/></g><rect class="ink" x="1255" y="570" width="140" height="22" rx="4"/><text class="m" x="1325" y="630" font-size="22" text-anchor="middle" style="fill:var(--gain)">LIGHTER SENTENCES</text></g>
<g id="gl"><text class="d5" x="120" y="780" font-size="40">We assume good-looking means good.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">2. Similarity.</text>
<text class="b" x="120" y="176" font-size="32">We warm to people who are like us.</text>
<path id="mir" class="s-muted" d="M500 260V580" stroke-width="4" stroke-dasharray="10 10"/>
<g id="pr3"></g>
<g id="stp"></g>
<g id="tgs"></g>
