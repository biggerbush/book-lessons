<circle id="chrh" class="s-ink" cx="800" cy="400" r="24" fill="none" stroke-width="5" stroke-dasharray="8 6"/>
<path id="chrb" class="s-ink" d="M764 500.8v-31.2a36 36 0 0 1 72 0v31.2z" fill="none" stroke-width="5" stroke-dasharray="8 6" stroke-linejoin="round"/>
<text class="m" x="800" y="620" font-size="20" text-anchor="middle">EMPTY SEAT</text>
