<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Empires and religions</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">unify the world.</text>
<text class="b" x="120" y="600" font-size="32">How conquest and faith merged tiny cultures into one world.</text>
<g id="t_glob" opacity="0"><circle class="s-ink" cx="1340" cy="420" r="130" fill="none" stroke-width="6"/><ellipse class="s-line" cx="1340" cy="420" rx="54" ry="130" fill="none" stroke-width="4"/><path class="s-line" d="M1210 420h260" stroke-width="4"/></g>
<g id="t_dots"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Small worlds keep merging.</text>
<text class="b" x="120" y="176" font-size="32">History moves in one direction: from many groups to fewer, larger ones.</text>
<g id="m_tree"></g>
<g id="m_arrow"><path class="s-ink" d="M200 760H1060" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M1036 736l24 24-24 24" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="200" y="820" font-size="20">BIG CULTURES ABSORB SMALL ONES · THEY RARELY SPLIT BACK</text></g>
<g id="m_money"><text class="m" x="1180" y="310" font-size="20">BESIDES MONEY</text></g>
<g id="m_f0"><rect class="gain" x="1180" y="340" width="300" height="84" rx="42"/><text class="d5" x="1330" y="394" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Empires</text><path class="s-gain" d="M1180 382L1110 440" stroke-width="5" stroke-linecap="round"/></g>
<g id="m_f1"><rect class="gain" x="1180" y="520" width="300" height="84" rx="42"/><text class="d5" x="1330" y="574" font-size="34" text-anchor="middle" style="fill:var(--on-gain)">Religions</text><path class="s-gain" d="M1180 562L1110 500" stroke-width="5" stroke-linecap="round"/></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What an empire is.</text>
<text class="b" x="120" y="176" font-size="32">One political order ruling over many different peoples.</text>
<g id="e_crown"><path class="gain" d="M500 280l-10-60 40 30 30-46 30 46 40-30-10 60z"/><rect class="gain" x="500" y="286" width="120" height="14"/></g>
<g id="e_bg"><rect id="e_bord" class="s-ink" rx="70" fill="none" stroke-width="6" stroke-dasharray="16 12"/></g>
<g id="e_ppl"></g>
<g id="e_new"></g>
<g id="e_lab"><text class="m" x="560" y="740" font-size="20" text-anchor="middle">BORDERS STRETCH · THE SHAPE STAYS</text></g>
<g id="e_time"><text class="m" x="1000" y="300" font-size="20">EMPIRE AFTER EMPIRE</text><path class="s-ink" d="M1000 680H1450M1430 664l20 16-20 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1000" y="720" font-size="20">HISTORY</text></g>
<g id="e_bars"></g>
<g id="e_stab"><text class="d5" x="120" y="820" font-size="40">Among history’s most common and stable political forms.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The siege of Numantia.</text>
<text class="b" x="120" y="176" font-size="32">Ancient Spain: a small town resists Rome.</text>
<g id="n_town"><path d="M560 640Q800 520 1040 640Z" fill="var(--line)"/>
<g id="n_house"><rect class="s-ink" x="690" y="500" width="220" height="80" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="676" y="470" width="30" height="110"/><rect class="ink" x="894" y="470" width="30" height="110"/><path class="ink" d="M724 500l30-40 30 40zM796 500l30-50 30 50z"/></g>
<text class="m" x="800" y="690" font-size="20" text-anchor="middle">NUMANTIA</text></g>
<g id="n_ring"><circle class="s-loss" cx="800" cy="515" r="270" fill="none" stroke-width="4" stroke-dasharray="12 10"/><g id="n_tents"></g><text class="m" x="1110" y="300" font-size="20" style="fill:var(--loss)">ROMAN LEGIONS</text></g>
<g id="n_food"><rect class="s-ink" x="170" y="320" width="70" height="360" rx="8" fill="none" stroke-width="5"/><rect id="n_fill" class="gain" x="178" width="54" rx="4"/><text class="m" x="205" y="720" font-size="20" text-anchor="middle">FOOD</text></g>
<g id="n_end"><text class="d" x="120" y="850" font-size="44">Rather than surrender, many chose death.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The twist.</text>
<text class="b" x="120" y="176" font-size="32">Centuries later, the conquered told the story in the conquerors’ language.</text>
<g id="k0"><rect class="s-line" x="120" y="230" width="414" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="ink" d="M327 330c-30-20-80-20-110-10v120c30-10 80-10 110 10 30-20 80-20 110-10V320c-30-10-80-10-110 10z"/><path d="M327 330v120" stroke="var(--stage)" stroke-width="4"/>
<text class="d5" x="160" y="540" font-size="44">Latin</text>
<g id="k0s"><path class="s-muted" d="M180 560v46M166 592l14 14 14-14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d" x="160" y="670" font-size="52" style="fill:var(--gain)">Spanish</text><text class="m" x="160" y="730" font-size="18">THE CONQUERORS’ TONGUE</text></g></g>
<g id="k1"><rect class="s-line" x="593" y="230" width="414" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="650" y="300" width="300" height="160" rx="12" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M690 350h220M690 390h220M690 430h140" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="629" y="560" font-size="20">STORY TOLD BY</text><text class="d5" x="629" y="620" font-size="44">Roman</text><text class="d5" x="629" y="680" font-size="44">historians.</text></g>
<g id="k2"><rect class="s-line" x="1066" y="230" width="414" height="530" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="1110" y="300" width="326" height="170" fill="var(--stage)" stroke-width="6"/><path class="loss" d="M1110 300h60q-20 85 0 170h-60zM1436 300h-60q20 85 0 170h60z"/><g id="k2f"></g>
<text class="m" x="1102" y="560" font-size="20">CERVANTES WROTE A PLAY</text><text class="d5" x="1102" y="620" font-size="40">Its heroes,</text><text class="d" x="1102" y="690" font-size="48" style="fill:var(--gain)">in Spanish.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Conquered, then absorbed.</text>
<text class="b" x="120" y="176" font-size="32">A repeating pattern, over many generations.</text>
<g id="c_ring"><circle class="s-line" cx="800" cy="513" r="213" fill="none" stroke-width="4" stroke-dasharray="10 12"/><circle id="c_dot" class="gain" r="12"/></g>
<g id="c_a"><circle class="s-ink" cx="800" cy="300" r="80" fill="var(--stage)" stroke-width="6"/><g id="c_af"></g><path class="s-ink" d="M838 266V340" stroke-width="5" stroke-linecap="round"/><path class="loss" d="M838 248l-9 18h18z"/><text class="m" x="900" y="308" font-size="22">1 · CONQUEST</text></g>
<g id="c_b"><circle class="s-ink" cx="984" cy="620" r="80" fill="var(--stage)" stroke-width="6"/><g id="c_bf"></g><text class="m" x="984" y="740" font-size="22" text-anchor="middle">2 · ADOPTION</text></g>
<g id="c_c"><circle class="s-ink" cx="616" cy="620" r="80" fill="var(--stage)" stroke-width="6"/><g id="c_cf"></g><path class="s-ink" d="M607 612h18M607 624h18" stroke-width="4" stroke-linecap="round"/><text class="m" x="616" y="740" font-size="22" text-anchor="middle">3 · EQUAL STATUS</text></g>
<g id="c_end"><text class="d" x="120" y="830" font-size="44">In the end, the empire belongs to everyone.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Universal religions.</text>
<text class="b" x="120" y="176" font-size="32">From gods of one place to truths for every person, everywhere.</text>
<g id="r_loc"><text class="m" x="120" y="240" font-size="22">LOCAL GODS</text><g id="r_isl"></g><text class="m" x="120" y="740" font-size="20">ONE TRIBE · ONE PLACE</text></g>
<g id="r_glb"><text class="m" x="850" y="240" font-size="22">UNIVERSAL FAITHS</text><circle class="s-ink" cx="1080" cy="490" r="220" fill="none" stroke-width="5"/><ellipse class="s-line" cx="1080" cy="490" rx="90" ry="220" fill="none" stroke-width="4"/><path class="s-line" d="M860 490h440" stroke-width="4"/></g>
<g id="r_rays"></g>
<g id="r_pil"></g>
<g id="r_star"><circle class="gain" cx="1080" cy="490" r="34"/></g>
<g id="r_faith"><text class="m" x="1080" y="760" font-size="22" text-anchor="middle">BUDDHISM · CHRISTIANITY · ISLAM</text></g>
<g id="r_ways"><text class="m" x="1080" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">MISSIONARIES · TRADE · SOMETIMES THE SWORD</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">No clean split.</text>
<text class="b" x="120" y="176" font-size="32">This history can’t be sorted neatly into good and bad.</text>
<g id="x_scale"><path class="s-ink" d="M400 300V560" stroke-width="8"/><path class="s-ink" d="M330 566h140" stroke-width="10" stroke-linecap="round"/>
<g id="x_beam"><path class="s-ink" d="M220 300h360" stroke-width="8" stroke-linecap="round"/><path class="s-ink" d="M240 300L195 420M240 300L285 420M560 300L515 420M560 300L605 420" stroke-width="3"/><path class="ink" d="M185 420h110a55 36 0 0 1-110 0zM505 420h110a55 36 0 0 1-110 0z"/><text class="m" x="240" y="500" font-size="20" text-anchor="middle">GOOD?</text><text class="m" x="560" y="500" font-size="20" text-anchor="middle">BAD?</text></g>
<circle class="gain" cx="400" cy="300" r="12"/></g>
<g id="x_rope"><text class="m" x="760" y="360" font-size="22" style="fill:var(--loss)">VIOLENCE</text><text class="m" x="760" y="540" font-size="22" style="fill:var(--gain)">SHARED CULTURE</text>
<path id="x_r0" class="s-loss" fill="none" stroke-width="12" stroke-linecap="round"/><path id="x_r1" class="s-gain" fill="none" stroke-width="12" stroke-linecap="round"/></g>
<g id="x_ws"></g>
<g id="x_end"><text class="d" x="120" y="810" font-size="44">Likely inherited from long-gone empires and faiths.</text></g>
</g>

<g id="s8" opacity="0">
<g id="z_a"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Pick one thing you value.</text></g>
<g id="z_v"><text class="m" x="143" y="370" font-size="26" style="fill:var(--gain)">A WORD · A HOLIDAY · AN IDEA</text></g>
<g id="z_b"><text class="d" x="136" y="500" font-size="88" letter-spacing="-2">Which empire or religion</text></g>
<g id="z_c"><text class="d" x="136" y="610" font-size="88" letter-spacing="-2">carried it to you?</text></g>
<g id="z_you"><circle class="gain" cx="170" cy="740" r="34"/><text class="m" x="170" y="747" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">YOU</text><text class="m" x="120" y="830" font-size="20">TRACE IT BACK</text></g>
<g id="z_trail"></g>
<g id="z_q"><text class="d" x="1070" y="785" font-size="120" style="fill:var(--gain)">?</text></g>
</g>