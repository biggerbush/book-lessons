<g id="nl7"><text class="m" x="120" y="810" font-size="22">ADVICE, NOT FEEDBACK</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Who will you ask</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">for <tspan style="fill:var(--gain)">advice</tspan> before</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">this week is over?</text></g>
<g id="ql8"><text class="m" x="143" y="700" font-size="26">SQUEEZE OUT THE NOISE · SOAK UP WHAT HELPS</text></g>
<g id="sg8"></g>
