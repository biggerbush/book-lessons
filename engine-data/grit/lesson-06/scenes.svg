<g id="nbG"><text class="m" x="1190" y="690" font-size="20" style="fill:var(--gain)">WRONG METHOD.</text><text class="m" x="1190" y="735" font-size="20" style="fill:var(--gain)">FIXABLE.</text><text class="m" x="1190" y="790" font-size="20" style="fill:var(--ink)">NEXT: NEW PLAN</text></g>
