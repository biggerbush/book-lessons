<circle id="fst" class="loss" r="26"/>
<g id="nb"><text class="d" x="120" y="800" font-size="44">He struck before Houdini could brace.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The hit he didn’t expect.</text>
<text class="b" x="120" y="176" font-size="32">Days later, Houdini died from a ruptured appendix.</text>
<g id="rl"><text class="m" x="120" y="260" font-size="22">THE REAL LESSON IS NOT THE PUNCH ITSELF</text></g>
