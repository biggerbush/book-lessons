<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">You’ve lived a tiny slice.</text>
<text class="b" x="120" y="176" font-size="32">Money’s history stretches across centuries and continents.</text>
<g id="globe"><circle class="s-ink" cx="330" cy="520" r="170" fill="var(--stage)" stroke-width="6"/><g id="mer"></g>
<path class="s-ink" d="M160 520h340M182 435h296M182 605h296" stroke-width="4"/></g>
<g id="tl"><text class="m" x="620" y="336" font-size="20">CENTURIES OF MONEY</text><path class="s-line" d="M620 380h840" stroke-width="8" stroke-linecap="round"/><g id="ticks"></g></g>
<g id="slice"><rect id="sliceR" class="gain" x="1400" y="356" width="30" height="48" rx="4"/><text class="m" x="1460" y="336" font-size="20" text-anchor="end" style="fill:var(--gain)">YOUR LIFETIME</text></g>
<g id="belief"><polygon class="gain" points="1400,404 1430,404 1460,560 620,560" fill-opacity=".18"/>
<rect class="gain" x="620" y="560" width="840" height="220" rx="20"/>
