<path id="flat" class="s-loss" d="M1180 690H1450" stroke-width="7" stroke-linecap="round" pathLength="1"/>
<text class="m" x="1180" y="590" font-size="20">SKILL</text>
<text class="m" x="1460" y="752" font-size="20" text-anchor="end">YEARS OF PRACTICE</text>
</g>
<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">More hours isn’t enough.</text>
<text class="b" x="120" y="176" font-size="32">We drive almost every day, yet stopped improving long ago.</text>
