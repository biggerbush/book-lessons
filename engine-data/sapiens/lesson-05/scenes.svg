<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Imagined orders hold</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">societies together.</text>
<text class="b" x="120" y="600" font-size="32">Why laws and rights work only because we believe in them</text>
<g id="t_beams"></g>
<g id="t_ppl"></g>
<g id="t_rule"><g id="t_ruleIn"><rect class="gain" x="1180" y="250" width="260" height="130" rx="14"/><text class="m" x="1310" y="296" font-size="24" text-anchor="middle" style="fill:var(--on-gain)">THE RULES</text><path d="M1220 326h180M1220 352h120" stroke="var(--on-gain)" stroke-width="6" stroke-linecap="round"/></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two famous codes.</text>
<text class="b" x="120" y="176" font-size="32">Thousands of years apart, side by side.</text>
<g id="st1"><path class="s-ink" d="M300 760V360a130 130 0 0 1 260 0V760z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect class="ink" x="280" y="760" width="300" height="20" rx="6"/><g id="st1l"></g><text class="m" x="430" y="820" font-size="20" text-anchor="middle">BABYLON · NEARLY 4,000 YEARS AGO</text></g>
<g id="pa1"><rect class="s-ink" x="1010" y="300" width="280" height="440" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="990" y="280" width="320" height="34" rx="17" fill="var(--stage)" stroke-width="6"/><rect class="s-ink" x="990" y="726" width="320" height="34" rx="17" fill="var(--stage)" stroke-width="6"/><g id="pa1l"></g><text class="m" x="1150" y="820" font-size="20" text-anchor="middle">AMERICA · 1776</text></g>
<g id="sb1"><path class="s-gain" d="M690 520h220M716 496l-26 24 26 24M884 496l26 24-26 24" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="800" y="480" font-size="20" text-anchor="middle">SIDE BY SIDE</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Hammurabi’s order.</text>
<text class="b" x="120" y="176" font-size="32">A king who said the gods had appointed him.</text>
<g id="k2"><path class="s-gain" d="M290 232v40M215 248l26 34M365 248l-26 34" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="290" cy="380" r="50"/><path class="gain" d="M245 340l8-50 37 30 37-30 8 50z"/><path class="ink" d="M215 560v-60a75 75 0 0 1 150 0v60z"/><text class="m" x="290" y="610" font-size="20" text-anchor="middle">KING HAMMURABI</text><text class="m" x="290" y="644" font-size="20" text-anchor="middle" style="fill:var(--gain)">APPOINTED BY THE GODS</text></g>
<g id="t2_0"><rect class="gain" x="680" y="300" width="240" height="120" rx="8"/><text class="m" x="800" y="368" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">SUPERIORS</text></g>
<g id="t2_1"><rect class="s-ink" x="640" y="440" width="320" height="120" rx="8" fill="var(--stage)" stroke-width="5"/><text class="m" x="800" y="508" font-size="20" text-anchor="middle" style="fill:var(--ink)">COMMONERS</text></g>
<g id="t2_2"><rect class="s-loss" x="560" y="580" width="480" height="120" rx="8" fill="var(--stage)" stroke-width="5"/><text class="m" x="800" y="648" font-size="20" text-anchor="middle" style="fill:var(--loss)">SLAVES</text></g>
<g id="sc2"><path class="s-ink" d="M1260 330V700M1170 700h180" stroke-width="8" stroke-linecap="round"/><path id="beam2" class="s-ink" d="M1120 330h280" stroke-width="8" stroke-linecap="round"/><circle class="ink" cx="1260" cy="324" r="12"/>
<g id="pl2"><path class="s-ink" d="M0 0L-45 100M0 0L45 100" stroke-width="3" fill="none"/><rect class="gain" x="-14" y="78" width="28" height="22"/><path class="ink" d="M-55 100h110a55 26 0 0 1-110 0z"/></g>
<g id="pr2"><path class="s-ink" d="M0 0L-45 100M0 0L45 100" stroke-width="3" fill="none"/><rect class="loss" x="-30" y="52" width="60" height="48"/><path class="ink" d="M-55 100h110a55 26 0 0 1-110 0z"/></g>
<text class="m" x="1260" y="760" font-size="20" text-anchor="middle">PENALTIES CHANGE BY CLASS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The American order.</text>
<text class="b" x="120" y="176" font-size="32">“All men are created equal.”</text>
<g id="f3"><g id="fp3"></g><path class="s-ink" d="M160 520H680" stroke-width="6" stroke-linecap="round"/></g>
<g id="eq3"><path class="s-gain" d="M170 385H670" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="420" y="580" font-size="20" text-anchor="middle" style="fill:var(--gain)">ALL CREATED EQUAL</text></g>
<g id="d3"><rect class="s-ink" x="820" y="240" width="580" height="460" rx="14" fill="var(--stage)" stroke-width="6"/><text class="m" x="860" y="300" font-size="20">THE DECLARATION · 1776</text></g>
<g id="r3_0"><rect class="s-gain" x="860" y="376" width="44" height="44" rx="6" fill="none" stroke-width="5"/><path class="s-gain" d="M870 398l10 10 18-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="930" y="410" font-size="36">Life</text></g>
<g id="r3_1"><rect class="s-gain" x="860" y="476" width="44" height="44" rx="6" fill="none" stroke-width="5"/><path class="s-gain" d="M870 498l10 10 18-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="930" y="510" font-size="36">Liberty</text></g>
<g id="r3_2"><rect class="s-gain" x="860" y="576" width="44" height="44" rx="6" fill="none" stroke-width="5"/><path class="s-gain" d="M870 598l10 10 18-22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="930" y="610" font-size="36">Pursuit of happiness</text></g>
<g id="e3"><text class="d" x="120" y="800" font-size="44">Both called their principles natural and eternal.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Imagined, not fake.</text>
<text class="b" x="120" y="176" font-size="32">Biology contains no nobles and no equal rights.</text>
<g id="hx4"><g id="rg4"></g><polyline id="h4a" class="s-ink" fill="none" stroke-width="6" stroke-linecap="round"/><polyline id="h4b" class="s-gain" fill="none" stroke-width="6" stroke-linecap="round"/><text class="m" x="300" y="750" font-size="22" text-anchor="middle">BIOLOGY</text></g>
<g id="no4"><text class="m" x="430" y="460" font-size="22" style="fill:var(--loss)">NO RANKS</text><text class="m" x="430" y="500" font-size="22" style="fill:var(--loss)">NO RIGHTS</text></g>
<g id="ln4"></g>
<g id="cr4"></g>
<g id="ob4"><g id="ob4in"><rect class="gain" x="940" y="240" width="300" height="70" rx="14"/><text class="m" x="1090" y="283" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">THE ORDER</text></g></g>
<g id="dt4"><text class="m" x="1310" y="752" font-size="20" text-anchor="middle" style="fill:var(--loss)">ONE DOUBTER</text></g>
<g id="sd4"><text class="d" x="120" y="830" font-size="44">That is why imagined orders are so sturdy.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The memory problem.</text>
<text class="b" x="120" y="176" font-size="32">A small band remembers. A kingdom cannot.</text>
<g id="v5"><ellipse class="s-ink" cx="320" cy="285" rx="110" ry="40" fill="var(--stage)" stroke-width="4"/><text class="m" x="320" y="292" font-size="20" text-anchor="middle">CUSTOMS</text><path class="gain" d="M300 510l20-50 20 50z"/><g id="vp5"></g><text class="m" x="320" y="730" font-size="20" text-anchor="middle">A SMALL BAND</text></g>
<g id="kd5"></g>
<g id="kl5"><text class="m" x="800" y="730" font-size="20" text-anchor="middle">A KINGDOM</text></g>
<g id="c5_0"><rect class="s-ink" x="1020" y="280" width="160" height="56" rx="10" fill="var(--stage)" stroke-width="4"/><text class="m" x="1100" y="315" font-size="20" text-anchor="middle">TAXES</text></g>
<g id="c5_1"><rect class="s-ink" x="1020" y="360" width="160" height="56" rx="10" fill="var(--stage)" stroke-width="4"/><text class="m" x="1100" y="395" font-size="20" text-anchor="middle">DEBTS</text></g>
<g id="c5_2"><rect class="s-ink" x="1020" y="440" width="160" height="56" rx="10" fill="var(--stage)" stroke-width="4"/><text class="m" x="1100" y="475" font-size="20" text-anchor="middle">PROPERTY</text></g>
<g id="c5_3"><rect class="s-ink" x="1020" y="520" width="160" height="56" rx="10" fill="var(--stage)" stroke-width="4"/><text class="m" x="1100" y="555" font-size="20" text-anchor="middle">LAWS</text></g>
<path id="ar5" class="s-muted" d="M1188 308L1246 395M1188 388L1240 420M1188 468L1240 445M1188 548L1246 475" stroke-width="4" stroke-linecap="round"/>
<g id="b5"><g id="b5in"><circle id="b5c" cx="1340" cy="430" r="100" fill="var(--stage)" stroke="var(--ink)" stroke-width="7"/><path class="s-ink" d="M1340 340v180M1290 380q30 20 0 50t0 50M1390 380q-30 20 0 50t0 50" fill="none" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="tm5"><text class="m" x="1340" y="600" font-size="22" text-anchor="middle" style="fill:var(--loss)">TOO MUCH DATA</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sumer invents writing.</text>
<text class="b" x="120" y="176" font-size="32">Mesopotamia, around 5,000 years ago.</text>
<g id="tb6"><rect class="s-ink" x="160" y="240" width="480" height="480" rx="40" fill="var(--line)" fill-opacity=".5" stroke-width="7"/><path class="s-muted" d="M200 560H600" stroke-width="3"/></g>
<g id="w6"></g>
<g id="n6"></g>
<g id="k6"><text class="d" x="400" y="660" font-size="56" text-anchor="middle" style="fill:var(--gain)">KUSHIM</text></g>
<g id="br6"><g id="brs6"></g><text class="m" x="1060" y="420" font-size="22">AMOUNTS OF BARLEY</text><text class="m" x="1060" y="456" font-size="22">OWED OR DELIVERED</text></g>
<g id="kr6"><text class="d" x="760" y="690" font-size="72">Kushim</text><text class="m" x="760" y="740" font-size="20">POSSIBLY ONE OF THE FIRST NAMES IN HISTORY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Archives build empires.</text>
<text class="b" x="120" y="176" font-size="32">Writing stored information outside human heads.</text>
<g id="sh7"><rect class="s-ink" x="140" y="240" width="360" height="460" fill="none" stroke-width="6"/><path class="s-ink" d="M140 355h360M140 470h360M140 585h360" stroke-width="6"/><g id="tl7"></g><text class="m" x="320" y="750" font-size="20" text-anchor="middle">ARCHIVE</text></g>
<g id="em7"><path class="s-ink" d="M770 300Q930 230 1100 255T1430 310Q1475 480 1420 650Q1250 725 1080 705T780 650Q735 470 770 300z" fill="none" stroke-width="5" stroke-dasharray="14 10"/><g id="st7"></g><g id="cl7"></g><g id="ck7"></g><path class="gain" d="M1040 450L1090 415L1140 450z"/><rect class="gain" x="1050" y="450" width="80" height="70"/><text class="m" x="1440" y="760" font-size="20" text-anchor="end">EMPIRE</text></g>
<g id="cs7"><text class="d" x="120" y="830" font-size="40">Strangers taxed, judged and ranked by the same rules.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="320" font-size="88" letter-spacing="-2">What keeps your rules real?</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="88" letter-spacing="-2">Nature itself, or millions</text></g>
<g id="qc"><text class="d" x="136" y="540" font-size="88" letter-spacing="-2">of us <tspan style="fill:var(--gain)">believing together</tspan>?</text></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">PICK ONE RULE YOU FOLLOW TODAY</text></g>
<g id="g8"><rect class="gain" x="1220" y="610" width="230" height="70" rx="12"/><text class="m" x="1335" y="653" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">A RULE</text></g>
<g id="dt8"></g>
</g>