<g id="s0">
<text class="m" x="120" y="150" font-size="28">SUPERCOMMUNICATORS · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The learning</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">conversation.</text>
<text class="b" x="120" y="600" font-size="32">Turn any conversation into a chance to truly understand someone.</text>
