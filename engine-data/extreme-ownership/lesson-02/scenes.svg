<text class="d5" x="870" y="690" font-size="36">Blames his men.</text></g>
<g id="bub6"><rect x="1240" y="250" width="220" height="60" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="4"/><text class="m" x="1350" y="287" font-size="20" text-anchor="middle" style="fill:var(--loss)">“A BAD CREW.”</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The swap.</text>
<text class="b" x="120" y="176" font-size="32">Swap the two leaders. Change nothing else.</text>
<g id="sw0"></g><g id="sw1"></g>
<text class="m" x="420" y="690" font-size="20" text-anchor="middle">BOAT CREW TWO</text>
<text class="m" x="1180" y="690" font-size="20" text-anchor="middle">BOAT CREW SIX</text>
<g id="inst"><text class="m" x="800" y="700" font-size="20" text-anchor="middle">INSTRUCTORS</text></g>
<g id="arrs"><path class="s-muted" d="M440 320Q800 120 1160 320M1128 296l32 24-40 6M1140 360H460M482 342l-22 18 22 18" fill="none" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/></g>
<g id="lds"></g>
<g id="same"><text class="d" x="120" y="780" font-size="44">Same men, same boats, same brutal races.</text></g>
<g id="stay"><text class="m" x="120" y="845" font-size="24" style="fill:var(--loss)">WOULD THE LOSING CREW STAY LOSERS?</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The very next race.</text>
<text class="b" x="120" y="176" font-size="32">The losing crew came in first.</text>
<polygon id="spot" class="gain" fill-opacity=".2" points="680,200 740,200 880,760 540,760"/>
