<g id="s0">
<text class="m" x="120" y="150" font-size="28">HIDDEN POTENTIAL · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Chase excellence,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not perfection.</text>
<text class="b" x="120" y="600" font-size="32">Why aiming for flawless can quietly stall your growth.</text>
<rect class="s-ink" x="1160" y="220" width="280" height="340" rx="10" fill="var(--stage)" stroke-width="6"/>
<g id="tLines"></g><g id="tMarks"></g>
<path id="tChk" class="s-gain" d="M1220 400l60 60 120-140" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet the perfectionist.</text>
<text class="b" x="120" y="176" font-size="32">Polishing the same page, again and again.</text>
<g id="desk">
<path class="ink" d="M300 600v-70q0-80 90-82q60 0 70 50l10 102z"/>
<circle class="ink" cx="420" cy="430" r="36"/>
<path class="s-ink" d="M430 520L580 586" stroke-width="14" stroke-linecap="round"/>
<rect class="s-line" x="540" y="584" width="180" height="14" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="160" y="600" width="700" height="14" rx="4"/>
<path class="s-ink" d="M210 614v150M810 614v150" stroke-width="10" stroke-linecap="round"/>
<circle class="s-ink" cx="720" cy="400" r="56" fill="var(--stage)" stroke-width="6"/>
<path id="hM" class="s-ink" d="M720 400v-40" stroke-width="6" stroke-linecap="round"/>
<path id="hH" class="s-loss" d="M720 400v-26" stroke-width="8" stroke-linecap="round"/>
<text class="m" x="720" y="496" font-size="26" text-anchor="middle">HOURS</text>
</g>
<g id="page"><rect class="s-ink" x="1000" y="230" width="420" height="500" rx="10" fill="var(--stage)" stroke-width="6"/><g id="pLines"></g></g>
<g id="pMarks"></g>
<g id="ready"><g transform="rotate(-6 1210 682)"><rect x="1070" y="650" width="280" height="64" rx="10" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="m" x="1210" y="690" font-size="24" text-anchor="middle" style="fill:var(--loss)">NOT READY YET</text></g></g>
<g id="look"><text class="d5" x="120" y="830" font-size="40">Looks like dedication.</text></g>
<g id="grow"><text class="d" x="760" y="830" font-size="40" style="fill:var(--loss)">But it works against growth.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Extra effort, same results.</text>
<text class="b" x="120" y="176" font-size="32">Research on perfectionism at work.</text>
<g id="chart">
<path class="s-ink" d="M160 720H1000" stroke-width="6" stroke-linecap="round"/>
<rect class="loss" x="160" y="222" width="24" height="24" rx="4"/><text class="m" x="196" y="242" font-size="20">PERFECTIONISTS</text>
<rect class="ink" x="480" y="222" width="24" height="24" rx="4"/><text class="m" x="516" y="242" font-size="20">COLLEAGUES</text>
<text class="m" x="340" y="764" font-size="22" text-anchor="middle">EFFORT</text>
</g>
<rect id="b0" class="loss" x="220" y="720" width="110" height="0" rx="6"/>
<rect id="b1" class="ink" x="350" y="720" width="110" height="0" rx="6"/>
<rect id="b2" class="loss" x="600" y="720" width="110" height="0" rx="6"/>
<rect id="b3" class="ink" x="730" y="720" width="110" height="0" rx="6"/>
<g id="resL"><text class="m" x="720" y="764" font-size="22" text-anchor="middle">PERFORMANCE</text></g>
<g id="eq"><text class="d" x="720" y="430" font-size="64" text-anchor="middle">=</text></g>
<g id="gap"><path class="s-loss" d="M470 320h22v180h-22" fill="none" stroke-width="4" stroke-dasharray="8 6"/><text class="m" x="504" y="420" font-size="20" style="fill:var(--loss)">EXTRA EFFORT</text></g>
<g id="buy"><text class="d" x="1080" y="400" font-size="40">The polishing</text><text class="d" x="1080" y="452" font-size="40">doesn’t buy what</text><text class="d" x="1080" y="504" font-size="40" style="fill:var(--loss)">it promises.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Three hidden costs.</text>
<text class="b" x="120" y="176" font-size="32">Why chasing flawless holds people back.</text>
<g id="k0"><circle class="s-ink" cx="310" cy="390" r="64" fill="var(--stage)" stroke-width="10"/><path class="s-ink" d="M356 436l56 56" stroke-width="18" stroke-linecap="round"/><circle class="loss" cx="296" cy="380" r="8"/><circle class="loss" cx="326" cy="404" r="5"/></g>
<g id="k1"><rect class="s-ink" x="740" y="300" width="120" height="200" rx="6" fill="var(--stage)" stroke-width="8"/><circle class="ink" cx="840" cy="404" r="8"/><rect class="loss" x="782" y="372" width="36" height="30" rx="4"/><path class="s-loss" d="M788 372v-12a12 12 0 0 1 24 0v12" fill="none" stroke-width="5"/><path class="s-ink" d="M710 500h180" stroke-width="8" stroke-linecap="round"/></g>
<g id="k2"><circle class="ink" cx="1233" cy="390" r="40"/><circle class="ink" cx="1283" cy="366" r="52"/><circle class="ink" cx="1328" cy="396" r="34"/><rect class="ink" x="1233" y="390" width="95" height="40"/><path class="loss" d="M1280 436l-26 50h24l-14 46 44-64h-24l16-32z"/></g>
<g id="road"><path id="roadL" class="s-gain" d="M120 770H1480" stroke-width="10" stroke-linecap="round"/><circle id="roadD" class="gain" cx="1480" cy="770" r="18"/><text class="m" x="120" y="830" font-size="20">HOW FAR THEY CAN TRAVEL</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Wabi sabi.</text>
<g id="wsub"><text class="b" x="120" y="176" font-size="32">A Japanese idea: finding beauty in imperfection.</text></g>
<g id="bowl">
<path class="s-ink" d="M300 420Q306 650 520 652Q734 650 744 420" fill="var(--stage)" stroke-width="8" stroke-linejoin="round"/>
<path class="s-ink" d="M300 420Q350 398 420 414T540 408T650 424T744 420" fill="none" stroke-width="8" stroke-linecap="round"/>
<rect class="ink" x="460" y="648" width="120" height="22" rx="6"/>
</g>
<path id="crk" class="s-gain" d="M600 414l-18 54l26 44l-20 52l14 40" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="bl"><text class="m" x="300" y="372" font-size="20">UNEVEN RIM</text><text class="m" x="578" y="520" font-size="20" text-anchor="end" style="fill:var(--gain)">A SMALL CRACK</text><path class="s-gain" d="M584 513h12" stroke-width="3" stroke-linecap="round"/></g>
<g id="wtx"><text class="d" x="880" y="420" font-size="52">Its flaws are</text><text class="d" x="880" y="484" font-size="52" style="fill:var(--gain)">its character,</text><text class="b" x="880" y="540" font-size="32">not a reason to throw it away.</text></g>
<g id="wgr"><text class="d" x="120" y="800" font-size="44">Progress never requires being <tspan style="fill:var(--gain)">flawless.</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Excellence, not perfection.</text>
<text class="b" x="120" y="176" font-size="32">Keep the high bar. Then finish, share, improve.</text>
<g id="hbg"><path class="s-gain" d="M120 290H880" stroke-width="10" stroke-linecap="round"/><text class="m" x="120" y="266" font-size="20" style="fill:var(--gain)">THE HIGH BAR</text></g>
<g id="steps"></g>
<g id="flag"><path class="s-ink" d="M800 340V236" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M800 238l70 22-70 22z"/></g>
<g id="mis"><text class="d" x="960" y="300" font-size="40">Mistakes are</text><text class="d" x="960" y="352" font-size="40" style="fill:var(--gain)">information,</text><text class="d" x="960" y="404" font-size="40">not verdicts.</text></g>
<g id="drafts">
<rect class="s-ink" x="960" y="470" width="180" height="230" rx="8" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M990 520h120M990 560h100M990 600h120" stroke-width="8" stroke-linecap="round"/>
<path class="s-gain" d="M1010 650l22 22 44-48" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-muted" x="1260" y="470" width="180" height="230" rx="8" fill="none" stroke-width="4" stroke-dasharray="10 10"/>
<text class="m" x="1050" y="750" font-size="18" text-anchor="middle" style="fill:var(--gain)">EXISTS</text>
<text class="m" x="1350" y="750" font-size="18" text-anchor="middle">STILL ON THE DESK</text>
</g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Choose your battles.</text>
<text class="b" x="120" y="176" font-size="32">Not every detail deserves the same care.</text>
<text class="m" x="120" y="236" font-size="20">WHAT YOU COULD POLISH</text>
<text class="m" x="760" y="236" font-size="20">WHERE YOUR ENERGY GOES</text>
<g id="rows"></g>
<g id="cnt"><text class="d" x="120" y="820" font-size="44">Polish the few. Let the rest be good enough.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Judge your progress.</text>
<text class="b" x="120" y="176" font-size="32">Who do you measure yourself against?</text>
<g id="ideal"><path class="s-muted" d="M1160 350L1300 280" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><text class="m" x="1280" y="236" font-size="22" text-anchor="end" style="fill:var(--muted)">THE IDEAL</text></g>
<g id="now"><text class="m" x="1120" y="556" font-size="20" text-anchor="middle" style="fill:var(--gain)">YOU NOW</text></g>
<g id="past"><text class="m" x="220" y="770" font-size="20" text-anchor="middle">YOU BEFORE</text></g>
<path id="conn" class="s-gain" d="M260 590Q640 360 1076 392" fill="none" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="dots"></g>
<g id="hfar"><text class="m" x="640" y="720" font-size="22" style="fill:var(--gain)">HOW FAR HAVE I COME?</text></g>
<g id="small"><text class="d" x="420" y="830" font-size="44">Small steps forward count.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Pick one project.</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">Share it now,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">imperfections</tspan> and all.</text></g>
<g id="qd"><text class="m" x="143" y="700" font-size="26">NOTICE WHAT YOU LEARN</text></g>
<g id="plane"><path class="gain" d="M0 0L240-90L80 40Z"/><path class="ink" d="M80 40L100 90L240-90Z"/></g>
</g>