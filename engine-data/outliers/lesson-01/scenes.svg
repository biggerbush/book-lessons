<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIERS · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The Mystery</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">of Roseto.</text>
<text class="b" x="120" y="600" font-size="32">Why one small town's health puzzled doctors and rewrote success.</text>
