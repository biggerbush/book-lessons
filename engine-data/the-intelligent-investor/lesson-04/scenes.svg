<text class="m" x="560" y="625" font-size="20" text-anchor="middle">HIGH</text>
<text class="m" x="360" y="665" font-size="22" text-anchor="middle">RISK</text>
</g>
<g id="gam"><g id="gamP"></g><g id="hrt"><path class="loss" d="M0 18C-30 0-30-22-15-24C-8-25-2-20 0-14C2-20 8-25 15-24C30-22 30 0 0 18Z"/></g>
<rect class="s-ink" x="960" y="440" width="64" height="64" rx="10" fill="var(--stage)" stroke-width="5"/>
<rect class="s-ink" x="1000" y="512" width="56" height="56" rx="10" fill="var(--stage)" stroke-width="5"/>
<circle class="ink" cx="980" cy="460" r="6"/><circle class="ink" cx="1004" cy="484" r="6"/><circle class="ink" cx="1028" cy="540" r="6"/>
<text class="m" x="910" y="690" font-size="20" text-anchor="middle">THE BOLD GAMBLER</text></g>
<path id="rx" class="s-loss" d="M150 330L1060 600M150 600L1060 330" pathLength="1" fill="none" stroke-width="12" stroke-linecap="round"/>
<g id="hurt"><path class="s-line" d="M1140 640H1460M1140 340V640" stroke-width="4" fill="none"/>
<path id="hl" class="s-loss" d="M1150 380L1230 420L1290 400L1350 520L1400 500L1450 620" pathLength="1" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text class="m" x="1140" y="690" font-size="20">CHASING RISK</text>
<text class="d" x="120" y="790" font-size="44">Graham: chasing risk is how people get hurt.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Reward follows effort, not risk.</text>
<text class="b" x="120" y="176" font-size="32">Aim for the return that matches the work you’ll do.</text>
<polygon class="ink" points="600,600 530,710 670,710"/>
