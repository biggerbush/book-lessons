<g id="s0">
<text class="m" x="120" y="150" font-size="28">ESSENTIALISM · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Make the essential</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">effortless.</text>
<text class="b" x="120" y="600" font-size="32">Build systems so what matters happens almost on its own.</text>
