<g id="nb4">
<g opacity=".55"><rect x="935" y="305" width="130" height="50" rx="12" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 6"/><text class="m" x="1000" y="337" font-size="18" text-anchor="middle">DECENT</text>
<rect x="1155" y="305" width="130" height="50" rx="12" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="8 6"/><text class="m" x="1220" y="337" font-size="18" text-anchor="middle">DECENT</text></g>
<path d="M950 300l100 60M1050 300l-100 60M1170 300l100 60M1270 300l-100 60" stroke="var(--loss)" stroke-width="5" stroke-linecap="round" fill="none"/>
</g>
<g id="st4a"><text class="d" x="120" y="800" font-size="44">Every open option stretches you thin.</text></g>
<g id="st4b"><text class="d" x="120" y="800" font-size="44">Tough criteria let you choose with <tspan style="fill:var(--gain)">confidence</tspan>.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Choosing between job offers.</text>
<text class="b" x="120" y="176" font-size="32">It’s tempting to take whichever looks good enough.</text>
<g id="ge5"><text class="m" x="160" y="340" font-size="24" style="fill:var(--loss)">GOOD ENOUGH? TAKE IT?</text></g>
<g id="offers5"></g>
<g id="pad5">
