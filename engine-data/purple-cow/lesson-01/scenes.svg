<g id="s0">
<text class="m" x="120" y="150" font-size="28">PURPLE COW · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">The day the cows</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">got boring.</text>
<text class="b" x="120" y="600" font-size="32">Why good things fade and different things get noticed.</text>
<path class="s-line" d="M1040 515h440" stroke-width="5" stroke-linecap="round"/>
<g id="t0c"></g>
<g id="t0p"></g>
<g id="t0x"><text class="d" x="1430" y="250" font-size="72" style="fill:var(--gain)">!</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">A drive through France.</text>
<text class="b" x="120" y="176" font-size="32">Seth Godin’s family road trip through the countryside.</text>
<path d="M120 540Q800 440 1480 540V700H120z" fill="var(--ice)"/>
<rect x="120" y="700" width="1360" height="110" fill="var(--line)"/>
<path d="M120 755h1360" stroke="var(--stage)" stroke-width="6" stroke-dasharray="30 30"/>
