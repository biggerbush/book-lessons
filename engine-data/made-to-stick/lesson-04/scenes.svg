<text class="m" x="930" y="498" font-size="20" text-anchor="middle">NEW YORK</text>
<circle id="mdot" class="gain" r="12"/>
</g>
<g id="k2">
<rect class="s-line" x="1066" y="420" width="414" height="340" rx="18" fill="var(--stage)" stroke-width="3"/>
