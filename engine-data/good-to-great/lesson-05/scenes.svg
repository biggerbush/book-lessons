<text class="d" x="400" y="530" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">1</text>
<text class="m" x="400" y="780" font-size="22" text-anchor="middle">BEST IN THE WORLD AT</text></g>
<g id="wish"><rect class="s-muted" x="740" y="260" width="320" height="140" rx="16" fill="none" stroke-width="4" stroke-dasharray="10 10"/><text class="m" x="770" y="306" font-size="20">WISH</text><text class="d5" x="770" y="362" font-size="36" fill-opacity=".6">Want to be best</text></g>
<g id="could"><path class="s-muted" d="M1080 330h60m-20-20 20 20-20 20" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1160" y="260" width="320" height="140" rx="16"/><text class="m" x="1190" y="306" font-size="20" style="fill:var(--on-gain)">TRULY</text><text class="d" x="1190" y="362" font-size="36" style="fill:var(--on-gain)">Could be best</text></g>
