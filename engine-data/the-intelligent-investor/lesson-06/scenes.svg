<g id="pR"><path class="s-ink" d="M0 0L-120 170M0 0L120 170" fill="none" stroke-width="4"/><path class="s-ink" d="M-130 170h260" stroke-width="8" stroke-linecap="round"/><rect class="loss" x="-37" y="120" width="74" height="46" rx="6"/><text class="m" x="0" y="214" font-size="20" text-anchor="middle">BILLS DUE IN A YEAR</text></g>
</g>
<g id="two"><text class="d" x="490" y="300" font-size="64" text-anchor="middle" style="fill:var(--gain)">≥ 2×</text></g>
