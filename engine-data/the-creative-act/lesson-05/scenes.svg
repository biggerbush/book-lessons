<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE CREATIVE ACT · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Experiment now,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">craft later.</text>
<text class="b" x="120" y="600" font-size="32">Why play must come first, and polish must wait its turn.</text>
<g id="hat1"><g id="cone"><path class="gain" d="M1140 470L1210 290L1280 470z"/><circle cx="1200" cy="400" r="8" fill="var(--stage)"/><circle cx="1228" cy="440" r="8" fill="var(--stage)"/><circle class="ink" cx="1210" cy="284" r="14"/></g><rect class="ink" x="1124" y="466" width="172" height="14" rx="7"/><text class="m" x="1210" y="530" font-size="22" text-anchor="middle">1 · PLAY</text></g>
<g id="hat2"><path class="ink" d="M1320 466a70 70 0 0 1 140 0z"/><path d="M1390 404v62" stroke="var(--stage)" stroke-width="6"/><rect class="ink" x="1306" y="462" width="168" height="16" rx="8"/><text class="m" x="1390" y="530" font-size="22" text-anchor="middle">2 · CRAFT</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Phase one: play.</text>
<text class="b" x="120" y="176" font-size="32">Once you have a promising seed, experiment.</text>
<rect class="s-line" x="160" y="240" width="1280" height="500" rx="24" fill="var(--stage)" stroke-width="4"/>
<text class="m" x="190" y="284" font-size="20">THE SANDBOX</text>
<g id="tries"></g>
<g id="seed1"><ellipse class="gain" cx="800" cy="490" rx="30" ry="20"/></g>
<g id="nj"><text class="d" x="120" y="820" font-size="46">No wrong answers yet, only discoveries.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try every direction.</text>
<text class="b" x="120" y="176" font-size="32">Rubin’s examples often come from the recording studio.</text>
<g id="desk"><rect class="s-line" x="120" y="240" width="440" height="460" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="290" font-size="20">IN THE STUDIO</text><circle id="rec" class="loss" cx="520" cy="283" r="10"/>
<circle class="s-ink" cx="340" cy="470" r="120" fill="none" stroke-width="8"/><g id="ticks"></g>
<line id="needle" class="s-gain" x1="340" y1="470" x2="340" y2="380" stroke-width="10" stroke-linecap="round"/><circle class="ink" cx="340" cy="470" r="16"/>
<text class="m" x="250" y="640" font-size="20" text-anchor="middle">SLOWER</text><text class="m" x="430" y="640" font-size="20" text-anchor="middle">FASTER</text></g>
<g id="rows"></g>
<g id="alive"><text class="d" x="120" y="800" font-size="46">The version you never expected comes alive.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Let the seed lead.</text>
<text class="b" x="120" y="176" font-size="32">Follow its energy, not the shape you planned.</text>
<g id="plan"><rect class="s-muted" x="360" y="360" width="120" height="320" fill="none" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="420" y="340" font-size="20" text-anchor="middle">THE PLAN</text></g>
<path id="stem" class="s-gain" d="M420 690C420 600 470 560 560 520S720 420 760 320" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="leaves"></g>
<path class="ink" d="M366 690h108l-14 56h-80z"/>
<g id="energy"><circle class="gain" cx="760" cy="320" r="14"/><text class="m" x="790" y="296" font-size="20" style="fill:var(--gain)">FOLLOW ITS ENERGY</text></g>
<g id="shelf"><rect class="s-line" x="1060" y="240" width="420" height="480" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="1090" y="290" font-size="20">SET ASIDE · NO GUILT</text>
<path class="s-ink" d="M1090 500h360" stroke-width="8" stroke-linecap="round"/><g id="jars"></g>
<text class="d5" x="1090" y="600" font-size="36">Rest it for now.</text><text class="d5" x="1090" y="656" font-size="36">Return later.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Phase two: craft.</text>
<text class="b" x="120" y="176" font-size="32">Once a direction clearly shines, you shape it.</text>
<g id="rul"><rect class="s-ink" x="300" y="260" width="1000" height="60" rx="6" fill="var(--stage)" stroke-width="5"/><g id="rticks"></g><text class="m" x="1320" y="298" font-size="20">JUDGMENT</text><path id="rmark" class="gain" d="M0 328l-12 22h24z"/></g>
<g id="bench"><rect class="ink" x="200" y="640" width="1200" height="28" rx="6"/><rect class="ink" x="230" y="668" width="24" height="100"/><rect class="ink" x="1346" y="668" width="24" height="100"/>
<polygon points="310,640 326,548 300,506 358,470 400,500 452,462 462,560 440,640" fill="var(--line)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
<path id="spark" class="gain" d="M380 395l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/></g>
<g id="st0"><text class="d5" x="380" y="730" font-size="36" text-anchor="middle">Shape</text></g>
<g id="st1"><path class="s-muted" d="M490 560h190m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="730,640 730,540 800,480 870,540 870,640" fill="var(--stage)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><text class="d5" x="800" y="730" font-size="36" text-anchor="middle">Edit</text></g>
<g id="st2"><path class="s-muted" d="M910 560h190m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="gain" x="1150" y="490" width="140" height="150" rx="40"/><text class="d5" x="1220" y="730" font-size="36" text-anchor="middle">Refine</text></g>
<g id="jud"><text class="d" x="120" y="830" font-size="40">Judgment helps now: the idea is proven alive.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why mixing hurts.</text>
<text class="b" x="120" y="176" font-size="32">The inner critic shows up during play.</text>
<path class="s-line" d="M320 740h440" stroke-width="6" stroke-linecap="round"/>
<g id="sprw"><path class="s-gain" d="M520 740v-110" stroke-width="7" stroke-linecap="round" fill="none"/><ellipse class="gain" cx="498" cy="660" rx="22" ry="10" transform="rotate(-30 498 660)"/><ellipse class="gain" cx="542" cy="645" rx="22" ry="10" transform="rotate(30 542 645)"/></g>
<g id="cloud"><circle class="loss" cx="450" cy="310" r="50"/><circle class="loss" cx="520" cy="280" r="70"/><circle class="loss" cx="600" cy="310" r="50"/><rect class="loss" x="450" y="300" width="150" height="60" rx="20"/><text class="m" x="680" y="300" font-size="20">INNER CRITIC</text></g>
<g id="rain"></g>
<g id="std"><path class="s-muted" d="M780 740V420M780 500h20M780 580h20M780 660h20" stroke-width="6" stroke-linecap="round"/><path class="s-loss" d="M780 420H600" stroke-width="4" stroke-dasharray="10 8"/><text class="m" x="780" y="400" font-size="20" text-anchor="middle">FINISHED STANDARD</text></g>
<g id="dis"><text class="m" x="520" y="800" font-size="22" text-anchor="middle" style="fill:var(--loss)">QUIETLY DISMISSED</text></g>
<g id="might"><rect class="s-line" x="1000" y="240" width="480" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="s-line" d="M1040 680h400" stroke-width="5" stroke-linecap="round"/>
<path class="s-ink" d="M1110 680q-14-30 6-62" fill="none" stroke-width="6" stroke-linecap="round"/><ellipse class="ink" cx="1128" cy="626" rx="16" ry="8" transform="rotate(-20 1128 626)"/>
<text class="m" x="1110" y="730" font-size="20" text-anchor="middle">AWKWARD EARLY</text>
<g id="ghost"><path class="s-muted" d="M1170 620h50m-14-14 14 14-14 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="s-gain" d="M1340 680V530" stroke-width="8" stroke-dasharray="12 10" fill="none"/><circle class="s-gain" cx="1340" cy="430" r="100" fill="none" stroke-width="6" stroke-dasharray="14 10"/><text class="m" x="1340" y="730" font-size="20" text-anchor="middle" style="fill:var(--gain)">REMARKABLE LATER?</text></g></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep the phases apart in time.</text>
<text class="b" x="120" y="176" font-size="32">Sessions only for trying. Save the fixing for later.</text>
<g id="clk"><circle class="s-ink" cx="200" cy="320" r="56" fill="var(--stage)" stroke-width="7"/><path id="hand" class="s-ink" d="M200 320v-38" stroke-width="7" stroke-linecap="round"/><circle class="ink" cx="200" cy="320" r="7"/><text class="m" x="290" y="328" font-size="22">SEPARATE IN TIME</text></g>
<g id="b0"><rect class="gain" x="120" y="420" width="420" height="120" rx="16"/><text class="d5" x="150" y="494" font-size="34" style="fill:var(--on-gain)">Play: only trying</text></g>
<g id="b1"><rect class="gain" x="580" y="420" width="420" height="120" rx="16"/><text class="d5" x="610" y="494" font-size="34" style="fill:var(--on-gain)">Play: only trying</text></g>
<g id="b2"><rect class="s-ink" x="1040" y="420" width="436" height="120" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1070" y="494" font-size="34">Craft, later</text></g>
<g id="nofix"><text class="m" x="150" y="600" font-size="20" style="fill:var(--loss)">NO FIXING ALLOWED</text><text class="m" x="610" y="600" font-size="20" style="fill:var(--loss)">NO FIXING ALLOWED</text></g>
<g id="nb"><rect class="s-ink" x="1180" y="630" width="160" height="170" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-line" d="M1210 680h100M1210 720h100M1210 760h70" stroke-width="5" stroke-linecap="round"/><path class="s-ink" d="M1168 660h24M1168 700h24M1168 740h24M1168 780h24" stroke-width="6" stroke-linecap="round"/>
<text class="m" x="1140" y="710" font-size="20" text-anchor="end">NOTES TO IMPROVE</text><text class="m" x="1140" y="742" font-size="20" text-anchor="end">SAVED FOR CRAFTING</text></g>
<g id="notes"></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Both have a place.</text>
<text class="b" x="120" y="176" font-size="32">Each phase does its best work when the other waits its turn.</text>
<g id="bal"><path class="s-ink" d="M800 340V740" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="680" y="740" width="240" height="24" rx="12"/>
<line id="beam" class="s-ink" x1="480" y1="340" x2="1120" y2="340" stroke-width="10" stroke-linecap="round"/><g id="panL"></g><g id="panR"></g><circle class="gain" cx="800" cy="340" r="18"/></g>
<g id="care"><text class="d5" x="120" y="830" font-size="38">Rubin cares deeply about careful refinement.</text></g>
</g>

<g id="s8" opacity="0">
<g id="sw"><rect class="ink" x="1240" y="250" width="40" height="26" rx="6"/><path class="s-ink" d="M1260 276v20" stroke-width="10"/><circle class="s-ink" cx="1260" cy="450" r="150" fill="var(--stage)" stroke-width="10"/><path id="sweep" class="gain"/><circle cx="1260" cy="450" r="100" fill="var(--stage)"/>
<text class="d" x="1260" y="470" font-size="72" text-anchor="middle">20</text><text class="m" x="1260" y="510" font-size="22" text-anchor="middle">MIN</text></g>
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which version</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">surprises you</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">most?</text></g>
<g id="tw"><text class="m" x="143" y="700" font-size="26">ONE PROJECT · 20 MINUTES · NO JUDGING</text></g>
</g>