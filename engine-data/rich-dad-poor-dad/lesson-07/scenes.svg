<rect class="s-ink" x="120" y="490" width="200" height="100" rx="14" fill="var(--stage)" stroke-width="5"/><text class="d5" x="220" y="553" font-size="36" text-anchor="middle">Pay</text>
<path class="s-muted" d="M335 540h65m-16-16 16 16-16 16M735 540h65m-16-16 16 16-16 16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="gain" x="420" y="490" width="300" height="100" rx="14"/><text class="d5" x="570" y="553" font-size="36" text-anchor="middle" style="fill:var(--on-gain)">Assets first</text>
<rect x="820" y="490" width="240" height="100" rx="14" fill="var(--stage)" stroke="var(--loss)" stroke-width="5"/><text class="d5" x="940" y="553" font-size="36" text-anchor="middle" style="fill:var(--loss)">Bills</text></g>
<g id="pile"></g>
<g id="plab"><text class="m" x="1250" y="680" font-size="20" text-anchor="middle">UNPAID BILLS</text></g>
<g id="push"><path class="s-gain" d="M1430 620V390m-20 20 20-20 20 20" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1460" y="350" font-size="20" text-anchor="end" style="fill:var(--gain)">EARN MORE</text></g>
<g id="caut"><text class="m" x="120" y="750" font-size="20" style="fill:var(--loss)">KIYOSAKI’S CAUTION</text><text class="d" x="120" y="800" font-size="38">Keep debts small, so pressure never turns into a crisis.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Arrogance = ego + ignorance.</text>
<text class="b" x="120" y="176" font-size="32">Kiyosaki’s formula, and what to do about it.</text>
<g id="egoW"><g id="ego" transform="translate(300 360)"><circle class="loss" r="100"/><text class="d" x="0" y="16" font-size="48" text-anchor="middle" style="fill:var(--stage)">EGO</text></g></g>
