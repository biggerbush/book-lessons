<text class="m" x="340" y="714" font-size="20">LEAST ENJOYABLE</text><rect id="e1" x="340" y="724" height="26" rx="6" width="0" fill="var(--muted)"/></g>
<g id="feel"><text class="d" x="120" y="830" font-size="40">Practice that works often doesn’t feel good.</text></g>
</g>
<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="330" font-size="80" letter-spacing="-2">What small weakness</text></g>
<g id="qb"><text class="d" x="136" y="430" font-size="80" letter-spacing="-2">will you work on</text></g>
<g id="qc"><text class="d" x="136" y="530" font-size="80" letter-spacing="-2"><tspan style="fill:var(--gain)">this week?</tspan></text></g>
<g id="nb"><rect class="s-ink" x="1160" y="240" width="280" height="340" rx="14" fill="var(--stage)" stroke-width="7"/>
