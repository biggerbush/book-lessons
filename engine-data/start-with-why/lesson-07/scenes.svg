<g id="s0">
<text class="m" x="120" y="150" font-size="28">START WITH WHY · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">When the Why</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">Goes Fuzzy.</text>
<text class="b" x="120" y="600" font-size="32">How growth can quietly bury the reason you started.</text>
<g id="bars0"></g>
<g id="tag0"><path class="gain" d="M-150 -70h260a20 20 0 0 1 20 20v100a20 20 0 0 1-20 20h-260l-60-70z"/><circle cx="-160" cy="0" r="14" fill="var(--stage)"/><text class="d" x="-10" y="26" font-size="72" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g>
<text class="m" x="1270" y="610" font-size="20" text-anchor="middle">RESULTS GROW · PURPOSE SHRINKS</text>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">It started with people.</text>
<text class="b" x="120" y="176" font-size="32">Sam Walton’s first store, in small-town Arkansas.</text>
<g id="store1">
<path class="s-ink" d="M150 410L360 290L570 410" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s-ink" x="190" y="410" width="340" height="280" fill="var(--stage)" stroke-width="7"/>
<rect class="s-ink" x="320" y="560" width="80" height="130" fill="none" stroke-width="6"/>
<rect class="gain" x="220" y="450" width="80" height="70"/><rect class="gain" x="420" y="450" width="80" height="70"/>
<text class="m" x="360" y="740" font-size="20" text-anchor="middle">SMALL-TOWN ARKANSAS</text>
</g>
<g id="wal1"></g>
<g id="ppl1"></g>
<g id="lp1"><rect class="gain" x="560" y="720" width="440" height="70" rx="35"/><text class="d5" x="780" y="767" font-size="32" text-anchor="middle" style="fill:var(--on-gain)">Low prices = the how</text><text class="m" x="780" y="830" font-size="20" text-anchor="middle">A WAY TO SERVE, NOT THE POINT</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Growth arrives.</text>
<text class="b" x="120" y="176" font-size="32">Walmart became one of the largest companies in the world.</text>
<rect class="s-line" x="120" y="220" width="1360" height="540" rx="30" fill="none" stroke-width="3"/>
<g id="rays2"></g><g id="dots2"></g>
<circle id="ring2" class="s-gain" cx="800" cy="490" r="60" fill="none" stroke-width="6"/>
<g id="wal2"></g>
<g id="cap2"><text class="d" x="120" y="830" font-size="44">His purpose stayed visible to everyone.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The founder leaves.</text>
<text class="b" x="120" y="176" font-size="32">In 1992, Sam Walton died.</text>
<g id="why3"><g id="why3i"><rect class="gain" x="210" y="240" width="180" height="70" rx="35"/><text class="d" x="300" y="290" font-size="44" text-anchor="middle" style="fill:var(--on-gain)">WHY</text></g></g>
<rect class="s-muted" x="250" y="340" width="100" height="150" rx="14" fill="none" stroke-width="7"/>
<path class="s-muted" d="M230 500h140M245 500v100M355 500v100" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="wal3"></g>
<rect class="ink" x="440" y="540" width="1040" height="20" rx="6"/>
<g id="succ3"></g>
<g id="items3"></g>
<g id="cap3"><text class="d" x="120" y="820" font-size="44">But the reason behind them began to fade.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cheap became the goal.</text>
<text class="b" x="120" y="176" font-size="32">Price turned from a way of serving people into the whole point.</text>
<path class="s-ink" d="M560 340V700M470 700h180" stroke-width="8" stroke-linecap="round"/>
<path id="beam4" class="s-ink" d="M260 340H860" stroke-width="10" stroke-linecap="round"/>
<circle class="ink" cx="560" cy="340" r="14"/>
<g id="pans4"></g>
<g id="cap4"><text class="m" x="120" y="790" font-size="22">CHEAPER AND CHEAPER, AT THE EXPENSE OF PEOPLE</text></g>
<g id="nw0"><rect class="s-ink" x="1000" y="240" width="460" height="130" rx="10" fill="var(--stage)" stroke-width="5"/><text class="d" x="1030" y="300" font-size="40">Bad press</text><path class="s-line" d="M1030 330h380M1030 350h260" stroke-width="6" stroke-linecap="round"/></g>
<g id="nw1"><rect class="s-ink" x="1000" y="400" width="460" height="130" rx="10" fill="var(--stage)" stroke-width="5"/><text class="d" x="1030" y="460" font-size="40">Lawsuits</text><path class="s-line" d="M1030 490h380M1030 510h260" stroke-width="6" stroke-linecap="round"/></g>
<g id="nw2"><rect class="s-loss" x="1000" y="570" width="460" height="150" rx="10" fill="none" stroke-width="5"/>
<path class="s-ink" d="M1030 640l40-30 40 30M1038 640v50h64v-50" fill="none" stroke-width="5" stroke-linejoin="round"/>
<path class="s-loss" d="M1025 600l90 100M1115 600l-90 100" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="1140" y="635" font-size="28">Some towns fought</text><text class="d5" x="1140" y="675" font-size="28">to keep stores out.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The split.</text>
<text class="b" x="120" y="176" font-size="32">What a company does grows louder. Why it does it grows quieter.</text>
<path class="s-ink" d="M200 230V720H1420" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m" x="1420" y="760" font-size="20" text-anchor="end">TIME</text>
<path id="base5" class="s-ink" d="M200 560H600" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="spl5"><path class="s-muted" d="M600 240V700" stroke-width="3" stroke-dasharray="8 8"/><text class="m" x="616" y="262" font-size="20">THE SPLIT</text></g>
<path id="what5" class="s-ink" d="M600 560C900 540 1100 400 1380 260" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="wl5"><text class="d" x="1380" y="236" font-size="40" text-anchor="end">WHAT</text></g>
<path id="why5" class="s-gain" d="M600 560C900 580 1100 630 1380 660" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="yl5"><text class="d" x="1380" y="634" font-size="32" text-anchor="end" style="fill:var(--gain)">WHY</text></g>
<g id="cap5"><text class="d" x="120" y="800" font-size="44">Results become the purpose.</text><text class="d" x="900" y="800" font-size="44" style="fill:var(--loss)">Trust cracks.</text><path class="s-loss" d="M1256 764l10 8-8 8 10 8-8 10" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it happens.</text>
<g id="sub6"><text class="b" x="120" y="176" font-size="32">Growth itself is not the problem.</text></g>
<g id="org6">
<circle id="glow6" class="gain" cx="560" cy="300" r="70" fill-opacity=".18"/>
<g id="fd6"><text class="m" x="650" y="300" font-size="20">FOUNDER</text></g>
<g id="ln6"></g><g id="mg6"></g><g id="fl6"></g>
<g id="fll6"><text class="m" x="900" y="720" font-size="20">FRONT LINE</text></g>
</g>
<g id="sh6">
<text class="m" x="1060" y="236" font-size="20">WHAT GETS MEASURED</text>
<rect class="s-ink" x="1060" y="260" width="420" height="360" rx="12" fill="var(--stage)" stroke-width="5"/>
<path class="s-line" d="M1060 380h420M1060 500h420M1210 260v360" stroke-width="3"/>
<text class="m" x="1085" y="328" font-size="22">SALES</text>
<text class="m" x="1085" y="448" font-size="22">COSTS</text>
<text class="m" x="1085" y="568" font-size="22" style="fill:var(--gain)">WHY</text>
<rect id="bs6" class="ink" x="1235" y="300" width="0" height="40" rx="6"/>
<rect id="bc6" class="ink" x="1235" y="420" width="0" height="40" rx="6"/>
<g id="q6"><text class="d" x="1345" y="582" font-size="64" text-anchor="middle" style="fill:var(--loss)">?</text></g>
</g>
<g id="cap6"><text class="d" x="120" y="836" font-size="40">Easy to count. Easy to lose sight of why.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Keep the why clear.</text>
<text class="b" x="120" y="176" font-size="32">Make purpose someone’s job, at every level.</text>
<g id="k0"><rect class="s-line" x="120" y="250" width="310" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="gain" cx="275" cy="380" r="34"/><path class="gain" d="M224 523v-44a51 51 0 0 1 102 0v44z"/>
<rect x="249" y="488" width="52" height="28" rx="6" fill="var(--stage)"/><text class="m" x="275" y="508" font-size="18" text-anchor="middle" style="fill:var(--gain)">WHY</text>
<text class="d5" x="275" y="610" font-size="28" text-anchor="middle">Make it a job</text><text class="m" x="275" y="650" font-size="18" text-anchor="middle">SOMEONE’S REAL JOB</text></g>
<g id="k1"><rect class="s-line" x="470" y="250" width="310" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="ink" x="545" y="390" width="34" height="60" rx="6"/><path class="ink" d="M575 390l70-45v150l-70-45z"/>
<path id="a70" class="s-gain" d="M670 395a35 35 0 0 1 0 50" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="a71" class="s-gain" d="M690 375a60 60 0 0 1 0 90" fill="none" stroke-width="6" stroke-linecap="round"/>
<path id="a72" class="s-gain" d="M710 355a90 90 0 0 1 0 130" fill="none" stroke-width="6" stroke-linecap="round"/>
<text class="d5" x="625" y="610" font-size="28" text-anchor="middle">Say it often</text><text class="m" x="625" y="650" font-size="18" text-anchor="middle">AT EVERY LEVEL</text></g>
<g id="k2"><rect class="s-line" x="820" y="250" width="310" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<g id="cand7"></g>
<path id="ck7" class="s-gain" d="M955 320l14 14 28-30" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<text class="d5" x="975" y="610" font-size="28" text-anchor="middle">Pick believers</text><text class="m" x="975" y="648" font-size="18" text-anchor="middle">SHARED BELIEF,</text><text class="m" x="975" y="674" font-size="18" text-anchor="middle">NOT JUST SKILL</text></g>
<g id="k3"><rect class="s-line" x="1170" y="250" width="310" height="440" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-ink" x="1265" y="320" width="120" height="170" rx="10" fill="var(--stage)" stroke-width="6"/><rect class="ink" x="1295" y="308" width="60" height="24" rx="6"/>
<path class="s-line" d="M1290 370h70M1290 405h70" stroke-width="6" stroke-linecap="round"/>
<path id="chk7" class="s-gain" d="M1295 445l22 22 48-56" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<text class="d5" x="1325" y="610" font-size="28" text-anchor="middle">Ask before deciding</text><text class="m" x="1325" y="650" font-size="18" text-anchor="middle">DOES IT SERVE WHY?</text></g>
<g id="cap7"><text class="d" x="120" y="790" font-size="40">Does this still serve the reason we started?</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Is your <tspan style="fill:var(--gain)">why</tspan> still</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">loud, or has it</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2">gone quiet?</text></g>
<g id="ql"><text class="m" x="143" y="700" font-size="26">YOUR TEAM · YOUR BUSINESS · YOUR FAMILY</text></g>
<g id="spk8"><rect class="ink" x="1160" y="415" width="44" height="80" rx="8"/><path class="ink" d="M1200 415l70-55v190l-70-55z"/>
<path id="w80" class="s-gain" d="M1300 425a40 40 0 0 1 0 60" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="w81" class="s-gain" d="M1325 400a75 75 0 0 1 0 110" fill="none" stroke-width="8" stroke-linecap="round"/>
<path id="w82" class="s-gain" d="M1350 375a110 110 0 0 1 0 160" fill="none" stroke-width="8" stroke-linecap="round"/></g>
