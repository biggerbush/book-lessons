<g id="me7"></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="290" font-size="88" letter-spacing="-2">Which one piece of your work,</text></g>
<g id="qb"><text class="d" x="136" y="390" font-size="88" letter-spacing="-2">if made truly excellent,</text></g>
<g id="qc"><text class="d" x="136" y="490" font-size="88" letter-spacing="-2">would earn you the freedom</text></g>
<g id="qd"><text class="d" x="136" y="590" font-size="88" letter-spacing="-2" style="fill:var(--gain)">to slow down?</text></g>
<g id="qgem"></g>
