<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE MOUNTAIN IS YOU · LESSON 6</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Becoming your</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">future self.</text>
<text class="b" x="120" y="600" font-size="32">Let the person you're becoming guide today's small choices.</text>
