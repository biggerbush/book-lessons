<g id="k1"><text class="d" x="120" y="790" font-size="40">Ready for every hit he expected.</text></g>
<g id="k2"><text class="d" x="120" y="846" font-size="40" style="fill:var(--loss)">Defenceless against the one he didn’t.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">The biggest news was a surprise.</text>
<text class="b" x="120" y="176" font-size="32">Housel: the century’s biggest events share a pattern.</text>
<g id="np"></g>
<g id="rs"><text class="d" x="120" y="800" font-size="44">Surprises reshaped the world more than any forecast.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Forecasts miss the blank spaces.</text>
<text class="b" x="120" y="176" font-size="32">A forecast can only include risks someone already imagined.</text>
<g id="ball">
<circle class="s-ink" cx="330" cy="440" r="120" fill="var(--stage)" stroke-width="7"/>
<circle class="gain" cx="300" cy="420" r="12"/><circle class="gain" cx="360" cy="400" r="12"/><circle class="gain" cx="340" cy="470" r="12"/>
<path class="ink" d="M250 600L270 560h120l20 40z"/>
<text class="m" x="330" y="660" font-size="22" text-anchor="middle">ONLY IMAGINED RISKS</text>
</g>
