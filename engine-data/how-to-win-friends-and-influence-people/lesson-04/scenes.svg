<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO WIN FRIENDS AND INFLUENCE PEOPLE · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Be interested,</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">not interesting.</text>
<text class="b" x="120" y="600" font-size="32">Why curiosity, listening and names win more friends than showing off.</text>
<g id="tPpl"></g>
<g id="tStarG"></g>
<g id="tQ"><path class="s-gain" d="M1365 250l15 28 15-28" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-gain" x="1335" y="186" width="90" height="70" rx="18" fill="var(--stage)" stroke-width="5"/><text class="d" x="1380" y="240" font-size="48" text-anchor="middle" style="fill:var(--gain)">?</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Be like the friendly dog.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie’s greatest friend-maker on earth.</text>
<path class="s-line" d="M140 712h1300" stroke-width="4"/>
<g id="pod"><rect class="s-ink" x="170" y="520" width="140" height="180" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M240 520v-36" stroke-width="6"/><circle class="ink" cx="240" cy="472" r="13"/><circle class="gain" cx="240" cy="600" r="26"/><text class="m" x="240" y="750" font-size="20" text-anchor="middle">SHOWING OFF</text></g>
<path id="podX" class="s-loss" d="M160 450L320 710M320 450L160 710" stroke-width="9" stroke-linecap="round"/>
<g id="dog"><g id="dogB">
<path id="tail" class="s-ink" d="M465 560Q420 520 410 470" fill="none" stroke-width="16" stroke-linecap="round"/>
<path class="s-ink" d="M510 620v70M560 625v65M650 625v65M700 620v70" stroke-width="22" stroke-linecap="round"/>
<ellipse class="ink" cx="600" cy="580" rx="140" ry="64"/>
<circle class="ink" cx="760" cy="500" r="58"/><ellipse class="ink" cx="814" cy="516" rx="28" ry="22"/>
<ellipse class="gain" cx="808" cy="548" rx="10" ry="16"/>
<ellipse cx="726" cy="504" rx="18" ry="38" fill="var(--muted)"/>
<circle cx="774" cy="486" r="8" fill="var(--stage)"/>
</g></g>
<g id="dogP"></g>
<g id="hearts"></g>
<g id="dogMsg"><text class="d" x="120" y="820" font-size="44">Be interested in others, not interesting to them.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The botanist at dinner.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie knew almost nothing about plants, so he asked questions.</text>
<g id="table"><g id="dinPpl"></g><rect class="ink" x="380" y="600" width="840" height="24" rx="12"/><path class="s-ink" d="M460 624v120M1140 624v120" stroke-width="10" stroke-linecap="round"/>
<text class="m" x="520" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">CARNEGIE</text><text class="m" x="1080" y="800" font-size="20" text-anchor="middle">THE BOTANIST</text></g>
<g id="plant"><path class="s-gain" d="M800 540v-70" stroke-width="6"/><path class="gain" d="M800 500q-50-10-60-50q50 0 60 50z"/><path class="gain" d="M800 480q50-10 60-50q-50 0-60 50z"/><path class="ink" d="M760 600l-12-60h104l-12 60z"/></g>
<g id="qs"></g>
<g id="bBub"><path class="s-ink" d="M1040 330l25 40 15-40" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-ink" x="900" y="240" width="220" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-gain" d="M930 280h160M930 310h120" stroke-width="6" stroke-linecap="round"/></g>
<g id="clk"><circle class="s-ink" cx="1340" cy="320" r="70" fill="var(--stage)" stroke-width="7"/><g id="ticks"></g><path id="hand2" class="s-ink" d="M1340 320h30" stroke-width="8" stroke-linecap="round"/><path id="hand" class="s-gain" d="M1340 320v-50" stroke-width="7" stroke-linecap="round"/><text class="m" x="1340" y="430" font-size="20" text-anchor="middle">HOURS</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">A great talker?</text>
<text class="b" x="120" y="176" font-size="32">The botanist praised Carnegie to the host.</text>
<g id="s3ppl"><text class="m" x="300" y="750" font-size="20" text-anchor="middle">BOTANIST</text><text class="m" x="560" y="750" font-size="20" text-anchor="middle">HOST</text></g>
<g id="bub3"><path class="s-ink" d="M280 400L300 480L340 400" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><rect class="s-ink" x="140" y="250" width="620" height="170" rx="24" fill="var(--stage)" stroke-width="5"/>
<g id="quote"><text class="d5" x="170" y="320" font-size="40">“A most interesting</text><text class="d5" x="170" y="376" font-size="40">conversationalist.”</text></g></g>
<g id="bars"><text class="m" x="880" y="270" font-size="20">WHO DID THE TALKING</text><text class="m" x="880" y="332" font-size="20">BOTANIST</text><rect id="barB" class="ink" x="880" y="345" height="70" width="0" rx="8"/><text class="m" x="880" y="462" font-size="20" style="fill:var(--gain)">CARNEGIE</text><rect id="barC" class="gain" x="880" y="475" height="70" width="0" rx="8"/></g>
<g id="zip"><circle class="s-ink" cx="960" cy="670" r="70" fill="var(--stage)" stroke-width="7"/><circle class="ink" cx="938" cy="648" r="7"/><circle class="ink" cx="982" cy="648" r="7"/><path class="s-ink" d="M920 700h80" stroke-width="6" stroke-linecap="round"/><path class="s-ink" d="M932 692v16M946 692v16M960 692v16M974 692v16M988 692v16" stroke-width="3"/><rect class="gain" x="996" y="694" width="14" height="22" rx="4"/><text class="m" x="1060" y="680" font-size="22">BARELY SAID A WORD</text></g>
<g id="heard"><text class="d" x="120" y="830" font-size="42">He just listened, and the botanist felt heard.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why it works.</text>
<text class="b" x="120" y="176" font-size="32">Most people are far more interested in themselves.</text>
<g id="mir"><ellipse class="s-ink" cx="480" cy="470" rx="90" ry="140" fill="var(--stage)" stroke-width="7"/><g id="refl"></g><path class="s-ink" d="M480 610v80M430 690h100" stroke-width="7" stroke-linecap="round"/><g id="mirP"></g><text class="m" x="120" y="760" font-size="20">THINKING ABOUT THEMSELVES</text></g>
<g id="ear"><path class="s-gain" d="M770 400c0-80 120-90 120-10c0 50-50 60-50 110c0 40-50 50-60 20" fill="none" stroke-width="14" stroke-linecap="round"/><path class="s-gain" d="M805 410c0-30 50-30 50 0c0 20-25 25-25 45" fill="none" stroke-width="10" stroke-linecap="round"/><g id="waves"></g>
<text class="m" x="830" y="620" font-size="20" text-anchor="middle">A GOOD LISTENER</text><text class="m" x="830" y="652" font-size="20" text-anchor="middle">FEELS RARE AND PRECIOUS</text></g>
<g id="qc0"><rect class="s-ink" x="1060" y="270" width="420" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1100" y="322" font-size="34">Their work?</text></g>
<g id="qc1"><rect class="s-ink" x="1060" y="380" width="420" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1100" y="432" font-size="34">Their hobbies?</text></g>
<g id="qc2"><rect class="s-ink" x="1060" y="490" width="420" height="80" rx="40" fill="var(--stage)" stroke-width="5"/><text class="d5" x="1100" y="542" font-size="34">Their plans?</text></g>
<g id="talk"><text class="d" x="1060" y="680" font-size="36" style="fill:var(--gain)">Then let them talk.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">The sweetest sound.</text>
<text class="b" x="120" y="176" font-size="32">Carnegie on why names matter.</text>
<g id="tag"><rect class="s-ink" x="120" y="240" width="480" height="300" rx="24" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="123" y="243" width="474" height="87" rx="21"/><rect class="gain" x="123" y="300" width="474" height="30"/><text class="m" x="360" y="298" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">HELLO, MY NAME IS</text><text class="d" x="360" y="450" font-size="56" text-anchor="middle">Your name</text><path class="s-line" d="M170 480h380" stroke-width="4"/></g>
<g id="sweet"><text class="d5" x="120" y="610" font-size="32">“The sweetest and most important</text><text class="d5" x="120" y="654" font-size="32">sound in any language.”</text></g>
<g id="far"><text id="farN" class="d" x="720" y="350" font-size="110" letter-spacing="-3">50,000</text><text class="m" x="720" y="400" font-size="20">FIRST NAMES JIM FARLEY COULD CALL</text><g id="dots"></g></g>
<g id="wh"><path class="s-ink" d="M1260 640v-40" stroke-width="4"/><rect class="gain" x="1260" y="600" width="30" height="18"/><path class="s-ink" d="M1060 700L1260 640L1460 700z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><rect class="s-ink" x="1080" y="700" width="360" height="120" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M1130 715v90M1190 715v90M1250 715v90M1310 715v90M1370 715v90" stroke-width="6"/></g>
<g id="whT"><text class="m" x="720" y="760" font-size="20">HELPED PUT ROOSEVELT</text><text class="m" x="720" y="792" font-size="20" style="fill:var(--gain)">IN THE WHITE HOUSE</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Rabbits and railroads.</text>
<text class="b" x="120" y="176" font-size="32">Andrew Carnegie named things after people.</text>
<rect class="s-line" x="120" y="230" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect class="s-line" x="840" y="230" width="640" height="520" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="280" font-size="20">AS A BOY</text><text class="m" x="870" y="280" font-size="20">LATER</text>
<g id="rabs"></g>
<g id="food"></g>
<path id="bowl" class="s-ink" d="M370 690h140a70 36 0 0 1-140 0z" fill="var(--stage)" stroke-width="6"/>
<g id="boys"></g>
<g id="rtags"></g>
<g id="happy"><text class="d5" x="120" y="820" font-size="34">They worked happily.</text></g>
<g id="mill"><g id="smoke"></g><rect class="ink" x="1300" y="380" width="40" height="310"/><path class="s-ink" d="M900 690V540l100-60v60l100-60v60l100-60v60h60V690z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/></g>
<g id="sign"><rect class="gain" x="900" y="400" width="360" height="56" rx="10"/><text class="m" x="1080" y="435" font-size="18" text-anchor="middle" style="fill:var(--on-gain)">NAMED FOR THE PRESIDENT</text></g>
<g id="track"><path id="rails" d="M880 712h580M880 736h580" stroke-width="5" fill="none"/></g>
<g id="bought"><text class="d5" x="840" y="820" font-size="34">The railroad bought there.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it today.</text>
<text class="b" x="120" y="176" font-size="32">Three small moves in your next conversation.</text>
<g id="k0"><rect class="s-line" x="120" y="230" width="414" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="156" y="268" font-size="20">STEP 1</text>
<rect class="s-ink" x="230" y="290" width="190" height="220" rx="10" fill="var(--stage)" stroke-width="6"/><g id="rings"></g><path class="s-line" d="M270 350h120M270 390h120M270 430h80" stroke-width="5" stroke-linecap="round"/><path class="s-gain" d="M270 470h120" stroke-width="9" stroke-linecap="round"/>
<text class="d5" x="156" y="590" font-size="32">Say their name back,</text><text class="d5" x="156" y="634" font-size="32">then use it.</text></g>
<g id="k1"><rect class="s-line" x="593" y="230" width="414" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="629" y="268" font-size="20">STEP 2</text>
<g id="tiles"></g><path class="s-ink" d="M650 500h300" stroke-width="5" stroke-dasharray="10 10"/><path class="gain" d="M700 470l180-60 8 22-180 60-24 4z"/>
<text class="d5" x="629" y="590" font-size="32">Unusual name?</text><text class="d5" x="629" y="634" font-size="32">Ask how to spell it.</text></g>
<g id="k2"><rect class="s-line" x="1066" y="230" width="414" height="460" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="1102" y="268" font-size="20">STEP 3</text>
<g id="steam"></g><path class="s-ink" d="M1180 360h140v90a50 50 0 0 1-50 50h-40a50 50 0 0 1-50-50z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-ink" d="M1320 385a28 28 0 0 1 0 56" fill="none" stroke-width="7"/><path class="s-ink" d="M1160 520h180" stroke-width="7" stroke-linecap="round"/><text class="d" x="1250" y="455" font-size="48" text-anchor="middle" style="fill:var(--gain)">?</text>
<text class="d5" x="1102" y="590" font-size="30">Ask one real question.</text><text class="d5" x="1102" y="634" font-size="30">Stay curious.</text></g>
<g id="care"><path class="gain" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z" transform="translate(160 800) scale(.25)"/><text class="d" x="210" y="816" font-size="44">It only works if you genuinely care.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="80" letter-spacing="-2">In your next conversation,</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="80" letter-spacing="-2">can you talk less, ask more,</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="80" letter-spacing="-2">and remember <tspan style="fill:var(--gain)">their name</tspan>?</text></g>
<text class="m" x="143" y="700" font-size="26">TALK LESS · ASK MORE · REMEMBER THE NAME</text>
<g id="cal"><rect class="s-ink" x="1260" y="600" width="200" height="180" rx="16" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="1263" y="603" width="194" height="41" rx="13"/><rect class="gain" x="1263" y="624" width="194" height="20"/><path class="s-ink" d="M1300 585v30M1420 585v30" stroke-width="8" stroke-linecap="round"/><g id="days"></g></g>
</g>