<g id="s0">
<text class="m" x="120" y="150" font-size="28">NEVER SPLIT THE DIFFERENCE · LESSON 3</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Name their feelings</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">out loud.</text>
<text class="b" x="120" y="600" font-size="32">Calm fear and build trust by saying the feeling first.</text>
<path id="agit" class="s-loss" d="M1268 470l-34-22M1262 520h-40M1268 570l-34 22M1392 470l34-22M1398 520h40M1392 570l34 22" fill="none" stroke-width="7" stroke-linecap="round"/>
<g id="who0"></g>
<path id="sm0" d="M1312 534q18 16 36 0" fill="none" stroke="var(--stage)" stroke-width="5" stroke-linecap="round"/>
<g id="tag0"><g id="tagR">
