<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE PRACTICE · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Your work is a</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">generous gift.</text>
<text class="b" x="120" y="600" font-size="32">Hiding your work keeps something useful from someone who needs it.</text>
<g id="tg0"></g>
<g id="tw0"></g>
<g id="cover"><rect class="loss" x="1150" y="270" width="240" height="260" rx="16"/><path class="s-ink" d="M1150 300h240" stroke-width="5"/><text class="m" x="1270" y="246" font-size="24" text-anchor="middle" style="fill:var(--loss)">HIDDEN</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Finished work nobody has seen.</text>
<text class="b" x="120" y="176" font-size="32">Picture a drawer full of it.</text>
<g id="cab1">
<rect class="s-ink" x="200" y="300" width="520" height="480" rx="10" fill="var(--stage)" stroke-width="7"/>
<rect class="s-ink" x="230" y="330" width="460" height="200" rx="8" fill="none" stroke-width="5"/>
<rect class="s-ink" x="230" y="560" width="460" height="190" rx="8" fill="none" stroke-width="5"/>
<path class="s-ink" d="M410 380h100M410 655h100" stroke-width="10" stroke-linecap="round"/>
</g>
<g id="lk1"><path class="s-loss" d="M444 452v-14a16 16 0 0 1 32 0v14" fill="none" stroke-width="7"/><rect class="loss" x="430" y="452" width="60" height="45" rx="6"/><circle cx="460" cy="472" r="6" fill="var(--stage)"/><path d="M460 476v10" stroke="var(--stage)" stroke-width="4" stroke-linecap="round"/></g>
<g id="crd0"><rect class="s-ink" x="900" y="300" width="170" height="220" rx="10" fill="var(--stage)" stroke-width="5"/><circle class="gain" cx="960" cy="360" r="20"/><path class="s-ink" d="M920 480l40-60 30 30 30-40 30 70" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="985" y="560" font-size="20" text-anchor="middle">SKETCH</text></g>
<g id="crd1"><rect class="s-ink" x="1095" y="300" width="170" height="220" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M1120 350h120M1120 385h120M1120 420h120M1120 455h80" stroke-width="6" stroke-linecap="round"/><text class="m" x="1180" y="560" font-size="20" text-anchor="middle">ESSAY</text></g>
<g id="crd2"><rect class="s-ink" x="1290" y="300" width="170" height="220" rx="10" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1310 345h24v24h-24zM1310 395h24v24h-24zM1310 445h24v24h-24z" fill="none" stroke-width="4"/><path class="s-line" d="M1350 357h90M1350 407h90M1350 457h70" stroke-width="6" stroke-linecap="round"/><path class="s-gain" d="M1314 357l7 7 12-14M1314 407l7 7 12-14" fill="none" stroke-width="4"/><text class="m" x="1375" y="560" font-size="20" text-anchor="middle">MEETING PLAN</text></g>
<g id="hum"><path class="s-loss" d="M890 610H750m20-18-20 18 20 18" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="d5" x="900" y="700" font-size="44" style="fill:var(--loss)">“Careful.”</text><text class="d5" x="1190" y="700" font-size="44" style="fill:var(--loss)">“Humble.”</text></g>
<g id="godin1"><text class="d" x="120" y="840" font-size="44">Seth Godin sees it very differently.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Sharing is an act of generosity.</text>
<text class="b" x="120" y="176" font-size="32">Godin’s reframe: your work is an offer.</text>
<g id="me2"><text class="m" x="260" y="610" font-size="22" text-anchor="middle">YOU</text></g>
<g id="th2"><text class="m" x="1340" y="610" font-size="20" text-anchor="middle">SOMEONE WHO NEEDS IT</text></g>
<g id="arr2"><path class="s-gain" d="M420 650H1160" stroke-width="6" stroke-dasharray="14 10"/><path class="s-gain" d="M1150 632l20 18-20 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="lb2"><text class="m" x="795" y="714" font-size="22" text-anchor="middle">OFFERED, NOT KEPT</text></g>
<g id="gf2"></g>
<g id="qm2"><text class="d" x="1340" y="330" font-size="72" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="off2"><text class="d5" x="120" y="780" font-size="40">Your work is something you offer, not keep.</text></g>
<g id="wo2"><text class="d" x="120" y="846" font-size="44" style="fill:var(--loss)">Hold it back, and someone goes without.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Modesty is often fear in costume.</text>
<g id="fm3">
<circle class="loss" cx="380" cy="470" r="130"/>
<circle cx="335" cy="440" r="12" fill="var(--stage)"/><circle cx="425" cy="440" r="12" fill="var(--stage)"/>
<path d="M320 530q15-18 30 0t30 0 30 0 30 0" fill="none" stroke="var(--stage)" stroke-width="6" stroke-linecap="round"/>
<g id="mask3"><ellipse class="gain" cx="380" cy="460" rx="150" ry="140"/><ellipse cx="330" cy="440" rx="30" ry="18" fill="var(--stage)"/><ellipse cx="430" cy="440" rx="30" ry="18" fill="var(--stage)"/><path d="M320 510q60 40 120 0" fill="none" stroke="var(--stage)" stroke-width="7" stroke-linecap="round"/><path class="s-ink" d="M522 408L578 374" stroke-width="4" stroke-linecap="round"/><text class="m" x="588" y="372" font-size="24" style="fill:var(--ink)">MODESTY</text></g>
</g>
<g id="lbF"><text class="m" x="380" y="670" font-size="22" text-anchor="middle" style="fill:var(--loss)">FEAR OF BEING JUDGED</text></g>
<g id="sp3">
<path class="s-line" d="M780 700H1480" stroke-width="4"/>
<polygon id="beam" class="gain" points="1105,240 1135,240 1230,700 1010,700" fill-opacity=".22"/>
<rect class="ink" x="1090" y="200" width="60" height="40" rx="6"/>
<g id="me3"></g><g id="grp3"></g>
<text class="m" x="900" y="740" font-size="20" text-anchor="middle">ME</text>
<text class="m" x="1350" y="740" font-size="20" text-anchor="middle">PEOPLE WE CAN HELP</text>
</g>
<g id="spt3"><text class="d" x="120" y="830" font-size="42">Fear looks at us. Generosity looks at them.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">A blog post, every single day.</text>
<text class="b" x="120" y="176" font-size="32">Godin practices this himself.</text>
<g id="lap4">
<rect class="s-ink" x="170" y="260" width="400" height="260" rx="12" fill="var(--stage)" stroke-width="7"/>
<rect class="gain" x="200" y="290" width="200" height="22" rx="4"/>
<path class="s-line" d="M200 345h340M200 380h340M200 415h300M200 450h320" stroke-width="8" stroke-linecap="round"/>
<polygon class="ink" points="160,530 580,530 610,570 130,570"/>
<text class="m" x="370" y="610" font-size="20" text-anchor="middle">TODAY’S POST</text>
</g>
<g id="cal4"><text class="m" x="800" y="262" font-size="22">EVERY DAY</text><g id="cells4"></g></g>
<g id="nb4"><text class="d5" x="120" y="690" font-size="36">Not every post is brilliant.</text><text class="b" x="120" y="738" font-size="30">And it doesn’t need to be.</text></g>
<g id="rd4"><path class="s-gain" d="M1300 562V626" stroke-width="5" stroke-dasharray="8 8"/><g id="rdf4"></g><text class="m" x="1300" y="800" font-size="20" text-anchor="middle" style="fill:var(--gain)">ONE READER</text></g>
<g id="rt4"><text class="d" x="120" y="830" font-size="40">One reader might need that exact idea.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not about applause.</text>
<text class="b" x="120" y="176" font-size="32">Care about what the work does, not what they think of you.</text>
<g id="ap5"><g id="aud5"></g><text class="m" x="350" y="660" font-size="22" text-anchor="middle">APPLAUSE</text></g>
<line id="apx" class="s-loss" x1="280" y1="652" x2="280" y2="652" stroke-width="5" stroke-linecap="round"/>
<g id="sc5">
<path class="s-ink" d="M1020 330V700" stroke-width="8"/>
<path class="s-ink" d="M920 700h200" stroke-width="10" stroke-linecap="round"/>
<g id="beam5"><path class="s-ink" d="M700 330H1340" stroke-width="8" stroke-linecap="round"/></g>
<circle class="ink" cx="1020" cy="330" r="12"/>
<g id="panL"><path class="s-muted" d="M-80 100L0 0L80 100" fill="none" stroke-width="3"/><circle class="loss" cx="0" cy="80" r="18"/><path class="s-ink" d="M-100 100h200" stroke-width="8" stroke-linecap="round"/><text class="m" x="0" y="140" font-size="20" text-anchor="middle">WHAT THEY</text><text class="m" x="0" y="166" font-size="20" text-anchor="middle">THINK OF YOU</text></g>
<g id="panR"><path class="s-muted" d="M-80 100L0 0L80 100" fill="none" stroke-width="3"/><rect class="gain" x="-40" y="40" width="80" height="60" rx="6"/><path class="s-ink" d="M-100 100h200" stroke-width="8" stroke-linecap="round"/><text class="m" x="0" y="140" font-size="20" text-anchor="middle" style="fill:var(--gain)">WHAT IT DOES</text><text class="m" x="0" y="166" font-size="20" text-anchor="middle" style="fill:var(--gain)">FOR THEM</text></g>
</g>
<g id="ab5"><text class="d5" x="120" y="800" font-size="36" style="fill:var(--loss)">Need guaranteed approval first? Then it’s about you again.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Generous does not mean free.</text>
<text class="b" x="120" y="176" font-size="32">Paid work can still be a gift.</text>
<g id="tag6"><polygon class="s-ink" points="170,300 440,300 510,390 440,480 170,480" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/><circle class="s-ink" cx="450" cy="390" r="12" fill="none" stroke-width="5"/><path class="s-muted" d="M462 390q40-60 20-100" fill="none" stroke-width="4"/><text class="d" x="200" y="415" font-size="72">PAID</text></g>
<g id="gen6"><text class="d" x="330" y="560" font-size="60" text-anchor="middle" style="fill:var(--muted)">+</text><path class="gain" transform="translate(330 640) scale(.9)" d="M0 60C-75 10-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 10 0 60Z"/><text class="m" x="330" y="750" font-size="22" text-anchor="middle" style="fill:var(--gain)">STILL GENEROUS</text></g>
<ellipse id="pud6" class="loss" cx="1160" cy="640" rx="64" ry="12"/>
<g id="plb6"><path class="s-ink" d="M962 568L1010 520" stroke-width="12" stroke-linecap="round"/><g id="wr6"><path class="s-gain" d="M1010 520L1110 388" stroke-width="16" stroke-linecap="round"/><circle class="gain" cx="1120" cy="375" r="28"/><rect x="1108" y="345" width="24" height="26" fill="var(--stage)"/></g><circle class="ink" cx="1010" cy="520" r="11"/></g>
<path class="s-ink" d="M760 290v80M1460 290v80" stroke-width="8" stroke-linecap="round"/>
<path class="s-ink" d="M760 330H1460" stroke-width="34"/>
<path d="M764 330H1456" stroke="var(--stage)" stroke-width="16"/>
<rect id="joint6" class="ink" x="1090" y="302" width="60" height="56" rx="6"/>
<text class="m" x="860" y="280" font-size="20" text-anchor="middle">PIPE</text>
<g id="drops6"></g>
<g id="bill6"><path class="s-ink" d="M1350 580h100v130l-12.5-12-12.5 12-12.5-12-12.5 12-12.5-12-12.5 12-12.5-12-12.5 12z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1400" y="616" font-size="20" text-anchor="middle" style="fill:var(--ink)">BILL</text><path class="s-line" d="M1368 638h64M1368 662h44" stroke-width="5" stroke-linecap="round"/><path class="s-gain" d="M1414 666l8 8 14-16" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="care6"><path class="gain" transform="translate(1280 440) scale(.6)" d="M0 60C-75 10-80-45-38-55C-18-60-4-46 0-35C4-46 18-60 38-55C80-45 75 10 0 60Z"/><text class="m" x="1280" y="540" font-size="20" text-anchor="middle" style="fill:var(--gain)">CARE + INTENTION</text></g>
<g id="lv6"><text class="d" x="120" y="830" font-size="44">The generosity lives in the care.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Open the drawer.</text>
<text class="b" x="120" y="176" font-size="32">Look at the work you’ve been keeping.</text>
<g id="dr7">
<g id="wk7a"><rect class="s-ink" x="210" y="488" width="70" height="112" rx="6" fill="var(--stage)" stroke-width="4"/><circle class="gain" cx="230" cy="504" r="7"/><path class="s-ink" d="M220 530l14-14 10 8 12-12 14 18" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g>
