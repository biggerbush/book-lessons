<g id="cd0"><rect class="s-line" x="160" y="560" width="340" height="220" rx="16" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="300" y="590" width="60" height="110" rx="10" fill="none" stroke-width="6"/><text class="m" x="330" y="755" font-size="22" text-anchor="middle">PRODUCTS</text></g>
<g id="cd1"><rect class="s-line" x="630" y="560" width="340" height="220" rx="16" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="720" y="595" width="160" height="80" fill="none" stroke-width="6"/><path class="s-ink" d="M800 675v30" stroke-width="6"/><text class="m" x="800" y="755" font-size="22" text-anchor="middle">ADS</text></g>
<g id="cd2"><rect class="s-line" x="1100" y="560" width="340" height="220" rx="16" fill="var(--stage)" stroke-width="3"/><path class="s-ink" d="M1200 705v-60l70-40 70 40v60z" fill="none" stroke-width="6" stroke-linejoin="round"/><text class="m" x="1270" y="755" font-size="22" text-anchor="middle">STORES</text></g>
<g id="bdg"></g>
<g id="prf"><text class="m" x="800" y="848" font-size="22" text-anchor="middle" style="fill:var(--gain)">EACH ONE IS PROOF OF THE WHY</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The celery test.</text>
<text class="b" x="120" y="176" font-size="32">Your cart shows what you believe.</text>
<g id="crowd6"></g>
<g id="bubs"></g>
<g id="adv"><text class="m" x="120" y="710" font-size="22">FRIENDS’ ADVICE</text></g>
<g id="why6"><text class="m" x="120" y="780" font-size="24" style="fill:var(--gain)">YOUR WHY: HEALTH</text></g>
<g id="items"><rect x="1045" y="420" width="110" height="180" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><path class="s-ink" d="M1045 420l55-40 55 40" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1100" y="497" font-size="22" text-anchor="middle" style="fill:var(--ink)">RICE</text><text class="m" x="1100" y="530" font-size="22" text-anchor="middle" style="fill:var(--ink)">MILK</text><path class="s-gain" d="M1220 600V380M1250 600V360M1280 600V385" stroke-width="12" stroke-linecap="round"/><circle class="gain" cx="1220" cy="372" r="16"/><circle class="gain" cx="1250" cy="352" r="16"/><circle class="gain" cx="1280" cy="377" r="16"/></g>
