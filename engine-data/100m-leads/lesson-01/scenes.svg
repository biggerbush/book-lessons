<rect class="s-ink" x="1190" y="380" width="120" height="100" fill="none" stroke-width="5"/>
<rect class="s-ink" x="1340" y="410" width="72" height="130" fill="none" stroke-width="5"/>
</g>
<text id="cust0" class="m" x="1160" y="226" font-size="22">CUSTOMERS TODAY: 0</text>
