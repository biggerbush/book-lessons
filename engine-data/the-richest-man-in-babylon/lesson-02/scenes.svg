<text class="d" x="1100" y="490" font-size="56" text-anchor="middle" style="fill:var(--on-gain)">YOURS</text>
</g></g>
<g id="qm"><text class="d" x="1400" y="440" font-size="220" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<g id="ask"><text class="d5" x="120" y="760" font-size="40">Arkad was puzzled. Wasn’t everything he earned already his?</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Paying everyone else.</text>
<text class="b" x="120" y="176" font-size="32">Every coin went straight into someone else’s hands.</text>
