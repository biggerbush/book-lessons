<g id="s0">
<text class="m" x="120" y="150" font-size="28">QUIET · LESSON 4</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Stretching beyond</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">your nature.</text>
<text class="b" x="120" y="600" font-size="32">How quiet people perform boldly,</text>
<text class="b" x="120" y="644" font-size="32">and how they recover afterward.</text>
<path id="cone" class="gain" d="M1185 230L1080 560H1320L1215 230z" fill-opacity=".22"/>
<rect class="ink" x="1170" y="200" width="60" height="32" rx="6"/>
<rect class="ink" x="1060" y="560" width="290" height="24" rx="4"/>
<g id="aud0"></g>
<g id="lect"></g>
<g id="stall0"><text class="m" x="1480" y="340" font-size="20" text-anchor="end">MINUTES LATER</text><rect x="1380" y="360" width="100" height="224" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><circle class="ink" cx="1398" cy="470" r="6"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Meet Brian Little.</text>
<text class="b" x="120" y="176" font-size="32">A psychology professor who taught at Harvard.</text>
<g id="prof"><g id="profp"></g><path class="ink" d="M220 480H380L360 650H240z"/><text class="m" x="300" y="700" font-size="20" text-anchor="middle">PROFESSOR · HARVARD</text></g>
<circle id="halo" cx="300" cy="420" r="130" fill="none" stroke="var(--loss)" stroke-width="5" stroke-dasharray="12 10"/>
<g id="audw"><g id="aud1"></g><text class="m" x="620" y="700" font-size="20">LIVELY · FUNNY · PACKED</text></g>
<g id="award"><path class="loss" d="M1322 370l-24 110 26-12 16 24 14-110zM1378 370l24 110-26-12-16 24-14-110z"/><circle class="gain" cx="1350" cy="330" r="60"/><circle cx="1350" cy="330" r="38" fill="none" stroke="var(--on-gain)" stroke-width="5"/><text class="m" x="1350" y="550" font-size="20" text-anchor="middle">MUCH ADMIRED</text><text class="m" x="1350" y="580" font-size="20" text-anchor="middle">TEACHER</text></g>
<g id="intro"><text class="d" x="120" y="800" font-size="48">Yet he calls himself a <tspan style="fill:var(--loss)">deep introvert</tspan>.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Free Trait Theory.</text>
<text class="b" x="120" y="176" font-size="32">Born with traits, but free to act beyond them.</text>
<g id="seed"><ellipse id="band" cx="420" cy="500" rx="150" ry="150" fill="var(--ice)" stroke="var(--ink)" stroke-width="6"/><g id="me2"></g><text class="m" x="420" y="700" font-size="20" text-anchor="middle">BORN TRAIT: INTROVERSION</text></g>
<g id="arr2"><path class="s-gain" d="M540 300H1210M1186 282l24 18-24 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="875" y="278" font-size="20" text-anchor="middle">STRETCH WHEN IT MATTERS</text><path class="s-ink" d="M1300 380V640" stroke-width="7" stroke-linecap="round"/><path class="gain" d="M1304 384L1400 414L1304 444z"/><text class="m" x="1300" y="680" font-size="20" text-anchor="middle">A GOAL THAT MATTERS</text></g>
<g id="ff1"><text class="d" x="120" y="790" font-size="48">Not fake.</text></g>
<g id="ff2"><text class="d5" x="120" y="846" font-size="36">It’s his <tspan style="fill:var(--gain)">real self</tspan>, stretching toward a goal.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Core personal projects.</text>
<text class="b" x="120" y="176" font-size="32">Deep goals that make the stretch worth it.</text>
<g id="tgt"><circle class="s-line" cx="380" cy="470" r="170" fill="none" stroke-width="5"/><circle class="s-line" cx="380" cy="470" r="115" fill="none" stroke-width="5"/><circle class="s-ink" cx="380" cy="470" r="60" fill="var(--stage)" stroke-width="5"/><path class="gain" d="M380 500C330 470 325 435 350 428C365 424 376 434 380 444C384 434 395 424 410 428C435 435 430 470 380 500Z"/></g>
<g id="links3"></g>
<g id="cards3"></g>
<g id="mic3"><rect class="ink" x="136" y="700" width="36" height="60" rx="18"/><path class="s-ink" d="M124 740a30 30 0 0 0 60 0M154 772V800M136 800H172" fill="none" stroke-width="5" stroke-linecap="round"/><text class="d" x="220" y="790" font-size="44">For Little: teaching well is worth performing.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="60">Acting out of character costs energy.</text>
<text class="b" x="120" y="176" font-size="32">Like a battery running down.</text>
<g id="bat4"><rect x="140" y="300" width="560" height="220" rx="24" fill="none" stroke="var(--ink)" stroke-width="8"/><rect class="ink" x="704" y="370" width="28" height="80" rx="6"/><rect id="bfill" x="164" y="324" width="512" height="172" rx="10"/></g>
<g id="low4"><text class="m" x="140" y="580" font-size="20">AFTER A BIG LECTURE: SPENT, NOT BUZZING</text></g>
<g id="me4"></g>
<g id="stim4"><g id="spk"></g><text class="m" x="1160" y="740" font-size="20" text-anchor="middle">TOO MUCH STIMULATION, FOR TOO LONG</text></g>
<g id="st4"></g>
<g id="drain4"><text class="d" x="120" y="810" font-size="44">Chatting with strangers drains him further.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Restorative niches.</text>
<text class="b" x="120" y="176" font-size="32">Where you return to your true self and refill your energy.</text>
<rect x="200" y="250" width="340" height="470" rx="8" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/>
<g id="me5"></g>
<g id="door5"><rect x="214" y="264" width="312" height="420" rx="6" fill="var(--stage)" stroke="var(--ink)" stroke-width="5"/><circle class="gain" cx="246" cy="470" r="10"/></g>
<g id="away5"><text class="m" x="200" y="770" font-size="20">AWAY FROM CONVERSATION</text></g>
<g id="niche5"><path d="M900 640V420a150 150 0 0 1 300 0V640" fill="var(--ice)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/><g id="np5"></g><text class="m" x="1050" y="690" font-size="22" text-anchor="middle">RESTORATIVE NICHE</text></g>
<g id="refill5"><rect x="1300" y="330" width="120" height="310" rx="16" fill="none" stroke="var(--ink)" stroke-width="7"/><rect class="ink" x="1335" y="304" width="50" height="22" rx="5"/><rect id="bf5" class="gain" x="1316" width="88" rx="8"/><text class="m" x="1360" y="690" font-size="20" text-anchor="middle">REFILL</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="64">A niche can be a place, or a time.</text>
<text class="b" x="120" y="176" font-size="32">Any pocket of quiet where you can recharge.</text>
<g id="pn0"><rect class="s-line" x="120" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<path class="ink" d="M250 330h160a20 20 0 0 1 20 20v100H230V350a20 20 0 0 1 20-20z"/><rect class="gain" x="250" y="440" width="160" height="50" rx="10"/><rect class="ink" x="214" y="410" width="40" height="110" rx="14"/><rect class="ink" x="406" y="410" width="40" height="110" rx="14"/><rect class="ink" x="230" y="496" width="200" height="30" rx="8"/><path class="s-ink" d="M250 526v30M410 526v30" stroke-width="8" stroke-linecap="round"/>
<text class="d5" x="330" y="640" font-size="36" text-anchor="middle">A favorite chair</text><text class="m" x="330" y="690" font-size="20" text-anchor="middle">A PLACE</text></g>
<g id="pn1"><rect class="s-line" x="590" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<circle class="s-ink" cx="800" cy="440" r="110" fill="var(--stage)" stroke-width="8"/><g id="tk"></g><path id="hh" class="s-ink" d="M800 440V385" stroke-width="9" stroke-linecap="round"/><path id="hm" class="s-gain" d="M800 440V355" stroke-width="6" stroke-linecap="round"/><circle class="ink" cx="800" cy="440" r="9"/>
<text class="d5" x="800" y="640" font-size="36" text-anchor="middle">A solo walk</text><text class="m" x="800" y="690" font-size="20" text-anchor="middle">A TIME</text></g>
<g id="pn2"><rect class="s-line" x="1060" y="230" width="420" height="500" rx="18" fill="var(--stage)" stroke-width="3"/>
<rect x="1160" y="330" width="220" height="210" rx="12" fill="var(--stage)" stroke="var(--ink)" stroke-width="6"/><rect class="ink" x="1160" y="330" width="220" height="44" rx="10"/><g id="cal6"></g>
<text class="d5" x="1270" y="640" font-size="36" text-anchor="middle">A free evening</text><text class="m" x="1270" y="690" font-size="20" text-anchor="middle">AFTER A BUSY SOCIAL DAY</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Stretch, then recover.</text>
<text class="b" x="120" y="176" font-size="32">Cain’s point is balance.</text>
<path class="ink" d="M480 410L420 580H540z"/><rect class="ink" x="360" y="580" width="240" height="14" rx="7"/>
<g id="beam"><path class="s-ink" d="M220 400H740" stroke-width="10" stroke-linecap="round"/><rect class="ink" x="140" y="320" width="170" height="70" rx="12"/><text class="m" x="225" y="364" font-size="22" text-anchor="middle" style="fill:var(--stage)">STRETCH</text><g id="rec7"><rect class="gain" x="650" y="320" width="170" height="70" rx="12"/><text class="m" x="735" y="364" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">RECOVER</text></g></g>
<g id="face7"><circle cx="1020" cy="420" r="100" fill="var(--stage)" stroke="var(--loss)" stroke-width="7"/><path class="s-loss" d="M975 405h30M1035 405h30M980 480q40-30 80 0" fill="none" stroke-width="7" stroke-linecap="round"/><text class="d" x="1110" y="330" font-size="40" style="fill:var(--loss)">z</text><text class="m" x="1020" y="570" font-size="20" text-anchor="middle">TOO LONG, NO REST: EXHAUSTED</text></g>
<g id="note7"><rect class="gain" x="1230" y="300" width="230" height="230" rx="8" transform="rotate(3 1345 415)"/><text class="m" x="1260" y="370" font-size="22" style="fill:var(--on-gain)">PLAN YOUR</text><text class="m" x="1260" y="405" font-size="22" style="fill:var(--on-gain)">RECOVERY</text><text class="m" x="1260" y="440" font-size="22" style="fill:var(--on-gain)">BEFORE THE</text><text class="m" x="1260" y="475" font-size="22" style="fill:var(--on-gain)">BIG EVENT</text></g>
<g id="bal7"><text class="d" x="120" y="790" font-size="40">Stretch for what matters, then make room to recover.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="80" letter-spacing="-2">What is one project</text></g>
<g id="qb"><text class="d" x="136" y="400" font-size="80" letter-spacing="-2">worth stretching for</text></g>
<g id="qc"><text class="d" x="136" y="500" font-size="80" letter-spacing="-2" style="fill:var(--gain)">this month?</text></g>
<g id="qd"><text class="d5" x="140" y="640" font-size="40">And where will your <tspan style="fill:var(--gain)">restorative niche</tspan> be when it’s done?</text></g>
<g id="qg"><path d="M1250 500V390a90 90 0 0 1 180 0V500" fill="var(--ice)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/><g id="qp"></g></g>
<text class="m" x="143" y="760" font-size="26">STRETCH, THEN RECOVER</text>
</g>