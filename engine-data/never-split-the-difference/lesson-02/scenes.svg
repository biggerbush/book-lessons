<text class="d5" x="1090" y="650" font-size="38">You gain time</text>
<text class="m" x="1090" y="700" font-size="20">TO THINK WHILE</text><text class="m" x="1090" y="730" font-size="20">THEY KEEP TALKING</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The waiter test.</text>
<text class="b" x="120" y="176" font-size="32">Research on restaurant waiters.</text>
