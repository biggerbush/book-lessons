<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAME AS EVER · LESSON 2</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Risk is what</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">you don’t see.</text>
<text class="b" x="120" y="600" font-size="32">The danger that hurts most is the one nobody pictured.</text>
<g id="cone"><polygon points="1215,470 1480,330 1480,610" fill="var(--gain)" fill-opacity=".2"/><circle class="gain" cx="1360" cy="450" r="14"/><circle class="gain" cx="1430" cy="400" r="14"/><circle class="gain" cx="1440" cy="530" r="14"/><text class="m" x="1480" y="660" font-size="20" text-anchor="end" style="fill:var(--gain)">WHAT YOU WATCH</text></g>
