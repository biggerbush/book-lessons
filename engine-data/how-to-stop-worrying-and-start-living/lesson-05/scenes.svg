<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO STOP WORRYING AND START LIVING · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Cooperate with</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">the inevitable.</text>
<text class="b" x="120" y="600" font-size="32">Fix what you can, release what you can’t, and move on.</text>
<g id="me"></g>
<g id="cw1"><g id="cd1"></g></g>
<g id="cw2"><g id="cd2"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Some things can’t be undone.</text>
<text class="b" x="120" y="176" font-size="32">As a boy in Missouri, Carnegie jumped from a log-cabin attic.</text>
<g id="cab">
<path class="s-ink" d="M150 410L400 250L650 410" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="s-ink" x="180" y="410" width="440" height="350" fill="var(--stage)" stroke-width="6"/>
<path class="s-line" d="M180 460h440M180 510h440M180 560h440M180 610h440M180 660h440M180 710h440" stroke-width="4"/>
<rect class="s-ink" x="370" y="300" width="60" height="56" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="400" y="288" font-size="18" text-anchor="middle">ATTIC</text>
<rect class="ink" x="250" y="600" width="80" height="160"/>
<path class="s-ink" d="M120 760H780" stroke-width="5" stroke-linecap="round"/>
</g>
<path id="arc" class="s-muted" d="M400 345Q620 160 760 760" fill="none" stroke-width="4" stroke-dasharray="8 10"/>
<g id="boy"></g>
<g id="hand">
<rect class="ink" x="1040" y="500" width="220" height="200" rx="44"/>
<rect class="ink" x="1044" y="360" width="44" height="190" rx="22"/>
<rect class="ink" x="1096" y="330" width="44" height="220" rx="22"/>
<rect class="ink" x="1200" y="380" width="44" height="170" rx="22"/>
<rect class="ink" x="950" y="560" width="120" height="46" rx="23" transform="rotate(-35 1050 590)"/>
</g>
<g id="nr">
<path class="s-ink" d="M1150 236h40M1170 236v70" stroke-width="8" stroke-linecap="round"/>
<circle class="s-gain" cx="1170" cy="290" r="18" fill="none" stroke-width="7"/>
<rect id="gone" class="s-loss" x="1148" y="345" width="44" height="200" rx="22" fill="none" stroke-width="5" stroke-dasharray="10 8"/>
</g>
<g id="hard"><text class="m" x="900" y="760" font-size="22">HE HARDLY EVER THINKS ABOUT IT NOW</text></g>
<g id="adj"><text class="d" x="120" y="830" font-size="40">Once it can’t change, we adjust faster than we expect.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Bend like a tire.</text>
<text class="b" x="120" y="176" font-size="32">Tires that absorb the bumps last longer.</text>
<g id="pl">
<rect class="s-line" x="120" y="220" width="640" height="360" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="150" y="262" font-size="20">FOUGHT THE BUMPS</text>
<path id="rd0" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="rt"><circle class="s-loss" r="80" fill="none" stroke-width="26"/><circle class="ink" r="14"/>
<path id="crk" d="M-40-75l12 22-10 14M60 52l-20-8 4-18M-82 10l22 4 6 16" fill="none" stroke="var(--stage)" stroke-width="6"/></g>
<text id="torn" class="m" x="440" y="565" font-size="20" text-anchor="middle" style="fill:var(--loss)">TORN APART</text>
</g>
<g id="pr">
<rect class="s-line" x="840" y="220" width="640" height="360" rx="18" fill="var(--stage)" stroke-width="3"/>
<text class="m" x="870" y="262" font-size="20">ABSORBED THE BUMPS</text>
<path id="rd1" class="s-ink" fill="none" stroke-width="5" stroke-linecap="round"/>
<g id="st"><ellipse id="ste" class="s-gain" rx="80" ry="80" fill="none" stroke-width="26"/><circle id="sth" class="ink" r="14"/></g>
<text id="last" class="m" x="1160" y="565" font-size="20" text-anchor="middle" style="fill:var(--gain)">LASTED LONGER</text>
</g>
<g id="wil"><path class="s-ink" d="M300 860V690" stroke-width="14" stroke-linecap="round"/><g id="br"></g></g>
<g id="wtx"><text class="d" x="560" y="730" font-size="48">Like a willow in a storm,</text><text class="d" x="560" y="800" font-size="48">give way to what you can’t stop.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Fix it, or free it.</text>
<text class="b" x="120" y="176" font-size="32">First, sort your trouble.</text>
<g id="trb">
<path class="s-muted" d="M800 344C800 400 460 340 460 392M800 344C800 400 1140 340 1140 392" fill="none" stroke-width="5"/>
<circle class="loss" cx="800" cy="300" r="44"/>
<text class="d" x="800" y="322" font-size="60" text-anchor="middle" style="fill:var(--stage)">?</text>
</g>
<g id="dl"><rect class="s-ink" x="320" y="400" width="280" height="360" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="460" y="450" font-size="20" text-anchor="middle">CAN DO SOMETHING</text></g>
<g id="dr"><rect class="s-ink" x="1000" y="400" width="280" height="360" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="1140" y="450" font-size="20" text-anchor="middle">NOTHING TO DO</text></g>
<g id="fix">
<path class="s-ink" d="M400 670L490 580" stroke-width="20" stroke-linecap="round"/>
<circle class="gain" cx="505" cy="565" r="34"/>
<rect x="493" y="523" width="24" height="40" fill="var(--stage)" transform="rotate(45 505 565)"/>
<text class="d" x="460" y="820" font-size="48" text-anchor="middle">Do it.</text>
</g>
<g id="free">
<rect class="ink" x="1062" y="650" width="56" height="46" rx="16"/>
<rect class="ink" x="1063" y="612" width="12" height="52" rx="6"/>
<rect class="ink" x="1077" y="604" width="12" height="60" rx="6"/>
<rect class="ink" x="1091" y="606" width="12" height="58" rx="6"/>
<rect class="ink" x="1105" y="616" width="12" height="48" rx="6"/>
<rect class="ink" x="1030" y="654" width="40" height="13" rx="6.5" transform="rotate(-35 1066 662)"/>
<rect class="ink" x="1162" y="650" width="56" height="46" rx="16"/>
<rect class="ink" x="1163" y="616" width="12" height="48" rx="6"/>
<rect class="ink" x="1177" y="606" width="12" height="58" rx="6"/>
<rect class="ink" x="1191" y="604" width="12" height="60" rx="6"/>
<rect class="ink" x="1205" y="612" width="12" height="52" rx="6"/>
<rect class="ink" x="1210" y="654" width="40" height="13" rx="6.5" transform="rotate(35 1214 662)"/>
<text class="d" x="1140" y="820" font-size="48" text-anchor="middle" style="fill:var(--gain)">Let it go.</text>
</g>
<g id="ball">
<path class="s-ink" d="M1140 600q-8 12 0 24q8 10 0 22" fill="none" stroke-width="3" stroke-linecap="round"/>
<ellipse class="loss" cx="1140" cy="570" rx="24" ry="30"/>
<path class="loss" d="M1134 604h12l-6-8z"/>
</g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Put a stop-loss on worry.</text>
<text class="b" x="120" y="176" font-size="32">Investors sell automatically if a stock falls to a set price.</text>
<g id="chart"><path class="s-ink" d="M160 240V700H1000" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="180" y="266" font-size="20">STOCK PRICE</text></g>
<polyline id="px" class="s-ink" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<g id="stp"><path class="s-gain" d="M180 560H980" stroke-width="4" stroke-dasharray="12 10"/><text class="m" x="190" y="598" font-size="20" style="fill:var(--gain)">STOP-LOSS PRICE</text></g>
<g id="sold"><circle class="gain" cx="945" cy="560" r="16"/><text class="m" x="945" y="612" font-size="20" text-anchor="middle" style="fill:var(--gain)">SOLD</text></g>
<g id="gauge">
<rect class="s-ink" x="1160" y="260" width="140" height="440" rx="20" fill="var(--stage)" stroke-width="6"/>
<rect id="gf" class="loss" x="1170" y="690" width="120" height="0" rx="10"/>
<path class="s-gain" d="M1140 440H1310" stroke-width="5" stroke-dasharray="10 8"/>
<text class="m" x="1320" y="448" font-size="20" style="fill:var(--gain)">LIMIT</text>
<text class="m" x="1230" y="740" font-size="20" text-anchor="middle">WORRY</text>
</g>
<g id="nom"><text class="m" x="1320" y="360" font-size="20" style="fill:var(--loss)">NO MORE</text></g>
<g id="pay"><text class="d" x="120" y="810" font-size="44">Decide what a worry is worth. Pay no more.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t overpay for your whistle.</text>
<text class="b" x="120" y="176" font-size="32">Benjamin Franklin, age seven, and his coins.</text>
<g id="ben"><text class="m" x="200" y="620" font-size="20" text-anchor="middle">AGE 7</text></g>
<g id="scl">
<path class="s-ink" d="M820 360V760M720 760H920" stroke-width="10" stroke-linecap="round"/>
<line id="bm" class="s-ink" stroke-width="10" stroke-linecap="round"/>
<circle class="ink" cx="820" cy="360" r="12"/>
<g id="pnL"></g><g id="pnR"></g>
</g>
<g id="f0"><rect class="s-loss" x="1240" y="372" width="230" height="56" rx="28" fill="var(--stage)" stroke-width="4"/><text class="m" x="1355" y="407" font-size="20" text-anchor="middle">A GRUDGE</text></g>
<g id="f1"><rect class="s-loss" x="1240" y="452" width="230" height="56" rx="28" fill="var(--stage)" stroke-width="4"/><text class="m" x="1355" y="487" font-size="20" text-anchor="middle">A FEUD</text></g>
<g id="f2"><rect class="s-loss" x="1240" y="532" width="230" height="56" rx="28" fill="var(--stage)" stroke-width="4"/><text class="m" x="1355" y="567" font-size="20" text-anchor="middle">A FRET</text></g>
<g id="over"><text class="d" x="120" y="820" font-size="48">Are you overpaying for a worry?</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">No use crying over spilt milk.</text>
<text class="b" x="120" y="176" font-size="32">Teacher Paul Brandwine’s bottle of milk.</text>
<g id="desk"><rect class="ink" x="160" y="520" width="480" height="20" rx="6"/><path class="s-ink" d="M190 540V720M610 540V720" stroke-width="10" stroke-linecap="round"/><text class="m" x="220" y="590" font-size="20">THE TEACHER’S DESK</text></g>
<g id="snk">
<path class="s-ink" d="M1160 470V400h-50v20" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s-ink" d="M760 470H1200L1150 700H810Z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-ink" d="M744 470H1216" stroke-width="12" stroke-linecap="round"/>
<rect class="s-ink" x="968" y="700" width="24" height="42" fill="var(--stage)" stroke-width="5"/>
<text class="m" x="1200" y="740" font-size="20">THE SINK</text>
</g>
<path id="pipeflow" d="M980 706V738" stroke="var(--muted)" stroke-width="8" stroke-dasharray="8 6" fill="none"/>
<ellipse id="pud" cx="980" cy="684" rx="0" ry="0" fill="var(--stage)" stroke="var(--ink)" stroke-width="3"/>
<g id="swl"></g>
<circle class="ink" cx="980" cy="686" r="10"/>
<path id="strO" d="M856 486C884 546 944 610 976 682" fill="none" stroke="var(--ink)" stroke-width="16" stroke-linecap="round" stroke-dasharray="300 300"/>
<path id="strI" d="M856 486C884 546 944 610 976 682" fill="none" stroke="var(--stage)" stroke-width="8" stroke-linecap="round" stroke-dasharray="300 300"/>
<g id="btw"><g id="bt">
<rect x="-30" y="-140" width="60" height="140" rx="10" fill="var(--line)" stroke="var(--ink)" stroke-width="6"/>
<rect id="bmilk" x="-21" y="-112" width="42" height="104" rx="6" fill="var(--stage)"/>
<rect x="-15" y="-180" width="30" height="42" rx="4" fill="var(--line)" stroke="var(--ink)" stroke-width="6"/>
<rect id="bcap" x="-18" y="-194" width="36" height="16" rx="4" fill="var(--muted)"/>
</g></g>
<g id="pt"><text class="m" x="120" y="776" font-size="22">HIS POINT WAS SIMPLE</text></g>
<g id="nod"><text class="d" x="120" y="836" font-size="44">No amount of fretting brings back a single drop.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Don’t saw sawdust.</text>
<text class="b" x="120" y="176" font-size="32">Editor Fred Fuller Shedd’s question to his students.</text>
<g id="wood">
<text class="m" x="120" y="262" font-size="20">EVER SAWED WOOD?</text>
<path class="s-ink" d="M300 480l-40 80M300 480l40 80M580 480l-40 80M580 480l40 80" stroke-width="8" stroke-linecap="round"/>
<rect class="s-ink" x="220" y="400" width="440" height="80" rx="40" fill="var(--line)" stroke-width="6"/>
<circle class="s-ink" cx="620" cy="440" r="22" fill="none" stroke-width="4"/>
<g id="saw1"></g>
</g>
<g id="kids"></g><g id="arms"></g>
<g id="dust">
<text class="m" x="880" y="262" font-size="20">EVER SAWED SAWDUST?</text>
<path d="M880 560Q1160 360 1440 560Z" fill="var(--gain)" fill-opacity=".5" stroke="var(--gain)" stroke-width="5" stroke-linejoin="round"/>
<g id="specks"></g><g id="saw2"></g>
</g>
<g id="nx"><path class="s-loss" d="M1030 330L1310 450M1310 330L1030 450" stroke-width="12" stroke-linecap="round"/><text class="d" x="880" y="700" font-size="56">0 hands.</text></g>
<g id="rep"><text class="d" x="120" y="820" font-size="44">Replaying old mistakes is sawing sawdust.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="300" font-size="88" letter-spacing="-2">Pick one worry.</text></g>
<g id="qb"><text class="d" x="136" y="410" font-size="88" letter-spacing="-2">Can I <tspan style="fill:var(--gain)">change</tspan> this?</text></g>
<g id="qc"><text class="d5" x="140" y="560" font-size="56">If not, set your stop-loss,</text></g>
<g id="qd"><text class="d5" x="140" y="630" font-size="56">and stop sawing sawdust.</text></g>
<text class="m" x="143" y="760" font-size="26">COOPERATE WITH THE INEVITABLE</text>
<g id="sgw"><path class="s-ink" d="M1300 650V800" stroke-width="14" stroke-linecap="round"/><g id="sg"></g></g>
</g>