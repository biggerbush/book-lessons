<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why do you want it?</text>
<text class="b" x="120" y="176" font-size="32">To own it, or to use it?</text>
<g id="s6q"><text id="s6qt" class="d" x="300" y="580" font-size="320" text-anchor="middle" style="fill:var(--gain)">?</text></g>
