name: Create reel
run-name: "Create reel: ${{ inputs.book }} lesson ${{ inputs.lesson }}${{ inputs.mode == 'dry' && ' (dry run)' || '' }}"

# Turns one lesson of a book into a ~60s vertical reel (Instagram / TikTok). Output: site/reels/<book>-<lesson>/reel.mp4
# real = Claude directs + ONE ElevenLabs generation (saved, so re-renders never pay for audio again). dry = free test.

on:
  workflow_dispatch:
    inputs:
      book:
        description: Book slug (e.g. deep-work)
        required: true
        type: string
      lesson:
        description: Lesson number
        required: true
        type: string
        default: "1"
      mode:
        description: "real = Claude + ElevenLabs credits. dry = free test (silent, example plan)."
        type: choice
        options: [real, dry]
        default: real

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-${{ inputs.book }}-${{ inputs.lesson }}
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r engine/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Make the reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BOOK: ${{ inputs.book }}
          LESSON: ${{ inputs.lesson }}
          MODE: ${{ inputs.mode }}
        run: |
          args=(--book "$BOOK" --lesson "$LESSON")
          [ "$MODE" = "dry" ] && args+=(--dry --scale 0.5 --fps 24)
          python -m engine.reel "${args[@]}"
      - name: Save audio, plan and video
        if: ${{ always() }}
        run: |
          git config user.name "book-engine"; git config user.email "book-engine@users.noreply.github.com"
          mkdir -p site/reels; git add engine-data site/reels
          git diff --cached --quiet || git commit -m "Reel: ${{ inputs.book }} lesson ${{ inputs.lesson }}"
          git pull --rebase -q origin main || true
          git push || true
      - name: Deploy
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
