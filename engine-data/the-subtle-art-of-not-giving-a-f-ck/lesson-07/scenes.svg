<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE SUBTLE ART OF NOT GIVING A F*CK · LESSON 7</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Saying no and</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">remembering death.</text>
<text class="b" x="120" y="600" font-size="32">Why fewer commitments and a short life make caring easier</text>
<g id="hgw0"><g id="hg0" transform="translate(1320 400)"></g></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Endless options.</text>
<text class="b" x="120" y="176" font-size="32">In his twenties, Manson travelled the world with a backpack.</text>
