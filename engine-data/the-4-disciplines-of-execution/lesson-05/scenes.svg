<g id="s0">
<text class="m" x="120" y="150" font-size="28">THE 4 DISCIPLINES OF EXECUTION · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Lead measures beat</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">lag measures.</text>
<text class="b" x="120" y="600" font-size="32">Stop staring at results and start tracking the actions behind them.</text>
<g id="scale">
<rect class="s-ink" x="1180" y="200" width="260" height="280" rx="36" fill="var(--stage)" stroke-width="8"/>
<path class="s-ink" d="M1250 300a60 60 0 0 1 120 0z" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<path class="s-muted" d="M1262 286l8 4M1276 262l7 6M1310 250v9M1344 262l-7 6M1358 286l-8 4" stroke-width="3" stroke-linecap="round" fill="none"/>
<line id="ndl" class="s-loss" x1="1310" y1="300" x2="1310" y2="254" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="1310" cy="300" r="7"/>
<text class="m" x="1310" y="530" font-size="20" text-anchor="middle">EVERY MORNING</text>
</g>
