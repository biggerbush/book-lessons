<g id="s0">
<text class="m" x="120" y="150" font-size="28">HOW TO STOP WORRYING AND START LIVING · LESSON 1</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Live in day-tight</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">compartments.</text>
<text class="b" x="120" y="600" font-size="32">Shut out yesterday and tomorrow, and live fully in today.</text>
<g id="t_boxes"></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">1871: a worried student.</text>
<text class="b" x="120" y="176" font-size="32">Young William Osler, anxious about his exams and his future.</text>
<g id="st1"><rect class="ink" x="160" y="610" width="440" height="14" rx="7"/></g>
<g id="far"><path class="s-line" d="M960 330H1460" stroke-width="4"/><path class="s-loss" d="M1000 330L1070 280L1140 330M1250 330L1330 270L1410 330" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="1070" y="252" font-size="24" text-anchor="middle" style="fill:var(--loss)">EXAMS?</text><text class="m" x="1330" y="242" font-size="24" text-anchor="middle" style="fill:var(--loss)">THE FUTURE?</text></g>
<g id="sight" stroke="var(--loss)" stroke-width="3" stroke-dasharray="8 10" fill="none"><path d="M296 440L1060 290M296 440L1320 280"/></g>
<g id="bk"><rect class="s-ink" x="660" y="440" width="280" height="190" rx="8" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M800 440v190" stroke-width="4"/><path class="s-line" d="M690 490h80M690 530h80M690 570h60M830 490h80M830 530h80M830 570h50" stroke-width="6" stroke-linecap="round"/><text class="m" x="800" y="676" font-size="22" text-anchor="middle">THOMAS CARLYLE</text></g>
<g id="task"><rect class="gain" x="360" y="550" width="240" height="56" rx="10"/><text class="m" x="480" y="585" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">TODAY’S WORK</text></g>
<g id="msg"><text class="d" x="120" y="790" font-size="44">Not distant things. The work in front of you.</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">What it changed.</text>
<text class="b" x="120" y="176" font-size="32">Where one habit of mind took William Osler.</text>
<g id="links2"></g>
<g id="hab"><circle class="gain" cx="260" cy="470" r="80"/><text class="m" x="260" y="464" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">ONE HABIT</text><text class="m" x="260" y="494" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">OF MIND</text></g>
<g id="k0"><rect class="s-line" x="560" y="240" width="270" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><rect class="s-ink" x="625" y="320" width="140" height="110" fill="none" stroke-width="6"/><rect class="ink" x="680" y="380" width="30" height="50"/><path class="s-gain" d="M695 268v42M674 289h42" stroke-width="10" stroke-linecap="round"/><text class="m" x="695" y="500" font-size="20" text-anchor="middle">HELPED FOUND</text><text class="m" x="695" y="532" font-size="20" text-anchor="middle">JOHNS HOPKINS</text><text class="m" x="695" y="564" font-size="20" text-anchor="middle">SCHOOL OF</text><text class="m" x="695" y="596" font-size="20" text-anchor="middle">MEDICINE</text></g>
<g id="k1"><rect class="s-line" x="860" y="240" width="270" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><path class="ink" d="M945 340v45q50 25 100 0v-45z"/><polygon class="ink" points="995,290 1085,325 995,360 905,325"/><path class="s-gain" d="M1085 325v60" stroke-width="5" stroke-linecap="round"/><text class="m" x="995" y="500" font-size="20" text-anchor="middle">PROFESSOR OF</text><text class="m" x="995" y="532" font-size="20" text-anchor="middle">MEDICINE AT</text><text class="m" x="995" y="564" font-size="20" text-anchor="middle">OXFORD</text></g>
<g id="k2"><rect class="s-line" x="1160" y="240" width="270" height="420" rx="18" fill="var(--stage)" stroke-width="3"/><g id="star"></g><text class="m" x="1295" y="500" font-size="20" text-anchor="middle">KNIGHTED</text></g>
<g id="cred"><text class="d" x="120" y="800" font-size="44">He credited much of his success to that habit.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The ocean liner.</text>
<text class="b" x="120" y="176" font-size="32">Years later, Osler spoke to students at Yale.</text>
<g id="yale"><g id="yp"></g><path class="ink" d="M190 400h100l-12 110h-76z"/><text class="m" x="240" y="552" font-size="24" text-anchor="middle">YALE</text></g>
<g id="ship"><rect class="loss" x="380" y="600" width="1100" height="160" fill-opacity=".12"/><path id="wave3" class="s-loss" fill="none" stroke-width="4"/><rect class="ink" x="760" y="300" width="50" height="70"/><rect class="ink" x="1000" y="300" width="50" height="70"/><rect class="s-ink" x="620" y="370" width="600" height="70" fill="var(--stage)" stroke-width="6"/><path class="s-ink" d="M420 440H1460L1400 640H500Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect id="wtr" class="loss" x="863" y="640" width="144" height="0"/><g id="bh"></g></g>
<g id="btn"><rect class="s-ink" x="150" y="600" width="180" height="130" rx="14" fill="var(--stage)" stroke-width="5"/><circle id="btnc" class="loss" cx="240" cy="650" r="30"/><text class="m" x="240" y="716" font-size="24" text-anchor="middle">SEAL</text></g>
<g id="seal"><text class="d" x="120" y="820" font-size="40">One press seals each section. Water can’t spread.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">You are the vessel.</text>
<text class="b" x="120" y="176" font-size="32">A far more marvellous vessel than any ocean liner.</text>
<g id="vs"><text class="m" x="420" y="336" font-size="22" text-anchor="middle">YESTERDAY</text><text class="m" x="800" y="336" font-size="22" text-anchor="middle" style="fill:var(--gain)">TODAY</text><text class="m" x="1200" y="336" font-size="22" text-anchor="middle">TOMORROW</text><path class="s-ink" d="M140 360H1460L1380 700H220Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><rect id="glow" class="gain" x="604" y="364" width="392" height="332" opacity="0"/><path class="s-ink" d="M600 360V700M1000 360V700" stroke-width="6"/><text class="d" x="420" y="610" font-size="140" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d" x="1200" y="610" font-size="140" text-anchor="middle" style="fill:var(--loss)">?</text><g id="vp"></g></g>
<rect id="dp" class="ink" x="236" y="364" width="360" height="0"/>
<rect id="df" class="ink" x="1004" y="364" width="360" height="0"/>
<g id="sail"><text class="d" x="120" y="800" font-size="52">Sail safely through <tspan style="fill:var(--gain)">today.</tspan></text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Today is enough.</text>
<text class="b" x="120" y="176" font-size="32">No one can carry yesterday and tomorrow on top of today.</text>
<g id="car"><g id="tilt"><g id="cp"></g><path class="s-ink" d="M380 646V718M420 646V718M356 596L336 482M444 596L464 482" stroke-width="8" stroke-linecap="round" fill="none"/><rect class="gain" x="320" y="410" width="160" height="70" rx="8"/><text class="m" x="400" y="452" font-size="20" text-anchor="middle" style="fill:var(--on-gain)">TODAY</text><g id="yb"><rect class="loss" x="320" y="330" width="160" height="70" rx="8"/><text class="m" x="400" y="372" font-size="20" text-anchor="middle" style="fill:var(--stage)">YESTERDAY</text></g><g id="tb"><rect class="loss" x="320" y="250" width="160" height="70" rx="8"/><text class="m" x="400" y="292" font-size="20" text-anchor="middle" style="fill:var(--stage)">TOMORROW</text></g></g></g>
<path class="s-line" d="M160 720H760" stroke-width="4"/>
<clipPath id="skyclip"><rect x="900" y="300" width="580" height="300"/></clipPath>
<g id="sky"><g clip-path="url(#skyclip)"><circle id="sun" class="gain" cx="1180" cy="450" r="70"/></g><path class="s-ink" d="M900 600H1460" stroke-width="5" stroke-linecap="round"/></g>
<g id="quote"><text class="d5" x="900" y="670" font-size="32">“Anyone can carry his burden,</text><text class="d5" x="900" y="714" font-size="32">however hard, until nightfall.”</text><text class="m" x="900" y="764" font-size="20">ROBERT LOUIS STEVENSON</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Planning is not worry.</text>
<text class="b" x="120" y="176" font-size="32">Think and plan for tomorrow. Just don’t brood over it.</text>
<g id="cal"><rect class="s-ink" x="120" y="230" width="560" height="330" rx="14" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="120" y="230" width="560" height="60" rx="14"/><g id="grid"></g><text class="m" x="120" y="610" font-size="22" style="fill:var(--gain)">CAREFUL PLANNING IS WISE</text></g>
<g id="brood"><path id="scrib" class="s-loss" fill="none" stroke-width="5" stroke-linejoin="round"/><text class="m" x="800" y="610" font-size="22" style="fill:var(--loss)">ANXIOUS BROODING HURTS</text></g>
<g id="prep0"><rect class="gain" x="120" y="670" width="600" height="100" rx="16"/><text class="d5" x="150" y="732" font-size="34" style="fill:var(--on-gain)">Today’s work, done superbly</text></g>
<g id="prep1"><path class="s-muted" d="M736 720h120m-22-22 22 22-22 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="s-gain" x="880" y="670" width="600" height="100" rx="16" fill="var(--stage)" stroke-width="5"/><text class="d5" x="910" y="732" font-size="34">Tomorrow, prepared</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Try it each morning.</text>
<text class="b" x="120" y="176" font-size="32">Each morning, write down what today actually asks of you.</text>
<g id="nb"><rect class="s-ink" x="120" y="230" width="500" height="540" rx="16" fill="var(--stage)" stroke-width="6"/><text class="d" x="190" y="330" font-size="48">Today</text></g>
<g id="wr0"><rect class="loss" x="1150" y="330" width="310" height="76" rx="38"/><text class="m" x="1305" y="377" font-size="24" text-anchor="middle" style="fill:var(--stage)">YESTERDAY?</text></g>
<g id="wr1"><rect class="loss" x="1150" y="470" width="310" height="76" rx="38"/><text class="m" x="1305" y="517" font-size="24" text-anchor="middle" style="fill:var(--stage)">NEXT MONTH?</text></g>
<g id="d7"></g>
<g id="ret"><text class="d" x="120" y="840" font-size="40">Shut the door. Return to the task in front of you.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">Which door will you close</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">today: yesterday or</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">tomorrow?</text></g>
<g id="qdoor"></g>
<g id="qm"><text class="m" x="143" y="700" font-size="26">FOR THE NEXT 24 HOURS, LIVE ONLY IN TODAY</text></g>
</g>