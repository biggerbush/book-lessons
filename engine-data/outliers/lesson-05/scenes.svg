<g id="s0">
<text class="m" x="120" y="150" font-size="28">OUTLIERS · LESSON 5</text>
<text class="d" x="116" y="400" font-size="84" letter-spacing="-2">Why genius</text>
<text class="d" x="116" y="496" font-size="84" letter-spacing="-2">is not enough.</text>
<text class="b" x="120" y="600" font-size="32">Why knowing how to ask beats raw brainpower</text>
<path class="s-ink" d="M1040 640H1480" stroke-width="6" stroke-linecap="round"/>
<g id="brain"><circle id="ring" class="s-gain" cx="1170" cy="350" r="80" fill="none" stroke-width="5"/><circle class="gain" cx="1170" cy="350" r="62"/><text class="d" x="1170" y="368" font-size="48" text-anchor="middle" style="fill:var(--on-gain)">IQ</text></g>
<g id="farmer"></g>
<g id="farm"><path class="s-ink" d="M1290 640V476L1370 404L1450 476V640Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><path class="s-ink" d="M1345 640V570h50v70M1345 570l50 70M1395 570l-50 70" fill="none" stroke-width="5" stroke-linejoin="round"/></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Smart enough is enough.</text>
<text class="b" x="120" y="176" font-size="32">IQ works a lot like height in basketball.</text>
<g id="court">
<path class="s-ink" d="M140 780H640" stroke-width="6" stroke-linecap="round"/>
<rect class="ink" x="590" y="320" width="14" height="460"/>
<path class="s-ink" d="M574 300V410" stroke-width="8" stroke-linecap="round"/>
<path class="s-gain" d="M500 370H572" stroke-width="7" stroke-linecap="round"/>
<path class="s-line" d="M506 372l10 40h44l10-40M526 372l4 40M548 372l-4 40" fill="none" stroke-width="3"/>
<g id="players"></g>
<text class="m" x="140" y="830" font-size="20">EXTRA INCHES MATTER LESS</text>
</g>
<g id="chart">
<path class="s-ink" d="M780 260V740H1440" fill="none" stroke-width="5" stroke-linejoin="round"/>
<text class="m" x="800" y="248" font-size="20">ADVANTAGE</text>
<text class="m" x="1440" y="790" font-size="20" text-anchor="end">IQ</text>
</g>
<g id="cut"><rect class="gain" x="1100" y="260" width="340" height="480" fill-opacity=".12"/><path class="s-gain" d="M1100 260V740" stroke-width="4" stroke-dasharray="10 10"/><text class="d" x="1100" y="790" font-size="34" text-anchor="middle" style="fill:var(--gain)">120</text><text class="m" x="1270" y="560" font-size="20" text-anchor="middle">OTHER THINGS</text><text class="m" x="1270" y="590" font-size="20" text-anchor="middle">MATTER MORE</text></g>
<path id="curve" class="s-gain" d="M790 730C900 520 1000 380 1100 362S1300 345 1430 342" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Chris Langan.</text>
<text class="b" x="120" y="176" font-size="32">IQ estimated near 195. Einstein’s: around 150.</text>
<text class="m" x="160" y="250" font-size="20">IQ, ESTIMATED</text>
<rect id="barE" class="ink" x="160" y="760" width="100" height="0"/>
<rect id="barL" class="gain" x="320" y="760" width="100" height="0"/>
<text id="vE" class="d" x="210" y="740" font-size="40" text-anchor="middle">0</text>
<text id="vL" class="d" x="370" y="740" font-size="40" text-anchor="middle" style="fill:var(--gain)">0</text>
<path class="s-ink" d="M140 760H440" stroke-width="5" stroke-linecap="round"/>
<text class="m" x="210" y="796" font-size="20" text-anchor="middle">EINSTEIN</text>
<text class="m" x="370" y="796" font-size="20" text-anchor="middle">LANGAN</text>
<g id="lc0"><rect class="s-line" x="520" y="260" width="310" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><g transform="translate(-25 0)"><rect class="s-ink" x="645" y="310" width="110" height="150" rx="6" fill="var(--stage)" stroke-width="5"/><path class="s-line" d="M665 350h70M665 385h70M665 420h40" stroke-width="6" stroke-linecap="round"/><text class="m" x="700" y="540" font-size="20" text-anchor="middle">REED COLLEGE</text><text class="m" x="700" y="570" font-size="20" text-anchor="middle">MOTHER MISSED A FORM</text></g></g>
<path id="lx" class="s-loss" d="M605 300l140 170M745 300l-140 170" stroke-width="10" stroke-linecap="round"/>
<g id="lc1"><rect class="s-line" x="845" y="260" width="310" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><g transform="translate(-10 0)"><path class="ink" d="M945 402l25-45h80l25 45z"/><rect class="ink" x="910" y="400" width="200" height="54" rx="14"/><circle class="s-ink" cx="960" cy="456" r="22" fill="var(--stage)" stroke-width="6"/><circle class="s-ink" cx="1060" cy="456" r="22" fill="var(--stage)" stroke-width="6"/><g id="smoke"><circle cx="1090" cy="370" r="12" fill="var(--muted)" fill-opacity=".5"/><circle cx="1108" cy="338" r="16" fill="var(--muted)" fill-opacity=".4"/><circle cx="1090" cy="300" r="20" fill="var(--muted)" fill-opacity=".3"/></g><text class="m" x="1010" y="540" font-size="20" text-anchor="middle">CAR BROKE DOWN</text><text class="m" x="1010" y="570" font-size="20" text-anchor="middle">NO MORNING CLASSES</text></g></g>
<g id="lc2"><rect class="s-line" x="1170" y="260" width="310" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><g transform="translate(5 0)"><rect class="s-ink" x="1265" y="300" width="110" height="180" fill="var(--stage)" stroke-width="6"/><circle class="ink" cx="1355" cy="420" r="7"/><text class="d" x="1320" y="388" font-size="50" text-anchor="middle" style="fill:var(--loss)">NO</text><text class="m" x="1320" y="540" font-size="20" text-anchor="middle">THE DEAN</text><text class="m" x="1320" y="570" font-size="20" text-anchor="middle">REFUSED</text></g></g>
<g id="drop"><text class="d" x="520" y="700" font-size="44">He accepted the no and dropped out.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Robert Oppenheimer.</text>
<text class="b" x="120" y="176" font-size="32">A Cambridge graduate student who could talk his way through.</text>
<g id="oppie"><g id="opp"></g><rect class="ink" x="205" y="300" width="70" height="50" rx="8"/><path class="s-ink" d="M180 350h120" stroke-width="8" stroke-linecap="round"/><text class="m" x="240" y="600" font-size="20" text-anchor="middle">OPPENHEIMER</text><text class="m" x="240" y="630" font-size="20" text-anchor="middle">CAMBRIDGE</text></g>
<g id="ar0"></g><g id="ar1"></g><g id="ar2"></g>
<g id="st0"><path class="loss" d="M605 320h30v50l35 80a12 12 0 0 1-11 16h-88a12 12 0 0 1-11-16l35-80z"/><path class="s-ink" d="M598 320h44" stroke-width="8" stroke-linecap="round"/><text class="m" x="620" y="560" font-size="20" text-anchor="middle">TRIED TO POISON</text><text class="m" x="620" y="588" font-size="20" text-anchor="middle">HIS TUTOR</text></g>
<g id="st1"><g transform="rotate(-8 960 420)"><rect class="s-gain" x="830" y="380" width="260" height="84" rx="12" fill="none" stroke-width="7"/><text class="d" x="960" y="436" font-size="36" text-anchor="middle" style="fill:var(--gain)">PROBATION</text></g><text class="m" x="960" y="560" font-size="20" text-anchor="middle">TALKED HIS WAY</text><text class="m" x="960" y="588" font-size="20" text-anchor="middle">INTO MERE PROBATION</text></g>
<g id="st2"><g id="gen"></g><text class="m" x="1300" y="560" font-size="20" text-anchor="middle">PERSUADED A GENERAL</text><text class="m" x="1300" y="588" font-size="20" text-anchor="middle" style="fill:var(--gain)">LED MANHATTAN PROJECT</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Practical intelligence.</text>
<text class="b" x="120" y="176" font-size="32">Knowing what to say, to whom, and when.</text>
<g id="heads"><circle class="s-ink" cx="330" cy="400" r="110" fill="var(--stage)" stroke-width="6"/><circle id="hd2" class="s-ink" cx="730" cy="400" r="110" fill="var(--stage)" stroke-width="6"/><text class="d" x="330" y="420" font-size="56" text-anchor="middle">IQ</text><text class="d" x="730" y="420" font-size="56" text-anchor="middle">IQ</text><text class="d" x="530" y="424" font-size="72" text-anchor="middle" style="fill:var(--muted)">=</text><text class="m" x="330" y="560" font-size="22" text-anchor="middle">LANGAN</text><text class="m" x="730" y="560" font-size="22" text-anchor="middle">OPPENHEIMER</text></g>
<path id="arT" class="s-gain" d="M860 470H950m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g id="tbox"><path class="s-ink" d="M1140 330V290H1280V330" fill="none" stroke-width="8" stroke-linejoin="round"/><rect class="s-ink" x="980" y="330" width="460" height="290" rx="16" fill="var(--stage)" stroke-width="7"/></g>
<g id="ch0"><rect class="gain" x="1010" y="360" width="400" height="64" rx="32"/><text class="d5" x="1210" y="403" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">What to say</text></g>
<g id="ch1"><rect class="gain" x="1010" y="446" width="400" height="64" rx="32"/><text class="d5" x="1210" y="489" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">To whom</text></g>
<g id="ch2"><rect class="gain" x="1010" y="532" width="400" height="64" rx="32"/><text class="d5" x="1210" y="575" font-size="30" text-anchor="middle" style="fill:var(--on-gain)">When</text></g>
<g id="home"><path class="gain" d="M140 810V770L180 730L220 770V810Z"/><text class="d" x="250" y="806" font-size="48">Learned mostly at home.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Two kinds of homes.</text>
<text class="b" x="120" y="176" font-size="32">Sociologist Annette Lareau studied families with young children.</text>
<g id="pw"><path id="roofW" class="s-ink" d="M120 330L440 230L760 330" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-line" x="120" y="330" width="640" height="370" fill="var(--stage)" stroke-width="4"/><text class="m" x="150" y="380" font-size="22">WEALTHIER FAMILIES</text></g>
<g id="pp"><path class="s-ink" d="M840 330L1160 230L1480 330" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect class="s-line" x="840" y="330" width="640" height="370" fill="var(--stage)" stroke-width="4"/><text class="m" x="870" y="380" font-size="22">POORER FAMILIES</text></g>
<g id="cal"></g>
<g id="famW"><rect class="s-gain" x="560" y="405" width="60" height="53" rx="10" fill="var(--stage)" stroke-width="4"/><text class="d" x="590" y="445" font-size="34" text-anchor="middle" style="fill:var(--gain)">?</text></g>
<g id="capW"><text class="d5" x="150" y="660" font-size="30">Taught to question and negotiate.</text></g>
<g id="famP"><circle id="ball" class="gain" cx="1020" cy="500" r="16"/></g>
<g id="capP"><text class="d5" x="870" y="660" font-size="30">Taught respect for authority.</text></g>
<g id="love"><path class="gain" d="M0 14C-20 0-20-14-8-16C-3-17 0-13 0-10C0-13 3-17 8-16C20-14 20 0 0 14Z" transform="translate(440 290) scale(1.6)"/><path class="gain" d="M0 14C-20 0-20-14-8-16C-3-17 0-13 0-10C0-13 3-17 8-16C20-14 20 0 0 14Z" transform="translate(1160 290) scale(1.6)"/><text class="d" x="120" y="790" font-size="40">Only one teaches kids they can speak up.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The doctor visit.</text>
<text class="b" x="120" y="176" font-size="32">On the way to a checkup, Alex, nine, prepares questions.</text>
<text class="m" x="160" y="260" font-size="22">IN THE CAR</text>
<text class="m" x="840" y="260" font-size="22">IN THE EXAM ROOM</text>
<path class="s-line" d="M140 690H680" stroke-width="5" stroke-dasharray="20 14"/>
<g id="carG"><g transform="translate(0 96)"><rect class="ink" x="160" y="450" width="500" height="90" rx="22"/><path class="s-ink" d="M240 452L300 370H520L580 452Z" fill="var(--stage)" stroke-width="7" stroke-linejoin="round"/><circle class="gain" cx="350" cy="420" r="22"/><circle class="ink" cx="470" cy="414" r="28"/><circle class="s-ink" cx="260" cy="545" r="34" fill="var(--stage)" stroke-width="8"/><circle class="s-ink" cx="560" cy="545" r="34" fill="var(--stage)" stroke-width="8"/></g></g>
<g id="note"><circle class="gain" cx="380" cy="470" r="6"/><circle class="gain" cx="408" cy="452" r="8"/><circle class="gain" cx="440" cy="438" r="10"/><rect class="s-ink" x="470" y="280" width="210" height="150" rx="10" fill="var(--stage)" stroke-width="5"/></g>
<g id="exam"><rect class="ink" x="880" y="552" width="200" height="20" rx="6"/><path class="s-ink" d="M900 572v40M1060 572v40" stroke-width="6" stroke-linecap="round"/><path class="ink" d="M1410 280h20v20h20v20h-20v20h-20v-20h-20v-20h20z"/></g>
<g id="asks"></g>
<g id="inst"><text class="d" x="120" y="830" font-size="48">Institutions should work for him.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">The Termites.</text>
<text class="b" x="120" y="176" font-size="32">Lewis Terman tracked hundreds of gifted children for decades.</text>
<g id="dots"></g>
<g id="labT"><text class="m" x="160" y="370" font-size="22" style="fill:var(--gain)">MOST SUCCESSFUL</text></g>
<g id="labB"><text class="m" x="1454" y="370" font-size="22" text-anchor="end">LEAST SUCCESSFUL</text></g>
<g id="iqr"><rect class="ink" x="160" y="440" width="400" height="36" rx="8"/><rect class="ink" x="1040" y="440" width="400" height="36" rx="8"/><text class="m" x="800" y="466" font-size="22" text-anchor="middle">SIMILAR IQ</text></g>
<g id="homes"><path class="gain" d="M240 740V620L360 540L480 620V740Z"/><path class="loss" d="M1190 740V690L1240 650L1290 690V740Z"/><text class="m" x="800" y="680" font-size="22" text-anchor="middle">VERY DIFFERENT HOMES</text></g>
<g id="msg"><text class="d" x="120" y="830" font-size="44">Same brains. Different homes.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">This week, ask for</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">one thing you’ve</text></g>
<g id="qc"><text class="d" x="136" y="560" font-size="88" letter-spacing="-2" style="fill:var(--gain)">quietly gone without.</text></g>
<g id="hander"><g id="arm"><path class="s-gain" d="M1405 500L1425 330" stroke-width="16" stroke-linecap="round"/><circle class="gain" cx="1427" cy="312" r="18"/></g></g>
<g id="coach"><text class="m" x="143" y="700" font-size="26">AND COACH YOUR KIDS TO ASK QUESTIONS TOO</text></g>
</g>