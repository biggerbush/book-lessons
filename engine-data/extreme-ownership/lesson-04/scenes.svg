<circle class="ink" cx="1140" cy="420" r="14"/><circle class="gain" cx="1440" cy="420" r="14"/>
<g id="noise"><text class="m" x="1290" y="595" font-size="22" text-anchor="middle" style="fill:var(--loss)">JUST NOISE</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">Why simple wins.</text>
<text class="b" x="120" y="176" font-size="32">Learned in combat, where plans meet chaos fast.</text>
<g id="bursts"></g>
<g id="radio"><text class="m" x="120" y="252" font-size="20" style="fill:var(--loss)">GUNFIRE · NOISE · FEAR</text><path id="stat" class="s-loss" fill="none" stroke-width="3" stroke-linejoin="round"/></g>
<g id="pc"><rect class="s-line" x="120" y="300" width="640" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="150" y="345" font-size="20">COMPLEX PLAN</text><g id="gears"></g></g>
<g id="ps"><rect class="s-line" x="840" y="300" width="640" height="340" rx="18" fill="var(--stage)" stroke-width="3"/><text class="m" x="870" y="345" font-size="20">SIMPLE PLAN</text>
<path id="sarr" class="s-gain" d="M900 480H1385" stroke-width="14" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1"/>
<g id="ahd"><path class="s-gain" d="M1350 446l40 34-40 34" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle class="ink" cx="900" cy="480" r="18"/>
<text class="m" x="900" y="550" font-size="20" text-anchor="middle">START</text><text class="m" x="1380" y="550" font-size="20" text-anchor="middle">GOAL</text></g>
<g id="crew"></g>
<g id="ev"><text class="d" x="860" y="760" font-size="40">Everyone understands it.</text></g>
<g id="still"><text class="m" x="860" y="820" font-size="22" style="fill:var(--gain)">STILL WORKS WHEN THINGS FALL APART</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">Something always goes wrong.</text>
<text class="b" x="120" y="176" font-size="32">Complexity makes every surprise bigger.</text>
<text class="m" x="120" y="280" font-size="20">COMPLEX PLAN</text>
<g id="zig"></g>
<path class="s-ink" d="M1400 440V330" stroke-width="6"/><path class="gain" d="M1400 330l60 22-60 22z"/>
<polygon id="ob0" class="loss"/>
<circle id="dt0" class="ink" r="18"/>
<g id="qm"><text class="d" x="640" y="330" font-size="56" text-anchor="middle" style="fill:var(--loss)">?</text><text class="d" x="960" y="330" font-size="56" text-anchor="middle" style="fill:var(--loss)">?</text></g>
<text class="m" x="120" y="560" font-size="20">SIMPLE PLAN</text>
<path class="s-line" d="M200 680H1380" stroke-width="4"/>
<g id="route"></g>
<path class="s-ink" d="M1400 700V590" stroke-width="6"/><path class="gain" d="M1400 590l60 22-60 22z"/>
<polygon id="ob1" class="loss"/>
<circle id="dt1" class="gain" r="18"/>
<g id="t2"><text class="d" x="120" y="830" font-size="40">Everyone knows the goal and their role.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">The bonus nobody got.</text>
<text class="b" x="120" y="176" font-size="32">Leif worked with a manufacturer that had a performance problem.</text>
<g id="fac"><g id="smoke"></g>
<rect class="s-ink" x="420" y="330" width="40" height="120" fill="var(--stage)" stroke-width="5"/>
<path class="s-ink" d="M140 640V440l85-70v70l85-70v70l85-70v70l85-70V640z" fill="var(--stage)" stroke-width="6" stroke-linejoin="round"/>
<path class="s-line" d="M180 520h50M280 520h50M380 520h50" stroke-width="22"/>
<rect class="ink" x="280" y="570" width="60" height="70"/>
<text class="m" x="310" y="690" font-size="20" text-anchor="middle">MANUFACTURING</text></g>
<g id="sheet"><rect class="s-ink" x="600" y="240" width="360" height="510" rx="12" fill="var(--stage)" stroke-width="5"/><text class="m" x="630" y="284" font-size="20">BONUS PLAN</text><g id="rows"></g></g>
<g id="ticks"></g>
<g id="thor"><text class="m" x="780" y="728" font-size="20" text-anchor="middle" style="fill:var(--gain)">LOOKS THOROUGH</text></g>
<g id="ch3"><path class="s-ink" d="M1080 300V620H1460" fill="none" stroke-width="5" stroke-linecap="round"/>
<path class="s-gain" d="M1100 580L1440 340" fill="none" stroke-width="5" stroke-dasharray="12 10"/>
<text class="m" x="1440" y="320" font-size="20" text-anchor="end" style="fill:var(--gain)">HOPED</text>
<text class="m" x="1440" y="540" font-size="20" text-anchor="end">ACTUAL</text>
<text class="m" x="1080" y="670" font-size="20">RESULTS</text></g>
<path id="act" class="s-ink" d="M1100 580C1200 575 1300 570 1440 565" fill="none" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="t3"><text class="d" x="120" y="820" font-size="44">Thorough on paper. Little change in practice.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Ask the front line.</text>
<text class="b" x="120" y="176" font-size="32">Leif asked the supervisors one simple question.</text>
<g id="leif"><text class="m" x="260" y="730" font-size="20" text-anchor="middle">LEIF</text></g>
<g id="ask"><rect class="s-ink" x="140" y="240" width="540" height="160" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M280 400l10 50 40-50" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="170" y="310" font-size="44">How do you earn</text><text class="d5" x="170" y="370" font-size="44">your bonus?</text></g>
<g id="sups"><text class="m" x="1120" y="710" font-size="20" text-anchor="middle">FRONTLINE SUPERVISORS</text></g>
<g id="arms"></g>
<g id="qs"></g>
<g id="t4"><text class="d" x="120" y="810" font-size="44">If they can't explain it, it can't guide them.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Cut it down.</text>
<text class="b" x="120" y="176" font-size="32">Strip the plan to just a few clear measures.</text>
<g id="cut"></g>
<g id="cutl"><path class="s-loss" d="M120 317H560" stroke-width="3" stroke-dasharray="8 8"/></g>
<g id="sci"><circle class="s-ink" cx="-30" cy="-12" r="10" fill="var(--stage)" stroke-width="5"/><circle class="s-ink" cx="-30" cy="12" r="10" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M-22-8L22 8M-22 8L22-8" stroke-width="5" stroke-linecap="round"/></g>
<g id="tgs"></g>
<g id="t5a"><text class="d" x="120" y="760" font-size="48">Not less ambition. Less confusion.</text></g>
<g id="t5b"><text class="m" x="120" y="830" font-size="22" style="fill:var(--gain)">CLARITY DRIVES BEHAVIOR</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">The leader owns the message.</text>
<text class="b" x="120" y="176" font-size="32">Responsibility sits with the leader, not the listener.</text>
<g id="ldr"></g>
<g id="lb"><rect class="s-ink" x="140" y="240" width="480" height="160" rx="24" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M290 400l10 30 30-30" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><path class="s-ink" d="M180 290h380M180 322h320M180 354h240" stroke-width="14" stroke-linecap="round"/></g>
<g id="resp"><text class="m" x="260" y="720" font-size="20" text-anchor="middle" style="fill:var(--gain)">RESPONSIBLE</text><rect class="gain" x="180" y="734" width="160" height="10"/></g>
<g id="team"><text class="m" x="1140" y="710" font-size="20" text-anchor="middle">THE TEAM</text></g>
<g id="sq"></g>
<g id="cf"><text class="m" x="880" y="770" font-size="20" style="fill:var(--loss)">CONFUSED TEAM? THE MESSAGE WASN'T CLEAR</text></g>
<g id="arm"><path class="s-ink" d="M1100 635l20-60v-50" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink" cx="1120" cy="518" r="11"/></g>
<g id="hb"><rect class="s-ink" x="1000" y="300" width="380" height="100" rx="20" fill="var(--stage)" stroke-width="5"/><path class="s-ink" d="M1140 400l-8 32 34-32" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/><text class="d5" x="1030" y="365" font-size="40">I don't get it.</text></g>
<g id="t6"><text class="d" x="120" y="830" font-size="46">Asking for clarity is a strength.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Test your message.</text>
<text class="b" x="120" y="176" font-size="32">Ask someone to explain it back in their own words.</text>
<g id="ppl7"><text class="m" x="240" y="650" font-size="20" text-anchor="middle">YOU</text><text class="m" x="1360" y="650" font-size="20" text-anchor="middle">TEAMMATE</text></g>
<g id="lanes"><path class="s-muted" d="M360 335H1240" stroke-width="4" stroke-dasharray="8 10"/><path class="s-muted" d="M360 555H1240" stroke-width="4" stroke-dasharray="8 10"/>
<text class="m" x="800" y="280" font-size="20" text-anchor="middle">YOUR PLAN</text><text class="m" x="800" y="635" font-size="20" text-anchor="middle">IN THEIR OWN WORDS</text></g>
<g id="cd1"></g><g id="cd2"></g>
<g id="ck"><circle class="gain" cx="800" cy="445" r="52"/><path d="M774 446l18 18 34-36" fill="none" stroke="var(--on-gain)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="t7a"><text class="d" x="120" y="760" font-size="40">They can explain it? <tspan style="fill:var(--gain)">You're ready.</tspan></text></g>
<g id="t7b"><text class="d" x="120" y="830" font-size="40">They stumble? <tspan style="fill:var(--loss)">Simplify and try again.</tspan></text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="360" font-size="88" letter-spacing="-2">Take one plan.</text></g>
<g id="qb"><text class="d" x="136" y="470" font-size="88" letter-spacing="-2">Shrink it to a few</text></g>
<g id="qc"><text class="d" x="136" y="580" font-size="88" letter-spacing="-2"><tspan style="fill:var(--gain)">plain</tspan> sentences.</text></g>
<g id="note"><g transform="translate(1290 420) rotate(4)"><rect class="gain" x="-130" y="-130" width="260" height="260" rx="6"/><g id="nl"></g></g></g>
<g id="rep"><text class="m" x="143" y="720" font-size="26">THEN ASK YOUR TEAM TO REPEAT IT BACK</text></g>
</g>