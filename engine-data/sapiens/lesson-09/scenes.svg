<g id="s0">
<text class="m" x="120" y="150" font-size="28">SAPIENS · LESSON 9</text>
<text class="d" x="116" y="320" font-size="84" letter-spacing="-2">Credit, capitalism</text>
<text class="d" x="116" y="416" font-size="84" letter-spacing="-2">and faith in</text>
<text class="d" x="116" y="512" font-size="84" letter-spacing="-2">tomorrow.</text>
<text class="b" x="120" y="620" font-size="32">Why believing in a richer future makes the economy grow.</text>
<g id="vault"><rect class="s-ink" x="1140" y="230" width="320" height="320" rx="18" fill="var(--stage)" stroke-width="7"/><circle class="s-ink" cx="1300" cy="390" r="110" fill="none" stroke-width="6"/><text class="d" x="1300" y="408" font-size="52" text-anchor="middle">$1M</text><text class="m" x="1300" y="592" font-size="22" text-anchor="middle">IN THE VAULT</text></g>
<g id="notes"></g>
<g id="lent"><text class="m" x="1300" y="730" font-size="22" text-anchor="middle">LENT OUT: $3M</text></g>
<g id="faith"><text class="m" x="1300" y="790" font-size="24" text-anchor="middle" style="fill:var(--gain)">FAITH IN TOMORROW</text></g>
</g>

<g id="s1" opacity="0">
<text class="d" x="120" y="124" font-size="68">The world’s wealth: a fixed pie.</text>
<text class="b" x="120" y="176" font-size="32">For most of history, people assumed it could never grow.</text>
<g id="pieA"><g id="pie1" transform="translate(420 500)"></g><circle class="s-muted" cx="420" cy="500" r="222" fill="none" stroke-width="3" stroke-dasharray="6 8"/><text class="m" x="420" y="770" font-size="22" text-anchor="middle">THE TOTAL NEVER CHANGES</text></g>
<g id="pl"><text class="m" x="640" y="320" font-size="22" style="fill:var(--gain)">+ YOURS</text><text class="m" x="636" y="590" font-size="22" style="fill:var(--loss)">− THEIRS</text></g>
<g id="lend"><rect class="s-line" x="760" y="240" width="720" height="520" rx="18" fill="var(--stage)" stroke-width="3"/><g id="lender"></g><circle class="gain" cx="968" cy="530" r="18"/><text class="m" x="880" y="620" font-size="20" text-anchor="middle">MONEY LENDER</text><text class="m" x="1020" y="330" font-size="22">LOANS WERE</text></g>
<g id="lr0"><text class="d" x="1020" y="420" font-size="60">Small.</text></g>
<g id="lr1"><text class="d" x="1020" y="510" font-size="60">Short.</text></g>
<g id="lr2"><text class="d" x="1020" y="600" font-size="60" style="fill:var(--loss)">Expensive.</text></g>
<g id="lr3"><text class="m" x="1020" y="690" font-size="22" style="fill:var(--loss)">LENDING FELT RISKY</text></g>
</g>

<g id="s2" opacity="0">
<text class="d" x="120" y="124" font-size="68">The trap.</text>
<text class="b" x="120" y="176" font-size="32">No credit, no ventures, no growth.</text>
<g id="field"><path class="s-ink" d="M140 680H640" stroke-width="6" stroke-linecap="round"/><path class="s-muted" d="M220 680V480h120v-60h60v60h120v200" fill="none" stroke-width="5" stroke-dasharray="12 10" stroke-linejoin="round"/><text class="m" x="140" y="730" font-size="22">NOTHING NEW GETS BUILT</text></g>
<g id="cyc2"></g>
<g id="dist"><text class="d" x="120" y="830" font-size="46">Distrust of the future kept the future poor.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Mister Greedy’s bank.</text>
<text class="b" x="120" y="176" font-size="32">Harari’s story, set in El Dorado, California.</text>
<g id="bank3"><path class="ink" d="M610 390L800 290L990 390Z"/><rect class="ink" x="640" y="405" width="36" height="190"/><rect class="ink" x="735" y="405" width="36" height="190"/><rect class="ink" x="830" y="405" width="36" height="190"/><rect class="ink" x="925" y="405" width="36" height="190"/><rect class="ink" x="600" y="600" width="400" height="24" rx="4"/><text class="m" x="800" y="670" font-size="20" text-anchor="middle">GREEDY’S BANK</text></g>
<g id="con3"><g id="cf"></g><path class="gain" d="M222 438a38 38 0 0 1 76 0z"/><rect class="gain" x="214" y="432" width="92" height="10" rx="4"/><text class="m" x="260" y="630" font-size="20" text-anchor="middle">CONTRACTOR</text></g>
<g id="jane3"><g id="jf"></g><ellipse class="ink" cx="1440" cy="560" rx="30" ry="16"/><path d="M1426 554l6 10M1440 552l6 10" stroke="var(--stage)" stroke-width="3" stroke-linecap="round"/><text class="m" x="1340" y="630" font-size="20" text-anchor="middle">JANE MCDOUGHNUT</text></g>
<g id="dep3"><path class="s-ink" d="M380 710H680M664 696l16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="530" y="760" font-size="22" text-anchor="middle">DEPOSITS $1M</text></g>
<g id="bor3"><path class="s-gain" d="M920 710H1220M1204 696l16 14-16 14" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1070" y="760" font-size="22" text-anchor="middle" style="fill:var(--gain)">BORROWS $1M</text></g>
<g id="bag3"><path class="gain" d="M-14 -40l14-14 14 14z"/><circle class="gain" r="42"/><text class="d5" y="9" font-size="26" text-anchor="middle" style="fill:var(--on-gain)">$1M</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">One million, counted three times.</text>
<text class="b" x="120" y="176" font-size="32">Lend, build, deposit. Then lend again.</text>
<g id="loop4"></g>
<g id="bricks"></g>
<circle id="coin4" class="gain" r="18" stroke="var(--stage)" stroke-width="4"/>
<path class="s-ink" d="M880 760H1480" stroke-width="5" stroke-linecap="round"/>
<g id="books"></g>
<text class="m" x="1030" y="800" font-size="20" text-anchor="middle">ON THE BOOKS</text>
<text class="m" x="1350" y="800" font-size="20" text-anchor="middle">IN THE VAULT</text>
<g id="bkv"><text id="bk4" class="d" x="1030" y="316" font-size="56" text-anchor="middle">$3M</text></g>
<g id="vault4"><rect class="ink" x="1240" y="624" width="220" height="132" rx="8"/><text class="d5" x="1350" y="702" font-size="34" text-anchor="middle" style="fill:var(--stage)">$1M</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Not a scam. A bet on tomorrow.</text>
<text class="b" x="120" y="176" font-size="32">It works because everyone trusts the bakery will succeed.</text>
<g id="bakery"><rect class="s-ink" x="180" y="420" width="380" height="280" fill="var(--stage)" stroke-width="6"/><g id="awn"></g><text class="d" x="370" y="350" font-size="40" text-anchor="middle">BAKERY</text><rect class="ink" x="230" y="540" width="90" height="160"/><rect class="gain" x="218" y="556" width="114" height="42" rx="6"/><text class="m" x="275" y="585" font-size="22" text-anchor="middle" style="fill:var(--on-gain)">OPEN</text><rect class="s-ink" x="370" y="490" width="150" height="110" fill="none" stroke-width="5"/><path class="s-ink" d="M445 490v110M370 545h150" stroke-width="4"/></g>
<g id="repay"><path class="s-gain" d="M182 754l14 14 28-32" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="240" y="768" font-size="22" style="fill:var(--gain)">WILL REPAY ITS DEBT</text></g>
<g id="pies"><g id="pt" transform="translate(820 520) scale(1.1)"></g><path class="s-muted" d="M950 510h60m-18-18 18 18-18 18" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g id="pm"></g><text class="m" x="820" y="750" font-size="22" text-anchor="middle">TODAY</text><text class="m" x="1240" y="750" font-size="22" text-anchor="middle" style="fill:var(--gain)">TOMORROW</text></g>
<g id="slices"><text class="d" x="120" y="840" font-size="42">When the pie grows, everyone’s slice can grow too.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Plough the profit back in.</text>
<text class="b" x="120" y="176" font-size="32">Adam Smith’s twist: reinvest profits in production.</text>
<g id="smith"><circle cx="202" cy="392" r="16" fill="var(--muted)"/><circle cx="278" cy="392" r="16" fill="var(--muted)"/><circle cx="204" cy="420" r="14" fill="var(--muted)"/><circle cx="276" cy="420" r="14" fill="var(--muted)"/><g id="sf"></g><path d="M226 508l14 20 14-20z" fill="var(--stage)"/><text class="m" x="240" y="600" font-size="20" text-anchor="middle">ADAM SMITH</text></g>
<g id="profit"><rect class="gain" x="440" y="520" width="120" height="22" rx="11" stroke="var(--stage)" stroke-width="3"/><rect class="gain" x="440" y="494" width="120" height="22" rx="11" stroke="var(--stage)" stroke-width="3"/><rect class="gain" x="440" y="468" width="120" height="22" rx="11" stroke="var(--stage)" stroke-width="3"/><text class="m" x="500" y="580" font-size="20" text-anchor="middle">PROFIT</text></g>
<g id="plough"><path class="s-gain" d="M570 450Q700 300 860 400" fill="none" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><path class="s-gain" d="M-16-12L2 0-16 12" transform="translate(860 400) rotate(32)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="700" y="316" font-size="20" text-anchor="middle" style="fill:var(--gain)">BACK INTO PRODUCTION</text></g>
<g id="more6"><text class="m" x="900" y="352" font-size="22">MORE OVENS · WORKERS · BREAD</text></g>
<g id="ovens"></g><g id="workers"></g><g id="loaves"></g>
<g id="heart6"><text class="d" x="120" y="820" font-size="46">That idea became the heart of capitalism.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Trust pays for discovery.</text>
<text class="b" x="120" y="176" font-size="32">Exploration, science and new businesses, funded by credit.</text>
<g id="ic0"><path class="ink" d="M140 330h150l-28 36h-94z"/><path class="s-ink" d="M215 330V250" stroke-width="6" stroke-linecap="round"/><path class="gain" d="M222 258l50 60h-50z"/><text class="m" x="320" y="324" font-size="22">EXPLORATION</text></g>
<g id="ic1"><path class="s-ink" d="M195 430v40l-45 70h130l-45-70v-40z" fill="none" stroke-width="6" stroke-linejoin="round"/><path class="gain" d="M163 520h104l13 20h-130z"/><text class="m" x="320" y="500" font-size="22">SCIENCE</text></g>
<g id="ic2"><rect class="s-ink" x="150" y="620" width="130" height="80" fill="var(--stage)" stroke-width="6"/><rect class="gain" x="140" y="600" width="150" height="24" rx="4"/><rect class="ink" x="200" y="650" width="30" height="50"/><text class="m" x="320" y="670" font-size="22">NEW BUSINESS</text></g>
<g id="cyc7"></g>
<path id="crack" class="s-loss" d="M1070 345l-50 70 55 45-60 70 45 55-40 65" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g id="coll"><text class="d" x="120" y="830" font-size="46">When trust collapses, so does credit.</text></g>
</g>

<g id="s8" opacity="0">
<g id="qa"><text class="d" x="136" y="340" font-size="88" letter-spacing="-2">What are you willing</text></g>
<g id="qb"><text class="d" x="136" y="450" font-size="88" letter-spacing="-2">to believe <tspan style="fill:var(--gain)">in?</tspan></text></g>
<g id="prompt"><text class="m" x="143" y="580" font-size="26">ONE INVESTMENT TODAY THAT BETS ON A RICHER TOMORROW</text></g>
