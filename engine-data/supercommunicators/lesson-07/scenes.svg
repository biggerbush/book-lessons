</g>
<g id="ky"><circle class="s-gain" r="22" fill="none" stroke-width="8"/><path class="s-gain" d="M22 0h62M60 0v18M76 0v18" stroke-width="8" stroke-linecap="round"/></g>
<g id="nk"><text class="d" x="120" y="760" font-size="46">Not pressure. Close attention to what they need.</text></g>
</g>

<g id="s3" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step one: notice.</text>
<text class="b" x="120" y="176" font-size="32">What kind of conversation is happening?</text>
<g id="rad">
<circle class="s-line" cx="360" cy="500" r="60" fill="none" stroke-width="4"/>
<circle class="s-line" cx="360" cy="500" r="120" fill="none" stroke-width="4"/>
<circle class="s-line" cx="360" cy="500" r="180" fill="none" stroke-width="4"/>
<line id="swp" class="s-gain" x1="360" y1="500" x2="540" y2="500" stroke-width="6" stroke-linecap="round"/>
<circle class="ink" cx="360" cy="500" r="12"/>
<text class="m" x="360" y="730" font-size="22" text-anchor="middle">WHAT KIND?</text>
</g>
<g id="bub"></g>
<g id="pz"><text class="d" x="120" y="800" font-size="46">Pause, and ask yourself before you respond.</text></g>
</g>

<g id="s4" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step two: share goals.</text>
<text class="b" x="120" y="176" font-size="32">Say what you want, and ask what they want.</text>
<g id="gp"></g>
<g id="ctg"></g>
<g id="gar"></g>
<g id="tg0"></g>
<g id="tg1"></g>
<g id="sh"><text class="m" x="800" y="586" font-size="22" text-anchor="middle" style="fill:var(--gain)">SHARED GOAL</text></g>
<g id="wt"><text class="d" x="120" y="800" font-size="50">Stop guessing. Start working together.</text></g>
</g>

<g id="s5" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step three: feelings.</text>
<text class="b" x="120" y="176" font-size="32">Ask about theirs, and share your own.</text>
<g id="fp"></g>
<path id="bh" class="s-ink" d="M0 120C-150 20-160-90-75-110C-35-120-8-92 0-70C8-92 35-120 75-110C160-90 150 20 0 120Z" fill="var(--gain)" stroke-width="5" stroke-linejoin="round"/>
<g id="qb5">
<rect class="s-gain" x="120" y="240" width="620" height="100" rx="20" fill="var(--stage)" stroke-width="5"/>
<path class="s-gain" d="M230 338l20 46l20-46" fill="var(--stage)" stroke-width="5" stroke-linejoin="round"/>
<text class="d5" x="150" y="302" font-size="34">“How did that feel for you?”</text>
</g>
<circle id="fd" class="gain" r="12"/>
<g id="sf"><text class="d" x="120" y="800" font-size="44">Honesty in return makes it safer to go deeper.</text></g>
</g>

<g id="s6" opacity="0">
<text class="d" x="120" y="124" font-size="68">Step four: identity.</text>
<text class="b" x="120" y="176" font-size="32">Everyone carries many identities.</text>
<g id="ip"></g>
<g id="wl"></g>
<g id="bdg"></g>
<path id="brd" class="s-gain" d="M220 660Q800 560 1380 660" fill="none" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
<g id="hm"><text class="d" x="120" y="800" font-size="44">Shared identities make hard messages easier to hear.</text></g>
</g>

<g id="s7" opacity="0">
<text class="d" x="120" y="124" font-size="68">Four dials, not four steps.</text>
<text class="b" x="120" y="176" font-size="32">They don’t have to happen in order.</text>
<g id="dls"></g>
<g id="blb">
<g id="rays"></g>
